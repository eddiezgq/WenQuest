<title>问渠缝纫机厂白板图</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=ZCOOL+KuaiLe&display=swap">
<style>
/* 布局：一块白板占满屏，左上角是路径（厂区 › 车间 › 工位），右侧抽屉放工艺文件；手机上抽屉从下面拉起 */
:root{
  --paper:#fbfaf6; --dot:#dcd8cc; --ink:#1d2733; --ink2:#5a6573; --line:#c9c4b6;
  --blue:#1c64c8; --red:#d0362e; --green:#23885a; --orange:#d97a12; --violet:#7a4cc2;
  --note:#fff3a8; --note-ink:#3b3410; --panel:#ffffff; --hl:#fff1b8; --chip:#eef1f5;
  --face-top:#ffffff; --face-l:#e9eef5; --face-r:#d7dfea; --roof:#f3f5f8;
  --hand:"Kalam","ZCOOL KuaiLe","Kaiti SC","STKaiti","KaiTi",cursive;
  --text:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1e2327; --dot:#343b42; --ink:#ecebe4; --ink2:#a8b0b8; --line:#47505a;
  --blue:#6aa8ff; --red:#ff7a6e; --green:#5fd39a; --orange:#ffb35c; --violet:#c09bff;
  --note:#4a4421; --note-ink:#fff4c2; --panel:#252b30; --hl:#4a4124; --chip:#323a42;
  --face-top:#2c343b; --face-l:#262d33; --face-r:#20262b; --roof:#2a3137; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1e2327; --dot:#343b42; --ink:#ecebe4; --ink2:#a8b0b8; --line:#47505a;
  --blue:#6aa8ff; --red:#ff7a6e; --green:#5fd39a; --orange:#ffb35c; --violet:#c09bff;
  --note:#4a4421; --note-ink:#fff4c2; --panel:#252b30; --hl:#4a4124; --chip:#323a42;
  --face-top:#2c343b; --face-l:#262d33; --face-r:#20262b; --roof:#2a3137; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--text);overflow:hidden}
.app{position:relative;height:100%;display:flex;flex-direction:column}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px 6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:3}
.brand{font-family:var(--hand);font-size:22px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.brand small{font-family:var(--text);font-size:12px;font-weight:400;color:var(--ink2);margin-left:6px}
nav.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:14px}
nav.crumb button{font:inherit;color:var(--blue);background:none;border:0;padding:2px 4px;cursor:pointer;border-radius:4px}
nav.crumb button[aria-current]{color:var(--ink);font-weight:600;cursor:default}
nav.crumb span{color:var(--ink2)}
.tools{margin-left:auto;display:flex;gap:6px}
.tools button,.zbtn{font:600 15px var(--text);width:32px;height:32px;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);
  border-radius:8px 10px 7px 9px;cursor:pointer}
.main{position:relative;flex:1;display:flex;min-height:0}
.boardwrap{position:relative;flex:1;min-width:0;
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.2px);background-size:22px 22px}
svg.board{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg.board.dragging{cursor:grabbing}
svg text{font-family:var(--hand);fill:var(--ink)}
svg.board path,svg.board line,svg.board polyline,svg.board circle{vector-effect:non-scaling-stroke}
.hit{fill:transparent;cursor:pointer}
.hit:hover,.hit.sel{fill:var(--hl);fill-opacity:.55}
.hint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:12px;font:13px var(--text);color:var(--ink2);pointer-events:none}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1.5px solid var(--ink);border-radius:8px;padding:6px 9px;font-size:13px;
  max-width:260px;box-shadow:2px 3px 0 var(--line);z-index:4}
.tip b{display:block;font-weight:600}
/* 工序流列表（车间里） */
aside.flow{width:300px;flex:none;border-left:1.5px dashed var(--line);overflow:auto;padding:12px 14px 24px;background:var(--paper)}
aside.flow h2{font-family:var(--hand);font-size:19px;margin:4px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{font:13px var(--text);border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
ol.steps li{display:grid;grid-template-columns:28px 1fr;gap:6px;padding:5px 4px;border-radius:6px}
ol.steps li.away{opacity:.6}
ol.steps .n{font:700 14px var(--hand);width:24px;height:24px;border:1.5px solid currentColor;border-radius:50%;display:grid;place-items:center}
ol.steps .t{font-size:13.5px;line-height:1.35}
ol.steps .t small{color:var(--ink2);display:block;font-size:12px}
.ulinks{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.ulinks button{font:12px var(--mono);border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:5px;padding:1px 6px;cursor:pointer}
.ulinks button:hover{border-color:var(--ink)}
.flow .group{margin-top:14px}
.flow .group h3{font:600 13px var(--text);color:var(--ink2);margin:0 0 4px}
/* 抽屉：工艺文件 */
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);border-left:2px solid var(--ink);
  box-shadow:-6px 0 0 var(--line);display:flex;flex-direction:column;z-index:5;transform:translateX(105%);transition:transform .22s ease}
.drawer.open{transform:none}
@media (prefers-reduced-motion: reduce){.drawer{transition:none}}
.dhead{padding:12px 16px 8px;border-bottom:1.5px dashed var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.dhead h2{margin:0;font:700 20px var(--hand)}
.dhead .sub{grid-column:1/-1;font-size:13px;color:var(--ink2)}
.dhead .x{font:20px var(--text);width:34px;height:34px;border:1.5px solid var(--ink);border-radius:9px;background:var(--panel);color:var(--ink);cursor:pointer}
.jobs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tabs{display:flex;gap:0;padding:0 16px;border-bottom:1.5px solid var(--ink)}
.tabs button{font:600 14.5px var(--text);padding:9px 14px 7px;border:1.5px solid transparent;border-bottom:0;background:none;color:var(--ink2);
  cursor:pointer;border-radius:8px 8px 0 0;margin-bottom:-1.5px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink);background:var(--panel)}
.dbody{flex:1;overflow:auto;padding:14px 16px 28px;font-size:14px;line-height:1.55}
.card{border:1.5px solid var(--ink);border-radius:4px}
.card .ct{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:8px 12px;border-bottom:1.5px solid var(--ink);background:var(--chip)}
.card .ct b{font-size:15.5px;letter-spacing:2px}
.card .ct span{font:12px var(--mono);color:var(--ink2)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));border-bottom:1px solid var(--line)}
.kv div{padding:6px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.kv dt{font-size:11.5px;color:var(--ink2);letter-spacing:.5px}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.sec{padding:10px 12px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h4{margin:0 0 6px;font-size:13px;color:var(--ink2);letter-spacing:1px}
.sec p{margin:0 0 6px}
.sec ul{margin:0;padding-left:18px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
th{background:var(--chip);font-weight:600;white-space:nowrap}
tr.cur td{background:var(--hl);font-weight:600}
tr.go{cursor:pointer}
tr.go:hover td{background:var(--chip)}
td.num{text-align:right;white-space:nowrap}
.star{color:var(--red);font-weight:700}
.dl{display:grid;grid-template-columns:7.5em 1fr;gap:0}
.dl dt{padding:7px 10px 7px 12px;color:var(--ink2);font-size:13px;border-bottom:1px solid var(--line);background:var(--chip)}
.dl dd{margin:0;padding:7px 12px;border-bottom:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.src{font-size:12px;color:var(--ink2);margin-top:10px}
.note{background:var(--note);color:var(--note-ink);border-radius:2px;padding:8px 11px;font-size:13px;box-shadow:2px 3px 0 var(--line);margin:10px 0}
.empty{color:var(--ink2);font-size:13px}
.legend{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
@media (max-width:820px){
  .main{flex-direction:column}
  aside.flow{width:auto;max-height:38%;border-left:0;border-top:1.5px dashed var(--line)}
  .drawer{top:auto;height:88%;width:100%;border-left:0;border-top:2px solid var(--ink);box-shadow:0 -6px 0 var(--line);transform:translateY(105%)}
  .drawer.open{transform:none}
  .brand small{display:none}
}
</style>

<div class="app">
  <header class="top">
    <div class="brand" id="brand">问渠缝纫机厂<small>白板图 · 示例工厂</small></div>

    </section>
  </div>
</div>

  if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, vx: vb.x, vy: vb.y };
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; drag = { pinch: Math.hypot(a[0] - b[0], a[1] - b[1]), w: vb.w, h: vb.h, vx: vb.x, vy: vb.y, cx: (a[0] + b[0]) / 2, cy: (a[1] + b[1]) / 2 }; }
});
svg.addEventListener('pointermove', (e) => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  const r = svg.getBoundingClientRect();
  if (drag && drag.pinch && ptrs.size === 2) {
    const [a, b] = [...ptrs.values()]; const f = drag.pinch / Math.max(10, Math.hypot(a[0] - b[0], a[1] - b[1]));
    const px = (drag.cx - r.left) / r.width, py = (drag.cy - r.top) / r.height;
    vb.w = drag.w * f; vb.h = drag.h * f; vb.x = drag.vx + drag.w * px - vb.w * px; vb.y = drag.vy + drag.h * py - vb.h * py; setVB(); moved = 99;
  } else if (drag && !drag.pinch) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; moved = Math.max(moved, Math.hypot(dx, dy));
    if (moved > 4) { svg.classList.add('dragging'); svg.setPointerCapture(e.pointerId); vb.x = drag.vx - dx * vb.w / r.width; vb.y = drag.vy - dy * vb.h / r.height; setVB(); }
  }
});
const up = (e) => { ptrs.delete(e.pointerId); if (!ptrs.size) { drag = null; svg.classList.remove('dragging'); } };
svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
$('#zin').onclick = () => zoom(1 / 1.3); $('#zout').onclick = () => zoom(1.3); $('#zfit').onclick = fit;
window.addEventListener('resize', fit);

// ---------- 数据整理
const zoneOps = {}; // 车间 → 工艺路线（只取本车间有工位的）

function opZone(code) { const z = D.ops[code].units.map((u) => D.units[u].zone); return z[0]; }
for (const z of D.zones) {
  zoneOps[z.id] = Object.keys(D.routings).filter((r) => D.routings[r].some(([c]) => D.ops[c].units.some((u) => D.units[u].zone === z.id)) &&

}

for (const [item, m] of Object.entries(D.made)) for (const c of m.bom) (parentOf[c[0]] = parentOf[c[0]] || []).push(item);
const shortName = (code) => (D.items[code]?.name || code).replace(/\s+[A-Za-z].*$/, '');

// ---------- 厂区图
let state = { view: 'plant', zone: null, unit: null, route: null };
function clear() { svg.replaceChildren(); rc = null; }
function drawPlant() {
  clear();
  const g = el('g', {}, svg);
  const F = D.plant.floor;
  // 地面、道路
  const ground = [P(-6, -6), P(F.length_m + 6, -6), P(F.length_m + 6, F.width_m + 6), P(-6, F.width_m + 6)];

  const roads = [[[0, 52.5], [F.length_m, 52.5]], [[0, 55.5], [F.length_m, 55.5]], [[82, 0], [82, F.width_m]], [[84.5, 0], [84.5, F.width_m]],
    [[161.5, 0], [161.5, F.width_m]], [[164.5, 0], [164.5, F.width_m]], [[0, 103], [F.length_m, 103]]];
  roads.forEach(([a, b], i) => g.appendChild(line(P(...a), P(...b), { stroke: C.line, strokeWidth: 1, roughness: 0.8, seed: 20 + i })));

      const b = box(zg, x0, y0, w, d, z.h, { seed: seedOf(z.id), sw: 2, hatch: true, hatchGap: 2.2, ft: C.roof });
      // 屋顶：锯齿形天窗（加工车间）或通风带
      const n = Math.max(2, Math.round(w / 12));
      for (let i = 1; i < n; i++) {

        zg.appendChild(line(P(xx, y0 + 2, z.h), P(xx, y1 - 2, z.h), { stroke: C.ink2, strokeWidth: 0.8, roughness: 0.6, seed: seedOf(z.id) + i }));
      }
      // 大门
      const dx = x0 + w * 0.42;
      zg.appendChild(poly([P(dx, y1, 0), P(dx + 6, y1, 0), P(dx + 6, y1, 5), P(dx, y1, 5)], { stroke: C.ink, strokeWidth: 1, fill: C.ink2, fillStyle: 'cross-hatch', hachureGap: 0.9, fillWeight: 0.4, seed: seedOf(z.id) + 50 }));
    }
    const hgt = z.id === 'store' ? 7 : z.h;
    const c = P(x0 + w / 2, y0 + d / 2, hgt);
    centers[z.id] = c;
    const hitPts = hull([P(x0, y0, hgt), P(x1, y0, hgt), P(x1, y1, hgt), P(x0, y1, hgt), P(x1, y0, 0), P(x1, y1, 0), P(x0, y1, 0)]);
    const hit = el('polygon', { class: 'hit', points: hitPts.map((p) => p.join(',')).join(' '), tabindex: 0, role: 'button', 'aria-label': '进入' + z.name }, zg);
    clickable(hit, () => go({ view: 'zone', zone: z.id }));
    hit.addEventListener('keydown', (e) => { if (e.key === 'Enter') go({ view: 'zone', zone: z.id }); });
    const nOps = new Set(z.units.flatMap((u) => (D.unitJobs[u] || []).map((j) => j[1]))).size;
    hit.addEventListener('pointermove', (e) => showTip(e, `<b>${esc(z.no + ' ' + z.name)}</b>${esc(z.en)}<br>${z.units.length} 台设备 / 工位${nOps ? ' · ' + nOps + ' 道工序' : ''}<br>点一下进入车间`));
    hit.addEventListener('pointerleave', hideTip);
  }
  // 标签
  const lab = el('g', { 'pointer-events': 'none' }, g);
  for (const z of D.zones) {

    text(lab, c[0], c[1] - 1, (z.no ? z.no + ' ' : '') + z.name, { size: z.id === 'store' || z.id === 'metro' ? 4.2 : 5.6, weight: 700 });
    text(lab, c[0], c[1] + 4, `${z.units.length} 台设备 / 工位`, { size: 2.8, fill: C.ink2 });
  }
  // 物料流
  const fl = el('g', { 'pointer-events': 'none' }, g);
  const flows = [
    ['store', 'foundry', '炉料、型砂', 'ink2', 12, false],
    ['foundry', 'housing', '铸件（平缝、包缝机壳）', 'blue', 16, false],
    ['housing', 'foundry', '粗加工后回时效炉', 'blue', -10, true],
    ['housing', 'ls', '平缝机壳 HSG-LS', 'red', 14, false],
    ['housing', 'ol', '包缝机壳 HSG-OL', 'violet', 26, false],
    ['parts', 'ls', '轴、针杆、旋梭、偏心', 'green', 14, false],
    ['parts', 'ol', '主轴、针杆、偏心', 'green', 8, false],
    ['housing', 'metro', '机壳三坐标抽检', 'orange', 10, true],
    ['parts', 'metro', '轴、针杆、旋梭、偏心抽检', 'orange', 30, true],
  ];
  flows.forEach(([a, b, s, col, lift, dash], i) => {
    const pa = centers[a].slice(), pb = centers[b].slice();
    pa[1] += 7; pb[1] += 7;
    const mid = curveArrow(fl, pa, pb, lift, { stroke: C[col], strokeWidth: 2, roughness: 1, seed: 90 + i, strokeLineDash: dash ? [2.2, 1.6] : undefined });
    text(fl, mid[0], mid[1] - 1.4, s, { size: 3.3, fill: C[col], weight: 700 });
  });
  // 便签：厂况
  const nOpsAll = Object.keys(D.ops).length;
  const nb = P(F.length_m + 4, -26);
  const note = el('g', { transform: `translate(${nb[0] - 40},${nb[1] - 4}) rotate(-2)` }, g);
  note.appendChild(poly([[0, 0], [52, 0], [52, 25], [0, 25]], { stroke: C['note-ink'], strokeWidth: 1, fill: C.note, fillStyle: 'solid', roughness: 0.8, seed: 7 }));
  [['问渠缝纫机厂（示例）', 3.4, 700], [`产品：WQ-LS 平缝机、WQ-OL 包缝机`, 2.5], [`${D.units ? Object.keys(D.units).length : 0} 台设备 / 工位 · ${nOpsAll} 道工序`, 2.5],
    [`厂房 ${F.length_m} × ${F.width_m} m · 两班`, 2.5], ['点车间进去，点设备看工艺文件', 2.5]]
    .forEach(([s, sz, w], i) => { const t = text(note, 3, 6 + i * 4.4, s, { anchor: 'start', size: sz, weight: w || 400, halo: 0, fill: C['note-ink'] }); });
  // 指北、比例尺
  const n0 = P(-2, F.width_m + 14);
  const sc = el('g', { 'pointer-events': 'none' }, g);
  sc.appendChild(line(P(0, F.width_m + 12), P(20, F.width_m + 12), { stroke: C.ink, strokeWidth: 1.2, seed: 5 }));
  text(sc, ...P(10, F.width_m + 15), '20 m', { size: 2.6 });
  const nn = P(F.length_m - 10, F.width_m + 12);
  arrowHead(sc, nn, P(F.length_m - 10, F.width_m + 2), { stroke: C.ink, strokeWidth: 1.2, seed: 6, head: 2.6 });
  sc.appendChild(line(nn, P(F.length_m - 10, F.width_m + 2), { stroke: C.ink, strokeWidth: 1.2, seed: 8 }));
  text(sc, ...P(F.length_m - 10, F.width_m + 15), '北', { size: 2.8 });
  const bb = g.getBBox();
  content = { x: bb.x, y: bb.y, w: bb.width, h: bb.height };
  $('#hint').textContent = '点车间进入 · 拖动平移 · 滚轮或双指缩放';
}

// ---------- 车间图
function drawZone() {
  clear();
  const z = ZONE[state.zone];
  const lays = z.units.map((id) => D.units[id].lay).filter(Boolean);
  const x0 = Math.max(z.rect[0], Math.min(...lays.map((l) => l[0])) - 4), y0 = Math.max(z.rect[1], Math.min(...lays.map((l) => l[1])) - 4);
  const x1 = Math.min(z.rect[2], Math.max(...lays.map((l) => l[0] + l[2])) + 4), y1 = Math.min(z.rect[3], Math.max(...lays.map((l) => l[1] + l[3])) + 4);
  const g = el('g', {}, svg);
  // 地坪与墙
  g.appendChild(poly([P(x0, y0), P(x1, y0), P(x1, y1), P(x0, y1)], { stroke: C.ink, strokeWidth: 1.6, fill: C.roof, fillStyle: 'solid', roughness: 1.2, seed: 11 }));
  g.appendChild(path([P(x0, y1, 0), P(x0, y0, 0), P(x0, y0, 3), P(x0, y1, 3), P(x0, y1, 0)], { stroke: C.ink2, strokeWidth: 1, seed: 12 }));
  g.appendChild(path([P(x0, y0, 3), P(x1, y0, 3), P(x1, y0, 0)], { stroke: C.ink2, strokeWidth: 1, seed: 13 }));
  // 柱网
  for (let x = x0 + 6; x < x1; x += 6) for (let y = y0 + 6; y < y1; y += 6) {
    const a = P(x, y); g.appendChild(el('circle', { cx: a[0], cy: a[1], r: 0.35, fill: C.line }));
  }
  const routes = zoneOps[z.id];
  if (routes.length && !routes.includes(state.route)) state.route = routes[0];
  const rcolor = (r) => C[RT_COLORS[routes.indexOf(r) % RT_COLORS.length]];
  // 当前工艺路线用到的工位
  const onRoute = new Set(state.route ? D.routings[state.route].flatMap(([c]) => D.ops[c].units) : []);
  // 设备：远到近
  const us = z.units.map((id) => [id, D.units[id]]).filter(([, u]) => u.lay).sort((a, b) => (a[1].lay[0] + a[1].lay[1]) - (b[1].lay[0] + b[1].lay[1]));
  const hits = el('g', {});
  for (const [id, u] of us) {
    const [x, y, w, d] = u.lay;
    const ug = el('g', {}, g);
    const busy = !!(D.unitJobs[id] || []).length;
    const b = box(ug, x, y, w, d, Math.max(1.2, u.h), { seed: seedOf(id), hatch: true, hatchGap: 0.7, sw: 1.1, rough: 0.6,
      ft: onRoute.has(id) ? C.note : C['face-top'], stroke: onRoute.has(id) ? C.ink : (busy ? C.ink : C.ink2) });
    const hp = hull(b.all);
    const hit = el('polygon', { class: 'hit' + (state.unit === id ? ' sel' : ''), points: hp.map((p) => p.join(',')).join(' '), tabindex: 0, role: 'button', 'aria-label': id + ' ' + u.name }, hits);
    clickable(hit, () => go({ view: 'zone', zone: z.id, unit: id }));
    hit.addEventListener('keydown', (e) => { if (e.key === 'Enter') go({ view: 'zone', zone: z.id, unit: id }); });
    const jobs = (D.unitJobs[id] || []).map(([it, c]) => c);
    hit.addEventListener('pointermove', (e) => showTip(e, `<b>${esc(id)} · ${esc(u.name)}</b>${esc(u.ws || '')}${jobs.length ? '<br>工序：' + esc([...new Set(jobs)].join('、')) : ''}`));
    hit.addEventListener('pointerleave', hideTip);
  }
  // 设备编号
  const lab = el('g', { 'pointer-events': 'none' }, g);
  for (const [id, u] of us) {
    const [x, y, w, d] = u.lay;
    const c = P(x + w / 2, y + d / 2, Math.max(1.2, u.h));
    text(lab, c[0], c[1] + 0.5, id, { size: 1.25, halo: 0.25 });
  }
  // 工作中心名称（同类设备只写一次）
  const groups = {};
  for (const [id, u] of us) (groups[u.ws || u.name] = groups[u.ws || u.name] || []).push(u);
  const placed = [];
  for (const [ws, list] of Object.entries(groups)) {
    const xs = list.map((u) => u.lay[0] + u.lay[2] / 2), ys = list.map((u) => u.lay[1]);
    const hmax = Math.max(...list.map((u) => u.h));
    const xm = (Math.min(...xs) + Math.max(...xs)) / 2, ym = Math.min(...ys);
    let c = P(xm, ym, hmax + 1.6);
    let lbl = ws.replace(/\s+[A-Z][A-Z0-9-]*$/, '') + (list.length > 1 ? ` ×${list.length}` : '');
    if (z.id === 'store') lbl = list[0].name.replace(/（.*$/, '');
    const wpx = lbl.length * 1.5 + 1, hpx = 1.9;
    const clash = () => placed.some((p) => Math.abs(p[0] - c[0]) < (p[2] + wpx) / 2 && Math.abs(p[1] - c[1]) < hpx);
    let k = 0;
    for (; k < 4 && clash(); k++) c = [c[0], c[1] - 1.9];
    if (clash()) continue;
    placed.push([c[0], c[1], wpx]);
    text(lab, c[0], c[1], lbl, { size: 1.6, weight: 700 });
  }
  // 工艺路线流向
  const fl = el('g', { 'pointer-events': 'none' }, g);
  if (state.route) {
    const col = rcolor(state.route);
    const stops = [];
    D.routings[state.route].forEach(([c], i) => {
      const inZ = D.ops[c].units.filter((u) => D.units[u].zone === z.id && D.units[u].lay);
      if (!inZ.length) { stops.push(null); return; }
      const cx = inZ.reduce((s, u) => s + D.units[u].lay[0] + D.units[u].lay[2] / 2, 0) / inZ.length;
      const cy = inZ.reduce((s, u) => s + D.units[u].lay[1] + D.units[u].lay[3] / 2, 0) / inZ.length;
      const hmax = Math.max(...inZ.map((u) => D.units[u].h));
      stops.push({ i, p: P(cx, cy, hmax + 0.3) });
    });
    let prev = null;
    stops.forEach((s, k) => {
      if (!s) return;
      if (prev) {
        const a = prev.p, b = s.p, dd = Math.hypot(b[0] - a[0], b[1] - a[1]);
        if (dd > 1.5) {
          const sh = 1.3 / dd, a2 = [a[0] + (b[0] - a[0]) * sh, a[1] + (b[1] - a[1]) * sh], b2 = [b[0] - (b[0] - a[0]) * sh, b[1] - (b[1] - a[1]) * sh];
          curveArrow(fl, a2, b2, Math.min(4, dd * 0.18), { stroke: col, strokeWidth: 2, roughness: 0.7, seed: 300 + k, head: 1.3,
            strokeLineDash: stops.slice(prev.i + 1, s.i).some((x) => x === null) ? [1, 0.8] : undefined });
        }
      }
      prev = s;
    });
    for (const s of stops) if (s) {
      fl.appendChild(el('circle', { cx: s.p[0], cy: s.p[1] - 1.6, r: 1.15, fill: C.paper, stroke: col, 'stroke-width': 1.5 }));
      text(fl, s.p[0], s.p[1] - 1.15, String(s.i + 1), { size: 1.25, weight: 700, halo: 0, fill: col });
    }
  }
  g.appendChild(hits);
  const bb = g.getBBox();
  content = { x: bb.x, y: bb.y - 4, w: bb.width, h: bb.height + 6 };
  $('#hint').textContent = '点设备看工艺文件 · 数字圈是工序顺序，虚线表示中间去了别的车间';
  renderFlow(routes, rcolor);
}

function renderFlow(routes, rcolor) {
  const z = ZONE[state.zone], f = $('#flow');
  f.hidden = false;
  let h = `<h2>${esc((z.no ? z.no + ' ' : '') + z.name)}</h2><div class="empty">${esc(z.en)} · ${z.units.length} 台设备 / 工位</div>`;
  if (routes.length) {
    h += `<div class="chips" role="group" aria-label="工艺路线">` + routes.map((r) =>
      `<button class="chip" data-r="${esc(r)}" aria-pressed="${r === state.route}"><span class="sw" style="background:${rcolor(r)}"></span>${esc(rtShort(r))}</button>`).join('') + `</div>`;
    const items = routeItems[state.route] || [];
    h += `<div class="empty">零件：${items.map((i) => esc(i + ' ' + shortName(i))).join('，')}</div>`;
    h += `<ol class="steps" style="margin-top:8px">` + D.routings[state.route].map(([c, t], i) => {
      const o = D.ops[c], away = !o.units.some((u) => D.units[u].zone === z.id);
      const zn = away ? ZONE[D.units[o.units[0]].zone]?.name : '';
      return `<li class="${away ? 'away' : ''}"><span class="n" style="color:${rcolor(state.route)}">${i + 1}</span><div class="t">${esc(c + ' ' + o.zh)}
        <small>${esc(o.ws.replace(/\s+[A-Z][A-Z0-9-]*$/, ''))} · ${t} min${away ? ' · 在' + esc(zn || '别处') : ''}</small>
        <div class="ulinks">${o.units.map((u) => `<button data-u="${esc(u)}" data-item="${esc(items[0] || '')}" data-op="${esc(c)}">${esc(u)}</button>`).join('')}</div></div></li>`;
    }).join('') + `</ol>`;
  }
  const off = z.units.filter((u) => !(state.route && D.routings[state.route].some(([c]) => D.ops[c].units.includes(u))));
  if (off.length) {
    h += `<div class="group"><h3>${routes.length ? '本车间其他设备' : '设备'}</h3><div class="ulinks">` +
      off.map((u) => `<button data-u="${esc(u)}" title="${esc(D.units[u].name)}">${esc(u)}</button>`).join('') + `</div></div>`;
  }
  f.innerHTML = h;
  f.querySelectorAll('[data-r]').forEach((b) => b.onclick = () => { state.route = b.dataset.r; drawZone(); setVB(); });
  f.querySelectorAll('[data-u]').forEach((b) => b.onclick = () => {
    const u = b.dataset.u, zz = D.units[u].zone;
    go({ view: 'zone', zone: zz || state.zone, unit: u, job: b.dataset.item ? [b.dataset.item, b.dataset.op] : null });
  });
}

// ---------- 工艺文件抽屉
let tab = 'route', job = null;
function openUnit(id, pref) {
  const u = D.units[id], dr = $('#drawer');
  const jobs = D.unitJobs[id] || [];
  job = pref && jobs.some((j) => j[0] === pref[0] && j[1] === pref[1]) ? pref : (jobs.find((j) => routeItems[state.route]?.includes(j[0])) || jobs[0] || null);
  $('#dtitle').textContent = `${id} · ${u.name}`;
  const ws = D.ws[u.ws];
  $('#dsub').textContent = [u.en, u.ws ? `工作中心 ${u.ws}${ws ? `（${ws.count} 台）` : ''}` : '', ZONE[u.zone]?.name, u.cap > 1 ? `一次可装 ${u.cap} 件` : '']
    .filter(Boolean).join(' · ');
  const jb = $('#djobs');
  jb.innerHTML = jobs.length > 1 ? jobs.map(([it, c], i) => `<button class="chip" data-i="${i}" aria-pressed="${job && it === job[0] && c === job[1]}">${esc(it)} · ${esc(c)}</button>`).join('') : '';
  jb.querySelectorAll('[data-i]').forEach((b) => b.onclick = () => { job = jobs[+b.dataset.i]; jb.querySelectorAll('.chip').forEach((x) => x.setAttribute('aria-pressed', x === b)); renderTab(); });
  const mt = metroRows(id);
  const mtab = $('#dtabs').querySelector('[data-t="metro"]');
  mtab.hidden = !mt.length;
  if (!mt.length && tab === 'metro') tab = 'route';
  if (mt.length && (!job || !pref)) tab = 'metro';
  $('#dtabs').querySelectorAll('[data-t="route"],[data-t="op"],[data-t="qc"]').forEach((b) => { b.hidden = !job; });
  $('#dtabs').hidden = !job && !mt.length;
  dr.classList.add('open');
  renderTab();
}
function bindLinks(body, jb) {
  const [item, code] = jb || [];
  body.querySelectorAll('tr.go').forEach((tr) => tr.onclick = () => {
    const c = tr.dataset.op, uu = D.ops[c].units[0];
    go({ view: 'zone', zone: D.units[uu].zone, unit: uu, job: [item, c] });
  });
  body.querySelectorAll('[data-u]').forEach((b) => b.onclick = () => {
    const uu = b.dataset.u, it = b.dataset.item || item;
    const js = D.unitJobs[uu] || [];
    const j = it ? (js.find((x) => x[0] === it && x[1] === code) || js.find((x) => x[0] === it)) : null;
    if (b.dataset.tab) tab = b.dataset.tab;
    go({ view: 'zone', zone: D.units[uu].zone, unit: uu, job: j || (jb && uu !== state.unit ? null : jb) || null });
  });
}
const metroRows = (unit) => D.metro.rows.filter((r) => r.unit === unit);
function metroTable(rows, showItem, showUnit) {
  const H = D.metro.head;
  return `<div class="tw"><table><thead><tr>${showItem ? `<th>${esc(H[0])}</th>` : ''}<th>${esc(H[1])}</th>${showUnit ? `<th>${esc(H[2])}</th>` : ''}<th>${esc(H[3])}</th><th>${esc(H[4])}</th></tr></thead><tbody>` +
    rows.map((r) => `<tr>${showItem ? `<td>${md(r.row[0])}<div class="ulinks">${r.items.map((it) => {
      const j = (D.unitJobs[r.unit] || []).find((x) => x[0] === it);
      const lu = j ? r.unit : (D.made[it] ? D.ops[D.routings[D.made[it].routing].slice(-1)[0][0]].units[0] : null);
      return lu ? `<button data-u="${esc(lu)}" data-item="${esc(it)}" data-tab="qc">${esc(it)}</button>` : '';
    }).join('')}</div></td>` : ''}<td>${md(r.row[1])}</td>${showUnit ? `<td>${md(r.row[2])}<div class="ulinks"><button data-u="${esc(r.unit)}" data-tab="metro">${esc(r.unit)}</button></div></td>` : ''}<td>${md(r.row[3])}</td><td>${md(r.row[4])}</td></tr>`).join('') +
    `</tbody></table></div>`;
}
function simSampleTable(rows, showItem) {
  if (!rows.length) return '';
  return `<div class="tw"><table><thead><tr>${showItem ? '<th>零件</th>' : '<th>计量设备</th>'}<th>何时抽</th><th>特性</th><th>名义</th><th>下限</th><th>上限</th></tr></thead><tbody>` +
    rows.flatMap((x) => x.chars.map((c, k) => `<tr>${k === 0 ? `<td rowspan="${x.chars.length}">${showItem ? esc(x.item) : `<div class="ulinks"><button data-u="${esc(x.unit)}" data-tab="metro">${esc(x.unit)}</button></div>`}</td>
      <td rowspan="${x.chars.length}">${esc(x.after)} 做完后；每张工单首件，以后每 ${x.every} 件 1 件；每次 ${x.minutes} min</td>` : ''}
      <td>${esc(c.name)}</td><td class="num">${c.nominal}</td><td class="num">${c.lo}</td><td class="num">${c.hi} ${esc(c.unit || '')}</td></tr>`)).join('') +
    `</tbody></table></div>`;
}
function metroCard(id) {
  const u = D.units[id], rows = metroRows(id);
  const parts = [...new Set(rows.flatMap((r) => r.items))];
  return `<div class="card"><div class="ct"><b>计量室检验任务</b><span>${esc(id)}</span></div>` +
    kv([['设备', esc(u.name)], ['所在', esc(ZONE[u.zone]?.name)], ['抽检的零件', esc(parts.join('、'))], ['任务数', rows.length]]) +
    `<div class="sec"><p>${md(D.metro.intro.join(''))}</p></div><div class="sec"><h4>检验项目与频次（点零件号看它的检验规程）</h4>${metroTable(rows, true, false)}<div class="src">出处：${esc(D.metro.src)}</div></div>` +
    (D.sampling.some((x) => x.unit === id) ? `<div class="sec"><h4>数字工厂里正在抽检的特性（测量值进质量页、控制图）</h4>${simSampleTable(D.sampling.filter((x) => x.unit === id), true)}<div class="src">出处：工厂清单 wenquest-sewing.yaml 的 sampling 一节（示例值）</div></div>` : '') + `</div>`;
}
function closeDrawer() { $('#drawer').classList.remove('open'); }
$('#dclose').onclick = () => go({ view: 'zone', zone: state.zone });
$('#dtabs').querySelectorAll('button').forEach((b) => b.onclick = () => { tab = b.dataset.t; renderTab(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#drawer').classList.contains('open')) go({ view: 'zone', zone: state.zone }); });

function kv(pairs) { return `<dl class="kv">` + pairs.filter(([, v]) => v !== '' && v != null).map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${v}</dd></div>`).join('') + `</dl>`; }
function fieldsDl(fields, skip = 1) {
  return `<dl class="dl">` + fields.slice(skip).filter(([, v]) => v && v !== '—').map(([k, v]) => `<dt>${esc(k)}</dt><dd>${md(v)}</dd>`).join('') + `</dl>`;
}
function renderTab() {
  $('#dtabs').querySelectorAll('button').forEach((b) => b.setAttribute('aria-selected', b.dataset.t === tab));
  const body = $('#dbody');
  const id = state.unit, u = D.units[id];
  if (tab === 'metro') { body.innerHTML = metroCard(id); bindLinks(body, null); return; }
  if (!job) {
    body.innerHTML = `<div class="card"><div class="ct"><b>设备卡</b><span>${esc(id)}</span></div>${kv([['名称', esc(u.name)], ['英文', esc(u.en)], ['所在', esc(ZONE[u.zone]?.name || '物流通道')],
      ['工作中心', esc(u.ws || '—')], ['外形', u.lay ? `${u.lay[2]} × ${u.lay[3]} × ${u.h} m` : '—']])}
      <div class="sec"><p class="empty">这台设备 / 这个库位不在任何零件的工艺路线上（库房、物流），所以没有工艺卡、工序卡。</p></div></div>`;
    return;
  }
  const [item, code] = job;
  body.innerHTML = tab === 'route' ? routeCard(item, code) : tab === 'op' ? opCard(item, code) : qcCard(item, code);
  bindLinks(body, job);
  body.scrollTop = 0;
}
function cardKind(item) {
  if (item.startsWith('CAST')) return '铸造工艺过程卡';
  if (item.startsWith('WQ-')) return '装配工艺过程卡';
  return '机械加工工艺过程卡';
}
function material(item) {
  const pr = D.partrows[item]?.fields.find(([k]) => k.startsWith('材料'));
  if (pr) return esc(pr[1]);
  const cr = D.castrows[item]?.fields.find(([k]) => k.startsWith('材料'));
  if (cr) return esc(cr[1]);
  const blank = D.made[item].bom.find(([c]) => D.made[c] && c.startsWith('CAST'));
  if (blank) { const cm = D.castrows[blank[0]]?.fields.find(([k]) => k.startsWith('材料')); return `铸件 ${esc(blank[0])}${cm ? '（' + esc(cm[1]) + '）' : ''}`; }
  const raw = D.made[item].bom.find(([c]) => (D.items[c]?.kind === 'raw'));
  return raw ? esc(raw[1]) : '';
}
function routeCard(item, code) {
  const m = D.made[item], steps = D.routings[m.routing];
  const total = steps.reduce((s, [, t]) => s + t, 0);
  let h = `<div class="card"><div class="ct"><b>${cardKind(item)}</b><span>${esc(m.routing)}</span></div>`;
  h += kv([['零件号', esc(item)], ['名称', esc(D.items[item]?.name)], ['用于', esc((parentOf[item] || []).join('、') || '出厂整机')],
    ['材料', material(item)], ['工序数', steps.length], ['工时合计（含按炉工序）', `${+total.toFixed(1)} min`]]);
  const extra = D.castrows[item] || D.partrows[item];
  if (extra) h += `<div class="sec"><h4>零件要点</h4>${fieldsDl(extra.fields, 1)}<div class="src">出处：${esc(extra.src)}</div></div>`;
  if (D.holes[item]) h += `<div class="sec"><h4>关键孔系</h4><ul>${D.holes[item].map((l) => `<li>${md(l.slice(2))}</li>`).join('')}</ul></div>`;
  if (item.startsWith('HSG')) h += `<div class="sec"><h4>加工原则</h4>${D.principles.filter((l) => /^\d\./.test(l)).map((l) => `<p>${md(l)}</p>`).join('')}</div>`;
  if (D.asmNote[item]) h += `<div class="sec"><p>${md(D.asmNote[item].join(''))}</p></div>`;
  h += `<div class="sec"><h4>工序（点一行打开该工序的工位）</h4><div class="tw"><table><thead><tr><th>#</th><th>工序</th><th>工作中心</th><th>车间</th><th>工时 min</th></tr></thead><tbody>` +
    steps.map(([c, t], i) => {
      const o = D.ops[c];
      return `<tr class="go${c === code ? ' cur' : ''}" data-op="${esc(c)}"><td class="num">${i + 1}</td><td>${esc(c)} ${esc(o.zh)}</td><td>${esc(o.ws.replace(/\s+[A-Z][A-Z0-9-]*$/, ''))}</td>
        <td>${esc((ZONE[D.units[o.units[0]].zone]?.name || '').replace('车间', ''))}</td><td class="num">${t}</td></tr>`;
    }).join('') + `</tbody></table></div></div>`;
  h += `<div class="sec"><h4>物料清单（每件）</h4><div class="tw"><table><thead><tr><th>物料</th><th>名称</th><th>数量</th></tr></thead><tbody>` +
    m.bom.map(([c, n, q, uom]) => `<tr><td>${esc(c)}</td><td>${esc(n)}</td><td class="num">${q} ${esc(uom)}</td></tr>`).join('') + `</tbody></table></div></div>`;
  h += `</div><p class="src">工时、数量都是示例值，取自工厂清单 wenquest-sewing.yaml。</p>`;
  return h;
}
function opCard(item, code) {
  const o = D.ops[code], m = D.made[item], steps = D.routings[m.routing];
  const idx = steps.findIndex(([c]) => c === code), t = steps[idx]?.[1];
  const dr = D.docrows[item + '|' + code];
  let h = `<div class="card"><div class="ct"><b>工序卡</b><span>${esc(item)} · 第 ${idx + 1} / ${steps.length} 道</span></div>`;
  h += kv([['工序', `${esc(code)} ${esc(o.zh)}`], ['英文', esc(o.en)], ['零件', `${esc(item)} ${esc(shortName(item))}`], ['工序类别', STAGE[o.stage] || o.stage],
    ['工作中心', esc(o.ws)], ['本工序工时', `${t} min`], ['车间', esc(ZONE[D.units[o.units[0]].zone]?.name)]]);
  h += `<div class="sec"><h4>设备 / 工位（${o.units.length}）</h4><div class="ulinks">${o.units.map((u) => `<button data-u="${esc(u)}"${u === state.unit ? ' style="border-color:var(--ink);font-weight:700"' : ''}>${esc(u)}</button>`).join('')}</div></div>`;
  if (dr) {
    h += `<div class="sec"><h4>工艺规程（本道）</h4>${fieldsDl(dr.fields, 1)}<div class="src">出处：${esc(dr.src)}</div></div>`;
  } else {
    const pr = D.partrows[item];
    h += `<div class="sec"><div class="note">方案里这类零件只写了工艺路线和关键特性，没有逐道工序的工步，这里不补编。</div>${pr ? fieldsDl(pr.fields, 1) + `<div class="src">出处：${esc(pr.src)}</div>` : ''}</div>`;
  }
  const prev = steps[idx - 1], next = steps[idx + 1];
  h += `<div class="sec"><h4>前后工序</h4><p>${prev ? `上道：${esc(prev[0] + ' ' + D.ops[prev[0]].zh)}` : '第一道'}；${next ? `下道：${esc(next[0] + ' ' + D.ops[next[0]].zh)}` : '最后一道，完工入库'}</p></div>`;
  h += `</div>`;
  return h;
}
function qcCard(item, code) {
  const o = D.ops[code];
  const ms = D.meas[item]?.[code];
  const dr = D.docrows[item + '|' + code];
  const qf = dr?.fields.find(([k]) => /检验/.test(k));
  let h = `<div class="card"><div class="ct"><b>检验规程</b><span>${esc(item)} · ${esc(code)}</span></div>`;
  h += kv([['工序', `${esc(code)} ${esc(o.zh)}`], ['零件', `${esc(item)} ${esc(shortName(item))}`], ['检验工序', o.stage === 'inspect' ? '是' : '否（工序检验）']]);
  if (qf && qf[1] && qf[1] !== '—') h += `<div class="sec"><h4>${esc(qf[0])}</h4><p>${md(qf[1])}</p><div class="src">出处：${esc(dr.src)}</div></div>`;
  if (ms) {
    h += `<div class="sec"><h4>测量特性（逐件记录，进 SPC）</h4><div class="tw"><table><thead><tr><th>项目</th><th>名义值</th><th>下限</th><th>上限</th><th>单位</th></tr></thead><tbody>` +
      ms.map((c) => `<tr><td>${esc(c.name)}</td><td class="num">${c.nominal}</td><td class="num">${c.lo ?? ''}</td><td class="num">${c.hi ?? ''}</td><td>${esc(c.unit)}</td></tr>`).join('') +
      `</tbody></table></div><div class="src">名义值、上下限都是示例值，取自工厂清单的测量特性；数字工厂按这张表出测量值、建检验单。</div></div>`;
  } else if (D.meas[item]) {
    const at = Object.keys(D.meas[item])[0], au = D.ops[at].units[0];
    h += `<div class="sec"><p>本零件的测量记录统一记在 <b>${esc(at + ' ' + D.ops[at].zh)}</b>（ERPNext 一种物料一张检验模板）。</p><div class="ulinks"><button data-u="${esc(au)}">去 ${esc(au)} 看</button></div></div>`;
  }
  const fq = D.fqc.rows[code];
  if (fq && fq.length) {
    h += `<div class="sec"><h4>铸造检验规程（相关检验点）</h4><div class="tw"><table><thead><tr>${D.fqc.head.map((x) => `<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>` +
      fq.map((r) => `<tr>${r.map((x) => `<td>${md(x)}</td>`).join('')}</tr>`).join('') + `</tbody></table></div></div>`;
    if (['C158', 'C160'].includes(code) && D.defects.length) {
      const [hd, ...rs] = D.defects;
      h += `<div class="sec"><h4>常见缺陷与对策</h4><div class="tw"><table><thead><tr>${hd.map((x) => `<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>` +
        rs.map((r) => `<tr>${r.map((x) => `<td>${md(x)}</td>`).join('')}</tr>`).join('') + `</tbody></table></div></div>`;
    }
  }
  if (!qf && !ms && !(fq && fq.length)) h += `<div class="sec"><p class="empty">方案没有给这道工序单列检验要求；按下面的通用检验规程执行（首件、巡检、完工检）。</p></div>`;
  const mr = D.metro.rows.filter((r) => r.items.includes(item));
  if (mr.length) h += `<div class="sec"><h4>计量室首件与抽检（三坐标等）</h4>${metroTable(mr, false, true)}<div class="src">出处：${esc(D.metro.src)}</div></div>`;
  const sr = D.sampling.filter((x) => x.item === item);
  if (sr.length) h += `<div class="sec"><h4>数字工厂里正在抽检的特性</h4>${simSampleTable(sr, false)}</div>`;
  h += `<div class="sec"><h4>通用检验规程</h4>${generalHtml()}</div></div>`;
  return h;
}
function generalHtml() {
  let h = '', open = false;
  for (const l of D.general) {
    if (/^\d+\./.test(l)) { if (open) h += '</ul>'; h += `<p>${md(l)}</p><ul>`; open = true; }
    else if (/^\s*-\s/.test(l)) h += `<li>${md(l.replace(/^\s*-\s/, ''))}</li>`;
  }
  return h + (open ? '</ul>' : '');
}

// ---------- 导航（地址栏 #车间 或 #车间--设备）
function crumb() {
  const c = $('#crumb'), z = state.zone && ZONE[state.zone];
  const parts = [`<button data-go="plant" ${state.view === 'plant' ? 'aria-current="page"' : ''}>厂区</button>`];
  if (z) parts.push('<span>›</span>', `<button data-go="zone" ${!state.unit ? 'aria-current="page"' : ''}>${esc(z.name)}</button>`);
  if (state.unit) parts.push('<span>›</span>', `<button aria-current="page">${esc(state.unit)}</button>`);
  c.innerHTML = parts.join('');
  c.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => go(b.dataset.go === 'plant' ? { view: 'plant' } : { view: 'zone', zone: state.zone }));
}
let lastDrawn = null;
function go(s, fromHash) {
  const prevKey = lastDrawn;
  state = { ...state, view: s.view, zone: s.zone || null, unit: s.unit || null };
  if (s.job && s.job[0]) {
    const r = D.made[s.job[0]]?.routing;
    if (r && zoneOps[state.zone]?.includes(r)) state.route = r;
  }
  const key = state.view + '|' + state.zone + '|' + state.route;
  if (key !== lastDrawn) {
    hideTip();
    if (state.view === 'plant') { $('#flow').hidden = true; drawPlant(); } else drawZone();
    lastDrawn = key;
    requestAnimationFrame(fit);
  } else if (state.view === 'zone') {
    svg.querySelectorAll('.hit').forEach((h) => h.classList.toggle('sel', h.getAttribute('aria-label')?.startsWith(state.unit + ' ')));
  }
  if (state.unit) openUnit(state.unit, s.job); else closeDrawer();
  crumb();
  if (!fromHash) {
    const h = state.view === 'plant' ? '' : state.zone + (state.unit ? '--' + state.unit : '');
    if (location.hash.slice(1) !== h) history.replaceState(null, '', h ? '#' + h : location.pathname + location.search);
  }
}
function fromHash() {
  const h = location.hash.slice(1);
  if (!h) return go({ view: 'plant' }, true);
  const [z, u] = h.split('--');
  if (ZONE[z]) go({ view: 'zone', zone: z, unit: D.units[u] ? u : null }, true); else go({ view: 'plant' }, true);
}
window.addEventListener('hashchange', fromHash);
function redrawTheme() { readColors(); lastDrawn = null; go({ ...state }, true); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redrawTheme);
new MutationObserver(redrawTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
readColors();
fromHash();
if (document.fonts) document.fonts.ready.then(() => { lastDrawn = null; go({ ...state }, true); });
})();
