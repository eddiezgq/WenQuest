# 旋梭钩线放回整台机头（第 37 轮；Eddie 2026-10-17 15:57：“和那个机头再结合起来”）。
# 从整机开始：上轴带针杆、挑线杆，下轴带旋梭（转速是主轴 2 倍）；去外盖，跟着机针钻到针板下，
# 接上“连起来”那一段（梭尖钩线 → 线环套过梭壳 → 拉上来在布中间扣结）；最后拉回整机，挑线杆收线、下一针开始。
# 模型、运动都取自平缝机虚拟样机（第 20 轮）；线径、针距放大，是示意。
name: 旋梭钩线_整机
title: {zh: 平缝机一针：从机头到线结, en: "One stitch: from the machine head to the knot"}
duration: 38
floor: false
clip: 0.002
models:
  - id: m
    use: "weblab:sewing/proto-lockstitch"
    loop3d: true
    handover: 300
    colors: {frame: shell, table: wood, stand: steel, spool: thread, plate: steel, slide: steel, bush: gear, presser: steel, belt: dark,
             tension: steel, guide: steel, needle: needle, takeup: takeup, hook: hook, feed: feed, upper: needle, rod: needle,
             nbar: needle, bcase: dark, bstop: dark}
  - {id: s, use: "gen:seam", at: [-0.017, 0.0, 0.0], rot_z: -90, stitches: 3, pitch: 0.004, ply: 0.0012, thread: 0.0004, width: 0.010,
     tighten: [24, 28], hide_last_before_tighten: true}
motion:
  - drive: weblab
    model: m
    angle: [[0, 0], [4, 120], [8, 180], [11, 206.07], [22, 341.07], [28, 386.07], [31, 386.07], [38, 560]]
camera:
  - {t: 0, look: [0.10, 0.0, 0.08], az: -35, el: 18, dist: 0.95}
  - {t: 4, look: [0.06, 0.0, 0.08], az: -15, el: 15, dist: 0.80}
  - {t: 7, look: [0.06, 0.0, 0.07], az: -25, el: 15, dist: 0.80}
  - {t: 9, look: [-0.016, 0.0, -0.004], az: -60, el: 10, dist: 0.22}
  - {t: 10.3, look: [-0.012, 0.0, -0.010], az: -82, el: 6, dist: 0.13}
  - {t: 11.5, look: [-0.012, 0.0, -0.012], az: -90, el: 4, dist: 0.11}
  - {t: 15, look: [-0.010, 0.0, -0.016], az: -90, el: 3, dist: 0.11}
  - {t: 19, look: [-0.009, 0.0, -0.015], az: -45, el: 22, dist: 0.12}
  - {t: 22, look: [-0.010, 0.0, -0.012], az: -55, el: 18, dist: 0.12}
  - {t: 25, look: [-0.014, 0.0, -0.004], az: -80, el: 8, dist: 0.08}
  - {t: 28.5, look: [-0.016, 0.0, 0.0008], az: -85, el: 6, dist: 0.035}
  - {t: 31, look: [-0.016, 0.0, 0.0008], az: -60, el: 18, dist: 0.03}
  - {t: 35, look: [0.02, 0.0, 0.05], az: -30, el: 14, dist: 0.55}
  - {t: 38, look: [0.08, 0.0, 0.08], az: -35, el: 18, dist: 0.95}
effects:
  - {kind: cutaway, t: [4, 38], hide: [m.face, m.top, m.rear, m.body], show: [m.body_cut]}
  - {kind: cutaway, t: [8.6, 32], hide: [m.body_cut, m.table, m.stand, m.spool, m.details, m.oil, m.belt, m.tension, m.guide,
                                      m.feed, m.lower, m.upper, m.rod, m.takeup, m.presser, m.slide, m.bush]}
  - {kind: xray, t: [9.5, 31], top: [m.threads, m.threads_static, m.nbar, s.threads]}
labels:
  - {t: [0, 4], zh: 平缝机机头：主轴转一圈，缝成一针, en: "The machine head: one turn of the main shaft, one stitch"}
  - {t: [4, 8], zh: 去掉外盖：上轴带动针杆和挑线杆，下轴带动旋梭（转速是主轴 2 倍）, en: "Covers off: shafts drive needle bar, take-up and hook (hook at 2×)"}
  - {t: [8, 11], zh: 跟着机针到针板下面：针回升约 2 mm，就是钩线的时刻, en: "Follow the needle below the plate: about 2 mm of rise is the moment of pickup"}
  - {t: [11, 28], phi: [206, 240], zh: 梭尖（红点）钩住面线（蓝）的线环, en: "The hook point (red) catches the loop of upper thread (blue)"}
  - {t: [11, 28], phi: [240, 300], zh: 注意橙色底线：它是从梭壳里出来的, en: "Watch the orange bobbin thread: it comes out of the bobbin case"}
  - {t: [11, 28], phi: [300, 356], zh: 线环绕过整个梭壳——底线就被套在线环里面了, en: "The loop goes round the whole bobbin case, so the bobbin thread ends up inside the loop"}
  - {t: [11, 28.5], phi: [356, 360], zh: 挑线杆把线环拉上去，底线被一起带进两层布中间, en: "The take-up pulls the loop up, taking the bobbin thread into the middle of the cloth"}
  - {t: [22, 28.5], phi: [0, 40], zh: 挑线杆把线环拉上去，底线被一起带进两层布中间, en: "The take-up pulls the loop up, taking the bobbin thread into the middle of the cloth"}
  - {t: [28.5, 32], zh: 面线（蓝）和底线（橙）在布中间扣成结, en: "Upper (blue) and bobbin (orange) threads lock inside the cloth"}
  - {t: [32, 38], zh: 回到机头：送布，下一针再来一遍（每分钟约 5000 针）, en: "Back to the head: feed, then the next stitch (≈5000 a minute)"}
  - {t: [10, 32], where: bottom, zh: 慢放约 2000 倍；示意：线径、针距放大；面线蓝、底线橙；红箭头是旋梭转向, en: "About 2000× slower. Schematic: thread enlarged; upper blue, bobbin orange; red arrow = hook rotation"}
panel:
  kind: readouts
  head: 读数  Readouts
  items:
    - {zh: 主轴转角, en: shaft, key: phi, fmt: "{:5.0f}", unit: "°"}
    - {zh: 针尖高出针板, en: needle tip, key: needle, fmt: "{:+6.1f}", unit: " mm", scale: 20}
    - {zh: 旋梭转过, en: hook turned, key: hookdeg, fmt: "{:5.0f}", unit: "°", scale: 360}
    - {zh: 挑线杆, en: take-up, key: tk, fmt: "{:+6.1f}", unit: " mm"}
