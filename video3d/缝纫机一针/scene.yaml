# 样片 B：平缝机缝一针（第 37 轮第 2 步）。模型和运动都取自《缝纫机设计与制造》已有的平缝机虚拟样机（第 20 轮），
# 尺寸与教材算例一致：针杆曲柄 15.5 mm、连杆 55 mm；旋梭转速是主轴的 2 倍；针回升约 2 mm（约 206°）时梭尖钩住线环（第 5 章）。
name: 缝纫机一针
title: {zh: 平缝机怎样缝一针, en: How a lockstitch machine makes one stitch}
duration: 42
floor: false
clip: 0.002
models:
  - id: m
    use: "weblab:sewing/proto-lockstitch"
    colors: {frame: shell, table: wood, stand: steel, spool: thread, plate: steel, slide: steel, bush: gear, presser: steel, belt: dark,
             tension: steel, guide: steel, needle: needle, takeup: takeup, hook: hook, feed: feed, upper: needle, rod: needle}
motion:
  - drive: weblab
    model: m
    angle: [[0, 0], [6, 720], [9, 720], [33, 1080], [42, 2520]]
camera:
  - {t: 0, look: [0.10, 0.0, 0.08], az: -35, el: 18, dist: 0.95, lens: 40}
  - {t: 6, look: [0.06, 0.0, 0.08], az: -15, el: 15, dist: 0.80, lens: 40}
  - {t: 9, look: [-0.020, 0.0, 0.04], az: -30, el: 10, dist: 0.42, lens: 40}
  - {t: 12, look: [-0.017, 0.0, -0.010], az: -75, el: 12, dist: 0.17, lens: 40}
  - {t: 31, look: [-0.017, 0.0, -0.010], az: -35, el: 12, dist: 0.17, lens: 40}
  - {t: 34, look: [0.06, 0.0, 0.08], az: -20, el: 16, dist: 0.85, lens: 40}
  - {t: 42, look: [0.08, 0.0, 0.08], az: -35, el: 18, dist: 0.95, lens: 40}
effects:
  - {kind: cutaway, t: [6, 42], hide: [m.face, m.top, m.rear, m.body], show: [m.body_cut]}
  - {kind: xray, t: [10, 32], top: [m.needle, m.hook, m.threads]}
labels:
  - {t: [0, 6], zh: 平缝机怎样缝一针, en: How a lockstitch machine makes one stitch}
  - {t: [6, 9], zh: 去掉外盖：上轴、针杆、挑线杆、下轴、旋梭, en: "Covers off: main shaft, needle bar, take-up, lower shaft, hook"}
  - {t: [9, 33], phi: [0, 150], zh: ① 针杆下行，带着面线穿过布料, en: "① The needle carries the upper thread down through the cloth"}
  - {t: [9, 33], phi: [150, 200], zh: ② 针过最低点（180°）开始回升，针眼旁鼓出线环, en: "② Past bottom dead centre the needle rises and a loop forms"}
  - {t: [9, 33], phi: [200, 215], zh: ③ 钩线：针回升约 2 mm（约 206°），梭尖钩住线环, en: "③ Pickup: about 2 mm of rise (≈206°), the hook point catches the loop"}
  - {t: [9, 33], phi: [215, 320], zh: ④ 旋梭转得是主轴的 2 倍快，把线环绕过梭芯, en: "④ The hook turns twice as fast and carries the loop round the bobbin"}
  - {t: [9, 33], phi: [320, 360], zh: ⑤ 挑线杆上升收线，送布牙把布送走一个针距, en: "⑤ The take-up pulls the stitch tight; the feed dog moves the cloth one stitch"}
  - {t: [33, 42], zh: 主轴每转一圈，缝成一针（实际每分钟约 5000 针）, en: "One turn of the main shaft, one stitch (about 5000 a minute in real work)"}
  - {t: [9, 33], where: bottom, zh: 慢放约 2000 倍：真实一针只要 12 毫秒, en: "About 2000× slower: a real stitch takes 12 ms"}
panel:
  kind: readouts
  head: 读数  Readouts
  items:
    - {zh: 主轴转角, en: shaft, key: phi, fmt: "{:5.0f}", unit: "°"}
    - {zh: 针尖高出针板, en: needle tip, key: needle, fmt: "{:+6.1f}", unit: " mm", scale: 20}
    - {zh: 旋梭转角, en: hook, key: hook, fmt: "{:5.0f}", unit: "°"}
    - {zh: 挑线杆, en: take-up, key: tk, fmt: "{:+6.1f}", unit: " mm"}
    - {zh: 送布牙, en: feed dog, key: dogX, fmt: "{:+5.2f}", unit: " mm"}
  plot:
    key: needle
    zh: 针尖高度
    en: needle height
    marks: [{phi: 180, zh: 最低点}, {phi: 206, zh: 钩线}]
