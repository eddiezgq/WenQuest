# 旋梭钩线讲解 · 第 3 步“线环套过梭壳”小样（第 37 轮；Eddie 2026-10-17 13:15“旋梭勾线不清楚细腻，这个很难理解，即便是看实物”，13:16“好”）。
# 线环用 tools/blender/hookloop.py 的三维计算（示意：线径放大）；旋梭、梭壳半透明，梭尖用红点标出，红箭头是旋梭转向。
name: 旋梭钩线_套过梭壳
title: {zh: 旋梭怎样把线环套过梭壳, en: How the rotary hook carries the loop round the bobbin case}
duration: 20
floor: false
clip: 0.002
models:
  - id: m
    use: "weblab:sewing/proto-lockstitch"
    loop3d: true
    colors: {frame: shell, plate: steel, needle: needle, hook: hook, nbar: needle, bcase: dark, bstop: dark}
motion:
  - drive: weblab
    model: m
    angle: [[0, 196], [3, 206.07], [14, 341.07], [18, 386.07], [20, 386.07]]
camera:
  - {t: 0, look: [-0.012, 0.0, -0.012], az: -90, el: 4, dist: 0.085}
  - {t: 3, look: [-0.010, 0.0, -0.018], az: -90, el: 2, dist: 0.085}
  - {t: 7, look: [-0.010, 0.0, -0.020], az: -90, el: 2, dist: 0.085}
  - {t: 11, look: [-0.009, 0.0, -0.020], az: -45, el: 24, dist: 0.095}
  - {t: 15, look: [-0.009, 0.0, -0.018], az: -40, el: 24, dist: 0.095}
  - {t: 20, look: [-0.010, 0.0, -0.016], az: -70, el: 14, dist: 0.09}
effects:
  - {kind: cutaway, t: [0, 20], hide: [m.body, m.face, m.top, m.rear, m.table, m.stand, m.spool, m.details, m.oil, m.belt, m.tension, m.guide,
                                     m.feed, m.lower, m.upper, m.rod, m.takeup, m.presser, m.slide, m.bush]}
  - {kind: xray, t: [-2, 22], top: [m.threads, m.threads_static, m.nbar]}
labels:
  - {t: [0, 3], zh: 针回升约 2 mm，针眼旁鼓出一个线环, en: "The needle rises about 2 mm and a small loop bulges beside it"}
  - {t: [3, 20], phi: [206, 235], zh: 梭尖（红点）从针和线环之间穿过，把线环钩住, en: "The hook point (red) slips between needle and loop and catches it"}
  - {t: [3, 20], phi: [235, 290], zh: 旋梭转得是主轴的 2 倍快，带着线环往下、往外拉大, en: "Turning twice as fast as the shaft, the hook drags the loop down and opens it wide"}
  - {t: [3, 20], phi: [290, 341], zh: 线环一股贴着梭壳前面，一股绕到梭壳后面——整个梭壳被套在线环里, en: "One leg runs over the front of the bobbin case, the other round its back: the whole case is inside the loop"}
  - {t: [3, 20], phi: [341, 390], zh: 梭尖转了 270° 放开线环，挑线杆把它拉上去，套住了里面的底线, en: "After 270° the hook lets go; the take-up pulls the loop up, locking round the bobbin thread"}
  - {t: [0, 20], where: bottom, zh: 示意：线径放大；面线蓝、底线橙；红箭头是旋梭转向, en: "Schematic: thread thickened; upper thread blue, bobbin thread orange; red arrow = hook rotation"}
panel:
  kind: readouts
  head: 读数  Readouts
  items:
    - {zh: 主轴转角, en: shaft, key: phi, fmt: "{:5.0f}", unit: "°"}
    - {zh: 旋梭转过, en: hook turned, key: hookdeg, fmt: "{:5.0f}", unit: "°", scale: 360}
    - {zh: 针尖高出针板, en: needle tip, key: needle, fmt: "{:+6.1f}", unit: " mm"}
