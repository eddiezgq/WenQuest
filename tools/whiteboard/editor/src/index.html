<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>白板课编辑器 · 问渠</title>
<script>window.EXCALIDRAW_ASSET_PATH = new URL("./", location.href).href;</script>
<link rel="stylesheet" href="editor.css">
<style>
:root{--ink:#1d2329;--muted:#5f6b76;--line:#e3ddd2;--soft:#f4f1ea;--gold:#c98a00;--paper:#fffdf8}
html,body,#root{height:100%;margin:0}
body{font:14px/1.5 "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
.wb{display:flex;flex-direction:column;height:100%}
.wb header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:#fff}
.wb .title{font-size:16px;margin-right:8px;white-space:nowrap}
.wb .msg{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn:hover{filter:brightness(1.1)}
.body{flex:1;display:flex;min-height:0}
aside{width:340px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line);background:#fff}
.aside-head{padding:10px 14px;font-weight:600;border-bottom:1px solid var(--line)}
.aside-head small{display:block;font-weight:400;color:var(--muted)}
aside ol{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
aside li{display:grid;grid-template-columns:40px 1fr 26px;gap:6px;align-items:start;padding:6px;border-radius:8px;cursor:pointer}
aside li:hover{background:var(--soft)}
aside li.on{background:#fff4d6;outline:1px solid #f0d58a}
aside li .t{font:12px ui-monospace,monospace;color:var(--muted);padding-top:4px}
aside li textarea{border:0;background:transparent;resize:none;font:inherit;color:inherit;padding:2px;border-radius:4px;width:100%}
aside li textarea:focus{background:#fff;outline:1px solid var(--line)}
aside li .n{font:12px ui-monospace,monospace;text-align:center;background:var(--soft);border-radius:999px;padding:2px 0;margin-top:3px}
aside li .n.zero{opacity:.35}
.aside-foot{padding:10px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px}
.aside-foot small{color:var(--muted);width:100%}
main{flex:1;min-width:0;position:relative}
.loading{padding:40px;color:var(--muted)}
.preview{position:fixed;inset:0;background:rgba(15,20,25,.7);display:flex;align-items:center;justify-content:center;z-index:100}
.pv{width:min(92vw,1400px);background:#fdfcf8;border-radius:10px;overflow:hidden}
.pv svg{display:block;width:100%;aspect-ratio:16/9;background:#fdfcf8}
.pvbar{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.pvbar input{flex:1;accent-color:var(--gold)}
</style></head>
<body><div id="root"></div>
<script>
window.WB_PEN = '<g id="pen" transform="translate(2300,1500)"><g transform="rotate(-38)"><path d="M0,0 L-7,-20 L7,-20 Z" fill="#1d2329"/><rect x="-11" y="-46" width="22" height="26" rx="3" fill="#3a4550"/><rect x="-15" y="-250" width="30" height="206" rx="9" fill="#c98a00"/><rect x="-15" y="-250" width="9" height="206" rx="4" fill="#e3a91a"/><rect x="-16" y="-110" width="32" height="10" fill="#1d2329" opacity=".85"/><rect x="-13" y="-268" width="26" height="22" rx="7" fill="#1d2329"/></g></g>';
</script>
<script src="rough.js"></script><script src="player.js"></script>
<script type="module" src="editor.js"></script>
</body></html>
