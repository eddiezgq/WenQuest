# WQ-LS 零件号对照表（第 138 轮 G6.1）：三维零件名（tools/wqls/cad/*.py 里的名字）→ 物料号。
# 网页三维整机（g6_web.py）点零件时显示它；G7.1 的 BOM 也按这张表生成。
#
# 编号规则：
#   - 我们自己设计的件（有我们的图）一律 LS-xxx：1xx 主轴与传动、2xx 刺布挑线、3xx 旋梭、4xx 送布与油泵、
#     5xx 压脚与操纵件、7xx 选配件 T（自动剪线、拨线、松线）、8xx 选配件 E（电子针距）。
#     kind: make = 本厂做（缝纫机厂要有工艺路线）；buy = 按我们的图外购（弹簧、衬套等）。
#   - 目录件、标准件（照型号买）一律 BUY-…；外购部件的内部零件（如电机里的定子）用部件的号，sub 写是部件里的哪一件。
#   - 机壳用 G5 的号：上件 HSG-LS-U、下件 HSG-LS-L、合件 HSG-LS-P（缝纫机厂现在的 HSG-LS 在 G7.1 换成这三个）。
#   - 沿用缝纫机厂已有的号：LS-101、LS-102、LS-201、LS-301、LS-401、BUY-MOTOR-LS、BUY-NEEDLE-DB、BUY-BOBCASE、BUY-BELT-LS。
#     G4 旋梭组.md 里把下轴写成了 LS-501，与工厂的 LS-102 冲突，以工厂为准（已改文档）。
# 字段：name [中文, English]；group 爆炸分组；qty 这个三维零件里有几件；mat 材料（设计文档里写了的才写，没写的留空，页面显示“未定”）；
#      doc 计算书（docs 里的简称，# 后面是那一节标题的开头）；dwg 图纸（相对 docs/设计/WQ-LS/，网页里复制成 dwg/<物料号>.pdf）。
groups:
  hsg: [机壳, Housing]
  main: [主轴与电机, Main shaft & motor]
  needle: [刺布挑线, Needle & take-up]
  hook: [旋梭, Rotary hook]
  feed: [送布与油泵, Feed & oil pump]
  press: [压脚与操纵, Presser & controls]
  optT: [选配件 T：剪线拨线, "Option T: trimmer & wiper"]
  optE: [选配件 E：电子针距, "Option E: electronic stitch"]
docs:
  G2: G2/设计计算书.md
  G3: G3/外观与机壳铸件.md
  G4a: G4/刺布与挑线机构.md
  G4h: G4/旋梭组.md
  G4f: G4/送布组.md
  G4c: G4/压脚与操纵件.md
  G4o: G4/剪线与电子针距.md
  G5c: G5/机壳铸造工艺.md
  G5m: G5/机壳机加工工艺.md
assemblies:
  HSG-LS-P: [机壳合件（上下件合箱后精加工）, Housing pair (upper and lower finish-machined together)]
