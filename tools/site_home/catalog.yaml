      - {zh: "进入数字工厂", en: "Enter the digital factory", dz: "减速器厂、机器人厂、电路板厂、芯片封测厂：ERP、工艺、MES、质量、设备、能源", de: "Gearbox, robot, PCB and chip plants: ERP, process, MES, quality, maintenance, energy", url: "https://factory.wenquestrobotics.com/", login: true, intro: factory}
