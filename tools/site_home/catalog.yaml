    en: Electronics and chips
    items:
      - {zh: "电路板厂", en: "PCB plant", dz: "关节驱动板、AGV 控制板：锡膏印刷、贴片、回流、AOI 到功能测试，给机器人厂供货", de: "Joint driver and AGV boards: paste print, placement, reflow, AOI to functional test; supplies the robot plant", url: "https://pcb.factory.wenquestrobotics.com/", login: true}
      - {zh: "电路板设计", en: "PCB design", dz: "关节驱动板 A/B 两版：原理图、PCB、三维、BOM、可制造性检查（示例设计）", de: "Joint driver board, rev A and B: schematic, layout, 3D, BOM, DFM checks (example design)", url: "https://pcb.factory.wenquestrobotics.com/pcb-design", login: true}
      - {zh: "芯片设计", en: "Chip design", dz: "编码器接口芯片 WQ-ENCIF：RTL 到 GDS，DRC、LVS、时序都过（示例设计，未流片）", de: "Encoder-interface chip WQ-ENCIF: RTL to GDS, DRC, LVS and timing clean (example, not taped out)", url: "https://pcb.factory.wenquestrobotics.com/chip-design", login: true}
      - {zh: "芯片封测厂", en: "Chip packaging and test plant", dz: "WQ-ENCIF 的封装与测试：晶圆外协，封装、测试、分档", de: "Packaging and test of WQ-ENCIF: wafers bought in, then package, test and bin", url: "https://chip.factory.wenquestrobotics.com/", login: true}
      - {zh: "固件与仿真", en: "Firmware and simulation", dz: "驱动板 B 版的固件，在 Renode 里整板仿真运行（示例固件）", de: "Firmware for driver board rev B, run on a simulated board in Renode (example)", url: "https://pcb.factory.wenquestrobotics.com/pcb-design", login: true}
      - {zh: "传感器虚拟仪器", en: "Sensor virtual instruments", dz: "7 种仪器、6 种传感器、6 个测量任务，结果自动核对，导出实验记录", de: "7 instruments, 6 sensors, 6 measuring tasks, results checked, lab record exported", url: "https://factory.wenquestrobotics.com/instruments", login: true}
