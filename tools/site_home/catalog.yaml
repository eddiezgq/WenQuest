      - {zh: "评价系统（演示）", en: "Assessment (demo)", dz: "学生、教师、学校三端，自动生成课程目标达成报告、教学质量报告", de: "Student, teacher and school views; course-objective and teaching-quality reports in one click", url: "/eval/", intro: eval}
      - {zh: "校情中枢（演示）", en: "Campus Hub (demo)", dz: "学校、学院、专业看板，毕业要求达成、改进任务、评估报告", de: "School, college and program dashboards, graduate attributes, improvement tasks, reports", url: "/xq/", intro: eval}
      - {zh: "网页互动课件", en: "Interactive web slides", dz: "像 PPT 一样翻页，动画、实验、三维模型当场操作", de: "Page through like slides, with live animations, labs and 3D models", url: "/solutions/sewing/", intro: textbook}
