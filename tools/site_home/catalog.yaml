      - {zh: "三维工厂", en: "3D factory", dz: "车间、设备、在制品的三维视图", de: "The plant in 3D", url: "https://factory.wenquestrobotics.com/3d", login: true, intro: factory}
      - {zh: "数字工厂实验", en: "Factory labs", dz: "__FLAB__ 个实验：从订单到交付、追因、标定、售后", de: "__FLAB__ labs: order to delivery, root cause, calibration, after-sales", url: "https://factory.wenquestrobotics.com/labs", login: true, intro: factory}
