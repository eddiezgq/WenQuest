      - {zh: "电路分析", en: "Circuit analysis", dz: "浏览器里搭电路、改元件值，当场仿真出波形", de: "Build a circuit in the browser, change a value, simulate and see the waveform", url: "https://factory.wenquestrobotics.com/circuit", login: true}
