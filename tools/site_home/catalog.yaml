# 官网首页“问渠全貌”总图与“看视频认识问渠”的清单（第 80 轮）。加一样新东西只改这里，再跑 python3 tools/site_home/build.py。
# 每项：zh / en 名称，dz / de 一句话，url，login: true 表示要登录（卡上标“需登录”）。
# 站内链接（以 / 开头）由 build.py 检查文件存在；learn. / factory. / demo. 的链接施工时逐个打开核对。

# 第 86 轮：模块视频简介。yt = 英文版 YouTube 编号（美国官网用），bv = 中文版 B 站 BV 号（国内版官网用）；空着的不显示按钮。
# 卡片写 intro: <下面的键>，同一段视频可以挂几张卡；overview 显示在总图上方。
intro:
  overview: {zh: 问渠全貌, en: WenQuest overview, yt: "spCHVOw97v8", bv: "BV1zR4v6iERT"}
  learn: {zh: 学习平台与 AI 建课, en: Learning platform and AI course building, yt: "XB0CTTIXoWM", bv: "BV1r94v6MErQ"}
  factory: {zh: 数字工厂, en: The digital factory, yt: "jXvQ3KIRwtQ", bv: "BV1zo4v6NEiR"}
  eval: {zh: 评价系统与校情中枢, en: Assessment and Campus Hub, yt: "v6R-rRzFWsw", bv: "BV1CU4v66En6"}
  textbook: {zh: 自编教材与网页互动课件, en: Textbooks and interactive web slides, yt: "rusMo87KWK0", bv: "BV1BZ4v6eEXm"}
  whiteboard: {zh: 白板课, en: Whiteboard lessons, yt: "F90JgWGEtNQ", bv: "BV1BZ4v6eEbt"}
  video3d: {zh: 三维仿真视频, en: 3D simulation films, yt: "dlyDt47ccF4", bv: "BV1BZ4v6eERd"}
