      - {zh: "AI 建课", en: "AI course building", dz: "对话中建课，资料再乱也由 AI 整理", de: "Build a course by conversation; the AI sorts out the materials", url: "https://learn.wenquestrobotics.com/pages/studio/studio", login: true, intro: learn}
      - {zh: "教材", en: "Textbooks", dz: "九本自编教材和网页版教材，每章配程序、动画、虚拟实验", de: "Nine textbooks of our own plus web editions, each chapter with code, animations and labs", url: "https://learn.wenquestrobotics.com/pages/textbook/textbook", login: true, intro: textbook}
