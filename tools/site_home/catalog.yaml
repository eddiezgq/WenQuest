    zh: 内容制作软件
    en: Content tools
    items:
      - {zh: "白板课", en: "Whiteboard lessons", dz: "输入题目或上传录音，AI 画出会动的白板讲解", de: "Type a topic or upload a recording; the AI draws an animated whiteboard talk", url: "https://learn.wenquestrobotics.com/pages/whiteboard/whiteboard", login: true, intro: whiteboard}
      - {zh: "三维仿真视频", en: "3D simulation videos", dz: "用一段话描述，出工程级三维动画片", de: "Describe it in a paragraph and get an engineering-grade 3D film", url: "https://learn.wenquestrobotics.com/pages/video3d/video3d", login: true, intro: video3d}
      - {zh: "三维样片", en: "3D sample films", dz: "平缝机、机械臂抓放等样片", de: "Lockstitch machine, robot pick-and-place and more", url: "/cases/video3d.html", intro: video3d}
      - {zh: "讲解视频与公开课", en: "Lecture videos", dz: "每课一段讲解视频，中英配音与字幕", de: "A lecture video for every lesson, Chinese and English", url: "#videos"}
  - key: park
    wide: true
    zh: 数字工业园
    en: Digital industrial park
