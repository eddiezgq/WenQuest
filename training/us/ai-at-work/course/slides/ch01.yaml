      - "One last lab to pull today together. Four claims are marked in the AI's answer. For each, choose the fastest check that would actually catch an error: a primary source, recompute it, open the cited source, or ask the owner. There's also an option to ask the AI again; think about why that isn't a check. Then click Check."

  - layout: summary
    title: ["今天记住三件事", "Three things to remember"]
    points:
      - ["AI 是在预测文字，不是在查事实", "AI predicts text; it does not look up facts"]
      - ["给足上下文，草稿才贴近你的工作", "Give it real context to get a usable draft"]
      - ["要交出去的数字和事实，追到出处", "Anything that leaves your desk must trace to a source"]
    after: ["课后：带 3 件你这周真实要做的事来上第 2 次课", "Before Session 2: bring three real tasks from your week"]
    notes:
      - "今天记住三件事。第一，AI 是在预测文字，不是在查事实。第二，给足上下文，草稿才贴近你的工作。第三，凡是要交出去、要拿去做决定的数字和事实，都要追到出处。课后作业很简单：想好这周你真实要做的三件事，比如一封邮件、一份报告、一张表格，第 2 次课我们就用它们来练。"
      - "Three things to remember. One: AI predicts text; it doesn't look up facts. Two: give it real context and the draft fits your work. Three: any number or fact that leaves your desk or drives a decision must trace back to a source. Homework is simple: bring three real tasks from your week, an email, a report, a spreadsheet, and we'll use them in Session 2."
