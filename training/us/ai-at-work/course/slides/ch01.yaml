# Session 1 · How Generative AI Works — and Where It Breaks（第 140 轮 · A 课第 1 次课，样品）
# 每页最多 3 条；[中文, English]，美国班用 --lang en 只出英文。{{ch01.键:格式}} 由 course/calc/ch01.py 算出。
lesson: 1
code: [ch01]

clips:
  hero:            # 封面：同一个问题被一遍遍回答，有对有错，语气一样（页面自己循环）
    page: cover1
    selector: "#stage"
  sweep:           # 温度 0.2 → 1.5 来回扫，柱状概率跟着变（一直循环）
    page: nexttoken
    selector: ".card"
    vw: 1500
    vh: 900
    loop: 16
    steps:
      - {at: 0, set: {temp: 0.2}}
      - {at: 4, set: {temp: 0.7}}
