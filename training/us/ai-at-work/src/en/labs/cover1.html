<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Session 1 cover</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#0b1424;overflow:hidden;font-family:Inter,'DejaVu Sans',Arial,sans-serif}
#stage{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 14% 0 48%;gap:20px}
.line{font-size:30px;color:#c9d6e6;opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s;white-space:nowrap}
.line.on{opacity:1;transform:none}
.line b{font-weight:800}
.ok b{color:#2ec4b6}.bad b{color:#ff7a45}
.mark{font-size:26px;margin-left:16px;font-weight:700}
.ok .mark{color:#2ec4b6}.bad .mark{color:#ff7a45}
</style></head><body><div id="stage"></div>
<script>
// Same toy distribution as course/calc/ch01.py at temperature 0.7
var LOGITS={"310 MPa":2.2,"45 ksi":1.6,"276 MPa":1.9,"290 MPa":1.0,"40 ksi":1.1,"350 MPa":0.4},OK={"310 MPa":1,"45 ksi":1};
var keys=Object.keys(LOGITS);function pick(){var z={},s=0;keys.forEach(function(k){z[k]=Math.exp(LOGITS[k]/0.7);s+=z[k];});var r=Math.random()*s,c=0;for(var i=0;i<keys.length;i++){c+=z[keys[i]];if(r<c)return keys[i];}return keys[0];}
var st=document.getElementById('stage');
function round(){st.innerHTML='';var n=0;(function add(){if(n>=7){setTimeout(round,3500);return;}var k=pick(),d=document.createElement('div');
 d.className='line '+(OK[k]?'ok':'bad');d.innerHTML='6061-T6 UTS ≈ <b>'+k+'</b><span class="mark">'+(OK[k]?'✓':'✗')+'</span>';st.appendChild(d);
 requestAnimationFrame(function(){d.classList.add('on');});n++;setTimeout(add,900);})();}
round();
</script></body></html>
