# WenQuest: one-command deployment.  Usage:  cp .env.example .env  (edit it)  &&  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-moodle}
      POSTGRES_USER: ${DB_USER:-moodle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-moodle} -d ${DB_NAME:-moodle}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  moodle:
    build:
      context: .
      dockerfile: moodle/Dockerfile
    image: ${ENGINE_IMAGE:-wenquest/engine:0.1}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - moodledata:/var/www/moodledata

  # WenQuest API gateway: the single entry point for the WenQuest frontend.
  gateway:
    build: services/gateway
    image: ${GATEWAY_IMAGE:-wenquest/gateway:0.2}
    restart: unless-stopped
    depends_on:
      - moodle
    environment:
      WQ_MOODLE_URL: ${MOODLE_WWWROOT}
      WQ_MOODLE_CONNECT_URL: http://moodle
      WQ_SECRET_KEY: ${WQ_SECRET_KEY:?Set WQ_SECRET_KEY in .env}
      WQ_DEFAULT_LANG: ${WQ_DEFAULT_LANG:-zh}
      WQ_CORS_ORIGINS: ${APP_URL:-http://localhost:8088}
      WQ_PUBLIC_URL: ${WQ_PUBLIC_URL:-}
      # AI course builder and (later) the AI tutor use the same keys as Moodle's AI features.
      WQ_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WQ_CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5}
      WQ_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Lesson animations are rendered by the animator service (below).
      WQ_ANIMATOR_URL: http://animator:8000
      # AI-written virtual labs are tried in a headless browser by the lab checker (below).
      WQ_LABCHECK_URL: http://labcheck:8000
      # Sign-up, teacher approval and course notices by email (see docs/帮助/注册登录与审核.md).
      WQ_SMTP_HOST: ${SMTP_HOST:-}
      WQ_SMTP_PORT: ${SMTP_PORT:-2525}
      WQ_SMTP_SECURE: ${SMTP_SECURE:-tls}
      WQ_SMTP_USER: ${SMTP_USER:-}
      WQ_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      WQ_MAIL_FROM: ${MOODLE_NOREPLY_EMAIL:-}
      WQ_ADMIN_EMAIL: ${WQ_ADMIN_EMAIL:-}
      WQ_ADMIN_EMAIL_FALLBACK: ${MOODLE_ADMIN_EMAIL:-}
      WQ_APP_URL: ${APP_URL:-http://localhost:8088}
      WQ_SITE_DOMAIN: ${SITE_DOMAIN:-}
    volumes:
      # Uploaded materials, course generation progress and converted slides survive redeploys.
      - gatewaydata:/data
    networks:
      - default
      - render

  # Renders the AI animator's Manim scenes to video. It holds no secrets and cannot reach the internet
  # (the render network is internal); at most 2 CPUs and 3 GB so the site stays responsive.
  animator:
    build: services/animator
    image: ${ANIMATOR_IMAGE:-wenquest/animator:0.1}
    restart: unless-stopped
    cpus: 2
    mem_limit: 3g
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=1g
      - /home/anim:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks:
      - render

  # Tries AI-written virtual labs in headless Chromium (no errors, not blank, every task can be done) and
  # takes the picture for the slides. Like the animator: no secrets, no internet, 1 CPU and 2 GB.
  labcheck:
    build: services/labcheck
    image: ${LABCHECK_IMAGE:-wenquest/labcheck:0.1}
    restart: unless-stopped
    cpus: 1
    mem_limit: 2g
    shm_size: 256m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /home/lab:size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks:
      - render

  # WenQuest web app (static files) with /api forwarded to the gateway.
  web:
    build: apps/web
    image: ${WEB_IMAGE:-wenquest/web:0.2}
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "${APP_PORT:-8088}:80"

  cron:
    image: ${ENGINE_IMAGE:-wenquest/engine:0.1}
    restart: unless-stopped
    depends_on:
      - moodle
      - redis
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - moodledata:/var/www/moodledata
    command: ["sh", "-c", "sleep 60; while true; do su -s /bin/sh www-data -c 'php admin/cli/cron.php' ; sleep 60; done"]

networks:
  default:
  render:
    internal: true

volumes:
  dbdata:
  moodledata:
  gatewaydata:
