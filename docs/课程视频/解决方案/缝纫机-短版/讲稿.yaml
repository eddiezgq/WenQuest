intro:
  zh:
    - 各位好，我是问渠的张国庆。用三分钟介绍问渠的缝纫机企业解决方案。
say:
  2: "做新机型，改一个尺寸要等样机做出来才知道行不行；设计、车间、售后各用各的系统，数据对不上；会用仿真软件、会调机的人又少。"
  3: "问渠的回答是三件事：缝纫机专用的设计软件，一体化的信息化平台，和贯穿全程的 AI。"
  4: "三件事连成一条线：设计、校核、仿真、数控、审批、企业管理系统、车间、质量、售后，同一套数据，改一次设计，下游全跟着变。"
  6: "设计软件现在有五种机型，{{sol_enterprise.checks_all}} 项红绿灯校核，每一项都有数值、判据、出处和改法。"
  9: "比如平缝机转速提到六千，马上两项不合格、一项要注意；按提示减轻针杆组件、机壳加筋，{{sol_enterprise.ck_ls}} 项全部合格。样机还没做，问题已经解决了。"
  24: "关键零件一键送有限元，自动加约束和载荷，算强度和疲劳寿命；减重之后再复核，合格才算数。零件和花样模板还能直接出数控程序。"
  31: "信息化平台的骨架是数字主线：设计批准后才生效，物料版本、物料清单、工单和加工程序自动更新，车间只拿到批准过的版本。"
  39: "厂情中枢把全厂连成一张图，每二十秒检查一遍：异常在左，原因和影响在中间，处理方案和推演结果在右边。"
  46: "AI 贯穿每一环：一句话设好仿真、一句话编程，工厂代理查数、追因、推演、起草动作，每天写厂情日报，还能把培训资料建成整门课。"
  48: "而且 AI 是可信的：每个结论附来源，数字由程序逐个核对；AI 只能起草动作，执行要人批准；没有大模型时，规则版照样能用。"
  57: "怎么开始？不用登录就能免费试算；开通企业账号后保存项目、导出文件、用仿真；我们再做演示和培训，按企业的需要定制。"
  58: "总结一下：设计时就知道行不行，设计到售后一条线、一套数据，AI 贯穿全程。欢迎到问渠官网首页预约演示，谢谢。"
