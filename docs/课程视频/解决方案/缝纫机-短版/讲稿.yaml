intro:
  zh:
    - 各位好，我是问渠的张国庆。用三分钟介绍问渠的缝纫机企业解决方案。
say:
  2: "先说企业的难处。做一台新机型，改一个曲柄半径、提一档转速，往往要等样机做出来、试缝了才知道行不行。仿真软件贵，会用的人少；调机靠老师傅，人难招，新人也难带。"
  3: "问渠的办法是一条线：设计、校核、仿真、数控、审批、车间、售后和培训，用同一套数据。设计改一次，下游自动跟着变，全部在浏览器里用，不用装软件。"
  5: "缝纫机设计软件现在有五种机型：平缝机、包缝机、绷缝机、电子花样机和多头刺绣机，一共 {{sol_enterprise.checks_all}} 项红绿灯校核，每一项都有数值、判据、出处和改法。"
  7: "比如平缝机的转速从五千提到六千，马上两项不合格、一项要注意：针杆惯性力超过轴套允许的载荷，机壳也离共振太近。按提示减轻针杆组件、机壳加筋，{{sol_enterprise.ck_ls}} 项全部合格。这些在样机做出来之前就知道了。"
  14: "关键零件一键送有限元，按一转里受力最大的时刻算强度和疲劳寿命；想减重就做拓扑优化，减完再复核，合格才算数。"
  15: "花样机和刺绣机的伺服，按电机表一台台比着选；花样模板按针迹轨迹在板上开槽，直接出数控程序，试切检查后就能上机床。"
  17: "批准过的设计自动更新物料版本、物料清单、工单和数控程序，车间只拿批准过的版本；报工和质检数据回到同一个平台，质量问题追得到根源。"
  21: "怎么开始？不用登录就能免费试算；觉得有用，开通企业账号，保存项目、导出文件、用仿真；我们再上门演示培训，按企业的需要定制。"
  22: "总结一下：设计时就知道行不行，设计、仿真、加工、车间、售后一条线、一套数据，人才也跟得上。欢迎到问渠官网首页预约演示，谢谢。"
