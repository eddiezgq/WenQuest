# 《数字工厂实训》公开课 第 6 讲：设备维护与可靠性（第 29 轮样板讲）
# 画面是这一讲的网页互动课件（textbook/web-editions/dfactory/course/slides/ch06.yaml），配音是课件每页的讲稿（notes）。
# 这里只写开场、课后部分和结尾。课后部分：虚拟实验 6-1、6-2 录屏、作业页、测验页。
# 数字一律由 course/calc/ch06.py 算出（{{ch06.键:格式}}），模型和参数取自数字工厂 sim/reliability.py、hub/maint.py。
book: dfactory
section: "6"
deck: ch06
skip: []                   # 不跳页：生活例子（换机油）要留在视频里（课程标准）
code: [ch06]
title: ["设备维护与可靠性：该不该停下来保养", "Maintenance and Reliability: Should We Stop for Service?"]
chapter: ["第三篇 七个领域 · 第 6 章", "Part III Seven Domains · Chapter 6"]
next: ["第 7 讲 人员与排班", "Lecture 7 People and shifts"]
cover_formula: 'P(t,H)=1-e^{-[((t+H)/\eta)^{\beta}-(t/\eta)^{\beta}]}'
tags:
  zh: [设备维护, 可靠性, 威布尔分布, 预防性维护, 保养周期, 数字工厂]
  en: [maintenance, reliability, Weibull distribution, preventive maintenance, digital factory]

intro:
  zh:
    - 同学们好，欢迎来到问渠。
    - 这是《数字工厂实训》第六讲，设备维护与可靠性：该不该停下来保养。
  en:
    - Hi everyone, and welcome to the Digital Factory Practicum at WenQuest.
    - This is Lecture 6, maintenance and reliability. Should we stop for service?

after:
  - id: lab61
    kind: lab
    lab: weibull
    part: ["虚拟实验", "Virtual lab"]
    steps:
      - js: "document.querySelectorAll('[id^=k], #plot text, #sim text').forEach(e => { if (e.tagName !== 'DIV') e.style.filter = 'blur(7px)'; })"
        press: "[data-p=grd]"
        dur: 2
      - sweep: {t: [0, 1200]}
        dur: 6
      - press: "#pmBtn"
        dur: 2
      - press: "[data-p=exp]"
        dur: 1
      - sweep: {t: [0, 1200]}
        dur: 5
      - press: ["[data-p=grd]", "#play"]
        dur: 8
    say:
      zh:
        - 下面是虚拟实验 6-1，在问渠学习平台上可以亲手做。结果区的数字这里先遮住，留给你自己读。
        - ">先选 GRD-01，读出运行 620 小时、未来 80 小时坏掉的概率和预期损失，跟课上的手算对一对。"
        - ">再把已运行小时从零拖到一千二，看橙色窗口里的概率怎么变；点“现在保养”，概率降到多少，算一算降了几倍。"
        - ">然后点 β 等于 1 对照，再拖一遍。概率还变不变？为什么这时候定期保养没有用？"
        - ">最后点播放，看运行时钟的锯齿：到周期就保养，时钟拨回零，偶尔坏一次。把周期改成 300、800 小时各播一次，数一数保养和故障的次数。"
      en:
        - Now Virtual lab 6-1. On the WenQuest platform you can do it yourself. The numbers in the results panel are blurred here; reading them is your job.
        - ">First choose GRD-01 and read the chance of failing in the next 80 hours after 620, and the expected loss. Check them against the hand calculation from class."
        - ">Then drag the hours run from zero to twelve hundred and watch the probability in the orange band. Press Service now: how far does it drop, and by what factor?"
        - ">Next press the beta-equals-one check and drag again. Does the probability still change? Why is scheduled service useless then?"
        - ">Finally press Play and watch the saw-tooth of the clock: service at the interval resets it, and now and then it fails. Try intervals of 300 and 800 hours and count services and failures."

  - id: lab62
    kind: lab
    lab: pmopt
    part: ["虚拟实验", "Virtual lab"]
    steps:
      - js: "document.querySelectorAll('[id^=k], #plot text, #sim text').forEach(e => { if (e.tagName !== 'DIV') e.style.filter = 'blur(7px)'; })"
        press: "[data-p=after]"
        dur: 2
      - sweep: {T: [100, 1200]}
        dur: 5
      - press: "[data-p=during]"
        dur: 1
      - sweep: {T: [100, 1200]}
        dur: 5
      - press: "[data-p=after]"
        dur: 1
      - set: {T: 310}
        dur: 1
      - press: "#play"
        dur: 8
    say:
      zh:
        - ">虚拟实验 6-2：保养周期怎样定。曲线是按龄保养长期每运行小时的花费，红色虚线是坏了再修。"
        - ">先点“下班后保养”，拖动周期找最低点，读出最优周期和花费；再点“生产时间停机保养”，看最低点往哪边移。"
        - ">最后播放两台同样设备的比赛：一台按周期保养，一台坏了再修，用同一串随机寿命跑两万小时，比一比累计花费。答案这里不说，留给你自己找。"
        - 两个实验都配有指导书和报告模板，在平台上下载。
      en:
        - ">Virtual lab 6-2: choosing the service interval. The curve is the long-run cost per operating hour of age-based service; the red dashed line is run to failure."
        - ">Press service after shift, drag the interval to the lowest point and read the optimum and its cost. Then press stop during production and see which way the minimum moves."
        - ">Finally play the race between two identical machines, one serviced every T hours and one run to failure, on the same random lifetimes for 20,000 hours, and compare their costs. I won't give the answers here; they're yours to find."
        - Both labs come with a guide and a report template on the platform.

  - id: factory
    part: ["数字工厂", "Digital factory"]
    slide:
      layout: points
      tag: ["课后", "After class"]
      title: ["数字工厂实验 18：保养时机的决策", "Digital-factory Lab 18: timing preventive maintenance"]
      points:
        - ["手算逾期设备的概率和预期损失，平台核对", "Calculate the overdue machine's probability and expected loss; the platform checks"]
        - ["比较三个方案，提交后才看到中枢的建议", "Compare three options; see the hub's advice only after you submit"]
        - ["保养工单、挂牌上锁、验收；对比故障次数，估 MTBF", "Service order, lockout, acceptance; compare failures, estimate MTBF"]
      foot: ["车间 13 台设备都按本讲的威布尔模型老化，设备真会按这个概率坏", "All 13 machines age by this lecture's Weibull model and really fail with these probabilities"]
    say:
      zh:
        - ">课后要在问渠数字工厂里做实验 18。车间里 13 台设备都按我们今天的威布尔模型老化，真会按这个概率坏。"
        - ">先手算逾期设备的概率和预期损失，平台自动核对；再在指挥台比较三个方案，选一个写理由。提交之前，看不到厂情中枢的推荐。"
        - ">然后发起保养工单，老师批准，挂牌上锁、保养、验收解锁。最后让车间继续跑，对比保养过和没保养的设备各坏了几次，估一个 MTBF。"
      en:
        - ">After class you'll do Lab 18 in the WenQuest digital factory. All 13 machines on the floor age by today's Weibull model and really fail with these probabilities."
        - ">First calculate the overdue machine's probability and expected loss, and the platform checks it. Then compare the three options in the command centre, choose one and give reasons. Until you submit, the factory hub's recommendation stays hidden."
        - ">Then raise the service order, the instructor approves it, and you go through lockout, service and acceptance. Finally let the shop keep running, count failures on serviced and unserviced machines, and estimate the MTBF."

  - id: homework
    part: ["作业", "Assignment"]
    slide:
      layout: points
      tag: ["课后", "After class"]
      title: ["作业 6：保养时机与保养周期", "Assignment 6: when to service and how often"]
      points:
        - ["计算：GRD-01 拖到 800 h；数控车床现在保养划不划算", "Compute: GRD-01 left to 800 h; does servicing the CNC lathe now pay?"]
        - ["设计：用 C(T) 求数控车床的最优周期", "Design: the CNC lathe's optimal interval from C(T)"]
        - ["实验 18 报告：方案比较、你的选择与中枢建议", "Lab 18 report: options, your choice against the hub's advice"]
      foot: ["作业和报告都在问渠学习平台提交", "Submit both on WenQuest"]
    say:
      zh:
        - ">作业一共三题。第一题计算：磨床拖到 800 小时再处理，概率和预期损失是多少；再换一台数控车床，判断现在保养划不划算，说说为什么和磨床的结论不同。"
        - ">第二题设计：用 C(T) 求数控车床的最优保养周期，跟现行 600 小时比一比。"
        - ">第三题是实验 18 的报告，重点写方案比较，和你的选择与中枢建议的对照。"
      en:
        - ">The assignment has three tasks. One, calculation: if the grinder is left until 800 hours, what are the probability and expected loss? Then a CNC lathe: does servicing it now pay, and why is the answer different from the grinder's?"
        - ">Two, design: use C of T to find the lathe's optimal interval and compare it with the current 600 hours."
        - ">Three, the Lab 18 report, focusing on how you compared the options and how your choice compares with the hub's advice."

  - id: quiz
    part: ["测验", "Quiz"]
    slide:
      layout: points
      tag: ["课后", "After class"]
      title: ["课后测验：10 题，即时反馈", "After-class quiz: 10 questions, instant feedback"]
      points:
        - ["β < 1 的设备，该不该缩短保养周期？", "β < 1: should you shorten the service interval?"]
        - ["运行 300 h 的磨床，未来 80 h 坏掉的概率多大？", "A grinder at 300 h: chance of failing in the next 80 h?"]
        - ["可做三次，提交后立刻看到解析", "Three attempts, explanations as soon as you submit"]
    say:
      zh:
        - ">学完还有一份十道题的测验，比如：β 小于 1 的设备，该不该缩短保养周期？"
        - ">刚保养完运行了 300 小时的磨床，未来 80 小时坏掉的概率多大？"
        - ">测验可以做三次，提交后马上能看到解析。"
      en:
        - ">There's also a ten-question quiz. For example, for a machine with beta below one, should you shorten the service interval?"
        - ">A grinder 300 hours after its last service: what's its chance of failing in the next 80 hours?"
        - ">You can take the quiz three times, and the explanations appear as soon as you submit."

outro:
  zh:
    - 虚拟实验、数字工厂实验、作业和测验都在问渠学习平台，免费注册就能学。
    - 下一讲，我们看人员与排班：主力技工请假了，产能和交期怎么保。我们下一讲见。
  en:
    - The virtual labs, the digital-factory lab, the assignment and the quiz are all on the WenQuest learning platform, at [learn.wenquestrobotics.com|learn dot wen quest robotics dot com]. Sign up for free and start learning.
    - Next time it's people and shifts, and what to do when a key technician is away. See you then.
