# 首页视频简介 07 · 数字工厂（第 86 轮；第 101 轮重出“四座厂”）。讲稿见 ../讲稿_第二批.md 第 07 段（Eddie 已审），配音逐字照表里的中文、English。
# 画面：本机起的教学版数字工厂真界面截图，加官网“工厂演示”页。数字工厂界面只有中文，英文版用同一批截图、英文要点和配音。
#   - 第 86 轮截的（减速器厂实验 7 情景在跑、机器人厂）：fac-*、rob-*、site-factory，这次没重截。
#   - 第 101 轮 11-08 新截：电路板厂 pcb-3d、pcb-fct（端口 8142，WQ_PLANT_FILE=factory/plants/wenquest-pcb.yaml），
#     芯片封测厂 chip-3d、chip-wafer（端口 8143，wenquest-chip.yaml）。两座厂各自一套总线、mock_erpnext、Node-RED 桥接和 sim，
#     用 factory/digital/tests/plant_loop.py 各接一张订单走完（DRV-JOINT、WQ-ENCIF），功能测试台、晶圆图才有内容；
#     截这四张时只跑了 capture 里这四行（别的行重跑会覆盖第 86 轮的图）。
#   - 封面 park-4：没有“工业园全景”这个界面，用四座厂各自的 3D 车间截图（fac-3d、rob-3d、pcb-3d、chip-3d）拼成 2×2 一张
#     （PIL 缩到 954×537 平铺，不加任何画的东西），所以“四座厂依次亮起”做不到，是四座厂同时出现。
