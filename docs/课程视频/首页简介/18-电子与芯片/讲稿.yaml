# 首页视频简介 18 · 电子与芯片（第 101 轮讲稿，Eddie 已审）。讲稿见 ../讲稿_第二批.md 第 18 段，画面、中文、英文照表里的写。
# 画面全是真界面截图（2026-11-08 本机截）：
#   - 官网首页“电子与芯片”一组（site/，intro_shots.py 直接截）；
#   - 电路分析 /circuit、虚拟仪器 /instruments、电路板设计 /pcb-design（含 B 版“固件”标签）、芯片设计 /chip-design、
#     电路板厂功能测试台 /fct：本机教学版数字工厂（hub 端口见 capture；起法见 ../README.md）。电路分析、虚拟仪器要计算服务：
#     本机另起 `uvicorn cae.service:app --port 8200`（factory/digital，WQ_CAE_DATA 指一个临时目录），枢纽加 WQ_CAE_URL=http://127.0.0.1:8200；
#     功能测试台要先有做过功能测试的板（tests/plant_loop.py 接一张 DRV-JOINT 订单走完，桥接 Node-RED 要起）。
#   - 问渠电子 /eda/（起草台）、/eda/factory/（问渠贴片）：本机 `uvicorn app:app --port 8150`（services/eda，先装 requirements.txt），
#     截图时 WQ_PROXY=eda=8150。起草台本机没有接 AI 模型，画面是填好示例需求、还没点“AI 起草”的页面；问渠贴片用“演示资料包”真跑检查
#     （演示资料包故意漏了 C47 的物料编号，演示工厂是虚构的）。问题单要 AI 起草，本机截不到，画面停在检查结果。
# 数字工厂界面只有中文，英文版用同一张图；官网、问渠电子按语言各截一张（问渠贴片的检查结果文字只有中文）。
