# 首页视频简介 15 · 问渠凸轮与问渠轴承（第 86 轮第二批）。画面：本机起的凸轮、轴承服务（services/cam、services/bearing + apps/ 网页）
# 的真界面，用 intro_shots.py 的 WQ_PROXY="cam=8301,bearing=8302" 按 /cam/、/bearing/ 截；软件自带中英界面。
standalone: true
langs: [zh, en]
title: [问渠凸轮与问渠轴承：网页里的行业设计软件, 'WenQuest Cam and WenQuest Bearing: industry design software in the browser']
brand: [行业软件, Industry software]
deck_html: {en: 课件/index.html, zh: 课件/index.zh.html}
note: [画面里的示例尺寸和参数是演示用的虚构数据。, 'Example sizes and parameters shown are fictional demo data.']
tags:
  zh: [凸轮设计, 凸轮机构, 轴承设计, 轴承选型, 机械设计, 有限元, SPC, FreeCAD, 问渠]
  en: [cam design, cam mechanism, bearing design, mechanical design, FEA, SPC, FreeCAD, WenQuest]
pace: {speed: 1.0, head: 0.5, pause: 0.15, tail: 0.6, hold: 0.3, xfade: 0.4}
capture:
  - {name: cam-single, url: /cam/, wait: 3000}
  - {name: cam-sys, url: /cam/, select: ["select >> nth=0", 1], wait: 2000}
  - {name: cam-3d, url: /cam/, select: ["select >> nth=0", 1], click: 'button:text-is("三维与制造")', click_en: 'button:text-is("3D & manufacturing")', wait: 6000}
  - {name: cam-cae, url: /cam/, select: ["select >> nth=0", 1], click: 'button:text-is("CAE 分析")', click_en: 'button:text-is("CAE analysis")', wait: 6000}
  - {name: brg, url: /bearing/, wait: 3000}
  - {name: brg-asm, url: /bearing/, click: ['button:text-is("合套选配")', 'button:text-is("用合成数据试一试")', 'button:text-is("配套")'],
     click_en: ['button:text-is("Selective assembly")', 'button:text-is("Try with synthetic data")', 'button:text-is("Match")'], wait: 2500}
  - {name: brg-spc, url: /bearing/, click: ['button:text-is("检测与 SPC")', 'button:text-is("控制图与过程能力")', 'button:text-is("用合成数据试一试")', 'button:text-is("画控制图")'],
     click_en: ['button:text-is("Inspection & SPC")', 'button:text-is("Control charts")', 'button:text-is("Try with synthetic data")', 'button:text-is("Plot")'], wait: 2500}
  - {name: brg-parts, url: /bearing/, click: 'button:text-is("零件图与三维")', click_en: 'button:text-is("Parts & 3D")', wait: 5000}
