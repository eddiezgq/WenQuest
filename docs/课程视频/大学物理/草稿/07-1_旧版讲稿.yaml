book: physics
lecture: 41
section: "7.1"
title: {zh: "摩擦：静摩擦、动摩擦与摩擦因数的测量", en: "Friction: Static, Kinetic, and How to Measure It"}
chapter: {zh: "第 7 章 牛顿定律的应用", en: "Chapter 7 Applying Newton's Laws"}
