        - ">有问题可以到课程讨论区提问，每项作业、测验的得分在成绩页一目了然。"
      en:
        - Everything in this lecture is on the WenQuest learning platform.
        - ">You can open today's interactive slides and the prototype bench and work them yourself; the power budget, E-stop, state machine, auto backtack and edge stop that this video skipped are in the slides."
        - ">You submit the assignment and the lab report on the platform, and get marks and comments back."
        - ">Questions go to the course discussion forum, and the grades page shows your mark on every assignment and quiz."

  - id: homework
    part: ["作业", "Assignment"]
    slide:
      layout: points
      title: ["作业 20：事件表、标定与包缝机链线", "Assignment 20: event table, calibration and overlock chain"]
      points:
        - ["350 r/min 剪线：通电角、松线最晚角、≤ 20°？", "Trim at 350 r/min: command, latest release, ≤ 20°?"]
        - ["下行 296.3°、上行 125.9°：偏置写多少", "296.3° down, 125.9° up: what offset?"]
        - ["包缝机 6000 r/min：几针停车、何时减速", "Overlock at 6000 r/min: stitches to stop, when to brake"]
      foot: ["3–4 页 PDF 报告，附实验 20-1 截图，在问渠学习平台提交。", "A 3–4 page PDF with Lab 20-1 screenshots, submitted on WenQuest."]
    say:
      zh:
        - ">作业一共四道题。第一题，剪线转速改成 350 转，吸合延迟还是 6.2 到 9.4 毫秒，求吸合折算转角、使进刀居中的剪线通电角和松线通电角的最晚值，看满不满足 20 度的平台指标，并在虚拟实验里验证。"
        - ">第二题，另一台原型在针杆离上止点 12 毫米处，下行读到 296.3 度，上行读到 125.9 度，求应写入的偏置；那里针杆每度走约 0.28 毫米，百分表 0.01 毫米对应多少度？"
        - ">第三题，包缝机原型以 6000 转缝纫，针距 2.5 毫米，布边传感器在针前 30 毫米，链线要 35 毫米，7000 转减速到停要 15.8 转、与转速平方成正比，求布走后缝几针停车、第几针开始减速，不提前减速链线多出多长。第四题讨论：为什么停针误差和剪线成功率要分成两条需求，要把原型推进到下一阶段，你先补哪三项测试。"
        - 报告在问渠学习平台上提交。
      en:
        - ">Your assignment has four questions. One: the trimming speed becomes 350 r/min, with the same 6.2 to 9.4 millisecond pull-in. Find the pull-in angle, the trim command that centres the knife entry and the latest release command, check them against the 20 degree platform limit, and verify them in the virtual lab."
        - ">Two: on another prototype, 12 millimetres below top dead centre, the encoder reads 296.3 degrees going down and 125.9 coming up. Find the offset to write. There the needle bar moves about 0.28 millimetres per degree; how many degrees is the gauge's 0.01 millimetre?"
        - ">Three: the overlock prototype sews at 6000 r/min with a 2.5 millimetre stitch, the edge sensor 30 millimetres ahead of the needle and a 35 millimetre chain; braking from 7000 r/min takes 15.8 revolutions, scaling with speed squared. How many stitches after the fabric leaves until it stops, at which stitch does braking start, and how much extra chain without early braking? Four is a discussion: why are stop error and trim success two separate requirements, and which three tests would you add first to take the prototype to the next stage?"
        - Submit the report on the WenQuest platform.

  - id: quiz
    part: ["测验", "Quiz"]
    slide:
      layout: points
      title: ["课后测验：10 题，即时反馈", "After-class quiz: 10 questions, instant feedback"]
      points:
        - ["500 r/min 剪线：通电角取多少？", "Trimming at 500 r/min: what command angle?"]
        - ["拨线、抬压脚为什么按时间而不按转角？", "Why are wipe and foot lift timed, not angled?"]
        - ["可以做三次，交卷后立刻看到解析", "Three attempts, explanations as soon as you submit"]
    say:
      zh:
        - ">学完还有一份十道题的测验，比如：剪线转速 500 转，吸合延迟 6.2 到 9.4 毫秒，动刀窗口 300 到 330 度，使进刀居中的剪线通电角是多少？"
        - ">再比如：事件表里拨线和抬压脚，为什么以停稳为起点、按时间安排，而不按转角？"
        - ">这份测验可以做三次，交卷后马上能看到每题的解析。"
      en:
        - ">There's also a ten-question quiz. For example, trimming at 500 r/min with a 6.2 to 9.4 millisecond pull-in and a 300 to 330 degree knife window, what command angle centres the entry?"
        - ">Or, why are the wiper and the foot lift timed from the stopped flag, rather than scheduled by angle?"
        - ">You get three attempts, and the explanations appear as soon as you submit."

