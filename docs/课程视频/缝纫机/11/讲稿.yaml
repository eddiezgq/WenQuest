code: [ch11]
title: ["典型特种机的机构：一个缝纫头，加一套平面运动", "Mechanisms of Typical Special Machines: a Sewing Head plus a Planar Motion"]
chapter: ["第三篇 包缝、绷缝与链缝 · 第 11 章", "Part III Overlock, Coverstitch and Chainstitch · Chapter 11"]
