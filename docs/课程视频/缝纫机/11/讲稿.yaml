tags:
  zh: [之字缝机, 锁眼机, 钉扣机, 套结机, 电脑刺绣机, 运动规律, 缝纫机设计]
  en: [zigzag sewing machine, buttonholer, button sewer, bartacker, embroidery machine, motion law, sewing machine design]

intro:
  zh:
    - 同学们好，欢迎来到问渠。
    - 这是《缝纫机设计与制造》第十一讲，典型特种机的机构。
    - 衬衫上的扣眼、钉好的纽扣、裤袢两端的套结、内衣上的松紧带之字线，都出自特种机。它们看起来五花八门，结构却一样：一个缝纫头，加上针或布在平面里的运动。今天以之字缝机为主线，看横摆放在哪段转角、用什么运动规律、摆宽受什么限制。
  en:
    - Hi everyone, and welcome back to Sewing Machine Design and Manufacturing at WenQuest.
    - This is Lecture 11, the mechanisms of typical special machines.
    - The buttonholes on a shirt, the buttons sewn on it, the bartacks at the ends of a belt loop, the zigzag that holds the elastic in underwear. All of them come from special machines. They look very different, but they share one structure. A sewing head, plus a motion of the needle or the fabric in a plane. Today we follow the zigzag machine. Where in the turn of the shaft does the swing belong, which motion law should it follow, and what limits the bight?

after:
  - id: lab111
    kind: lab
    lab: zigzag
    part: ["虚拟实验", "Virtual lab"]
    viewport: [1600, 900]
    steps:
      - js: "(() => { document.body.style.zoom = '0.8'; window.scrollTo(0, 0); const s = document.createElement('style'); s.textContent = '#checks, #wv, #fsv, #fev, #rlv, #msg { filter: blur(7px) grayscale(1); }'; document.head.appendChild(s); const p = document.getElementById('tasks').closest('section'); p.style.filter = 'blur(7px) grayscale(1)'; })()"
        press: "#reset"
      - set: {fs: 250, fe: 110}
      - press: ["#reset", "#mess"]
        js: "window.scrollTo(0, 0)"
      - press: "#reset"
        js: "(() => { window.scrollTo(0, 0); const s = document.getElementById('law'); s.selectedIndex = 1; s.dispatchEvent(new Event('change', {bubbles: true})); })()"
      - sweep: {fe: [85, 60]}
        dur: 6
      - press: "#reset"
        js: "window.scrollTo(0, 0)"
        sweep: {w: [8, 11.5]}
        dur: 8
    say:
      zh:
        - ">下面是虚拟实验 11-1，之字缝的摆针定时与钩线，在问渠平台上可以亲手做。判据读数、调整量和任务这里先遮住，留给你自己读。"
        - ">先把摆动开始改到 250 度、结束改到 110 度：左边针尖路径上出现红色段，横摆伸进了针在布里的时段。"
        - ">任务一，按“打乱”：区间、规律、旋梭定时都被改乱。先调摆动开始和结束，让横摆离开红色区段，再调旋梭定时，直到四条判据全部满足。"
        - ">恢复标准，把运动规律换成摆线。在平台上把修正梯形、摆线、简谐都试一遍，记下横向惯性力，除以 0.15 千克就是峰值加速度，和前面的算例对照。"
        - ">任务二，用摆线，把区间一点点收窄，找出惯性力不超过 250 牛、横摆又全在布外的最窄区间，自己读数，填进报告。"
        - ">最后恢复标准，慢慢加大摆宽，看右边的线迹图里没钩住的叉是怎样出现的。这里只看现象；任务三要先把旋梭定时调到窗口上边，再找最大摆宽，填进任务框核对。指导书和报告模板在平台上下载。"
      en:
        - ">Now Virtual lab 11-1, zigzag swing timing and loop catching. On the WenQuest platform you can do it yourself. The readings of the four criteria, the values of the settings and the tasks are blurred here, so you can read them yourself on the platform."
        - ">First set the swing start to 250 degrees and the end to 110. A red segment appears on the needle path on the left: the swing has run into the time the needle is in the fabric."
        - ">Task one: press Scramble. The interval, the law and the hook timing are all thrown off. Adjust the swing start and end first, until the swing leaves the red segment, then the hook timing, until all four criteria pass."
        - ">Reset, and switch the motion law to cycloidal. On the platform, try modified trapezoid, cycloidal and harmonic in turn. Note the sideways inertia force, divide by 0.15 kilograms to get the peak acceleration, and compare with the worked example."
        - ">Task two: with the cycloidal law, narrow the interval step by step. Find the narrowest interval that keeps the force at or under 250 newtons and the swing entirely out of the fabric. Read it yourself and put it in your report."
        - ">Finally, reset and slowly widen the bight. Watch how crosses for missed catches appear in the stitch view on the right. This only shows the effect. For task three, first set the hook timing to the top of the window, then find the maximum bight and enter it in the task box to check. The guide and the report template are on the platform."

