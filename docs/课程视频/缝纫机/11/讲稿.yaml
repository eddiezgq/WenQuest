  - id: homework
    part: ["作业", "Assignment"]
    slide:
      layout: points
      title: ["作业 11：之字缝机加大摆宽的可行性核算", "Assignment 11: can the zigzag bight be widened?"]
      points:
        - ["摆宽 10 mm：两种规律的惯性力与最高转速", "A 10 mm bight: force and top speed under two laws"]
        - ["摆宽 6 mm、10 mm 的钩线时刻差；10 mm 两端能否都钩住", "Catch difference at 6 and 10 mm; can 10 mm be caught at both ends?"]
        - ["套结机步距 5 mm → 8 mm 的降速；刺绣机提速的两条措施", "Bartacker step 5 → 8 mm: how much slower; two ways to speed up embroidery"]
      foot: ["计算过程与结果表、实验 11-1 任务二和任务三截图、2 页以内的讨论，在问渠学习平台提交。", "Working and a results table, Lab 11-1 Task 2 and 3 screenshots, and up to 2 pages of discussion, submitted on WenQuest."]
    say:
      zh:
        - ">作业一共四道题。第一题，摆宽加到 10 毫米，其余同开头的问题，分别按修正梯形和摆线，求每分钟 5000 转时的惯性力和不超限的最高转速。"
        - ">第二题，旋梭半径 13.5 毫米，求摆宽 6 毫米和 10 毫米时两端钩线的时刻差；按本讲借用的窗口，右端最早约 198 度、左端最晚约 218 度，判断 10 毫米能不能两端都钩住，和说明书的最大摆宽比一比，说明为什么要实测。"
        - ">第三题，电子套结机压框每步 5 毫米，移动区间 170 度、修正梯形，求每分钟 3200 针时的峰值加速度；步距加大到 8 毫米、加速度不许超过这个值，转速要降到多少？第四题讨论：刺绣机只有平缝机四分之一左右的转速，提出两条提速措施，说明各自的代价。"
        - 计算过程、实验截图和讨论，都在问渠学习平台上提交。
      en:
        - ">Your assignment has four questions. One: the bight grows to 10 millimetres, with everything else as in the opening problem. For the modified-trapezoid and the cycloidal laws, find the inertia force at 5000 r/min and the highest speed that stays within the limit."
        - ">Two: the hook radius is 13.5 millimetres. Find the catch difference between the two ends for bights of 6 and 10 millimetres. Using the loop window borrowed in this lecture, right end at the earliest about 198 degrees and left end at the latest about 218, decide whether 10 millimetres can be caught at both ends. Compare with the manual, and explain why it has to be measured."
        - ">Three: an electronic bartacker moves its clamp 5 millimetres a step, over 170 degrees, with a modified trapezoid. Find the peak acceleration at 3200 stitches a minute. If the step grows to 8 millimetres with no more acceleration allowed, how far must the speed drop? Four, for discussion: an embroidery machine runs at about a quarter of lockstitch speed. Propose two ways to speed it up, and the cost of each."
        - Submit your working, the lab screenshots and the discussion on the WenQuest platform.

  - id: quiz
    part: ["测验", "Quiz"]
    slide:
      layout: points
      title: ["课后测验：10 题，即时反馈", "After-class quiz: 10 questions, instant feedback"]
      points:
        - ["8 mm、5000 r/min、170°，修正梯形：峰值加速度约多少？", "8 mm, 5000 r/min, 170°, modified trapezoid: peak acceleration?"]
        - ["转速 5000 → 6000 r/min：加速度变为几倍？", "5000 → 6000 r/min: by what factor does it grow?"]
        - ["可以做三次，交卷后立刻看到解析", "Three attempts, explanations as soon as you submit"]
    say:
      zh:
        - ">学完还有一份十道题的测验，比如：摆宽 8 毫米、每分钟 5000 转、摆动区间 170 度，修正梯形的峰值加速度约是多少？"
        - ">再比如：其他不变，转速从 5000 提到 6000，峰值加速度变为原来的几倍？还有一道判断题：梭尖从右向左扫，是不是左端先被钩住？"
        - ">这份测验可以做三次，交卷后马上能看到每题的解析。"
      en:
        - ">There's also a ten-question quiz. For example, with an 8-millimetre bight, 5000 r/min and a 170-degree swing, what is the peak acceleration under the modified trapezoid?"
        - ">Or, with everything else the same, the speed goes from 5000 to 6000. By what factor does the peak acceleration grow? And a true-or-false: the hook point sweeps right to left, so is the left end caught first?"
        - ">You get three attempts, and the explanations appear as soon as you submit."

