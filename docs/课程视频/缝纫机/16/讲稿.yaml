        - ["可以做三次，交卷后立刻看到解析", "Three attempts, explanations as soon as you submit"]
    say:
      zh:
        - ">学完还有一份九道题的测验，比如：窗口 204°，主轴每分钟 900 转，绷架按摆线规律走 4 毫米一针，峰值加速度大约多少？"
        - ">再比如：回退针数比检测延迟少，会出现什么结果？还有题问 DST 文件里有没有颜色值。"
        - ">这份测验可以做三次，交卷后马上能看到每题的解析。"
      en:
        - ">There's also a nine-question quiz. For example, with a 204-degree window, the shaft at 900 r/min and a 4 millimetre cycloidal move, what is the peak acceleration?"
        - ">Or, if the back-up count is smaller than the detection delay, what happens? Another asks whether a DST file stores colour values."
        - ">You get three attempts, and the explanations appear as soon as you submit."

