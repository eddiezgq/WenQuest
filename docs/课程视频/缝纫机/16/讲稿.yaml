  - id: homework
    part: ["作业", "Assignment"]
    slide:
      layout: points
      title: ["作业 16：转速、绣花文件与效率核算", "Assignment 16: speed, design files and efficiency"]
      points:
        - ["12 头机：3、5、7 mm 的转速上限与驱动力", "12 heads: limits for 3, 5, 7 mm, and the drive force"]
        - ["DST：45 mm 跳步、45° 走 40 mm 要几条记录", "DST: records for a 45 mm jump and 40 mm at 45°"]
        - ["效率：缩短处理时间，还是降低断线率", "Efficiency: shorter handling or fewer breaks?"]
      foot: ["2–3 页计算报告（PDF），附虚拟实验 16-1 四个任务完成状态的截图，在问渠学习平台提交。", "A 2–3 page calculation report (PDF) with screenshots of the four Lab 16-1 tasks, submitted on WenQuest."]
    say:
      zh:
        - ">作业一共四道题。第一题，一台 12 头机，驱动力 1000 牛，求 3、5、7 毫米针长的转速上限；要让 7 毫米缎纹也跑 800 转，驱动力至少多大？"
        - ">第二题是绣花文件，这段视频里没讲，课件和教材里有：DST 文件每条记录每个方向最多 12.1 毫米，沿 X 方向 45 毫米的跳步、沿 45° 走 40 毫米，各要几条记录？机器又怎样判断什么时候剪线？"
        - ">第三题，12 头机绣 15000 针，估算全机效率和每小时件数，再比较把处理时间缩短到 20 秒和把断线率减半，哪种更值得投入。第四题讨论：检测延迟从 6 针降到 2 针有什么好处，断线检测器怎样设计才能更快发现断线。"
        - 计算报告和实验截图，都在问渠学习平台上提交。
      en:
        - ">Your assignment has four questions. One: a 12-head machine with 1000 newtons of drive. Find the speed limits for 3, 5 and 7 millimetre stitches, and the minimum drive force that lets the 7 millimetre satin run at 800 r/min too."
        - ">Two is about design files, which this video skipped; it's in the slides and the textbook. A DST record allows at most 12.1 millimetres per axis. How many records for a 45 millimetre jump along X, and for 40 millimetres at 45 degrees? And how does the machine decide when to trim?"
        - ">Three: a 12-head machine sews 15 000 stitches. Estimate efficiency and pieces per hour, then compare cutting handling to 20 seconds with halving the break rate. Which is more worth the money? Four is a discussion: what does cutting the detection delay from 6 stitches to 2 bring, and how could a detector find breaks faster?"
        - Submit the report and the lab screenshots on the WenQuest platform.

  - id: quiz
