code: [ch16]
title: ["电脑刺绣机控制——八个机头、一个绷架，能转多快", "Computerised Embroidery Machines — Eight Heads, One Frame: How Fast?"]
chapter: ["第五篇 电气控制 · 第 16 章", "Part V Electrical Control · Chapter 16"]
next: ["第 17 讲", "Lecture 17"]
cover_formula: 'n_{max} = \frac{204}{6}\sqrt{\frac{a_{max}}{2\pi s}}'
tags:
  zh: [电脑刺绣机, 多头刺绣机, 绷架, 离布窗口, 转速上限, 断线检测, 回退补绣, 全机效率, 缝纫机设计]
  en: [embroidery machine, multi-head embroidery, embroidery frame, off-fabric window, speed limit, thread-break detection, back-up and mending, machine efficiency, sewing machine design]

intro:
  zh:
    - 同学们好，欢迎来到问渠。
    - 这是《缝纫机设计与制造》第十六讲，电脑刺绣机控制。
    - 上一讲的花样机，一台机器缝一片布。今天的多头刺绣机，一根上轴带着八个、甚至二十个机头，一个大绷架带着所有布一起走。
    - 今天讲两件事：大绷架能转多快；一个头断线，全机怎么办，头数多了值不值。换色和绣花文件留给课件和作业。
  en:
    - Hi everyone, and welcome back to Sewing Machine Design and Manufacturing at WenQuest.
    - This is Lecture 16, control of computerised embroidery machines.
    - The pattern sewer from last time sews one piece at a time. Today's multi-head embroidery machine drives eight, even twenty heads from one main shaft, and one big frame carries every piece of fabric together.
    - Two questions today. How fast can a big frame go? And when one head breaks a thread, what does the whole machine do, and are more heads worth it? Colour changes and design files are left to the slides and the assignment.

after:
  - id: lab161
    kind: lab
    lab: embroid
    part: ["虚拟实验", "Virtual lab"]
    viewport: [1600, 900]
    steps:
      - js: "(() => { document.body.style.zoom = '1'; window.scrollTo(0, 0); const s = document.createElement('style'); s.textContent = '#checksA, #checksB { filter: blur(7px) grayscale(1); }'; document.head.appendChild(s); document.getElementById('tasks').closest('section').style.filter = 'blur(7px) grayscale(1)'; window.__mask = () => { const c = document.getElementById('tl'); const sec = c.parentElement; sec.style.position = 'relative'; let m = document.getElementById('wqmask'); if (!m) { m = document.createElement('div'); m.id = 'wqmask'; sec.appendChild(m); } m.style.cssText = 'position:absolute;left:' + c.offsetLeft + 'px;top:' + c.offsetTop + 'px;width:' + c.offsetWidth + 'px;height:' + Math.round(c.offsetHeight * 0.24) + 'px;backdrop-filter:blur(7px) grayscale(1);-webkit-backdrop-filter:blur(7px) grayscale(1);background:rgba(240,242,240,.35)'; }; })()"
        press: ["#tabA", "#resetA"]
      - sweep: {s: [3, 7]}
        dur: 6
      - sweep: {H: [8, 13]}
        dur: 6
      - set: {H: 8, n: 850}
        sweep: {F: [800, 1050]}
        dur: 6
      - sweep: {s: [7, 12.5]}
        dur: 4
      - js: "(() => { document.getElementById('tabB').click(); document.getElementById('resetB').click(); window.__mask(); })()"
      - press: "#rerun"
        sweep: {H2: [8, 20]}
        dur: 6
      - set: {H2: 8, d: 6}
        sweep: {b: [2, 5]}
        dur: 5
      - set: {H2: 20, b: 8}
        sweep: {lam: [0.5, 0.3]}
        dur: 6
    say:
      zh:
        - ">下面是虚拟实验 16-1，多头刺绣机，在问渠平台上可以亲手做。右边的判据和下面的任务这里先遮住，留给你自己读。第一页是绷架与转速：上面是一针里的绷架运动，下面是转速上限随针长变化的曲线。"
        - ">先把针长从 3 毫米拉到 7 毫米。看上图，虚线加速度越来越高，顶破了红线；下图的红点也跑到了曲线上方。"
        - ">任务一，针长 7 毫米，把头数从 8 往上加，曲线一路往下掉。15 头时上限是多少，先用公式算，填进下面核对，再拖滑块验证。"
        - ">任务二，回到 8 头，转速定在 850，把驱动力往上加，验证刚才回答页算的驱动力是不是正好让判据全部通过，记下最小值。"
        - ">再把针长拉过 12.1 毫米，看下图，红点走进右边“单方向超过 DST 上限”的阴影区。这样的一针该怎么处理，写进报告。"
        - ">第二页是断线与补绣。上面是绣一个花样的时间线，绿色缝纫、红色断线停车、紫色换色；下面是头数和全机效率的曲线。"
        - ">按“再绣一次”，断线位置每次都不一样；再把头数从 8 加到 20，效率曲线上的点一路往下走。"
        - ">任务三，检测延迟设成 6 针，从小往大调回退针数。退几针才不留漏针、又不多退，自己找。"
        - ">任务四，20 头机，把断线率一点点往下调，看效率怎么涨；降到多少才到 80%，再改成缩短处理时间试一次，比较哪种办法更划算。指导书和报告模板在平台上下载。"
      en:
        - ">Now Virtual lab 16-1, the multi-head embroidery machine. On the WenQuest platform you can do it yourself. The criteria on the right and the tasks below are blurred here, so you can read them on your own. Page one is frame and speed: on top, the frame's motion through one stitch; below, the speed limit against stitch length."
        - ">First, pull the stitch length from 3 up to 7 millimetres. In the top chart the dashed acceleration climbs and breaks through the red line, and in the lower chart the red dot moves above the curve."
        - ">Task one: at 7 millimetres, raise the heads from 8. The curve keeps falling. Work out the limit for fifteen heads with the formula, enter it below to check, then confirm with the sliders."
        - ">Task two: back to eight heads, set the speed to 850 and raise the drive force. Check that the force from the answer slide is just enough for every criterion to pass, and record the minimum."
        - ">Now push the stitch length past 12.1 millimetres. In the lower chart the dot enters the shaded Over DST limit zone. How such a stitch must be handled goes in your report."
        - ">Page two is thread breaks and repair. On top is the timeline of one design, green for sewing, red for thread-break stops, purple for colour changes; below, efficiency against head count."
        - ">Press Run again, and the breaks land somewhere different each time. Then raise the heads from 8 to 20, and the dot slides down the efficiency curve."
        - ">Task three: set the detection delay to 6 stitches, then raise the back-up count step by step. How many leave no missed stitches without backing up too far? That's yours to find."
        - ">Task four: on twenty heads, lower the break rate bit by bit and watch efficiency rise. How low must it go to reach 80 percent? Then try shortening the handling time instead, and compare which pays off better. The guide and report template are on the platform."

