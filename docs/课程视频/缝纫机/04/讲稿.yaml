    - 课件、虚拟实验、三维样机、作业和测验都在问渠学习平台，免费注册就能学。
    - 下一讲，我们看钩线机构，看旋梭怎样在对的时刻钩住线环。我们下一讲见。
  en:
    - The slides, the virtual lab, the 3D prototype, the assignment and the quiz are all on the WenQuest learning platform, at [learn.wenquestrobotics.com|learn dot wen quest robotics dot com]. Sign up for free and start learning.
    - Next time, the hook mechanism, and how the rotary hook catches the loop at just the right moment. See you then.
