  - id: lab301
    kind: lab
    lab: soft
    part: ["虚拟实验", "Virtual lab"]
    viewport: [1600, 900]
    steps:
      - js: "(() => { document.body.style.zoom = '0.8'; window.scrollTo(0, 0); const st = document.createElement('style'); st.textContent = '#checks0,#checks1,#checks2,#tasks,#msg,#pay{filter:blur(7px) grayscale(1)}'; document.head.appendChild(st); document.querySelectorAll('p.note').forEach(n => { n.style.visibility = 'hidden'; }); document.getElementById('tab0').click(); const s = document.getElementById('preset'); [0, 1, 2, 3, 4, 5].forEach((v, i) => setTimeout(() => { s.value = v; s.dispatchEvent(new Event('input', {bubbles: true})); }, 600 + i * 1300)); })()"
        dur: 9
      - js: "(() => { const s = document.getElementById('preset'); s.value = 1; s.dispatchEvent(new Event('input', {bubbles: true})); const f = (id, v) => { const e = document.getElementById(id); e.value = v; e.dispatchEvent(new Event('input', {bubbles: true})); }; [160, 220, 300, 400].forEach((v, i) => setTimeout(() => f('W', v), 800 + i * 700)); [25, 32, 40, 50].forEach((v, i) => setTimeout(() => f('c', v), 4200 + i * 700)); })()"
        dur: 8
      - js: "(() => { const f = (id, v) => { const e = document.getElementById(id); e.value = v; e.dispatchEvent(new Event('input', {bubbles: true})); }; f('c', 20); [24, 18, 12].forEach((v, i) => setTimeout(() => f('b', v), 800 + i * 900)); })()"
        dur: 6
      - js: "(() => { document.getElementById('tab1').click(); window.scrollTo(0, 0); document.getElementById('reset1').click(); const f = (id, v) => { const e = document.getElementById(id); e.value = v; e.dispatchEvent(new Event('input', {bubbles: true})); }; [0.975, 0.98, 0.975].forEach((v, i) => setTimeout(() => f('p', v), 2000 + i * 1300)); })()"
        dur: 8
      - js: "(() => { const f = (id, v) => { const e = document.getElementById(id); e.value = v; e.dispatchEvent(new Event('input', {bubbles: true})); }; f('p', 0.97); [30, 22].forEach((v, i) => setTimeout(() => f('price', v), 800 + i * 1000)); setTimeout(() => f('price', 25), 3200); setTimeout(() => f('sh', 3), 4400); })()"
        dur: 7
      - js: "(() => { document.getElementById('tab2').click(); window.scrollTo(0, 0); document.getElementById('reset2').click(); const f = (id, v) => { const e = document.getElementById(id); e.value = v; e.dispatchEvent(new Event('input', {bubbles: true})); }; [3200, 4000, 4800].forEach((v, i) => setTimeout(() => f('hr', v), 1500 + i * 1300)); })()"
        dur: 8
    say:
      zh:
        - ">下面是虚拟实验 30-1，软面料与机器人，在问渠平台上可以亲手做，判定结果、回收期曲线和任务先遮住。第①页“面料有多软”：在材料下拉框里依次选四种面料、卡纸和钢板，伸出 10 厘米，看橙线怎样从整条垂下到几乎不动，记下每种材料的弯曲刚度、弦角和推弯布条的力。"
        - ">再回到衬衫府绸，先只拖克重，看下垂形状变不变；再只拖弯曲长度，比一比两者谁在起作用。"
        - ">任务一和任务二也在这一页：一个是让弦角压到 10 度以内，算出要硬多少倍；一个是改推的布条宽度，看推力和自重的比值，再找推得动时的弯曲长度。"
        - ">第②页是机器人流程：从 10 步、97% 开始，记下无人完成率、每小时干预、每小时产量和回收期。任务三要找出无人完成率到 90% 时单步成功率最小是多少。"
        - ">任务四在两班、单步不超过 97%、步数不少于 10 的条件下，调价格、人工或每步时间，让回收期不超过 24 个月，再把班次改成三班比一比。"
        - ">第③页是直驱的节电账：用默认值记下全厂年耗电、年节电和减排，再调每台开机时间，任务五要让每台年节电达到规定的值。指导书和报告模板在平台上。"
      en:
        - ">Now Virtual lab 30-1, soft fabric and robots, which you can do yourself on WenQuest. The checks, the payback chart and the tasks are blurred. Page one, how soft is fabric: pick the four fabrics, card and steel in turn from the material list, with a 10-centimetre overhang. Watch the orange line go from hanging straight down to barely moving, and record each material's rigidity, chord angle and the force that buckles a strip."
        - ">Back on shirting poplin, drag only the weight and see whether the droop changes; then drag only the bending length, and compare which one matters."
        - ">Tasks one and two are on this page too: one asks you to bring the chord angle under 10 degrees and work out how much stiffer that is; the other changes the strip width, checks the push-to-weight ratio, and finds the bending length at which you can push."
        - ">Page two is the robot workflow. Start from ten steps at 97 percent and record unattended rate, interventions and output per hour, and payback. Task three asks for the lowest per-step success that reaches 90 percent unattended."
        - ">Task four keeps two shifts, at most 97 percent and at least ten steps, and asks you to tune price, wage or step time until payback is 24 months or less; then try three shifts."
        - ">Page three is the direct-drive energy account. Record the plant's annual use, saving and emissions at the defaults, then change the running hours; task five asks for a set saving per machine. The guide and report template are on the platform."

