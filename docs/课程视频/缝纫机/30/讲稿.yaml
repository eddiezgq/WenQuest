  - id: homework
    part: ["作业", "Assignment"]
    slide:
      layout: points
      title: ["作业 30：一份自动化提案的工程评估", "Assignment 30: engineering appraisal of an automation proposal"]
      points:
        - ["300 台改伺服：节电、电费、回收期、减排", "300 machines to servo: energy, cost, payback, CO₂"]
        - ["200 g/m²、c 25 mm：刚度、失稳力与自重", "200 g/m², c 25 mm: rigidity, buckling force, weight"]
        - ["8 步 98% 的上料方案：算账、索取数据、给建议", "8 steps at 98%: the sums, the data to ask for, advice"]
      foot: ["作业和实验报告都在问渠学习平台提交。", "Submit the assignment and the lab report on WenQuest."]
    say:
      zh:
        - ">作业一共三道题。第一题，一家工厂 300 台平缝机，每台每年开机 3000 小时，离合器电机平均 0.45 千瓦、伺服 0.25 千瓦，电价每度 0.7 元，每台改造 500 元：求年节电量、年省电费、回收期，以及按每度 0.57 千克算的年减排量。"
        - ">第二题，一种面料每平方米 200 克，弯曲长度 25 毫米：求弯曲刚度；一条长 5 厘米、宽 20 厘米的布条一端夹住往前推、另一端可以侧移，推力多大会拱起？和它的自重比一比，再说明夹持点离缝合点近一半时，临界力怎样变。"
        - ">第三题，供应商提出 8 步的机器人上料方案，单步 98%，其余条件和本讲相同：算出无人完成率、每小时干预和回收期，以及要 95% 无人完成单步至少要多少；再列出你还要向供应商要的数据，给出要不要试点的建议。"
        - 作业和实验报告都在问渠学习平台上提交。
      en:
        - ">The assignment has three questions. One: a factory has 300 lockstitch machines, each running 3000 hours a year; clutch motors average 0.45 kilowatts and servos 0.25, power costs 0.7 yuan a kilowatt-hour, and each retrofit costs 500 yuan. Find the annual energy and cost saving, the payback, and the annual CO2 reduction at 0.57 kilograms per kilowatt-hour."
        - ">Two: a fabric weighs 200 grams per square metre with a bending length of 25 millimetres. Find its bending rigidity. A strip 5 centimetres long and 20 wide is clamped at one end and pushed, its other end free to move sideways: at what force does it arch? Compare that with its weight, and say how the critical force changes if the clamp is moved to half the distance."
        - ">Three: a vendor proposes 8-step robot loading at 98 percent per step, everything else as in this lecture. Find the unattended rate, interventions per hour and payback, and the per-step rate needed for 95 percent unattended. Then list the data you'd still ask the vendor for, and recommend whether to pilot it."
        - Submit the assignment and the lab report on the WenQuest platform.

  - id: quiz
    part: ["测验", "Quiz"]
    slide:
      layout: points
      title: ["课后测验：10 题，即时反馈", "After-class quiz: 10 questions, instant feedback"]
      points:
        - ["克重相同，弯曲长度 2 倍：刚度几倍？", "Same weight, twice the bending length: how much stiffer?"]
        - ["只把克重加倍：下垂形状变不变？", "Double only the weight: does the droop change?"]
        - ["可以做三次，交卷后立刻看到解析", "Three attempts, explanations as soon as you submit"]
    say:
      zh:
        - ">学完还有一份十道题的测验，比如：两种面料克重相同，A 的弯曲长度是 B 的 2 倍，A 的弯曲刚度是 B 的几倍？"
        - ">再比如判断题：同一种面料只把克重加倍、弯曲长度不变，伸出 10 厘米时的下垂形状和弦角变不变？"
        - ">这份测验可以做三次，交卷后马上能看到每题的解析。"
      en:
        - ">There's also a ten-question quiz. For example: two fabrics weigh the same per square metre, and A's bending length is twice B's. How many times stiffer is A?"
        - ">Or true or false: for the same fabric, doubling only the weight while keeping the bending length leaves the droop and chord angle at a 10-centimetre overhang unchanged."
        - ">You get three attempts, and the explanations appear as soon as you submit."

