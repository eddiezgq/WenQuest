intro:
  zh:
    - 同学们好，欢迎来到问渠。
    - 这是《缝纫机设计与制造》第三十讲，缝制设备发展趋势。
    - 上一讲看了五类工厂怎样用设备；今天往前看十年，哪些变化已经在发生，哪些还要过几道门槛。
    - 这次视频重点讲省电和机器人上料；软件定义的缝纫机、不缝的衣服只点到为止，详细内容在课件里。
  en:
    - Hi everyone, and welcome back to Sewing Machine Design and Manufacturing at WenQuest.
    - This is Lecture 30, trends in sewing equipment.
    - Last time we saw how five kinds of factory use their machines. Today we look ten years ahead, at which changes are already happening and which still have hurdles to clear.
    - This video concentrates on saving power and robot loading; software-defined machines and garments without stitches get only a mention here, with the details in the slides.

