skip: [5, 6, 8, 14, 18, 20, 21, 22, 23, 26]   # 针距数字页、舌针成圈、选针器有多快、一趟行程（D 的组成在第 25 页讲稿里带到）、FPGA 选针通道图、第四节（章节页、三层转换、线圈长度闭环、全成型）、三个方案数字页（内容并进第 29 页回答页讲稿）：控制课程部分约 10 分钟；第四节留给课件、作业第三题和测验
code: [ch17]
title: ["电脑横机控制——几百枚针，在对的位置作对的决定", "Computerised Flat Knitting Machines — Hundreds of Needles, Each Decided at the Right Spot"]
chapter: ["第五篇 电气控制 · 第 17 章", "Part V Electrical Control · Chapter 17"]
next: ["第 18 讲", "Lecture 18"]
cover_formula: 'x_{cmd} = x_i - c - v\,T_d'
tags:
  zh: [电脑横机, 毛衣编织机, 选针, 舌针, 三角, 提前量, 按位置触发, FPGA, 换向余量, 缝纫机设计]
  en: [flat knitting machine, sweater knitting, needle selection, latch needle, knitting cams, selection lead, position-based triggering, FPGA, reversal margin, sewing machine design]

intro:
  zh:
    - 同学们好，欢迎来到问渠。
    - 这是《缝纫机设计与制造》第十七讲，电脑横机控制，也就是毛衣编织机。
    - 前面的缝纫机都是针在一个地方上下、布在走；横机反过来，针床不动，机头在上面来回扫，几百枚针每一趟都要各自决定织不织。
    - 今天讲三件事：针怎么被选中，为什么必须按位置、提前发令，一片前片要织多久。FPGA 选针通道、花型和线圈长度闭环留给课件和作业。
  en:
    - Hi everyone, and welcome back to Sewing Machine Design and Manufacturing at WenQuest.
    - This is Lecture 17, control of computerised flat knitting machines, the machines that knit sweaters.
    - On every sewing machine so far the needle works in one place while the fabric moves. A flat machine turns that around. The needle beds stay put, the carriage sweeps over them, and on every pass each of hundreds of needles decides whether to knit.
    - Three questions today. How is a needle selected? Why must the command go out early, by position? And how long does one front panel take? The FPGA selection channel, patterns and closed-loop control of loop length are left to the slides and the assignment.

after:
  - id: lab171
    kind: lab
    lab: knit
    part: ["虚拟实验", "Virtual lab"]
    viewport: [1600, 900]
    steps:
      - js: "(() => { document.body.style.zoom = '0.9'; window.scrollTo(0, 0); const s = document.createElement('style'); s.textContent = '#verdict { filter: blur(7px) grayscale(1); }'; document.head.appendChild(s); document.getElementById('k-p').closest('section').style.filter = 'blur(7px) grayscale(1)'; document.querySelector('ol.tasks').closest('section').style.filter = 'blur(7px) grayscale(1)'; })()"
        press: ["[data-slow='5']", "#play"]
      - set: {v: 0.4}
        press: "[data-comp=none]"
        sweep: {v: [0.4, 0.6]}
        dur: 6
      - js: "(() => { document.querySelector('[data-comp=fixed]').click(); for (const [k, v] of [['v', 1.2], ['c', 200]]) { const e = document.getElementById(k); e.value = v; e.dispatchEvent(new Event('input', {bubbles: true})); } })()"
        sweep: {c: [200, 80]}
        dur: 6
      - js: "(() => { document.querySelector('[data-comp=rt]').click(); const e = document.getElementById('c'); e.value = 40; e.dispatchEvent(new Event('input', {bubbles: true})); })()"
        sweep: {E: [7, 9]}
        dur: 5
      - set: {E: 12}
        sweep: {c: [40, 150]}
        dur: 5
      - js: "window.scrollTo(0, 0)"
    say:
      zh:
        - ">下面是虚拟实验 17-1，横机编织仿真，在问渠平台上可以亲手做。右下的结果和任务这里先遮住，留给你自己读。左上是针床和机头，红线是选针点；左下是织出来的线圈图；右边是花型和参数。现在是两色提花、固定提前量，慢放 5 倍在织。"
        - ">任务一，提前量选不补偿，把机头速度从 0.4 米每秒往上调。现在还没有红点；再往上调，第几档开始出现错选，自己找，再用 p 除以 v 和 v 乘 T_d 解释。"
        - ">任务二，换回固定提前量、速度 1.2，把换向余量从 200 毫米往下减。减到多少开始错选，错选出现在织物哪一侧、哪几针，为什么，写进报告。"
        - ">任务三，改成按实时速度补偿，换几个机号试一试，比较最大误差怎么变；不同机号下机头最多能跑多快，留给你自己找。"
        - ">任务四，回到 E12，把换向余量从 40 加到 150 毫米，比较结果区里一行用时和整片估算，想一想余量取多大合适。"
        - ">最后把选针器延迟从 0.8 改成 0.6 毫秒，再做一遍任务一，比较开始错选的速度怎么变。指导书和报告模板在平台上下载。"
      en:
        - ">Now Virtual lab 17-1, the flat knitting simulation. On the WenQuest platform you can do it yourself. The results and tasks at the lower right are blurred here, so you can read them on your own. Top left are the needle beds and the carriage, with the red line at the selection point; below it, the loops as they're knitted; on the right, the pattern and the parameters. It's knitting a two-colour jacquard with a fixed lead, slowed five times."
        - ">Task one: choose no lead and raise the carriage speed from 0.4 metres per second. No red dots yet. Keep going; at which step do mis-selections start? Find it yourself, then explain it with p over v and v times T_d."
        - ">Task two: back to a fixed lead at 1.2, and shrink the reversal margin from 200 millimetres. Where do errors start, on which side of the fabric and which needles, and why? That goes in your report."
        - ">Task three: switch to the real-time lead and try a few gauges, comparing how the maximum error changes. How fast the carriage can go on each gauge is yours to find."
        - ">Task four: back to E12, widen the reversal margin from 40 to 150 millimetres, and compare the time per course and the panel estimate in the results. How big should the margin be?"
        - ">Finally, change the selector delay from 0.8 to 0.6 milliseconds and repeat task one. How does the speed where errors begin change? The guide and report template are on the platform."

