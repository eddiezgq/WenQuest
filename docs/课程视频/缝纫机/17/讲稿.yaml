  - id: homework
    part: ["作业", "Assignment"]
    slide:
      layout: points
      title: ["作业 17：E14 横机织袖片", "Assignment 17: sleeves on an E14 machine"]
      points:
        - ["选针校核：t_n、不补偿的滞后、v_max", "Selection check: t_n, uncompensated lag, v_max"]
        - ["产量估算：一趟、一片，实时补偿省多少", "Output: per pass, per sleeve, saving with real-time lead"]
        - ["线圈长度闭环；讨论：一个针床并排织两片", "Loop-length loop; discussion: two sleeves side by side"]
      foot: ["2–4 页计算报告（PDF），附计算脚本或表格截图，在问渠学习平台提交。", "A 2–4 page calculation report (PDF) with your script or spreadsheet, submitted on WenQuest."]
    say:
      zh:
        - ">作业一共四道题，都是一台 E14 单系统横机织袖片。第一题，机头 1 米每秒，选针器延迟 0.5 毫秒、周期 1.3 毫秒，求针距、每针时间，不补偿时滞后几个针距，超没超 0.25，以及允许的最高机头速度。"
        - ">第二题，袖片 180 针、500 个横列，固定提前量，算一趟行程、一趟时间和一片时间；再估算改成实时补偿、余量减到 20 毫米，一片能省多少。"
        - ">第三题是线圈长度闭环，视频里没讲，课件和教材里有：实测用纱 1026 毫米，度目该调深还是调浅、调几步，为什么增益取小于 1。第四题讨论：在一个针床上并排织两片袖片，好处是什么，编程和纱嘴安排要注意什么。"
        - 计算报告在问渠学习平台上提交。
      en:
        - ">Your assignment has four questions, all about knitting sleeves on an E14 single-system machine. One: with the carriage at 1 metre per second, a 0.5 millisecond selector delay and a 1.3 millisecond cycle, find the pitch, the time per needle, the lag without compensation and whether it exceeds a quarter pitch, and the highest carriage speed allowed."
        - ">Two: the sleeve is 180 needles and 500 courses with a fixed lead. Find one pass's travel and time and the time per sleeve, then estimate how much a real-time lead with a 20 millimetre margin saves."
        - ">Three is closed-loop control of loop length, which this video skipped; it's in the slides and the textbook. The yarn measures 1026 millimetres: deeper or shallower, by how many steps, and why is the gain below one? Four is a discussion: what do you gain by knitting two sleeves side by side on one bed, and what must the program and the yarn carriers take care of?"
        - Submit the report on the WenQuest platform.

  - id: quiz
    part: ["测验", "Quiz"]
    slide:
      layout: points
      title: ["课后测验：10 题，即时反馈", "After-class quiz: 10 questions, instant feedback"]
      points:
        - ["只选中 S1、没选中 S2：这枚针做什么？", "Selected at S1 but not S2: what does the needle do?"]
        - ["E7 横机、机头 1.0 m/s：每针时间多少？", "E7, carriage at 1.0 m/s: time per needle?"]
        - ["可以做三次，交卷后立刻看到解析", "Three attempts, explanations as soon as you submit"]
    say:
      zh:
        - ">学完还有一份十道题的测验，比如：一枚针在 S1 被选中、S2 没选中，它在这一行做什么？"
        - ">再比如：E7 横机，机头每秒 1 米，每枚针的选针时间是多少？还有题问牵拉为什么用转矩控制。"
        - ">这份测验可以做三次，交卷后马上能看到每题的解析。"
      en:
        - ">There's also a ten-question quiz. For example, a needle is selected at S1 but not at S2. What does it do in this course?"
        - ">Or, on an E7 machine with the carriage at 1 metre per second, what is the selection time per needle? Another asks why take-down uses torque control."
        - ">You get three attempts, and the explanations appear as soon as you submit."

