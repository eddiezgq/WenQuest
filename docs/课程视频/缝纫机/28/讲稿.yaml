intro:
  zh:
    - 同学们好，欢迎来到问渠。
    - 这是《缝纫机设计与制造》第二十八讲，服装生产工艺与缝制车间。
    - 前面二十多讲都在讲一台缝纫机，今天走进车间，看几十台缝纫机和几十个人怎样排成一条线。
  en:
    - Hi everyone, and welcome back to Sewing Machine Design and Manufacturing at WenQuest.
    - This is Lecture 28, garment processes and the sewing floor.
    - For more than twenty lectures we've studied one machine. Today we step onto the floor and see how dozens of machines and people are arranged into a line.

after:
  - id: lab281
    kind: lab
    lab: line21
    part: ["虚拟实验", "Virtual lab"]
    viewport: [1600, 900]
    steps:
      - js: "(() => { document.body.style.zoom = '0.75'; window.scrollTo(0, 0); const st = document.createElement('style'); st.textContent = '#checksA,#machA,#checksB,#costc,#seamtxt,#tasks,#msg{filter:blur(7px) grayscale(1)}'; document.head.appendChild(st); document.querySelectorAll('p.note').forEach(n => { n.style.visibility = 'hidden'; }); document.getElementById('one').click(); })()"
        dur: 5
      - js: "document.getElementById('auto').click()"
        dur: 4
      - js: "(() => { window.scrollTo(0, 420); const r = [...document.querySelectorAll('#oplist tr')].find(t => t.cells && t.cells[0] && t.cells[0].textContent.trim() === '16'); if (r) { r.scrollIntoView({block: 'center'}); r.style.outline = '4px solid #f2b705'; } })()"
        dur: 6
      - js: "(() => { window.scrollTo(0, 0); const f = (id, v, ev) => { const e = document.getElementById(id); e.value = v; e.dispatchEvent(new Event(ev, {bubbles: true})); }; f('tgt', 100, 'input'); setTimeout(() => document.getElementById('auto').click(), 800); setTimeout(() => { f('tgt', 120, 'input'); f('imp', '1', 'input'); document.getElementById('auto').click(); }, 3500); })()"
        dur: 6
      - js: "(() => { document.getElementById('tabB').click(); window.scrollTo(0, 0); document.getElementById('resetB').click(); const f = (id, v) => { const e = document.getElementById(id); e.value = v; e.dispatchEvent(new Event('input', {bubbles: true})); }; [1, 2, 3, 4, 5, 6].forEach((n, i) => setTimeout(() => f('n', n), 300 + i * 1500)); setTimeout(() => { f('n', 4); f('t', 0.6); }, 9800); })()"
        dur: 11
      - js: "(() => { document.getElementById('seam').scrollIntoView({block: 'center'}); const f = (id, v) => { const e = document.getElementById(id); e.value = v; e.dispatchEvent(new Event('input', {bubbles: true})); }; f('stn', 333); f('nmx', 4000); setTimeout(() => f('nmx', 5000), 2000); setTimeout(() => f('nmx', 6000), 4000); setTimeout(() => f('stn', 40), 6000); })()"
        dur: 8
    say:
      zh:
        - ">下面是虚拟实验 28-1，生产线平衡，在问渠平台上可以亲手做，结果和任务先遮住。第①页左边是平衡图和工序表，右边调目标产量和设备。先点“一道工序一组”，看哪些工位在等。"
        - ">再点“自动分组”，柱子齐了。记下人数、周期、产量和平衡率，和刚才比一比。"
        - ">任务一：在工序表里用上下箭头调整顺序，比如框出的“做串带”没有前道约束；不能违反前道关系，再重新切分，看能不能少用一人。"
        - ">任务二把目标改成每小时 100 件，任务三换上自动开袋机和绱腰机，都是先自动分组，再调整顺序省人。"
        - ">切到第②页，把看机台数从 1 调到 6，看人机作业图里谁在等谁，记下周期和每件成本，找出最便宜的台数；再把自动缝制时间改成 0.6 分，重找一次。"
        - ">最后看一道缝的机器时间：333 针，最高转速取 4000、5000、6000，再把针数改成 40 比一比。指导书和报告模板在平台上。"
      en:
        - ">Now Virtual lab 28-1, line balancing, which you can do yourself on WenQuest. Results and tasks are blurred. On page one, the balance chart and the operation table are on the left; on the right you set target output and equipment. First click 'one operation per group' and see which stations wait."
        - ">Then click 'automatic grouping' and the bars even out. Record the headcount, cycle, output and balance, and compare."
        - ">Task one: reorder operations with the arrows in the table. 'Make belt loops', outlined here, has no predecessors. Don't break precedence; re-cut the groups and see whether you can save a person."
        - ">Task two sets the target to 100 an hour, and task three adds the automatic pocket welter and the waistband machine. In both, group automatically first, then reorder to save people."
        - ">On page two, step the machines tended from 1 to 6, watch who waits for whom in the operator-machine chart, record the cycle and cost per piece, and find the cheapest number. Then cut the automatic sewing time to 0.6 minutes and find it again."
        - ">Last, the machine time for one seam: 333 stitches at a top speed of 4000, 5000 and 6000, then 40 stitches for comparison. The guide and report template are on the platform."

