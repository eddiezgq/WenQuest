  - id: homework
    part: ["作业", "Assignment"]
    slide:
      layout: points
      title: ["作业 28：一条 T 恤线的平衡与一人多机配置", "Assignment 28: balancing a T-shirt line and multi-machine tending"]
      points:
        - ["T 恤 8 道工序、150 件/时：分组与平衡率", "T-shirt, 8 operations, 150 an hour: grouping and balance"]
        - ["“绱袖”的标准工时；评比给高了会怎样", "SAM for 'set sleeves'; what if the rating is too high"]
        - ["花样机看 3、4、5 台：周期与每件成本", "Pattern sewers, 3, 4 or 5 per person: cycle and cost"]
      foot: ["作业和实验报告都在问渠学习平台提交。", "Submit the assignment and the lab report on WenQuest."]
    say:
      zh:
        - ">作业一共三道题。第一题，一条 T 恤线 8 道工序，目标每小时 150 件：求节拍和理论最少人数，按一道工序一组算人数、周期和平衡率，再按本讲的规则给出你自己的分组。"
        - ">第二题，“绱袖”测时 10 次平均 0.52 分，评比 90%，宽放 15%，求标准工时，再说说评比要是给成 110%，对线平衡和计件工价各有什么影响。"
        - ">第三题，花样机每台装卸 0.25 分、走动 0.05 分、自动缝 1.0 分，工资 0.5 元每分，设备 0.10 元每分每台：求平衡台数，算看 3、4、5 台的周期和每件成本，选出最省的；装卸降到 0.15 分，结论怎样变。"
        - 作业和实验报告都在问渠学习平台上提交。
      en:
        - ">The assignment has three questions. One: a T-shirt line has 8 operations and a target of 150 an hour. Find takt and the theoretical minimum, the headcount, cycle and balance with one operation per group, and then your own grouping under this lecture's rules."
        - ">Two: 'set sleeves' was timed ten times at an average of 0.52 minutes, rated 90 percent, with 15 percent allowance. Find the standard minute, and explain what a rating of 110 percent would do to line balance and piece rates."
        - ">Three: a pattern sewer takes 0.25 minutes to load, 0.05 to walk and 1.0 to sew; wages are 0.5 yuan a minute and machines 0.10 per machine-minute. Find the balance point, the cycle and cost per piece for 3, 4 and 5 machines, choose the cheapest, and say how the answer changes if loading drops to 0.15."
        - Submit the assignment and the lab report on the WenQuest platform.

  - id: quiz
    part: ["测验", "Quiz"]
    slide:
      layout: points
      title: ["课后测验：10 题，即时反馈", "After-class quiz: 10 questions, instant feedback"]
      points:
        - ["观测 0.50 分、评比 105%、宽放 12%：标准工时？", "Observed 0.50, rated 105%, 12% allowance: the SAM?"]
        - ["总工时 15.6 分、100 件/时：至少几人？", "15.6 minutes of work, 100 an hour: how many people?"]
        - ["可以做三次，交卷后立刻看到解析", "Three attempts, explanations as soon as you submit"]
    say:
      zh:
        - ">学完还有一份十道题的测验，比如：某工序观测时间平均 0.50 分，评比 105%，宽放 12%，标准工时是多少分？"
        - ">再比如：一件衣服总工时 15.6 分，目标每小时 100 件，理论最少要几个人？"
        - ">这份测验可以做三次，交卷后马上能看到每题的解析。"
      en:
        - ">There's also a ten-question quiz. For example: an operation's observed time averages 0.50 minutes, rated 105 percent, with 12 percent allowance. What's the standard minute?"
        - ">Or: a garment takes 15.6 minutes of work in all, and the target is 100 an hour. What's the theoretical minimum headcount?"
        - ">You get three attempts, and the explanations appear as soon as you submit."

