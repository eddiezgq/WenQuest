# 《缝纫机设计与制造》公开课 第 27 讲：数字工厂——缝纫机工厂的整体信息化解决方案
# 第 25 轮起的视频标准：画面就是这一讲的网页互动课件（course/slides/ch27.yaml；2026-11-05 补英文版 SVG、回答页中英两栏、封面右移），
# 配音是课件每页的讲稿（notes），中文版放双语课件，英文版放只显示英文的课件；每页按句子让要点逐条出现。这里只写开场、课后部分和结尾。
# 课后部分（约 5 分钟）：虚拟实验 27-1（数字工厂：质量闭环与追溯）第①页录屏、数字工厂（第 23 轮 3.4：第 26、27 讲演示数字工厂的完整流程——
