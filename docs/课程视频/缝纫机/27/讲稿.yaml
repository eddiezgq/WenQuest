code: [ch27]
title: ["数字工厂——缝纫机工厂的整体信息化解决方案", "The Digital Factory — An Integrated IT Solution for a Sewing-Machine Plant"]
chapter: ["第七篇 制造与数字工厂 · 第 27 章", "Part VII Manufacturing and the Digital Factory · Chapter 27"]
