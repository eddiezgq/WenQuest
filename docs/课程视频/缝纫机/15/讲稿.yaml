  - id: homework
    part: ["作业", "Assignment"]
    slide:
      layout: points
      title: ["作业 15：花样机的转速规划与 X–Y 电机选型", "Assignment 15: speed planning and X–Y motor sizing"]
      points:
        - ["3 mm 厚：2、4、8 mm 针与 45° 斜针的转速上限", "3 mm stack: limits for 2, 4, 8 mm and a 45° stitch"]
        - ["Δn = 200 时的前瞻：第 1–8 针的转速", "Look-ahead with Δn = 200: speeds of stitches 1–8"]
        - ["X、Y 轴电机：峰值、均方根；实验 15-2 周期 < 4.7 s", "X and Y motors: peak, RMS; Lab 15-2 cycle < 4.7 s"]
      foot: ["3–5 页报告（PDF），附计算表格、选型结论和实验 15-2 的花样文件与截图，在问渠学习平台提交。", "A 3–5 page report (PDF) with tables, motor conclusions, and the Lab 15-2 pattern file and screenshot, submitted on WenQuest."]
    say:
      zh:
        - ">作业一共四道题。第一题，布加下模板 3 毫米厚，按等加速等减速和摆线两种规律，算沿 X 方向针距 2、4、8 毫米的转速上限，再算 4 毫米的 45° 斜针，说明为什么要按各轴分量算。"
        - ">第二题，还是课上的前瞻算例，但每针只许变 200 转。算出第 1 到 8 针的转速，要提前几针开始减速？"
        - ">第三题是电机选型，这段视频里没讲，课件和教材里有：一台 400 瓦伺服，核算 X、Y 两轴的峰值转矩和均方根转矩。峰值管能不能加速，均方根管会不会过热；不满足的轴给出两种改进办法。第四题在花样编程实验 15-2 里，把周期时间做到 4.7 秒以内。"
        - 计算报告、花样文件和截图，都在问渠学习平台上提交。
      en:
        - ">Your assignment has four questions. One: with fabric plus lower template 3 millimetres thick, use constant acceleration and a cycloid to find the speed limits for 2, 4 and 8 millimetre stitches along X, then for a 4 millimetre stitch at 45 degrees, and explain why the axis components matter."
        - ">Two: the look-ahead example from the slides again, but now the speed may change by only 200 r/min per stitch. Find the speeds of stitches 1 to 8. How many stitches ahead must braking start?"
        - ">Three is motor sizing, which this video skipped; it's in the slides and the textbook. For a 400 watt servo, check the peak and RMS torque on both the X and Y axes. Peak torque decides whether it can accelerate; RMS torque decides whether it overheats. For any axis that fails, give two ways to fix it. Four is in Lab 15-2, pattern programming: get the cycle time under 4.7 seconds."
        - Submit the report, the pattern file and the screenshots on the WenQuest platform.

  - id: quiz
    part: ["测验", "Quiz"]
    slide:
      layout: points
      title: ["课后测验：10 题，即时反馈", "After-class quiz: 10 questions, instant feedback"]
      points:
        - ["W = {{ch15.W15:.1f}}°、a = 50 m/s²：4 mm 针的转速上限？", "W = {{ch15.W15:.1f}}°, a = 50 m/s²: limit for a 4 mm stitch?"]
        - ["2400 r/min、驱动延迟 1.2 ms：模板滞后几度？", "2400 r/min, 1.2 ms drive lag: how many degrees behind?"]
        - ["可以做三次，交卷后立刻看到解析", "Three attempts, explanations as soon as you submit"]
    say:
      zh:
        - ">学完还有一份十道题的测验，比如：窗口 {{ch15.W15:.1f}}°，每轴加速度 50 米每秒平方，沿 X 方向 4 毫米一针，转速上限大约多少？"
        - ">再比如：主轴每分钟 2400 转，驱动延迟 1.2 毫秒，不做补偿，模板会滞后多少度主轴转角？还有一题问中压脚的时序。"
        - ">这份测验可以做三次，交卷后马上能看到每题的解析。"
      en:
        - ">There's also a ten-question quiz. For example, with a {{ch15.W15:.1f}}-degree window and 50 metres per second squared per axis, what is the speed limit for a 4 millimetre stitch along X?"
        - ">Or, the shaft turns at 2400 r/min and the drive lags by 1.2 milliseconds. Without compensation, how many degrees of shaft angle does the template fall behind? Another asks about centre-foot timing."
        - ">You get three attempts, and the explanations appear as soon as you submit."

