# 《缝纫机设计与制造》公开课 第 15 讲：花样机与锁眼、钉扣、套结机控制
# 第 25 轮起的视频标准：画面就是这一讲的网页互动课件（course/slides/ch15.yaml），配音是课件每页的讲稿（notes），
# 中文版放双语课件，英文版放只显示英文的课件；每页按句子让要点逐条出现。这里只写开场、课后部分和结尾。
# 课后部分（约 5 分钟）：虚拟实验 15-1（花样机仿真）录屏、平台学习方式页（第 23 轮 3.4：本讲不放数字工厂）、作业页、测验页。
# 数字一律由 course/calc/ch15.py 算出（{{ch15.键:格式}}）。实验镜头 steps 数 = “>” 个数（第一步也用一个 “>” 句触发）。
book: sewing
section: "15"
deck: ch15
skip: [5, 6, 9, 22, 24, 25, 26]   # 同步带刚度、中压脚与气动压框、三种布厚的窗口数字页（也是实验任务二的读数）、模板与周期时间、第五节（章节页、X 轴电机选型、控制箱）：控制课程部分约 10 分钟（课件与教材里都有；同步带激振在运动规律页讲稿里带一句，中压脚时序留给测验，电机选型留给作业第三题，周期时间在回答页讲到）
code: [ch15]
title: ["花样机与锁眼、钉扣、套结机控制——针距一大为什么断针", "Pattern Sewers, Buttonholers and Bartackers — Why Longer Stitches Break Needles"]
chapter: ["第五篇 电气控制 · 第 15 章", "Part V Electrical Control · Chapter 15"]
next: ["第 16 讲", "Lecture 16"]
cover_formula: 'n_{max} = \frac{W}{6\,t_{move}}'
tags:
  zh: [花样机, 锁眼机, 钉扣机, 套结机, 离布窗口, 电子凸轮, 前瞻调速, 运动规律, 缝纫机设计]
  en: [pattern sewer, buttonholer, button sewer, bartacker, off-fabric window, electronic cam, look-ahead speed control, motion law, sewing machine design]

intro:
  zh:
    - 同学们好，欢迎来到问渠。
    - 这是《缝纫机设计与制造》第十五讲，花样机与锁眼、钉扣、套结机控制。
    - 上一讲的电控平缝机，还是靠人手送布、转方向。今天布交给程序：夹在模板里，由 X–Y 工作台带着走。
    - 整讲围绕一条规矩：机针在布中，模板不能动。
  en:
    - Hi everyone, and welcome back to Sewing Machine Design and Manufacturing at WenQuest.
    - This is Lecture 15, pattern sewers, buttonholers, button sewers and bartackers.
    - The electronic lockstitch machine from last time still needs the operator's hands to feed and steer. Today the program takes over. The fabric is clamped in a template and an X–Y table carries it.
    - One rule runs through the whole lecture. While the needle is in the fabric, the template must not move.

after:
  - id: lab151
    kind: lab
    lab: pattern
    part: ["虚拟实验", "Virtual lab"]
    viewport: [1600, 900]
    steps:
      - js: "(() => { document.body.style.zoom = '1'; window.scrollTo(0, 0); const s = document.createElement('style'); s.textContent = '.kpi, #verdict { filter: blur(7px) grayscale(1); }'; document.head.appendChild(s); document.querySelector('.tasks').closest('section').style.filter = 'blur(7px) grayscale(1)'; document.getElementById('sp').closest('section').style.filter = 'blur(7px) grayscale(1)'; window.__go = () => { const b = document.getElementById('play'); if (/^(播放|Play)$/.test(b.textContent.trim())) b.click(); }; })()"
        press: ["[data-slow='20']", "#play"]
      - js: "(() => { const e = document.getElementById('s'); e.value = 6; e.dispatchEvent(new Event('input', {bubbles: true})); window.__go(); })()"
      - js: "window.__go()"
        sweep: {n: [2000, 1650]}
        dur: 6
      - js: "(() => { for (const [k, v] of [['s', 3], ['n', 2000]]) { const e = document.getElementById(k); e.value = v; e.dispatchEvent(new Event('input', {bubbles: true})); } window.__go(); })()"
        sweep: {t: [1.5, 6]}
        dur: 7
      - js: "(() => { const p = document.getElementById('preset'); p.value = 'star'; p.dispatchEvent(new Event('change', {bubbles: true})); for (const [k, v] of [['t', 1.5], ['s', 6], ['n', 1200]]) { const e = document.getElementById(k); e.value = v; e.dispatchEvent(new Event('input', {bubbles: true})); } const b = document.getElementById('play'); if (/^(播放|Play)$/.test(b.textContent.trim())) b.click(); })()"
        sweep: {n: [1200, 1400]}
        dur: 6
      - js: "(() => { document.querySelector('[data-mode=auto]').click(); const l = document.getElementById('law'); l.value = '6.283'; l.dispatchEvent(new Event('change', {bubbles: true})); window.__go(); })()"
    say:
      zh:
        - ">下面是虚拟实验 15-1，花样机仿真，在问渠平台上可以亲手做。右边的结果和任务、左下的每针转速图这里先遮住，留给你自己读。左边是口袋盖的针点，右上角表盘里蓝色弧是模板可以动的窗口。"
        - ">任务一，固定 2000 转，把针距从 3 毫米调到 6 毫米，一部分针点马上变红，这些是走不完的针。"
        - ">再把转速往下拖，红针开始变少。降到多少才全部变蓝，留给你自己调，再和公式对照。"
        - ">任务二，回到 3 毫米、2000 转，把布厚从 1.5 毫米加到 6 毫米。看表盘：蓝色窗口越缩越短，原来全蓝的针也开始变红。窗口是多少度，在结果里读。"
        - ">任务三，换五角星，针距 6 毫米，从每分钟 1200 转往上加。继续加下去，哪些针先变红，是横竖的还是斜的，自己找出来，再想想为什么。"
        - ">任务四，切到自动前瞻，换着试三种运动规律，比较缝制时间；再把窗口两端余量调到 15°，看时间增加多少。指导书和报告模板在平台上下载。"
      en:
        - ">Now Virtual lab 15-1, the pattern-sewer simulation. On the WenQuest platform you can do it yourself. The results and tasks on the right, and the per-stitch speed chart at lower left, are blurred here, so you can read them on your own. On the left are the pocket-flap stitches, and in the dial the blue arc is the window when the template may move."
        - ">Task one: at a fixed 2000 r/min, change the stitch from 3 to 6 millimetres. Some of the points turn red at once. Those are the moves that can't finish."
        - ">Now drag the speed down, and the red stitches start to thin out. How far down until they're all blue is yours to find; then compare it with the formula."
        - ">Task two: back to 3 millimetres and 2000 r/min, and raise the thickness from 1.5 to 6 millimetres. Watch the dial. The blue window keeps shrinking, and stitches that were all blue start turning red. Read the window angle in the results."
        - ">Task three: switch to the star with 6-millimetre stitches, and raise the speed from 1200 r/min. Keep going, find which stitches turn red first, the horizontal and vertical ones or the diagonal ones, and think about why."
        - ">Task four: switch to automatic look-ahead, try the three motion laws and compare the sewing times; then set the end margin to 15 degrees and see how much time it adds. The guide and the report template are on the platform."

