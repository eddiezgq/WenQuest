      points:
        - ["旋梭改成和主轴 1 比 1，会出什么问题？", "What goes wrong if the hook ran 1:1 with the shaft?"]
        - ["钩线时刻推迟、针杆没动，最可能出什么毛病？", "Timing retarded, bar height untouched: what fault is likely?"]
        - ["可以做三次，交卷后立刻看到解析", "Three attempts, explanations as soon as you submit"]
    say:
      zh:
        - ">学完还有一份十道题的测验，比如：如果旋梭和主轴改成 1 比 1，线环还来得及脱出来吗？"
        - ">钩线时刻推迟了，针杆高度没动，按钩线窗口模型，最可能出现什么问题？"
        - ">这份测验可以做三次，交卷后马上能看到每题的解析。"
      en:
        - ">There's also a ten-question quiz. For example, if the hook ran one to one with the shaft, would the loop cast off in time?"
        - ">If the timing is retarded and the needle-bar height is left alone, what problem does the window model predict?"
        - ">You get three attempts, and the explanations appear as soon as you submit."

