code: [ch05]
title: ["钩线机构：旋梭在对的时刻钩住线环", "The Hook Mechanism: Catching the Loop at the Right Moment"]
chapter: ["第二篇 机构 · 第 5 章", "Part II Mechanisms · Chapter 5"]
