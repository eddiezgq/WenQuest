tags:
  zh: [钩线机构, 旋梭, 钩线时刻, 针杆高度, 梭尖间隙, 平缝机]
  en: [rotary hook, loop catching, hook timing, needle bar height, sewing machine design]

intro:
  zh:
    - 同学们好，欢迎来到问渠。
    - 这是《缝纫机设计与制造》第五讲，钩线机构。
    - 画面上底板下面那个一直朝一个方向高速旋转的零件，就是工业平缝机用的全回转旋梭。机针每扎一针，它的梭尖都要在一瞬间钩住面线的线环，早一点、晚一点、远一点、近一点，就会跳针、劈线，甚至撞针。
  en:
    - Hi everyone, and welcome back to Sewing Machine Design and Manufacturing at WenQuest.
    - This is Lecture 5, the hook mechanism.
    - The part spinning fast in one direction under the bed plate is the full rotary hook that industrial lockstitch machines use. On every stitch its point has a split second to catch the loop of needle thread. A little early or late, too far or too close, and you get a skipped stitch, a split thread or a needle strike.

after:
  - id: lab51
    kind: lab
    lab: hook
    part: ["虚拟实验", "Virtual lab"]
    viewport: [1600, 900]
    steps:
      - js: "['meter','state','tasks','sewOut','stitches','phase'].forEach(i => document.getElementById(i).style.filter = 'blur(7px) grayscale(1)')"
      - press: reset
        js: "document.getElementById('sew').click()"
        sweep: {ang: [190, 216]}
        dur: 6
      - press: [play, mess]
      - sweep: {p_psi: [14, 0]}
        dur: 4
      - sweep: {p_dz: [0.4, 0], p_g: [0.26, 0.08]}
        dur: 5
      - set: {nm: "1.1"}
        js: "['front','top'].forEach(i => document.getElementById(i).style.filter = 'blur(9px)'); document.getElementById('sew').click()"
      - js: "window.scrollTo(0, 520)"
        set: {nm: "0.9", fab: knit}
      - set: {fab: woven}
        js: "document.getElementById('map').style.filter = 'blur(16px) grayscale(1)'"
        sweep: {p_psi: [0, 12]}
        dur: 5
    say:
      zh:
        - ">下面是本讲的虚拟实验 5-1，在问渠学习平台上可以亲手做。读数、试缝结果和任务判定这里先遮住，留给你自己读。"
        - ">先点恢复手册标准，拖动主轴转角，看线环怎样在机针凹口一侧鼓出来、梭尖怎样从中间穿过。记下这时的读数，试缝 30 针。"
        - ">任务一：点打乱，模拟一台没调好的机器。看哪些读数跑出了手册范围。"
        - ">按课上讲的顺序调回来：先对钩线时刻，"
        - ">再对针杆高度，最后调间隙，调好后试缝 30 针，全部正常才算完成。"
        - ">任务二：把机针换成 Nm 110，先不动间隙试缝一次，看会发生什么，再把间隙调回手册范围。"
        - ">任务三：面料改成针织，看下面的钩线窗口怎样变窄，把工作点放到深绿区的中间。"
        - ">任务四：把旋梭安装角推迟到 10 度以上，只调针杆高度让试缝全部正常，这一题也是作业。指导书和报告模板在平台上下载，做完把报告交上来。"
      en:
        - ">Now Virtual lab 5-1. On the WenQuest platform you can do it yourself. The readings, the test-sewing result and the task checks are blurred here. Read them yourself when you work the lab."
        - ">First restore the manual standard and drag the shaft angle. Watch the loop bulge out beside the needle's scarf and the hook point pass through it. Note the readings, and sew 30 test stitches."
        - ">Task one. Press scramble, which imitates a badly adjusted machine, and see which readings fall outside the manual."
        - ">Bring them back in the order from the lecture. Timing first,"
        - ">then needle-bar height, and the clearance last. Then sew 30 test stitches. It's done when they're all good."
        - ">Task two. Fit an Nm 110 needle, sew once without touching the clearance, and see what happens. Then bring the clearance back into the manual range."
        - ">Task three. Switch to knit cloth, watch the catch window below get narrower, and put the working point in the middle of the dark green."
        - ">Task four. Retard the hook 10 degrees or more, and adjust only the needle-bar height until every test stitch is good. That one is also in the assignment. Download the guide and the report template on the platform, and hand in your report when you're done."

