  - id: homework
    part: ["作业", "Assignment"]
    slide:
      layout: points
      title: ["作业 5：钩线调整计算与诊断", "Assignment 5: hook adjustment, calculation and diagnosis"]
      points:
        - ["计算：回升 1.6、2.0、2.5 mm 的钩线转角；Nm 70、Nm 110 的间隙", "Compute: catch angles for 1.6, 2.0, 2.5 mm rise; clearance with Nm 70 and Nm 110"]
        - ["实验：安装角推迟 +10° 以上，只调针杆高度", "Lab: hook retarded past +10°, adjust bar height only"]
        - ["论述：T 恤线跳针，从钩线窗口找三条措施", "Discuss: a T-shirt line skips; three fixes, mapped to the window"]
      foot: ["另交虚拟实验 5-1 的实验报告。作业和报告都在问渠学习平台提交。", "Plus the report for Virtual lab 5-1. Submit both on WenQuest."]
    say:
      zh:
        - ">作业一共四道题。第一题是计算：用近似式求机针回升 1.6、2.0、2.5 毫米时的钩线转角，以及从 1.6 调到 2.5 毫米旋梭要转多少度。第二题，Nm 90 针时间隙调在 0.06 毫米，换成 Nm 70 和 Nm 110 各变成多少、出什么毛病、怎么重调。"
        - ">第三题是实验：把旋梭安装角推迟到 10 度以上，只调针杆高度让试缝全部正常，用窗口的斜率说明为什么这样能补救。"
        - ">第四题是论述：一条 T 恤线跳针严重，列出至少三条措施，说明每一条是加宽了窗口、把工作点移到了中间，还是减小了所需的距离。"
        - 作业和实验报告都在问渠学习平台上提交。
      en:
        - ">Your assignment has four questions. One, calculation. With the approximate formula, find the shaft angle of catch for needle rises of 1.6, 2.0 and 2.5 millimetres, and how far the hook must turn on its shaft to go from 1.6 to 2.5. Two, the clearance was set at 0.06 millimetres with an Nm 90 needle. What does it become with Nm 70 and with Nm 110, what fault does each cause, and how do you reset it?"
        - ">Three, the lab. Retard the hook angle past 10 degrees, adjust only the needle-bar height until every test stitch is good, and use the slope of the window to explain why that works."
        - ">And four, discussion. A T-shirt line skips badly. List at least three fixes, and say whether each one widens the window, moves the working point to the middle, or reduces the distance needed."
        - Submit the assignment and the lab report on the WenQuest platform.

  - id: quiz
