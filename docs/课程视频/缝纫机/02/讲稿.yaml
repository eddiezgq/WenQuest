# 《缝纫机设计与制造》公开课 第 2 讲：线迹的形成（第 23 轮样片）
# 格式见 tools/video/README.md。say 里每行一句配音、一条字幕；行首 “>” = 说这句之前画面进入下一步。
# 中英两种语言 “>” 的个数必须相同。“[字幕|读法]”：字幕显示前者、配音读后者。
# {{ch02.键:格式}} 由课程包程序 textbook/web-editions/sewing/course/calc/ch02.py 的输出填入，不手写数字。
# 内容取自课程包第 2 讲（course/lessons/ch02.json）与教材第 2 章。
book: sewing
section: "2"
code: [ch02]
title: ["线迹的形成：一针是怎样缝出来的", "How a Stitch Is Formed"]
chapter: ["第一篇 绪论 · 第 2 章", "Part I Introduction · Chapter 2"]
next: ["第 3 讲 刺布机构：针杆的曲柄滑块", "Lecture 3 The needle-bar mechanism: a slider-crank"]
cover_formula: 'h(206^{\circ})\approx 2\ \mathrm{mm}'
tags:
  zh: [线迹, 锁式线迹, 旋梭, 跳针, 平缝机]
  en: [lockstitch, rotary hook, skipped stitches, stitch formation]

shots:
  - id: open
    kind: title
    say:
      zh:
        - 同学们好，欢迎来到问渠。
        - 这是《缝纫机设计与制造》第二讲，线迹的形成：一针是怎样缝出来的。
      en:
        - Hi everyone, and welcome to Sewing Machine Design and Manufacturing at WenQuest.
        - This is Lecture 2, how a stitch is formed.

  - id: problem
    kind: lab
    lab: proto-lockstitch
    part: ["车间问题", "The problem"]
    steps:
      - press: "#shell [data-k=clear]"
    say:
      zh:
        - 先看车间里的一个真实问题。
        - 一台工业平缝机，每分钟缝五千针，在缝衬衫。
        - 换了一个新旋梭以后，布面上开始频繁缺针，这就是跳针。
        - ">修机工拆下针板，用手慢慢转手轮检查，发现梭尖到达机针的时刻，比标准晚了十度。"
        - 十度，听起来很小。
        - 可就是这十度，让机器一针接一针地跳针。
        - 为什么差十度就不行？十度又相当于多长时间？
        - 这一讲学完，你就能自己算出来。
      en:
        - Let's start with a real problem from the shop floor.
        - An industrial lockstitch machine is sewing shirts at five thousand stitches a minute.
        - After a new rotary hook is fitted, stitches start to go missing. That's what we call skipped stitches.
        - ">The mechanic takes off the throat plate, turns the handwheel slowly by hand, and finds that the hook point now reaches the needle ten degrees later than it should."
        - Ten degrees doesn't sound like much.
        - Yet those ten degrees make the machine miss stitch after stitch.
        - Why is ten degrees too much, and how long is ten degrees in time?
        - By the end of this lecture you'll be able to work it out yourself.

  - id: shafts
    kind: slide
    part: ["整机结构", "The machine"]
    head: ["里面只有两根轴", "Only two shafts inside"]
    items:
      - img: fig_xray
      - text: ["上轴（主轴）在机臂里，下轴在底板里", "Main shaft in the arm, hook shaft in the bed"]
      - text: ["同步带 1 : 1 相连，转速相同", "Joined 1 : 1 by a timing belt, same speed"]
      - text: ["四条传动链：刺布、挑线、钩线、送布", "Four drive trains: needle, take-up, hook, feed"]
      - text: ["旋梭转速 = 主轴的 2 倍", "The hook turns at twice shaft speed"]
    say:
      zh:
        - 要回答这个问题，先认识机器本身。
        - ">把机壳变成半透明，你会发现里面其实很简单，只有两根贯通的轴。"
        - ">机臂里是上轴，也叫主轴；底板里是下轴。"
        - ">两根轴由立柱里的一条同步带连起来，传动比一比一，转速相同。"
        - ">其余所有机构，刺布的、挑线的、钩线的、送布的，都挂在这两根轴上，中间没有离合器，也没有会打滑的环节。"
        - 所以只要知道主轴转到了多少度，就知道每个机构此刻在哪里。
        - ">还有一点要记住：主轴转一圈缝一针，旋梭转两圈。为什么必须是两圈，留给大家做作业。"
      en:
        - To answer that, we first need to know the machine.
        - ">Make the housing transparent and the inside turns out to be simple. There are just two shafts running through it."
        - ">The main shaft runs through the arm, and the hook shaft runs through the bed."
        - ">A timing belt in the pillar joins them one to one, so they turn at the same speed."
        - ">Every other mechanism, for the needle, the take-up, the hook and the feed, hangs on these two shafts, with no clutch and nothing that can slip."
        - So if you know the angle of the main shaft, you know where every mechanism is at that moment.
        - ">One more fact to remember: one turn of the main shaft sews one stitch, and the hook turns twice. Why it has to be twice is one of your assignment questions."

  - id: chains
    kind: lab
    lab: proto-lockstitch
    part: ["整机结构", "The machine"]
    steps:
      - press: ["#shell [data-k=xray]", "#chains [data-k=needle]"]
      - press: "#chains [data-k=takeup]"
      - press: "#chains [data-k=hook]"
      - press: "#chains [data-k=feed]"
      - press: ["#chains [data-k=all]", "#shell [data-k=window]"]
    say:
      zh:
        - 这是问渠的平缝机虚拟样机，所有运动都由机构计算得出。
        - ">先看刺布链：上轴通过曲柄和连杆，带着针杆上下运动。"
        - ">挑线链：挑线杆上下摆动，负责放线和收线。"
        - ">钩线链：同步带把运动传到下轴，旋梭在针板下面转动，去钩针线。"
        - ">送布链：送布牙从针板的槽里冒出来，把布往前推，再缩回去。"
        - ">四条链挂在同一根主轴上，永远同步。设计缝纫机，本质上就是让它们在每个关键时刻都对得上。"
      en:
        - This is the WenQuest virtual prototype of a lockstitch machine. All its motion is computed from the mechanisms.
        - ">First the needle train. The main shaft drives the needle bar up and down through a crank and a link."
        - ">The take-up train. The take-up lever rocks up and down, paying thread out and taking it back."
        - ">The hook train. The belt carries the motion down to the hook shaft, and the rotary hook turns under the throat plate to catch the thread."
        - ">The feed train. The feed dog rises through the slots in the throat plate, pushes the fabric forward, and drops back."
        - ">All four trains hang on one main shaft, so they are always in step. Designing a sewing machine is really about making them line up at every key moment."

  - id: stitch301
    kind: slide
    part: ["301 锁式线迹", "Lockstitch 301"]
    head: ["两根线，在布中间交织", "Two threads, interlaced mid-fabric"]
    items:
      - img: fig_section
      - text: ["面线（针线）+ 底线", "Needle thread + bobbin thread"]
      - text: ["交织点在布厚中间：两面都是直线", "Interlock in the middle: straight lines on both faces"]
      - text: ["正面露底线 → 面线相对太紧", "Bobbin on top → needle thread relatively too tight"]
    say:
      zh:
        - ">这门课以 [301|三零一] 锁式线迹为主线，家用缝纫机和工业平缝机缝出的都是它。"
        - ">它只有两根线：从针眼穿过的面线，和绕在梭芯上的底线。"
        - ">每一针，面线带着一个线环穿到布下，底线从线环里穿过去，然后面线被拉紧，把交织点拉进布厚的中间。"
        - 交织点合适的时候，布的正反两面都只看到一段段直线。
        - ">交织点的位置由两根线的张力决定，就像拔河。正面看得到底线的小点，说明面线相对太紧。"
        - 拿起一块缝好的布翻过来看两面，这是车间里判断张力最快的办法。
      en:
        - ">This course follows lockstitch [301|three-oh-one]. It is what both home and industrial lockstitch machines sew."
        - ">It uses just two threads: the needle thread, through the eye of the needle, and the bobbin thread, wound on the bobbin."
        - ">On every stitch the needle thread carries a loop below the fabric, the bobbin thread passes through the loop, and then the needle thread is pulled tight, drawing the interlock into the middle of the fabric."
        - When the interlock sits right, both faces show only neat straight stitches.
        - ">Where the interlock sits is a tug of war between the two tensions. Dots of bobbin thread on the top face mean the needle thread is relatively too tight."
        - On the shop floor, turning a sewn sample over and looking at both faces is the fastest way to judge tension.

  - id: needlehook
    kind: slide
    part: ["机针与旋梭", "Needle and hook"]
    head: ["线环从哪里来，又被谁钩住", "Where the loop comes from, and what catches it"]
    items:
      - img: fig_needle
      - text: ["机针两侧不对称：长槽、短槽、凹口", "The needle is asymmetric: long groove, short groove, scarf"]
      - text: ["回升时短槽一侧的线被布夹住 → 鼓出线环", "As it rises, thread on the short-groove side is held → a loop bulges out"]
      - img: fig_hook_exploded
      - text: ["旋梭体转动；梭床被挡住不转，梭壳坐在梭床里", "The hook body turns; the holder is stopped, the bobbin case sits in it"]
    say:
      zh:
        - ">线环是怎么来的？答案在机针上。"
        - ">仔细看，机针两侧不对称：一侧有一条贯通针身的长槽，另一侧只在针眼附近有一段短槽，上面还磨出一个凹口。"
        - ">针往下扎的时候，面线藏在长槽里。针到最低点开始回升，短槽一侧的线被布夹住，跟不上针，就在凹口一侧鼓出一个线环。"
        - 所以机针装反了、或者转了一个角度，线环就偏到别处，梭尖钩不到，这是跳针的常见原因之一。
        - ">再看旋梭。旋梭体在转，梭尖长在它的边缘上。"
        - ">梭床被机壳上的定位钩挡住，不跟着转；装着底线的梭壳就坐在梭床里，也不动。"
        - 梭尖带着线环绕过一个静止的梭壳，线环绕一圈，就把底线套进去了。一个转、一个不转，这是旋梭的巧妙之处。
      en:
        - ">Where does the loop come from? The answer is in the needle."
        - ">Look closely and the needle is not symmetric. One side has a long groove running down the blade. The other has only a short groove near the eye, with a scarf ground above it."
        - ">On the way down the needle thread hides in the long groove. When the needle starts to rise from its lowest point, the thread on the short-groove side is held by the fabric, can't keep up, and bulges out as a loop by the scarf."
        - So if a needle is fitted backwards or turned, the loop forms in the wrong place and the hook misses it. That's a common cause of skipped stitches.
        - ">Now the rotary hook. The hook body turns, with the hook point on its rim."
        - ">Its bobbin-case holder is stopped from turning by a finger on the machine, and the bobbin case with the bobbin thread sits in that holder, so it stays still too."
        - The point carries the loop right around a stationary bobbin case, and so the loop encloses the bobbin thread. One part turns, one stays still. That is the clever part.

  - id: stages
    kind: lab
    lab: lockstitch
    part: ["一针的五个阶段", "Five phases of a stitch"]
    steps:
      - set: {speed: 15}
      - press: "#zoom"
      - press: "#play"
      - sweep: {theta: [150, 300]}
        dur: 24
      - press: "#play"
    say:
      zh:
        - 现在把一针拆开来看。这是线迹形成的动画，主轴转一圈完成一针。
        - ">我们放慢速度。"
        - ">再放大针板下面的钩线区。"
        - ">先停下来，一度一度地转。"
        - ">第一阶段，刺布：机针带着面线下行，刺穿布料，主轴转到 180 度，机针到达最低点。"
        - 第二阶段，形成线环：机针开始回升，线环在凹口一侧鼓出来。请记住一个数字：针回升大约 2 毫米的时候，线环张得最大。
        - 第三阶段，钩线：恰在这一刻，梭尖从凹口处掠过，钻进线环和机针之间，把它钩住。早了，线环还没张开；晚了，线环已经收缩，都会跳针。
        - 第四阶段，绕梭：旋梭把线环越拉越大，绕过梭壳，挑线杆往下放线。
        - 第五阶段，收紧与送布：线环脱出，挑线杆快速上升收线；机针离开布料以后，送布牙才把布往前推一个针距。
        - ">好，再让它转起来，连起来看一遍。"
      en:
        - Now let's take one stitch apart. This animation forms the stitch, one turn of the main shaft per stitch.
        - ">Let's slow it down."
        - ">And zoom in on the catching area under the throat plate."
        - ">Now stop, and turn it one degree at a time."
        - ">Phase one, piercing. The needle carries the thread down through the fabric and reaches its lowest point at 180 degrees."
        - "Phase two, loop forming. The needle starts to rise and the loop bulges out by the scarf. Remember one number: the loop is fullest when the needle has risen about 2 millimetres."
        - "Phase three, catching. Right at that moment the hook point sweeps past the scarf, slips between the loop and the needle, and catches it. Too early and the loop isn't open yet. Too late and it is already shrinking. Either way, a skipped stitch."
        - "Phase four, round the bobbin. The hook pulls the loop bigger and bigger around the bobbin case, while the take-up lever pays out thread."
        - "Phase five, tightening and feeding. The loop slips off, the take-up lever shoots up and pulls the spare thread back, and only after the needle has left the fabric does the feed dog push the fabric forward by one stitch."
        - ">Now let it run again and watch the whole thing in one go."

  - id: protoloop
    kind: lab
    lab: proto-lockstitch
    part: ["一针的五个阶段", "Five phases of a stitch"]
    steps:
      - press: "#zoomBtn"
      - press: "#play"
      - sweep: {ang: [175, 330]}
        dur: 16
    say:
      zh:
        - 在三维样机上看同一个过程，会更直观。
        - ">点“看成线”，镜头推到钩线区，挡在前面的针板和机壳变成半透明。"
        - ">停下来，转动主轴。"
        - ">机针从最低点回升，线环张开，梭尖钻进去把它钩住，带着它绕过梭壳。线环的大小，是按挑线机构放下的线算出来的，不是画上去的。"
      en:
        - The same process is even clearer on the 3D prototype.
        - ">Press Watch the stitch form. The camera moves in on the hook, and the throat plate and housing in front turn see-through."
        - ">Stop, and turn the main shaft."
        - ">The needle rises from its lowest point, the loop opens, the hook point slips in, catches it and carries it round the bobbin case. The size of the loop is computed from the thread the take-up mechanism lets down. It is not just drawn in."

  - id: fourmotions
    kind: slide
    part: ["四个动作", "Four motions"]
    head: ["四个动作及其配合", "Four motions and how they fit together"]
    items:
      - text: ["刺布：180° 最低点；回升约 2 mm 时钩线", "Needle: lowest at 180°; catch at about 2 mm of rise"]
      - text: ["钩线：梭尖到达机针中心线 = 线环最大的时刻", "Hook: the point reaches the needle when the loop is fullest"]
      - text: ["挑线：绕梭时放线，脱环后收线", "Take-up: pay out round the bobbin, take up after release"]
      - text: ["送布：机针离开布料以后才推布", "Feed: push only after the needle leaves the fabric"]
      - text: ["压脚始终压着布，不随主轴运动", "The presser foot just holds the fabric; it usually doesn't follow the shaft"]
    say:
      zh:
        - 把刚才的五个阶段按执行的零件归纳一下，就是四个动作：刺布、钩线、挑线、送布。
        - ">刺布的关键时刻有两个：180 度的最低点，和回升约 2 毫米的钩线时刻。"
        - ">钩线要求梭尖到达机针中心线的时刻，正好和线环最大的时刻重合。"
        - ">挑线要在绕梭的时候放线，让线环够用；脱环以后又要快速收线，把多余的线收回来，拉紧线迹。"
        - ">送布必须等机针离开布料以后才开始。"
        - ">那压脚呢？压脚始终压着布，一般不随主轴运动，所以不算在这四个动作里。"
        - 四个动作的相位关系由同一根主轴固定下来，一旦装配好，就靠机械保证每一针都一样。
      en:
        - Group the five phases by the part that does the work and you get four motions. Needle, hook, take-up and feed.
        - ">The needle has two key moments: its lowest point at 180 degrees, and the catch at about 2 millimetres of rise."
        - ">The hook point must reach the needle centre line at exactly the moment the loop is fullest."
        - ">The take-up must pay thread out while the loop goes round the bobbin, so the loop has enough, and then pull the spare back quickly after release to set the stitch."
        - ">Feeding must wait until the needle is out of the fabric."
        - ">What about the presser foot? It just holds the fabric down and usually doesn't move with the shaft, so it isn't one of the four."
        - The phase relations of the four motions are fixed by one main shaft. Once the machine is assembled, the mechanics make every stitch the same.

  - id: timing
    kind: slide
    part: ["时序图", "The timing diagram"]
    head: ["运动时序图：抓住三个时刻", "The timing diagram: three moments"]
    items:
      - img: w_2a86e05b
      - text: ["180°：机针最低", "180°: needle at its lowest"]
      - text: ["约 206°：回升约 2 mm，梭尖钩线", "About 206°: risen about 2 mm, the hook catches"]
      - text: ["约 {{ch02.out_fab:.0f}}°：机针出布，之后才送布", "About {{ch02.out_fab:.0f}}°: needle leaves the fabric, then feeding"]
      - tex: 'h(\varphi)=x(180^{\circ})-x(\varphi)'
    say:
      zh:
        - ">把四个动作画在同一张图上，横坐标是主轴转角，这就是缝纫机的运动时序图。"
        - 读这张图，抓住三个时刻。
        - ">180 度，机针到最低点。"
        - ">206 度左右，机针回升约 2 毫米，梭尖钩线。"
        - ">{{ch02.out_fab:.0f}} 度左右，机针离开布料，之后送布牙才开始推布。否则针还扎在布里，布却在往前走，针会被拉弯，甚至折断。"
        - ">公式里的 h 是机针离最低点的回升量。针杆位移按下一讲推导的曲柄滑块公式计算。"
      en:
        - ">Draw all four motions on one chart against main-shaft angle and you have the machine's timing diagram."
        - To read it, hold on to three moments.
        - ">At 180 degrees, the needle is at its lowest."
        - ">At about 206 degrees, the needle has risen about 2 millimetres and the hook catches."
        - ">At about {{ch02.out_fab:.0f}} degrees, the needle leaves the fabric, and only then does the feed dog start to push. Otherwise the fabric would move while the needle is still in it, and the needle would bend or even break."
        - ">In the formula, h is the needle's rise from its lowest point. The needle-bar position comes from the slider-crank formula we derive next lecture."

  - id: example
    kind: slide
    part: ["算一算", "Work it out"]
    head: ["晚了十度，意味着什么", "What ten degrees late means"]
    items:
      - tex: 'h(206^{\circ})\approx {{ch02.rise206:.1f}}\ \mathrm{mm},\qquad h(216^{\circ})\approx {{ch02.rise216:.1f}}\ \mathrm{mm}'
      - text: ["216° 钩线：线环已经在收缩 → 跳针", "Catching at 216°: the loop is already shrinking → skipped stitches"]
      - tex: 't_{\Delta}=\frac{\Delta}{360^{\circ}}\cdot\frac{60}{n}=\frac{10^{\circ}}{360^{\circ}}\times {{ch02.ms_stitch:.0f}}\ \mathrm{ms}\approx {{ch02.ms10:.2f}}\ \mathrm{ms}'
      - text: ["修理：重装旋梭，梭尖约 206° 到达机针，复核针杆高度", "Fix: reset the hook to reach the needle at about 206°, then re-check needle-bar height"]
    say:
      zh:
        - 现在回到开头的问题，算一算。
        - ">按下一讲要推导的针杆运动，主轴 206 度时，机针回升约 {{ch02.rise206:.1f}} 毫米，正是线环最大的时候；到了 216 度，已经回升了约 {{ch02.rise216:.1f}} 毫米。"
        - ">这时线环已经在收缩，梭尖来晚了，必然跳针。"
        - ">十度是多长时间？每分钟五千针，一针 {{ch02.ms_stitch:.0f}} 毫秒，主轴每毫秒转 {{ch02.deg_per_ms:.0f}} 度，十度只有约 {{ch02.ms10:.2f}} 毫秒，三分之一毫秒。"
        - ">修理的办法，是重新安装旋梭，让梭尖在约 206 度到达机针中心线，再复核一遍针杆高度。"
        - 三分之一毫秒的精度，全靠机械传动来保证，这就是缝纫机设计的难处，也是它的精彩之处。
      en:
        - Now back to our problem. Let's work it out.
        - ">Using the needle-bar motion we will derive in Lecture 3, at 206 degrees the needle has risen about {{ch02.rise206:.1f}} millimetres, just when the loop is fullest. By 216 degrees it has risen about {{ch02.rise216:.1f}} millimetres."
        - ">By then the loop is shrinking. The hook arrives too late, and the stitch is skipped."
        - ">And how long is ten degrees? At five thousand stitches a minute one stitch takes {{ch02.ms_stitch:.0f}} milliseconds and the shaft turns {{ch02.deg_per_ms:.0f}} degrees every millisecond, so ten degrees is only about {{ch02.ms10:.2f}} milliseconds, a third of a millisecond."
        - ">The fix is to reset the hook so that its point reaches the needle centre line at about 206 degrees, and then re-check the needle-bar height."
        - Holding a third of a millisecond with nothing but gears, cranks and a belt. That is what makes sewing machine design hard, and what makes it beautiful.

  - id: robot
    kind: slide
    part: ["机器人与生活", "Robots and everyday life"]
    head: ["同一根“主轴”上的同步", "Synchronised to one “main shaft”"]
    items:
      - text: ["机器人联系：传送带跟踪抓取的电子凸轮", "Robot link: the electronic cam of conveyor-tracking picking"]
      - text: ["传送带编码器 = 主轴；手爪位置 = 编码器计数的函数", "Conveyor encoder = main shaft; gripper position = function of encoder counts"]
      - text: ["错过抓取窗口 = 机器人的“跳针”", "Missing the pick window = the robot's “skipped stitch”"]
      - text: ["生活例子：跳大绳——早了绳子还没来，晚了绳子已落下", "Everyday example: jumping into a long rope — too early or too late, you're caught"]
    say:
      zh:
        - 这个道理在机器人上也一样。
        - ">机器人在运动的传送带上抓工件，就把传送带上的编码器当作主轴，"
        - ">手爪的位置写成编码器计数的函数，这叫电子凸轮。工件走到哪里，手爪就跟到哪里。"
        - ">手爪必须在工件进入抓取窗口时合上，错过了，就是机器人的“跳针”。所以这类同步要靠编码器反馈，而不能靠定时器估计时间。"
        - ">生活里也有这样的例子：跳大绳。早了，绳子还没过来；晚了，绳子已经落下来绊脚。梭尖钩线也是这样，必须正好在那一刻到达。"
      en:
        - The same idea shows up in robotics.
        - ">When a robot picks parts off a moving conveyor, an encoder on the conveyor plays the part of the main shaft,"
        - ">and the gripper position is written as a function of the encoder count. That's called an electronic cam. Wherever the part goes, the gripper follows."
        - ">The gripper has to close while the part is inside its pick window. Miss it, and that's the robot's skipped stitch. That's why this kind of synchronisation runs on encoder feedback, not on a timer guessing the time."
        - ">And from everyday life: jumping into a long rope. Too early and the rope hasn't come round yet. Too late and it comes down on your feet. The hook point is the same. It has to arrive at exactly the right moment."

  - id: limits
    kind: slide
    part: ["模型的边界", "Limits of the model"]
    head: ["实际的线和布，比模型复杂", "Real thread and fabric are messier than the model"]
    items:
      - text: ["本讲：线不伸长，布被刚性夹住", "This lecture: thread doesn't stretch, fabric is held rigidly"]
      - text: ["实际：线有弹性和捻向，布有厚度和弹性，针有粗细", "In reality: thread stretch and twist, fabric thickness and stretch, needle size"]
      - text: ["厚料 → 更大的针、更大的线环；针织物 → 线环不稳、易跳针", "Heavy fabric → bigger needle and loop; knits → unstable loops, more skipping"]
      - text: ["第 7 讲：线张力与线迹质量", "Lecture 7: thread tension and stitch quality"]
    say:
      zh:
        - 最后说一下这一讲的模型有什么边界。
        - ">我们把线看成不能伸长的，把布看成被刚性夹住的，这足以说明线迹是怎样形成的。"
        - ">可实际上，线有弹性、有捻向，布有厚度、有弹性，针也有粗有细，它们都会改变线环的大小和形成的时刻。"
        - ">厚料要用更粗的针、更大的线环；弹性大的针织物，线环不稳定，也就更容易跳针。所以车间里薄料缝得好好的，一换厚牛仔布就跳针，并不奇怪。"
        - ">这些因素，我们到第七讲线张力与线迹质量里再细讲。"
      en:
        - Finally, a word on the limits of this lecture's model.
        - ">We treated the thread as unstretchable and the fabric as rigidly held. That's enough to show how a stitch forms."
        - ">In reality thread stretches and has a twist, fabric has thickness and give, and needles come in different sizes. All of these change how big the loop is and when it forms."
        - ">Heavy fabric needs a thicker needle and a bigger loop. Stretchy knits make the loop unstable, so they skip more easily. So it's no surprise when a machine that sews thin fabric fine starts skipping on heavy denim."
        - ">We'll come back to all this in Lecture 7, on thread tension and stitch quality."

  - id: lab21
    kind: lab
    lab: lockstitch
    part: ["虚拟实验", "Virtual lab"]
    steps:
      - set: {speed: 40}
        js: "window.scrollTo(0, 390)"
      - set: {delta: 10}
      - set: {delta: -10}
      - set: {delta: 0}
      - sweep: {thick: [1.5, 4.0]}
        dur: 4
    say:
      zh:
        - 下面是本讲的虚拟实验，在问渠学习平台上，你可以亲手做。
        - ">实验 2-1 用的就是刚才的动画。右下方有一个滑块，钩线时刻偏差 [Δ|德尔塔]，[Δ|德尔塔] 大于零表示梭尖到得晚。"
        - ">我们把 [Δ|德尔塔] 拉到正十度，让动画走过钩线那一刻，看看线环有没有被钩住。右边会告诉你，梭尖到达时机针回升了多少，判定写得清清楚楚。"
        - ">再试试负十度，梭尖来早了，又是什么情况？"
        - ">你的任务是：一度一度地试，找出不跳针的 [Δ|德尔塔] 范围，算出窗口有多宽，再把它换算成毫秒。答案这里不说，留给你自己去找。"
        - ">实验里还有两个滑块：过线板位置和布厚。把布加厚，挑线杆放下的线就可能不够线环用，线环张不开。厚料为什么容易跳针，你可以在这里先找找感觉，作业第四题会用到。"
      en:
        - Now the virtual lab for this lecture. On the WenQuest platform you can do it yourself.
        - ">Lab 2-1 uses the animation you just saw. There's a slider for the hook-timing error, [Δ|delta]. [Δ|Delta] greater than zero means the hook point arrives late."
        - ">Let's set [Δ|delta] to plus ten degrees and let the animation pass the catching moment. Is the loop caught? The panel tells you how far the needle had risen when the hook arrived, and gives a clear verdict."
        - ">Now try minus ten. The hook arrives early. What happens this time?"
        - ">Your task: step through [Δ|delta] one degree at a time, find the range with no skipped stitches, work out how wide the window is, and convert it to milliseconds. I won't give the answer here. That's for you to find."
        - ">There are two more sliders, the thread-guide position and the fabric thickness. Make the fabric thicker and the take-up lever may no longer let down enough thread for the loop to open. Get a feel here for why heavy fabric skips. You'll need it for question four of the assignment."

  - id: labproto
    kind: lab
    lab: proto-lockstitch
    part: ["虚拟实验", "Virtual lab"]
    steps:
      - press: ["#viewAll", "#shell [data-k=clear]", "#tagsOn"]
      - press: "#tagsOn"
        sweep: {explode: [0, 0.8]}
        dur: 5
      - set: {explode: 0, p_psi: -20}
      - press: "#sew"
    say:
      zh:
        - 第二个实验是三维虚拟样机。
        - ">外壳可以换成透明盖板，打开编号，点任何一个零件，就能看到它的编号、名称和所属的机构。"
        - ">拖动拆开程度，整台机器就拆开了，每个组件属于哪条传动链，一目了然。"
        - ">右边还有调机面板。比如把旋梭定时往早调一大截，"
        - ">再试缝三十针。哪里出了毛病，样机上会把那个零件标红，告诉你原因，再指给你该去看哪个实验。建议大家先把四条传动链各看一遍，再动手调。"
      en:
        - The second lab is the 3D virtual prototype.
        - ">You can switch the housing to clear covers, turn on the part numbers, and click any part to see its number, its name and the mechanism it belongs to."
        - ">Drag the explode slider and the machine comes apart, so you can see which train every assembly belongs to."
        - ">On the right there's a tuning panel. Say we set the hook timing well early,"
        - ">and sew a thirty-stitch test seam. Whatever goes wrong, the prototype turns that part red, tells you why, and points you to the lab to look at. Look at each of the four trains first, then start adjusting."

  - id: platform
    kind: lab
    lab: lockstitch
    book: true
    query: "#lab-lockstitch"
    part: ["在平台上学习", "Learning on WenQuest"]
    steps:
      - js: "document.querySelector('#lab-lockstitch').scrollIntoView({block: 'start'}); window.scrollBy(0, -80)"
      - js: "document.querySelector('#lab-lockstitch .run').click()"
      - js: "window.scrollBy(0, 260)"
    say:
      zh:
        - ">这些实验在问渠学习平台上都有，而且就嵌在教材里。"
        - ">这是平台“教材”书架上的网页版《缝纫机设计与制造》，读到哪里，点“在本页运行”，实验就在正文里打开。"
        - ">每一讲还有讲义、课件、实验指导书和报告模板，三十一讲，从一针线迹一直讲到数字工厂和人工智能制衣。"
      en:
        - ">All of these labs are on the WenQuest platform, built right into the textbook."
        - ">This is the web edition of Sewing Machine Design and Manufacturing on the platform's textbook shelf. Wherever you are reading, press Run on this page and the lab opens right in the text."
        - ">Every lecture also comes with notes, slides, a lab guide and a report template. Thirty-one lectures, from a single stitch all the way to digital factories and AI in garment making."

  - id: homework
    kind: homework
    items: [1, 2, 3, 4]
    foot: ["另：虚拟实验 2-1 的实验报告。在问渠学习平台提交。", "Plus the report for Virtual lab 2-1. Submit it on WenQuest."]
    say:
      zh:
        - 最后布置作业，一共四道题。
        - ">第一题，计算与诊断：每分钟四千针，梭尖在 198 度到达，会不会跳针？偏差换算成毫秒，并写出调整方向和要复核的项目。"
        - ">第二题，分析：旋梭为什么必须转两圈？"
        - ">第三题，时序：送布为什么必须在机针出布以后？"
        - ">第四题，现场题：薄料缝得好好的，换了厚牛仔布就跳针，至少找出三个原因。"
        - 作业和实验报告都在问渠学习平台上提交。
      en:
        - Finally, your assignment. There are four questions.
        - ">One, calculation and diagnosis. At four thousand stitches a minute the hook point arrives at 198 degrees. Will stitches be skipped? Convert the error to milliseconds, and say which way to adjust and what to re-check."
        - ">Two, analysis. Why does the hook have to turn twice per stitch?"
        - ">Three, timing. Why must feeding wait until the needle has left the fabric?"
        - ">Four, a shop-floor case. A machine sews thin fabric fine but skips on heavy denim. Find at least three causes."
        - Submit the assignment and the lab report on the WenQuest platform.

  - id: outro
    kind: outro
    points:
      - ["两根轴、四条链，永远同步：知道主轴转角，就知道每个机构在哪里", "Two shafts, four trains, always in step: the shaft angle tells you where everything is"]
      - ["线环在机针回升约 2 mm 时最大，梭尖必须在那一刻钩住", "The loop is fullest at about 2 mm of needle rise; the hook must catch it then"]
      - ["每分钟五千针时，十度只有三分之一毫秒", "At five thousand stitches a minute, ten degrees is a third of a millisecond"]
    say:
      zh:
        - 这一讲的要点有三条。
        - ">第一，缝纫机里只有两根轴、四条传动链，永远同步。"
        - ">第二，线环在机针回升约 2 毫米时最大，梭尖必须在那一刻钩住它。"
        - ">第三，每分钟五千针，十度只有三分之一毫秒。"
        - 虚拟实验、三维样机、讲义和作业都在问渠学习平台，免费注册就能学。
        - 下一讲，我们推导针杆的曲柄滑块机构。我们下一讲见。
      en:
        - Three things to take away.
        - ">One. A sewing machine has two shafts and four drive trains, always in step."
        - ">Two. The loop is fullest at about 2 millimetres of needle rise, and the hook must catch it right then."
        - ">Three. At five thousand stitches a minute, ten degrees is a third of a millisecond."
        - The virtual labs, the 3D prototype, the notes and the assignment are all on the WenQuest learning platform, at [learn.wenquestrobotics.com|learn dot wen quest robotics dot com]. Sign up for free and start learning.
        - Next time we derive the needle bar's slider-crank mechanism. See you then.
