  - id: lab311
    kind: lab
    lab: aiqc
    part: ["虚拟实验", "Virtual lab"]
    viewport: [1600, 900]
    steps:
      - js: "(() => { document.body.style.zoom = '0.7'; window.scrollTo(0, 0); const st = document.createElement('style'); st.textContent = '#checks0,#checks1,#tasks,#msg,#tp,#fp,#fn,#tn{filter:blur(7px) grayscale(1)}'; document.head.appendChild(st); document.querySelectorAll('p.note').forEach(n => { n.style.visibility = 'hidden'; }); document.getElementById('tab0').click(); document.getElementById('reset0').click(); const f = (id, v) => { const e = document.getElementById(id); e.value = v; e.dispatchEvent(new Event('input', {bubbles: true})); }; [1.5, 1.0, 0.5, 1.0, 2.5, 3.0, 3.5, 2.5].forEach((v, i) => setTimeout(() => f('t', v), 1500 + i * 900)); })()"
        dur: 10
      - js: "(() => { const f = (id, v) => { const e = document.getElementById(id); e.value = v; e.dispatchEvent(new Event('input', {bubbles: true})); }; f('t', 1.88); [40, 70, 100].forEach((v, i) => setTimeout(() => f('cm', v), 800 + i * 900)); setTimeout(() => f('cm', 20), 3800); [1.5, 3, 5].forEach((v, i) => setTimeout(() => f('cf', v), 4600 + i * 900)); setTimeout(() => f('cf', 0.5), 7400); })()"
        dur: 8
      - js: "(() => { const f = (id, v) => { const e = document.getElementById(id); e.value = v; e.dispatchEvent(new Event('input', {bubbles: true})); }; [0.05, 0.1, 0.15, 0.1].forEach((v, i) => setTimeout(() => f('prev', v), 600 + i * 900)); [0.03, 0.01, 0.005].forEach((v, i) => setTimeout(() => f('prev', v), 4600 + i * 900)); })()"
        dur: 8
      - js: "(() => { const f = (id, v) => { const e = document.getElementById(id); e.value = v; e.dispatchEvent(new Event('input', {bubbles: true})); }; f('prev', 0.02); [3.0, 2.5, 2.0, 3.0, 4.5, 5.0].forEach((v, i) => setTimeout(() => f('dp', v), 800 + i * 900)); setTimeout(() => document.getElementById('reset0').click(), 6800); })()"
        dur: 8
      - js: "(() => { document.getElementById('tab1').click(); window.scrollTo(0, 0); document.getElementById('reset1').click(); const f = (id, v) => { const e = document.getElementById(id); e.value = v; e.dispatchEvent(new Event('input', {bubbles: true})); }; [1.08, 1.05, 1.25, 1.4, 1.15].forEach((v, i) => setTimeout(() => f('thr', v), 2000 + i * 1100)); })()"
        dur: 9
      - js: "(() => { const f = (id, v) => { const e = document.getElementById(id); e.value = v; e.dispatchEvent(new Event('input', {bubbles: true})); }; [5, 10, 14].forEach((v, i) => setTimeout(() => f('w', v), 800 + i * 1400)); setTimeout(() => f('w', 1), 5400); setTimeout(() => f('thr', 1.3), 6400); setTimeout(() => f('w', 7), 7400); })()"
        dur: 9
    say:
      zh:
        - ">下面是虚拟实验 31-1，AI 质检与预测维护，在问渠平台上可以亲手做，结果栏、混淆矩阵的数字和任务先遮住。第①页“视觉质检的阈值”：先用默认值记下召回率、误报率、精确率和每 1000 件成本，再拖动报警阈值，看得分分布上的竖线、ROC 和成本曲线上的圆点一起移动。"
        - ">再改漏检一件和误报一件的代价，看成本曲线的谷底往哪边走，用 t* 公式核对。任务一要你在默认代价下找到成本最低的阈值。"
        - ">任务二把阈值放回 1.88，把次品率改成 10% 和 1%，记下精确率和报警件数：检测器一点没变，报警的可信度却差很多。"
        - ">任务三在次品率 2% 下逐步加大区分能力 d′，配合调阈值，找出精确率和召回率同时达标所需的最小 d′。"
        - ">第②页是预测性维护：先用默认值记下检出率、平均提前量和每台每月误报，再拖报警阈值，看三台机器的三角报警怎样增减。"
        - ">任务四在噪声 0.08 下组合调滑动平均窗口和阈值，让检出率、误报和提前量同时满足要求，再试长窗口比一比。指导书和报告模板在平台上。"
      en:
        - ">Now Virtual lab 31-1, AI inspection and predictive maintenance. The results, the confusion-matrix numbers and the tasks are blurred. Page one is the inspection threshold. Record recall, false-alarm rate, precision and cost per 1000 pieces at the defaults, then drag the alarm threshold and watch the line on the score plot and the dots on the ROC and cost curves move together."
        - ">Next, change the cost of a miss and of a false alarm, see which way the bottom of the cost curve moves, and check it with the t-star formula. Task one asks for the cheapest threshold at the default costs."
        - ">Task two puts the threshold back at 1.88 and sets the defect rate to 10 and then 1 percent; record precision and the alarm count. The inspector hasn't changed at all, yet its alarms mean something very different."
        - ">Task three keeps 2 percent defects and raises the discriminability d-prime step by step, retuning the threshold, to find the smallest d-prime that meets the precision and recall targets together."
        - ">Page two is predictive maintenance. Record detection rate, average lead time and false alarms per machine a month at the defaults, then drag the alarm threshold and watch the triangles on the three machines come and go."
        - ">Task four keeps the noise at 0.08 and combines the moving-average window and threshold until detection, false alarms and lead time all meet the targets; then try a long window and compare. The guide and report template are on the platform."

