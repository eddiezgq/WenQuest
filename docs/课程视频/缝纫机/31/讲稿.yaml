    say:
      zh:
        - ">学完还有一份九道题的测验，比如：一个检测器召回率 95%、误报率 3%，车间次品率 5%，它的精确率是多少？"
        - ">再比如判断题：次品率 2% 时，一个永远判“合格”的检测器准确率也有 98%，所以准确率几乎说明不了质检模型的好坏，对不对？"
        - ">这份测验可以做三次，交卷后马上能看到每题的解析。"
      en:
        - ">There's also a nine-question quiz. For example: an inspector has 95 percent recall and 3 percent false alarms, and the defect rate is 5 percent. What is its precision?"
        - ">Or true or false: at a 2 percent defect rate, an inspector that always says 'good' is 98 percent accurate, so accuracy says almost nothing about an inspection model."
        - ">You get three attempts, and the explanations appear as soon as you submit."

