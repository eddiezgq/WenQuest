intro:
  zh:
    - 同学们好，欢迎来到问渠。
    - 这是《缝纫机设计与制造》第三十一讲，也是最后一讲：人工智能与制衣业。
    - 上一讲往前看了十年的设备；今天看人工智能，问它三件事：吃什么数据，怎样评价，会在哪里出错。
    - 这次视频重点讲视觉质检的报警该不该信，和预测性维护怎样取舍；设计、排料、就业这些话题只点到为止，详细内容在课件里。
  en:
    - Hi everyone, and welcome to Sewing Machine Design and Manufacturing at WenQuest.
    - This is Lecture 31, the last one in the course, on artificial intelligence in apparel making.
    - "Last time we looked ten years ahead at the machines. Today we look at AI and ask it three things: what data it eats, how it's judged, and where it goes wrong."
    - "This video concentrates on whether a vision inspector's alarms can be trusted and on the trade-offs in predictive maintenance; design, marker making and jobs get only a mention here, with the details in the slides."

