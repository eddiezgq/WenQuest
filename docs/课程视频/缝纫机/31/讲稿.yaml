  - id: homework
    part: ["作业", "Assignment"]
    slide:
      layout: points
      title: ["作业 31：为领子工段选一套视觉质检方案", "Assignment 31: choosing a vision inspection scheme for the collar section"]
      points:
        - ["供应商 A：报警数、精确率、两种阈值的成本", "Vendor A: alarms, precision, cost at two thresholds"]
        - ["供应商 B：最省阈值、成本、所需 d′", "Vendor B: cheapest threshold, cost, the d′ needed"]
        - ["验收与运行方案：验证、换款重验、重训、调阈值", "Acceptance and operating plan: validate, re-check, retrain, tune"]
      foot: ["作业和实验报告都在问渠学习平台提交。", "Submit the assignment and the lab report on WenQuest."]
    say:
      zh:
        - ">作业一共三道题。第一题，供应商 A 的检测器召回率 90%、误报率 5%，车间次品率 3%：求每 1000 件的报警数和精确率；漏检一件 30 元、误报一件 1 元，求每 1000 件成本；提高阈值后召回率降到 80%、误报率降到 2%，成本变为多少，选哪个阈值，为什么。"
        - ">第二题，供应商 B 声称 d′ 为 3.53：按等方差正态模型，在次品率 2%、漏检 20 元、复检 0.5 元时求最省阈值和每 1000 件成本；车间要求精确率不低于 80%、召回率不低于 90%，B 能不能满足，需要的 d′ 是多少。"
        - ">第三题写一份验收与运行方案：上线前用自己工段的样本验证哪些指标，换款、换面料时怎样重新验证，误报和漏检样本怎样收集、多久重训，报警阈值由谁按什么数据调整。"
        - 作业和实验报告都在问渠学习平台上提交。
      en:
        - ">The assignment has three questions. One: Vendor A's inspector has 90 percent recall and 5 percent false alarms, and the defect rate is 3 percent. Find alarms per 1000 pieces and precision. With a miss costing 30 yuan and a false alarm 1 yuan, find the cost per 1000; if a higher threshold gives 80 percent recall and 2 percent false alarms, what's the cost then? Which threshold would you pick, and why?"
        - ">Two: Vendor B claims a d-prime of 3.53. Using the equal-variance normal model, with 2 percent defects, 20 yuan per miss and 0.5 per recheck, find the cheapest threshold and the cost per 1000. If the section needs at least 80 percent precision and 90 percent recall, can B deliver, and what d-prime is needed?"
        - ">Three: write an acceptance and operating plan. Which metrics will you validate on your own section's samples before go-live, how will you re-validate when the style or fabric changes, how are false alarms and misses collected and how often is the model retrained, and who adjusts the threshold, using what data?"
        - Submit the assignment and the lab report on the WenQuest platform.

