code: [ch07]
title: ["线张力与线迹质量：两根线怎样收紧在布的中间", "Thread Tension and Stitch Quality: Locking Two Threads in the Middle of the Cloth"]
chapter: ["第二篇 平缝机机构 · 第 7 章", "Part II Lockstitch Mechanisms · Chapter 7"]
next: ["第 8 讲 运动协调与整机动力学", "Lecture 8 Motion coordination and machine dynamics"]
cover_formula: 'T_2 = T_1\,e^{\mu\theta}'
tags:
  zh: [线张力, 夹线器, 线迹平衡, 缝皱, 绞盘公式, 缝纫机设计]
  en: [thread tension, tension assembly, stitch balance, seam pucker, capstan equation, sewing machine design]

intro:
  zh:
    - 同学们好，欢迎来到问渠。
    - 这是《缝纫机设计与制造》第七讲，线张力与线迹质量。
    - 面线和底线一上一下拉着，交织点要停在布的中间。拉偏了会冒底线、浮线；两根都太紧，看着平衡，布却会起皱、断线。
  en:
    - Hi everyone, and welcome back to Sewing Machine Design and Manufacturing at WenQuest.
    - This is Lecture 7, thread tension and stitch quality.
    - The needle thread pulls from above, the bobbin thread from below, and the point where they lock should sit right in the middle of the cloth. Pull it off-centre and you get bobbin dots on top or loops underneath; pull both too hard and the stitch looks balanced, yet the seam puckers and the thread breaks.

after:
  - id: lab71
    kind: lab
    lab: tension
    part: ["虚拟实验", "Virtual lab"]
    viewport: [1600, 900]
    steps:
      - js: "['meter','state','tasks','secNote'].forEach(i => { const e = document.getElementById(i); if (e) e.style.filter = 'blur(7px) grayscale(1)'; })"
      - sweep: {p_Td: [60, 160]}
        dur: 8
      - press: mess
      - sweep: {p_Td: [230, 190]}
        dur: 5
      - press: lowb
        sweep: {p_Tb: [15, 24]}
        dur: 5
      - set: {fab: denim}
        js: "window.scrollTo(0, 470)"
      - set: {th: t40}
        js: "document.getElementById('map').style.filter = 'blur(7px) grayscale(1)'"
      - set: {fab: lining, th: t24}
        js: "document.getElementById('map').style.filter = ''; window.scrollTo(0, 0)"
    say:
      zh:
        - ">下面是本讲的虚拟实验 7-1，在问渠学习平台上可以亲手做。读数、状态和任务判定这里先遮住，留给你自己读。"
        - ">先只拖夹线器滑杆，看交织点怎样上下走，记下它离开 0.4 到 0.6 的两个值，和教材比一比。"
        - ">任务一：按打乱张力，模拟一台被人乱调过的机器。"
        - ">先看交织点偏向哪面、布皱不皱，判断哪根线相对太紧，还是两根都太紧，再动手调。"
        - ">任务二：按底线太松的机器，正面冒出底线。这一次只许动底线滑杆，夹线器、线和面料都不动。"
        - ">任务三：面料换成牛仔布四层，转速 5000 以上。先用 Tex 24 找可用区，看看紫色的断线风险有多大，"
        - ">再换 Tex 40 的粗线，调到平衡、不松、不断。"
        - ">任务四：衬里两层，保持平衡，把两根线一起降到刚好不松，起皱不超过 0.15%。指导书和报告模板在平台上下载。"
      en:
        - ">Now Virtual lab 7-1. On the WenQuest platform you can do it yourself. The readings, the status and the task checks are blurred here. Read them yourself when you work the lab."
        - ">First drag only the assembly slider and watch the lock point move. Note the two settings where it leaves 0.4 to 0.6, and compare them with the book."
        - ">Task one. Press Scramble tension, which imitates a machine someone has fiddled with."
        - ">First see which way the lock point has gone and whether the cloth puckers. Decide whether one thread is relatively too tight or both are, and only then adjust."
        - ">Task two. Press Machine with a loose bobbin, and bobbin dots show on top. This time you may move only the bobbin slider, leaving the assembly, the thread and the cloth alone."
        - ">Task three. Switch to four plies of denim at 5000 rpm or more. First look for a usable region with Tex 24 and see how big the purple breakage area is,"
        - ">then change to heavier Tex 40 thread and get a stitch that is balanced, firm and unbroken."
        - ">Task four. Two plies of lining. Keep it balanced and lower both threads together until they're just firm enough, with pucker no more than 0.15 percent. The guide and the report template are on the platform."

