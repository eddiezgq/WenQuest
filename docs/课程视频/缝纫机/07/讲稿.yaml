        - ">这份测验可以做三次，交卷后马上能看到每题的解析。"
      en:
        - ">There's also a ten-question quiz. For example, the needle thread wraps a guide through 120 degrees with mu of 0.2. By what factor is the tension multiplied? Watch the units of the angle."
        - ">Or, if the lock point sits in the middle of the cloth, must the two tensions be the right size?"
