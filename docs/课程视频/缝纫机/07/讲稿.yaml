  - id: homework
    part: ["作业", "Assignment"]
    slide:
      layout: points
      title: ["作业 7：线张力计算与线迹诊断", "Assignment 7: tension calculations and stitch diagnosis"]
      points:
        - ["夹线器与过线件：张力一路怎样变；平衡区的夹线器范围", "Assembly and guides along the path; the assembly range for balance"]
        - ["牛仔四层：夹线器最小值、收紧峰，Tex 24 与 Tex 40 选哪种", "Denim: least setting, tightening peak; Tex 24 or Tex 40"]
        - ["诊断：昨天正常、今天冒底线，越拧越松反而浮线", "Diagnosis: bobbin dots today, loops after loosening"]
      foot: ["交一份 PDF（3–4 页），另交虚拟实验 7-1 的实验报告，都在问渠学习平台提交。", "One PDF of 3–4 pages, plus the Lab 7-1 report, both submitted on WenQuest."]
    say:
      zh:
        - ">作业一共四道题。第一题，算面线经过夹线器和三个过线件后的张力。第二题，求棉布上让交织点落在平衡区、又不太松的夹线器范围，并在虚拟实验里截图验证。"
        - ">第三题，牛仔布四层，求夹线器最小设定和收紧峰，判断 Tex 24 和 Tex 40 哪种能用。"
        - ">第四题是诊断：机器昨天正常，今天冒底线，夹线器越拧越松，反面又浮线。分析原因，写出正确的处理步骤。"
        - 作业和实验报告都在问渠学习平台上提交。
      en:
        - ">Your assignment has four questions. One, the needle-thread tension after the assembly and three guides. Two, the assembly range on cotton that keeps the lock point balanced and firm, checked with a screenshot from the virtual lab."
        - ">Three, four plies of denim. Find the least assembly setting and the tightening peak, and decide whether Tex 24 or Tex 40 will do."
        - ">And four, diagnosis. A machine was fine yesterday, but today bobbin dots show on top, and loosening the assembly only brings loops underneath. Explain the cause and write the correct procedure."
        - Submit the assignment and the lab report on the WenQuest platform.

