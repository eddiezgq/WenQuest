        - ">Shorten the link, and does the catch come earlier or later?"
        - ">You get three attempts, and the explanations appear as soon as you submit."

  - id: outro
    kind: outro
    points:
      - ["针杆是倒挂的曲柄滑块：上下止点和发动机对调", "The needle bar is an upside-down slider-crank: dead centres swapped from an engine"]
      - ["下止点加速度 rω²(1 + λ) 最大，惯性力与转速平方成正比", "Bottom acceleration rω²(1 + λ) is the largest; inertia force grows with speed squared"]
      - ["二阶力平衡块抵消不了，减轻往复质量最有效", "The counterweight can't cancel the second-order force; cutting mass works best"]
    say:
      zh:
        - 这一讲的要点有三条。
        - ">第一，针杆是倒挂的曲柄滑块，上下止点和发动机正好对调。"
        - ">第二，下止点加速度最大，惯性力和转速的平方成正比，提速两成，力就大四成多。"
        - ">第三，平衡块对二阶惯性力无能为力，减轻往复质量最有效。"
        - 虚拟实验、三维样机、作业和测验都在问渠学习平台，免费注册就能学。
        - 下一讲，我们看挑线机构，看它怎样在对的时刻放线和收线。我们下一讲见。
      en:
        - Three things to take away.
        - ">One. The needle bar is an upside-down slider-crank, with its dead centres swapped from an engine's."
        - ">Two. The acceleration is largest at bottom dead centre, and inertia force grows with the square of speed. Twenty percent faster means over forty percent more force."
        - ">Three. The counterweight can't touch the second-order force. Cutting the reciprocating mass works best."
        - The virtual labs, the 3D prototype, the assignment and the quiz are all on the WenQuest learning platform, at [learn.wenquestrobotics.com|learn dot wen quest robotics dot com]. Sign up for free and start learning.
        - Next time it's the take-up mechanism, and how it pays thread out and pulls it back at just the right moments. See you then.
