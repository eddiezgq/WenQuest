# 《缝纫机设计与制造》公开课 第 19 讲：电控原型平台与零件库
# 第 25 轮起的视频标准：画面就是这一讲的网页互动课件（course/slides/ch19.yaml），配音是课件每页的讲稿（notes），
# 中文版放双语课件，英文版放只显示英文的课件；每页按句子让要点逐条出现。这里只写开场、课后部分和结尾。
# 课后部分（约 5 分钟）：虚拟实验 19-1（零件库快速配套器）录屏、平台学习方式页（第 23 轮 3.4：本讲不放数字工厂）、作业页、测验页。
# 数字一律由 course/calc/ch19.py 算出（{{ch19.键:格式}}）。实验镜头 steps 数 = “>” 个数（第一步也用一个 “>” 句触发）。
book: sewing
section: "19"
deck: ch19
skip: [3, 4, 8, 9, 10, 13, 16, 18, 19, 22, 24]   # 第一节章节页、原型与产品的确定性、第二节（章节页、需求表、零件库条目）、驱动器数字页（并进回答页讲稿和第 14 页判据动画）、一份数据生成三样、换机种（也是实验任务二答案）、AI 选型助手、状态机、五道门：控制课程部分约 10 分钟；这几页留给课件和测验
code: [ch19]
title: ["电控原型平台与零件库——12 周，做出一台能缝的样机", "The Prototyping Platform and the Parts Library — Twelve Weeks to a Prototype That Sews"]
chapter: ["第五篇 电气控制 · 第 19 章", "Part V Electrical Control · Chapter 19"]
next: ["第 20 讲", "Lecture 20"]
cover_formula: 'T = J\,\alpha + T_f \le 0.8\,T_{peak}'
tags:
  zh: [电控原型, 零件库, 快速配套, 伺服选型, 惯量比, 等效转矩, 急停回馈, 电磁铁, 事件表, 硬件在环, 缝纫机设计]
  en: [control prototype, parts library, rapid configuration, servo sizing, inertia ratio, RMS torque, regenerative energy, solenoid, event table, hardware in the loop, sewing machine design]

intro:
  zh:
    - 同学们好，欢迎来到问渠。
    - 这是《缝纫机设计与制造》第十九讲，电控原型平台与零件库。
    - 前面几讲把电机、电磁铁、控制和电控箱一样样讲完了。今天把它们攒成一台真能缝的样机：选什么模块，怎么算，固件怎么写，怎么测。
    - 需求表和零件库条目的写法、AI 选型助手、状态机和从原型到产品的五道门，留给课件。
  en:
    - Hi everyone, and welcome back to Sewing Machine Design and Manufacturing at WenQuest.
    - This is Lecture 19, the prototyping platform and the parts library.
    - Over the last few lectures we covered motors, solenoids, control and the control box one by one. Today we put them together into a prototype that really sews. Which modules, how to size them, how to write the firmware, and how to test it.
    - How to write requirements and library entries, the AI selection assistant, the state machine and the five gates from prototype to product are left to the slides.

after:
  - id: lab191
    kind: lab
    lab: config
    part: ["虚拟实验", "Virtual lab"]
    viewport: [1600, 900]
    steps:
      - js: "(() => { document.documentElement.setAttribute('data-theme', 'dark'); document.body.style.zoom = '0.7'; window.scrollTo(0, 0); const st = document.createElement('style'); st.textContent = '#bom tr:last-child{filter:blur(7px)}'; document.head.appendChild(st); for (const id of ['checks', 'tasks', 'cost']) document.getElementById(id).closest('section').style.filter = 'blur(7px) grayscale(1)'; if (!window.__wqIn) { window.__wqIn = 1; document.addEventListener('input', e => { if (e.target.closest && e.target.closest('#req')) { e.target.value = Math.round(+e.target.value); e.target.dispatchEvent(new Event('change', {bubbles: true})); } }, true); } })()"
      - press: "#btnAuto"
      - js: "(() => { const d = document.querySelector('#bom [data-slot=drv]'); d.value = '1A5'; d.dispatchEvent(new Event('change', {bubbles: true})); })()"
      - js: "(() => { const d = document.querySelector('#bom [data-slot=drv]'); d.value = '3A'; d.dispatchEvent(new Event('change', {bubbles: true})); })()"
        sweep: {f_n_trim: [300, 440]}
        dur: 6
      - press: ["[data-k=OL]", "#btnReset", "#btnAuto"]
        sweep: {f_n_max: [6000, 7000]}
        dur: 6
      - press: ["[data-k=PS]", "#btnReset", "#btnAuto"]
      - js: "(() => { const e = document.getElementById('f_transY'); e.value = 'screw:16x10'; e.dispatchEvent(new Event('change', {bubbles: true})); })()"
    say:
      zh:
        - ">下面是虚拟实验 19-1，零件库快速配套器，在问渠平台上可以亲手做。右边的判据、任务和总价先遮住，留给你自己读。左上是需求表，中间是 BOM。打开时是一台“上一代样机”的配置，先别急着配套，看看哪些判据不满足。"
        - ">点“自动配套”，配套器对每一类模块逐个规格查判据，挑出全部满足的规格里最便宜的。对照课件里的算例核对。"
        - ">任务一：在 BOM 的下拉框里把伺服驱动器手动换成 1.5 安那档，看哪几条判据变成叉、差多少，和课件里的算例对一对。"
        - ">换回 3 安，再把剪线转速从 300 往上调，盯着剪线电磁铁的折算转角，看它在哪儿超过 20 度，和课件里算出的最高剪线转速对一对。"
        - ">任务二：切到包缝机，恢复默认需求、自动配套，记下方案和总价；再只把最高转速改成 7000、不换件，看哪些判据变成叉。之后再自动配套，要换哪些模块、多花多少钱，留给你自己找。"
        - ">任务三：切到花样机，自动配套，记下 X、Y 两根轴的传动、电机和固有频率。"
        - ">再把 Y 轴传动改成丝杠，看哪些判据失败，想一想导程怎样把电机转速放大。指导书和报告模板在平台上下载。"
      en:
        - ">Now Virtual lab 19-1, the parts-library configurator, which you can do yourself on WenQuest. The criteria, tasks and total on the right are blurred; they're for you to work out in the lab. Top left is the requirements table, in the middle the BOM. It opens with a previous prototype's parts; before configuring, check which criteria fail."
        - ">Click Configure automatically. For each category the configurator checks every size against the criteria and takes the cheapest that passes. Check it against the worked example in the slides."
        - ">Task one: in the BOM drop-down, swap the servo drive to the 1.5-amp size by hand see which criteria fail and by how much, and compare with the worked example in the slides."
        - ">Put the 3-amp drive back, then raise the trimming speed from 300 and watch the trim solenoid's angle check. See where it goes past 20 degrees, and compare with the top trimming speed worked out in the slides."
        - ">Task two: switch to the overlock, reset the requirements, auto-configure, and note the design and total. Then change only the top speed to 7000 without swapping parts and see which checks fail. Which modules a new configuration replaces, and what it costs, is yours to find."
        - ">Task three: switch to the pattern sewer, auto-configure, and note each axis's drive, motor and natural frequency."
        - ">Then change the Y drive to a ball screw, see which checks fail, and think about how the lead multiplies motor speed. The guide and report template are on the platform."

