  - id: homework
    part: ["作业", "Assignment"]
    slide:
      layout: points
      title: ["作业 19：厚料平缝机原型的快速配套", "Assignment 19: rapid configuration for a heavy-fabric prototype"]
      points:
        - ["4500 r/min、0.12 s：七条判据选电机 + 驱动器", "4500 r/min in 0.12 s: seven criteria pick motor + drive"]
        - ["400 r/min 剪线：M15 还是 L30；写事件表剪线行", "Trim at 400 r/min: M15 or L30; write the trim row"]
        - ["讨论：剪线率从 99.7% 掉到 98%，怎样查得出来", "Discussion: trims drop from 99.7% to 98%; how to trace it"]
      foot: ["3–5 页 PDF 报告，附计算表和实验截图，在问渠学习平台提交。", "A 3–5 page PDF with calculation tables and lab screenshots, submitted on WenQuest."]
    say:
      zh:
        - ">作业一共四道题，都围绕一台厚料平缝机头。第一题，负载惯量 6 乘 10 的负 4 次方，最高 4500 转，0.12 秒内加速到位，按七条判据把每档电机算一遍，选出最便宜的电机加驱动器。"
        - ">第二题，厚料剪线要在 400 转下动作，M15 和 L30 哪个满足 20 度，用虚拟实验验证时需求表要改哪几项。第三题，改用直接驱动动刀，剪线起始角在 290 到 300 度，写出事件表里剪线这一行，说清楚为什么不能写成松开脚踏后延时 180 毫秒通电。"
        - ">第四题讨论：原型剪线成功率 99.7%，组员改了拨线角度后掉到 98%，却说不清改了什么。按本讲版本、测试和上报的做法，设计一套能把问题查出来的办法。"
        - 报告在问渠学习平台上提交。
      en:
        - ">Your assignment has four questions about one heavy-fabric lockstitch head. One: with a load inertia of 6 times 10 to the minus 4, a top speed of 4500 r/min reached in 0.12 seconds, run every motor size through the seven criteria and choose the cheapest motor and drive pair."
        - ">Two: heavy-fabric trimming happens at 400 r/min. Which of M15 and L30 stays within 20 degrees, and which requirement fields would you change to check it in the lab? Three: with a directly driven knife the trim starts between 290 and 300 degrees. Write the trim row of the event table, and explain why it must not be written as energise 180 milliseconds after the pedal is released."
        - ">Four is a discussion: the prototype trims at 99.7 percent, a teammate changes the wiper angle, success drops to 98, and nobody can say what changed. Using this lecture's approach to versions, tests and reporting, design a way to trace such problems."
        - Submit the report on the WenQuest platform.

  - id: quiz
    part: ["测验", "Quiz"]
    slide:
      layout: points
      title: ["课后测验：10 题，即时反馈", "After-class quiz: 10 questions, instant feedback"]
      points:
        - ["7×10⁻⁴ kg·m²、0.15 s 到 4500 r/min：要多大转矩？", "7×10⁻⁴ kg·m², 4500 r/min in 0.15 s: what torque?"]
        - ["事件调度能不能放在 1 ms 的任务里轮询角度？", "Can event scheduling poll the angle in a 1 ms task?"]
        - ["可以做三次，交卷后立刻看到解析", "Three attempts, explanations as soon as you submit"]
    say:
      zh:
        - ">学完还有一份十道题的测验，比如：主轴总惯量 7 乘 10 的负 4 次方，0.15 秒内从静止加速到 4500 转，再加 0.15 牛米摩擦，要多大的加速转矩？"
        - ">再比如：5000 转时主轴转过 0.1 度只要三微秒多，事件调度能不能放在 1 毫秒一次的任务里轮询角度？"
        - ">这份测验可以做三次，交卷后马上能看到每题的解析。"
      en:
        - ">There's also a ten-question quiz. For example, a spindle with a total inertia of 7 times 10 to the minus 4 must reach 4500 r/min from rest in 0.15 seconds, with 0.15 newton-metres of friction. What acceleration torque does it need?"
        - ">Or, at 5000 r/min the spindle turns 0.1 degree in just over three microseconds; can event scheduling poll the angle in a task that runs once a millisecond?"
        - ">You get three attempts, and the explanations appear as soon as you submit."

