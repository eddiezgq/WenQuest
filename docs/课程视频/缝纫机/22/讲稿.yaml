intro:
  zh:
    - 同学们好，欢迎来到问渠。
    - 这是《缝纫机设计与制造》第二十二讲，自动化测试与持续迭代。
    - 今天从一次升级后偶尔剪不断线的故障讲起，回答三个问题：在什么工况下测，测多少次，用多真实的模型测。
  en:
    - Hi everyone, and welcome back to Sewing Machine Design and Manufacturing at WenQuest.
    - This is Lecture 22, automated testing and continuous iteration.
    - We start from a firmware update that made trims fail now and then, and answer three questions. Under what conditions do we test, how many times, and with how realistic a model?

after:
  - id: lab221
    kind: lab
    lab: testbench
    part: ["虚拟实验", "Virtual lab"]
    viewport: [1600, 900]
    steps:
      - js: "(() => { document.body.style.zoom = '0.85'; window.scrollTo(0, 0); const st = document.createElement('style'); st.textContent = '#tasks,#cN,#dR{filter:blur(7px) grayscale(1)}'; document.head.appendChild(st); })()"
      - js: "document.querySelector('[data-v=\"v1.4.0\"]').click();document.querySelector('[data-l=sil]').click();document.getElementById('def').click();document.getElementById('run').click();setTimeout(function(){window.scrollTo(0, 420)},1500)"
        dur: 4
      - js: "window.scrollTo(0, 0);document.querySelector('[data-l=hil]').click();document.getElementById('def').click();document.getElementById('run').click();setTimeout(function(){window.scrollTo(0, 560)},2000)"
        dur: 5
      - js: "window.scrollTo(0, 0);document.querySelector('[data-v=\"v1.3.2\"]').click();document.getElementById('none').click();document.querySelector('[data-c=HIL-TRM-SW]').click();document.getElementById('run').click();setTimeout(function(){window.scrollTo(0, 420)},2000)"
        dur: 5
      - js: "window.scrollTo(0, 0);document.querySelector('[data-v=\"v1.4.0\"]').click();document.getElementById('def').click();setTimeout(function(){document.querySelector('[data-c=HIL-TRM-SW]').click()},1500)"
        dur: 4
      - js: "(() => { const st = document.createElement('style'); st.textContent = '#tbody,#sum,#trend,#trendnote{filter:blur(7px) grayscale(1)}'; document.head.appendChild(st); document.querySelector('[data-l=bench]').click();document.getElementById('def').click();document.getElementById('run').click();setTimeout(function(){document.querySelector('[data-v=\"v1.4.2\"]').click();document.getElementById('def').click();document.getElementById('run').click();window.scrollTo(0, 99999)},4500); })()"
        dur: 7
      - js: "(() => { window.scrollTo(0, 0); const f = (id, v) => { const e = document.getElementById(id); e.value = v; e.dispatchEvent(new Event('input', {bubbles: true})); }; f('cR', 99.5); f('cC', 95); f('cX', 0); f('dN', 1000); f('dX', 0); setTimeout(function(){f('cX', 1)}, 2500); setTimeout(function(){f('dX', 1)}, 4500); setTimeout(function(){f('dX', 2)}, 6500); })()"
        dur: 8
    say:
      zh:
        - ">下面是虚拟实验 22-1，自动化测试台，在问渠平台上可以亲手做。任务和计算结果先遮住。左边选版本、层级和用例，右上是版本记录。"
        - ">先选 v1.4.0、软件在环 SIL，跑默认用例集。理想电机模型下，三条用例全部通过。"
        - ">换成硬件在环 HIL，再跑默认用例集。剪线定在 4000 转、停针只停一次，七条用例也全是绿的，这正是开头漏掉的情况。"
        - ">任务一：只勾选剪线转速扫描，先在 v1.3.2 上跑，看各转速点的失败数和置信下限；再逐个换版本比较，找出引入回归的版本和需求编号。"
        - ">任务二：回到 v1.4.0 的默认用例集，再加上剪线扫描，预算条变红，超过了每晚 240 分钟。怎样删换，才能留住故障注入、又抓住剪线和停针两个回归，自己挑。"
        - ">再换到整机测试台，分别在 v1.4.0 和 v1.4.2 上跑一遍，到下面的版本趋势图里比较剪线最差点的失败率和停针最大值。结果先遮住，你自己跑了再比。"
        - ">任务三：在计算器里填可靠度 99.5%、置信度 95%，失败次数填 0 和 1，读出试验次数；再看 1000 次失败 0、1、2 次的置信下限。指导书和报告模板在平台上。"
      en:
        - ">Now Virtual lab 22-1, the automated test bench, which you can do yourself on WenQuest. Tasks and results are blurred. Pick a version, a level and cases on the left; top right is the change log."
        - ">First choose v1.4.0 and software-in-the-loop, and run the default set. With an ideal motor model, all three cases pass."
        - ">Switch to hardware-in-the-loop and run the default set again. With trimming fixed at 4000 r/min and a single stop, all seven cases are green too: exactly how the regression slipped through."
        - ">Task one: tick only the trim speed sweep and run it on v1.3.2 first. Read the failures at each speed and the lower bound, then compare the other versions to find which one introduced the regression, and which requirement fails."
        - ">Task two: back to the default set on v1.4.0, add the trim sweep, and the budget bar turns red, over 240 minutes a night. What would you swap so that fault injection stays and both the trim and stop regressions are caught? Your call."
        - ">Then switch to the machine test bench, run v1.4.0 and v1.4.2, and compare the worst-point trim failure rate and the maximum stop error in the trend chart below. The results are blurred; run it yourself and compare."
        - ">Task three: in the calculator enter 99.5 percent reliability and 95 percent confidence, with 0 and then 1 failure allowed, and read off the trials needed, then the lower bound for 0, 1 and 2 failures in 1000. The guide and report template are on the platform."

