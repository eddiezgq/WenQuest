  - id: homework
    part: ["作业", "Assignment"]
    slide:
      layout: points
      title: ["作业 22：剪线可靠性验证与每晚测试设计", "Assignment 22: trim reliability and nightly test design"]
      points:
        - ["99.8%/90%：零失效、允许 1 次各剪多少次", "99.8% at 90%: trials with 0 and with 1 failure"]
        - ["99% 把握抓住 1.2% 的回归 · 两个固件的 Cpk", "99% sure to catch a 1.2% regression · Cpk of two builds"]
        - ["包缝原型：4 条需求和每晚 240 min 的分配", "Overlock prototype: 4 requirements, 240 min a night"]
      foot: ["不超过 5 页的报告，附实验 22-1 计算器截图，在问渠学习平台提交。", "A report of at most 5 pages with Lab 22-1 calculator screenshots, submitted on WenQuest."]
    say:
      zh:
        - ">作业一共四道题。第一题，客户要求剪线成功率 99.8%、置信度 90%，零失效和允许 1 次失败各要剪多少次、多少分钟，次数该分到哪些工况上。"
        - ">第二题，某次改动可能让 4750 转的剪线失效率变成 1.2%，每晚要有 99% 的把握抓住它，至少剪多少次，放在 4000 转又如何。第三题，两个候选固件各停车 50 次，求单侧 Cpk，判断能否过 1.33。"
        - ">第四题，为包缝原型写 4 条验收需求，说明每条在哪一层、用什么用例验证，再给出每晚 240 分钟的 HIL 时间分配表和理由。"
        - 报告在问渠学习平台上提交。
      en:
        - ">Your assignment has four questions. One: a customer wants 99.8 percent trim success at 90 percent confidence. How many trims, and how many minutes, with zero failures and with one allowed, and over which conditions should they go?"
        - ">Two: a change may raise the trim failure rate at 4750 r/min to 1.2 percent. To be 99 percent sure of catching it each night, how many trims are needed, and what if they run at 4000 instead? Three: two candidate builds each stop 50 times. Find the one-sided Cpk and judge it against 1.33."
        - ">Four: write 4 acceptance requirements for the overlock prototype, say at which level and with which case each is verified, and give a 240-minute nightly HIL allocation with your reasons."
        - Submit the report on the WenQuest platform.

  - id: quiz
    part: ["测验", "Quiz"]
    slide:
      layout: points
      title: ["课后测验：10 题，即时反馈", "After-class quiz: 10 questions, instant feedback"]
      points:
        - ["99%、置信度 95%：零失效至少试几次？", "99% at 95% confidence: how many zero-failure trials?"]
        - ["停车 50 次：均值 0.40°、σ 0.12°，Cpk 是多少？", "50 stops, mean 0.40°, σ 0.12°: what is Cpk?"]
        - ["可以做三次，交卷后立刻看到解析", "Three attempts, explanations as soon as you submit"]
    say:
      zh:
        - ">学完还有一份十道题的测验，比如：要以 95% 的置信度证明成功率不低于 99%，零失效验证至少要做多少次？"
        - ">再比如：HIL 上停车 50 次，停针误差均值 0.40 度、标准差 0.12 度，上限 1 度，单侧 Cpk 是多少？"
        - ">这份测验可以做三次，交卷后马上能看到每题的解析。"
      en:
        - ">There's also a ten-question quiz. For example, to show at least 99 percent success at 95 percent confidence with zero failures, how many trials do you need?"
        - ">Or, 50 stops on HIL give a mean stop error of 0.40 degrees and a standard deviation of 0.12, with a 1 degree limit. What's the one-sided Cpk?"
        - ">You get three attempts, and the explanations appear as soon as you submit."

