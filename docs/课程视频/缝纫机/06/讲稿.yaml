book: sewing
section: "6"
deck: ch06
skip: [9, 15, 19, 20, 23, 26]   # 椭圆（下一页对比图里也有）、提前与推迟、牙高、压脚压力、下送布两难、模型边界：控制课程部分约 10 分钟（课件与教材里都有）
code: [ch06]
title: ["送布机构：布在什么时候动、动多少", "The Feed Mechanism: When and How Far the Cloth Moves"]
chapter: ["第二篇 机构 · 第 6 章", "Part II Mechanisms · Chapter 6"]
next: ["第 7 讲 线张力与线迹质量", "Lecture 7 Thread tension and stitch quality"]
cover_formula: 's = \tfrac{S}{2}\,(1-\cos 2\alpha)'
tags:
  zh: [送布机构, 送布牙, 送布定时, 针距调节器, 针送布, 平缝机]
  en: [feed dog, feed timing, stitch regulator, needle feed, sewing machine design]

intro:
  zh:
    - 同学们好，欢迎来到问渠。
    - 这是《缝纫机设计与制造》第六讲，送布机构。
    - 机针每扎一针，针板下的送布牙就要升起来咬住布，往前推一小段，再落下去退回。推早了、推晚了，或者上下两层没一起走，就会针距不匀、上层变长，甚至断针。
  en:
    - Hi everyone, and welcome back to Sewing Machine Design and Manufacturing at WenQuest.
    - This is Lecture 6, the feed mechanism.
    - On every stitch, the feed dog under the throat plate rises to bite the cloth, pushes it forward a little, then drops and goes back. Push too early or too late, or let the two plies move apart, and you get uneven stitches, a growing upper ply, or even a broken needle.

after:
  - id: lab61
    kind: lab
    lab: feed
    part: ["虚拟实验", "Virtual lab"]
    viewport: [1600, 900]
    steps:
      - js: "['meter','state','tasks','rdOut','modeNote','phase'].forEach(i => { const e = document.getElementById(i); if (e) e.style.filter = 'blur(7px) grayscale(1)'; })"
      - press: play
        sweep: {ang: [0, 360]}
        dur: 8
      - set: {p_h: "1.0"}
        js: "window.scrollTo(0, 480)"
      - press: [reset, mess]
        js: "window.scrollTo(0, 0)"
      - sweep: {p_dT: [20, 10]}
        dur: 5
      - sweep: {p_dP: [-25, -12]}
        dur: 5
      - press: reset
        set: {fab: denim}
        sweep: {p_dT: [0, -3]}
        dur: 5
      - set: {fab: lining}
        press: play
        sweep: {p_P: [0.6, 1.8]}
        dur: 6
    say:
      zh:
        - ">下面是本讲的虚拟实验 6-1，在问渠学习平台上可以亲手做。读数、状态和任务判定这里先遮住，留给你自己读。"
        - ">先按暂停，拖动主轴转角，对照侧视动画、轨迹和时序图，找出牙升出、落下和机针入布、出布的时刻。"
        - ">任务一：把牙高调到 1.0 毫米，从时序图读出牙升出和落下的角度，填进读图框按核对，再和 0.8 毫米比一比。"
        - ">任务二：按打乱定时，模拟一台没调好的机器。"
        - ">先用送布定时滑杆，把落牙时刻对到针眼上沿到达针板的时刻，"
        - ">再用相位差消除回拖，各项读数都达标才算完成。"
        - ">任务三：面料换成牛仔四层，把送布定时往前调，让布在针中的移动和回拖都达标。"
        - ">任务四：衬里滑料两层，从小到大调压脚压力，看打滑和错位怎样变化，下送布做不到就换送布方式。指导书和报告模板在平台上下载。"
      en:
        - ">Now Virtual lab 6-1. On the WenQuest platform you can do it yourself. The readings, the status and the task checks are blurred here. Read them yourself when you work the lab."
        - ">First press Pause and drag the shaft angle. Using the side view, the path and the timing chart, find when the dog emerges and drops, and when the needle enters and leaves."
        - ">Task one. Set the dog height to 1.0 millimetre, read the emerge and drop angles off the timing chart, enter them in the reading box and press Check. Then compare with 0.8."
        - ">Task two. Press Scramble timing, which imitates a badly adjusted machine."
        - ">First use the feed-timing slider to line up the drop with the moment the top of the eye reaches the plate,"
        - ">then remove back-drag with the phase difference. It's done when every reading passes."
        - ">Task three. Switch to four plies of denim and advance the feed timing until the movement with the needle in and the back-drag both pass."
        - ">Task four. Two plies of slippery lining. Raise the foot pressure step by step and watch slipping and shift change. If drop feed can't do it, change the feed system. The guide and the report template are on the platform."

