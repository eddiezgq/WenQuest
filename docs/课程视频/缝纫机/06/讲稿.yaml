  - id: homework
    part: ["作业", "Assignment"]
    slide:
      layout: points
      title: ["作业 6：送布机构计算与送布方式选择", "Assignment 6: feed calculations and choosing a feed system"]
      points:
        - ["推导 s = (S/2)(1 − cos 2α)；求抓布区间、4 mm 针距的行程", "Derive s = (S/2)(1 − cos 2α); gripping interval; stroke for 4 mm"]
        - ["针距调节器：2–5 mm 与倒缝的倾角；牙的速度、加速度", "Regulator: tilt for 2–5 mm and reverse; dog speed and acceleration"]
        - ["牛仔腰头入布角与调法（实验任务 3）；真丝衬里怎样选送布", "Denim entry angle and fix (lab task 3); a feed system for silk lining"]
      foot: ["另交虚拟实验 6-1 的实验报告。作业和报告都在问渠学习平台提交。", "Plus the report for Virtual lab 6-1. Submit both on WenQuest."]
    say:
      zh:
        - ">作业一共四道题。第一题是推导和计算：证明每针送布量的公式，求两种牙高的抓布区间，以及 4 毫米针距要多大的牙行程。"
        - ">第二题，针距调节器：求几种针距和倒缝时导杆的倾角，说明刻度为什么越往大越密，再算牙的最大速度和加速度。"
        - ">第三题，用第 3 讲的公式求 4 毫米牛仔的入布角，说明标准定时下出什么问题、怎么调，并在虚拟实验里完成任务三。第四题是论述：两层真丝衬里上层越缝越长，比较针送布、综合送布、上送布，给出你的设备建议。"
        - 作业和实验报告都在问渠学习平台上提交。
      en:
        - ">Your assignment has four questions. One, derivation and calculation. Prove the formula for the feed per stitch, find the gripping interval for two dog heights, and the dog stroke needed for a 4 millimetre stitch."
        - ">Two, the stitch regulator. Find the guide tilt for several stitch lengths and for reverse, explain why the scale crowds towards long stitches, and work out the dog's maximum velocity and acceleration."
        - ">Three, use the Lecture 3 formula to find the needle-entry angle in 4 millimetres of denim, explain what goes wrong with standard timing and how to fix it, and complete Task three of the virtual lab. And four, discussion. Two plies of silk lining, and the upper ply keeps growing. Compare needle, compound and top feed, and give your equipment recommendation."
        - Submit the assignment and the lab report on the WenQuest platform.

  - id: quiz
    part: ["测验", "Quiz"]
    slide:
      layout: points
      title: ["课后测验：10 题，即时反馈", "After-class quiz: 10 questions, instant feedback"]
      points:
        - ["牙在针板下退回，会把布往回带吗？", "Does the dog carry the cloth back as it returns below the plate?"]
        - ["牙高 0.9 mm，抓布区间是多少度？", "Dog height 0.9 mm: how wide is the gripping interval?"]
        - ["可以做三次，交卷后立刻看到解析", "Three attempts, explanations as soon as you submit"]
    say:
      zh:
        - ">学完还有一份十道题的测验，比如：送布牙在针板下面退回的时候，会不会把布往回带一段，所以针距才比牙的行程小？"
        - ">再比如：牙高调到 0.9 毫米，抓布区间是多少度？"
        - ">这份测验可以做三次，交卷后马上能看到每题的解析。"
      en:
        - ">There's also a ten-question quiz. For example, when the dog returns below the plate, does it carry the cloth back a little, and is that why the stitch is shorter than the dog's stroke?"
        - ">Or, with the dog at 0.9 millimetres, how wide is the gripping interval?"
        - ">You get three attempts, and the explanations appear as soon as you submit."

