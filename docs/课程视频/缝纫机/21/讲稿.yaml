# 《缝纫机设计与制造》公开课 第 21 讲：电子花样机与电脑横机电控原型
# 第 25 轮起的视频标准：画面就是这一讲的网页互动课件（course/slides/ch21.yaml），配音是课件每页的讲稿（notes），
# 中文版放双语课件，英文版放只显示英文的课件；每页按句子让要点逐条出现。这里只写开场、课后部分和结尾。
# 课后部分（约 5 分钟）：虚拟实验 21-1（缩比横机原型）录屏、平台学习方式页（第 23 轮 3.4：本讲不放数字工厂）、作业页、测验页。
# 数字一律由 course/calc/ch21.py 算出（{{ch21.键:格式}}）。实验镜头 steps 数 = “>” 个数（第一步也用一个 “>” 句触发）。
