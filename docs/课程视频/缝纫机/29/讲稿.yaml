  - id: homework
    part: ["作业", "Assignment"]
    slide:
      layout: points
      title: ["作业 29：T 恤线提速与换款方案", "Assignment 29: speeding up a T-shirt line and planning for style changes"]
      points:
        - ["目标提到 250 件/时：逐道配置与按机种合并", "Target 250 an hour: per-operation vs pooled by machine"]
        - ["捆扎 600 件 ↔ 吊挂 55 件：两种生产周期", "Bundles, 600 in WIP, vs hangers, 55: throughput times"]
        - ["接 300 件小单：每件人工与组织方案", "300-piece orders: labour per piece and your plan"]
      foot: ["作业和实验报告都在问渠学习平台提交。", "Submit the assignment and the lab report on WenQuest."]
    say:
      zh:
        - ">作业一共三道题。第一题，用本讲 16 道工序的工时，把目标提到每小时 250 件：求节拍和理论人数，分别按逐道配置和按机种合并配人，算出人数和平衡率，说明多出来的人从哪里来。"
        - ">第二题，这条线原来是捆扎流水，在制品 600 件、每小时 175 件；改成吊挂后在制品 55 件、每小时 191 件。用利特尔法则求两种情况的生产周期，再说说吊挂为什么能把在制品压下来。"
        - ">第三题，工厂开始接 300 件的小单：用本讲的换款模型算长线和 U 型单元的每件人工，再把长线的换款停线改成零重算，提出你的组织方案和至少两条设备改造。"
        - 作业和实验报告都在问渠学习平台上提交。
      en:
        - ">The assignment has three questions. One: using this lecture's 16 operation times, raise the target to 250 an hour. Find takt and the theoretical headcount, staff the line per operation and pooled by machine type, give headcount and balance for each, and explain where the extra people come from."
        - ">Two: the line used bundles, with 600 pieces in progress at 175 an hour; with hangers it holds 55 at 191 an hour. Use Little's law to find both throughput times, and explain why hangers keep WIP down."
        - ">Three: the factory starts taking 300-piece orders. Use this lecture's changeover model to find labour per piece for the long line and the U cell, recompute with zero changeover downtime on the long line, and propose your organisation and at least two equipment changes."
        - Submit the assignment and the lab report on the WenQuest platform.

  - id: quiz
    part: ["测验", "Quiz"]
    slide:
      layout: points
      title: ["课后测验：10 题，即时反馈", "After-class quiz: 10 questions, instant feedback"]
      points:
        - ["每小时 25 套、在制品 400 套：一套待几小时？", "25 suits an hour, 400 in WIP: hours per suit?"]
        - ["5.841 分、180 件/时：理论人数？", "5.841 minutes, 180 an hour: theoretical headcount?"]
        - ["可以做三次，交卷后立刻看到解析", "Three attempts, explanations as soon as you submit"]
    say:
      zh:
        - ">学完还有一份十道题的测验，比如：一条西服线每小时做 25 套，线上在制品 400 套，一套衣服平均在线上待多少小时？"
        - ">再比如：T 恤线 16 道工序合计 5.841 分，目标每小时 180 件，理论上至少要多少人？"
        - ">这份测验可以做三次，交卷后马上能看到每题的解析。"
      en:
        - ">There's also a ten-question quiz. For example: a suit line makes 25 suits an hour with 400 in progress. On average, how many hours does a suit spend on the line?"
        - ">Or: a T-shirt line's 16 operations total 5.841 minutes and the target is 180 an hour. What's the theoretical headcount?"
        - ">You get three attempts, and the explanations appear as soon as you submit."

