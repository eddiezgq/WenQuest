intro:
  zh:
    - 同学们好，欢迎来到问渠。
    - 这是《缝纫机设计与制造》第二十九讲，典型服装工厂。
    - 上一讲把一条线排平；今天去看五类工厂，同样是做衣服，为什么车间长得完全不一样。
  en:
    - Hi everyone, and welcome back to Sewing Machine Design and Manufacturing at WenQuest.
    - This is Lecture 29, typical garment factories.
    - Last time we balanced one line. Today we visit five kinds of factory and ask why plants that all make clothes look so different.

after:
  - id: lab291
    kind: lab
    lab: line
    part: ["虚拟实验", "Virtual lab"]
    viewport: [1600, 900]
    steps:
      - js: "(() => { document.body.style.zoom = '0.75'; window.scrollTo(0, 0); const st = document.createElement('style'); st.textContent = '#kpi,#lineNote,#alloc .note,#tasks,#cTs,#batchNote{filter:blur(7px) grayscale(1)}'; document.head.appendChild(st); document.querySelector('[data-m=pbs]').click(); document.querySelector('[data-a=op]').click(); document.getElementById('pSrc').click(); })()"
        dur: 6
      - js: "(() => { document.getElementById('floorPanel').scrollIntoView({block: 'start'}); document.querySelector('[data-s=\"20\"]').click(); const p = document.getElementById('play'); if (p.getAttribute('aria-pressed') === 'false') p.click(); setTimeout(() => window.scrollBy(0, 380), 4000); })()"
        dur: 9
      - js: "(() => { window.scrollTo(0, 0); document.getElementById('pTakt').click(); setTimeout(() => document.querySelector('[data-a=group]').click(), 3500); })()"
        dur: 7
      - js: "(() => { window.scrollTo(0, 0); document.querySelector('[data-a=op]').click(); document.getElementById('pSrc').click(); const f = (id, v) => { const e = document.getElementById(id); e.value = v; e.dispatchEvent(new Event('input', {bubbles: true})); }; f('s_bundle', 10); setTimeout(() => f('s_wipMax', 300), 1500); setTimeout(() => { document.getElementById('restart').click(); document.getElementById('ff').click(); }, 3000); })()"
        dur: 7
      - js: "(() => { document.querySelector('[data-m=ups]').click(); document.getElementById('floorPanel').scrollIntoView({block: 'start'}); document.querySelector('[data-s=\"20\"]').click(); setTimeout(() => { document.querySelector('[data-m=cell]').click(); window.scrollTo(0, 0); }, 4500); setTimeout(() => { const b = document.querySelector('#cellOps button[data-c=\"0\"][data-d=\"1\"]'); if (b) { b.style.outline = '4px solid #f2b705'; b.click(); } }, 7000); })()"
        dur: 10
      - js: "(() => { document.querySelector('[data-m=batch]').click(); window.scrollTo(0, 0); const f = (id, v) => { const e = document.getElementById(id); e.value = v; e.dispatchEvent(new Event('input', {bubbles: true})); }; setTimeout(() => f('s_Q', 300), 1000); setTimeout(() => f('s_LC', 2), 3500); setTimeout(() => f('s_Ltau', 8), 6000); })()"
        dur: 9
    say:
      zh:
        - ">下面是虚拟实验 29-1，缝制车间产线仿真，在问渠平台上可以亲手做，各项结果和任务先遮住。左边是实验指导，右边是工序表：每行一道工序、机种、标准工时和人数，横条是每人负荷，竖线是节拍。先选捆扎流水、一人一道工序，点“资料原配置”。"
        - ">往下是车间平面：圆点是工人，实心在做活、空心在等活，黄色小块是排队的捆。按 20 分每秒快进，再看平衡图里红色的那根柱。任务一：只加一个人，试几个不同的工序，每次重新开工、跳到下班，看加在哪里产量涨得最多。"
        - ">点“按节拍逐道配置”，记下人数和平衡率；再切到“按机种合并”，同一机种的工序由一组人共担，任务二要用 21 个人做到每小时 182 件以上。"
        - ">任务三还在捆扎流水：调捆的大小和在制品上限，重新开工、跳到下班，让生产周期缩短、产量又不掉，再用记录核对在制品约等于产量乘周期。"
        - ">切到吊挂单件流，看衣架沿主轨转，工位空了才拨进来。任务四要产量高、在制品少。再到 U 型单元，用左右箭头调换多能工的顺序，比一比快的人放在入口和出口有什么不同。"
        - ">最后是批量与换款：把订单批量、长线的换款停线和学习时间常数调一调，看两条曲线的交点往哪边走，任务六要把分界批量压到 1000 件以内。指导书和报告模板在平台上。"
      en:
        - ">Now Virtual lab 29-1, simulating a sewing floor, which you can do yourself on WenQuest. Results and tasks are blurred. The guide is on the left; on the right is the operation table: each row has an operation, machine type, standard minutes and headcount; the bar is load per person and the line is takt. Choose the bundle line, one operator per operation, and click 'Source configuration'."
        - ">Below is the floor plan. Dots are operators, filled when working, hollow when waiting; yellow blocks are queued bundles. Fast-forward at 20 minutes a second and look for the red bar in the balance chart. Task one: add just one person, try several operations, restart and skip to the end of the shift each time, and see where output rises most."
        - ">Click 'Staff each operation to takt' and record the headcount and balance. Then switch to 'Pool by machine type', where one team shares all operations on a machine type. Task two asks for 182 an hour or more with 21 people."
        - ">Task three stays with bundles: tune the bundle size and the WIP cap, restart, skip to shift end, and cut the throughput time without losing output. Then check from your records that WIP is about output times throughput time."
        - ">Switch to hangers and watch them circle the main rail, switched into a station only when it has room. Task four wants high output with little WIP. Then in the U cell, swap multi-skilled operators with the arrows and compare putting the fast ones at the entrance or at the exit."
        - ">Last, batch size and style changes: move the order size, the long line's changeover downtime and its learning constant, and watch where the two curves cross. Task six asks you to bring the break-even batch under 1000 pieces. The guide and report template are on the platform."

