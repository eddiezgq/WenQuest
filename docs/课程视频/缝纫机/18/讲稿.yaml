  - id: homework
    part: ["作业", "Assignment"]
    slide:
      layout: points
      title: ["作业 18：伺服电控箱的热校核与改进", "Assignment 18: thermal check and improvement of a servo box"]
      points:
        - ["45 °C 热校核：散热器、结温、电容寿命", "Thermal check at 45 °C: sink, junction, capacitor life"]
        - ["38 °C、堵塞 0.5：散热器热阻最大取多少", "38 °C, blockage 0.5: largest allowed sink resistance"]
        - ["16 kHz 开关时间窗口；讨论：老化不坏、返修却高", "Switching window at 16 kHz; discussion: burn-in passes, returns high"]
      foot: ["3–4 页 PDF 报告，附热阻网络图和实验截图，在问渠学习平台提交。", "A 3–4 page PDF with the thermal network and lab screenshots, submitted on WenQuest."]
    say:
      zh:
        - ">作业一共四道题，都是一只伺服电控箱。第一题，车间 45 度，平均损耗约 {{ch18.std45_Pavg:.0f}} 瓦，起停时单管损耗约 {{ch18.as_dev_peak:.1f}} 瓦，按热阻网络求箱内空气、散热器温度、结温峰值和电容寿命，判断过不过 100 度报警和 125 度上限。"
        - ">第二题，38 度、飞絮堵塞 0.5，为了散热器不超过 100 度，干净散热器的热阻最大能取多少；再加上结温不超过 125 度，又是多少，哪一条更紧。"
        - ">第三题用虚拟实验，45 度、16 千赫，找出三条判据都满足的开关时间范围，和 12 千赫的 {{ch18.window_45_lo}} 到 {{ch18.window_45_hi}} 纳秒比。第四题讨论：老化工序里几乎不坏，出厂第一年返修却到 2%，可能是什么原因，测试和老化流程怎么改。"
        - 报告在问渠学习平台上提交。
      en:
        - ">Your assignment has four questions about one servo control box. One: in a 45-degree room, with an average loss of about {{ch18.std45_Pavg:.0f}} watts and about {{ch18.as_dev_peak:.1f}} watts per switch during starts, use the thermal network to find the box air, heat-sink and peak junction temperatures and the capacitor life, and check them against the 100-degree alarm and the 125-degree limit."
        - ">Two: at 38 degrees with a lint blockage of 0.5, what is the largest clean heat-sink resistance that keeps the sink at or below 100 degrees? If the junction must also stay at or below 125, what then, and which constraint is tighter?"
        - ">Three uses the lab: at 45 degrees and 16 kilohertz, find the switching-time range that meets all three criteria and compare it with {{ch18.window_45_lo}} to {{ch18.window_45_hi}} nanoseconds at 12 kilohertz. Four is a discussion: boxes almost never fail in burn-in, yet first-year returns reach 2 percent. What could cause that, and how would you change the test and burn-in flow?"
        - Submit the report on the WenQuest platform.

  - id: quiz
    part: ["测验", "Quiz"]
    slide:
      layout: points
      title: ["课后测验：10 题，即时反馈", "After-class quiz: 10 questions, instant feedback"]
      points:
        - ["310 V、12 kHz、3 A、300 ns：开关损耗多少？", "310 V, 12 kHz, 3 A, 300 ns: switching loss?"]
        - ["程序跑飞后，什么保证电机一定停下？", "If the program runs away, what guarantees the motor stops?"]
        - ["可以做三次，交卷后立刻看到解析", "Three attempts, explanations as soon as you submit"]
    say:
      zh:
        - ">学完还有一份十道题的测验，比如：310 伏母线、12 千赫、平均电流 3 安、开关时间 300 纳秒，一只管子的开关损耗是多少？"
        - ">再比如：主控程序跑飞了，靠什么保证电机一定停下来？还有题问在线测试到底测什么，老化条件怎么定。"
        - ">这份测验可以做三次，交卷后马上能看到每题的解析。"
      en:
        - ">There's also a ten-question quiz. For example, with a 310-volt DC link, 12 kilohertz, an average current of 3 amps and 300 nanoseconds of switching, what is one switch's switching loss?"
        - ">Or, if the main program runs away, what guarantees that the motor stops? Others ask what in-circuit test actually measures and how burn-in conditions are chosen."
        - ">You get three attempts, and the explanations appear as soon as you submit."

