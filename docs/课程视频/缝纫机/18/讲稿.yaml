code: [ch18]
title: ["电控系统的设计、制造与测试——台板底下的那只箱子，要用十年", "Designing, Building and Testing the Control Box — The Box Under the Table Has to Last Ten Years"]
chapter: ["第五篇 电气控制 · 第 18 章", "Part V Electrical Control · Chapter 18"]
next: ["第 19 讲", "Lecture 19"]
cover_formula: 'T_j = T_a + \sum R_{th}\,P'
tags:
  zh: [电控箱, 伺服驱动器, 热设计, 热阻, 结温, 电磁兼容, 共模电流, 开关速度, 老化, 浴盆曲线, 缝纫机设计]
  en: [control box, servo drive, thermal design, thermal resistance, junction temperature, EMC, common-mode current, switching speed, burn-in, bathtub curve, sewing machine design]

intro:
  zh:
    - 同学们好，欢迎来到问渠。
    - 这是《缝纫机设计与制造》第十八讲，电控系统的设计、制造与测试。
    - 前面几讲我们一直默认电控箱是可靠的。可它实际放在台板底下：夏天车间三四十度，周围飘着飞絮，主轴一天起停上千次，还要用十年。
    - 今天讲三条主线：热、干扰、老化。需求与标准、V 模型、软件分层和生产测试流程留给课件和测验。
  en:
    - Hi everyone, and welcome back to Sewing Machine Design and Manufacturing at WenQuest.
    - This is Lecture 18, designing, building and testing the control box.
    - So far we've assumed the control box just works. In reality it sits under the table, thirty or forty degrees in summer, lint floating around, the main shaft starting and stopping a thousand times a day, and it has to last ten years.
    - Three threads today, heat, interference and burn-in. Requirements and standards, the V-model, software layers and the production test flow are left to the slides and the quiz.

after:
  - id: lab181
    kind: lab
    lab: ebox
    part: ["虚拟实验", "Virtual lab"]
    viewport: [1600, 900]
    steps:
      - js: "(() => { document.body.style.zoom = '0.7'; window.scrollTo(0, 0); for (const id of ['checksA', 'checksB', 'tasks']) document.getElementById(id).closest('section').style.filter = 'blur(7px) grayscale(1)'; const g = document.getElementById('cyc').getContext('2d'); if (!g.__wqHide) { g.__wqHide = 1; const f = g.fillText; g.fillText = function (t) { if (/^(散热器 |Heat sink )/.test(String(t))) return; return f.apply(this, arguments); }; } })()"
        press: "#resetA"
      - press: "#summer"
        sweep: {clog: [0.5, 0.8]}
        dur: 6
      - set: {clog: 0.5}
        sweep: {rhs: [1.5, 1.4]}
        dur: 6
      - js: "(() => { document.getElementById('resetA').click(); const e = document.getElementById('Ta'); e.value = 45; e.dispatchEvent(new Event('input', {bubbles: true})); })()"
        sweep: {tsw: [100, 700]}
        dur: 7
      - js: "(() => { document.getElementById('trade').closest('section').style.filter = 'blur(7px) grayscale(1)'; const e = document.getElementById('tsw'); e.value = 300; e.dispatchEvent(new Event('input', {bubbles: true})); })()"
        sweep: {fsw: [12, 20]}
        dur: 5
      - js: "(() => { document.getElementById('tabB').click(); document.getElementById('cost').closest('section').style.filter = 'blur(7px) grayscale(1)'; window.scrollTo(0, 0); })()"
        sweep: {tbi: [0, 24]}
        dur: 7
      - sweep: {Tbi: [55, 62]}
        dur: 5
    say:
      zh:
        - ">下面是虚拟实验 18-1，电控箱，在问渠平台上可以亲手做。右边的判据和下面的任务先遮住，留给你自己读。左上是两个缝纫周期里的电流和温度，下面是开关时间的折中图。"
        - ">先按“夏天加堵塞”，38 度、堵塞 0.5，再把堵塞往上加：蓝线、红线一起往上走。哪些判据不过，自己记下来。"
        - ">任务一：环境和工况不动，只改设计参数，让判据全部通过。比如把散热器热阻往下调；回答页的 1.0 是一种改法，还有哪些设计参数也能做到、哪一项最管用，自己比。"
        - ">恢复标准，车间 45 度，把开关时间从 100 纳秒拉到 700，看折中图上的圆点：一头干扰大，一头结温高。"
        - ">任务二：开关频率改成 20 千赫，重新选开关时间，量出绿色窗口有多宽，和 12 千赫比一比，再说清楚窗口两头分别由哪个判据定。"
        - ">切到第二页，老化与返修。55 度下把老化时间从 0 加到 24 小时，灰色的等效时间越来越宽。任务三：选老化温度和时间，让第一年返修率低于 1%、每台成本不超过 9 元。"
        - ">比如把老化箱温度往上调；最省钱的那一组留给你自己找。指导书和报告模板在平台上下载。"
      en:
        - ">Now Virtual lab 18-1, the control box, which you can do yourself on WenQuest. The criteria on the right and the tasks below are blurred, so you can read them on your own. Top left are current and temperature over two sewing cycles; below, the switching-time trade-off."
        - ">First press Summer plus clogging, 38 degrees and a blockage of 0.5, then raise the blockage further. The blue and red lines climb together. Which criteria fail? Note them down."
        - ">Task one: leave the room and the duty cycle alone and change only design parameters until every criterion passes. Try lowering the heat-sink resistance. The 1.0 on the answer slide is one fix; which other design changes also work, and which helps most, is yours to compare."
        - ">Reset to standard, set the room to 45 degrees, and stretch the switching time from 100 nanoseconds to 700. Watch the dot on the trade-off chart: noisy at one end, hot at the other."
        - ">Task two: raise the switching frequency to 20 kilohertz and re-select the switching time. Measure how wide the green window is, compare it with 12 kilohertz, and say which criterion sets each end."
        - ">Then page two, burn-in and returns. At 55 degrees, take the burn-in time from 0 to 24 hours, and the grey equivalent time widens. Task three: choose a temperature and a time that keep first-year returns under 1 percent at no more than 9 yuan per unit."
        - ">Try raising the chamber temperature; the cheapest combination is yours to find. The guide and report template are on the platform."

