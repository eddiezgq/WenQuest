  zh: 这台绷缝机：406 线迹，6500 r/min
  en: 'This coverstitch machine: stitch 406, 6500 r/min'
- t:
  - 0
  - 6
  where: bottom
  zh: 针、弯针的运动和线环按你的设计算；机构尺寸为示意
  en: Needle and looper motion and the loops follow your design; mechanism sizes are illustrative
- t:
  - 6.0
  - 14.0
  zh: ① 引线：针杆曲柄滑块带一排机针
  en: '① Needle drive: slider-crank with the row of needles'
- t:
  - 6.0
  - 14.0
  where: bottom
  zh: 线迹 406 · 2 根针，针距 4 mm · 6500 r/min
  en: Stitch 406 · 2 needle(s), gauge 4 mm · 6500 r/min
- t:
  - 14.0
  - 22.0
  zh: ② 弯针：左右摆 + 前后避针，刀尖走扁椭圆
  en: '② Looper: swing across + needle avoidance, a flat ellipse'
- t:
  - 14.0
  - 22.0
  where: bottom
  zh: 弯针定时 -6° · 可行窗口 -3.5° 到 +4.0° · 回退量 3.2 mm
  en: Looper timing -6° · workable window -3.5° to +4.0° · retraction 3.2 mm · avoid amplitude 1 mm
- t:
  - 22.0
  - 31.0
  zh: ③ 钩线：弯针从右往左依次钩住各针的线环
  en: '③ Catching: the looper takes each needle loop, right to left'
- t:
  - 22.0
  - 31.0
  where: bottom
  zh: 钩线时机针回升 2.32 mm（208.1°） · 弯针尖高出针眼 2.54 mm
  en: Needle rise at the catch 2.32 mm (208.1°) · point above the eye 2.54 mm · clearance 0.030 mm
- t:
  - 31.0
  - 39.0
  zh: ④ 送布：主送布牙、差动送布牙
  en: '④ Feed: main and differential feed dogs'
- t:
  - 31.0
  - 39.0
  where: bottom
  zh: 针密 7 /cm · 主、差动两只送布牙
  en: 7 stitches/cm · main and differential dogs
- t:
  - 39.0
  - 46.0
  tone: bad
  zh: ⚠ 不合格：弯针尖在线环高度内
  en: ⚠ Looper point within the loop height fails
- t:
  - 39.0
  - 46.0
  where: bottom
  zh: 2.54 mm · 判据 0.20–2.29 mm
  en: 2.54 mm · criterion 0.20–2.29 mm
- t:
  - 46.0
  - 53.0
  tone: bad
  zh: ⚠ 不合格：针下行时让开弯针
  en: ⚠ Needle clears the looper on its way down fails
- t:
  - 46.0
  - 53.0
  where: bottom
  zh: x -0.13，y 0.33 mm · 判据 x ≥ 0.30，y ≥ 0.20 mm
  en: x -0.13, y 0.33 mm · criterion x ≥ 0.30, y ≥ 0.20 mm
- t:
  - 53.0
  - 60.0
  tone: bad
  zh: ⚠ 不合格：弯针定时离窗口边缘
  en: ⚠ Looper timing margin to the window edges fails
- t:
  - 53.0
  - 60.0
  where: bottom
  zh: -6.0°，窗口 -3.5° 到 +4.0° · 判据 ≥ 1.5°
  en: -6.0°, window -3.5° to +4.0° · criterion ≥ 1.5°
