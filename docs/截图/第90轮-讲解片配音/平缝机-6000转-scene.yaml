lang: zh
voice:
- t: 0.35
  dur: 10.98
  text: 这台平缝机：六千 转每分，零件尺寸按你的设计。机构零件、尺寸和运动都由设计软件的计算核心给出。
- t: 12.13
  dur: 11.03
  text: 第一段，刺布机构（曲柄滑块）。下止点惯性力 九百四十一牛，连杆比 零点二八二，曲柄 十五点五毫米。
- t: 23.96
  dur: 10.59
  text: 第二段，挑线机构（四杆）。挑线余量（最小）一点九毫米（两百九十六度），传动角 四十一度到一百一十五度。
- t: 35.34
  dur: 10.36
  text: 第三段，钩线：旋梭（转速是主轴的 二 倍）。钩线时机针回升 二点零零毫米（两百零六点一度），旋梭定时 零度。
- t: 46.5
  dur: 11.36
  text: 第四段，送布：抬牙和送布偏心轮带送布牙。实际针距 百分之一百，针距 三毫米，送布牙高出针板 零点八毫米。
- t: 58.67
  dur: 7.11
  text: 不合格：针杆下止点惯性力。九百四十一牛，判据 不超过 八百牛。
- t: 66.57
  dur: 11.54
  text: 不合格：二阶激振频率和机壳固有频率。一点零五三（共振转速 五千七百 转每分），判据 不超过 零点九零。
- t: 78.92
  dur: 7.69
  text: 注意：整机惯性力（最大合力）。六百二十一牛，判据 不超过 五百五十牛。
- t: 87.41
  dur: 9.04
  text: 二十一 项校核：不合格 二 项，注意 一 项。问渠缝纫机设计软件，计算书、STEP、调机卡同一组参数。
