voice:
- t: 0.35
  dur: 10.2
  text: 这台电子花样机：花样 四十九 针，设计 两千 转每分。运动、针迹、趟次按你的设计算；机构尺寸为示意。
- t: 11.34
  dur: 10.49
  text: 第一段，刺布：针在布中模板不动，离布窗口里移到下一针。入布角和出布角 一百零一点七和两百五十八点三度。
- t: 22.63
  dur: 11.44
  text: 第二段，X、Y 两轴：横梁带 X 轴前后走，滑座带压框左右走。X 轴峰值和均方根转矩 一点六六和一点二二 牛米。
- t: 34.87
  dur: 7.58
  text: 第三段，走一遍花样（快放）。花样针数和大小 四十九和六十 乘 四十毫米。
- t: 43.26
  dur: 15.83
  text: 不合格：设计转速下标准针距走得完（两轴中较慢的一轴）。两千 转每分；上限 X 两千零八十、Y 一千八百六十，判据 不超过 一千八百六十 转每分。
- t: 61.66
  dur: 8.8
  text: 十四 项校核：不合格 一 项，注意 零 项。问渠缝纫机设计软件，计算书、调机卡同一组参数。
