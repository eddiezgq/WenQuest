<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{
  --bg:#f6f4ef;--paper:#fffdf8;--ink:#1d2329;--muted:#5f6b76;--line:#e3ddd2;--soft:#f0ece4;
  --accent:#1d4e75;--accent2:#c2410c;--gold:#b7791f;--ok:#1e8449;--bad:#b42318;--warn:#b7791f;
  --side:#10181f;--side-ink:#d9e2e8;--side-muted:#8c9aa6;--side-hi:#f2b705;--code:#0f1720;--code-ink:#e6edf3;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1216;--paper:#141b21;--ink:#e3e9ee;--muted:#9aa7b2;--line:#25313b;--soft:#1a232b;
  --accent:#6fb3e6;--accent2:#f08c58;--gold:#e8b04b;--ok:#5fd08a;--bad:#ff7b6b;--warn:#e8b04b;--code:#0a0f13}}
:root[data-theme="dark"]{--bg:#0d1216;--paper:#141b21;--ink:#e3e9ee;--muted:#9aa7b2;--line:#25313b;--soft:#1a232b;
  --accent:#6fb3e6;--accent2:#f08c58;--gold:#e8b04b;--ok:#5fd08a;--bad:#ff7b6b;--warn:#e8b04b;--code:#0a0f13}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:12px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 var(--font)}
a{color:var(--accent)}
aside{position:fixed;inset:0 auto 0 0;width:286px;background:var(--side);color:var(--side-ink);overflow:auto;padding:20px 0 40px;z-index:20}
aside .brand{padding:0 22px 14px;border-bottom:1px solid #22303a;margin-bottom:8px}
aside .brand b{display:block;font-size:18px;letter-spacing:.03em}
aside .brand small{color:var(--side-muted);font-size:12.5px}
aside .find{margin:6px 18px 8px;width:calc(100% - 36px);background:#1b2a34;border:1px solid #2c3d49;color:var(--side-ink);border-radius:8px;padding:7px 10px;font:14px var(--font)}
aside nav a{display:flex;gap:10px;align-items:baseline;padding:5px 22px;color:var(--side-ink);text-decoration:none;font-size:14.5px;border-left:3px solid transparent}
aside nav a .n{font:12px var(--mono);color:var(--side-muted);min-width:22px}
aside nav a:hover{background:#18242d}
aside nav a.on{border-left-color:var(--side-hi);background:#1b2a34;color:#fff}
aside nav a.sub{padding-left:54px;font-size:13px;color:var(--side-muted);display:none}
aside nav a.sub.show{display:flex}
aside nav a.sub.on{color:#fff;background:transparent}
aside nav a.hide{display:none}
aside .tools{padding:14px 22px 0;display:flex;gap:8px;flex-wrap:wrap}
aside .tools a,aside .tools button{background:#1b2a34;color:var(--side-ink);border:1px solid #2c3d49;border-radius:6px;padding:4px 10px;font:13px var(--font);cursor:pointer;text-decoration:none}
main{margin-left:286px;padding:0 0 120px;overflow-x:hidden}
.hamb{display:none;position:fixed;top:10px;left:10px;z-index:30;background:var(--side);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:14px var(--font)}
@media (max-width:980px){aside{transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.4)}aside.open{transform:none}main{margin-left:0}.hamb{display:block}}
section{max-width:940px;margin:0 auto;padding:54px 32px 8px}
@media (max-width:600px){section{padding:50px 16px 8px}}
h1{font-size:38px;line-height:1.2;margin:0 0 10px}
h2{font-size:28px;line-height:1.3;margin:0 0 6px;display:flex;gap:14px;align-items:baseline}
h2 .n{font:600 15px var(--mono);color:var(--accent2)}
h3{font-size:20px;margin:30px 0 8px}
h4{font-size:16.5px;margin:20px 0 6px}
.lead{color:var(--muted);font-size:17px;margin:0 0 18px}
p{margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:14.5px;margin:10px 0;display:block;overflow-x:auto}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:600;white-space:nowrap}
code{font:13.5px var(--mono);background:var(--soft);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
pre{position:relative;background:var(--code);color:var(--code-ink);border-radius:10px;padding:16px 18px;overflow:auto;font:13.5px/1.6 var(--mono);margin:12px 0}
pre code{background:none;padding:0;color:inherit}
pre button.cp{position:absolute;top:8px;right:8px;background:#22303a;color:#d9e2e8;border:1px solid #33444f;border-radius:6px;padding:3px 9px;font:12px var(--font);cursor:pointer}
pre button.cp.done{background:var(--ok);color:#fff}
blockquote{border-left:4px solid var(--accent);background:var(--soft);padding:10px 16px;border-radius:0 8px 8px 0;margin:14px 0}
blockquote p{margin:4px 0}
.hero{background:linear-gradient(135deg,#10181f,#173048);color:#eef3f6;border-radius:0 0 22px 22px;padding:52px 32px 40px;max-width:none}
.hero .wrap{max-width:880px;margin:0 auto}
.hero .kick{font:600 13px var(--mono);letter-spacing:.12em;color:#f2b705}
.hero p{color:#b8c6d0}
.hero h1{color:#fff}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
.facts div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px}
.facts b{display:block;font-size:24px;color:#fff}
.facts span{font-size:13px;color:#a9b8c3}
@media (max-width:760px){.facts{grid-template-columns:1fr 1fr}}
.try{display:inline-block;margin:6px 8px 6px 0;padding:6px 14px;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none;font-size:14px}
.try:hover{filter:brightness(1.1)}
figure{margin:16px 0}
figure.vid video{width:100%;border-radius:10px;background:#000;display:block}
figure figcaption{font-size:13.5px;color:var(--muted);margin-top:6px}
figure.shot img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.anim,.calc{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin:16px 0}
.anim canvas,.calc canvas{width:100%;display:block}
.anim .bar,.calc .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;margin-top:8px}
.anim .bar button,.calc .bar button,.calc button{background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 11px;font:13.5px var(--font);cursor:pointer}
.anim .bar button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.anim .cap,.calc .cap{font-size:13.5px;color:var(--muted);margin-top:6px}
.anim input[type=range],.calc input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
.calc .row{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;font-size:14px;margin:4px 0}
@media (max-width:600px){.calc .row{grid-template-columns:110px 1fr 70px}}
.lamp{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:middle;background:var(--ok)}
.lamp.warn{background:var(--warn)}.lamp.bad{background:var(--bad)}
.checks{columns:2;column-gap:20px;font-size:13.5px;margin-top:8px}
@media (max-width:700px){.checks{columns:1}}
.checks div{break-inside:avoid;padding:2px 0}
.sum{font-weight:600;padding:6px 10px;border-radius:8px;margin-top:8px}
.sum.ok{background:rgba(30,132,73,.12);color:var(--ok)}.sum.bad{background:rgba(180,35,24,.12);color:var(--bad)}.sum.warn{background:rgba(183,121,31,.14);color:var(--warn)}
.steps{counter-reset:s;list-style:none;padding:0}
.steps>li{counter-increment:s;position:relative;padding:4px 0 4px 44px;margin:8px 0}
.steps>li::before{content:counter(s);position:absolute;left:0;top:4px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 14px var(--mono)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.tag{display:inline-block;font:600 12px/1 var(--mono);padding:4px 7px;border-radius:4px;background:var(--soft);color:var(--muted);vertical-align:middle}
.top-other{font-size:13px}
@media print{aside,.hamb,.try,.anim .bar,.calc{display:none}main{margin:0}section{padding:20px 0;break-inside:avoid-page}figure.vid{display:none}}
</style>
</head>
<body>
<button class="hamb" onclick="document.querySelector('aside').classList.toggle('open')">☰ 目录</button>
<aside>
  <div class="brand"><b>问渠缝纫机设计软件</b><small>{{SHORT}}</small></div>
  <input class="find" placeholder="搜索帮助…" oninput="findIn(this.value)">
  <nav>{{NAV}}</nav>
  <div class="tools">
    <a href="{{OTHER_URL}}" class="top-other">看{{OTHER_NAME}}</a>
    <button onclick="toggleTheme()">◐ 深浅色</button>
    <button onclick="window.print()">打印</button>
  </div>
</aside>
<main>
{{BODY}}
</main>
<script>
const EDITION = "{{EDITION}}", API = "{{API}}";
const DATA = {{DATA}};
// 目录：当前节高亮，只展开当前节的小节；手机上点了就收起
const links = [...document.querySelectorAll("aside nav a")];
const targets = links.map(a => document.getElementById(a.getAttribute("href").slice(1))).filter(Boolean);
function spy() {
  let cur = targets[0];
  for (const t of targets) if (t.getBoundingClientRect().top < 120) cur = t;
  const id = cur && cur.id;
  const sec = id && (document.getElementById(id).closest("section") || {}).id;
  for (const a of links) {
    const h = a.getAttribute("href").slice(1), sub = a.classList.contains("sub");
    a.classList.toggle("on", sub ? h === id : h === sec);
    if (sub && !finding) a.classList.toggle("show", a.dataset.s === sec);
  }
}
let finding = false;
addEventListener("scroll", spy, { passive: true });
links.forEach(a => a.addEventListener("click", () => document.querySelector("aside").classList.remove("open")));
function findIn(q) {
  q = q.trim();
  finding = !!q;
  for (const a of links) {
    if (!q) { a.classList.remove("hide"); continue; }
    const el = document.getElementById(a.getAttribute("href").slice(1));
    let text = a.textContent;
    if (a.classList.contains("sub")) { let n = el.nextElementSibling; while (n && n.tagName !== "H3") { text += n.textContent; n = n.nextElementSibling; } }
    else text += el.textContent.slice(0, 400);
    const hit = text.toLowerCase().includes(q.toLowerCase());
    a.classList.toggle("hide", !hit);
    if (a.classList.contains("sub")) a.classList.toggle("show", hit);
  }
  spy();
}
function toggleTheme() {
  const r = document.documentElement, dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const now = r.dataset.theme || (dark ? "dark" : "light");
  r.dataset.theme = now === "dark" ? "light" : "dark";
  try { localStorage.setItem("wq-help-theme", r.dataset.theme); } catch (e) {}
  document.dispatchEvent(new Event("themechange"));
}
try { const t = localStorage.getItem("wq-help-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
// 代码块加“复制”
document.querySelectorAll("pre").forEach(p => {
  const b = document.createElement("button"); b.className = "cp"; b.textContent = "复制";
  b.onclick = () => { navigator.clipboard.writeText(p.innerText.replace(/复制$|已复制$/, "").trim()).then(() => { b.textContent = "已复制"; b.classList.add("done"); setTimeout(() => { b.textContent = "复制"; b.classList.remove("done"); }, 1500); }); };
  p.appendChild(b);
});
spy();
</script>
<script>
{{ANIM_JS}}
</script>
</body>
</html>
