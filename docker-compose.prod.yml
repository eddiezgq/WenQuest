# Production override for a single cloud server.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
# Adds Caddy in front (automatic HTTPS for the academy site, learn. and classic. subdomains) and
# stops publishing the app and Moodle ports directly; everything goes through Caddy on 80/443.
services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    depends_on:
      - moodle
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
      # 按地区引入 deploy/caddy-extra/<us|cn>/ 里的站点（第 34 轮）
      WQ_REGION: ${WQ_REGION:-us}
      # 国内版官网（第 48 轮，deploy/site-handle/cn.caddy）：页面里的公司信息与备案号由 Caddy 模板读这些变量
      WQ_COMPANY: ${WQ_COMPANY:-}
      WQ_ADDRESS: ${WQ_ADDRESS:-}
      WQ_CONTACT_PHONE: ${WQ_CONTACT_PHONE:-}
      WQ_CONTACT_EMAIL: ${WQ_CONTACT_EMAIL:-}
      WQ_ICP: ${WQ_ICP:-}
      WQ_PSB: ${WQ_PSB:-}
      WQ_AI_REG: ${WQ_AI_REG:-}
    volumes:
      # The folder, not the single file: a deploy replaces deploy/Caddyfile with a new file, and a
      # single-file mount would keep showing Caddy the old one (so "caddy reload" changed nothing).
      - ./deploy:/etc/caddy:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        # 在线文档（第 121 轮）：OnlyOffice 回调 Moodle 用公网地址 classic.<主域名>，在内网直接落到 Caddy，不绕公网
        aliases:
          - classic.${SITE_DOMAIN}
      qms-edge: {}
      factory-edge: {}   # 数字工厂（factory. 与 erp. 两个网址）

  # 第 125 轮：Caddy 给 <编号>.factory 办证书前问网关，网关再问数字工厂枢纽 wqf-hub（第 97 轮起这样转），
  # 网关要和枢纽在同一个网络里才找得到它；以前只有 Caddy 接了 factory-edge，第 97 轮以后新建的厂（芯片厂、传感器厂）都办不下证书、打不开
  gateway:
    networks:
      default: {}
      render: {}
      factory-edge: { aliases: [wq-gateway] }   # 第 128 轮：数字工厂枢纽经它把工艺卡转成 PDF

  web:
    ports: !reset []

  moodle:
    ports: !reset []
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/login/index.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15m

volumes:
  caddy_data:
  caddy_config:
  
networks:
  qms-edge:
    external: true
  factory-edge:
    external: true
