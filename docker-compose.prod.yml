# Production override for a single cloud server.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
# Adds Caddy in front (automatic HTTPS for the academy site, learn. and classic. subdomains) and
# stops publishing the app and Moodle ports directly; everything goes through Caddy on 80/443.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - moodle
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      # The folder, not the single file: a deploy replaces deploy/Caddyfile with a new file, and a
      # single-file mount would keep showing Caddy the old one (so "caddy reload" changed nothing).
      - ./deploy:/etc/caddy:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - qms-edge

  web:
    ports: !reset []

  moodle:
    ports: !reset []
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/login/index.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15m

volumes:
  caddy_data:
  caddy_config:
  
networks:
  qms-edge:
    external: true
