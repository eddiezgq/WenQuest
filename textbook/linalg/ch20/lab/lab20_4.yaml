# 实验 20.4 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab20_4.js。
原理:
  - ["浮点数在 [2ᵉ, 2ᵉ⁺¹) 内的间距为 ulp = 2ᵉ·ε。每步执行 t ← fl(t + dt)，实际加上的是 dt 舍入到 ulp 的整数倍：dt 比 ulp 的一半还小时，t 不再改变（停走）；dt 在半个与一个 ulp 之间时，每步多加（走快）。",
     "In [2ᵉ, 2ᵉ⁺¹) floating-point numbers are ulp = 2ᵉ·ε apart. Each step t ← fl(t + dt) actually adds dt rounded to a multiple of ulp: when dt is less than half an ulp t stops changing (stall); when dt lies between half and one ulp each step adds too much (runs fast)."]
  - 式: "fl(x ∘ y) = (x ∘ y)(1 + δ)，|δ| ≤ u = ε/2；  停走条件 dt < ulp(t)/2 = 2ᵉ ε/2          (20.4.2)、(20.4.3)"
  - ["整数计数器 n 每步加 1，没有舍入；需要时间时计算 fl(n·dt)，只有一次舍入，误差不会逐步累积。",
     "An integer counter n adds 1 each step with no rounding; when the time is needed compute fl(n·dt), whose error is a single rounding that does not build up step by step."]
步骤:
  - ["单精度、dt = 1 ms、浮点累加，运行时间取 1、2、4、6、8 h，记录读数误差、开始走快的时刻和停走的时刻（表 1，任务 1）。",
     "Single, dt = 1 ms, float accumulation: run 1, 2, 4, 6, 8 h and record the error, when it starts running fast and when it stalls (Table 1, task 1)."]
  - ["改为半精度（任务 2）、单精度 dt = 10 ms（任务 3），把停走的时刻填入表 2，并用“dt < ulp/2”的条件验算。",
     "Switch to half precision (task 2) and single with dt = 10 ms (task 3); enter the stall times in Table 2 and check them with the condition dt < ulp/2."]
  - ["单精度、dt = 1 ms，改用整数计数器，运行 8 h（任务 4），比较误差。",
     "Single, dt = 1 ms, integer counter, 8 h (task 4): compare the error."]
