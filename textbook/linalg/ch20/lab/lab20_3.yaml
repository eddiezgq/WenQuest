注意:
  - ["条件数只由夹角决定，定位误差还与到路标的距离成正比；两者都小才好。",
     "The condition number depends only on the angle; the error is also proportional to the distances. Both must be small."]
  - ["站在两个路标的连线附近（无论在两者之间还是外侧），两条方位线都接近这条连线，几乎平行，定位误差沿连线的方向很大。",
     "Near the line through the two landmarks (between them or outside), both bearing lines nearly coincide with it and are almost parallel; the error along that line is large."]
