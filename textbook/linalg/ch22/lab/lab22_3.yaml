注意:
  - ["这里只数非零元的位置（符号分解），不考虑数值上恰好相消成零的情形。",
     "Only the positions of nonzeros are counted (symbolic factorization); exact numerical cancellation is ignored."]
  - ["RCM 让带宽变窄，但填充不一定最少；位姿图中的回环约束连接相隔很远的位姿，RCM 反而比自然排序差。",
     "RCM narrows the band but does not always minimize fill; loop closures connect distant poses, and RCM is worse than the natural order for the pose graph."]
