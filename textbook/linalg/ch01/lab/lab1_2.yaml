思考题:
  - ["把车体速度写成三个分量 (vₓ, v_y, ω)ᵀ，其中 v_y 是沿车体横向的速度，则 (vₓ, v_y, ω)ᵀ = A′(ω_L, ω_R)ᵀ，A′ 是 3×2 矩阵。写出 A′，并说明 (0, 1, 0)ᵀ（只横向平移）能不能由 A′ 的两列组合出来。这说明了 AGV 的什么局限？",
     "Write the body velocity with three components (vₓ, v_y, ω)ᵀ, v_y sideways; then (vₓ, v_y, ω)ᵀ = A′(ω_L, ω_R)ᵀ with a 3×2 matrix A′. Write A′ and decide whether (0, 1, 0)ᵀ (pure sideways motion) is a combination of its columns. What limitation of the AGV does this show?"]
