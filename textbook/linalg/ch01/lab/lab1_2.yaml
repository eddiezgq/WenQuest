# 实验 1.2 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab1_2.js。
原理:
  - ["差速 AGV 的左右轮各由一台电机驱动。轮子不打滑时，车体的前进速度是两轮着地点速度的平均值，转动角速度是两轮速度之差除以轮距（式 (1.2.1)）。写成矩阵形式就是式 (1.2.3)。",
     "Each wheel of a differential-drive AGV has its own motor. Without slip the body's forward speed is the mean of the two wheel speeds and its turn rate is their difference divided by the track (Eq. (1.2.1)); in matrix form, Eq. (1.2.3)."]
  - 式: "(v, ω)ᵀ = A (ω_L, ω_R)ᵀ，  A = [r/2  r/2; −r/b  r/b]，  r = 0.075 m，b = 0.40 m          (1.2.2)、(1.2.3)"
  - ["按列看，(v, ω)ᵀ = ω_L a₁ + ω_R a₂：车体速度是两列按轮速加权的和（列图，式 (1.2.4)）。把 A 看作平面上的变换，它把正方形网格变成平行四边形网格，(1, 0)ᵀ 和 (0, 1)ᵀ 的像就是 A 的两列。",
     "By columns, (v, ω)ᵀ = ω_L a₁ + ω_R a₂: the body velocity is the columns weighted by the wheel speeds (column picture, Eq. (1.2.4)). As a map of the plane, A turns the square grid into a grid of parallelograms; the images of (1, 0)ᵀ and (0, 1)ᵀ are its columns."]
步骤:
  - ["在“差速 AGV”场景保持默认轮速 ω_L = 2、ω_R = 6 rad/s，点“开始”，观察 AGV 的运动，读出 v、ω 和转弯半径，与式 (1.2.3) 的手算结果比较，填入表 1。",
     "In the AGV scene keep ω_L = 2, ω_R = 6 rad/s and press Start; read v, ω and the turning radius and compare with a hand calculation from Eq. (1.2.3). Fill in Table 1."]
  - ["调节轮速，完成任务 1（直线前进 0.3 m/s）和任务 2（原地转圈），记录轮速。", "Adjust the wheel speeds for task 1 (straight at 0.3 m/s) and task 2 (spin on the spot); record the wheel speeds."]
  - ["用 1.2 节的方法手算使 v = 0.5 m/s、ω = 0.5 rad/s 的轮速，设置后验证（任务 3）。", "Compute by hand (Section 1.2) the wheel speeds for v = 0.5 m/s, ω = 0.5 rad/s, set them and check (task 3)."]
  - ["把两个轮速同时乘以 2、乘以 −1，观察 v、ω 和轨迹的变化；再取两组轮速，分别读出 (v, ω)，与两组轮速之和对应的 (v, ω) 比较，填入表 2。",
     "Multiply both wheel speeds by 2 and by −1 and watch v, ω and the path; then take two sets of wheel speeds, read (v, ω) for each and for their sum. Fill in Table 2."]
  - ["切换到“矩阵与网格”场景，分别做出伸缩、剪切（任务 4）和翻面的矩阵，记录矩阵和单位正方形的像的面积，填入表 3。",
     "In the matrix scene make a stretch, a shear (task 4) and a flip; record each matrix and the area of the unit square's image in Table 3."]
