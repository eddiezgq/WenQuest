# 实验 2.2 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab2_2.js。
原理:
  - ["两连杆臂的上臂向量 r₁ = l₁(cos θ₁, sin θ₁)ᵀ，前臂向量 r₂ = l₂(cos(θ₁ + θ₂), sin(θ₁ + θ₂))ᵀ。从肩关节出发先走 r₁ 再走 r₂，到达腕心，p = r₁ + r₂（式 (2.2.1)）。向量加法满足交换律，先走 r₂ 再走 r₁ 也到达同一点，两条路径围成平行四边形。",
     "The upper-arm vector is r₁ = l₁(cos θ₁, sin θ₁)ᵀ and the forearm vector r₂ = l₂(cos(θ₁ + θ₂), sin(θ₁ + θ₂))ᵀ. Walking r₁ then r₂ from the shoulder reaches the wrist: p = r₁ + r₂ (Eq. (2.2.1)). Addition is commutative, so r₂ then r₁ ends at the same point; the two paths bound a parallelogram."]
  - 式: "p = r₁ + r₂，  | l₁ − l₂ | ≤ ‖p‖ ≤ l₁ + l₂，  l₁ = 0.425 m，l₂ = 0.392 m          (2.2.1)、(2.3.7)"
  - ["u、w 不平行时，平面上任何向量 b 都能唯一地写成 c₁u + c₂w，系数由式 (2.2.6) 给出。",
     "If u and w are not parallel, every b in the plane is uniquely c₁u + c₂w, with coefficients from Eq. (2.2.6)."]
步骤:
