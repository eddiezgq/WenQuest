  - ["保持 θ₂ 不变、改变 θ₁，‖p‖ 变不变？为什么？", "Change θ₁ with θ₂ fixed: does ‖p‖ change? Why?"]
  - ["切换到“平行四边形”场景，任取一组关节角，确认两条路径的终点重合；再把平行四边形调成矩形（任务 3），比较 ‖p‖² 与 l₁² + l₂²（勾股定理）。", "In the parallelogram scene check both paths end at the same point; then make it a rectangle (task 3) and compare ‖p‖² with l₁² + l₂² (Pythagoras)."]
