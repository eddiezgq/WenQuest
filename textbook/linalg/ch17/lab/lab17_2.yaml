# 实验 17.2 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab17_2.js。
原理:
  - ["采样位置轴的闭环 x_{k+1} = A_cl x_k，A_cl 是 2×2 矩阵。由凯莱–哈密顿定理，A_cl² + c₁A_cl + c₀I = O。若把增益选得使 c₁ = c₀ = 0，就有 A_cl² = O：任何初始误差两步归零，这叫无差拍控制。", "The sampled axis obeys x_{k+1} = A_cl x_k with a 2×2 A_cl. By Cayley–Hamilton A_cl² + c₁A_cl + c₀I = O. Choosing gains with c₁ = c₀ = 0 gives A_cl² = O: any initial error vanishes in two steps (deadbeat control)."]
  - 式: "c₁ = g₁/2 + g₂ − 2，c₀ = g₁/2 − g₂ + 1（g 为实际有效增益）；  无差拍 g₁ = 1，g₂ = 1.5；  二重特征值 λ：g₁ = (1 − λ)²，g₂ = (3 − 2λ − λ²)/2"
  - ["二重特征值时，若 A_cl 不是数量矩阵 λI，它只有一个特征向量，相似于若尔当块，最小多项式是 (λ − λ₀)²。无差拍就是 λ₀ = 0 的情形：A_cl 幂零。", "With a double eigenvalue, unless A_cl is the scalar matrix λI it has a single eigenvector, is similar to a Jordan block and has minimal polynomial (λ − λ₀)². Deadbeat is the case λ₀ = 0: A_cl is nilpotent."]
步骤:
