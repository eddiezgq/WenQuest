  - ["切换到“无解”场景，消元到出现矛盾的一行（任务 3）。", "Switch to the no-solution scene and eliminate until a contradictory row appears (task 3)."]
  - ["切换到“无穷多解”场景，化为简化行阶梯形（任务 4），写出通解。", "Switch to the infinitely-many scene, reduce completely (task 4) and write the general solution."]
