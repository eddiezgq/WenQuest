# 实验 3.3 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab3_3.js。
原理:
  - ["三种初等行变换：交换两行（Rᵢ ↔ Rⱼ）；用非零数乘一行（Rᵢ ← cRᵢ，c ≠ 0）；把一行的倍数加到另一行（Rᵢ ← Rᵢ + cRⱼ，i ≠ j）。它们都可以撤销，所以不改变方程组的解（定理 3.3.1）。",
     "Three row operations: swap two rows; scale a row by c ≠ 0; add c times row j to row i (i ≠ j). Each can be undone, so the solution set is unchanged (Theorem 3.3.1)."]
  - 式: "乘数 ℓᵢₖ = aᵢₖ / aₖₖ；  Rᵢ ← Rᵢ − ℓᵢₖ Rₖ"
  - ["化为简化行阶梯形后：出现 (0 0 0 | d)、d ≠ 0 的行则无解；三列都有主元则解唯一；有不含主元的列则该变量自由，有无穷多解（定理 3.5.1）。",
     "In reduced echelon form: a row (0 0 0 | d) with d ≠ 0 means no solution; pivots in all three columns mean a unique solution; a column without a pivot gives a free variable and infinitely many solutions (Theorem 3.5.1)."]
步骤:
