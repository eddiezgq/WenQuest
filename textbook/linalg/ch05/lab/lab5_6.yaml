注意:
  - ["首末两个路点固定为 0° 和 40°，首末两点的角加速度取零（自然样条）；实际控制器常改用首末速度为零的“夹持”样条。", "The end waypoints are fixed at 0° and 40° with zero end acceleration (natural spline); real controllers often use a clamped spline with zero end velocity."]
