原理:
  - ["目标函数 F(θ) = ‖Aθ − b‖² 的微分为 dF = 2(Aθ − b)ᵀA dθ，所以梯度 ∇F = 2Aᵀ(Aθ − b)，黑塞矩阵为 2AᵀA。令梯度为零即正规方程。",
     "The differential of F(θ) = ‖Aθ − b‖² is dF = 2(Aθ − b)ᵀA dθ, so ∇F = 2Aᵀ(Aθ − b) and the Hessian is 2AᵀA. Setting the gradient to zero gives the normal equations."]
  - 式: "∇F = 2Aᵀ(Aθ − b)          (21.7.5)；  eₖ₊₁ = (I − 2ηAᵀA)eₖ          (21.7.6)；  0 < η < 1/λ_max(AᵀA)          (21.7.7)"
  - ["梯度下降的误差每步乘以 I − 2ηAᵀA，谱半径小于 1 才收敛。最优固定步长 η = 1/(λ_min + λ_max) 时收敛因子为 (κ − 1)/(κ + 1)，κ 为 AᵀA 的条件数。把自变量去均值、除以标准差，可使 κ 接近 1。",
     "Each gradient-descent step multiplies the error by I − 2ηAᵀA, which converges only if its spectral radius is below 1. The optimal fixed step η = 1/(λ_min + λ_max) gives the factor (κ − 1)/(κ + 1), κ the condition number of AᵀA. Centering and scaling the variable can bring κ close to 1."]
