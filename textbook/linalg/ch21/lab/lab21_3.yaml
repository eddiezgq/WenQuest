原理:
  - ["格什戈林圆盘定理：A 的每个特征值都在某个圆盘 |z − aᵢᵢ| ≤ Rᵢ 中，Rᵢ 为第 i 行非对角元绝对值之和；若 k 个圆盘的并与其余圆盘不相交，它恰含 k 个特征值。对 Aᵀ 同样成立（列圆盘）。",
     "Gershgorin: every eigenvalue of A lies in some disc |z − aᵢᵢ| ≤ Rᵢ, Rᵢ the sum of |off-diagonal| in row i; a union of k discs disjoint from the others holds exactly k eigenvalues. The same holds for Aᵀ (column discs)."]
  - 式: "|z − aᵢᵢ| ≤ Σⱼ≠ᵢ |aᵢⱼ|          (21.3.1)；  缩放后 |z − aᵢᵢ| ≤ Σⱼ≠ᵢ |aᵢⱼ| dⱼ/dᵢ          (21.3.2)"
  - ["对角相似变换 D⁻¹AD 不改变特征值，却改变圆盘的半径：缩小 dₖ，其余各行中第 k 列的贡献变小，第 k 行的半径变大。所有圆盘都在左半平面时，ẋ = Ax 渐近稳定，圆盘的最右端给出最慢衰减率的界。",
     "A diagonal similarity D⁻¹AD keeps the eigenvalues but changes the radii: shrinking dₖ reduces the column-k contributions in other rows and enlarges row k. When all discs lie in the left half-plane, ẋ = Ax is asymptotically stable and the rightmost point bounds the slowest decay rate."]
