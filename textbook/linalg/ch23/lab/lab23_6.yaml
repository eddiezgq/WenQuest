# 实验 23.6 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab23_6.js。
原理:
  - ["测量模型 y = f(p, q) + 噪声：f 为 DH 正运动学，p 为 24 个 DH 参数，q 为关节角。在当前参数处线性化，J δp ≈ y − f(p)，用截断 SVD 求修正量，迭代（高斯–牛顿法）。",
     "Measurement model y = f(p, q) + noise, f the DH forward kinematics, p the 24 DH parameters, q the joint angles. Linearize at the current p, J δp ≈ y − f(p), solve by truncated SVD and iterate (Gauss–Newton)."]
  - 式: "δp = Σᵢ≤k (uᵢᵀ r / σᵢ) vᵢ          (23.2.2)；  只测位置时 rank J = 18          (23.6.1)"
  - ["J 有 6 个奇异值几乎为零：只测末端位置时，有 6 个参数组合对测量没有影响（例如末关节的零点和扭角）。把它们对应的奇异值也求逆，修正量会大得荒谬。",
     "Six singular values of J are nearly zero: with position-only data, six parameter combinations do not affect the measurements (e.g. the last joint's zero offset and twist). Inverting them gives absurd corrections."]
步骤:
  - ["N = 50、噪声 0.05 mm：k 取 12、16、18、20、22，分别标定，记录验证误差与最大修正量（表 1，任务 1～3）。",
     "N = 50, noise 0.05 mm: calibrate with k = 12, 16, 18, 20, 22; record the validation error and the largest correction (Table 1, tasks 1–3)."]
  - ["k = 18：N 取 10、20、50、100，记录 σ₁₈ 与验证误差（任务 4）。",
     "k = 18: N = 10, 20, 50, 100; record σ₁₈ and the validation error (task 4)."]
  - ["k = 18、N = 50：噪声取 0.01、0.05、0.1、0.25 mm，记录验证误差（任务 5）。",
     "k = 18, N = 50: noise 0.01, 0.05, 0.1, 0.25 mm; record the validation error (task 5)."]
数据表:
  - 标题: ["表 1  保留的奇异值个数 k（N = 50、噪声 0.05 mm）", "Table 1  Singular values kept k (N = 50, noise 0.05 mm)"]
    表头: ["k", "验证误差 / mm", "标定残差 / mm", "最大修正量"]
    表头英文: ["k", "Validation error / mm", "Calibration residual / mm", "Largest correction"]
