注意:
  - ["验证误差是与真实位置比较的，相当于用一台精度高得多的仪器检查；它可以小于测量噪声。",
     "The validation error compares with true positions, as if checked by a much more accurate instrument; it can be smaller than the measurement noise."]
  - ["“看不见”的参数组合不影响末端位置，标定后它们保持名义值（最小范数解），不影响使用。",
     "Unobservable combinations do not affect the tool position; they stay at their nominal values (minimum-norm solution) and do no harm."]
  - ["读数“接受 / 拒绝”：使残差变大的一步不被接受。k 超过 18 时修正量大得荒谬，每一步都被拒绝，参数停在名义值，“标定后”的误差就等于标定前——这不是“标定没有效果”，而是求出的修正量不能用。收敛以后的几步也可能因为残差不再减小而被拒绝，这是正常的。",
     "Readout “accepted / rejected”: a step that increases the residual is not accepted. With k above 18 the corrections are absurd, every step is rejected and the parameters stay nominal, so the error “after” equals the error before. This does not mean calibration has no effect; the computed correction is unusable. After convergence, a few steps may also be rejected because the residual no longer decreases; that is normal."]
