注意:
  - ["速度误差要与真实速度比较，只有在模拟中才能算；实际中只能看残差和 L 曲线。",
     "The velocity error needs the true velocity and is available only in simulation; in practice only the residual and the L-curve are available."]
  - ["偏差原理要求知道噪声水平 σ；σ 估错了，λ 也会跟着错。",
     "The discrepancy principle needs the noise level σ; a wrong σ gives a wrong λ."]
