注意:
  - ["30 个点是一个样本，样本的主方向与理论的主方向（总体协方差的特征向量）会有差别；椭圆越接近圆（λ₁ 与 λ₂ 越接近），主方向越难估准。",
     "Thirty points are a sample; the sample principal direction differs from the theoretical one (the eigenvector of the population covariance). The closer the ellipse is to a circle (λ₁ near λ₂), the harder the direction is to estimate."]
