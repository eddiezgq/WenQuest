# 实验 16.4 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab16_4.js。
原理:
  - ["腿的竖直振动满足 Mq̈ + Cq̇ + Kq = 0。不计阻尼时，Kv = ω²Mv 的三个解给出固有频率与振型，振型关于 M 正交，模态坐标把方程解耦成三个独立的单自由度振子。", "The leg's vertical motion obeys Mq̈ + Cq̇ + Kq = 0. Without damping the three solutions of Kv = ω²Mv give natural frequencies and mode shapes; the modes are M-orthogonal and modal coordinates decouple the equations into three independent oscillators."]
  - 式: "q = Σ φⱼηⱼ，φᵢᵀMφⱼ = δᵢⱼ，φᵢᵀKφⱼ = ωⱼ²δᵢⱼ；  ζⱼ ≈ φⱼᵀCφⱼ / (2ωⱼ)；  有阻尼的特征值 −ζω ± iω√(1 − ζ²)"
  - ["初始状态按某一个振型摆放时，运动只含这个振型的频率；一般的初始状态（如落地）是各振型的叠加，各分量按 φⱼᵀMq̇₀ 分配。", "If the initial state is one mode shape only that mode's frequency appears; a general start (such as a landing) is a sum of modes weighted by φⱼᵀMq̇₀."]
步骤:
  - ["默认参数下依次点“激发振型 1”“激发振型 2”“激发振型 3”，记录三个固有频率、振型和模态阻尼比，填入表 1。", "With default values press Excite mode 1, 2, 3 in turn and record the frequencies, shapes and modal damping ratios in Table 1."]
  - ["把 k₃ 从 20000 改到 10000 和 40000，重复步骤 1，看哪个频率变化最大。", "Change k₃ from 20000 to 10000 and 40000, repeat step 1 and note which frequency changes most."]
  - ["完成任务 1～4。", "Complete tasks 1–4."]
