  - ["质量取自 Go2 的 MuJoCo 模型；刚度和阻尼是示意值，用来说明方法，不是 Go2 的实测参数。", "Masses come from the Go2 MuJoCo model; stiffness and damping are illustrative values, not measured Go2 parameters."]
  - ["阻尼不与 M、K 成比例时，振型不能严格解耦阻尼，读数中的模态阻尼比是近似值；阻尼比超过 1 表示该模态不再振荡。", "When damping is not proportional to M and K the modes do not decouple it exactly; the displayed modal damping ratios are approximations, and values above 1 mean that mode no longer oscillates."]
思考题:
  - ["加大膝关节阻尼 c₂ 能显著提高第 1 模态的阻尼比。如果改为加大髋–大腿阻尼 c₁（实验中固定为 30 N·s/m），效果会小得多。用第 1 振型中各弹簧两端的相对位移解释。", "Raising the knee damping c₂ greatly increases the first modal damping ratio; raising the hip–thigh damping c₁ (fixed at 30 N·s/m here) would do much less. Explain with the relative motion across each spring in mode 1."]
