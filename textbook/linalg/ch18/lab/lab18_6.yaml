原理:
  - ["Panda 的雅可比矩阵 J 是 6×7 的，秩为 6，零空间一维，由第七个右奇异向量 v₇ 张成（定理 18.3.1）。关节速度沿 v₇ 时，末端既不平动也不转动，称为自运动。",
     "Panda's Jacobian J is 6×7 of rank 6; its null space is spanned by the seventh right singular vector v₇ (Theorem 18.3.1). Joint velocities along v₇ do not move the tool: self-motion."]
  - 式: "θ̇ = J⁺ξ + β v₇，  ‖θ̇‖² = ‖J⁺ξ‖² + β²          (18.6.4)"
