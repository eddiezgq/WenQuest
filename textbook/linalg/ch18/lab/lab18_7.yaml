     "The UR5e Jacobian J is 6×6: rows 1–3 give the angular velocity, rows 4–6 the linear velocity of the tool point. Its singular values σ₁ ≥ … ≥ σ₆ describe the motion ability in each direction; σ₆ = 0 exactly at a singularity."]
