思考题:
  - ["对矩阵 2，格拉姆–施密特的 ‖QR − A‖ 很小，Q 却不正交。这说明“分解的误差小”与“Q 是正交矩阵”是两回事。用它解最小二乘会有什么后果？", "For matrix 2, Gram–Schmidt gives a small ‖QR − A‖ but a non-orthogonal Q. A small factorization error is not the same as an orthogonal Q. What happens if this Q is used for least squares?"]
