注意:
  - ["实验中姿态固定为 (30°, 60°, −45°)，机械臂在水平面内运动，不计重力；质量矩阵随姿态变化，换一个姿态结论的数值会变。", "The pose is fixed at (30°, 60°, −45°) and the arm moves in a horizontal plane without gravity; the mass matrix changes with the pose, and so do the numbers."]
  - ["交叉项按 t ᵀ M n 计算（t、n 为两部分），动能之和与总动能相差的正是这一项。", "The cross term is tᵀMn for the two parts t and n; it is exactly the gap between the sum of the energies and the total."]
思考题:
  - ["实际控制器要在每个 1 ms 周期内重算 M(q) 和 J⁺_M。如果质量参数有 10% 的误差，在速度层面（次任务速度经 P 投影）末端还会不动吗？在力矩层面（次任务力矩经 Pᵀ 投影）末端还会不产生加速度吗？", "A real controller recomputes M(q) and J⁺_M every 1 ms. If the mass parameters are 10% off, does the tool still stay still at the velocity level (secondary velocity projected with P)? Does it still get no acceleration at the torque level (secondary torque projected with Pᵀ)?"]
