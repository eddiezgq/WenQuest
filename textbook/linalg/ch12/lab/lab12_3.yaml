# 实验 12.3 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab12_3.js。
原理:
  - ["平面三连杆臂的动能 T = ½ q̇ᵀM(q)q̇，质量矩阵 M 对称正定，⟨a, b⟩_M = aᵀMb 是关节速度空间上的内积（动能内积）。", "The kinetic energy of the planar three-link arm is T = ½ q̇ᵀM(q)q̇; the mass matrix M is symmetric positive definite and ⟨a, b⟩_M = aᵀMb is an inner product on joint velocities."]
  - 式: "最小动能解 q̇ = J⁺_M v，J⁺_M = M⁻¹Jᵀ(JM⁻¹Jᵀ)⁻¹；  M = I 时为欧氏最小范数解 J⁺v = Jᵀ(JJᵀ)⁻¹v；  零空间投影 P = I − J⁺_M J"
  - ["由最佳逼近定理，满足 Jq̇ = v 的关节速度中，动能最小的一个与零空间 N(J) 在动能内积下正交。P 是动能内积下到 N(J) 的正交投影，用它分解时两部分的动能可以相加；点积下的投影 I − J⁺J 分出的两部分在动能内积下不正交，有交叉项。", "By the best-approximation theorem, the joint velocity with Jq̇ = v and least kinetic energy is orthogonal to N(J) in the kinetic-energy inner product. P is the orthogonal projection onto N(J) in that inner product, so the energies of the two parts add up; the dot-product projection I − J⁺J leaves parts that are not orthogonal in it, with a cross term."]
步骤:
  - ["在“两种最小范数解”场景中，m₃ = 1 kg，把 φ 从 0° 每次增加 30° 到 150°，按表 1 记录两种解的关节速度与动能；找出省下一半以上动能的方向（任务 1）。", "In the first scene with m₃ = 1 kg, raise φ from 0° to 150° in steps of 30°; record both solutions and their kinetic energies in Table 1; find a direction that saves more than half (task 1)."]
  - ["在 110°～140° 之间细调 φ，找出省得最多的方向（任务 2）。再把 m₃ 改为 4 kg 重复，比较最大节省。", "Fine-tune φ between 110° and 140° to find the largest saving (task 2). Repeat with m₃ = 4 kg and compare the largest saving."]
  - ["切换到“零空间投影”场景，按表 2 改变 w，记录两种投影的零空间部分、两部分动能之和与交叉项；找出点积投影交叉项超过 0.1 J 的 w（任务 3）。", "Switch to the null-space scene, vary w as in Table 2 and record the null parts, the sum of the two energies and the cross term for both projections; find a w whose dot-product cross term exceeds 0.1 J (task 3)."]
