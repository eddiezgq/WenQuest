  - ["模型没有阻尼，振动不会衰减；实际减速器有摩擦，振动会逐渐消失，但频率与振型基本不变。", "The model has no damping, so the vibration never dies out; a real gear has friction and the vibration decays, but the frequencies and modes hardly change."]
