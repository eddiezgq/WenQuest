原理:
  - ["2 阶行列式 det A = ad − bc 是 A 的两列张成的平行四边形的有向面积：绝对值是面积，正号表示方向不变（逆时针），负号表示翻面（顺时针）（6.1 节）。", "The 2×2 determinant ad − bc is the signed area of the parallelogram spanned by the columns: its absolute value is the area; positive keeps the orientation, negative flips it (Section 6.1)."]
  - 式: "面积(A(Ω)) = |det A| · 面积(Ω)；  det(AB) = det A · det B"
