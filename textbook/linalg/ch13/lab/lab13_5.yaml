注意:
  - ["本实验用前向欧拉法得到的简化模型，它会给系统“加能量”：K_d 太小时，连续时间稳定的系统按这个模型会发散。实际控制器的输出在一个周期内保持不变（零阶保持），精确的离散模型稍有不同，结论也可能不同（13.5.6 节、35.1 节）。采样周期越短，两者越接近连续系统。", "This lab uses the simplified forward-Euler model, which adds energy: with too little K_d a system stable in continuous time diverges in this model. A real controller holds its output over a period (zero-order hold); the exact discrete model differs slightly and so may the conclusion (Sections 13.5.6, 35.1). The shorter the period, the closer both are to the continuous system."]
  - ["实验中关节没有力矩限幅；真实电机的力矩有上限，增益过大时会饱和。", "The lab has no torque limit; a real motor saturates when the gains are too high."]
思考题:
