注意:
  - ["模型只计关节的弹性，连杆当作刚体；实际机械臂的连杆和底座也会变形。", "Only joint elasticity is modelled; links are rigid. Real links and bases also deform."]
  - ["q₂ 接近 0° 或 180° 时手臂接近奇异位形，某个方向的刚度极大（几乎推不动），另一方向仍有限。", "Near q₂ = 0° or 180° the arm is close to singular: one direction becomes extremely stiff while the other stays finite."]
思考题:
  - ["精加工时尺寸误差主要来自法向（切深方向）的变形；抛光时却希望工具在法向能贴合工件。两种工序分别应当怎样选择姿态？", "In finishing, dimensional error comes mainly from deflection along the surface normal (depth of cut); in polishing you want the tool to comply along the normal. How should the pose be chosen in each case?"]
