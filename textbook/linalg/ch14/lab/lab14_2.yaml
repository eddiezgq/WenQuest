# 实验 14.2 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab14_2.js。
原理:
  - ["平面两连杆臂的关节有弹性（关节刚度 k₁、k₂）。末端受力 F 时，关节转过 Δq = K_q⁻¹ Jᵀ F，末端位移 d = J Δq = C F，柔度矩阵 C = J K_q⁻¹ Jᵀ 是对称的，刚度矩阵 K_x = C⁻¹。", "The joints of a planar two-link arm are elastic (stiffness k₁, k₂). A tip force F turns the joints by Δq = K_q⁻¹ Jᵀ F and moves the tip by d = J Δq = C F; the compliance C = J K_q⁻¹ Jᵀ is symmetric and the stiffness is K_x = C⁻¹."]
  - 式: "C = Q diag(c_soft, c_stiff) Qᵀ；  主刚度 1/c；  沿主轴推时 d 与 F 同向；  各向同性 ⇔ 两个主刚度相等"
  - ["由谱定理，C 的两个特征向量互相垂直，是末端的软轴和硬轴；沿主轴推，位移与推力同向，其余方向位移偏向软轴。各个方向施加同样大小的力，位移的端点组成以主轴为轴的椭圆。", "By the spectral theorem the two eigenvectors of C are perpendicular: the soft and stiff axes. Along an axis the deflection follows the push; otherwise it swerves toward the soft axis. Equal pushes in all directions give deflection tips on an ellipse with these axes."]
步骤:
  - ["姿态 (0°, 90°)、k₂ = 1000：改变推力方向 φ，按表 1 记录位移和位移与推力的夹角；找出最软的方向（任务 1）。", "Pose (0°, 90°), k₂ = 1000: vary φ and record the deflection and its angle to the push in Table 1; find the softest direction (task 1)."]
  - ["把 q₁ 转到 60°（任务 2），记录主刚度和软轴方向的变化。", "Turn q₁ to 60° (task 2); record how the principal stiffnesses and the soft axis change."]
  - ["保持 k₂ = 1000，q₂ 取 30°、60°、90°、120°、150°，按表 2 记录主刚度；找出最软方向也超过 10000 N/m 的姿态（任务 3）。再同时调 q₂ 和 k₂，找出各向同性的组合（任务 4）。", "Keep k₂ = 1000 and set q₂ to 30°, 60°, 90°, 120°, 150°, recording the principal stiffnesses in Table 2; find a pose whose softest direction exceeds 10000 N/m (task 3). Then tune q₂ and k₂ together for an isotropic tip (task 4)."]
