  - 式: "R(θ) = [[cos θ, −sin θ], [sin θ, cos θ]]；  S = [[1, k], [0, 1]]；  D = diag(sx, sy)"
  - ["一般 AB ≠ BA。可以交换的例子：任何矩阵与 cI；两个对角矩阵；同一矩阵的幂；平面上两个绕原点的旋转。", "In general AB ≠ BA. Commuting examples: any matrix with cI; two diagonal matrices; powers of one matrix; two rotations of the plane about the origin."]
  - ["AGV 的一次运动是一个 3×3 齐次变换 T = [[R, t], [0ᵀ, 1]]；“先做 T₁ 再做 T₂”（在车体坐标系中描述）的总变换是 T₁T₂（4.4 节）。", "Each AGV motion is a 3×3 homogeneous transform T = [[R, t], [0ᵀ, 1]]; doing T₁ and then T₂ (described in the body frame) gives T₁T₂ (Section 4.4)."]
