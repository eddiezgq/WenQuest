    表头: ["n", "2n³", "ijk / ms", "ikj / ms", "分块 / ms", "分块 GFLOPS"]
    表头英文: ["n", "2n³", "ijk / ms", "ikj / ms", "blocked / ms", "blocked GFLOPS"]
    行: [["64", "", "", "", "", ""], ["128", "", "", "", "", ""], ["256", "", "", "", "", ""], ["512", "", "", "", "", ""]]
  - 标题: ["表 2  块大小的影响（n = 512）", "Table 2  Effect of the block size (n = 512)"]
    表头: ["块大小 b", "三个块占用的内存 3 × 8b² / KB", "分块 / ms", "分块 GFLOPS"]
    表头英文: ["Block b", "Memory of three tiles 3 × 8b² / KB", "Blocked / ms", "Blocked GFLOPS"]
    行: [["8", "", "", ""], ["16", "", "", ""], ["32", "", "", ""], ["64", "", "", ""], ["128", "", "", ""]]
注意:
  - ["浏览器中的计时受其他程序影响，同一设置多运行两次，取较小的值。", "Browser timings vary with whatever else is running; repeat each setting and take the smaller time."]
  - ["n = 512 时 ijk 可能要一两秒，运行时页面会暂停响应，属正常现象。", "At n = 512 the ijk loop may take a second or two; the page pauses meanwhile, which is normal."]
  - ["各台计算机的数值不同，报告中比较的是比值和趋势，而不是绝对数值。", "Numbers differ between computers; the report compares ratios and trends, not absolute values."]
思考题:
  - ["表 2 中最快的块大小，三个块大约占多少内存？与你的计算机一级、二级缓存的容量（可在系统信息中查到）相比如何？", "For the fastest block size in Table 2, how much memory do three tiles take? Compare with the L1 and L2 cache sizes of your computer."]
