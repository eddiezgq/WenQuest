# 实验 4.7 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab4_7.js。
原理:
  - ["n 阶方阵相乘需要 n³ 次乘法和约 n³ 次加法，共约 2n³ 次浮点运算；n 加倍，运算量变为 8 倍。", "Multiplying n×n matrices takes n³ multiplications and about n³ additions, about 2n³ flops; doubling n multiplies the work by 8."]
  - 式: "ijk：c_ij = Σ_k a_ik b_kj；  ikj：C 的第 i 行 += a_ik × (B 的第 k 行)"
  - ["矩阵按行存储时，ijk 的最内层循环沿 B 的列跳着读内存，ikj 的最内层沿 B 和 C 的行连续读写，缓存命中率高。", "With row-major storage the inner loop of ijk jumps down a column of B, while that of ikj runs along rows of B and C, so it hits the cache far more often."]
  - ["分块算法把矩阵切成 b×b 的小块，三个小块同时放进缓存，每个元素读进来后被重复使用约 b 次。", "The blocked algorithm cuts the matrices into b×b tiles; three tiles fit in the cache together and each entry, once loaded, is reused about b times."]
步骤:
  - ["取 n = 256、块大小 32，点“运行”（任务 1）。确认三者的最大差小于 10⁻⁹，记录三个耗时和 GFLOPS 于表 1。", "Set n = 256, block 32 and press Run (task 1). Check the largest difference is below 10⁻⁹; record the times and GFLOPS in Table 1."]
  - ["依次取 n = 64、128、256、512 各运行一次（任务 2），填表 1，计算 n 加倍时的耗时之比。", "Run with n = 64, 128, 256, 512 (task 2); fill in Table 1 and compute the time ratios when n doubles."]
  - ["取 n = 512，块大小依次取 8、16、32、64、128 各运行一次（任务 3），填表 2。", "With n = 512 run block sizes 8, 16, 32, 64, 128 (task 3); fill in Table 2."]
  - ["课后在自己的计算机上用 Python 计时 A @ B（n = 512），与表 1 比较。", "After class, time A @ B in Python on your own computer (n = 512) and compare with Table 1."]
