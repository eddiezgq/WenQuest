      - [["下班后保养（预期合计）", "Service after the shift (expected total)"], "${{ch06.opt_later:.0f}}"]
      - [["下班后保养的最优周期", "Optimal interval, after-shift service"], "{{ch06.T_opt}} h"]
    side: {big: "÷{{ch06.ratio:.0f}}", text: ["保养后风险降到 {{ch06.p_after:.2f}}%", "Risk after service: {{ch06.p_after:.2f}}%"]}
    foot: ["改周期要厂长批准：台账“详情”底部提交，ERPNext 维护计划跟着改", "Changing the interval needs the plant manager: submit it under the asset's Details; the ERPNext schedule follows"]
    notes:
      - "回到开头。磨床未来 80 小时坏掉的概率 {{ch06.p:.1f}}%，不保养的预期损失 {{ch06.EL:.0f}} 美元。三个方案里下班后保养最划算，预期合计约 {{ch06.opt_later:.0f}}，急单不受影响，风险降到 {{ch06.p_after:.2f}}%。另外，保养如果都放在下班后做，最优周期约 {{ch06.T_opt}} 小时，现行 500 小时偏长。改周期要厂长批准，在台账详情底部提交，ERPNext 的维护计划跟着改。"
      - "Back to the start. The grinder has a {{ch06.p:.1f}} percent chance of failing in the next 80 hours, an expected loss of {{ch06.EL:.0f}} dollars without service. Of the three options, servicing after the shift is cheapest, about {{ch06.opt_later:.0f}} expected: the rush order is untouched and the risk drops to {{ch06.p_after:.2f}} percent. And if services are always done after the shift, the optimal interval is about {{ch06.T_opt}} hours; the current 500 is too long. Changing it needs the plant manager's approval: submit it under the asset's details and the ERPNext maintenance schedule follows."

  - layout: summary
    title: ["本讲小结", "Summary"]
    points:
      - ["保养只对磨损段（β > 1）有用；β = 1 无记忆", "Service helps only in wear-out (β > 1); β = 1 is memoryless"]
      - ["决策用条件概率 P(t, H)，预期损失 = P × C_f", "Decide with P(t, H); expected loss = P × C_f"]
      - ["C(T) 求最优周期；把保养挪出生产时间更省", "C(T) gives the interval; moving service out of production saves more"]
    after: ["作业 6 · 测验 6 · 数字工厂实验 18 报告 —— 在问渠学习平台完成", "Assignment 6 · Quiz 6 · Lab 18 report — on WenQuest"]
    notes:
      - "这一讲记住三件事。第一，保养只对磨损有用，β 大于 1 才值得定期保养；β 等于 1 时坏不坏和用了多久无关。第二，做决定用条件概率：已经跑了 t 小时，再跑 H 小时坏掉的概率，乘一次故障的损失，就是预期损失，再跟保养花费和交期一起比。第三，周期用 C(T) 来定，保养越便宜越该勤，把保养挪出生产时间往往比调周期更省。下课后做作业 6、测验 6，完成数字工厂实验 18 的报告。"
      - "Three things to remember. One: service only helps against wear; scheduled service pays only when beta is above one, and with beta of one failure doesn't depend on age. Two: decide with the conditional probability, the chance that a machine which has run t hours fails in the next H, times the loss per failure; that's the expected loss, to be weighed with the service cost and delivery. Three: set the interval with C of T; the cheaper the service, the more often, and moving it out of production time often saves more than tuning the interval. After class: Assignment 6, Quiz 6 and the Lab 18 report."
