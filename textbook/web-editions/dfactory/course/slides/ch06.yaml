      - ["生产时间停机：T* = {{ch06.T_opt2}} h，${{ch06.r_opt2:.2f}}/h", "Stopping production: T* = {{ch06.T_opt2}} h, ${{ch06.r_opt2:.2f}}/h"]
      - ["改做法比调参数更值钱", "Changing how you work beats tuning a number"]
    visual: {video: cost}
    notes:
      - "这是虚拟实验 6-2，T 在来回扫。先看下班后保养，每次只花 215，最优周期 {{ch06.T_opt}} 小时，每小时 {{ch06.r_opt:.2f}} 美元，比坏了再修省七成；现行 500 小时是 {{ch06.r_500:.2f}}，偏长。再切到生产时间里停机保养，每次再加少挣的 600，保养变贵，最优周期后移到 {{ch06.T_opt2}} 小时，现行 500 小时几乎就是最优。保养越便宜越该勤；把保养挪到下班后，比调周期省得多。"
      - "This is Virtual lab 6-2 with T sweeping back and forth. First, servicing after the shift at 215 a time: the optimum is {{ch06.T_opt}} hours at {{ch06.r_opt:.2f}} dollars an hour, seventy percent below run to failure; the current 500 hours costs {{ch06.r_500:.2f}}, too long. Now switch to stopping production, 600 more of lost margin each time: service is dearer and the optimum moves out to {{ch06.T_opt2}} hours, so 500 is practically optimal. The cheaper the service, the more often; and moving it out of production time saves far more than tuning the interval."

  - layout: split
    title: ["两台同样的设备比一比", "Race two identical machines"]
    points:
