      - ["按周期保养：坏得少，长期更省", "Serviced every T: fewer failures, cheaper overall"]
      - ["跑得越久，平均越接近 C(T)", "The longer the run, the closer to C(T)"]
    visual: {video: race}
    notes:
      - "画面上两台同样的设备用同一串随机寿命跑两万小时：蓝线按周期保养，红线坏了再修。刚开始两条线差不多，有时红线还更低，因为运气好没坏；跑得越久，差距越清楚，两条线的斜率分别接近 C(T) 和坏了再修的 {{ch06.r_run:.2f}}。判断策略要看长期平均，不能看一两次的运气。"
      - "On screen two identical machines run 20,000 hours on the same random lifetimes: blue is serviced every T hours, red runs to failure. At first the lines are close, and red may even be lower when it's lucky; the longer they run, the clearer the gap, and their slopes approach C of T and the run-to-failure {{ch06.r_run:.2f}}. Judge a policy by its long-run average, not by one or two lucky runs."

