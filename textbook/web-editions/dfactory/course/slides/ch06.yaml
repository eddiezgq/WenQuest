  - layout: section
    num: "04"
    title: ["检验与执行", "Checking and doing"]

  - layout: points
    title: ["用故障记录检验：MTBF", "Checking with failure records: MTBF"]
    points:
      - ["MTBF ≈ 运行小时 ÷ 故障次数：30 × 16 ÷ 3 = {{ch06.mtbf:.0f}} h", "MTBF ≈ hours ÷ failures: 30 × 16 ÷ 3 = {{ch06.mtbf:.0f}} h"]
      - ["记录多了拟合 β、η，再重算周期", "With more records, fit β and η and recompute"]
      - ["分清概率和这一次的结果", "Keep probability and a single outcome apart"]
    foot: ["13% 的风险：十台磨床里一两台会坏；没坏不证明不保养是对的", "A 13% risk: one or two grinders in ten will fail; not failing doesn't prove skipping was right"]
    notes:
      - "β 和 η 从哪里来？从故障记录来。最简单的是平均故障间隔 MTBF：近 30 天、每天 16 运行小时、坏了 3 次，就是 {{ch06.mtbf:.0f}} 小时。它只是平均数，看不出失效率升还是降；记录多了，用每次故障时自上次保养以来的小时数拟合威布尔分布，再回头重算周期。还要分清概率和这一次的结果：13% 的风险，十个同学的磨床里一两台会坏。没坏不证明不保养是对的。"
      - "Where do beta and eta come from? From failure records. The simplest measure is MTBF: 30 days at 16 hours with 3 failures gives {{ch06.mtbf:.0f}} hours. It's only an average and can't show whether the rate is rising; with more records, fit a Weibull to the hours since last service at each failure and recompute the interval. And keep probability apart from one outcome: with a 13 percent risk, one or two of ten students' grinders will fail. Not failing doesn't prove skipping the service was right."

