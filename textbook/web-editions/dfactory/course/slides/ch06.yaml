    foot: ["比对模式：提交前看不到中枢的推荐。13 台设备都按本讲的模型老化；成绩 = 平台 60 分 + 报告 40 分", "Comparison mode hides the hub's advice until you submit. All 13 machines age by this model; mark = 60 platform + 40 report"]
    notes:
      - "最后到数字工厂里亲手做一次。车间里 13 台设备每台都有自己的威布尔参数，就是我们用的这个模型，设备真会按这个概率坏。实验 18：读台账，手算概率和预期损失，平台核对；在指挥台比较三个方案、选一个写理由提交，提交之前看不到中枢的推荐；然后发起保养工单、老师批准，挂牌上锁、保养、验收解锁，ERPNext 里多一条保养记录；最后车间继续跑，对比保养过和没保养的设备各坏了几次，估 MTBF。"
      - "Finally, do it yourself in the digital factory. Each of its 13 machines has its own Weibull parameters, the model we've used, and they really fail with those probabilities. In Lab 18 you read the asset register, calculate the probability and expected loss, and the platform checks it. In the command centre you compare the three options, choose one and submit your reasons; the hub's recommendation stays hidden until you do. Then you raise the service order, the instructor approves it, and you go through lockout, service and acceptance, leaving a service record in ERPNext. Finally the shop keeps running: count failures on serviced and unserviced machines and estimate MTBF."

  - layout: split
    title: ["机器人联系：关节减速器的换脂", "Robot link: regreasing joint reducers"]
    points:
      - ["润滑老化、齿面磨损：β > 1", "Ageing grease, wearing teeth: β > 1"]
      - ["已运行 14000 h 再跑 2000 h：{{ch06.rob_p:.1f}}%；刚换脂 {{ch06.rob_p0:.1f}}%", "After 14,000 h, next 2,000 h: {{ch06.rob_p:.1f}}%; freshly greased {{ch06.rob_p0:.1f}}%"]
      - ["读电机电流看摩擦：按状态保养", "Read motor current for friction: condition-based service"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><g transform="translate(120 90)"><rect x="0" y="380" width="200" height="40" rx="10" fill="#22324d"/><rect x="70" y="250" width="60" height="140" rx="12" fill="#4b5f7d"/><circle cx="100" cy="240" r="46" fill="#111d31" stroke="#f2b705" stroke-width="8"/><path d="M100 240 L330 110" stroke="#4b5f7d" stroke-width="40" stroke-linecap="round"/><circle cx="330" cy="110" r="40" fill="#111d31" stroke="#f2b705" stroke-width="8"/><path d="M330 110 L520 210" stroke="#4b5f7d" stroke-width="30" stroke-linecap="round"/><circle cx="520" cy="210" r="22" fill="#2ec4b6"/><text x="100" y="250" font-size="22" fill="#f2b705" text-anchor="middle" font-weight="700">WQR</text><text x="330" y="120" font-size="22" fill="#f2b705" text-anchor="middle" font-weight="700">WQR</text></g><path d="M120 560 C300 555 420 548 520 530 S700 470 800 400" stroke="#ff7a45" stroke-width="5" fill="none"/><text x="120" y="600" font-size="26" fill="#d3deea">关节电流里的摩擦力矩慢慢变大 = 减速器在磨损</text><text x="120" y="630" font-size="20" fill="#8fa3ba" class="en">friction torque creeping up in the joint current = the reducer is wearing</text></svg>
    notes:
      - "协作机器人每个关节里都有一台精密减速器，润滑脂会老化，轴承和齿面会磨损，是典型的 β 大于 1。设 β 等于 2.5、η 等于两万小时，这是示意值：已经跑了一万四千小时的关节，再跑两千小时坏掉的概率 {{ch06.rob_p:.1f}}%，刚换过脂的只有 {{ch06.rob_p0:.1f}}%，所以厂家按运行小时规定换脂。再进一步，控制器能读关节电机电流，摩擦力矩慢慢变大就是减速器在磨损，按状态保养更省。我们厂造的 WQR-105 正是装在这些关节里的减速器。"
      - "Every joint of a collaborative robot has a precision reducer whose grease ages and whose bearings and teeth wear: a classic beta above one. Take beta 2.5 and eta 20,000 hours, illustrative values. A joint that has run 14,000 hours has a {{ch06.rob_p:.1f}} percent chance of failing in the next 2,000; a freshly greased one, only {{ch06.rob_p0:.1f}}. That's why makers specify regreasing by hours. Better still, the controller can read each joint motor's current; friction creeping up means the reducer is wearing, and servicing on condition is cheaper. The WQR-105 reducers our plant makes go into exactly these joints."

  - layout: points
    title: ["生活例子：多久换一次机油", "Everyday example: how often to change the oil"]
    points:
