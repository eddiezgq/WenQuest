slides:
  - layout: cover
    video: hero
    kicker: ["第 6 讲", "Lecture 6"]
    title: ["设备维护与可靠性", "Maintenance and Reliability"]
    sub: ["该不该停下来保养，算出来", "Whether to stop for service: work it out"]
    notes:
      - "这一讲讲设备维护。设备会坏，什么时候坏谁也说不准，可工厂天天要做跟坏有关的决定：今天停不停下来保养，保养周期定多长。我们用一个概率模型，把说不准变成能算的东西：未来一段时间坏掉的概率，预期损失多少钱，再跟保养的确定花费比一比。背景上这台设备一直在跑，到周期就保养，时钟拨回零，偶尔坏一次。"
      - "This lecture is about maintenance. Machines break down, and nobody knows exactly when, yet a plant makes decisions about breakdowns every day: do we stop for service today, and how long should the interval be? We'll use a probability model to turn 'nobody knows' into numbers: the chance of failing in the next stretch of time, the expected loss in money, and then a comparison with the certain cost of a service. In the background a machine keeps running; at each interval it's serviced and its clock resets, and now and then it fails."

  - layout: question
    tag: ["厂里出的事", "What happened in the plant"]
    title: ["磨床保养逾期 120 小时，急单在赶，停不停？", "The grinder is 120 hours overdue and a rush order is on: stop it?"]
    facts:
      - ["GRD-01 是瓶颈：周期 500 h，已运行 620 h", "GRD-01 is the bottleneck: interval 500 h, run 620 h"]
      - ["坏一次停 8 h、修理 $1,200、每小时少挣 $200", "A failure: 8 h down, $1,200 repair, $200 lost per hour"]
      - ["保养一次停 3 h、人工材料 $215", "A service: 3 h down, $215 labour and materials"]
    notes:
      - "先看厂里出的事。机器人厂追加的关节减速器，齿轮轴都要过外圆磨床 GRD-01，它是全厂的瓶颈。周一早上厂情中枢报了一条保养逾期：周期 500 小时，已经跑了 620 小时。坏一次要停 8 个小时，修理 1200 美元，停机每小时少挣 200 美元毛利；保养一次停 3 小时，人工加材料 215 美元。车间主任说急单要紧，保养往后放；设备员说已经逾期，必须马上停。谁对？"
      - "Here's what happened. Every gear shaft for the robot plant's extra order of joint reducers goes through grinder GRD-01, the plant's bottleneck. On Monday morning the factory hub flagged it as overdue: the interval is 500 hours and it has run 620. A failure stops it for 8 hours, costs 1,200 dollars to repair and loses 200 dollars of margin per hour; a service stops it for 3 hours and costs 215 in labour and materials. The supervisor says the rush order comes first; the maintenance planner says stop it now. Who's right?"

  - layout: section
    num: "01"
    title: ["设备为什么会坏", "Why machines fail"]

  - layout: split
    title: ["浴盆曲线：失效率的三个阶段", "The bathtub curve: three phases"]
    points:
      - ["早期失效：失效率下降，靠磨合和验收", "Infant mortality: falling rate; run-in and acceptance"]
      - ["偶然失效：失效率不变，保养帮不上", "Random failures: constant rate; service doesn't help"]
      - ["磨损失效：失效率上升，保养对付这一段", "Wear-out: rising rate; this is what service fights"]
    visual: {fig: fig06_bathtub}
    notes:
      - "先说失效率：设备已经用了 t 小时还没坏，接下来每小时坏掉的概率。大量统计表明它分三段，像个浴盆。新设备早期失效多，失效率往下走，对付它靠磨合和验收，拆得越勤越容易出问题。中间一段失效率大致不变，坏不坏看外因，保养帮不上。最后是磨损期，轴承、导轨、密封越用越磨，失效率往上走。预防性保养对付的正是这一段。"
      - "First, the failure rate: given that a machine has run t hours without failing, the chance per hour that it fails next. Statistics show three phases, like a bathtub. New machines suffer infant mortality and the rate falls; the cure is run-in and acceptance, and frequent dismantling makes it worse. In the middle the rate is roughly constant and failures come from outside; service doesn't help. Then comes wear-out: bearings, guides and seals wear and the rate rises. That's the phase preventive maintenance fights."

  - layout: split
    title: ["威布尔分布：β 管形状，η 管尺度", "Weibull: β sets the shape, η the scale"]
    points:
      - ["F(t) = 1 − exp[−(t/η)^β]", "F(t) = 1 − exp[−(t/η)^β]"]
      - ["β < 1 下降，= 1 不变，> 1 上升", "β < 1 falling, = 1 constant, > 1 rising"]
      - ["t = η 时 F = 63.2%；MTTF = ηΓ(1+1/β)", "F = 63.2% at t = η; MTTF = ηΓ(1+1/β)"]
    visual: {video: curves}
    notes:
      - "描述这三段，工程上最常用的是威布尔分布。F(t) 是运行到 t 之前坏掉的概率，对它求导再除以可靠度就是失效率。画面上 β 从 0.7 一路调到 4，看红色的失效率：β 小于 1 往下走，等于 1 是平的，大于 1 往上走。机械磨损一般 β 在 2 到 4。η 叫特征寿命，不管 β 多少，到 η 时累计故障概率都是 63.2%。"
      - "To describe these phases engineers mostly use the Weibull distribution. F of t is the chance of failing before t; differentiate and divide by the reliability and you get the failure rate. On screen beta goes from 0.7 up to 4; watch the red failure rate: below one it falls, at one it's flat, above one it rises. Mechanical wear is usually between two and four. Eta is the characteristic life: whatever beta is, the failure probability at eta is 63.2 percent."

  - layout: bignum
    title: ["GRD-01：β = 3，η = 900 h，越用越容易坏", "GRD-01: β = 3, η = 900 h, likelier to fail with age"]
    nums:
      - {n: "{{ch06.F500:.1f}}%", n_en: "F(500)", label: ["到保养周期已坏过的概率", "Failure probability at the interval"]}
      - {n: "{{ch06.F620:.1f}}%", n_en: "F(620)", label: ["现在", "Now"]}
      - {n: "×{{ch06.h_ratio:.1f}}", n_en: "h(620) / h(300)", label: ["失效率：300 h → 620 h", "Failure rate: 300 h → 620 h"]}
    foot: ["MTTF = 900 × Γ(4/3) = {{ch06.mttf:.0f}} h；F(800) = {{ch06.F800:.1f}}%，已经过半", "MTTF = 900 × Γ(4/3) = {{ch06.mttf:.0f}} h; F(800) = {{ch06.F800:.1f}}%, past half"]
    notes:
      - "磨床 β 等于 3、η 等于 900 小时，这是数字工厂里它老化用的参数。到保养周期 500 小时，累计故障概率 {{ch06.F500:.1f}}%；现在 620 小时，{{ch06.F620:.1f}}%；失效率从 300 小时到 620 小时涨了四倍多。平均寿命 {{ch06.mttf:.0f}} 小时，800 小时累计故障概率就过半了。"
      - "The grinder has beta three and eta 900 hours, the parameters the digital factory uses to age it. At the 500-hour interval the failure probability is {{ch06.F500:.1f}} percent; now, at 620 hours, it's {{ch06.F620:.1f}}; and the failure rate has more than quadrupled between 300 and 620 hours. Mean life is {{ch06.mttf:.0f}} hours, and by 800 hours the probability is past half."

  - layout: section
    num: "02"
    title: ["算概率，算钱", "Probability, then money"]

  - layout: split
    title: ["要的是条件概率", "What we need is a conditional probability"]
    points:
      - ["到现在没坏是已知的", "We already know it hasn't failed"]
      - ["要的是：再跑 H 小时内坏掉的概率", "We need: the chance of failing within H more hours"]
      - ["保养把时钟拨回零", "A service puts the clock back to zero"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><text x="450" y="120" font-size="44" fill="#f3f6fa" text-anchor="middle" font-family="'DejaVu Serif',serif" font-style="italic">P(t, H) = 1 − R(t+H) / R(t)</text><text x="450" y="210" font-size="34" fill="#f2b705" text-anchor="middle" font-family="'DejaVu Serif',serif" font-style="italic">= 1 − exp{−[((t+H)/η)^β − (t/η)^β]}</text><path d="M100 270 L800 270" stroke="#22324d" stroke-width="2"/><text x="120" y="340" font-size="32" fill="#f3f6fa">GRD-01：t = 620 h，H = 80 h</text><text x="120" y="375" font-size="22" fill="#8fa3ba" class="en">GRD-01: t = 620 h, H = 80 h</text><text x="120" y="440" font-size="30" fill="#d3deea" font-family="'DejaVu Serif',serif">(700/900)³ − (620/900)³ = 0.1436</text><text x="120" y="530" font-size="64" font-weight="800" fill="#5ee0d2" font-family="'DejaVu Sans',sans-serif">P = {{ch06.p:.1f}}%</text><text x="470" y="530" font-size="30" fill="#8fa3ba">保养后 {{ch06.p_after:.2f}}%</text><text x="470" y="565" font-size="22" fill="#8fa3ba" class="en">after service {{ch06.p_after:.2f}}%</text></svg>
    notes:
      - "做决定要的不是 F(620)，到现在没坏已经知道了。要的是：已经跑了 t 小时没坏，再跑 H 小时内坏掉的概率，这是条件概率，1 减 R(t+H) 比 R(t)。代入磨床：700 比 900 的立方减 620 比 900 的立方，等于 0.1436，P 等于 {{ch06.p:.1f}}%。如果现在保养，时钟拨回零，未来 80 小时只有 {{ch06.p_after:.2f}}%，小了约 {{ch06.ratio:.0f}} 倍。"
      - "A decision doesn't need F of 620; we know it hasn't failed. We need the chance that a machine which has run t hours fails within H more. That's a conditional probability: one minus R of t plus H over R of t. For the grinder: 700 over 900 cubed minus 620 over 900 cubed is 0.1436, so P is {{ch06.p:.1f}} percent. Service it now and the clock goes back to zero: {{ch06.p_after:.2f}} percent for the next 80 hours, about {{ch06.ratio:.0f}} times smaller."

  - layout: split
    title: ["窗口往后挪，概率越来越大", "Slide the window later and the risk grows"]
    points:
      - ["t = 300 h：{{ch06.q_p300:.1f}}%", "t = 300 h: {{ch06.q_p300:.1f}}%"]
      - ["t = 620 h：{{ch06.p:.1f}}%", "t = 620 h: {{ch06.p:.1f}}%"]
      - ["t = 800 h：{{ch06.ex_p800:.1f}}%", "t = 800 h: {{ch06.ex_p800:.1f}}%"]
    visual: {video: window}
    notes:
      - "画面上是虚拟实验 6-1，橙色窗口是未来 80 小时，t 从 100 小时一路往后挪。窗口宽度没变，曲线却越来越陡，窗口里的概率越来越大：300 小时时 {{ch06.q_p300:.1f}}%，620 小时 {{ch06.p:.1f}}%，800 小时 {{ch06.ex_p800:.1f}}%。这就是 β 大于 1 的意思：拖得越久，下一段越危险。"
      - "This is Virtual lab 6-1. The orange band is the next 80 hours, and t slides from 100 hours onward. The band keeps its width, but the curve gets steeper and the probability inside grows: {{ch06.q_p300:.1f}} percent at 300 hours, {{ch06.p:.1f}} at 620, {{ch06.ex_p800:.1f}} at 800. That's what beta above one means: the longer you wait, the riskier the next stretch."

  - layout: points
    title: ["β = 1：保养没有用", "β = 1: service is useless"]
    points:
      - ["t 消掉了：P = 1 − e^(−H/η)", "t cancels out: P = 1 − e^(−H/η)"]
      - ["用了 620 h 和刚保养完：都是 {{ch06.p_exp_0:.1f}}%", "Run 620 h or just serviced: both {{ch06.p_exp_0:.1f}}%"]
      - ["偶然失效靠防护、监测、备机", "Random failures need protection, monitoring, standby"]
    foot: ["无记忆性：芯片几乎不磨损，没人定期更换手机芯片", "Memorylessness: chips hardly wear, and nobody replaces a phone's chip on schedule"]
    notes:
      - "有个特例要记住。β 等于 1 时，指数里的 t 消掉了，P 只和 H 有关。用了 620 小时的设备和刚保养完的，未来 80 小时坏掉的概率一模一样，取 η 等于 804 都是 {{ch06.p_exp_0:.1f}}%。这叫无记忆性。所以偶然失效不能靠定期保养，要靠防护、状态监测或者备机。"
      - "One special case to remember. When beta is one, t cancels in the exponent and P depends only on H. A machine that has run 620 hours and one just serviced have exactly the same chance of failing in the next 80 hours: {{ch06.p_exp_0:.1f}} percent each with eta of 804. That's memorylessness. Random failures can't be fought with scheduled service; you need protection, condition monitoring or a standby."

  - layout: bignum
    title: ["预期损失 = 概率 × 一次的损失", "Expected loss = probability × loss per failure"]
    nums:
      - {n: "${{ch06.Cf:,.0f}}", n_en: "C_f", label: ["一次故障：修理 $1,200 + 停 8 h × $200", "One failure: $1,200 + 8 h × $200"]}
      - {n: "{{ch06.p:.1f}}%", n_en: "P(620, 80)", label: ["未来 80 h 坏掉的概率", "Chance of failing in 80 h"]}
      - {n: "${{ch06.EL:.0f}}", n_en: "P × C_f", label: ["不保养的预期损失", "Expected loss without service"]}
    foot: ["期望值不是会花的钱：{{ch06.p_ok:.1f}}% 的时候什么也不发生，少数时候一下赔 $2,800", "An expectation, not money spent: {{ch06.p_ok:.1f}}% of the time nothing happens; sometimes you lose $2,800 at once"]
    notes:
      - "把概率变成钱。磨床坏一次，修理 1200，停 8 小时，它是瓶颈，每小时少挣 200，合计 2800 美元。不保养的预期损失就是 {{ch06.p:.1f}}% 乘 2800，约 {{ch06.EL:.0f}} 美元。注意这是期望值，不是一定会花的钱：大多数时候什么也不发生，少数时候一下赔 2800。一次故障如果会让关键客户违约，就要把违约损失也算进去。"
      - "Now turn probability into money. One failure of the grinder: a 1,200 repair plus 8 hours stopped at 200 an hour on the bottleneck, 2,800 dollars in all. The expected loss without service is {{ch06.p:.1f}} percent of 2,800, about {{ch06.EL:.0f}} dollars. Mind you, that's an expectation, not money you'll certainly spend: most of the time nothing happens, sometimes you lose 2,800 at once. If one failure would make you miss a key customer's delivery, add that penalty too."

  - layout: tiles
    title: ["厂情中枢的三个方案", "The hub's three options"]
    tiles:
      - {k: "A", name: ["不做（对照）", "Do nothing"], use: ["预期 ${{ch06.opt_none:.0f}}；坏了停 8 h，急单可能晚交", "${{ch06.opt_none:.0f}} expected; a failure stops it 8 h and may delay the rush order"]}
      - {k: "B", name: ["现在保养", "Service now"], use: ["$215 + 瓶颈停 3 h 少挣 $600 ≈ ${{ch06.opt_now:.0f}}", "$215 + $600 lost on the bottleneck ≈ ${{ch06.opt_now:.0f}}"]}
      - {k: "C", hot: true, name: ["下班后保养", "After the shift"], use: ["$215 + 先跑 4 h 的风险 ≈ ${{ch06.opt_later:.0f}}，最划算", "$215 + 4 h of risk ≈ ${{ch06.opt_later:.0f}}, cheapest"]}
    notes:
      - "厂情中枢给三个方案。A 不做，预期 {{ch06.opt_none:.0f}} 美元，一旦坏了停 8 小时，急单可能晚交。B 现在保养，215 再加瓶颈停 3 小时少挣 600，约 {{ch06.opt_now:.0f}}。C 下班后保养，先再跑 4 小时，这段时间坏掉的概率只有 {{ch06.p_delay:.2f}}%，合计约 {{ch06.opt_later:.0f}}。C 最划算：风险几乎降到零，又不占瓶颈的生产时间。车间主任和设备员各对了一半。"
      - "The factory hub offers three options. A, do nothing: {{ch06.opt_none:.0f}} dollars expected, and a failure stops it for 8 hours and may delay the rush order. B, service now: 215 plus 600 of margin lost while the bottleneck stops for 3 hours, about {{ch06.opt_now:.0f}}. C, service after the shift: it runs 4 more hours with only a {{ch06.p_delay:.2f}} percent chance of failing, about {{ch06.opt_later:.0f}} in all. C is cheapest: risk nearly zero, and no production time lost on the bottleneck. The supervisor and the planner were each half right."

  - layout: lab
    title: ["虚拟实验 6-1：威布尔可靠性", "Lab 6-1: Weibull reliability"]
    shot: {page: weibull}
    tasks:
      - ["选 GRD-01，核对 P 和预期损失", "Choose GRD-01; check P and the expected loss"]
      - ["拖 t、点“现在保养”，P 降多少倍", "Drag t, press 'Service now': by how much does P drop?"]
      - ["β = 1 对照；周期 300 / 800 h 各播一次", "β = 1 check; play with 300 h and 800 h intervals"]
    notes:
      - "现在大家自己做虚拟实验 6-1。先点 GRD-01，读出 t 等于 620、H 等于 80 时的概率和预期损失，跟刚才的手算核对。再把 t 从 0 拖到 1600，看概率怎么变；点现在保养，概率降到多少，算算降了多少倍。然后点 β 等于 1 对照，再拖 t，概率还变不变？最后播放，数一数保养了几次、坏了几次，把周期改成 300、800 小时再各播一次，比较。"
      - "Now try Virtual lab 6-1 yourselves. Press GRD-01 and read the probability and expected loss at t of 620 and H of 80; check them against our hand calculation. Then drag t from 0 to 1600 and watch the probability; press Service now and work out how many times smaller it gets. Then press the beta-equals-one check and drag t again: does the probability still change? Finally press Play, count services and failures, and repeat with intervals of 300 and 800 hours."

  - layout: section
    num: "03"
    title: ["保养周期怎样定", "Choosing the interval"]

  - layout: split
    title: ["按龄保养：长期每小时花多少", "Age-based maintenance: long-run cost per hour"]
    points:
      - ["到 T 小时保养；之前坏了就修好重新计时", "Service at T; if it fails first, repair and restart"]
      - ["分子：一个周期的期望花费", "Numerator: expected cost of a cycle"]
      - ["分母：一个周期的平均长度", "Denominator: mean length of a cycle"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><text x="450" y="150" font-size="38" fill="#f3f6fa" text-anchor="middle" font-family="'DejaVu Serif',serif" font-style="italic">C(T) = [Cₚ·R(T) + C_f·F(T)] / ∫₀ᵀ R dt</text><path d="M100 230 L800 230" stroke="#22324d" stroke-width="2"/><text x="120" y="310" font-size="32" fill="#f2b705">太短：保养费占大头</text><text x="120" y="345" font-size="22" fill="#8fa3ba" class="en">too short: service costs dominate</text><text x="120" y="420" font-size="32" fill="#ff7a45">太长：故障损失占大头</text><text x="120" y="455" font-size="22" fill="#8fa3ba" class="en">too long: failures dominate</text><text x="120" y="540" font-size="32" fill="#5ee0d2">T → ∞：坏了再修 C_f / MTTF = ${{ch06.r_run:.2f}}/h</text><text x="120" y="575" font-size="22" fill="#8fa3ba" class="en">T → ∞: run to failure, C_f / MTTF = ${{ch06.r_run:.2f}}/h</text></svg>
    notes:
      - "再往前一步：规矩怎么定，周期取多少？常用的策略叫按龄保养：跑到 T 小时就保养，之前坏了就修好重新计时。一个周期里，以概率 R(T) 撑到 T、花保养费，以概率 F(T) 中途坏掉、花故障损失，这是分子；周期的平均长度是 R 从 0 到 T 的积分，这是分母。两者一除，就是长期每运行小时的平均花费。T 趋于无穷就是坏了再修，磨床每小时 {{ch06.r_run:.2f}} 美元。"
      - "One step further: what should the rule be? A common policy is age-based maintenance: service at T hours, and if it fails first, repair it and restart the clock. In a cycle, with probability R of T it reaches T and you pay for a service; with probability F of T it fails and you pay for a failure. That's the numerator. The mean cycle length, the integral of R from zero to T, is the denominator. Divide and you get the long-run cost per operating hour. As T goes to infinity it's run to failure: {{ch06.r_run:.2f}} dollars an hour for the grinder."

  - layout: split
    title: ["最优周期取决于保养有多贵", "The optimum depends on how dear a service is"]
    points:
