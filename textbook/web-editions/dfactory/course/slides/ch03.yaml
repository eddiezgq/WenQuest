    notes:
      - "回到开头。磨床停 24 小时，真正丢掉的生产时间是 {{ch03.L:.0f}} 小时。机器人订单有 {{ch03.slack_r:.1f}} 小时余量，还差 {{ch03.short_r:.1f}} 小时：不处理晚 1 天，罚 {{ch03.none_pen:.0f}} 美元；峰顶和海港都按时。车间主任估的晚三天、{{ch03.naive_pen:.0f}} 美元是实际的 3 倍，他想选的维修加急花 {{ch03.exp_fee:.0f}} 也保不住交期。建议：修好后周二加班 2 小时、周三再加 12 分钟，多花 {{ch03.overtime_total:.2f}} 美元，周四按时交货。备选外协 {{ch03.n_min}} 台。加班要厂长批准，批准后班次表才改。"
      - "Back to the start. The grinder is down 24 hours, but only {{ch03.L:.0f}} production hours are really lost. The robot order had {{ch03.slack_r:.1f}} hours of slack and is {{ch03.short_r:.1f}} hours short: doing nothing makes it a day late with a {{ch03.none_pen:.0f}}-dollar penalty, while Summit and Harbor stay on time. The supervisor's three days and {{ch03.naive_pen:.0f}} dollars are three times the real figure, and the expediting he wanted costs {{ch03.exp_fee:.0f}} without saving the date. Recommendation: after the repair, 2 hours of overtime on Tuesday and 12 minutes more on Wednesday, {{ch03.overtime_total:.2f}} dollars, and the order ships on time on Thursday. The fallback is outsourcing {{ch03.n_min}} units. Overtime needs the plant manager's approval before the shift calendar changes."

  - layout: summary
    title: ["本讲小结", "Summary"]
    points:
      - ["规则发现异常；因果链往上找原因、往下算影响", "Rules spot exceptions; chains trace up to causes and down to impact"]
      - ["丢掉的生产时间 = 停机 ∩ 班次；超过余量才会晚", "Lost time = downtime ∩ shifts; late only beyond the slack"]
      - ["推演比方案：先交期、再钱，风险摆出来", "Simulate options: delivery first, then money, with risks laid out"]
    after: ["作业 3 · 测验 3 · 数字工厂实验 15 报告 —— 在问渠学习平台完成", "Assignment 3 · Quiz 3 · Lab 15 report — on WenQuest"]
    notes:
      - "这一讲记住三件事。第一，规则从数据里发现异常，因果链往上找原因、往下算影响，每条连线都要有依据。第二，影响面要算：真正丢掉的生产时间是停机和班次的重叠，订单超过余量才会晚，被牵连不等于会晚。第三，方案要推演：加班、加急、外协各快进一遍，先看交期、再比钱，风险也摆出来；凭经验估代价常常错。下课后做作业 3、测验 3，完成数字工厂实验 15 的报告。"
      - "Three things to remember. One: rules find exceptions in the data, and a causal chain traces up to the cause and down to the impact, with evidence for every link. Two: impact must be calculated; the production time really lost is the overlap of downtime and shifts, an order is late only beyond its slack, and affected is not the same as late. Three: simulate the options; fast-forward overtime, expediting and outsourcing, rank by delivery first and money second, and lay out the risks. Estimates from experience are often wrong. After class: Assignment 3, Quiz 3 and the Lab 15 report."
