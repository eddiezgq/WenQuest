  - layout: split
    title: ["机器人联系：里程碑付款", "Robot link: milestone payments"]
    points:
      - ["签约 {{ch10.rb_pre_pct:.0f}}%、验收 {{ch10.rb_acc_pct:.0f}}%、质保金 {{ch10.rb_ret_pct:.0f}}%", "{{ch10.rb_pre_pct:.0f}}% on signing, {{ch10.rb_acc_pct:.0f}}% on acceptance, {{ch10.rb_ret_pct:.0f}}% retention"]
      - ["验收拖两个月，${{ch10.rb_acc:,.0f}} 晚两个月", "Acceptance two months late: ${{ch10.rb_acc:,.0f}} two months late"]
      - ["谈预付款、分批开票，让钱早回来", "Negotiate a down payment, invoice in batches"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><text x="60" y="70" font-size="30" fill="#d3deea">一个机器人工作站（示意）</text><text x="60" y="102" font-size="22" fill="#8fa3ba" class="en">one robot cell (illustrative): ${{ch10.rb_total:,.0f}}</text><rect x="60" y="130" width="234" height="80" rx="10" fill="#2ec4b6"/><rect x="300" y="130" width="468" height="80" rx="10" fill="#f2b705"/><rect x="774" y="130" width="76" height="80" rx="10" fill="#a78bfa"/><text x="177" y="182" font-size="34" font-weight="800" fill="#08101d" text-anchor="middle">{{ch10.rb_pre_pct:.0f}}%</text><text x="534" y="182" font-size="34" font-weight="800" fill="#08101d" text-anchor="middle">{{ch10.rb_acc_pct:.0f}}%</text><text x="812" y="180" font-size="24" font-weight="800" fill="#08101d" text-anchor="middle">{{ch10.rb_ret_pct:.0f}}%</text><text x="177" y="245" font-size="24" fill="#d3deea" text-anchor="middle">签约</text><text x="534" y="245" font-size="24" fill="#d3deea" text-anchor="middle">现场验收</text><text x="812" y="245" font-size="24" fill="#d3deea" text-anchor="middle">一年后</text><text x="177" y="273" font-size="20" fill="#8fa3ba" text-anchor="middle" class="en">signing</text><text x="534" y="273" font-size="20" fill="#8fa3ba" text-anchor="middle" class="en">site acceptance</text><text x="812" y="273" font-size="20" fill="#8fa3ba" text-anchor="middle" class="en">1 yr later</text><g font-size="28" fill="#f3f6fa" text-anchor="middle"><rect x="40" y="345" width="170" height="100" rx="14" fill="#22324d"/><text x="125" y="392">终端工厂</text><rect x="260" y="345" width="170" height="100" rx="14" fill="#22324d"/><text x="345" y="392">集成商</text><rect x="480" y="345" width="170" height="100" rx="14" fill="#22324d"/><text x="565" y="392">机器人厂</text><rect x="700" y="345" width="170" height="100" rx="14" fill="#4b5f7d" stroke="#f2b705" stroke-width="4"/><text x="785" y="392">减速器厂</text></g><g font-size="20" fill="#8fa3ba" text-anchor="middle" class="en"><text x="125" y="426">end user</text><text x="345" y="426">integrator</text><text x="565" y="426">robot plant</text><text x="785" y="426">our plant</text></g><g stroke="#ff7a45" stroke-width="5" fill="none"><path d="M212 395 L252 395"/><path d="M432 395 L472 395"/><path d="M652 395 L692 395"/></g><g fill="#ff7a45"><path d="M256 395 L240 385 L240 405 Z"/><path d="M476 395 L460 385 L460 405 Z"/><path d="M696 395 L680 385 L680 405 Z"/></g><text x="450" y="540" font-size="30" fill="#ff7a45" text-anchor="middle">晚付一节一节往上游传</text><text x="450" y="575" font-size="22" fill="#8fa3ba" text-anchor="middle" class="en">late payment travels up the chain link by link</text></svg>
    notes:
      - "机器人厂为什么也拖款？它把协作机器人卖给系统集成商，集成商做成工作站卖给终端工厂，常按里程碑付款。设一个工作站 {{ch10.rb_total:,.0f}} 美元，这是示意值：签约付 {{ch10.rb_pre_pct:.0f}}%，现场验收后付 {{ch10.rb_acc_pct:.0f}}%，质保金 {{ch10.rb_ret_pct:.0f}}% 一年后才付。终端工厂验收拖两个月，{{ch10.rb_acc:,.0f}} 就晚两个月；集成商拖机器人厂，机器人厂拖我们。所以给机器人厂定信用额度，要看它下游怎么回款。我们也可以谈预付款，或者分批交货分批开票。"
      - "Why does the robot plant pay late too? It sells collaborative robots to integrators, who build cells for end users, usually paid by milestones. Take a {{ch10.rb_total:,.0f}}-dollar cell, an illustrative figure: {{ch10.rb_pre_pct:.0f}} percent on signing, {{ch10.rb_acc_pct:.0f}} percent after site acceptance, and a {{ch10.rb_ret_pct:.0f}} percent retention a year later. If acceptance slips two months, {{ch10.rb_acc:,.0f}} arrives two months late; the integrator pays the robot plant late, and the robot plant pays us late. So the robot plant's credit limit should reflect how its own customers pay. We can also negotiate a down payment, or deliver and invoice in batches."

  - layout: points
    title: ["生活例子：开小店卖货给熟客赊账", "Everyday example: a shop selling on credit"]
    points:
      - ["每月卖 ${{ch10.shop_s:,.0f}}，账面赚 ${{ch10.shop_profit:,.0f}}", "Sells ${{ch10.shop_s:,.0f}} a month, makes ${{ch10.shop_profit:,.0f}} on paper"]
      - ["一半赊账、两个月后才还，进货要现付", "Half on credit, repaid two months later; stock paid in cash"]
      - ["第 {{ch10.shop_low_m}} 个月缺 ${{ch10.shop_low_abs:,.0f}}", "Month {{ch10.shop_low_m}}: ${{ch10.shop_low_abs:,.0f}} short"]
    foot: ["账上赚钱，手里没钱：赚钱和有钱是两回事", "Profitable on paper, broke in the till: making money is not having money"]
    notes:
      - "生活里的例子：开小店卖货给熟客赊账。每月卖 {{ch10.shop_s:,.0f}}，毛利率 {{ch10.shop_m:.0f}}%，房租工资 {{ch10.shop_fix:,.0f}}，账面每月赚 {{ch10.shop_profit:,.0f}}。可一半赊给熟客，两个月后才还，进货却要现付，开张时手里只有 {{ch10.shop_c0:,.0f}}。第 1 个月现金就是负的，第 {{ch10.shop_low_m}} 个月缺 {{ch10.shop_low_abs:,.0f}}，要借钱或者断货。跟今天的工厂是同一道题。"
      - "An everyday example: a shop that lets regulars buy on credit. It sells {{ch10.shop_s:,.0f}} a month at a {{ch10.shop_m:.0f}} percent margin with {{ch10.shop_fix:,.0f}} of rent and wages: {{ch10.shop_profit:,.0f}} a month on paper. But half goes on credit, repaid two months later, while stock is paid in cash, and the shop opened with only {{ch10.shop_c0:,.0f}}. Cash is negative in month 1 and {{ch10.shop_low_abs:,.0f}} short in month {{ch10.shop_low_m}}: borrow or run out of stock. The same problem as today's plant."

  - layout: answer
    tag: ["回到厂里的事", "Back to the problem"]
    title: ["这单赚了钱；现在发催款函", "The order made money; send the dunning letter now"]
    rows:
      - [["毛利（毛利率）", "Margin (percent)"], "${{ch10.margin:,.0f}} ({{ch10.m_pct:.1f}}%)"]
      - [["应收周转天数 DSO", "Days sales outstanding"], "{{ch10.dso:.1f}} d"]
      - [["不处理：第 {{ch10.none_neg}} 周现金", "Do nothing: cash in week {{ch10.none_neg}}"], "−${{ch10.none_low_abs:,.0f}}"]
      - [["催款：8 周内最低现金", "Dunning: lowest cash in 8 weeks"], "${{ch10.dun_low:,.0f}}"]
    side: {big: "{{ch10.dso_after:.1f}}", text: ["收回以后 DSO（天）", "DSO once paid (days)"]}
    foot: ["应收逾期建议催款，信用超限建议冻结：先催款，下一批开票前没付再冻结", "Overdue rule: dun; credit-limit rule: freeze. Dun first, freeze if unpaid before the next invoice"]
    notes:
      - "回到开头。这单赚了 {{ch10.margin:,.0f}}，毛利率 {{ch10.m_pct:.1f}}%，刚守住目标；比标准少的主要是加班、磨床重新调整和废品。DSO {{ch10.dso:.1f}} 天，远超目标。不处理，第 {{ch10.none_neg}} 周现金变成负 {{ch10.none_low_abs:,.0f}}。建议现在发催款函：约 {{ch10.dun}} 天收回，8 周内最低还有 {{ch10.dun_low:,.0f}}，DSO 降到 {{ch10.dso_after:.1f}} 天。逾期才 {{ch10.od:.0f}} 天，应收逾期建议催款；占用 {{ch10.used:.0f}}%，信用超限建议冻结。两者权衡，先催款；如果下一批开票前还没付，或逾期超过 30 天，再请厂长冻结。下次接单谈预付款或分批开票，把加班和换供应商的钱算进报价。"
      - "Back to the start. The order made {{ch10.margin:,.0f}}, {{ch10.m_pct:.1f}} percent, just on target; it fell short of standard mainly through overtime, grinder re-setting and scrap. DSO is {{ch10.dso:.1f}} days, far above target. Doing nothing, cash reaches minus {{ch10.none_low_abs:,.0f}} in week {{ch10.none_neg}}. Send the dunning letter now: the money returns in about {{ch10.dun}} days, the lowest cash in 8 weeks is {{ch10.dun_low:,.0f}}, and DSO falls to {{ch10.dso_after:.1f}}. Only {{ch10.od:.0f}} days overdue, so the overdue rule says dun; at {{ch10.used:.0f}} percent exposure the credit-limit rule says freeze. Weighing them, dun first; if it's still unpaid when the next batch is invoiced, or past 30 days, ask the plant manager to freeze. Next time, negotiate a down payment or batch invoicing, and price overtime and dearer suppliers into the quote."

