    after: ["作业 10 · 测验 10 · 数字工厂实验 22 报告 —— 在问渠学习平台完成", "Assignment 10 · Quiz 10 · Lab 22 report — on WenQuest"]
    notes:
      - "这一讲记住三件事。第一，毛利分解：收入减去料、工、电和计划外的花费，看清钱花在哪里，报价找销售，料找采购，工时找工艺和车间。第二，应收看账龄和 DSO，现金一周一周预测，最低的一周最要紧。第三，应收逾期按天数，30 天以内先催款；信用超限建议冻结，两条不一致时由人权衡；赚钱和有钱是两回事。下课后做作业 10、测验 10，完成数字工厂实验 22 的报告。"
      - "Three things to remember. One: break down the margin, revenue minus material, labour, energy and unplanned costs, to see where the money went; price goes to sales, material to purchasing, hours to process engineering. Two: read receivables by ageing and DSO, forecast cash week by week, and watch the lowest week. Three: an overdue invoice is judged by days, dunning first within 30; an over-limit customer gets a freeze, and when the two disagree a person weighs them; making money is not having money. After class: Assignment 10, Quiz 10 and the Lab 22 report."
