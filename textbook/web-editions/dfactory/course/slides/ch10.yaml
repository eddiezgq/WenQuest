    notes:
      - "做虚拟实验 10-2。先点不处理，读出最低的一周和金额，哪周跌破安全线、哪周跌破零，跟表 10-4 核对。再点催款和信用冻结，现金曲线一样，看下面的说明差在哪里。然后把付款日从第 3 天拖到第 60 天，每隔十天记一次最低现金，画一条关系线。最后把已逾期拖过 30 天，看账龄换档，中枢的建议变成什么。"
      - "Now Virtual lab 10-2. Press do nothing and read the lowest week and amount and the weeks cash falls below the safety line and below zero; check them against Table 10-4. Then press dun and freeze credit: the cash curves match, so read the note below to see what differs. Then drag the payment day from 3 to 60, recording the lowest cash every ten days, and sketch the relationship. Finally drag the days overdue past 30 and watch the ageing band and the hub's recommendation change."

