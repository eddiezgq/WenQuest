    notes:
      - "课后到数字工厂“经营与财务”页亲手做实验 22。先在经营目标的指标树里找没达标的指标；再打开老师指定的订单，按分解表手算毛利率。老师注入海港起重一笔 13200 美元的发票逾期 15 天、不催不付；你在指挥台比较催款、冻结、不处理，选一个写理由，提交之前看不到中枢的推荐。然后发起催款，老师批准，几分钟后客户付款。最后算 DSO，找出现金最紧的一周。教学模式下一个账期日只有 2 分钟，一节课就能看到逾期和付款。"
