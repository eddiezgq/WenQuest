<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Automated test bench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: left = version/level/case selection, results table, trend charts; right rail = changelog, calculator, tasks */
:root{
  --bg:#f3f5f4; --sheet:#ffffff; --ink:#1b2430; --muted:#5a6570; --rule:#d7dde1; --soft:#eef1f2;
  --nt:#2a5fb8; --bt:#d9622b; --accent:#0f6e74; --ok:#1e8449; --bad:#c0392b; --warn:#b7791f; --pur:#7444b4;
  --f-display:"Noto Serif SC","Songti SC",serif; --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11161b;--sheet:#182029;--ink:#e2e7ec;--muted:#9aa6b2;--rule:#2b3540;--soft:#1e2731;--nt:#7fa9f2;--bt:#f08c58;--accent:#4cc3c9;--ok:#5fd08a;--bad:#ff7b6b;--warn:#e8b04b;--pur:#b394e6}}
:root[data-theme="dark"]{--bg:#11161b;--sheet:#182029;--ink:#e2e7ec;--muted:#9aa6b2;--rule:#2b3540;--soft:#1e2731;--nt:#7fa9f2;--bt:#f08c58;--accent:#4cc3c9;--ok:#5fd08a;--bad:#ff7b6b;--warn:#e8b04b;--pur:#b394e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1360px;margin:0 auto;padding-inline:16px;padding-block:18px 36px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin-bottom:12px}
h1{font-family:var(--f-display);font-size:1.5rem;margin:0}
.sub{color:var(--muted);font-size:.9rem}
button,select{font:inherit;font-size:.86rem;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:6px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=number],input[type=text]{font:inherit;font-size:.86rem;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:6px;padding:4px 8px;width:5.5em;font-family:var(--f-mono)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,350px);gap:14px;align-items:start}
@media (max-width:1000px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px;min-width:0}
.panel h3{margin:0 0 8px;font-size:.78rem;letter-spacing:.12em;color:var(--muted);font-weight:600}
canvas{display:block;width:100%;height:auto;border-radius:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.note{font-size:.8rem;color:var(--muted);margin:8px 0 0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.lbl{font-size:.8rem;color:var(--muted);margin:10px 0 4px}
.cases{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;font-size:.84rem;max-height:none}
.cases label{display:grid;grid-template-columns:1.4em 7.6em minmax(0,1fr) 6.6em 4.2em;gap:6px;align-items:baseline;padding:3px 4px;border-bottom:1px solid var(--rule);cursor:pointer}
.cases label:hover{background:var(--soft)}
.cases .id,.mono{font-family:var(--f-mono);font-size:.78rem}
.cases .req{font-family:var(--f-mono);font-size:.74rem;color:var(--pur)}
.cases .min{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:640px){.cases label{grid-template-columns:1.4em minmax(0,1fr) 4em}.cases .id,.cases .req{display:none}}
.bar{height:12px;background:var(--soft);border-radius:6px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.bar.over i{background:var(--bad)}
.budget{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:4px}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th,td{border-bottom:1px solid var(--rule);padding:4px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;border-bottom:1.5px solid var(--ink)}
td.v,td.c{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.78rem}
td.r{font-weight:700;text-align:center}
td.r.ok{color:var(--ok)} td.r.bad{color:var(--bad)} td.r.run{color:var(--warn)}
td small{display:block;color:var(--muted);font-size:.72rem}
.sum{font-size:.86rem;margin-top:8px;font-weight:600}
.sum.ok{color:var(--ok)} .sum.bad{color:var(--bad)}
.chg{font-size:.82rem;margin:0;padding-left:1.1em}
.chg li{margin:2px 0}
.chg li.cur{font-weight:700}
.calc{display:grid;grid-template-columns:minmax(0,1fr) 6.2em;gap:4px 10px;align-items:center;font-size:.84rem}
.calc output{font-family:var(--f-mono);font-weight:700;text-align:right}
.calc hr{grid-column:1/-1;border:0;border-top:1px solid var(--rule);margin:6px 0}
.task{border-top:1px solid var(--rule);padding:8px 0 4px;font-size:.86rem}
.task .st{font-family:var(--f-mono);font-weight:600}
.task .st.ok{color:var(--ok)} .task .st.no{color:var(--muted)}
.task small{display:block;color:var(--muted);font-size:.78rem}
.task .row{margin-top:4px}
.msg{font-size:.82rem;margin-top:6px;min-height:1.3em}
</style>
<div class="wrap">
<header><h1 id="h1"></h1><span class="sub" id="hsub"></span></header>
<div class="grid">
  <div class="col">
    <section class="panel"><h3 id="t_sel"></h3>
      <div class="lbl" id="t_ver"></div><div class="seg" id="vers"></div>
      <div class="lbl" id="t_lay"></div><div class="seg" id="lays"></div>
      <div class="lbl" id="t_cases"></div><div class="cases" id="cases"></div>
      <div class="lbl" id="t_bud"></div><div class="bar" id="bbar"><i></i></div><div class="budget"><span id="btxt"></span><span id="blim"></span></div>
      <div class="row"><button class="pri" id="run" type="button"></button><button id="def" type="button"></button><button id="all" type="button"></button><button id="none" type="button"></button></div>
    </section>
    <section class="panel"><h3 id="t_res"></h3>
      <div class="bar" id="pbar"><i></i></div><div class="budget"><span id="ptxt"></span><span id="pver"></span></div>
      <div class="tblw"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
      <div class="sum" id="sum"></div>
    </section>
    <section class="panel"><h3 id="t_trend"></h3><canvas id="trend" width="1100" height="300" aria-label="trend"></canvas><p class="note" id="trendnote"></p></section>
    <p class="note" id="model"></p>
  </div>
  <div class="col">
    <section class="panel"><h3 id="t_chg"></h3><ul class="chg" id="chg"></ul></section>
    <section class="panel"><h3 id="t_calc"></h3>
      <div class="calc">
        <label for="cR" id="l_cR"></label><input id="cR" type="number" step="0.1" min="50" max="99.99" value="99">
        <label for="cC" id="l_cC"></label><input id="cC" type="number" step="1" min="50" max="99.9" value="90">
        <label for="cX" id="l_cX"></label><input id="cX" type="number" step="1" min="0" max="20" value="0">
        <span id="l_cN"></span><output id="cN"></output>
        <hr>
        <label for="dN" id="l_dN"></label><input id="dN" type="number" step="1" min="1" max="100000" value="1000">
        <label for="dX" id="l_dX"></label><input id="dX" type="number" step="1" min="0" max="1000" value="2">
        <span id="l_dR"></span><output id="dR"></output>
      </div>
      <p class="note" id="calcnote"></p>
    </section>
    <section class="panel"><h3 id="t_tasks"></h3><div id="tasks"></div><div class="msg" id="msg"></div></section>
  </div>
</div>
</div>

(()=>{

const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const S={
zh:{h1:'自动化测试台',hsub:'《缝纫机设计与制造》第 22 章 · 虚拟实验 22-1 · 选固件版本和测试层级，跑用例，看哪条需求失败；再算一算要测多少次才算数',
 t_sel:'① 选择固件版本、测试层级和用例',t_ver:'固件版本（WQ-SC/LS 平缝原型）',t_lay:'测试层级',t_cases:'用例（勾选要跑的；右边是这一层的单次耗时）',t_bud:'本层时间预算',
 run:'▶ 运行',running:'运行中…',def:'默认用例集',all:'全选',none:'全不选',
 t_res:'② 用例结果',th:['用例','需求','测量值','判据','结果'],t_trend:'③ 版本趋势（只画你跑过的结果）',

 t_chg:'版本记录',t_calc:'要测多少次（二项分布，单侧）',l_cR:'要验证的可靠度 R（%）',l_cC:'置信度 C（%）',l_cX:'允许的失败次数 x',l_cN:'需要的试验次数 n',
 l_dN:'已试验次数 n',l_dX:'其中失败 x 次',l_dR:'可靠度的置信下限（置信度用上面的 C）',calcnote:'零失效时 n = ln(1−C)/ln R；有失败时用 Clopper–Pearson 单侧下限（与正文 22.6 节相同）。',
 t_tasks:'任务',done:'✓ 完成',notdone:'○ 未完成',check:'核对',
 lay:{unit:'单元',sil:'软件在环 SIL',hil:'硬件在环 HIL',bench:'整机测试台'},

 total:(t,b)=>`已选 ${t} / 预算 ${b}`,over:'超出预算',min:'min',
 sumok:(v,l)=>`${v} · ${l}：全部通过`,sumbad:(v,l,n,r)=>`${v} · ${l}：${n} 个用例失败（${r}）`,

  {t:'在 v1.4.0 上，用每晚 240 min 的 HIL 预算选一组用例：必须保留故障注入，并且同时抓住两个回归（剪线和停针）。',d:'默认用例集 207 min，两个回归一个也抓不住。哪两个用例最“划算”？'},
  {t:'算出验证 R = 99.5%、C = 95% 需要的零失效试验次数；再算允许 1 次失败时需要多少次。',d:'用右上的计算器；填进两个框里点核对。'}],
 a1v:'版本',a1r:'需求',a2:['零失效 n','允许 1 次 n'],
 m1ok:'对：v1.4.0 的“快速剪线”在 4750 r/min 以上让剪线失败，违反 REQ-TRM-01。',m1no:'不对。提示：失败只在 HIL 和整机上、起始转速高时出现。',
 m3ok:'对：598 次零失效；允许 1 次失败要 947 次。',m3no:'不对，再用计算器算一算（R 填 99.5，C 填 95）。',
 m2ok:'好：这组用例在预算内抓住了两个回归。',
 crit:{trm:(n,x)=>`可靠度下限 ≥ 99.5%（C = 95%），${n} 次最多失败 ${x} 次`,pos1:'≤ 1.00°',posn:'最大 ≤ 1.00° 且 Cpk ≥ 1.33',possw:'扫描中最大 ≤ 1.00°',sol:'吸合、释放 ≤ 20°',bt:'最大 ≤ 0.30 mm',flt:'全部进 SAFE ≤ 50 ms',xy:'≤ 0.050 mm；针在布中位移 0',kn:'≤ 0.10 针距',thm:'温升 ≤ 40 K，无故障',fw:'全部断言通过'},
 vals:{fail:(x,n)=>`失败 ${x}/${n}`,rl:r=>`下限 ${r}%`,worst:'最差',max:'最大',mean:'均值',pull:'吸合',rel:'释放',faults:'种故障',longest:'最长',rise:'温升',asserts:'个断言'},
},
en:{h1:'Automated test bench',hsub:'Sewing Machine Design and Manufacturing, Chapter 22 · Virtual lab 22-1 · Pick a firmware version and a test level, run the cases, see which requirement fails; then work out how many tests are enough',
 t_sel:'① Choose firmware version, test level and cases',t_ver:'Firmware version (WQ-SC/LS lockstitch prototype)',t_lay:'Test level',t_cases:'Test cases (tick the ones to run; right: time for one run at this level)',t_bud:'Time budget for this level',
 run:'▶ Run',running:'Running…',def:'Default set',all:'All',none:'None',
 t_res:'② Results',th:['Case','Req.','Measured','Criterion','Result'],t_trend:'③ Trend across versions (only results you have run)',
 trendnote:'Left: trimming — failure rate at the worst speed point of each run (log scale, red line 0.5 %); right: stop error — maximum of each run (red line 1°). Filled dots: HIL / machine bench; open dots: SIL.',
 t_chg:'Change log',t_calc:'How many tests (binomial, one-sided)',l_cR:'Reliability to demonstrate R (%)',l_cC:'Confidence C (%)',l_cX:'Failures allowed x',l_cN:'Trials needed n',
 l_dN:'Trials run n',l_dX:'of which failed x',l_dR:'Lower confidence bound on R (at the C above)',calcnote:'With no failures n = ln(1−C)/ln R; with failures the Clopper–Pearson one-sided bound is used (as in Section 22.6).',
 t_tasks:'Tasks',done:'✓ Done',notdone:'○ Not done',check:'Check',
 lay:{unit:'Unit',sil:'Software-in-the-loop (SIL)',hil:'Hardware-in-the-loop (HIL)',bench:'Machine test bench'},
 bud:{unit:'1 min per commit',sil:'10 min per commit',hil:'240 min nightly',bench:'48 h weekly'},
 total:(t,b)=>`selected ${t} / budget ${b}`,over:'over budget',min:'min',
 sumok:(v,l)=>`${v} · ${l}: all passed`,sumbad:(v,l,n,r)=>`${v} · ${l}: ${n} case(s) failed (${r})`,
 progress:(i,n)=>`case ${i} of ${n}`,
 model:'Model (illustrative; the same as Sections 22.5–22.9 and figsrc/ch22_model.py): the trimmer solenoid is fired at 290° of the trimming stitch with a delay N(8, 0.667) ms; knife entry 290° + 6·n·t must lie in 300°–330°, n being the actual speed at firing. Servo deceleration capability 4400 rad/s²; above the base speed (4100 r/min × κ, κ ~ N(1, 5 %), varying with mains voltage) the motor is in its constant-power region; SIL uses an ideal motor (no constant-power region). v1.3.x decelerates at 60 % capability, finishing before 0° of the trimming stitch; v1.4.0 at 100 % with the end moved to 180°; v1.4.1 plans with 90 % of the torque–speed curve and checks the speed at 270°. Stopping uses the servo model of Chapter 13 (HIL inertia 6.3×10⁻⁴ kg·m², friction N(0.15, 0.015) N·m per stop); error = the larger of the overshoot past the target and the final error, plus 0.03° measurement noise. Random numbers are seeded by "version + case", so re-running a combination gives the same result.',

  {t:'Find the firmware version that introduced the trimming regression, and the requirement it fails.',d:'Run the "trim speed sweep" at the HIL level and compare versions one by one.'},
  {t:'On v1.4.0, pick an HIL case set within the 240 min nightly budget that keeps fault injection and catches both regressions (trimming and stopping).',d:'The default set takes 207 min and catches neither. Which two cases give the most for their time?'},
  {t:'Work out the number of zero-failure trials needed to demonstrate R = 99.5 % at C = 95 %; then the number needed if one failure is allowed.',d:'Use the calculator at the top right; type both numbers and press Check.'}],

 vals:{fail:(x,n)=>`fail ${x}/${n}`,rl:r=>`bound ${r} %`,worst:'worst',max:'max',mean:'mean',pull:'pull-in',rel:'release',faults:'faults',longest:'longest',rise:'rise',asserts:'assertions'},
}}[LANG];
const N=(zh,en)=>LANG==='en'?en:zh;

// ---------------- model (same as figsrc/ch22_model.py) ----------------
const PI=Math.PI,ACAP0=4400,NB0=4100,NB_SD=0.05,TAU=0.003,NT=300,CMD=290,W1=300,W2=330,T_MU=8e-3,T_SD=0.667e-3;
const VERS=['v1.3.0','v1.3.1','v1.3.2','v1.4.0','v1.4.1','v1.4.2'];
const FW={'v1.3.0':{plan:'v13',Kp:200,bt:[0.20,0.04]},'v1.3.1':{plan:'v13',Kp:200,bt:[0.12,0.03]},'v1.3.2':{plan:'v13',Kp:300,bt:[0.12,0.03]},
 'v1.4.0':{plan:'v140',Kp:300,bt:[0.12,0.03]},'v1.4.1':{plan:'v141',Kp:300,bt:[0.12,0.03]},'v1.4.2':{plan:'v141',Kp:220,bt:[0.12,0.03]}};
const CHG={'v1.3.0':N('基线：减速按伺服能力的 60%，剪线针前减到 300 r/min；位置增益 Kp = 200 s⁻¹','Baseline: deceleration at 60 % of servo capability, down to 300 r/min before the trimming stitch; position gain Kp = 200 s⁻¹'),
 'v1.3.1':N('加回针补偿（回针第一针单独调针距）','Backtack compensation added (first reverse stitch length adjusted)'),
 'v1.3.2':N('“停车更快”：Kp 200 → 300 s⁻¹，停稳时间缩短','"Faster stop": Kp 200 → 300 s⁻¹, shorter settling'),
 'v1.4.0':N('“快速剪线”：减速按 100% 能力规划，终点推迟到剪线针 180°，停车剪线省约 0.16 s','"Fast trim": deceleration planned at 100 % capability, end moved to 180° of the trimming stitch, about 0.16 s saved per trim'),
 'v1.4.1':N('修复剪线：按转矩–转速曲线的 90% 规划；270° 时转速 > 400 r/min 就推迟一针剪线','Trim fix: plan with 90 % of the torque–speed curve; if the speed at 270° exceeds 400 r/min, trim one stitch later'),
 'v1.4.2':N('Kp 改为 220 s⁻¹','Kp changed to 220 s⁻¹')};
function acap(n,nb){return ACAP0*Math.min(1,nb/Math.max(n,1));}
function aRef(plan,w){if(plan==='v13')return 0.6*ACAP0;if(plan==='v140')return ACAP0;return 0.9*acap(w*30/PI,0.9*NB0);}
function nAtCmd(n0,plan,nb,motor){const dt=2e-5,w0=n0*PI/30,wt=NT*PI/30,nbm=motor==='hil'?nb:1e9;const end=plan==='v13'?0:180;
  let w=w0,th=0;while(w>wt){th+=w*dt;w-=aRef(plan,w)*dt;}
  th=end*PI/180-th;w=w0;let wr=w0,def=false;
  while(th<CMD*PI/180){if(wr>wt)wr=Math.max(wt,wr-aRef(plan,wr)*dt);const a=acap(w*30/PI,nbm);const acc=Math.max(-a,Math.min(a,(wr-w)/TAU));w+=acc*dt;th+=w*dt;

function servoStop(Kp,J,Tf,wp,DT){const Kv=0.2,Ti=0.012,B=2e-4,TMAX=2.5,TAUI=0.5e-3,e0=45,D=PI/180;J*=1e-4;const wpos=wp*2*PI/60;

function lgam(x){const g=7,c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];

  return `<div class="task"><span class="st" id="st0"></span> ${T[0].t}<small>${T[0].d}</small><div class="row"><label>${S.a1v} <select id="a1v">${['—',...VERS].map(v=>`<option>${v}</option>`).join('')}</select></label><label>${S.a1r} <select id="a1r">${['—','REQ-POS-01','REQ-TRM-01','REQ-BT-01','REQ-SOL-01','REQ-SAFE-01','REQ-THM-01'].map(v=>`<option>${v}</option>`).join('')}</select></label><button type="button" id="a1b">${S.check}</button></div></div>
  <div class="task"><span class="st" id="st1"></span> ${T[1].t}<small>${T[1].d}</small></div>
  <div class="task"><span class="st" id="st2"></span> ${T[2].t}<small>${T[2].d}</small><div class="row"><label>${S.a2[0]} <input id="a3a" type="number"></label><label>${S.a2[1]} <input id="a3b" type="number"></label><button type="button" id="a3btn">${S.check}</button></div></div>`;}
function checkTasks(){[seen.a,seen.b,seen.c].forEach((d,i)=>{const e=$('st'+i);e.className='st '+(d?'ok':'no');e.textContent=d?S.done:S.notdone;});}
function wireTasks(){$('tasks').innerHTML=taskHTML();
  $('a1b').onclick=()=>{const ok=$('a1v').value==='v1.4.0'&&$('a1r').value==='REQ-TRM-01';if(ok)seen.a=true;$('msg').textContent=ok?S.m1ok:S.m1no;checkTasks();};
  $('a3btn').onclick=()=>{const ok=+$('a3a').value===598&&+$('a3b').value===947;if(ok)seen.c=true;$('msg').textContent=ok?S.m3ok:S.m3no;checkTasks();};
  checkTasks();}
window.__api={ST,CASES,FW,VERS,HIST,seen,pTrim,nAtCmd,pFailAt,servoStop,rLower,nZero,nWith,maxFail,runCase,
  run:(ver,lay,ids)=>{ST.ver=ver;ST.lay=lay;if(ids)ST.sel[lay]=new Set(ids);drawSel();drawChg();return runNow(true);},
  setLang:()=>LANG};
txt();drawSel();drawChg();wireTasks();calc();drawTrend();
$('tbody').innerHTML=`<tr><td colspan="5" style="color:var(--muted)">${N('选好版本、层级和用例，点“运行”。','Choose a version, a level and cases, then press Run.')}</td></tr>`;
})();
