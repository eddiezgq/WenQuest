<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap"><style>/* Layout: sticky top bar; chapter = sticky section index on the left + one reading column (~40em) with figures and lab cards breaking slightly wider. Home = cover with stitch animation, then the seven-part table of contents. */
[hidden]{display:none!important}
:root{
  --paper:#f5f6f3; --sheet:#ffffff; --ink:#1b2430; --muted:#5a6570; --rule:#d8dde1; --soft:#eceff0;
  --needle:#2a5fb8;   /* 面线：蓝 */
  --bobbin:#c4531d;   /* 底线：橙 */
  --needle-soft:#e6eefb; --bobbin-soft:#fbece4; --plate:#ffffff; --shadow:0 1px 2px rgba(20,30,40,.06),0 6px 24px rgba(20,30,40,.06);
  --f-display:"Noto Serif SC","Source Han Serif SC","Songti SC",serif;
  --f-body:"Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#11161b;--sheet:#182029;--ink:#e2e7ec;--muted:#9aa6b2;--rule:#2b3540;--soft:#1e2730;--needle:#7fa9f2;--bobbin:#f08c58;--needle-soft:#1c2a40;--bobbin-soft:#33221a;--plate:#f4f5f2;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#11161b;--sheet:#182029;--ink:#e2e7ec;--muted:#9aa6b2;--rule:#2b3540;--soft:#1e2730;--needle:#7fa9f2;--bobbin:#f08c58;--needle-soft:#1c2a40;--bobbin-soft:#33221a;--plate:#f4f5f2;--shadow:none;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:72px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.85;-webkit-text-size-adjust:100%}
a{color:var(--needle);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--needle);outline-offset:2px;border-radius:3px}
.muted{color:var(--muted)}
img{max-width:100%;height:auto}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 18px;padding-block:10px;padding-inline:max(16px,3vw);background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.02rem;color:var(--ink);text-decoration:none;letter-spacing:.04em}
.stitch-mark{display:inline-block;width:28px;height:8px;background:
  repeating-linear-gradient(90deg,var(--needle) 0 6px,transparent 6px 9px) top/100% 2px no-repeat,
  repeating-linear-gradient(90deg,transparent 0 3px,var(--bobbin) 3px 9px) bottom/100% 2px no-repeat}
.barnav{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;font-size:.88rem}
.barnav a{color:var(--muted);text-decoration:none}
.barnav a[aria-current],.barnav a:hover{color:var(--ink)}
.lang{color:var(--ink);font-size:.82rem}
.theme{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;width:30px;height:30px;cursor:pointer}

/* chapter layout */
.layout{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr);gap:clamp(16px,4vw,56px);max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}

.side{min-width:0}
.side details{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow:auto;font-size:.84rem;line-height:1.5}
.side summary{font-weight:700;letter-spacing:.12em;font-size:.74rem;color:var(--muted);cursor:pointer;margin-bottom:8px}
.side ol{list-style:none;margin:0;padding:0;border-left:1px solid var(--rule)}
.side li a{display:block;padding:5px 0 5px 12px;margin-left:-1px;border-left:2px solid transparent;color:var(--muted);text-decoration:none}
.side li a:hover{color:var(--ink)}
.side li a.on{color:var(--ink);border-left-color:var(--needle);font-weight:500}
@media (max-width:960px){.side details{position:static;max-height:none;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px 14px}.side details:not([open]) summary{margin:0}}

.chapter{min-width:0;max-width:42rem}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.14em;color:var(--muted);margin:0 0 6px}
.chapter h1{font-family:var(--f-display);font-weight:900;font-size:clamp(1.9rem,4.2vw,2.7rem);line-height:1.25;margin:0;text-wrap:balance}
.chno{display:block;font-family:var(--f-mono);font-weight:600;font-size:.9rem;letter-spacing:.1em;color:var(--bobbin);margin-bottom:6px}
.seam{height:10px;margin:18px 0 24px;background:
  repeating-linear-gradient(90deg,var(--needle) 0 14px,transparent 14px 20px) 0 1px/100% 2px no-repeat,
  repeating-linear-gradient(90deg,transparent 0 11px,var(--bobbin) 11px 23px,transparent 23px 20px) 0 7px/100% 2px no-repeat}
.chapter h3{font-family:var(--f-display);font-weight:700;font-size:1.45rem;line-height:1.4;margin:2.6em 0 .6em;text-wrap:balance}
.chapter h4{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:2em 0 .4em}
.chapter p{margin:0 0 1em}

.chip b{font-weight:500;color:var(--bobbin);font-size:.76rem}

/* figures */
.fig{margin:1.8em -2rem 1.6em;padding:0}
@media (max-width:760px){.fig{margin-inline:0}}
.fig .zoom{display:block;background:var(--plate);border-radius:6px;padding:10px;cursor:zoom-in}
.fig img{display:block;margin:0 auto;border-radius:2px}
.fig figcaption{font-size:.86rem;line-height:1.6;color:var(--muted);margin:.7em 2rem 0}
@media (max-width:760px){.fig figcaption{margin-inline:0}}
.math{overflow-x:auto;overflow-y:hidden;margin:.6em 0 1.2em;padding:6px 0;font-size:1.05em}
.tbl{overflow-x:auto;margin:1.2em 0 1.6em}
.tbl table{border-collapse:collapse;font-size:.86rem;line-height:1.55;min-width:100%}
.tbl th{font-weight:700;text-align:left;border-bottom:1.5px solid var(--ink);padding:6px 10px 6px 0;white-space:nowrap}
.tbl td{border-bottom:1px solid var(--rule);padding:6px 10px 6px 0;vertical-align:top;font-variant-numeric:tabular-nums}
pre{overflow-x:auto;background:var(--soft);border-radius:6px;padding:12px 14px;font-family:var(--f-mono);font-size:.82rem;line-height:1.55}
code{font-family:var(--f-mono);font-size:.88em}
.field{margin:1.8em 0;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px 18px 6px;font-size:.94rem}
.field ul{padding-left:1.2em}
.ans{display:inline-block;margin-left:.4em}
.ans summary{display:inline;cursor:pointer;color:var(--needle);font-size:.84rem}
.ans[open]{display:block;margin:.3em 0 0;padding:6px 10px;background:var(--needle-soft);border-radius:6px;font-size:.92rem}

/* lab cards */
.lab{margin:1.6em -1rem 1.8em;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;box-shadow:var(--shadow)}
@media (max-width:760px){.lab{margin-inline:0}}
.lab-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.lab h4{margin:0;font-family:var(--f-display);font-size:1.12rem}
.lab-kind{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;color:var(--bobbin);border:1px solid currentColor;border-radius:4px;padding:0 6px;line-height:1.7}
.lab p{margin:.4em 0 .7em;font-size:.92rem;color:var(--muted)}
.lab-actions{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.run{font:inherit;font-size:.9rem;font-weight:500;background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:7px 16px;cursor:pointer}
.run:hover{background:var(--needle)}
.open{font-size:.88rem}
.lab-frame{margin-top:12px;border-radius:8px;overflow:hidden;border:1px solid var(--rule)}
.lab-frame iframe{display:block;width:100%;height:min(820px,82vh);border:0;background:var(--paper)}
.lab.running{margin-inline:-6rem}
@media (max-width:1180px){.lab.running{margin-inline:-1rem}}
@media (max-width:760px){.lab.running{margin-inline:0}}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4rem;padding-top:1.2rem;border-top:1px solid var(--rule);font-size:.9rem}
.pager a:last-child{text-align:right}

/* home */
.home{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:28px 60px}
.cover{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center;padding-block:clamp(16px,5vw,56px)}
@media (max-width:860px){.cover{grid-template-columns:minmax(0,1fr)}}
.cover h1{font-family:var(--f-display);font-weight:900;font-size:clamp(2.4rem,7vw,4.4rem);line-height:1.12;letter-spacing:.02em;margin:.1em 0 .35em;text-wrap:balance}
.lede{font-size:1.06rem;max-width:32em;margin:0 0 1.4em}
.stats{display:flex;flex-wrap:wrap;gap:12px 32px;margin:0 0 1.6em}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--f-mono);font-size:1.7rem;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.stats span{font-size:.82rem;color:var(--muted)}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-block;background:var(--ink);color:var(--paper);text-decoration:none;border-radius:6px;padding:9px 18px;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn:hover{background:var(--needle);color:#fff}
.cover-art{margin:0;min-width:0}
.cover-art canvas{display:block;width:100%;height:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:12px}
.cover-art figcaption{font-size:.8rem;color:var(--muted);margin-top:8px}
.toc{padding-top:2rem}
.toc h2{font-family:var(--f-display);font-weight:900;font-size:1.9rem;margin:0 0 .2em}
.part{margin-top:2rem}
.part h3{display:flex;align-items:baseline;gap:12px;font-family:var(--f-display);font-size:1.2rem;margin:0 0 .5em;padding-bottom:.4em;border-bottom:1.5px solid var(--ink)}
.part h3 span{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.14em;color:var(--muted);font-weight:400}
.part ol{list-style:none;margin:0;padding:0}
.part li>a,.part li>div{display:grid;grid-template-columns:2.4rem minmax(0,15rem) minmax(0,1fr) 4.2rem;gap:4px 14px;align-items:baseline;padding:10px 4px;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--muted)}
@media (max-width:700px){.part li>a,.part li>div{grid-template-columns:2rem minmax(0,1fr) 3.6rem}.part .d{grid-column:2/4;grid-row:2}}
.part .n{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.part .t{font-weight:500}
.part .d{font-size:.86rem;line-height:1.55}
.part .st{font-size:.74rem;text-align:right;font-family:var(--f-mono)}
.part li.ready a{color:var(--ink)}
.part li.ready .st{color:var(--bobbin);font-weight:600}
.part li.ready a:hover{background:var(--sheet)}
.foot{margin-top:4rem;padding-top:1rem;border-top:1px solid var(--rule);font-size:.84rem;color:var(--muted)}
.res-ch{margin-top:2.2rem}
.res-ch h3{font-family:var(--f-display);font-size:1.15rem;margin:0 0 .6em}
.res-ch h3 a{color:var(--ink);text-decoration:none}
.res-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,16rem),1fr));gap:12px}
.res-grid a{display:flex;flex-direction:column;gap:4px;height:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;color:var(--ink);text-decoration:none;font-size:.88rem;line-height:1.6}
.res-grid a:hover{border-color:var(--bobbin)}
.res-grid b{font-family:var(--f-display);font-size:1.05rem}
.res-grid a>span:last-child{color:var(--muted)}
.res-grid .lab-kind{align-self:flex-start}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(10,14,18,.86);display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;background:#fff;border-radius:6px;padding:8px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
