<text x="278" y="601.0" font-size="16" fill="#b7791f" font-weight="700" text-anchor="start" >Denim B = 3.0</text>

<text x="771" y="997.0" font-size="17" fill="#5a6570" font-weight="400" text-anchor="middle" >Tension ratio r (log scale)</text>
<text x="1377" y="552.0" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >The interlacing point is pulled in opposite</text>
<text x="1377" y="578.0" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >directions by the two threads. Friction at the</text>
<text x="1377" y="604.0" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >edges of the needle hole acts like a brake: while</text>
<text x="1377" y="630.0" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >the tension ratio lies between 1/B and B (the</text>
<text x="1377" y="656.0" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >balance band), the point stays within the fabric</text>
<text x="1377" y="682.0" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >thickness; outside that range it is pulled to</text>
<text x="1377" y="708.0" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >the top or the underside.</text>
<text x="1377" y="734.0" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" ></text>
<text x="1377" y="760.0" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >The larger B, the easier the balance is to set:</text>
<text x="1377" y="786.0" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >thick, soft fabrics are more forgiving than</text>
<text x="1377" y="812.0" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >thin, slippery ones.</text>
<text x="1377" y="838.0" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" ></text>
<text x="1377" y="864.0" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >Within the balance zone (z = 0.4–0.6) the</text>
<text x="1377" y="890.0" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >interlacing point sits in the middle of the fabric</text>
<text x="1377" y="916.0" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >and neither thread shows on the other side.</text>
