</style><div class="fig" style="--w:1700px;width:1700px;height:760px"><p class="title">Case T9: how a lockstitch machine adapts itself to different fabrics</p><p class="sub">The sense → recognise → adjust loop (illustrative); below, a uniform-stitch-length control method from a published patent</p><svg width="1700" height="760"><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#5a6570"/></marker></defs><rect x="40" y="130" width="360" height="140" rx="8" fill="#fff" stroke="#2a6fdb" stroke-width="2"/><text x="220" y="160" text-anchor="middle" style="fill:#2a5fb8;font-weight:700;font-size:16px">Sense</text><text x="220" y="186" text-anchor="middle" style="fill:#1b2430;font-size:13px">Presser-foot height sensor (thickness)</text><text x="220" y="205" text-anchor="middle" style="fill:#1b2430;font-size:13px">Main-shaft motor current (penetration</text><text x="220" y="224" text-anchor="middle" style="fill:#1b2430;font-size:13px">resistance); feed-motor load, camera</text><rect x="450" y="130" width="360" height="140" rx="8" fill="#fff" stroke="#8a5cc7" stroke-width="2"/><text x="630" y="160" text-anchor="middle" style="fill:#7444b4;font-weight:700;font-size:16px">Recognise</text><text x="630" y="186" text-anchor="middle" style="fill:#1b2430;font-size:13px">Change in ply count, crossing a seam,</text><text x="630" y="205" text-anchor="middle" style="fill:#1b2430;font-size:13px">fabric type;</text><text x="630" y="224" text-anchor="middle" style="fill:#1b2430;font-size:13px">rules, look-up tables or learned models</text><rect x="860" y="130" width="360" height="140" rx="8" fill="#fff" stroke="#e0662f" stroke-width="2"/><text x="1040" y="160" text-anchor="middle" style="fill:#c4531d;font-weight:700;font-size:16px">Adjust</text><text x="1040" y="186" text-anchor="middle" style="fill:#1b2430;font-size:13px">Stitch length, presser-foot pressure,</text><text x="1040" y="205" text-anchor="middle" style="fill:#1b2430;font-size:13px">needle-thread tension, speed,</text><text x="1040" y="224" text-anchor="middle" style="fill:#1b2430;font-size:13px">feed amount (Ch. 14)</text><rect x="1270" y="130" width="360" height="140" rx="8" fill="#fff" stroke="#2e9e5b" stroke-width="2"/><text x="1450" y="160" text-anchor="middle" style="fill:#1f8a4c;font-weight:700;font-size:16px">Result</text><text x="1450" y="186" text-anchor="middle" style="fill:#1b2430;font-size:13px">Even stitch length, no skipped stitches,</text><text x="1450" y="205" text-anchor="middle" style="fill:#1b2430;font-size:13px">no thread breaks, no puckering;</text><text x="1450" y="224" text-anchor="middle" style="fill:#1b2430;font-size:13px">data go back to the bus (Ch. 26)</text><line x1="406" y1="200" x2="444" y2="200" stroke="#5a6570" stroke-width="2.6" marker-end="url(#m)"/><line x1="816" y1="200" x2="854" y2="200" stroke="#5a6570" stroke-width="2.6" marker-end="url(#m)"/><line x1="1226" y1="200" x2="1264" y2="200" stroke="#5a6570" stroke-width="2.6" marker-end="url(#m)"/><path d="M220,274 L220,329 L1450,329 L1450,274" fill="none" stroke="#5a6570" stroke-width="1.6" stroke-dasharray="7 4"/><text x="820" y="352" text-anchor="middle" style="font-size:13.5px">Closed loop: keep measuring after adjusting</text><rect x="60" y="420" width="980" height="308" rx="8" fill="#fff" stroke="#e2e5e8" stroke-width="1.5"/><line x1="120" y1="659" x2="1000" y2="659" stroke="#1b2430" stroke-width="1.4"/><text x="995" y="651" text-anchor="end" style="font-size:12.5px">Throat plate surface</text><path d="M120.0,680.2 L124.0,679.8 L128.0,679.3 L132.0,678.9 L136.0,678.4 L140.0,678.0 L144.0,677.5 L148.0,677.0 L152.0,676.5 L156.0,676.0 L160.0,675.5 L164.0,675.0 L168.0,674.4 L172.0,673.9 L176.0,673.3 L180.0,672.7 L184.0,672.2 L188.0,671.6 L192.0,671.0 L196.0,670.4 L200.0,669.8 L204.0,669.2 L208.0,668.6 L212.0,667.9 L216.0,667.3 L220.0,666.7 L224.0,666.0 L228.0,665.4 L232.0,664.8 L236.0,664.1 L240.0,663.5 L244.0,662.8 L248.0,662.1 L252
