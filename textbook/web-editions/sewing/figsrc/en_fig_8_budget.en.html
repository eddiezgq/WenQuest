<text x="1177" y="506.0" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" xml:space="preserve">Reading the chart:</text>
<text x="1177" y="534.4" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" xml:space="preserve">• Needle in fabric and feed dog gripping almost meet end to end,</text>
<text x="1177" y="562.8" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" xml:space="preserve">  overlapping only at 101.7°–114.2°, when the dog’s horizontal motion is done;</text>
<text x="1177" y="591.2" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" xml:space="preserve">• the hook carries the loop for 135° (206°–341°), spanning the moment the</text>
<text x="1177" y="619.6" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" xml:space="preserve">  needle leaves the fabric; only after cast-off can the take-up tighten the stitch;</text>
<text x="1177" y="648.0" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" xml:space="preserve">• at 55°, when the take-up is tightest, the feed is still moving — this is what</text>
<text x="1177" y="676.4" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" xml:space="preserve">  Chapter 6 means by “the stitch is tightened while the fabric moves”.</text>
<text x="1177" y="704.8" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" xml:space="preserve"></text>
<text x="1177" y="733.2" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" xml:space="preserve">Whenever the phase of any mechanism changes, check on this disc</text>
<text x="1177" y="761.6" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" xml:space="preserve">that it does not collide with another mechanism.</text>
