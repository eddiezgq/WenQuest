</style><div class="fig" style="--w:1700px;width:1700px;height:480px"><p class="title">Student project: find a sewing line’s bottleneck with the digital factory and an AI assistant, and verify the AI’s answers</p><p class="sub">Illustrative; below each box: the book chapters or virtual labs used</p><svg width="1700" height="480"><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#5a6570"/></marker></defs><rect x="40" y="130" width="300" height="170" rx="8" fill="#fff" stroke="#1b2430" stroke-width="2"/><text x="190" y="159" text-anchor="middle" style="fill:#1b2430;font-weight:700;font-size:16px">1 Preparation</text><text x="190" y="185" text-anchor="middle" style="fill:#1b2430;font-size:12.5px">Complete Lab 7 in the WenQuest</text><text x="190" y="204" text-anchor="middle" style="fill:#1b2430;font-size:12.5px">Digital Factory; learn to read dashboards,</text><text x="190" y="223" text-anchor="middle" style="fill:#1b2430;font-size:12.5px">ask the AI, check the sources</text><text x="190" y="281" text-anchor="middle" style="fill:#1b2430;font-weight:700;font-size:12.5px">Digital factory · Lab 7</text><line x1="343" y1="215" x2="367" y2="215" stroke="#5a6570" stroke-width="2.6" marker-end="url(#m)"/><rect x="370" y="130" width="300" height="170" rx="8" fill="#fff" stroke="#2a6fdb" stroke-width="2"/><text x="520" y="159" text-anchor="middle" style="fill:#2a5fb8;font-weight:700;font-size:16px">2 Build the data</text><text x="520" y="185" text-anchor="middle" style="fill:#1b2430;font-size:12.5px">Pick a style; write down operations,</text><text x="520" y="204" text-anchor="middle" style="fill:#1b2430;font-size:12.5px">work content, staff groups</text><text x="520" y="223" text-anchor="middle" style="fill:#1b2430;font-size:12.5px">and output records</text><text x="520" y="281" text-anchor="middle" style="fill:#2a5fb8;font-weight:700;font-size:12.5px">Ch. 28 · Labs 28-1, 29-1</text><line x1="673" y1="215" x2="697" y2="215" stroke="#5a6570" stroke-width="2.6" marker-end="url(#m)"/><rect x="700" y="130" width="300" height="170" rx="8" fill="#fff" stroke="#8a5cc7" stroke-width="2"/><text x="850" y="159" text-anchor="middle" style="fill:#7444b4;font-weight:700;font-size:16px">3 Ask the AI</text><text x="850" y="185" text-anchor="middle" style="fill:#1b2430;font-size:12.5px">Have the AI assistant find the bottleneck</text><text x="850" y="204" text-anchor="middle" style="fill:#1b2430;font-size:12.5px">and propose improvements; require it to</text><text x="850" y="223" text-anchor="middle" style="fill:#1b2430;font-size:12.5px">show its calculations and data sources</text><text x="850" y="281" text-anchor="middle" style="fill:#7444b4;font-weight:700;font-size:12.5px">AI assistant</text><line x1="1003" y1="215" x2="1027" y2="215" stroke="#5a6570" stroke-width="2.6" marker-end="url(#m)"/><rect x="1030" y="130" width="300" height="170" rx="8" fill="#fff" stroke="#e0662f" stroke-width="2"/><text x="1180" y="159" text-anchor="middle" style="fill:#c4531d;font-weight:700;font-size:16px">4 Calculate yourself</text><text x="1180" y="185" text-anchor="middle" style="fill:#1b2430;font-size:12.5px">Use balance efficiency, cycle time and</text><text x="1180" y="204" text-anchor="middle" style="fill:#1b2430;font-size:12.5px">Little’s law to check the AI’s</text><text x="1180" y="223" text-anchor="middle" style="fill:#1b2430;font-size:12.5px">conclusions point by point</text><text x="1180" y="281" text-anchor="middle" style="fill:#c4531d;font-weight:700;font-size:12.5px">Ch. 28, 29 · Lab 29-1</text><line x1="1333" y1="215" x2="1357" y2="215" stroke="#5a6570" stroke-width="2.6" marker-end="url(#m)"/><rect x="1360" y="130" width="300" height="170" rx="8" fill="#fff" stroke="#2e9e5b" stroke-width="2"/><text x="1510" y="159" text-anchor="middle" style="fill:#1f8a4c;font-weight:700;font-size:16px">5 Report</text><text x="1510" y="185" text-anchor="middle" style="fill:#1b2430;font-size:12.5px">Where the AI was right, where it was</text><text x="1510" y="204" text-anchor="middle" style="fill:#1b2430;font-size:12.5px">wrong, and why; improvement plan</text><text x="1510" y="223" text-anchor="middle" style="fill:#1b2430;font-size:12.5px">and its expected effect</text><text x="1510" y="281" text-anchor="middle" style="fill:#1f8a4c;font-weight:700;font-size:12.5px">Oral defence</text><text x="40" y="370" style="fill:#1b2430;font-size:15px">Grading does not focus on the answer the AI gives but on whether the student can judge it: are the numbers calculated from the given data,</text><text x="40" y="398" style="fill:#1b2430;font-size:15px">has takt time been confused with cycle time, and do the proposed improvements violate operation precedence, machine types or head count?</text></svg></div>
