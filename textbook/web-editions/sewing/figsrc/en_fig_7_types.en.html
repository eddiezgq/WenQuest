<text x="48" y="60.0" font-size="30" fill="#1b2430" font-weight="700" text-anchor="start" >Four types of seam pucker</text>
<text x="48" y="98.0" font-size="19" fill="#5a6570" font-weight="400" text-anchor="start" >Schematic; classification after a thread manufacturer’s material on the causes of pucker</text>
<rect x="48.0" y="142.0" width="458.0" height="563.0" rx="12" fill="#fff" stroke="#d8dde1" stroke-width="1.5" />
<text x="71" y="186.0" font-size="22" fill="#1b2430" font-weight="700" text-anchor="start" >a</text><text x="107" y="186.0" font-size="22" fill="#1b2430" font-weight="700" text-anchor="start" >Tension pucker</text>
<text x="71" y="587.0" font-size="15" fill="#3d4650" font-weight="400" text-anchor="start" >The thread is stretched while sewing and springs</text>
<text x="71" y="612.0" font-size="15" fill="#3d4650" font-weight="400" text-anchor="start" >back afterwards, pulling the fabric short so it buckles.</text>
<text x="71" y="637.0" font-size="15" fill="#3d4650" font-weight="400" text-anchor="start" >Remedy: lowest tension that still balances</text>
<rect x="530.0" y="142.0" width="458.0" height="563.0" rx="12" fill="#fff" stroke="#d8dde1" stroke-width="1.5" />
<text x="553" y="186.0" font-size="22" fill="#1b2430" font-weight="700" text-anchor="start" >b</text><text x="589" y="186.0" font-size="22" fill="#1b2430" font-weight="700" text-anchor="start" >Structural pucker</text>
<text x="553" y="587.0" font-size="15" fill="#3d4650" font-weight="400" text-anchor="start" >Tightly woven fabric has no room for needle and</text>
<text x="553" y="612.0" font-size="15" fill="#3d4650" font-weight="400" text-anchor="start" >thread: the yarns are pushed apart, the fabric stretched.</text>
<text x="553" y="637.0" font-size="15" fill="#3d4650" font-weight="400" text-anchor="start" >Remedy: finer needle and thread, lower stitch density</text>
<rect x="1012.0" y="142.0" width="458.0" height="563.0" rx="12" fill="#fff" stroke="#d8dde1" stroke-width="1.5" />
<text x="1035" y="186.0" font-size="22" fill="#1b2430" font-weight="700" text-anchor="start" >c</text><text x="1071" y="186.0" font-size="22" fill="#1b2430" font-weight="700" text-anchor="start" >Dimensional instability</text>
<text x="1035" y="587.0" font-size="15" fill="#3d4650" font-weight="400" text-anchor="start" >After washing or pressing, thread and fabric shrink</text>
<text x="1035" y="612.0" font-size="15" fill="#3d4650" font-weight="400" text-anchor="start" >by different amounts and the seam is pulled into pucker.</text>
<text x="1035" y="637.0" font-size="15" fill="#3d4650" font-weight="400" text-anchor="start" >Remedy: low-shrink thread; match shell and interlining</text>
<rect x="1494.0" y="142.0" width="458.0" height="563.0" rx="12" fill="#fff" stroke="#d8dde1" stroke-width="1.5" />
<text x="1517" y="186.0" font-size="22" fill="#1b2430" font-weight="700" text-anchor="start" >d</text><text x="1553" y="186.0" font-size="22" fill="#1b2430" font-weight="700" text-anchor="start" >Feed pucker</text>
<text x="1517" y="587.0" font-size="15" fill="#3d4650" font-weight="400" text-anchor="start" >The two plies are fed unequally (Chapter 6) and the</text>
<text x="1517" y="612.0" font-size="15" fill="#3d4650" font-weight="400" text-anchor="start" >excess of one ply puckers.</text>
<text x="1517" y="637.0" font-size="15" fill="#3d4650" font-weight="400" text-anchor="start" >Remedy: adjust presser foot and dog height, or feed system</text>
