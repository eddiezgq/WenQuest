<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../fig_base.css">
<style>.fig{background:#faf9f5}.pimg{display:block;width:100%}.card{border:1.5px solid #d8dde1;border-radius:12px;background:#fff}@font-face{font-family:QFix2;src:local("DejaVu Sans");unicode-range:U+00B1,U+00D7,U+2192,U+2212}@font-face{font-family:QFix2;src:local("DejaVu Sans Bold");font-weight:700;unicode-range:U+00B1,U+00D7,U+2192,U+2212}.fig *,.fig svg text{font-family:QFix2,QFix,"Noto Sans CJK SC",sans-serif}</style>
<div class="fig" style="--w:1700px">
<p class="title">Control software: four layers and a firmware update that survives a power failure</p>
<p class="sub">Illustrative; the periods of the layers are typical orders of magnitude</p>
<svg viewBox="40 135 1920 720" width="100%" style="display:block;overflow:visible"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6570"/></marker>
<marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5cc7"/></marker></defs><rect x="70" y="165" width="730" height="117" rx="10" fill="#fff" stroke="#8a5cc7" stroke-width="2.6"/><text x="94" y="205" font-size="19" font-weight="700" fill="#7444b4" text-anchor="start" >User-interface and communication layer</text><text x="776" y="205" font-size="14.5" font-weight="700" fill="#5a6570" text-anchor="end" >every few tens of ms</text><text x="94" y="242" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start" >control panel, parameters, networking, firmware updates</text><rect x="70" y="306" width="730" height="117" rx="10" fill="#fff" stroke="#2e9e5b" stroke-width="2.6"/><text x="94" y="346" font-size="19" font-weight="700" fill="#1f8a4c" text-anchor="start" >Process layer</text><text x="776" y="346" font-size="14.5" font-weight="700" fill="#5a6570" text-anchor="end" >by main-shaft angle / ms</text><text x="94" y="383" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start" >start backtack, trimming, wiping, colour change, pattern interpolation (Chapters 14–17)</text><rect x="70" y="447" width="730" height="117" rx="10" fill="#fff" stroke="#2a6fdb" stroke-width="2.6"/><text x="94" y="487" font-size="19" font-weight="700" fill="#2a5fb8" text-anchor="start" >Motion-control layer</text><text x="776" y="487" font-size="14.5" font-weight="700" fill="#5a6570" text-anchor="end" >current loop about 0.1 ms</text><text x="94" y="524" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start" >current, velocity and position loops (Chapter 13)</text><rect x="70" y="588" width="730" height="117" rx="10" fill="#fff" stroke="#1b2430" stroke-width="2.6"/><text x="94" y="628" font-size="19" font-weight="700" fill="#1b2430" text-anchor="start" >Driver layer</text><text x="776" y="628" font-size="14.5" font-weight="700" fill="#5a6570" text-anchor="end" >interrupt-driven</text><text x="94" y="665" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start" >PWM, A/D conversion, encoder interface, serial ports, memory</text><line x1="822" y1="705" x2="822" y2="187" stroke="#5a6570" stroke-width="2.4" marker-end="url(#ah)"/><text x="834" y="400" font-size="14.5" font-weight="400" fill="#5a6570" text-anchor="start" >Higher up:</text><text x="834" y="423" font-size="14.5" font-weight="400" fill="#5a6570" text-anchor="start" >slower,</text><text x="834" y="446" font-size="14.5" font-weight="400" fill="#5a6570" text-anchor="start" >more</text><text x="834" y="469" font-size="14.5" font-weight="400" fill="#5a6570" text-anchor="start" >flexible</text><line x1="929" y1="188" x2="929" y2="706" stroke="#d23b30" stroke-width="2.4" marker-end="url(#ah)"/><path d="M920,697 l9,12 l9,-12 z" fill="#5a6570"/><text x="940" y="547" font-size="14.5" font-weight="400" fill="#c4372b" text-anchor="start" >Lower down:</text><text x="940" y="570" font-size="14.5" font-weight="400" fill="#c4372b" text-anchor="start" >faster,</text><text x="940" y="593" font-size="14.5" font-weight="400" fill="#c4372b" text-anchor="start" >stricter</text><text x="940" y="616" font-size="14.5" font-weight="400" fill="#c4372b" text-anchor="start" >timing</text><text x="70" y="747" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start" >Protection runs through every layer: overvoltage, undervoltage, overcurrent, stall, encoder loss,</text><text x="70" y="773" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start" >overtemperature → limit speed or switch off the outputs, show a fault code; at power-up check that the pedal</text><text x="70" y="799" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start" >is in neutral and the head is not tilted back, to prevent unexpected start-up; the watchdog resets a runaway</text><text x="70" y="825" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start" >program and first switches off PWM.</text><rect x="1083" y="153" width="869" height="658" rx="14" fill="#fff" stroke="#d8dde1" stroke-width="1.8"/><text x="1106" y="190" font-size="19" font-weight="700" fill="#1b2430" text-anchor="start" >Dual-bank firmware update</text><rect x="1117" y="224" width="188" height="352" rx="8" fill="#f3f5f6" stroke="#1b2430" stroke-width="2"/><rect x="1129" y="236" width="165" height="57" rx="5" fill="#e3e7ea" stroke="#1b2430" stroke-width="1.6"/><text x="1211.5" y="271" font-size="15.5" font-weight="700" fill="#1b2430" text-anchor="middle" >Bootloader</text><rect x="1129" y="306" width="165" height="117" rx="5" fill="#eaf6ee" stroke="#2e9e5b" stroke-width="1.6"/><text x="1211" y="355" font-size="15.5" font-weight="700" fill="#1f8a4c" text-anchor="middle" >Program bank A</text><text x="1211" y="380" font-size="15" font-weight="700" fill="#1f8a4c" text-anchor="middle" >(running)</text><rect x="1129" y="435" width="165" height="117" rx="5" fill="#fcefe8" stroke="#e0662f" stroke-width="1.6"/><text x="1211" y="484" font-size="15.5" font-weight="700" fill="#c4531d" text-anchor="middle" >Program bank B</text><text x="1211" y="509" font-size="15" font-weight="700" fill="#c4531d" text-anchor="middle" >(new version</text><text x="1211" y="530" font-size="15" font-weight="700" fill="#c4531d" text-anchor="middle" >being written)</text><text x="1211" y="602" font-size="14" font-weight="400" fill="#5a6570" text-anchor="middle" >Memory</text><rect x="1364" y="247" width="553" height="54" rx="9" fill="#fff" stroke="#c48a17" stroke-width="2.4"/><text x="1388" y="281" font-size="16" font-weight="700" fill="#b8791c" text-anchor="start" >① Write the new firmware completely into bank B</text><line x1="1640" y1="301" x2="1640" y2="318" stroke="#5a6570" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1364" y="320" width="553" height="54" rx="9" fill="#fff" stroke="#c48a17" stroke-width="2.4"/><text x="1388" y="354" font-size="16" font-weight="700" fill="#b8791c" text-anchor="start" >② Verify bank B (checksum, signature)</text><line x1="1640" y1="374" x2="1640" y2="391" stroke="#5a6570" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1364" y="393" width="553" height="54" rx="9" fill="#fff" stroke="#2a6fdb" stroke-width="2.4"/><text x="1388" y="427" font-size="16" font-weight="700" fill="#2a5fb8" text-anchor="start" >③ Only if it passes, switch the boot flag to B</text><line x1="1640" y1="447" x2="1640" y2="464" stroke="#5a6570" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1364" y="466" width="553" height="54" rx="9" fill="#fff" stroke="#2a6fdb" stroke-width="2.4"/><text x="1388" y="500" font-size="16" font-weight="700" fill="#2a5fb8" text-anchor="start" >④ Restart: the bootloader checks bank B</text><line x1="1640" y1="520" x2="1640" y2="537" stroke="#5a6570" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1364" y="539" width="553" height="54" rx="9" fill="#fff" stroke="#2e9e5b" stroke-width="2.4"/><text x="1388" y="573" font-size="16" font-weight="700" fill="#1f8a4c" text-anchor="start" >⑤ OK → run B; fault → fall back to A</text><text x="1117" y="659" font-size="15" font-weight="400" fill="#1b2430" text-anchor="start" >Power failure at any step: the boot flag still points to A and the machine</text><text x="1117" y="687" font-size="15" font-weight="400" fill="#1b2430" text-anchor="start" >starts on the old version as usual; the bootloader is very small and is</text><text x="1117" y="715" font-size="15" font-weight="400" fill="#1b2430" text-anchor="start" >never changed after the unit leaves the factory.</text></svg>
</div>
