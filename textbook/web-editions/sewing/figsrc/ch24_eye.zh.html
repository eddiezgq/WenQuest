<div class="fig" style="--w:1000px"><p class="title">针孔怎样冲出来：工序与缺陷</p><p class="sub">示意：沿针孔中心的横截面（垂直于针身轴线）；尺寸放大、不按比例</p><svg width="940" height="225" viewBox="0 0 940 225"><g transform="translate(115,95)"><circle cx="0" cy="0" r="60" fill="#e6e9ec" stroke="#1b2430" stroke-width="2"/></g><text x="115" y="196" text-anchor="middle" font-size="14" font-weight="700">① 减径后的针身</text><text x="115" y="215" text-anchor="middle" font-size="12" fill="#5a6570">圆截面，直径 d</text><g transform="translate(345,95)"><path d="M-60 0 A60 60 0 0 1 -22 -56 L-22 -36 Q0 -28 22 -36 L22 -56 A60 60 0 0 1 60 0 A60 60 0 0 1 22 56 L22 40 Q0 32 -22 40 L-22 56 A60 60 0 0 1 -60 0 Z" fill="#e6e9ec" stroke="#1b2430" stroke-width="2"/></g><text x="345" y="196" text-anchor="middle" font-size="14" font-weight="700">② 冲长槽与短槽</text><text x="345" y="215" text-anchor="middle" font-size="12" fill="#5a6570">两侧压出槽，针孔区局部变薄</text><g transform="translate(217.0,86)"><svg x="0" y="0" width="26" height="20" viewBox="0 0 26 20"><path d="M2 10H20" stroke="#5a6570" stroke-width="2"/><path d="M16 4L23 10L16 16" fill="none" stroke="#5a6570" stroke-width="2"/></svg></g><g transform="translate(575,95)"><path d="M-60 0 A60 60 0 0 1 -22 -56 L-22 -36 L-18 -34 L-18 34 L-22 40 L-22 56 A60 60 0 0 1 -60 0 Z" fill="#e6e9ec" stroke="#1b2430" stroke-width="2"/><path d="M60 0 A60 60 0 0 0 22 -56 L22 -36 L18 -34 L18 34 L22 40 L22 56 A60 60 0 0 0 60 0 Z" fill="#e6e9ec" stroke="#1b2430" stroke-width="2"/><path d="M-18 34 L-12 46 L-20 40 Z M18 34 L12 46 L20 40 Z" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/><text x="0" y="68" text-anchor="middle" font-size="12" fill="#c0392b">毛刺</text></g><text x="575" y="196" text-anchor="middle" font-size="14" font-weight="700">③ 冲穿针孔</text><text x="575" y="215" text-anchor="middle" font-size="12" fill="#5a6570">冲头穿过，孔边留下毛刺</text><g transform="translate(447.0,86)"><svg x="0" y="0" width="26" height="20" viewBox="0 0 26 20"><path d="M2 10H20" stroke="#5a6570" stroke-width="2"/><path d="M16 4L23 10L16 16" fill="none" stroke="#5a6570" stroke-width="2"/></svg></g><g transform="translate(805,95)"><path d="M-60 0 A60 60 0 0 1 -22 -56 L-22 -40 Q-14 -36 -14 -26 L-14 26 Q-14 36 -22 42 L-22 56 A60 60 0 0 1 -60 0 Z" fill="#e6e9ec" stroke="#1b2430" stroke-width="2"/><path d="M60 0 A60 60 0 0 0 22 -56 L22 -40 Q14 -36 14 -26 L14 26 Q14 36 22 42 L22 56 A60 60 0 0 0 60 0 Z" fill="#e6e9ec" stroke="#1b2430" stroke-width="2"/><circle cx="0" cy="0" r="8" fill="#2a5fb8"/><text x="0" y="-64" text-anchor="middle" font-size="12" fill="#2a5fb8">线</text><path d="M0 -60 V-10" stroke="#2a5fb8" stroke-width="1" stroke-dasharray="3 3"/></g><text x="805" y="196" text-anchor="middle" font-size="14" font-weight="700">④ 抛光后</text><text x="805" y="215" text-anchor="middle" font-size="12" fill="#5a6570">孔边倒圆，线从孔里滑过不受刮</text><g transform="translate(677.0,86)"><svg x="0" y="0" width="26" height="20" viewBox="0 0 26 20"><path d="M2 10H20" stroke="#5a6570" stroke-width="2"/><path d="M16 4L23 10L16 16" fill="none" stroke="#5a6570" stroke-width="2"/></svg></g></svg><div class="box o fill-o" style="text-align:left;margin-top:8px"><b>常见缺陷</b><ul><li>孔边毛刺、锐边：割线、起毛、断线</li><li>孔偏：孔不在针身中心，一侧壁太薄易断</li><li>孔壁粗糙：线与孔摩擦发热、线迹不匀</li><li>冲头磨损：毛刺逐渐变大，孔宽漂移</li></ul></div></div>
