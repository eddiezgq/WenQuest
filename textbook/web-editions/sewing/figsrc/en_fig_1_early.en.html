<text x="42" y="54" class="t">Three early sewing machines: each step solved one specific problem</text>
<text x="42" y="88" class="s">Schematic, drawn from patent descriptions and museum pieces; not to scale</text>
<rect x="42" y="127" width="620" height="588" rx="10" fill="#fff" stroke="#d8dde1" stroke-width="1.5"/>
<rect x="690" y="127" width="620" height="588" rx="10" fill="#fff" stroke="#d8dde1" stroke-width="1.5"/>
<rect x="1337" y="127" width="620" height="588" rx="10" fill="#fff" stroke="#d8dde1" stroke-width="1.5"/>
<!-- a Howe -->
<text x="63" y="164" class="h">a&#8195;Howe (1846)</text>
<text x="63" y="193" class="g">Eye-pointed curved needle + shuttle = lockstitch</text>
<rect x="373" y="263" width="14" height="305" fill="#efe0bc" stroke="#c9b78c"/>
<rect x="390" y="242" width="30" height="346" rx="3" fill="#cdd3da" stroke="#5a6570" stroke-width="2"/>
<g fill="#4a5560"><circle cx="405" cy="275" r="3"/><circle cx="405" cy="311" r="3"/><circle cx="405" cy="347" r="3"/><circle cx="405" cy="383" r="3"/><circle cx="405" cy="419" r="3"/><circle cx="405" cy="455" r="3"/><circle cx="405" cy="491" r="3"/><circle cx="405" cy="527" r="3"/><circle cx="405" cy="561" r="3"/></g>
<path d="M135 316 H290 Q345 316 375 355" fill="none" stroke="#5a6570" stroke-width="7" stroke-linecap="round"/>
<circle cx="125" cy="316" r="10" fill="#fff" stroke="#5a6570" stroke-width="3"/>
<line x1="372" y1="353" x2="400" y2="366" stroke="#2a6fdb" stroke-width="3"/>
<text x="142" y="280" class="l">Curved needle</text><text x="142" y="299" class="l">(swings sideways)</text>
<path d="M440 348 Q490 336 540 358" fill="none" stroke="#5a6570" stroke-width="9" stroke-linecap="round"/>
<text x="452" y="327" class="l">Shuttle (reciprocates)</text>
<line x1="421" y1="548" x2="421" y2="502" stroke="#e0662f" stroke-width="2"/><path d="M414 506 L421 492 L428 506z" fill="#5a6570"/>
<text x="440" y="526" class="m">Gear moves the pin plate</text><text x="440" y="545" class="m">intermittently</text>
<text x="405" y="615" class="m" text-anchor="middle">Pin plate (holds the fabric)</text>
<text x="63" y="664" class="n">Drawback: the fabric hangs on the pin plate; after each plate the machine</text>
<text x="63" y="685" class="n">must stop and re-hang it, and only straight seams are possible</text>
<!-- b Singer -->
<text x="711" y="164" class="h">b&#8195;Singer (1851)</text>
<text x="711" y="193" class="g">Straight needle up and down + overhanging arm + presser + continuous feed</text>
<path d="M900 318 V252 H1184 V588" fill="none" stroke="#5f6b76" stroke-width="22" stroke-linejoin="round"/>
<text x="1047" y="236" class="l" text-anchor="middle">Overhanging arm</text>
<rect x="897" y="318" width="7" height="114" fill="#cdd3da" stroke="#7a848e"/>
<text x="885" y="368" class="l" text-anchor="end">Straight needle,</text><text x="885" y="387" class="l" text-anchor="end">up and down</text>
<rect x="910" y="419" width="48" height="11" fill="#cdd3da" stroke="#5a6570"/>
<text x="970" y="410" class="l">Spring presser</text>
<rect x="763" y="433" width="316" height="19" fill="#efe0bc" stroke="#c9b78c"/>
<rect x="752" y="452" width="485" height="17" fill="#eef0f2" stroke="#9aa4ae"/>
<line x1="1035" y1="426" x2="830" y2="426" stroke="#e0662f" stroke-width="2"/><path d="M832 420 L816 426 L832 432z" fill="#5a6570"/>
<circle cx="931" cy="495" r="25" fill="none" stroke="#5a6570" stroke-width="3"/>
<text x="831" y="494" class="m" text-anchor="middle">Table</text>
<text x="969" y="500" class="m">Feed wheel</text><text x="969" y="519" class="m">(turns continuously)</text>
<line x1="950" y1="631" x2="1133" y2="622" stroke="#5f6b76" stroke-width="7" stroke-linecap="round"/>
<text x="1150" y="628" class="l">Treadle</text>
<text x="711" y="664" class="n">The fabric lies flat on the table, so long seams and curves can be sewn;</text>
<text x="711" y="685" class="n">treadle drive leaves both hands free to guide the work</text>
<!-- c Wilson -->
<text x="1358" y="164" class="h">c&#8195;Wilson (1852, 1854)</text>
<text x="1358" y="193" class="g">Rotary hook + four-motion feed</text>
<text x="1537" y="305" class="l" text-anchor="middle">Rotary hook: turns continuously in one direction</text>
<circle cx="1537" cy="421" r="95" fill="none" stroke="#5a6570" stroke-width="4"/>
<path d="M1537 349 A72 72 0 1 1 1465 425" fill="none" stroke="#14797f" stroke-width="2"/>
<path d="M1458 432 L1464 416 L1471 432z" fill="#5a6570"/>
<path d="M1601 351 A95 95 0 0 1 1632 421" fill="none" stroke="#1b2430" stroke-width="7" stroke-linecap="round"/>
<circle cx="1537" cy="421" r="40" fill="#fbe3d6" stroke="#e0662f" stroke-width="2"/>
<text x="1537" y="426" class="or" text-anchor="middle">Bobbin</text>
<rect x="1716" y="378" width="146" height="53" fill="none" stroke="#e0662f" stroke-width="2.5" stroke-dasharray="7 4"/>
<rect x="1720" y="386" width="58" height="11" fill="#e07a4f"/>
<text x="1790" y="367" class="or" text-anchor="middle">② advance</text>
<text x="1706" y="410" class="or" text-anchor="end">① rise</text>
<text x="1872" y="410" class="or">③ drop</text>
<text x="1790" y="454" class="or" text-anchor="middle">④ return</text>
<text x="1790" y="484" class="l" text-anchor="middle">Path of the feed-dog teeth</text>
<text x="1358" y="664" class="n">The hook turns continuously, with no reciprocating shock; the feed dog</text>
<text x="1358" y="685" class="n">“rises, advances, drops, returns”, as almost all lockstitch machines still do</text>
</svg></div>
