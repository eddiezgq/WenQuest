<text x="1540" y="415.0" font-size="16" fill="#c4531d" font-weight="700" text-anchor="middle" >(depends on friction with the hook)</text>

<text x="177" y="764.0" font-size="15.5" fill="#1b2430" font-weight="400" text-anchor="start" >Regularities reported by the study: the highest peak is the tightening tension, set directly by the tension-assembly pre-tension; a thicker thread has a lower</text>
<text x="177" y="790.0" font-size="15.5" fill="#1b2430" font-weight="400" text-anchor="start" >tightening tension, which may upset the stitch balance; fabric thickness hardly affects needle-thread tension; speed has little effect near the tension assembly;</text>
<text x="177" y="816.0" font-size="15.5" fill="#1b2430" font-weight="400" text-anchor="start" >the bobbin pre-tension affects needle-thread tension only while the take-up lever rises and casts the loop off the hook. Curve shape and relative heights are illustrative.</text>
