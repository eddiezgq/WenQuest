</style><div class="fig" style="--w:1700px;width:1700px;height:780px"><p class="title">Cloth cannot be pushed, only pulled, supported or gripped: ways of feeding and grasping fabric</p><p class="sub">Left: a strip of cloth clamped vertically stands under its own weight only up to about 2c; right: several common fabric-gripping methods (illustrative)</p><svg width="1700" height="780"><rect x="40" y="120" width="640" height="620" rx="8" fill="#fff" stroke="#e2e5e8" stroke-width="1.5"/><text x="70" y="180" style="fill:#1b2430;font-size:15px;">Shirt poplin (c = 20 mm, B ≈ 9.4 μN·m)</text><text x="70" y="206" style="fill:#1b2430;font-size:15px;">clamped vertically: the greatest height it can stand</text><text x="70" y="232" style="fill:#1b2430;font-size:15px;">l = (7.84 B/w)^(1/3) ≈ 2c ≈ 4.0 cm</text><rect x="110" y="470" width="140" height="16" rx="2" fill="#5a6570"/><line x1="180" y1="470" x2="180" y2="397" stroke="#2e9e5b" stroke-width="4"/><rect x="350" y="470" width="140" height="16" rx="2" fill="#5a6570"/><path d="M420,470 C416,420 440,364 486,361" fill="none" stroke="#e0662f" stroke-width="4"/><text x="180" y="514" text-anchor="middle" style="fill:#1f8a4c;font-weight:700;font-size:15px">3 cm: stands</text><text x="420" y="514" text-anchor="middle" style="fill:#c4531d;font-weight:700;font-size:15px">8 cm: bends over</text><text x="70" y="570" style="fill:#1b2430;font-size:15px;">Pushing a 5 cm × 30 cm strip from one end (other end free to move sideways,</text><text x="70" y="594" style="fill:#1b2430;font-size:15px;">self-weight ignored): critical force F = π²Bb/(4L²) ≈ 2.8 mN; the strip weighs ≈ 17.7 mN.</text><text x="70" y="618" style="fill:#1b2430;font-size:15px;">So a sewing machine drags the cloth instead: the feed dog pulls from below,</text><text x="70" y="642" style="fill:#1b2430;font-size:15px;">and the presser foot presses from above.</text><g transform="translate(720,120)"><rect width="300" height="290" rx="7" fill="#fff" stroke="#2a6fdb" stroke-width="2"/><text x="150" y="29" text-anchor="middle" style="fill:#2a5fb8;font-weight:700;font-size:15.5px">Needle gripper</text><rect x="71" y="71" width="159" height="21" rx="3" fill="#5a6570"/><rect x="50" y="139" width="200" height="10" rx="2" fill="#f3eee0" stroke="#d8cfb4"/><line x1="91" y1="92" x2="98" y2="145" stroke="#1b2430" stroke-width="1.8"/><line x1="121" y1="92" x2="128" y2="145" stroke="#1b2430" stroke-width="1.8"/><line x1="151" y1="92" x2="158" y2="145" stroke="#1b2430" stroke-width="1.8"/><line x1="181" y1="92" x2="188" y2="145" stroke="#1b2430" stroke-width="1.8"/><line x1="211" y1="92" x2="218" y2="145" stroke="#1b2430" stroke-width="1.8"/><text x="150" y="218" text-anchor="middle" style="fill:#1b2430;font-size:13.5px">Fine needles driven obliquely into</text><text x="150" y="238" text-anchor="middle" style="fill:#1b2430;font-size:13.5px">the cloth hook it; suits thicker,</text><text x="150" y="258" text-anchor="middle" style="fill:#1b2430;font-size:13.5px">looser cloth; may leave needle holes</text></g><g transform="translate(1040,120)"><rect width="300" height="290" rx="7" fill="#fff" stroke="#2e9e5b" stroke-width="2"/><text x="150" y="29" text-anchor="middle" style="fill:#1f8a4c;font-weight:700;font-size:15.5px">Vacuum</text><rect x="90" y="91" width="120" height="49" rx="4" fill="#5a6570"/><rect x="50" y="139" width="200" height="10" rx="2" fill="#f3eee0" stroke="#d8cfb4"/><line x1="150" y1="125" x2="150" y2="68" stroke="#2e9e5b" stroke-width="2"/><path d="M143,72 L150,57 L157,72z" fill="#5a6570"/><text x="150" y="218" text-anchor="middle" style="fill:#1b2430;font-size:13.5px">Vacuum through the table or cups;</text><text x="150" y="238" text-anchor="middle" style="fill:#1b2430;font-size:13.5px">air-permeable cloth leaks, needs high</text><text x="150" y="258" text-anchor="middle" style="fill:#1b2430;font-size:13.5px">flow; single plies hard to separate</text></g><g transform="translate(1360,120)"><rect width="300" height="290" rx="7" fill="#fff" stroke="#c48a17" stroke-width="2"/><text x="150" y="29" text-anchor="middle" style="fill:#a8740c;font-weight:700;font-size:15.5px">Electroadhesion</text><rect x="71" y="99" width="159" height="36" rx="4" fill="#fbf0d4" stroke="#c48a17" stroke-width="1.6"/><text x="86" y="122" text-anchor="middle" style="fill:#a8740c;font-size:15px">−</text><text x="112" y="122" text-anchor="middle" style="fill:#a8740c;font-size:15px">+</text><text x="138" y="122" text-anchor="middle" style="fill:#a8740c;font-size:15px">−</text><text x="164" y="122" text-anchor="middle" style="fill:#a8740c;font-size:15px">+</text><text x="190" y="122" text-anchor="middle" style="fill:#a8740c;font-size:15px">−</text><text x="216" y="122" text-anchor="middle" style="fill:#a8740c;font-size:15px">+</text><rect x="50" y="141" width="200" height="10" rx="2" fill="#f3eee0" stroke="#d8cfb4"/><text x="150" y="218" text-anchor="middle" style="fill:#1b2430;font-size:13.5px">Electrode plates hold the cloth;</text><text x="150" y="238" text-anchor="middle" style="fill:#1b2430;font-size:13.5px">works well on thin cloth, single plies;</text><text x="150" y="258" text-anchor="middle" style="fill:#1b2430;font-size:13.5px">affected by humidity</text></g><g transform="translate(720,430)"><rect width="300" height="290" rx="7" fill="#fff" stroke="#8a5cc7" stroke-width="2"/><text x="150" y="29" text-anchor="middle" style="fill:#7444b4;font-weight:700;font-size:15.5px">Cryo-grip</text><rect x="70" y="100" width="160" height="35" rx="4" fill="#e9eefc" stroke="#8a5cc7" stroke-width="1.6"/><text x="150" y="123" text-anchor="middle" style="fill:#7444b4;font-size:15px">−20 °C</text><rect x="50" y="141" width="200" height="10" rx="2" fill="#f3eee0" stroke="#d8cfb4"/><text x="150" y="218" text-anchor="middle" style="fill:#1b2430;font-size:13.5px">Sprayed with water and frozen onto</text><text x="150" y="238" text-anchor="middle" style="fill:#1b2430;font-size:13.5px">a cold plate; firm grip, can pick a</text><text x="150" y="258" text-anchor="middle" style="fill:#1b2430;font-size:13.5px">single ply; must wait for it to thaw</text></g><g transform="translate(1040,430)"><rect width="300" height="290" rx="7" fill="#fff" stroke="#e0662f" stroke-width="2"/><text x="150" y="29" text-anchor="middle" style="fill:#c4531d;font-weight:700;font-size:15.5px">Stiffen the cloth</text><path d="M110,59 L110,110 L190,110 L190,59" fill="none" stroke="#1b2430" stroke-width="2.2"/><rect x="50" y="131" width="200" height="10" fill="#f0b49b"/><rect x="50" y="140" width="200" height="10" fill="#e8a483"/><text x="150" y="218" text-anchor="middle" style="fill:#1b2430;font-size:13.5px">Soaked in water-soluble resin, the cloth</text><text x="150" y="238" text-anchor="middle" style="fill:#1b2430;font-size:13.5px">handles like sheet, moved by ordinary</text><text x="150" y="258" text-anchor="middle" style="fill:#1b2430;font-size:13.5px">robot arms; washed out after sewing</text></g><g transform="translate(1360,430)"><rect width="300" height="290" rx="7" fill="#fff" stroke="#c8352b" stroke-width="2"/><text x="150" y="29" text-anchor="middle" style="fill:#c8352b;font-weight:700;font-size:15.5px">Vision + real-time correction</text><circle cx="99" cy="80" r="16" fill="#fff" stroke="#1b2430" stroke-width="2"/><line x1="105" y1="96" x2="129" y2="135" stroke="#c8352b" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="50" y="139" width="200" height="10" rx="2" fill="#f3eee0" stroke="#d8cfb4"/><circle cx="90" cy="158" r="7" fill="#c8352b"/><circle cx="116" cy="158" r="7" fill="#c8352b"/><circle cx="142" cy="158" r="7" fill="#c8352b"/><circle cx="168" cy="158" r="7" fill="#c8352b"/><circle cx="194" cy="158" r="7" fill="#c8352b"/><circle cx="220" cy="158" r="7" fill="#c8352b"/><text x="150" y="218" text-anchor="middle" style="fill:#1b2430;font-size:13.5px">Cameras and sensors recognise the</text><text x="150" y="238" text-anchor="middle" style="fill:#1b2430;font-size:13.5px">panel and keep adjusting its path</text><text x="150" y="258" text-anchor="middle" style="fill:#1b2430;font-size:13.5px">as it passes the sewing head</text></g></svg></div>
