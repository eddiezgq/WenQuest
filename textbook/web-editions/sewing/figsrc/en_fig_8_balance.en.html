<text x="177" y="800.0" font-size="15.5" fill="#1b2430" font-weight="400" text-anchor="start" >Inertia forces scale with the square of speed: at the same balance ratio, the maximum force at 6000 r/min is 1.44 times that at 5000 r/min. The minimum lies at k ≈ 0.45.</text>
<text x="177" y="826.0" font-size="15.5" fill="#1b2430" font-weight="400" text-anchor="start" >With only the needle bar and crank the best k is about 0.6; adding the take-up lever lowers it, because the first-order take-up inertia force is mainly horizontal and</text>
<text x="177" y="852.0" font-size="15.5" fill="#1b2430" font-weight="400" text-anchor="start" >a larger counterweight would only shift more force into the horizontal direction.</text>
