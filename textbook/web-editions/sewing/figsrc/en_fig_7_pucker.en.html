<text x="420" y="689.0" font-size="16" fill="#5a6570" font-weight="700" text-anchor="middle" >Stitches too loose</text>
<text x="120" y="435.0" font-size="16" fill="#5a6570" font-weight="400" text-anchor="middle" transform="rotate(-90 120 435)" >Seam shortening (%)</text>
<text x="713" y="762.0" font-size="17" fill="#5a6570" font-weight="400" text-anchor="middle" >Mean tension at the interlacing point (cN)</text>
<text x="1306" y="187.0" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >Model (illustrative):</text>
<text x="1306" y="215.2" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" ></text>
<text x="1306" y="243.4" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >During tightening the thread stretches</text>
<text x="1306" y="271.6" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >by ε = T / EA. Once sewn, the thread</text>
<text x="1306" y="299.8" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >springs back and shortens the seam by</text>
<text x="1306" y="328.0" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >ε × the thread used per cm of seam.</text>
<text x="1306" y="356.2" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >The fabric itself absorbs a small part;</text>
<text x="1306" y="384.4" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >the rest bulges into pucker.</text>
<text x="1306" y="412.6" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" ></text>
<text x="1306" y="440.8" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >At the same tension a thicker thread</text>
<text x="1306" y="469.0" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >(larger EA) stretches less and puckers</text>
<text x="1306" y="497.2" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >less — but on thin, tightly woven fabric</text>
<text x="1306" y="525.4" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >it causes structural pucker.</text>
<text x="1306" y="553.6" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" ></text>
<text x="1306" y="581.8" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >So the basic cure for tension pucker:</text>
<text x="1306" y="610.0" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >keep the stitch balanced and not loose,</text>
<text x="1306" y="638.2" font-size="16.5" fill="#1b2430" font-weight="400" text-anchor="start" >and bring both tensions to the minimum.</text>
