<script>(function () {
  var root = document.documentElement;
  try { var t = localStorage.getItem('sm-theme'); if (t) root.setAttribute('data-theme', t); } catch (e) {}
  var tb = document.querySelector('.theme');
  if (tb) tb.addEventListener('click', function () {
    var dark = root.getAttribute('data-theme') ? root.getAttribute('data-theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    var next = dark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('sm-theme', next); } catch (e) {}
    if (window.__drawSeam) window.__drawSeam();
  });

  // 公式
  function renderMath() {
    if (!window.katex) return;
    document.querySelectorAll('.math').forEach(function (el) {
      var tex = el.textContent.replace(/^\\\[|\\\]$/g, '');
      try { katex.render(tex, el, { displayMode: true, throwOnError: false }); } catch (e) {}
    });
  }
  if (document.readyState === 'complete') renderMath(); else window.addEventListener('load', renderMath);

  // 互动资源：页内运行
  document.querySelectorAll('.lab').forEach(function (card) {
    var btn = card.querySelector('.run'), box = card.querySelector('.lab-frame');
    btn.addEventListener('click', function () {
      if (box.hidden) {
        if (!box.firstChild) {
          var f = document.createElement('iframe');
          f.src = card.dataset.src; f.title = card.querySelector('h4').textContent; f.loading = 'lazy';
          f.setAttribute('allow', 'fullscreen');
          box.appendChild(f);
        }
        box.hidden = false; card.classList.add('running'); btn.textContent = '收起';
      } else { box.hidden = true; card.classList.remove('running'); btn.textContent = '在本页运行'; }
    });
  });
  // 正文里指向资源的链接：滚到卡片并展开
  document.querySelectorAll('a.labref').forEach(function (a) {
    a.addEventListener('click', function (ev) {
      var card = document.querySelector(a.getAttribute('href'));
      if (!card) return;
      ev.preventDefault();
      card.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
      var box = card.querySelector('.lab-frame');
      if (box && box.hidden) card.querySelector('.run').click();
    });
  });

  // 看大图
  var lb = document.querySelector('.lightbox');
  if (lb) {
    document.querySelectorAll('a.zoom').forEach(function (a) {
      a.addEventListener('click', function (ev) { ev.preventDefault(); lb.querySelector('img').src = a.getAttribute('href'); lb.hidden = false; });
    });
    lb.addEventListener('click', function () { lb.hidden = true; });
    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') lb.hidden = true; });
  }

  // 本章目录高亮
  var links = Array.prototype.slice.call(document.querySelectorAll('.side a'));
  if (links.length && 'IntersectionObserver' in window) {
    var map = {};
    links.forEach(function (a) { map[a.getAttribute('href').slice(1)] = a; });
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (e.isIntersecting) { links.forEach(function (a) { a.classList.remove('on'); }); var a = map[e.target.id]; if (a) a.classList.add('on'); }
      });
    }, { rootMargin: '-80px 0px -70% 0px' });
    Object.keys(map).forEach(function (id) { var h = document.getElementById(id); if (h) io.observe(h); });
  }

  // 封面：301 锁式线迹动画
  var cv = document.getElementById('seamCanvas');
  if (cv) {
    var g = cv.getContext('2d'), W = 560, H = 360, P = 64, t0 = performance.now();
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    function css(n) { return getComputedStyle(root).getPropertyValue(n).trim(); }
    function draw(now) {
      var ph = reduce ? 0.9 : ((now - t0) / 1600) % 1;
      var cyc = reduce ? 0 : Math.floor((now - t0) / 1600);
      var feed = ph > 0.7 ? (ph - 0.7) / 0.3 : 0;
      feed = 0.5 - 0.5 * Math.cos(Math.PI * feed);
      var xN = W * 0.66, yT = 150, yB = 214, yM = (yT + yB) / 2;
      var ink = css('--ink'), nd = css('--needle'), bb = css('--bobbin'), rule = css('--rule'), soft = css('--soft');
      g.clearRect(0, 0, W, H);
      // 布层
      g.fillStyle = soft; g.fillRect(0, yT, W, yM - yT - 1); g.fillRect(0, yM + 1, W, yB - yM - 1);
      g.strokeStyle = rule; g.lineWidth = 1; g.strokeRect(-1, yT, W + 2, yB - yT);
      g.beginPath(); g.moveTo(0, yM); g.lineTo(W, yM); g.stroke();
      // 已完成的针迹点（随送布向左移）
      var pts = [];
      for (var k = 0; k < 12; k++) pts.push(xN - k * P - feed * P);
      g.lineWidth = 3; g.lineCap = 'round'; g.lineJoin = 'round';
      // 面线
      g.strokeStyle = nd; g.beginPath();
      g.moveTo(pts[pts.length - 1] - P, yT - 2);
      for (k = pts.length - 1; k >= 1; k--) { g.lineTo(pts[k] - 3, yT - 2); g.lineTo(pts[k] - 1.5, yM); g.lineTo(pts[k] + 1.5, yM); g.lineTo(pts[k] + 3, yT - 2); }
      g.lineTo(pts[0] - 3, yT - 2); g.stroke();
      // 底线
      g.strokeStyle = bb; g.beginPath();
      g.moveTo(pts[pts.length - 1] - P, yB + 2);
      for (k = pts.length - 1; k >= 1; k--) { g.lineTo(pts[k] - 3, yB + 2); g.lineTo(pts[k] - 1.5, yM + 1); g.lineTo(pts[k] + 1.5, yM + 1); g.lineTo(pts[k] + 3, yB + 2); }
      g.lineTo(pts[0], yB + 2); g.stroke();
      // 机针：0 在最高点，0.5 在最低点
      var depth = 0.5 - 0.5 * Math.cos(2 * Math.PI * Math.min(ph / 0.7, 1));
      var tip = 60 + depth * 230, x = pts[0];
      g.fillStyle = ink; g.fillRect(x - 3, 0, 6, tip - 10);
      g.beginPath(); g.moveTo(x - 3, tip - 10); g.lineTo(x, tip); g.lineTo(x + 3, tip - 10); g.fill();
      // 针线随针下行，过布后形成线环
      g.strokeStyle = nd; g.lineWidth = 3; g.beginPath(); g.moveTo(pts[1] + 3, yT - 2); g.lineTo(x - 5, yT - 2);
      if (tip > yT) { g.lineTo(x - 5, Math.min(tip - 14, H)); }
      g.stroke();
      if (tip > yB + 30) {
        var loop = Math.min(1, (tip - yB - 30) / 60);
        g.beginPath(); g.ellipse(x + 10, tip - 24, 10 + 8 * loop, 14 * loop + 4, 0, 0, Math.PI * 2); g.stroke();
        // 旋梭钩尖从右下方掠过
        var hx = x + 120 - 140 * Math.min(1, Math.max(0, (ph - 0.3) / 0.3));
        g.strokeStyle = bb; g.lineWidth = 2; g.beginPath(); g.arc(hx, tip + 30, 34, Math.PI * 1.1, Math.PI * 1.55); g.stroke();
      }
      // 刻度：针距
      g.fillStyle = css('--muted'); g.font = '12px ' + css('--f-mono');
      g.strokeStyle = rule; g.lineWidth = 1;
      g.beginPath(); g.moveTo(pts[2], yB + 46); g.lineTo(pts[1], yB + 46); g.stroke();
      g.textAlign = 'center'; g.fillText('针距', (pts[1] + pts[2]) / 2, yB + 64);
      g.textAlign = 'left'; g.fillText('布面', 12, yT - 12); g.fillText('布底', 12, yB + 22);
      g.fillText('第 ' + (cyc + 1) + ' 针', W - 70, 24);
      if (!reduce) requestAnimationFrame(draw);
    }
    window.__drawSeam = function () { if (reduce) draw(performance.now()); };
    requestAnimationFrame(draw);
  }
})();
</script>
