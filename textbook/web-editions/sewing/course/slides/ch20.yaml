      - "Three things to remember. One: the encoder is forwarded one-to-one, so the controller owns the angle. Two: the trim event table is written in angle; the actual action angle is the command plus six times n times t, and a new speed means a new table. Three: bring a prototype up step by step, zero it with the symmetric two-point method, and judge acceptance requirement by requirement, keeping stop error and trim success apart. The assignment, quiz and Lab 20-1 report are on WenQuest. Next time: prototypes of the pattern sewer and the flat-knitting machine."
