          <text x="115" y="340" font-size="22" fill="#ff9c75" text-anchor="middle" class="zh">任一故障</text><text x="115" y="340" font-size="22" fill="#ff9c75" text-anchor="middle" class="eo">any fault</text>
          <g transform="translate(20,390)">
            <rect width="860" height="66" rx="12" fill="rgba(242,183,5,.14)"/><text x="24" y="44" font-size="28" font-weight="700" fill="#f2b705">10 kHz</text><text x="170" y="44" font-size="26" fill="#f3f6fa" class="zh">编码器 · 事件表 · 回针计数</text><text x="170" y="44" font-size="26" fill="#f3f6fa" class="eo">Encoder · event table · backtack count</text>
            <rect y="82" width="860" height="66" rx="12" fill="rgba(46,196,182,.14)"/><text x="24" y="126" font-size="28" font-weight="700" fill="#5ee0d2">1 kHz</text><text x="170" y="126" font-size="26" fill="#f3f6fa" class="zh">状态机 · 速度曲线 · 位置环</text><text x="170" y="126" font-size="26" fill="#f3f6fa" class="eo">State machine · speed profile · position loop</text>
            <rect y="164" width="860" height="66" rx="12" fill="rgba(76,141,255,.14)"/><text x="24" y="208" font-size="28" font-weight="700" fill="#8fbaff" class="zh">后台</text><text x="24" y="206" font-size="21" font-weight="700" fill="#8fbaff" class="eo">Background</text><text x="170" y="208" font-size="26" fill="#f3f6fa" class="zh">脚踏 · 参数 · 日志 · 网关</text><text x="170" y="208" font-size="26" fill="#f3f6fa" class="eo">Pedal · parameters · logs · gateway</text></g>
        </svg>
    notes:
      - "固件沿用第 19 章的框架。上面是状态机：IDLE 压脚落下等脚踏，RUN 调速，SLOW 减到剪线转速，TRIM 剪线事件表生效，POSITION 位置环停到上针位，然后回到 IDLE 拨线、抬压脚；任何状态出了故障都进 SAFE。下面是三层任务：10 千赫的角度中断读编码器、扫描事件表、数回针；1 千赫的控制任务跑状态机、速度曲线和位置环；后台处理脚踏、参数、日志和网关。事件放在 10 千赫中断里，300 转时最大触发误差只有 {{ch20.scan300:.2f}} 度，比电磁铁的散布小一个数量级。"
      - "The firmware uses Chapter 19's framework. On top, the state machine: IDLE with the foot down, waiting for the pedal; RUN for speed control; SLOW down to trimming speed; TRIM with the event table active; POSITION, where the position loop stops at needle-up; then back to IDLE to wipe and lift the foot. A fault in any state goes to SAFE. Below, three task levels: a 10 kilohertz angle interrupt that reads the encoder, scans the event table and counts backtack stitches; a 1 kilohertz control task for the state machine, speed profile and position loop; and background work for the pedal, parameters, logs and gateway. With events in the 10 kilohertz interrupt, the worst trigger error at 300 r/min is only {{ch20.scan300:.2f}} degrees, an order of magnitude below the solenoid spread."

  - layout: figure
    title: ["剪线事件表：转速一变，表就要改", "The trim event table: change speed, change the table"]
    visual: {video: evc}
    h: 560
    caption: ["剪线转速 300 ↔ 700 r/min 交替：深色条是实际动作范围", "Trimming at 300 ↔ 700 r/min: dark bars are actual action"]
    notes:
      - "这是实验 20-1 里的剪线事件表。橙色条是剪线发令，青色条是松线，浅绿色是第 14 章的窗口，深色是按电磁铁延迟算出的实际动作范围。注意看转速在 300 和 700 之间切换时，深色条怎样向后移、怎样变宽：转速越高，同样的毫秒折合的度数越多。所以事件表按转角写，剪线转速一变，表就要改。拨线、抬压脚在主轴停稳以后，按时间排。"
      - "This is the trim event table from Lab 20-1. Orange is the trim command, teal the tension release, pale green the Chapter 14 windows, and the dark bars are the actual action ranges computed from the solenoid delay. Watch the speed switch between 300 and 700: the dark bars slide later and get wider. The faster the spindle, the more degrees the same milliseconds cover. So the table is written in angle, and when the trimming speed changes, the table must change. Wipe and foot lift come after the spindle stops, timed in milliseconds."

  - layout: bignum
    title: ["算例：300 r/min 时剪线该在几度通电", "Worked example: the trim angle at 300 r/min"]
    nums:
      - {n: "{{ch20.deg_ms_300:.1f}}°/ms", label: ["每毫秒主轴转过 6n/1000", "Spindle degrees per ms, 6n/1000"]}
      - {n: "{{ch20.p300_mean:.1f}}°", label: ["平均提前量（吸合折角的中点）", "Mean lead (mid pull-in angle)"]}
      - {n: "300°", n_en: "≈ {{ch20.trim_c300:.0f}}°", label: ["315° − 平均提前 → 取整", "315° minus the mean lead, rounded"]}
    foot: ["实际进刀角 = 发令角 + 6nt：进刀落在 {{ch20.ent_lo:.0f}}°–{{ch20.ent_hi:.0f}}°，两边各有十几度余量", "Actual entry = command + 6nt: entry at {{ch20.ent_lo:.0f}}°–{{ch20.ent_hi:.0f}}°, over ten degrees of margin each side"]
    notes:
      - "现在算初值。动刀实际进刀角等于发令角加 6 乘 n 乘 t。300 转时主轴每毫秒转 {{ch20.deg_ms_300:.1f}} 度，吸合 {{ch20.tp_min:.1f}} 到 {{ch20.tp_max:.1f}} 毫秒，折合 {{ch20.p300_lo:.1f}} 到 {{ch20.p300_hi:.1f}} 度，中点约 {{ch20.p300_mean:.1f}} 度。窗口中心 315 度减去它，得 {{ch20.trim_c300:.0f}} 度，取 300 度。这样实际进刀落在 {{ch20.ent_lo:.0f}} 到 {{ch20.ent_hi:.0f}} 度，离窗口两边各有十几度。"
      - "Now the initial value. The actual knife entry equals the command angle plus six times n times t. At 300 r/min the spindle turns {{ch20.deg_ms_300:.1f}} degrees per millisecond; pull-in of {{ch20.tp_min:.1f}} to {{ch20.tp_max:.1f}} milliseconds is {{ch20.p300_lo:.1f}} to {{ch20.p300_hi:.1f}} degrees, with a midpoint of about {{ch20.p300_mean:.1f}}. Take that from the window centre, 315, and you get {{ch20.trim_c300:.0f}}; we use 300. The knife then enters between {{ch20.ent_lo:.0f}} and {{ch20.ent_hi:.0f}} degrees, more than ten degrees inside the window on each side."

  - layout: split
    title: ["自动回针：在送布空闲角里切换", "Auto backtack: switch inside the feed idle angle"]
    points:
      - ["送布牙在针板下：114.2°–325.8°", "Feed dog below the plate: 114.2°–325.8°"]
      - ["留 10° 余量：n_max = 201.6 / (6t)", "With 10° margin: n_max = 201.6 / (6t)"]
      - ["回针转速取 1500 r/min", "Backtack speed: 1500 r/min"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><style>html:not(.en-only) .eo{display:none}</style>
          <circle cx="300" cy="300" r="210" fill="none" stroke="#22324d" stroke-width="40"/>
          <path d="M 491.6 386.1 A 210 210 0 1 1 182.0 126.3" fill="none" stroke="#2ec4b6" stroke-width="40"/>
          <text x="300" y="285" font-size="34" font-weight="800" fill="#5ee0d2" text-anchor="middle" class="zh">空闲角</text><text x="300" y="285" font-size="34" font-weight="800" fill="#5ee0d2" text-anchor="middle" class="eo">Idle angle</text>
          <text x="300" y="330" font-size="30" fill="#f3f6fa" text-anchor="middle" class="en">211.6°</text>
          <text x="525" y="440" font-size="24" fill="#8fa3ba">114.2°</text>
          <text x="60" y="100" font-size="24" fill="#8fa3ba">325.8°</text>
          <text x="300" y="560" font-size="22" fill="#8fa3ba" text-anchor="middle" class="zh">0° = 针杆上止点（顺时针）</text><text x="300" y="560" font-size="22" fill="#8fa3ba" text-anchor="middle" class="eo">0° = needle-bar TDC (clockwise)</text>
          <g transform="translate(580,120)">
            <text x="0" y="0" font-size="26" fill="#8fa3ba" class="zh">倒缝电磁铁延迟</text><text x="0" y="0" font-size="26" fill="#8fa3ba" class="eo">Backtack solenoid delay</text>
            <text x="0" y="60" font-size="30" font-weight="700" fill="#f3f6fa">18 ms → <tspan fill="#f2b705">{{ch20.bt18:.0f}}</tspan></text>
            <text x="0" y="115" font-size="30" font-weight="700" fill="#f3f6fa">22 ms → <tspan fill="#ff7a45">{{ch20.bt22:.0f}}</tspan></text>
            <text x="0" y="160" font-size="22" fill="#8fa3ba" class="zh">最高转速 r/min</text><text x="0" y="160" font-size="22" fill="#8fa3ba" class="eo">Top speed, r/min</text>
          </g>
        </svg>
    notes:
      - "回针的关键，是在送布牙沉到针板下面的时候切换方向。第 14 章算过这段是 114.2 到 325.8 度，空闲角 211.6 度。倒缝电磁铁推的是连杆和弹簧，比剪线电磁铁慢，延迟 18 到 22 毫秒。留 10 度余量，可用 201.6 度，转速上限就是 201.6 除以 6 乘 t：18 毫秒时 {{ch20.bt18:.0f}} 转，22 毫秒时 {{ch20.bt22:.0f}} 转。所以回针转速取 1500 转，最慢时折合 {{ch20.bt1500:.0f}} 度，仍在可用范围内。"
      - "The key to backtack is switching direction while the feed dog is below the throat plate. Chapter 14 found that to be 114.2 to 325.8 degrees, an idle angle of 211.6. The backtack solenoid moves a link and a spring, so it's slower than the trim solenoid: 18 to 22 milliseconds. Keep 10 degrees of margin and 201.6 are usable, so the speed limit is 201.6 over six t: {{ch20.bt18:.0f}} r/min at 18 milliseconds, {{ch20.bt22:.0f}} at 22. So backtack runs at 1500 r/min; the slowest case is {{ch20.bt1500:.0f}} degrees, still inside."

  - layout: section
    num: "03"
    title: ["逐步调试：每步只引入一个新东西", "Bring-up: one new thing at a time"]

  - layout: chain
    title: ["六步上电，每步有判据", "Six steps to power-up, each with a criterion"]
    steps: [["0 不通电", "Unpowered"], ["1 只上 24 V", "24 V only"], ["2 标编码器", "Encoder"], ["3 伺服整定", "Servo tuning"], ["4 标电磁铁", "Solenoids"], ["5 穿线试缝", "Sew"]]
    hot: [2, 4]
    mark: ["本节重点", "this section"]
    foot: ["点动电磁铁看三样：推对了杆、方向对、电流回读有“凹口”", "Jogging a solenoid, check three things: right lever, right direction, a dip in the current trace"]
    notes:
      - "原型第一次通电，最忌讳全接好就按启动。正确做法是一步一步来：第 0 步不通电，查保护地、绝缘和接线；第 1 步只上 24 伏，先确认急停真能断，再逐路点动电磁铁，看推对了杆没有、方向对不对、电流波形上有没有那个凹口，有凹口说明衔铁真的动了；第 2 步标编码器，第 3 步伺服整定，第 4 步按转角标电磁铁，第 5 步才穿线试缝。调试记录后来就是测试用例的来源。"
      - "On first power-up, never wire everything and just press start. Go step by step. Step 0, unpowered: protective earth, insulation, wiring. Step 1, 24 volts only: first make sure the E-stop really cuts, then jog each solenoid and check the lever, the direction, and the dip in the current trace, which tells you the armature really moved. Step 2, calibrate the encoder; step 3, tune the servo; step 4, calibrate the solenoids by angle; only step 5 threads up and sews. The bring-up log later becomes the test cases."

  - layout: split
    title: ["标编码器：先看方向，再找上止点", "Encoder: direction first, then top dead centre"]
    points:
      - ["正转读数应增大，反了会飞车", "Turn forward: the reading must rise, or it runs away"]
      - ["上止点附近针杆几乎不动", "Near TDC the needle bar barely moves"]
      - ["离上止点 1.8° 只降 {{ch20.drop18:.2f}} mm", "1.8° from TDC it drops only {{ch20.drop18:.2f}} mm"]
    visual: {video: cal}
    notes:
      - "编码器的 Z 相和针杆上止点没有关系，计数方向也可能反。先查方向：手轮正转，读数应该增大；反了就在参数里取反。方向反了速度环就成了正反馈，一启动就飞车。再找上止点。最直接的想法是用百分表找针杆最高点，可是看右边的动画：曲柄滑块在上止点附近几乎不动，离上止点 1.8 度时针杆只下降 {{ch20.drop18:.2f}} 毫米，百分表读不出来。"
      - "The encoder's Z mark has nothing to do with needle-bar top dead centre, and the count direction may be reversed. Check direction first: turn the handwheel forward, and the reading must rise. If it falls, invert it in the parameters; reversed, the velocity loop becomes positive feedback and the machine runs away. Then find TDC. The obvious idea is to find the highest point with a dial gauge. But watch the animation: near TDC the slider-crank hardly moves. 1.8 degrees from TDC the needle bar has dropped only {{ch20.drop18:.2f}} millimetres, below what the gauge can read."

  - layout: split
    title: ["对称两点法：在陡处取同一读数", "Symmetric two points: one reading on both steep sides"]
    points:
      - ["12 mm 处：下行记 r₁，上行记 r₂", "At 12 mm: note r₁ going down, r₂ coming up"]
      - ["下止点 = (r₁ + r₂)/2", "Bottom dead centre = (r₁ + r₂)/2"]
      - ["偏置 Δ = 180° − 下止点", "Offset Δ = 180° − BDC"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><style>html:not(.en-only) .eo{display:none}</style>
          <path d="M40 90 C 190 90, 250 560, 450 560 C 650 560, 710 90, 860 90" fill="none" stroke="#f3f6fa" stroke-width="7"/>
          <path d="M40 300 L860 300" stroke="#ff7a45" stroke-width="4" stroke-dasharray="14 10"/>
          <circle cx="233" cy="300" r="16" fill="#ff7a45"/><circle cx="667" cy="300" r="16" fill="#ff7a45"/>
          <text x="190" y="312" font-size="38" font-weight="800" fill="#ff9c75" text-anchor="end" class="en">r₁</text>
          <text x="710" y="312" font-size="38" font-weight="800" fill="#ff9c75" class="en">r₂</text>
          <text x="450" y="285" font-size="28" fill="#ff9c75" text-anchor="middle" class="zh">百分表同一读数 12.00 mm</text><text x="450" y="285" font-size="28" fill="#ff9c75" text-anchor="middle" class="eo">Same gauge reading: 12.00 mm</text>
          <path d="M450 560 L450 340" stroke="#f2b705" stroke-width="5" stroke-dasharray="10 8"/>
          <text x="450" y="390" font-size="34" font-weight="800" fill="#f2b705" text-anchor="middle">(r₁+r₂)/2</text>
          <text x="450" y="612" font-size="28" fill="#c7d3e2" text-anchor="middle" class="zh">下止点 BDC</text><text x="450" y="612" font-size="28" fill="#c7d3e2" text-anchor="middle" class="eo">BDC</text>
          <text x="40" y="50" font-size="28" fill="#8fa3ba" class="zh">上止点：曲线平，读不准</text><text x="40" y="50" font-size="28" fill="#8fa3ba" class="eo">At TDC: flat, hard to read</text>
          <text x="860" y="50" font-size="28" fill="#5ee0d2" text-anchor="end" class="zh">陡处：0.01 mm ≈ {{ch20.res001:.2f}}°</text><text x="860" y="50" font-size="28" fill="#5ee0d2" text-anchor="end" class="eo">Steep side: 0.01 mm ≈ {{ch20.res001:.2f}}°</text>
        </svg>
    notes:
      - "办法是改到针杆运动快的地方去测。针杆位移曲线关于上下止点对称，选离上止点 12 毫米这个读数，下行经过时记 r1，上行经过时记 r2，两次平均就是下止点，偏置等于 180 度减下止点。在这里百分表的 0.01 毫米只对应约 {{ch20.res001:.2f}} 度，比在上止点找最高点准了几十倍。"
      - "The trick is to measure where the needle bar moves fast. The displacement curve is symmetric about the dead centres. Pick the reading 12 millimetres below TDC; note r1 as the bar passes it going down and r2 coming up. Their average is bottom dead centre, and the offset is 180 degrees minus that. Here 0.01 millimetre on the gauge is only about {{ch20.res001:.2f}} degrees, dozens of times better than hunting for the top."

  - layout: bignum
    title: ["算例：读数跨过 360° 时先加 360°", "Worked example: add 360° when the readings wrap"]
    nums:
      - {n: "307.6°", n_en: "137.2°", label: ["下行 r₁ / 上行 r₂", "r₁ down / r₂ up"]}
      - {n: "{{ch20.bdc:.1f}}°", label: ["(307.6 + 137.2 + 360)/2 − 360", "(307.6 + 137.2 + 360)/2 − 360"]}
      - {n: "{{ch20.zoff:.1f}}°", label: ["偏置 Δ = 180° − 下止点", "Offset Δ = 180° − BDC"]}
    foot: ["上止点处找最高点有 ±1.8° 不确定度；陡处 0.01 mm 只对应约 {{ch20.res001:.2f}}°", "Hunting the top leaves ±1.8°; on the steep side 0.01 mm is only about {{ch20.res001:.2f}}°"]
    notes:
      - "看一个算例。下行读到 307.6 度，上行读到 137.2 度。注意针杆从下行到上行跨过了 360 度，所以上行读数先加 360 再平均，得到 {{ch20.bdc:.1f}} 度，这就是现在读数系统里的下止点。偏置等于 180 减 {{ch20.bdc:.1f}}，{{ch20.zoff:.1f}} 度，写进参数，读数就符合书里的约定：0 度是针杆上止点。"
      - "A worked example. Going down the encoder reads 307.6 degrees, coming up 137.2. The reading wrapped through 360 in between, so add 360 to the second before averaging: {{ch20.bdc:.1f}} degrees, the bottom dead centre in the current reading. The offset is 180 minus {{ch20.bdc:.1f}}, which is {{ch20.zoff:.1f}} degrees. Write that into the parameters, and the reading follows the book's convention: zero is needle-bar top dead centre."

  - layout: split
    title: ["在转角上标定电磁铁", "Calibrating solenoids in the angle domain"]
    points:
      - ["不穿线、匀速转，在固定角 φc 通电", "No thread, steady speed, fire at a fixed φc"]
      - ["电流凹口谷底时的主轴角 φp", "Note the shaft angle φp at the current dip"]
      - ["Δφ 对转速是直线，斜率 6t", "Δφ against speed is a line of slope 6t"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><style>html:not(.en-only) .eo{display:none}</style>
          <path d="M100 540 L860 540 M100 540 L100 60" stroke="#4b5f7d" stroke-width="3"/>
          <path d="M100 540 L840 140" stroke="#ff7a45" stroke-width="5"/>
          <path d="M100 540 L840 240" stroke="#2ec4b6" stroke-width="5"/>
          <g fill="#f2b705"><circle cx="300" cy="432" r="10"/><circle cx="400" cy="378" r="10"/><circle cx="600" cy="270" r="10"/>
            <circle cx="300" cy="459" r="10"/><circle cx="400" cy="419" r="10"/><circle cx="600" cy="338" r="10"/></g>
          <text x="690" y="150" font-size="26" font-weight="700" fill="#ff9c75" class="zh">热线圈</text><text x="690" y="150" font-size="26" font-weight="700" fill="#ff9c75" class="eo">Hot coil</text>
          <text x="690" y="300" font-size="26" font-weight="700" fill="#5ee0d2" class="zh">冷线圈</text><text x="690" y="300" font-size="26" font-weight="700" fill="#5ee0d2" class="eo">Cold coil</text>
          <text x="300" y="580" font-size="24" fill="#8fa3ba" text-anchor="middle" class="en">200</text>
          <text x="400" y="580" font-size="24" fill="#8fa3ba" text-anchor="middle" class="en">300</text>
          <text x="600" y="580" font-size="24" fill="#8fa3ba" text-anchor="middle" class="en">500</text>
          <text x="790" y="580" font-size="24" fill="#8fa3ba" text-anchor="middle">r/min</text>
          <text x="110" y="50" font-size="26" fill="#8fa3ba" class="zh">吸合角 Δφ = φp − φc = 6nt</text><text x="110" y="50" font-size="26" fill="#8fa3ba" class="eo">Pull-in angle Δφ = φp − φc = 6nt</text>
        </svg>
    notes:
      - "伺服整定好以后，标定电磁铁。延迟最后要折算成转角，所以标定直接在转角上做：不穿线，主轴以剪线转速匀速转，固件在固定角通电，同时以 10 千赫记录线圈电流，凹口谷底就是衔铁吸到底的时刻，记下那时的主轴角。在 200、300、500 转各做 20 次，吸合角对转速是一条过原点的直线，斜率就是 6 乘 t。冷热各测一次，300 转时冷热相差约 {{ch20.hot_shift:.1f}} 度。"
      - "With the servo tuned, calibrate the solenoids. The delay ends up as an angle, so calibrate it in angle. No thread, the spindle turning steadily at trimming speed, the firmware fires at a fixed angle and records the coil current at 10 kilohertz. The bottom of the dip is when the armature seats; note the shaft angle there. Do 20 runs each at 200, 300 and 500 r/min: pull-in angle against speed is a straight line through the origin with slope six t. Measure cold and hot; at 300 r/min they differ by about {{ch20.hot_shift:.1f}} degrees."

  - layout: lab
    title: ["动手试一试：平缝机原型调试台", "Try it: the lockstitch prototype bench"]
    shot: {page: proto-ls}
    tasks:
      - ["先判方向，再用对称两点法标 Z 相偏置", "Check direction, then set the Z offset by two points"]
      - ["打乱事件表后改回一张能用的表", "Scramble the event table, then make it work again"]
      - ["把剪线转速提到 700，看表和指标", "Raise trimming to 700 and watch table and limit"]
    notes:
      - "这台调试台在问渠平台上可以自己动手。它的编码器装反了，Z 相也不在上止点。先转手轮判断计数方向，再用对称两点法求偏置写进去，看判定区的残差。然后按“打乱事件表”，自己改回一张七项判定全过的表，试缝 100 次看合格率。最后把剪线转速提到 700，看事件表要怎么改、平台指标还满不满足。"
      - "You can work this bench yourself on WenQuest. Its encoder is fitted backwards and the Z mark is not at TDC. Turn the handwheel to check the count direction, then find the offset by the two-point method, write it, and check the residual. Next press Scramble, rebuild a table that passes all seven checks, and run 100 trial trims. Finally raise trimming to 700 r/min and see how the table must change and whether the platform limit still holds."

  - layout: section
    num: "04"
    title: ["验收：调通不等于达标", "Acceptance: running is not meeting spec"]

  - layout: duo
    title: ["试缝一次看过程，试缝 100 次看统计", "One trim to watch, a hundred to count"]
    left: {video: sew, label: ["慢放剪线那一针", "The trim stitch in slow motion"], note: ["进刀、剪断、停针逐项判", "Entry, cut, stop each judged"]}
    right: {video: stat, label: ["100 次随机工况", "100 random conditions"], note: ["电压、线温、转速都随机", "Voltage, coil heat, speed vary"]}
    notes:
      - "验收在测试台上自动执行：脚本下发命令、读回测量、按需求编号判定、写报告。左边是试缝一次，先快放缝几针，再慢放剪线那一针，看动刀进刀、剪断、松线、停针一项项判定。右边是试缝 100 次，每一次的电源电压、线圈温度、转速和摩擦都随机，看合格数和分布。测试台搭好以前，可以先在软件里跑同样的脚本。"
      - "Acceptance runs automatically on the test bench: a script sends commands, reads back measurements, judges by requirement ID and writes the report. On the left, one trim: a few fast stitches, then the trim stitch in slow motion, with knife entry, cut, release and stop judged one by one. On the right, a hundred trims, each with random supply voltage, coil temperature, speed and friction; look at the pass count and the spread. Before the bench exists, the same script can run in software."

  - layout: bignum
    title: ["软件在环 1000 次：标准事件表、300 r/min", "1000 software-in-the-loop runs: standard table, 300 r/min"]
    nums:
      - {n: "{{ch20.mc_ok:.0f}}", n_en: "/ 1000", label: ["全部合格", "All passed"]}
      - {n: "{{ch20.mc_e_lo:.1f}}°", n_en: "to {{ch20.mc_e_hi:.1f}}°", label: ["动刀进刀角", "Knife entry angle"]}
      - {n: "{{ch20.mc_s_lo:.2f}}°", n_en: "to {{ch20.mc_s_hi:.2f}}°", label: ["停针误差（全为负）", "Stop error (all negative)"]}
    foot: ["停针误差全为负：记录的是“停稳”置位那一刻，位置环从下方逼近", "All stop errors are negative: logged when 'stopped' is set, the loop approaching from below"]
    notes:
      - "用模型随机仿真 1000 次，标定残差 0.1 度、300 转、标准事件表：{{ch20.mc_ok:.0f}} 次全部合格。进刀角在 {{ch20.mc_e_lo:.1f}} 到 {{ch20.mc_e_hi:.1f}} 度，停针误差在 {{ch20.mc_s_lo:.2f}} 到 {{ch20.mc_s_hi:.2f}} 度之间。为什么全是负的？因为记录的是“停稳”标志置位的那一刻，位置环是从下方逼近目标的。"
      - "A thousand random runs of the model, with 0.1 degree calibration residual, 300 r/min and the standard table: all {{ch20.mc_ok:.0f}} pass. Knife entry falls between {{ch20.mc_e_lo:.1f}} and {{ch20.mc_e_hi:.1f}} degrees, and the stop error between {{ch20.mc_s_lo:.2f}} and {{ch20.mc_s_hi:.2f}} degrees. Why all negative? Because it's logged the moment the stopped flag is set, and the position loop approaches from below."

  - layout: points
    title: ["停针误差和剪线成功率：分成两条需求", "Stop error and trim success: two requirements"]
    points:
      - ["标定残差 0.7°：剪线全成功", "Calibration residual 0.7°: every trim succeeds"]
      - ["停针却全部超出 ±1°", "Yet every stop falls outside ±1°"]
      - ["残差直接叠加到停针误差上", "The residual adds straight onto stop error"]
    foot: ["模型给不出的项目（回针对齐、4 h 温升）填“待实测”，不编数；每行带固件和事件表版本号", "What the model can't give (backtack alignment, 4 h temperature rise) waits for measurement; every row carries firmware and table versions"]
    notes:
      - "在软件里换不同工况跑，最有意思的是标定残差 0.7 度这个工况：剪线全部成功，停针却全部超出正负 1 度。剪线窗口有十几度余量，0.7 度不影响；停针要求正负 1 度，残差直接叠加上去就超了。所以停针误差和剪线成功率必须分成两条需求，各自判定。还有，模型给不出的项目，比如回针对齐、4 小时温升，就填“待实测”，不编数字。"
      - "Run in software under different conditions, the most interesting case is a calibration residual of 0.7 degrees. Every trim succeeds, yet every stop falls outside plus or minus one degree. The trim window has over ten degrees of margin, so 0.7 doesn't matter there; the stop tolerance is one degree, and the residual adds straight onto it. That's why stop error and trim success must be two separate requirements, judged separately. And what the model can't give, such as backtack alignment or a four-hour temperature rise, is marked 'to be measured'. No made-up numbers."

  - layout: section
    num: "05"
    title: ["包缝机原型：差在哪里", "The overlock prototype: what changes"]

  - layout: split
    title: ["传动比要让每转计数是整数", "The ratio must give whole counts per revolution"]
    points:
      - ["平台电机最高 6000 r/min，需升速", "The platform motor tops out at 6000: gear up"]
      - ["i = 1.25：每主轴转 {{ch20.cnt125:.0f}} 计数", "i = 1.25: {{ch20.cnt125:.0f}} counts per spindle rev"]
      - ["再加上针位传感器，每转核对", "Add a needle-up sensor to check every turn"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><style>html:not(.en-only) .eo{display:none}</style>
          <g transform="translate(40,40)"><rect width="820" height="230" rx="24" fill="rgba(46,196,182,.1)" stroke="#2ec4b6" stroke-width="3"/>
            <text x="40" y="70" font-size="34" font-weight="800" fill="#5ee0d2" class="zh">i = 1.25（30 齿 : 24 齿）</text><text x="40" y="70" font-size="34" font-weight="800" fill="#5ee0d2" class="eo">i = 1.25 (30 : 24 teeth)</text>
            <text x="40" y="140" font-size="30" fill="#f3f6fa">10000 / 1.25 = <tspan font-weight="800" fill="#5ee0d2">{{ch20.cnt125:.0f}}</tspan></text>
            <text x="40" y="195" font-size="26" fill="#8fa3ba" class="zh">整数：Z 相每 5 个主轴转对准同一角度</text><text x="40" y="195" font-size="26" fill="#8fa3ba" class="eo">Whole number: Z realigns every 5 spindle turns</text></g>
          <g transform="translate(40,330)"><rect width="820" height="230" rx="24" fill="rgba(255,122,69,.1)" stroke="#ff7a45" stroke-width="3"/>
            <text x="40" y="70" font-size="34" font-weight="800" fill="#ff9c75">i = 1.4</text>
            <text x="40" y="140" font-size="30" fill="#f3f6fa">10000 / 1.4 = <tspan font-weight="800" fill="#ff9c75">{{ch20.cnt14:.3f}}…</tspan></text>
            <text x="40" y="195" font-size="26" fill="#8fa3ba" class="zh">不是整数：Z 相不能再校正，舍入误差累积</text><text x="40" y="195" font-size="26" fill="#8fa3ba" class="eo">Not whole: Z can't correct; rounding error builds up</text></g>
        </svg>
    notes:
      - "包缝机原型大部分直接搬过来，第一处不同是转速。算例机最高每分钟 7000 针，平台电机最高 6000 转，所以要用同步带升速。传动比有个容易忽略的地方：i 等于 1.4 时，每主轴转对应 {{ch20.cnt14:.3f}} 个计数，不是整数，Z 相每转落在主轴不同角度上，不能再用来校正，舍入误差还会累积。取 1.25，电机 30 齿、主轴 24 齿，正好 {{ch20.cnt125:.0f}} 个计数。即使这样同步带仍可能跳齿，所以再加一个上针位传感器每转核对。顺便数一数：包缝机 19 种物料里有 11 种和平缝机相同，控制、驱动、电源、联网和固件框架全部沿用。"
      - "Most of the overlock prototype carries over. The first difference is speed: the example machine runs at 7000 stitches a minute, but the platform motor tops out at 6000 r/min, so we gear up with a timing belt. Here's an easily missed point. At a ratio of 1.4, one spindle revolution is {{ch20.cnt14:.3f}} counts, not a whole number, so the Z mark lands at a different spindle angle every turn and can't correct anything, and rounding error builds up. At 1.25, 30 teeth to 24, it's exactly {{ch20.cnt125:.0f}}. Even then a belt can skip a tooth, so a needle-up sensor checks every revolution. And a count: 11 of the overlocker's 19 items are the same as the lockstitch's; control, drive, power, networking and the firmware framework all carry over."

  - layout: bignum
    title: ["布走即停：按针数提前减速", "Stop when the fabric leaves: brake early, in stitches"]
    nums:
      - {n: "{{ch20.Nstop:.0f}}", n_en: "stitches", label: ["布走后：{{ch20.N1c:.0f}} 针布尾 + {{ch20.N2c:.0f}} 针链线", "After the edge: {{ch20.N1c:.0f}} tail + {{ch20.N2c:.0f}} chain"]}
      - {n: "{{ch20.Nb7000:.1f}}", n_en: "revolutions", label: ["7000 r/min 减速到停", "To brake from 7000 r/min"]}
      - {n: "{{ch20.extra7000:.0f}} mm", label: ["不提前减速，链线多出", "Extra chain without early braking"]}
    foot: ["减速转数 N_b ∝ n²：7000 r/min 从第 {{ch20.st7000:.1f}} 针起减速，4000 r/min 从第 {{ch20.st4000:.1f}} 针起", "N_b ∝ n²: at 7000 brake from stitch {{ch20.st7000:.1f}}, at 4000 from stitch {{ch20.st4000:.1f}}"]
    notes:
      - "布边光电传感器装在针前，去抖按针数而不是按时间：连续 2 针看到布才算布到。布走以后还要缝约 {{ch20.N1c:.0f}} 针布尾、{{ch20.N2c:.0f}} 针链线，一共 {{ch20.Nstop:.0f}} 针停车。可是高速时停不下来：7000 转减速到停要转 {{ch20.Nb7000:.1f}} 转，等缝完再减速，链线要多出约 {{ch20.extra7000:.0f}} 毫米。所以剩余针数小于等于减速所需的针数就开始减速，减速所需的针数随转速平方变化。"
      - "The fabric-edge sensor sits ahead of the needle, and debouncing counts stitches, not time: two stitches in a row must see fabric. After the fabric leaves, the machine sews about {{ch20.N1c:.0f}} stitches of tail and {{ch20.N2c:.0f}} of chain, {{ch20.Nstop:.0f}} in all. But at high speed it can't stop in time: braking from 7000 r/min takes {{ch20.Nb7000:.1f}} revolutions, so waiting until the end would add about {{ch20.extra7000:.0f}} millimetres of chain. So braking starts when the remaining stitches drop to the braking count, which goes with the square of speed."

  - layout: split
    title: ["机器人联系：关节上电与零点标定", "Robot link: joint bring-up and zeroing"]
    points:
      - ["先查急停、再点动确认编码器方向", "E-stop first, then jog to check encoder direction"]
      - ["零点：两向靠近开关，取平均", "Zero: approach the switch both ways, average"]
      - ["夹爪阀延迟按带速折成位移来标", "Gripper valve delay: calibrate as belt distance"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><style>html:not(.en-only) .eo{display:none}</style>
          <circle cx="450" cy="330" r="200" fill="none" stroke="#22324d" stroke-width="30"/>
          <rect x="430" y="100" width="40" height="40" rx="6" fill="#f2b705"/>
          <text x="450" y="80" font-size="26" fill="#f2b705" text-anchor="middle" class="zh">原点开关</text><text x="450" y="80" font-size="26" fill="#f2b705" text-anchor="middle" class="eo">Home switch</text>
          <path d="M 250 330 A 200 200 0 0 1 400 136" fill="none" stroke="#2ec4b6" stroke-width="10" marker-end="url(#a20r)"/>
          <path d="M 650 330 A 200 200 0 0 0 500 136" fill="none" stroke="#ff7a45" stroke-width="10" marker-end="url(#a20s)"/>
          <defs><marker id="a20r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2ec4b6"/></marker>
            <marker id="a20s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff7a45"/></marker></defs>
          <text x="210" y="250" font-size="28" font-weight="700" fill="#5ee0d2" text-anchor="end" class="zh">正向触发</text><text x="210" y="250" font-size="28" font-weight="700" fill="#5ee0d2" text-anchor="end" class="eo">From +</text>
          <text x="690" y="250" font-size="28" font-weight="700" fill="#ff9c75" class="zh">负向触发</text><text x="690" y="250" font-size="28" font-weight="700" fill="#ff9c75" class="eo">From −</text>
          <text x="450" y="340" font-size="34" font-weight="800" fill="#f3f6fa" text-anchor="middle" class="zh">零点 = 平均</text><text x="450" y="340" font-size="34" font-weight="800" fill="#f3f6fa" text-anchor="middle" class="eo">Zero = average</text>
          <text x="450" y="385" font-size="24" fill="#8fa3ba" text-anchor="middle" class="zh">抵消开关回差</text><text x="450" y="385" font-size="24" fill="#8fa3ba" text-anchor="middle" class="eo">cancels switch hysteresis</text>
          <text x="450" y="600" font-size="24" fill="#8fa3ba" text-anchor="middle" class="zh">与针杆下行、上行同一读数取平均是同一思路</text><text x="450" y="600" font-size="24" fill="#8fa3ba" text-anchor="middle" class="eo">The same idea as averaging the needle bar going down and up</text>
        </svg>
    notes:
      - "新装的机械臂关节第一次上电，步骤和今天的逐步调试一样：先只上控制电，检查急停能否切断驱动使能；再低速点动，确认编码器方向，方向反了速度环成了正反馈，关节会飞车。关节零点也常用两侧取平均：分别从正、负两个方向慢慢靠近原点开关，两次触发读数取平均，抵消开关回差。夹爪电磁阀在传送带上抓零件，它的延迟同样要按带速折算成位移来标。"
      - "A newly assembled robot joint is brought up just like today's prototype. Control power only first, checking that the E-stop really removes drive enable. Then a slow jog to confirm encoder direction; reversed, the velocity loop turns into positive feedback and the joint runs away. Joint zeroing also averages from both sides: approach the home switch slowly from the positive and the negative direction, and average the two trigger readings to cancel the switch hysteresis. And when a gripper valve picks parts off a conveyor, its delay is calibrated as a distance at belt speed, not just in milliseconds."

  - layout: split
    title: ["生活中的例子：找门框的中点", "Everyday example: the middle of a door frame"]
    points:
      - ["眼睛找“中间”，往往偏", "Eyeballing the middle is usually off"]
      - ["两边各量同样距离，做记号", "Measure the same distance from each side"]
      - ["取两个记号的中点，准得多", "The midpoint of the marks is far better"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><style>html:not(.en-only) .eo{display:none}</style>
          <rect x="140" y="30" width="620" height="590" fill="none" stroke="#c8d2de" stroke-width="26"/>
          <path d="M153 300 L310 300" stroke="#2ec4b6" stroke-width="8"/><path d="M747 300 L590 300" stroke="#2ec4b6" stroke-width="8"/>
          <path d="M310 260 L310 340 M590 260 L590 340" stroke="#ff7a45" stroke-width="8"/>
          <text x="230" y="282" font-size="36" font-weight="700" fill="#5ee0d2" text-anchor="middle" class="en">a</text>
          <text x="670" y="282" font-size="36" font-weight="700" fill="#5ee0d2" text-anchor="middle" class="en">a</text>
          <path d="M450 210 L450 390" stroke="#f2b705" stroke-width="6" stroke-dasharray="12 10"/>
          <circle cx="450" cy="300" r="20" fill="#f2b705"/>
          <text x="450" y="450" font-size="40" font-weight="800" fill="#f2b705" text-anchor="middle" class="zh">挂钩</text><text x="450" y="450" font-size="40" font-weight="800" fill="#f2b705" text-anchor="middle" class="eo">Hook</text>
          <text x="450" y="170" font-size="32" fill="#c7d3e2" text-anchor="middle" class="zh">两个记号的中点</text><text x="450" y="170" font-size="32" fill="#c7d3e2" text-anchor="middle" class="eo">Midpoint of the two marks</text>
          <text x="450" y="560" font-size="28" fill="#8fa3ba" text-anchor="middle" class="zh">比“目测中间”准得多</text><text x="450" y="560" font-size="28" fill="#8fa3ba" text-anchor="middle" class="eo">Far better than eyeballing the middle</text>
        </svg>
    notes:
      - "对称两点法的道理，生活里也用得上。想在门框正中挂一个钩子，用眼睛找“中间”往往偏；从左右两边各量出同样的距离做记号，再取两个记号的中点，就准得多。今天标定针杆的止点也是这样：在变化最明显的两侧取同一个读数，再取平均，而不是在曲线最平的地方去找最高点。"
      - "The two-point idea works in everyday life too. To hang a hook in the middle of a door frame, eyeballing the middle is usually off. Measure the same distance in from each side, mark both, and take the midpoint of the marks: far more accurate. Calibrating the needle bar works the same way. Take the same reading on the two steep sides and average, instead of hunting for the top where the curve is flattest."

  - layout: answer
    tag: ["回到车间问题", "Back to the problem"]
    title: ["300 r/min：剪线 300°、松线 310°", "At 300 r/min: trim at 300°, release at 310°"]
    rows:
      - [["剪线通电（进刀 {{ch20.ent_lo:.0f}}–{{ch20.ent_hi:.0f}}°）", "Trim on (entry {{ch20.ent_lo:.0f}}–{{ch20.ent_hi:.0f}}°)"], "300°"]
      - [["松线通电（不晚于 {{ch20.trel_latest:.0f}}°）", "Release on (by {{ch20.trel_latest:.0f}}°)"], "310°"]
      - [["700 r/min 吸合折角", "Pull-in at 700 r/min"], "{{ch20.p700_lo:.0f}}–{{ch20.p700_hi:.0f}}°"]
    side: {big: "{{ch20.nmax20:.0f}}", text: ["吸合 ≤ 20° 时剪线转速上限 r/min（按最慢 {{ch20.tp_max:.1f}} ms）", "Top trimming speed for ≤ 20° pull-in, r/min (slowest {{ch20.tp_max:.1f}} ms)"]}
    foot: ["700 r/min 窗口虽能凑上，但超出平台指标：要提速，先让电磁铁更快、更一致", "At 700 the window can be met, but the platform limit is exceeded: to go faster, make the solenoid faster and more consistent first"]
    notes:
      - "回到开头的问题。300 转时吸合折合 {{ch20.p300_lo:.1f}} 到 {{ch20.p300_hi:.1f}} 度，剪线在 300 度通电，进刀落在 {{ch20.ent_lo:.0f}} 到 {{ch20.ent_hi:.0f}} 度；松线最晚吸合约 17 度，通电不能晚于 {{ch20.trel_latest:.0f}} 度，取 310 度。700 转时吸合折合 {{ch20.p700_lo:.0f}} 到 {{ch20.p700_hi:.0f}} 度，把通电角提前，窗口还能凑上，但已经超出 20 度的平台指标。按最慢的 {{ch20.tp_max:.1f}} 毫秒算，剪线转速最高约 {{ch20.nmax20:.0f}} 转。要提速，先让电磁铁更快、更一致。"
      - "Back to our problem. At 300 r/min pull-in is {{ch20.p300_lo:.1f}} to {{ch20.p300_hi:.1f}} degrees. Firing the trim solenoid at 300 puts knife entry at {{ch20.ent_lo:.0f}} to {{ch20.ent_hi:.0f}}. The release pulls in at most about 17 degrees late, so it must fire by {{ch20.trel_latest:.0f}}; we take 310. At 700 r/min pull-in becomes {{ch20.p700_lo:.0f}} to {{ch20.p700_hi:.0f}} degrees. Fire earlier and the window can still be met, but the 20 degree platform limit is exceeded. With the slowest {{ch20.tp_max:.1f}} milliseconds, trimming can go to only about {{ch20.nmax20:.0f}} r/min. To go faster, make the solenoid faster and more consistent first."

  - layout: summary
    title: ["本讲小结", "Summary"]
    points:
      - ["编码器 1:1 转发，转角在主控手里", "Encoder forwarded 1:1: the controller owns the angle"]
      - ["事件表按转角写：进刀角 = 发令角 + 6nt", "Events by angle: entry = command + 6nt"]
      - ["逐步调试，两点法标零；验收分条判定", "Step-by-step bring-up, two-point zero, itemised acceptance"]
    after: ["作业 20：事件表、标定与包缝机链线 · 测验 · 实验 20-1 报告 —— 在问渠学习平台完成", "Assignment 20 · quiz · Lab 20-1 report — on WenQuest"]
    notes:
