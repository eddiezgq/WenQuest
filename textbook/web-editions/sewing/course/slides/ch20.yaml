          <text x="650" y="510" font-size="28" fill="#ff9c75" class="zh">发热、噪声</text><text x="650" y="510" font-size="28" fill="#ff9c75" class="eo">Heat, noise</text>
        </svg>
    notes:
      - "改装时拆下离合器电机、V 带和带罩，还有手轮上的机械定位器。主轴电机首选直驱，用梅花联轴器连主轴，要用百分表打同轴度。用台下带传动也可以，但必须是同步带，而且一比一，原因讲包缝机时就明白。五只电磁铁各推一根杆，有个细节：电磁铁行程要比杠杆多 0.3 到 0.5 毫米，让衔铁先吸到底。杠杆先顶死的话，维持电流保不住衔铁，线圈在强激磁和维持之间来回切换，又热又响。"
      - "In the retrofit, the clutch motor, V-belt, guard and the mechanical positioner on the handwheel all come off. Direct drive is preferred, with a jaw coupling to the spindle, aligned with a dial gauge. A belt under the table also works, but it must be a timing belt at one to one; you'll see why with the overlocker. Each solenoid pushes one lever, and here's a detail: give the solenoid 0.3 to 0.5 millimetres more stroke than the lever, so the armature bottoms first. If the lever bottoms first, the hold current can't keep the armature, and the coil cycles between boost and hold, hot and noisy."

  - layout: bignum
    title: ["电源预算：算峰值，不算平均", "Power budget: size for the peak, not the average"]
    nums:
      - {n: "{{ch20.gap_ms:.1f}} ms", label: ["剪线 300°、松线 310° 相隔", "Trim at 300°, release at 310°: the gap"]}
      - {n: "{{ch20.psuA:.1f}} A", n_en: "{{ch20.psuW:.0f}} W", label: ["两路强激磁重叠 + 主控", "Two overlapping boosts + controller"]}
      - {n: "{{ch20.holdW:.0f}} W", label: ["抬压脚长时间维持 1 A", "Foot lift held at 1 A"]}
    foot: ["强激磁各 10 ms，比间隔长，必然重叠 → 选 24 V 200 W 电源留余量", "Each boost lasts 10 ms, longer than the gap, so they overlap → a 24 V 200 W supply with margin"]
    notes:
      - "24 伏电源要应付的是强激磁电流，每只线圈 24 除以 8，3 安。剪线和松线在 300 度和 310 度通电，300 转时只隔 {{ch20.gap_ms:.1f}} 毫秒，而强激磁各持续 10 毫秒，必然重叠；再加主控和传感器约 0.5 安，峰值 {{ch20.psuA:.1f}} 安、{{ch20.psuW:.0f}} 瓦，选 200 瓦留余量。平均功率很小，真正要核算的是长时间保持的抬压脚，维持 1 安就是 {{ch20.holdW:.0f}} 瓦，要看线圈的占空比。"
      - "The 24 volt supply has to handle boost current: 24 over 8 ohms, 3 amps per coil. Trim and release fire at 300 and 310 degrees, only {{ch20.gap_ms:.1f}} milliseconds apart at 300 r/min, while each boost lasts 10 milliseconds, so they overlap. Add about half an amp for the controller and sensors: {{ch20.psuA:.1f}} amps peak, {{ch20.psuW:.0f}} watts, so we choose 200 watts. Average power is small. What needs checking is the long-held foot lift: 1 amp hold is {{ch20.holdW:.0f}} watts, against the coil's duty rating."

  - layout: points
    title: ["原型一律加双触点急停", "Every prototype gets a two-contact E-stop"]
    points:
      - ["一组硬接线：切断伺服使能和 24 V", "One contact hardwired: cuts servo enable and 24 V"]
      - ["一组接数字输入：让固件记录", "One to a digital input, for firmware to log"]
      - ["机头翻倒、脚踏不在中位：禁止启动", "Head tilted or pedal off neutral: no start"]
    foot: ["防护罩可能没装、固件没验证：千万不要只靠固件停机", "Guards may be missing, firmware unverified: never rely on firmware alone to stop"]
    notes:
      - "安全方面，第 18 章说过，用脚踏这种松开即停装置的机器可以不设急停。原型不一样，防护罩可能没装，固件也没验证，所以一律加双触点急停：一组触点硬接线，切断伺服使能和电磁铁的 24 伏；另一组接数字输入，让固件记录下来。千万不要只靠固件停机。另外，机头翻倒、上电时脚踏不在中位，都禁止启动。"
      - "On safety: Chapter 18 noted that a machine with a release-to-stop pedal may omit an emergency stop. A prototype is different. Guards may be missing and the firmware is unverified, so it always gets a two-contact E-stop. One contact is hardwired and cuts servo enable and the solenoid 24 volts; the other goes to a digital input so the firmware can log it. Never rely on firmware alone to stop. And a tilted head, or a pedal off neutral at power-up, blocks starting."

