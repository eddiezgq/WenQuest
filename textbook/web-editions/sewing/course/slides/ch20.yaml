          <text x="450" y="436" font-size="26" fill="#8fbaff" text-anchor="middle" class="zh">CAN FD：速度、状态、参数</text><text x="450" y="436" font-size="26" fill="#8fbaff" text-anchor="middle" class="eo">CAN FD: speed, status, parameters</text>
          <g transform="translate(30,480)"><rect width="840" height="130" rx="20" fill="rgba(255,122,69,.12)"/>
            <text x="420" y="55" font-size="30" font-weight="700" fill="#ffb38f" text-anchor="middle" class="zh">若经总线报角度：0.5 ms ≈ {{ch20.can05:.1f}}°</text><text x="420" y="55" font-size="30" font-weight="700" fill="#ffb38f" text-anchor="middle" class="eo">If the angle went over the bus: 0.5 ms ≈ {{ch20.can05:.1f}}°</text>
            <text x="420" y="98" font-size="24" fill="#8fa3ba" text-anchor="middle" class="zh">随机延迟，直接加到进刀角散布上（300 r/min）</text><text x="420" y="98" font-size="24" fill="#8fa3ba" text-anchor="middle" class="eo">Random delay, added straight to the entry spread (300 r/min)</text></g>
        </svg>
    notes:
      - "看系统构成。伺服电机带 2500 线编码器，四倍频后每转一万个计数，分辨率 {{ch20.cnt_deg:.3f}} 度。编码器接在驱动器上，因为驱动器做矢量控制要用它；驱动器再把 A、B、Z 三路一比一转发给主控，主控的定时器自己计数，转角就在主控手里。为什么不让驱动器经总线把角度报过来？每帧可能有几百微秒的随机延迟，300 转时 0.5 毫秒就是 {{ch20.can05:.1f}} 度，会直接加到进刀角的散布上。"
      - "Here's the build-up. The servo motor carries a 2500-line encoder: ten thousand counts per revolution after times-four decoding, {{ch20.cnt_deg:.3f}} degrees each. The encoder plugs into the drive, which needs it for vector control, and the drive forwards A, B and Z one-to-one to the controller, whose timer counts them. So the angle lives in the controller. Why not let the drive report the angle over the bus? Each frame can carry hundreds of microseconds of random delay. At 300 r/min, half a millisecond is {{ch20.can05:.1f}} degrees, added straight to the knife-entry spread."

