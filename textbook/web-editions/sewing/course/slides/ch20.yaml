# 第 20 讲 平缝机与包缝机电控原型 · 课件（第 24 轮新版式）
# 每页一个意思、最多 3 条；中文在上、英文一行在下。版式见 course/tools/build_slides.py 的 LAYOUTS。
# {{ch20.键:格式}} 由课程包程序 course/calc/ch20.py 算出，不手写数字。
lesson: 20
code: [ch20]

clips:
  hero:          # 封面：三维平缝机样机，透明盖板
    page: proto-lockstitch
    selector: "#stage"
    steps:
      - {at: 0, press: "#shell [data-k=clear]"}
      - {at: 1, js: "window.__api.viewOffset(-0.12)"}   # 画面整体右移，样机让开封面标题
  cal:           # 实验 20-1 ①：手轮一直正转，百分表和码盘跟着动（自己转个不停，不用 loop）
    page: proto-ls
    selector: "#cal"
    steps:
      - {at: 0, js: "var h=document.getElementById('hw');setInterval(function(){h.value=((+h.value+1.2)%360).toFixed(1);h.dispatchEvent(new Event('input',{bubbles:true}))},50)"}
  evc:           # 实验 20-1 ②：剪线转速 300 ↔ 700 r/min 交替，看实际动作范围怎样移动、变宽
    page: proto-ls
    selector: "#evc"
    vh: 1400
    loop: 8
    steps:
      - {at: 0, set: {n: 300}}
      - {at: 4, set: {n: 700}}
  sew:           # 实验 20-1 ③：先把编码器标好，再试缝一次（慢放剪线那一针），放完马上再来
    page: proto-ls
    selector: "#anim"
    vh: 1600
    loop: 6
    steps:
      - {at: 0, js: "var $=function(i){return document.getElementById(i)};function sv(id,v){$(id).value=v;$(id).dispatchEvent(new Event('input',{bubbles:true}))}function rd(){return parseFloat($('enc').textContent)}sv('hw',30);var a=rd();sv('hw',31);var b=rd();if(((b-a+540)%360)-180<0){$('dir').value='-1';$('dir').dispatchEvent(new Event('change'))}sv('hw',30);var r=rd();$('off').value=((((30-r)%360)+360)%360).toFixed(1);$('write').click();"}
      - {at: 0.5, press: "#sew"}
  stat:          # 实验 20-1 ③：试缝 100 次的统计，每轮重新随机
    page: proto-ls
    selector: "#stat"
    vh: 1600
    loop: 6
    steps:
      - {at: 0, js: "var $=function(i){return document.getElementById(i)};function sv(id,v){$(id).value=v;$(id).dispatchEvent(new Event('input',{bubbles:true}))}function rd(){return parseFloat($('enc').textContent)}sv('hw',30);var a=rd();sv('hw',31);var b=rd();if(((b-a+540)%360)-180<0){$('dir').value='-1';$('dir').dispatchEvent(new Event('change'))}sv('hw',30);var r=rd();$('off').value=((((30-r)%360)+360)%360).toFixed(1);$('write').click();"}
      - {at: 0.5, press: "#sew100"}

slides:
  - layout: cover
    video: hero
    kicker: ["第 20 讲", "Lecture 20"]
    title: ["平缝机与包缝机原型", "Lockstitch and Overlock Control Prototypes"]
    sub: ["两周，让机械机头变成电控原型", "Two weeks to turn a mechanical head into a control prototype"]
    notes:
      - "同学们好。第 13、14 章讲了电控平缝机为什么这样控制，第 19 章给了一套搭原型的平台。今天把两者合起来：桌上一台带剪线机构的机械平缝机头，一箱平台模块，两周内要让它缝出第一道线、剪断、停在上针位。最后再看包缝机原型差在哪里。"
      - "Hello everyone. Chapters 13 and 14 explained why a lockstitch machine is controlled the way it is, and Chapter 19 gave us a platform for prototypes. Today we put them together: a mechanical lockstitch head with a trimmer, a box of platform modules, and two weeks to make it sew, trim and stop needle-up. At the end we see what changes for an overlocker."

  - layout: question
    tag: ["车间问题", "Shop-floor problem"]
    title: ["剪线电磁铁该在多少度通电？", "At what angle should the trim solenoid fire?"]
    facts:
      - ["300 r/min 剪线：动刀须在 300°–330° 进刀", "Trimming at 300 r/min: the knife must enter at 300°–330°"]
      - ["电磁铁吸合延迟 {{ch20.tp_min:.1f}}–{{ch20.tp_max:.1f}} ms，随电压和线圈温度变", "Pull-in takes {{ch20.tp_min:.1f}}–{{ch20.tp_max:.1f}} ms, varying with voltage and coil heat"]
      - ["车间想提到 700 r/min；平台要求吸合折角 ≤ 20°", "The shop wants 700 r/min; the platform allows ≤ 20° of pull-in"]
    notes:
      - "设备科要把一台带剪线机构的机械平缝机头改成电控原型。剪线在每分钟 300 转下进行，动刀必须在 300 到 330 度之间进刀。剪线电磁铁的吸合延迟随电源电压和线圈温度变化，在 {{ch20.tp_min:.1f}} 到 {{ch20.tp_max:.1f}} 毫秒之间。电磁铁该在多少度通电？车间还想把剪线转速提到 700 转，行不行？这节课最后回答。"
      - "The equipment department will turn a mechanical lockstitch head with a trimmer into a control prototype. Trimming runs at 300 r/min, and the moving knife must enter between 300 and 330 degrees. The trim solenoid pulls in in {{ch20.tp_min:.1f}} to {{ch20.tp_max:.1f}} milliseconds, depending on supply voltage and coil temperature. At what angle should it be energised? And the shop would like to trim at 700 r/min. Is that acceptable? We'll answer at the end."

