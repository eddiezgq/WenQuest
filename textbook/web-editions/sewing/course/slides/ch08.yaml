# 第 8 讲 运动协调与整机动力学 · 课件（第 24 轮新版式）
# 每页一个意思、最多 3 条；中文在上、英文一行在下。版式见 course/tools/build_slides.py 的 LAYOUTS。
# {{ch08.键:格式}} 由课程包程序 course/calc/ch08.py 算出，不手写数字。
# notes：讲者备注（放映时只给老师看，录课时当讲稿用）。
lesson: 8
code: [ch08]

clips:
  hero:          # 封面：三维样机全透视，慢慢环绕
    page: proto-lockstitch
    selector: "#stage"
    dur: 10
    steps:
      - {at: 0, press: "#shell [data-k=xray]"}
  chains:        # 四套机构轮流突出：刺布 → 挑线 → 钩线 → 送布 → 全部，一直循环
    page: proto-lockstitch
    selector: "#stage"
    dur: 20
    loop: 20
    steps:
      - {at: 0, press: ["#shell [data-k=xray]", "#chains [data-k=needle]"]}
      - {at: 4, press: "#chains [data-k=takeup]"}
      - {at: 8, press: "#chains [data-k=hook]"}
      - {at: 12, press: "#chains [data-k=feed]"}
      - {at: 16, press: "#chains [data-k=all]"}
  hooktrack:     # 实验 8-1：旋梭定时来回移动（±9°，12 秒一个来回），时序轨道跟着变
    page: timing
    selector: "#tim"
    dur: 12
    loop: 12
    steps:
      - {at: 0, js: "clearInterval(window.__sw);var A=window.__api,t0=Date.now();window.__sw=setInterval(function(){var t=(Date.now()-t0)/1000;A.ST.dh=Math.round(9*Math.sin(t*2*Math.PI/12));A.changed();},250)"}
  hookchecks:    # 同一个来回，看六条判据变红变绿（窄页面，判据框占满宽度）
    page: timing
    selector: "#checks"
    vw: 760
    vh: 1400
    dur: 12
    loop: 12
    steps:
      - {at: 0, js: "clearInterval(window.__sw);var A=window.__api,t0=Date.now();window.__sw=setInterval(function(){var t=(Date.now()-t0)/1000;A.ST.dh=Math.round(9*Math.sin(t*2*Math.PI/12));A.changed();},250)"}
  ksweep:        # 平衡率 k 在 0 和 1 之间来回扫（12 秒一个来回），看合力轨迹由竖直拉长变成水平拉长
    page: timing
    selector: ".two"
    vh: 1300
    dur: 12
    loop: 12
    steps:
      - {at: 0, js: "clearInterval(window.__sw);var A=window.__api,t0=Date.now();A.ST.n=5000;window.__sw=setInterval(function(){var t=(Date.now()-t0)/1000;A.ST.k=Math.round(20*(0.5-0.5*Math.cos(t*2*Math.PI/12)))/20;A.changed();},300)"}

slides:
  - layout: cover
    video: hero
    kicker: ["第 8 讲", "Lecture 8"]
    title: ["运动协调与 整⁠机⁠动⁠力⁠学", "Motion Coordination and Machine Dynamics"]
    sub: ["四套机构，一根主轴", "Four mechanisms, one main shaft"]
    notes:
      - "同学们好。第 3 到第 7 讲，我们一讲一个机构：刺布、挑线、钩线、送布，再加上线张力。可在机器上，它们都挂在同一根主轴上，由同一个电机带着转。今天把它们放到一起看：一针里谁先谁后，一个动了别的怎么办，转速高了整台机器为什么会抖。"
      - "Hello everyone. From Lecture 3 to Lecture 7 we took one mechanism at a time: needle, take-up, hook, feed, and thread tension. On the machine, though, they all hang on one main shaft, driven by one motor. Today we put them together: what happens in what order within a stitch, what happens to the others when one moves, and why the whole machine shakes at high speed."

  - layout: question
    tag: ["车间问题", "Shop-floor problem"]
    title: ["提速 20%，机头抖起来了", "20% faster, and the head starts to shake"]
    facts:
      - ["赶单：想从 5000 提到 6000 r/min；说明书标准型最高 5500", "To meet an order: 5000 → 6000 r/min; the manual's standard type tops out at 5500"]
      - ["k = 0.45 时最大合力约 {{ch08.F5000:.0f}} N；针杆下止点约 {{ch08.NB5000:.0f}} N", "At k = 0.45 the maximum resultant is about {{ch08.F5000:.0f}} N; needle bar at BDC about {{ch08.NB5000:.0f}} N"]
      - ["机针在布中与牙抓布只重叠 {{ch08.overlap:.1f}}°（101.7°–114.2°）", "Needle-in-fabric and dog gripping overlap only {{ch08.overlap:.1f}}° (101.7°–114.2°)"]
    notes:
      - "先看车间问题。一家衬衫厂为了赶单，想把一条线的平缝机从每分钟 5000 转提到 6000 转。按本讲的示意质量，平衡率取 0.45 时，5000 转下整机惯性力的最大合力约 {{ch08.F5000:.0f}} 牛，针杆下止点约 {{ch08.NB5000:.0f}} 牛。机针在布中和送布牙抓布只重叠 {{ch08.overlap:.1f}} 度。说明书上标准型最高 5500。提到 6000，会怎样？该定多少？最后回答。"
      - "Here's the shop-floor problem. To meet an order, a shirt factory wants to take a line of lockstitch machines from 5000 to 6000 r/min. With this lecture's illustrative masses and a balance ratio of 0.45, the maximum resultant inertia force at 5000 is about {{ch08.F5000:.0f}} newtons, and the needle bar at bottom dead centre about {{ch08.NB5000:.0f}}. Needle-in-fabric and dog gripping overlap by only {{ch08.overlap:.1f}} degrees. The manual's standard type is rated 5500. What happens at 6000, and what speed should they choose? We'll answer at the end."

  - layout: section
    num: "01"
    title: ["一根主轴，四套机构", "One shaft, four mechanisms"]

  - layout: split
    title: ["牵一发而动全身", "Pull one thread and the whole machine moves"]
    points:
      - ["旋梭推迟七八度：跳针少了，却开始断面线", "Hook retarded 7–8°: fewer skips, but the needle thread breaks"]
      - ["4000 提到 5000 r/min：机头发抖、台板嗡嗡响", "4000 → 5000 r/min: the head shakes, the table hums"]
      - ["惯性力 ∝ 转速²：提速 25%，力 ×{{ch08.r45:.2f}}", "Inertia ∝ speed²: 25% faster, ×{{ch08.r45:.2f}} the force"]
    visual: {video: chains}
    notes:
      - "车间里常有这样两件事。一台机器缝针织物跳针，师傅把旋梭往后调了七八度，跳针少了，没多久开始断面线：旋梭定时还牵涉到挑线杆放的线够不够线环用。另一台机器从 4000 转提到 5000 转，机头发抖：惯性力和转速平方成正比，提速 25%，力变成 {{ch08.r45:.2f}} 倍。右边样机上四套机构轮流亮起，它们挂在同一根主轴上。"
      - "Two things happen all the time. One machine skips on knits; the mechanic retards the hook seven or eight degrees, the skips fall, and soon the needle thread breaks: hook timing also decides whether the take-up gives the loop enough thread. Another machine goes from 4000 to 5000 r/min and the head shakes: inertia force goes with speed squared, so 25 percent faster means {{ch08.r45:.2f}} times the force. On the right, the four mechanisms light up in turn. They all hang on one shaft."

