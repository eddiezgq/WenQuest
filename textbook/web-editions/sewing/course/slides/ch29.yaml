      - "毛衫衣片在横机上织成形，再用套口机对线圈连起来，每件约 32 分钟。成型衣片做法每件人工约 {{ch29.ff:.0f}} 分，套口占六成；全成型直接织出整件，人工降到约 {{ch29.wg:.0f}} 分，但每件占横机 30 分钟。日产 1000 件：传统约 {{ch29.knit_n:.0f}} 台横机加 {{ch29.linkers:.0f}} 名套口工，全成型约 {{ch29.wg_n:.0f}} 台。省的是人，多占的是机器。"
      - "Knitwear panels are knitted to shape, then linked loop by loop, about 32 minutes a garment. Fully-fashioned work takes about {{ch29.ff:.0f}} labour-minutes, 60 percent linking; whole-garment knitting cuts that to about {{ch29.wg:.0f}} but ties up the machine 30 minutes a piece. For 1000 a day: about {{ch29.knit_n:.0f}} machines and {{ch29.linkers:.0f}} linkers, or about {{ch29.wg_n:.0f}} whole-garment machines. It saves people and costs machine time."

  - layout: figure
    title: ["换款的代价：小批量时 U 型单元更省", "The cost of changeover: small batches favour U cells"]
    visual: {video: batch}
    caption: ["150 件：长线 {{ch29.L150:.0f}}、单元 {{ch29.C150:.0f}} 分/件；分界批量约 {{ch29.cross:.0f}} 件", "Crossover ≈ {{ch29.cross:.0f}} pieces"]
    notes:
      - "小单快反的麻烦在换款，有两块代价：停线，重排机器、换线、调针距和试缝；学习，一项研究发现新款第一天效率只有稳态的约 {{ch29.r0:.0f}}%，约三个时间常数才恢复。两块摊到每件上，批量越小摊得越重。图里批量在 150 到 3000 件之间轮换：150 件时长线每件 {{ch29.L150:.0f}} 分、单元 {{ch29.C150:.0f}} 分；交点约 {{ch29.cross:.0f}} 件。"
      - "For quick response, changeover costs twice: the stoppage, re-arranging machines, rethreading, setting and test sewing; and learning, with one study finding first-day efficiency only about {{ch29.r0:.0f}} percent of steady state, recovering over three time constants. Both are spread over the batch. The chart cycles the batch from 150 to 3000: at 150 the long line costs {{ch29.L150:.0f}} labour-minutes a piece and the cell {{ch29.C150:.0f}}; they cross near {{ch29.cross:.0f}}."

  - layout: figure
    title: ["U 型单元与接力区：自己平衡", "U cells and relay zones balance themselves"]
    visual: {video: cell}
    caption: ["最后一人做完就回头接前一人的活，依次交接；第一人回入口取新裁片", "The relay zone"]
    notes:
      - "单元生产 4 到 17 人一组，每人会两到四道工序，机器排成 U 形，线上只有手里那几件。接力区的办法很巧：工人不固定工序，各拿一件往前做；最后一人做完，回头接过前一人手里的衣服，前一人再回头接他前面的人，第一人回入口取料。只要从慢到快排，快的人自然多做，单元自己就平衡了。"
      - "A cell has 4 to 17 people, each doing two to four operations, machines in a U, only the pieces in hand on the line. The relay zone is clever: nobody owns fixed operations, each carries a garment forward; the last operator, when done, takes over from the one before, who walks back to the one before him, and the first fetches new pieces. Order them slowest to fastest and the cell balances itself."

  - layout: points
    title: ["五类工厂对设备提的要求", "What each factory asks of its machines"]
    points:
      - ["西服要能接收“这一件”的参数", "Suits: machines that take this piece's parameters"]
      - ["衬衫要专用可靠、换模板快的自动单元", "Shirts: reliable special units with quick template changes"]
      - ["T 恤要高速耐用；快反要换款快", "T-shirts: fast and durable; quick response: fast changeovers"]
    foot: ["先问工时花在哪，再问面料，最后问批量和交期；设备好不好，要放到工厂里算账", "Ask where the time goes, then the fabric, then batch and lead time; judge a machine by these sums"]
    notes:
      - "把五类工厂放在一起，思路就清楚了：先问工时花在哪，再问面料用什么机器，最后问批量和交期怎样组织。对设备设计者，各类工厂提的要求不同：西服要机器能接收这一件的参数；衬衫要专用可靠、换模板快；T 恤要高速耐用；毛衫要上机时间短；快反要换款快。设备好不好，最终要放到工厂里算账。"
      - "Put the five side by side and the method is clear: ask where the time goes, then what machines the fabric needs, then how batch size and lead time shape the organisation. For machine designers each asks something different: suits want machines that take this piece's parameters; shirts, reliable special units with quick template changes; T-shirts, speed and durability; knitwear, shorter knitting time; quick response, fast changeovers. Machines are judged by these sums."

  - layout: split
    title: ["机器人联系：机器人线也要做平衡", "Robot link: robot lines need balancing too"]
    points:
      - ["每个机器人工位的循环时间不能超过节拍", "Every robot cell's cycle must stay under takt"]
      - ["不能有“半台机器人”：同样有取整损失", "No half robots: the same rounding loss"]
      - ["AMR 按最短队列派单 = 吊挂按空闲派活", "AMRs dispatch to the shortest queue, like hangers"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <text x="20" y="40" font-size="26" fill="#8fa3ba">焊装线各机器人工位的循环时间（示意）</text>
          <path d="M60 200 L880 200" stroke="#ff7a45" stroke-width="4" stroke-dasharray="14 10"/>
          <text x="880" y="188" font-size="24" fill="#ff9c75" text-anchor="end">节拍</text>
          <g>
            <rect x="80" y="260" width="110" height="280" rx="10" fill="#2ec4b6"/>
            <rect x="240" y="300" width="110" height="240" rx="10" fill="#2ec4b6"/>
            <rect x="400" y="205" width="110" height="335" rx="10" fill="#f2b705"/>
            <rect x="560" y="330" width="110" height="210" rx="10" fill="#2ec4b6"/>
            <rect x="720" y="280" width="110" height="260" rx="10" fill="#2ec4b6"/>
          </g>
          <g font-size="26" fill="#d3deea" text-anchor="middle" class="en"><text x="135" y="580">R1</text><text x="295" y="580">R2</text><text x="455" y="580">R3</text><text x="615" y="580">R4</text><text x="775" y="580">R5</text></g>
          <text x="455" y="130" font-size="30" font-weight="800" fill="#ffd75a" text-anchor="middle">瓶颈</text>
          <path d="M455 140 L455 195" stroke="#f2b705" stroke-width="4"/>
        </svg>
    notes:
      - "汽车焊装线上几台机器人串成一条线，每个工位的循环时间都不能超过节拍，超出的那台就是瓶颈，和 T 恤线的平衡图是同一张图。没有半台机器人，所以同样有取整损失，办法也是把相近作业合并。仓库移动机器人按队列最短派单，正是吊挂按空闲派活的规则；料箱缓冲同样满足利特尔法则。"
      - "On a car body-welding line robots work in series, and every cell's cycle must stay under takt; the one that exceeds it is the bottleneck, the same chart as the T-shirt line's. There's no half robot, so rounding losses appear too, and the fix is merging similar tasks. Warehouse robots dispatched to the shortest queue follow the hanger system's rule, and tote buffers obey Little's law as well."

  - layout: split
    title: ["生活中的例子：食堂排队", "Everyday example: the canteen queue"]
    points:
      - ["前面 30 人，每分钟打 2 人：等约 15 分钟", "30 ahead, 2 served a minute: about 15 minutes"]
      - ["想少等：加窗口，提高“产量”", "To wait less: open a window, raise output"]
      - ["或者少排人，压低“在制品”", "Or keep the queue short: cut the WIP"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <rect x="680" y="160" width="190" height="260" rx="18" fill="#111d31" stroke="#f2b705" stroke-width="4"/>
          <text x="775" y="300" font-size="32" font-weight="800" fill="#ffd75a" text-anchor="middle">窗口</text>
          <g fill="#4c8dff">
            <circle cx="620" cy="290" r="24"/><circle cx="560" cy="290" r="24"/><circle cx="500" cy="290" r="24"/><circle cx="440" cy="290" r="24"/><circle cx="380" cy="290" r="24"/><circle cx="320" cy="290" r="24"/><circle cx="260" cy="290" r="24"/><circle cx="200" cy="290" r="24"/><circle cx="140" cy="290" r="24"/>
          </g>
          <circle cx="80" cy="290" r="24" fill="#ff7a45"/>
          <text x="80" y="360" font-size="26" fill="#ff9c75" text-anchor="middle">你</text>
          <text x="380" y="220" font-size="28" fill="#d3deea" text-anchor="middle">前面 30 人 · 每分钟 2 人</text>
          <rect x="100" y="460" width="700" height="110" rx="22" fill="rgba(242,183,5,.12)"/>
          <text x="450" y="528" font-size="36" font-weight="800" fill="#ffd75a" text-anchor="middle">等待 = 30 ÷ 2 = 15 分钟</text>
        </svg>
    notes:
      - "利特尔法则在生活里天天见。食堂窗口前排着 30 个人，打饭速度每分钟 2 人，你大约要等 30 除以 2 等于 15 分钟。想少等，要么加窗口，也就是提高产量；要么少排人，也就是压低在制品。车间压捆、压在制品来缩短交期，是同一个道理。"
      - "You meet Little's law every day. Thirty people are queuing at the canteen window and it serves two a minute, so you'll wait about thirty over two, fifteen minutes. To wait less, either open another window, which raises output, or keep fewer people in the queue, which cuts work in progress. A sewing floor shortens lead times by shrinking bundles and WIP for exactly the same reason."

  - layout: answer
    tag: ["回到车间问题", "Back to the problem"]
    title: ["按机种合并：{{ch29.N_grp}} 人就够", "Grouped by machine: {{ch29.N_grp}} people are enough"]
    rows:
      - ["节拍 / 理论人数", "{{ch29.takt_s:.0f}} s · ≥ {{ch29.nmin}} 人"]
      - ["逐道向上取整", "{{ch29.N_op}} 人 · {{ch29.eff_op:.0f}}%"]
      - ["包缝 {{ch29.g_ol}}、绷缝 {{ch29.g_fl}}、平缝 {{ch29.g_snl}}、手工 {{ch29.g_mnl}}", "{{ch29.N_grp}} 人 · {{ch29.eff_grp:.0f}}%"]
    side: {big: "−{{ch29.saved}} 人", text: ["同样 200 件/时，比逐道配置少用 {{ch29.saved}} 人", "Same 200 an hour with {{ch29.saved}} fewer people"]}
    foot: ["逐道配置的瓶颈是 1 人做的领罗纹接头（0.299 分）；零头变成等活：合侧缝 2.18 人配 3 人", "Per-operation staffing: bottleneck is rib joining (0.299 min); fractions become waiting"]
    notes:
      - "回到开头的问题。节拍 0.30 分，{{ch29.takt_s:.0f}} 秒；理论人数约 {{ch29.theo:.1f}}，至少 {{ch29.nmin}} 人。逐道向上取整共 {{ch29.N_op}} 人，瓶颈是 1 人做的领罗纹接头，平衡率约 {{ch29.eff_op:.0f}}%，零头都变成了等活。按机种合并：包缝 {{ch29.g_ol}}、绷缝 {{ch29.g_fl}}、平缝 {{ch29.g_snl}}、手工 {{ch29.g_mnl}}，共 {{ch29.N_grp}} 人，平衡率约 {{ch29.eff_grp:.0f}}%，同样产量少用 {{ch29.saved}} 人。"
      - "Back to our problem. Takt is 0.30 minutes, {{ch29.takt_s:.0f}} seconds; theoretical headcount about {{ch29.theo:.1f}}, at least {{ch29.nmin}}. Rounding each operation up gives {{ch29.N_op}} people, bottlenecked at rib joining with one person, about {{ch29.eff_op:.0f}} percent balance, every fraction turned to waiting. Grouped by machine, {{ch29.g_ol}} overlock, {{ch29.g_fl}} coverstitch, {{ch29.g_snl}} lockstitch and {{ch29.g_mnl}} hand, {{ch29.N_grp}} in all at about {{ch29.eff_grp:.0f}} percent: {{ch29.saved}} fewer people."

  - layout: summary
    title: ["本讲小结", "Summary"]
    points:
      - ["产品决定工序，工序决定设备，批量决定组织", "Product → operations → machines; batch → organisation"]
      - ["利特尔法则：生产周期 = 在制品 ÷ 产量", "Little's law: throughput time = WIP ÷ output"]
      - ["合并同机种工序，平衡率从 72% 提到 92%", "Grouping by machine lifts balance from 72% to 92%"]
    after: ["作业 29：T 恤线提速与换款方案 · 测验 · 虚拟实验 29-1 报告 —— 在问渠学习平台完成", "Assignment 29 · quiz · Lab 29-1 report — on WenQuest"]
    notes:
      - "这一讲记住三件事。第一，产品决定工序，工序决定设备，批量决定组织，五类工厂的差别都从这三点推出来。第二，利特尔法则：生产周期等于在制品除以产量，单件流和吊挂靠压低在制品缩短交期。第三，取整损失靠合并同机种工序解决，平衡率能从 72% 提到 92%；批量小于分界批量时，U 型单元更省。"
      - "Three things to remember. One: the product sets the operations, the operations the machines, the batch size the organisation; the five factories follow from that. Two: Little's law, throughput time equals WIP over output; single-piece flow and hangers shorten lead time by keeping WIP low. Three: grouping operations by machine type cuts rounding loss, lifting balance from 72 to 92 percent; below the crossover batch the U cell is cheaper."
