          <rect x="60" y="270" width="300" height="270" rx="0" fill="#ff7a45"/>
          <text x="210" y="420" font-size="32" font-weight="800" fill="#08101d" text-anchor="middle">套口</text>
          <text x="210" y="80" font-size="56" font-weight="800" fill="#d3deea" text-anchor="middle" class="en">{{ch29.ff:.0f}}</text>
          <text x="210" y="590" font-size="28" fill="#d3deea" text-anchor="middle">成型衣片</text>
          <rect x="520" y="397" width="300" height="143" rx="16" fill="#2ec4b6"/>
          <text x="670" y="377" font-size="56" font-weight="800" fill="#5ee0d2" text-anchor="middle" class="en">{{ch29.wg:.0f}}</text>
          <text x="670" y="590" font-size="28" fill="#5ee0d2" text-anchor="middle">全成型</text>
