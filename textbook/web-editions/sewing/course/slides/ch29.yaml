# 第 29 讲 典型服装工厂 · 课件（第 24 轮新版式）
# 每页一个意思、最多 3 条；中文在上、英文一行在下。版式见 course/tools/build_slides.py 的 LAYOUTS。
# {{ch29.键:格式}} 由课程包程序 course/calc/ch29.py 算出，不手写数字。
lesson: 29
code: [ch29]

clips:
  hero:          # 封面：实验 29-1 吊挂单件流，按 20 分/秒快进一个班，下班后重新开工（深色显示）
    page: line
    selector: "#cv"
    vh: 1400
    loop: 27
    steps:
      - {at: 0, press: "[data-m=ups]", js: "document.documentElement.style.filter='invert(.9) hue-rotate(180deg)'"}
      - {at: 0.5, press: ["#restart", "[data-s='20']"], js: "var p=document.getElementById('play');if(p.getAttribute('aria-pressed')==='false')p.click()"}
  bal:           # 平衡图：资料原配置（22 人）↔ 按节拍逐道配置
    page: line
    selector: "#cBal"
    vh: 1750
    loop: 8
    steps:
      - {at: 0, press: "#pSrc"}
      - {at: 4, press: "#pTakt"}
  pbs:           # 捆扎流水：快进一个班，下班后重新开工
    page: line
    selector: "#cv"
    vh: 1400
    loop: 27
    steps:
      - {at: 0, press: "[data-m=pbs]"}
      - {at: 0.5, press: ["#restart", "[data-s='20']"], js: "var p=document.getElementById('play');if(p.getAttribute('aria-pressed')==='false')p.click()"}
  ups:           # 吊挂单件流：快进一个班，下班后重新开工
    page: line
    selector: "#cv"
    vh: 1400
    loop: 27
    steps:
      - {at: 0, press: "[data-m=ups]"}
      - {at: 0.5, press: ["#restart", "[data-s='20']"], js: "var p=document.getElementById('play');if(p.getAttribute('aria-pressed')==='false')p.click()"}
  cell:          # U 型单元：接力区，快进一个班，下班后重新开工
    page: line
    selector: "#cv"
    vh: 1400
    loop: 27
    steps:
      - {at: 0, press: "[data-m=cell]"}
      - {at: 0.5, press: ["#restart", "[data-s='20']"], js: "var p=document.getElementById('play');if(p.getAttribute('aria-pressed')==='false')p.click()"}
  batch:         # 批量与每件人工：订单批量 150 → 300 → 1000 → 3000 件轮换
    page: line
    selector: "#cBatch"
    loop: 12
    steps:
      - {at: 0, press: "[data-m=batch]", set: {s_Q: 150}}
      - {at: 3, set: {s_Q: 300}}
      - {at: 6, set: {s_Q: 1000}}
      - {at: 9, set: {s_Q: 3000}}

slides:
  - layout: cover
    video: hero
    kicker: ["第 29 讲", "Lecture 29"]
    title: ["典型服装工厂", "Typical Garment Factories"]
    sub: ["产品决定工序，工序决定设备，批量决定组织", "Product sets the operations, operations the machines, batch size the organisation"]
    notes:
      - "同学们好。前面二十八讲我们一直在看一台台机器，这一讲把镜头拉远，走进五类工厂：定制西服、衬衫、T 恤、毛衫和小单快反。背景里是今天的虚拟实验：一条 T 恤吊挂线，衣架沿主轨转，工位上的人在做、在等。为什么不同的工厂长得不一样？记住一条主线：产品决定工序，工序决定设备，批量决定组织。"
      - "Hello everyone. For twenty-eight lectures we've looked at machines one by one. Today we pull back and walk into five kinds of factory: made-to-measure suits, shirts, T-shirts, knitwear, and small-batch quick response. In the background is today's lab: a T-shirt hanger line, hangers circling the main rail, operators working or waiting. Why do these factories look so different? Remember one thread: the product sets the operations, the operations set the machines, and the batch size sets the organisation."

  - layout: question
    tag: ["车间问题", "Shop-floor problem"]
    title: ["一条 T 恤线要配几个人？", "How many people does a T-shirt line need?"]
    facts:
      - ["基本款圆领 T 恤大单，目标 200 件/时", "A big order for a basic crew-neck tee: 200 an hour"]
      - ["16 道工序合计 5.841 分；最长合侧缝 0.655 分", "16 operations, 5.841 min in all; longest, side seams, 0.655"]
      - ["主任想一人一道、每道 SMV ÷ 节拍向上取整", "The manager plans one op each, SMV ÷ takt rounded up"]
    notes:
      - "先看车间问题。一家 T 恤厂接到基本款圆领短袖的大单，目标每小时 200 件。16 道工序合计 5.841 分：包缝 1.863、绷缝 1.506、平缝 1.334、手工 1.138，最长的合侧缝 0.655 分。主任想一人一道工序、每道 SMV 除以节拍向上取整来配人。节拍多少？至少几人？逐道配置几人、平衡率多少？同机种合并又怎样？"
      - "Here's the problem. A T-shirt factory wins a big order for a basic crew-neck tee at 200 an hour. Its 16 operations total 5.841 minutes: overlock 1.863, coverstitch 1.506, lockstitch 1.334, hand 1.138, the longest being side seams at 0.655. The manager plans one operation each, staffed by SMV over takt rounded up. What's the takt and the minimum headcount? How many, at what balance, operation by operation? And merging by machine type?"

  - layout: section
    num: "01"
    title: ["同样做衣服，工厂为什么不一样", "Same garments, different factories: why?"]

  - layout: tiles
    title: ["五类工厂，三个问题", "Five factories, three questions"]
    tiles:
      - {k: "西服", name: ["300 多道工序", "300+ operations"], use: ["每件不同：数据先行、单件流", "Every piece differs: data first"]}
      - {k: "衬衫", name: ["工时在小部件上", "Time goes into small parts"], use: ["领、袖头、袖衩：自动单元", "Collars, cuffs: automatic units"]}
      - {k: "T 恤", name: ["十几道，针织布", "A dozen ops, knit fabric"], use: ["包缝、绷缝的世界", "A world of overlock and cover"]}
      - {k: "毛衫", name: ["衣片是织出来的", "Panels are knitted"], use: ["套口，或全成型", "Linking, or whole-garment"]}
      - {k: "快反", name: ["一百件也接", "Even 100 pieces"], use: ["换款快：U 型单元", "Fast changeover: U cells"]}
      - {k: "?", name: ["结构 · 面料 · 批量", "Structure · fabric · batch"], use: ["产品→工序→设备→组织", "Product → ops → machines → organisation"], hot: true}
    notes:
      - "五类工厂各有最有特点的环节。西服 300 多道工序，难在每件不同；衬衫的工时花在领、袖头、袖衩这些小部件上；T 恤是针织布，离不开包缝和绷缝；毛衫的衣片是织出来的；小单快反一百件也接，靠换款快。为什么不一样？三个问题：产品结构定工序，面料定线迹和机器，批量定产线组织。"
      - "Each kind of factory has its signature. Suits have over 300 operations, and every piece differs. Shirts spend their time on small parts: collars, cuffs, plackets. T-shirts are knit, so overlock and coverstitch rule. Knitwear panels are knitted. Quick response takes orders of a hundred and lives on fast changeovers. Why the differences? Product structure sets the operations, fabric sets the stitches and machines, batch size sets the organisation."

  - layout: section
    num: "02"
    title: ["定制西服：数据先行，实物单件流", "Made-to-measure suits: data first, then single-piece flow"]

  - layout: split
    title: ["一张订单驱动近一万个数据变化", "One order drives nearly ten thousand data changes"]
    points:
      - ["3D 量体约 7 秒，采 19 个部位 22 项尺寸", "3D body scan, about 7 s: 22 sizes at 19 sites"]
      - ["输出排料文件、吊挂路线、工位工艺说明", "Out come markers, hanger routes, station instructions"]
      - ["单量单裁，挂上吊挂，配 RFID 标签", "Cut one at a time, hung, tagged with RFID"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <defs><marker id="m29" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8fa3ba"/></marker></defs>
          <text x="20" y="40" font-size="26" font-weight="700" fill="#8fb6ff">数据</text>
          <g font-size="27" text-anchor="middle">
            <rect x="20" y="60" width="200" height="110" rx="18" fill="#111d31" stroke="#4c8dff" stroke-width="3"/><text x="120" y="110" fill="#f3f6fa">3D 量体</text><text x="120" y="148" font-size="22" fill="#8fa3ba">约 7 秒</text>
            <rect x="290" y="60" width="240" height="110" rx="18" fill="#111d31" stroke="#4c8dff" stroke-width="3"/><text x="410" y="110" fill="#f3f6fa">版型·工艺·物料</text><text x="410" y="148" font-size="22" fill="#8fa3ba">数据库</text>
            <rect x="600" y="20" width="280" height="56" rx="12" fill="#111d31" stroke="#2ec4b6" stroke-width="2"/><text x="740" y="57" font-size="25" fill="#5ee0d2">排料文件</text>
            <rect x="600" y="88" width="280" height="56" rx="12" fill="#111d31" stroke="#2ec4b6" stroke-width="2"/><text x="740" y="125" font-size="25" fill="#5ee0d2">吊挂工序路线</text>
            <rect x="600" y="156" width="280" height="56" rx="12" fill="#111d31" stroke="#2ec4b6" stroke-width="2"/><text x="740" y="193" font-size="25" fill="#5ee0d2">工位工艺说明</text>
          </g>
          <path d="M222 115 L285 115 M532 115 L595 50 M532 115 L595 116 M532 115 L595 184" stroke="#8fa3ba" stroke-width="3" fill="none" marker-end="url(#m29)"/>
          <path d="M20 270 L880 270" stroke="#22324d" stroke-width="3" stroke-dasharray="10 8"/>
          <text x="20" y="320" font-size="26" font-weight="700" fill="#ff9c75">实物</text>
          <g font-size="27" text-anchor="middle">
            <rect x="20" y="345" width="250" height="120" rx="18" fill="#111d31" stroke="#ff7a45" stroke-width="3"/><text x="145" y="398" fill="#f3f6fa">单层裁剪</text><text x="145" y="438" font-size="22" fill="#8fa3ba">单量单裁</text>
            <rect x="325" y="345" width="250" height="120" rx="18" fill="#111d31" stroke="#ff7a45" stroke-width="3"/><text x="450" y="398" fill="#f3f6fa">挂上吊挂</text><text x="450" y="438" font-size="22" fill="#8fa3ba">配 RFID 标签</text>
            <rect x="630" y="345" width="250" height="120" rx="18" fill="#111d31" stroke="#ff7a45" stroke-width="3"/><text x="755" y="398" fill="#f3f6fa">工人刷卡</text><text x="755" y="438" font-size="22" fill="#8fa3ba">看这一件的要求</text>
          </g>
          <path d="M272 405 L320 405 M577 405 L625 405" stroke="#8fa3ba" stroke-width="3" marker-end="url(#m29)"/>
          <rect x="20" y="520" width="860" height="90" rx="20" fill="rgba(242,183,5,.12)"/>
          <text x="450" y="577" font-size="30" font-weight="700" fill="#ffd75a" text-anchor="middle">捆里各不相同，捆扎流水就崩了</text>
        </svg>
    notes:
      - "西服难在每一件都不一样。捆扎流水把十到三十件同尺寸衣片扎成一捆，捆里各不相同，这套办法就崩了。所以定制工厂分两排：上排是数据，3D 量体约 7 秒，生成排料文件、吊挂路线和工位工艺说明；下排是实物，单层裁剪，挂上吊挂、配电子标签，工人刷卡就看到这一件的要求。"
      - "What makes suits hard is that every piece differs. The bundle system ties 10 to 30 same-size pieces together; once every piece differs, it collapses. So made-to-measure plants run two rows. Data on top: a 3D scan in about 7 seconds produces the marker file, the hanger route and station instructions. Material below: cut one at a time, hung with an electronic tag, and the operator's swipe shows what this suit needs."

  - layout: split
    title: ["吊挂认路，绱袖分段缩缝", "Hangers find their way; sleeves are eased in sections"]
    points:
      - ["支轨入口读卡：做下一道、有空位才拨入", "Reader at each spur: in only if next op and room"]
      - ["袖山比袖窿长 3 cm：平均缩缝约 {{ch29.ease:.1f}}%", "Sleeve cap 3 cm longer: about {{ch29.ease:.1f}}% ease"]
      - ["顶部多吃、袖底几乎不吃：上下两套送布", "More at the crown, none underarm: two feed systems"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <path d="M150 470 C 150 180, 750 180, 750 470" stroke="#f2b705" stroke-width="10" fill="none"/>
          <path d="M190 470 C 210 260, 690 260, 710 470" stroke="#2ec4b6" stroke-width="10" fill="none"/>
          <text x="450" y="160" font-size="30" font-weight="700" fill="#ffd75a" text-anchor="middle">袖山 50 cm</text>
          <text x="450" y="420" font-size="30" font-weight="700" fill="#5ee0d2" text-anchor="middle">袖窿 47 cm</text>
          <g stroke="#ff7a45" stroke-width="5">
            <path d="M405 230 l10 -20 l10 20 l10 -20 l10 20 l10 -20 l10 20 l10 -20"/>
          </g>
          <text x="560" y="215" font-size="26" fill="#ff9c75">顶部多吃</text>
          <text x="80" y="520" font-size="26" fill="#8fa3ba">袖底几乎不吃</text>
          <text x="820" y="520" font-size="26" fill="#8fa3ba" text-anchor="end">袖底几乎不吃</text>
          <rect x="100" y="555" width="700" height="70" rx="18" fill="rgba(242,183,5,.12)"/>
          <text x="450" y="602" font-size="28" font-weight="700" fill="#ffd75a" text-anchor="middle">3 ÷ 47 ≈ {{ch29.ease:.1f}}%，99 个程序 × 30 段</text>
        </svg>
    notes:
      - "吊挂怎么认路？每个工位的支轨入口装读卡器，衣架经过时读编号、查下一道工序，这个工位做这道、还有空位才拨进来，还能优先派给空闲的人。再看绱袖：袖山比袖窿长 3 厘米，袖窿 47 厘米，平均缩缝约 {{ch29.ease:.1f}}%，要分段，顶部多吃、袖底几乎不吃。绱袖机上下两套送布分别设定，和差动送布一个道理。"
      - "How do hangers route? A reader at each spur entrance reads the hanger, looks up its next operation, and switches it in only if this station does it and has room, favouring idle stations. Now sleeve setting: the cap is 3 centimetres longer than the 47-centimetre armhole, about {{ch29.ease:.1f}} percent ease, distributed with plenty at the crown and almost none underarm. The machine sets upper and lower feeds separately, like differential feed."

  - layout: bignum
    title: ["利特尔法则：为什么单件流交期短", "Little's law: why single-piece flow is fast"]
    nums:
      - {n: "{{ch29.suit1:.0f}} h", n_en: "1500 ÷ 30", label: ["西服线在制品 1500 套", "Suit line, 1500 suits in WIP"]}
      - {n: "{{ch29.suit2:.0f}} h", n_en: "300 ÷ 30", label: ["在制品压到 300 套", "WIP cut to 300"]}
      - {n: "4.16 天", n_en: "days", label: ["衬衫捆 10 → 70 件：0.61 → 4.16 天", "Shirt bundles 10 → 70: 0.61 → 4.16 days"]}
    foot: ["平均生产周期 = 在制品 ÷ 产量：任何稳定运行的系统都成立", "Throughput time = WIP ÷ output: true of any stable system"]
    notes:
      - "为什么单件流交期短？利特尔法则：平均生产周期等于在制品除以产量，对任何稳定运行的系统都成立。西服线每小时 30 套，在制品 1500 套，一套要走 {{ch29.suit1:.0f}} 小时；压到 300 套，只要 {{ch29.suit2:.0f}} 小时。衬衫线把捆从 10 件加到 70 件，周期从 0.61 天拉长到 4.16 天。想交期短，就得压在制品。"
      - "Why is single-piece flow fast? Little's law: throughput time equals WIP over output, for any stable system. A suit line making 30 an hour with 1500 in progress keeps each suit {{ch29.suit1:.0f}} hours; cut WIP to 300 and it's {{ch29.suit2:.0f}}. A shirt line growing bundles from 10 to 70 stretched throughput from 0.61 to 4.16 days. Short lead times need low WIP."

  - layout: section
    num: "03"
    title: ["衬衫：工时花在小部件上", "Shirts: the time goes into small parts"]

  - layout: split
    title: ["领、袖头、袖衩占了四成多", "Collar, cuffs and plackets: over 40%"]
    points:
      - ["41 道缝制工序，合计约 {{ch29.shirt:.1f}} 分", "41 sewing operations, about {{ch29.shirt:.1f}} min"]
      - ["三种小部件占 {{ch29.small:.0f}}%，全部部件占 {{ch29.parts:.0f}}%", "Three small parts {{ch29.small:.0f}}%; all parts {{ch29.parts:.0f}}%"]
      - ["布局：五条部件线汇入一条组装线", "Layout: five part lines feed one assembly line"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <text x="20" y="40" font-size="26" fill="#8fa3ba">衬衫各部分工时（分，算例）</text>
          <g font-size="28" font-weight="700">
            <text x="20" y="115" fill="#f3f6fa">领</text><rect x="150" y="80" width="257" height="50" rx="10" fill="#f2b705"/><text x="420" y="115" fill="#ffd75a" class="en">3.62</text>
            <text x="20" y="190" fill="#f3f6fa">袖头</text><rect x="150" y="155" width="273" height="50" rx="10" fill="#f2b705"/><text x="436" y="190" fill="#ffd75a" class="en">3.85</text>
            <text x="20" y="265" fill="#f3f6fa">袖衩</text><rect x="150" y="230" width="157" height="50" rx="10" fill="#f2b705"/><text x="320" y="265" fill="#ffd75a" class="en">2.21</text>
            <text x="20" y="340" fill="#f3f6fa">前片</text><rect x="150" y="305" width="300" height="50" rx="10" fill="#4c8dff"/><text x="463" y="340" fill="#8fb6ff" class="en">4.22</text>
            <text x="20" y="415" fill="#f3f6fa">后片</text><rect x="150" y="380" width="60" height="50" rx="10" fill="#4c8dff"/><text x="223" y="415" fill="#8fb6ff" class="en">0.84</text>
            <text x="20" y="490" fill="#f3f6fa">组装</text><rect x="150" y="455" width="538" height="50" rx="10" fill="#4b5f7d"/><text x="700" y="490" fill="#d3deea" class="en">7.58</text>
          </g>
          <path d="M600 80 L640 80 L640 280 L600 280" stroke="#f2b705" stroke-width="4" fill="none"/>
          <text x="660" y="170" font-size="40" font-weight="800" fill="#ffd75a" class="en">{{ch29.small:.0f}}%</text>
          <text x="660" y="210" font-size="24" fill="#d3deea">三种小部件</text>
          <text x="450" y="590" font-size="27" fill="#5ee0d2" text-anchor="middle">小而平、形状固定、重复多 → 最适合自动化</text>
        </svg>
    notes:
      - "衬衫是另一种情形。41 道缝制工序约 {{ch29.shirt:.1f}} 分，工时花在哪？领 3.62、袖头 3.85、袖衩 2.21 分，三种小部件占 {{ch29.small:.0f}}%，全部部件占 {{ch29.parts:.0f}}%，组装只占三分之一。所以衬衫厂是五条部件线汇入一条组装线。小部件小而平、形状固定、重复多，最适合模板加 X–Y 的自动单元。"
      - "Shirts are different. Their 41 sewing operations take about {{ch29.shirt:.1f}} minutes; where does it go? Collar 3.62, cuffs 3.85, plackets 2.21: those three are {{ch29.small:.0f}} percent, all parts {{ch29.parts:.0f}} percent, assembly a third. So shirt plants run five part lines into one assembly line. The small parts are flat, fixed in shape and repetitive: ideal for template-plus-X-Y automatic units."

  - layout: bignum
    title: ["一台口袋机顶几个人", "How many people does one pocket setter replace?"]
    nums:
      - {n: "{{ch29.hand:.2f}} 分", n_en: "by hand", label: ["扣烫 0.542 + 贴袋 0.861", "Press 0.542 + set 0.861"]}
      - {n: "{{ch29.mach:.2f}} 分", n_en: "by machine", label: ["8 小时 2400 个", "2400 in 8 hours"]}
      - {n: "{{ch29.hand_people:.1f}} 人", n_en: "vs {{ch29.mach_min:.0f}} min/h", label: ["140 件/时要的手工人数", "Hand workers needed at 140/h"]}
    foot: ["140 件/时：手工约 {{ch29.hand_people:.1f}} 人；机器每小时只用 {{ch29.mach_min:.0f}} 分钟，一台不到半负荷", "At 140 an hour: about {{ch29.hand_people:.1f}} people by hand; the machine runs {{ch29.mach_min:.0f}} min an hour, under half-loaded"]
    notes:
      - "算一笔口袋机的账。手工做一个贴袋，扣烫加贴袋约 {{ch29.hand:.2f}} 分；口袋机 8 小时做 2400 个，每个 {{ch29.mach:.2f}} 分。每小时 140 件的衬衫线，手工约要 {{ch29.hand_people:.1f}} 个人；机器每小时只用 {{ch29.mach_min:.0f}} 分钟，一台不到半负荷，两条线可以共用。这就是衬衫厂自动化先从小部件做起的原因。"
      - "Do the sums for a pocket setter. By hand, pressing and setting a patch pocket takes about {{ch29.hand:.2f}} minutes; the machine makes 2400 in 8 hours, {{ch29.mach:.2f}} minutes each. A shirt line at 140 an hour needs about {{ch29.hand_people:.1f}} people by hand, but the machine runs only {{ch29.mach_min:.0f}} minutes an hour, under half-loaded, so two lines can share it. That's why shirt plants automate small parts first."

  - layout: section
    num: "04"
    title: ["T 恤：配人与平衡", "T-shirts: staffing and balance"]

  - layout: bignum
    title: ["节拍 18 秒，理论至少 {{ch29.nmin}} 人", "Takt 18 seconds, at least {{ch29.nmin}} people"]
    nums:
      - {n: "{{ch29.takt_s:.0f}} s", n_en: "takt = 60 ÷ 200", label: ["整条线平均多久交出一件", "How often the line must deliver"]}
      - {n: "{{ch29.theo:.1f}}", n_en: "5.841 ÷ 0.30", label: ["理论人数，至少 {{ch29.nmin}} 人", "Theoretical people: at least {{ch29.nmin}}"]}
      - {n: "{{ch29.olfl:.0f}}%", n_en: "overlock + cover", label: ["包缝 + 绷缝承担的工时", "Work on overlock and coverstitch"]}
    foot: ["针织布弹、卷边、切口脱散：合缝用四线包缝，卷边用绷缝，平缝只钉标和封结", "Knit stretches, curls and runs: 4-thread overlock to join, coverstitch to hem, lockstitch only for labels"]
    notes:
      - "T 恤是针织布，弹、卷边、切口脱散，合缝用四线包缝，卷边用绷缝，平缝只钉标和封结，包缝和绷缝承担 {{ch29.olfl:.0f}}% 的工时。节拍是整条线平均多久交出一件：每小时 200 件就是 {{ch29.takt_s:.0f}} 秒。理论人数等于总工时除以节拍，5.841 除以 0.30 约 {{ch29.theo:.1f}}，至少 {{ch29.nmin}} 人。"
      - "T-shirts are knit: stretchy, curling, running at cut edges, so seams use four-thread overlock, hems coverstitch, and lockstitch only labels and bartacks; overlock and coverstitch carry {{ch29.olfl:.0f}} percent of the work. Takt is how often the line must deliver: {{ch29.takt_s:.0f}} seconds for 200 an hour. Theoretical headcount is total time over takt, 5.841 over 0.30, about {{ch29.theo:.1f}}, so at least {{ch29.nmin}}."

  - layout: figure
    title: ["平衡图：瓶颈一眼看出", "The balance chart shows the bottleneck at a glance"]
    visual: {video: bal}
    caption: ["资料原配置 22 人：瓶颈是 1 人的剪线头，上限 {{ch29.cap22:.0f}} 件/时 ↔ 按节拍逐道配置 {{ch29.N_op}} 人", "22 ↔ {{ch29.N_op}} people"]
    notes:
      - "平衡图在两种配置之间切换，柱是每人负荷，横线是节拍。资料原配置 22 人，最高的柱是只有 1 人的剪线头，产能上限约 {{ch29.cap22:.0f}} 件；只在剪线头加 1 人，产量升到约 {{ch29.cap23:.0f}}，加在别处几乎没用。按节拍逐道取整要 {{ch29.N_op}} 人，柱子都在节拍下，可很多离节拍很远，那就是在等活。"
      - "The chart switches between two plans; bars are load per person, the line is takt. In the published 22-person plan the tallest bar is thread trimming with one person, capping output at about {{ch29.cap22:.0f}}; add one person there and it rises to about {{ch29.cap23:.0f}}, anywhere else and almost nothing changes. Staffing each operation by takt takes {{ch29.N_op}} people, all bars under takt, many far below it: waiting."

  - layout: duo
    title: ["捆扎流水 vs 吊挂单件流", "Progressive bundle vs unit production"]
    left: {video: pbs, label: ["捆扎流水：在制品 600 件", "Bundles: 600 in progress"], note: ["一件衣服走约 3.5 小时", "About 3.5 h per garment"]}
    right: {video: ups, label: ["吊挂 + 按机种合并 21 人", "Hangers, 21 grouped by machine"], note: ["约 190 件/时，周期不到 20 分", "About 190/h, under 20 min"]}
    notes:
      - "实验把这条线真的开起来，每件工时按 12% 的变异系数波动。左边捆扎流水，在制品 600 件，捆在工位间排队，一件衣服约走 {{ch29.pbs_min:.0f}} 分钟。右边吊挂单件流，按机种合并 21 人，衣架按工位空闲派活，约 190 件每小时，线上五十来件，周期约 {{ch29.ups_min:.0f}} 分钟。组织方式决定纸面平衡率能保住多少。"
      - "The lab actually runs the line, with operation times varying by 12 percent. On the left, bundles: 600 pieces in progress queuing between stations, so a garment takes about {{ch29.pbs_min:.0f}} minutes. On the right, hangers with 21 people grouped by machine, work sent to idle stations: about 190 an hour, fifty-odd on the line, about {{ch29.ups_min:.0f}} minutes through. The organisation decides how much paper balance survives."

  - layout: lab
    title: ["动手试一试：缝制车间产线仿真", "Try it: simulating a sewing floor"]
    shot: {page: line, set: [press: "[data-m=pbs]"]}
    tasks:
      - ["只加 1 个人：加在哪里产量涨得最多", "Add one person: where does it help most?"]
      - ["调捆的大小和在制品上限，缩短生产周期", "Tune bundle size and WIP cap to cut lead time"]
      - ["U 型单元：换几种排列，比较产量", "U cell: try different orders and compare"]
    notes:
      - "实验 29-1 在问渠平台上自己做，左侧指导一步步带着走。捆扎流水、资料原配置 22 人，先找瓶颈，再只加 1 个人，试加在不同工序上，每次重新开工、跳到下班看产量。然后调捆的大小、在制品上限，看生产周期怎样变，核对在制品约等于产量乘周期。最后到 U 型单元，换几种人员排列比较产量。"
      - "Lab 29-1 is on WenQuest, with a step-by-step guide on the left. With bundles and the 22-person plan, find the bottleneck, then add one person at different operations, restarting and jumping to shift end each time. Then tune bundle size and WIP cap, watch the throughput time, and check that WIP is about output times throughput time. Finally, in the U cell, try several orders of operators and compare output."

  - layout: section
    num: "05"
    title: ["毛衫、小单快反与设备选型", "Knitwear, quick response and choosing equipment"]

  - layout: split
    title: ["毛衫：套口与全成型的工时账", "Knitwear: the labour sums of linking vs whole-garment"]
    points:
      - ["成型衣片：每件人工约 {{ch29.ff:.0f}} 分，套口占六成", "Fully-fashioned: about {{ch29.ff:.0f}} min a piece, 60% linking"]
      - ["全成型：约 {{ch29.wg:.0f}} 分，但每件占横机 30 分钟", "Whole-garment: about {{ch29.wg:.0f}} min, but 30 min of machine time"]
      - ["日产 1000 件：{{ch29.knit_n:.0f}} 台 + {{ch29.linkers:.0f}} 名套口工 ↔ {{ch29.wg_n:.0f}} 台", "1000 a day: {{ch29.knit_n:.0f}} machines + {{ch29.linkers:.0f}} linkers ↔ {{ch29.wg_n:.0f}}"]
