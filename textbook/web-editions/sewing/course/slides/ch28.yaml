          <g font-size="27" text-anchor="middle">
            <rect x="250" y="285" width="400" height="56" rx="12" fill="#111d31" stroke="#f2b705" stroke-width="3"/><text x="450" y="322" fill="#f3f6fa">合前后裆 · 合侧缝</text>
            <rect x="250" y="365" width="400" height="56" rx="12" fill="#111d31" stroke="#f2b705" stroke-width="3"/><text x="450" y="402" fill="#f3f6fa">侧缝压明线 · 合下裆 0.70</text>
            <rect x="250" y="445" width="400" height="56" rx="12" fill="#111d31" stroke="#f2b705" stroke-width="3"/><text x="450" y="482" fill="#f3f6fa">绱腰头 1.30 · 钉串带</text>
            <rect x="250" y="525" width="400" height="56" rx="12" fill="#111d31" stroke="#f2b705" stroke-width="3"/><text x="450" y="562" fill="#f3f6fa">卷裤脚 · 锁眼钉扣 · 检验</text>
          </g>
          <path d="M450 341 L450 360 M450 421 L450 440 M450 501 L450 520" stroke="#8fa3ba" stroke-width="4" marker-end="url(#f28)"/>
          <text x="450" y="625" font-size="23" fill="#8fa3ba" text-anchor="middle">数字 = 标准工时（分，算例）</text>
        </svg>
    notes:
      - "IE 先把衣服按加工顺序拆成工序，长流水拆得细，单元式拆得粗。每道工序写清机器、线迹针距、工艺要求和前道。休闲裤 23 道：后片、前片、门襟三个部件先各自做，再合裆、合侧缝、合下裆、绱腰头、卷裤脚，合计 {{ch28.total:.2f}} 分。同类产品工时能差好几倍，工厂要用自己测的数据。"
      - "The IE first splits the garment into operations in processing order, finely for a long line, coarsely for a cell, each with its machine, stitch, requirements and predecessors. The chinos take 23: back, front and fly made separately, then rise, side seams, inseam, waistband and hems, {{ch28.total:.2f}} minutes in all. Times for similar products differ several-fold, so factories use their own data."

  - layout: bignum
    title: ["标准工时：测时 × 评比 × (1 + 宽放)", "Standard minute: observed × rating × (1 + allowance)"]
    nums:
      - {n: "0.48 分", n_en: "observed", label: ["“侧缝压明线”测 10 次的平均", "Mean of 10 timings, side-seam topstitch"]}
      - {n: "{{ch28.basic:.3f}}", n_en: "× 110% rating", label: ["做得利索，评比 110%", "A brisk operator, rated 110%"]}
      - {n: "{{ch28.sam:.2f}} 分", n_en: "× 1.14 · {{ch28.sam_s:.0f}} s", label: ["个人、疲劳、机器宽放共 14%", "Personal, fatigue, machine: 14%"]}
    foot: ["标准工时：熟练工人按规定方法、正常速度完成一道工序的时间，加必要的宽放", "A standard minute: a trained worker, the set method, normal pace, plus the necessary allowances"]
    notes:
      - "标准工时是熟练工人按规定方法、正常速度完成一道工序的时间，加上必要的宽放。以侧缝压明线为例：秒表测 10 次，平均 0.48 分；这位工人做得利索，评比 110%，基本时间 {{ch28.basic:.3f}} 分；再加个人 5%、疲劳 4%、机器 5% 共 14% 的宽放，标准工时约 {{ch28.sam:.2f}} 分，也就是 {{ch28.sam_s:.0f}} 秒。"
      - "A standard minute is the time a trained worker needs by the set method at normal pace, plus allowances. For the side-seam topstitch: ten stopwatch timings average 0.48 minutes; the operator is brisk, rated 110 percent, so the basic time is {{ch28.basic:.3f}}; add 14 percent for personal needs, fatigue and machine, and the standard minute is about {{ch28.sam:.2f}}, or {{ch28.sam_s:.0f}} seconds."

  - layout: figure
    title: ["最高转速有多大用？", "How much does top speed buy?"]
    visual: {video: seam}
    caption: ["333 针一道缝：4000 → 5000 r/min 一道 5.75 → 4.80 s，两道只省 36 s 的 5%", "333 stitches: 5.75 → 4.80 s a seam"]
    notes:
      - "缝纫工约 80% 的时间在拿放和引导布料。最高转速有多大用？实验页按速度曲线算一道缝，最高转速在 4000、5000、6000 之间轮换。333 针的一道缝从 4000 提到 5000，5.75 秒降到 4.80 秒，两道只省 36 秒里的 5%。40 针的短缝从 4000 提到 6000 只省 0.1 秒。缩短加减速、剪线和拿放更有用。"
      - "Operators spend about 80 percent of their time handling fabric. So how much does top speed buy? The lab computes one seam with the speed profile, cycling top speed through 4000, 5000 and 6000. A 333-stitch seam goes from 5.75 to 4.80 seconds at 5000 instead of 4000; two seams save only 5 percent of 36 seconds. A 40-stitch seam saves a tenth of a second at 6000. Faster ramps, trimming and handling matter more."

  - layout: section
    num: "03"
    title: ["生产线平衡", "Line balancing"]

  - layout: bignum
    title: ["节拍、最少人数与平衡率", "Takt, minimum headcount and balance"]
    nums:
      - {n: "{{ch28.takt:.1f}} 分", n_en: "takt = 60 ÷ 120", label: ["目标 120 件/时的节拍", "Takt for 120 pieces an hour"]}
      - {n: "{{ch28.N0}} 人", n_en: "N₀ = ⌈ΣSAM ÷ takt⌉", label: ["{{ch28.total:.2f}} ÷ 0.5，向上取整", "{{ch28.total:.2f}} ÷ 0.5, rounded up"]}
      - {n: "ΣSAM/NC", n_en: "balance η", label: ["平衡率：总工时 ÷ (人数 × 周期)", "Total time ÷ (people × cycle)"]}
    foot: ["周期 = 负荷最重的那个人的工时；实际产量 = 60 ÷ 周期：整条线由最忙的人决定", "Cycle = the busiest person's load; output = 60 ÷ cycle: the busiest person sets the line"]
    notes:
      - "线平衡的几个基本量：节拍等于 60 除以目标产量，每小时 120 件就是 {{ch28.takt:.1f}} 分；理论最少人数等于总工时除以节拍再向上取整，至少 {{ch28.N0}} 人。负荷最重的那个人的工时叫周期，实际产量等于 60 除以周期；平衡率等于总工时除以人数乘周期。整条线由最忙的那个人决定。"
      - "The basic quantities: takt is 60 over target output, {{ch28.takt:.1f}} minutes for 120 an hour; the theoretical minimum headcount is total time over takt, rounded up, at least {{ch28.N0}}. The busiest person's load is the cycle, output is 60 over the cycle, and balance is total time over people times cycle. The busiest person sets the pace of the whole line."

  - layout: figure
    title: ["零碎工时凑不了整", "Odd fractions of time can't be rounded away"]
    visual: {video: balance}
    caption: ["一道工序一组 {{ch28.one_N}} 人、{{ch28.one_bal:.1f}}% ↔ 自动分组 {{ch28.auto_N}} 人、{{ch28.auto_bal:.1f}}%（红虚线 = 节拍）", "{{ch28.one_N}} ↔ {{ch28.auto_N}} people"]
    notes:
      - "平衡图在两种分法之间切换，红虚线是节拍。一道工序一组时，工时超过节拍就多派人，可人数只能是整数：0.55 分的门襟压明线得派 2 人，每人一半时间在等；0.2 分的锁眼也占一人。结果 {{ch28.one_N}} 人，平衡率只有 {{ch28.one_bal:.1f}}%。切到自动分组，柱子齐了：{{ch28.auto_N}} 人，{{ch28.auto_bal:.1f}}%。"
      - "The chart switches between two splits; the red line is takt. With one operation per station you add people wherever time exceeds takt, but only in whole people: the 0.55-minute fly topstitch needs two, each idle half the time, and a 0.2-minute buttonhole still takes one. Result: {{ch28.one_N}} people, {{ch28.one_bal:.1f}} percent balance. Switch to automatic grouping and the bars even out: {{ch28.auto_N}} people, {{ch28.auto_bal:.1f}} percent."

  - layout: split
    title: ["分组共担与位置权重法", "Shared groups and the positional-weight method"]
    points:
      - ["相邻几道工序合成一组，几人共担", "Merge neighbouring operations; several people share them"]
      - ["一组 ≤ 4 人、≤ 4 道、≤ 2 种机器", "Per group: ≤ 4 people, ≤ 4 operations, ≤ 2 machine types"]
      - ["位置权重 = 本工序 + 其后全部工时", "Positional weight = own time + all that follows"]
