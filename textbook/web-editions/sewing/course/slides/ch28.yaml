slides:
  - layout: cover
    video: hero
    kicker: ["第 28 讲", "Lecture 28"]
    title: ["服装生产工艺与缝制车间", "Garment Processes and the Sewing Floor"]
    sub: ["一台缝纫机，在几十台中间怎样被用好", "One machine among dozens: how the floor puts it to work"]
    notes:
      - "同学们好。一台缝纫机设计得再好，到了车间里也只是几十台中的一台。这一讲从缝纫机走到缝制车间：一件衣服怎样从样衣变成大货，怎样拆成工序、测出工时，怎样把工序分给工人让整条线不等不堵，以及一个人该看几台自动机。背景里就是今天的虚拟实验：看机台数一变，人和机器的忙闲跟着变。"
      - "Hello everyone. However well a sewing machine is designed, on the floor it's one of dozens. Today we move from the machine to the sewing floor: how a garment goes from sample to bulk production, how it's split into operations and timed, how operations are shared out so the line neither waits nor jams, and how many automatic machines one person should tend. In the background is today's lab: change the number of machines tended and see who waits, the operator or the machines."

  - layout: question
    tag: ["车间问题", "Shop-floor problem"]
    title: ["26 个人，为什么做不到 120 件/时", "26 people: why not 120 pieces an hour?"]
    facts:
      - ["休闲裤线 26 人，23 道工序共 13.20 分/件", "A chinos line: 26 people, 23 operations, 13.20 min a piece"]
      - ["凭经验分工：绱拉链、合下裆各 0.70 分，各 1 人", "Split by feel: zip setting and inseam, 0.70 min each, one person each"]
      - ["主任想加人；另一案是两台专机，净投资 20 万", "The manager wants more people; or two special machines, ¥200k net"]
    notes:
      - "先看车间问题。一条休闲裤线 26 人，计划每小时 120 件，23 道工序共 13.20 分。原来凭经验一道工序一组，忙的多派一人；绱拉链、合下裆各 0.70 分，各 1 人。车间主任想加人；另一个方案是换自动开袋机和绱腰机，净投资 20 万元。现在实际能做多少？重新分组能做多少？专机划算吗？最后回答。"
      - "Here's the problem. A chinos line has 26 people and a plan of 120 an hour; 23 operations total 13.20 minutes. Work was split by feel, roughly one operation per station with extras where busy; zip setting and inseam take 0.70 minutes each, one person each. The manager wants more people; the alternative is a pocket setter and a waistband machine for a net 200 thousand yuan. What does the line make now, what could regrouping do, and do the machines pay? We'll answer at the end."

  - layout: section
    num: "01"
    title: ["从样衣到大货", "From sample to bulk production"]

  - layout: chain
    title: ["一件衣服进工厂走两段路", "A garment's two journeys through the factory"]
    steps: [["款式纸样", "Patterns"], ["样衣", "Sample"], ["工艺单", "Tech pack"], ["产前样", "PP sample"], ["排料裁剪", "Cutting"], ["缝制", "Sewing"], ["后整理", "Finishing"], ["检验包装", "Packing"]]
    hot: [5]
    mark: ["缝纫机", "here"]
    foot: ["缝制工序最多、用人最多：休闲裤算例里约占全部人工工时的八成", "Sewing has the most operations and people: about 80% of labour time in the chinos example"]
    notes:
      - "一件衣服进工厂走两段路。前一段是技术准备：款式纸样、样衣、工艺单、产前样；同时 IE 把衣服拆成工序、估出工时、排好生产线，这是这一讲的主要内容。后一段是大货生产：排料裁剪、缝制、后整理、检验包装。缝制工序最多、用人最多，休闲裤算例里约占人工工时的八成。"
      - "A garment takes two journeys through a factory. First, technical preparation: patterns, sample, tech pack and pre-production sample, while the industrial engineer splits it into operations, estimates times and lays out the line, which is most of today. Second, bulk production: cutting, sewing, finishing, inspection and packing. Sewing has the most operations and people, about 80 percent of labour time in our chinos example."

  - layout: split
    title: ["排料与裁剪：唛架与分床", "Marker making and cutting: markers and lays"]
    points:
      - ["唛架：纸样排在与布幅同宽的纸上", "A marker: patterns laid on paper as wide as the fabric"]
      - ["多件套排、大小码搭配：78% → 86%", "Several sizes in one marker: 78% → 86%"]
      - ["一床最多 80 层：200 层分 80、80、40", "At most 80 plies a lay: 200 = 80 + 80 + 40"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <text x="20" y="40" font-size="26" fill="#8fa3ba">面料利用率 = 衣片总面积 ÷ 唛架面积</text>
          <rect x="20" y="70" width="380" height="200" rx="10" fill="#22324d"/>
          <g fill="#4c8dff"><path d="M40 90 h120 v160 h-120z"/><path d="M180 90 h100 v90 h-100z"/><path d="M180 200 h70 v50 h-70z"/></g>
          <text x="210" y="310" font-size="28" font-weight="700" fill="#d3deea" text-anchor="middle">排 1 件：78%</text>
          <rect x="480" y="70" width="400" height="200" rx="10" fill="#22324d"/>
          <g fill="#2ec4b6"><path d="M490 80 h110 v180 h-110z"/><path d="M605 80 h95 v120 h-95z"/><path d="M705 80 h80 v180 h-80z"/><path d="M790 80 h80 v110 h-80z"/><path d="M605 205 h95 v55 h-95z"/><path d="M790 195 h80 v65 h-80z"/></g>
          <text x="680" y="310" font-size="28" font-weight="700" fill="#5ee0d2" text-anchor="middle">排 6 件、大小码搭配：86%</text>
          <text x="20" y="390" font-size="28" font-weight="700" fill="#f3f6fa">分床：每码 200 层，一床最多 80 层</text>
          <g font-size="30" font-weight="800" text-anchor="middle" class="en">
            <rect x="20" y="420" width="320" height="150" rx="14" fill="#f2b705"/><text x="180" y="508" fill="#0b1220">80</text>
            <rect x="360" y="420" width="320" height="150" rx="14" fill="#f2b705"/><text x="520" y="508" fill="#0b1220">80</text>
            <rect x="700" y="495" width="180" height="75" rx="14" fill="#ff7a45"/><text x="790" y="545" fill="#0b1220">40</text>
          </g>
          <text x="450" y="615" font-size="24" fill="#8fa3ba" text-anchor="middle">S 200 · M 400 · L 400 · XL 200，用 1:2:2:1 的六件唛架</text>
        </svg>
    notes:
      - "把纸样排在和布幅一样宽的纸上，这张图叫唛架；衣片面积占唛架面积的比例就是面料利用率。面料常占制造成本一半以上，利用率提高一两个百分点，比省几秒工时值钱得多。几件套排、大小码搭配，算例从 78% 升到 86%。订单按 1 比 2 比 2 比 1 的六件唛架，每码 200 层，一床最多 80 层，就分 80、80、40 三床。"
      - "Lay the patterns on paper as wide as the fabric: that's a marker, and the share it covers is fabric utilisation. Fabric is often over half the cost, so a point or two of utilisation beats saving seconds in sewing. Lay several sizes together and utilisation rises from 78 to 86 percent in our example. With a six-piece 1:2:2:1 marker every size needs 200 plies; at most 80 per lay, that's three lays, 80, 80 and 40."

  - layout: section
    num: "02"
    title: ["工序与标准工时", "Operations and standard minutes"]

