          <text x="450" y="270" font-size="34" font-weight="800" fill="#ffd75a" text-anchor="middle">合计 1.30 分 ÷ 3 人 = 每人 0.433 分</text>
          <g>
            <rect x="60" y="320" width="230" height="180" rx="16" fill="#2ec4b6"/>
            <rect x="335" y="320" width="230" height="180" rx="16" fill="#2ec4b6"/>
            <rect x="610" y="320" width="230" height="180" rx="16" fill="#2ec4b6"/>
            <path d="M40 296 L860 296" stroke="#ff7a45" stroke-width="4" stroke-dasharray="14 10"/>
            <text x="860" y="285" font-size="24" fill="#ff9c75" text-anchor="end">节拍 0.5</text>
            <g font-size="34" font-weight="800" fill="#08101d" text-anchor="middle" class="en"><text x="175" y="425">0.433</text><text x="450" y="425">0.433</text><text x="725" y="425">0.433</text></g>
          </g>
          <text x="450" y="570" font-size="28" fill="#d3deea" text-anchor="middle">包缝 + 平缝：两种机器，人轮流用</text>
          <text x="450" y="615" font-size="24" fill="#8fa3ba" text-anchor="middle">按位置权重排序，再用动态规划切分</text>
        </svg>
    notes:
      - "办法是把相邻几道工序合成一组，几个人共担。前片锁边、后片锁边、收后省共 1.30 分，3 人各 0.433 分，都在节拍以内。规则：一组不超过 4 人、4 道工序、2 种机器，不违反先后关系。位置权重等于本工序工时加其后所有工时，按权重排序，再用动态规划切分，就得到人数最少的分组。"
      - "The answer is to merge neighbouring operations into groups shared by several people. Front overlocking, back overlocking and back darts total 1.30 minutes; three people at 0.433 each, all under takt. Rules: at most four people, four operations and two machine types per group, and no broken precedence. Positional weight is an operation's time plus everything after it; sort by weight and cut with dynamic programming for the fewest people."

  - layout: bignum
    title: ["自动分组：平衡率都在 90% 以上", "Automatic grouping: balance above 90% every time"]
    nums:
      - {n: "{{ch28.auto_N}} 人", n_en: "120 / h · {{ch28.auto_bal:.1f}}%", label: ["节拍 0.5 分", "Takt 0.5 min"]}
      - {n: "{{ch28.N150}} 人", n_en: "150 / h · {{ch28.bal150:.1f}}%", label: ["节拍 0.4 分", "Takt 0.4 min"]}
      - {n: "{{ch28.N100}} 人", n_en: "100 / h · {{ch28.bal100:.1f}}%", label: ["节拍 0.6 分", "Takt 0.6 min"]}
    foot: ["节拍一变，工时与节拍的“凑整”关系就变，分组要重排；换款、改方法也要重做线平衡", "Change takt and the rounding changes, so regroup; a new style or method means rebalancing too"]
    notes:
      - "自动分组的结果：每小时 120 件要 {{ch28.auto_N}} 人，平衡率 {{ch28.auto_bal:.1f}}%；150 件要 {{ch28.N150}} 人，{{ch28.bal150:.1f}}%；100 件要 {{ch28.N100}} 人，{{ch28.bal100:.1f}}%。节拍一变，工时和节拍的凑整关系就变，分组要重排；换款、改方法也要重做。理论平衡没考虑个人快慢和波动，下一讲的吊挂和 U 型单元让线自己吸收。"
      - "Automatic grouping gives {{ch28.auto_N}} people at {{ch28.auto_bal:.1f}} percent for 120 an hour, {{ch28.N150}} at {{ch28.bal150:.1f}} for 150, and {{ch28.N100}} at {{ch28.bal100:.1f}} for 100. Change takt and the rounding changes, so regroup; a new style or method means rebalancing too. Theoretical balance ignores individual speed and variation; next lecture's hanger systems and U cells let the line absorb them."

  - layout: lab
    title: ["动手试一试：生产线平衡", "Try it: line balancing"]
    shot: {page: line21, set: [press: "#one"]}
    tasks:
      - ["先“一道工序一组”，再“自动分组”，比较", "Try 'one op per station', then 'auto group'; compare"]
      - ["调整工序顺序再切分，让人数再少一点", "Reorder and re-cut to save another person"]
      - ["第②页：改看机台数，找每件成本最低", "Page ②: vary machines tended, find the lowest cost"]
    notes:
      - "实验 28-1 在问渠平台上自己做。第①页目标 120 件、原设备，先点“一道工序一组”，记下人数、周期、产量和平衡率，再点“自动分组”比较；然后用上下箭头调整工序顺序，不违反前道关系，重新切分，看能不能再少一人。第②页恢复默认，把看机台数从 1 调到 6，记下周期和每件成本，找出最便宜的台数。"
      - "Lab 28-1 is on WenQuest. On page ①, at 120 an hour with the original equipment, click 'one operation per station' and record headcount, cycle, output and balance, then compare 'automatic grouping'; reorder operations with the arrows without breaking precedence and re-cut to try to save a person. On page ②, reset, step the machines tended from 1 to 6, record cycle and cost per piece, and find the cheapest."

  - layout: section
    num: "04"
    title: ["精益生产", "Lean production"]

  - layout: figure
    title: ["七种浪费：一切不增加价值的活动", "Seven wastes: everything that adds no value"]
    visual:
      svg: |
        <svg viewBox="0 0 1700 620" width="1700" height="620">
          <g font-size="44" font-weight="800" text-anchor="middle">
            <rect x="0" y="20" width="400" height="250" rx="26" fill="#111d31" stroke="#ff7a45" stroke-width="3"/><text x="200" y="120" fill="#ff9c75">做多了</text>
            <rect x="433" y="20" width="400" height="250" rx="26" fill="#111d31" stroke="#ff7a45" stroke-width="3"/><text x="633" y="120" fill="#ff9c75">等待</text>
            <rect x="866" y="20" width="400" height="250" rx="26" fill="#111d31" stroke="#ff7a45" stroke-width="3"/><text x="1066" y="120" fill="#ff9c75">搬运</text>
            <rect x="1300" y="20" width="400" height="250" rx="26" fill="#111d31" stroke="#ff7a45" stroke-width="3"/><text x="1500" y="120" fill="#ff9c75">加工过度</text>
            <rect x="0" y="330" width="400" height="250" rx="26" fill="#111d31" stroke="#f2b705" stroke-width="4"/><text x="200" y="430" fill="#ffd75a">库存</text>
            <rect x="433" y="330" width="400" height="250" rx="26" fill="#111d31" stroke="#ff7a45" stroke-width="3"/><text x="633" y="430" fill="#ff9c75">多余动作</text>
            <rect x="866" y="330" width="400" height="250" rx="26" fill="#111d31" stroke="#ff7a45" stroke-width="3"/><text x="1066" y="430" fill="#ff9c75">返工</text>
          </g>
          <g font-size="28" fill="#d3deea" text-anchor="middle">
            <text x="200" y="185">比订单多、提前太多</text><text x="633" y="185">等活、等机器</text><text x="1066" y="185">衣片来回搬</text><text x="1500" y="185">多缝了一道线</text>
            <text x="200" y="495">线上和仓库的在制品</text><text x="633" y="495">伸手太远、找东西</text><text x="1066" y="495">做坏了拆了重做</text>
          </g>
          <g font-size="24" fill="#8fa3ba" text-anchor="middle" class="en">
            <text x="200" y="230">overproduction</text><text x="633" y="230">waiting</text><text x="1066" y="230">transport</text><text x="1500" y="230">over-processing</text>
            <text x="200" y="540">inventory</text><text x="633" y="540">motion</text><text x="1066" y="540">rework</text>
          </g>
          <rect x="1300" y="330" width="400" height="250" rx="26" fill="rgba(46,196,182,.12)" stroke="#2ec4b6" stroke-width="3"/>
          <text x="1500" y="420" font-size="32" font-weight="700" fill="#5ee0d2" text-anchor="middle">缝纫机只在缝的</text>
          <text x="1500" y="465" font-size="32" font-weight="700" fill="#5ee0d2" text-anchor="middle">那几秒增加价值</text>
        </svg>
    notes:
      - "精益生产源自丰田生产方式，核心是消除浪费，也就是一切不增加价值的活动。服装车间常说七种：做多了、等待、搬运、加工过度、库存、多余动作、返工。缝纫机只在缝的那几秒给衣服增加价值，其余时间都可能是浪费。"
      - "Lean production comes from the Toyota Production System, and its core is removing waste: everything that adds no value. Garment floors name seven: overproduction, waiting, transport, over-processing, inventory, unnecessary motion and rework. A sewing machine adds value only in the seconds it sews; the rest can all be waste."

  - layout: points
    title: ["标准作业、快速换型、质量内建、5S", "Standard work, quick changeover, built-in quality, 5S"]
    points:
      - ["标准作业：最好的做法写下来；方法一变，工时重测", "Standard work: write down the best method; re-time when it changes"]
      - ["快速换型：停线前备好，停线的事变短", "Quick changeover: prepare before stopping; shorten the stop"]
      - ["质量内建与目视化：当场停下解决，一眼看得出", "Built-in quality, visual control: stop and fix; see at a glance"]
    foot: ["在制品越多，一件衣服在线上待得越久（利特尔法则），还会掩盖问题；小批量、单件流让问题马上暴露", "More WIP means longer throughput time (Little's law) and hidden problems; small batches expose them at once"]
    notes:
      - "几种常用做法。标准作业：把最好的做法写成作业指导书，标准工时就在它上面测，方法一变就要重测。快速换型：能提前做的在停线前做好，非停不可的事变短，比如电子针距直接调程序。质量内建：首件检验、当场停下解决。目视化和 5S 让车间状态一眼看得出。在制品越多，周期越长，还掩盖问题。"
      - "Some common practices. Standard work: write the best method into instructions; standard minutes are measured on it and re-timed when it changes. Quick changeover: do what you can before the line stops and shorten what can't wait, such as programmable stitch length. Built-in quality: first-piece checks and stopping to fix problems on the spot. Visual control and 5S show the floor's state at a glance. More WIP means longer lead time and hidden problems."

  - layout: section
    num: "05"
    title: ["设备配置与一人多机", "Equipment and multi-machine tending"]

  - layout: points
    title: ["设备配置与人机比", "Equipment and the machine-to-person ratio"]
    points:
      - ["每组各机种台数 = ⌈该机种工时 ÷ 周期⌉", "Machines per type in a group = ⌈its time ÷ cycle⌉"]
      - ["{{ch28.auto_N}} 人方案共 34 台，人机比约 1.17", "The {{ch28.auto_N}}-person plan: 34 machines, about 1.17 per person"]
      - ["另留 5%–10% 备用机，故障和换款时顶上", "Keep 5–10% spares for breakdowns and style changes"]
    foot: ["人机比太大，钱压在闲置机器上；太小，分工太粗、人排队等机器", "Too many machines ties money up in idle iron; too few, and people queue for machines"]
    notes:
      - "分组定了就能配设备：每组各机种台数等于该机种工时除以周期再向上取整。比如 3 人分担 1.2 分平缝配 3 台，0.2 分套结配 1 台轮流用。{{ch28.auto_N}} 人方案：平缝 20、包缝 8、套结 3，链缝、锁眼、钉扣各 1，共 34 台，人机比约 1.17。另留 5% 到 10% 备用机，故障时换上，换款时先调好。"
      - "With groups settled, equip them: machines of each type equal that type's time over the cycle, rounded up. Three people sharing 1.2 minutes of lockstitch work get three machines; 0.2 minutes of bartacking gets one, shared. The {{ch28.auto_N}}-person plan has 20 lockstitch, 8 overlock, 3 bartack and one each of chainstitch, buttonhole and button machines: 34, about 1.17 per person. Keep 5 to 10 percent spares for breakdowns and style changes."

  - layout: figure
    title: ["一个人看几台自动机", "How many automatic machines can one person tend?"]
    visual: {video: gantt}
    caption: ["C = max[n(a+w), a+t]；蓝 = 装卸，浅灰 = 走动，橙 = 自动缝，空白 = 等待", "Blue load · grey walk · orange sew · blank wait"]
    notes:
      - "花样机、自动开袋机这类设备，人只管装卸，机器自己缝，一人能看几台。设每台装卸 a、走动 w、自动缝 t。看 n 台时，人转一圈要 n 乘 a 加 w，机器一个循环要 a 加 t，周期取大的。实验页把台数从 1 调到 6：台数少，人在等机器；台数多，机器在等人。两者相等的台数叫平衡台数。"
      - "With pattern sewers and pocket setters the operator only loads and unloads while the machine sews, so one person can tend several. Let a be load time, w walking time and t sewing time. Tending n, the operator's round is n times a plus w, a machine's cycle is a plus t, and the cycle is the larger. As the lab steps n from 1 to 6, first the operator waits, then the machines do. Where they're equal is the balance point."

  - layout: bignum
    title: ["算例：看 3 台还是 4 台", "Worked example: tend 3 machines or 4?"]
    nums:
      - {n: "{{ch28.nstar:.2f}}", n_en: "n* = (a+t)/(a+w)", label: ["a 0.3、w 0.05、t 0.9 分", "a 0.3, w 0.05, t 0.9 min"]}
      - {n: "{{ch28.cost3:.3f}}", n_en: "yuan · 3 machines", label: ["周期 {{ch28.C3:.1f}} 分，人等 {{ch28.idle3:.0f}}%", "Cycle {{ch28.C3:.1f}}; operator idle {{ch28.idle3:.0f}}%"]}
      - {n: "{{ch28.cost4:.3f}}", n_en: "yuan · 4 machines", label: ["周期 {{ch28.C4:.1f}} 分，机器各等 {{ch28.midle4:.0f}}%", "Cycle {{ch28.C4:.1f}}; each machine idle {{ch28.midle4:.0f}}%"]}
    foot: ["每件成本 = (工资 + n × 设备费率) × C ÷ n；t 降到 0.6 分，n* = {{ch28.nstar6:.2f}}，最省变成 {{ch28.best6}} 台", "Cost = (wage + n × machine rate) × C ÷ n; at t = 0.6, n* = {{ch28.nstar6:.2f}} and {{ch28.best6}} machines is cheapest"]
    notes:
      - "算一下：a 0.3、w 0.05、t 0.9 分，平衡台数约 {{ch28.nstar:.2f}}。看 3 台，周期 {{ch28.C3:.1f}} 分，人等 {{ch28.idle3:.0f}}%；看 4 台，周期 {{ch28.C4:.1f}} 分，机器各等 {{ch28.midle4:.0f}}%。按成本选：工资 0.5 元每分、设备 0.08 元每分每台，3 台 {{ch28.cost3:.3f}} 元，4 台 {{ch28.cost4:.3f}} 元。有意思的是机器变快、t 降到 0.6 分，最省反而变成 {{ch28.best6}} 台。"
      - "Compute it: a 0.3, w 0.05 and t 0.9 minutes give a balance point of about {{ch28.nstar:.2f}}. Tending 3, the cycle is {{ch28.C3:.1f}} and the operator waits {{ch28.idle3:.0f}} percent; tending 4, the cycle is {{ch28.C4:.1f}} and each machine waits {{ch28.midle4:.0f}} percent. By cost, at 0.5 yuan wages and 0.08 per machine-minute, 3 cost {{ch28.cost3:.3f}} and 4 cost {{ch28.cost4:.3f}} a piece. Make the machine faster, t at 0.6, and the cheapest becomes {{ch28.best6}}."

  - layout: split
    title: ["案例：专机划不划算", "Case: are the special machines worth it?"]
    points:
      - ["开后袋 1.20 → 0.45，绱腰头 1.30 → 0.80 分", "Back pocket 1.20 → 0.45, waistband 1.30 → 0.80 min"]
      - ["总工时 {{ch28.imp_total:.2f}} 分：{{ch28.imp_N}} 人做到 120 件/时", "Total {{ch28.imp_total:.2f}} min: {{ch28.imp_N}} people make 120 an hour"]
      - ["比“设备不变加到 {{ch28.auto_N}} 人”省 3 人", "Three fewer than adding people to {{ch28.auto_N}}"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <text x="20" y="44" font-size="26" fill="#8fa3ba">做到 120 件/时需要的人</text>
          <rect x="60" y="120" width="300" height="380" rx="16" fill="#4b5f7d"/>
          <text x="210" y="100" font-size="64" font-weight="800" fill="#d3deea" text-anchor="middle" class="en">{{ch28.auto_N}}</text>
          <text x="210" y="550" font-size="28" fill="#d3deea" text-anchor="middle">设备不变</text>
          <rect x="460" y="160" width="300" height="340" rx="16" fill="#2ec4b6"/>
          <text x="610" y="140" font-size="64" font-weight="800" fill="#5ee0d2" text-anchor="middle" class="en">{{ch28.imp_N}}</text>
          <text x="610" y="550" font-size="28" fill="#5ee0d2" text-anchor="middle">两台专机</text>
          <text x="610" y="590" font-size="24" fill="#8fa3ba" text-anchor="middle">平衡率 {{ch28.imp_bal:.1f}}%</text>
          <path d="M370 140 L450 140" stroke="#f2b705" stroke-width="4" stroke-dasharray="8 6"/>
          <text x="410" y="300" font-size="40" font-weight="800" fill="#ffd75a" text-anchor="middle">−3</text>
        </svg>
    notes:
      - "再看专机。自动开袋机把开后袋从 1.20 分降到 0.45 分，绱腰机把绱腰头从 1.30 分降到 0.80 分。总工时降到 {{ch28.imp_total:.2f}} 分，{{ch28.imp_N}} 个人就能做到每小时 120 件，平衡率 {{ch28.imp_bal:.1f}}%，比设备不变加到 {{ch28.auto_N}} 人省 3 人。不过常换款、专机用不上或款式没有后袋时，这笔账就算不过来。"
      - "Now the special machines. A pocket setter cuts the back pocket from 1.20 to 0.45 minutes, a waistband machine the waistband from 1.30 to 0.80. Work content falls to {{ch28.imp_total:.2f}} minutes and {{ch28.imp_N}} people make 120 an hour at {{ch28.imp_bal:.1f}} percent balance, three fewer than adding people up to {{ch28.auto_N}}. But with frequent style changes or no back pockets, the sums don't work."

  - layout: split
    title: ["机器人联系：一台机器人照看几台机床", "Robot link: how many machine tools can one robot tend?"]
    points:
      - ["机器人上下料：同一个 C = max[n(a+w), a+t]", "Machine tending: the same C = max[n(a+w), a+t]"]
      - ["机床提速，一台机器人能看的台数变少", "Faster machine tools mean fewer per robot"]
      - ["双工位夹具缩短 a：和两套模板交替一样", "Dual fixtures shorten a, like alternating templates"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <circle cx="450" cy="330" r="70" fill="#111d31" stroke="#f2b705" stroke-width="4"/>
          <path d="M450 330 L540 250 L610 280" stroke="#ff7a45" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <circle cx="450" cy="330" r="18" fill="#f2b705"/><circle cx="540" cy="250" r="14" fill="#f2b705"/>
          <text x="450" y="440" font-size="26" font-weight="700" fill="#ffd75a" text-anchor="middle">机器人</text>
          <g font-size="26" font-weight="700" text-anchor="middle">
            <rect x="60" y="60" width="200" height="130" rx="16" fill="#111d31" stroke="#4c8dff" stroke-width="3"/><text x="160" y="135" fill="#8fb6ff">机床 1</text>
            <rect x="640" y="60" width="200" height="130" rx="16" fill="#111d31" stroke="#4c8dff" stroke-width="3"/><text x="740" y="135" fill="#8fb6ff">机床 2</text>
            <rect x="60" y="470" width="200" height="130" rx="16" fill="#111d31" stroke="#4c8dff" stroke-width="3"/><text x="160" y="545" fill="#8fb6ff">机床 3</text>
            <rect x="640" y="470" width="200" height="130" rx="16" fill="#111d31" stroke="#4c8dff" stroke-width="3"/><text x="740" y="545" fill="#8fb6ff">机床 4</text>
          </g>
          <path d="M370 270 C 330 230, 300 210, 262 190 M530 270 C 570 230, 600 210, 638 190 M370 390 C 330 430, 300 450, 262 470 M530 390 C 570 430, 600 450, 638 470" stroke="#8fa3ba" stroke-width="3" stroke-dasharray="8 8" fill="none"/>
          <text x="160" y="235" font-size="24" fill="#8fa3ba" text-anchor="middle">装卸 a</text>
          <text x="740" y="235" font-size="24" fill="#8fa3ba" text-anchor="middle">自动加工 t</text>
          <text x="450" y="40" font-size="24" fill="#8fa3ba" text-anchor="middle">机床间移动 w</text>
        </svg>
    notes:
      - "机器人上下料和一人多机是同一个模型：机器人每台装卸 a、移动 w，机床加工 t，周期取 n 乘 a 加 w 和 a 加 t 中大的那个。机器人快，一台能多看几台；机床提速、t 变小，能看的台数反而少，要靠双工位夹具缩短 a，和花样机两套模板交替一个道理。机器人线同样要做线平衡，最慢的工位决定产量。"
      - "Robot machine tending is the same model: the robot loads in time a and moves in w, the machine tool cuts for t, and the cycle is the larger of n times a plus w and a plus t. Robots are fast, so one tends more machines; speed up the machine tools and it tends fewer, so dual fixtures shorten a, just like alternating templates on a pattern sewer. Robot lines need balancing too: the slowest cell sets output."

  - layout: split
    title: ["生活中的例子：一个人同时看三台家电", "Everyday example: one person, three appliances"]
    points:
      - ["米进电饭煲、衣服进洗衣机、面包进烤箱", "Rice in the cooker, clothes in the washer, bread in the oven"]
      - ["转一圈回来，第一台正好好了", "Come round once, and the first is just done"]
      - ["机器都变快了，你反而跑得更忙", "Make them all faster, and you run around more"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <g font-size="28" font-weight="700" text-anchor="middle">
            <rect x="40" y="90" width="220" height="200" rx="40" fill="#111d31" stroke="#f3f6fa" stroke-width="4"/><ellipse cx="150" cy="120" rx="80" ry="18" fill="#22324d"/><text x="150" y="215" fill="#f3f6fa">电饭煲</text>
            <rect x="340" y="60" width="220" height="260" rx="20" fill="#111d31" stroke="#f3f6fa" stroke-width="4"/><circle cx="450" cy="200" r="70" fill="none" stroke="#4c8dff" stroke-width="8"/><text x="450" y="355" fill="#f3f6fa">洗衣机</text>
            <rect x="640" y="110" width="220" height="180" rx="16" fill="#111d31" stroke="#f3f6fa" stroke-width="4"/><rect x="665" y="140" width="170" height="110" rx="8" fill="#ff7a45" opacity=".6"/><text x="750" y="330" fill="#f3f6fa">烤箱</text>
          </g>
          <path d="M150 410 C 300 520, 600 520, 750 410" stroke="#f2b705" stroke-width="5" stroke-dasharray="14 10" fill="none"/>
          <path d="M750 410 C 600 470, 300 470, 150 410" stroke="#f2b705" stroke-width="3" stroke-dasharray="6 10" fill="none" opacity=".6"/>
          <text x="450" y="560" font-size="30" font-weight="700" fill="#ffd75a" text-anchor="middle">人转一圈 = n(a+w)</text>
          <text x="450" y="605" font-size="26" fill="#8fa3ba" text-anchor="middle">每台的“自动时间” t 越短，能同时照看的越少</text>
        </svg>
    notes:
      - "生活里你也一人多机。周末做家务，把米放进电饭煲、衣服塞进洗衣机、面包放进烤箱，转一圈回来，第一台正好好了，这就是一人多机。装米、塞衣服就是 a，在厨房和阳台之间走就是 w，机器自己干活的时间就是 t。要是机器都变快了，你反而要在几台之间跑得更忙，能同时照看的台数就少了。"
      - "You tend several machines at home too. On a weekend you put rice in the cooker, clothes in the washer and bread in the oven, go round once, and the first one is just finishing: that's multi-machine tending. Loading the rice or the clothes is a, walking between kitchen and balcony is w, and the time the machines work on their own is t. Make all the machines faster and you end up running between them more, and you can look after fewer at once."

