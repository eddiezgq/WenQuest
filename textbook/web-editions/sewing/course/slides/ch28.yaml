  - layout: summary
    title: ["本讲小结", "Summary"]
    points:
      - ["标准工时 = 观测 × 评比 × (1 + 宽放)", "Standard minute = observed × rating × (1 + allowance)"]
      - ["分组共担，平衡率从约 70% 提到 90% 以上", "Shared groups lift balance from ~70% to over 90%"]
      - ["一人多机 C = max[n(a+w), a+t]，按成本选台数", "Tending: C = max[n(a+w), a+t]; choose n by cost"]
    after: ["作业 28：一条 T 恤线的平衡与一人多机配置 · 测验 · 虚拟实验 28-1 报告 —— 在问渠学习平台完成", "Assignment 28 · quiz · Lab 28-1 report — on WenQuest"]
    notes:
      - "这一讲记住三件事。第一，标准工时等于观测乘评比乘 1 加宽放；工时大部分是拿放，转速再提高作用很小。第二，节拍、最少人数、周期、平衡率；一道工序一组凑不了零碎工时，按位置权重分组共担，平衡率能从约 70% 提到 90% 以上。第三，一人多机周期取两者中大的，按成本选台数。"
      - "Three things to remember. One: a standard minute is observed time times rating times one plus allowance; most of it is handling, so more top speed helps little. Two: takt, minimum headcount, cycle and balance; one operation per station wastes odd fractions, while grouping by positional weight lifts balance from about 70 to over 90 percent. Three: in multi-machine tending the cycle is the larger of the two; choose n by cost."
