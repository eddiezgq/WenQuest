      - {n: "{{ch03.rise2:.1f}}°", n_en: "λ = 0.282", label: ["下止点 {{ch03.aB:.0f}} m/s²", "{{ch03.aB:.0f}} m/s² at BDC"]}
      - {n: "{{ch03.c40:.1f}}°", n_en: "λ = 0.40", label: ["下止点 {{ch03.a40:.0f}} m/s²", "{{ch03.a40:.0f}} m/s² at BDC"]}
    foot: ["窗口只有十度左右：改了 r 或 l，要重校旋梭安装角和针杆高度", "The window is only about ten degrees: change r or l and re-set the hook angle and needle-bar height"]
