      - "The worked example. r is 15.5, l is 55, so lambda is {{ch03.lam:.3f}}. At 5000 r/min omega is about 523.6 radians per second. The stroke is {{ch03.stroke:.0f}} millimetres, the peak speed {{ch03.vmax:.2f}} metres per second at {{ch03.fvmax:.1f}} degrees, and the acceleration at the bottom {{ch03.aB:.0f}} metres per second squared, about {{ch03.gB:.0f}} g. Check it with the simple dead-centre formula: 0.0155 times 523.6 squared times 1.282 is about {{ch03.aB:.0f}}."

  - layout: split
    title: ["读曲线：最大惯性力在下止点", "Reading the curves: peak force at the bottom"]
    points:
      - ["上止点附近平缓，下止点附近尖锐", "Flat near the top, sharp near the bottom"]
      - ["下止点：机针在布中，线环正形成", "At the bottom the needle is in the cloth and the loop forms"]
      - ["轴套磨损和间隙直接影响钩线", "Bushing wear and play go straight to the catch"]
    visual: {video: plot}
    notes:
      - "这是实验 3-1 的三条曲线：位移、速度、加速度，红线是当前转角。上止点附近加速度曲线平缓，前后 30 度几乎不变；下止点附近却很尖。也就是说，最大惯性力在下止点，而这时恰恰是机针在布里、线环正在形成、梭尖准备钩线的时刻。所以轴套一磨损、间隙一大，钩线就不稳。"
      - "These are the three curves from Lab 3-1: displacement, velocity and acceleration, with the red line at the current angle. Near the top the acceleration is flat, almost unchanged for thirty degrees either side; near the bottom it's sharp. So the biggest inertia force comes at the bottom, exactly when the needle is in the cloth, the loop is forming and the hook is about to catch. Let the bushings wear and the play grow, and the catch becomes unreliable."

  - layout: section
    num: "03"
    title: ["连杆比与钩线时刻", "Link ratio and the moment of catching"]

  - layout: split
    title: ["回升 2 mm 在什么转角？", "At what angle has the needle risen 2 mm?"]
    points:
      - ["在 φ = 180° + δ 处展开位移式", "Expand x about φ = 180° + δ"]
      - ["算例：δ ≈ {{ch03.d2:.0f}}°，钩线约 {{ch03.rise2:.1f}}°", "Example: δ ≈ {{ch03.d2:.0f}}°, catch at about {{ch03.rise2:.1f}}°"]
      - ["行程不变时，λ 越大钩线越早", "Same stroke, larger λ: an earlier catch"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><text x="450" y="110" font-size="56" fill="#f3f6fa" text-anchor="middle" font-family="'DejaVu Serif',serif" font-style="italic">h ≈ (r/2)(1 + λ) δ²</text><text x="450" y="160" font-size="24" fill="#8fa3ba" text-anchor="middle">在下止点附近展开 · expanded about BDC</text><path d="M120 600 L860 600 M120 600 L120 270" stroke="#4b5f7d" stroke-width="3"/><polyline points="120,600 138,600 156,599 174,598 192,597 210,595 228,593 246,591 264,588 282,585 300,582 318,578 336,574 354,569 372,564 390,559 408,554 426,548 444,541 462,534 480,527 498,520 516,512 534,504 552,495 570,487 588,477 606,468 624,458 642,447 660,437 678,426 696,414 714,402 732,390 750,378 768,365 786,351 804,338 822,324 840,309" fill="none" stroke="#f2b705" stroke-width="7"/><path d="M120 480 L583 480 L583 600" stroke="#2ec4b6" stroke-width="3" stroke-dasharray="8 6" fill="none"/><circle cx="583" cy="480" r="12" fill="#2ec4b6"/><text x="607" y="490" font-size="30" font-weight="700" fill="#5ee0d2">2 mm · δ ≈ {{ch03.d2:.0f}}°</text><text x="130" y="290" font-size="24" fill="#8fa3ba">回升 h</text><text x="860" y="636" font-size="24" fill="#8fa3ba" text-anchor="end">过下止点的转角 δ</text></svg>
    notes:
      - "第 2 讲说，梭尖要在机针回升约 2 毫米时钩线。把位移式在下止点附近展开，回升量约等于 r 除以 2，乘 1 加 λ，再乘 δ 的平方。代入算例，h 等于 2 毫米时 δ 约 {{ch03.d2:.0f}} 度，钩线就在 {{ch03.rise2:.1f}} 度左右。式子还告诉我们：行程不变时，λ 越大，回升越快，钩线时刻越早。"
      - "In Lecture 2 we said the hook catches when the needle has risen about 2 millimetres. Expand the displacement about bottom dead centre and the rise is roughly r over two, times one plus lambda, times delta squared. For our example, 2 millimetres of rise comes at delta of about {{ch03.d2:.0f}} degrees, so the catch is near {{ch03.rise2:.1f}} degrees. The formula also says that for the same stroke, a bigger lambda means a faster rise and an earlier catch."

