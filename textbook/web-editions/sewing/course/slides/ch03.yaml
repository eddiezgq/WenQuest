      - "Now exactly, with r of 15.5 at 5000 r/min. For lambda of 0.20, 0.282 and 0.40 the 2-millimetre rise comes at {{ch03.c20:.1f}}, {{ch03.rise2:.1f}} and {{ch03.c40:.1f}} degrees, while the bottom acceleration climbs from {{ch03.a20:.0f}} to {{ch03.a40:.0f}}. The catch moves only a degree or two, but Lecture 2's window is only about ten degrees wide, so if you change the link or the crank, re-set the hook angle and the needle-bar height."

  - layout: split
    title: ["λ 的折中：连杆长短各有代价", "The λ trade-off: long or short, there's a price"]
    points:
      - ["λ 小：下止点加速度小，更接近简谐", "Small λ: lower BDC acceleration, closer to harmonic"]
      - ["代价：机头加高，组件变长变重", "Price: a taller head, longer heavier parts"]
      - ["工业平缝机多在 λ = 0.25–0.32", "Industrial machines sit around λ = 0.25–0.32"]
    visual: {video: sweep}
    notes:
      - "画面上连杆长度在 35 到 90 毫米之间来回变，看曲线怎么跟着变。λ 小、也就是连杆长，下止点加速度小，运动更接近简谐。代价是机头要加高，针杆组件变长变重，往复质量一增加，又把惯性力拉回去。所以工业平缝机的 λ 多在 0.25 到 0.32 之间，是两头折中的结果。设计没有白拿的好处。"
      - "On screen the link length sweeps between 35 and 90 millimetres; watch the curves follow. A small lambda, a long link, means less acceleration at the bottom and motion closer to harmonic. The price is a taller head and longer, heavier parts, and more reciprocating mass pulls the force back up. So industrial lockstitch machines mostly sit between 0.25 and 0.32, a compromise. In design nothing comes free."

