  - layout: section
    num: "04"
    title: ["惯性力与平衡", "Inertia force and balancing"]

  - layout: formula
    title: ["惯性力与转速的平方成正比", "Inertia force goes with speed squared"]
    formula: "F = m\\,a \\;\\propto\\; n^{2}"
    bars:
      - {n: 3000, F: "{{ch03.F3000:.0f}}", label: ["3000 r/min", "3000"]}
      - {n: 4000, F: "{{ch03.F4000:.0f}}", label: ["4000 r/min", "4000"]}
      - {n: 5000, F: "{{ch03.F5000:.0f}}", label: ["5000 r/min", "5000"]}
      - {n: 6000, F: "{{ch03.F6000:.0f}}", label: ["6000 r/min", "6000"]}
    foot: ["往复质量 m = {{ch03.mass:.0f}} g（示意值）：针杆、针夹、机针，加连杆折算到针杆一端的部分", "m = {{ch03.mass:.0f}} g (illustrative): needle bar, clamp, needle, plus the share of the link"]
    notes:
      - "针杆、针夹、机针，加上连杆折算到针杆一端的那部分，合起来叫往复质量 m，这里取 {{ch03.mass:.0f}} 克。惯性力等于 m 乘 a。每分钟 5000 转，下止点约 {{ch03.F5000:.0f}} 牛；惯性力和转速平方成正比，3000 转只有 {{ch03.F3000:.0f}} 牛，6000 转就到 {{ch03.F6000:.0f}} 牛。一百多克的零件，扛几百倍于自重的力，每秒来回八十多次。"
      - "The needle bar, clamp and needle, plus the share of the link at the bar end, make up the reciprocating mass m, here {{ch03.mass:.0f}} grams. The inertia force is m times a. At 5000 r/min that's about {{ch03.F5000:.0f}} newtons at the bottom. It goes with speed squared: only {{ch03.F3000:.0f}} at 3000, but {{ch03.F6000:.0f}} at 6000. A part of a hundred-odd grams carrying hundreds of times its own weight, back and forth more than eighty times a second."

  - layout: split
    title: ["转速一变，曲线跟着变", "Change the speed and the curves follow"]
    points:
      - ["3000 → 6000 r/min：转速 ×2", "3000 → 6000 r/min: speed ×2"]
      - ["加速度和惯性力 ×4", "Acceleration and force ×4"]
      - ["位移曲线不变：形状只由 r、l 决定", "Displacement unchanged: its shape depends only on r and l"]
    visual: {video: speed}
    notes:
      - "画面上转速在 3000 到 6000 转之间一档一档地变。注意位移曲线的形状一点没变，它只由 r 和 l 决定；变的是速度和加速度的纵坐标。转速翻一倍，速度翻一倍，加速度和惯性力变成四倍。所以提速不是拧一下旋钮，惯性力是按平方涨上去的。"
      - "On screen the speed steps from 3000 up to 6000 r/min. Notice that the displacement curve doesn't change shape at all; that depends only on r and l. What changes is the scale of velocity and acceleration. Double the speed, and velocity doubles while acceleration and inertia force become four times as large. So speeding up isn't turning a knob: the force rises with the square."

  - layout: points
    title: ["平衡块只能平衡一部分", "A counterweight balances only part of it"]
    points:
      - ["旋转质量：曲柄、曲柄销可全部平衡", "Rotating mass, crank and pin: fully balanced"]
      - ["一阶往复力：只平衡一部分，否则横向出新力", "1st-order reciprocating force: only part, or a new sideways force appears"]
      - ["二阶力：频率 2 倍，平衡块无能为力", "2nd-order force: twice the frequency, beyond a counterweight"]
    foot: ["5000 r/min：一阶幅值约 {{ch03.F1:.0f}} N，二阶约 {{ch03.F2:.0f}} N（∝ λ）；降振最有效的是减小 m", "At 5000 r/min: 1st order about {{ch03.F1:.0f}} N, 2nd about {{ch03.F2:.0f}} N (∝ λ); the surest cure is a smaller m"]
    notes:
      - "惯性力分两部分。一阶力频率等于转速，曲柄上的平衡块产生同频离心力，能把曲柄、曲柄销这些旋转质量完全平衡掉，也能抵消一部分一阶往复力。为什么只一部分？平衡块的离心力方向跟着曲柄转，抵消竖直力的同时，会在水平方向产生新的不平衡。二阶力频率是两倍转速，平衡块对它无能为力。所以降振最有效的，还是把 m 做小。"
      - "The inertia force has two parts. The first-order part has the shaft frequency. A counterweight on the crank makes a centrifugal force at the same frequency; it fully balances the rotating parts, crank and pin, and can cancel part of the first-order reciprocating force. Why only part? Its force turns with the crank, so while it cancels the vertical force it creates a new horizontal one. The second-order force runs at twice the frequency, and a counterweight can do nothing about it. So the best cure for vibration is still a smaller m."

  - layout: points
    title: ["设计要点", "Design notes"]
    points:
      - ["定参数有先后：行程 → 连杆长 → 旋梭安装角", "Order matters: stroke → link length → hook angle"]
      - ["减重：空心针杆、小针夹、镂空连杆", "Cut mass: hollow bar, small clamp, lightened link"]
      - ["润滑可靠；导滑块防转，针杆高度可调", "Reliable oiling; guide block stops turning; height adjustable"]
    notes:
      - "把设计要点串起来。参数有先后：先由布厚、压脚抬高量和旋梭位置定行程，再在 λ 0.25 到 0.32 之间选连杆长，最后按钩线时刻反推旋梭安装角。然后减轻往复质量：针杆做成空心，针夹做小，连杆用工字形或镂空截面。还有润滑、防转和可调，这些细节决定一台高速机能不能长期稳定地钩线。"
      - "Let's pull the design notes together. Parameters come in order: fabric thickness, foot lift and hook position fix the stroke; then pick the link length for lambda between 0.25 and 0.32; then work back from the catch to the hook angle. Next, cut the reciprocating mass: a hollow bar, a small clamp, an I-section or lightened link. Then oiling, anti-rotation and adjustment: details that decide whether a high-speed machine keeps catching reliably for years."

  - layout: split
    title: ["机器人联系：节拍减半，惯性力矩 ×4", "Robot link: half the cycle time, four times the torque"]
    points:
      - ["同一条路径，时间缩到一半", "Same path, half the time"]
      - ["速度 ×2，加速度和惯性力矩 ×4", "Speed ×2; acceleration and inertia torque ×4"]
      - ["在加速度最大的拐点限加速度", "Limit acceleration at the sharpest turns"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><path d="M90 560 L870 560 M90 560 L90 120" stroke="#4b5f7d" stroke-width="3"/><polyline points="90,560 109,559 128,556 147,550 166,543 185,534 204,523 223,511 242,498 261,484 280,470 299,456 318,442 337,429 356,417 375,406 394,397 413,390 432,384 451,381 470,380 489,381 508,384 527,390 546,397 565,406 584,417 603,429 622,442 641,456 660,470 679,484 698,498 717,511 736,523 755,534 774,543 793,550 812,556 831,559 850,560" fill="none" stroke="#2ec4b6" stroke-width="6"/><polyline points="90,560 100,558 109,551 118,540 128,526 138,507 147,486 156,462 166,436 176,408 185,380 194,352 204,324 214,298 223,274 232,253 242,234 252,220 261,209 270,202 280,200 290,202 299,209 308,220 318,234 328,253 337,274 346,298 356,324 366,352 375,380 384,408 394,436 404,462 413,486 422,507 432,526 442,540 451,551 460,558 470,560" fill="none" stroke="#ff7a45" stroke-width="7"/><text x="561" y="300" font-size="30" font-weight="700" fill="#5ee0d2">时间 T：加速度 1×</text><text x="151" y="150" font-size="30" font-weight="700" fill="#ffb38f">T/2：速度 2×，加速度 4×</text><text x="100" y="100" font-size="24" fill="#8fa3ba">关节速度 · joint speed</text><text x="870" y="600" font-size="24" fill="#8fa3ba" text-anchor="end">时间 · time</text></svg>
    notes:
      - "针杆位移是主轴转角的函数，转速一变，同一条曲线走得快慢不同，加速度按 ω 平方变。机器人轨迹规划一模一样：同一条路径，运动时间缩短一半，各关节速度变 2 倍，加速度和电机要提供的惯性力矩变 4 倍。针杆在下止点转身最快，对应机器人加速度最大的拐点，规划时要在这些地方限加速度。"
      - "The needle-bar position is a function of shaft angle; change the speed and the same curve is run faster, with acceleration going as omega squared. Robot trajectory planning is exactly the same. Run the same path in half the time and each joint's speed doubles, while its acceleration and the inertia torque the motor must supply become four times as large. The needle bar's sharp turn at the bottom is like the robot's sharpest corner, and that's where planners limit acceleration."

  - layout: split
    title: ["生活例子：发动机的平衡轴", "Everyday example: an engine's balance shafts"]
    points:
      - ["活塞、连杆、曲轴也是曲柄滑块", "Piston, rod and crank: another slider-crank"]
      - ["二阶力 2 倍频，车身嗡嗡响", "2nd-order force at twice the speed: the body hums"]
      - ["配重没用，另加 2 倍转速的平衡轴", "Counterweights can't help: add shafts at 2n"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><circle cx="300" cy="420" r="80" fill="none" stroke="#4b5f7d" stroke-width="4" stroke-dasharray="8 6"/><rect x="230" y="80" width="140" height="110" rx="12" fill="#ff7a45"/><text x="300" y="148" font-size="30" font-weight="800" fill="#08101d" text-anchor="middle">活塞</text><path d="M300 190 L350 358" stroke="#f3f6fa" stroke-width="12" stroke-linecap="round"/><path d="M300 420 L350 358" stroke="#f2b705" stroke-width="14" stroke-linecap="round"/><circle cx="300" cy="420" r="16" fill="#f3f6fa"/><text x="300" y="550" font-size="28" fill="#f3f6fa" text-anchor="middle">曲轴 · 转速 n</text><circle cx="620" cy="420" r="56" fill="#1a2740" stroke="#2ec4b6" stroke-width="5"/><path d="M620 420 L620 374" stroke="#2ec4b6" stroke-width="22" stroke-linecap="round"/><path d="M692 400 A76 76 0 0 1 660 354" stroke="#2ec4b6" stroke-width="4" fill="none"/><circle cx="800" cy="420" r="56" fill="#1a2740" stroke="#2ec4b6" stroke-width="5"/><path d="M800 420 L800 374" stroke="#2ec4b6" stroke-width="22" stroke-linecap="round"/><path d="M872 400 A76 76 0 0 0 840 354" stroke="#2ec4b6" stroke-width="4" fill="none"/><text x="710" y="550" font-size="28" fill="#5ee0d2" text-anchor="middle">平衡轴 · 转速 2n</text><text x="710" y="586" font-size="22" fill="#8fa3ba" text-anchor="middle" class="en">balance shafts at 2n</text><text x="540" y="120" font-size="28" fill="#f3f6fa">上下止点与针杆对调</text><text x="540" y="156" font-size="22" fill="#8fa3ba" class="en">dead centres swapped</text></svg>
    notes:
      - "生活里的例子是汽车发动机。活塞、连杆、曲轴也是曲柄滑块，只是活塞在曲轴上方，上下止点正好和针杆对调。四缸发动机转速高时，以两倍曲轴转速变化的二阶惯性力会让车身嗡嗡振动，曲轴上的配重对它无能为力，所以有些发动机另加一对以两倍转速旋转的平衡轴。"
      - "An everyday example: a car engine. Piston, rod and crankshaft are a slider-crank too, only the piston sits above the crank, so its dead centres are the reverse of the needle bar's. In a four-cylinder engine at high revs the second-order force, at twice crank speed, makes the body hum, and the counterweights on the crank can't touch it. So some engines add a pair of balance shafts turning at twice crank speed."

  - layout: answer
    tag: ["回到车间问题", "Back to the problem"]
    title: ["6000 转超限：减重或限速", "6000 r/min is over the limit: lighten it or slow it"]
    rows:
      - ["6000 r/min 时惯性力", "{{ch03.F6000:.0f}} N"]
      - ["方案一：减重到", "≤ {{ch03.mmax:.0f}} g"]
      - ["方案二：限速到", "≤ {{ch03.nmax:.0f}} r/min"]
    side: {big: "×{{ch03.r56:.2f}}", text: ["{{ch03.F5000:.0f}} → {{ch03.F6000:.0f}} N", "Force at BDC, 5000 → 6000 r/min"]}
    foot: ["减重：空心针杆、小型针夹、镂空连杆，并复核平衡和润滑", "To lighten: hollow bar, small clamp, lightened link; then re-check balance and oiling"]
    notes:
      - "回到开头。下止点加速度 r ω 平方乘 1 加 λ，5000 转时惯性力约 {{ch03.F5000:.0f}} 牛；6000 转是 1.44 倍，约 {{ch03.F6000:.0f}} 牛，超过 {{ch03.Flim:.0f}} 牛。两个办法：保持 6000 转，往复质量减到 {{ch03.mmax:.0f}} 克以下；或者零件不改，转速最高约 {{ch03.nmax:.0f}} 转。工程上常见的是减重：空心针杆、小针夹、镂空连杆，再复核平衡和润滑。"
      - "Back to the start. The bottom acceleration is r omega squared times one plus lambda, giving about {{ch03.F5000:.0f}} newtons at 5000 r/min. At 6000 it's 1.44 times as much, about {{ch03.F6000:.0f}}, over the {{ch03.Flim:.0f}}-newton limit. Two ways out: keep 6000 and bring the mass under {{ch03.mmax:.0f}} grams, or keep the parts and run no faster than about {{ch03.nmax:.0f}} r/min. In practice you lighten: a hollow bar, a small clamp, a lightened link, then re-check balance and oiling."

