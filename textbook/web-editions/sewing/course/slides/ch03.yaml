# 第 3 讲 刺布机构 · 课件（第 24 轮新版式）
# 每页一个意思、最多 3 条；中文在上、英文一行在下。版式见 course/tools/build_slides.py 的 LAYOUTS。
# {{ch03.键:格式}} 由课程包程序 course/calc/ch03.py 算出，不手写数字。
# notes：讲者备注（放映时只给老师看，录课时当讲稿用）。
lesson: 3
code: [ch03]

clips:
  hero:          # 封面：三维样机全透视，镜头对着机头里的刺布链
    page: proto-lockstitch
    selector: "#stage"
    steps:
      - {at: 0, press: ["#shell [data-k=xray]", "#chains [data-k=needle]"]}
      - {at: 2, js: "var t=document.getElementById('tableOn');t.checked=false;t.onchange();window.__api.cam(-0.9,0.15,380,[-17,110,0])"}
  head:          # 结构：开窗剖切，看曲柄、连杆、针杆
    page: proto-lockstitch
    selector: "#stage"
    steps:
      - {at: 0, press: ["#shell [data-k=window]", "#chains [data-k=needle]"]}
      - {at: 2, js: "var t=document.getElementById('tableOn');t.checked=false;t.onchange();window.__api.cam(-1.2,0.1,320,[-17,100,0])"}
  mech:          # 实验 3-1：机构动画
    page: slidercrank
    selector: "#mech"
    steps:
      - {at: 0, js: "var M=document.querySelector('#mech');document.querySelectorAll('body *').forEach(function(e){if(!e.contains(M)&&!M.contains(e))e.style.visibility='hidden'})"}
  plot:          # 实验 3-1：位移、速度、加速度曲线，红线随主轴走
    page: slidercrank
    selector: "#plot"
    vh: 1100
  sweep:         # 连杆长度 35 → 90 mm 来回扫，看曲线和钩线时刻怎样变（一直循环）
    page: slidercrank
    selector: "#plot"
    vh: 1100
    loop: 20
    steps:
      - {at: 0, set: {l: 35}}
      - {at: 2.5, set: {l: 45}}
      - {at: 5, set: {l: 55}}
      - {at: 7.5, set: {l: 70}}
      - {at: 10, set: {l: 90}}
      - {at: 12.5, set: {l: 70}}
      - {at: 15, set: {l: 55}}
      - {at: 17.5, set: {l: 45}}
  speed:         # 转速 3000 → 6000 r/min 来回扫，惯性力跟着变（一直循环）
    page: slidercrank
    selector: "#plot"
    vh: 1100
    loop: 16
    steps:
      - {at: 0, set: {n: 3000}}
      - {at: 4, set: {n: 4000}}
      - {at: 8, set: {n: 5000}}
      - {at: 12, set: {n: 6000}}

slides:
  - layout: cover
    video: hero
    kicker: ["第 3 讲", "Lecture 3"]
    title: ["刺布机构", "The Needle-Bar Mechanism"]
    sub: ["一个倒挂的曲柄滑块", "A slider-crank hung upside down"]
    notes:
      - "上一讲我们看到一根上轴分出四条传动链。这一讲讲第一条：上轴经针杆曲柄和连杆，带着针杆上下往复，叫刺布机构。它结构最简单，却决定了整机的转速上限和振动水平，还是其他机构定时的基准。"
      - "Last time we saw one main shaft driving four trains. Today, the first one: the main shaft drives the needle bar up and down through a crank and a link. This is the needle-bar mechanism. It's the simplest of the four, yet it sets the machine's top speed and its vibration, and it's the timing reference for everything else."

  - layout: question
    tag: ["车间问题", "Shop-floor problem"]
    title: ["提速到 6000 转，针杆受得了吗？", "Up to 6000 r/min: can the needle bar take it?"]
    facts:
      - ["r = 15.5 mm，l = 55 mm，往复质量 {{ch03.mass:.0f}} g", "r = 15.5 mm, l = 55 mm, reciprocating mass {{ch03.mass:.0f}} g"]
      - ["平时每分钟 5000 转，生产部要 6000 转", "Normally 5000 r/min; production wants 6000"]
      - ["轴套限值：下止点惯性力 ≤ {{ch03.Flim:.0f}} N（假定）", "Bushing limit: inertia force at BDC ≤ {{ch03.Flim:.0f}} N (assumed)"]
    notes:
      - "先看车间问题。某厂平缝机的针杆机构：曲柄半径 15.5 毫米，连杆长 55 毫米，往复质量 {{ch03.mass:.0f}} 克，这是示意值。平时每分钟 5000 转，生产部要求提到 6000 转。设备科给针杆轴套定了一个限值：下止点惯性力不超过 {{ch03.Flim:.0f}} 牛，这是本题假定的。6000 转时惯性力是多少？超没超？不超的办法有哪些？"
      - "Here's the problem. A factory's lockstitch machines have a needle-bar crank radius of 15.5 millimetres, a 55-millimetre link and a reciprocating mass of {{ch03.mass:.0f}} grams, an illustrative value. They run at 5000 r/min; production wants 6000. Maintenance has set a limit for the needle-bar bushings: no more than {{ch03.Flim:.0f}} newtons of inertia force at bottom dead centre, a figure assumed for this problem. What is the force at 6000? Is it over? And if so, what can we do?"

  - layout: section
    num: "01"
    title: ["任务与结构", "What it must do, and how it's built"]

  - layout: points
    title: ["刺布机构的五条要求", "Five requirements"]
    points:
      - ["行程够用、定时准确：下止点在 180°", "Enough stroke, exact timing: bottom dead centre at 180°"]
      - ["能跑高速：针杆每秒往复八十多次", "High speed: the bar reverses more than eighty times a second"]
      - ["振动小；针杆不能转，高度要能调", "Low vibration; the bar must not turn, and its height must adjust"]
    foot: ["凹口必须一直朝着梭尖，所以针杆只许上下走、不许转", "The scarf must always face the hook, so the bar may only slide, never turn"]
    notes:
      - "刺布机构要同时满足五条要求。行程要够：上止点放得进布，下止点针眼低于梭尖轨迹。定时要准：下止点在 180 度。要跑得快：每分钟 5000 转，针杆每秒往复八十多次。振动要小。最后，针杆不能转，因为凹口必须一直朝着梭尖，高度还要能微调。"
      - "The mechanism has to meet five requirements at once. Enough stroke: room for the cloth at the top, the eye below the hook path at the bottom. Exact timing: bottom dead centre at 180 degrees. High speed: at 5000 r/min the bar reverses more than eighty times a second. Low vibration. And the bar must not turn, because the scarf has to face the hook, while its height must be adjustable."

  - layout: split
    title: ["结构：曲柄、连杆、针杆", "Structure: crank, link, needle bar"]
    points:
      - ["上轴前端装曲柄，对面铸有平衡块", "Crank on the shaft end, a counterweight opposite"]
      - ["针杆在上下两个轴套里滑动", "The bar slides in two bushings"]
      - ["导滑块在导槽里：只上下、不转", "A guide block in a slot: up and down, no turning"]
    visual: {video: head}
    notes:
      - "这是虚拟样机机头部分，开窗剖切，刺布链单独突出。上轴前端装着针杆曲柄，曲柄销对面铸了一块平衡块；连杆一头套在曲柄销上，另一头和夹在针杆上的连接轴铰接。针杆在上下两个轴套里滑动，连接轴另一头有个导滑块嵌在机头的导槽里，所以针杆只能上下走、不会转。"
      - "This is the head of the virtual prototype with a window cut in it and the needle train highlighted. On the front of the main shaft is the needle-bar crank, with a counterweight cast opposite the crank pin. The link runs from the crank pin to a connector clamped on the needle bar. The bar slides in an upper and a lower bushing, and a guide block on the connector rides in a slot in the head, so the bar can only move up and down, never turn."

  - layout: points
    title: ["两处调整：只改位置，不改运动", "Two adjustments: position only, not motion"]
    points:
      - ["松连接轴螺钉：调针杆高度", "Loosen the connector screw: needle-bar height"]
      - ["松针夹螺钉：调机针深度和朝向", "Loosen the clamp screw: needle depth and direction"]
      - ["两者都不改变运动规律", "Neither changes the law of motion"]
    foot: ["针杆高度决定钩线时梭尖与针眼的高度差（第 5 讲）", "Needle-bar height sets how far the eye is below the hook point at the catch (Lecture 5)"]
    notes:
      - "这里有两处调整，修机工天天用。松开连接轴的螺钉，可以上下移动针杆，改的是针杆高度，也就是钩线时梭尖和针眼的高度差；松开针夹螺钉，可以调机针插多深、凹口朝哪边。它们只改绝对位置，不改运动规律，位移曲线的形状不变，第 5 讲调旋梭时会用到。"
      - "There are two adjustments that mechanics use every day. Loosen the connector screw and you can slide the bar up or down: that's needle-bar height, which sets how far the eye is below the hook point at the catch. Loosen the needle clamp and you set how deep the needle sits and which way the scarf faces. Both change only position, not the law of motion; the shape of the curve stays the same. We'll use them in Lecture 5."

  - layout: section
    num: "02"
    title: ["运动学：倒挂的曲柄滑块", "Kinematics: an upside-down slider-crank"]

  - layout: duo
    title: ["上止点对调：别直接套发动机公式", "Dead centres swapped: don't copy the engine formula"]
    left:
      svg: |-
        <svg viewBox="0 0 820 460" width="100%" height="100%"><circle cx="300" cy="390" r="60" fill="none" stroke="#4b5f7d" stroke-width="4" stroke-dasharray="8 6"/><rect x="266" y="50" width="68" height="60" rx="8" fill="#ff7a45"/><path d="M300 390 L300 330" stroke="#f2b705" stroke-width="12" stroke-linecap="round"/><path d="M300 330 L300 110" stroke="#f3f6fa" stroke-width="10" stroke-linecap="round"/><circle cx="300" cy="390" r="14" fill="#f3f6fa"/><circle cx="300" cy="330" r="11" fill="#08101d" stroke="#f2b705" stroke-width="5"/><circle cx="300" cy="110" r="11" fill="#08101d" stroke="#f3f6fa" stroke-width="5"/><text x="260" y="400" font-size="32" fill="#f3f6fa" text-anchor="end" font-family="'DejaVu Serif',serif" font-style="italic">O</text><text x="260" y="340" font-size="32" fill="#f2b705" text-anchor="end" font-family="'DejaVu Serif',serif" font-style="italic">A</text><text x="340" y="100" font-size="32" fill="#f3f6fa" font-family="'DejaVu Serif',serif" font-style="italic">B</text><path d="M440 390 L440 110" stroke="#2ec4b6" stroke-width="4"/><path d="M426 390 L454 390 M426 110 L454 110" stroke="#2ec4b6" stroke-width="4"/><text x="470" y="266.0" font-size="46" font-weight="700" fill="#5ee0d2" font-family="'DejaVu Serif',serif" font-style="italic">OB = r + l</text><text x="470" y="306.0" font-size="24" fill="#8fa3ba">最高点：曲柄销朝向活塞</text></svg>
      label: ["发动机：活塞在曲轴上方", "Engine: piston above the crank"]
      note: ["最高点 OB = r + l", "Top: OB = r + l"]
    right:
      svg: |-
        <svg viewBox="0 0 820 460" width="100%" height="100%"><circle cx="300" cy="100" r="60" fill="none" stroke="#4b5f7d" stroke-width="4" stroke-dasharray="8 6"/><rect x="288" y="230" width="24" height="210" rx="6" fill="#4c8dff"/><path d="M300 100 L300 40" stroke="#f2b705" stroke-width="12" stroke-linecap="round"/><path d="M300 40 L300 260" stroke="#f3f6fa" stroke-width="10" stroke-linecap="round"/><circle cx="300" cy="100" r="14" fill="#f3f6fa"/><circle cx="300" cy="40" r="11" fill="#08101d" stroke="#f2b705" stroke-width="5"/><circle cx="300" cy="260" r="11" fill="#08101d" stroke="#f3f6fa" stroke-width="5"/><text x="260" y="110" font-size="32" fill="#f3f6fa" text-anchor="end" font-family="'DejaVu Serif',serif" font-style="italic">O</text><text x="260" y="50" font-size="32" fill="#f2b705" text-anchor="end" font-family="'DejaVu Serif',serif" font-style="italic">A</text><text x="340" y="270" font-size="32" fill="#f3f6fa" font-family="'DejaVu Serif',serif" font-style="italic">B</text><path d="M440 100 L440 260" stroke="#2ec4b6" stroke-width="4"/><path d="M426 100 L454 100 M426 260 L454 260" stroke="#2ec4b6" stroke-width="4"/><text x="470" y="196.0" font-size="46" font-weight="700" fill="#5ee0d2" font-family="'DejaVu Serif',serif" font-style="italic">OB = l − r</text><text x="470" y="236.0" font-size="24" fill="#8fa3ba">最高点：曲柄销背离针杆</text></svg>
      label: ["缝纫机：针杆倒挂在上轴下方", "Sewing machine: needle bar hung below"]
      note: ["最高点 OB = l − r", "Top: OB = l − r"]
    notes:
      - "去掉外形，刺布机构就是一个对心曲柄滑块：上轴是曲柄 OA，连杆是 AB，针杆是滑块 B。机械原理课上学曲柄滑块，多半以发动机为例。要小心：活塞在曲轴上方，最高时曲柄销朝着活塞，OB 等于 r 加 l；针杆倒挂在上轴下面，最高时曲柄销背离针杆，OB 等于 l 减 r。上下止点正好对调，直接套公式会把上下止点加速度弄反。"
      - "Strip away the shapes and it's an in-line slider-crank: the shaft is crank OA, the link is AB, the needle bar is slider B. In mechanics classes the slider-crank is usually an engine. Careful: the piston is above the crank, and at the top the crank pin points at it, so OB is r plus l. The needle bar hangs below the shaft, and at the top the crank pin points away from it, so OB is l minus r. The dead centres are swapped. Copy the engine formula and you get the top and bottom accelerations the wrong way round."

  - layout: figure
    title: ["针杆位移的精确式", "Exact needle-bar displacement"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 600" width="100%" height="100%"><text x="450" y="150" font-size="60" fill="#f3f6fa" text-anchor="middle" font-family="'DejaVu Serif',serif" font-style="italic">x = r(1 − cos φ) − l(1 − √(1 − λ² sin² φ))</text><text x="450" y="250" font-size="48" fill="#f2b705" text-anchor="middle" font-family="'DejaVu Serif',serif" font-style="italic">λ = r / l</text><text x="450" y="300" font-size="26" fill="#8fa3ba" text-anchor="middle">连杆比 · link ratio</text><path d="M120 360 L780 360" stroke="#22324d" stroke-width="2"/><text x="140" y="430" font-size="32" fill="#f3f6fa">零点：上止点，向下为正</text><text x="140" y="466" font-size="22" fill="#8fa3ba" class="en">zero at top dead centre, downward positive</text><text x="140" y="530" font-size="32" fill="#f3f6fa">第二项与活塞位移式符号相反：倒挂</text><text x="140" y="566" font-size="22" fill="#8fa3ba" class="en">second term opposite in sign to the piston formula: it hangs</text></svg>
    h: 600
    notes:
      - "推导位移。以上止点为零点，向下为正。由几何关系，OB 等于 l cosβ 减 r cosφ，同时 r sinφ 等于 l sinβ，消去 β 就得到这个精确式，λ 等于 r 比 l，叫连杆比。对照发动机的活塞位移式，第二项符号正好相反，原因就是倒挂。代个数：主轴转到 90 度时，针杆只走了 {{ch03.x90:.1f}} 毫米，不到行程的一半。"
      - "Now the displacement. Take top dead centre as zero, downward positive. From the geometry, OB equals l cos beta minus r cos phi, and r sin phi equals l sin beta. Eliminate beta and you get this exact formula, with lambda, r over l, the link ratio. Compare it with the piston formula: the second term has the opposite sign, because the bar hangs. Try a number: at 90 degrees of shaft angle the bar has moved only {{ch03.x90:.1f}} millimetres, less than half the stroke."

  - layout: split
    title: ["看它动：上面停得久，下面转身快", "Watch it: it lingers at the top, turns fast at the bottom"]
    points:
      - ["90° 时只走了 {{ch03.x90:.1f}} mm，不到一半", "At 90° only {{ch03.x90:.1f}} mm: under half"]
      - ["最大速度在 {{ch03.fvmax:.1f}}°，不在 90°", "Peak speed at {{ch03.fvmax:.1f}}°, not 90°"]
      - ["原因：连杆倾斜", "Why: the link tilts"]
    visual: {video: mech}
    notes:
      - "这是虚拟实验 3-1 的机构图，主轴匀速转动。盯着针杆看：在上面，它好像停了一会儿；到了下面，一下就转身往回走。90 度时针杆只走了 {{ch03.x90:.1f}} 毫米，不到一半；最大速度也不在 90 度，而在 {{ch03.fvmax:.1f}} 度。原因是连杆是斜的，λ 越大，偏得越多。"
      - "This is the mechanism view of Lab 3-1, with the shaft turning steadily. Watch the needle bar. At the top it seems to pause for a moment; at the bottom it turns round in a flash. At 90 degrees it has moved only {{ch03.x90:.1f}} millimetres, under half the stroke, and its top speed comes at {{ch03.fvmax:.1f}} degrees, not 90. The reason is the tilted link: the bigger lambda, the bigger the shift."

  - layout: split
    title: ["上止点与下止点的加速度", "Acceleration at the two dead centres"]
    points:
      - ["上止点：a = rω²(1 − λ)", "Top: a = rω²(1 − λ)"]
      - ["下止点：a = −rω²(1 + λ)，更大", "Bottom: a = −rω²(1 + λ), larger"]
      - ["加速度 = 一阶项 + 二阶项", "Acceleration = 1st-order term + 2nd-order term (λ cos 2φ)"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><path d="M90 320 L880 320" stroke="#4b5f7d" stroke-width="3"/><path d="M90 90 L90 560" stroke="#4b5f7d" stroke-width="3"/><polyline points="90,130 99,130 107,132 116,134 125,137 133,141 142,146 151,152 159,159 168,166 177,174 185,183 194,193 203,203 211,214 220,225 229,237 237,249 246,261 255,274 263,287 272,300 281,313 289,327 298,340 307,353 315,366 324,379 333,391 341,403 350,415 359,426 367,437 376,447 385,457 393,466 402,474 411,481 419,488 428,494 437,499 445,503 454,506 463,508 471,510 480,510 489,510 497,508 506,506 515,503 523,499 532,494 541,488 549,481 558,474 567,466 575,457 584,447 593,437 601,426 610,415 619,403 627,391 636,379 645,366 653,353 662,340 671,327 679,313 688,300 697,287 705,274 714,261 723,249 731,237 740,225 749,214 757,203 766,193 775,183 783,174 792,166 801,159 809,152 818,146 827,141 835,137 844,134 853,132 861,130 870,130" fill="none" stroke="#4c8dff" stroke-width="5"/><polyline points="90,266 99,267 107,269 116,271 125,275 133,279 142,284 151,290 159,297 168,303 177,311 185,318 194,326 203,333 211,340 220,347 229,353 237,359 246,363 255,367 263,370 272,372 281,373 289,373 298,372 307,370 315,367 324,363 333,359 341,353 350,347 359,340 367,333 376,326 385,318 393,311 402,303 411,297 419,290 428,284 437,279 445,275 454,271 463,269 471,267 480,266 489,267 497,269 506,271 515,275 523,279 532,284 541,290 549,297 558,303 567,311 575,318 584,326 593,333 601,340 610,347 619,353 627,359 636,363 645,367 653,370 662,372 671,373 679,373 688,372 697,370 705,367 714,363 723,359 731,353 740,347 749,340 757,333 766,326 775,318 783,311 792,303 801,297 809,290 818,284 827,279 835,275 844,271 853,269 861,267 870,266" fill="none" stroke="#ff7a45" stroke-width="5"/><polyline points="90,184 99,183 107,183 116,183 125,183 133,182 142,182 151,182 159,182 168,183 177,184 185,185 194,187 203,190 211,194 220,198 229,204 237,210 246,218 255,227 263,237 272,248 281,260 289,273 298,287 307,303 315,319 324,335 333,353 341,370 350,388 359,406 367,424 376,442 385,459 393,475 402,490 411,505 419,518 428,529 437,540 445,548 454,555 463,560 471,563 480,564 489,563 497,560 506,555 515,548 523,540 532,529 541,518 549,505 558,490 567,475 575,459 584,442 593,424 601,406 610,388 619,370 627,353 636,335 645,319 653,303 662,287 671,273 679,260 688,248 697,237 705,227 714,218 723,210 731,204 740,198 749,194 757,190 766,187 775,185 783,184 792,183 801,182 809,182 818,182 827,182 835,183 844,183 853,183 861,183 870,184" fill="none" stroke="#f2b705" stroke-width="8" opacity=".9"/><text x="100" y="60" font-size="28" fill="#8fb8ff">一阶 ∝ cos φ</text><text x="360" y="60" font-size="28" fill="#ffa47d">二阶 ∝ λ cos 2φ</text><text x="650" y="60" font-size="28" fill="#f2b705">合成</text><text x="480" y="600" font-size="24" fill="#8fa3ba" text-anchor="middle" class="en">180°</text><text x="870" y="600" font-size="24" fill="#8fa3ba" text-anchor="middle" class="en">360°</text><text x="90" y="600" font-size="24" fill="#8fa3ba" text-anchor="middle" class="en">0°</text><text x="480" y="608" font-size="26" fill="#f2b705" text-anchor="start" dx="20">← 下止点最尖</text></svg>
    notes:
      - "对时间求两次导得到加速度。两个点最值得记：上止点是 r ω 平方乘 1 减 λ，下止点是负的 r ω 平方乘 1 加 λ，下止点更大，两者之比约 {{ch03.ratioTB:.2f}}。把根号展开，加速度由两项叠加：随 ω 变化的一阶项，和随 2ω 变化的二阶项，二阶项正比于 λ。蓝线是一阶，橙线是二阶，黄线是合成，下止点最尖。"
      - "Differentiate twice for the acceleration. Two values are worth remembering. At the top it's r omega squared times one minus lambda; at the bottom it's minus r omega squared times one plus lambda, the larger of the two; their ratio is about {{ch03.ratioTB:.2f}}. Expand the root and the acceleration is the sum of two terms: a first-order term varying with omega and a second-order term with twice omega, proportional to lambda. Blue is first order, orange second, yellow the sum, sharpest at the bottom."

