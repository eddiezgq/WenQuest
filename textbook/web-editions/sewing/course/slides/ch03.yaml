    title: ["本讲小结", "Summary"]
    points:
      - ["倒挂的曲柄滑块：上下止点与发动机对调", "An upside-down slider-crank: dead centres swapped"]
      - ["下止点加速度 rω²(1+λ) 最大；λ 大钩线早", "Largest at BDC, rω²(1+λ); bigger λ, earlier catch"]
      - ["惯性力 ∝ n²；二阶力平衡块管不了，先减质量", "Force ∝ n²; 2nd order escapes the counterweight: cut mass"]
    after: ["作业 3：刺布机构的运动与惯性力计算 · 测验 · 实验 3-1 报告 —— 在问渠学习平台完成", "Assignment 3 · quiz · Lab 3-1 report — on WenQuest"]
    notes:
      - "这一讲记住三件事。第一，刺布机构是倒挂的曲柄滑块，上下止点和发动机对调，别直接套公式。第二，下止点加速度 r ω 平方乘 1 加 λ 最大；行程不变时 λ 越大钩线越早，改了 r 或 l 要重校旋梭。第三，惯性力和转速平方成正比，二阶力平衡块管不了，减小往复质量最有效。下一讲讲挑线机构。"
      - "Three things to remember. One: the needle-bar mechanism is an upside-down slider-crank, with dead centres swapped relative to an engine, so don't copy the formulas. Two: the largest acceleration is at the bottom, r omega squared times one plus lambda; for a given stroke a bigger lambda catches earlier, so changing r or l means re-setting the hook. Three: inertia force goes with speed squared, the counterweight can't touch the second order, and the surest cure is less mass. Next: the take-up mechanism."
