  - layout: summary
    title: ["本讲小结", "Summary"]
    points:
      - ["针尖开眼、只穿一半、在布底锁住线环", "Eye at the point, half way in, lock the loop below"]
      - ["五个阶段一层层叠加，机构仍是 19 世纪的", "Five stages, layered; the mechanisms are still 19th-century"]
      - ["惯性力 ∝ 转速²：高速化的核心问题", "Inertia force ∝ speed²: the core problem of high speed"]
    after: ["作业 1：从一针到一个产业 · 测验 · 动画 1-1 实验报告 —— 在问渠学习平台完成", "Assignment 1 · quiz · Animation 1-1 report — on WenQuest"]
    notes:
      - "这一讲记住三件事。第一，机器缝纫的共同思路：针尖开眼、只穿一半、在布底锁住线环。第二，工业缝纫机的五个阶段是一层层叠加的，里面的机构仍然是 19 世纪定型的。第三，惯性力与转速的平方成正比，这是高速化的核心问题。作业、测验和动画 1-1 的实验报告都在问渠学习平台上完成。下一讲，我们看一针线迹到底是怎样形成的。"
      - "Three things to remember. One: the shared idea of machine sewing — eye at the point, go in half way, lock the loop below. Two: the five stages are layered, and the mechanisms inside are still the 19th-century ones. Three: inertia force goes with speed squared, the central problem of high speed. The assignment, the quiz and the report for Animation 1-1 are all on WenQuest. Next time: how a single stitch is actually formed."
