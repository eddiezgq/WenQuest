# 缝纫机企业解决方案 · 演示稿（第 44 轮第二版，2026-10-24：突出缝纫机设计软件、一体化信息化、AI，约 57 页）
# 不是课程的一讲（没有 lessons/ 文件）：talk 模式，页脚写方案名；only_zh：只显示中文，内容只写中文。
# 每页的 notes 就是讲稿（S 键讲者窗口里看；录介绍视频时当配音稿）。
# {{sol_enterprise.键:格式}} 由 course/calc/sol_enterprise.py 用缝纫机设计软件的计算核心算出，不手写数字。
# 截图都是真实界面：缝纫机设计软件（本地完整环境）、数字工厂演示工厂、AI 建课（仓库里的验收截图）。不点任何企业、品牌的名字。
talk: {id: sol-sewing, name: 缝纫机企业解决方案}
only_zh: true
code: [sol_enterprise]

clips:
  hero:          # 封面：平缝机三维样机开窗剖切，慢慢环绕
    page: proto-lockstitch
    selector: "#stage"
    steps:
      - {at: 0, press: "#shell [data-k=window]"}
  chains:        # 四条传动链轮流突出
    page: proto-lockstitch
    selector: "#stage"
    loop: 16
    steps:
      - {at: 0, press: ["#shell [data-k=xray]", "#chains [data-k=needle]"]}
      - {at: 2, js: "var t=document.getElementById('tableOn');t.checked=false;t.onchange();window.__api.cam(-0.6,0.3,820,[110,80,0])"}
      - {at: 4, press: "#chains [data-k=takeup]"}
      - {at: 8, press: "#chains [data-k=hook]"}
      - {at: 12, press: "#chains [data-k=feed]"}
  form:          # 虚拟试缝：放大钩线区，慢放看成线
    page: proto-lockstitch
    selector: "#stage"
    steps:
      - {at: 0, press: "#zoomBtn"}
  overlock:      # 包缝机三维结构模型：透视、主轴一直转
    page: model-overlock
    selector: "#stage"
    steps:
      - {at: 0, press: "[data-m=xray]", js: "document.getElementById('stage').style.background='radial-gradient(120% 90% at 55% 35%,#2a3d5c 0%,#13213a 60%,#08101d 100%)';var l=document.getElementById('labels');if(l.checked)l.click();var p=document.getElementById('play');if(/^(播放|Play)$/.test(p.textContent.trim()))p.click()"}
  pattern:       # 花样机三维模型：主轴转、模板走
    page: model-pattern
    selector: "#stage"
    steps:
      - {at: 0, press: ["#play", "#labels"], js: "document.querySelector('.stage').style.background='radial-gradient(120% 90% at 60% 35%,#22324d 0%,#0b1220 75%)'"}
  embroid:       # 刺绣机：一针里绷架的运动，针长 3 → 5 → 7 mm，加速度越过可用线
    page: embroid
    selector: "#win"
    loop: 10
    steps:
      - {at: 0, js: "document.documentElement.setAttribute('data-theme','dark')"}
      - {at: 0.1, set: {s: 3, n: 800}}
      - {at: 3.3, set: {s: 5}}
      - {at: 6.6, set: {s: 7}}
  bom:           # 零件库快速配套：四种机器轮流“自动配套”，物料清单跟着变
    page: config
    selector: "section:has(#bom)"
    loop: 12
    steps:
      - {at: 0, js: "document.documentElement.setAttribute('data-theme','dark');var t=document.getElementById('bom').closest('section');for(var e=t;e&&e!==document.body;e=e.parentElement){[].forEach.call(e.parentElement.children,function(c){if(c!==e)c.style.visibility='hidden'})}", press: ["[data-k=LS]", "#btnAuto"]}
      - {at: 3, press: ["[data-k=OL]", "#btnAuto"]}
      - {at: 6, press: ["[data-k=PS]", "#btnAuto"]}
      - {at: 9, press: ["[data-k=FK]", "#btnAuto"]}
  factory:       # 质量闭环：测量值和控制图逐台播放（深色显示）
    page: factory
    selector: "#pageA .col"
    cover: true
    vh: 1300
    loop: 21
    steps:
      - {at: 0, js: "document.documentElement.style.filter='invert(.9) hue-rotate(180deg)';document.getElementById('log').parentElement.style.display='none';document.getElementById('replay').click()"}
  line:          # 产线仿真：快进一个班
    page: line
    selector: "#cv"
    vh: 1400
    loop: 27
    steps:
      - {at: 0, press: ["#restart", "[data-s='20']"], js: "var p=document.getElementById('play');if(p.getAttribute('aria-pressed')==='false')p.click()"}
  iot:           # 设备联网：事件流
    page: iot
    selector: "#pageA .col"
    cover: true
    vh: 1300
    loop: 3
    steps:
      - {at: 0, js: "document.documentElement.style.filter='invert(.9) hue-rotate(180deg)';document.getElementById('msgjson').parentElement.style.display='none';document.getElementById('rerun').click()"}
  aiqc:          # AI 质检：好品、次品的得分分布，区分能力越来越强
    page: aiqc
    selector: "#dist"
    loop: 14
    steps:
      - {at: 0, set: {t: 1.88, dp: 1.5}, js: "document.documentElement.style.filter='invert(.9) hue-rotate(180deg)'"}
      - {at: 1, set: {dp: 2.0}}
      - {at: 2, set: {dp: 2.5}}
      - {at: 3, set: {dp: 3.0}}
      - {at: 4, set: {dp: 3.53}}
      - {at: 5, set: {dp: 4.0}}
      - {at: 6, set: {dp: 4.5}}
      - {at: 8, set: {dp: 4.0}}
      - {at: 9, set: {dp: 3.53}}
      - {at: 10, set: {dp: 3.0}}

slides:
  # ================= 开场 =================
  - layout: cover
    video: hero
    kicker: 企业解决方案
    title: 缝纫机企业解决方案
    sub: 设计软件 · 信息化 · AI：一条线、一套数据
    notes: "各位好，我是问渠的张国庆。今天介绍问渠给缝纫机企业做的一套解决方案，重点是三件事：缝纫机设计软件、一体化的信息化平台，和贯穿全程的 AI。"

  - layout: question
    tag: 企业的难处
    title: 新机型为什么总是慢、贵、靠试
    facts:
      - 改一个尺寸，要做出样机才知道行不行
      - 设计、工艺、车间、售后各用各的系统，数据对不上
      - 会用仿真软件、会调机的人少，难招也难带
    notes: "先说难处。做一台新机型，改一个曲柄半径、提一档转速，往往要等样机做出来、试缝了才知道行不行。设计、工艺、车间、售后各用各的系统，数据对不上。会用仿真软件、会调机的人少，难招也难带。"

  - layout: tiles
    title: 问渠的回答：三件事
    tiles:
      - {k: "01", name: 缝纫机设计软件, use: 五种机型，改参数当场红绿灯，设计时就知道行不行, hot: true}
      - {k: "02", name: 一体化信息化, use: 设计、仿真、加工、审批、ERP、车间、质量、售后一套数据}
      - {k: "03", name: AI 贯穿全程, use: 设置仿真、编程、找原因、出方案、写报告、建课程}
    notes: "问渠的回答是三件事。第一，缝纫机专用的设计软件，设计时就知道行不行。第二，一体化的信息化平台，从设计到售后用一套数据。第三，AI 贯穿全程，把会用专业软件的门槛降下来。"

  - layout: chain
    title: 一条线：改一次设计，下游全跟着变
    steps: [设计, 校核, 仿真, 数控, 审批, ERP, 车间, 质量, 售后]
    foot: 全部在浏览器里用；车间只拿到批准过的版本；每个数都能追到来源
    notes: "这三件事连成一条线：设计、校核、仿真、数控、审批、企业管理系统、车间、质量、售后。设计改一次，下游的物料、工艺、程序自动跟着变，车间只拿到批准过的版本。全部在浏览器里用，不用装软件。"

  # ================= 一、缝纫机设计软件 =================
  - layout: section
    num: "01"
    title: 缝纫机设计软件

  - layout: bignum
    title: "{{sol_enterprise.machines}} 种机型，{{sol_enterprise.checks_all}} 项红绿灯校核"
    nums:
      - {n: "{{sol_enterprise.ck_ls}}", label: 平缝机}
      - {n: "{{sol_enterprise.ck_ol}}", label: 包缝机}
      - {n: "{{sol_enterprise.ck_cv}}", label: 绷缝机}
      - {n: "{{sol_enterprise.ck_pt}}", label: 电子花样机}
      - {n: "{{sol_enterprise.ck_em}}", label: 多头刺绣机}
    foot: 每一项都有数值、判据、出处和改法；计算模型和教材算例逐项对得上
    notes: "缝纫机设计软件现在有五种机型：平缝机、包缝机、绷缝机、电子花样机和多头刺绣机，一共 {{sol_enterprise.checks_all}} 项校核。这是专门为缝纫机写的，不是通用软件套个壳。"

  - layout: points
    title: 红绿灯不是黑箱
    points:
      - 每一项给出数值、判据、出自教材哪一讲
      - 不合格的直接告诉你改哪个参数、往哪个方向改
      - 计算模型和教材算例逐项核对，测试一直在跑
    notes: "红绿灯不是黑箱。每一项校核都给出算出来的数值、判据和出处，出自教材哪一讲；不合格的直接告诉你该改哪个参数、往哪个方向改。计算模型和教材里的算例逐项核对过，每次改软件都自动再核一遍。"

  - layout: figure
    title: 左边改参数，右边当场重算
    visual: {fig: sol_ls_whole}
    h: 630
    caption: 按机构分组的设计参数；全机运动时序、针尖位移、针杆速度与加速度、挑线供线与耗线、送布牙轨迹
    notes: "这是平缝机的界面。左边是按机构分组的设计参数，拖滑块或者直接输数字；右边马上重算：全机运动时序、针尖位移、针杆速度和加速度、挑线的供线和耗线，一目了然。"

  - layout: duo
    title: "例子：转速提到 {{sol_enterprise.n6}} r/min"
    left:
      fig: sol_ls_red
      label: "{{sol_enterprise.red6_bad}} 项不合格、{{sol_enterprise.red6_warn}} 项注意"
      note: "针杆惯性力 {{sol_enterprise.F6:.0f}} N，超过 {{sol_enterprise.Flim}} N；离机壳共振太近"
    right:
      fig: sol_ls_green
      label: 全部合格
      note: "针杆组件 {{sol_enterprise.mr0:.0f}} → {{sol_enterprise.mr1:.0f}} g，机壳一阶频率 {{sol_enterprise.fn0}} → {{sol_enterprise.fn1}} Hz"
    notes: "举个例子。平缝机最高转速从五千提到六千，马上两项不合格、一项要注意：针杆惯性力 {{sol_enterprise.F6:.0f}} 牛，超过轴套允许的 {{sol_enterprise.Flim}} 牛；离机壳共振太近；整机惯性力也偏大。按提示把针杆组件从 {{sol_enterprise.mr0:.0f}} 克减到 {{sol_enterprise.mr1:.0f}} 克，机壳加筋，一阶频率提到 {{sol_enterprise.fn1}} 赫兹，{{sol_enterprise.ck_ls}} 项全部合格。样机还没做，问题已经解决了。"

  - layout: split
    title: 三维虚拟样机：调机参数跟着设计变
    points:
      - 定时、间隙、张力、送布、转速与设计同步
      - 透视、剖切，四条传动链一条条看清
      - 拖动、转动，在会议室就能讲清结构
    visual: {video: chains}
    notes: "平缝机有三维虚拟样机。定时、间隙、张力、送布、转速这些调机参数跟着设计变；透视、剖切，刺布、挑线、钩线、送布四条传动链一条条看清楚。评审会上不用拆机器，就能讲清楚结构。"

  - layout: split
    title: 虚拟试缝：跳针、碰针当场标红
    points:
      - 按设计参数连缝 30 针
      - 跳针、碰针、划线、断线逐针判定
      - 放大钩线区慢放，看线环怎样被钩住
    visual: {video: form}
    notes: "设计好之后可以虚拟试缝三十针，逐针判定成缝、跳针、碰针、划线和断线，有问题当场标红。钩线区可以放大慢放，看线环是怎样被梭尖钩住的。这一步过去要在样机上一针一针试。"

  - layout: split
    title: 包缝机：弯针、差动送布、切刀
    points:
      - 下弯针摆角、传动角、卡死临界、针尖速度
      - 差动比与平整度，上弯针传动角
      - 切刀时机与重叠量
    visual: {video: overlock}
    notes: "包缝机校核下弯针的摆角、传动角、卡死临界和针尖速度，上弯针的传动角，差动送布的平整度，还有切刀的时机和重叠量。右边是包缝机的三维结构模型，可以透视、转动主轴。"

  - layout: split
    title: 绷缝机：五种线迹，外加用线计划
    points:
      - 401、406、407、602、605 五种线迹的弯针定时
      - "一单 {{sol_enterprise.cv_q}} 件下摆：用线 {{sol_enterprise.cv_m:,.0f}} m"
      - "每根线各多少米、几个线团：一共 {{sol_enterprise.cv_cones}} 个"
    visual: {fig: sol_cover_plan}
    notes: "绷缝机校核五种线迹的弯针定时、高低和间隙，还能直接做用线计划。比如一单 {{sol_enterprise.cv_q}} 件 T 恤下摆，每件缝长 {{sol_enterprise.cv_len}} 厘米，算出来一共要 {{sol_enterprise.cv_m:.0f}} 米线、{{sol_enterprise.cv_cones}} 个线团，每根线各多少，采购照着下单。"

  - layout: split
    title: 电子花样机：机针在布中，模板不能动
    points:
      - "针距 3 mm、布厚 1.5 mm：转速上限 {{sol_enterprise.nmax3:.0f}} r/min"
      - 按布厚算出模板能动的时间窗口
      - X、Y 两轴伺服和同步带一起校核
    visual: {video: pattern}
    notes: "电子花样机的核心是一条规矩：机针在布中，模板不能动。软件按布厚算出模板能动的时间窗口，针距三毫米时转速上限每分钟 {{sol_enterprise.nmax3:.0f}} 转。X、Y 两轴的伺服电机和同步带也一起校核。"

  - layout: figure
    title: 上传针位表，每针的转速自动排好
    visual: {fig: sol_pattern_charts}
    h: 630
    caption: 红线是每针自身的转速上限，蓝线是前瞻调速后的转速；长针前自动减速
    notes: "花样可以用现成的，也可以上传针位表。软件按每一针的长短算出它自己的转速上限，再前瞻调速：长针之前提前减速，过了再升上去，给出每针的转速和整个花样的用时。"

  - layout: answer
    title: 同一台电机，换个带轮就合格
    rows:
      - [带轮半径 15 mm，有效转矩, "{{sol_enterprise.rms15:.2f}} N·m"]
      - [电机额定转矩, "{{sol_enterprise.rated}} N·m"]
      - [带轮半径 10 mm，有效转矩, "{{sol_enterprise.rms10:.2f}} N·m"]
    foot: 不换电机，只改带轮半径，有效转矩降到额定以内；正式选型再留 1.2 倍余量
    notes: "伺服选型有个常见的坑。花样机 X 轴用同一台电机，带轮半径十五毫米时有效转矩 {{sol_enterprise.rms15:.2f}} 牛米，超过额定的 {{sol_enterprise.rated}}，会发热；改成十毫米，降到 {{sol_enterprise.rms10:.2f}}，刚好在额定以内。不换电机，只改带轮，正式选型时再留余量。"

  - layout: split
    title: 多头刺绣机：头越多，绷架越重
    points:
      - "8 头、7 mm 缎纹、800 r/min：需要 {{sol_enterprise.a7:.1f}}，可用 {{sol_enterprise.am8:.1f}} m/s²"
      - "这一针的转速上限 {{sol_enterprise.n8_7:.0f}} r/min"
      - 断线检测、回退补绣与换色一起算
    visual: {video: embroid}
    notes: "多头刺绣机的头越多，绷架越重。八头机绣七毫米的缎纹，每分钟八百转时绷架需要 {{sol_enterprise.a7:.1f}} 米每二次方秒的加速度，驱动力只给得出 {{sol_enterprise.am8:.1f}}，跟不上，这一针的转速要降到每分钟 {{sol_enterprise.n8_7:.0f}} 转以下。"

  - layout: bignum
    title: 买几头机？先看全机效率
    nums:
      - {n: "{{sol_enterprise.eff4:.0f}}%", label: 4 头}
      - {n: "{{sol_enterprise.eff8:.0f}}%", label: 8 头}
      - {n: "{{sol_enterprise.eff15:.0f}}%", label: 15 头}
      - {n: "{{sol_enterprise.eff20:.0f}}%", label: 20 头}
    foot: 同一花样、同样断线率、每分钟 800 转；头多停车多，效率往下掉
    notes: "头数也要算。同一个花样、同样的断线率，四头机全机效率百分之 {{sol_enterprise.eff4:.0f}}，八头百分之 {{sol_enterprise.eff8:.0f}}，二十头只剩百分之 {{sol_enterprise.eff20:.0f}}：头越多，断线停车越多。买几头机、怎么排花样，心里有数。"

  - layout: duo
    title: 出件：拿去就能用
    left:
      fig: sol_step
      label: 三维模型、零件轮廓（平缝机、包缝机）
      note: 通用三维格式，任何设计软件都能打开；二维轮廓直接下料
    right:
      fig: sol_freecad
      label: FreeCAD 工作台
      note: 同一份计算核心，结果和网页版一样
    notes: "算好了直接出件：设计计算书、装配调机卡、参数表，三维模型用通用格式，任何设计软件都能打开，平板零件的二维轮廓可以直接下料、线切割。习惯桌面软件的工程师装 FreeCAD 工作台，同一份计算核心，结果和网页版一样。"

  - layout: points
    title: 一次设计，一套文件
    points:
      - 每种机型：设计计算书、装配调机卡、参数表与运动曲线
      - 平缝机、包缝机另出三维模型、零件二维轮廓、FreeCAD 宏
      - 中文、英文两种语言，出口机型直接用
    notes: "一次设计出一套文件：每种机型都有设计计算书，写清每一项校核的依据；调机卡给装配车间，每一步给目标值；参数表带运动曲线数据。平缝机和包缝机另出三维模型、二维轮廓和宏。中文、英文两种语言，出口机型直接用。"

  - layout: figure
    title: 设计优化：几秒钟给出最好的三组
    visual: {fig: sol_opt}
    h: 560
    caption: 选一个目标，在参数范围里自动找；每组都整机校核一遍，点“采用”回填
    notes: "还可以让软件自己找。选一个目标，比如平衡率让整机惯性力最小，几秒钟给出最好的三组参数，每组都整机校核一遍、标出红灯黄灯，点采用就回填到设计里。结果可复现，每次一样。"

  - layout: chain
    title: 设计软件不是孤岛
    steps: [改参数, 红绿灯, 有限元, 数控程序, 发布审批, 物料与工单]
    hot: [0, 1]
    mark: [设计软件, ""]
    foot: 同一组参数：仿真结果自动写进计算书，零件直接出程序，批准后进 ERP
    notes: "设计软件不是孤岛。同一组参数，关键零件一键送有限元，结果自动写进计算书；零件直接出数控程序；在桌面软件里还能一键提交审批，批准后物料和工单跟着更新。下面一部分就讲仿真和加工。"

  # ================= 二、仿真与加工 =================
  - layout: section
    num: "02"
    title: 仿真与加工

  - layout: duo
    title: 强度、疲劳与减重
    left:
      fig: sol_fea
      label: 有限元强度与疲劳寿命
      note: 受力按一转里最大的时刻，自动加约束和载荷
    right:
      fig: sol_topo
      label: 拓扑减重，再送有限元复核
      note: 减掉的材料不靠猜，复核合格才算数
    notes: "关键零件一键送有限元。软件按一转里受力最大的时刻自动加约束和载荷，算强度安全系数和疲劳寿命，判据是安全系数不小于二、寿命不少于五年。想减重就做拓扑优化，减完再送有限元复核，合格才算数。"

  - layout: tiles
    title: 不会用仿真软件，也能做仿真
    tiles:
      - {k: "01", name: 强度与疲劳, use: 连杆、曲柄、摆杆；每针一个循环算寿命}
      - {k: "02", name: 机壳、绷架模态, use: 上传模型就算固有频率，离共振多远}
      - {k: "03", name: 机构动力学, use: 主轴需要多大转矩，和公式对照}
      - {k: "04", name: 主轴与伺服选型, use: 按电机表一台台比，留余量}
      - {k: "05", name: 拓扑减重, use: 材料该留在哪，减完再复核}
      - {k: "06", name: 计算书自动收录, use: 算完的结果写进同一组参数的计算书}
    notes: "仿真不再是少数专家的事。强度和疲劳、机壳和绷架的固有频率、机构动力学、主轴和伺服选型、拓扑减重，都是点一下就交给服务器算，约束、载荷、判据软件自己加，算完的结果自动写进计算书。"

  - layout: duo
    title: 伺服选型与数控编程
    left:
      fig: sol_pattern_motor
      label: X、Y 轴伺服选型
      note: 每台电机用自己的转子惯量重算，留 1.2 倍余量
    right:
      fig: sol_tpl_cam
      label: 花样模板直接出数控程序
      note: 针迹轨迹变成模板上的槽，试切检查后下载
    notes: "花样机和刺绣机的伺服，按电机表一台台比，每台用它自己的转子惯量重算，峰值和有效值都留一点二倍余量。花样模板也不用再手工画：按针迹轨迹在模板上开槽，交给数控编程，自动选刀、试切检查，合格了下载程序就能上机床。"

  - layout: chain
    title: 零件和模板：从设计到机床
    steps: [三维零件, 识别特征, 选刀与切削参数, 生成程序, 试切检查, 下载程序]
    hot: [4]
    mark: [撞刀、过切、超程、功率都查, ""]
    foot: 平板零件、减重后的零件、花样模板都能直接出铣削程序
    notes: "数控编程的过程是这样：读三维零件，识别外轮廓、型腔和孔，自动选刀和切削参数，生成程序，再在服务器上试切一遍，检查撞刀、过切、超程、转速和主轴功率，零错误才给下载。"

  # ================= 三、一体化信息化 =================
  - layout: section
    num: "03"
    title: 一体化信息化

  - layout: tiles
    title: 一个平台，全厂一套数据
    tiles:
      - {k: "01", name: 设计与审批, use: 接已有设计软件；网页看图、批注，批准才生效, hot: true}
      - {k: "02", name: 仿真与数控, use: 有限元、流体、温度场、动力学、编程试切}
      - {k: "03", name: 经营与生产, use: 订单、物料、计划、采购、库存、成本、财务}
      - {k: "04", name: 车间与质量, use: 车间终端、报工、检验、控制图、追溯}
      - {k: "05", name: 设备与安全, use: 设备维护、能源、安全隐患、人员资质}
      - {k: "06", name: 厂情中枢与售后, use: 全厂异常、追因、推演；售后数字分身}
    notes: "第三块是一体化的信息化平台。设计与审批、仿真与数控、经营与生产、车间与质量、设备与安全、厂情中枢与售后，六大块在一个平台上，用一套数据。每一块都能单独用，也能连起来用，还可以对接企业已有的系统。"

  - layout: figure
    title: 首页：全厂今天怎么样，一眼看清
    visual: {fig: sol_f_dash}
    h: 630
    caption: 演示工厂（一家减速器厂，教学模式）：AI 今日简报、准时交付率、设备综合效率、一次合格率、车间实况
    notes: "这是平台首页，用的是我们的演示工厂，一家减速器厂，流程和缝纫机厂是一样的。最上面是 AI 写的今日简报，每条都注明数据来源；下面是准时交付率、设备综合效率、一次合格率、实际成本偏差；再往下是车间每台设备的实况。"

  - layout: chain
    title: 数字主线：设计改版，下游自动跟着变
    steps: [设计发布, 审阅批注, 批准生效, 物料版本加一, 工单带新程序, 车间终端]
    hot: [2]
    mark: [只有批准后才生效, ""]
    foot: 全程留痕：谁改了什么、谁批的、哪些工单受影响
    notes: "数字主线是整个平台的骨架。设计发布新版本，工艺、质量在网页上审阅批注，批准后才生效；生效的同时物料版本加一、物料清单更新，工单带上新的加工程序，车间终端只拿到批准过的版本。全程留痕。"

  - layout: figure
    title: 设计与工艺：不装设计软件也看得懂
    visual: {fig: sol_f_design}
    h: 630
    caption: 设计版本、图纸、物料清单、加工程序和工艺路线在一页
    notes: "工艺、质量、主管不用装设计软件，在网页上就能看图纸、转三维、对比新旧两版，在模型上点一处写意见。设计版本、图纸、物料清单、加工程序和工艺路线都在一页上。"

  - layout: split
    title: 配套与报价：参数一填，物料清单配齐
    points:
      - 参数配置器：销售填参数，出图、报价、草拟订单
      - 按企业的机型做成参数模板，校核规则一起带上
      - 教材里有配套练习：按机型和转速挑电机、驱动
    visual: {video: bom}
    notes: "参数配置器给销售用：把标准机型做成参数模板，连同校核规则一起，销售填参数就出图纸、报价，确认后草拟订单。缝纫机的模板按企业的机型来做。右边是教材里的配套练习：按机型和转速挑电机、驱动器，每条判据打勾。"

  - layout: duo
    title: 订单、计划与车间终端
    left:
      fig: sol_f_order
      label: 订单与计划
      note: 接单、算料、下达工单，一套数据
    right:
      fig: sol_f_term
      label: 车间终端
      note: 选工位、开工、报工，数据实时回到平台
    notes: "接单之后，算料、排计划、下达工单在同一个页面完成；车间终端上，工人选工位、开工、暂停、报工，每一件的用时、刀具寿命实时回到平台，计划员和厂长看到的是同一份数据。"

  - layout: split
    title: 质量闭环：每一件都追得到
    points:
      - 逐台测量、控制图自动判异
      - 不合格品、质量异常单、8D 一条线
      - 从一件产品追到设备、刀具、批次、工序
    visual: {video: factory}
    notes: "质量是闭环的。逐台测量，控制图自动判异；不合格品、质量异常单、整改一条线下来。出了问题，从一件产品追到加工它的设备、当时的刀具、用的哪一批料、哪一道工序。"

  - layout: figure
    title: 经营与成本：每张订单赚了多少
    visual: {fig: sol_f_fin}
    h: 630
    caption: 毛利、应收、存货周转；每张订单的成本拆到料、工、电、废品、加急
    notes: "经营与财务这一页，看每张订单的毛利、应收和现金。每张订单的成本拆到料、工、电、废品、空转和加急，哪一笔钱花在哪里、因为什么，清清楚楚。"

  - layout: duo
    title: 三维车间与产线仿真
    left:
      fig: sol_f_3d
      label: 三维车间
      note: 设备状态实时着色：运行、空闲、调整、停机
    right:
      video: line
      label: 缝制产线仿真（教材实验）
      note: 换款、加人、改工序，先在电脑上跑一个班
    notes: "车间在三维里实时显示，每台设备的运行、空闲、调整、停机一目了然。教材里还有缝制产线的仿真实验：换款、加人、改工序，先在电脑上快进跑一个班，看产量和瓶颈。"

  - layout: answer
    title: 厂情中枢：把全厂连成一张图
    rows:
      - [业务领域, "15 个"]
      - [规则检查全厂, 每 20 秒]
      - [每条结论, 带来源]
    foot: 订单、物料、设备、人员、质量、安全、能源、资金之间的关系都在一张图上
    notes: "厂情中枢是信息化的大脑。它把订单、物料、设备、人员、质量、安全、能源、资金等十五个业务领域连成一张图，规则每二十秒检查一遍全厂，发现问题就沿着图往下算影响、往上找原因，每条结论都带来源。"

  - layout: figure
    title: 指挥台：异常、原因、影响、建议在一屏
    visual: {fig: sol_f_hub}
    h: 630
    caption: 左：异常清单；中：因果链图；右：处理与推演建议
    notes: "这是指挥台。左边是按严重程度排好的异常清单；中间是因果链，一个缺料会影响哪几张订单、哪几个客户；右边是处理和推演建议：不处理会怎样，几个方案各要多少钱、会不会误交期。"

  - layout: chain
    title: 演示工厂的故事：一台机器报警，追到车间
    steps: [现场机器报警, 出厂序列号, 关键零件, 加工设备与刀具, 同批零件, 装在哪些客户]
    foot: AI 起草动作：同批点检、调整刀具修整间隔、通知客户；人确认后执行
    notes: "举一个演示工厂里的故事。客户现场一台机器报警，沿着图往回走：出厂序列号、关键零件、加工它的设备和当时的刀具、同一阶段加工的其他零件、它们装进了哪些客户的机器。AI 起草三个动作：同批点检、调整刀具修整间隔、通知客户，人确认后执行。"

  - layout: figure
    title: 复盘：每一笔多花的钱从哪来
    visual: {fig: sol_f_review}
    h: 630
    caption: 一张订单从下单到交付：每一幕的异常、采取的动作、多花的钱
    notes: "事后还能复盘。一张订单从下单到交付，每一幕出了什么异常、采取了什么动作、多花了多少钱、预测和实际差多少，一张表讲清楚，下次怎么做心里有数。"

  - layout: split
    title: 售后：每台机器一个数字分身
    points:
      - 演示工厂的产品已经做通：联网上报、健康度、剩余寿命
      - 缝纫机按同样的方法接入运行数据
      - 维修单直接进系统，现场数据反馈设计
    visual: {video: iot}
    notes: "售后也在这条线上。平台给卖出去的每台机器建一个数字分身，算健康度和剩余寿命，提前安排维护，而不是等坏了再修，这在演示工厂的产品上已经做通；缝纫机按同样的方法接入运行数据。维修单直接进系统，现场的数据再反馈给设计。"

  - layout: tiles
    title: 设备、能源与安全也接进同一张图
    tiles:
      - {k: "01", name: 设备维护, use: 预防性维护、点检、维修工单、备件}
      - {k: "02", name: 能源, use: 每台设备的单耗、空转和峰时用电}
      - {k: "03", name: 安全环保, use: 隐患、挂牌上锁、作业许可、人员资质}
    notes: "设备维护、能源和安全也接进同一张图，能耗要接上计量表、排班要接上企业的排班数据。比如一张重大安全隐患单让一台设备停用，中枢会自动算出影响哪几张订单，给出加班、外协、分批交货几个方案，并核对加班的人有没有这台设备的上岗资质。"

  # ================= 四、AI =================
  - layout: section
    num: "04"
    title: AI 贯穿全程

  - layout: points
    title: AI 原生：负担在 AI，不在人
    points:
      - 一句话说要做什么，AI 填好设置、检查是否合理
      - 计算交给成熟的求解器，结果可以复核
      - AI 解释结果、写报告；动作要人批准才执行
    notes: "我们说的 AI 原生，意思是负担在 AI，不在人。你用一句话说要做什么，AI 填好设置、检查是否合理；真正的计算交给成熟的求解器，结果可以复核；AI 再把结果讲成人话、写成报告。凡是会改变业务的动作，必须人批准才执行。"

  - layout: tiles
    title: AI 在每一环
    tiles:
      - {k: "01", name: 仿真, use: 一句话设好材料、约束、载荷，解释结果}
      - {k: "02", name: 数控编程, use: 一句话编程，逐段讲解程序}
      - {k: "03", name: 工厂代理, use: 查数、追因、推演、起草动作，带引用}
      - {k: "04", name: 日报周报, use: 每天自动写厂情日报，数字逐个核对}
      - {k: "05", name: 预测性维护, use: 数字分身算健康度、剩余寿命}
      - {k: "06", name: 培训, use: 老师的资料扔进去，AI 建出整门课}
    notes: "AI 在每一环：仿真里一句话设好材料、约束和载荷；编程时一句话出程序、逐段讲解；工厂代理帮你查数、追因、推演、起草动作；每天自动写厂情日报；预测性维护；培训上，把资料扔进去，AI 建出整门课。"

  - layout: figure
    title: AI 工厂代理：结论带引用，不瞎编
    visual: {fig: sol_f_hub2}
    h: 630
    caption: 一张逾期订单：AI 讲成人话、分析原因，右边给出几个方案和推演结果
    notes: "这是 AI 工厂代理在指挥台上的样子。一张逾期订单，点“讲成人话”或者“让 AI 分析”，它通过查询、追因、推演这些工具工作，给出几个方案和推演结果，每个结论都标着依据的是哪条记录。"

  - layout: points
    title: 让 AI 可信的三条规矩
    points:
      - 每个结论附来源；数字由程序逐个和原始数据核对
      - AI 只能起草动作，执行要有权限的人批准
      - 没有大模型时，规则版照样能答，固定题必须全对
    notes: "让 AI 可信，我们定了几条规矩。每个结论附来源，回答里的每个数字由程序和原始数据逐个核对，对不上的标“未经核实”。AI 只能起草动作，执行要有权限的人批准。没有大模型时，规则版照样能答，固定的评测题必须全对才能上线。"

  - layout: split
    title: 推演：先在副本上试，再动真车间
    points:
      - 改派、调序、加班、外协、紧急采购、分批交货
      - 每个方案算出交期和多花的钱
      - 安全和人员资质作为硬约束
    visual: {fig: sol_f_hub}
    notes: "推演是在当前车间的副本上试改动：改派、调序、加班、外协、紧急采购、分批交货，每个方案算出交期和多花的钱，再比较。安全和人员资质是硬约束：挂牌上锁的设备不能用，没资质的人不能排到那台设备。"

  - layout: split
    title: AI 质检的阈值怎么定（教材实验）
    points:
      - 检测模型给每件产品打分
      - 区分能力越强，漏检和误判越少
      - 阈值按漏检和误判的代价来定
    visual: {video: aiqc}
    notes: "企业上 AI 质检，最容易拍脑袋的是阈值。检测模型给每件产品打分，好品和次品的得分分得越开，漏检和误判越少；阈值按漏检一件、误判一件各要花多少钱来定。这是教材里的一个虚拟实验，工程师可以自己练。"

  - layout: duo
    title: AI 建课：资料扔进去，整门课建出来
    left:
      fig: sol_ai_sort
      label: 资料自动分类
      note: 大纲、教案、讲义、课件、试卷，AI 自己认
    right:
      fig: sol_ai_outline
      label: 按资料生成大纲
      note: 每一节都注明依据的是哪份资料
    notes: "培训也可以交给 AI。AI 建课已经在问渠学习平台上给老师用，企业培训一样能用：把已有的培训资料扔进去，大纲、教案、讲义、试卷都行，AI 自己分类，按资料生成课程大纲，每一节都注明依据的是哪份资料，再生成课件、作业和测验。新员工培训、调机培训都可以这样建。"

  - layout: figure
    title: 建出来的是网页互动课件
    visual: {fig: sol_ai_deck}
    h: 630
    caption: 像幻灯片一样翻页，动画、虚拟实验就在页里
