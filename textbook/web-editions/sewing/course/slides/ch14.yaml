lesson: 14
code: [ch14]
lab: {no: "14-1", id: trim, title: ["虚拟实验 14-1 剪线时序编辑器", "Virtual lab 14-1 Trimming sequence editor"]}

clips:
  hero:          # 封面：平缝机三维样机，全透视，慢慢转
