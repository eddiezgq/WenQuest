    selector: "#stage"
    dur: 10
    steps:
      - {at: 0, press: "#shell [data-k=xray]"}
  crit:          # 时刻表：发令角来回调，红色进刀范围进出绿色窗口
    page: trim
    selector: "#tl"
    loop: 12
    steps:
      - {at: 0, js: "var t=document.getElementById('tl').parentElement;for(var e=t;e&&e!==document.body;e=e.parentElement){[].forEach.call(e.parentElement.children,function(c){if(c!==e)c.style.visibility='hidden'})}document.documentElement.style.background=document.body.style.background='#0d1626'"}
      - {at: 0, press: "#reset"}
      - {at: 0.2, set: {pc: 290}}
      - {at: 3, set: {pc: 280}}
      - {at: 6, set: {pc: 290}}
      - {at: 9, set: {pc: 316}}
  speed:         # 同样 290° 发令，剪线转速 300 → 700 r/min，进刀一步步推迟
    page: trim
    selector: "#tl"
    loop: 12
    steps:
      - {at: 0, js: "var t=document.getElementById('tl').parentElement;for(var e=t;e&&e!==document.body;e=e.parentElement){[].forEach.call(e.parentElement.children,function(c){if(c!==e)c.style.visibility='hidden'})}document.documentElement.style.background=document.body.style.background='#0d1626'"}
      - {at: 0, press: "#reset"}
      - {at: 0.2, set: {n: 300, pc: 290}}
      - {at: 2, set: {n: 400}}
      - {at: 4, set: {n: 500}}
      - {at: 6, set: {n: 600}}
      - {at: 8, set: {n: 700}}
  spread1:       # 500 r/min、291° 发令、延迟 6–10 ms：一遍遍试剪 50 次
    page: trim
    selector: ".col:first-child .panel:nth-child(2)"
    loop: 2.5
    steps:
      - {at: 0, set: {n: 500, pc: 291, t1: 6, t2: 10}, press: "#try"}
  spread2:       # 同上，延迟 5–15 ms
    page: trim
    selector: ".col:first-child .panel:nth-child(2)"
    loop: 2.5
    steps:
      - {at: 0, set: {n: 500, pc: 291, t1: 5, t2: 15}, press: "#try"}

slides:
  - layout: cover
    video: hero
    kicker: ["第 14 讲", "Lecture 14"]
    title: ["工业平缝机电控", "Control of the Industrial Lockstitch Machine"]
    sub: ["松开脚踏的半秒钟里，发生了什么", "What happens in the half-second after the pedal is released"]
    notes:
      - "同学们好。前面几讲我们把平缝机的机构讲透了，上一讲又讲了伺服电机和电磁铁。今天把两者合起来：一台电控平缝机，怎样按主轴转角指挥电磁铁和电机，自动完成回针、剪线、拨线。重点只有一个：每个动作都要对准机械时刻表。"
      - "Welcome back. We have studied the lockstitch mechanisms in depth, and last time we looked at servo motors and solenoids. Today we put the two together: how an electronically controlled lockstitch machine commands its solenoids and motors by shaft angle to backtack, trim and wipe automatically. One idea runs through it all: every action has to line up with the mechanical timing chart."

  - layout: question
    tag: ["车间问题", "Shop-floor problem"]
    title: ["剪线转速从 300 提到 500，值不值？", "Trimming at 500 instead of 300 r/min: worth it?"]
    facts:
      - ["4000 r/min 缝纫，每人每天剪线约 3000 次", "Sewing at 4000 r/min; about 3000 trims per operator a day"]
      - ["剪线电磁铁延迟 6–10 ms，动刀须在 300°–330° 进刀", "Trimming solenoid delay 6–10 ms; the knife must enter at 300°–330°"]
      - ["下一转 55° 剪断，必须在 96.7° 前停住", "Cut at 55° of the next turn; must stop before 96.7°"]
    notes:
      - "先看车间问题。一个衬衫车间的电控平缝机以每分钟 4000 转缝纫，每个操作工一天剪线大约 3000 次。工程师想把剪线转速从 300 提到 500。剪线电磁铁有 6 到 10 毫秒的延迟，动刀必须在 300° 到 330° 之间进刀，剪断以后还要在 96.7° 之前停住。提速能省多少时间？还剪得断吗？发令角取多少？这节课最后回答。"
      - "Here is the shop-floor problem. On a shirt floor the electronically controlled lockstitch machines sew at 4000 r/min, and each operator trims about 3000 times a day. The engineer wants to raise the trimming speed from 300 to 500 r/min. The trimming solenoid has a 6 to 10 millisecond delay, the knife must enter between 300 and 330 degrees, and after the cut the shaft must stop before 96.7 degrees. How much time does it save? Will it still cut every time? What command angle should we use? We'll answer at the end."

