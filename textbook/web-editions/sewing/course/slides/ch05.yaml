  - layout: answer
    tag: ["回到车间问题", "Back to the problem"]
    title: ["撞针：旋梭外移 0.1 mm；改时刻转 6°", "A strike: move the hook out 0.1 mm; re-time by 6°"]
    rows:
      - ["换 Nm 110 后间隙", "{{ch05.gap110:.2f}} mm"]
      - ["旋梭沿轴向外移", "{{ch05.move:.2f}} mm"]
      - ["回升 2.0 → 2.5 mm", "{{ch05.a20x:.1f}}° → {{ch05.a25:.1f}}°"]
    side: {big: "≈ {{ch05.hook25:.0f}}°", text: ["主轴差约 {{ch05.main25:.0f}}°，2:1 传动：旋梭在轴上转约 {{ch05.hook25:.0f}}°", "About {{ch05.main25:.0f}}° of shaft; at 2:1 the hook turns about {{ch05.hook25:.0f}}°"]}
    foot: ["顺序：先定时刻，再复查针杆高度，最后调间隙到 0.06 mm（手册 0.04–0.1 mm）", "Order: timing, then check bar height, then clearance to 0.06 mm (manual 0.04–0.1)"]
    notes:
      - "回到开头。粗针表面向梭尖靠近半个直径差 {{ch05.dgap:.2f}} 毫米，间隙变成 {{ch05.gap110:.2f}}，梭尖撞针，这就是响声和断针的原因，要把旋梭沿轴向外移 {{ch05.move:.2f}} 毫米。回升 2.0 毫米按近似式在 {{ch05.a20x:.1f}} 度，2.5 毫米在 {{ch05.a25:.1f}} 度，主轴差约 {{ch05.main25:.0f}} 度，旋梭是两倍转速，所以在轴上要转约 {{ch05.hook25:.0f}} 度。调完时刻复查针杆高度，最后调间隙。"
      - "Back to the start. The thicker needle's surface moves toward the point by half the diameter difference, {{ch05.dgap:.2f}} millimetres, so the clearance becomes {{ch05.gap110:.2f}}: the point hits the needle, hence the clatter and the broken needle. Slide the hook out {{ch05.move:.2f}} millimetres. By the approximate formula 2.0 millimetres of rise is at {{ch05.a20x:.1f}} degrees and 2.5 at {{ch05.a25:.1f}}, about {{ch05.main25:.0f}} degrees of shaft; the hook turns twice as fast, so turn it about {{ch05.hook25:.0f}} degrees on its shaft. Then check the bar height, and set the clearance last."

  - layout: summary
    title: ["本讲小结", "Summary"]
    points:
      - ["全回转旋梭 2:1：一圈空转换来收线时间", "Full-rotary hook at 2:1: an idle turn buys tightening time"]
      - ["三个量：时刻、高度、间隙；换针号重调间隙", "Timing, height, clearance; new needle size, new clearance"]
      - ["窗口斜、窄：先时刻、再高度、后间隙", "A slanted, narrow window: timing, height, clearance"]
    after: ["作业 5：钩线调整计算与诊断 · 测验 · 实验 5-1 报告 —— 在问渠学习平台完成", "Assignment 5 · quiz · Lab 5-1 report — on WenQuest"]
    notes:
      - "这一讲记住三件事。第一，工业平缝机用全回转旋梭，和主轴 2 比 1，用一圈空转换来收线和送布的时间，梭尖线速度约 {{ch05.vh:.0f}} 米每秒。第二，现场能调三个量：钩线时刻、针杆高度、梭尖间隙，换针号一定重调间隙。第三，钩线窗口是斜的、很窄，针织更窄，按时刻、高度、间隙的顺序调，工作点放在窗口中间。下一讲讲送布机构。"
      - "Three things to remember. One: industrial machines use the full-rotary hook at two to one, spending an idle turn to buy time for tightening and feeding; the point moves at about {{ch05.vh:.0f}} metres a second. Two: you can adjust three things, timing, needle-bar height and clearance, and a new needle size always means a new clearance. Three: the catch window slants and is narrow, narrower still for knits, so set timing, then height, then clearance, with the working point mid-window. Next: the feed mechanism."
