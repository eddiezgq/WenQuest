# 第 5 讲 钩线机构 · 课件（第 24 轮新版式）
# 每页一个意思、最多 3 条；中文在上、英文一行在下。版式见 course/tools/build_slides.py 的 LAYOUTS。
# {{ch05.键:格式}} 由课程包程序 course/calc/ch05.py 算出，不手写数字。
# notes：讲者备注（放映时只给老师看，录课时当讲稿用）。
lesson: 5
code: [ch05]

clips:
  hero:          # 封面：三维样机全透视，钩线链突出，镜头对着底板下的旋梭
    page: proto-lockstitch
    selector: "#stage"
    steps:
      - {at: 0, press: ["#shell [data-k=xray]", "#chains [data-k=hook]"]}
      - {at: 2, js: "var t=document.getElementById('tableOn');t.checked=false;t.onchange();window.__api.cam(-0.8,0.25,360,[-17,-10,0])"}
  form:          # 三维样机：看成线（放大钩线区，慢放 1/100，一直转）
    page: proto-lockstitch
    selector: "#stage"
    steps:
      - {at: 0, press: "#zoomBtn"}
  front:         # 实验 5-1：正视，对着机针凹口看线环和梭尖
    page: hook
    selector: "#front"
    steps:
      - {at: 0, js: "var M=document.querySelector('#front');document.querySelectorAll('body *').forEach(function(e){if(!e.contains(M)&&!M.contains(e))e.style.visibility='hidden'})"}
  top:           # 实验 5-1：俯视截面，梭尖与机针的间隙
    page: hook
    selector: "#top"
    steps:
      - {at: 0, js: "var M=document.querySelector('#top');document.querySelectorAll('body *').forEach(function(e){if(!e.contains(M)&&!M.contains(e))e.style.visibility='hidden'})"}
  thick:         # 换 Nm 110，旋梭不动：间隙变负，撞针
    page: hook
    selector: "#top"
    steps:
      - {at: 0, set: {nm: "1.1"}, js: "var M=document.querySelector('#top');document.querySelectorAll('body *').forEach(function(e){if(!e.contains(M)&&!M.contains(e))e.style.visibility='hidden'})"}
  woven:         # 钩线窗口：梭织
    page: hook
    selector: "#map"
    vh: 1250
  knit:          # 钩线窗口：针织，明显变窄
    page: hook
    selector: "#map"
    vh: 1250
    steps:
      - {at: 0, set: {fab: knit}}
  mess:          # “打乱”→“恢复手册标准”，工作点在窗口里跳来跳去（一直循环）
    page: hook
    selector: "#map"
    vh: 1250
    loop: 12
    steps:
      - {at: 0, press: "#mess"}
      - {at: 6, press: "#reset"}

slides:
  - layout: cover
    video: hero
    kicker: ["第 5 讲", "Lecture 5"]
    title: ["钩线机构", "The Hook Mechanism"]
    sub: ["在对的时刻、对的高度、对的间隙钩住线环", "Catch the loop at the right time, height and clearance"]
    notes:
      - "这一讲讲第三条传动链：钩线机构，也就是旋梭。画面上突出的是钩线链，从下轴经齿轮到旋梭。车间里最常见的毛病跳针、撞针、断针，修机师傅最先查的都是它。今天把它讲透，最后让大家亲手把一台没调好的机器调好。"
      - "Today the third drive train: the hook mechanism, the rotary hook. On screen the hook train is highlighted, from the lower shaft through gears to the hook. Skipped stitches, needle strikes, broken needles: the shop floor's commonest faults, and the first thing a mechanic checks is the hook. Today we'll understand it fully, and you'll set up a badly adjusted machine yourselves."

  - layout: question
    tag: ["车间问题", "Shop-floor problem"]
    title: ["换了粗针，旋梭处“嗒嗒”响", "A thicker needle, and the hook starts clattering"]
    facts:
      - ["衬衫线改做牛仔裤：Nm 90 换成 Nm 110，旋梭没动", "Shirts to jeans: Nm 90 to Nm 110, hook untouched"]
      - ["原间隙 0.06 mm；钩线按回升 2.0 mm 设定", "Clearance was 0.06 mm; timing set at 2.0 mm rise"]
      - ["开机“嗒嗒”响，几百针后断针", "It clatters, and after a few hundred stitches the needle breaks"]
    notes:
      - "车间问题。某服装厂把一条衬衫线改做牛仔裤，修机师傅把机针从 Nm 90 换成 Nm 110，旋梭没动。原来梭尖间隙调在 0.06 毫米，钩线时刻按机针回升 2.0 毫米设定。开机后旋梭处传来嗒嗒的金属声，几百针以后机针折断。车间主任还想按手册把牛仔料的钩线时刻调到回升 2.5 毫米。该怎么调？"
      - "Here's the problem. A garment factory switches a shirt line to jeans. The mechanic changes the needle from Nm 90 to Nm 110 and leaves the hook alone. The clearance was set at 0.06 millimetres and the timing at 2.0 millimetres of needle rise. Now the hook clatters, and after a few hundred stitches the needle snaps. The supervisor also wants the timing at 2.5 millimetres for denim, as the manual suggests. What needs adjusting, and by how much?"

  - layout: section
    num: "01"
    title: ["钩线机构做什么", "What the hook has to do"]

  - layout: split
    title: ["钩住、绕梭、脱环", "Catch, carry round, cast off"]
    points:
      - ["钩住：梭尖钻进机针和线环之间", "Catch: the point slips between needle and loop"]
      - ["绕梭：带线环绕过梭壳，套进底线", "Carry: round the case, taking in the bobbin thread"]
      - ["脱环：线环滑出，挑线杆收紧", "Cast off: the loop slips free, the lever pulls it tight"]
    visual: {video: form}
    notes:
      - "钩线机构一针里要做几件事，看三维样机放慢一百倍。第一是钩住：机针回升，线环在凹口一侧鼓出，梭尖正好从机针和线环之间钻过去。然后拉大线环，带着它绕过装底线的梭壳，底线就穿进了线环。最后脱环，线环从梭壳滑下，挑线杆收紧。后几件事靠旋梭形状，设计定了很少要调；钩住这件事对位置和时刻极其敏感，是本讲重点。"
      - "What does the hook do in one stitch? Watch the prototype at one-hundredth speed. First, the catch: the needle rises, a loop bulges out by the scarf, and the point slips in between needle and loop. Then it draws the loop larger and carries it round the bobbin case, so the bobbin thread passes through. Finally cast-off: the loop slips off the case and the lever pulls it tight. The later steps depend on the hook's shape and rarely need adjusting; the catch is extremely sensitive to position and timing, and that's today's focus."

  - layout: figure
    title: ["三种钩线器", "Three kinds of hook"]
    visual:
      svg: |-
        <svg viewBox="0 0 1720 610" width="100%" height="100%"><rect x="10" y="0" width="540" height="600" rx="24" fill="#101b2e" stroke="#ff7a45" stroke-width="2"/><defs><marker id="m0" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff7a45"/></marker></defs><circle cx="280" cy="240" r="70" fill="#ff7a45" opacity=".35"/><path d="M130 200 A160 160 0 0 0 430 200" stroke="#ff7a45" stroke-width="10" fill="none" marker-start="url(#m0)" marker-end="url(#m0)"/><ellipse cx="280" cy="290" rx="110" ry="46" fill="#c8d2de" opacity=".8"/><text x="280" y="455" font-size="40" font-weight="800" fill="#ff7a45" text-anchor="middle">摆梭</text><text x="280" y="490" font-size="22" fill="#8fa3ba" text-anchor="middle" class="en">oscillating shuttle</text><text x="280" y="560" font-size="28" fill="#f3f6fa" text-anchor="middle">来回摆，每针换向两次</text><rect x="580" y="0" width="540" height="600" rx="24" fill="#101b2e" stroke="#4c8dff" stroke-width="2"/><defs><marker id="m1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4c8dff"/></marker></defs><circle cx="850" cy="240" r="70" fill="#ff7a45" opacity=".35"/><circle cx="850" cy="240" r="130" fill="none" stroke="#4b5f7d" stroke-width="20"/><path d="M700 300 A162 162 0 0 1 1000 300" stroke="#4c8dff" stroke-width="10" fill="none" marker-start="url(#m1)" marker-end="url(#m1)"/><text x="850" y="455" font-size="40" font-weight="800" fill="#4c8dff" text-anchor="middle">半回转旋梭</text><text x="850" y="490" font-size="22" fill="#8fa3ba" text-anchor="middle" class="en">half-rotary hook</text><text x="850" y="560" font-size="28" fill="#f3f6fa" text-anchor="middle">来回转，家用机常见</text><rect x="1150" y="0" width="540" height="600" rx="24" fill="#101b2e" stroke="#f2b705" stroke-width="5"/><defs><marker id="m2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f2b705"/></marker></defs><circle cx="1420" cy="240" r="70" fill="#ff7a45" opacity=".35"/><circle cx="1420" cy="240" r="130" fill="none" stroke="#4b5f7d" stroke-width="20"/><path d="M1582 240 A162 162 0 1 1 1535 125" stroke="#f2b705" stroke-width="10" fill="none" marker-end="url(#m2)"/><rect x="1408" y="120" width="24" height="40" fill="#f3f6fa"/><text x="1420" y="455" font-size="40" font-weight="800" fill="#f2b705" text-anchor="middle">全回转旋梭</text><text x="1420" y="490" font-size="22" fill="#8fa3ba" text-anchor="middle" class="en">full-rotary hook</text><text x="1420" y="560" font-size="28" fill="#f3f6fa" text-anchor="middle">单向连续转，无换向冲击</text></svg>
    h: 600
    notes:
      - "钩线器按运动方式分三类。最早的是摆梭，梭子带着梭芯在弧形梭床里来回摆，质量大，每针换向两次，速度上不去。半回转旋梭轻巧一些，绕轴来回转，很多家用机还在用。工业平缝机几乎都用全回转旋梭：旋梭体一直朝一个方向转，梭壳被定位钩挡住不动，没有换向冲击，所以能跑很高的速度。"
      - "Hooks come in three kinds by how they move. The oldest is the oscillating shuttle: it swings back and forth in a curved race with the bobbin inside, heavy and reversing twice a stitch, so it can't go fast. The half-rotary hook is lighter, turning back and forth about an axis; many household machines still use it. Industrial lockstitch machines nearly all use the full-rotary hook: the body turns one way all the time, the bobbin case is held still by a stop, there's no reversal shock, and it can run very fast."

  - layout: split
    title: ["为什么旋梭转得比主轴快一倍", "Why the hook turns twice as fast as the shaft"]
    points:
      - ["钩住到脱环，旋梭要转约 270°", "Catch to cast-off: about 270° of hook"]
      - ["2:1：只占主轴 135°", "At 2:1: only 135° of shaft"]
      - ["1:1：到 {{ch05.off11n:.0f}}° 才脱环，太晚", "At 1:1 cast-off at {{ch05.off11n:.0f}}°, after the next entry"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><path d="M40.0 330 L860.0 330" stroke="#4b5f7d" stroke-width="3"/><path d="M40 320 L40 340" stroke="#4b5f7d" stroke-width="3"/><text x="40" y="372" font-size="22" fill="#8fa3ba" text-anchor="middle" class="en">0°</text><path d="M245 320 L245 340" stroke="#4b5f7d" stroke-width="3"/><text x="245" y="372" font-size="22" fill="#8fa3ba" text-anchor="middle" class="en">120°</text><path d="M450 320 L450 340" stroke="#4b5f7d" stroke-width="3"/><text x="450" y="372" font-size="22" fill="#8fa3ba" text-anchor="middle" class="en">240°</text><path d="M655 320 L655 340" stroke="#4b5f7d" stroke-width="3"/><text x="655" y="372" font-size="22" fill="#8fa3ba" text-anchor="middle" class="en">360°</text><path d="M860 320 L860 340" stroke="#4b5f7d" stroke-width="3"/><text x="860" y="372" font-size="22" fill="#8fa3ba" text-anchor="middle" class="en">480°</text><rect x="655" y="60" width="205" height="250" fill="rgba(255,255,255,.04)"/><text x="758" y="92" font-size="24" fill="#8fa3ba" text-anchor="middle">下一针</text><path d="M829 60 L829 320" stroke="#ff7a45" stroke-width="4" stroke-dasharray="10 6"/><text x="821" y="130" font-size="22" fill="#ffb38f" text-anchor="end">102° 入布</text><rect x="392" y="160" width="231" height="50" rx="10" fill="#2ec4b6"/><text x="382" y="196" font-size="30" font-weight="800" fill="#5ee0d2" text-anchor="end">2 : 1</text><text x="507" y="196" font-size="24" font-weight="700" fill="#08101d" text-anchor="middle">206° → 341°</text><rect x="392" y="240" width="461" height="50" rx="10" fill="#ff7a45" opacity=".9"/><text x="382" y="276" font-size="30" font-weight="800" fill="#ffb38f" text-anchor="end">1 : 1</text><text x="623" y="276" font-size="24" font-weight="700" fill="#08101d" text-anchor="middle">206° → 476°</text><text x="40" y="440" font-size="30" fill="#f3f6fa">旋梭从钩住到脱环约转 270°</text><text x="40" y="480" font-size="24" fill="#8fa3ba" class="en">the hook turns about 270° from catch to cast-off</text><text x="40" y="550" font-size="30" fill="#5ee0d2">2:1 只占主轴 135°，留出收线、送布</text><text x="40" y="600" font-size="30" fill="#ffb38f">1:1 要占 270°，下一针已入布</text><text x="40" y="40" font-size="24" fill="#8fa3ba">主轴转角 · main-shaft angle</text></svg>
    notes:
      - "为什么旋梭要转两圈配主轴一圈？从钩住线环到线环脱出梭壳，旋梭大约要转 270 度。传动比 2 比 1 时，这只占主轴 135 度，206 度钩线，341 度就脱环，离下一针 102 度入布还有一百多度，挑线杆收紧、送布牙送布都在这段时间。改成 1 比 1，线环要到下一针的 {{ch05.off11n:.0f}} 度才脱出，可下一针 102 度就已经刺进布了。旋梭用一圈空转，换来收线时间。"
      - "Why two turns of the hook for one of the shaft? From catching the loop to casting it off, the hook turns about 270 degrees. At two to one that takes only 135 degrees of shaft: catch at 206, cast-off at 341, more than a hundred degrees before the next needle enters at 102, time for the lever to tighten and the dog to feed. At one to one the loop wouldn't come off until {{ch05.off11n:.0f}} degrees into the next stitch, but the needle is already in the cloth at 102. The hook spends one idle turn to buy that time."

  - layout: bignum
    title: ["梭尖有多快", "How fast is the hook point?"]
    nums:
      - {n: "{{ch05.hookrpm:.0f}}", n_en: "r/min", label: ["旋梭转速（主轴 5000）", "Hook speed at 5000 r/min"]}
      - {n: "{{ch05.vh:.0f}} m/s", n_en: "at R = 13.5 mm", label: ["梭尖线速度 v = 2πRn", "Point speed v = 2πRn"]}
      - {n: "< 0.1 mm", n_en: "clearance", label: ["离机针表面的间隙", "Gap to the needle surface"]}
    foot: ["一个每秒走 {{ch05.vh:.0f}} 米的钢尖，从不到一毫米粗的机针旁掠过：位置和时刻都差不得", "A steel point at {{ch05.vh:.0f}} metres a second, brushing past a needle under a millimetre thick"]
    notes:
      - "2 比 1 带来一个直接结果：旋梭转得非常快。主轴每分钟 5000 转，旋梭就是 {{ch05.hookrpm:.0f}} 转。梭尖半径按算例取 13.5 毫米，线速度大约 {{ch05.vh:.0f}} 米每秒。想象一下：一个每秒走 {{ch05.vh:.0f}} 米的钢尖，从一根不到一毫米粗的机针旁边掠过，两者之间的缝隙还不到 0.1 毫米。这就是钩线对位置和时刻那么敏感的原因。"
      - "Two to one has a direct consequence: the hook turns very fast. At 5000 r/min on the shaft the hook does {{ch05.hookrpm:.0f}}. Take the point radius as 13.5 millimetres, our example value, and it moves at about {{ch05.vh:.0f}} metres a second. Picture it: a steel point doing {{ch05.vh:.0f}} metres a second, brushing past a needle less than a millimetre thick with a gap of under a tenth of a millimetre. That's why the catch is so sensitive to position and timing."

  - layout: section
    num: "02"
    title: ["现场能调的三个量", "Three things you can adjust"]

  - layout: split
    title: ["时刻、高度、间隙", "Timing, height, clearance"]
    points:
      - ["时刻：回升 1.6–2.5 mm", "Timing: 1.6–2.5 mm of rise"]
      - ["高度：梭尖高出针眼约 1 mm", "Height: point about 1 mm above the eye"]
      - ["间隙：0.04–0.1 mm", "Clearance: 0.04–0.1 mm (one manual)"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><defs><marker id="k1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f2b705"/></marker></defs><defs><marker id="k2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2ec4b6"/></marker></defs><rect x="380" y="20" width="60" height="520" rx="10" fill="#c8d2de"/><polygon points="380,540 440,540 410,620" fill="#c8d2de"/><ellipse cx="410" cy="470" rx="12" ry="34" fill="#08101d"/><path d="M386 300 Q 410 330 434 300 L434 360 Q 410 390 386 360 Z" fill="#9aa8b8"/><text x="452" y="340" font-size="24" fill="#8fa3ba">凹口</text><path d="M410 440 C 300 420, 250 330, 330 300 C 360 290, 390 320, 400 360" stroke="#4c8dff" stroke-width="8" fill="none"/><path d="M60 380 L370 380" stroke="#f2b705" stroke-width="6" stroke-dasharray="14 8" marker-end="url(#k1)"/><polygon points="200,370 260,380 200,390" fill="#f2b705"/><text x="60" y="360" font-size="28" font-weight="700" fill="#f2b705">梭尖扫过</text><path d="M520 380 L520 436" stroke="#2ec4b6" stroke-width="4" marker-start="url(#k2)" marker-end="url(#k2)"/><path d="M440 380 L540 380 M440 436 L540 436" stroke="#2ec4b6" stroke-width="2" stroke-dasharray="6 4"/><text x="560" y="400" font-size="30" font-weight="700" fill="#5ee0d2">② 针杆高度</text><text x="560" y="436" font-size="24" fill="#8fa3ba">梭尖高于针眼约 1.0 mm</text><text x="560" y="120" font-size="30" font-weight="700" fill="#f2b705">① 钩线时刻</text><text x="560" y="156" font-size="24" fill="#8fa3ba">回升 1.6–2.5 mm，标准约 2</text><path d="M500 70 L500 200" stroke="#f2b705" stroke-width="4" marker-start="url(#k1)"/><text x="560" y="540" font-size="30" font-weight="700" fill="#ffb38f">③ 梭尖间隙</text><text x="560" y="576" font-size="24" fill="#8fa3ba">离机针 0.04–0.1 mm</text></svg>
    notes:
      - "对一台定型的平缝机，现场能调的只有三个量。对着机针凹口看：线环在凹口一侧鼓出来，梭尖横着扫过来。第一个量是钩线时刻，用梭尖到达机针中心线时机针从最低点回升了多少毫米表示，叫回升量。第二个是针杆高度，钩线那一刻梭尖下缘要比针眼上沿高约 1 毫米。第三个是梭尖和机针表面的间隙，某说明书要求 0.04 到 0.1 毫米。"
      - "On a finished machine there are only three things you can adjust in the field. Look at the needle from the scarf side: the loop bulges out there and the hook point sweeps across. One, timing: expressed as how far the needle has risen from its lowest point when the hook point reaches the needle centreline, the rise. Two, needle-bar height: at the catch the point should be about a millimetre above the top of the eye. Three, the clearance between point and needle surface; one manual asks for 0.04 to 0.1 millimetres."

  - layout: bignum
    title: ["钩线时刻：毫米直观，但很灵敏", "Timing in millimetres: intuitive, and very sensitive"]
    nums:
      - {n: "201°", n_en: "{{ch05.r201:.1f}} mm", label: ["回升太少：线环还小", "Too little rise: loop still small"]}
      - {n: "{{ch05.a20:.0f}}°", n_en: "2.0 mm", label: ["标准：δ ≈ {{ch05.delta2:.0f}}°", "Standard: δ ≈ {{ch05.delta2:.0f}}°"]}
      - {n: "211°", n_en: "{{ch05.r211:.1f}} mm", label: ["已超出手册上限", "Past the manual's upper limit"]}
    foot: ["h ≈ (r/2)(1+λ)δ²；调法：松开螺钉转旋梭，旋梭转 1° 只相当于主轴 0.5°", "h ≈ (r/2)(1+λ)δ²; to adjust, loosen the screws and turn the hook: 1° of hook is 0.5° of shaft"]
    notes:
      - "为什么用回升量而不用角度？下止点附近针杆曲线很平，回升量和越过下止点的角度 δ 的平方成正比。算例回升 2 毫米对应 δ 约 {{ch05.delta2:.0f}} 度，钩线在 {{ch05.a20:.1f}} 度。但要注意灵敏度：主轴只差 5 度，回升量就从 {{ch05.r201:.1f}} 跳到 {{ch05.r211:.1f}} 毫米，跨过了手册整个范围。调法是松开螺钉转旋梭，2 比 1，旋梭转 1 度只动主轴半度。"
      - "Why rise rather than angle? Near the bottom the needle curve is flat, and the rise goes with the square of the angle past bottom dead centre, delta. Two millimetres of rise means delta of about {{ch05.delta2:.0f}} degrees, a catch at {{ch05.a20:.1f}}. But mind the sensitivity: five degrees either way and the rise goes from {{ch05.r201:.1f}} to {{ch05.r211:.1f}} millimetres, across the whole range in the manual. To adjust, loosen the screws and turn the hook; at two to one, a degree of hook is only half a degree of shaft."

  - layout: points
    title: ["针杆高度", "Needle-bar height"]
    points:
      - ["梭尖从针眼上方的线环钻过，不划到线", "The point enters the loop above the eye, clear of the thread"]
      - ["松开针杆连接轴，上下移针杆", "Loosen the needle-bar connector and slide the bar"]
      - ["只改针眼高度，不改运动规律", "It changes the eye's height, not the motion"]
    foot: ["有的说明书在针杆上刻两条线：一条定高度，一条定钩线时刻，现场很方便", "Some manuals use two marks on the bar: one for height, one for timing; very handy"]
    notes:
      - "第二个量是针杆高度。钩线那一刻，梭尖下缘要比针眼上沿高一点，梭尖才能从针眼上方的线环里钻过去，不会划到穿在针眼里的线。手册给的是高 1.0 毫米。调法是松开第 3 讲讲过的针杆连接轴，把针杆上下移一移。它只改变针眼的绝对高度，不改变针杆怎么运动。有的说明书干脆在针杆上刻两条线，现场用起来很方便。"
      - "The second is needle-bar height. At the catch, the lower edge of the hook point should be a little above the top of the eye, so the point enters the loop above the eye without catching the thread in it. The manual says 1.0 millimetre above. To adjust, loosen the needle-bar connector from Lecture 3 and slide the bar. It changes only the eye's absolute height, not how the bar moves. Some manuals simply put two marks on the bar, which is very handy in the field."

  - layout: split
    title: ["梭尖间隙", "Hook-point clearance"]
    points:
      - ["沿旋梭轴向挪动旋梭来调", "Adjust by sliding the hook along its shaft"]
      - ["护针轻贴机针，防止被推偏撞梭尖", "A needle guard keeps a pushed needle off the point"]
      - ["间隙按某一号针调定", "The clearance is set for one needle size"]
    visual: {video: top}
    notes:
      - "第三个量是梭尖间隙。这是梭尖所在高度的俯视截面，圆是机针，梭尖从旁边掠过。间隙靠沿旋梭轴向挪动旋梭来调，常见要求是 0.04 到 0.1 毫米。旋梭上还有个护针，轻轻贴着机针，缝厚料时机针被布推偏，它就挡住机针不让它撞上梭尖。记住一条：间隙是按某一号针调定的，下一页就看为什么。"
      - "The third is clearance. This is a section at the height of the point, seen from above: the circle is the needle, and the point sweeps past it. You set it by sliding the hook along its shaft; a typical requirement is 0.04 to 0.1 millimetres. The hook also has a needle guard resting lightly against the needle, so when thick cloth pushes the needle aside it can't hit the point. Remember: the clearance is set for one needle size. The next slide shows why."

  - layout: split
    title: ["换针号：表面移动半个直径差", "Change the needle size: the surface moves half the difference"]
    points:
      - ["Nm 110：0.06 → {{ch05.gap110:.2f}} mm 撞针", "Nm 90 → 110: 0.06 → {{ch05.gap110:.2f}} mm, a strike"]
      - ["Nm 70：0.06 → {{ch05.gap70:.2f}} mm 跳针", "Nm 90 → 70: {{ch05.gap70:.2f}} mm, skips"]
      - ["换针号以后，一定重调间隙", "After any needle change, reset the clearance"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><circle cx="300" cy="300" r="162" fill="none" stroke="#2ec4b6" stroke-width="6"/><circle cx="300" cy="300" r="198" fill="none" stroke="#ff7a45" stroke-width="6"/><text x="300" y="310" font-size="30" fill="#f3f6fa" text-anchor="middle">机针截面</text><text x="70" y="150" font-size="28" font-weight="700" fill="#5ee0d2">Nm 90 · 0.9 mm</text><text x="70" y="530" font-size="28" font-weight="700" fill="#ffb38f">Nm 110 · 1.1 mm</text><path d="M484 60 L484 560" stroke="#f2b705" stroke-width="5" stroke-dasharray="14 8"/><polygon points="484,480 468,540 500,540" fill="#f2b705"/><text x="502" y="90" font-size="28" font-weight="700" fill="#f2b705">梭尖轨迹</text><path d="M462 300 L498 300" stroke="#f3f6fa" stroke-width="4"/><text x="548" y="270" font-size="30" font-weight="700" fill="#f3f6fa">表面外移</text><text x="548" y="314" font-size="34" fill="#f3f6fa" font-family="'DejaVu Serif',serif" font-style="italic">(d₂ − d₁)/2</text><text x="548" y="356" font-size="28" fill="#ffb38f">= {{ch05.dgap:.2f}} mm</text><text x="450" y="620" font-size="40" fill="#f3f6fa" text-anchor="middle" font-family="'DejaVu Serif',serif" font-style="italic">g′ = g − (d₂ − d₁)/2</text></svg>
    notes:
      - "这是一条车间铁律。针号 Nm 除以 100 大约就是针的直径毫米数。从 Nm 90 换到 Nm 110，直径大了 0.2 毫米，表面向梭尖靠近一半，{{ch05.dgap:.2f}} 毫米，原来 0.06 的间隙变成 {{ch05.gap110:.2f}}，梭尖直接撞针。反过来换细针 Nm 70，间隙变成 {{ch05.gap70:.2f}}，线环钩不住就跳针。所以换针号以后，一定要重调间隙。"
      - "This is a shop-floor rule. The Nm number divided by 100 is roughly the needle diameter in millimetres. From Nm 90 to Nm 110 the diameter grows by 0.2 millimetres, so the surface moves half that, {{ch05.dgap:.2f}}, toward the point: a clearance of 0.06 becomes {{ch05.gap110:.2f}}, and the point hits the needle. Go the other way, to Nm 70, and it becomes {{ch05.gap70:.2f}}; the point misses the loop and stitches skip. So after any needle change, reset the clearance."

  - layout: duo
    title: ["同一台机器，只换了针", "Same machine, only the needle changed"]
    left: {video: thick, label: ["Nm 110，旋梭不动", "Nm 110, hook untouched"], note: ["间隙变负：撞针", "Negative clearance: it strikes"]}
    right: {video: top, label: ["Nm 90，手册标准间隙", "Nm 90, standard clearance"], note: ["梭尖从针旁掠过", "The point passes clear"]}
    notes:
      - "用实验 5-1 直接看。右边是 Nm 90 机针、手册标准间隙，梭尖从机针旁掠过；左边只把机针换成 Nm 110，旋梭一点没动，机针表面向外长了一圈，间隙变成负的，梭尖撞在针上。车间里听到的嗒嗒声就是这个。听到嗒嗒声，要马上停机查梭尖和机针，有毛刺用油石修磨或者更换。"
      - "Lab 5-1 shows it directly. On the right, an Nm 90 needle at the standard clearance: the point passes clear. On the left, only the needle changed to Nm 110, hook untouched: the needle surface has grown outward, the clearance is negative, and the point hits the needle. That's the clatter on the shop floor. When you hear it, stop at once and check the point and the needle; stone off any burr or replace the part."

  - layout: section
    num: "03"
    title: ["钩线窗口", "The catch window"]

  - layout: split
    title: ["一个示意模型：线环鼓出多少", "A schematic model: how far the loop bulges"]
    points:
      - ["鼓出先增后减：约 2.2 mm 最大", "The loop grows, largest near 2.2 mm of rise"]
      - ["钩住：鼓出距离 > 间隙 + 梭尖厚", "Caught if bulge > clearance + point thickness"]
      - ["太贴近针眼劈线，间隙为零撞针", "Too near the eye splits the thread; zero clearance strikes"]
    visual: {video: front}
    notes:
      - "三个量为什么要一起调？得知道钩线那一刻线环有多大、在哪儿。真实线环受线的刚度、捻度、布的夹持影响，很难精确算，教材用了一个示意模型。机针回升后线环在凹口一侧鼓出，鼓出距离先变大，回升约 2.2 毫米时最大，然后收拢。梭尖能钩住的条件，是鼓出距离大于间隙加梭尖厚度。另外太贴近针眼会劈线，间隙为零会撞针。"
      - "Why must the three be set together? We need to know how big the loop is at the catch and where. A real loop depends on thread stiffness, twist and how the cloth grips it, and is hard to compute, so the book uses a schematic model. As the needle rises the loop bulges out by the scarf, growing to a maximum near 2.2 millimetres of rise, then closing again. The point catches it if the bulge exceeds the clearance plus the point's thickness. Too near the eye splits the thread; zero clearance hits the needle."

  - layout: duo
    title: ["钩线窗口：梭织宽，针织窄", "The catch window: wide for woven, narrow for knits"]
    left: {video: knit, label: ["针织", "Knit"], note: ["线环小而不稳，窗口变窄", "Small, unsteady loop: narrower"]}
    right: {video: woven, label: ["梭织", "Woven"], note: ["横轴安装角，纵轴针杆高度", "Hook angle across, bar height up"]}
    notes:
      - "在旋梭安装角和针杆高度构成的平面上逐点检查，能钩住的点连成一片，就是钩线窗口，绿色越深余量越大。右边梭织，左边针织。针织物有弹性，线环小而不稳，窗口明显变窄，这就是针织物容易跳针的原因。现场对策：先换圆头针、查装针，再把间隙调到下限，不要一味升降针杆。"
      - "Check every point on the plane of hook angle against needle-bar height, and the points that catch form a region: the catch window, darker green meaning more margin. Right, woven cloth; left, knit. Knits stretch, the loop is small and unsteady, and the window is clearly narrower; that's why knits skip. On the shop floor: first fit a ball-point needle and check how it's fitted, then take the clearance to its lower limit; don't just keep moving the bar up and down."

  - layout: split
    title: ["窗口是斜的：先时刻、再高度、后间隙", "The window slants: timing, then height, then clearance"]
    points:
      - ["钩线推迟，针眼已升高：要降针杆", "Catch later and the eye is higher: lower the bar"]
      - ["时刻和高度要联调，不能各调各的", "Timing and height must be set together"]
      - ["工作点放在窗口中间，留出余量", "Put the working point mid-window, with margin"]
    visual: {video: mess}
    notes:
      - "画面上一会儿点打乱，模拟一台没调好的机器，工作点跑出窗口；一会儿点恢复手册标准，工作点回到窗口中间。注意窗口是斜的：钩线推迟，梭尖到时针眼已升高，梭尖相对偏低，要补救就得降针杆。所以手册规定先定时刻、再定高度、最后定间隙。手册把标准点放在窗口中间，留出余量。"
      - "On screen the machine is scrambled, as if badly set up, and the working point jumps out of the window; then it's restored to the manual's standard and the point is back in the middle. Note the slant: catch later, and by the time the point arrives the eye has risen, so the point is relatively low; to compensate you lower the bar. That's why the manual says timing first, then height, then clearance, and why its standard point sits mid-window, with margin."

  - layout: bignum
    title: ["窗口有多宽？", "How wide is the window?"]
    nums:
      - {n: "≈ 8°", n_en: "shaft angle", label: ["梭织窗口，主轴八度多", "Woven: just over 8° of shaft"]}
      - {n: "{{ch05.win_ms:.2f}} ms", n_en: "at 5000 r/min", label: ["换成时间不到 0.3 毫秒", "Under 0.3 ms"]}
      - {n: "{{ch05.win_mm:.1f}} mm", n_en: "hook travel", label: ["梭尖在这段时间走过的路", "How far the point travels"]}
    foot: ["梭织约从安装角 −7° 到 +10°，回升约 1.5–2.8 mm；针织更窄", "Woven: hook angle about −7° to +10°, rise about 1.5–2.8 mm; knits narrower"]
    notes:
      - "窗口有多宽？梭织面料大约从安装角负 7 度到正 10 度，回升约 1.5 到 2.8 毫米，换成主轴转角只有八度多。每分钟 5000 转，这只有 {{ch05.win_ms:.2f}} 毫秒，梭尖在这段时间走过约 {{ch05.win_mm:.1f}} 毫米。所以钩线只能靠刚性的 2 比 1 传动锁在主轴相位上，靠不了别的。"
      - "How wide is it? For woven cloth the hook angle runs from about minus 7 to plus 10 degrees, a rise of about 1.5 to 2.8 millimetres, and in shaft angle that's just over 8 degrees. At 5000 r/min that's only {{ch05.win_ms:.2f}} milliseconds, in which the point travels about {{ch05.win_mm:.1f}} millimetres. So the catch can only be locked to the shaft phase by a rigid two-to-one drive; nothing else would do."

  - layout: lab
    title: ["虚拟实验 5-1：旋梭定时与针杆高度联调", "Lab 5-1: hook timing and needle-bar height"]
    shot: {page: hook, vh: 1000}
    tasks:
      - ["点“打乱”，按时刻 → 高度 → 间隙调回", "Scramble, then fix timing → height → clearance"]
      - ["换 Nm 110，重调间隙，试缝 30 针", "Fit Nm 110, reset clearance, sew 30 stitches"]
      - ["改针织，在窗口中间设工作点", "Switch to knit; set the point mid-window"]
    notes:
      - "现在大家做虚拟实验 5-1。先点恢复手册标准，记下读数，试缝 30 针。然后点打乱，看哪些读数超出手册范围，按时刻、高度、间隙的顺序调回来，试缝全部正常算完成。接着把机针换成 Nm 110，先不动间隙试缝一次，看碰针多少，再把间隙调回来。最后改成针织面料，在窗口图深绿区中间设定工作点。"
      - "Now Lab 5-1. Restore the manual standard, note the readings and sew 30 test stitches. Then scramble it, see which readings fall outside the manual, and bring them back in the order timing, height, clearance; it's done when 30 stitches sew clean. Next fit an Nm 110 needle, sew once without touching the clearance and count the strikes, then reset it. Finally switch to knit cloth and set the working point in the middle of the dark green."

  - layout: section
    num: "04"
    title: ["钩住以后与现场要点", "After the catch, and field notes"]

  - layout: points
    title: ["钩住以后：绕梭、脱环与润滑", "After the catch: round the case, cast-off, oil"]
    points:
      - ["线从定位钩与梭床的缝里穿过：太小卡线，太大晃动", "Thread passes the stop's gap: too tight snags, too loose rattles"]
      - ["旋梭每分钟一万转：油泵经旋梭轴供油", "The hook does 10 000 r/min: a pump oils it through its shaft"]
      - ["油多弄脏布料，油少发热磨损", "Too much oil soils cloth; too little heats and wears"]
    foot: ["少油、无油旋梭见第 8、23 讲", "Low-oil and oil-free hooks: Lectures 8 and 23"]
    notes:
      - "钩住以后，旋梭带着线环绕过梭壳。梭壳被定位钩挡住不转，线就得从定位钩和梭床之间那条缝里钻过去，有的旋梭还有开梭器把梭床轻轻拨开让路。这条缝太小，线被卡住，断线、起毛；太大，梭壳晃动，有噪声，钩线位置不稳。旋梭每分钟一万转，必须可靠润滑：油多了甩到布上，服装厂最怕；油少了发热磨损。"
      - "Once caught, the loop is carried round the bobbin case. The case is held by a stop, so the thread has to pass through the gap between the stop and the case holder; some hooks have an opener that nudges the holder aside. Too small a gap snags the thread, breaking or fraying it; too large and the case rattles, noisy and with an unsteady catch. And the hook does ten thousand r/min, so it needs reliable oiling: too much and oil flies onto the cloth, the factory's nightmare; too little and it heats and wears."

  - layout: points
    title: ["模型的边界与现场要点", "Model limits and field notes"]
    points:
      - ["线环模型是示意的，不能预测具体机器", "The loop model is schematic; it can't predict a given machine"]
      - ["按手册调到标准，再用实际布、针、线试缝微调", "Set to the manual, then fine-tune by test-sewing real cloth, needle and thread"]
      - ["换针号重调间隙；针织先换圆头针", "New needle size: reset clearance; knits: ball-point first"]
    foot: ["听到“嗒嗒”声：马上停机，查梭尖和机针，毛刺用油石修磨或更换", "Hear clattering: stop, check point and needle, stone off burrs or replace"]
    notes:
      - "说说模型的边界。本讲的线环模型是示意的，鼓出距离怎么变、梭尖厚度取多少，都是为了讲清三个量的配合，不能拿来预测某台机器的窗口。模型参数本来就参照手册范围定的，所以和手册大体一致，不算独立验证。现场可靠的做法仍是按手册调到标准，再用实际的布、针、线试缝微调。换针号重调间隙，针织先换圆头针，听到嗒嗒声马上停机。"
      - "A word on the model's limits. The loop model here is schematic: how the bulge varies and how thick the point is were chosen to explain how the three settings interact, and it can't predict a particular machine's window. Its parameters were set from the manual's ranges, so agreeing with the manual isn't independent proof. In the field, set to the manual's standard, then fine-tune by sewing the real cloth, needle and thread. New needle size, reset the clearance; knits, ball-point needle first; clattering, stop at once."

  - layout: split
    title: ["机器人联系：传送带上抓运动的工件", "Robot link: picking a moving part off a conveyor"]
    points:
      - ["对的时刻、高度、间隙到达", "Arrive at the right time, height and gap"]
      - ["传送带编码器当“主轴”：电子凸轮", "The conveyor encoder is the shaft: an electronic cam"]
      - ["换夹爪重标 TCP，像换针重调间隙", "New gripper, recalibrate the TCP: like a new needle"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><rect x="40" y="420" width="820" height="60" rx="30" fill="#2a3a55"/><circle cx="80" cy="450" r="22" fill="#4b5f7d"/><circle cx="820" cy="450" r="22" fill="#4b5f7d"/><rect x="180" y="370" width="80" height="50" rx="8" fill="#ff7a45"/><rect x="420" y="370" width="80" height="50" rx="8" fill="#ff7a45"/><rect x="660" y="370" width="80" height="50" rx="8" fill="#ff7a45"/><path d="M150 395 L800 395" stroke="#8fa3ba" stroke-width="2" stroke-dasharray="6 6"/><text x="70" y="540" font-size="26" fill="#2ec4b6">编码器 = “主轴”</text><circle cx="80" cy="450" r="34" fill="none" stroke="#2ec4b6" stroke-width="5"/><rect x="560" y="40" width="120" height="50" rx="10" fill="#4b5f7d"/><path d="M620 90 L620 200 L460 250 L460 320" stroke="#c8d2de" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M430 320 L430 360 M490 320 L490 360" stroke="#f2b705" stroke-width="10" stroke-linecap="round"/><text x="520" y="350" font-size="28" font-weight="700" fill="#f2b705">夹爪：时刻、高度、间隙</text><text x="300" y="600" font-size="28" fill="#f3f6fa">换夹爪要重标 TCP ≈ 换针要重调间隙</text></svg>
    notes:
      - "梭尖钩线和机器人在传送带上抓运动的工件是同一类问题：执行器必须在正确的时刻、正确的高度、留着正确的间隙到达一个运动的目标。平缝机靠机械传动把旋梭锁在主轴相位上；机器人用传送带编码器做主轴，按读数实时修正抓取点，这叫传送带跟踪。换粗针要重调间隙，对应机器人换夹爪后必须重新标定工具中心点，否则会撞上工件。"
      - "Catching the loop and a robot picking moving parts off a conveyor are the same kind of problem: the tool must reach a moving target at the right time, the right height and the right clearance. The sewing machine locks its hook to the shaft phase mechanically; the robot uses the conveyor encoder as its shaft and corrects the pick point continuously, which is conveyor tracking. A thicker needle means resetting the clearance; a new gripper means recalibrating the tool centre point, or it crashes into the part."

  - layout: split
    title: ["生活例子：接力赛交接棒", "Everyday example: the relay baton"]
    points:
