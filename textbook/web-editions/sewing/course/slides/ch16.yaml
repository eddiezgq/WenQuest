        </svg>
    notes:
      - "弧焊机器人焊接中途断弧，控制器让焊枪沿已经走过的轨迹倒退一小段，重新起弧，和原焊缝搭接。这和刺绣机断线后绷架回退、补绣到断点是同一个思路：回退量必须不少于检测延迟期间走过的距离，否则留下缺口。多台机器人串在一条节拍线上，任何一台停下全线都要等，停线次数随工位数增加，和多头机一样。要么提高单机可靠性，要么缩短每次恢复时间。"
      - "When an arc-welding robot loses its arc mid-seam, the controller backs the torch up a little way along the path it has already travelled, restrikes the arc and overlaps the existing weld. That's the same idea as an embroidery frame backing up and mending to the break: the back-up must cover at least the distance travelled during the detection delay, or a gap remains. Put several robots in series on a paced line and any one stopping makes the whole line wait, so stoppages grow with the number of stations, just like heads. Either make each machine more reliable or make each recovery shorter."

  - layout: split
    title: ["生活中的例子：地铁车门", "Everyday example: metro doors"]
    points:
      - ["任何一扇门被卡住，整列车都要等", "One stuck door, and the whole train waits"]
      - ["车厢越多，被耽误的次数越多", "More cars, more delays"]
      - ["多头机：任何一头断线，全机停", "Multi-head: any break stops all heads"]
