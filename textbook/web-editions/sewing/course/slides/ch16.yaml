    notes:
      - "生活里最像多头刺绣机的，是一列地铁的车门。一列车有很多节车厢，任何一扇门被卡住，整列车都要等，车厢越多，被耽误的次数越多。多头刺绣机任何一头断线全机停，就是这个道理。所以地铁要让每扇门都更可靠、出了问题处理更快，刺绣机也一样：降低断线率，缩短每次处理时间。"
      - "In everyday life, the closest thing to a multi-head embroidery machine is a metro train's doors. A train has many cars, and if any one door gets stuck, the whole train waits; the more cars, the more often it's delayed. That's exactly why any one head breaking a thread stops the whole machine. So the metro makes every door more reliable and clears problems faster, and so should the embroidery shop: lower the break rate and shorten each recovery."

  - layout: answer
    tag: ["回到车间问题", "Back to the problem"]
    title: ["跑不了 800：这段降到约 {{ch16.n8_7:.0f}} r/min", "Not 800: slow this column to about {{ch16.n8_7:.0f}}"]
    rows:
      - ["需要 / 可用加速度", "{{ch16.a7:.1f}} / {{ch16.am8:.1f}}"]
      - ["7 mm 缎纹转速上限", "{{ch16.n8_7:.0f}} r/min"]
      - ["要跑 850：驱动力", "≈ {{ch16.F850:.0f}} N"]
    side: {big: "{{ch16.eff8:.0f}}%", text: ["全机效率；每小时约 {{ch16.pph8:.1f}} 件", "Machine efficiency; about {{ch16.pph8:.1f}} pieces an hour"]}
    foot: ["控制器在长缎纹段自动降速；要提产能，先降断线率、缩短处理时间", "The controller slows on long satin; for output, cut breaks and handling time first"]
    notes:
      - "回到开头的问题。800 转时窗口 {{ch16.T800:.1f}} 毫秒，7 毫米的缎纹针需要 {{ch16.a7:.1f}} 的加速度；八头机 {{ch16.m8}} 公斤，只能给 {{ch16.am8:.1f}}，不够。转速上限约 {{ch16.n8_7:.0f}}，控制器应在这段自动降速。要到 850 转，驱动力得加到约 {{ch16.F850:.0f}} 牛。效率：期望断线 {{ch16.Nb8:.0f}} 次，缝纫 1500 秒，断线约 {{ch16.Tb8:.0f}} 秒，换色 36 秒，全机效率约 {{ch16.eff8:.0f}}%，每小时约 {{ch16.pph8:.1f}} 件。"
      - "Back to the opening question. At 800 r/min the window is {{ch16.T800:.1f}} milliseconds, and the 7-millimetre satin stitch needs {{ch16.a7:.1f}} metres per second squared; the eight-head frame, at {{ch16.m8}} kilograms, can give only {{ch16.am8:.1f}}. Not enough. The limit is about {{ch16.n8_7:.0f}} r/min, so the controller should slow down automatically there. To reach 850 the drive force would need about {{ch16.F850:.0f}} newtons. Efficiency: {{ch16.Nb8:.0f}} expected breaks, 1500 seconds of sewing, about {{ch16.Tb8:.0f}} seconds lost to breaks and 36 to colour changes: about {{ch16.eff8:.0f}} percent, roughly {{ch16.pph8:.1f}} pieces an hour."

  - layout: summary
    title: ["本讲小结", "Summary"]
    points:
      - ["共用轴和绷架，每头靠头板单独“不缝”", "Shared shafts and frame; head boards let a head stop"]
      - ["n ∝ √(a_max / s)：针越长、头越多，转得越慢", "n ∝ √(a_max / s): longer stitches, more heads, slower"]
      - ["回退 b ≥ d；任何一头断线全机停", "Back up b ≥ d; any break stops every head"]
    after: ["作业 16 · 测验 · 虚拟实验 16-1 实验报告 —— 在问渠学习平台完成", "Assignment 16 · quiz · Lab 16-1 report — on WenQuest"]
    notes:
      - "这一讲记住三件事。第一，多头机共用上轴、下轴和绷架，每个头靠头板上的针杆跳跃、剪线和断线检测单独不缝。第二，绷架要在约 204° 的窗口里走完一针，可用加速度随头数增加而下降，转速上限和根号下加速度除以针长成正比。第三，断线后回退针数不能少于检测延迟，任何一头断线全机停，头越多效率越低。作业、测验和实验报告在问渠平台完成。"
      - "Three things to remember. One: a multi-head machine shares its shafts and frame, and each head stops sewing on its own through the needle-bar jump, trimmer and break detection on its head board. Two: the frame must finish each move in about a 204-degree window, available acceleration falls as heads are added, and the speed limit goes with the root of acceleration over stitch length. Three: after a break, back up at least the detection delay; any one break stops every head, so more heads means lower efficiency. The assignment, quiz and lab report are on WenQuest."
