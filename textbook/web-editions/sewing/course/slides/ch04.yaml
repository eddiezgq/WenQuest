    points:
      - ["挑线：放线、收线、拉线；供线包住耗线", "Give, take up, draw; supply must cover demand"]
      - ["连杆式平稳耐用，代价是多放线", "The four-bar is smooth and durable, at the cost of extra thread"]
      - ["三条判据；换厚料调过线板，改钩线要复核", "Three criteria; move the guide for thick cloth; re-check after re-timing"]
    after: ["作业 4：挑线机构的计算与调整 · 测验 · 实验 4-1 报告 —— 在问渠学习平台完成", "Assignment 4 · quiz · Lab 4-1 report — on WenQuest"]
    notes:
      - "这一讲记住三件事。第一，挑线机构按主轴转角借线、还线，一针里放线、收线、拉线，放线最难，供线曲线必须包住耗线曲线。第二，工业平缝机用连杆式，平稳耐用，代价是多放线，多的由挑线簧收住。第三，三条判据：入布前、入布后、钩线到脱环；换厚料调过线板，改钩线时刻要复核挑线。下一讲讲钩线机构，旋梭。"
      - "Three things to remember. One: the take-up lends and takes back thread by shaft angle, giving, taking up and drawing each stitch; giving is hardest, and supply must cover demand. Two: industrial machines use the four-bar, smooth and durable, at the cost of extra thread held by the check spring. Three: the three criteria, before eye-in, after eye-in, and catch to cast-off; move the guide for thick cloth, and re-check after re-timing the hook. Next: the hook mechanism."
