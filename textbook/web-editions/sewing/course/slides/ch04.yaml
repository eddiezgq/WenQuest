      - "Back to the start. Going from 1.5 to 3-millimetre cloth lifts the demand curve; the minimum margin becomes {{ch04.m3:.1f}} millimetres and after the eye enters it's {{ch04.neg3:.1f}} short, so the hook drags thread out of the tension, tension leaps, and the thread breaks. Move the guide about 12 millimetres toward giving more and the margin is back to {{ch04.mu12:.1f}}, with all three criteria met. Thread: about {{ch04.nst:.0f}} stitches at {{ch04.q:.1f}} millimetres, about {{ch04.cm50:.0f}} centimetres, {{ch04.cm50w:.0f}} with 15 percent waste."

