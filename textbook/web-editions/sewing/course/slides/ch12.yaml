      - [["看 3 台", "Three machines"], ["{{ch12.o3:.0f}} 件/h", "{{ch12.o3:.0f}} pcs/h"]]
      - [["3 台 + 改夹具", "Three + fixture"], ["{{ch12.f3:.0f}} 件/h", "{{ch12.f3:.0f}} pcs/h"]]
    side: {big: "{{ch12.Nstar:.2f}}", text: ["平衡点 N* = (5 + 12)/(5 + 2)", "Balance point N* = (5 + 12)/(5 + 2)"]}
    foot: ["两项一起做增产 {{ch12.g_both:.0f}}，大于单做之和（{{ch12.g_mach:.0f}} + {{ch12.g_fix:.0f}}）", "Both together add {{ch12.g_both:.0f}}, more than the two alone ({{ch12.g_mach:.0f}} + {{ch12.g_fix:.0f}})"]
    notes:
      - "回到开头。平衡点 N* 等于 17 比 7，约 {{ch12.Nstar:.2f}}。看 2 台每小时约 {{ch12.o2:.0f}} 件，人每圈空 {{ch12.idle2:.0f}} 秒；看 3 台约 {{ch12.o3:.0f}} 件，每台每循环等人 {{ch12.wait3:.0f}} 秒。机器贵就看 2 台，人工贵就看 3 台。两个提产方案：加一台机器增 {{ch12.g_mach:.0f}}，只改夹具增 {{ch12.g_fix:.0f}}，两者一起达到约 {{ch12.f3:.0f}} 件，增 {{ch12.g_both:.0f}}，大于两者之和。因为缩短上料把平衡点推到约 {{ch12.Nstar35:.1f}}，看 3 台时每台机器每圈只等 {{ch12.wait3f:.0f}} 秒。"
      - "Back to the start. The balance point is 17 over 7, about {{ch12.Nstar:.2f}}. Two machines give about {{ch12.o2:.0f}} pieces an hour, with the operator idle {{ch12.idle2:.0f}} seconds a round; three give about {{ch12.o3:.0f}}, each machine waiting {{ch12.wait3:.0f}} seconds a cycle. If machines are dear, tend two; if labour is dear, tend three. As for the two improvements: one more machine adds {{ch12.g_mach:.0f}}, the fixture alone {{ch12.g_fix:.0f}}, and both together reach about {{ch12.f3:.0f}}, a gain of {{ch12.g_both:.0f}}, more than the sum. Shorter loading pushes the balance point to about {{ch12.Nstar35:.1f}}, so with three machines each waits only {{ch12.wait3f:.0f}} seconds a cycle."

  - layout: summary
    title: ["本讲小结", "Summary"]
    points:
      - ["一人多机：T = max(a+m, N(a+w))，N* = (a+m)/(a+w)", "Tending: T = max(a+m, N(a+w)), N* = (a+m)/(a+w)"]
      - ["吊挂：动态派工；在制品 = 产量 × 周期", "Hangers: dynamic dispatching; WIP = throughput × time"]
      - ["接力式：从慢到快，产量 = 各人速度之和", "Bucket brigade: slowest first; output = sum of speeds"]
    after: ["作业 12：开袋工段与吊挂线的产能核算 · 测验 · 实验 12-1、12-2 —— 在问渠学习平台完成", "Assignment 12: welting section and hanger line capacity · quiz · Labs 12-1, 12-2 — on WenQuest"]
    notes:
      - "这一讲记住三件事。第一，一人多机：循环时间取人一圈和机器周期的大者，平衡点 N* 等于 a 加 m 除以 a 加 w，平衡点附近波动损失最大。第二，吊挂系统用动态派工，在制品上限定在产量刚变平的地方，在制品等于产量乘周期。第三，接力式单元按从慢到快排列，交接位置按速度比例分配，产量等于各人速度之和。作业、测验和两个实验都在问渠平台上完成。"
      - "Three things to remember. One: in multi-machine tending, the cycle is the larger of the operator's round and the machine cycle, the balance point is a plus m over a plus w, and variation hurts most near it. Two: hanger systems should dispatch dynamically and cap WIP where output just levels off; WIP equals throughput times throughput time. Three: a bucket brigade ordered slowest to fastest shares the work in proportion to speed, and output equals the sum of the speeds. The assignment, quiz and both labs are on WenQuest."
