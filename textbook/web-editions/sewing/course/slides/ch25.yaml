slides:
  - layout: cover
    video: hero
    kicker: ["第 25 讲", "Lecture 25"]
    title: ["机壳与凸轮的制造", "Housings and Cams"]
    sub: ["一个定位置，一个定运动", "One fixes positions, the other fixes motion"]
    notes:
      - "同学们好。上一讲看了机针和旋梭这两件最小的零件，今天看另外两类：机壳最大，整台机器所有的轴孔都在它上面；凸轮最讲究形状，它的廓线就是从动件的运动规律。一个定位置，一个定运动。"
      - "Hello everyone. Last time we looked at the two smallest parts, the needle and the hook. Today it's two other kinds: the housing, the largest part, which carries every shaft bore in the machine; and the cam, the most shape-critical part, whose profile is the follower's motion law. One fixes positions, the other fixes motion."

  - layout: question
    tag: ["车间问题", "Shop-floor problem"]
    title: ["升程误差合格，高速时却响", "Lift error in tolerance, yet noisy at speed"]
    facts:
      - ["弯针凸轮补偿磨削后 P-V 约 5 μm，图纸合格", "Looper cams after compensation: about 5 μm P-V, in spec"]
      - ["6000 r/min 噪声大，球铰很快磨出间隙", "Noisy at 6000 r/min; the ball joints soon wear slack"]
      - ["谐波分析：24 阶、约 2 μm 的振纹", "Harmonic analysis: order 24, about 2 μm of chatter"]
    notes:
      - "先看一个车间问题。一批链缝机的弯针凸轮做过补偿磨削，升程误差 P-V 约 5 微米，按图纸合格。凸轮行程 6 毫米、推程 150 度，最高 6000 转。可装机以后高速噪声明显偏大，弯针架的球铰很快磨出间隙。谐波分析发现，误差里有一个 24 阶、约 2 微米的振纹。工厂的判据是：最高转速下，加速度误差不超过名义峰值的 10%。这只凸轮能跑多快？再补偿一轮行不行？最后回答。"
      - "Here's a shop-floor problem. A batch of chainstitch looper cams has been compensation-ground, and the lift error is about 5 microns peak to valley, within the drawing. Stroke 6 millimetres, a 150 degree rise, modified trapezoid, top speed 6000 r/min. Yet once fitted, the machines are clearly noisier at speed, and the looper-carrier ball joints soon wear slack. Harmonic analysis finds an order-24 component of about 2 microns: chatter left by the grinder. The plant's rule: at top speed, the acceleration error must stay within 10 percent of the nominal peak. How fast can this cam run? Would another round of compensation fix it? We'll answer at the end."

  - layout: points
    title: ["两类零件：一个最大，一个最讲形状", "Two kinds of part: the largest and the most shape-critical"]
    points:
      - ["机壳：所有轴孔都在它上面，决定相对位置", "Housing: every shaft bore is in it; it fixes all positions"]
      - ["凸轮：廓线就是从动件的运动规律", "Cam: its profile is the follower's motion law"]
      - ["问题一：省掉时效，三个月后跳针", "Problem 1: no ageing, skipped stitches three months later"]
    foot: ["机壳的孔位要在加工时做准，还要在以后几年里保持不变", "A housing's bores must be right when machined, and stay right for years"]
    notes:
      - "机壳是整台机器的骨架，上轴、下轴、针杆、压脚杆、送布轴的孔都开在它上面，孔一加工出来，第 23 讲那条尺寸链的大部分环节就定了。车间里还有另一个问题：某厂为赶交货省掉了时效，机壳加工、装配、试缝都合格，三个月后却陆续跳针，梭尖间隙变了二三十微米。原因就在机壳本身。"
      - "The housing is the machine's skeleton. The bores for the main shaft, the hook shaft, the needle bar, the presser bar and the feed shafts are all machined into it, and once they're machined, most links of the tolerance chain from Lecture 23 are settled. There's a second shop-floor story: to meet a delivery date, a plant skipped ageing. The housings passed machining, assembly and test sewing, yet three months later machines began skipping stitches, with the hook gap shifted by twenty or thirty microns. The cause was the housing itself."

  - layout: section
    num: "01"
    title: ["机壳：材料、铸造与时效", "Housings: material, casting and ageing"]

  - layout: split
    title: ["灰铸铁还是铝压铸", "Grey iron or die-cast aluminium"]
    points:
      - ["灰铸铁：阻尼高，膨胀与钢接近", "Grey iron: well damped, expands like steel"]
      - ["铝压铸：轻、近净形；模具贵，适合大批量", "Aluminium die casting: light, near-net; costly dies, big volumes"]
      - ["铝机壳 Ø20 孔温升 30 K：过盈少 {{ch25.dSt:.1f}} μm", "Aluminium, Ø20 bore, 30 K warmer: {{ch25.dSt:.1f}} μm less interference"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><style>html:not(.en-only) .eo{display:none}</style>
          <g font-size="28" font-weight="800"><text x="300" y="44" fill="#4c8dff" class="zh">灰铸铁</text><text x="300" y="44" fill="#4c8dff" class="eo">Grey iron</text><text x="620" y="44" fill="#ff7a45" class="zh">铝合金</text><text x="620" y="44" fill="#ff7a45" class="eo">Aluminium</text></g>
          <g font-size="26" fill="#d3deea"><text x="20" y="130" class="zh">密度</text><text x="20" y="130" class="eo">Density</text><text x="20" y="300" class="zh">弹性模量</text><text x="20" y="300" class="eo">Modulus</text><text x="20" y="470" class="zh">线膨胀系数</text><text x="20" y="470" class="eo">Expansion</text></g>
          <g fill="#4c8dff"><rect x="220" y="150" width="560" height="34" rx="8"/><rect x="220" y="320" width="560" height="34" rx="8"/><rect x="220" y="490" width="300" height="34" rx="8"/></g>
          <g fill="#ff7a45"><rect x="220" y="194" width="210" height="34" rx="8"/><rect x="220" y="364" width="327" height="34" rx="8"/><rect x="220" y="534" width="610" height="34" rx="8"/></g>
          <g font-size="24" fill="#f3f6fa"><text x="232" y="176">7.2 g/cm³</text><text x="440" y="220">2.7 g/cm³</text><text x="232" y="346">100–140 GPa</text><text x="557" y="390">≈ 70 GPa</text><text x="232" y="516">10–11 ×10⁻⁶/K</text><text x="232" y="560">21–23 ×10⁻⁶/K</text></g>
          <text x="20" y="620" font-size="24" fill="#f2b705" class="zh">钢约 11.5 ×10⁻⁶/K：铸铁和钢一起胀，铝胀得多一倍</text><text x="20" y="620" font-size="24" fill="#f2b705" class="eo">Steel ≈ 11.5 ×10⁻⁶/K: iron grows with it, aluminium twice as much</text>
        </svg>
    notes:
      - "机壳形状复杂、内腔多，毛坯几乎都是铸件。工业平缝机传统上用灰铸铁砂型铸造：片状石墨让它阻尼高，膨胀系数和钢接近。铝合金压铸轻、接近净形，但模具贵，适合大批量。铝的膨胀系数是钢的两倍：温升 30 K，Ø20 的孔胀大 {{ch25.dAl:.1f}} 微米，钢轴套只胀 {{ch25.dSt:.1f}}，过盈少了 {{ch25.dSt:.1f}} 微米。所以铝机壳的轴套配合要按热态校核。"
      - "Housings are complex, with many cavities, so the blanks are nearly always castings. Industrial lockstitch housings have traditionally been sand-cast grey iron: flake graphite gives it high damping, a dull sound, and it expands about as much as steel. Die-cast aluminium is light and near net shape, but the dies are expensive, so it suits domestic machines made by the hundred thousand. Aluminium expands twice as much as steel. Warm the housing by 30 kelvin and a 20 millimetre bore grows {{ch25.dAl:.1f}} microns while the steel bushing grows only {{ch25.dSt:.1f}}: the interference drops by {{ch25.dSt:.1f}} microns. So bushing fits in aluminium housings must be checked hot."

  - layout: points
    title: ["铸件结构与铸造缺陷", "Casting design and casting defects"]
    points:
      - ["好铸、好加工、不变形：壁厚均匀、圆角、拔模斜度", "Easy to cast and machine, and stable: even walls, fillets, draft"]
      - ["灰铸铁：石墨膨胀抵消部分收缩，适合薄壁", "Sand-cast iron: graphite growth offsets shrinkage; good for thin walls"]
      - ["压铸：皮下卷气，加工后露出会渗油", "Die casting: trapped gas under the skin can leak oil once machined"]
    foot: ["内部缺陷靠 X 射线抽检；油池、油路在加工后做渗漏试验", "X-ray samples for internal defects; leak-test the oil sump after machining"]
    notes:
      - "好的铸件结构“好铸、好加工、不变形”：壁厚尽量均匀，厚处冷得慢、得不到补缩就出缩孔；转角做圆角，防止开裂；竖壁有拔模斜度；机臂靠加强筋；还要留清砂的工艺孔和第一道工序用的粗基准。压铸的问题是几十毫秒高速充型时卷入气体，气孔藏在表皮下，加工后露出来，靠近油池就渗油。所以渗漏试验放在加工以后做。"
      - "A good casting design is easy to cast, easy to machine and stays put. Keep walls even: a thick spot cools last and, without feeding, leaves a shrinkage cavity. Round every corner against cracking, give vertical walls draft, stiffen the arm with ribs, and leave core-clearing holes and a sound rough datum for the first operation. The weak point of die casting is gas trapped during a fill of a few tens of milliseconds. The pores hide under the skin, machining opens them, and near the oil sump they leak. That's why the leak test comes after machining."

  - layout: split
    title: ["时效为什么不能省", "Why ageing can't be skipped"]
    points:
      - ["冷却先后不同，留下相互平衡的残余应力", "Uneven cooling leaves balanced residual stresses"]
      - ["加工或慢慢松弛打破平衡，机臂弯曲", "Machining or slow relaxation upsets them; the arm bends"]
      - ["人工时效：缓慢加热、保温、随炉缓冷", "Stress-relief ageing: heat slowly, soak, cool in the furnace"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><style>html:not(.en-only) .eo{display:none}</style>
          <rect x="110" y="40" width="760" height="495" fill="#2ec4b6" opacity=".08"/>
          <path d="M110 40 L870 40" stroke="#f2b705" stroke-width="3" stroke-dasharray="12 8"/>
          <text x="124" y="80" font-size="24" fill="#f2b705" class="zh">梭尖间隙允许偏离 ±30 μm</text><text x="124" y="80" font-size="24" fill="#f2b705" class="eo">Hook-gap window ±30 μm</text>
          <path d="M110 535 L870 535 M110 535 L110 30" stroke="#8fa3ba" stroke-width="3"/>
          <path d="M110 535 C160 330 230 160 350 128 C480 108 650 104 870 104" fill="none" stroke="#ff7a45" stroke-width="7"/>
          <path d="M110 535 C160 480 230 450 350 433 C480 426 650 425 870 425" fill="none" stroke="#2ec4b6" stroke-width="7"/>
          <g font-size="30" font-weight="800"><text x="620" y="160" fill="#ff7a45">≈ {{ch25.d40y:.0f}} μm</text><text x="620" y="478" fill="#2ec4b6">≈ {{ch25.d10y:.0f}} μm</text></g>
          <g font-size="24"><text x="620" y="196" fill="#ff7a45" class="zh">不时效（40 MPa）</text><text x="620" y="196" fill="#ff7a45" class="eo">Not aged (40 MPa)</text><text x="620" y="514" fill="#2ec4b6" class="zh">时效后（10 MPa）</text><text x="620" y="514" fill="#2ec4b6" class="eo">Aged (10 MPa)</text></g>
          <g font-size="24" fill="#8fa3ba"><text x="100" y="572">0</text><text x="455" y="572" class="zh">加工后 12 个月</text><text x="455" y="572" class="eo">12 months</text><text x="810" y="572" class="zh">24</text><text x="830" y="572" class="eo">24</text></g>
          <text x="110" y="620" font-size="24" fill="#8fa3ba" class="zh">针杆孔前后漂移（算例，示意值）</text><text x="110" y="620" font-size="24" fill="#8fa3ba" class="eo">Needle-bar bore drift (worked example, illustrative)</text>
        </svg>
    notes:
      - "铸件冷却时，薄壁和表层先冷、先收缩，厚处和内部后收缩，被先凝固的部分拉住，冷到室温就留下相互平衡的残余应力。加工去掉材料，或应力自己慢慢松弛，平衡被打破，铸件就变形。后一种要几周到几个月才显现：出厂时合格，在用户手里变形，装配调整吸收不了。时效就是在加工以前把应力降下来，常见做法是缓慢加热、保温几小时、随炉缓冷；重要机壳铸造后、粗加工后各做一次。"
      - "As a casting cools, thin walls and the skin cool and shrink first; thick sections and the core shrink later and are held back by what has already set, so at room temperature balanced residual stresses remain. Remove material by machining, or let the stresses slowly relax, and the balance breaks: the casting distorts. The slow kind takes weeks to months. The housing passes at the factory and distorts in the customer's hands, where no assembly adjustment can absorb it. Ageing lowers the stresses before machining: heat slowly, soak for a few hours, cool in the furnace. Important housings get it twice, after casting and again after rough machining."

  - layout: split
    title: ["算例：针杆孔会漂多少", "Worked example: how far the bore moves"]
    points:
      - ["机臂看成箱形悬臂梁：L = 250 mm，E = 120 GPa", "The arm as a box cantilever: L = 250 mm, E = 120 GPa"]
      - ["40 MPa 全部释放：漂移约 {{ch25.d40:.0f}} μm", "40 MPa in the front skin, fully released: about {{ch25.d40:.0f}} μm"]
      - ["漂移与不平衡应力成正比：时效把它降下来", "Drift is proportional to the unbalanced stress: ageing lowers it"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><style>html:not(.en-only) .eo{display:none}</style>
          <rect x="40" y="80" width="70" height="360" rx="6" fill="#4b5f7d"/>
          <rect x="110" y="140" width="640" height="110" rx="8" fill="#22324d" stroke="#8fa3ba" stroke-width="4"/>
          <rect x="110" y="236" width="640" height="14" fill="#ff7a45"/>
          <path d="M110 140 Q450 120 750 96" fill="none" stroke="#f2b705" stroke-width="4" stroke-dasharray="12 8"/>
          <path d="M790 150 L790 98" stroke="#f2b705" stroke-width="4"/><path d="M780 112 L790 96 L800 112" fill="none" stroke="#f2b705" stroke-width="4"/>
          <text x="806" y="140" font-size="34" font-weight="800" fill="#f2b705">δ</text>
          <text x="300" y="295" font-size="24" fill="#ff7a45" class="zh">前壁 2 mm 表层：不平衡应力 σ</text><text x="300" y="295" font-size="24" fill="#ff7a45" class="eo">2 mm front skin: unbalanced stress σ</text>
          <text x="430" y="205" font-size="26" fill="#d3deea">L = 250 mm</text>
          <g font-size="30" fill="#f3f6fa" font-weight="700"><text x="60" y="390">F = σ t h</text><text x="300" y="390">M = F (B − t)/2</text><text x="60" y="460">κ = M / EI</text><text x="300" y="460">δ = κ L² / 2</text></g>
          <g font-size="28" font-weight="800"><text x="60" y="540" fill="#ff7a45">40 MPa → {{ch25.d40:.0f}} μm</text><text x="60" y="590" fill="#2ec4b6">10 MPa → {{ch25.d10:.0f}} μm</text></g>
          <text x="500" y="560" font-size="24" fill="#8fa3ba" class="zh">截面 60 × 70 mm，壁厚 7 mm</text><text x="500" y="560" font-size="24" fill="#8fa3ba" class="eo">Section 60 × 70 mm, 7 mm walls</text>
        </svg>
    notes:
      - "铸件里有残余应力，加工后慢慢松弛，机臂就会弯，针杆孔跟着漂。能漂多少，可以估个量级。把机臂看成从立柱伸出的箱形悬臂梁，长 250 毫米。设前壁 2 毫米的表层里有不平衡残余应力，后壁没有：合力乘力臂是弯矩，除以 EI 是曲率，再乘 L 方除以 2，就是针杆孔的移动。40 兆帕全部释放约 {{ch25.d40:.0f}} 微米；假设常温下最终释放一半、时间常数三个月，一年后约 {{ch25.d40y:.0f}} 微米；时效到 10 兆帕，只有约 {{ch25.d10y:.0f}} 微米。而梭尖间隙只允许偏 ±30 微米。"
      - "We can estimate the size of it. Treat the arm as a box cantilever from the pillar: 250 millimetres long, a 60 by 70 section, 7 millimetre walls. Suppose the front wall's 2 millimetre skin carries an unbalanced residual stress sigma that the back wall doesn't. Its resultant times the lever arm is a moment; the moment over EI is a curvature; curvature times L squared over two is how far the needle-bar bore at the tip moves. Release all of 40 megapascals and that's about {{ch25.d40:.0f}} microns. At room temperature, assume half is released with a three-month time constant: about {{ch25.d40y:.0f}} microns after a year. Aged down to 10 megapascals, only about {{ch25.d10y:.0f}}. The hook gap allows just plus or minus 30."

