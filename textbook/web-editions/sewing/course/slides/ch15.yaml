    notes:
      - "这一讲记住三件事。第一，花样机用 X–Y 工作台代替送布牙，主轴编码器的角度是全机的时间基准。第二，机针在布中模板不能动：转速上限等于窗口除以 6 倍移动时间，和根号针距成反比，布越厚越低。第三，电子凸轮按主轴角度走，前瞻调速提前为慢针减速。作业、测验和两个实验的报告在问渠平台完成。"
      - "Three things to remember. One: a pattern sewer replaces the feed dog with an X–Y table, and the shaft-encoder angle is the machine's clock. Two: the template must be still while the needle is in the fabric; the speed limit is the window over six times the move time, inversely proportional to root stitch length, and lower for thicker stock. Three: electronic cams run by shaft angle, and look-ahead slows down early for slow stitches. The assignment, quiz and both lab reports are on WenQuest."
