code: [ch15]
lab: {no: "15-1", id: pattern, title: ["虚拟实验 15-1 花样机仿真", "Virtual lab 15-1 Pattern-sewer simulation"]}

clips:
  hero:          # 封面：花样机三维模型，主轴转、模板走（关掉标注）；镜头拉远、模型挪到右边，不压封面标题和副标题
