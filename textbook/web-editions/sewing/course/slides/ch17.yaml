          </g>
          <g stroke="#6f84a3" stroke-width="5" marker-end="url(#m17a)"><path d="M450 184 L450 272"/><path d="M180 424 L180 492"/><path d="M450 424 L450 492"/><path d="M720 424 L720 492"/></g>
          <text x="470" y="238" font-size="24" fill="#2ec4b6" class="zh">电源 + 总线（走拖链）</text><text x="470" y="238" font-size="24" fill="#2ec4b6" class="eo">power + bus (cable chain)</text>
        </svg>
    notes:
      - "控制分成两级，两级的时间尺度差得很远。主控制器按行工作：解析花型程序，在每次换向之前把下一行的方向、速度、选针数据、度目、纱嘴、摇床和牵拉都准备好，一行要织几百毫秒，时间很宽裕。机头控制板按针工作：FPGA 根据机头位置逐针触发选针器，每个针位只有一两毫秒。机头板装在机头上，几十路线圈就近接，只让电源和一条总线穿过拖链。代价是要经受振动和加速度，常见故障是插头松动和拖链电缆断芯。"
      - "Control is split into two levels with very different time scales. The main controller works per course: it parses the knitting program and, before each reversal, prepares the next course's direction, speed, selection data, stitch setting, yarn carriers, racking and take-down. A course takes hundreds of milliseconds, plenty of time. The carriage board works per needle: its FPGA fires the selectors by carriage position, with only a millisecond or two per needle. The board rides on the carriage so dozens of coils wire up locally and only power and one bus go through the cable chain. The price is vibration and acceleration; typical faults are loose connectors and broken cores in the chain cable."

  - layout: figure
    title: ["FPGA 选针通道：三种提前量的误差", "FPGA selection channel: error under three leads"]
    h: 560
    visual: {video: fpga}
    caption: ["fire ⇔ pos + T_D / period ≥ target；依次运行：不补偿 → 固定 → 按实时速度", "fire ⇔ pos + T_D / period ≥ target; runs: none → fixed → real-time"]
    notes:
      - "把机头板的 FPGA 打开看。一条选针通道六个模块：正交解码、位置计数、测速、提前量、比较、脉冲发生。测速不算米每秒，而是数相邻两个计数之间隔了多少个时钟，叫 period；提前量就是 T_D 除以 period；比较器在 pos 加提前量大于等于目标位置时发 fire。图上是 12 枚针的位置误差，依次运行不补偿、固定、按实时速度三种设置，看误差柱怎样变化，绿色带是允许的正负 0.25 个针距。"
      - "Let's open the carriage board's FPGA. One selection channel has six blocks: quadrature decoding, position counting, speed measurement, lead, comparison and pulse generation. Speed isn't computed in metres per second; the FPGA counts how many clock ticks pass between two encoder counts, the period, and the lead is T_D over period. The comparator fires when pos plus lead reaches the target. The chart shows the position error for 12 needles as the channel runs with no lead, a fixed lead and a real-time lead in turn. Watch the bars; the green band is plus or minus a quarter pitch."

  - layout: lab
    title: ["动手试一试：选针 FPGA", "Try it: the selection FPGA"]
    shot: {page: fpga}
    tasks:
      - ["图形化搭建：三种提前量各运行一次", "Block mode: run each of the three leads"]
      - ["看误差柱和线圈功率，选出能用的组合", "Read errors and coil power; pick a working set-up"]
      - ["Verilog 关卡：补全解码器和比较器", "Verilog levels: complete the decoder and comparator"]
    notes:
      - "选针 FPGA 实验分两部分。A 部分图形化搭建：点上方的模块看原理、改设置，比如提前量、编码器倍频、测速方式、线圈驱动，运行仿真，看 12 枚针是否全部选对、最大误差多少、线圈功率是否超标。B 部分用 Verilog 自己写：按关卡补全正交解码、位置比较和提前量，编译后看波形。结果填进实验报告。"
      - "The FPGA lab has two parts. Part A is block building: click the blocks to read how they work and change settings such as the lead, encoder multiplication, speed estimate and coil drive, then run the simulation and check that all 12 needles are selected, the maximum error, and whether coil power is within limits. Part B is writing Verilog yourself: complete the quadrature decoder, the position comparator and the lead, level by level, then compile and read the waveforms. Record the results in your report."

  - layout: section
    num: "04"
    title: ["花型、线圈长度与全成型", "Patterns, loop length and whole garments"]

  - layout: chain
    title: ["从款式到上机：三层转换", "From design to machine: three translations"]
    steps: [["款式", "design"], ["工艺单", "spec sheet"], ["意匠图", "pattern grid"], ["横列程序", "course program"], ["上机", "knit"]]
    hot: [3]
    mark: ["编译器", "compiler"]
    foot: ["50 cm × 5.5 针/cm = {{ch17.needles:.0f}} 针；60 cm × 7 行/cm = {{ch17.courses:.0f}} 行（示例）。一个意匠行可拆成几个横列", "50 cm × 5.5/cm = {{ch17.needles:.0f}} needles; 60 cm × 7/cm = {{ch17.courses:.0f}} rows. One grid row may become several courses"]
    notes:
      - "一件毛衣从设计稿到上机要经过三层转换。第一步从款式到工艺单：横密、纵密先用小样片实测，前片宽 50 厘米、横密每厘米 5.5 针，就是 {{ch17.needles:.0f}} 针；衣长 60 厘米、纵密每厘米 7 行，就是 {{ch17.courses:.0f}} 行。第二步画意匠图，一格就是一枚针在一行里干什么。第三步编译成横列程序，每个横列是机头走一趟，两色提花的一个意匠行要拆成两个横列。编译器还要排纱嘴顺序、插翻针和摇床。"
      - "A sweater goes through three translations on its way to the machine. First, design to spec sheet: measure the stitch and row density on a swatch; a 50-centimetre front at 5.5 stitches per centimetre is {{ch17.needles:.0f}} needles, a 60-centimetre length at 7 rows per centimetre is {{ch17.courses:.0f}} rows. Second, the pattern grid: one cell is what one needle does in one row. Third, compile into a course program, one course per carriage pass; a two-colour jacquard row becomes two courses. The compiler also orders the yarn carriers and inserts transfers and racking."

  - layout: bignum
    title: ["线圈长度闭环：测用纱，修度目", "Loop-length loop: measure yarn, adjust stitch depth"]
    nums:
      - {n: "+{{ch17.cl_dl:.3f}} mm", n_en: "Δl per loop", label: ["偏长 {{ch17.cl_dev_pct:.1f}}%（实测 1400 mm / 275 针）", "{{ch17.cl_dev_pct:.1f}}% long (1400 mm / 275 needles)"]}
      - {n: "{{ch17.cl_dd:.3f}} mm", n_en: "Δd, k = 0.5", label: ["度目修正", "Stitch-depth correction"]}
      - {n: "{{ch17.cl_steps:.0f}}", n_en: "steps", label: ["度目步进电机，每步 0.01 mm", "Stitch-cam stepper, 0.01 mm per step"]}
    foot: ["Δd = −k·Δl / (∂l/∂d)：线圈两条腰，弯纱深 1 mm 线圈约长 2 mm；k 取小于 1，防止来回振荡", "Δd = −k·Δl / (∂l/∂d): two legs, so 1 mm deeper ≈ 2 mm longer loop; k < 1 avoids oscillation"]
    notes:
      - "度目只是开环设定。同一个度目值，纱线张力、摩擦、湿度、三角磨损一变，线圈长度就偏了，前后片对不齐。办法是在送纱路上装一个带编码器的测长轮，测出每个横列实际用纱 L_m，算出每个线圈的偏差。算例：275 针、目标 5 毫米，实测 1400 毫米，偏长 {{ch17.cl_dev_pct:.1f}}%，每圈多 {{ch17.cl_dl:.3f}} 毫米。线圈有两条腰，弯纱每深 1 毫米线圈长约 2 毫米；增益取 0.5，度目浅 {{ch17.cl_dd:.3f}} 毫米，步进电机退 2 步。"
      - "The stitch setting is only open-loop. With the same setting, changes in yarn tension, friction, humidity or cam wear shift the loop length, and front and back panels won't match. The fix is a measuring wheel with an encoder in the yarn path that measures the yarn L_m used in each course, giving the error per loop. Example: 275 needles, target 5 millimetres, measured 1400 millimetres: {{ch17.cl_dev_pct:.1f}} percent long, {{ch17.cl_dl:.3f}} millimetres per loop. A loop has two legs, so 1 millimetre deeper means about 2 millimetres longer; with a gain of 0.5 the depth comes up {{ch17.cl_dd:.3f}} millimetres, two steps of the stepper."

  - layout: points
    title: ["全成型：下机就是一件衣服", "Whole garment: off the machine, a finished sweater"]
    points:
      - ["传统：先织衣片，再人工套口缝合", "Traditional: knit panels, then link them by hand"]
      - ["前床织前身、后床织后身，两端相连成筒", "Front bed knits the front, back bed the back, joined into a tube"]
      - ["双针床只能隔针织；省套口，但翻针多、难编程", "Two beds knit every other needle; saves linking, costs transfers"]
    notes:
      - "传统毛衣是先织出前片、后片、两只袖片，再用套口机一针一针对着套起来，是毛衫厂最费人力的工序之一。全成型编织下机就是一件成品：前床织前身、后床织后身，两边在针床两端连上成一个筒，两只袖子各成一个筒，织到袖窿时用翻针和摇床合并。难点在于线圈要翻到对面，对面必须有空针接，双针床只好隔针编织。省了套口和裁剪损耗，但是否合算要算账。"
      - "A traditional sweater is knitted as front, back and two sleeves, then linked stitch by stitch on a linking machine, and matching every stitch by hand makes linking one of the most labour-hungry jobs in a knitwear plant. Whole-garment knitting comes off the machine finished: the front bed knits the front body, the back bed the back, joined at both ends into a tube, with each sleeve its own tube, merged at the armholes by transfers and racking. The catch is that a transferred loop needs an empty needle opposite, so an ordinary two-bed machine knits on alternate needles, effectively halving the gauge. It saves linking and cutting waste, but whether it pays has to be worked out."

  - layout: section
    num: "05"
    title: ["算例：一片前片要织多久", "Worked example: time per front panel"]

  - layout: bignum
    title: ["现在：每趟 {{ch17.base_t:.2f}} s，一片 {{ch17.base_min:.1f}} min", "Now: {{ch17.base_t:.2f}} s per pass, {{ch17.base_min:.1f}} min per panel"]
    nums:
      - {n: "{{ch17.tn_E12_1_2:.2f}} ms", n_en: "> T_c 1.2 ms", label: ["每针时间：选针器跟得上", "Time per needle: the selector keeps up"]}
      - {n: "{{ch17.base_D:.0f}} mm", n_en: "D per pass", label: ["{{ch17.w:.0f}} + 150 + 2 × {{ch17.c_base:.0f}}", "{{ch17.w:.0f}} + 150 + 2 × {{ch17.c_base:.0f}}"]}
      - {n: "760", n_en: "passes", label: ["每片趟数", "Passes per panel"]}
    foot: ["t = D/v + v/a + 停顿 = {{ch17.Dv:.2f}} + {{ch17.acc_s:.2f}} + 0.05 ≈ {{ch17.base_t:.2f}} s", "t = D/v + v/a + dwell = {{ch17.Dv:.2f}} + {{ch17.acc_s:.2f}} + 0.05 ≈ {{ch17.base_t:.2f}} s"]
    notes:
      - "把前面的内容串起来回答开头的问题。第一步，选针器跟得上吗？每针 {{ch17.tn_E12_1_2:.2f}} 毫秒，大于选针器一次吸合—释放的周期 T_c，1.2 毫秒，可以。第二步，固定提前量要求在第一枚针前达到全速，余量至少 v 方除以 2a，{{ch17.c_base:.0f}} 毫米，一趟行程是织物宽 {{ch17.w:.0f}}、三角座选针点跨度 150，再加两个 {{ch17.c_base:.0f}}，共 {{ch17.base_D:.0f}} 毫米。用时等于 D 除以 v，加 v 除以 a，再加换向停顿 0.05 秒，约 {{ch17.base_t:.2f}} 秒，760 趟就是 {{ch17.base_min:.1f}} 分钟。"
      - "Now tie it together to answer the opening question. Step one: can the selector keep up? Each needle gets {{ch17.tn_E12_1_2:.2f}} milliseconds, more than the selector's 1.2-millisecond engage–release cycle T_c, so yes. Step two: a fixed lead needs full speed before the first needle, so the margin is at least v squared over 2a, {{ch17.c_base:.0f}} millimetres, and one pass is the {{ch17.w:.0f}}-millimetre fabric, plus the 150-millimetre span of the cam plate, plus two {{ch17.c_base:.0f}}s: {{ch17.base_D:.0f}} millimetres. Time is D over v, plus v over a, plus a 0.05-second dwell at reversal: about {{ch17.base_t:.2f}} seconds, so 760 passes take {{ch17.base_min:.1f}} minutes."

  - layout: bignum
    title: ["三个方案：一片各要多久", "Three options: minutes per panel"]
    nums:
      - {n: "{{ch17.A_min:.1f}}", n_en: "A · real-time lead", label: ["A 实时补偿，余量 20 mm", "A: real-time lead, 20 mm margin"]}
      - {n: "{{ch17.B_min:.1f}}", n_en: "B · two systems", label: ["B 两系统，760 → 460 趟", "B: two systems, 760 → 460 passes"]}
      - {n: "{{ch17.C_min:.1f}}", n_en: "C · 1.6 m/s", label: ["C 提速到 1.6 m/s", "C: carriage at 1.6 m/s"]}
    foot: ["提速 {{ch17.speedup_pct:.0f}}% 只快约 {{ch17.C_gain_pct:.0f}}%：v/a 和 v²/2a 都随 v 增大，t_n 也降到 {{ch17.tn_E12_1_6:.2f}} ms", "33% more speed, only {{ch17.C_gain_pct:.0f}}% faster: v/a and v²/2a grow with v, and t_n falls to {{ch17.tn_E12_1_6:.2f}} ms"]
    notes:
      - "比较三个方案。A，按实时速度补偿，不必在第一枚针前达到全速，余量减到 20 毫米，一片 {{ch17.A_min:.1f}} 分钟。B，换两系统机头，跨度变成 300 毫米，一趟慢一点，但两色同一趟织，趟数降到 460，一片 {{ch17.B_min:.1f}} 分钟。C，提速到 1.6 米每秒，余量增到 {{ch17.C_c:.0f}} 毫米，一片 {{ch17.C_min:.1f}} 分钟。为什么提速三成多只快约 {{ch17.C_gain_pct:.0f}}%？v 除以 a 和 v 方除以 2a 都随 v 变大，每针时间也降到 {{ch17.tn_E12_1_6:.2f}} 毫秒，逼近选针器周期。"
      - "Compare the options. A: with a real-time lead the carriage needn't be at full speed before the first needle, the margin drops to 20 millimetres, and a panel takes {{ch17.A_min:.1f}} minutes. B: a two-system carriage spans 300 millimetres, so each pass is a little slower, but both colours go in one pass, 460 passes instead of 760, and a panel takes {{ch17.B_min:.1f}} minutes. C: 1.6 metres per second needs a {{ch17.C_c:.0f}}-millimetre margin and gives {{ch17.C_min:.1f}} minutes. Why is a third more speed only about {{ch17.C_gain_pct:.0f}} percent faster? Both v over a and v squared over 2a grow with v, and the time per needle drops to {{ch17.tn_E12_1_6:.2f}} milliseconds, close to the selector cycle."

  - layout: split
    title: ["机器人联系：按编码器位置触发相机和喷头", "Robot link: trigger by conveyor position"]
    points:
      - ["零件走到视场中心才拍照：按位置，不按时钟", "Shoot when the part reaches the centre: by position"]
      - ["运动卡的“位置比较输出”：硬件逐计数比较", "Position-compare output: hardware checks every count"]
      - ["相机、阀也有延迟：按实时速度提前 v·T_d", "Cameras and valves lag too: lead by v·T_d"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640"><style>html:not(.en-only) .eo{display:none}</style>
          <rect x="30" y="420" width="840" height="60" rx="30" fill="#1b2a44" stroke="#4b5f7d" stroke-width="3"/>
          <circle cx="60" cy="450" r="22" fill="#4b5f7d"/><circle cx="840" cy="450" r="22" fill="#4b5f7d"/>
          <rect x="15" y="500" width="90" height="60" rx="10" fill="#111d31" stroke="#2ec4b6" stroke-width="3"/>
          <text x="60" y="540" font-size="22" fill="#5ee0d2" text-anchor="middle" class="zh">编码器</text><text x="60" y="540" font-size="19" fill="#5ee0d2" text-anchor="middle" class="eo">encoder</text>
          <rect x="220" y="370" width="90" height="50" rx="6" fill="#4c8dff" opacity=".4"/>
          <rect x="400" y="370" width="90" height="50" rx="6" fill="#4c8dff"/>
          <path d="M445 360 L445 230" stroke="#f2b705" stroke-width="3" stroke-dasharray="8 6"/>
          <rect x="395" y="150" width="100" height="80" rx="12" fill="#111d31" stroke="#f2b705" stroke-width="3"/>
          <circle cx="445" cy="190" r="22" fill="none" stroke="#f2b705" stroke-width="5"/>
          <text x="445" y="130" font-size="26" font-weight="700" fill="#f2b705" text-anchor="middle" class="zh">相机：到点就拍</text><text x="445" y="130" font-size="26" font-weight="700" fill="#f2b705" text-anchor="middle" class="eo">camera: by position</text>
          <path d="M680 160 L680 340" stroke="#c8d2de" stroke-width="16"/><path d="M670 340 L690 340 L680 370z" fill="#ff7a45"/>
          <text x="680" y="130" font-size="26" font-weight="700" fill="#ff9c75" text-anchor="middle" class="zh">点胶阀</text><text x="680" y="130" font-size="26" font-weight="700" fill="#ff9c75" text-anchor="middle" class="eo">dispenser</text>
          <path d="M520 470 L640 470" stroke="#f3f6fa" stroke-width="5"/><path d="M650 470 l-16 -11 l0 22z" fill="#f3f6fa"/>
          <text x="450" y="600" font-size="26" fill="#d3deea" text-anchor="middle">x_cmd = xᵢ − c − v·T_d</text>
        </svg>
    notes:
      - "机器人分拣线上，传送带电机的编码器给出带面位置，相机要在零件走到视场中心时拍照，点胶机器人要在零件到达设定点时打开胶阀。这和横机选针是同一个问题：时机由位置决定，不由时钟决定。工程做法也一样：把目标位置装进运动控制卡或 FPGA 的位置比较输出，硬件每收到一个编码器计数就比较一次，到点就输出触发脉冲。相机、电磁阀也有延迟，带速变化时同样要按实时速度提前。"
      - "On a robot sorting line, the conveyor motor's encoder gives belt position; the camera must fire when a part reaches the centre of view, and the dispensing robot must open its valve when the part reaches a set point. It's the same problem as needle selection: timing by position, not by the clock. The engineering is the same too: load the target positions into the position-compare output of a motion card or FPGA, which checks every encoder count in hardware and fires a trigger when it arrives. Cameras and valves have delays as well, so when belt speed varies they too must lead by the real-time speed."

  - layout: split
    title: ["生活中的例子：喷墨打印机", "Everyday example: the inkjet printer"]
    points:
      - ["打印头来回扫过纸面，每趟打一行", "The print head sweeps across, one band per pass"]
      - ["每个喷孔走到位置才决定喷不喷", "Each nozzle decides to fire when it reaches its spot"]
      - ["位置由光栅码带测出，加速时字也不歪", "An encoder strip gives position, so text stays straight"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640"><style>html:not(.en-only) .eo{display:none}</style>
          <rect x="140" y="230" width="620" height="380" rx="6" fill="#e9e4d8"/>
