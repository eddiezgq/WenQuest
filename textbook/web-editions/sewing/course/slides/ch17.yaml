# 第 17 讲 电脑横机（毛衣编织机）控制 · 课件（第 24 轮新版式）
# 每页一个意思、最多 3 条；中文在上、英文一行在下。版式见 course/tools/build_slides.py 的 LAYOUTS。
# {{ch17.键:格式}} 由课程包程序 course/calc/ch17.py 算出，不手写数字。
# notes：讲者备注（放映时只给老师看，录课时当讲稿用）。
# 二维实验页（knit、fpga）切成深色主题（data-theme=dark），三维样机换深色底，和课件底色一致。
lesson: 17
code: [ch17]
lab: {no: "17-1", id: knit, title: ["虚拟实验 17-1 横机编织仿真", "Virtual lab 17-1 Flat knitting simulation"]}

clips:
  hero:          # 封面：横机三维样机，机头往复（深色底，关掉标注）；镜头拉远、模型挪到右边，不压封面标题和副标题
    page: model-flatknit
    selector: "#stage"
    steps:
      - {at: 0, press: "#play", js: "document.querySelector('.stage').style.background='radial-gradient(120% 90% at 60% 35%,#22324d 0%,#0b1220 75%)';window.__set({labels:false,cam:[-0.65,0.42,2900],target:[-520,40,220]})"}
  beds:          # 透视：两块针床、机头、纱嘴，带标注
    page: model-flatknit
    selector: "#stage"
    steps:
      - {at: 0, press: ["[data-m=xray]", "#play"]}
  needles:       # 针组特写：机头经过，针一枚枚升起
    page: model-flatknit
    selector: "#stage"
    steps:
      - {at: 0, press: ["[data-v=close]", "#play"]}
  nocomp:        # 横机仿真：不补偿，红点是选错位置的针（一直往复编织）
    page: knit
    selector: "section:has(#bed)"
    loop: 4
    steps:
      - {at: 0, js: "document.documentElement.setAttribute('data-theme','dark');var b=document.querySelector('[data-comp=none]');if(b.getAttribute('aria-pressed')!=='true')b.click();var p=document.getElementById('play');if(/开始编织|Start knitting/.test(p.textContent))p.click()", press: "[data-slow='5']"}
  rtcomp:        # 同上，按实时速度补偿
    page: knit
    selector: "section:has(#bed)"
    loop: 4
    steps:
      - {at: 0, js: "document.documentElement.setAttribute('data-theme','dark');var b=document.querySelector('[data-comp=rt]');if(b.getAttribute('aria-pressed')!=='true')b.click();var p=document.getElementById('play');if(/开始编织|Start knitting/.test(p.textContent))p.click()", press: "[data-slow='5']"}
  fpga:          # 选针 FPGA：不补偿 → 固定 → 按实时速度，各跑一遍仿真，看误差柱
    page: fpga
    selector: "#err"
    loop: 9
    steps:
      - {at: 0, js: "document.documentElement.setAttribute('data-theme','dark');var t=document.getElementById('err').parentElement;for(var e=t;e&&e!==document.body;e=e.parentElement){[].forEach.call(e.parentElement.children,function(c){if(c!==e)c.style.visibility='hidden'})}"}
      - {at: 0.1, set: {c-cp: none}}
      - {at: 0.3, press: "#runA"}
      - {at: 3, set: {c-cp: fixed}}
      - {at: 3.2, press: "#runA"}
      - {at: 6, set: {c-cp: rt}}
      - {at: 6.2, press: "#runA"}

slides:
  - layout: cover
    video: hero
    kicker: ["第 17 讲", "Lecture 17"]
    title: ["电脑横机控制", "Control of Computerised Flat Knitting Machines"]
    sub: ["几百枚针，每行几百个决定", "Hundreds of needles, hundreds of decisions per course"]
    notes:
      - "同学们好。前面讲的缝纫机，都是一根针在同一个地方上下运动、布在走。今天换个角度：电脑横机，也就是毛衣编织机。它的布和针床不动，机头在动，针床上躺着几百枚针，机头每扫一趟，每枚针都要自己决定这一趟干什么。一件毛衣几百行，每行几百个决定。今天会看到，电控真正难的只有一件事：在对的位置作出对的决定。"
      - "Welcome back. On every sewing machine so far, one needle moves up and down in one place while the fabric travels. Today, a different angle: the computerised flat knitting machine, the sweater knitter. Here the fabric and needle beds stay put and the carriage moves. Hundreds of needles lie in the beds, and every time the carriage sweeps across, each needle decides what to do on that pass. Hundreds of courses, hundreds of decisions each. We'll see that the electronics really has only one hard job: make the right decision at the right position."

  - layout: question
    tag: ["车间问题", "Shop-floor problem"]
    title: ["一片前片要织多久？提速值不值？", "How long per front panel? Is more speed worth it?"]
    facts:
      - ["E12 单系统横机，275 针，760 个横列", "E12 single-system machine, 275 needles, 760 courses"]
      - ["机头 1.2 m/s、加速度 10 m/s²，固定提前量", "Carriage 1.2 m/s, 10 m/s², fixed selection lead"]
      - ["方案：实时补偿 / 两系统机头 / 提速到 1.6 m/s", "Options: real-time lead / two systems / 1.6 m/s"]
    notes:
      - "先看车间问题。毛衫车间在一台 E12 单系统电脑横机上织提花毛衣前片：275 针，一共 760 个横列。机头最高 1.2 米每秒，加速度 10，控制器用固定提前量。设备科提了三个方案：A，改成按实时速度补偿，缩短换向余量；B，换两系统机头，两色在同一趟里织；C，把机头速度提到 1.6 米每秒。现在织一片要多久？哪个方案最值得做？这节课最后回答。"
      - "Here's the problem. A knitwear floor is making jacquard sweater fronts on an E12 single-system flat knitting machine: 275 needles, 760 courses in all. The carriage tops out at 1.2 metres per second with 10 metres per second squared, and the controller uses a fixed selection lead. Engineering has three proposals. A: compensate by real-time speed and shorten the reversal margin. B: a two-system carriage that knits both colours in one pass. C: raise carriage speed to 1.6 metres per second. How long does a panel take now, and which option is worth it? We'll answer at the end."

  - layout: section
    num: "01"
    title: ["针床、舌针与三角", "Needle beds, latch needles and cams"]

  - layout: split
    title: ["两块针床，机头骑在上面往复", "Two needle beds and a carriage riding over them"]
    points:
      - ["前后针床成倒 V 形，线圈在齿口形成", "Front and back beds form an inverted V; loops form at the gap"]
      - ["机头的三角推针踵，纱嘴随机头送纱", "Carriage cams push the butts; yarn carriers feed yarn"]
      - ["机号 E = 每英寸针数，针距 p = 25.4/E", "Gauge E = needles per inch, pitch p = 25.4/E"]
    visual: {video: beds}
    notes:
      - "先看结构。横机有前后两块针床，截面是倒 V 形，夹角大约 100 度。每块床上铣了几百条针槽，每条槽里躺一枚舌针。两块床顶上的缝叫齿口，线圈就在这里形成，织好的布从齿口垂下去，被牵拉罗拉往下拉。机头骑在两块床上来回走，它的三角推着针升降，纱嘴跟着机头把纱送进针钩。针有多密，用机号 E 表示，就是每英寸多少枚针，针距 p 就是 25.4 毫米除以 E。"
      - "First the structure. A flat machine has a front and a back needle bed forming an inverted V, about 100 degrees apart. Each bed has hundreds of slots with a latch needle in each. The gap at the top is the trick plate gap where loops form, and the knitted fabric hangs down from it, pulled by take-down rollers. The carriage rides over both beds; its cams push the needles up and down, and the yarn carriers travel with it, laying yarn into the hooks. How dense the needles are is the gauge E, needles per inch, and the pitch p is 25.4 millimetres over E."

  - layout: bignum
    title: ["针距 p = 25.4 / E", "Pitch p = 25.4 / E"]
    nums:
      - {n: "{{ch17.p_E12:.2f}} mm", n_en: "E12", label: ["E12 横机的针距", "Pitch of an E12 machine"]}
      - {n: "{{ch17.p_E7:.2f}} mm", n_en: "E7", label: ["E7 横机的针距", "Pitch of an E7 machine"]}
      - {n: "{{ch17.needles:.0f}}", n_en: "needles", label: ["50 cm 宽前片的针数", "Needles across a 50 cm front"]}
    foot: ["记住这个 p：一会儿它就变成选针控制最关键的数字", "Remember p: it becomes the key number for needle selection"]
    notes:
      - "针距 p 等于 25.4 除以机号。E12 的针距是 {{ch17.p_E12:.2f}} 毫米，粗针的 E7 是 {{ch17.p_E7:.2f}} 毫米。一件 50 厘米宽的前片，横密每厘米 5.5 针，就是 {{ch17.needles:.0f}} 针。请大家记住这个 p，等一会儿它就变成选针控制最关键的数字：机头每走过一个 p，选针器就要对下一枚针作一次决定。"
      - "Pitch p is 25.4 over the gauge. An E12 machine has a pitch of {{ch17.p_E12:.2f}} millimetres; a coarse E7, {{ch17.p_E7:.2f}}. A 50-centimetre front at 5.5 stitches per centimetre is {{ch17.needles:.0f}} needles. Remember this p: in a moment it becomes the key number for needle selection, because every time the carriage moves one p, the selector has to decide about the next needle."

  - layout: split
    title: ["舌针成圈：针升多高，决定做什么", "Latch needle: how high it rises decides the stitch"]
    points:
      - ["针舌由旧线圈推开、关上，不用机构", "The old loop opens and closes the latch: no mechanism"]
      - ["弯纱深度 d 决定线圈长度（度目）", "Stitch depth d sets loop length: the stitch cam"]
      - ["编织、集圈、不编织、翻针：升得不一样高", "Knit, tuck, miss, transfer: different heights"]
    visual: {video: needles}
    notes:
      - "舌针的妙处在于针舌不用机构开关：针往上走，旧线圈把针舌推开；针往下走，旧线圈又把针舌推上去关住针钩，然后自己从针头上脱出去。针往下拉到脱圈线以下多深，就是弯纱深度 d，决定新线圈多长，由度目三角的位置决定。针被推到的高度不同，结果就不同：退圈高度是编织，集圈高度是集圈，不升是不编织，推得更高就是翻针，把线圈交给对面针床。"
      - "The beauty of a latch needle is that nothing has to open or close the latch. As the needle rises, the old loop pushes the latch open; as it descends, the old loop pushes the latch shut over the hook and slides off the head. How far below the knock-over line the needle is pulled, the stitch depth d, sets the length of the new loop, and that is set by the stitch cam. The height the needle reaches decides the result: clearing height knits, tuck height tucks, no rise misses, and higher still transfers the loop to the opposite bed."

  - layout: split
    title: ["三角是平移的凸轮；选针只是两个“是 / 否”", "Cams are sliding cams; selection is two yes/no"]
    points:
      - ["几百枚针一枚接一枚走同一条廓线", "Hundreds of needles follow one profile in turn"]
      - ["S1、S2 都选中→编织；只选 S1→集圈", "S1 and S2 selected: knit; S1 only: tuck"]
      - ["S1 不选→不编织：难在“在对的位置”", "S1 not selected: miss. The hard part is position"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640"><style>html:not(.en-only) .eo{display:none}</style>
          <path d="M40 560 L860 560" stroke="#4b5f7d" stroke-width="2" stroke-dasharray="8 8"/>
          <text x="860" y="632" font-size="22" fill="#8fa3ba" text-anchor="end" class="zh">机头走向 →</text><text x="860" y="632" font-size="22" fill="#8fa3ba" text-anchor="end" class="eo">carriage →</text>
          <path d="M40 500 L860 500" stroke="#8fa3ba" stroke-width="5" stroke-dasharray="14 10"/>
          <path d="M40 500 L180 500 L267 300 L520 300 L640 560 L760 560 L860 500" fill="none" stroke="#2ec4b6" stroke-width="7" stroke-linejoin="round"/>
          <path d="M40 500 L180 500 L330 140 L470 140 L620 560 L760 560 L860 500" fill="none" stroke="#f2b705" stroke-width="7" stroke-linejoin="round"/>
          <path d="M180 80 L180 600" stroke="#ff7a45" stroke-width="4" stroke-dasharray="10 8"/>
          <path d="M267 80 L267 600" stroke="#ff7a45" stroke-width="4" stroke-dasharray="10 8"/>
          <text x="180" y="66" font-size="30" font-weight="800" fill="#ff9c75" text-anchor="middle" class="en">S1</text>
          <text x="267" y="66" font-size="30" font-weight="800" fill="#ff9c75" text-anchor="middle" class="en">S2</text>
          <text x="480" y="125" font-size="30" font-weight="700" fill="#f2b705" class="zh">编织 · 退圈高度</text><text x="480" y="125" font-size="30" font-weight="700" fill="#f2b705" class="eo">knit · clearing</text>
          <text x="530" y="290" font-size="28" font-weight="700" fill="#5ee0d2" class="zh">集圈</text><text x="530" y="290" font-size="28" font-weight="700" fill="#5ee0d2" class="eo">tuck</text>
          <text x="60" y="485" font-size="26" fill="#8fa3ba" class="zh">不编织</text><text x="60" y="485" font-size="26" fill="#8fa3ba" class="eo">miss</text>
          <text x="690" y="594" font-size="24" fill="#d3deea" text-anchor="middle" class="zh">弯纱深度 d</text><text x="690" y="594" font-size="24" fill="#d3deea" text-anchor="middle" class="eo">stitch depth d</text>
        </svg>
    notes:
      - "把机头的三角座展开成平面，就是这张图。三角其实就是第 6 讲讲过的凸轮，只不过送布凸轮是转的，这里的三角是平移的，从动件是几百枚针，一枚接一枚走同一条廓线。不同的针怎么走不同的路？靠选针。两个选针点配合：S1、S2 都选中，针升到退圈高度，织一个圈；只选中 S1，针只升到集圈高度；连 S1 都没选中，针不动。电控对每枚针只作一两个是或否的判断，难的是在正确的位置作出。"
      - "Unroll the carriage's cam plate onto a flat sheet and you get this picture. The cams are just the cams of Lecture 6, except the feed cam rotates and these slide, and the followers are hundreds of needles, one after another, all tracing the same profile. How do different needles take different paths? Selection. Two selection points work together: selected at S1 and S2, the needle rises to clearing height and knits; selected only at S1, it rises to tuck height; not selected at S1, it stays put. The electronics makes just one or two yes-or-no decisions per needle; the hard part is making them at exactly the right position."

  - layout: bignum
    title: ["选针器有多快", "How fast is a selector"]
    nums:
      - {n: "{{ch17.F_sel:.1f}} N", n_en: "force", label: ["B = 0.8 T、A = 10 mm²", "B = 0.8 T, A = 10 mm²"]}
      - {n: "{{ch17.t_arm_ms:.2f}} ms", n_en: "armature travel", label: ["0.5 g 衔铁走 0.3 mm", "0.5 g armature, 0.3 mm stroke"]}
      - {n: "0.6 ms", n_en: "delay T_d", label: ["加上电流上升：示例延迟", "Plus current rise: example delay"]}
    foot: ["选针器只拨选针片，力小、行程小；减小行程和衔铁质量，比加大电流更有效", "A selector only flips a selector jack; cutting stroke and armature mass beats more current"]
    notes:
      - "每条针槽里是一组钢片：舌针、中间片、选针片和弹簧片。选针器不直接推舌针，只决定选针片的针踵进不进三角槽，所以只需要很小的力和行程。粗算一下：吸力 F 等于 B 方乘 A 除以两倍 μ0，约 {{ch17.F_sel:.1f}} 牛；0.5 克的衔铁走 0.3 毫米约 {{ch17.t_arm_ms:.2f}} 毫秒，再加上过压驱动下的电流上升，就是后面用的 0.6 毫秒。设计方向：减小行程和衔铁质量，比加大电流更有效。"
      - "Each slot holds a set of steel parts: latch needle, intermediate jack, selector jack and spring jack. The selector doesn't push the needle; it only decides whether the selector jack's butt enters the cam track, so it needs very little force and stroke. A rough estimate: force is B squared times A over 2μ0, about {{ch17.F_sel:.1f}} newtons; a 0.5-gram armature crosses 0.3 millimetres in about {{ch17.t_arm_ms:.2f}} milliseconds, and with the current rise under overdrive that makes the 0.6 milliseconds we'll use. The lesson for design: a smaller stroke and lighter armature help more than more current."

  - layout: section
    num: "02"
    title: ["按位置选针", "Selecting by position"]

  - layout: bignum
    title: ["留给每枚针的时间 t = p / v", "Time per needle t = p / v"]
    nums:
      - {n: "{{ch17.tn_E12_1_2:.2f}} ms", n_en: "E12 · 1.2 m/s", label: ["相邻两针之间的时间", "Time between two needles"]}
      - {n: "{{ch17.lead_mm:.2f}} mm", n_en: "v · T_d", label: ["选针器延迟里机头又走的距离", "Travel during the selector delay"]}
      - {n: "{{ch17.lag_E12:.2f}} p", n_en: "lag without lead", label: ["不补偿：滞后，超过允许的 0.25 p", "Uncompensated lag, over the 0.25 p allowed"]}
    foot: ["动作时机由位置决定，不由时钟决定——和第 15 讲的离布窗口同一类问题", "Timing is set by position, not by the clock, just like Lecture 15's window"]
    notes:
      - "机头以速度 v 扫过针床，相邻两枚针之间的时间就是 p 除以 v。E12、1.2 米每秒，只有 {{ch17.tn_E12_1_2:.2f}} 毫秒，而且动作必须正好发生在选针片对准选针器的那一小段行程里。选针器有 0.6 毫秒延迟，这段时间机头又走了 {{ch17.lead_mm:.2f}} 毫米，是 {{ch17.lag_E12:.2f}} 个针距，超过允许的 0.25，所以指令必须提前发。时机由位置决定，不由时钟决定。"
      - "As the carriage sweeps at speed v, the time between two needles is p over v. At E12 and 1.2 metres per second that's only {{ch17.tn_E12_1_2:.2f}} milliseconds, and the action has to land in the short stretch where the selector jack lines up with the selector. The selector lags 0.6 milliseconds, during which the carriage moves another {{ch17.lead_mm:.2f}} millimetres, {{ch17.lag_E12:.2f}} of a pitch, more than the 0.25 allowed. So the command must go out early. Timing is set by position, not by the clock."

  - layout: split
    title: ["按位置触发：x = xᵢ − c − v·T_d", "Trigger by position: x = xᵢ − c − v·T_d"]
    points:
      - ["第 i 枚针在 xᵢ = x₀ + i·p", "Needle i sits at xᵢ = x₀ + i·p"]
      - ["选针点偏移 c，再提前 v·T_d", "Subtract the selector offset c, then lead by v·T_d"]
      - ["FPGA 每个编码器脉冲比较一次，微秒级", "The FPGA compares on every encoder count, in microseconds"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640"><style>html:not(.en-only) .eo{display:none}</style>
          <rect x="30" y="380" width="840" height="70" rx="8" fill="#1b2a44"/>
          <g stroke="#8fa3ba" stroke-width="5"><path d="M90 380 L90 450"/><path d="M190 380 L190 450"/><path d="M290 380 L290 450"/><path d="M390 380 L390 450"/><path d="M490 380 L490 450"/><path d="M590 380 L590 450"/><path d="M690 380 L690 450"/><path d="M790 380 L790 450"/></g>
          <path d="M590 375 L590 455" stroke="#f2b705" stroke-width="9"/>
          <text x="590" y="495" font-size="28" font-weight="700" fill="#f2b705" text-anchor="middle" class="en">xᵢ</text>
          <path d="M390 500 L490 500" stroke="#8fa3ba" stroke-width="3"/><path d="M390 488 L390 512 M490 488 L490 512" stroke="#8fa3ba" stroke-width="3"/>
          <text x="440" y="540" font-size="26" fill="#8fa3ba" text-anchor="middle" class="en">p</text>
          <rect x="120" y="150" width="360" height="160" rx="18" fill="#111d31" stroke="#2ec4b6" stroke-width="3"/>
          <text x="300" y="200" font-size="30" font-weight="700" fill="#5ee0d2" text-anchor="middle" class="zh">机头</text><text x="300" y="200" font-size="30" font-weight="700" fill="#5ee0d2" text-anchor="middle" class="eo">carriage</text>
          <circle cx="430" cy="270" r="16" fill="#ff7a45"/><text x="430" y="245" font-size="22" fill="#ff9c75" text-anchor="middle" class="zh">选针点</text><text x="430" y="245" font-size="22" fill="#ff9c75" text-anchor="middle" class="eo">select point</text>
          <path d="M490 230 L600 230" stroke="#f3f6fa" stroke-width="5"/><path d="M610 230 l-18 -12 l0 24z" fill="#f3f6fa"/>
          <text x="550" y="215" font-size="28" fill="#f3f6fa" text-anchor="middle" class="en">v</text>
          <path d="M430 330 L590 330" stroke="#ff7a45" stroke-width="4" stroke-dasharray="10 6"/>
          <text x="510" y="362" font-size="24" fill="#ff9c75" text-anchor="middle" class="zh">提前 v·T_d</text><text x="510" y="362" font-size="24" fill="#ff9c75" text-anchor="middle" class="eo">lead v·T_d</text>
          <text x="450" y="100" font-size="36" font-weight="800" fill="#f2b705" text-anchor="middle" class="en">x_cmd = xᵢ − c − v·T_d</text>
          <text x="450" y="610" font-size="26" fill="#d3deea" text-anchor="middle" class="zh">每行开始前，选针数据先装进 FPGA</text><text x="450" y="610" font-size="26" fill="#d3deea" text-anchor="middle" class="eo">Before each course, selection data goes into the FPGA</text>
        </svg>
    notes:
      - "怎么在对的位置发令？控制器从机头电机的编码器或光栅尺时时知道机头位置 x。第 i 枚针在 x0 加 i 乘 p，选针点在机头上偏移 c，理想动作位置是 xi 减 c；再减去延迟里要走的 v 乘 T_d，就是发令位置。每行开始前把选针数据装进 FPGA，FPGA 每收到一个编码器脉冲就比较一次，到点就发脉冲，延迟在微秒级。软件只负责每行一次把数据备好。"
      - "How do we fire at the right place? The controller always knows carriage position x from the motor encoder or a linear scale. Needle i is at x0 plus i times p; the selection point is offset c on the carriage, so the ideal action point is xi minus c; subtract the distance covered during the delay, v times T_d, and that's where to fire. Before each course the selection data is loaded into the FPGA, which compares on every encoder count and fires when it gets there, within microseconds. Software only prepares the data once per course."

  - layout: duo
    title: ["不补偿就错选：红点是选错位置的针", "Without a lead, needles are mis-selected"]
    left: {video: nocomp, label: ["不补偿", "No lead"], note: ["机头一快，红点就出来", "Red dots as soon as it speeds up"]}
    right: {video: rtcomp, label: ["按实时速度补偿", "Lead by real-time speed"], note: ["加速、全速都对得上", "On target while accelerating and at speed"]}
    notes:
      - "这是横机编织仿真，慢放 5 倍。上面一排是后针床，下面是前针床，灰色区是换向余量，机头在这里减速、换向、再加速。红点表示选针位置误差超限的针。左边不补偿：机头一加速到高速，红点就一片片出来。右边按实时速度补偿：不管是在加速区还是全速区，选针都对得上。"
      - "This is the knitting simulation, slowed five times. The upper row is the back bed, the lower row the front bed; the grey zones are the reversal margins, where the carriage slows, turns and speeds up again. A red dot marks a needle whose selection position error is out of tolerance. On the left, no lead: as soon as the carriage gets up to speed, red dots appear in patches. On the right, lead by real-time speed: selection is on target whether accelerating or at full speed."

  - layout: split
    title: ["提前量为什么要用实时速度", "Why the lead must use real-time speed"]
    points:
      - ["不补偿：全速时滞后 {{ch17.lag_E12:.2f}} p", "No lead: lags {{ch17.lag_E12:.2f}} p at full speed"]
      - ["固定提前量：全速对，加速区反而超前", "Fixed lead: right at full speed, early while accelerating"]
      - ["实时速度：只剩 T_d 的不确定，要定期标定", "Real-time: only T_d's uncertainty; calibrate it"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640"><style>html:not(.en-only) .eo{display:none}</style>
          <rect x="60" y="205" width="800" height="250" fill="rgba(46,196,182,.12)"/>
          <path d="M60 330 L860 330" stroke="#4b5f7d" stroke-width="3"/>
          <path d="M360 80 L360 560" stroke="#4b5f7d" stroke-width="2" stroke-dasharray="8 8"/>
          <text x="210" y="590" font-size="26" fill="#8fa3ba" text-anchor="middle" class="zh">加速区</text><text x="210" y="590" font-size="26" fill="#8fa3ba" text-anchor="middle" class="eo">accelerating</text>
          <text x="610" y="590" font-size="26" fill="#8fa3ba" text-anchor="middle" class="zh">全速区</text><text x="610" y="590" font-size="26" fill="#8fa3ba" text-anchor="middle" class="eo">full speed</text>
          <text x="850" y="196" font-size="22" fill="#5ee0d2" text-anchor="end" class="en">+0.25 p</text>
          <text x="850" y="478" font-size="22" fill="#5ee0d2" text-anchor="end" class="en">−0.25 p</text>
          <path d="M60 302 L360 160 L860 160" fill="none" stroke="#ff7a45" stroke-width="7" stroke-linejoin="round"/>
          <path d="M60 470 L360 330 L860 330" fill="none" stroke="#f2b705" stroke-width="7" stroke-linejoin="round" stroke-dasharray="16 8"/>
          <path d="M60 322 C 200 338, 300 322, 400 336 S 700 322, 860 334" fill="none" stroke="#2ec4b6" stroke-width="6"/>
          <text x="520" y="140" font-size="28" font-weight="700" fill="#ff9c75" class="zh">不补偿：滞后</text><text x="520" y="140" font-size="28" font-weight="700" fill="#ff9c75" class="eo">no lead: late</text>
          <text x="80" y="520" font-size="28" font-weight="700" fill="#f2b705" class="zh">固定：超前</text><text x="80" y="520" font-size="28" font-weight="700" fill="#f2b705" class="eo">fixed: early</text>
          <text x="560" y="390" font-size="28" font-weight="700" fill="#5ee0d2" class="zh">按实时速度</text><text x="560" y="390" font-size="28" font-weight="700" fill="#5ee0d2" class="eo">real-time</text>
          <text x="70" y="60" font-size="24" fill="#8fa3ba" class="zh">选针位置误差 / 针距</text><text x="70" y="60" font-size="24" fill="#8fa3ba" class="eo">selection error / pitch</text>
        </svg>
    notes:
      - "关键在于提前量里的 v 要用实时速度。机头每走一趟都要换向，换向后有一段加速区。完全不补偿，全速时滞后 {{ch17.lag_E12:.2f}} 个针距，超过允许的 0.25，机器只能慢跑。固定提前量按全速整定，全速区误差为零，但在加速区速度越低提前得越多，换向后第一段反而超前。只有按实时速度补偿，误差才只剩 T_d 本身不确定的那一点。T_d 还会随温度、电压变，所以要定期标定。"
      - "The key is that the v in the lead must be the real-time speed. The carriage reverses every pass, and after each reversal there's an acceleration zone. With no lead it lags {{ch17.lag_E12:.2f}} of a pitch at full speed, beyond the 0.25 allowed, so the machine has to run slowly. A fixed lead tuned for full speed is exact there, but in the acceleration zone the slower it goes the more it leads, so right after reversal it fires early. Only a real-time lead leaves nothing but the uncertainty in T_d itself, and since T_d drifts with temperature and voltage, it has to be calibrated regularly."

  - layout: split
    title: ["一趟要走多远：D = w + L_k + 2c", "One pass: D = w + L_k + 2c"]
    points:
      - ["速度上限 v_max = p / T_c：机号越高越慢", "Speed limit v_max = p / T_c: finer gauge, slower"]
      - ["换向余量 c ≥ v² / 2a = {{ch17.c_base:.0f}} mm", "Reversal margin c ≥ v² / 2a = {{ch17.c_base:.0f}} mm"]
      - ["余量这段什么也不织，按织物宽度定换向点", "Nothing is knitted there; reverse at the fabric edge"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640"><style>html:not(.en-only) .eo{display:none}</style>
          <g font-weight="700" text-anchor="middle">
            <rect x="40" y="300" width="58" height="80" fill="#4b5f7d"/><text x="69" y="350" font-size="24" fill="#f3f6fa" class="en">c</text>
            <rect x="98" y="300" width="466" height="80" fill="#2ec4b6"/><text x="331" y="350" font-size="28" fill="#08101d" class="zh">织物宽 w = {{ch17.w:.0f}} mm</text><text x="331" y="350" font-size="28" fill="#08101d" class="eo">fabric w = {{ch17.w:.0f}} mm</text>
            <rect x="564" y="300" width="120" height="80" fill="#4c8dff"/><text x="624" y="350" font-size="24" fill="#08101d" class="en">L_k</text>
            <rect x="684" y="300" width="58" height="80" fill="#4b5f7d"/><text x="713" y="350" font-size="24" fill="#f3f6fa" class="en">c</text>
          </g>
          <path d="M40 420 L742 420" stroke="#f2b705" stroke-width="4"/><path d="M40 405 L40 435 M742 405 L742 435" stroke="#f2b705" stroke-width="4"/>
          <text x="391" y="466" font-size="30" font-weight="800" fill="#f2b705" text-anchor="middle">D = {{ch17.base_D:.0f}} mm</text>
          <path d="M40 260 L98 140 L684 140 L742 260" fill="none" stroke="#f3f6fa" stroke-width="6" stroke-linejoin="round"/>
          <text x="391" y="120" font-size="26" fill="#d3deea" text-anchor="middle" class="zh">机头速度：在余量里加速、减速</text><text x="391" y="120" font-size="26" fill="#d3deea" text-anchor="middle" class="eo">carriage speed: up and down inside the margins</text>
          <text x="760" y="235" font-size="22" fill="#8fa3ba" class="zh">换向</text><text x="760" y="235" font-size="22" fill="#8fa3ba" class="eo">reverse</text>
          <text x="450" y="560" font-size="26" fill="#d3deea" text-anchor="middle" class="zh">t = D/v + v/a + 停顿</text><text x="450" y="560" font-size="26" fill="#d3deea" text-anchor="middle" class="eo">t = D/v + v/a + dwell</text>
          <text x="450" y="600" font-size="22" fill="#8fa3ba" text-anchor="middle" class="zh">L_k：三角座选针点跨度</text><text x="450" y="600" font-size="22" fill="#8fa3ba" text-anchor="middle" class="eo">L_k: span of the cam plate’s selection points</text>
        </svg>
    notes:
      - "机头能跑多快？如果选针器要在一个针距的时间里完成一次吸合释放，周期是 T_c，最高速度就是 p 除以 T_c，机号越高越慢。另外机头在织物两端要多走一段才能换向：三角座要完全离开最后一枚工作针，固定提前量还要求在第一枚针前就达到全速，减速、加速都要 v 方除以 2a，{{ch17.c_base:.0f}} 毫米。这段路什么也不织，所以控制器按织物实际宽度定换向点。"
      - "How fast can the carriage go? If the selector must finish one engage-release cycle, period T_c, within one pitch time, the top speed is p over T_c: the finer the gauge, the slower. That's why fine-gauge machines use multi-stage selectors that share neighbouring needles between stages. And at each end the carriage has to overrun before reversing: the cam plate must clear the last working needle, and with a fixed lead it must be at full speed before the first needle, so braking and accelerating need v squared over 2a, {{ch17.c_base:.0f}} millimetres. Nothing is knitted there, so the controller reverses according to the actual fabric width."

  - layout: lab
    title: ["动手试一试：横机编织仿真", "Try it: flat knitting simulation"]
    shot: {page: knit}
    tasks:
      - ["选“不补偿”，逐步提高机头速度，看何时出红点", "No lead: raise carriage speed; when do red dots appear?"]
      - ["比较三种提前量在加速区和全速区的差别", "Compare the three leads while accelerating and at speed"]
      - ["改换向余量，看一行和整片用时怎样变", "Vary the reversal margin; watch course and panel time"]
    notes:
      - "横机编织仿真在问渠平台上可以自己做。先选不补偿，把机头速度从 0.4 米每秒逐步提高，看多快开始出现错选，用 t_n 等于 p 除以 v 和 v 乘 T_d 解释。再比较固定提前量和按实时速度补偿，在加速区和全速区有什么不同。最后改换向余量，看一行和整片的用时怎样变化。结果填进实验报告。"
      - "You can run the knitting simulation yourself on WenQuest. First choose no lead and raise the carriage speed step by step from 0.4 metres per second: when do mis-selections start? Explain it with t_n equals p over v and with v times T_d. Then compare the fixed lead with the real-time lead, in the acceleration zone and at full speed. Finally change the reversal margin and see how the time per course and per panel changes. Put the results in your report."

