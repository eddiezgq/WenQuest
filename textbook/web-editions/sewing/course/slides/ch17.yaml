    title: ["两级控制与 FPGA 选针", "Two-level control and FPGA selection"]

  - layout: split
    title: ["主控制器按行，机头板按针", "Main controller per course, carriage board per needle"]
    points:
      - ["主控制器：换向前备好下一行，几百毫秒", "Main controller: next course ready before reversal"]
      - ["机头板 FPGA：逐针触发，每针一两毫秒", "Carriage FPGA: fires needle by needle, 1–2 ms each"]
      - ["机头板装在机头上：只有电源和总线走拖链", "Board on the carriage: only power and bus in the chain"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640"><style>html:not(.en-only) .eo{display:none}</style>
          <defs><marker id="m17a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6f84a3"/></marker></defs>
