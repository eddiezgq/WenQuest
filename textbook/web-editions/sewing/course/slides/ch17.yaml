          <g stroke="#4c8dff" stroke-width="2"><path d="M60 120 L840 120"/></g>
          <g stroke="#9cc0ff" stroke-width="2">
            <path d="M80 112 L80 128 M100 112 L100 128 M120 112 L120 128 M140 112 L140 128 M160 112 L160 128 M180 112 L180 128 M200 112 L200 128 M220 112 L220 128 M240 112 L240 128 M260 112 L260 128 M280 112 L280 128 M300 112 L300 128 M320 112 L320 128 M340 112 L340 128 M360 112 L360 128 M380 112 L380 128 M400 112 L400 128 M420 112 L420 128 M440 112 L440 128 M460 112 L460 128 M480 112 L480 128 M500 112 L500 128 M520 112 L520 128 M540 112 L540 128 M560 112 L560 128 M580 112 L580 128 M600 112 L600 128 M620 112 L620 128 M640 112 L640 128 M660 112 L660 128 M680 112 L680 128 M700 112 L700 128 M720 112 L720 128 M740 112 L740 128 M760 112 L760 128 M780 112 L780 128 M800 112 L800 128 M820 112 L820 128"/>
          </g>
