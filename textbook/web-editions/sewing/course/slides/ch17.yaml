            <text x="450" y="98" font-size="34" font-weight="700" fill="#9cc0ff" class="zh">主控制器 · 按行</text><text x="450" y="98" font-size="34" font-weight="700" fill="#9cc0ff" class="eo">Main controller · per course</text>
            <text x="450" y="146" font-size="24" fill="#8fa3ba" class="zh">花型程序 → 方向、速度、选针、度目、纱嘴、摇床</text><text x="450" y="146" font-size="24" fill="#8fa3ba" class="eo">program → speed, selection, stitch, carriers, racking</text>
            <rect x="60" y="280" width="780" height="140" rx="22" fill="#111d31" stroke="#f2b705" stroke-width="3"/>
            <text x="450" y="338" font-size="34" font-weight="700" fill="#f2b705" class="zh">机头板 FPGA · 按针</text><text x="450" y="338" font-size="34" font-weight="700" fill="#f2b705" class="eo">Carriage FPGA · per needle</text>
            <text x="450" y="386" font-size="24" fill="#8fa3ba" class="zh">编码器位置比较 → 逐针发脉冲（微秒级）</text><text x="450" y="386" font-size="24" fill="#8fa3ba" class="eo">encoder position compare → pulse per needle (µs)</text>
