          <rect x="430" y="150" width="140" height="110" rx="14" fill="#111d31" stroke="#f2b705" stroke-width="3"/>
          <text x="500" y="215" font-size="26" font-weight="700" fill="#f2b705" text-anchor="middle" class="zh">打印头</text><text x="500" y="215" font-size="22" font-weight="700" fill="#f2b705" text-anchor="middle" class="eo">print head</text>
          <path d="M590 205 L690 205" stroke="#f3f6fa" stroke-width="5"/><path d="M700 205 l-16 -11 l0 22z" fill="#f3f6fa"/>
          <g fill="#0b1220"><circle cx="200" cy="300" r="7"/><circle cx="220" cy="300" r="7"/><circle cx="240" cy="300" r="7"/><circle cx="280" cy="300" r="7"/><circle cx="320" cy="300" r="7"/><circle cx="340" cy="300" r="7"/><circle cx="360" cy="300" r="7"/><circle cx="400" cy="300" r="7"/><circle cx="420" cy="300" r="7"/></g>
          <text x="450" y="420" font-size="30" font-weight="700" fill="#16243b" text-anchor="middle" class="zh">每个喷孔 ≈ 每枚针</text>
          <text x="450" y="470" font-size="22" fill="#4b5f7d" text-anchor="middle" class="en">each nozzle ≈ each needle</text>
        </svg>
    notes:
      - "生活里最像横机的是喷墨打印机。打印头沿导轨来回扫过纸面，每扫一趟打一行，每个喷孔都要在走到正确位置时决定喷还是不喷，这和横机机头扫过针床、每枚针决定织不织几乎一模一样。打印头的位置也是由一条光栅码带测出来的，按位置喷墨而不是按时间，所以打印头在开头加速的时候，字也不会歪。"
      - "In everyday life the closest thing to a flat knitting machine is an inkjet printer. The print head sweeps back and forth across the paper, printing a band each pass, and every nozzle decides to fire or not when it reaches exactly the right spot, almost exactly like the carriage sweeping the beds and each needle deciding whether to knit. The head's position comes from an encoder strip, and it fires by position, not by time, which is why the text isn't skewed even while the head is accelerating at the start of a pass."

  - layout: answer
    tag: ["回到车间问题", "Back to the problem"]
    title: ["方案 B 最值得：它减少的是趟数", "Option B wins: it cuts the number of passes"]
    rows:
      - [["现在（固定提前量）", "Now (fixed lead)"], "{{ch17.base_min:.1f}} min"]
      - [["A 实时补偿 / C 提速", "A real-time lead / C faster"], "{{ch17.A_min:.1f}} / {{ch17.C_min:.1f}} min"]
      - [["B 两系统机头", "B two-system carriage"], "{{ch17.B_min:.1f}} min"]
    side: {big: "{{ch17.C_gain_pct:.0f}}%", text: ["提速 {{ch17.speedup_pct:.0f}}%，一片只快这么多", "A third more speed buys only this much"]}
    foot: ["B 的代价是机头更长更重；A 几乎不花钱，可以先做", "B's price is a longer, heavier carriage; A costs almost nothing, so do it first"]
    notes:
      - "回到开头的问题。现在每趟 {{ch17.base_t:.2f}} 秒，一片 {{ch17.base_min:.1f}} 分钟。方案 A 按实时速度补偿，不必在第一枚针前达到全速，余量减到 20 毫米，一片 {{ch17.A_min:.1f}} 分钟。方案 C 提速到 1.6，余量要加到 {{ch17.C_c:.0f}} 毫米，一片 {{ch17.C_min:.1f}} 分钟，提速三成多只快约 {{ch17.C_gain_pct:.0f}}%：v 除以 a 和 v 方除以 2a 都随 v 变大，每针时间也逼近选针器周期。方案 B 两系统机头，两色同一趟织，趟数从 760 降到 460，一片 {{ch17.B_min:.1f}} 分钟，收益最大，因为它减少的是趟数，代价是机头更长更重。方案 A 几乎只是改软件，可以先做。"
      - "Back to the opening question. Now each pass takes {{ch17.base_t:.2f}} seconds and a panel {{ch17.base_min:.1f}} minutes. Option A, a real-time lead, needn't reach full speed before the first needle, so the margin drops to 20 millimetres: {{ch17.A_min:.1f}} minutes. Option C, 1.6 metres per second, needs a {{ch17.C_c:.0f}}-millimetre margin and gives {{ch17.C_min:.1f}} minutes. A third more speed buys only about {{ch17.C_gain_pct:.0f}} percent, because v over a and v squared over 2a both grow with v, and the time per needle approaches the selector cycle. Option B, a two-system carriage, knits both colours in one pass, 460 passes instead of 760: {{ch17.B_min:.1f}} minutes, the biggest gain, because it reduces the number of passes. Its price is a longer, heavier carriage. Option A is little more than a software change, so do it first."

  - layout: summary
    title: ["本讲小结", "Summary"]
    points:
      - ["三角把针的升降定死，电控只作“是 / 否”", "Cams fix the motion; electronics makes yes/no calls"]
      - ["按位置触发：x = xᵢ − c − v(t)·T_d", "Fire by position: x = xᵢ − c − v(t)·T_d"]
      - ["两级控制：主控按行，FPGA 按针", "Two levels: controller per course, FPGA per needle"]
    after: ["作业 17 · 测验 · 虚拟实验 17-1、17-3 实验报告 —— 在问渠学习平台完成", "Assignment 17 · quiz · Labs 17-1 and 17-3 reports — on WenQuest"]
    notes:
      - "这一讲记住三件事。第一，横机是机头在动，三角是平移的凸轮，把针的升降定死，电控只需按位置对每枚针作一两个是或否判断。第二，选针要按位置触发，每针只有 p 除以 v 的时间，提前量要用实时速度。第三，两级控制：主控制器按行准备数据，机头板上的 FPGA 按针比较触发。作业、测验和两个实验的报告在问渠平台完成。"
      - "Three things to remember. One: on a flat knitting machine the carriage moves, its cams are sliding cams that fix how needles move, and the electronics only makes one or two yes-or-no decisions per needle, by position. Two: selection fires by position; each needle gets only p over v, and the lead must use real-time speed. Three: two-level control, with the main controller preparing each course and the FPGA on the carriage firing needle by needle. The assignment, quiz and both lab reports are on WenQuest."
