            <text x="510" y="410" fill="#ff9c75">✗</text><text x="590" y="410" fill="#ff9c75">✗</text><text x="670" y="410" fill="#ff9c75">✗</text><text x="750" y="410" fill="#ff9c75">✗</text><text x="830" y="410" fill="#ff9c75">✗</text>
          </g>
          <text x="450" y="470" font-size="28" fill="#d3deea" text-anchor="middle">十次报警，全是炒菜</text>
          <rect x="150" y="520" width="600" height="80" rx="20" fill="rgba(242,183,5,.12)"/>
          <text x="450" y="572" font-size="30" font-weight="700" fill="#ffd75a" text-anchor="middle">阈值要按代价定</text>
        </svg>
    notes:
      - "家里也有同样的事。厨房里的烟雾报警器一炒菜就响，响了十次都不是火灾，家里人就会把电池拆了，真着火时反而不响。报警的精确率太低，人就不再相信报警。车间里的视觉质检也一样，十次报警六次是误报，工人很快就不认真复检了。这正是车间质检要按代价定阈值、要算精确率的原因。"
      - "The same thing happens at home. The kitchen smoke alarm goes off every time someone fries something; ten alarms and not one fire, so somebody pulls the battery, and in a real fire it stays silent. When alarm precision is too low, people stop believing alarms. Vision inspection on the floor is no different: if six alarms in ten are false, operators soon stop rechecking carefully. That's exactly why inspection thresholds must be set by cost, and why precision must be calculated."

  - layout: answer
    tag: ["回到车间问题", "Back to the problem"]
    title: ["报警 {{ch31.alarms:.0f}} 件，真次品只有 {{ch31.prec:.0f}}%", "{{ch31.alarms:.0f}} alarms, only {{ch31.prec:.0f}}% real"]
    rows:
      - ["每 1000 件：抓住 / 误报", "{{ch31.tp:.0f}} / {{ch31.fp:.0f}} 件"]
      - ["最省阈值 / 成本", "{{ch31.tbest:.2f}} · {{ch31.cbest:.0f}} 元"]
      - ["精确率 80% + 召回率 90%", "d′ ≈ {{ch31.dneed:.1f}}"]
    side: {big: "{{ch31.false10:.0f}} / 10", text: ["十次报警六次是误报：只调阈值不够，要提高 d′", "Six alarms in ten are false: raise d′, not just the threshold"]}
    foot: ["召回率和误报率是检测器的性质，精确率还取决于次品率；阈值按漏检和误报的代价定", "Recall and false-alarm rate belong to the inspector; precision also depends on the defect rate; set thresholds by cost"]
    notes:
      - "回到开头的问题。1000 件中 20 件次品抓住约 {{ch31.tp:.0f}} 件，980 件合格品误报约 {{ch31.fp:.0f}} 件，共报警约 {{ch31.alarms:.0f}} 件，精确率约 {{ch31.prec:.0f}}%，十次报警六次是误报。按代价公式，最省阈值约 {{ch31.tbest:.2f}}，每 1000 件约 {{ch31.cbest:.0f}} 元。要精确率 80% 且召回率 90%，只调阈值做不到，必须把 d′ 从 3.53 提高到约 {{ch31.dneed:.1f}}。所以“召回率 95%”可以信，但它不等于“报警准”。"
      - "Back to our problem. Of 1000 pieces, about {{ch31.tp:.0f}} of the 20 defects are caught, and about {{ch31.fp:.0f}} of the 980 good pieces are flagged by mistake: about {{ch31.alarms:.0f}} alarms in all, with precision about {{ch31.prec:.0f}} percent, six alarms in ten false. By the cost formula the cheapest threshold is about {{ch31.tbest:.2f}}, costing about {{ch31.cbest:.0f}} yuan per 1000 pieces. For 80 percent precision with 90 percent recall no threshold will do; d-prime must rise from 3.53 to about {{ch31.dneed:.1f}}. So '95 percent recall' can be believed, but it doesn't mean the alarms are right."

  - layout: summary
    title: ["本讲小结", "Summary"]
    points:
      - ["问三件事：吃什么数据、怎样评价、哪里出错", "Ask: what data, how judged, where it fails"]
      - ["精确率取决于次品率；阈值按代价定", "Precision depends on base rate; thresholds by cost"]
      - ["AI 缝纫机多是控制，调参要有上下限", "AI machines are mostly control; adjust within limits"]
    after: ["作业 31：为领子工段选一套视觉质检方案 · 测验 · 虚拟实验 31-1 报告 —— 在问渠学习平台完成", "Assignment 31 · quiz · Lab 31-1 report — on WenQuest"]
    notes:
      - "最后一讲记住三件事。第一，判断任何 AI 应用都问三件事：吃什么数据、怎样评价、会在哪里出错，四类应用各有怕的。第二，召回率和误报率是检测器的性质，精确率还取决于次品率；阈值按漏检和误报的代价定，要精确率和召回率同时高，只能提高 d′；预测性维护要同时看提前量、误报和漏报。第三，AI 缝纫机的大部分是传感器、执行器和控制，调参要有上下限和保护；语言助手要注明来源、由人确认。这门课到这里就结束了，谢谢大家。"
      - "Three things to remember from the last lecture. One: of any AI application ask what data it eats, how it's judged and where it fails; each of the four kinds has its own weakness. Two: recall and false-alarm rate belong to the inspector, while precision also depends on the defect rate; set thresholds by the costs of misses and false alarms, and to have both high precision and high recall you must raise d-prime; judge predictive maintenance on lead time, false alarms and misses together. Three: an AI sewing machine is mostly sensors, actuators and control, so adjustments need limits and protection, and language assistants must cite sources and wait for a person to confirm. That's the end of the course. Thank you all."
