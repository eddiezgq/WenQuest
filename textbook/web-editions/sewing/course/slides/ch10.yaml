      - ["弯针扁椭圆；定时窗口约 −3.5° 到 +4°", "A flat-ellipse looper; timing window about −3.5° to +4°"]
      - ["耗线比按每根线算，线团逐根备", "Count consumption and cones thread by thread"]
    after: ["作业 10：链缝弯针定时与绷缝备线 · 测验 · 实验 10-1、10-2 —— 在问渠学习平台完成", "Assignment 10: looper timing and thread planning · quiz · Labs 10-1, 10-2 — on WenQuest"]
    notes:
      - "这一讲记住三件事。第一，401 线迹的成败在两个时刻：钩线时刀尖在针后钻进线环；下一针到弯针高度时刀尖已在针前、针刺进线三角。第二，弯针的左右摆动和前后避针合成扁椭圆，定时窗口只有约负 3.5 到正 4 度。第三，耗线比按每根线算，线团逐根线备，弯针线要多备。作业、测验和两个实验都在问渠平台上完成。"
      - "Three things to remember. One: a 401 stitch hinges on two moments: at the catch, the point enters the loop from behind the needle; when the next needle arrives, the point is in front and the needle enters the triangle. Two: the looper's swing and avoidance make a flat ellipse, and the timing window is only about minus 3.5 to plus 4 degrees. Three: count consumption thread by thread and stock cones the same way, with extra looper thread. The assignment, quiz and both labs are on WenQuest."
