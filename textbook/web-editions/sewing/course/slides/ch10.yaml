          <path d="M150 120 L750 120" stroke="#c9b48a" stroke-width="8"/>
          <g fill="none" stroke="#2c6fd6" stroke-width="7"><ellipse cx="420" cy="160" rx="28" ry="14"/><ellipse cx="480" cy="160" rx="28" ry="14"/><ellipse cx="540" cy="160" rx="28" ry="14"/><ellipse cx="600" cy="160" rx="28" ry="14"/><ellipse cx="660" cy="160" rx="28" ry="14"/></g>
          <path d="M392 160 C 340 140, 300 100, 250 60" fill="none" stroke="#2c6fd6" stroke-width="7"/>
          <path d="M250 60 C 200 40, 140 70, 90 40" fill="none" stroke="#2c6fd6" stroke-width="7" stroke-dasharray="14 10"/>
          <path d="M150 160 L380 160" stroke="#8fa3ba" stroke-width="3" stroke-dasharray="6 6"/>
          <text x="40" y="30" font-size="28" font-weight="700" fill="#8fbaff">一拉 · pull</text>
          <text x="450" y="400" font-size="40" font-weight="800" fill="#6b5a3a" text-anchor="middle">米 · RICE</text>
          <text x="450" y="230" font-size="24" fill="#6b5a3a" text-anchor="middle">101 单线链式 · single-thread chain</text>
        </svg>
    notes:
      - "生活中的链式线迹：米袋、面粉袋的袋口常用单线链式封口。找到对的那个线头一拉，整条缝像拉链一样一环接一环脱开。这正是链式线迹末端没锁住就会脱散的特点，在这里反倒成了方便。缝衣服时它是缺点，所以牛仔裤后裆的 401 末端要压进另一道缝里，或者打结锁住。"
      - "Chainstitch at home: rice and flour sacks are often closed with a single-thread chain. Find the right thread end, pull, and the whole seam comes undone loop by loop like a zip. That's the chainstitch's habit of unravelling from an unsecured end, which here becomes a convenience. On clothes it's a weakness, so the end of a 401 seam on jeans has to be secured by other means."

