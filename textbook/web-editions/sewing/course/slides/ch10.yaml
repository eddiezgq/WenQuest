    notes:
      - "回到开头。每根线的用量等于它的耗线比乘 172 厘米、乘 1000 件、再乘 1.12。按模型，每根针线约 {{ch10.b_n:.0f}} 米，各 {{ch10.k_n:.0f}} 个线团；弯针线约 {{ch10.b_l:.0f}} 米，{{ch10.k_l:.0f}} 个；合计约 {{ch10.b_tot:.0f}} 米，{{ch10.k_tot:.0f}} 个。主管总长除以 5000 也得 7 个，数量碰巧相同，但他不知道哪根线要几个：弯针线占了 {{ch10.l_share:.0f}}%，一个线团只能挂在一根线上，弯针线必须单独多备。"
      - "Back to the start. Each thread needs its ratio times 172 centimetres times 1000 pieces times 1.12. By the model, each needle thread needs about {{ch10.b_n:.0f}} metres, {{ch10.k_n:.0f}} cone each; the looper thread about {{ch10.b_l:.0f}} metres, {{ch10.k_l:.0f}} cones; about {{ch10.b_tot:.0f}} metres and {{ch10.k_tot:.0f}} cones in all. The supervisor's total divided by 5000 also gives 7, but only by coincidence: it says nothing about which thread needs how many. The looper thread takes {{ch10.l_share:.0f}} percent, and a cone feeds only one thread, so the looper thread must be stocked separately."

