lesson: 6
code: [ch06]

clips:
  hero:          # 封面：三维样机全透视，送布链突出，镜头对着针板下的送布牙
    page: proto-lockstitch
    selector: "#stage"
    steps:
      - {at: 0, press: ["#shell [data-k=xray]", "#chains [data-k=feed]"]}
      - {at: 2, js: "var t=document.getElementById('tableOn');t.checked=false;t.onchange();window.__api.cam(-0.6,0.28,800,[-60,40,0])"}
  side:          # 实验 6-1：侧视动画（压脚、针板、送布牙、机针、两层布），一直转
    page: feed
    selector: "#side"
    steps:
      - {at: 0, js: "var M=document.querySelector('#side');document.querySelectorAll('body *').forEach(function(e){if(!e.contains(M)&&!M.contains(e))e.style.visibility='hidden'})"}
  lining:        # 衬里滑料两层、下送布：上下层记号越错越开
    page: feed
    selector: "#side"
    steps:
      - {at: 0, set: {fab: lining}, js: "var M=document.querySelector('#side');document.querySelectorAll('body *').forEach(function(e){if(!e.contains(M)&&!M.contains(e))e.style.visibility='hidden'})"}
  traj:          # 送布牙齿尖轨迹：倾斜的椭圆，粗线为抓布段
    page: feed
    selector: "#traj"
    steps:
      - {at: 0, js: "var M=document.querySelector('#traj');document.querySelectorAll('body *').forEach(function(e){if(!e.contains(M)&&!M.contains(e))e.style.visibility='hidden'})"}
  traj30:        # 水平单独提前 30°：落牙前已经往回走（回拖）
    page: feed
    selector: "#traj"
    steps:
      - {at: 0, set: {p_dP: "-30"}, js: "var M=document.querySelector('#traj');document.querySelectorAll('body *').forEach(function(e){if(!e.contains(M)&&!M.contains(e))e.style.visibility='hidden'})"}
  tim:           # 送布时序图：针尖、针眼、牙高、牙和布的水平位置
    page: feed
    selector: "#tim"
