slides:
  - layout: cover
    video: hero
    kicker: ["第 6 讲", "Lecture 6"]
    title: ["送布机构", "The Feed Mechanism"]
    sub: ["布什么时候动、动多少，上下两层是否一起动", "When and how far the fabric moves, and whether both plies move together"]
    notes:
      - "这一讲讲第四条传动链：送布机构。画面上突出的是送布链，上轴的送布偏心轮管前后，下轴的抬牙偏心轮管上下，两路合起来让针板下的送布牙一针一针把布往前推。针距不匀、上层越缝越长、厚料断针，这三个车间毛病，修机师傅都会先查送布。"
      - "Today the fourth drive train: the feed mechanism. On screen the feed train is highlighted: the feed eccentric on the upper shaft gives the back-and-forth motion, the lift eccentric on the lower shaft gives the up-and-down, and together they make the feed dog under the throat plate push the fabric forward stitch by stitch. Uneven stitches, a growing upper ply, broken needles on heavy work: for all three, a mechanic checks the feed first."

  - layout: question
    tag: ["车间问题", "Shop-floor problem"]
    title: ["牛仔裤腰头上断针", "Broken needles on jeans waistbands"]
    facts:
      - ["四层牛仔约 4 mm 厚，针距 3 mm", "Four plies of denim, about 4 mm; 3 mm stitch"]
      - ["按说明书标准送布定时调好", "Set to the manual's standard feed timing"]
      - ["薄料一直正常，缝腰头机针被带歪、断针", "Fine on thin cloth; on waistbands the needle bends and breaks"]
    notes:
      - "车间问题。某牛仔裤厂缝腰头，四层牛仔布约 4 毫米厚，针距 3 毫米。机器按使用说明书的标准送布定时调好，缝 1.5 毫米的薄料一直正常。可一缝腰头，机针就被布带歪，时有断针。针尖在什么时候扎进这么厚的布？布在机针入布以后还被推了多少？送布定时该怎么调、调多少？这一讲最后来算。"
      - "Here's the problem. A jeans factory is sewing waistbands: four plies of denim, about 4 millimetres thick, with a 3 millimetre stitch. The machine is set to the manual's standard feed timing and has always been fine on 1.5 millimetre cloth. But on the waistband the needle is dragged sideways and breaks from time to time. When does the point enter such thick cloth? How far is the cloth pushed after the needle is in? How should the feed timing change, and by how much? We'll work it out at the end."

  - layout: section
    num: "01"
    title: ["送布要做什么", "What the feed has to do"]

  - layout: split
    title: ["四动作：升、进、降、退", "Four motions: rise, advance, drop, return"]
    points:
      - ["升、降决定何时抓布、放布", "Rise and drop: when the fabric is gripped and released"]
      - ["只有针板上方的“进”推动布", "Only the advance above the plate moves the fabric"]
      - ["布夹在压脚、针板、送布牙之间", "The fabric is held by foot, plate and dog"]
    visual: {video: side}
    notes:
      - "送布要做的事，威尔逊 1854 年就取得了专利，叫四动作送布：送布牙先升起顶住布，再往前带着布走，然后降到针板下面，最后退回原位。看实验 6-1 的侧视动画，绿色的就是送布牙。升和降决定什么时候抓布、放布，进和退决定推多远。关键一句：只有牙在针板上方的那段前进才推动布，在下面退回不碰布。"
      - "What the feed must do was patented by Wilson in 1854: the four-motion feed. The dog rises to grip the cloth, advances carrying it forward, drops below the throat plate and returns to its start. Watch the side view from Lab 6-1; the green part is the feed dog. Rise and drop decide when the cloth is gripped and released; advance and return decide how far. The key point: only the advance above the plate moves the cloth; the return underneath doesn't touch it."

  - layout: split
    title: ["第一条约束：机针在布里，布不能动", "Rule one: no feeding while the needle is in"]
    points:
      - ["布厚 1.5 mm：{{ch06.fin:.1f}}° 入布，{{ch06.fout:.1f}}° 出布", "1.5 mm cloth: in at {{ch06.fin:.1f}}°, out at {{ch06.fout:.1f}}°"]
      - ["剩下约两百度，是送布的全部时间", "The remaining two hundred degrees or so are all the feed gets"]
      - ["针在布中被推：线迹歪，重则断针", "Pushed with the needle in: crooked stitches, or a broken needle"]
    visual: {video: tim}
    notes:
      - "送布受的第一条约束：机针在布里的时候，布不能动。这是时序图，横轴是主轴转角，针尖曲线从上往下扎，灰色底纹是机针在布中的区间。用第 3 讲的曲柄滑块公式，1.5 毫米厚的布，针尖 {{ch06.fin:.1f}} 度入布、{{ch06.fout:.1f}} 度出布，剩下约两百度留给送布。机针在布中时布被推动，轻则线迹歪、针距不匀，重则机针撞上旋梭折断。"
      - "The first constraint: while the needle is in the cloth, the cloth must not move. This is the timing chart; across is the shaft angle, the steep line is the needle point, and the grey band is when the needle is in the cloth. From Lecture 3's slider-crank formula, with 1.5 millimetre cloth the point enters at {{ch06.fin:.1f}} degrees and leaves at {{ch06.fout:.1f}}, leaving about two hundred degrees for the feed. Push the cloth with the needle in, and you get crooked, uneven stitches, or the needle hits the hook and breaks."

