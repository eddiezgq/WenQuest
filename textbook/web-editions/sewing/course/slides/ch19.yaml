      - ["剪线 M15（300 r/min）", "{{ch19.trim_on:.1f}}° ≤ 20°"]
    side: {big: "{{ch19.LS_total}}", text: ["整套 BOM 示意总价（元），机头不计", "Indicative BOM total (yuan), head excluded"]}
    foot: ["1.5 A 驱动器：连续电流 {{ch19.LS_Ic:.2f}} A 超额定，急停回馈 {{ch19.LS_400_E_regen:.1f}} J 远超 30 J——第一次急停就报过压", "1.5 A drive: {{ch19.LS_Ic:.2f}} A exceeds its rating and {{ch19.LS_400_E_regen:.1f}} J far exceeds 30 J, so the first E-stop trips overvoltage"]
    notes:
      - "回到开头的问题。选 400 瓦电机配 3 安驱动器：加速转矩 {{ch19.LS_400_T_acc:.2f}}，不超过 2.56；等效转矩 {{ch19.LS_400_T_rms:.2f}}，不超过 1.27；惯量比 {{ch19.LS_400_ratio:.0f}}。250 瓦两条都不够，550 瓦合格但更贵。更便宜的 1.5 安驱动器，连续电流 {{ch19.LS_Ic:.2f}} 安超额定，急停回馈 {{ch19.LS_400_E_regen:.1f}} 焦也吸收不了。M15 在 300 转下折算 {{ch19.trim_on:.1f}} 度和 {{ch19.trim_off:.1f}} 度，满足 20 度。整套 BOM 示意总价 {{ch19.LS_total}} 元。"
      - "Back to the opening question. Choose the 400-watt motor with the 3-amp drive: acceleration torque {{ch19.LS_400_T_acc:.2f}}, within 2.56; RMS torque {{ch19.LS_400_T_rms:.2f}}, within 1.27; inertia ratio {{ch19.LS_400_ratio:.0f}}. The 250 fails both torque checks; the 550 passes but costs more. The cheaper 1.5-amp drive exceeds its continuous rating at {{ch19.LS_Ic:.2f}} amps and can't absorb the {{ch19.LS_400_E_regen:.1f}}-joule E-stop energy. The M15 takes {{ch19.trim_on:.1f}} and {{ch19.trim_off:.1f}} degrees at 300 r/min, within 20. The whole BOM comes to about {{ch19.LS_total}} yuan."

  - layout: summary
    title: ["本讲小结", "Summary"]
    points:
      - ["五层加机械：同一套模块做出四种原型", "Five layers plus mechanics: one module set, four prototypes"]
      - ["需求 → 判据 → 最便宜合格 → BOM / 接线 / 固件", "Requirements → criteria → cheapest pass → BOM / wiring / firmware"]
      - ["按转角写事件表；SIL、HIL、测试台逐级验证", "Event tables by angle; verify through SIL, HIL and bench"]
    after: ["作业 19 · 测验 · 虚拟实验 19-1 实验报告 —— 在问渠学习平台完成", "Assignment 19 · quiz · Lab 19-1 report — on WenQuest"]
    notes:
      - "这一讲记住三件事。第一，WQ-SC 用五层参考架构加机械，同一套主控、模块和固件框架做出四种原型，差别在主令和执行器组合。第二，快速配套：需求表写数字，按判据算，挑最便宜的合格规格，由同一份数据生成 BOM、接线表和固件配置；别忘了急停回馈和等效转矩。第三，固件按主轴转角写事件表、用状态机管周期，再经软件在环、硬件在环和测试台逐级验证。作业、测验和实验报告在问渠平台完成。"
      - "Three things to remember. One: WQ-SC uses a five-layer reference architecture plus mechanics, building four prototypes from one controller, module set and firmware framework, differing in master and actuator mix. Two: rapid configuration: numbers in the requirements table, compute the criteria, take the cheapest size that passes, and generate BOM, wiring and firmware configuration from the same data, without forgetting E-stop energy and RMS torque. Three: the firmware writes its event table by shaft angle and runs the cycle with a state machine, verified step by step through software in the loop, hardware in the loop and the test bench. The assignment, quiz and lab report are on WenQuest."
