      - "搭一台龙门点胶机器人，流程和 WQ-SC 一样：先写数字化的需求表，行程、速度、加速度、负载质量、重复定位精度；用 T 等于 J α 加 T_f 和惯量比、等效转矩判据给每根轴选伺服或闭环步进，从零件库挑满足判据的最便宜规格，再由同一份数据生成 BOM、I/O 表和控制器配置。点胶阀也不按时间写，而是写成 X 轴走到 120 到 180 毫米之间开阀，这就是运动控制器里的位置凸轮开关，和本讲的角度事件表一一对应。"
      - "Building a gantry glue-dispensing robot follows the same process as WQ-SC. Write a numeric requirements table: stroke, speed, acceleration, payload, repeatability. Size a servo or closed-loop stepper for each axis with T equals J alpha plus T_f and the inertia-ratio and RMS-torque checks, pick the cheapest size in the library that passes, and generate BOM, I/O table and controller configuration from the same data. The glue valve isn't timed either: it's written as open while X is between 120 and 180 millimetres, the position cam switch of a motion controller, a one-to-one match with this lecture's angle event table."

