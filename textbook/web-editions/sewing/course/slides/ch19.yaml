      - "Building your own PC is rapid configuration too. Decide the needs first: which games, which software. Then choose the motherboard, CPU and graphics card by interface and power. Finally add up every part's power, add a margin, and pick the power supply. That's exactly how this lecture sized the 24-volt supply: logic plus hold plus half the boost, times 1.2. And PC builders make the same mistakes: they look only at peak performance, forget the power supply and cooling, and the machine reboots under a heavy load."

