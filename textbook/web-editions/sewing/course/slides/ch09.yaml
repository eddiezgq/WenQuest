      - "Differential feed shows up at home too. Hem a knit T-shirt on a home machine and the edge often comes out wavy. Experienced sewers gently push the fabric towards the needle with their fingers in front of the presser foot as they sew. The fingers are the differential feed dog: feeding in a little extra fabric cancels the stretch caused by the drag of the presser foot."

