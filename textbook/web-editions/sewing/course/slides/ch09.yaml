  - layout: summary
    title: ["本讲小结", "Summary"]
    points:
      - ["504：三根线各管一段，一针三次穿线环", "504: three threads, three loop entries per stitch"]
      - ["下弯针 RSSR：连杆长度不变 → 摆角、传动角", "Lower-looper RSSR: rigid link → swing and transmission angle"]
      - ["差动比 D* = 1 + ε₀/η，波浪高 A ≈ λ√ε/π", "Ratio D* = 1 + ε₀/η; wave height A ≈ λ√ε/π"]
    after: ["作业 9：成缝区与差动送布的校核 · 测验 · 实验 9-1、9-2 —— 在问渠学习平台完成", "Assignment 9: stitch zone and differential feed · quiz · Labs 9-1, 9-2 — on WenQuest"]
    notes:
      - "这一讲记住三件事。第一，504 线迹三根线各管一段，没有死结所以有弹性，一针要三次穿线环，时刻要对，间隙要小。第二，下弯针用空间四杆 RSSR，分析全靠连杆长度不变，得出摆角、角速度和传动角。第三，差动送布：平整差动比 1 加 ε₀ 比 η，波浪高约 λ 根号 ε 除以 π。作业、测验和两个实验都在问渠平台上完成。"
      - "Three things to remember. One: in stitch 504 each of three threads has its own job, with no tight knot, so it stretches; each stitch needs three loop entries, at the right moment and with tiny clearance. Two: the lower looper is driven by a spatial RSSR four-bar, analysed entirely from the constant link length, which gives the swing, angular speed and transmission angle. Three: differential feed, with flat-edge ratio 1 plus epsilon-zero over eta and wave height about lambda root epsilon over pi. The assignment, the quiz and both labs are on WenQuest."
