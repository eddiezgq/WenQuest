          <path d="M300 160 A100 100 0 0 0 334 154" fill="none" stroke="#f2b705" stroke-width="5"/>
          <text x="250" y="210" font-size="34" font-weight="800" fill="#f2b705" class="en">20°</text>
          <text x="200" y="44" font-size="28" font-weight="700" fill="#f3f6fa">机针 <tspan class="en" font-size="20" fill="#8fa3ba">needle</tspan></text>
          <path d="M660 90 L800 475" stroke="#2ec4b6" stroke-width="7" stroke-dasharray="18 10"/>
          <text x="560" y="60" font-size="28" font-weight="700" fill="#5ee0d2">下弯针摆轴 <tspan class="en" font-size="20" fill="#8fa3ba">looper shaft</tspan></text>
          <text x="480" y="290" font-size="30" font-weight="800" fill="#5ee0d2">∥ 平行</text>
          <text x="480" y="324" font-size="22" fill="#8fa3ba" class="en">parallel</text>
          <g font-size="24" fill="#d3deea"><text x="420" y="510">针尖：针板上 9.5 mm</text><text x="420" y="544">　　　针板下 13.5 mm</text></g>
          <text x="40" y="610" font-size="24" fill="#ffb38f">弯针尖在与针垂直的平面里走圆弧：间隙 0.05 mm 保得住</text>
        </svg>
    notes:
      - "为什么把针放斜？最直接的原因在下弯针。下弯针要从针后擦过，而且在针回升那一小段时间里一直贴着针。如果它绕一根和机针平行的轴摆动，弯针尖就在和针垂直的平面里走圆弧，针升到哪里，距离都不变，0.05 毫米的间隙就容易保证。针斜了，摆轴也跟着斜。布厚 1.5 毫米时，针在 {{ch09.enter:.1f}} 度入布、{{ch09.leave:.1f}} 度出布，剩下 {{ch09.outfab:.0f}} 度送布。"
      - "Why slant the needle? The main reason is the lower looper. It must brush past behind the needle and stay close to it while the needle rises. If it swings about an axis parallel to the needle, its point moves on an arc in a plane perpendicular to the needle, so the distance stays the same wherever the needle is, and a 0.05-millimetre clearance is easy to hold. Slant the needle and the shaft slants with it. With 1.5 millimetres of fabric, the needle enters at {{ch09.enter:.1f}} degrees and leaves at {{ch09.leave:.1f}}, leaving {{ch09.outfab:.0f}} degrees for feeding."

  - layout: split
    title: ["下弯针：一个空间四杆机构", "The lower looper: a spatial four-bar"]
    points:
      - ["主轴左右向，摆轴斜 20°：不平行也不相交", "Shaft left–right, swing axis at 20°: neither parallel nor meeting"]
      - ["曲柄 4.36 · 球头连杆 22.48 · 摆杆 22 mm", "Crank 4.36 · ball-joint link 22.48 · rocker 22 mm"]
      - ["转动副—球铰—球铰—转动副：RSSR", "Revolute–spherical–spherical–revolute: RSSR"]
    visual: {video: rssr}
    notes:
      - "下弯针的摆轴和针平行，斜 20 度；主轴是左右方向。两根轴既不平行也不相交，平面四杆机构用不上，只好用空间四杆。曲柄绕主轴转，半径 4.36 毫米；两端是球头的连杆长 22.48；摆杆长 22，绕摆轴摆动。两个转动副、两个球铰，所以叫 RSSR。右边是虚拟实验 9-2 的三维动画。"
      - "The lower-looper shaft is parallel to the needle, at 20 degrees, while the main shaft runs left to right. The two axes neither intersect nor are parallel, so a planar four-bar won't do; it has to be a spatial four-bar. The crank turns with the main shaft, radius 4.36 millimetres; the link with a ball joint at each end is 22.48 long; the rocker, 22 long, swings about the looper shaft. Two revolute joints and two spherical joints: RSSR. On the right is the 3D animation from Virtual Lab 9-2."

  - layout: split
    title: ["摆角怎样算：连杆长度不变", "Finding the swing: the link length is constant"]
    points:
      - ["只用一条约束：|A − B| = b", "One constraint only: |A − B| = b"]
      - ["正负号对应两种装配方式", "The ± sign gives the two assembly modes"]
      - ["粗估 2r/c = {{ch09.rough:.1f}}°，精确 {{ch09.swing:.1f}}°", "Rough 2r/c = {{ch09.rough:.1f}}°, exact {{ch09.swing:.1f}}°"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <rect x="0" y="20" width="900" height="600" rx="26" fill="#0f1a2d" stroke="#22324d" stroke-width="2"/>
          <g font-family="DejaVu Serif, serif" font-style="italic" fill="#f3f6fa" class="en">
            <text x="50" y="120" font-size="46" class="en">|A − B| = b</text>
            <text x="50" y="260" font-size="46" class="en">P cos θ + K sin θ = M</text>
            <text x="50" y="400" font-size="38" class="en">θ = atan2(K, P) ± arccos(M/ρ)</text>
            <text x="50" y="540" font-size="46" class="en" fill="#f2b705">|M| ≤ ρ = √(P² + K²)</text></g>
          <g font-size="24" fill="#8fa3ba"><text x="60" y="165">连杆长度不变 · the link is rigid</text><text x="60" y="305">一次三角方程 · one trigonometric equation</text>
            <text x="60" y="445">两个解 = 两种装配 · two assembly modes</text><text x="60" y="585" fill="#ffb38f">否则装不上：卡死 · otherwise it jams</text></g>
        </svg>
    notes:
      - "摆角的分析全靠一条约束：连杆长度不变，A 到 B 的距离等于 b。把 B 写成摆轴中心加 c 乘摆杆方向，代进去，就得到一个一次三角方程，P cos θ 加 K sin θ 等于 M。解出 θ，有正负两个解，对应两种装配方式。条件是 M 的绝对值不超过根号 P 方加 K 方，否则连杆够不着，机构卡死。粗估摆角 2r 比 c 只有 {{ch09.rough:.1f}} 度，精确是 {{ch09.swing:.1f}} 度。"
      - "The whole analysis rests on one constraint: the link length is constant, so the distance from A to B equals b. Write B as the rocker pivot plus c times the rocker direction, substitute, and you get one trigonometric equation: P cos theta plus K sin theta equals M. It has two solutions, plus and minus, for the two ways of assembling the mechanism. It only has a solution when the absolute value of M is at most the square root of P squared plus K squared; otherwise the link can't reach and the mechanism jams. The rough estimate 2r over c gives {{ch09.rough:.1f}} degrees; the exact swing is {{ch09.swing:.1f}}."

  - layout: bignum
    title: ["7000 r/min 时的下弯针", "The lower looper at 7000 r/min"]
    nums:
      - {n: "{{ch09.wmax:.0f}}", n_en: "rad/s", label: ["最大角速度：尖速约 {{ch09.tip:.1f}} m/s", "Peak angular speed: tip about {{ch09.tip:.1f}} m/s"]}
      - {n: "{{ch09.gmin:.1f}}°", n_en: "min. transmission angle", label: ["最小传动角，经验下限 40°", "Minimum transmission angle; rule of thumb ≥ 40°"]}
      - {n: "{{ch09.rcrit:.1f}}", n_en: "mm", label: ["曲柄半径超过它就卡死", "Crank radius beyond which it jams"]}
    foot: ["dθ/dt = d·Ȧ / (d·t)：分母 d·t → 0 就是死点，速度和受力暴涨", "dθ/dt = d·Ȧ / (d·t): when d·t → 0 it's a dead point, speed and load blow up"]
    notes:
      - "速度怎么求？刚性连杆两端的速度在连杆方向上的分量相等，得到角速度等于 d 点乘 A 点的速度，除以 d 点乘 t。分母趋于零就是死点，速度和受力暴涨。传动角量的就是离死点有多远。算例机 7000 转时，摆杆角速度最大约 {{ch09.wmax:.0f}} 弧度每秒，弯针尖约 {{ch09.tip:.1f}} 米每秒；最小传动角 {{ch09.gmin:.1f}} 度，高于经验下限 40 度。曲柄半径超过约 {{ch09.rcrit:.1f}} 毫米，机构就装不上了。"
      - "How do we get the speed? The two ends of a rigid link have equal velocity components along the link. That gives theta-dot as d dot A-dot over d dot t. When the denominator goes to zero, it's a dead point and speed and load blow up; the transmission angle measures how far we are from it. At 7000 r/min the rocker peaks at about {{ch09.wmax:.0f}} radians per second, the looper tip at about {{ch09.tip:.1f}} metres per second, and the minimum transmission angle is {{ch09.gmin:.1f}} degrees, above the usual 40-degree limit. Beyond a crank radius of about {{ch09.rcrit:.1f}} millimetres, the mechanism can no longer be assembled."

  - layout: lab
    title: ["动手试一试：空间四杆机构 RSSR", "Try it: the RSSR spatial four-bar"]
    shot: {page: rssr}
    tasks:
      - ["只改曲柄半径，让摆角到 30°，和粗估比", "Change only the crank radius to reach a 30° swing; compare with the estimate"]
      - ["移动摆杆位置，让最小传动角 ≥ 60°", "Move the rocker to raise the minimum transmission angle to 60°"]
      - ["逐步加大 r，直到状态栏显示“卡死”", "Increase r until the status bar says it jams"]
    notes:
      - "这个实验在问渠平台上自己做。选“下弯针”预设，先拖着三维视图看清曲柄、球头连杆和摆杆。第一，只改曲柄半径，让摆角到 30 度，再和粗估式 2r 比 c 算出的半径比较。第二，调摆杆沿轴的位置，保持摆角，让最小传动角不小于 60 度。第三，逐步加大 r，直到装不上，记下临界半径。"
      - "Do this lab on WenQuest. Pick the lower-looper preset and rotate the 3D view to see the crank, the ball-joint link and the rocker. One: change only the crank radius until the swing is 30 degrees, and compare the radius with the 2r over c estimate. Two: move the rocker along its axis, keeping the swing, until the minimum transmission angle is at least 60 degrees. Three: keep increasing r until the mechanism can't be assembled, and note the critical radius."

  - layout: section
    num: "04"
    title: ["上弯针、切刀与时序", "The upper looper, the knives and the timing"]

  - layout: split
    title: ["上弯针：绕过布边的那一钩", "The upper looper: a hook round the edge"]
    points:
      - ["路径先竖后横：布边右侧上升，再向左平伸", "Up first, then across: rise beside the edge, then reach left"]
      - ["摆动导杆：导杆在导套里滑动兼摆动", "Oscillating guide bar: slides and swings in its guide"]
      - ["22° 到左上极限，距针 4.3 mm", "At 22° it reaches top left, 4.3 mm from the needle"]
    visual: {video: front}
    notes:
      - "上弯针要绕过布边而不碰布，路径必须先竖后横：在布边右侧竖直上升，高过布面后向左平伸。算例机用摆动导杆：摇杆带着导杆一端摆动，导杆在一个会摆的导套里滑动。导套到摆杆铰点的距离由 44 毫米缩到 21 毫米，轨迹就由竖变横。22 度时到左上极限，离针 4.3 毫米，调机标准是 4 到 4.5。右边是模型的正面视角。"
      - "The upper looper has to wrap round the edge without touching the fabric, so its path must go up first and then across: rising beside the edge, then reaching left above the fabric. The example machine uses an oscillating guide bar: a rocker swings one end of the bar, and the bar slides through a guide that itself pivots. As the distance from the guide to the pivot shrinks from 44 to 21 millimetres, the path turns from vertical to horizontal. At 22 degrees it reaches its top-left limit, 4.3 millimetres from the needle; the setting standard is 4 to 4.5. On the right, the model seen from the front."

  - layout: split
    title: ["两根弯针不能撞：靠不对称", "Keeping the loopers apart: asymmetry"]
    points:
      - ["162.5° 两根弯针最近：两尖相距 1.4 mm", "At 162.5° the loopers are closest: 1.4 mm apart"]
      - ["下弯针向左快、向右慢：余量 0.7 → 1.4 mm", "Lower looper fast left, slow right: margin 0.7 → 1.4 mm"]
      - ["代价是传动角", "The price is transmission angle"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <text x="0" y="60" font-size="26" fill="#8fa3ba">下弯针一转的分配 · one turn of the lower looper</text>
          <rect x="0" y="100" width="421" height="110" rx="16" fill="#4c8dff"/>
          <rect x="429" y="100" width="471" height="110" rx="16" fill="#2ec4b6"/>
          <text x="210" y="168" font-size="38" font-weight="800" fill="#08101d" text-anchor="middle">向左 168.5°</text>
          <text x="664" y="168" font-size="38" font-weight="800" fill="#08101d" text-anchor="middle">向右 191.5°</text>
          <text x="210" y="250" font-size="22" fill="#8fa3ba" text-anchor="middle" class="en">to the left: faster</text>
          <text x="664" y="250" font-size="22" fill="#8fa3ba" text-anchor="middle" class="en">to the right: slower</text>
          <text x="0" y="350" font-size="26" fill="#8fa3ba">162.5° 两尖距离 · closest gap</text>
          <rect x="0" y="380" width="260" height="70" rx="12" fill="#ff7a45"/><text x="280" y="428" font-size="34" font-weight="800" fill="#ffb38f">0.7 mm <tspan font-size="22" font-weight="400" fill="#8fa3ba">对称摆动 · symmetric</tspan></text>
          <rect x="0" y="480" width="520" height="70" rx="12" fill="#2ec4b6"/><text x="540" y="528" font-size="34" font-weight="800" fill="#5ee0d2">1.4 mm</text>
          <text x="0" y="600" font-size="24" fill="#d3deea">不对称 → 时间余量；摆杆上移可换回传动角</text>
        </svg>
    notes:
      - "两根弯针在 162.5 度最靠近，两尖相距 1.4 毫米。这 1.4 毫米是怎么来的？下弯针不是左右对称地摆，向左用 168.5 度，向右用 191.5 度，向左快、向右慢，让出了上弯针穿过的时间。如果对称摆动，各 180 度，余量只剩 0.7 毫米。代价是传动角：把摆杆上移 5 毫米，行程更对称，最小传动角提到 64 度。这是典型的设计取舍。"
      - "The two loopers come closest at 162.5 degrees, 1.4 millimetres apart. Where does that come from? The lower looper doesn't swing symmetrically: it takes 168.5 degrees going left and 191.5 coming back, fast left and slow right, which makes time for the upper looper to pass. With a symmetric swing, 180 each way, the gap would be only 0.7 millimetres. The price is transmission angle: move the rocker up 5 millimetres and the strokes become more even and the minimum angle rises to 64 degrees. A classic design trade-off."

  - layout: split
    title: ["切边：布静止时切", "Trimming: cut while the fabric stands still"]
    points:
      - ["下刀固定：内侧边即切边线，距针 4 mm", "Fixed lower knife: its edge is the cut line, 4 mm from the needle"]
      - ["上刀 180° 最低，正是送布停下的时候", "Upper knife lowest at 180°, while the feed is at rest"]
      - ["两刀贴紧、重叠 0.5–1 mm；磨钝先换上刀", "Knives in contact, 0.5–1 mm overlap; replace the upper first"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <rect x="40" y="330" width="440" height="26" rx="4" fill="#e9dcc0"/>
          <rect x="480" y="330" width="230" height="26" rx="4" fill="#e9dcc0" opacity=".45"/>
          <text x="740" y="420" font-size="22" fill="#8fa3ba">切下的布条</text><text x="740" y="448" font-size="18" fill="#8fa3ba" class="en">trimmed strip</text>
          <path d="M300 120 L300 480" stroke="#c8d2de" stroke-width="10"/><text x="300" y="100" font-size="26" fill="#f3f6fa" text-anchor="middle">机针</text>
          <rect x="480" y="356" width="120" height="200" rx="8" fill="#8fa3ba"/>
          <text x="540" y="600" font-size="26" font-weight="700" fill="#d3deea" text-anchor="middle">下刀（固定）</text>
          <path d="M480 180 L600 160 L600 336 L480 352 Z" fill="#f2b705"/>
          <text x="620" y="200" font-size="26" font-weight="700" fill="#f2b705">上刀 · 行程 6 mm</text>
          <path d="M640 230 L640 300 M628 288 L640 304 L652 288" stroke="#f2b705" stroke-width="5" fill="none"/>
          <path d="M300 420 L480 420" stroke="#ff7a45" stroke-width="4"/><path d="M300 405 L300 435 M480 405 L480 435" stroke="#ff7a45" stroke-width="4"/>
          <text x="390" y="465" font-size="30" font-weight="800" fill="#ff9c75" text-anchor="middle">4 mm</text>
          <text x="40" y="560" font-size="24" fill="#8fa3ba">线迹宽度 = 切边线到针</text>
          <text x="40" y="590" font-size="20" fill="#8fa3ba" class="en">stitch width = knife edge to needle</text>
        </svg>
    notes:
      - "切边机构由上下两把刀组成。下刀固定，它的内侧边就是切边线，离针 4 毫米，正好是线迹宽度。上刀上下运动，行程 6 毫米，最低时越过下刀 0.8 毫米。三个要素：切的时候布要静止，上刀 180 度最低，正好在送布停下的时候；两刀之间没有间隙，靠弹簧贴紧；重叠 0.5 到 1 毫米。下刀用硬质合金或高速钢，磨钝了先换上刀。"
      - "The trimmer has two knives. The lower knife is fixed; its inner edge is the cut line, 4 millimetres from the needle, which is exactly the stitch width. The upper knife moves up and down with a 6-millimetre stroke, passing 0.8 millimetres below the lower knife's edge at the bottom. Three essentials: the fabric must be still while cutting, and the upper knife is lowest at 180 degrees, just when the feed stops; no gap between the knives, held together by a spring; and an overlap of 0.5 to 1 millimetre. The lower knife is carbide or high-speed steel; when they go dull, replace the upper knife first."

  - layout: section
    num: "05"
    title: ["差动送布：让布边不起波浪", "Differential feed: keeping the edge flat"]

  - layout: figure
    title: ["两只送布牙，各走各的", "Two feed dogs, each with its own stroke"]
    h: 520
    visual: {video: feedsweep}
    caption: ["差动比 D = s_d / s 在 0.8 和 1.6 之间来回", "The differential ratio D = s_d / s sweeps between 0.8 and 1.6"]
    notes:
      - "包缝机在针的前后各放一只送布牙。针后面的主送布牙每针送一个针距 s，针前面的差动牙送 s_d，两者之比叫差动比 D。D 大于 1，差动牙多送，把两牙之间的布推挤紧一点，抵消针织布被拉长；D 小于 1，少送，把薄滑的梭织布轻轻拉开。现在 D 在 0.8 和 1.6 之间来回，看两只牙的行程怎样变。"
      - "An overlocker has one feed dog behind the needle and one in front. The main dog behind the needle feeds one stitch length s each stitch; the differential dog in front feeds s_d. Their ratio is the differential ratio D. With D greater than 1, the front dog feeds more and crowds the fabric between the dogs, cancelling the stretch of a knit. With D less than 1 it feeds less and gently pulls a slippery woven apart. Here D sweeps between 0.8 and 1.6; watch how the two strokes change."

  - layout: split
    title: ["布边为什么起波浪", "Why the edge goes wavy"]
    points:
      - ["布被拉长时缝上，松手布缩、线不缩", "Sewn while stretched: the fabric shrinks back, the thread doesn't"]
      - ["平整差动比 D* = 1 + ε₀ / η", "Flat-edge ratio D* = 1 + ε₀ / η"]
      - ["波浪高 A ≈ λ√ε / π", "Wave height A ≈ λ√ε / π"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <path d="M40 200 C 115 80, 190 80, 265 200 S 415 320, 490 200 S 640 80, 715 200 S 865 320, 865 260" fill="none" stroke="#ff7a45" stroke-width="8"/>
          <path d="M40 200 L865 200" stroke="#4b5f7d" stroke-width="3" stroke-dasharray="10 8"/>
          <path d="M265 380 L715 380" stroke="#f2b705" stroke-width="4"/><path d="M265 365 L265 395 M715 365 L715 395" stroke="#f2b705" stroke-width="4"/>
          <text x="490" y="430" font-size="30" font-weight="800" fill="#f2b705" text-anchor="middle">λ 波长 · wavelength</text>
          <path d="M150 110 L150 200" stroke="#2ec4b6" stroke-width="4"/><path d="M135 110 L165 110 M135 200 L165 200" stroke="#2ec4b6" stroke-width="4"/>
          <text x="175" y="160" font-size="30" font-weight="800" fill="#5ee0d2" class="en">A</text>
          <rect x="40" y="480" width="825" height="130" rx="20" fill="#111d31" stroke="#22324d"/>
          <text x="70" y="530" font-size="28" fill="#f3f6fa">缝线比布长 ε → 鼓成正弦波</text>
          <text x="70" y="580" font-size="26" fill="#8fa3ba">弧长多出 (πA/λ)² = ε　→　A ≈ λ√ε/π</text>
        </svg>
    notes:
      - "针织物缝的时候，压脚把上层布向后拖，主送布牙向前拉，布边被拉长了，线迹把这段拉长的布定了型。缝完一松手，布要缩回去，缝线不缩，多出来的长度只好鼓成波浪，俗称荷叶边。简化模型：设差动比 1 时布边拉长 ε₀，牙多走的距离只有 η 传给布，令布边应变为零，得到平整差动比 D* 等于 1 加 ε₀ 比 η。把波浪看成正弦，高度约 λ 根号 ε 除以 π。"
      - "When knit fabric is sewn, the presser foot drags the top ply back and the main dog pulls forward, so the edge is stretched, and the stitches fix it in that stretched state. Let go and the fabric shrinks back, but the thread doesn't, so the extra length bulges into waves, the so-called lettuce or ruffled edge. A simple model: at D equal to 1 the edge stretches by epsilon-zero, and only a fraction eta of the extra dog travel reaches the fabric. Setting the edge strain to zero gives the flat-edge ratio D-star equals 1 plus epsilon-zero over eta. Treat the wave as a sine, and its height is about lambda root epsilon over pi."

  - layout: duo
    title: ["同一块汗布，换一个差动比", "Same jersey, a different ratio"]
    left: {video: edge1, label: ["D = 1.00", "D = 1.00"], note: ["布边起波浪", "Wavy edge"]}
    right: {video: edge12, label: ["D = 1.20", "D = 1.20"], note: ["布边平整", "Flat edge"]}
    notes:
      - "这是虚拟实验 9-1 里缝好的汗布布边。左边差动比 1.0，布边起波浪；右边调到 1.2，波浪基本消失。机器外面的差动调节杆，就是移动差动牙摆杆槽里的滑块，滑块往外，差动比变大。常见高速包缝机的调节范围是 1 比 0.7 到 1 比 2。"
      - "This is the jersey edge as sewn in Virtual Lab 9-1. On the left, ratio 1.0: the edge is wavy. On the right, set to 1.2: the waves have basically gone. The differential lever on the outside of the machine moves a slider in the slotted arm of the differential dog; slide it outwards and the ratio goes up. A typical high-speed overlocker adjusts from 1 to 0.7 up to 1 to 2."

  - layout: lab
    title: ["动手试一试：差动送布", "Try it: differential feed"]
    shot: {page: difffeed}
    tasks:
      - ["汗布：调 D，让布边应变落进绿色带", "Jersey: adjust D until the edge strain falls in the green band"]
      - ["换罗纹、雪纺，各自找平整的 D", "Switch to rib and chiffon; find the flat-edge D for each"]
      - ["故意调过头：做生菜边、收碎褶", "Overdo it on purpose: a lettuce edge, then gathers"]
    notes:
      - "差动送布的实验大家自己做。先选汗布，每次把差动比加 0.05，找出布边应变落进绿色带的那个值，和模型算的比一比。再换罗纹、换雪纺，各找一个让布边平整的差动比，注意雪纺要调到 1 以下。最后故意调过头：汗布调小做生菜边，雪纺调大收碎褶。同一个机构，调在不同位置，既能消除缺陷，也能做出工艺效果。"
      - "Do the differential-feed lab yourselves. Start with jersey, raise the ratio 0.05 at a time, find where the edge strain falls in the green band, and compare with the model. Then switch to rib and to chiffon and find the flat-edge ratio for each; chiffon needs less than 1. Finally overdo it on purpose: turn jersey down for a lettuce edge, and chiffon up for gathers. One mechanism, set differently, can remove a defect or create an effect."

