    foot: ["罗纹误用 D = 1：波浪约 {{ch09.Ar:.1f}} mm；两者都在 1:0.7 到 1:2 的调节范围内", "Rib at D = 1 by mistake: waves about {{ch09.Ar:.1f}} mm; both within the 1:0.7 to 1:2 range"]
    notes:
      - "代数算。汗布差动比为 1 时，布边应变 18%，根号 0.18 约 {{ch09.sqj:.3f}}，波浪高约 30 乘 {{ch09.sqj:.3f}} 除以 π，约 {{ch09.Aj:.1f}} 毫米，一眼就能看出的次品。平整差动比：汗布 1 加 0.18 除以 0.85，约 {{ch09.Dj:.2f}}；罗纹 1 加 0.30 除以 0.80，约 {{ch09.Dr:.2f}}。罗纹如果误用 1，波浪约 {{ch09.Ar:.1f}} 毫米。卫衣布约 {{ch09.Df:.2f}}，雪纺约 {{ch09.Dc:.2f}}，要小于 1。"
      - "Let's put numbers in. Jersey at a ratio of 1 has an edge strain of 18 percent; the square root of 0.18 is about {{ch09.sqj:.3f}}, so the wave height is about 30 times {{ch09.sqj:.3f}} over pi, roughly {{ch09.Aj:.1f}} millimetres: a defect you see at a glance. The flat-edge ratio for jersey is 1 plus 0.18 over 0.85, about {{ch09.Dj:.2f}}; for rib, 1 plus 0.30 over 0.80, about {{ch09.Dr:.2f}}. Rib sewn at 1 by mistake would wave about {{ch09.Ar:.1f}} millimetres high. Fleece needs about {{ch09.Df:.2f}}, and chiffon about {{ch09.Dc:.2f}}, below 1."

  - layout: split
    title: ["机器人联系：Delta 并联机器人", "Robot link: the Delta parallel robot"]
    points:
      - ["每条支链也是转动副—球铰—球铰", "Each leg is also revolute–spherical–spherical"]
      - ["两个解 = 机械臂逆解的“肘上、肘下”", "Two solutions = elbow-up and elbow-down"]
      - ["d·t → 0 是奇异位形；传动角量离奇异多远", "d·t → 0 is a singularity; the transmission angle measures the distance"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <rect x="150" y="40" width="600" height="60" rx="14" fill="#2a3a55"/><text x="450" y="80" font-size="26" fill="#d3deea" text-anchor="middle">固定平台 · base (motors)</text>
          <g stroke="#f2b705" stroke-width="18" stroke-linecap="round"><path d="M230 100 L150 280"/><path d="M450 100 L450 300"/><path d="M670 100 L750 280"/></g>
          <g fill="#08101d" stroke="#f2b705" stroke-width="6"><circle cx="230" cy="100" r="18"/><circle cx="450" cy="100" r="18"/><circle cx="670" cy="100" r="18"/></g>
          <g stroke="#2ec4b6" stroke-width="8"><path d="M140 280 L370 500"/><path d="M165 280 L395 500"/><path d="M440 300 L440 500"/><path d="M462 300 L462 500"/><path d="M740 280 L510 500"/><path d="M765 280 L535 500"/></g>
          <g fill="#2ec4b6"><circle cx="152" cy="280" r="14"/><circle cx="451" cy="300" r="14"/><circle cx="752" cy="280" r="14"/><circle cx="383" cy="500" r="12"/><circle cx="451" cy="500" r="12"/><circle cx="522" cy="500" r="12"/></g>
          <rect x="350" y="500" width="200" height="44" rx="10" fill="#ff7a45"/><text x="450" y="590" font-size="24" fill="#ffb38f" text-anchor="middle">动平台 · moving platform</text>
          <g font-size="30" font-weight="800"><text x="190" y="80" fill="#f2b705" class="en">R</text><text x="80" y="290" fill="#5ee0d2" class="en">S</text><text x="300" y="520" fill="#5ee0d2" class="en">S</text></g>
        </svg>
    notes:
      - "下弯针的 RSSR 只靠“连杆长度不变”一条约束，把主轴转角换成摆角。Delta 并联机器人每条支链也是转动副、球铰、球铰，控制器解的是同一类方程。位置方程有正负两个解，对应两种装配方式，就像机械臂逆解里的肘上、肘下，程序必须选定一种并保持连续。分母 d 点乘 t 趋于零就是奇异位形，机器人设计同样要让工作区远离奇异。"
      - "The lower-looper RSSR turns shaft angle into swing angle with one constraint: the link length is constant. Each leg of a Delta parallel robot is also revolute, spherical, spherical, and its controller solves the same kind of equation. The position equation has a plus and a minus solution, the two assembly modes, just like elbow-up and elbow-down in a robot arm's inverse kinematics; the program must pick one and stay on it. When d dot t goes to zero you're at a singularity, and robot designers likewise keep the working range well away from it."

