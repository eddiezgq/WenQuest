slides:
  - layout: cover
    video: hero
    kicker: ["第 9 讲", "Lecture 9"]
    title: ["包缝机", "The Overlock Machine"]
    sub: ["切边、缝合、锁边，一道完成", "Trim, seam and finish the edge in one pass"]
    notes:
      - "同学们好。拿一件针织 T 恤翻过来看侧缝，布边上包着一排密密的线圈，这就是包缝线迹，是包缝机缝的。这一讲我们看包缝机：它为什么长这个样子，一针要完成几次交接，弯针靠什么机构摆动，还有针织布为什么要两只送布牙。"
      - "Hello everyone. Turn a knitted T-shirt inside out and look at the side seam: the edge is wrapped in a dense row of thread loops. That's an overlock stitch, made by an overlock machine. Today: why the machine looks the way it does, how many hand-overs one stitch needs, what mechanism swings the loopers, and why knit fabric needs two feed dogs."

  - layout: question
    tag: ["车间问题", "Shop-floor problem"]
    title: ["汗布 T 恤侧缝起波浪", "Wavy side seams on jersey T-shirts"]
    facts:
      - ["504 三线包缝合侧缝，差动比一直放在 1.0", "504 three-thread overlock, differential ratio left at 1.0"]
      - ["侧缝布边鼓成波浪，波长约 30 mm", "The seam edge bulges into waves, about 30 mm long"]
      - ["试缝：布边被拉长约 18%，牙多走的只有 0.85 传给布", "Test: the edge stretches about 18%; only 0.85 of extra travel reaches the fabric"]
    notes:
      - "车间问题：一家针织厂用高速三线包缝机合汗布 T 恤侧缝，差动比一直放在 1.0。质检发现侧缝布边鼓成波浪，波长约 30 毫米。试缝测得，差动比为 1 时布边被拉长约 18%，送布牙多走的距离只有约 0.85 能传给布。下周还要缝罗纹领口，罗纹拉长约 30%，传递比例约 0.80。波浪有多高？差动比该调到多少？"
      - "The shop-floor problem. A knitwear factory joins jersey T-shirt side seams on a high-speed three-thread overlocker, with the differential ratio left at 1.0. Inspection finds the seam edge bulging into waves about 30 millimetres long. Test sewing shows the edge stretches about 18 percent at a ratio of 1, and only about 0.85 of the extra dog travel reaches the fabric. Next week they'll sew rib necklines: rib stretches about 30 percent, with a fraction of about 0.80. How high are the waves, and what ratio should each fabric use?"

  - layout: section
    num: "01"
    title: ["为针织而生的机器", "A machine made for knits"]

  - layout: split
    title: ["需求决定结构", "The needs decide the structure"]
    points:
      - ["弹性：汗布可拉长 30% 以上，锁式线迹不能", "Elastic: jersey stretches 30%+; a lockstitch can't"]
      - ["锁边：切齐、缝合、锁边一道完成", "Edge finishing: trim, seam and overcast in one pass"]
      - ["连续高速：大线筒供线，主轴可达 7000 r/min", "Continuous and fast: cone-fed, up to 7000 r/min"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <defs><marker id="n9a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2b705"/></marker></defs>
          <text x="170" y="36" font-size="24" fill="#8fa3ba" text-anchor="middle">需求 · need</text><text x="680" y="36" font-size="24" fill="#8fa3ba" text-anchor="middle">结构 · structure</text>
          <g font-size="30" font-weight="700" fill="#f3f6fa" text-anchor="middle">
            <rect x="0" y="60" width="340" height="110" rx="20" fill="#111d31" stroke="#4b5f7d" stroke-width="3"/><text x="170" y="112">要切边</text>
            <rect x="0" y="200" width="340" height="110" rx="20" fill="#111d31" stroke="#4b5f7d" stroke-width="3"/><text x="170" y="252">要包住布边</text>
            <rect x="0" y="340" width="340" height="110" rx="20" fill="#111d31" stroke="#4b5f7d" stroke-width="3"/><text x="170" y="392">要有弹性</text>
            <rect x="0" y="480" width="340" height="110" rx="20" fill="#111d31" stroke="#4b5f7d" stroke-width="3"/><text x="170" y="532">针织易拉长</text>
            <rect x="460" y="60" width="440" height="110" rx="20" fill="rgba(46,196,182,.12)" stroke="#2ec4b6" stroke-width="3"/><text x="680" y="112">上刀 + 下刀</text>
            <rect x="460" y="200" width="440" height="110" rx="20" fill="rgba(46,196,182,.12)" stroke="#2ec4b6" stroke-width="3"/><text x="680" y="252">上弯针绕过布边</text>
            <rect x="460" y="340" width="440" height="110" rx="20" fill="rgba(46,196,182,.12)" stroke="#2ec4b6" stroke-width="3"/><text x="680" y="392">弯针成圈，不用旋梭</text>
            <rect x="460" y="480" width="440" height="110" rx="20" fill="rgba(46,196,182,.12)" stroke="#2ec4b6" stroke-width="3"/><text x="680" y="532">差动送布</text></g>
          <g font-size="20" fill="#8fa3ba" text-anchor="middle" class="en"><text x="170" y="146" class="en">trim the edge</text><text x="170" y="286" class="en">wrap the edge</text><text x="170" y="426" class="en">stretch</text><text x="170" y="566" class="en">knits stretch</text>
            <text x="680" y="146" class="en">upper and lower knives</text><text x="680" y="286" class="en">upper looper</text><text x="680" y="426" class="en">loopers, no rotary hook</text><text x="680" y="566" class="en">differential feed</text></g>
          <g stroke="#f2b705" stroke-width="5" marker-end="url(#n9a)"><path d="M350 115 L450 115"/><path d="M350 255 L450 255"/><path d="M350 395 L450 395"/><path d="M350 535 L450 535"/></g>
        </svg>
    notes:
      - "T 恤侧缝为什么不用平缝？三个原因。第一是弹性，汗布能拉长 30% 以上，锁式线迹几乎不能伸长，一拉就断。第二是锁边，针织物一剪开就卷边、脱散，包缝机一道工序完成切齐、缝合、锁边。第三是连续高速，线从大线筒直接供给，没有梭芯，主轴能到每分钟 7000 转。这几条需求，决定了包缝机的全部结构。"
      - "Why not sew a T-shirt side seam with a lockstitch? Three reasons. Elasticity: jersey stretches more than 30 percent, while a lockstitch barely stretches and would snap. Edge finishing: a knit edge curls and runs once it's cut, and the overlocker trims, seams and overcasts in one pass. Speed and continuity: thread comes straight from big cones, there's no bobbin, and the shaft reaches 7000 r/min. These needs decide the whole structure of the machine."

  - layout: split
    title: ["整机：一根主轴带动一切", "The whole machine: one shaft drives everything"]
    points:
      - ["机头短，机针向操作者一侧斜 20°", "A short head; the needle leans 20° towards the operator"]
      - ["偏心经球头连杆驱动两根弯针", "Eccentrics drive both loopers through ball-joint links"]
      - ["没有上轴、下轴、同步带：紧凑、转速高", "No upper and lower shafts or belt: compact and fast"]
    visual: {video: whole}
    notes:
      - "把外壳变成透明，可以看到所有机构都挂在一根主轴上。主轴左右贯穿底座，右端是手轮。主轴上的几个偏心，一个经球头连杆推动下弯针摆轴，一个推动上弯针摇杆，送布和切刀也由偏心驱动，针杆由机头里的曲柄带动。和平缝机比，没有上轴、下轴、同步带那套分工，所以结构紧凑，转速能很高。"
      - "Make the housing transparent and you see that every mechanism hangs on one main shaft. It runs left to right through the base, with the handwheel at the right. One eccentric pushes the lower-looper shaft through a ball-joint link, another the upper-looper rocker; feed and knife are driven by eccentrics too, and the needle bar by a crank in the head. There's no upper shaft, lower shaft and timing belt as on a lockstitch machine, so it's compact and can run very fast."

  - layout: split
    title: ["504 三线包缝：三根线各管一段", "Stitch 504: three threads, three jobs"]
    points:
      - ["针线管穿透布料", "The needle thread goes through the fabric"]
      - ["下弯针线管布底到布边，上弯针线管布边到布面", "Lower looper: back to edge; upper looper: edge to face"]
      - ["没有死结，线能在套结处滑动：有弹性", "No tight knot; threads slide at the loops: elastic"]
    visual: {svg: '<svg viewBox="0 0 900 640" width="100%" height="640"><rect x="130" y="50" width="770" height="240" fill="#e9dcc0"/><rect x="130" y="290" width="770" height="60" fill="#b9a57e"/><rect x="130" y="350" width="770" height="230" fill="#d9caa6"/><text x="0" y="175" font-size="30" font-weight="700" fill="#f3f6fa">布面</text><text x="0" y="203" font-size="20" fill="#8fa3ba" class="en">face</text><text x="0" y="326" font-size="30" font-weight="700" fill="#f3f6fa">布边</text><text x="0" y="354" font-size="20" fill="#8fa3ba" class="en">edge</text><text x="0" y="470" font-size="30" font-weight="700" fill="#f3f6fa">布底</text><text x="0" y="498" font-size="20" fill="#8fa3ba" class="en">back</text><path d="M180 90 L250 318 L320 90" fill="none" stroke="#1f9d55" stroke-width="7" stroke-linejoin="round"/><path d="M180 545 L250 322 L320 545" fill="none" stroke="#e0662f" stroke-width="7" stroke-linejoin="round"/><path d="M320 90 L390 318 L460 90" fill="none" stroke="#1f9d55" stroke-width="7" stroke-linejoin="round"/><path d="M320 545 L390 322 L460 545" fill="none" stroke="#e0662f" stroke-width="7" stroke-linejoin="round"/><path d="M460 90 L530 318 L600 90" fill="none" stroke="#1f9d55" stroke-width="7" stroke-linejoin="round"/><path d="M460 545 L530 322 L600 545" fill="none" stroke="#e0662f" stroke-width="7" stroke-linejoin="round"/><path d="M600 90 L670 318 L740 90" fill="none" stroke="#1f9d55" stroke-width="7" stroke-linejoin="round"/><path d="M600 545 L670 322 L740 545" fill="none" stroke="#e0662f" stroke-width="7" stroke-linejoin="round"/><path d="M740 90 L810 318 L880 90" fill="none" stroke="#1f9d55" stroke-width="7" stroke-linejoin="round"/><path d="M740 545 L810 322 L880 545" fill="none" stroke="#e0662f" stroke-width="7" stroke-linejoin="round"/><path d="M180 90 L320 90" stroke="#2c6fd6" stroke-width="8" stroke-linecap="round"/><path d="M320 90 L460 90" stroke="#2c6fd6" stroke-width="8" stroke-linecap="round"/><path d="M460 90 L600 90" stroke="#2c6fd6" stroke-width="8" stroke-linecap="round"/><path d="M600 90 L740 90" stroke="#2c6fd6" stroke-width="8" stroke-linecap="round"/><path d="M740 90 L880 90" stroke="#2c6fd6" stroke-width="8" stroke-linecap="round"/><ellipse cx="180" cy="545" rx="16" ry="11" fill="none" stroke="#2c6fd6" stroke-width="6"/><circle cx="180" cy="90" r="7" fill="#08101d"/><ellipse cx="320" cy="545" rx="16" ry="11" fill="none" stroke="#2c6fd6" stroke-width="6"/><circle cx="320" cy="90" r="7" fill="#08101d"/><ellipse cx="460" cy="545" rx="16" ry="11" fill="none" stroke="#2c6fd6" stroke-width="6"/><circle cx="460" cy="90" r="7" fill="#08101d"/><ellipse cx="600" cy="545" rx="16" ry="11" fill="none" stroke="#2c6fd6" stroke-width="6"/><circle cx="600" cy="90" r="7" fill="#08101d"/><ellipse cx="740" cy="545" rx="16" ry="11" fill="none" stroke="#2c6fd6" stroke-width="6"/><circle cx="740" cy="90" r="7" fill="#08101d"/><ellipse cx="880" cy="545" rx="16" ry="11" fill="none" stroke="#2c6fd6" stroke-width="6"/><circle cx="880" cy="90" r="7" fill="#08101d"/><rect x="0" y="604" width="34" height="12" rx="4" fill="#2c6fd6"/><text x="44" y="618" font-size="24" fill="#d3deea">针线 <tspan class="en" font-size="18" fill="#8fa3ba">needle</tspan></text><rect x="300" y="604" width="34" height="12" rx="4" fill="#e0662f"/><text x="344" y="618" font-size="24" fill="#d3deea">下弯针线 <tspan class="en" font-size="18" fill="#8fa3ba">lower looper</tspan></text><rect x="600" y="604" width="34" height="12" rx="4" fill="#1f9d55"/><text x="644" y="618" font-size="24" fill="#d3deea">上弯针线 <tspan class="en" font-size="18" fill="#8fa3ba">upper looper</tspan></text></svg>'}
    notes:
      - "图里把布边展开来画：上面是布面，中间是布边，下面是翻过来的布底。针线每针穿过布料；下弯针线从布底的针线圈里穿过，斜着走到布边；上弯针线在布边和下弯针线套住，再斜着回到布面，被下一针压住。三根线各管一段，没有死结，受拉时线能在套结处滑动，所以有弹性。514 多一根针，更牢；516 是 401 链缝加 504。"
      - "Here the edge is drawn unfolded: the face on top, the edge in the middle, the back below. The needle thread goes through the fabric every stitch. The lower-looper thread passes through the needle loop on the back and runs to the edge. There it interlocks with the upper-looper thread, which runs back across the face and is held by the next needle stitch. Three threads, three jobs, no tight knot; under tension the threads slide at the loops, so the seam stretches. 514 adds a second needle and is stronger; 516 is a 401 chainstitch plus a 504."

  - layout: section
    num: "02"
    title: ["一针三次“穿线环”", "Three loop entries in one stitch"]

  - layout: bignum
    title: ["三次交接：时刻要对，间隙要小", "Three hand-overs: right moment, tiny clearance"]
    nums:
      - {n: "213.6°", n_en: "gap 0.05 mm", label: ["下弯针尖钻进针线环", "Lower looper enters the needle loop"]}
      - {n: "270.8°", n_en: "gap 0.10 mm", label: ["上弯针穿过下弯针线三角", "Upper looper through the lower-looper triangle"]}
      - {n: "57.5°", n_en: "gap 0.10 mm", label: ["机针穿入上弯针线三角", "Needle through the upper-looper triangle"]}
    foot: ["都是一个“尖”去穿一根线和它的载体之间张开的三角", "Each time a point passes through the triangle between a thread and its carrier"]
    notes:
      - "平缝机一针只有一次关键交接，包缝机一针要三次。第一次，213.6 度，针回升 2.6 毫米，下弯针尖从针后擦过，钻进针线环，间隙 0.05 毫米。第二次，270.8 度，上弯针从下弯针刀身和它的线之间穿过，间隙 0.10。第三次，57.5 度，机针从上弯针刀身和上弯针线之间穿过。共同点：一个尖穿一个三角，时刻要对，间隙要小。"
      - "A lockstitch needs one critical hand-over per stitch; an overlock stitch needs three. First, at 213.6 degrees, with the needle 2.6 millimetres up, the lower-looper point slips behind the needle into the needle loop, with 0.05 millimetres clearance. Second, at 270.8, the upper looper passes between the lower looper's blade and its thread, 0.10 clearance. Third, at 57.5, the needle passes between the upper looper's blade and its thread. Each time, a point goes through a triangle: the timing must be right and the clearance tiny."

  - layout: split
    title: ["成缝区特写：看三次交接", "Close-up of the stitch zone"]
    points:
      - ["针线环、两个线三角，都只张开很短时间", "The loop and both triangles open only briefly"]
      - ["早了还没张开，晚了已经收拢", "Too early, not yet open; too late, already closed"]
      - ["间隙大了漏线环跳针，小了刮伤机针", "Too wide: skipped stitches; too tight: a damaged needle"]
    visual: {video: close}
    notes:
      - "这是模型 9-1 的成缝区特写，主轴慢慢转，蓝线是针尖轨迹。注意看下弯针从右向左摆过来，从针后擦过；上弯针从下面竖直升上来，再翻过布边伸到针的左上方。线环和线三角都只张开很短的时间，早了还没张开，晚了已经收拢；间隙大了，尖从线外滑过去跳针，小了会刮伤甚至打断机针。"
      - "This is the stitch-zone close-up of Model 9-1, with the shaft turning slowly and the needle-point path traced. Watch the lower looper swing from right to left, brushing past behind the needle; the upper looper rises straight up, then reaches over the edge to the upper left of the needle. The loop and the triangles are open only briefly: too early and they're not open yet, too late and they've closed. Too much clearance and the point misses the thread, a skipped stitch; too little and it scrapes or even breaks the needle."

  - layout: section
    num: "03"
    title: ["斜针与下弯针的空间四杆", "The slanted needle and the looper's spatial four-bar"]

  - layout: split
    title: ["机针为什么斜 20°", "Why the needle leans 20°"]
    points:
