# 第 27 讲 数字工厂：缝纫机工厂的整体信息化解决方案 · 课件（第 24 轮新版式）
# 每页一个意思、最多 3 条；中文在上、英文一行在下。版式见 course/tools/build_slides.py 的 LAYOUTS。
# {{ch27.键:格式}} 由课程包程序 course/calc/ch27.py 算出（调用教材模型 figsrc/ch27_model.py），不手写数字。
lesson: 27
code: [ch27]

clips:
  hero:          # 封面：实验 27-1 第①页，测量值和控制图逐台播放（深色显示），放完重放
    page: factory
    selector: "#pageA .col"
    cover: true
    vh: 1300
    loop: 21
    steps:
      - {at: 0, js: "document.documentElement.style.filter='invert(.9) hue-rotate(180deg)';document.getElementById('log').parentElement.style.display='none';document.getElementById('replay').click()"}
  bus:           # 总线上的消息：播放时逐条滚动，放完重放
    page: factory
    selector: "#log"
    vh: 1250
    loop: 21
    steps:
      - {at: 0, press: "#replay"}
  meas:          # 逐台测量值：16 h 播放约 16 s，放完重放（每 21 s 重来一遍）
    page: factory
    selector: "#cv1"
    loop: 21
    steps:
      - {at: 0, press: "#replay"}
  xbar:          # X̄ 图：勾上 R1–R4 再播放
    page: factory
    selector: "#cv2"
    loop: 21
    steps:
      - {at: 0, js: "['rR2','rR3','rR4'].forEach(function(i){var c=document.getElementById(i);if(!c.checked){c.checked=true;c.dispatchEvent(new Event('change'))}});document.getElementById('replay').click()"}
  trace:         # 序列号—批次关系图（R1–R4 那次报警）
    page: factory
    selector: "#graph"
    steps:
      - {at: 0, js: "['rR2','rR3','rR4'].forEach(function(i){var c=document.getElementById(i);if(!c.checked){c.checked=true;c.dispatchEvent(new Event('change'))}})", press: "#tabB"}
  roi:           # 累计现金流：关键设备 OEE 在 64%、68%、72% 之间轮换
    page: factory
    selector: "#cv4"
    loop: 9
    steps:
      - {at: 0, press: "#tabC", set: {oee1: 0.64}}
      - {at: 3, set: {oee1: 0.68}}
      - {at: 6, set: {oee1: 0.72}}

slides:
  - layout: cover
    video: hero
    kicker: ["第 27 讲", "Lecture 27"]
    title: ["数字工厂", "The Digital Factory"]
    sub: ["缝纫机工厂的整体信息化解决方案", "An integrated IT solution for a sewing-machine plant"]
    notes:
      - "同学们好。上一讲我们站在服装厂里看缝纫机联网；这一讲换个位置，站到造缝纫机的工厂里。一家整机厂从接单、设计、加工、装配、调试到售后，信息怎样带着编号一路走下来？背景里是今天的虚拟实验：调试工位逐台测出的间隙，怎样经总线变成控制图和报警。"
      - "Hello everyone. Last time we stood in a garment factory and connected its sewing machines. Today we move to the plant that builds them. From order, design, machining and assembly to adjustment and service, how does information travel through the plant with an ID attached? In the background is today's lab: clearances measured machine by machine at the adjustment station, turned into a control chart and alarms on the bus."

  - layout: question
    tag: ["车间问题", "Shop-floor problem"]
    title: ["梭尖间隙在悄悄变大", "The hook clearance is creeping up"]
    facts:
      - ["逐台测梭尖间隙：均值 0.070 mm、σ 6 μm，公差 0.04–0.10", "Every machine measured: mean 0.070 mm, σ 6 μm, tolerance 0.04–0.10"]
      - ["第 46 台起装新批旋梭，间隙每小时漂移 4 μm", "From machine 46 a new hook lot: clearance drifts 4 μm an hour"]
      - ["现在只在单台超差时开 NCR；第 8 h 发运", "Today an NCR opens only when one unit fails; shipping at hour 8"]
    notes:
      - "先看车间问题。调试工位逐台测梭尖间隙，稳定时均值 0.070 毫米、标准差 6 微米，公差 0.04 到 0.10。从第 46 台起换装一批新旋梭，它磨梭道时砂轮修整间隔被放宽了，间隙每小时漂 4 微米。系统现在只在单台超差时开不合格报告，第 8 小时发货。X̄ 图控制限多少？按超差和按判异规则处理，结果差多少？"
      - "Here's the problem. The adjustment station measures every hook clearance: mean 0.070 millimetres and sigma 6 microns when stable, tolerance 0.04 to 0.10. From machine 46 a new hook lot goes in, ground with a relaxed wheel-dressing interval, and the clearance drifts 4 microns an hour. Today an NCR opens only when one machine fails, and a shipment leaves at hour 8. What are the X-bar limits, and how different is acting on failures from acting on run rules?"

  - layout: section
    num: "01"
    title: ["七个断点与总体架构", "Seven breaks and the overall architecture"]

  - layout: points
    title: ["一张订单，七个断点", "One order, seven breaks"]
    points:
      - ["订单：WQ-LS-TED 200 台，10 天交货", "Order: 200 WQ-LS-TED, due in 10 days"]
      - ["选项靠抄、外协没进 MRP、固件版本没人管", "Options copied by hand, outsourcing missing, firmware unmanaged"]
      - ["停机下班才知道，间隙没人画趋势，追溯查不下去", "Stops found at shift end, no trend chart, traces dead-end"]
    foot: ["共同点：信息都产生过，只是没有带上编号、记在一个能关联的地方", "What they share: the information existed, but never with an ID in one place where it could be linked"]
    notes:
      - "这家整机厂每天装 180 台。早上来了一张订单：WQ-LS-TED 200 台，10 天交货。信息散在表格、纸质工票和测试电脑里，它至少在七处断开：少油旋梭被抄成标准旋梭，DLC 外协没进 MRP，烧哪版固件全凭记忆，瓶颈停机下班才知道，间隙变大没人画图，客户投诉时查不出用的哪批旋梭。"
      - "This plant builds 180 machines a day. An order arrives: 200 WQ-LS-TED, due in ten days. With information scattered over spreadsheets, paper tickets and test PCs, it breaks in at least seven places: the low-oil hook copied as standard, DLC outsourcing missing from MRP, firmware left to memory, a bottleneck stop noticed at shift end, a growing clearance nobody plots, and a complaint nobody can trace to a hook lot."

  - layout: split
    title: ["五层架构，两条规矩", "Five layers, two rules"]
    points:
      - ["历史库原样存下每条消息：唯一事实来源", "The historian keeps every message: the single source of truth"]
      - ["规矩一：组件之间只经总线交换数据", "Rule one: components exchange data only via the bus"]
      - ["规矩二：写操作要人确认，AI 只起草", "Rule two: writes need a human; AI only drafts"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <g font-size="28" fill="#f3f6fa">
            <rect x="10" y="10" width="880" height="100" rx="20" fill="#111d31" stroke="#a78bfa" stroke-width="3"/>
            <text x="40" y="70" font-size="32" font-weight="800" fill="#c4b5fd">看板与 AI</text><text x="330" y="70">简报 · 提醒 · 起草提议</text>
            <rect x="10" y="130" width="880" height="100" rx="20" fill="#111d31" stroke="#4c8dff" stroke-width="3"/>
            <text x="40" y="190" font-size="32" font-weight="800" fill="#8fb6ff">业务系统</text><text x="330" y="190" class="en">ERP · PLM · MES · QMS · WMS</text>
            <rect x="10" y="250" width="880" height="100" rx="20" fill="#111d31" stroke="#2ec4b6" stroke-width="3"/>
            <text x="40" y="310" font-size="32" font-weight="800" fill="#5ee0d2">历史库</text><text x="330" y="310">每条消息原样存下</text>
            <rect x="10" y="370" width="880" height="100" rx="20" fill="rgba(242,183,5,.12)" stroke="#f2b705" stroke-width="4"/>
            <text x="40" y="430" font-size="32" font-weight="800" fill="#ffd75a">统一数据总线</text><text x="330" y="430">只往上发、从上收</text>
            <rect x="10" y="490" width="880" height="100" rx="20" fill="#111d31" stroke="#ff7a45" stroke-width="3"/>
            <text x="40" y="550" font-size="32" font-weight="800" fill="#ff9c75">设备与产线</text><text x="330" y="550">机加工 · 装配 · 调试 · 测试</text>
          </g>
          <text x="450" y="628" font-size="23" fill="#8fa3ba" text-anchor="middle">换掉一层，其他各层不用改</text>
        </svg>
    notes:
      - "整厂信息系统分五层：设备与产线；统一数据总线，所有设备和软件只往上发、从上收；历史库，每条消息原样存下，是唯一的事实来源；ERP、PLM、MES、QMS、WMS；最上面是看板和 AI。两条规矩：组件之间只经总线，换掉一层其他不用改；写操作要人确认，AI 只起草提议。"
      - "The plant's information system has five layers: equipment and lines; the unified data bus, which every machine and program only publishes to and subscribes from; the historian, storing every message as the single source of truth; ERP, PLM, MES, QMS and WMS; and dashboards and AI on top. Two rules: components talk only through the bus, so one layer can change without the others; and writes need a person to confirm, with AI only drafting."

  - layout: figure
    title: ["总线上的消息：只增加、不改动", "Messages on the bus: add, never change"]
    visual: {video: bus}
    caption: ["调试工位逐台发 quality.measurement，附 hook_lot：装的是哪批旋梭", "Each record carries hook_lot: the hook lot fitted"]
    notes:
      - "这是总线上滚动的消息，最新的在上面。缝纫机厂的根主题是 wq/sewing，按“只增加、不改动”新增了装配、测试、服务三个区域。调试工位每测一台就发一条 quality.measurement，data 里除了测量值和上下限，还附一个 hook_lot 字段，记下这台装的是哪批旋梭。后面的追溯全靠它。"
      - "These are the bus messages scrolling past, newest on top. The plant's root topic is wq/sewing, and following 'add, never change' it adds assembly, test and service areas. Each measurement at the adjustment station publishes a quality.measurement; besides the value and limits, data carries a hook_lot field recording which hook lot went in. Every trace later depends on it."

  - layout: section
    num: "02"
    title: ["产品数据与瓶颈", "Product data and the bottleneck"]

  - layout: split
    title: ["机型 × 选项：8 种变型", "Model × options: 8 variants"]
    points:
      - ["T、E、D 三个选项各有各无：2 × 2 × 2", "Options T, E, D, each on or off: 2 × 2 × 2"]
      - ["WQ-LS 作物料模板，T、E、D 作属性", "WQ-LS as an item template, T, E, D as attributes"]
      - ["选项再多：配置器按规则即时生成 BOM", "More options: a configurator builds the BOM by rule"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <rect x="300" y="10" width="300" height="90" rx="20" fill="#111d31" stroke="#f2b705" stroke-width="4"/>
          <text x="450" y="68" font-size="40" font-weight="800" fill="#ffd75a" text-anchor="middle" class="en">WQ-LS</text>
          <g font-size="26" fill="#d3deea">
            <text x="20" y="160">T 自动剪线</text><text x="320" y="160">E 电子针距</text><text x="620" y="160">D 少油旋梭</text>
          </g>
          <g font-size="30" font-weight="700" class="en" text-anchor="middle">
            <rect x="20" y="200" width="200" height="80" rx="16" fill="#111d31" stroke="#4b5f7d" stroke-width="2"/><text x="120" y="252" fill="#d3deea">WQ-LS</text>
            <rect x="240" y="200" width="200" height="80" rx="16" fill="#111d31" stroke="#4b5f7d" stroke-width="2"/><text x="340" y="252" fill="#d3deea">-T</text>
            <rect x="460" y="200" width="200" height="80" rx="16" fill="#111d31" stroke="#4b5f7d" stroke-width="2"/><text x="560" y="252" fill="#d3deea">-E</text>
