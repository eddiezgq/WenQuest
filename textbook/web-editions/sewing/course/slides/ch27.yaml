      - "Swap the sewing machine for a six-axis robot and almost everything carries over. Each joint's reducer lot, motor and encoder serials are scanned and bound to the robot; repeatability and backlash go out as test.result with units. Measure backlash on every robot, and an X-bar chart with run rules spots a drifting reducer lot before failures, then bounds the affected robots. The AI only drafts the freeze."

  - layout: split
    title: ["生活中的例子：按批号召回牛奶", "Everyday example: recalling milk by lot number"]
    points:
      - ["出问题只召回那一批，不是全部下架", "Recall only the bad lot, not every carton"]
      - ["前提：生产时印上批号、记下发往哪些店", "Provided each carton got a lot number and a destination"]
      - ["装配时扫码绑定旋梭批次 = 给整机“印批号”", "Scanning hook lots at assembly = printing lot numbers"]
