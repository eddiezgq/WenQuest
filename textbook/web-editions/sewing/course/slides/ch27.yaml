    notes:
      - "生活里最熟悉的追溯是牛奶召回。超市发现某一批牛奶有问题，会按盒子上印的批号召回，而不是把所有牛奶都下架；前提是每一盒在生产时就印上了批号，还记下了发往哪些门店。缝纫机厂在装配时扫码绑定旋梭批次，就是给每台整机印批号。没有这一步，出了问题只能按时段一大片一大片地圈。"
      - "The traceability everyone knows is a milk recall. When a supermarket finds a problem with one batch, it recalls by the lot number printed on the carton instead of clearing every carton off the shelves. That works only because each carton got a lot number at production and the plant recorded which stores it went to. Scanning the hook lot into each machine at assembly is printing a lot number on every sewing machine. Without it, when something goes wrong you can only bound the problem by time, in big blocks."

  - layout: answer
    tag: ["回到车间问题", "Back to the problem"]
    title: ["用 R1–R4：第 {{ch27.n4}} 台报警，一台没发出去", "With R1–R4: alarm at machine {{ch27.n4}}, nothing shipped"]
    rows:
      - ["X̄ 控制限（mm）", "{{ch27.lcl:.4f}}–{{ch27.ucl:.4f}}"]
      - ["只按超差：第 {{ch27.nt}} 台、{{ch27.tt:.1f}} h", "{{ch27.at}} 台受影响"]
      - ["R1–R4：第 {{ch27.n4}} 台、{{ch27.t4:.1f}} h", "{{ch27.a4}} 台受影响"]
    side: {big: "{{ch27.sht}}", text: ["台已发货：只按超差时", "shipped when acting on failures only"]}
    foot: ["R1–R4：受影响第 46–{{ch27.last4}} 台全在厂内、无一超差，冻结剩余 {{ch27.left4}} 只旋梭", "R1–R4: machines 46–{{ch27.last4}} all still in the plant, none failed; {{ch27.left4}} hooks frozen"]
    notes:
      - "回到开头的问题。控制限 0.070 加减 {{ch27.lim:.1f}} 微米。漂移 4、5、6 小时后单台超差约 {{ch27.p4:.1f}}%、{{ch27.p5:.1f}}%、{{ch27.p6:.0f}}%。只按超差，第一台超差在第 {{ch27.nt}} 台、{{ch27.tt:.1f}} 小时，受影响 {{ch27.at}} 台，已发走 {{ch27.sht}} 台。用 R1 到 R4，第 {{ch27.n4}} 台就报警，受影响 {{ch27.a4}} 台全在厂内，冻结剩余 {{ch27.left4}} 只旋梭。"
      - "Back to our problem. The limits are 0.070 plus or minus {{ch27.lim:.1f}} microns. After 4, 5 and 6 hours a machine fails with probability about {{ch27.p4:.1f}}, {{ch27.p5:.1f}} and {{ch27.p6:.0f}} percent. Acting on failures, the first appears at machine {{ch27.nt}}, {{ch27.tt:.1f}} hours: {{ch27.at}} affected, {{ch27.sht}} shipped. With R1 to R4 the alarm comes at machine {{ch27.n4}}: {{ch27.a4}} affected, all in the plant, and {{ch27.left4}} hooks frozen."

  - layout: summary
    title: ["本讲小结", "Summary"]
    points:
      - ["五层架构：只经总线，写操作要人确认", "Five layers: bus only; writes need a human"]
      - ["X̄ 图加判异规则，在超差之前发现漂移", "X̄ chart and run rules catch drift before failures"]
      - ["扫码绑定批次：向后查原因，向前圈范围", "Scan lots in: trace back to causes, forward to scope"]
    after: ["作业 27：缝纫机厂的瓶颈、质量闭环与备件分析 · 测验 · 虚拟实验 27-1 报告 —— 在问渠学习平台完成", "Assignment 27 · quiz · Lab 27-1 report — on WenQuest"]
    notes:
      - "这一讲记住三件事。第一，七个断点的根源是信息没带编号记在能关联的地方；数字工厂分五层，只经总线，写操作要人确认。第二，X̄ 图控制限是 μ0 加减 3σ 除以根号 n，判异规则在超差前发现漂移，规则越多越早也越易误报。第三，装配扫码绑定批次，向后查原因、向前圈范围。"
      - "Three things to remember. One: the seven breaks come from information without IDs in one linkable place; the digital factory has five layers, talks only through the bus, and needs a person to confirm writes. Two: X-bar limits are mu-zero plus or minus three sigma over root n; run rules catch drift before failures, earlier with more rules but with more false alarms. Three: scan lots in at assembly to trace back to causes and forward to the scope."
