          <g font-size="26" font-weight="700" fill="#f3f6fa" text-anchor="middle">
            <rect x="10" y="80" width="220" height="90" rx="18" fill="#111d31" stroke="#ff7a45" stroke-width="3"/><text x="120" y="135">缝纫机 l03-06</text>
            <rect x="10" y="275" width="220" height="90" rx="18" fill="#111d31" stroke="#ff7a45" stroke-width="3"/><text x="120" y="330">缝纫机 l03-07</text>
            <rect x="10" y="470" width="220" height="90" rx="18" fill="#111d31" stroke="#ff7a45" stroke-width="3"/><text x="120" y="525">缝纫机 l03-08</text>
            <rect x="670" y="80" width="220" height="90" rx="18" fill="#111d31" stroke="#a78bfa" stroke-width="3"/><text x="780" y="135">车间看板</text>
            <rect x="670" y="275" width="220" height="90" rx="18" fill="#111d31" stroke="#a78bfa" stroke-width="3"/><text x="780" y="330">历史库</text>
            <rect x="670" y="470" width="220" height="90" rx="18" fill="#111d31" stroke="#a78bfa" stroke-width="3"/><text x="780" y="525">MES 桥接</text>
          </g>
          <circle cx="450" cy="320" r="110" fill="rgba(76,141,255,.15)" stroke="#4c8dff" stroke-width="4"/>
          <text x="450" y="310" font-size="34" font-weight="800" fill="#8fb6ff" text-anchor="middle">MQTT</text>
          <text x="450" y="350" font-size="30" font-weight="700" fill="#8fb6ff" text-anchor="middle">代理</text>
          <g stroke="#ff7a45" stroke-width="4" fill="none" marker-end="url(#m26)">
            <path d="M232 125 L345 260"/><path d="M232 320 L336 320"/><path d="M232 515 L345 380"/></g>
          <g stroke="#a78bfa" stroke-width="4" fill="none" marker-end="url(#m26)">
            <path d="M555 260 L666 125"/><path d="M562 320 L666 320"/><path d="M555 380 L666 515"/></g>
          <text x="230" y="620" font-size="28" fill="#ff9c75" text-anchor="middle">发布 publish</text>
          <text x="680" y="620" font-size="28" fill="#c4b5fd" text-anchor="middle">订阅 subscribe</text>
          <text x="450" y="40" font-size="24" fill="#8fa3ba" text-anchor="middle">双方互不认识</text>
        </svg>
    notes:
      - "车间联网用得最多的协议之一是 MQTT，它像一个邮局：设备把消息发布到一个主题上，比如“3 号线 7 号工位 / 状态”，不关心谁来收；看板、MES、数据库各自订阅，由代理转发。双方互不认识，加看板、换数据库，设备一侧都不用改。消息头很小，无线和小模块也跑得动。"
      - "One of the most used protocols on the floor is MQTT, which works like a post office. A machine publishes to a topic, say 'line 3 station 7 / status', without caring who reads it; dashboards, MES and databases each subscribe, and a broker forwards. Neither side knows the other, so adding a dashboard or a database changes nothing on the machines. The headers are tiny, so Wi-Fi and small modules cope."

  - layout: split
    title: ["服务质量：计数和事件用 QoS 1", "Quality of service: counters and events use QoS 1"]
    points:
      - ["QoS 1 至少送一次，可能重复", "QoS 1 delivers at least once, so it may duplicate"]
      - ["按消息里自带的唯一编号去重", "De-duplicate by the unique ID inside the message"]
      - ["报文标识符会重复使用，不能拿来去重", "Packet identifiers get reused, so they can't de-duplicate"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <g>
            <rect x="10" y="20" width="880" height="170" rx="24" fill="#111d31" stroke="#4b5f7d" stroke-width="3"/>
            <text x="50" y="100" font-size="56" font-weight="800" fill="#8fa3ba" class="en">0</text>
            <text x="130" y="88" font-size="34" font-weight="700" fill="#f3f6fa">最多送一次</text>
            <text x="130" y="140" font-size="27" fill="#8fa3ba">可能丢</text>
          </g>
          <g>
            <rect x="10" y="230" width="880" height="170" rx="24" fill="rgba(242,183,5,.10)" stroke="#f2b705" stroke-width="4"/>
            <text x="50" y="310" font-size="56" font-weight="800" fill="#f2b705" class="en">1</text>
            <text x="130" y="298" font-size="34" font-weight="700" fill="#f3f6fa">至少送一次</text>
            <text x="130" y="350" font-size="27" fill="#ffd75a">可能重复 → 接收方去重</text>
            <rect x="620" y="282" width="240" height="66" rx="33" fill="#f2b705"/>
            <text x="740" y="326" font-size="27" font-weight="800" fill="#0b1220" text-anchor="middle">计数 · 事件</text>
          </g>
          <g>
            <rect x="10" y="440" width="880" height="170" rx="24" fill="#111d31" stroke="#4b5f7d" stroke-width="3"/>
            <text x="50" y="520" font-size="56" font-weight="800" fill="#8fa3ba" class="en">2</text>
            <text x="130" y="508" font-size="34" font-weight="700" fill="#f3f6fa">恰好一次</text>
            <text x="130" y="560" font-size="27" fill="#8fa3ba">开销最大</text>
          </g>
        </svg>
    notes:
      - "MQTT 的服务质量分三级：0 级最多送一次，可能丢；1 级至少送一次，可能重复；2 级恰好一次，开销最大。计数和事件一般用 1 级。会重复，接收方就要按消息内容里自带的唯一编号去重；MQTT 报文的标识符会重复使用，不能拿来去重。累计值在这里又帮了忙：重复一条也不会多算。"
      - "MQTT has three levels of service. QoS 0 delivers at most once and may lose; QoS 1 at least once and may duplicate; QoS 2 exactly once, at the highest cost. Counters and events normally use QoS 1, so the receiver de-duplicates by the unique ID inside the message; the packet identifier gets reused and can't do that job. Cumulative counters help again: a duplicate never double-counts."

  - layout: split
    title: ["保留、遗嘱和通配符", "Retained messages, wills and wildcards"]
    points:
      - ["保留：新开的看板马上拿到当前状态", "Retained: a new dashboard gets current state at once"]
      - ["遗嘱：心跳超时，代理替它发“离线”", "Will: on keep-alive timeout the broker says 'offline'"]
      - ["+ 匹配一层；# 匹配其后所有层", "+ matches one level; # matches all levels below"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <g font-size="30" fill="#f3f6fa" class="en">
            <text x="20" y="50" font-weight="800">wq</text>
            <path d="M40 62 L40 112 L80 112" stroke="#4b5f7d" stroke-width="3" fill="none"/>
            <text x="90" y="122" font-weight="700">shirt</text>
            <path d="M110 134 L110 184 L150 184" stroke="#4b5f7d" stroke-width="3" fill="none"/>
            <text x="160" y="194" font-weight="700" fill="#8fb6ff">sewing</text>
            <path d="M180 206 L180 256 L220 256 M180 256 L180 556 L220 556" stroke="#4b5f7d" stroke-width="3" fill="none"/>
            <text x="230" y="266" font-weight="800" fill="#ff9c75">l03-07</text>
            <path d="M250 278 L250 320 L290 320 M250 320 L250 380 L290 380 M250 380 L250 440 L290 440 M250 440 L250 500 L290 500" stroke="#4b5f7d" stroke-width="3" fill="none"/>
            <text x="300" y="330" fill="#ffd75a" font-weight="700">status</text>
            <text x="300" y="390">event</text>
            <text x="300" y="450">counter</text>
            <text x="300" y="510">cmd</text>
            <text x="230" y="566" fill="#8fa3ba">l03-08 …</text>
          </g>
          <rect x="440" y="300" width="440" height="50" rx="12" fill="rgba(242,183,5,.14)"/>
          <text x="455" y="334" font-size="24" fill="#ffd75a">保留 · 遗嘱 → offline</text>
          <rect x="400" y="40" width="490" height="190" rx="22" fill="#111d31" stroke="#2ec4b6" stroke-width="3"/>
          <text x="420" y="88" font-size="26" fill="#5ee0d2">看板订阅全车间状态</text>
          <text x="420" y="140" font-size="27" font-weight="700" fill="#f3f6fa" class="en">wq/shirt/sewing/<tspan fill="#f2b705">+</tspan>/status</text>
          <text x="420" y="196" font-size="27" font-weight="700" fill="#f3f6fa" class="en">wq/shirt/<tspan fill="#f2b705">#</tspan></text>
          <text x="660" y="196" font-size="22" fill="#8fa3ba">历史库全收</text>
        </svg>
    notes:
      - "MQTT 有几个功能车间特别有用。保留消息：代理为每个主题存最新一条，新开的看板马上拿到每台机器的当前状态。遗嘱消息：设备连接时预留“我掉线了”，心跳超时后代理替它发出，看板显示离线；正常下线不会触发，要自己先发。通配符：加号匹配一层，井号匹配其后所有层。"
      - "A few MQTT features matter on the floor. Retained messages: the broker keeps the latest per topic, so a newly opened dashboard gets every machine's state at once. Will messages: left at connect time, sent by the broker when the keep-alive times out, so the dashboard shows 'offline'; a clean disconnect doesn't fire it, so publish offline yourself. Wildcards: plus matches one level, hash everything below."

  - layout: split
    title: ["统一命名空间与消息信封", "The unified namespace and the message envelope"]
    points:
      - ["主题按 ISA-95 层级：工厂/车间/工位/类别", "Topics follow ISA-95: plant/area/station/category"]
      - ["代理成为全厂唯一的实时数据源", "The broker becomes the plant's single real-time source"]
      - ["仿真和真实设备只差 source 一个字段", "Simulated and real machines differ only in source"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <text x="10" y="36" font-size="24" fill="#8fa3ba" class="en">wq/shirt/sewing/l03-07/counter</text>
          <rect x="10" y="56" width="880" height="576" rx="22" fill="#0d1626" stroke="#22324d" stroke-width="2"/>
          <g font-size="26" fill="#d3deea" font-family="DejaVu Sans Mono, monospace">
            <text x="40" y="100">{</text>
            <text x="70" y="140"><tspan fill="#8fb6ff">"v"</tspan>: 1,  <tspan fill="#8fb6ff">"id"</tspan>: "5f1c…",</text>
            <text x="70" y="180"><tspan fill="#8fb6ff">"ts"</tspan>: "…T03:15:00.000Z",</text>
            <text x="70" y="220"><tspan fill="#8fb6ff">"type"</tspan>: "machine.counter",</text>
            <text x="70" y="260"><tspan fill="#8fb6ff">"source"</tspan>: <tspan fill="#ff9c75">"plc/l03-07"</tspan>,</text>
            <text x="70" y="300"><tspan fill="#8fb6ff">"mode"</tspan>: "prod",</text>
            <text x="70" y="340"><tspan fill="#8fb6ff">"corr"</tspan>: "WO-2026-00231",</text>
            <text x="70" y="380"><tspan fill="#ffd75a">"data"</tspan>: {</text>
            <text x="110" y="420"><tspan fill="#5ee0d2">"pieces_total"</tspan>: 285,</text>
            <text x="110" y="460"><tspan fill="#5ee0d2">"trims_total"</tspan>: 874,</text>
            <text x="110" y="500"><tspan fill="#5ee0d2">"run_time_s"</tspan>: 3586, …</text>
            <text x="70" y="540">}</text>
            <text x="40" y="580">}</text>
          </g>
          <path d="M600 120 L620 120 L620 350 L600 350" stroke="#8fb6ff" stroke-width="4" fill="none"/>
          <text x="640" y="232" font-size="30" font-weight="800" fill="#8fb6ff">信封</text>
          <text x="640" y="268" font-size="22" fill="#8fa3ba" class="en">envelope</text>
          <path d="M600 395 L620 395 L620 520 L600 520" stroke="#5ee0d2" stroke-width="4" fill="none"/>
          <text x="640" y="452" font-size="28" font-weight="800" fill="#5ee0d2">累计值</text>
          <text x="640" y="488" font-size="22" fill="#8fa3ba">单位写进字段名</text>
        </svg>
    notes:
      - "主题怎样命名，决定数据好不好找。按 ISA-95 层级，工厂、车间、工位、类别一层层往下，所有系统都在这棵主题树上收发，叫统一命名空间，代理就成了全厂唯一的实时数据源。问渠的每条消息是统一的 JSON：外层信封有版本、编号、时间、类型、来源，业务放 data。仿真和真实设备只差 source。"
      - "How topics are named decides how easy data are to find. Follow ISA-95, plant, area, station, category, and have every system use one topic tree: the unified namespace, which makes the broker the plant's single real-time source. Every WenQuest message is the same JSON: an envelope with version, ID, time, type and source, and the business content in data. Simulated and real machines differ only in source."

  - layout: points
    title: ["OPC UA：带说明书的数据", "OPC UA: data that come with a manual"]
    points:
      - ["每个数据点带名称、单位、类型和所属部件", "Every data point carries name, unit, type and component"]
      - ["设备→网关→平台：量大、网差，多用 MQTT", "Machine→gateway→platform: high volume, so mostly MQTT"]
      - ["要被浏览、读写参数的设备：用 OPC UA", "Equipment to be browsed and written: OPC UA"]
    foot: ["缝纫机还没有专门的配套规范，可先用 Machinery 通用模型描述识别和状态", "There is no companion specification for sewing machines yet; use the generic Machinery model for identity and state"]
    notes:
      - "另一种常用标准是 OPC UA，它不只传数值，还传“这个数是什么”：名称、单位、类型和所属部件，客户端连上就能浏览整个模型。两者不互相排斥：设备到网关到平台，数据量大、网络差，多用 MQTT；要被浏览、读写参数的高端设备和系统之间对接，用 OPC UA。缝纫机量大、数据简单，MQTT 往往就够了。"
      - "The other common standard is OPC UA, which sends not just values but what they mean: name, unit, type and component, and a client can browse the whole model. They aren't rivals. Machine to gateway to platform, with heavy traffic and poor networks, usually MQTT; equipment whose parameters must be browsed and written, and system-to-system links, OPC UA. For numerous, simple sewing machines, MQTT is often enough."

  - layout: section
    num: "03"
    title: ["数据量与指标", "Data volume and metrics"]

  - layout: bignum
    title: ["一台平缝机，一个班次", "One lockstitch machine, one shift"]
    nums:
      - {n: "{{ch26.pieces:.0f}} 件", n_en: "pieces", label: ["实际做的件数", "Pieces actually made"]}
      - {n: "{{ch26.run:.0f}} min", n_en: "spindle time", label: ["主轴真正转动的时间", "Time the spindle really turns"]}
      - {n: "{{ch26.kst:.0f}} 万针", n_en: "{{ch26.kst:.0f}}0 000 stitches", label: ["剪线约 {{ch26.trims:.0f}} 次", "About {{ch26.trims:.0f}} trims"]}
    foot: ["每针一条：{{ch26.stitch_per:.0f}} 条/班；每分钟汇总一条：{{ch26.minute_per:.0f}} 条/班 —— 相差约 {{ch26.shrink:.0f}} 倍", "One per stitch: {{ch26.stitch_per:.0f}} a shift; one per minute: {{ch26.minute_per:.0f}} — about {{ch26.shrink:.0f}} times fewer"]
    notes:
      - "先算一台机器。这台平缝机一个班次缝约 {{ch26.pieces:.0f}} 件，主轴转约 {{ch26.run:.0f}} 分钟，平均每分钟 3000 针，约 {{ch26.kst:.0f}} 万针，剪线约 {{ch26.trims:.0f}} 次。每针报一条，一班三十几万条；每次踏板和剪线报一条，约 {{ch26.segment_per:.0f}} 条；每分钟汇总一条，约 {{ch26.minute_per:.0f}} 条。差了好几百倍。"
      - "Start with one machine. In a shift it makes about {{ch26.pieces:.0f}} pieces, the spindle turns about {{ch26.run:.0f}} minutes at 3000 stitches a minute, roughly {{ch26.kst:.0f}}0 thousand stitches, with about {{ch26.trims:.0f}} trims. One message per stitch: over three hundred thousand a shift. Per pedal action and trim: about {{ch26.segment_per:.0f}}. One summary a minute: about {{ch26.minute_per:.0f}}. Hundreds of times apart."

  - layout: figure
    title: ["乘到 500 台：边缘汇总，事件即报", "Times 500: aggregate at the edge, report events at once"]
    visual: {video: rate}
    caption: ["每针上报一年 {{ch26.stitch_tb:.0f}} TB；计数每件或每分钟汇总、状态变化即报：约 {{ch26.minute_gb:.0f}}–{{ch26.piece_gb:.0f}} GB", "Per stitch {{ch26.stitch_tb:.0f}} TB/yr; aggregated + events: {{ch26.minute_gb:.0f}}–{{ch26.piece_gb:.0f}} GB/yr"]
    notes:
      - "乘到 500 台、两班、每年 300 天、每条 250 字节，图里五种方式轮流选一遍，纵坐标是对数。每针上报一年约 {{ch26.stitch_tb:.0f}} TB，大部分没人看；每 10 分钟汇总又太慢，停机 10 分钟后才显示。合理的是计数在边缘汇总、状态变化立即报，一年约 {{ch26.minute_gb:.0f}} 到 {{ch26.piece_gb:.0f}} GB，停机 5 秒内显示。"
      - "Now 500 machines, two shifts, 300 days, 250 bytes a message; the chart cycles through the five strategies on a log scale. Every stitch: about {{ch26.stitch_tb:.0f}} terabytes a year, mostly unread. Every ten minutes: stoppages show ten minutes late. The sensible way aggregates counters at the edge and reports state changes at once: about {{ch26.minute_gb:.0f}} to {{ch26.piece_gb:.0f}} gigabytes a year, with stoppages shown within 5 seconds."

  - layout: bignum
    title: ["设备综合效率 OEE = A × P × Q", "Overall equipment effectiveness: OEE = A × P × Q"]
    nums:
      - {n: "{{ch26.A:.1f}}%", n_en: "A · availability", label: ["时间开动率：扣掉停机", "Deducts stoppages"]}
      - {n: "{{ch26.P:.1f}}%", n_en: "P · performance", label: ["性能开动率：扣掉速度损失", "Deducts speed loss"]}
      - {n: "{{ch26.Q:.1f}}%", n_en: "Q · quality", label: ["合格品率：扣掉返修", "Deducts rework"]}
    foot: ["OEE ≈ {{ch26.OEE:.1f}}% = 合格件数 × 标准工时 ÷ 计划时间", "OEE ≈ {{ch26.OEE:.1f}}% = good pieces × standard minute ÷ planned time"]
    notes:
      - "衡量一个工位的综合表现用 OEE，它把损失分三类。A 扣停机：等活、故障、断线约 {{ch26.nb:.0f}} 次，450 分钟里运行约 {{ch26.oper:.0f}} 分钟，A 约 {{ch26.A:.1f}}%。P 扣速度损失：应做 {{ch26.due:.0f}} 件，实做 {{ch26.pieces:.0f}} 件，P 是 {{ch26.P:.0f}}%。Q 扣返修，{{ch26.Q:.0f}}%。三者相乘约 {{ch26.OEE:.1f}}%。"
      - "OEE measures a station overall by splitting its losses three ways. A deducts stoppages: waiting, faults and about {{ch26.nb:.0f}} thread breaks leave about {{ch26.oper:.0f}} of 450 minutes, A about {{ch26.A:.1f}} percent. P deducts speed loss: {{ch26.due:.0f}} pieces due, {{ch26.pieces:.0f}} made, P {{ch26.P:.0f}} percent. Q deducts rework: {{ch26.Q:.0f}} percent. Multiplied: about {{ch26.OEE:.1f}} percent."

  - layout: figure
    title: ["一个班次的时间去了哪里", "Where the shift's time went"]
    visual: {video: waterfall}
    caption: ["速度损失约 {{ch26.speed:.0f}} min，最大；其次等活 25 min、故障 12 min", "Speed loss about {{ch26.speed:.0f}} min, the biggest; then waiting and faults"]
    notes:
      - "这是 OEE 瀑布图：从 450 分钟计划时间一级级扣掉等活、故障、断线，得到运行时间；再扣速度损失和返修，剩下绿色的合格品时间约 {{ch26.good_min:.0f}} 分钟。最大的损失是速度，约 {{ch26.speed:.0f}} 分钟。提醒一点：P 用的标准工时含手工拿放，衡量的是操作效率，手工工位的 OEE 不能和自动设备直接比。"
      - "This is the OEE waterfall: from 450 planned minutes, step down through waiting, faults and thread breaks to running time, then through speed loss and rework to the green good-output time, about {{ch26.good_min:.0f}} minutes. The biggest loss is speed, about {{ch26.speed:.0f}} minutes. One caution: P uses a standard minute that includes handling, so it measures operator efficiency, and a manual station's OEE can't be compared directly with a machine's."

  - layout: split
    title: ["缝纫时间比例：最容易误读的数", "Sewing-time ratio: the easiest number to misread"]
