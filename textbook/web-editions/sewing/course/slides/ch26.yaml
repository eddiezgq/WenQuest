# 第 26 讲 设备联网与数字孪生 · 课件（第 24 轮新版式）
# 每页一个意思、最多 3 条；中文在上、英文一行在下。版式见 course/tools/build_slides.py 的 LAYOUTS。
# {{ch26.键:格式}} 由课程包程序 course/calc/ch26.py 算出，不手写数字。
lesson: 26
code: [ch26]

clips:
  hero:          # 封面：实验 26-1 第①页，事件流每 3 秒换一段（深色显示）
    page: iot
    selector: "#pageA .col"
    cover: true
    vh: 1300
    loop: 3
    steps:
      - {at: 0, js: "document.documentElement.style.filter='invert(.9) hue-rotate(180deg)';document.getElementById('msgjson').parentElement.style.display='none';document.getElementById('rerun').click()"}
  events:        # 一刻钟的事件流：每 4 秒换一段
    page: iot
    selector: "#tl"
    loop: 4
    steps:
      - {at: 0, press: "#rerun"}
  rate:          # 第②页：五种上报方式轮流选中
    page: iot
    selector: "#rate"
    loop: 15
    steps:
      - {at: 0, press: "#tabB", js: "var m=document.getElementById('mode');m.value='stitch';m.dispatchEvent(new Event('input'))"}
      - {at: 3, js: "var m=document.getElementById('mode');m.value='segment';m.dispatchEvent(new Event('input'))"}
      - {at: 6, js: "var m=document.getElementById('mode');m.value='piece';m.dispatchEvent(new Event('input'))"}
      - {at: 9, js: "var m=document.getElementById('mode');m.value='minute';m.dispatchEvent(new Event('input'))"}
      - {at: 12, js: "var m=document.getElementById('mode');m.value='tenmin';m.dispatchEvent(new Event('input'))"}
  waterfall:     # OEE 瀑布：标准工况
    page: iot
    selector: "#wf"
    steps:
      - {at: 0, press: "#resetA"}
  mirror:        # 数字孪生第一层：吊挂线实时状态（实验 12-2，自己循环）
    page: hang
    selector: "#rail"
    steps:
      - {at: 0, js: "var p=document.getElementById('playA');if(p.textContent.indexOf('暂停')<0)p.click()"}
  predict:       # 第二层：产线仿真快进一个班，下班后重新开工
    page: line
    selector: "#cv"
    vh: 1400
    loop: 27
    steps:
      - {at: 0, press: ["#restart", "[data-s='20']"], js: "var p=document.getElementById('play');if(p.getAttribute('aria-pressed')==='false')p.click()"}

slides:
  - layout: cover
    video: hero
    kicker: ["第 26 讲", "Lecture 26"]
    title: ["设备联网与数字孪生", "Connected Machines and Digital Twins"]
    sub: ["把锁在机器里的数字，变成车间看得懂的指标", "Turning the numbers locked in each machine into figures the floor can read"]
    notes:
      - "同学们好。前面几讲的电控缝纫机，控制器其实知道很多事：主轴转了多久、缝了多少针、剪了几次线、有没有断线。可这些数字一直锁在每台机器里。这一讲讲怎样把它们送出来：采什么、怎么送、送多少、算什么，最后再看数字孪生、远程运维和安全。"
      - "Hello everyone. The electronically controlled machines of the last few lectures know a great deal: how long the spindle ran, how many stitches, how many trims, whether the thread broke. But those numbers stay locked inside each machine. Today we get them out: what to collect, how to send it, how much, and what to calculate. Then digital twins, remote service and security."

  - layout: question
    tag: ["车间问题", "Shop-floor problem"]
    title: ["7 号工位一个班次，到底做了多少件？", "Station 7, one shift: how many pieces, really?"]
    facts:
      - ["班次 480 min、休息 30 min；标准工时 0.6 min/件，效率 85%", "480 min shift, 30 min break; 0.6 min/piece standard, 85% efficiency"]
      - ["等活 25 min、故障 12 min；断线每小时 1.5 次，3% 返修", "Waiting 25 min, faults 12 min; 1.5 thread breaks an hour, 3% rework"]
      - ["每件 3 段、每段剪线；车间打算按剪线次数数件", "3 seams a piece, each trimmed; the shop plans to count by trims"]
    notes:
      - "先看车间问题。一条衬衫线给 7 号工位的平缝机装了联网模块。班次 480 分钟、休息 30，标准工时 0.6 分一件，效率 85%；等活 25 分钟、故障 12 分钟，断线每小时 1.5 次，3% 返修。车间打算按剪线次数数件。实际做了多少件？OEE 多少？剪线数件差多少？500 台每针都上报，一年存多少数据？最后回答。"
      - "Here's the problem. A shirt line fits a connectivity module to the lockstitch machine at station 7. A 480-minute shift with a 30-minute break, 0.6 standard minutes a piece, 85 percent efficiency; 25 minutes waiting, 12 of faults, 1.5 thread breaks an hour, 3 percent rework. The shop plans to count pieces by trims. How many pieces really? What OEE? How far off is the trim count? And if 500 machines reported every stitch, how much data a year? We'll answer at the end."

  - layout: section
    num: "01"
    title: ["数据从哪来、怎样组织", "Where the data come from and how to organise them"]

  - layout: split
    title: ["控制器知道的，和它不知道的", "What the controller knows, and what it doesn't"]
    points:
      - ["转速、针数、剪线、断线、故障码：本来就有", "Speed, stitches, trims, breaks, fault codes: already there"]
      - ["谁在缝：上班刷一下工卡", "Who is sewing: a badge swipe at the start"]
      - ["缝哪一件：工票条码或衣架编号", "Which piece: a ticket barcode or the hanger ID"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <rect x="10" y="20" width="420" height="440" rx="26" fill="#111d31" stroke="#2ec4b6" stroke-width="3"/>
          <text x="220" y="74" font-size="34" font-weight="800" fill="#5ee0d2" text-anchor="middle">控制器已经知道</text>
          <text x="220" y="106" font-size="22" fill="#8fa3ba" text-anchor="middle" class="en">already in the controller</text>
          <g font-size="30" fill="#f3f6fa">
            <text x="50" y="170">● 主轴启停、转速</text>
            <text x="50" y="225">● 针数（每转一针）</text>
            <text x="50" y="280">● 剪线、倒缝、抬压脚</text>
            <text x="50" y="335">● 断线（有检测的机型）</text>
            <text x="50" y="390">● 故障码、参数</text>
          </g>
          <text x="220" y="440" font-size="24" fill="#5ee0d2" text-anchor="middle">不用加传感器</text>
          <rect x="470" y="20" width="420" height="440" rx="26" fill="#111d31" stroke="#ff7a45" stroke-width="3"/>
          <text x="680" y="74" font-size="34" font-weight="800" fill="#ff9c75" text-anchor="middle">需要外加</text>
          <text x="680" y="106" font-size="22" fill="#8fa3ba" text-anchor="middle" class="en">must be added</text>
          <text x="510" y="180" font-size="32" font-weight="700" fill="#f3f6fa">谁在缝？</text>
          <text x="530" y="226" font-size="28" fill="#ffb38f">→ 读卡器刷工卡</text>
          <text x="510" y="300" font-size="32" font-weight="700" fill="#f3f6fa">缝的是哪一件？</text>
          <text x="530" y="346" font-size="28" fill="#ffb38f">→ 工票条码</text>
          <text x="530" y="390" font-size="28" fill="#ffb38f">→ 衣架编号 RFID</text>
          <path d="M220 470 L220 520 L680 520 L680 470" stroke="#f2b705" stroke-width="4" fill="none"/>
          <path d="M450 520 L450 548" stroke="#f2b705" stroke-width="4"/>
          <rect x="90" y="550" width="720" height="78" rx="18" fill="rgba(242,183,5,.12)"/>
          <text x="450" y="600" font-size="30" font-weight="700" fill="#ffd75a" text-anchor="middle">谁、何时、做了哪一件的哪道工序</text>
        </svg>
    notes:
      - "先看数据从哪来。电控缝纫机的控制器本来就记着主轴启停和转速、针数、剪线倒缝抬压脚次数，有检测的机型还知道断线，再加上故障码和参数，不用加传感器。可它不知道谁在缝、缝的是哪一件：操作工上班刷工卡，件号靠工票条码或衣架编号。两类信息对上，才知道谁何时做了哪一件的哪道工序。"
      - "Where do the data come from? To do its own job the controller already records spindle start, stop and speed, stitch count, trims, backtacks and foot lifts, thread breaks on machines with a detector, plus fault codes and parameters, with no extra sensors. But it doesn't know who is sewing or which piece: the operator swipes a badge, and the piece comes from a ticket barcode or hanger ID. Put both together and you know who did which operation on which piece, and when."

  - layout: split
    title: ["从缝纫机到看板：四层", "From machine to dashboard: four layers"]
    points:
      - ["电控通信口加联网模块，或网关汇总", "A control-box port plus a module, or a gateway"]
      - ["老机器装电流互感器：只知道开停", "Old machines with a current clamp: on/off only"]
      - ["向上是数据，向下是指令和参数", "Data go up; commands and parameters come down"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <g font-size="26" fill="#f3f6fa">
            <rect x="120" y="10" width="770" height="130" rx="20" fill="#111d31" stroke="#a78bfa" stroke-width="3"/>
            <text x="150" y="62" font-size="32" font-weight="800" fill="#c4b5fd">应用层</text>
            <text x="150" y="112">看板 · MES · 远程运维 · 数字孪生</text>
            <rect x="120" y="170" width="770" height="130" rx="20" fill="#111d31" stroke="#4c8dff" stroke-width="3"/>
            <text x="150" y="222" font-size="32" font-weight="800" fill="#8fb6ff">平台层</text>
            <text x="150" y="272">MQTT 代理 · 历史库 · 指标计算</text>
            <rect x="120" y="330" width="770" height="130" rx="20" fill="#111d31" stroke="#2ec4b6" stroke-width="3"/>
            <text x="150" y="382" font-size="32" font-weight="800" fill="#5ee0d2">边缘层</text>
            <text x="150" y="432">联网模块 · 网关 · 工位终端</text>
            <rect x="120" y="490" width="770" height="130" rx="20" fill="#111d31" stroke="#ff7a45" stroke-width="3"/>
            <text x="150" y="542" font-size="32" font-weight="800" fill="#ff9c75">设备层</text>
            <text x="150" y="592">缝纫机电控 · 读卡器 · 工票扫码</text>
          </g>
          <defs><marker id="u26" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2b705"/></marker>
            <marker id="d26" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8fa3ba"/></marker></defs>
          <path d="M36 590 L36 60" stroke="#f2b705" stroke-width="7" marker-end="url(#u26)"/>
          <path d="M84 60 L84 590" stroke="#8fa3ba" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#d26)"/>
          <text x="36" y="34" font-size="26" font-weight="700" fill="#f2b705" text-anchor="middle">数据</text>
          <text x="84" y="632" font-size="24" fill="#8fa3ba" text-anchor="middle">指令</text>
        </svg>
    notes:
      - "数据怎么送出来？电控带通信口接联网模块，或电控集成联网，或者一组机器接网关，由网关转换协议、汇总上传。老机器没有通信口，可以在电源线上装电流互感器，但只能知道开停。整个系统分四层：设备层、边缘层、平台层、应用层；向上走状态、计数和事件，向下走派工、参数和固件。"
      - "How do the data get out? A control-box port with a connectivity module, networking built into the control, or a gateway that converts protocols and aggregates for a group of machines. Old machines with no port can take a current clamp on the power cable, but that gives only on and off. The system has four layers, device, edge, platform and application; state, counters and events go up, dispatching, parameters and firmware come down."

  - layout: split
    title: ["设备数据分四类", "Machine data come in four kinds"]
    points:
      - ["几代机型，先统一成同一种结构", "Many models and generations: one common structure first"]
      - ["状态对应 OPC UA Machinery 四种", "States map to the four of OPC UA for Machinery"]
      - ["计数只增不减；事件发生在某一时刻", "Counters only go up; events happen at an instant"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <g>
            <rect x="10" y="10" width="430" height="300" rx="24" fill="#111d31" stroke="#4c8dff" stroke-width="3"/>
            <text x="40" y="66" font-size="38" font-weight="800" fill="#8fb6ff">识别</text><text x="140" y="66" font-size="22" fill="#8fa3ba" class="en">identity</text>
            <text x="40" y="126" font-size="27" fill="#f3f6fa">编号 · 型号 · 序列号</text>
            <text x="40" y="170" font-size="27" fill="#f3f6fa">固件版本 · 产线工位</text>
            <text x="40" y="270" font-size="26" fill="#8fb6ff">很少变化</text>
          </g>
          <g>
            <rect x="460" y="10" width="430" height="300" rx="24" fill="#111d31" stroke="#2ec4b6" stroke-width="3"/>
            <text x="490" y="66" font-size="38" font-weight="800" fill="#5ee0d2">状态</text><text x="590" y="66" font-size="22" fill="#8fa3ba" class="en">state</text>
            <text x="490" y="126" font-size="26" fill="#f3f6fa">运行 → 正在执行</text>
            <text x="490" y="168" font-size="26" fill="#f3f6fa">待机 → 可用但未执行</text>
            <text x="490" y="210" font-size="26" fill="#f3f6fa">故障 → 停用</text>
            <text x="490" y="252" font-size="26" fill="#f3f6fa">关机 → 不可用</text>
          </g>
          <g>
            <rect x="10" y="330" width="430" height="300" rx="24" fill="#111d31" stroke="#f2b705" stroke-width="3"/>
            <text x="40" y="386" font-size="38" font-weight="800" fill="#ffd75a">计数</text><text x="140" y="386" font-size="22" fill="#8fa3ba" class="en">counters</text>
            <text x="40" y="446" font-size="27" fill="#f3f6fa">针数 · 剪线 · 件数</text>
            <text x="40" y="490" font-size="27" fill="#f3f6fa">运行时间</text>
            <text x="40" y="590" font-size="26" fill="#ffd75a">只增不减，报累计值</text>
          </g>
          <g>
            <rect x="460" y="330" width="430" height="300" rx="24" fill="#111d31" stroke="#ff7a45" stroke-width="3"/>
            <text x="490" y="386" font-size="38" font-weight="800" fill="#ff9c75">事件</text><text x="590" y="386" font-size="22" fill="#8fa3ba" class="en">events</text>
            <text x="490" y="446" font-size="27" fill="#f3f6fa">开始缝 · 停下 · 剪线</text>
            <text x="490" y="490" font-size="27" fill="#f3f6fa">断线 · 报警 · 换人</text>
            <text x="490" y="590" font-size="26" fill="#ff9c75">在某一时刻发生</text>
          </g>
        </svg>
    notes:
      - "车间里常有几家企业、几代型号的缝纫机，数据要先统一成一种结构。一台设备的数据分四类：识别信息，编号、型号、固件、工位，很少变；状态，参照 OPC UA 机械通用规范，运行、待机、故障、关机对应四种状态；计数，只增不减的累计量；事件，在某一时刻发生的事。"
      - "A floor often has machines from several makers and generations, so their data must first share one structure. Four kinds: identity, such as ID, model, firmware and station, which rarely changes; state, mapped with OPC UA for Machinery, running, idle, fault and off matching its four states; counters, quantities that only go up; and events, things that happen at an instant."

  - layout: split
    title: ["计数报累计值：丢一条也不怕", "Report counters cumulatively: a lost message doesn't matter"]
    points:
      - ["丢了一条，下一条照样补回来", "Lose one, and the next one makes it up"]
      - ["重复收到一条，也不会多算", "Receive one twice, and nothing is double-counted"]
      - ["接收方要识别归零，归零后接续", "The receiver must spot resets and carry on"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <text x="20" y="44" font-size="26" fill="#8fa3ba">本班累计件数（示意）</text>
          <path d="M40 250 L870 250" stroke="#2c3e5c" stroke-width="6" stroke-linecap="round"/>
          <g font-size="44" font-weight="800" text-anchor="middle" class="en">
            <circle cx="110" cy="250" r="16" fill="#2ec4b6"/><text x="110" y="200" fill="#5ee0d2">120</text>
            <circle cx="310" cy="250" r="16" fill="#2ec4b6"/><text x="310" y="200" fill="#5ee0d2">128</text>
            <circle cx="510" cy="250" r="16" fill="#ff7a45"/><text x="510" y="200" fill="#ff7a45">✗</text>
            <circle cx="710" cy="250" r="16" fill="#2ec4b6"/><text x="710" y="200" fill="#5ee0d2">145</text>
          </g>
          <g font-size="22" fill="#8fa3ba" text-anchor="middle" class="en">
            <text x="110" y="300">10:00</text><text x="310" y="300">10:01</text><text x="510" y="300">10:02</text><text x="710" y="300">10:03</text>
          </g>
          <text x="510" y="340" font-size="26" fill="#ff9c75" text-anchor="middle">这一条丢了</text>
          <path d="M310 380 C 360 450, 660 450, 710 380" stroke="#f2b705" stroke-width="4" fill="none"/>
          <rect x="190" y="460" width="640" height="80" rx="18" fill="rgba(242,183,5,.12)"/>
          <text x="510" y="512" font-size="32" font-weight="700" fill="#ffd75a" text-anchor="middle">145 − 128 = 17 件，一件不少</text>
          <text x="450" y="600" font-size="26" fill="#f3f6fa" text-anchor="middle">若报“这一分钟做了几件”，丢一条就永远少了</text>
        </svg>
    notes:
      - "计数的要点是报累计值，不报增量。看图，每分钟报一次本班累计件数：10 点 02 分那条丢了，10 点 03 分的 145 减 10 点 01 分的 128，中间 17 件一件不少；重复收到也不多算。若报“这一分钟做了几件”，丢一条就永远少了。接收方还要识别断电重启、换控制器造成的归零，再接着累计。"
      - "The key with counters: report cumulative values, not increments. Here the machine reports the shift's running total every minute. The 10:02 message is lost, yet 145 at 10:03 minus 128 at 10:01 still gives all 17 pieces, and a duplicate does no harm. Report 'pieces this minute' and a lost message is lost for good. The receiver must also spot resets after a power cycle or controller swap and carry on."

  - layout: figure
    title: ["一台缝纫机的一刻钟：事件交错出现", "A quarter-hour on one machine: events interleave"]
    visual: {video: events}
    caption: ["蓝：主轴转 · 橙：剪线 · 红：断线 · 灰：等活 · 紫：故障", "Blue spindle · orange trims · red breaks · grey waiting · purple faults"]
    notes:
      - "这是实验 26-1 生成的一台平缝机一刻钟里的事件流，每隔几秒换一段。蓝色竖条是主轴在转，橙色短线是剪线，红色是断线停机，灰色是等活，紫色是设备故障。大家注意两点：第一，主轴转动是一小段一小段的，中间夹着拿布、对齐；第二，每缝完一段就剪一次线，所以剪线次数和件数有关系，但不完全对得上，后面会专门算。"
      - "This is the event stream from Lab 26-1: a quarter-hour on one lockstitch machine, with a new segment every few seconds. Blue bars: the spindle turning. Orange ticks: trims. Red: thread-break stops. Grey: waiting for work. Purple: machine faults. Notice two things. The spindle runs in short bursts, with handling in between. And every seam ends with a trim, so trims are related to pieces, but not exactly. We'll do the numbers later."

  - layout: section
    num: "02"
    title: ["通信：MQTT 与 OPC UA", "Communication: MQTT and OPC UA"]

  - layout: split
