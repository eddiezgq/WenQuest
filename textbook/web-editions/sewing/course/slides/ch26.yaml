          <text x="60" y="390" font-size="32" font-weight="800" fill="#ffd75a">要提高它，靠的是</text>
          <text x="60" y="450" font-size="30" fill="#f3f6fa">● 工位布置</text>
          <text x="60" y="505" font-size="30" fill="#f3f6fa">● 辅助工具</text>
          <text x="60" y="560" font-size="30" fill="#f3f6fa">● 自动单元（第 12 讲）</text>
          <text x="840" y="560" font-size="30" fill="#ff9c75" text-anchor="end">不是让工人踩快一点</text>
        </svg>
    notes:
      - "最容易被误读的数是缝纫时间比例：主轴真正转动的时间占计划时间多少。算例里主轴只转了约 {{ch26.run:.0f}} 分钟，约 {{ch26.ratio:.0f}}%。其余时间在拿布、对齐、翻面、放下，标准工时里本来就包括。所以不能拿它当机器利用率考核工人；要提高它，靠工位布置、辅助工具和自动单元。"
      - "The number most easily misread is the sewing-time ratio, the share of planned time the spindle actually turns. Here it turns only about {{ch26.run:.0f}} minutes, about {{ch26.ratio:.0f}} percent. The rest is picking up, aligning, turning and putting down, already part of the standard minute. So never use it to judge operators as machine utilisation; raise it with better layout, aids and automatic units."

  - layout: split
    title: ["按剪线数件，为什么多算", "Why counting by trims comes out high"]
    points:
      - ["返工重缝、断线后重新起缝：都多剪一次", "Re-sewing and restarting after a break: one extra trim each"]
      - ["{{ch26.trims:.0f}} ÷ 3 ≈ {{ch26.est:.0f}} 件，多算 {{ch26.err:.1f}}%", "{{ch26.trims:.0f}} ÷ 3 ≈ {{ch26.est:.0f}} pieces, {{ch26.err:.1f}}% high"]
      - ["以衣架或工票为准，剪线用来核对", "Count by hanger or ticket; cross-check with trims"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <text x="20" y="44" font-size="26" fill="#8fa3ba">三种数件方法的误差（算例，示意）</text>
          <path d="M450 80 L450 540" stroke="#4b5f7d" stroke-width="3" stroke-dasharray="8 8"/>
          <text x="450" y="580" font-size="24" fill="#8fa3ba" text-anchor="middle">实际件数</text>
          <text x="20" y="160" font-size="32" font-weight="700" fill="#f3f6fa">剪线</text>
          <rect x="450" y="115" width="300" height="70" rx="12" fill="#ff7a45"/>
          <text x="770" y="162" font-size="34" font-weight="800" fill="#ff9c75" class="en">+{{ch26.err:.1f}}%</text>
          <text x="470" y="230" font-size="24" fill="#ffb38f">返工 + 断线，多剪线</text>
          <text x="20" y="330" font-size="32" font-weight="700" fill="#f3f6fa">工票</text>
          <rect x="190" y="285" width="260" height="70" rx="12" fill="#4c8dff"/>
          <text x="170" y="332" font-size="34" font-weight="800" fill="#8fb6ff" text-anchor="end" class="en">−2%</text>
          <text x="440" y="400" font-size="24" fill="#8fb6ff" text-anchor="end">2% 的扎漏扫，整扎地少</text>
          <text x="20" y="490" font-size="32" font-weight="700" fill="#f3f6fa">衣架</text>
          <rect x="440" y="445" width="20" height="70" rx="6" fill="#2ec4b6"/>
          <text x="490" y="492" font-size="30" font-weight="700" fill="#5ee0d2">最准：逐件读编号</text>
        </svg>
    notes:
      - "这是按原理编写的案例。车间按剪线次数除以段数数件、发计件工资，工人反映统计数比工票多。原因是返工重缝、断线后重新起缝都多剪一次线：剪线约 {{ch26.trims:.0f}} 次，除以 3 得约 {{ch26.est:.0f}} 件，多了 {{ch26.err:.1f}}%。工票漏扫则整扎地少；衣架计数最准。以衣架或工票为准，剪线用来核对。"
      - "A case written from first principles. A shop counted pieces as trims divided by seams and paid piece rates on it, and operators found the count above their tickets. Re-sewing and restarting after a break each add a trim: about {{ch26.trims:.0f}} trims over 3 gives {{ch26.est:.0f}} pieces, {{ch26.err:.1f}} percent high. Missed ticket scans lose whole bundles; hangers are most accurate. Count by hanger or ticket and check with trims."

  - layout: lab
    title: ["动手试一试：缝纫机联网", "Try it: a connected sewing machine"]
    shot: {page: iot, set: [press: "#resetA"]}
    tasks:
      - ["第①页读出件数、OEE 和计件误差", "Page ①: read pieces, OEE and the count error"]
      - ["只改“件数怎样数”，让误差小于 1%", "Change only the counting method: get the error under 1%"]
      - ["第②页：找出四项判据都满足的方式", "Page ②: find a strategy that meets all four criteria"]
    notes:
      - "实验 26-1 在问渠平台上自己做。第①页先恢复标准，读出件数、按剪线统计的件数和误差、A、P、Q 和 OEE，多换几段看事件流；再不改工况、只改件数怎样数，让误差小于 1%。第②页保持 500 台、250 字节、两班，五种上报方式都试一遍，找出四项判据都满足的方式。"
      - "Lab 26-1 is on WenQuest. On page ①, reset to standard and read the pieces, the trim-based count and its error, A, P, Q and OEE, and step through a few event segments; then, without changing the conditions, change only the counting method to get the error under 1 percent. On page ②, keep 500 machines, 250 bytes and two shifts, try all five strategies and find one that meets all four criteria."

  - layout: section
    num: "04"
    title: ["对接、孪生与安全", "Integration, twins and security"]

  - layout: chain
    title: ["缝纫机的数据要和生产计划对上", "Machine data must meet the production plan"]
    steps: [["ERP 订单", "ERP order"], ["MES 拆单", "Work orders"], ["派到工位", "Dispatch"], ["缝纫机", "Machines"], ["吊挂", "Hangers"], ["报工", "Reporting"], ["工时", "Hours"], ["计件工资", "Piece pay"], ["成本", "Cost"]]
    hot: [3, 4]
    mark: ["联网数据", "connected data"]
    foot: ["问渠做法：所有系统只和统一数据总线打交道，桥接程序在总线和 ERP 之间转换字段", "The WenQuest way: every system talks only to the unified bus; a bridge translates fields between the bus and ERP"]
    notes:
      - "缝纫机的数据只有和生产计划对上才有意义。MES 从 ERP 拿到订单，拆成工单和工序派到工位；缝纫机和吊挂报上来的件数和状态就是报工；再回 ERP 核算工时、计件工资和成本。问渠的做法是所有系统只和统一数据总线打交道，由桥接程序在总线和 ERP 之间转换字段。"
      - "Machine data mean something only against the production plan. The MES takes orders from ERP, splits them into work orders and dispatches operations to stations; the pieces and states reported by machines and hangers are the completion reports, which go back to ERP for hours, piece pay and cost. In WenQuest every system talks only to the unified bus, with a bridge translating fields between the bus and ERP."

  - layout: duo
    title: ["数字孪生的两层意思", "The two layers of a digital twin"]
    left: {video: mirror, label: ["实时镜像", "Real-time mirror"], note: ["每台机器、每个衣架都有虚拟对象", "A twin for every machine"]}
    right: {video: predict, label: ["仿真预测：从现在“快进”", "Prediction: fast-forward from now"], note: ["提前看到哪道工序会堵", "See in advance which operation will jam"]}
    notes:
      - "数字孪生是和真实车间同步变化的虚拟车间，有两层意思。左边是实时镜像：每个工位、每个衣架都有对应的对象，状态随总线消息更新。右边是仿真预测：从当前实际状态出发把后面几小时快进一遍，提前看到哪道工序会堵，再比较几种调整方案。联网以后，这些模型的输入换成了实测数据。"
      - "A digital twin is a virtual floor that changes in step with the real one, in two layers. On the left, the real-time mirror: every station and hanger has a counterpart updated from the bus. On the right, prediction: start from the actual state, fast-forward the next few hours to see which operation will jam, and compare a few fixes. Once connected, these models run on measured data."

  - layout: points
    title: ["远程运维与网络安全", "Remote service and network security"]
    points:
      - ["远程看故障码、推参数：先在一台上试", "Read faults, push parameters remotely: try one machine first"]
      - ["固件双区升级、分批推送，能回退", "Firmware: dual-bank update, staged roll-out, rollback"]
      - ["分网、加密、单独账号、按主题授权", "Separate networks, encryption, own accounts, per-topic rights"]
    foot: ["个人数据：按《个人信息保护法》事先告知目的、方式和范围，只采必要的；展示尽量按工位", "Personal data: under the PIPL, tell workers the purpose, means and scope in advance and collect only what's needed; report by station"]
    notes:
      - "联网以后可以远程看故障码、换款时一次推参数，推之前先在一台上试。固件远程升级用双区升级、分批推送，出问题能退回。安全上：设备网和办公网分开、通信加密、每台设备单独账号、按主题授权，指令和改参都有记录。谁几点开工、每件几秒是操作工的个人信息，要事先告知、只采必要的。"
      - "Once connected you can read fault codes remotely and push parameters to a line at a style change, after trying one machine first. Firmware updates use dual banks and staged roll-out so any machine can roll back. For security: separate device and office networks, encryption, an account per machine, per-topic rights, and a log of every command. Start times and seconds per piece are operators' personal data: tell them first and collect only what's needed."

  - layout: split
    title: ["机器人联系：同一套规则上总线", "Robot link: onto the bus by the same rules"]
    points:
      - ["状态用保留消息，掉线由遗嘱变“离线”", "State retained; the will turns it 'offline'"]
      - ["循环数、抓取次数报累计值", "Cycle and pick counts reported cumulatively"]
      - ["按夹爪闭合数件，重抓一次就多一件", "Count by gripper closures and every re-grip adds one"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <rect x="10" y="20" width="360" height="560" rx="26" fill="#111d31" stroke="#4b5f7d" stroke-width="3"/>
          <text x="190" y="70" font-size="30" font-weight="800" fill="#f3f6fa" text-anchor="middle">机器人工作站</text>
          <rect x="120" y="470" width="140" height="60" rx="10" fill="#4b5f7d"/>
          <path d="M190 470 L190 380 L280 260 L200 170" stroke="#ff7a45" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <circle cx="190" cy="380" r="22" fill="#f2b705"/><circle cx="280" cy="260" r="20" fill="#f2b705"/>
          <path d="M185 150 L170 125 M215 150 L230 125" stroke="#f3f6fa" stroke-width="8" stroke-linecap="round"/>
          <defs><marker id="r26" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8fa3ba"/></marker></defs>
          <path d="M372 150 L440 150 M372 330 L440 330 M372 500 L440 500" stroke="#8fa3ba" stroke-width="4" marker-end="url(#r26)"/>
          <rect x="450" y="90" width="440" height="130" rx="20" fill="#111d31" stroke="#2ec4b6" stroke-width="3"/>
          <text x="470" y="140" font-size="25" fill="#5ee0d2" class="en">wq/…/robot-01/status</text>
          <text x="470" y="190" font-size="26" fill="#f3f6fa">保留 · 遗嘱 → offline</text>
          <rect x="450" y="265" width="440" height="130" rx="20" fill="#111d31" stroke="#f2b705" stroke-width="3"/>
          <text x="470" y="315" font-size="25" fill="#ffd75a" class="en">wq/…/robot-01/counter</text>
          <text x="470" y="365" font-size="26" fill="#f3f6fa">循环数 · 抓取次数（累计）</text>
          <rect x="450" y="440" width="440" height="130" rx="20" fill="rgba(255,122,69,.12)" stroke="#ff7a45" stroke-width="3"/>
          <text x="470" y="490" font-size="26" font-weight="700" fill="#ff9c75">OEE = A × P × Q</text>
          <text x="470" y="540" font-size="25" fill="#f3f6fa">P 用程序的理想节拍</text>
        </svg>
    notes:
      - "这一套在机器人上完全一样。焊接或搬运机器人的状态用保留消息发到它的 status 主题，掉线由遗嘱消息变成离线；循环数、抓取次数报累计值。它的 OEE 也是 A 乘 P 乘 Q，只是 P 用程序的理想节拍。计件也有同样的坑：按夹爪闭合数件，重抓一次就多一件，要用视觉或到位信号核对。"
      - "All of this carries over to robots. A welding or handling robot publishes its state as a retained message on its status topic, turned 'offline' by a will message, and reports cycle and pick counts cumulatively. Its OEE is the same A times P times Q, with P based on the program's ideal cycle. Counting has the same trap: count by gripper closures and every re-grip adds a part, so cross-check with vision or a part-present signal."

  - layout: split
    title: ["生活中的例子：智能电表报累计读数", "Everyday example: a smart meter reports its total"]
    points:
      - ["电表报的是表上的累计读数", "The meter reports its running total"]
      - ["丢一次上报，下次读数照样算得出", "Miss one report and the next still gives the usage"]
      - ["重复收到也不会多算电费", "A duplicate doesn't add to the bill"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <rect x="230" y="20" width="440" height="300" rx="36" fill="#111d31" stroke="#8fa3ba" stroke-width="4"/>
          <rect x="280" y="80" width="340" height="110" rx="14" fill="#0b1a12" stroke="#2ec4b6" stroke-width="3"/>
          <text x="450" y="160" font-size="64" font-weight="800" fill="#5ee0d2" text-anchor="middle" class="en">01206</text>
          <text x="450" y="240" font-size="28" fill="#8fa3ba" text-anchor="middle">累计 kWh（示意）</text>
          <path d="M60 470 L840 470" stroke="#2c3e5c" stroke-width="6" stroke-linecap="round"/>
          <g font-size="38" font-weight="800" text-anchor="middle" class="en">
            <circle cx="150" cy="470" r="14" fill="#2ec4b6"/><text x="150" y="430" fill="#5ee0d2">1200</text>
            <circle cx="450" cy="470" r="14" fill="#ff7a45"/><text x="450" y="430" fill="#ff7a45">✗</text>
            <circle cx="750" cy="470" r="14" fill="#2ec4b6"/><text x="750" y="430" fill="#5ee0d2">1206</text>
          </g>
          <g font-size="22" fill="#8fa3ba" text-anchor="middle" class="en"><text x="150" y="510">08:00</text><text x="450" y="510">09:00</text><text x="750" y="510">10:00</text></g>
          <rect x="150" y="550" width="600" height="72" rx="18" fill="rgba(242,183,5,.12)"/>
          <text x="450" y="597" font-size="30" font-weight="700" fill="#ffd75a" text-anchor="middle">两小时用电 = 1206 − 1200 = 6 度</text>
        </svg>
    notes:
      - "生活里有一个一模一样的例子：智能电表。它上报的是表上的累计读数，而不是这一刻用了多少度。中间丢了一次上报，没关系，下一次的读数减去上一次收到的读数，这段时间的用电照样算得出来；重复收到一次，也不会多收电费。缝纫机上报累计针数和件数，用的是同一个道理。"
      - "There's an exact everyday parallel: the smart electricity meter. It reports the running total on its register, not how much was used just now. If one report is lost, no matter: the next reading minus the last one received still gives the usage for the period, and a duplicate doesn't add to the bill. A sewing machine reporting cumulative stitches and pieces relies on the very same idea."

  - layout: answer
    tag: ["回到车间问题", "Back to the problem"]
    title: ["{{ch26.pieces:.0f}} 件，OEE {{ch26.OEE:.1f}}%，剪线数多了 {{ch26.err:.1f}}%", "{{ch26.pieces:.0f}} pieces, OEE {{ch26.OEE:.1f}}%, trim count {{ch26.err:.1f}}% high"]
    rows:
      - ["A × P × Q", "{{ch26.A:.1f}} × {{ch26.P:.0f}} × {{ch26.Q:.0f}}%"]
      - ["最大损失：速度", "≈ {{ch26.speed:.0f}} min"]
      - ["按剪线次数数件", "{{ch26.est:.0f}} 件"]
    side: {big: "{{ch26.stitch_tb:.0f}} TB", text: ["500 台每针上报一年的数据；改为汇总 + 事件即报约 {{ch26.minute_gb:.0f}}–{{ch26.piece_gb:.0f}} GB", "A year of per-stitch data from 500 machines; aggregate + events: about {{ch26.minute_gb:.0f}}–{{ch26.piece_gb:.0f}} GB"]}
    foot: ["记件以衣架或工票为准，剪线计数用来核对返工和断线", "Count by hanger or ticket; use trims to watch rework and thread breaks"]
    notes:
      - "回到开头的问题。运行时间约 {{ch26.oper:.0f}} 分钟，A 约 {{ch26.A:.1f}}%；实际做了约 {{ch26.pieces:.0f}} 件，P {{ch26.P:.0f}}%，Q {{ch26.Q:.0f}}%，OEE 约 {{ch26.OEE:.1f}}%。最大损失是速度，约 {{ch26.speed:.0f}} 分钟。按剪线数出 {{ch26.est:.0f}} 件，多了 {{ch26.err:.1f}}%。500 台每针上报一年约 {{ch26.stitch_tb:.0f}} TB；改成汇总加事件即报，只要 {{ch26.minute_gb:.0f}} 到 {{ch26.piece_gb:.0f}} GB。"
      - "Back to our problem. Running time is about {{ch26.oper:.0f}} minutes, A about {{ch26.A:.1f}} percent; about {{ch26.pieces:.0f}} pieces were made, P {{ch26.P:.0f}}, Q {{ch26.Q:.0f}}, OEE about {{ch26.OEE:.1f}} percent. The biggest loss is speed, about {{ch26.speed:.0f}} minutes. Counting trims gives {{ch26.est:.0f}}, {{ch26.err:.1f}} percent high. Per-stitch reporting from 500 machines is about {{ch26.stitch_tb:.0f}} terabytes a year; aggregated with events, only {{ch26.minute_gb:.0f}} to {{ch26.piece_gb:.0f}} gigabytes."

  - layout: summary
    title: ["本讲小结", "Summary"]
    points:
      - ["四类数据；计数报累计值，按编号去重", "Four kinds of data; cumulative counters, de-dup by ID"]
      - ["MQTT + 统一命名空间；保留给状态、遗嘱标离线", "MQTT + unified namespace; retained state, will = offline"]
      - ["边缘汇总、事件即报；OEE = A × P × Q", "Aggregate at the edge, report events; OEE = A × P × Q"]
    after: ["作业 26：一条缝制线的联网方案与班次分析 · 测验 · 虚拟实验 26-1 报告 —— 在问渠学习平台完成", "Assignment 26 · quiz · Lab 26-1 report — on WenQuest"]
    notes:
      - "这一讲记住三件事。第一，设备数据分识别、状态、计数、事件四类，计数报累计值，按消息编号去重。第二，MQTT 加统一命名空间，让代理成为全厂唯一的实时数据源；保留消息给当前状态，遗嘱消息标出离线。第三，计数在边缘汇总、状态变化即报；OEE 等于 A 乘 P 乘 Q，剪线计数偏多要核对。"
      - "Three things to remember. One: machine data come as identity, state, counters and events; counters are cumulative and de-duplicated by message ID. Two: MQTT with a unified namespace makes the broker the plant's single real-time source; retained messages give current state, will messages mark machines offline. Three: aggregate counters at the edge and report state changes at once; OEE is A times P times Q, and trim counts run high, so cross-check."
