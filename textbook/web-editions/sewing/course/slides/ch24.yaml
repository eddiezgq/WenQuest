      - "There's selective assembly in daily life too. A shoe shop matches shoes to feet by size group. The finer the sizes, the better the fit, but every size has to be stocked, and the slow sizes pile up. That's the trade-off between the number of groups and the leftovers: finer groups match more precisely, but bring more leftovers and more management cost."

  - layout: answer
    tag: ["回到车间问题", "Back to the shop floor"]
    title: ["三种方案，2000 套蒙特卡罗", "Three plans, a 2000-set Monte Carlo"]
    rows:
      - [["完全互换", "Interchangeable"], ["{{ch24.y_int:.1f}}% · {{ch24.c_int:.1f}} 元", "{{ch24.y_int:.1f}}% · {{ch24.c_int:.1f}} yuan"]]
      - [["提高精度 σ 2.6", "Tighter σ 2.6"], ["{{ch24.y_26:.1f}}% · {{ch24.c_26:.1f}} 元", "{{ch24.y_26:.1f}}% · {{ch24.c_26:.1f}} yuan"]]
      - [["分 3 组选配", "Three groups"], ["{{ch24.y_g3:.1f}}% · {{ch24.c_g3:.1f}} 元", "{{ch24.y_g3:.1f}}% · {{ch24.c_g3:.1f}} yuan"]]
    side: {big: "−{{ch24.save:.0f}}%", text: ["分组选配比提高精度每套便宜", "cheaper per set than tighter accuracy"]}
    foot: ["合格率 · 每套成本；分 3 组剩余件 {{ch24.l_g3:.1f}}%，前提是两种零件分布一致", "Yield · cost per set; three groups leave {{ch24.l_g3:.1f}}% over, if both distributions match"]
    notes:
      - "回到开头的问题。完全互换，合格率约 {{ch24.y_int:.1f}}%，每套约 {{ch24.c_int:.1f}} 元。不分组、只靠提高精度，每件标准差取 2.6 微米、留一点余量，合格率 {{ch24.y_26:.1f}}%，每套约 {{ch24.c_26:.1f}} 元。按正负 15 微米分 3 组选配，组宽 10 微米，测量误差 1 微米时合格率 {{ch24.y_g3:.1f}}%、剩余件 {{ch24.l_g3:.1f}}%，每套约 {{ch24.c_g3:.1f}} 元，比提高精度便宜约 {{ch24.save:.0f}}%。前提是两种零件的分布一致，选配站要一直盯着各组件数。"
      - "Back to the opening problem. Fully interchangeable: about {{ch24.y_int:.1f}} percent good at about {{ch24.c_int:.1f}} yuan a set. No grouping, just tighter accuracy, each sigma at 2.6 microns to leave a margin: {{ch24.y_26:.1f}} percent at about {{ch24.c_26:.1f}} yuan. Three groups over plus or minus 15 microns, 10 microns wide, with 1 micron gauge error: {{ch24.y_g3:.1f}} percent good, {{ch24.l_g3:.1f}} percent leftovers, about {{ch24.c_g3:.1f}} yuan a set, some {{ch24.save:.0f}} percent cheaper than tighter accuracy. This holds only if the two distributions match, so the matching station must keep watching the group counts."

  - layout: summary
    title: ["小结", "Summary"]
    points:
      - ["机针靠成形一致与视觉全检；旋梭靠精磨与选配", "Needles: consistent forming, vision checks; hooks: grinding, matching"]
      - ["Cpk 看能力，控制图看漂移；抽样越多发现越快", "Cpk for capability, charts for drift; bigger subgroups catch it sooner"]
      - ["分组选配用测量代替精度，两件分布必须一致", "Matching swaps accuracy for measurement; distributions must match"]
    after: ["课后：实验 24-1、作业、测验；下一讲：机壳与凸轮", "After class: Lab 24-1, assignment and quiz on the platform; next: housings and cams"]
    notes:
      - "小结三句话。第一，机针和旋梭代表两种制造思路：机针靠成形一致性和全数视觉检测，冲针孔和回火最关键；旋梭靠精磨、研磨和选配。第二，Cpk 说明工序有没有能力，控制图说明工序变没变，每组抽得越多，漂移发现得越快。第三，分组选配用测量代替提高精度，能用经济精度做到高合格率，但两种零件的分布必须一致，否则剩余件大量堆积。"
      - "Three takeaways. One: needles and hooks stand for two ways of manufacturing. Needles rely on consistent forming and full vision inspection, with eye punching and tempering most critical; hooks rely on grinding, lapping and matching. Two: Cpk tells you whether a process is capable, a control chart whether it has changed, and bigger subgroups catch drifts sooner. Three: grouped matching swaps accuracy for measurement and reaches a high yield with economical parts, but the two distributions must match, or leftovers pile up."
