487588292109 L1362 291.5693741078132 L1368 287.316362026173 L1374 282.2579201289579 L1380 276.95091259399226 L1386 271.97956722258647 L1392 267.8911600750732 L1398 265.13576797966783 L1404 264.0167213264331 L1410 264.65721160538976 L1416 266.9867297349187 L1422 270.74882813209103 L1428 275.5293520288172 L1434 280.80203215811474 L1440 285.9864196891395 L1446 290.5117855795006 L1452 293.8799499139009 L1458 295.720124591782 L1464 295.8297319459741 L1470 294.1967057295151 L1476 291.00081944180897 L1482 286.5938957638681 L1488 281.461075768876 L1494 276.16741162991497 L1500 271.29566222577006 L1506 267.3821394844284 L1512 264.8576678905903 L1518 264.00015669518876 L1524 264.90400596775225 L1530 267.46971446021456 L1536 271.41483331199305 L1542 276.30505974558133 L1548 281.60204776874514 L1554 286.72267258922625 L1560 291.1032245532329 L1566 294.2614657469133 L1572 295.8497176911179 L1578 295.69313591178565 L1584 293.8089578874883 L1590 290.40460544251385 L1596 285.8548504856469 L1602 280.66055782957864 L1608 275.39354693335895 L1614 270.6336425240308 L1620 266.9048439494729 L1626 264.6176401299271 L1632 264.0238204306502 L1638 265.1887561508155 L1644 267.9842040516532 L1650 272.10242415540284 L1656 277.0900576415478 L1662 282.39803535460726 L1668 287.4420226901411 L1674 291.66674671675423 L1680 294.60712401164204" stroke="#9cc0ff" stroke-width="14" fill="none" opacity=".8"/><rect x="1320" y="305" width="360" height="22" fill="#c8a96a"/><text x="1320" y="400" font-size="22" fill="#8fa3ba" text-anchor="start"><tspan>上层多送的一截拱起（第 6 讲）</tspan></text><text x="1320" y="430" font-size="22" fill="#f3f6fa" text-anchor="start"><tspan class="en" font-size="22" fill="#8fa3ba"> the extra upper ply buckles</tspan></text></svg>
    h: 600
    notes:
      - "平衡只说明比例对，不说明大小对。线业企业的资料把缝皱分成四类。张力起皱：缝线收紧时被拉长，缝好后弹回去，把布拉短拱起来，对策是保持平衡的前提下把张力降到最低。结构性起皱：密织布的纱线被针和线挤开撑长。尺寸不稳定：洗烫后线和布缩得不一样。送布起皱就是第 6 讲的上下层错位。和本讲直接相关的是第一类。"
      - "Balance says the ratio is right, not the size. A thread maker's guidance sorts seam pucker into four types. Tension pucker: the thread is stretched as the stitch tightens, springs back once sewn, and shortens the cloth so it buckles; the cure is the lowest tension that still balances. Structural pucker: in a tight weave, needle and thread push the yarns apart. Dimensional instability: after washing and pressing, thread and cloth shrink by different amounts. Feed pucker is the ply shift of Lecture 6. The first type is the one this lecture is about."

  - layout: split
    title: ["张力起皱：线被拉长，缝后回缩", "Tension pucker: stretched, then recovering"]
    points:
      - ["线的伸长 ε = T/EA", "Thread strain ε = T/EA"]
      - ["缩短 ≈ ε × (s+t)/s", "Shortening ≈ ε × (s+t)/s"]
      - ["两根一起调紧：平衡，却越来越皱", "Both tighter: balanced, but more puckered"]
    visual: {video: tight}
    notes:
      - "张力起皱可以估算。线收紧时的伸长约等于张力除以拉伸刚度 EA，EA 约是强力除以断裂伸长，Tex 24 约 {{ch07.EA24r:.0f}} 厘牛。每厘米缝长用线约 s 加 t 除以 s，这里是 {{ch07.lam:.2f}}。两者相乘就是缝长缩短率，面料能吸收一小部分，超出的就是起皱。看截面：两根线按比例一起调紧，交织点一直在中间，布却越来越皱。"
      - "Tension pucker can be estimated. The thread's stretch during tightening is about the tension over its stiffness EA, and EA is roughly strength over elongation at break, about {{ch07.EA24r:.0f}} centinewtons for Tex 24. Thread used per unit of seam is about s plus t over s, here {{ch07.lam:.2f}}. Multiply the two and you get the fractional shortening of the seam; the cloth absorbs a little, and the rest is pucker. Watch the section: both threads tightened in proportion, the lock point stays in the middle, yet the cloth puckers more and more."

  - layout: duo
    title: ["断线：收紧峰不超过强力的 1/3", "Breakage: keep the peak under a third of strength"]
    left: {video: den24, label: ["牛仔四层，Tex 24（1000 cN）", "Four plies of denim, Tex 24 (1000 cN)"], note: ["收紧峰约占 {{ch07.den24:.0f}}%：超标", "Peak about {{ch07.den24:.0f}}%: too high"]}
    right: {video: den40, label: ["牛仔四层，Tex 40（1700 cN）", "Four plies of denim, Tex 40 (1700 cN)"], note: ["约占 {{ch07.den40:.0f}}%：可用", "About {{ch07.den40:.0f}}%: usable"]}
    notes:
      - "再看断线。面线多半断在收紧峰上，而线能承受的远低于拉力机测的强力：高速穿针眼、和旋梭摩擦、针热软化，都要打折扣。示意判据是峰值不超过名义强力的三分之一。牛仔四层，交织点两根线都要 100 厘牛，夹线器约 {{ch07.den_td:.0f}} 厘牛，5000 转时峰值约 {{ch07.den_pk:.0f}} 厘牛，占 Tex 24 的 {{ch07.den24:.0f}}%，超标，紫色一大片；换 Tex 40 只占 {{ch07.den40:.0f}}%。厚料要配粗线。"
      - "Now breakage. The needle thread usually breaks at the tightening peak, and what it can bear is far below its tensile-tester strength: high-speed passes through the eye, rubbing on the hook and needle heat all take their toll. The illustrative rule: the peak should stay under a third of nominal strength. Four plies of denim need 100 centinewtons in both threads at the lock point, so the assembly is about {{ch07.den_td:.0f}}, and at 5000 rpm the peak is about {{ch07.den_pk:.0f}}: {{ch07.den24:.0f}} percent of Tex 24, too much, hence all that purple. With Tex 40 it's {{ch07.den40:.0f}} percent. Heavy cloth needs heavy thread."

  - layout: tiles
    title: ["缺陷速查与电子张力", "Quick guide to faults, and electronic tension"]
    tiles:
      - {k: "a", name: ["正面冒底线", "Bobbin on top"], use: ["先查梭壳、梭芯，再查面线", "Bobbin side first, then the needle"], hot: true}
      - {k: "b", name: ["反面浮线", "Loops underneath"], use: ["面线卡进夹线盘没有", "Is the thread in the discs?"]}
      - {k: "c", name: ["缝皱", "Pucker"], use: ["保持平衡，两根一起调松", "Keep balance, loosen both"], hot: true}
      - {k: "d", name: ["断线", "Breaks"], use: ["先查毛刺；厚料换粗线", "Burrs first; heavy cloth, heavy thread"]}
      - {k: "e", name: ["跳针、针距不匀", "Skips, uneven stitches"], use: ["钩线（第 5 讲）、送布（第 6 讲）", "Hook (L5), feed (L6)"]}
      - {k: "f", name: ["电子张力", "Electronic tension"], use: ["电流给定，按工序切换", "Set by current, switched by operation"], hot: true}
    notes:
      - "把诊断收成一张速查表。正面冒底线，先查梭壳片簧和梭芯，再看面线是不是过紧。反面浮线，看面线卡进夹线盘没有、夹线器是不是太松，再查挑线簧。缝皱，两根线保持比例一起调松。断线，先查过线件和针眼有没有毛刺，厚料换粗线。跳针、针距不匀，回到第 5、6 讲。最后一格是电子张力：电磁铁推夹线盘，电流给定张力，可以存储、按工序自动切换。"
      - "Let's fold the diagnosis into a quick guide. Bobbin on top: check the case spring and the bobbin first, then whether the needle thread is too tight. Loops underneath: is the thread seated in the discs, is the assembly too loose, then the check spring. Pucker: loosen both threads together, keeping the ratio. Breaks: check the guides and eye for burrs first, and use heavier thread on heavy cloth. Skips and uneven stitches go back to Lectures 5 and 6. The last tile is electronic tension: a solenoid pushes the discs, the current sets the tension, and it can be stored and switched automatically by operation."

  - layout: lab
    title: ["虚拟实验 7-1：张力平衡与线迹截面", "Lab 7-1: tension balance and the stitch cross-section"]
    shot: {page: tension, vh: 1000}
    tasks:
      - ["打乱张力：先看偏向哪面，再调好", "Scramble: see which way it went, then fix it"]
      - ["底线太松的机器：只调底线", "Loose-bobbin machine: adjust only the bobbin"]
      - ["牛仔四层、衬里两层：找可用区", "Four plies of denim, two of lining: find the usable region"]
    notes:
      - "现在做虚拟实验 7-1。默认是衬衫棉布两层、Tex 24、夹线器 100、底线 40 厘牛。先只拖夹线器滑杆，找出交织点离开 0.4 到 0.6 的两个值，和教材比。任务一：按打乱张力，先看交织点偏向哪面、皱不皱，再调好。任务二：底线太松的机器，只动底线。任务三、四：牛仔四层不断线，衬里两层不起皱。"
      - "Now Lab 7-1. The default is two plies of shirt cotton, Tex 24, the assembly at 100 and the bobbin at 40. First drag only the assembly slider and find the two settings where the lock point leaves 0.4 to 0.6; compare with the book. Task one: press Scramble, see which way the point moved and whether it puckers, then fix it. Task two: the loose-bobbin machine, adjusting only the bobbin. Tasks three and four: denim without breaks, lining without pucker."

  - layout: points
    title: ["模型的边界与现场要点", "Model limits and field notes"]
    points:
      - ["0.41、平衡带、起皱和断线判据都是示意值", "0.41, the balance band, pucker and break rules are illustrative"]
      - ["真实张力是动态的，具体数值靠试缝调定", "Real tension is dynamic; the numbers come from test sewing"]
      - ["模型讲清两件事：比例定位置，大小定松紧和皱", "Two things it makes clear: ratio sets position, size sets tightness and pucker"]
    foot: ["起皱模型把穿过布厚的那段线也算作缩短，结果偏大", "The pucker model counts the thread through the cloth as shortening too, so it overestimates"]
    notes:
      - "说说模型的边界。0.41 这个系数、平衡带 B、起皱和断线的判据，都是示意值，不同机器、不同线差别很大；起皱模型把穿过布厚的那段线也算成缩短，结果偏大。真实的张力是动态的，还和挑线杆速度、挑线簧、线的弹性有关，具体数值要靠试缝调定。但模型把两件事讲清楚了：比例决定交织点的位置，大小决定线迹的松紧和起皱。"
      - "A word on the model's limits. The 0.41 factor, the balance band B, and the pucker and breakage rules are all illustrative and vary a lot between machines and threads; the pucker model also counts the thread through the cloth thickness as shortening, so it overestimates. Real tension is dynamic and depends on take-up speed, the check spring and the thread's elasticity, so actual values are set by test sewing. But the model makes two things clear: the ratio decides where the threads lock, and the size decides how tight the stitch is and whether it puckers."

  - layout: split
    title: ["机器人联系：腱绳驱动的机器人手", "Robot link: tendon-driven robot hands"]
    points:
      - ["电机拉绳，绳绕滑轮、过关节", "A motor pulls a cable round pulleys"]
      - ["每处包角都按 e^(μθ) 变", "Every wrap scales it by e^(μθ)"]
      - ["关节处装张力传感器闭环", "A tension sensor at the joint closes the loop"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><style>html.en-only .svgbox .en{font-size:26px!important;fill:#dbe4ef!important}</style><defs><marker id="ra" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f2b705"/></marker></defs><rect x="40" y="420" width="190" height="120" rx="18" fill="#1a2740" stroke="#f3f6fa" stroke-width="4"/><text x="135" y="470" font-size="30" fill="#f3f6fa" text-anchor="middle" font-weight="700"><tspan>电机</tspan></text><text x="135" y="500" font-size="22" fill="#f3f6fa" text-anchor="middle"><tspan class="en" font-size="22" fill="#8fa3ba"> motor</tspan></text><circle cx="330" cy="300" r="46" fill="#101b2e" stroke="#c8d2de" stroke-width="5"/><circle cx="330" cy="300" r="8" fill="#c8d2de"/><circle cx="520" cy="420" r="46" fill="#101b2e" stroke="#c8d2de" stroke-width="5"/><circle cx="520" cy="420" r="8" fill="#c8d2de"/><circle cx="700" cy="260" r="46" fill="#101b2e" stroke="#c8d2de" stroke-width="5"/><circle cx="700" cy="260" r="8" fill="#c8d2de"/><path d="M230 470 L300 340 A46 46 0 0 1 376 300 L490 452 A46 46 0 0 0 566 420 L670 222 A46 46 0 0 1 746 260 L800 120" stroke="#f2b705" stroke-width="6" fill="none"/><circle cx="800" cy="110" r="26" fill="#2ec4b6"/><text x="760" y="60" font-size="28" fill="#5ee0d2" text-anchor="end" font-weight="700"><tspan>指尖</tspan></text><text x="760" y="90" font-size="22" fill="#f3f6fa" text-anchor="end"><tspan class="en" font-size="22" fill="#8fa3ba"> fingertip</tspan></text><rect x="770" y="160" width="40" height="22" rx="4" fill="#ff7a45"/><path d="M800 182 L850 330" stroke="#ffb38f" stroke-width="2" stroke-dasharray="6 5"/><text x="890" y="360" font-size="24" fill="#ffb38f" text-anchor="end"><tspan>张力传感器</tspan></text><text x="890" y="388" font-size="22" fill="#f3f6fa" text-anchor="end"><tspan class="en" font-size="22" fill="#8fa3ba"> tension sensor</tspan></text><text x="40" y="80" font-size="28" fill="#f3f6fa" text-anchor="start" font-weight="700"><tspan>绳绕过滑轮、弯过关节</tspan></text><text x="40" y="110" font-size="22" fill="#f3f6fa" text-anchor="start"><tspan class="en" font-size="22" fill="#8fa3ba"> the cable wraps pulleys and joints</tspan></text><text x="40" y="160" font-size="26" fill="#f2b705" text-anchor="start"><tspan>总包角 270°、μ = 0.1：</tspan></text><text x="40" y="190" font-size="22" fill="#f3f6fa" text-anchor="start"><tspan class="en" font-size="22" fill="#8fa3ba"> total wrap 270°, μ = 0.1:</tspan></text><text x="40" y="250" font-size="44" font-weight="800" fill="#f2b705">× {{ch07.robot:.1f}}</text><text x="40" y="600" font-size="24" fill="#8fa3ba" text-anchor="start"><tspan>放松时比例反过来：迟滞</tspan></text><text x="40" y="628" font-size="22" fill="#f3f6fa" text-anchor="start"><tspan class="en" font-size="22" fill="#8fa3ba"> reversed when releasing: hysteresis</tspan></text></svg>
    notes:
      - "绞盘公式在机器人上天天用。许多灵巧手和柔性机械臂用腱绳驱动：电机在手掌或前臂里拉绳，绳绕过几个滑轮、弯过关节，再拉动指尖。这和面线从夹线器到交织点是同一个问题。总包角 270 度、μ 0.1，电机端张力约是指尖端的 {{ch07.robot:.1f}} 倍；放松时比例反过来，出现迟滞。所以常在关节附近装张力传感器做闭环，就像缝纫机的电子张力，用电磁铁电流给定夹线力。"
      - "Robots use the capstan equation every day. Many dexterous hands and soft arms are tendon-driven: a motor in the palm or forearm pulls a cable that wraps round pulleys and bends through the joints to pull the fingertip. That's the same problem as the needle thread running from the assembly to the lock point. With a total wrap of 270 degrees and mu of 0.1, the motor end pulls {{ch07.robot:.1f}} times the fingertip; when releasing, the ratio flips and you get hysteresis. So a tension sensor near the joint closes the loop, just like electronic thread tension on a sewing machine, where a solenoid current sets the disc force."

  - layout: split
    title: ["生活例子：码头上的缆桩", "Everyday example: a mooring bollard"]
    points:
      - ["绕两三圈，一个人拉得住船", "Two or three turns, one person holds a ship"]
      - ["每多绕一圈，张力放大好几倍", "Each turn multiplies the tension"]
      - ["针眼拐 180°：同理反过来用", "The eye: the same law, the other way"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><style>html.en-only .svgbox .en{font-size:26px!important;fill:#dbe4ef!important}</style><defs><marker id="ba" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff7a45"/></marker></defs><rect x="350" y="200" width="200" height="320" rx="30" fill="#4b5f7d"/><ellipse cx="450" cy="200" rx="100" ry="34" fill="#6b7f9d"/><path d="M350 300 Q450 340 550 290" stroke="#f2b705" stroke-width="12" fill="none"/><path d="M550 290 Q470 310 350 360" stroke="#f2b705" stroke-width="12" fill="none" opacity=".45"/><path d="M350 360 Q450 400 550 350" stroke="#f2b705" stroke-width="12" fill="none"/><path d="M550 350 Q470 370 350 420" stroke="#f2b705" stroke-width="12" fill="none" opacity=".45"/><path d="M350 420 Q450 460 550 410" stroke="#f2b705" stroke-width="12" fill="none"/><path d="M550 410 Q470 430 350 480" stroke="#f2b705" stroke-width="12" fill="none" opacity=".45"/><path d="M350 300 L80 230" stroke="#f2b705" stroke-width="12"/><path d="M552 410 L820 470" stroke="#f2b705" stroke-width="12"/><text x="60" y="180" font-size="28" fill="#ffb38f" text-anchor="start" font-weight="700"><tspan>船：拉力很大</tspan></text><text x="60" y="210" font-size="22" fill="#f3f6fa" text-anchor="start"><tspan class="en" font-size="22" fill="#8fa3ba"> ship: a big pull</tspan></text><text x="840" y="540" font-size="28" fill="#5ee0d2" text-anchor="end" font-weight="700"><tspan>人：拉力很小</tspan></text><text x="840" y="570" font-size="22" fill="#f3f6fa" text-anchor="end"><tspan class="en" font-size="22" fill="#8fa3ba"> sailor: a small pull</tspan></text><text x="450" y="90" font-size="28" fill="#f3f6fa" text-anchor="middle" font-weight="700"><tspan>每多绕一圈，张力放大好几倍</tspan></text><text x="450" y="120" font-size="22" fill="#f3f6fa" text-anchor="middle"><tspan class="en" font-size="22" fill="#8fa3ba"> each extra turn multiplies the tension</tspan></text><text x="450" y="600" font-size="24" fill="#8fa3ba" text-anchor="middle"><tspan>针眼拐 180°：同一公式反过来，削到约 1/3</tspan></text><text x="450" y="630" font-size="22" fill="#f3f6fa" text-anchor="middle"><tspan class="en" font-size="22" fill="#8fa3ba"> the eye: the same law, cutting to about 1/3</tspan></text></svg>
    notes:
      - "生活里的例子是码头上的缆桩。水手把缆绳在缆桩上绕两三圈，一个人就能拉住一条船：每多绕一圈，摩擦把张力放大好几倍，这就是绞盘公式。面线在针眼处拐约 180 度，张力被削减到三分之一左右，是同一个道理反过来用：船那头相当于挑线杆，人这头相当于交织点。"
      - "An everyday example: a mooring bollard. A sailor wraps the line two or three times round the bollard, and one person can hold a ship: every extra turn lets friction multiply the tension several times. That's the capstan equation. The needle thread turning about 180 degrees at the eye and losing two thirds of its tension is the same law used the other way: the ship's end is the take-up lever, the sailor's end is the lock point."

  - layout: answer
    tag: ["回到车间问题", "Back to the problem"]
    title: ["门襟起皱：两根线按比例一起调松", "The puckered placket: loosen both threads in proportion"]
    rows:
      - [["220/90：张力比 r、位置 z", "220/90: r and z"], "{{ch07.r220:.2f}} · {{ch07.z220:.2f}}"]
      - [["220/90：起皱、40 cm 短", "220/90: pucker, 40 cm"], "{{ch07.pk220:.1f}}% · {{ch07.mm220:.1f}} mm"]
      - [["100/40：起皱、40 cm 短", "100/40: pucker, 40 cm"], "{{ch07.pk100:.2f}}% · {{ch07.mm100:.1f}} mm"]
    side: {big: "{{ch07.KN:.2f}}", text: ["交织点处面线 ÷ 夹线器设定", "Lock-point needle tension ÷ setting"]}
    foot: ["平衡只说明比例对，不说明大小对；100/40 cN 时 r = {{ch07.r100:.2f}}，交织点处面线 {{ch07.tn100:.0f}} cN，不松", "Balance means the ratio, not the size; at 100/40 cN, r = {{ch07.r100:.2f}} and the lock-point tension is {{ch07.tn100:.0f}} cN, firm"]
    notes:
      - "回到开头。夹线器 220，交织点处面线约 {{ch07.tn220:.0f}} 厘牛，和底线 90 之比 {{ch07.r220:.2f}}，交织点在 {{ch07.z220:.2f}}，确实平衡。可两根线平均约 {{ch07.mean220:.0f}} 厘牛，缝长缩短 {{ch07.sh220:.1f}}%，扣掉面料吸收的 0.6%，起皱 {{ch07.pk220:.1f}}%，40 厘米短 {{ch07.mm220:.1f}} 毫米，就是那一条皱。保持比例一起调松到 100 和 40：r 是 {{ch07.r100:.2f}}，仍平衡，起皱 {{ch07.pk100:.2f}}%，只短 {{ch07.mm100:.1f}} 毫米，看不出来。"
      - "Back to the start. With the assembly at 220, the needle tension at the lock point is about {{ch07.tn220:.0f}}; against the 90 centinewton bobbin, r is {{ch07.r220:.2f}} and z is {{ch07.z220:.2f}}. It really is balanced. But the two threads average about {{ch07.mean220:.0f}}, so the seam shortens {{ch07.sh220:.1f}} percent; less the 0.6 percent the cotton absorbs, that's {{ch07.pk220:.1f}} percent pucker, {{ch07.mm220:.1f}} millimetres over 40 centimetres. That's the ridge. Loosen both in proportion, to 100 and 40: r is {{ch07.r100:.2f}}, still balanced, pucker {{ch07.pk100:.2f}} percent, only {{ch07.mm100:.1f}} millimetres. You can't see it."

  - layout: summary
    title: ["本讲小结", "Summary"]
    points:
      - ["夹线器加定值，过线件放大，针眼削到约 1/3", "The assembly adds, guides multiply, the eye cuts to about a third"]
      - ["比例定交织点位置：先调底线，再调面线", "The ratio sets the lock point: bobbin first, then needle thread"]
      - ["大小定松紧、起皱和断线：平衡不等于合适", "The size sets tightness, pucker and breaks: balanced isn't enough"]
    after: ["作业 7：线张力计算与线迹诊断 · 测验 · 实验 7-1 报告 —— 在问渠学习平台完成", "Assignment 7 · quiz · Lab 7-1 report — on WenQuest"]
    notes:
      - "这一讲记住三件事。第一，夹线器给面线加一个定值，过线件按 e 的 μθ 次方放大，针眼处削减到约三分之一，交织点处面线约为夹线器设定的 {{ch07.KN:.2f}} 倍。第二，两根线的张力比决定交织点的位置，先调底线、再按底线调面线，诊断时先判断哪一边变了。第三，平衡只说明比例对，张力大小决定线迹松紧、起皱和断线。下一讲讲运动协调与整机动力学。"
      - "Three things to remember. One: the assembly adds a fixed amount, the guides multiply by e to the mu theta, and the eye cuts it to about a third, so the needle tension at the lock point is about {{ch07.KN:.2f}} of the setting. Two: the ratio of the two tensions decides where the threads lock; set the bobbin first, then the needle thread, and when diagnosing, find out which side changed. Three: balance only means the ratio is right; the size of the tension decides tightness, pucker and breakage. Next time: motion coordination and machine dynamics."
