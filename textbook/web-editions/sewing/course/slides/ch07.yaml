slides:
  - layout: cover
    video: hero
    kicker: ["第 7 讲", "Lecture 7"]
    title: ["线张力与线迹质量", "Thread Tension and Stitch Quality"]
    sub: ["比例决定交织点在哪，大小决定皱不皱、断不断", "The ratio sets where the threads lock; the size sets pucker and breaks"]
    notes:
      - "前几讲讲一针怎么形成，这一讲讲形成得好不好。画面上突出的是挑线链，面线从机头的夹线器出来，经过挑线杆，一路走到针眼。线迹松紧、平不平、皱不皱、断不断，根子都在两根线的张力上。今天回答三个问题：张力从哪里来，比例怎样决定交织点的位置，大小怎样影响起皱和断线。"
      - "Earlier lectures showed how a stitch is formed; this one asks whether it's formed well. On screen the take-up train is highlighted: the needle thread leaves the tension assembly on the head, passes the take-up lever and runs down to the needle eye. Whether a stitch is tight, flat, puckered or broken comes down to the tension in the two threads. Three questions today: where tension comes from, how the ratio decides where the threads lock, and how the size affects pucker and breakage."

  - layout: question
    tag: ["车间问题", "Shop-floor problem"]
    title: ["门襟皱成一条", "A placket that puckers"]
    facts:
      - ["衬衫棉布两层 1.0 mm，针距 3 mm，Tex 24 线", "Two plies of shirt cotton, 1.0 mm; 3 mm stitch; Tex 24"]
      - ["嫌不够紧：夹线器 220 cN、底线 90 cN", "Wanting it tighter: assembly 220 cN, bobbin 90 cN"]
      - ["两面看都平衡，门襟却鼓起一条条细皱", "Balanced on both faces, yet the placket puckers"]
    notes:
      - "车间问题。某衬衫厂缝门襟，棉布两层，布厚 1 毫米，针距 3 毫米，用 Tex 24 的线。新来的修机工嫌线迹不够紧，把夹线器调到 220 厘牛，底线调到 90 厘牛。线迹两面看都很平衡，可缝好的门襟沿着缝线鼓起一条条细皱。线迹真的平衡吗？40 厘米的门襟短了多少？怎样调才能既平衡又不皱？最后来算。"
      - "Here's the problem. A shirt factory is sewing plackets: two plies of cotton, 1 millimetre thick, a 3 millimetre stitch, Tex 24 thread. A new mechanic thinks the stitches aren't tight enough and sets the tension assembly to 220 centinewtons and the bobbin to 90. The stitch looks balanced on both faces, but the finished placket puckers in fine ridges along the seam. Is it really balanced? How much shorter is a 40 centimetre placket? How do we get it balanced and flat? We'll work it out at the end."

  - layout: split
    title: ["四种看得见的毛病", "Four visible faults"]
    points:
      - ["正面冒底线、反面浮线：比例不对", "Bobbin on top, loops below: the ratio is wrong"]
      - ["沿缝线鼓起细皱：多半两根都太紧", "Ridges along the seam: usually both too tight"]
      - ["断线、起毛：峰值超过线的承受力", "Breaks, fraying: the peak is too high"]
    visual: {video: sweep}
    notes:
      - "修机师傅看线迹，先看四样：正面冒不冒底线，反面有没有浮线，缝线平不平，线断不断。这是虚拟实验 7-1 的线迹截面，蓝色面线、橙色底线，白点是交织点。夹线器一松一紧，交织点就上下跑。前两种毛病是比例不对，第三种多半是两根都太紧，第四种是峰值太高。"
      - "Looking at a seam, a mechanic checks four things: bobbin dots showing on top, loops of needle thread trailing underneath, whether the seam lies flat, and whether the thread breaks or frays. This is the stitch cross-section from Lab 7-1: blue is the needle thread, orange the bobbin, and the white dots are where they lock. As the tension assembly tightens and loosens, the lock point runs up and down. The first two faults are a wrong ratio, the third usually both too tight, the fourth a peak that's too high."

  - layout: section
    num: "01"
    title: ["张力从哪里来", "Where tension comes from"]

  - layout: split
    title: ["面线一路走、一路变", "The needle thread changes all along its path"]
    points:
      - ["面线：夹线器 → 过线件 → 针眼", "Needle thread: assembly, guides, eye"]
      - ["底线：梭壳片簧压住", "Bobbin thread: pressed by the case spring"]
      - ["加定值、乘倍数、针眼削减", "Add, multiply, then cut at the eye"]
    visual: {video: path}
    notes:
      - "先看张力从哪里来。这是第 4 讲的挑线机构动画，面线从夹线器出来，经过挑线簧，绕过几个过线件、挑线杆线孔和针杆线钩，最后穿过针眼。底线简单得多：从梭芯抽出来，从梭壳的片簧下面穿过，调节螺钉改变压力。面线路上每个零件都改变张力：夹线器加一个定值，过线件按倍数放大，针眼处拐约 180 度，削掉一大截。"
      - "First, where does tension come from? This is the take-up animation from Lecture 4. The needle thread leaves the tension assembly, passes the check spring, wraps round several guides, the take-up lever eye and the needle-bar guide, and finally goes through the needle eye. The bobbin thread is much simpler: drawn off the bobbin, it runs under a leaf spring on the case, and a screw sets the pressure. Every part on the needle-thread path changes the tension: the assembly adds a fixed amount, the guides multiply it, and the eye, where the thread turns about 180 degrees, cuts a big piece off."

  - layout: split
    title: ["夹线器：加一个定值", "The tension assembly adds a fixed amount"]
    points:
      - ["两面受摩擦：+ 2μN", "Both faces rub: + 2μN"]
      - ["例：10 + 2 × 0.2 × 200 = {{ch07.ex_out:.0f}} cN", "Example: 10 + 2 × 0.2 × 200 = {{ch07.ex_out:.0f}} cN"]
      - ["抬压脚：两盘顶开 ≥ 0.5 mm", "Foot up: the discs open ≥ 0.5 mm"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><style>html.en-only .svgbox .en{font-size:26px!important;fill:#dbe4ef!important}</style><defs><marker id="ta" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f2b705"/></marker></defs><defs><marker id="tb" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4c8dff"/></marker></defs><text x="40" y="70" font-size="42" fill="#f3f6fa" font-family="'DejaVu Serif',serif" font-style="italic">T<tspan font-size="26" baseline-shift="sub">out</tspan> = T<tspan font-size="26" baseline-shift="sub">in</tspan> + 2μN</text><text x="480" y="52" font-size="24" fill="#2ec4b6" text-anchor="start"><tspan>两面受摩擦：加一个定值</tspan></text><text x="480" y="80" font-size="22" fill="#f3f6fa" text-anchor="start"><tspan class="en" font-size="22" fill="#8fa3ba"> both faces rub: a fixed amount</tspan></text><path d="M110 370 L760 370" stroke="#c8d2de" stroke-width="18" stroke-linecap="round"/><text x="110" y="420" font-size="24" fill="#8fa3ba" text-anchor="start"><tspan>夹线柱</tspan></text><text x="110" y="450" font-size="22" fill="#f3f6fa" text-anchor="start"><tspan class="en" font-size="22" fill="#8fa3ba"> stud</tspan></text><rect x="400" y="250" width="24" height="240" rx="10" fill="#1a2740" stroke="#f3f6fa" stroke-width="4"/><rect x="432" y="250" width="24" height="240" rx="10" fill="#1a2740" stroke="#f3f6fa" stroke-width="4"/><text x="388" y="530" font-size="24" fill="#8fa3ba" text-anchor="end"><tspan>两片夹线盘</tspan></text><text x="388" y="560" font-size="22" fill="#f3f6fa" text-anchor="end"><tspan class="en" font-size="22" fill="#8fa3ba"> two discs</tspan></text><path d="M460 370 L480 400 L500 340 L520 400 L540 340 L560 400 L580 340 L600 400 L620 340 L640 400 L660 340 L680 370" stroke="#f2b705" stroke-width="5" fill="none"/><rect x="680" y="330" width="70" height="80" rx="10" fill="#4b5f7d" stroke="#f3f6fa" stroke-width="3"/><text x="570" y="292" font-size="24" fill="#f2b705" text-anchor="middle"><tspan>压簧</tspan></text><text x="570" y="316" font-size="22" fill="#f3f6fa" text-anchor="middle"><tspan class="en" font-size="22" fill="#8fa3ba"> spring</tspan></text><text x="715" y="450" font-size="24" fill="#8fa3ba" text-anchor="middle"><tspan>张力螺母</tspan></text><text x="715" y="480" font-size="22" fill="#f3f6fa" text-anchor="middle"><tspan class="en" font-size="22" fill="#8fa3ba"> nut</tspan></text><path d="M650 230 L470 230" stroke="#f2b705" stroke-width="5" marker-end="url(#ta)"/><text x="662" y="242" font-size="34" fill="#f2b705" text-anchor="start" font-weight="700"><tspan>N</tspan></text><path d="M428 150 L428 610" stroke="#4c8dff" stroke-width="7" marker-end="url(#tb)"/><text x="410" y="180" font-size="26" fill="#9cc0ff" text-anchor="end" font-weight="700"><tspan>面线</tspan></text><text x="410" y="210" font-size="22" fill="#f3f6fa" text-anchor="end"><tspan class="en" font-size="22" fill="#8fa3ba"> needle thread</tspan></text><text x="446" y="182" font-size="30" fill="#f3f6fa" text-anchor="start" font-weight="700"><tspan>T入</tspan><tspan class="en" font-size="22" fill="#8fa3ba"> T in</tspan></text><text x="446" y="600" font-size="30" fill="#f3f6fa" text-anchor="start" font-weight="700"><tspan>T出</tspan><tspan class="en" font-size="22" fill="#8fa3ba"> T out</tspan></text><text x="560" y="540" font-size="26" fill="#f3f6fa" text-anchor="start"><tspan>拧紧螺母 → N 变大</tspan></text><text x="560" y="570" font-size="22" fill="#f3f6fa" text-anchor="start"><tspan class="en" font-size="22" fill="#8fa3ba"> tighten the nut → larger N</tspan></text></svg>
    notes:
      - "夹线器由夹线柱、两片夹线盘、压簧和张力螺母组成。面线从两片盘中间穿过，压簧把盘压紧，线被拉动时两面都受摩擦，所以张力增加 2 乘 μ 乘 N。它加的是一个定值，和进来的张力无关。拧紧螺母，N 变大，面线就紧。举个数：进来 10 厘牛，压簧 200 厘牛，μ 0.2，出来 {{ch07.ex_out:.0f}} 厘牛。抬起压脚时，两片盘被顶开至少 0.5 毫米，线就能抽出来取布。"
      - "The tension assembly is a stud, two discs, a compression spring and a nut. The needle thread runs between the discs; the spring presses them together, and when the thread is pulled both its faces rub, so the tension rises by 2 times mu times N. That's a fixed amount added, whatever comes in. Tighten the nut, N goes up, and the thread gets tighter. A number: 10 centinewtons in, a 200 centinewton spring, mu of 0.2, and {{ch07.ex_out:.0f}} comes out. When you lift the presser foot, the discs are pushed at least half a millimetre apart, so the thread pulls out freely."

  - layout: split
    title: ["绞盘公式：乘一个倍数", "The capstan equation multiplies"]
    points:
      - ["绕过包角 θ：T₂ = T₁e^(μθ)", "Round a wrap θ: T₂ = T₁e^(μθ)"]
      - ["线从张力小的一端滑向大的一端", "Thread slides from low to high tension"]
      - ["交织点在上游：只剩约 1/3", "The lock point is upstream: about 1/3"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><style>html.en-only .svgbox .en{font-size:26px!important;fill:#dbe4ef!important}</style><path d="M110 560 L860 560 M110 560 L110 150" stroke="#4b5f7d" stroke-width="3"/><text x="110" y="596" font-size="24" fill="#8fa3ba" text-anchor="middle">0°</text><text x="360" y="596" font-size="24" fill="#8fa3ba" text-anchor="middle">90°</text><text x="610" y="596" font-size="24" fill="#8fa3ba" text-anchor="middle">180°</text><text x="860" y="596" font-size="24" fill="#8fa3ba" text-anchor="middle">270°</text><text x="96" y="568" font-size="24" fill="#8fa3ba" text-anchor="end">×1</text><text x="96" y="481" font-size="24" fill="#8fa3ba" text-anchor="end">×2</text><path d="M110 473 L860 473" stroke="#1e2c45" stroke-width="2"/><text x="96" y="395" font-size="24" fill="#8fa3ba" text-anchor="end">×3</text><path d="M110 387 L860 387" stroke="#1e2c45" stroke-width="2"/><text x="96" y="308" font-size="24" fill="#8fa3ba" text-anchor="end">×4</text><path d="M110 300 L860 300" stroke="#1e2c45" stroke-width="2"/><text x="96" y="221" font-size="24" fill="#8fa3ba" text-anchor="end">×5</text><path d="M110 213 L860 213" stroke="#1e2c45" stroke-width="2"/><path d="M110.0 560.0 L123.9 558.5 L137.8 556.9 L151.7 555.3 L165.6 553.7 L179.4 552.1 L193.3 550.4 L207.2 548.7 L221.1 547.0 L235.0 545.3 L248.9 543.5 L262.8 541.7 L276.7 539.8 L290.6 537.9 L304.4 536.0 L318.3 534.1 L332.2 532.1 L346.1 530.1 L360.0 528.0 L373.9 525.9 L387.8 523.8 L401.7 521.6 L415.6 519.4 L429.4 517.2 L443.3 514.9 L457.2 512.6 L471.1 510.2 L485.0 507.8 L498.9 505.4 L512.8 502.9 L526.7 500.4 L540.6 497.8 L554.4 495.2 L568.3 492.5 L582.2 489.8 L596.1 487.0 L610.0 484.2 L623.9 481.4 L637.8 478.4 L651.7 475.5 L665.6 472.5 L679.4 469.4 L693.3 466.3 L707.2 463.1 L721.1 459.9 L735.0 456.6 L748.9 453.2 L762.8 449.8 L776.7 446.4 L790.6 442.8 L804.4 439.2 L818.3 435.6 L832.2 431.9 L846.1 428.1 L860.0 424.3" stroke="#2ec4b6" stroke-width="6" fill="none"/><path d="M110.0 560.0 L123.9 557.3 L137.8 554.5 L151.7 551.7 L165.6 548.7 L179.4 545.7 L193.3 542.6 L207.2 539.3 L221.1 536.0 L235.0 532.6 L248.9 529.0 L262.8 525.4 L276.7 521.6 L290.6 517.8 L304.4 513.8 L318.3 509.6 L332.2 505.4 L346.1 501.0 L360.0 496.5 L373.9 491.8 L387.8 487.0 L401.7 482.1 L415.6 477.0 L429.4 471.7 L443.3 466.3 L457.2 460.7 L471.1 454.9 L485.0 449.0 L498.9 442.8 L512.8 436.5 L526.7 430.0 L540.6 423.3 L554.4 416.4 L568.3 409.2 L582.2 401.8 L596.1 394.2 L610.0 386.4 L623.9 378.3 L637.8 370.0 L651.7 361.4 L665.6 352.6 L679.4 343.5 L693.3 334.1 L707.2 324.4 L721.1 314.4 L735.0 304.1 L748.9 293.5 L762.8 282.5 L776.7 271.2 L790.6 259.6 L804.4 247.6 L818.3 235.2 L832.2 222.4 L846.1 209.3 L860.0 195.7" stroke="#ff7a45" stroke-width="6" fill="none"/><text x="140" y="200" font-size="28" fill="#ff7a45" text-anchor="start" font-weight="700"><tspan>μ = 0.35</tspan></text><text x="140" y="240" font-size="28" fill="#2ec4b6" text-anchor="start" font-weight="700"><tspan>μ = 0.2</tspan></text><circle cx="269" cy="541" r="12" fill="#2ec4b6"/><circle cx="610" cy="386" r="12" fill="#ff7a45"/><path d="M269 527 L230 330" stroke="#5ee0d2" stroke-width="2" stroke-dasharray="6 5"/><text x="140" y="315" font-size="24" fill="#5ee0d2"><tspan>过线件</tspan><tspan class="en" font-size="22" fill="#8fa3ba"> guide</tspan> 1 rad: × {{ch07.GUIDE:.2f}}</text><text x="590" y="360" font-size="24" fill="#ffb38f" text-anchor="end"><tspan>针眼</tspan><tspan class="en" font-size="22" fill="#8fa3ba"> eye</tspan> 180°: × {{ch07.cap180:.2f}}</text><text x="110" y="70" font-size="40" fill="#f3f6fa" font-family="'DejaVu Serif',serif" font-style="italic">T₂ = T₁ e<tspan font-size="26" baseline-shift="super">μθ</tspan></text><text x="420" y="62" font-size="24" fill="#2ec4b6" text-anchor="start"><tspan>乘一个倍数，按包角指数增长</tspan></text><text x="420" y="90" font-size="22" fill="#f3f6fa" text-anchor="start"><tspan class="en" font-size="22" fill="#8fa3ba"> a factor that grows with the wrap</tspan></text><text x="485" y="630" font-size="24" fill="#8fa3ba" text-anchor="middle"><tspan>包角 θ</tspan><tspan class="en" font-size="22" fill="#8fa3ba"> wrap angle θ</tspan></text></svg>
    notes:
      - "线绕过一个圆柱形的零件，比如过线件，摩擦造成的就不是定值，而是一个倍数：T₂ 等于 T₁ 乘 e 的 μθ 次方，这就是绞盘公式。μ 0.2、绕 1 弧度，放大 {{ch07.GUIDE:.2f}} 倍；μ 0.35、绕 180 度，放大 {{ch07.cap180:.1f}} 倍。反过来读同样重要：线总是从张力小的一端被拉向大的一端。收紧线迹时，交织点这头是上游，挑线杆处的张力过了针眼，传到交织点只剩三分之一左右。"
      - "When thread wraps round a cylindrical part such as a guide, friction no longer adds a fixed amount but multiplies: T2 equals T1 times e to the mu theta. That's the capstan equation. Mu 0.2 over 1 radian gives a factor of {{ch07.GUIDE:.2f}}; mu 0.35 over 180 degrees gives {{ch07.cap180:.1f}}. Read it the other way too: thread always slides from its low-tension end towards its high-tension end. When the stitch is tightened, the lock point is the upstream end, so the take-up tension, after the turn at the eye, arrives there cut to about a third."

  - layout: points
    title: ["底线与挑线簧", "The bobbin thread and the check spring"]
    points:
      - ["底线只在被拉出时才有张力：主要在收紧时", "The bobbin has tension only while drawn out: mainly at tightening"]
      - ["一针里基本不变：是稳定的基准", "It stays nearly constant within a stitch: a stable reference"]
      - ["挑线簧：放线时收住余线，行程约 7 mm", "Check spring: takes up slack while paying out; about 7 mm stroke"]
    notes:
      - "再说底线。底线张力来自梭壳片簧，而且只有被拉出来的时候才有张力，这主要发生在挑线杆收紧线迹的那一刻。正因为它在一针里基本不变，底线是一个稳定的基准，后面讲调张力的顺序要用到。面线这边还有第 4 讲的挑线簧：挑线杆放线时，它把多余的面线收住，保持一个小张力，维修手册要求行程约 7 毫米。"
      - "Now the bobbin thread. Its tension comes from the leaf spring on the case, and it exists only while thread is being drawn out, which happens mainly at the moment the take-up lever tightens the stitch. Because it stays nearly constant within a stitch, the bobbin is a stable reference; we'll use that when we set the order of adjustment. On the needle side there's also the check spring from Lecture 4: while the lever pays out, it takes up the slack and keeps a small tension. The service manual asks for a stroke of about 7 millimetres."

