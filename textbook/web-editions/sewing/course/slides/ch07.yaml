    title: ["平衡模型：张力比决定位置", "The balance model: the ratio sets the position"]
    points:
      - ["r = 1：z = 0.5，在正中", "r = 1: z = 0.5, dead centre"]
      - ["r = B：到布面；0.4–0.6 算平衡", "r = B: at the top; 0.4–0.6 is balanced"]
