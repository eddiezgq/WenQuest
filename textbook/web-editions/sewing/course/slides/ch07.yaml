45" text-anchor="start" font-weight="700"><tspan>收紧峰：夹线器设定决定</tspan></text><text x="317.75" y="178.09523809523813" font-size="22" fill="#f3f6fa" text-anchor="start"><tspan class="en" font-size="22" fill="#8fa3ba"> tightening peak: set by the tension assembly</tspan></text><text x="361.6666666666667" y="356.57142857142856" font-size="26" fill="#9cc0ff" text-anchor="start"><tspan>放线：挑线簧维持小张力</tspan></text><text x="361.6666666666667" y="386.57142857142856" font-size="22" fill="#f3f6fa" text-anchor="start"><tspan class="en" font-size="22" fill="#8fa3ba"> paying out: the check spring keeps it small</tspan></text><text x="1306.75" y="239.04761904761904" font-size="26" fill="#ffb38f" text-anchor="middle"><tspan>线环绕过梭壳：第二个小峰</tspan></text><text x="1306.75" y="269.04761904761904" font-size="22" fill="#f3f6fa" text-anchor="middle"><tspan class="en" font-size="22" fill="#8fa3ba"> loop round the case: a second, smaller peak</tspan></text><text x="100.0" y="550" font-size="24" fill="#8fa3ba" text-anchor="start"><tspan>55° 以前：从夹线器拉出下一针的线</tspan></text><text x="100.0" y="578" font-size="22" fill="#f3f6fa" text-anchor="start"><tspan class="en" font-size="22" fill="#8fa3ba"> before 55°: the next stitch's thread is drawn through the discs</tspan></text><text x="1660" y="550" font-size="24" fill="#8fa3ba" text-anchor="end"><tspan>主轴转角（示意曲线）</tspan><tspan class="en" font-size="22" fill="#8fa3ba"> shaft angle (illustrative)</tspan></text></svg>
    h: 600
    notes:
      - "面线张力在一针里不是常数。有研究在夹线器下游装了张力传感器，规律是这样的：最高的峰出现在收紧线迹那一刻，直接受夹线器预张力控制；之后挑线杆放线，挑线簧维持一个小张力；钩线以后线环绕过梭壳，又有一个小峰。布厚几乎不影响，底线只在脱环前后起作用。结论很实际：拧夹线器，改的主要就是这个收紧峰。"
      - "Needle-thread tension isn't constant within a stitch. A study put a tension sensor just after the tension assembly and found this pattern: the highest peak comes at the moment the stitch is tightened, and it's controlled directly by the assembly's pre-tension. Then the take-up pays out and the check spring keeps a small tension; after the catch the loop passes round the bobbin case and gives a second, smaller peak. Fabric thickness hardly matters, and the bobbin only plays a part around cast-off. The practical point: turning the tension nut mainly changes that tightening peak."

  - layout: section
    num: "02"
    title: ["线迹平衡", "Stitch balance"]

  - layout: split
    title: ["交织点被两头拉：像拔河", "A tug of war at the lock point"]
    points:
      - ["面线往上拉，底线往下拽", "The needle thread pulls up, the bobbin down"]
      - ["交织点向张力大的一边走", "The point moves to the stronger side"]
      - ["布孔边缘的摩擦像刹车", "Friction at the hole edges is a brake"]
    visual: {video: sweep}
    notes:
      - "收紧线迹那一刻，挑线杆把面线往上拉，底线从梭壳里被拉出，把交织点往下拽，就像拔河。看截面：夹线器调紧，交织点被拉向布面，正面露出橙色的底线小点；调松，交织点跑到布底，反面拖出面线。只有大致相等，交织点才停在布中间，这叫线迹平衡。不需要严格相等，因为线在布孔上下边缘拐弯，那里的摩擦像刹车。"
      - "As the stitch is tightened, the take-up pulls the needle thread up while the bobbin thread, drawn out of the case, pulls the lock point down. It's a tug of war. Watch the section: tighten the assembly and the lock point is pulled to the top, and orange bobbin dots show on the face; loosen it and the point runs to the bottom and needle thread trails underneath. Only when the two are roughly equal does it sit in the middle. That's a balanced stitch. They needn't be exactly equal, because the threads turn at the edges of the hole, and friction there works like a brake."

