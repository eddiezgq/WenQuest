    notes:
      - "教材用示意模型量化：交织点位置 z 从布底 0 到布面 1，r 是交织点处面线除以底线张力。r 等于 1，z 是 0.5；r 等于平衡带 B，到布面。z 在 0.4 到 0.6 算平衡。牛仔布 B 是 3，曲线平，好调；衬里 B 是 1.8，曲线陡，稍偏就跑到表面。"
      - "The book puts numbers on this with an illustrative model. The lock-point position z runs from 0 at the bottom of the cloth to 1 at the top, and r is the needle tension at the lock point divided by the bobbin tension. At r equal to 1, z is 0.5, right in the middle; at r equal to the balance band B, the point reaches the top. Between 0.4 and 0.6 counts as balanced. Look at the three curves: denim, with B of 3, is flat and easy to set; lining, with B of 1.8, is steep, and a small error sends the point to a surface. The straight-line relation is only a teaching simplification."

  - layout: bignum
    title: ["夹线器为什么比底线紧好几倍", "Why the assembly is set several times tighter"]
    nums:
      - {n: "× {{ch07.GUIDE:.2f}}", n_en: "guides", label: ["过线件放大：e^(0.2 × 1)", "The guides multiply: e^(0.2 × 1)"]}
      - {n: "× {{ch07.EYEK:.2f}}", n_en: "needle eye", label: ["针眼削减：e^(−0.35π)", "The eye cuts: e^(−0.35π)"]}
      - {n: "× {{ch07.KN:.2f}}", n_en: "assembly → lock point", label: ["交织点处面线 ÷ 夹线器设定", "Lock-point tension ÷ setting"]}
    foot: ["底线 40 cN：r = 1 要夹线器约 {{ch07.td1:.0f}} cN，棉布平衡区约 {{ch07.tdlo:.0f}}–{{ch07.tdhi:.0f}} cN（系数为算例值）", "Bobbin 40 cN: r = 1 needs about {{ch07.td1:.0f}} cN; cotton balances at about {{ch07.tdlo:.0f}}–{{ch07.tdhi:.0f}} cN (example factors)"]
    notes:
      - "夹线器为什么要比底线紧好几倍？模型里比的是交织点处的面线张力。从夹线器到交织点，面线先绕过过线件被放大 {{ch07.GUIDE:.2f}} 倍，再拐过针眼只剩三分之一，两个一乘，约为夹线器设定值的 {{ch07.KN:.2f}} 倍。所以底线 40 厘牛，要 r 等于 1，夹线器得调到约 {{ch07.td1:.0f}} 厘牛；棉布的平衡区对应约 {{ch07.tdlo:.0f}} 到 {{ch07.tdhi:.0f}} 厘牛。"
      - "Everyone on the shop floor knows the assembly must be several times tighter than the bobbin for a balanced stitch. Why? The model compares the needle tension at the lock point. From the assembly to that point, the thread is first multiplied by {{ch07.GUIDE:.2f}} round the guides, then cut to a third at the eye; together, about {{ch07.KN:.2f}} of the assembly setting. So with a 40 centinewton bobbin, r equal to 1 needs the assembly at about {{ch07.td1:.0f}}, and the cotton balance zone is roughly {{ch07.tdlo:.0f}} to {{ch07.tdhi:.0f}}."

  - layout: duo
    title: ["可用区：哪种布好调", "The usable region: which cloth is easy"]
    left: {video: lining, label: ["衬里两层，B = 1.8", "Two plies of lining, B = 1.8"], note: ["绿色可用区窄：要调得准", "A narrow green region: set it precisely"]}
    right: {video: cotton, label: ["衬衫棉布两层，B = 2.2", "Two plies of shirt cotton, B = 2.2"], note: ["可用区较宽：好调", "A wider region: easy to set"]}
    notes:
      - "这是实验 7-1 的张力平面图，横轴夹线器、纵轴底线张力。绿色可用：平衡、不松、不皱、不断；黄色不平衡，灰色太松，红色起皱，紫色有断线风险。右边棉布，绿色带比较宽；左边衬里，薄而滑，绿色带又窄又靠下，张力稍大就起皱。"
      - "This is the tension plane from Lab 7-1: across is the assembly tension, up is the bobbin tension. Green is usable: balanced, firm, flat and unbroken. Yellow is unbalanced, grey too loose, red puckered, and purple a breakage risk. The white ring is the current setting, 100 on the assembly and 40 on the bobbin. On the right, cotton has a fairly wide green band; on the left, thin, slippery lining has a narrow band set low down, and a little extra tension brings pucker."

  - layout: section
    num: "03"
    title: ["调张力的顺序与诊断", "Order of adjustment and diagnosis"]

  - layout: points
    title: ["先调底线，再按底线调面线", "Set the bobbin first, then match the needle thread"]
    points:
      - ["底线由片簧定，一针里不变：是基准", "The bobbin is set by a spring and stays constant: the reference"]
      - ["调梭壳要取出；调夹线器只转螺母", "The case must come out; the assembly needs only a nut turn"]
      - ["日常换料，只动夹线器", "For routine changes of cloth, touch only the assembly"]
    notes:
      - "调张力有个约定俗成的顺序：先调底线，再按底线调面线。理由有两条。第一，底线张力由片簧定，一针里基本不变，是稳定的基准；面线张力受挑线、过线件、转速影响多，适合跟着调。第二，调梭壳要把它取出来，调夹线器只要转一下螺母。所以日常换料只动夹线器。这个顺序也给了诊断一个方向。"
      - "There's an established order for setting tension: the bobbin first, then the needle thread to match. Two reasons. One, the bobbin tension is set by its leaf spring and stays nearly constant within a stitch, so it's a stable reference, while the needle tension depends on the take-up, the guides and the speed, so it's the one that follows. Two, adjusting the case means taking it out, while the assembly needs just a turn of the nut. So for routine changes of cloth you only touch the assembly. The same order points the way when diagnosing."

  - layout: split
    title: ["诊断：先判断是哪一边变了", "Diagnosis: first find which side changed"]
    points:
      - ["正面冒底线：r 太大", "Bobbin on top: r too large"]
      - ["昨天好、今天突然这样：查底线", "Fine yesterday, not today: check the bobbin"]
      - ["反面浮线：r 太小，或没卡进夹线盘", "Loops below: r too small, or not in the discs"]
    visual: {video: lowb}
    notes:
      - "调张力的顺序是先调底线、再按底线调面线：底线由片簧定，是基准。看截面：这台机器底线太松，交织点被拉到布面，正面冒出底线小点。r 太大，可能是面线太紧，也可能是底线太松。夹线器还是平时的值、机器突然这样，多半是底线出了问题，比如片簧松了、梭芯绕松了，拧松夹线器只是治标。反面浮线说明 r 太小，还可能是面线没卡进夹线盘，要抬着压脚穿线。"
      - "The rule is bobbin first, then the needle thread to match, because the bobbin, set by its spring, is the stable reference. Look at the section: this machine has a loose bobbin, the lock point is pulled to the top, and bobbin dots show on the face. r is too large, which could mean a tight needle thread or a loose bobbin. If the assembly is at its usual setting and the machine suddenly does this, the bobbin is the likely culprit, such as a loose case spring or a loosely wound bobbin, and loosening the assembly only hides it. Loops underneath mean r is too small, or the thread isn't seated between the discs, so thread it with the foot up."

  - layout: section
    num: "04"
    title: ["缝皱与断线", "Pucker and breakage"]

