lesson: 13
code: [ch13]

clips:
  hero:          # 封面：实验 13-1 手轮停针动画（慢放 20 倍），每 7 秒重放一次；手轮左、上、下留白，挪到右边、缩小，不压封面标题；不画左上角的时间、误差文字
    page: servo
    selector: "#wheel"
    cover: true
    dur: 7
    loop: 7
    steps:
      - {at: 0, press: "#play", js: "(function(){var c=document.getElementById('wheel');c.style.cssText+=';position:fixed;left:0;top:0;z-index:9999;background:#fff;box-sizing:content-box;padding:140px 0 140px 260px;width:540px;height:420px;max-width:none';var g=c.getContext('2d');if(g.__wqHide)return;g.__wqHide=1;var f=g.fillText;g.fillText=function(t){if(/^(t = |误差|Error)/.test(String(t)))return;return f.apply(this,arguments)}})()"}
  wheel:         # 停针动画：标准增益，每 7 秒重放
    page: servo
    selector: "#wheel"
    dur: 7
    loop: 7
    steps:
      - {at: 0, press: "#play"}
  err200:        # 位置误差：K_p = 200，每 7 秒重放（时间光标走一遍）
    page: servo
    selector: "#err"
    dur: 7
    loop: 7
    steps:
      - {at: 0, set: {Kp: 200}, press: "#play"}
  err500:        # 位置误差：K_p = 500，冲过头
    page: servo
    selector: "#err"
    dur: 7
    loop: 7
    steps:
      - {at: 0, set: {Kp: 500}, press: "#play"}
  noint:         # 去掉积分 T_i = 0：主轴被摩擦卡在目标附近
    page: servo
    selector: "#err"
    dur: 7
    loop: 7
    steps:
      - {at: 0, set: {Ti: 0}, press: "#play"}
  boost:         # 实验 13-2：强激磁时间在 0–20 ms 之间来回（14 秒一个来回），看衔铁吸不吸得动
    page: solenoid
    selector: "#plot"
    dur: 14
    loop: 14
    steps:
      - {at: 0, js: "clearInterval(window.__sw);var e=document.getElementById('tb'),t0=Date.now();window.__sw=setInterval(function(){var t=(Date.now()-t0)/1000;e.value=Math.round(10+10*Math.cos(t*2*Math.PI/14));e.dispatchEvent(new Event('input',{bubbles:true}));},300)"}
  release:       # 续流电压在 0.7–60 V 之间来回：释放延迟折算成的主轴转角跟着变
    page: solenoid
    selector: "#plot"
    dur: 14
    loop: 14
    steps:
      - {at: 0, js: "clearInterval(window.__sw);var e=document.getElementById('Vz'),t0=Date.now();window.__sw=setInterval(function(){var t=(Date.now()-t0)/1000;e.value=(30.35-29.65*Math.cos(t*2*Math.PI/14)).toFixed(1);e.dispatchEvent(new Event('input',{bubbles:true}));},300)"}

slides:
  - layout: cover
    video: hero
    kicker: ["第 13 讲", "Lecture 13"]
    title: ["控制基础： 电⁠机⁠、⁠驱⁠动⁠与⁠传⁠感", "Control Basics: Motors, Drives and Sensors"]
    sub: ["主轴怎样停准，执行器慢多少度", "Stopping the shaft precisely; how many degrees the actuators lag"]
    notes:
      - "同学们好。从这一讲开始进入电控。一台电控平缝机，机构还是那些机构，只是主轴改由伺服电机驱动，剪线、倒缝、抬压脚交给电磁铁、气缸和步进电机。这一讲抓两个贯穿的问题：主轴怎样停准在上针位；执行器的延迟折合成多少度主轴转角。"
      - "Hello everyone. From today we move into control. An electronically controlled lockstitch machine has the same mechanisms as before, but the main shaft is driven by a servo motor, and trimming, reverse stitching and foot lifting are handed to solenoids, air cylinders and steppers. Two questions run through this lecture: how to stop the shaft precisely at needle-up, and how many degrees of shaft rotation the actuators' delays amount to."

  - layout: question
    tag: ["车间问题", "Shop-floor problem"]
    title: ["剪线转速提到 600 以后，剪线时好时坏", "Trimming went erratic at 600 r/min"]
    facts:
      - ["剪线转速 400 → 600 r/min，为了缩短停车时间", "Trimming speed 400 → 600 r/min to shorten each stop"]
      - ["电磁铁：吸合 6.9 ms；二极管续流释放 12.9 ms", "Solenoid: pull-in 6.9 ms; diode-freewheeling release 12.9 ms"]
      - ["换 48 V 稳压管释放 5.1 ms；两者都要 ≤ 20° 主轴转角", "48 V Zener: release 5.1 ms; both must be ≤ 20° of shaft angle"]
    notes:
      - "车间问题。一个缝制车间为了缩短每道缝的停车时间，把一批电控平缝机的剪线转速从每分钟 400 转提到 600 转，结果剪线时好时坏。剪线电磁铁：线圈 8 欧，24 伏强激磁后 1 安维持，吸合延迟 6.9 毫秒；现在用二极管续流，释放 12.9 毫秒；换 48 伏稳压管续流，释放 5.1 毫秒。剪线机构要求吸合和释放都不超过 20 度主轴转角。问题出在哪？转速最高能设多少？"
      - "The shop-floor problem. To shorten the stop at the end of each seam, a sewing floor raised the trimming speed of its electronic lockstitch machines from 400 to 600 r/min, and trimming became erratic. The trimming solenoid has an 8-ohm coil, a 24-volt boost then 1-amp hold, and a pull-in delay of 6.9 milliseconds; with diode freewheeling it releases in 12.9 milliseconds, with a 48-volt Zener in 5.1. The mechanism needs both pull-in and release within 20 degrees of shaft angle. What's wrong, and what's the highest trimming speed?"

