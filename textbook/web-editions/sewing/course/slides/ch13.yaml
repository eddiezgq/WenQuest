      - "一台电控平缝机分三类部件：传感器、控制箱、执行器。传感器有主轴编码器、脚踏、断线检测、底线余量、布厚和布边；控制箱里是伺服驱动和控制程序；执行器有主轴伺服电机、剪线和倒缝电磁铁、抬压脚气缸、针距步进电机。机构还是主轴带动的那些机构，只是主轴改由伺服电机驱动，附加动作由执行器按主轴角度完成。"
      - "An electronic lockstitch machine has three kinds of parts: sensors, the controller, and actuators. The sensors are the shaft encoder, the pedal, thread-break detection, bobbin-thread monitoring, fabric thickness and edge sensors. The controller holds the servo drive and the control program. The actuators are the main-shaft servo, the trimming and reverse solenoids, the foot-lift cylinder and the stitch-length stepper. The mechanisms are still those driven by the shaft; the shaft is now driven by a servo, and the extra actions are carried out by actuators at given shaft angles."

  - layout: split
    title: ["从离合器电机到直驱伺服", "From clutch motor to direct-drive servo"]
    points:
      - ["离合器电机一直空转：费电发热，停车靠运气", "A clutch motor idles all day: wasteful, and stops by luck"]
      - ["直驱：转子装在主轴上，没有皮带弹性和打滑", "Direct drive: rotor on the shaft, no belt stretch or slip"]
      - ["矢量控制：i_d = 0，转矩 T = k_t · i_q", "Vector control: i_d = 0, torque T = k_t · i_q"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640"><style>html:not(.en-only) .eo{display:none}html.en-only .zo{display:none}</style>
          <defs><marker id="v13" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2b705"/></marker>
            <marker id="v13b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2ec4b6"/></marker></defs>
          <circle cx="400" cy="340" r="230" fill="none" stroke="#22324d" stroke-width="4"/>
          <rect x="300" y="290" width="200" height="100" rx="20" fill="#2a3a55"/>
          <rect x="300" y="290" width="100" height="100" rx="20" fill="#4c8dff"/><rect x="400" y="290" width="100" height="100" rx="20" fill="#ff7a45"/>
          <text x="350" y="352" font-size="34" font-weight="800" fill="#08101d" text-anchor="middle" class="en">S</text><text x="450" y="352" font-size="34" font-weight="800" fill="#08101d" text-anchor="middle" class="en">N</text>
          <path d="M400 340 L760 340" stroke="#2ec4b6" stroke-width="8" marker-end="url(#v13b)"/>
          <text x="770" y="330" font-size="30" font-weight="800" fill="#5ee0d2" class="en">d</text>
          <text x="620" y="390" font-size="22" fill="#8fa3ba">转子磁场 · rotor flux</text>
          <path d="M400 340 L400 60" stroke="#f2b705" stroke-width="10" marker-end="url(#v13)"/>
          <text x="420" y="80" font-size="34" font-weight="800" fill="#f2b705" class="en">i_q</text>
          <text x="420" y="120" font-size="22" fill="#d3deea">正交：转矩最大</text><text class="eo" x="420" y="120" font-size="22" fill="#d3deea">at 90°: most torque</text>
          <path d="M530 340 A130 130 0 0 0 400 210" fill="none" stroke="#d3deea" stroke-width="3"/><text x="510" y="240" font-size="24" fill="#d3deea" class="en">90°</text>
          <rect x="40" y="560" width="820" height="60" rx="14" fill="#111d31" stroke="#22324d"/>
          <text x="450" y="600" font-size="28" font-weight="700" fill="#f3f6fa" text-anchor="middle">T = k_t · i_q&#160;&#160;&#160;(i_d = 0)</text>
        </svg>
    notes:
      - "早期的离合器电机一直空转，踩脚踏才通过离合器带动主轴，费电、发热，停车位置靠运气。现在是直驱：电机转子直接装在主轴上，没有皮带的弹性和打滑。电机是永磁同步电机，电流产生的磁场和转子磁场正交时转矩最大。矢量控制把电流分成沿转子磁场的 i_d 和垂直的 i_q，让 i_d 为零，转矩就只和 i_q 成正比，像直流电机一样好控制。"
      - "Old clutch motors ran all day; pressing the pedal engaged a clutch to drive the shaft. They wasted power, ran hot, and stopped wherever luck put them. Today's machines are direct-drive: the motor's rotor sits right on the main shaft, with no belt stretch or slip. The motor is a permanent-magnet synchronous motor, which gives the most torque when the current's field is at right angles to the rotor's. Vector control splits the current into i_d along the rotor field and i_q across it, holds i_d at zero, and the torque is then simply proportional to i_q, as easy to control as a DC motor."

  - layout: section
    num: "02"
    title: ["主轴伺服：三个环与停针定位", "The shaft servo: three loops and needle positioning"]

  - layout: split
    title: ["三个嵌套的控制环", "Three nested control loops"]
    points:
      - ["电流环最快（约 0.1 ms），速度环用 PI，位置环在最外", "Current loop fastest (~0.1 ms), velocity PI, position outermost"]
      - ["外环的输出就是内环的指令", "Each outer loop's output is the inner loop's command"]
      - ["速度环带宽约 K_v / J ≈ {{ch13.bw:.0f}} rad/s", "Velocity bandwidth ≈ K_v / J ≈ {{ch13.bw:.0f}} rad/s"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <style>html:not(.en-only) .eo{display:none}html.en-only .zo{display:none}</style>
          <rect x="20" y="40" width="860" height="560" rx="30" fill="none" stroke="#4c8dff" stroke-width="4"/>
          <rect x="90" y="140" width="720" height="400" rx="26" fill="none" stroke="#2ec4b6" stroke-width="4"/>
          <rect x="170" y="240" width="560" height="200" rx="22" fill="rgba(242,183,5,.1)" stroke="#f2b705" stroke-width="4"/>
          <text class="zh" x="50" y="100" font-size="30" font-weight="800" fill="#8fbaff">位置环 · K_p</text><text class="eo" x="50" y="100" font-size="28" font-weight="800" fill="#8fbaff">Position loop · K_p</text><text x="560" y="100" font-size="22" fill="#8fa3ba" class="en zo">position: outermost</text><text class="eo" x="600" y="100" font-size="22" fill="#8fa3ba">outermost</text>
          <text class="zh" x="120" y="200" font-size="30" font-weight="800" fill="#5ee0d2">速度环 · PI（K_v, T_i）</text><text class="eo" x="120" y="200" font-size="28" font-weight="800" fill="#5ee0d2">Velocity loop · PI (K_v, T_i)</text><text x="560" y="200" font-size="22" fill="#8fa3ba" class="en zo">velocity</text>
          <text class="zh" x="450" y="320" font-size="30" font-weight="800" fill="#f2b705" text-anchor="middle">电流环 · 约 0.1 ms</text><text class="eo" x="450" y="320" font-size="28" font-weight="800" fill="#f2b705" text-anchor="middle">Current loop · ~0.1 ms</text>
          <text class="zh" x="450" y="370" font-size="24" fill="#d3deea" text-anchor="middle">i_q → 转矩 → 主轴</text><text class="eo" x="450" y="370" font-size="24" fill="#d3deea" text-anchor="middle">i_q → torque → shaft</text>
          <text x="450" y="410" font-size="20" fill="#8fa3ba" text-anchor="middle" class="en zo">current loop: fastest</text>
          <text x="450" y="500" font-size="24" fill="#d3deea" text-anchor="middle">越靠里越快</text><text class="eo" x="450" y="500" font-size="24" fill="#d3deea" text-anchor="middle">the further in, the faster</text>
        </svg>
    notes:
      - "主轴电机是永磁同步电机，i_q 是电流里产生转矩的那一部分。主轴伺服是三个嵌套的控制环。最里面是电流环，最快，约 0.1 毫秒，管住 i_q 也就是转矩；中间是速度环，用 PI 控制；最外面是位置环。外环的输出就是内环的指令：位置误差变成速度指令，速度误差变成电流指令。速度环带宽约等于 K_v 除以转动惯量 J，算例 0.2 除以 6 乘 10 的负 4 次方，约 {{ch13.bw:.0f}} 弧度每秒。主轴负载每转都在变，速度环要压住这种周期扰动。"
      - "The shaft motor is a permanent-magnet synchronous motor, and i_q is the part of its current that makes torque. The shaft servo nests three control loops. Innermost is the current loop, the fastest, around 0.1 milliseconds, holding i_q, and so the torque. In the middle is the velocity loop, a PI controller. Outermost is the position loop. Each outer loop's output is the inner loop's command: position error becomes a speed command, speed error a current command. The velocity-loop bandwidth is roughly K_v over the inertia J: in the example 0.2 over 6 times 10 to the minus 4, about {{ch13.bw:.0f}} radians per second. The shaft load changes every revolution, and the velocity loop has to suppress that periodic disturbance."

  - layout: split
    title: ["停针定位：先降速，再切位置环", "Needle positioning: slow down, then switch to position"]
    points:
      - ["速度环先降到定位速度 200 r/min", "The velocity loop first slows to 200 r/min"]
      - ["离目标 45° 切入位置环，输出限在定位速度内", "At 45° from target the position loop takes over, capped at that speed"]
      - ["标准增益：超调约 0.1°，38 ms 进入 ±0.5°", "Standard gains: about 0.1° overshoot, within ±0.5° in 38 ms"]
    visual: {video: wheel}
    notes:
      - "停针分两步。先由速度环把主轴降到定位速度，算例每分钟 200 转；离目标上针位还差 45 度时，切入位置环，位置环的输出限制在定位速度以内。标准参数 K_p 200、K_v 0.2、T_i 12 毫秒，超调约 0.1 度，38 毫秒进入正负 0.5 度。右边是虚拟实验 13-1 的手轮动画，慢放 20 倍，容许范围放大 10 倍，反复重放。"
      - "Needle positioning has two stages. First the velocity loop slows the shaft to the positioning speed, 200 r/min in the example; then, 45 degrees short of the needle-up target, the position loop takes over, with its output capped at the positioning speed. With the standard gains, K_p 200, K_v 0.2 and T_i 12 milliseconds, it overshoots about 0.1 degrees and is within plus or minus 0.5 degrees in 38 milliseconds. On the right, the handwheel animation from Virtual Lab 13-1, slowed 20 times, with the tolerance band magnified 10 times, replaying."

  - layout: duo
    title: ["位置增益：200 还是 500", "Position gain: 200 or 500"]
    left: {video: err500, label: ["K_p = 500 s⁻¹", "K_p = 500 s⁻¹"], note: ["超调约 1.8°，50 ms", "About 1.8° overshoot, 50 ms"]}
    right: {video: err200, label: ["K_p = 200 s⁻¹", "K_p = 200 s⁻¹"], note: ["超调约 0.1°，38 ms 停稳", "About 0.1° overshoot, settled in 38 ms"]}
    notes:
      - "左右对比位置误差曲线：左边 500，右边 200；下半是最后阶段放大。位置增益 200，超调约 0.1 度，38 毫秒停稳；只把它加到 500，超调约 1.8 度，50 毫秒才停稳，反而更慢。原因是位置环太硬，速度环跟不上，转矩也顶到峰值。经验是位置增益取 K_v 比 J 的四分之一到二分之一，先把速度环调硬，再加位置环。换了更重的手轮，惯量变大，增益也要重调。"
      - "Compare the position-error curves: 500 on the left, 200 on the right; the lower half magnifies the final stage. With a position gain of 200, the overshoot is about 0.1 degrees and it settles in 38 milliseconds. Raise only that gain to 500 and it overshoots about 1.8 degrees and takes 50 milliseconds: slower, not faster. The position loop is now too stiff for the velocity loop to follow, and the torque hits its peak. The rule of thumb is a position gain of a quarter to a half of K_v over J: stiffen the velocity loop first, then add the position loop. Fit a heavier handwheel and the inertia grows, so the gains must be retuned."

  - layout: points
    title: ["增益不能太大，惯量变了要重调", "Don't overdo the gain; retune when inertia changes"]
    points:
      - ["K_p 取 K_v / J 的 1/4–1/2", "K_p ≈ 1/4 to 1/2 of K_v / J"]
      - ["K_p · ω_p 不能超过峰值转矩的减速度，约 {{ch13.dmax:.0f}} rad/s²", "K_p · ω_p must not exceed peak-torque deceleration, about {{ch13.dmax:.0f}} rad/s²"]
      - ["惯量加倍：超调约 2.2°、67 ms；重设惯量、降 K_p", "Double inertia: 2.2° overshoot, 67 ms; reset inertia, lower K_p"]
    foot: ["上针位停早了：挑线杆未到顶，起缝脱线；停晚了：机针已下行，容易挂布", "Stopping early: take-up not at top, thread pulls out; late: the needle is already descending and snags"]
    notes:
      - "增益有两条限制。第一，K_p 取 K_v 比 J 的四分之一到二分之一。第二，刚切入位置环时要求的减速度是 K_p 乘定位速度，不能超过峰值转矩能给的减速度，算例约 {{ch13.dmax:.0f}} 弧度每二次方秒。换了更重的手轮或机头，惯量加倍，速度环带宽减半，超调变成约 2.2 度、67 毫秒，要重设负载惯量并降低 K_p。停不准有后果：停早了挑线杆没到顶，起缝脱线；停晚了针已下行，抽布时挂布。"
      - "The gain has two limits. One: K_p should be a quarter to a half of K_v over J. Two: the deceleration demanded when the position loop takes over is K_p times the positioning speed, which must not exceed what the peak torque can deliver, about {{ch13.dmax:.0f}} radians per second squared here. Fit a heavier handwheel or head and the inertia doubles, the velocity bandwidth halves, and the overshoot becomes about 2.2 degrees and 67 milliseconds; reset the load inertia and lower K_p. Stopping off-target matters: too early, the take-up isn't at the top and the thread pulls out at the next start; too late, the needle has started down and catches the fabric as it's pulled out."

  - layout: split
    title: ["摩擦造成静差：速度环为什么要用 PI", "Friction leaves a steady error: why the velocity loop needs PI"]
    points:
      - ["停住时只剩比例项：转矩 = K_v · K_p · e", "At rest only the proportional term acts: torque = K_v · K_p · e"]
      - ["推不动摩擦：|e| ≤ T_f / (K_v K_p) ≈ {{ch13.err:.2f}}°", "It can't beat friction: |e| ≤ T_f / (K_v K_p) ≈ {{ch13.err:.2f}}°"]
      - ["积分把小误差累积成转矩，直到推得动", "The integral builds torque from the small error until it moves"]
    visual: {video: noint}
    notes:
      - "为什么速度环要用 PI？停住的时候转速为零，如果没有积分，只剩比例项，电机转矩等于 K_v 乘 K_p 乘位置误差 e。只要这个转矩小于库仑摩擦 T_f，就推不动，主轴可能停在这个范围内任何位置。算例 0.15 除以 0.2 乘 200，约 {{ch13.err:.2f}} 度。右边把积分时间设成 0，看误差曲线最后停在目标旁边不动。积分会把小误差慢慢累积成转矩，直到推得动。"
      - "Why does the velocity loop need PI? At standstill the speed is zero, and without an integral only the proportional term is left: motor torque equals K_v times K_p times the position error e. As long as that torque is below the Coulomb friction T_f, nothing moves, and the shaft can stop anywhere in that band. In the example, 0.15 over 0.2 times 200, about {{ch13.err:.2f}} degrees. On the right the integral time is set to zero: watch the error curve stop short of the target and stay there. An integral slowly builds the small error into torque until the shaft moves."

  - layout: lab
    title: ["动手试一试：停针定位的伺服调参", "Try it: tuning needle positioning"]
    shot: {page: servo}
    tasks:
      - ["按“打乱”，只调三个增益，让四条判据都满足", "Press “Scramble”; tune only the three gains until all four pass"]
      - ["积分时间调到 0：先算最大静差，再核对", "Set the integral time to 0: predict the steady error, then check"]
      - ["惯量加倍到 12，再重调增益", "Double the inertia to 12 and retune"]
    notes:
      - "这个实验大家在问渠平台上做。第一，按“打乱”，增益变成 450、0.05、0，只调 K_p、K_v、T_i 三个滑块，让四条判据全部满足；先看速度曲线，速度环太软，位置环就会冲过头。第二，把积分时间调到 0，用 T_f 除以 K_v K_p 算出最大静差再核对。第三，把惯量调到 12，先不改增益看判据，再重调。"
      - "Do this lab on WenQuest. One: press Scramble, which sets the gains to 450, 0.05 and 0, and adjust only K_p, K_v and T_i until all four criteria pass; look at the speed curve first, because a soft velocity loop makes the position loop overshoot. Two: set the integral time to zero, work out the maximum steady error from T_f over K_v K_p, and check it. Three: set the inertia to 12, read the criteria without touching the gains, then retune."

  - layout: section
    num: "03"
    title: ["编码器与传感器", "Encoders and sensors"]

  - layout: split
    title: ["增量编码器与四倍频", "Incremental encoders and ×4 decoding"]
    points:
      - ["A、B 两路错开 1/4 周期：谁超前定方向", "A and B a quarter period apart: which leads gives direction"]
      - ["上升沿、下降沿都计数：一个周期 4 次", "Count rising and falling edges: 4 per period"]
      - ["1024 线 × 4 = 4096 计数/转，约 {{ch13.res:.3f}}°", "1024 lines × 4 = 4096 counts/rev, about {{ch13.res:.3f}}°"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <text x="0" y="150" font-size="34" font-weight="800" fill="#4c8dff" class="en">A</text>
          <text x="0" y="330" font-size="34" font-weight="800" fill="#2ec4b6" class="en">B</text>
          <path d="M60 170 L60 90 L180 90 L180 170 L300 170 L300 90 L420 90 L420 170 L540 170 L540 90 L660 90 L660 170 L780 170 L780 90 L880 90" fill="none" stroke="#4c8dff" stroke-width="7"/>
          <path d="M60 350 L120 350 L120 270 L240 270 L240 350 L360 350 L360 270 L480 270 L480 350 L600 350 L600 270 L720 270 L720 350 L840 350 L840 270 L880 270" fill="none" stroke="#2ec4b6" stroke-width="7"/>
          <g stroke="#f2b705" stroke-width="3" stroke-dasharray="6 6"><path d="M300 60 L300 420"/><path d="M360 60 L360 420"/><path d="M420 60 L420 420"/><path d="M480 60 L480 420"/></g>
          <g font-size="30" font-weight="800" fill="#f2b705" text-anchor="middle" class="en"><text x="300" y="455" class="en">1</text><text x="360" y="455" class="en">2</text><text x="420" y="455" class="en">3</text><text x="480" y="455" class="en">4</text></g>
          <text x="390" y="510" font-size="28" fill="#d3deea" text-anchor="middle">一个周期计 4 次 · 4 counts per period</text>
          <rect x="40" y="545" width="820" height="80" rx="16" fill="#111d31" stroke="#22324d"/>
          <text x="450" y="597" font-size="32" font-weight="800" fill="#f2b705" text-anchor="middle" class="en">Δθ = 360° / (4N)</text>
        </svg>
    notes:
      - "主轴角度靠增量编码器。A、B 两路方波错开四分之一个周期，正转时 A 超前，反转时 B 超前，由此判断方向。上升沿和下降沿都计数，一个周期计 4 次，叫四倍频。1024 线的编码器四倍频后每转 4096 个计数，分辨率约 {{ch13.res:.3f}} 度。另外还有原点信号确定绝对角度，U、V、W 三路磁极信号让电机上电时先转起来。"
      - "The shaft angle comes from an incremental encoder. Channels A and B are square waves a quarter period apart: turning forward A leads, turning backward B leads, which gives the direction. Counting both rising and falling edges gives four counts per period, called times-four decoding. A 1024-line encoder then gives 4096 counts per revolution, about {{ch13.res:.3f}} degrees each. An index pulse fixes the absolute angle, and U, V and W commutation signals let the motor start turning at power-up."

  - layout: bignum
    title: ["低速测速：M 法还是 T 法", "Measuring low speed: M method or T method"]
    nums:
      - {n: "{{ch13.relM:.1f}}%", n_en: "M method @ 200 r/min", label: ["固定 1 ms 数计数：±1 计数 ≈ {{ch13.dM:.1f}} r/min", "Count in 1 ms: ±1 count ≈ {{ch13.dM:.1f}} r/min"]}
      - {n: "{{ch13.relT:.2f}}%", n_en: "T method @ 200 r/min", label: ["10 MHz 时钟测两计数间隔", "Time two counts with a 10 MHz clock"]}
      - {n: "{{ch13.cross:.0f}}", n_en: "r/min", label: ["两条误差曲线交点", "Where the two errors cross"]}
    foot: ["停针在低速完成，所以低速用 T 法或 M/T 法", "Positioning happens at low speed, so use the T or M/T method there"]
    notes:
      - "测速有两种办法。M 法在固定时间里数计数，1 毫秒内正负 1 个计数相当于约 {{ch13.dM:.1f}} 转每分，200 转时误差约 {{ch13.relM:.1f}}%。T 法用 10 兆赫的时钟测两个计数之间的时间，200 转时误差只有约 {{ch13.relT:.2f}}%。两条误差曲线交在约每分钟 {{ch13.cross:.0f}} 转：高速用 M 法，低速用 T 法。停针定位是在低速完成的，所以低速要用 T 法或 M/T 法。"
      - "There are two ways to measure speed. The M method counts pulses in a fixed time: one count more or less in 1 millisecond is about {{ch13.dM:.1f}} r/min, an error of about {{ch13.relM:.1f}} percent at 200 r/min. The T method times the interval between two counts with a 10-megahertz clock: at 200 r/min the error is only about {{ch13.relT:.2f}} percent. The two error curves cross at about {{ch13.cross:.0f}} r/min: use M above, T below. Needle positioning happens at low speed, so that's where you need the T or M/T method."

  - layout: points
    title: ["其他传感器", "Other sensors"]
    points:
      - ["脚踏：霍尔元件或电位器；前掌缝纫，后跟剪线", "Pedal: Hall sensor or pot; toe to sew, heel to trim"]
      - ["断线检测：挑线簧摆不摆，或面线带动小轮", "Thread break: is the check spring moving, or a thread-driven wheel"]
      - ["底线余量：梭芯反光标记或按针数估算", "Bobbin thread: a reflective mark, or counting stitches"]
    foot: ["布厚用压脚杆位移传感器，布边用光电传感器", "Fabric thickness from a presser-bar displacement sensor; edges from photo sensors"]
    notes:
      - "其他传感器。脚踏用霍尔元件或电位器，前掌踩下缝纫，后跟踩下抬压脚、剪线。断线检测看挑线簧有没有摆动，或者让面线带动一个小轮，用光电检测它转不转。底线余量可以在梭芯侧面做反光标记，或者按缝过的针数估算。布厚用压脚杆的位移传感器，布边用光电传感器。"
      - "Other sensors. The pedal uses a Hall element or a potentiometer: toe down to sew, heel down to lift the foot and trim. Thread-break detection watches whether the check spring is moving, or lets the needle thread turn a small wheel that a photo sensor watches. The bobbin thread can be monitored with a reflective mark on the side of the bobbin, or estimated by counting stitches. Fabric thickness comes from a displacement sensor on the presser bar, and fabric edges from photo sensors."

  - layout: section
    num: "04"
    title: ["执行器：步进电机、电磁铁与功率电路", "Actuators: steppers, solenoids and power circuits"]

  - layout: split
    title: ["步进电机：矩频特性与失步", "Steppers: torque–speed curve and lost steps"]
    points:
      - ["1.8°/步，不用编码器：发多少脉冲走多少步", "1.8° a step, no encoder: so many pulses, so many steps"]
      - ["频率越高转矩越小；负载超过就失步，控制器不知道", "Torque falls with speed; overload loses steps unnoticed"]
      - ["对策：留余量、高压斩波、加阻尼或闭环步进", "Remedies: margin, high-voltage chopping, damping, closed loop"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <style>html:not(.en-only) .eo{display:none}html.en-only .zo{display:none}</style>
          <path d="M100 520 L860 520 M100 520 L100 60" stroke="#4b5f7d" stroke-width="3"/>
          <path d="M100 120 L300 125 C 420 140, 560 260, 840 430" fill="none" stroke="#2ec4b6" stroke-width="8"/>
          <path d="M100 330 L860 330" stroke="#ff7a45" stroke-width="5" stroke-dasharray="14 10"/>
          <circle cx="620" cy="330" r="14" fill="#ff7a45"/>
          <path d="M620 330 L620 520" stroke="#ff7a45" stroke-width="3" stroke-dasharray="6 6"/>
          <text x="640" y="300" font-size="28" font-weight="800" fill="#ff9c75">此后失步</text><text class="eo" x="640" y="300" font-size="26" font-weight="800" fill="#ff9c75">lost steps</text>
          <text x="640" y="560" font-size="22" fill="#8fa3ba">最高可用频率</text><text class="eo" x="640" y="560" font-size="22" fill="#8fa3ba">top usable rate</text>
          <text x="120" y="100" font-size="26" fill="#5ee0d2">可用转矩 · pull-out torque</text>
          <text x="120" y="310" font-size="26" fill="#ffb38f">负载转矩 · load</text>
          <text x="480" y="610" font-size="24" fill="#8fa3ba" text-anchor="middle">步进频率 · step rate</text>
          <text x="60" y="80" font-size="22" fill="#8fa3ba">转矩</text><text class="eo" x="30" y="50" font-size="22" fill="#8fa3ba">torque</text>
        </svg>
    notes:
      - "针距、压脚压力这些动作常用步进电机。两相混合式步进电机每步 1.8 度，不用编码器，发多少脉冲就走多少步；16 细分时每转 3200 步，更平稳，但精度不按细分比例提高。步进电机的可用转矩随频率升高而下降，负载一旦超过可用转矩就失步，控制器还不知道。对策是留足余量、用高压斩波驱动、加阻尼，或者做成闭环步进。"
      - "Stitch length and foot pressure are often set by steppers. A two-phase hybrid stepper moves 1.8 degrees a step without an encoder: so many pulses, so many steps. With 16 microsteps it takes 3200 steps a revolution and runs more smoothly, though accuracy doesn't improve in proportion. Its available torque falls as the step rate rises, and once the load exceeds it, the motor loses steps without the controller knowing. The remedies are a good margin, high-voltage chopper drives, damping, or a closed-loop stepper."

  - layout: split
    title: ["电磁铁吸合：强激磁加斩波维持", "Solenoid pull-in: boost, then chopped hold"]
    points:
      - ["电流按 τ = L/R 上升；电磁力 ∝ i²，超过弹簧力才动", "Current rises with τ = L/R; force ∝ i² must beat the spring"]
      - ["只给 1 A 吸不动；一直给 3 A 发热约 70 W", "1 A won't pull in; 3 A all the time heats about 70 W"]
      - ["24 V 强激磁 6.9 ms 吸到底，再斩波维持 1 A", "24 V boost pulls in in 6.9 ms, then chopping holds 1 A"]
    visual: {video: boost}
    notes:
      - "剪线、倒缝用电磁铁。通电后电流按时间常数 L 比 R 上升，电磁力和电流平方成正比，超过弹簧力衔铁才开始动；衔铁一动产生反电动势，电流曲线上出现一个凹口。只给 1 安维持电流吸不动；一直给 3 安又要发热约 70 瓦。办法是先用 24 伏强激磁，6.9 毫秒吸到底，再斩波维持 1 安，发热只有约 8 瓦。右边强激磁时间在 0 到 20 毫秒之间来回，看衔铁吸不吸得动。"
      - "Trimming and reverse use solenoids. When energised, the current rises with time constant L over R; the force goes with current squared, and the armature moves only once it beats the spring. As it moves it generates a back EMF, which puts a notch in the current curve. A 1-amp hold current alone won't pull it in; 3 amps all the time would dissipate about 70 watts. The answer is a 24-volt boost that pulls in within 6.9 milliseconds, then chopping to hold 1 amp, about 8 watts. On the right the boost time sweeps between 0 and 20 milliseconds; watch whether the armature pulls in."

  - layout: split
    title: ["释放与续流：延迟折成主轴转角", "Release and freewheeling: delay as shaft angle"]
    points:
      - ["二极管续流释放 12.9 ms；48 V 稳压管 5.1 ms", "Diode freewheeling: 12.9 ms; 48 V Zener: 5.1 ms"]
      - ["稳压管让功率管承受 24 + 48 = {{ch13.vce:.0f}} V", "The Zener puts 24 + 48 = {{ch13.vce:.0f}} V on the transistor"]
      - ["θ = 6nt：400 r/min 时 1 ms = {{ch13.deg1ms:.1f}}°", "θ = 6nt: at 400 r/min, 1 ms = {{ch13.deg1ms:.1f}}°"]
    visual: {video: release}
    notes:
      - "断电以后，线圈电流要有地方流。二极管续流，电流按 L 比 R 慢慢衰减，释放要 12.9 毫秒；换 48 伏稳压管续流，电流很快降下来，释放只要 5.1 毫秒，代价是功率管断开时承受 24 加 48 等于 {{ch13.vce:.0f}} 伏，每次还要吸收约 {{ch13.eZ:.0f}} 毫焦。延迟按 θ 等于 6nt 折成主轴转角：400 转时 1 毫秒是 {{ch13.deg1ms:.1f}} 度，吸合约 {{ch13.p400:.0f}} 度，释放 {{ch13.d400:.0f}} 度或 {{ch13.z400:.0f}} 度。右边续流电压在来回变，看释放段的电流和衔铁曲线。"
      - "At switch-off the coil current needs somewhere to go. With a diode it decays slowly with L over R, and release takes 12.9 milliseconds; with a 48-volt Zener it collapses quickly and release takes 5.1, at the cost of {{ch13.vce:.0f}} volts, 24 plus 48, across the transistor at turn-off, and about {{ch13.eZ:.0f}} millijoules absorbed each time. Delays convert to shaft angle as theta equals 6 n t: at 400 r/min one millisecond is {{ch13.deg1ms:.1f}} degrees, so pull-in is about {{ch13.p400:.0f}} degrees and release {{ch13.d400:.0f}} or {{ch13.z400:.0f}}. On the right the freewheeling voltage sweeps back and forth."

  - layout: lab
    title: ["动手试一试：电磁铁驱动", "Try it: driving a solenoid"]
    shot: {page: solenoid}
    tasks:
      - ["只调续流电压，让四条判据都满足", "Adjust only the freewheeling voltage until all four criteria pass"]
      - ["转速 600：维持 ≤ 1.1 A，调电压、强激磁、续流", "At 600 r/min, hold ≤ 1.1 A: adjust voltage, boost and freewheeling"]
      - ["读出较长的延迟，算最高剪线转速", "Read the longer delay and work out the top trimming speed"]
    notes:
      - "这个实验大家在问渠平台上做。先在上方曲线上找出电流凹口、电磁力超过弹簧力的时刻和衔铁吸到底的时刻。第一，只调续流电压，或者按“换稳压管 48 伏”，让四条判据都满足，再试试加到 80 伏会怎样。第二，把剪线转速提到 600，维持电流不超过 1.1 安，调驱动电压、强激磁时间和续流电压。第三，读出较长的延迟，算出最高剪线转速。"
      - "Do this lab on WenQuest. First find, on the upper plot, the notch in the current, the moment the force exceeds the spring, and the moment the armature bottoms. One: adjust only the freewheeling voltage, or press the 48-volt Zener button, until all four criteria pass, then see what happens at 80 volts. Two: raise the trimming speed to 600, keep the hold current at or below 1.1 amps, and adjust drive voltage, boost time and freewheeling voltage. Three: read the longer delay and work out the highest trimming speed."

  - layout: split
    title: ["急停的能量往哪里去", "Where does emergency-stop energy go?"]
    points:
      - ["急停时电机发电，整流桥单向：能量只能充进母线电容", "In an e-stop the motor generates; the rectifier blocks it, so the capacitor takes it"]
      - ["5000 r/min 动能约 {{ch13.KE:.0f}} J：470 μF 升到约 {{ch13.V2:.0f}} V", "{{ch13.KE:.0f}} J at 5000 r/min: 470 μF rises to about {{ch13.V2:.0f}} V"]
      - ["超过约 {{ch13.nbrake:.0f}} r/min 急停，必须靠制动电阻", "Above about {{ch13.nbrake:.0f}} r/min a braking resistor is essential"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <style>html:not(.en-only) .eo{display:none}html.en-only .zo{display:none}</style>
          <path d="M120 540 L860 540 M120 540 L120 60" stroke="#4b5f7d" stroke-width="3"/>
          <path d="M120 410 L860 410" stroke="#8fa3ba" stroke-width="3" stroke-dasharray="10 8"/><text class="zh" x="130" y="400" font-size="24" fill="#8fa3ba">母线 310 V</text><text class="eo" x="130" y="400" font-size="24" fill="#8fa3ba">DC link 310 V</text>
          <path d="M120 300 L860 300" stroke="#2ec4b6" stroke-width="4" stroke-dasharray="14 8"/><text class="zh" x="130" y="290" font-size="24" fill="#5ee0d2">制动电阻导通 400 V</text><text class="eo" x="130" y="290" font-size="24" fill="#5ee0d2">braking resistor on at 400 V</text>
          <path d="M120 410 L300 410 C 420 400, 520 180, 640 110 L860 108" fill="none" stroke="#ff7a45" stroke-width="7"/>
          <text x="660" y="95" font-size="28" font-weight="800" fill="#ff9c75">≈ {{ch13.V2:.0f}} V</text>
          <path d="M300 410 C 400 380, 440 310, 480 300 L860 300" fill="none" stroke="#2ec4b6" stroke-width="7"/>
          <text class="zh" x="560" y="350" font-size="24" fill="#5ee0d2">有制动电阻：钳在 400 V</text><text class="eo" x="560" y="350" font-size="24" fill="#5ee0d2">with resistor: held at 400 V</text>
          <text x="630" y="160" font-size="22" fill="#ffb38f">没有：电容充到危险电压</text><text class="eo" x="640" y="155" font-size="22" fill="#ffb38f">no resistor:</text><text class="eo" x="640" y="183" font-size="22" fill="#ffb38f">unsafe voltage</text>
          <text x="490" y="590" font-size="24" fill="#8fa3ba" text-anchor="middle">急停开始 → 时间</text><text class="eo" x="490" y="590" font-size="24" fill="#8fa3ba" text-anchor="middle">e-stop begins → time</text>
          <text x="60" y="80" font-size="22" fill="#8fa3ba">电压</text><text class="eo" x="112" y="80" font-size="22" fill="#8fa3ba" text-anchor="end">voltage</text>
        </svg>
    notes:
      - "功率电路：220 伏整流后母线约 310 伏，逆变桥六个开关管驱动电机。急停时电机变成发电机，可整流桥是单向的，能量送不回电网，只能充进母线电容。算例 5000 转的动能约 {{ch13.KE:.0f}} 焦，七成回馈，470 微法电容会升到约 {{ch13.V2:.0f}} 伏，危险。所以母线上装制动电阻，约 400 伏导通把能量烧掉；急停转速超过约 {{ch13.nbrake:.0f}} 转，就必须靠它。"
      - "The power circuit: 220 volts rectified gives a DC link of about 310 volts, and a six-switch inverter bridge drives the motor. In an emergency stop the motor becomes a generator, but the rectifier only conducts one way, so the energy can't go back to the mains; it can only charge the link capacitor. At 5000 r/min the kinetic energy is about {{ch13.KE:.0f}} joules; with 70 percent fed back, a 470-microfarad capacitor would rise to about {{ch13.V2:.0f}} volts, which is dangerous. So the link carries a braking resistor that switches in at about 400 volts and burns the energy off; any emergency stop above about {{ch13.nbrake:.0f}} r/min depends on it."

  - layout: section
    num: "05"
    title: ["算例：剪线转速能设多高", "Worked example: how fast can trimming be?"]

  - layout: bignum
    title: ["600 r/min 时的主轴转角：θ = 6nt", "Shaft angle at 600 r/min: θ = 6nt"]
    nums:
      - {n: "{{ch13.p600:.1f}}°", label: ["吸合 6.9 ms", "Pull-in, 6.9 ms"]}
      - {n: "{{ch13.d600:.1f}}°", label: ["二极管续流释放 12.9 ms", "Diode release, 12.9 ms"]}
      - {n: "{{ch13.z600:.1f}}°", label: ["稳压管续流释放 5.1 ms", "Zener release, 5.1 ms"]}
    foot: ["要求都 ≤ 20°：换稳压管释放够了，吸合仍超；较长的吸合决定上限", "Both must be ≤ 20°: the Zener fixes release, but pull-in still exceeds; the longer pull-in sets the limit"]
    notes:
      - "代数算。转角等于 6 乘转速乘时间。600 转时：吸合 6.9 毫秒占 {{ch13.p600:.1f}} 度；二极管续流释放 12.9 毫秒占 {{ch13.d600:.1f}} 度；换 48 伏稳压管，释放 5.1 毫秒占 {{ch13.z600:.1f}} 度。要求都不超过 20 度。只换稳压管，释放够了，可吸合还是 {{ch13.p600:.1f}} 度，不够。较长的吸合延迟决定转速上限。"
      - "Let's compute. Angle equals 6 times speed times time. At 600 r/min, the 6.9-millisecond pull-in takes {{ch13.p600:.1f}} degrees; diode release, 12.9 milliseconds, takes {{ch13.d600:.1f}}; with the 48-volt Zener, release is 5.1 milliseconds, {{ch13.z600:.1f}} degrees. Both must be within 20. The Zener alone fixes the release, but pull-in is still {{ch13.p600:.1f}} degrees, so it isn't enough. The longer pull-in delay sets the speed limit."

  - layout: split
    title: ["机器人联系：关节伺服也是三个环", "Robot link: joint servos have the same three loops"]
    points:
      - ["关节 = 永磁同步电机 + 编码器，三环嵌套", "Each joint: PMSM + encoder, three nested loops"]
      - ["抓起重物，惯量变大：要有负载惯量比、在线辨识", "Pick up a load and inertia grows: load-inertia ratio, online identification"]
      - ["急停回馈要制动电阻；夹爪电磁阀要提前发令", "E-stop energy needs a braking resistor; gripper valves need early commands"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <style>html:not(.en-only) .eo{display:none}html.en-only .zo{display:none}</style>
          <rect x="60" y="520" width="240" height="60" rx="12" fill="#2a3a55"/>
          <path d="M180 520 L260 300 L560 200" stroke="#f2b705" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <g fill="#08101d" stroke="#2ec4b6" stroke-width="8"><circle cx="180" cy="520" r="30"/><circle cx="260" cy="300" r="30"/><circle cx="560" cy="200" r="26"/></g>
          <path d="M560 200 L640 240 M560 200 L620 140" stroke="#8fa3ba" stroke-width="10" stroke-linecap="round"/>
          <rect x="640" y="200" width="70" height="70" rx="8" fill="#ff7a45"/>
          <text class="zh" x="720" y="250" font-size="24" fill="#ffb38f">重物 → J 变大</text><text class="eo" x="720" y="250" font-size="24" fill="#ffb38f">load → J grows</text>
          <text class="zh" x="300" y="350" font-size="24" fill="#5ee0d2">关节：电流 · 速度 · 位置</text><text class="eo" x="300" y="350" font-size="24" fill="#5ee0d2">joint: current · velocity · position</text>
          <text class="zh" x="450" y="420" font-size="26" fill="#d3deea" text-anchor="middle">带宽 ≈ K_v / J ↓</text><text class="eo" x="450" y="420" font-size="26" fill="#d3deea" text-anchor="middle">bandwidth ≈ K_v / J ↓</text>
        </svg>
    notes:
      - "机械臂每个关节都是一台永磁同步电机加编码器，驱动器里也是电流、速度、位置三环嵌套，矢量控制让关节转矩正比于 i_q。主轴停在上针位，对应关节停在目标角：位置增益太大会冲过头，没有积分摩擦会留下静差。机械臂抓起重物，惯量变大，速度环带宽下降，和换了更重的手轮一样，所以机器人驱动器也有负载惯量比参数和在线惯量辨识。急停同样靠制动电阻，夹爪电磁阀也要按带速提前发令。"
      - "Every joint of a robot arm is a permanent-magnet synchronous motor with an encoder, and its drive nests the same current, velocity and position loops, with vector control making joint torque proportional to i_q. Stopping the shaft at needle-up corresponds to stopping a joint at its target angle: too much position gain overshoots, and without an integral, friction leaves a steady error. When the arm picks up a heavy part its inertia grows and the velocity bandwidth falls, just like fitting a heavier handwheel; that's why robot drives also have a load-inertia ratio and online inertia identification. Emergency stops need braking resistors here too, and gripper valves must be commanded early according to the belt speed."

  - layout: split
    title: ["生活中：电梯平层", "Everyday: an elevator levelling at a floor"]
    points:
      - ["快到楼层先减到很低的爬行速度", "Near the floor it first slows to a crawl"]
      - ["差一小段时切到精确的位置控制", "A short distance out, it switches to precise position control"]
      - ["乘客多了惯量变大，控制器也要自动调整", "More passengers, more inertia: the controller must adapt"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <style>html:not(.en-only) .eo{display:none}html.en-only .zo{display:none}</style>
          <rect x="300" y="40" width="300" height="550" rx="10" fill="none" stroke="#4b5f7d" stroke-width="4"/>
          <path d="M240 380 L660 380" stroke="#f2b705" stroke-width="6"/>
          <text x="680" y="388" font-size="26" font-weight="700" fill="#f2b705">楼层 · floor</text>
          <rect x="340" y="260" width="220" height="118" rx="10" fill="#2a3a55" stroke="#2ec4b6" stroke-width="4"/>
          <path d="M450 80 L450 260" stroke="#8fa3ba" stroke-width="4"/>
          <path d="M650 120 L650 240" stroke="#5ee0d2" stroke-width="5"/><path d="M640 228 L650 246 L660 228" stroke="#5ee0d2" stroke-width="5" fill="none"/>
          <text class="zh" x="680" y="170" font-size="24" fill="#5ee0d2">① 减到爬行速度</text><text class="eo" x="680" y="170" font-size="24" fill="#5ee0d2">① slow to a crawl</text>
          <text class="zh" x="680" y="300" font-size="24" fill="#ffb38f">② 切位置控制</text><text class="eo" x="680" y="300" font-size="24" fill="#ffb38f">② position control</text>
          <text x="40" y="320" font-size="24" fill="#d3deea">平层对齐</text>
          <text x="40" y="350" font-size="20" fill="#8fa3ba" class="en zo">flush with the floor</text><text class="eo" x="40" y="320" font-size="24" fill="#d3deea">flush with</text><text class="eo" x="40" y="350" font-size="24" fill="#d3deea">the floor</text>
          <text class="zh" x="450" y="632" font-size="24" fill="#8fa3ba" text-anchor="middle">= 停针：先降速，再切位置环</text><text class="eo" x="450" y="632" font-size="24" fill="#8fa3ba" text-anchor="middle">= needle positioning: slow, then switch to position</text>
        </svg>
    notes:
      - "生活中的停针定位：电梯平层。电梯快到楼层时先减到很低的爬行速度，离平层位置还差一小段，才切换到精确的位置控制，停稳时轿厢地面和楼层地面对齐。这正是停针定位“先降速、再切位置环”的两步法。乘客多了，惯量变大，好的电梯控制器同样要自动调整。"
      - "Needle positioning in everyday life: an elevator levelling at a floor. As it approaches, it first slows to a low creep speed, and only a short distance before the levelling point does it switch to precise position control, stopping with the car floor flush with the landing. That's exactly the two-stage method of needle positioning: slow down, then switch to the position loop. With more passengers the inertia grows, and a good elevator controller adapts too."

  - layout: answer
    tag: ["回到车间问题", "Back to the problem"]
    title: ["剪线转速设在 480 r/min 以下", "Set trimming below 480 r/min"]
    rows:
      - [["600 r/min：吸合", "600 r/min: pull-in"], "{{ch13.p600:.1f}}°"]
      - [["600 r/min：稳压管释放", "600 r/min: Zener release"], "{{ch13.z600:.1f}}°"]
      - ["n_max = 20 ÷ (6 × 0.0069)", "{{ch13.nmax:.0f}} r/min"]
    side: {big: "{{ch13.vce:.0f}} V", text: ["稳压管续流时功率管承受 24 + 48 V，选管要留余量", "With the Zener the transistor sees 24 + 48 V; allow a margin"]}
    foot: ["只换稳压管不够；要么降到约 480 r/min，要么提高驱动电压缩短吸合", "The Zener alone isn't enough: drop to about 480 r/min, or raise the drive voltage to shorten pull-in"]
    notes:
      - "回到开头。600 转时，吸合占 {{ch13.p600:.1f}} 度，二极管续流释放占 {{ch13.d600:.1f}} 度，都超过 20 度，这就是剪线时好时坏的原因。换 48 伏稳压管后释放降到 {{ch13.z600:.1f}} 度，可吸合还是 {{ch13.p600:.1f}} 度。较长的吸合延迟决定上限：20 除以 6 乘 0.0069，约 {{ch13.nmax:.0f}} 转，剪线转速应设在约 480 转以下，或者提高驱动电压缩短吸合。功率管断开时承受 {{ch13.vce:.0f}} 伏，选管要留余量。"
      - "Back to the start. At 600 r/min the pull-in takes {{ch13.p600:.1f}} degrees and the diode release {{ch13.d600:.1f}}, both over 20: that's why trimming became erratic. The 48-volt Zener brings release down to {{ch13.z600:.1f}} degrees, but pull-in is still {{ch13.p600:.1f}}. The longer pull-in sets the limit: 20 over 6 times 0.0069, about {{ch13.nmax:.0f}} r/min, so set the trimming speed below about 480, or raise the drive voltage to shorten pull-in. At turn-off the transistor sees {{ch13.vce:.0f}} volts, so choose it with a margin."

  - layout: summary
    title: ["本讲小结", "Summary"]
    points:
      - ["三环嵌套；停针先降速再切位置环，惯量变了重调", "Three nested loops; slow then position; retune for new inertia"]
      - ["没有积分，摩擦留下静差 T_f/(K_v K_p)", "Without an integral, friction leaves T_f/(K_v K_p)"]
      - ["执行器延迟按 θ = 6nt 折成转角，定剪线转速", "Actuator delay → angle by θ = 6nt sets trimming speed"]
    after: ["作业 13：编码器测速、剪线电磁铁与急停制动的核算 · 测验 · 实验 13-1、13-2 —— 在问渠学习平台完成", "Assignment 13: encoder speed, trimming solenoid and braking · quiz · Labs 13-1, 13-2 — on WenQuest"]
    notes:
      - "这一讲记住三件事。第一，主轴伺服是电流、速度、位置三环嵌套；停针先降速再切位置环，位置增益取 K_v 比 J 的四分之一到二分之一，惯量变了要重调。第二，速度环没有积分，摩擦会留下 T_f 除以 K_v K_p 的静差。第三，电磁铁用强激磁加斩波维持，稳压管续流让释放快，延迟按 θ 等于 6nt 折成主轴转角，决定剪线转速上限。作业、测验和两个实验都在问渠平台上完成。"
      - "Three things to remember. One: the shaft servo nests current, velocity and position loops; needle positioning slows down first and then switches to the position loop, with a position gain of a quarter to a half of K_v over J, retuned whenever the inertia changes. Two: without a velocity-loop integral, friction leaves a steady error of T_f over K_v K_p. Three: solenoids use a boost plus chopped hold, Zener freewheeling speeds release, and delays convert to shaft angle by theta equals 6 n t, which sets the trimming-speed limit. The assignment, quiz and both labs are on WenQuest."
