            <text x="300" y="120">EOL</text><text x="300" y="212" class="zh">整机</text><text x="300" y="212" class="eo">Machine</text><text x="300" y="322">HIL</text>
            <text x="300" y="432">SIL</text><text x="300" y="548" class="zh">单元测试</text><text x="300" y="548" class="eo">Unit tests</text></g>
          <g font-size="26" fill="#c7d3e2">
            <text x="390" y="100" class="zh">每台 3–5 min</text><text x="390" y="100" class="eo">3–5 min per machine</text><text x="450" y="210" class="zh">约 2 天 · 每周</text><text x="450" y="210" class="eo">~2 days · weekly</text><text x="510" y="320" class="zh">3–4 h · 每晚</text><text x="510" y="320" class="eo">3–4 h · nightly</text>
            <text x="570" y="430" class="zh">5–10 min · 每次提交</text><text x="570" y="430" class="eo">5–10 min · commit</text><text x="630" y="545" class="zh">&lt; 1 min · 每次提交</text><text x="630" y="545" class="eo">&lt; 1 min · commit</text></g>
          <path d="M870 560 L870 80" stroke="#8fa3ba" stroke-width="3" marker-end="url(#a22p)"/>
          <text x="855" y="70" font-size="24" fill="#8fa3ba" text-anchor="end" class="zh">越往上越真实</text><text x="855" y="70" font-size="24" fill="#8fa3ba" text-anchor="end" class="eo">More realistic</text>
          <defs><marker id="a22p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8fa3ba"/></marker></defs>
        </svg>
    notes:
      - "把测试按离真机多远分层。最下面单元测试，几百个用例一分钟跑完，能抓逻辑错误，比如 359.9 度到 0 度的跨越；SIL 把固件接上机器模型，能做大量参数扫描，但模型里没有的物理它看不见。HIL 用真的主控板和驱动板，接实时仿真器，中断、总线、电磁铁延迟都是真的，还能注入故障。整机测试台测模型里根本没有的东西，比如线迹和噪声；出厂测试验证的是这一台装得对不对。原则是：缺陷要在能发现它的最低那一层被抓住。"
      - "Layer the tests by how far they are from the real machine. At the bottom, unit tests: hundreds of cases in a minute, catching logic errors such as the wrap from 359.9 to 0 degrees. SIL connects the firmware to a machine model for big parameter sweeps, but can't see physics the model lacks. HIL uses the real controller and driver boards on a real-time simulator, so interrupts, bus and solenoid delays are real, and faults can be injected. The full-machine bench measures what no model has, like stitch quality and noise. And end-of-line testing checks that this particular unit was assembled right. The rule: catch each defect at the lowest layer that can see it."

  - layout: points
    title: ["缺陷要在能发现它的最低一层被发现", "Catch each defect at the lowest layer that can"]
    points:
      - ["单元里发现：改代码几分钟", "Found in a unit test: minutes to fix"]
      - ["HIL 里发现：等一夜、再二分；整机上：要拆机头", "In HIL: a night plus bisecting; on the machine: open the head"]
      - ["高层每抓到一个，就问：低一层能不能抓住它", "Each catch up high: could a lower layer catch it?"]
    foot: ["本案例：把 HIL 的转矩–转速曲线搬进 SIL，同类问题几分钟就能抓住（HIL 仍不能取消）", "In our case: move HIL's torque–speed curve into SIL, so the same kind of bug is caught in minutes (HIL still stays)"]
    notes:
      - "分层的要点只有一句话：缺陷应该在能发现它的最低那一层被发现。同一个缺陷，在单元测试里发现，改代码几分钟；在 HIL 里发现，要等一夜、再二分定位；在整机上发现，要拆机头；到了用户那里，就是返修、索赔和名声。所以每当高层抓到一个缺陷，修完都要问：能不能在低一层加个用例抓住它？本案例就是把 HIL 的转矩–转速曲线连同电压系数搬进 SIL。注意这不等于取消 HIL。"
      - "Layering comes down to one sentence: catch each defect at the lowest layer that can see it. The same bug costs minutes in a unit test; in HIL it costs a night plus bisecting; on the machine you open the head; at the customer it's repairs, claims and reputation. So whenever a higher layer catches a bug, ask after fixing it: could a lower layer catch it with a new case? In our case the HIL's torque–speed curve, with its voltage factor, moves into the SIL motor model. That doesn't mean dropping HIL."

  - layout: points
    title: ["先写编号需求，再写用例", "Numbered requirements first, then test cases"]
    tag: ["追溯", "Traceability"]
    points:
      - ["REQ-TRM-01：剪线成功率 ≥ 99.5%（置信度 95%）", "REQ-TRM-01: trim success ≥ 99.5% (95% confidence)"]
      - ["没有用例的需求，等于没有需求", "A requirement with no test case is no requirement"]
      - ["每条结果带：需求、用例、序列号、固件、参数版本", "Every result carries requirement, case, serial, firmware, parameters"]
    notes:
      - "自动化测试的第一步不是写脚本，而是把要测什么写成编号的需求：编号、一句可以判定的话、一个数值判据和来源。比如 REQ-TRM-01：从三千转到最高转速任一转速停车剪线，成功率不低于 99.5%，置信度 95%。需求和用例排成一张表就是追溯矩阵，用例里打上需求标记，每次运行自动汇总。每条结果都带五样东西，少一样，几个月后这条记录就说不清了。"
      - "The first step of automated testing isn't writing scripts; it's writing what to test as numbered requirements: an ID, one decidable sentence, a numeric criterion and a source. For example REQ-TRM-01: stop-and-trim from any speed between 3000 and top speed succeeds at least 99.5 percent of the time, at 95 percent confidence. Requirements against cases form the traceability matrix, generated automatically from tags in the test code. And every result carries five things; miss one and in a few months nobody can explain that record."

