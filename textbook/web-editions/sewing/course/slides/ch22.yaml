slides:
  - layout: cover
    video: hero
    kicker: ["第 22 讲", "Lecture 22"]
    title: ["自动化测试", "Automated Testing and Continuous Iteration"]
    sub: ["持续迭代：工况、次数、模型都要够", "Enough conditions, enough trials, realistic models"]
    notes:
      - "同学们好。前两讲做出了三台原型，今天的问题是：怎么知道它们是好的，改了以后还是好的？答案是自动化测试：按规定的工况、足够的次数、足够真实的模型，每天让机器自己测一遍。我们从一次真实感很强的剪线故障讲起。"
      - "Hello everyone. In the last two lectures we built three prototypes. Today's question: how do we know they work, and still work after every change? The answer is automated testing: defined conditions, enough repetitions and realistic models, run by the machine itself every day. We'll start from a very realistic trimming failure."

  - layout: question
    tag: ["车间问题", "Shop-floor problem"]
    title: ["固件升级后，偶尔剪不断线", "After a firmware update, trims occasionally fail"]
    facts:
      - ["v1.4.0“快速剪线”：停车剪线 0.38 s → 0.22 s", "v1.4.0 'fast trim': stop-and-trim 0.38 s → 0.22 s"]
      - ["样机上 3000–4000 r/min 试缝几十次，全好", "Dozens of trials at 3000–4000 r/min on the prototype: all fine"]
      - ["车间常一脚踩到 5000 r/min，电网电压不稳", "Operators floor it to 5000 r/min; the mains voltage wanders"]
    notes:
      - "一家西裤厂把平缝机固件从 v1.3.2 升级到 v1.4.0，新版本的快速剪线让从 4000 转停车剪线从 0.38 秒缩到约 0.22 秒。工程师上线前在样机上三四千转试了几十次，一次都没剪不断。可车间里操作工常常一脚踩到 5000 转再松开，厂区电压也不稳，几天后开始有零星的剪不断报修。为什么试的时候没发现？要测多少次才能放心？这节课回答。"
      - "A trouser factory updated its lockstitch firmware from v1.3.2 to v1.4.0. The new fast trim cut stop-and-trim from 4000 r/min from 0.38 seconds to about 0.22. Before release, the engineer tried dozens of trims at three to four thousand r/min on the prototype; not one failed. But on the floor operators often floor the pedal to 5000 and let go, and the mains voltage wanders. Within days, occasional failed trims were reported. Why didn't testing catch it, and how many trials would be enough? That's today."

  - layout: split
    title: ["剪不断：发令时主轴还没降下来", "Failed trim: the spindle is still too fast"]
    points:
      - ["进刀晚过 330°，就剪不断", "Knife entry past 330° fails the trim"]
      - ["10 ms 延迟：n ≤ {{ch22.ncrit:.0f}} r/min", "With 10 ms: command speed ≤ {{ch22.ncrit:.0f}} r/min"]
      - ["恒功率区：高速时减速能力下降", "Constant-power region: less braking at speed"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><style>html:not(.en-only) .eo{display:none}</style>
          <path d="M80 560 L870 560 M80 560 L80 60" stroke="#4b5f7d" stroke-width="3"/>
          <rect x="80" y="60" width="790" height="260" fill="rgba(255,122,69,.12)"/>
          <path d="M80 320 L870 320" stroke="#ff7a45" stroke-width="4" stroke-dasharray="12 8"/>
          <text x="90" y="305" font-size="28" font-weight="700" fill="#ff9c75" class="zh">330°：晚于此剪不断</text><text x="90" y="305" font-size="28" font-weight="700" fill="#ff9c75" class="eo">Past 330°: trim fails</text>
          <path d="M80 560 L860 128" stroke="#f2b705" stroke-width="5"/>
          <path d="M80 560 L860 214" stroke="#2ec4b6" stroke-width="5"/>
          <text x="250" y="420" font-size="26" fill="#f2b705">10 ms</text>
          <text x="330" y="520" font-size="26" fill="#5ee0d2">8 ms</text>
          <circle cx="414" cy="412" r="14" fill="#2ec4b6"/>
          <text x="414" y="470" font-size="26" fill="#5ee0d2" text-anchor="middle" class="zh">正常电压 514</text><text x="414" y="470" font-size="26" fill="#5ee0d2" text-anchor="middle" class="eo">Normal voltage: 514</text>
          <circle cx="828" cy="229" r="14" fill="#ff7a45"/>
          <text x="790" y="390" font-size="26" fill="#ff9c75" text-anchor="middle" class="zh">低压 10%：1150</text><text x="790" y="390" font-size="26" fill="#ff9c75" text-anchor="middle" class="eo">−10% mains: 1150</text>
          <circle cx="514" cy="320" r="12" fill="#f2b705"/>
          <text x="475" y="300" font-size="26" fill="#f2b705" text-anchor="middle">{{ch22.ncrit:.0f}}</text>
          <text x="470" y="610" font-size="26" fill="#8fa3ba" text-anchor="middle" class="zh">290° 发令时的转速 n（r/min）</text><text x="470" y="610" font-size="26" fill="#8fa3ba" text-anchor="middle" class="eo">Speed n at the 290° command (r/min)</text>
          <text x="90" y="50" font-size="26" fill="#8fa3ba" class="zh">动刀进刀角</text><text x="90" y="50" font-size="26" fill="#8fa3ba" class="eo">Knife entry angle</text>
        </svg>
    notes:
      - "原因在这里。剪线电磁铁在剪线针 290 度发令，动刀进刀角等于 290 加 6nt，晚过 330 度就剪不断。延迟 10 毫秒时，发令转速必须不超过 {{ch22.ncrit:.0f}} 转。v1.4.0 减速按伺服 100% 能力规划，可伺服高于基速进入恒功率区，减速能力下降，基速还随电压变。从 5000 转停车，正常电压下发令时约 514 转，电压低 10% 时约 1150 转，进刀角到了 {{ch22.ent1150:.0f}} 度，必然剪不断。"
      - "Here's the cause. The trim solenoid is commanded at 290 degrees of the trim stitch; knife entry is 290 plus 6nt, and past 330 the trim fails. With a 10 millisecond delay the command speed must be at most {{ch22.ncrit:.0f}} r/min. v1.4.0 planned braking at 100 percent of servo capability, but above base speed the servo enters its constant-power region and brakes less, and the base speed itself moves with voltage. Stopping from 5000, the command comes at about 514 r/min at normal voltage, but about 1150 when the voltage is 10 percent low: entry at {{ch22.ent1150:.0f}} degrees, a certain failure."

  - layout: points
    title: ["手工试缝为什么测不出", "Why hand trials missed it"]
    points:
      - ["工况：人只在 3000–4000 r/min 试，不挑低电压", "Conditions: people try 3000–4000, never low voltage"]
      - ["次数：4750 r/min 试 50 次，{{ch22.none50:.0f}}% 的机会一次也看不到", "Count: 50 tries at 4750 r/min, a {{ch22.none50:.0f}}% chance of seeing nothing"]
      - ["模型：SIL 用理想电机，没有恒功率区", "Model: SIL used an ideal motor, no constant-power region"]
    foot: ["自动化测试 = 规定的工况 + 足够的次数 + 足够真实的模型，每晚都跑", "Automated testing = defined conditions + enough repetitions + realistic models, every night"]
    notes:
      - "手工试缝为什么测不出？三个原因，每一个都是今天要解决的问题。第一是工况：人习惯在三四千转试，很少一脚踩到五千再松开，更不会专挑电压低的时候。第二是次数：就算在 4750 转试，失败率 1.2%，试 50 次一次都看不到的概率约 {{ch22.none50:.0f}}%。第三是模型：SIL 用理想电机，没有恒功率区，所以全过；HIL 用样机实测的转矩–转速曲线，才把它暴露出来。"
      - "Why did hand trials miss it? Three reasons, and each is a problem we solve today. Conditions: people habitually try three to four thousand r/min, rarely floor it to five thousand and let go, and never pick a low-voltage moment. Count: even at 4750, with a 1.2 percent failure rate, fifty tries have about a {{ch22.none50:.0f}} percent chance of showing nothing. Model: the SIL used an ideal motor with no constant-power region, so everything passed; the HIL, with the prototype's measured torque–speed curve, exposed it."

  - layout: section
    num: "01"
    title: ["测试金字塔与测试台", "The test pyramid and the test bench"]

  - layout: split
    title: ["测试金字塔：越往下越快、越便宜", "The test pyramid: lower is faster and cheaper"]
    points:
      - ["单元、SIL：每次提交都跑", "Unit and SIL: every commit"]
      - ["HIL：每晚 3–4 h，真板子、真时序", "HIL: 3–4 h nightly, real boards, real timing"]
      - ["整机：每周；EOL：每台 3–5 min", "Full machine: weekly; EOL: 3–5 min per unit"]
    visual:
      svg: |-
        <svg viewBox="0 0 900 640" width="100%" height="640"><style>html:not(.en-only) .eo{display:none}</style>
          <polygon points="300,30 360,140 240,140" fill="#a78bfa"/>
          <polygon points="240,150 360,150 420,250 180,250" fill="#ff7a45"/>
