slides:
  - layout: cover
    video: hero
    kicker: ["第 30 讲", "Lecture 30"]
    title: ["缝制设备发展趋势", "Trends in Sewing Equipment"]
    sub: ["更省、更聪明、更少人、不缝", "Leaner, smarter, fewer hands, no stitches"]
    notes:
      - "同学们好。这一讲往前看：今后十年缝纫机和缝制车间会变成什么样？与其背新名词，不如问三个问题：哪些趋势已经成熟、正在普及；哪些还卡在物理和经济门槛上，比宣传慢得多；哪些在改变“缝”本身。背景里是今天的虚拟实验：一个多步流程，每步成功率高一点低一点，整条流程能不能不用人，差别大得很。"
      - "Hello everyone. Today we look ahead: what will sewing machines and sewing floors become in the next ten years? Rather than memorising buzzwords, ask three questions. Which trends are mature and spreading? Which are stuck at physical and economic thresholds, moving far slower than the hype? And which are changing sewing itself? In the background is today's lab: a multi-step process where a little more or less success per step makes a big difference to whether it runs without people."

  - layout: question
    tag: ["车间问题", "Shop-floor problem"]
    title: ["机器人上料：单步成功率 97%，值不值？", "Robot loading: 97% per step, worth it?"]
    facts:
      - ["分离、提起、铺平、对位、上料共 10 步，每步 8 s", "Separate, lift, flatten, align, load: 10 steps of 8 s"]
      - ["每次失败要人花 30 s 处理，再重做这一步", "Each failure takes a person 30 s, then the step is redone"]
      - ["机器人 25 万元，顶替每班一人，两班制", "Robot ¥250k, replaces one person a shift, two shifts"]
    notes:
      - "先看车间问题。一家衬衫厂考虑用机器人把裁片从料堆送到缝纫机上：分离布片、提起、铺平、对位、上料，共 10 个动作，每个 8 秒，供应商说单步成功率 97%。每次失败要人花 30 秒处理，再重做这一步。机器人 25 万元，年维护费是价格的 10%，顶替每班一名操作工，两班制，每年 300 天，人工 0.5 元每分。整条流程无人完成的概率是多少？每小时要人插手几次？多久回本？最后回答。"
      - "Here's the problem. A shirt factory is considering a robot to take cut pieces from a stack to the sewing machine: separate a ply, lift it, flatten it, align it, load it, ten actions of 8 seconds each, and the supplier quotes 97 percent success per step. Each failure takes a person 30 seconds to sort out, then the step is redone. The robot costs 250 thousand yuan, maintenance is 10 percent of the price a year, it replaces one operator per shift, two shifts, 300 days a year, labour at 0.5 yuan a minute. What's the chance the whole sequence runs unattended? How often per hour must a person step in? How long to pay back? We'll answer at the end."

  - layout: section
    num: "01"
    title: ["四个方向", "Four directions"]

