    notes:
      - "回家试一试：拉着一条毛巾的一角，它能在桌面上平平地跟着走；从后面推，它马上就皱成一团。这就是刚才推布失稳公式说的事：布的弯曲刚度太小，推力还没到自重的几分之一就拱起来了。这也是缝纫机用送布牙从下面拖布，而不是从后面推布的原因。"
      - "Try it at home. Pull a towel by one corner and it slides flat across the table after you; push it from behind and it bunches up at once. That's the buckling formula we just saw: cloth's bending rigidity is so small that it arches before the push reaches a fraction of its weight. And it's why a sewing machine's feed dog drags the fabric from underneath instead of pushing it from behind."

  - layout: answer
    tag: ["回到车间问题", "Back to the problem"]
    title: ["{{ch30.P97:.0f}}% 无人完成，每 {{ch30.every_min:.0f}} 分钟要人插手一次", "{{ch30.P97:.0f}}% unattended: a person steps in every {{ch30.every_min:.0f}} minutes"]
    rows:
      - ["无人完成率 0.97¹⁰", "{{ch30.P97:.1f}}%"]
      - ["每小时人工干预", "{{ch30.int97:.0f}} 次"]
      - ["回收期（两班 / 三班）", "{{ch30.pay2:.0f}} / {{ch30.pay3:.0f}} 月"]
    side: {big: "{{ch30.p90:.0f}}%", text: ["要 90% 无人完成，单步成功率要约 {{ch30.p90:.0f}}%", "90% unattended needs about {{ch30.p90:.0f}}% per step"]}
    foot: ["单步 99% 时干预降到每小时约 {{ch30.int99:.0f}} 次，两班回收期约 {{ch30.pay99:.0f}} 个月；班次和价格影响更大", "At 99% per step: about {{ch30.int99:.0f}} interventions an hour, payback about {{ch30.pay99:.0f}} months on two shifts"]
    notes:
      - "回到开头的问题。整条流程无人完成的概率 0.97 的 10 次方，约 {{ch30.P97:.1f}}%，每 4 件约有 1 件要人处理。每件期望失败约 {{ch30.f97:.2f}} 次，节拍约 {{ch30.cyc97:.0f}} 秒，每小时约 {{ch30.perh97:.0f}} 件，人工干预约 {{ch30.int97:.0f}} 次。年省人工 {{ch30.saved:.1f}} 万元，扣掉处理失败和维护，两班回收期约 {{ch30.pay2:.0f}} 个月，三班约 {{ch30.pay3:.0f}} 个月。要 90% 无人完成，单步要约 {{ch30.p90:.0f}}%，这时干预降到每小时约 {{ch30.int99:.0f}} 次。所以供应商的 97%，听起来高，乘起来不够。"
      - "Back to our problem. The chance the whole sequence runs unattended is 0.97 to the tenth, about {{ch30.P97:.1f}} percent: one piece in four needs a person. Expected failures are about {{ch30.f97:.2f}} a piece, the cycle about {{ch30.cyc97:.0f}} seconds, output about {{ch30.perh97:.0f}} an hour, and about {{ch30.int97:.0f}} interventions an hour. Labour saved is {{ch30.saved:.1f}} ten-thousand yuan a year; after failure handling and maintenance, payback is about {{ch30.pay2:.0f}} months on two shifts and {{ch30.pay3:.0f}} on three. For 90 percent unattended you need about {{ch30.p90:.0f}} percent per step, which cuts interventions to about {{ch30.int99:.0f}} an hour. The supplier's 97 sounds high, but multiplied it isn't enough."

  - layout: summary
    title: ["本讲小结", "Summary"]
    points:
      - ["伺服直驱最成熟：空等越多越省", "Servo direct drive is mature: more idle time, more saving"]
      - ["布太软：立不住、推不动，所以要“拖”", "Cloth is soft: won't stand, can't be pushed, so drag it"]
      - ["无人完成率 = pⁿ：单步要过 99%", "Unattended rate = pⁿ: each step must beat 99%"]
    after: ["作业 30：一份自动化提案的工程评估 · 测验 · 虚拟实验 30-1 报告 —— 在问渠学习平台完成", "Assignment 30 · quiz · Lab 30-1 report — on WenQuest"]
    notes:
      - "这一讲记住三件事。第一，伺服直驱是最成熟的趋势：年节电等于台数乘开机小时乘功率差，空等时间越多越划算。第二，布几乎没有弯曲刚度：立不住，约 2 倍弯曲长度；推不动，临界力还不到自重的几分之一，所以缝纫机靠送布牙拖布，可行的自动化是让布贴着台面走。第三，多步流程的无人完成率是 p 的 n 次方，单步要过 99%，机器人旁边才能不站人；读新技术报道，先拿数字互相核对。"
      - "Three things to remember. One: servo direct drive is the most mature trend; annual saving is machines times running hours times the power difference, so the more idle time the better. Two: cloth has almost no bending rigidity; it stands only about two bending lengths and buckles before you can push with a fraction of its weight, so machines drag fabric with feed dogs, and workable automation keeps it flat on the table. Three: a multi-step process runs unattended with probability p to the n, so each step must beat 99 percent before the robot can be left alone; and check the numbers in any report on new technology."
