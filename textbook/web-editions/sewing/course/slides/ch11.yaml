    notes:
      - "锁眼机分平头和圆头。平头锁眼用在衬衫上，是 304 之字：先缝一排之字，再缝一个套结，换到另一边再一排之字和一个套结，最后切刀切开，共五步。先缝后切边缘整齐，先切后缝不容易脱纱。圆头锁眼用在西服、大衣、牛仔上，是 404 单针双线之字链式，里面包一根衬线；缝圆头的时候，针和弯针要绕圆心转。"
      - "Buttonholers come in two kinds. The straight buttonhole on shirts is 304 zigzag: one row of zigzag, a bartack, the other row and the other bartack, then the knife cuts it open, five steps in all. Sewing first and then cutting gives neat edges; cutting first frays less. The keyhole buttonhole on suits, coats and jeans is 404, a single-needle two-thread zigzag chainstitch wrapped round a gimp cord; around the round end, needle and looper have to rotate about its centre."

  - layout: split
    title: ["钉扣机与套结机：花样凸轮", "Button sewers and bartackers: the pattern cam"]
    points:
      - ["蜗杆蜗轮大减速：凸轮一圈 = 一个花样", "A worm gear slows it: one cam turn = one pattern"]
      - ["两条槽经 X、Y 杠杆推扣夹或压框", "Two grooves drive the clamp through X and Y levers"]
      - ["每个台阶的升程要落在针在布外的转角里", "Each step's rise must fall in the out-of-fabric angle"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <circle cx="260" cy="320" r="220" fill="#111d31" stroke="#4b5f7d" stroke-width="4"/>
          <path d="M260 160 L300 162 L302 190 L340 196 L338 226 L372 238 L366 268 L396 290 L384 318 L404 350 L386 376 L398 410 L372 430 L372 466" fill="none" stroke="#f2b705" stroke-width="10" stroke-linejoin="round"/>
          <circle cx="260" cy="320" r="18" fill="#4b5f7d"/>
          <text x="260" y="580" font-size="28" font-weight="700" fill="#f2b705" text-anchor="middle">台阶形槽 · stepped groove</text>
          <g transform="translate(560,120)"><rect width="300" height="300" rx="16" fill="#e9dcc0"/>
            <g fill="#2c6fd6"><circle cx="100" cy="100" r="22"/><circle cx="200" cy="100" r="22"/><circle cx="100" cy="200" r="22"/><circle cx="200" cy="200" r="22"/></g>
            <g fill="#08101d"><circle cx="100" cy="100" r="8"/><circle cx="200" cy="100" r="8"/><circle cx="100" cy="200" r="8"/><circle cx="200" cy="200" r="8"/></g></g>
          <path d="M560 470 L860 470" stroke="#5ee0d2" stroke-width="5"/><text x="870" y="478" font-size="28" fill="#5ee0d2" class="en">X</text>
          <path d="M540 120 L540 420" stroke="#5ee0d2" stroke-width="5"/><text x="530" y="110" font-size="28" fill="#5ee0d2" class="en">Y</text>
          <text x="710" y="530" font-size="26" fill="#d3deea" text-anchor="middle">扣夹按花样移动</text>
          <text x="710" y="562" font-size="20" fill="#8fa3ba" text-anchor="middle" class="en">the clamp follows the pattern</text>
        </svg>
    notes:
      - "钉扣机和套结机的机械式结构很像：主轴经蜗杆蜗轮大幅减速，带动一个花样凸轮，凸轮转一圈就是一个完整花样。凸轮上两条槽，经 X、Y 两根杠杆推动扣夹或压框。凸轮每转过一个台阶，扣夹移动一针；台阶的升程段必须对准针在布外的转角。钉扣机常用 101 单线链式，要有防脱装置；套结机用锁式，先打底再覆盖。"
      - "Mechanical button sewers and bartackers are built alike: the shaft drives a pattern cam through a large worm-gear reduction, and one turn of the cam is one complete pattern. Two grooves on the cam drive the button clamp or work clamp through X and Y levers. Each step of the cam moves the clamp one stitch, and the rising part of every step must line up with the angle when the needle is out of the fabric. Button sewers often use a single-thread 101 chainstitch with an anti-unravel device; bartackers use lockstitch, an underlay first, then a cover."

  - layout: split
    title: ["从机械凸轮到电子凸轮", "From mechanical cam to electronic cam"]
    points:
      - ["钢凸轮的廓线，变成程序里的位移表", "The steel cam profile becomes a displacement table"]
      - ["台阶对齐、运动规律、加速度：原样转到运动规划", "Step timing, motion law, acceleration: straight into motion planning"]
      - ["约束不变：仍只能在针在布外时移动", "The rule stands: move only with the needle out"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640">
          <defs><marker id="e11" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2b705"/></marker></defs>
          <g font-size="32" font-weight="700" fill="#f3f6fa" text-anchor="middle">
            <rect x="40" y="40" width="360" height="120" rx="20" fill="#111d31" stroke="#4b5f7d" stroke-width="3"/><text x="220" y="110">花样凸轮</text>
            <rect x="500" y="40" width="360" height="120" rx="20" fill="#111d31" stroke="#2ec4b6" stroke-width="3"/><text x="680" y="110">位移表</text>
            <rect x="40" y="260" width="360" height="120" rx="20" fill="#111d31" stroke="#2ec4b6" stroke-width="3"/><text x="220" y="330">主轴编码器角度</text>
            <rect x="500" y="260" width="360" height="120" rx="20" fill="#111d31" stroke="#ff7a45" stroke-width="3"/><text x="680" y="330">步进电机 X、Y</text></g>
          <g font-size="20" fill="#8fa3ba" text-anchor="middle" class="en"><text x="220" y="145" class="en">pattern cam</text><text x="680" y="145" class="en">displacement table</text><text x="220" y="365" class="en">shaft encoder angle</text><text x="680" y="365" class="en">X and Y steppers</text></g>
          <g stroke="#f2b705" stroke-width="5" marker-end="url(#e11)"><path d="M405 100 L490 100"/><path d="M405 320 L490 320"/><path d="M680 165 L680 250"/></g>
          <rect x="40" y="450" width="820" height="140" rx="20" fill="rgba(255,122,69,.1)" stroke="#ff7a45" stroke-width="2"/>
          <text x="450" y="512" font-size="30" font-weight="700" fill="#ffb38f" text-anchor="middle">针距大、摆宽大时仍要降速</text>
          <text x="450" y="556" font-size="22" fill="#8fa3ba" text-anchor="middle">套结机：X &lt; 5 mm、Y &lt; 3.5 mm 时才可 3200 sti/min</text>
        </svg>
    notes:
      - "电子化以后，钢制凸轮的廓线换成了程序里的位移表，控制器按主轴编码器的角度查表，给步进电机发位置。但设计问题一个没少：台阶要和针在布外的转角对齐，运动规律、峰值加速度，都原样转到了步进电机的运动规划里。约束也不变，移动仍只能在针在布外的转角里完成，所以针距大、摆宽大时还是要降速。某套结机只有 X 小于 5 毫米、Y 小于 3.5 毫米时才能开到每分钟 3200 针。"
      - "With electronics, the profile of the steel cam becomes a displacement table in software; the controller reads the shaft encoder angle, looks up the table and commands the steppers. But none of the design problems goes away: the steps must still line up with the out-of-fabric angle, and the motion law and peak acceleration move straight into the stepper's motion planning. The rule hasn't changed either: moves still happen only while the needle is out, so long stitches and wide bights still mean lower speed. One bartacker reaches 3200 stitches a minute only when X is under 5 millimetres and Y under 3.5."

  - layout: split
    title: ["绗缝机与电脑刺绣机", "Quilting and embroidery machines"]
    points:
