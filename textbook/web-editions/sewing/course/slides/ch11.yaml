      - ["刺绣：9–15 根针杆，换色时针杆箱横移", "Embroidery: 9–15 needle bars; the head shifts to change colour"]
      - ["绣框重：约 1200 r/min，只有平缝机的 1/4", "A heavy frame: about 1200 r/min, a quarter of a lockstitch"]
    visual:
