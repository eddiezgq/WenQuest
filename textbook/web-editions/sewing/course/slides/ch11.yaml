# 第 11 讲 典型特种机的机构 · 课件（第 24 轮新版式）
# 每页一个意思、最多 3 条；中文在上、英文一行在下。版式见 course/tools/build_slides.py 的 LAYOUTS。
# {{ch11.键:格式}} 由课程包程序 course/calc/ch11.py 算出，不手写数字。
# notes：讲者备注（放映时只给老师看，录课时当讲稿用）。
lesson: 11
code: [ch11]

clips:
  hero:          # 封面：实验 11-1 缝出的之字线迹，摆宽在 2–10 mm 之间来回（12 秒一个来回）
    page: zigzag
    selector: "#stitch"
    cover: true
    dur: 12
    loop: 12
    steps:
      - {at: 0, js: "clearInterval(window.__sw);var e=document.getElementById('w'),t0=Date.now();window.__sw=setInterval(function(){var t=(Date.now()-t0)/1000;e.value=(6-4*Math.cos(t*2*Math.PI/12)).toFixed(1);e.dispatchEvent(new Event('input',{bubbles:true}));},300)"}
  bight:         # 同上，放在机构页里
    page: zigzag
    selector: "#stitch"
    dur: 12
    loop: 12
    steps:
      - {at: 0, js: "clearInterval(window.__sw);var e=document.getElementById('w'),t0=Date.now();window.__sw=setInterval(function(){var t=(Date.now()-t0)/1000;e.value=(6-4*Math.cos(t*2*Math.PI/12)).toFixed(1);e.dispatchEvent(new Event('input',{bubbles:true}));},300)"}
  pathsweep:     # 摆动区间由 230° 收到 130° 再放开（14 秒一个来回）：太宽针在布里横摆（红），太窄惯性力超限
    page: zigzag
    selector: "#path"
    dur: 14
    loop: 14
    steps:
      - {at: 0, js: "clearInterval(window.__sw);var a=document.getElementById('fs'),b=document.getElementById('fe'),t0=Date.now();window.__sw=setInterval(function(){var t=(Date.now()-t0)/1000,h=Math.round(90+25*Math.cos(t*2*Math.PI/14));a.value=360-h;b.value=h;a.dispatchEvent(new Event('input',{bubbles:true}));b.dispatchEvent(new Event('input',{bubbles:true}));},300)"}
  checksweep:    # 同一个来回，看四条判据
    page: zigzag
    selector: "#checks"
    dur: 14
    loop: 14
    steps:
      - {at: 0, js: "clearInterval(window.__sw);var a=document.getElementById('fs'),b=document.getElementById('fe'),t0=Date.now();window.__sw=setInterval(function(){var t=(Date.now()-t0)/1000,h=Math.round(90+25*Math.cos(t*2*Math.PI/14));a.value=360-h;b.value=h;a.dispatchEvent(new Event('input',{bubbles:true}));b.dispatchEvent(new Event('input',{bubbles:true}));},300)"}
  laws:          # 时序图：运动规律 修正梯形 → 摆线 → 简谐，每 4 秒换一次，一直循环
    page: zigzag
    selector: "#tim"
    vh: 1100
    dur: 12
    loop: 12
    steps:
      - {at: 0, js: "var s=document.getElementById('law');s.selectedIndex=0;s.dispatchEvent(new Event('change',{bubbles:true}))"}
      - {at: 4, js: "var s=document.getElementById('law');s.selectedIndex=1;s.dispatchEvent(new Event('change',{bubbles:true}))"}
      - {at: 8, js: "var s=document.getElementById('law');s.selectedIndex=2;s.dispatchEvent(new Event('change',{bubbles:true}))"}

slides:
  - layout: cover
    video: hero
    kicker: ["第 11 讲", "Lecture 11"]
    title: ["典型特种机的机构", "Mechanisms of Typical Special Machines"]
    sub: ["一个缝纫头，加一套平面运动", "A sewing head plus a planar motion"]
    notes:
      - "同学们好。锁眼、钉扣、套结、之字缝、绗缝、刺绣，这些机器统称特种机。它们看起来五花八门，结构却有一个共同点：一个缝纫头，加上针或布的平面运动。这一讲以之字缝机为主线，看横摆该放在哪段转角、用什么运动规律、摆宽受什么限制，再看锁眼、钉扣、刺绣机怎样用同一套道理。"
      - "Hello everyone. Buttonholers, button sewers, bartackers, zigzag machines, quilters and embroidery machines are all called special machines. They look very different, but they share one structure: a sewing head plus a planar motion of the needle or the fabric. Today we follow the zigzag machine: where in the shaft angle the swing belongs, which motion law to use, and what limits the bight. Then we see how buttonholers, button sewers and embroidery machines use the same ideas."

  - layout: question
    tag: ["车间问题", "Shop-floor problem"]
    title: ["松紧带之字缝：区间能不能再压缩", "Zigzagging elastic: can the swing be squeezed?"]
    facts:
      - ["摆宽 8 mm，5000 r/min，摆针区间 275°–85°（170°），修正梯形", "8 mm bight, 5000 r/min, swing 275°–85° (170°), modified trapezoid"]
      - ["摆架折算质量 150 g，横向惯性力限 250 N（示意）", "Frame mass 150 g at the needle; sideways limit 250 N (illustrative)"]
      - ["工艺员：改用“更平稳”的摆线规律，区间压到 120°", "The engineer: switch to the “smoother” cycloid and squeeze to 120°"]
    notes:
      - "车间问题。内衣厂用电子之字缝机上松紧带，摆宽 8 毫米，每分钟 5000 转，摆针区间从主轴 275 度到 85 度，共 170 度，运动规律是修正梯形。摆架折算到针尖的质量约 150 克，横向惯性力按 250 牛限（示意值）。工艺员提了两点：改用更平稳的摆线规律；把区间压到 120 度，给送布多留时间。行不行？针在左右两端被钩住的时刻差多少？"
      - "The shop-floor problem. An underwear factory sews elastic on an electronic zigzag machine: 8 millimetre bight, 5000 r/min, the needle swings from 275 to 85 degrees of shaft angle, 170 in all, with a modified-trapezoid motion law. The frame's mass referred to the needle is about 150 grams, and the sideways inertia force is limited to 250 newtons, an illustrative value. The process engineer proposes the smoother cycloidal law, and squeezing the swing to 120 degrees to give the feed more time. Will it work? And how far apart are the catching moments at the two ends?"

  - layout: section
    num: "01"
    title: ["特种机：缝纫头 + 平面运动", "Special machines: a head plus planar motion"]

  - layout: tiles
    title: ["同一个结构，六种机器", "One structure, six machines"]
    tiles:
      - {k: "之字", name: ["之字缝机", "Zigzag"], use: ["针杆左右摆", "The needle bar swings"], hot: true}
      - {k: "锁眼", name: ["锁眼机", "Buttonholer"], use: ["之字 + 套结 + 切刀", "Zigzag + bartack + knife"]}
      - {k: "钉扣", name: ["钉扣机", "Button sewer"], use: ["扣夹按花样移动", "The clamp follows a pattern"]}
      - {k: "套结", name: ["套结机", "Bartacker"], use: ["压框 X、Y 两向走", "The clamp moves in X and Y"]}
      - {k: "绗缝", name: ["多针绗缝机", "Multi-needle quilter"], use: ["几十根针一起缝", "Dozens of needles at once"]}
      - {k: "刺绣", name: ["电脑刺绣机", "Embroidery machine"], use: ["绣框走花样、换色", "The frame moves; colours change"]}
    notes:
      - "这六种机器看起来很不一样，结构却相同：一个缝纫头，加上针或布在平面里的运动，再加一些附加动作，比如切刀、换色。之字缝是针杆左右摆；锁眼是之字加两端套结再加切刀；钉扣机的扣夹、套结机的压框按花样在 X、Y 两个方向走；绗缝机一根横梁上几十根针；刺绣机的绣框走花样，还要换色。"
      - "These six machines look very different, but their structure is the same: a sewing head, plus motion of the needle or the fabric in a plane, plus extra actions such as a knife or colour change. In the zigzag machine the needle bar swings sideways. A buttonholer is zigzag plus bartacks at both ends plus a knife. The clamp of a button sewer or the frame of a bartacker moves in X and Y along a pattern. A quilter carries dozens of needles on one beam. An embroidery machine moves its frame along the design and changes colour."

  - layout: duo
    title: ["硬约束：针在布中，不许横着动", "The hard rule: no sideways motion with the needle in"]
    left: {video: pathsweep, label: ["针尖路径：区间收放", "Needle path as the interval changes"], note: ["红色 = 在布里横摆", "Red = swinging inside the fabric"]}
    right: {video: checksweep, label: ["四条判据", "Four criteria"], note: ["太窄：惯性力超限", "Too narrow: force over the limit"]}
    notes:
      - "所有特种机都受同一条硬约束：针在布中时，针和布之间不能有水平相对运动。违反了，针被拉弯、针迹偏位，甚至撞针板断针。这是虚拟实验 11-1，摆动区间正在放大又收窄：太宽了，横摆伸进针在布里的时段，路径变红；太窄了，同样的摆宽挤在更短的转角里，惯性力超限。"
      - "Every special machine obeys one hard rule: while the needle is in the fabric, needle and fabric must not move sideways relative to each other. Break it and the needle bends, stitches go astray, or the needle hits the plate and breaks. This is Virtual Lab 11-1, with the swing interval opening and closing. Too wide, and the swing runs into the time the needle is in the fabric: the path turns red. Too narrow, and the same bight is crammed into fewer degrees, so the inertia force goes over the limit."

  - layout: section
    num: "02"
    title: ["之字缝机：横摆放在哪、怎么摆", "The zigzag machine: when and how to swing"]

  - layout: split
    title: ["304 之字线迹与摆针机构", "Stitch 304 and the swinging needle bar"]
    points:
      - ["304 是锁式，交织点左右交替，比 301 有弹性", "304 is a lockstitch, alternating sides; stretchier than 301"]
      - ["针杆装在摆架里，绕上端支点左右摆", "The needle bar sits in a frame pivoted at the top"]
      - ["电子式：步进电机直驱，最大摆宽 8 mm", "Electronic: a stepper drives it, up to 8 mm bight"]
    visual: {video: bight}
    notes:
      - "之字线迹 304 还是锁式线迹，只是交织点交替落在左右两侧，比直线的 301 有弹性，适合松紧带和针织。针杆装在一个摆架里，摆架绕上端支点左右摆。机械式由之字凸轮经摆杆、连杆推动，改连杆作用半径就改摆宽；电子式用步进电机直接驱动，某型最大摆宽 8 毫米，每分钟 5000 针。右边摆宽在 2 到 10 毫米之间来回。"
      - "The zigzag stitch 304 is still a lockstitch; the interlocks simply alternate left and right, so it stretches more than a straight 301 and suits elastic and knits. The needle bar sits in a frame that swings about a pivot at its top. On mechanical machines a zigzag cam drives it through a lever and link, and changing the link's working radius changes the bight; electronic machines drive it directly with a stepper motor, up to 8 millimetres at 5000 stitches a minute on one model. On the right, the bight sweeps between 2 and 10 millimetres."

  - layout: split
    title: ["针在布外的窗口：约 {{ch11.win:.0f}}°", "The out-of-fabric window: about {{ch11.win:.0f}}°"]
    points:
      - ["针 258.3° 离开布面，101.7° 再碰布面", "The needle leaves at 258.3° and touches again at 101.7°"]
      - ["留 0.5 mm 余量：可用 {{ch11.win_exit:.0f}}°–{{ch11.win_enter:.0f}}°", "With a 0.5 mm margin: {{ch11.win_exit:.0f}}°–{{ch11.win_enter:.0f}}°"]
      - ["送布和摆针共用这个窗口；布越厚越窄", "Feed and swing share it; thicker fabric narrows it"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640"><style>html:not(.en-only) .eo{display:none}</style>
          <circle cx="330" cy="320" r="230" fill="none" stroke="#1c2a42" stroke-width="60"/>
          <path d="M103.5 359.9 A230 230 0 1 1 556.5 359.9" fill="none" stroke="#2ec4b6" stroke-width="60"/>
          <path d="M556.5 359.9 A230 230 0 0 1 103.5 359.9" fill="none" stroke="#c8d2de" stroke-width="60" opacity=".55"/>
