          <text x="330" y="626" font-size="24" fill="#8fa3ba" text-anchor="middle" class="en">180°</text>
          <text x="330" y="300" font-size="40" font-weight="800" fill="#5ee0d2" text-anchor="middle">≈ {{ch11.win:.0f}}°</text>
          <text x="330" y="340" font-size="24" fill="#d3deea" text-anchor="middle">针在布外 · out of fabric</text>
          <text x="330" y="470" font-size="26" fill="#c8d2de" text-anchor="middle">针在布中</text><text x="330" y="470" font-size="26" fill="#c8d2de" text-anchor="middle" class="eo">in fabric</text>
          <text x="620" y="200" font-size="30" font-weight="800" fill="#5ee0d2">送布 + 横摆</text>
          <text x="620" y="236" font-size="22" fill="#8fa3ba" class="en">feed + swing share it</text>
          <text x="600" y="400" font-size="26" fill="#d3deea" class="en">{{ch11.win_enter:.0f}}°</text>
          <text x="10" y="400" font-size="26" fill="#d3deea" class="en">{{ch11.win_exit:.0f}}°</text>
        </svg>
    notes:
      - "横摆只能放在针在布外的那段转角里。算例取针杆行程 31 毫米、布厚 1.5 毫米：针在 258.3 度离开布面，101.7 度再碰到布面。要求摆动时针尖至少高出布面 0.5 毫米，可用的就是 {{ch11.win_exit:.0f}} 度到 {{ch11.win_enter:.0f}} 度，约 {{ch11.win:.0f}} 度。注意送布也在这个窗口里完成，和摆针共用；布越厚，窗口越窄。"
      - "The sideways swing has to fit into the part of the turn when the needle is out of the fabric. In the worked example, with a 31-millimetre stroke and 1.5 millimetres of fabric, the needle leaves the surface at 258.3 degrees and touches it again at 101.7. Require the point to be at least 0.5 millimetres clear while swinging, and the usable window is {{ch11.win_exit:.0f}} to {{ch11.win_enter:.0f}} degrees, about {{ch11.win:.0f}}. Note that the feed happens in this same window, shared with the swing, and thicker fabric narrows it."

  - layout: figure
    title: ["三种运动规律：摆的方式不同", "Three motion laws: three ways to swing"]
    h: 560
    visual: {video: laws}
    caption: ["修正梯形 → 摆线 → 简谐，每 4 秒换一次", "Modified trapezoid → cycloidal → harmonic, every 4 s"]
    notes:
      - "同样摆 8 毫米、同样 170 度，摆的方式可以不同。简谐，加速度是余弦，两端加速度突变，激起冲击和振动；摆线，加速度是正弦，两端为零，很平稳，可是峰值最大；修正梯形，加速度平顶、两端连续，峰值和简谐差不多。现在三种规律轮流切换，看下方针的横向位置曲线怎样变。"
      - "Same 8-millimetre bight, same 170 degrees, but the swing can follow different laws. Harmonic: the acceleration is a cosine, jumping at both ends, which causes shocks and vibration. Cycloidal: the acceleration is a sine, zero at both ends, very smooth, but with the highest peak. Modified trapezoid: a flat-topped acceleration, continuous at both ends, with a peak about the same as harmonic. The three laws are cycling now; watch how the lower curve, the needle's sideways position, changes."

