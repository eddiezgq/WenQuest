    notes:
      - "峰值加速度等于 C 乘摆宽 w、乘主轴角速度平方，除以摆动所占转角 β 的平方。C 由运动规律决定：简谐约 4.93，摆线 2π 约 6.28，修正梯形约 4.89。所以加速度和摆宽成正比，和转速平方成正比，和摆动转角平方成反比。工艺员说的“更平稳”的摆线，两端是平稳，峰值却最大；修正梯形比摆线低约 {{ch11.CYless:.0f}}%，兼有两者长处。"
      - "The peak acceleration is C times the bight w times the shaft angular speed squared, divided by the square of the swing angle beta. C depends on the motion law: about 4.93 harmonic, 2 pi or about 6.28 cycloidal, about 4.89 modified trapezoid. So acceleration goes with the bight and with speed squared, and inversely with the swing angle squared. The cycloid the engineer calls smoother is smooth at the ends, but its peak is the highest; the modified trapezoid peaks about {{ch11.CYless:.0f}} percent lower and has the best of both."

  - layout: section
    num: "03"
    title: ["两端都要钩住", "Both ends must be caught"]

  - layout: split
    title: ["针在两端：钩线时刻不同", "At the two ends the catch comes at different times"]
    points:
      - ["旋梭转速是主轴 2 倍，梭尖从右向左扫", "The hook turns at 2× shaft speed, sweeping right to left"]
      - ["Δφ = w / (2R)：8 mm 时约 {{ch11.dphi8:.0f}}°", "Δφ = w / (2R): about {{ch11.dphi8:.0f}}° at 8 mm"]
      - ["右端先钩：针回升只有 {{ch11.riseR:.1f}} mm", "The right end is caught first: only {{ch11.riseR:.1f}} mm of rise"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640"><style>html:not(.en-only) .eo{display:none}</style>
          <circle cx="450" cy="380" r="220" fill="none" stroke="#4b5f7d" stroke-width="4" stroke-dasharray="12 10"/>
          <circle cx="450" cy="380" r="10" fill="#8fa3ba"/>
          <path d="M450 380 L344 187" stroke="#ff7a45" stroke-width="4"/><path d="M450 380 L556 187" stroke="#4c8dff" stroke-width="4"/>
          <path d="M405 300 A90 90 0 0 1 495 300" fill="none" stroke="#f2b705" stroke-width="5"/>
          <text x="450" y="280" font-size="34" font-weight="800" fill="#f2b705" text-anchor="middle">2Δφ</text>
          <g stroke="#c8d2de" stroke-width="12" stroke-linecap="round"><path d="M344 40 L344 175"/><path d="M556 40 L556 175"/></g>
          <path d="M344 120 L556 120" stroke="#f2b705" stroke-width="3" stroke-dasharray="8 6"/>
          <text x="450" y="108" font-size="30" font-weight="800" fill="#f2b705" text-anchor="middle" class="en">w</text>
          <text x="300" y="40" font-size="26" fill="#ffb38f" text-anchor="end">左端：后钩</text><text x="300" y="40" font-size="26" fill="#ffb38f" text-anchor="end" class="eo">left: caught later</text>
          <text x="600" y="40" font-size="26" fill="#8fbaff">右端：先钩</text><text x="600" y="40" font-size="26" fill="#8fbaff" class="eo">right: caught first</text>
          <path d="M700 260 A220 220 0 0 0 600 190" fill="none" stroke="#2ec4b6" stroke-width="8"/>
          <path d="M600 190 l30 -2 l-14 26 z" fill="#2ec4b6"/>
          <text x="640" y="330" font-size="26" fill="#5ee0d2">梭尖 · hook</text>
          <text x="450" y="460" font-size="28" fill="#d3deea" text-anchor="middle">R = 13.5 mm</text>
          <text x="450" y="628" font-size="22" fill="#8fa3ba" text-anchor="middle" class="zh">梭尖转过 w/R，主轴只转一半：Δφ = w/(2R)</text><text x="450" y="628" font-size="22" fill="#8fa3ba" text-anchor="middle" class="eo">The hook turns w/R, the shaft half that: Δφ = w/(2R)</text>
        </svg>
    notes:
      - "旋梭轴前后布置，梭尖经过针时沿左右方向运动。针在左右两端，梭尖要多转 w 比 R 的角度才能从一端走到另一端；旋梭转速是主轴 2 倍，所以主轴只差一半：Δφ 等于 w 比 2R。R 等于 13.5 毫米、摆宽 8 毫米时约 {{ch11.dphi8:.0f}} 度。梭尖从右向左，右端先钩，那时针回升只有约 {{ch11.riseR:.1f}} 毫米，左端回升 3.8，两端差近 3 毫米。"
      - "The hook shaft runs front to back, so as the hook point passes the needle it moves sideways. With the needle at the two ends, the point has to turn an extra w over R to get from one to the other; the hook turns twice as fast as the shaft, so the shaft angle differs by half that: delta phi equals w over 2R. With R 13.5 millimetres and an 8-millimetre bight, that's about {{ch11.dphi8:.0f}} degrees. The point sweeps right to left, so the right end is caught first, when the needle has risen only about {{ch11.riseR:.1f}} millimetres, against 3.8 at the left: nearly 3 millimetres apart."

  - layout: bignum
    title: ["摆宽上限，由钩线窗口决定", "The maximum bight is set by the catching window"]
    nums:
      - {n: "{{ch11.wmax5:.1f}} mm", label: ["用第 5 讲旋梭窗口（回升 1.5–2.8 mm）", "With Lecture 5's hook window (1.5–2.8 mm rise)"]}
      - {n: "{{ch11.wmax:.1f}} mm", label: ["用第 10 讲示意判据（1.0–4.2 mm）", "With Lecture 10's criterion (1.0–4.2 mm)"]}
      - {n: "10 mm", label: ["说明书最大摆宽", "The manual's maximum"]}
    foot: ["两端都要在线环够大时被钩住；真实窗口比第 5 讲宽得多，要靠实测", "Both ends must be caught while the loop is big enough; the real window is much wider than Lecture 5's, measure it"]
    notes:
      - "两端都要在线环够大的时候被钩住，这就限制了摆宽。如果用第 5 讲旋梭的窗口，回升约 1.5 到 2.8 毫米，摆宽上限只有约 {{ch11.wmax5:.1f}} 毫米；用第 10 讲的示意判据，回升 1.0 到 4.2 毫米，两端最多差约 {{ch11.dphimax:.0f}} 度，摆宽上限约 {{ch11.wmax:.1f}} 毫米。说明书最大能到 10 毫米，可见真实的线环窗口比第 5 讲的模型宽得多，要实测。"
      - "Both ends must be caught while the loop is big enough, and that limits the bight. With Lecture 5's hook window, a rise of about 1.5 to 2.8 millimetres, the maximum bight is only about {{ch11.wmax5:.1f}} millimetres. With Lecture 10's illustrative criterion, 1.0 to 4.2, the two ends can differ by about {{ch11.dphimax:.0f}} degrees, which allows about {{ch11.wmax:.1f}} millimetres. The manual goes up to 10, so the real loop window is clearly much wider than the Lecture 5 model; it has to be measured."

  - layout: points
    title: ["两端的高度与间隙怎样调", "Setting height and clearance at the two ends"]
    points:
      - ["最左端：调针眼上沿到梭尖 0.2–0.5 mm", "Left end: eye top to hook point 0.2–0.5 mm"]
      - ["最右端：调梭尖与针的间隙 0–0.05 mm", "Right end: hook-to-needle clearance 0–0.05 mm"]
      - ["左端针回升多，离梭尖最近；右端针身最粗处最近", "Left: most rise, eye nearest; right: full needle diameter nearest"]
    notes:
      - "说明书的调法正好对应两端的差别：在最左端调针眼上沿到梭尖的距离，0.2 到 0.5 毫米；在最右端调梭尖和针的间隙，0 到 0.05 毫米。为什么？左端后钩，针回升多，针眼离梭尖最近，所以在这端定高度；右端针回升少，梭尖从针身全直径处经过，离得最近，所以在这端查间隙。"
      - "The manual's procedure matches the difference between the ends. At the left end, set the distance from the top of the eye to the hook point, 0.2 to 0.5 millimetres. At the right end, set the clearance between hook point and needle, 0 to 0.05. Why? The left end is caught later, with more rise, so the eye is closest to the point there; that's where to set height. At the right end the needle has risen less and the point passes the full diameter of the needle, closest of all; that's where to check clearance."

  - layout: lab
    title: ["动手试一试：之字缝的摆针与钩线", "Try it: zigzag swing timing and catching"]
    shot: {page: zigzag}
    tasks:
      - ["按“打乱”，先调摆动区间，再调旋梭定时", "Press “Scramble”; fix the swing interval first, then the hook timing"]
      - ["换“摆线”，找出不超 250 N 的最窄区间", "Switch to cycloidal; find the narrowest interval under 250 N"]
      - ["只调摆宽和旋梭定时，找出最大摆宽", "Using only bight and hook timing, find the maximum bight"]
    notes:
      - "这个实验大家在问渠平台上做。第一，按“打乱”，先调摆动开始和结束，让横摆离开红色区段，再调旋梭定时，使四条判据都满足。第二，换成摆线规律，摆宽 8 毫米、5000 转，找出惯性力不超过 250 牛、又全在布外的最窄区间。第三，只调摆宽和旋梭定时，找出两端都能钩住的最大摆宽，想一想说明书为什么在最左端定梭尖高度。"
      - "Do this lab on WenQuest. One: press Scramble, adjust the swing start and end until the swing leaves the red segment, then the hook timing until all four criteria pass. Two: switch to the cycloidal law at 8 millimetres and 5000 r/min and find the narrowest interval that stays under 250 newtons and entirely out of the fabric. Three: using only the bight and hook timing, find the largest bight at which both ends are caught, and think about why the manual sets hook height at the left end."

