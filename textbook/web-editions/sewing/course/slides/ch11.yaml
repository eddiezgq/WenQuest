          <rect x="112" y="332" width="676" height="226" fill="#e9dcc0" opacity=".85"/>
          <path d="M300 400 C 360 360, 420 470, 480 420 S 600 380, 640 460" fill="none" stroke="#2c6fd6" stroke-width="7"/>
          <text x="450" y="610" font-size="26" fill="#ffb38f" text-anchor="middle">绣框 X、Y 移动：每针几毫米都要在针离布时走完</text><text x="450" y="610" font-size="26" fill="#ffb38f" text-anchor="middle" class="eo">Frame moves in X, Y: a few mm per stitch, all with the needle out</text>
        </svg>
    notes:
      - "多针绗缝机一根横梁上装几十根针，每根针一根弯针，一次缝多道平行的 401。电脑刺绣机每个机头有 9 到 15 根针杆，一个驱动器只带动对准的那一根，换色时整个针杆箱横移。多头机共用上轴和下轴。刺绣机转速只有平缝机的四分之一左右，某型每分钟 1200 转，因为绣框很重，每针几毫米的移动都要在针离开布料的时候走完。"
      - "A multi-needle quilter carries dozens of needles on one beam, each with its own looper, sewing many parallel rows of 401 at once. An embroidery head has 9 to 15 needle bars; one driver works only the bar lined up with it, and to change colour the whole needle-bar case shifts sideways. Multi-head machines share upper and lower shafts. Embroidery machines run at only about a quarter of lockstitch speed, about 1200 r/min on one model, because the frame is heavy and every move of a few millimetres must be finished while the needle is out of the fabric."

  - layout: section
    num: "05"
    title: ["算例：换摆线、压到 120°", "Worked example: cycloid, and squeezing to 120°"]

  - layout: bignum
    title: ["8 mm、5000 r/min：横向惯性力", "8 mm at 5000 r/min: sideways inertia force"]
    nums:
      - {n: "{{ch11.FMT:.0f}} N", label: ["修正梯形，170°：{{ch11.aMT:.0f}} m/s²", "Modified trapezoid, 170°: {{ch11.aMT:.0f}} m/s²"]}
      - {n: "{{ch11.FCY:.0f}} N", label: ["摆线，170°：{{ch11.aCY:.0f}} m/s²", "Cycloidal, 170°: {{ch11.aCY:.0f}} m/s²"]}
      - {n: "{{ch11.FCY120:.0f}} N", label: ["摆线，压到 120°：×{{ch11.r120:.1f}}", "Cycloidal at 120°: ×{{ch11.r120:.1f}}"]}
    foot: ["F = m · C w ω² / β²，m = 0.15 kg，ω = {{ch11.omega:.0f}} rad/s，β = {{ch11.beta:.2f}} rad；限值 250 N", "F = m · C w ω² / β², m = 0.15 kg, ω = {{ch11.omega:.0f}} rad/s, β = {{ch11.beta:.2f}} rad; limit 250 N"]
    notes:
      - "回到开头的车间问题，代入数字算。主轴角速度 {{ch11.omega:.0f}} 弧度每秒，170 度是 {{ch11.beta:.2f}} 弧度。修正梯形，峰值加速度约 {{ch11.aMT:.0f}} 米每二次方秒，乘 0.15 千克，惯性力约 {{ch11.FMT:.0f}} 牛；摆线约 {{ch11.aCY:.0f}}，惯性力约 {{ch11.FCY:.0f}} 牛，都在 250 牛以内。压到 120 度，加速度乘 170 比 120 的平方，约 {{ch11.r120:.1f}} 倍，摆线约 {{ch11.FCY120:.0f}} 牛，修正梯形约 {{ch11.FMT120:.0f}} 牛，都超限。"
      - "Back to the shop-floor problem, with numbers. The shaft turns at {{ch11.omega:.0f}} radians per second, and 170 degrees is {{ch11.beta:.2f}} radians. Modified trapezoid: a peak of about {{ch11.aMT:.0f}} metres per second squared; times 0.15 kilograms, about {{ch11.FMT:.0f}} newtons. Cycloidal: about {{ch11.aCY:.0f}}, giving about {{ch11.FCY:.0f}} newtons. Both are under 250. Squeeze to 120 degrees and the acceleration is multiplied by 170 over 120 squared, about {{ch11.r120:.1f}}: about {{ch11.FCY120:.0f}} newtons cycloidal and {{ch11.FMT120:.0f}} modified trapezoid, both over the limit."

  - layout: split
    title: ["机器人联系：时间标定与 S 形加减速", "Robot link: time scaling and S-curves"]
    points:
      - ["同样走 w，时间压缩一半，加速度变 4 倍", "Same distance in half the time: four times the acceleration"]
      - ["S 形加减速和修正梯形是同一个思路", "S-curve profiles follow the same idea as the modified trapezoid"]
      - ["点胶、焊接：工具离开工件时才大幅横移", "Dispensing, welding: big moves only with the tool off the part"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640"><style>html:not(.en-only) .eo{display:none}</style>
          <text x="0" y="40" font-size="26" fill="#8fa3ba">加速度曲线 · acceleration profiles</text>
          <path d="M40 220 L860 220" stroke="#2c3e5c" stroke-width="2"/>
          <path d="M40 220 L40 100 L240 100 L240 340 L440 340 L440 220" fill="none" stroke="#8fa3ba" stroke-width="6"/>
          <text x="140" y="85" font-size="26" fill="#c8d2de" text-anchor="middle">梯形速度：加速度突变</text><text x="140" y="85" font-size="26" fill="#c8d2de" text-anchor="middle" class="eo">trapezoid: jumps</text>
          <path d="M460 220 C 490 220, 500 110, 540 110 L 600 110 C 640 110, 650 220, 660 220 C 670 220, 680 330, 720 330 L 780 330 C 820 330, 830 220, 860 220" fill="none" stroke="#2ec4b6" stroke-width="6"/>
          <text x="660" y="85" font-size="26" fill="#5ee0d2" text-anchor="middle" class="zh">S 形：加速度连续</text><text x="660" y="85" font-size="26" fill="#5ee0d2" text-anchor="middle" class="eo">S-curve: continuous</text>
          <rect x="40" y="420" width="820" height="170" rx="20" fill="#111d31" stroke="#22324d"/>
          <text x="450" y="490" font-size="40" font-weight="800" fill="#f2b705" text-anchor="middle" class="en">a_peak ∝ w / T²</text>
          <text x="450" y="545" font-size="24" fill="#8fa3ba" text-anchor="middle">时间减半 → 加速度、电机力矩 ×4</text><text x="450" y="545" font-size="24" fill="#8fa3ba" text-anchor="middle" class="eo">half the time → 4× acceleration and motor torque</text>
        </svg>
    notes:
      - "选摆针规律，就是机器人轨迹规划里的时间标定：同样走 w 的距离、限定在时间 T 内完成，峰值加速度和 w 比 T 平方成正比，时间压缩一半，加速度和电机力矩就变成 4 倍。伺服驱动器常用的 S 形加减速，限制加加速度，和修正梯形是同一个思路：加速度连续、不激起冲击，峰值又不太高。点胶、焊接机器人只能在工具离开工件时大幅横移，和针在布外才能摆是同一条约束。"
      - "Choosing a swing law is the time-scaling step of robot trajectory planning: to cover a distance w in a time T, the peak acceleration goes with w over T squared, so halving the time quadruples the acceleration and the motor torque. The S-curve profiles of servo drives, which limit jerk, follow the same idea as the modified trapezoid: continuous acceleration, no shock, and a moderate peak. A dispensing or welding robot may make big sideways moves only while its tool is off the workpiece: the same rule as a needle that may swing only when it's out of the fabric."

  - layout: split
    title: ["生活中：订书机抬起时才能挪纸", "Everyday: move the paper only when the stapler is up"]
    points:
      - ["沿纸边钉一排：抬起时才能挪到下一个位置", "Stapling along an edge: move only while it's up"]
      - ["压下时一挪，钉子就歪了", "Move while pressing and the staple goes crooked"]
      - ["摆针、扣夹、绣框都一样：针离布时才能动", "Needle, clamp, frame: they move only when the needle is out"]
    visual:
      svg: |
        <svg viewBox="0 0 900 640" width="100%" height="640"><style>html:not(.en-only) .eo{display:none}</style>
          <rect x="60" y="420" width="780" height="20" rx="4" fill="#e9dcc0"/>
          <path d="M200 400 L560 330 L560 360 L200 410 Z" fill="#ff7a45"/>
          <rect x="180" y="400" width="420" height="20" rx="6" fill="#8fa3ba"/>
          <circle cx="210" cy="400" r="18" fill="#4b5f7d"/>
          <path d="M640 380 L800 380 M790 370 L805 380 L790 390" stroke="#2ec4b6" stroke-width="6" fill="none"/>
          <text x="720" y="350" font-size="26" fill="#5ee0d2" text-anchor="middle">抬起时挪纸</text><text x="720" y="350" font-size="26" fill="#5ee0d2" text-anchor="middle" class="eo">move while up</text>
          <g stroke="#2c6fd6" stroke-width="6"><path d="M140 432 l24 0"/><path d="M640 432 l24 0"/><path d="M720 432 l24 0"/></g>
          <text x="450" y="520" font-size="30" font-weight="700" fill="#f3f6fa" text-anchor="middle">压下 = 针在布中：不许动</text>
          <text x="450" y="560" font-size="22" fill="#8fa3ba" text-anchor="middle" class="en">pressed = needle in the fabric: no moving</text>
        </svg>
    notes:
      - "生活中也有同一条约束。用订书机沿纸边钉一排钉子，只有订书机抬起时才能把纸挪到下一个位置；压下的时候一挪，钉子就歪了。之字缝的摆针、钉扣机的扣夹、刺绣机的绣框，都只能在针离开布料的那一小段时间里移动。"
      - "The same rule shows up at home. Stapling a row along the edge of a sheet, you can slide the paper to the next spot only while the stapler is up; move it while pressing down and the staple goes in crooked. The zigzag needle, the button clamp and the embroidery frame likewise may move only in the short time the needle is out of the fabric."

  - layout: answer
    tag: ["回到车间问题", "Back to the problem"]
    title: ["摆线勉强可以，压到 120° 不行", "Cycloid just about; 120° no"]
    rows:
      - [["修正梯形，170°", "Modified trapezoid, 170°"], "{{ch11.FMT:.0f}} N"]
      - [["摆线，170°", "Cycloidal, 170°"], "{{ch11.FCY:.0f}} N"]
      - [["摆线，120°", "Cycloidal, 120°"], "{{ch11.FCY120:.0f}} N"]
    side: {big: "{{ch11.dphi8:.0f}}°", text: ["两端钩线时刻差 Δφ = w/(2R) = 8/27 rad，右端先钩", "The two ends are caught Δφ = w/(2R) = 8/27 rad apart, right first"]}
    foot: ["送布和摆针本来就在同一个窗口里同时进行：压缩摆针区间并不能给送布多出时间", "Feed and swing already share one window: a shorter swing gives the feed no extra time"]
    notes:
      - "回到开头。修正梯形约 {{ch11.FMT:.0f}} 牛，换摆线约 {{ch11.FCY:.0f}} 牛，都在 250 牛以内，可以换，但余量变小了。压到 120 度，摆线约 {{ch11.FCY120:.0f}} 牛，修正梯形约 {{ch11.FMT120:.0f}} 牛，都超限。而且送布和摆针本来就在同一个针在布外的窗口里同时进行，压缩摆针区间并不能给送布多出时间。两端钩线时刻差 8 比 27 弧度，约 {{ch11.dphi8:.0f}} 度，右端先钩。"
      - "Back to the start. Modified trapezoid gives about {{ch11.FMT:.0f}} newtons and the cycloid about {{ch11.FCY:.0f}}, both under 250: the switch is possible, with less margin. Squeezed to 120 degrees, about {{ch11.FCY120:.0f}} cycloidal and {{ch11.FMT120:.0f}} modified trapezoid, both over the limit. And the feed and the swing already happen together in the same out-of-fabric window, so a shorter swing gives the feed no extra time at all. The two ends are caught 8 over 27 radians apart, about {{ch11.dphi8:.0f}} degrees, right end first."

  - layout: summary
    title: ["本讲小结", "Summary"]
    points:
      - ["特种机：针在布中，针和布不能横向相对运动", "Special machines: no sideways relative motion with the needle in"]
      - ["a = C·wω²/β²：区间用满窗口，修正梯形最好", "a = C·wω²/β²: use the whole window; modified trapezoid is best"]
      - ["两端钩线差 Δφ = w/(2R)，摆宽受钩线窗口限制", "Ends differ by Δφ = w/(2R); the catch window limits the bight"]
    after: ["作业 11：之字缝机加大摆宽的可行性核算 · 测验 · 实验 11-1 —— 在问渠学习平台完成", "Assignment 11: feasibility of a wider bight · quiz · Lab 11-1 — on WenQuest"]
    notes:
      - "这一讲记住三件事。第一，所有特种机都受同一条约束：针在布中时，针和布不能有横向相对运动，一切横移都挤在针在布外的转角里。第二，峰值加速度等于 C 乘 w 乘 ω 方除以 β 方，摆动区间要用满窗口，修正梯形峰值低又平稳。第三，之字缝两端钩线时刻差 w 比 2R，摆宽受钩线窗口限制。作业、测验和实验都在问渠平台上完成。"
      - "Three things to remember. One: every special machine obeys the same rule: no sideways relative motion between needle and fabric while the needle is in, so every sideways move is squeezed into the out-of-fabric angle. Two: peak acceleration is C times w times omega squared over beta squared, so use the whole window, and the modified trapezoid is both low-peaked and smooth. Three: the two ends of a zigzag are caught w over 2R apart, so the bight is limited by the catching window. The assignment, quiz and lab are on WenQuest."
