      - "Back to the start. At 5000 r/min the second-order excitation is {{ch23.f5000:.0f}} hertz, frequency ratio {{ch23.r5000:.2f}}, amplification about {{ch23.a5000:.1f}}, vibration about {{ch23.v5000:.1f}}. At 5500 it's {{ch23.f5500:.0f}} hertz, ratio {{ch23.r5500:.2f}}, amplification about {{ch23.a5500:.0f}}, vibration about {{ch23.v5500:.1f}}, and noise about {{ch23.dB5500:.0f}} dB(A). The inertia force grew only about {{ch23.Fup:.0f}} percent; the second-order excitation crept up to the arm's natural frequency. That's resonance. Ribs that raise stiffness 30 percent lift the natural frequency to about {{ch23.fn2:.0f}} hertz: vibration about {{ch23.vfix:.1f}}, noise about {{ch23.dBfix:.0f}} dB(A)."

