      - ["尺寸链用统计法；调整法吸收大部分误差", "Chains by statistics; adjustment absorbs most error"]
      - ["激振频率近固有频率就共振：先改结构", "Excitation near natural frequency resonates: fix the structure"]
    after: ["作业 23：间隙尺寸链与提速共振分析 · 测验 · 实验 23-1 报告 —— 在问渠学习平台完成", "Assignment 23 · quiz · Lab 23-1 report — on WenQuest"]
    notes:
      - "这一讲记住三件事。第一，从设计输入到量产，问题发现得越晚越贵，标准和专利立项时就要列为设计输入。第二，尺寸链用统计法看真实分布；装配调整用一个可调环吸收大部分误差，但换针会让机针两环回来。第三，激振频率接近固有频率时振动急剧放大，治共振首选改结构，把固有频率移出工作范围。作业、测验和实验报告都在问渠平台上完成。下一讲看机针和旋梭怎样制造。"
      - "Three things to remember. One: from design inputs to production, the later a problem is found the more it costs, and standards and patents are design inputs from day one. Two: analyse tolerance chains statistically; adjustment at assembly absorbs most of the error with one adjustable link, but a needle change brings two links back. Three: when excitation nears a natural frequency vibration soars; fix resonance first by changing the structure to move the natural frequency out of range. The assignment, quiz and lab report are on WenQuest. Next time: how needles and rotary hooks are made."
