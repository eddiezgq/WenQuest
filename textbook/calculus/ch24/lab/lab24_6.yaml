# 实验 24.6 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab24_6.js。
原理:
  - ["e^(−t²) = Σ (−1)ⁿ t^(2n)/n!，在整个实轴上收敛；在 [0, x] 上逐项积分（24.2 节）得 erf x = (2/√π) Σ (−1)ⁿ x^(2n+1)/(n!(2n+1))，收敛半径为 ∞。", "e^(−t²) = Σ (−1)ⁿ t^(2n)/n! converges on the whole line; integrating term by term over [0, x] (Section 24.2) gives erf x = (2/√π) Σ (−1)ⁿ x^(2n+1)/(n!(2n+1)), with infinite radius of convergence."]
  - 式: "交错级数：误差 ≤ 第一个略去的项（各项绝对值递减之后）；最大项约在 n ≈ x² 处，大小约 e^(x²)/(√2 π x²)"
  - ["正项级数 erf x = (2/√π) e^(−x²) Σ 2ⁿ x^(2n+1)/(2n+1)!! 各项同号，没有相消，双精度下可以算到约 16 位。x 很大时 1 − erf x 很小，要直接计算 erfc x = 1 − erf x，不能用 1 减去 erf（24.6 节）。", "The positive series erf x = (2/√π) e^(−x²) Σ 2ⁿ x^(2n+1)/(2n+1)!! has terms of one sign, no cancellation, about 16 digits in double precision. For large x, 1 − erf x is tiny and must be computed directly as erfc x, not as 1 minus erf (Section 24.6)."]
步骤:
  - ["在“两个级数”场景中取 x = 1、级数 1，逐渐增加 n，记录误差和“第一个略去的项”，找出误差小于 10⁻⁶ 的最少项数（任务 1），填入表 1。", "In 'Two series' take x = 1 and series 1; increase n, recording the error and the first omitted term; find the fewest terms giving an error below 10⁻⁶ (task 1). Table 1."]
  - ["取 x = 3、5，分别用级数 1 和级数 2，记录最大项、能达到的最小误差和所需项数（任务 2），填入表 2。", "Take x = 3 and 5 with series 1 and series 2; record the largest term, the smallest attainable error and the terms needed (task 2). Table 2."]
  - ["在“定位公差”场景中取 σ = 0.01 mm，公差 ±0.03 mm，读出概率和超差率（任务 3）；再找出超差率不超过 1 ppm 的最小公差（任务 4）。", "In 'Positioning tolerance' take σ = 0.01 mm and ±0.03 mm; read the probability and rate (task 3); then find the smallest tolerance with at most 1 ppm out (task 4)."]
