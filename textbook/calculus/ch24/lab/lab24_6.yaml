思考题:
  - ["交错级数在 x = 3 时最大项约 200，而和不到 1。双精度有约 16 位有效数字，计算结果大约能剩几位？由此估计 x = 5 时的误差。", "At x = 3 the alternating series' largest term is about 200 while the sum is below 1. With about 16 significant digits, how many survive? Estimate the error at x = 5."]
  - ["超差率从 2700 ppm 降到 1 ppm，公差只需从 3σ 放宽到约 4.9σ。这对设计公差和选择机器人有什么启示？", "Going from 2700 ppm to 1 ppm needs the tolerance widened only from 3σ to about 4.9σ. What does this mean for setting tolerances and choosing robots?"]
