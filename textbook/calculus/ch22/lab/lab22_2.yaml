思考题:
  - ["RK4 的误差比半隐式欧拉小几个数量级，为什么 MuJoCo 等物理引擎默认还是用半隐式欧拉？（提示：接触和碰撞使方程不光滑；能量的长期行为；每步的计算量。）", "RK4's error is orders of magnitude smaller than semi-implicit Euler's, so why do physics engines such as MuJoCo default to semi-implicit Euler? (Hints: contacts and impacts make the equations non-smooth; long-term energy behaviour; work per step.)"]
  - ["机器人的电机电流环时间常数不到 1 ms，机械运动以秒计。如果把电流方程也放进仿真，用显式方法的步长受什么限制？有哪些办法？", "A robot motor's current loop has a time constant under 1 ms, while the motion takes seconds. If the current equation is included in the simulation, what limits the step of an explicit method, and what can be done?"]
