  - ["参考解是细步长（不超过 0.1 ms）的 RK4，与所选方法在同样的时刻比较。程序 22.2.1 用同样的参数与 MuJoCo 物理引擎（RK4 积分器）比对过，两者相差约 10⁻¹¹ rad；程序 22.5.1 核对了 MuJoCo 的默认积分器与半隐式欧拉法逐步一致。", "The reference is RK4 with a fine step (at most 0.1 ms), compared at the same instants. Program 22.2.1 checked the same model against the MuJoCo physics engine (RK4 integrator), agreeing to about 10⁻¹¹ rad; Program 22.5.1 checked that MuJoCo's default integrator is step-for-step the semi-implicit Euler method."]
