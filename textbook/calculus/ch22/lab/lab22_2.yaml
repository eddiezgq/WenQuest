# 实验 22.2 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab22_2.js。
原理:
  - ["数值方法的整体误差与步长的 p 次方成正比，p 叫作方法的阶：欧拉法和半隐式欧拉法 p = 1，休恩法 p = 2，经典 RK4 p = 4（22.1、22.2 节）。步长减半，误差约缩小到 1/2ᵖ。", "A method's global error is proportional to the p-th power of the step; p is its order: Euler and semi-implicit Euler p = 1, Heun p = 2, classical RK4 p = 4 (Sections 22.1, 22.2). Halving the step divides the error by about 2ᵖ."]
  - 式: "RK4：k₁ = f(tₙ, yₙ)，k₂ = f(tₙ + h/2, yₙ + h k₁/2)，k₃ = f(tₙ + h/2, yₙ + h k₂/2)，k₄ = f(tₙ + h, yₙ + h k₃)，yₙ₊₁ = yₙ + h(k₁ + 2k₂ + 2k₃ + k₄)/6"
  - ["显式欧拉法每一步把相平面上的面积放大 1 + h²ω² 倍，摆的能量越来越大；半隐式（辛）欧拉法保持面积，能量误差有界但不消失（22.5 节）。", "Explicit Euler enlarges phase-plane area by 1 + h²ω² per step, so the pendulum's energy keeps growing; semi-implicit (symplectic) Euler preserves area, so the energy error stays bounded though nonzero (Section 22.5)."]
  - ["对 y′ = −λy（λ > 0），显式欧拉法稳定要求 hλ < 2，RK4 要求 hλ < 2.785，隐式欧拉法 yₙ₊₁ = yₙ/(1 + hλ) 对任何步长都稳定（22.4 节）。", "For y′ = −λy (λ > 0), explicit Euler is stable only for hλ < 2, RK4 for hλ < 2.785; implicit Euler yₙ₊₁ = yₙ/(1 + hλ) is stable for any step (Section 22.4)."]
步骤:
  - ["在“机械臂自由摆动”场景中取初始角度 0°、仿真 2 s。对四种方法分别取 h = 20、10、5 ms，记下全程最大角度误差和求值次数，填入表 1。", "In 'Arm swinging freely' take initial angle 0° and 2 s. For each of the four methods take h = 20, 10, 5 ms and record the maximum angle error and number of evaluations in Table 1."]
  - ["由表 1 计算每种方法步长减半时误差缩小的倍数，估计各方法的阶（任务 2）。", "From Table 1 compute how much each method's error shrinks when the step is halved, and estimate each method's order (task 2)."]
  - ["RK4：逐步加大步长，找出最大角度误差仍小于 10⁻⁴ rad 的最大步长（任务 1，可以取到 35 ms 以上）。用同样的求值次数，欧拉法能达到多大的误差？", "RK4: increase the step until the maximum angle error reaches 10⁻⁴ rad (task 1). With the same number of evaluations, what error does Euler reach?"]
  - ["取 h = 10 ms、仿真 60 s，比较欧拉法与半隐式欧拉法的能量误差曲线（任务 3），再看 RK4，填入表 2。", "With h = 10 ms and 60 s, compare the energy-error curves of Euler and semi-implicit Euler (task 3), then RK4; fill in Table 2."]
  - ["在“刚性方程”场景中取 λ = 1000，用显式欧拉法从 h = 1 ms 逐步加大步长，找出发散的界限；换成 RK4 重复（任务 5）；再用隐式欧拉法取 h = 20 ms（任务 4）。把 λ 改为 100、5000 重复，填入表 3。", "In 'Stiff equation' with λ = 1000, increase the explicit Euler step from 1 ms and find where it diverges; repeat with RK4 (task 5); then implicit Euler with h = 20 ms (task 4). Repeat for λ = 100 and 5000; Table 3."]
