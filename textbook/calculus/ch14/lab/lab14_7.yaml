# 实验 14.7 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab14_7.js。
原理:
  - ["单摆（或绕一端摆动的均匀细杆，等效摆长 2l/3）从振幅 θ₀ 处静止释放，周期 T = 4√(L/g)·K(k)，k = sin(θ₀/2)，K 是第一类完全椭圆积分 ∫₀^{π/2} dφ/√(1 − k² sin² φ)（14.7 节）。它不是初等函数，但可以用算术—几何平均等方法很快地算到任意精度。", "A pendulum (or a uniform rod pivoting at one end, equivalent length 2l/3) released from rest at amplitude θ₀ has period T = 4√(L/g)·K(k), k = sin(θ₀/2), where K is the complete elliptic integral of the first kind ∫₀^{π/2} dφ/√(1 − k² sin² φ) (Section 14.7). It is not elementary, but the arithmetic–geometric mean and other methods compute it quickly to any precision."]
  - 式: "T/T₀ = (2/π)K(sin(θ₀/2))，T₀ = 2π√(L/g)；小振幅时 T/T₀ ≈ 1 + θ₀²/16"
  - ["检验不定积分最可靠的方法是求导：F′ = f 处处成立，F 才是原函数（13.3 节）。求导容易，求积分难，所以积分的答案总要用导数来验收。", "The surest check of an antiderivative is to differentiate it: F is an antiderivative only if F′ = f everywhere (Section 13.3). Differentiation is easy and integration is hard, so integrals are always checked by derivatives."]
步骤:
  - ["在“连杆自由摆动”场景中，杆长取 0.4 m，振幅取 10°、30°、60°、90°、120°、150°，把真实周期和 T/T₀ 填入表 1（任务 1、2）。", "In 'Free-swinging link', with l = 0.4 m and amplitudes 10°, 30°, 60°, 90°, 120°, 150°, record the true period and T/T₀ in Table 1 (tasks 1 and 2)."]
  - ["振幅取 90°，杆长取 0.4 m 和 0.8 m，比较周期和 T/T₀，说明 T/T₀ 只与振幅有关（任务 2）。", "At 90°, compare l = 0.4 m and 0.8 m and show that T/T₀ depends only on the amplitude (task 2)."]
  - ["在“积分检验”场景中，对四个被积函数逐个试三个候选答案，把 max |F′ − f| 和结论填入表 2（任务 3、4）。", "In 'Checking integrals', try the three candidates for each of the four integrands and record max |F′ − f| and the verdict in Table 2 (tasks 3 and 4)."]
