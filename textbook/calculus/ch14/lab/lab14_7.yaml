注意:
  - ["摆动曲线用数值方法（四阶龙格–库塔法）解运动方程得到，周期用算术—几何平均算椭圆积分；两者应当吻合。虚线是小振幅近似 θ₀ cos ω₀t。", "The swing curve comes from solving the equation of motion numerically (fourth-order Runge–Kutta); the period comes from the elliptic integral via the arithmetic–geometric mean, and the two should agree. The dashed curve is the small-angle approximation θ₀ cos ω₀t."]
  - ["连杆当作均匀细杆、忽略关节摩擦，是理想化的模型；真实的断电摆动会因摩擦和刹车逐渐衰减。", "Treating the link as a uniform rod without joint friction is an idealization; a real unpowered swing decays because of friction and braking."]
思考题:
  - ["椭圆积分、误差函数、正弦积分都“积不出来”，计算器和数学库却能算到十几位有效数字。它们用的是什么方法？（第 15 章数值积分、第 24 章幂级数）", "Elliptic integrals, the error function and the sine integral have no elementary form, yet calculators give them to 15 digits. What methods do they use? (Chapter 15: numerical integration; Chapter 24: power series)"]
  - ["钟摆计时要求周期稳定。为什么摆钟的摆幅都很小？振幅从 2° 变到 3°，每天快慢多少秒？", "Pendulum clocks need a steady period. Why do they swing through small angles? If the amplitude drifts from 2° to 3°, how many seconds a day does the clock gain or lose?"]
