注意:
  - ["冲击力是理想化的半正弦脉冲加上指数建立的夹持力，准确冲量由公式给出；真实的力传感器信号还有噪声和采样延迟。", "The force is an idealized half-sine pulse plus an exponentially rising holding force, with the exact impulse known in closed form; real force signals also carry noise and sampling delay."]
  - ["误差小于 10⁻¹⁴ 时已接近双精度的舍入极限，“观测到的阶”不再有意义，显示为“—”。x³ 用辛普森是精确的，周期函数用梯形在整周期上收敛极快，都会出现这种情况。", "Errors below 10⁻¹⁴ approach double-precision round-off, and the observed order is meaningless (shown as '—'). This happens for Simpson on x³ (exact) and for the trapezoid rule on a periodic function over a full period."]
  - ["均匀梯形的误差并不随步长单调下降：脉冲两端的“拐角”落在网格的什么位置，会使误差忽大忽小（表 1 中 0.1 ms 比 0.25 ms 还差）。这是被积函数不光滑的典型表现。", "The uniform trapezoid error does not fall monotonically with the step: where the corners of the pulse fall relative to the grid makes the error jump around (0.1 ms does worse than 0.25 ms in Table 1). This is typical of a non-smooth integrand."]
思考题:
  - ["力传感器的采样频率一般是 1 kHz。若碰撞脉冲只有 0.5 ms，传感器的数据还能用来算冲量吗？硬件上和算法上各有什么办法？", "Force sensors typically sample at 1 kHz. If the impact lasts only 0.5 ms, can the data still give the impulse? What hardware and algorithmic remedies are there?"]
  - ["自适应方法会漏掉第一轮采样之间的窄尖峰。如果事先知道尖峰大约在哪里，怎样告诉积分程序？如果不知道，又怎样降低漏掉的风险？", "Adaptive methods can miss a narrow spike between the first samples. If you know roughly where it is, how do you tell the integrator? If not, how can you reduce the risk?"]
