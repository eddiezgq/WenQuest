注意:
  - ["关节模型：上臂绕肩轴 0.5129 kg·m²（零件库 UR5e 模型）加 maxon RE 40 转子经减速比 101 折算的 0.1398 kg·m²（假设的组合），粘性摩擦 0.5 N·m·s/rad 为假设值；转矩按驱动器限流 10 A 折算为 60.9 N·m 限幅，额定转矩约 18.9 N·m（不计减速器效率）。模型不含减速器的扭转柔度。", "Joint model: upper arm 0.5129 kg·m² about the shoulder (library UR5e model) plus a maxon RE 40 rotor through a 101:1 gearbox, 0.1398 kg·m² (an assumed pairing); viscous friction 0.5 N·m·s/rad is assumed; torque is limited to 60.9 N·m (10 A drive limit) and rated about 18.9 N·m (gearbox efficiency ignored). Gearbox compliance is not modelled."]
  - ["转矩被限幅时系统不再是线性的，ω_n、ζ 的公式只在不限幅时准确。", "When the torque saturates the system is no longer linear, and the ω_n, ζ formulas hold only without saturation."]
  - ["按 2% 标准，临界阻尼（约 0.58 s）的调节时间反而比 ζ = 0.7（约 0.60 s）略短：ζ = 0.7 的响应超调后要回落进 ±2% 带。“ζ = 0.7 最快”只在按 5% 标准或只看上升时才大致成立。", "By the 2% criterion, critical damping (about 0.58 s) actually settles slightly faster than ζ = 0.7 (about 0.60 s), because the ζ = 0.7 response overshoots and must come back into the ±2% band. 'ζ = 0.7 is fastest' holds roughly only for a 5% band or for rise time."]
思考题:
  - ["算例 20.3.2 中上臂在减速器上的固有频率约 197 rad/s。把 K_p 加大到使 ω_n 接近它的五分之一，实际的机械臂会出现什么这个模型看不到的问题？", "The upper arm's natural frequency on the gearbox is about 197 rad/s (Example 20.3.2). If K_p is raised until ω_n is about a fifth of that, what problem would a real arm show that this model cannot?"]
  - ["重力下只靠加大增益来减小稳态误差，转矩和带宽各付出什么代价？重力补偿和积分项各有什么优缺点？", "Reducing the steady error under gravity by raising the gains alone: what does it cost in torque and bandwidth? What are the pros and cons of gravity compensation versus an integral term?"]
