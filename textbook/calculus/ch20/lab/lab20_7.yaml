# 实验 20.7 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab20_7.js。
原理:
  - ["PD 控制律 τ = K_p(q_ref − q) − K_d q̇ 使关节满足 J q̈ + (b + K_d) q̇ + K_p q = K_p q_ref，即质量–弹簧–阻尼系统（20.7 节）。", "The PD law τ = K_p(q_ref − q) − K_d q̇ makes the joint obey J q̈ + (b + K_d) q̇ + K_p q = K_p q_ref, a mass–spring–damper (Section 20.7)."]
  - 式: "ω_n = √(K_p/J)，ζ = (b + K_d)/(2√(K_p J))；超调 M_p = e^(−πζ/√(1−ζ²))，2% 调节时间约 4/(ζω_n)"
  - ["受迫振动 ẍ + 2ζω_n ẋ + ω_n² x = (F₀/m) cos ωt 的稳态振幅是静态位移的 M(r) = 1/√((1 − r²)² + (2ζr)²) 倍，r = ω/ω_n；ζ < 1/√2 时在 r = √(1 − 2ζ²) 处最大，约为 1/(2ζ)（20.6 节）。", "The steady amplitude of ẍ + 2ζω_n ẋ + ω_n² x = (F₀/m) cos ωt is M(r) = 1/√((1 − r²)² + (2ζr)²) times the static deflection, r = ω/ω_n; for ζ < 1/√2 it peaks at r = √(1 − 2ζ²) at about 1/(2ζ) (Section 20.6)."]
步骤:
  - ["在“关节 PD 控制”场景中（空载、水平面、目标 0.5 rad），先任取几组 K_p、K_d，记录 ω_n、ζ、超调、调节时间、最大转矩，填入表 1；再按 ζ = 0.7、ω_n = 10 rad/s 算出增益并验证满足指标（任务 1）。", "In 'Joint PD control' (no payload, horizontal plane, 0.5 rad step), try several K_p, K_d and record ω_n, ζ, overshoot, settling time and peak torque in Table 1; then compute gains for ζ = 0.7, ω_n = 10 rad/s and check the specification (task 1)."]
  - ["保持 K_p = 65.3，算出临界阻尼的 K_d 并验证（任务 2）；比较 ζ = 0.5、0.7、1、1.5 的调节时间。", "Keep K_p = 65.3, compute and check the K_d for critical damping (task 2); compare settling times for ζ = 0.5, 0.7, 1 and 1.5."]
  - ["肘端负载取 2 kg，先用原来的增益，记录超调；再重新整定（任务 3），填入表 2。", "With 2 kg at the elbow, first keep the old gains and record the overshoot; then retune (task 3) and fill in Table 2."]
  - ["打开重力，记录不同 K_p 下的稳态误差；找出使误差小于 0.05 rad、阻尼比不低于 0.5 的增益（任务 4），注意最大转矩是否超过额定值和限幅。", "Turn gravity on and record the steady error for several K_p; find gains giving error < 0.05 rad with ζ ≥ 0.5 (task 4), watching whether the peak torque exceeds the rating and the limit."]
  - ["在“受迫振动”场景中取 ζ = 0.1，频率比从 0.5 到 1.5 逐步改变，记录放大系数，找出峰值（任务 5），填入表 3；再取 ζ = 0.02、0.5 重复。", "In 'Forced vibration' with ζ = 0.1, vary r from 0.5 to 1.5, record the magnification and find the peak (task 5) in Table 3; repeat for ζ = 0.02 and 0.5."]
