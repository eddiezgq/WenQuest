思考题:
  - ["噪声是随机的，有正有负。为什么累加很多个读数后，噪声造成的距离误差不太大？它大约随读数个数怎样增长？（第 48 章）", "Noise is random, positive and negative. Why does the distance error from noise stay fairly small after many readings? How does it grow with the number of readings? (Chapter 48)"]
  - ["如果编码器有一个固定的偏差（例如读数总是多 0.01 m/s），距离误差会怎样随时间增长？这和随机噪声有什么不同？", "If the encoder has a constant bias (say readings always 0.01 m/s too high), how does the distance error grow with time? How does this differ from random noise?"]
