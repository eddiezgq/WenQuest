     "aₙ converges to L: for every ε > 0 there is an N with |aₙ − L| < ε whenever n > N (Definition 3.3.1). Geometrically: however narrow the band around L, every point after the N-th lies inside it. A smaller ε usually needs a larger N, and N need not be the smallest."]
