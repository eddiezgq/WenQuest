思考题:
  - ["若不知道利普希茨常数 K，只知道 g 连续，还能用有限次计算证明 g > 0 吗？为什么？", "Without the Lipschitz constant K, knowing only that g is continuous, can finitely many evaluations prove g > 0? Why?"]
