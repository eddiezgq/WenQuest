# 实验 6.6 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab6_6.js。
原理:
  - ["安全裕量 g(t) = d(t) − s，d(t) 是末端到障碍的距离，s = 50 mm。末端速度不超过 K，所以 |g(t) − g(t′)| ≤ K|t − t′|（利普希茨条件，5.6.4 节）。",
     "Safety margin g(t) = d(t) − s, where d(t) is the end-effector's distance to the obstacle and s = 50 mm. The end-effector speed is at most K, so |g(t) − g(t′)| ≤ K|t − t′| (Lipschitz condition, Section 5.6.4)."]
  - 式: "相邻采样点 a < b 之间：g(t) ≥ max{g(a) − K(t − a), g(b) − K(b − t)} ≥ (g(a) + g(b))/2 − K(b − a)/2；等距采样时 min g ≥ min g(tᵢ) − Kh/2"
  - ["下界为正，就证明了整个过程安全；有采样点裕量 ≤ 0，就发现了碰撞；两者都不是，需要加密。自适应二分检查只在下界不够的地方加密（6.6.4 节）。",
     "A positive bound proves the whole motion safe; a sample with margin ≤ 0 reveals a collision; otherwise refine. Adaptive bisection refines only where the bound is not enough (Section 6.6.4)."]
步骤:
  - ["在“等距采样”场景中选障碍 1，把区间数 N 从 4 逐步增大（步长 h = 1/N s），记录采样点的最小裕量、保证的下界和结论，填入表 1；找出能证明安全的最小 N（任务 3）。",
     "In 'Uniform sampling' choose obstacle 1, raise the number of intervals N from 4 (step h = 1/N s), record the smallest sample margin, the guaranteed bound and the verdict in Table 1, and find the smallest N that proves safety (task 3)."]
  - ["选障碍 2，N = 10（步长 0.1 s），观察“采样点都安全却无法证明”（任务 1）；再增大 N，直到发现碰撞（任务 2），同样填表。",
     "Choose obstacle 2 with N = 10 (step 0.1 s) and see 'all samples safe but no proof' (task 1); then increase N until a collision is found (task 2), and fill in the table."]
  - ["在“自适应二分检查”场景中，分别对障碍 1、障碍 2 一步步检查，再检查到底，记录计算 g 的次数与结论，填入表 2（任务 4）。",
     "In 'Adaptive bisection check', check obstacles 1 and 2 step by step and then to the end; record the number of evaluations and the verdict in Table 2 (task 4)."]
