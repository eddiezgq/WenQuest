注意:
  - ["实验中“保证的下界”用相邻两个采样点的值一起估计，比 (6.6.1) 的 min g(tᵢ) − Kh/2 略好，但同样是严格的下界。", "The lab's 'guaranteed bound' uses both neighbouring samples, slightly better than (6.6.1)'s min g(tᵢ) − Kh/2, and equally rigorous."]
