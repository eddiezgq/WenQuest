注意:
  - ["壳体质量只算侧面和顶（底板另装），并把薄壳近似为“表面积 × 壁厚”；壁厚与半径相比很小时这个近似很好。用漆量按干膜 30 μm、固体含量 50% 估算。", "The shell mass counts only the side and top (the base plate is separate) and treats the thin shell as area × thickness, which is accurate when the wall is thin compared with the radius. Paint assumes a 30 μm dry film and 50% solids."]
  - ["网格偏差只考虑了圆周方向的分段；真实的网格在顶部还沿经线方向分段，偏差会稍大一些。", "The mesh deviation considers only the segments around the circle; real meshes also split the top along meridians, which adds a little more."]
思考题:
  - ["这个外壳的网格模型体积为什么偏小？如果网格的顶点不在曲面上、而是让每个小平面与曲面相切（外切），结果会怎样？3D 打印时，这种偏差会造成什么后果？", "Why is the housing's mesh volume too small? What if each facet were tangent to the surface (circumscribed) instead of having its vertices on it? What would the deviation mean for 3D printing?"]
  - ["表 2 中表面积最小时 H 与 R 有什么关系？用 V = πR²H + (2/3)πR³ 消去 H，对 R 求导，证明你的观察。", "In Table 2, how are H and R related at the minimum area? Eliminate H using V = πR²H + (2/3)πR³, differentiate with respect to R and prove your observation."]
