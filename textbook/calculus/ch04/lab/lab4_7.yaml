思考题:
  - ["表 4.7.1 中原式的相对误差大约按 ε_mach/x² 增长，为什么？若函数是 (x − sin x)/x³，误差会按 x 的几次方增长？", "In Table 4.7.1 the original's relative error grows roughly like ε_mach/x². Why? For (x − sin x)/x³, with what power of x would it grow?"]
