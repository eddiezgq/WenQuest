# 实验 17.4 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab17_4.js。
原理:
  - ["质量 M = ∫dm，质心 x̄ = (1/M)∫x dm，绕某轴的转动惯量 I = ∫r² dm（17.3、17.4 节）。均匀实心圆柱（质量 M、半径 r、长 L）绕过质心且垂直于轴线的轴：I = M(3r² + L²)/12；细杆极限 r → 0 时为 ML²/12。", "Mass M = ∫dm, centre of mass x̄ = (1/M)∫x dm, inertia about an axis I = ∫r² dm (Sections 17.3, 17.4). A uniform solid cylinder (mass M, radius r, length L) about a transverse axis through its centre: I = M(3r² + L²)/12, tending to ML²/12 for a thin rod."]
  - 式: "平行轴定理 I_轴 = I_质心 + M d²"
  - ["铝管（外半径 r_o、内半径 r_i、长 L、线密度 λ = ρπ(r_o² − r_i²)）绕一端的横轴：I = λL³/3 + λL(r_o² + r_i²)/4。两端关节模块近似为半径 0.06 m 的实心圆柱，轴线与关节轴平行，自身转动惯量 ½ m r²，肘端模块还要加 m L²。", "An aluminium tube (outer radius r_o, inner r_i, length L, linear density λ = ρπ(r_o² − r_i²)) about a transverse axis at one end: I = λL³/3 + λL(r_o² + r_i²)/4. The joint modules are modelled as solid cylinders of radius 0.06 m with axes parallel to the joint axis, each contributing ½ m r², plus m L² for the elbow module."]
步骤:
  - ["在“UR5e 上臂”场景中选模型 1，半径取 30、40、50、60、70 mm，记录绕质心的转动惯量，找出与零件库 0.133886 kg·m² 一致的半径，填入表 1（任务 1）。", "In 'UR5e upper arm', choose model 1 and radii 30, 40, 50, 60, 70 mm; record the inertia about the centre of mass and find the radius matching the library's 0.133886 kg·m² (Table 1, task 1)."]
  - ["选模型 2，调整铝管尺寸和两个关节模块的质量，使总质量与 8.393 kg 相差不到 1%、质心在 0.2125 m ± 2 mm；再试着把总质量调到手册的 8.058 kg。把三组结果填入表 2（任务 2、3）。", "Choose model 2 and adjust the tube and module masses so the mass is within 1% of 8.393 kg and the centre of mass at 0.2125 m ± 2 mm; then try the manual's 8.058 kg. Record three settings in Table 2 (tasks 2 and 3)."]
  - ["在“变密度杆”场景中，k 取 −0.75、−0.5、0、1、2，记录质心和绕根部的转动惯量，填入表 3（任务 4）。", "In 'Rod of varying density', for k = −0.75, −0.5, 0, 1, 2 record the centre of mass and inertia about the root in Table 3 (task 4)."]
