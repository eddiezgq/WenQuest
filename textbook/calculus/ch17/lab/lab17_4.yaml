注意:
  - ["零件库的 UR5e 模型来自 MuJoCo Menagerie（源自 ROS 的 ur_description），质心和转动惯量取自它的仿真模型文件，它把每节连杆当作均匀实心圆柱来估算转动惯量；厂家（Universal Robots）公布的上臂质量是 8.058 kg、质心 (0.2125, 0, 0.11336) m，转动惯量给为 0。两套数据都是近似，精确的动力学参数要靠实验辨识。", "The library's UR5e model comes from MuJoCo Menagerie (derived from ROS ur_description), which estimates each link's inertia as a uniform solid cylinder; Universal Robots publishes the upper-arm mass as 8.058 kg, the centre of mass at (0.2125, 0, 0.11336) m, and the inertia as zero. Both are approximations; accurate dynamic parameters require experimental identification."]
  - ["模型 2 把关节模块的质量全部放在两端，偏向另一个极端；真实上臂的转动惯量多半介于两个模型之间，要靠辨识确定。", "Model 2 puts all the module mass at the ends, leaning to the other extreme; the real upper arm probably lies between the two and must be identified experimentally."]
思考题:
  - ["电机转子的转动惯量很小（约 10⁻⁴ kg·m²），但经过减速比 N = 101 的减速器折算到关节，要乘以 N²。与上臂绕肩关节轴的转动惯量相比，哪个大？这对控制器的设计意味着什么？", "A motor rotor's inertia is tiny (about 10⁻⁴ kg·m²), but through a gearbox of ratio N = 101 it appears at the joint multiplied by N². Which is larger, this or the upper arm's inertia about the shoulder? What does that mean for the controller?"]
  - ["厂家把转动惯量写成 0，零件库用均匀圆柱估算，两者对“肩关节加速时需要多大力矩”的预测差多少？哪些场合这个差别要紧，哪些场合不要紧？", "The vendor lists the inertia as zero and the library estimates it with a uniform cylinder. How differently do they predict the torque needed to accelerate the shoulder? When does the difference matter?"]
