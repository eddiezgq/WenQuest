思考题:
  - ["梯形曲线时间最短，为什么工业机器人和电梯仍普遍用 S 形曲线？加加速度为无穷大在物理上意味着什么？", "The trapezoid is fastest; why do industrial robots and lifts still use S-curves? What does infinite jerk mean physically?"]
  - ["多个关节同时运动时，怎样让它们同时到达？最慢的关节决定了什么？", "When several joints move together, how do you make them arrive together? What does the slowest joint decide?"]
