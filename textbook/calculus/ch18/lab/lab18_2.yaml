注意:
  - ["托马伊函数每段的上确界是该段中有理数最小分母的倒数，程序逐个检查分母求得；狄利克雷函数的图像只画出了有限个点，实际上有理点和无理点都处处稠密。", "For Thomae's function the supremum on each piece is 1 over the smallest denominator of a rational in it, found by checking denominators one by one; the Dirichlet function is drawn with finitely many points, though rationals and irrationals are both dense everywhere."]
  - ["sin(1/x) 在 x = 0 附近振荡无穷多次，第一段的振幅总是 2，所以 U − L 至少是 2/n，下降得比 x² 慢，但仍趋于零：它只有一个间断点。", "sin(1/x) oscillates infinitely often near 0; the first piece always has oscillation 2, so U − L ≥ 2/n and falls more slowly than for x², yet still tends to zero: there is only one discontinuity."]
思考题:
  - ["“速度单调减小”这个前提在安全评估中能不能保证？如果只知道加速度的绝对值不超过 a_max，怎样由采样值给出有保证的上下界？", "Can 'the speed decreases' be guaranteed in a safety case? If you only know |acceleration| ≤ a_max, how can sampled values still give guaranteed bounds?"]
