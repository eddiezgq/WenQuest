# 实验 18.2 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab18_2.js。
原理:
  - ["把 [a, b] 分成小区间，在每段上取 f 的上确界 Mᵢ 与下确界 mᵢ，得达布上和 U = ΣMᵢΔxᵢ 与下和 L = ΣmᵢΔxᵢ（18.1 节）。任何黎曼和都在 L 与 U 之间；f 可积当且仅当 U − L = ΣωᵢΔxᵢ 能任意小（18.2 节，ωᵢ = Mᵢ − mᵢ 是振幅）。", "Divide [a, b] into pieces and take the supremum Mᵢ and infimum mᵢ of f on each to get the upper Darboux sum U = ΣMᵢΔxᵢ and lower sum L = ΣmᵢΔxᵢ (Section 18.1). Every Riemann sum lies between L and U; f is integrable exactly when U − L = ΣωᵢΔxᵢ can be made arbitrarily small (Section 18.2, ωᵢ = Mᵢ − mᵢ is the oscillation)."]
  - 式: "单调函数 n 等分：U − L = |f(b) − f(a)|·(b − a)/n"
  - ["速度单调减小时，每段的最大值、最小值就是段首、段尾的读数，左端点矩形和与右端点矩形和是制动距离有保证的上界和下界。速度不单调时，采样点之间的最大值看不见，这个保证就失效了。", "When the speed decreases, the maximum and minimum on each interval are the readings at its ends, so the left- and right-endpoint sums are guaranteed upper and lower bounds on the braking distance. If the speed is not monotone, the maximum between samples is invisible and the guarantee fails."]
步骤:
  - ["在“AGV 制动距离”场景中选平稳制动，采样间隔取 200、100、50、20、10、6 ms，把下界、上界、上界 − 下界填入表 1（任务 1）。", "In 'AGV braking distance' choose smooth braking and intervals of 200, 100, 50, 20, 10, 6 ms; record the lower bound, upper bound and their gap in Table 1 (task 1)."]
  - ["改为有周期性波动（周期 50 ms）的曲线，重复上一步，记录真值是否在界内，填入表 1 的后两列（任务 2）。注意：采样间隔是 50 ms 的整数倍时，采样点恰好都落在波动的谷底，界会失效；其他间隔下真值可能碰巧在界内，但那不是保证。", "Switch to the rippled profile (period 50 ms), repeat, and record whether the true value lies inside (last two columns of Table 1, task 2). When the interval is a multiple of 50 ms every sample falls in a trough and the bounds fail; at other intervals the true value may happen to lie inside, but that is not a guarantee."]
  - ["在“函数的达布和”场景中，对五个函数分别取 n = 10、50、100、400，记录 U − L，填入表 2（任务 3、4）。", "In 'Darboux sums of functions', for each of the five functions with n = 10, 50, 100, 400, record U − L in Table 2 (tasks 3 and 4)."]
