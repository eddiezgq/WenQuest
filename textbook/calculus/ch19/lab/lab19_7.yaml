注意:
  - ["数据由含绕组电感（0.33 mH）和摩擦（由空载电流 68.6 mA 折算）的模型生成，所以与一阶模型不完全一致：启动后零点几毫秒内电流还没有建立，转速上升比一阶模型稍慢，最小二乘得到的 τ 略大于理论值。电机参数取自 maxon RE 40（型号 148877）样本。", "The data come from a model with winding inductance (0.33 mH) and friction (from the 68.6 mA no-load current), so they do not exactly follow the first-order model: in the first fraction of a millisecond the current is still building up and the speed rises a little more slowly, so the least-squares τ is slightly above the theory. Motor data are from the maxon RE 40 (part 148877) catalogue."]
  - ["负载惯量假设直接装在电机轴上；经减速比 N 的减速器连接时，折算到电机轴要除以 N²（17.4、19.4 节）。", "The load inertia is assumed to sit directly on the motor shaft; through a gearbox of ratio N it must be divided by N² (Sections 17.4 and 19.4)."]
思考题:
  - ["把噪声加大到 20 rad/s。63.2% 法、最小二乘法给出的时间常数还可靠吗？如果只用切线法（t = 0 处的斜率）会怎样？", "Raise the noise to 20 rad/s. Are the 63.2% and least-squares estimates still reliable? What would the tangent method (the slope at t = 0) give?"]
  - ["电压降低时稳态转速按比例下降，时间常数却不变。从方程 (19.1.1) 解释为什么。", "Lowering the voltage scales the steady speed down but leaves the time constant unchanged. Explain why from equation (19.1.1)."]
