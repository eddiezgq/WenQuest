# 实验 19.7 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab19_7.js。
原理:
  - ["不计绕组电感和摩擦时，直流电机的转速满足一阶方程 ω′ = (ω∞ − ω)/τ，ω∞ = V/k，τ = RJ/k²（19.1 节）。阶跃电压下 ω = ω∞(1 − e^(−t/τ))，t = τ 时达到稳态值的 63.2%。负载惯量 J_L 直接装在轴上时，J 换成 J + J_L。", "Neglecting winding inductance and friction, a DC motor's speed obeys ω′ = (ω∞ − ω)/τ with ω∞ = V/k and τ = RJ/k² (Section 19.1). After a voltage step ω = ω∞(1 − e^(−t/τ)), reaching 63.2% of the steady value at t = τ. A load inertia J_L on the shaft replaces J by J + J_L."]
  - ["读时间常数的方法（19.7 节）：63.2% 法；切线法；半对数法（ln(ω∞ − ω) 对 t 是直线，斜率 −1/τ）；最小二乘法（选 τ 使模型与全部数据之差的平方和最小）。", "Ways to read the time constant (Section 19.7): the 63.2% point; the tangent at t = 0; the semi-log plot (ln(ω∞ − ω) against t is a line of slope −1/τ); least squares (choose τ to minimize the sum of squared differences from all the data)."]
  - 式: "RC 低通：τ y′ + y = u，正弦输入的稳态幅值比 1/√(1 + (ωτ)²)，相位滞后 arctan(ωτ)，截止频率 f_c = 1/(2πτ)"
步骤:
  - ["在“电机阶跃响应”场景中取 J_L = 0、48 V、噪声 5 rad/s，调节模型的 τ 使曲线穿过数据点；读出 63.2% 法和最小二乘法的结果，与理论值和样本的 4.28 ms 比较（任务 1），填入表 1。", "In 'Motor step response' with J_L = 0, 48 V and noise 5 rad/s, adjust τ until the model runs through the data; read the 63.2% and least-squares results and compare with theory and the catalogue's 4.28 ms (task 1). Fill in Table 1."]
  - ["负载惯量取 137、411、1000 g·cm²，重复上一步（任务 2）。", "Repeat with load inertias of 137, 411 and 1000 g·cm² (task 2)."]
  - ["空载，电压取 12、24、36 V，重复（任务 3）。时间常数和稳态转速各怎样变化？", "No load, voltages of 12, 24 and 36 V (task 3). How do the time constant and the steady speed change?"]
  - ["噪声取 0、10、20 rad/s，比较 63.2% 法与最小二乘法的结果，填入表 2。", "With noise 0, 10 and 20 rad/s compare the 63.2% and least-squares estimates in Table 2."]
  - ["在“RC 低通滤波器”场景中取 R = 10 kΩ，频率取 1、5、15.9、50、200 Hz，记录幅值比和相位滞后，找出幅值比为 0.707 的频率（任务 4），填入表 3。", "In 'RC low-pass filter' with R = 10 kΩ, try 1, 5, 15.9, 50 and 200 Hz, record the amplitude ratio and phase lag and find where the ratio is 0.707 (task 4). Fill in Table 3."]
