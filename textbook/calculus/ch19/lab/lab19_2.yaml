注意:
  - ["积分曲线用细步长的四阶龙格–库塔法（第 22 章）画出，可以当作“准确解”；欧拉折线是为了比较而叠加的。", "Solution curves are drawn with a fine-step fourth-order Runge–Kutta method (Chapter 22) and can be treated as exact; the Euler polygons are overlaid for comparison."]
