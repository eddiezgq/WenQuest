思考题:
  - ["电机场景中把欧拉步长取到 7.4 ms 以上（平衡点附近有效时间常数的两倍），折线会怎样？把风扇系数调为 0，界限变成多少？这对电机控制器里的“模型仿真”有什么启示？", "In the motor scene, take an Euler step above 7.4 ms (twice the effective time constant near equilibrium). What happens? With the fan coefficient at 0, where is the limit? What does that mean for model-based simulation inside a motor controller?"]
  - ["方程 4 的积分曲线到达 y = 0 后与之重合。向左看（时间倒流），从 y = 0 出发有多少条积分曲线？这与定理 19.2.1 矛盾吗？", "Solutions of equation 4 merge with y = 0. Looking left (backwards in time), how many solution curves leave y = 0? Does this contradict Theorem 19.2.1?"]
