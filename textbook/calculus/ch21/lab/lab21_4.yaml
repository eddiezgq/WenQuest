# 实验 21.4 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab21_4.js。
原理:
  - ["自治系统 ẋ = f(x) 在相平面上的轨线互不相交（定理 21.2.1）。平衡点处的线性化 ξ̇ = Df(x*) ξ：特征值实部全负则渐近稳定，有正的则不稳定，实部为零时线性化不能判断（定理 21.4.1）。", "Trajectories of an autonomous system never cross in the phase plane (Theorem 21.2.1). At an equilibrium the linearization ξ̇ = Df(x*) ξ decides: all eigenvalues with negative real parts means asymptotic stability, one positive means instability, zero real parts leave it undecided (Theorem 21.4.1)."]
  - 式: "倒立摆 + PD：I θ̈ = m g h sin θ − K_p θ − K_d θ̇，线性化稳定 ⇔ K_p > m g h，K_d > 0"
  - ["转矩有上限 τ_max 时，从静止释放、倾角达到 arcsin(τ_max/(m g h)) 就必倒；带着角速度时，吸引域的边界还与角速度有关。吸引域是有限的，线性化看不出来（21.4.5 节）。单摆的分界线 E = g/l 分开摆动与转动；范德波尔振子有稳定的极限环（21.5 节）。", "With a torque limit τ_max the robot must fall beyond arcsin(τ_max/(m g h)): the basin of attraction is finite, which linearization cannot show (Section 21.4.5). The pendulum's separatrix E = g/l separates swinging from rotating; the van der Pol oscillator has a stable limit cycle (Section 21.5)."]
