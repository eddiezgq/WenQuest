注意:
  - ["机器人被简化为绕车轮轴转动的倒立摆，转矩直接加在支点上；真实的自平衡车靠车轮加减速产生这个转矩，车本身还会移动。质量、质心高度和 15 N·m 的转矩上限都是为说明问题选的数。", "The robot is simplified to an inverted pendulum about the wheel axle with torque applied directly at the pivot; a real balancing vehicle produces this torque by accelerating its wheels and moves itself. The mass, centre-of-mass height and 15 N·m limit are illustrative."]
  - ["“扶住了”指 5 s 内没倒、并且倾角至少减到初值的一半；K_p 只比 m g h 大一点时，机器人没倒但恢复得很慢。", "'Held up' means it did not fall within 5 s and the tilt at least halved; when K_p is barely above m g h it stays up but recovers very slowly."]
思考题:
  - ["线性化说只要 K_p > m g h、K_d > 0 就稳定。为什么实际的自平衡机器人还要限制倾角、限制速度？吸引域和哪些参数有关？", "Linearization says K_p > m g h and K_d > 0 are enough. Why do real balancing robots still limit tilt and speed? Which parameters set the basin of attraction?"]
  - ["捕食者–猎物方程的闭轨与范德波尔振子的极限环有什么本质的不同？受到一次扰动后，两者分别会怎样？", "What is the essential difference between the predator–prey closed orbits and the van der Pol limit cycle? How does each respond to a single disturbance?"]
