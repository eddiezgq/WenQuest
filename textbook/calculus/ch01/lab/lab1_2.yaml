  - ["“汽车行程”场景中采样周期按 0.1–10 s 解读，速度以 km/h、里程以 km 显示。", "In 'A car trip' the period reads as 0.1–10 s; speed is in km/h and distance in km."]
思考题:
  - ["Ts 很大（如 200 ms）时误差也会变大，但原因与 Ts 很小时不同。两种误差各来自哪里？", "With a long period (200 ms) the error also grows, but for a different reason than with a short one. Where does each error come from?"]
