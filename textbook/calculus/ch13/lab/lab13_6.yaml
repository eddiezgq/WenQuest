# 实验 13.6 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab13_6.js。
原理:
  - ["航向角是角速度的积分：θ(t) = θ(0) + ∫₀ᵗ ω dτ（13.6 节）。陀螺仪读数 ω̃ = ω + b + n，其中 b 是零偏（常值），n 是随机噪声。积分后，零偏贡献 bt，随时间线性增长；噪声的贡献正负相抵，标准差约为 σ√(Tₛt)，按 √t 增长。", "Heading is the integral of angular rate: θ(t) = θ(0) + ∫₀ᵗ ω dτ (Section 13.6). Gyro readings are ω̃ = ω + b + n, with a constant bias b and random noise n. After integration the bias contributes bt, growing linearly; the noise partly cancels, with standard deviation about σ√(Tₛt), growing like √t."]
  - 式: "航向误差 ≈ b·t + 随机游走（标准差 σ√(Tₛt)）；标定后零偏的残差约为 σ/√N（N 为标定时的读数个数）"
  - ["变上限积分 Φ(x) = ∫₀ˣ f(t) dt 在 f 连续的点可导，且 Φ′(x) = f(x)（13.1 节）。f 有跳跃的点，Φ 连续但有折角。", "Φ(x) = ∫₀ˣ f(t) dt is differentiable wherever f is continuous, with Φ′(x) = f(x) (Section 13.1). Where f jumps, Φ is continuous but has a corner."]
步骤:
  - ["在“AGV 陀螺仪”场景中，噪声取 0，不标定，零偏取 0.02、0.05、0.1°/s，运行 60 s 和 300 s，把航向误差填入表 1（任务 1）。", "In 'AGV gyro', with no noise and no calibration, set the bias to 0.02, 0.05, 0.1°/s, run 60 s and 300 s, and record the heading errors in Table 1 (task 1)."]
  - ["零偏 0.05°/s，噪声 0.1°/s，运行 60 s，标定时间取 0、1、2、5、10 s，记录标定得到的零偏和标定后的误差，填入表 2（任务 2）。", "Bias 0.05°/s, noise 0.1°/s, 60 s; set the calibration time to 0, 1, 2, 5, 10 s and record the estimated bias and the calibrated error in Table 2 (task 2)."]
  - ["零偏取 0，噪声 0.2°/s，运行时间取 150、300、600 s，记录误差并与 σ√(Tₛt) 比较（任务 3）。", "Zero bias, noise 0.2°/s, run 150, 300, 600 s; record the errors and compare with σ√(Tₛt) (task 3)."]
  - ["在“变上限积分”场景中，对四个函数各取三个 x，比较 Φ 的数值斜率与 f(x)；选阶跃函数，取 x = 0.95、1.05，观察折角。再选 sin t，移动 x 找出 Φ 最大的位置，记录该处的 f(x)（任务 4）。", "In the second scene, for each function take three values of x and compare the numerical slope of Φ with f(x); for the step, try x = 0.95 and 1.05 and look at the corner. Then choose sin t, find where Φ is largest and record f(x) there (task 4)."]
