注意:
  - ["噪声由固定的随机数种子产生，所有参数下噪声序列相同，只按 σ 缩放；改变运行时间等于截取同一条路径的不同长度。一次仿真只反映误差的量级，不同的噪声序列结果会有差别。", "Noise comes from a fixed random seed: the sequence is the same for all settings, only scaled by σ; changing the run time cuts the same path at a different length. One run shows only the order of magnitude; other noise sequences give different numbers."]
  - ["标定期间小车静止，真实角速度为零，读数的平均值就是零偏的估计。标定时间越长，估计越准，但开机等待也越久。", "During calibration the vehicle is still, so the mean reading estimates the bias. Longer calibration is more accurate but delays start-up."]
思考题:
  - ["加速度计的零偏 b 使位置误差按 bt²/2 增长。为什么只靠惯性测量的导航系统必须定期用外部参照（GPS、二维码、激光雷达地图）校正？", "An accelerometer bias b makes the position error grow like bt²/2. Why must purely inertial navigation be corrected regularly by external references (GPS, markers, lidar maps)?"]
  - ["零偏会随温度慢慢变化。若 AGV 连续工作 8 小时，只在开机时标定一次够不够？你会怎样设计在线标定？", "Bias drifts slowly with temperature. If an AGV runs for 8 hours, is calibrating once at start-up enough? How would you design online calibration?"]
