注意:
  - ["“机器人”场景只在 [0, 峰值时刻] 上二分：q(t) 在那里单调递增、两端异号，恰好穿过 95% 一次。ζ 较小（约小于 0.43）时，峰值之后响应还会回落到 95% 以下再穿过，区间取得过大，二分法可能找到别的穿越点。", "The robot scene bisects only on [0, peak time], where q(t) increases and crosses 95% exactly once. For small ζ (below about 0.43) the response falls back below 95% after the peak and crosses again, so a larger interval could lead bisection to another crossing."]
  - ["容差取得很小时，区间的两端可能变成相邻的浮点数，再也分不开，读数会给出提示（5.5.3 节）。", "With a very small tolerance the ends may become adjacent floating-point numbers that cannot be split further; the readout says so (Section 5.5.3)."]
思考题:
  - ["二分法每一步只用到函数值的符号。这是它的长处还是短处？若知道函数值的大小（比如 f(a) = −0.01，f(b) = 5），能不能更聪明地选分点？", "Bisection only uses the signs of function values. Is that a strength or a weakness? If you know the sizes (say f(a) = −0.01, f(b) = 5), could you choose a smarter point?"]
  - ["tan x 在 [1, 2] 两端异号，二分法收敛到了 π/2。程序怎样才能发现“这不是根”？", "tan x changes sign on [1, 2], and bisection converges to π/2. How can a program detect that this is not a root?"]
