# 实验 5.5 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab5_5.js。
原理:
  - ["零点定理：f 在 [a, b] 上连续，f(a) 与 f(b) 异号，则 (a, b) 内至少有一个根（5.4.3 节）。二分法每一步取中点 m，保留两端仍异号的那一半，根所在的区间每步缩短一半。",
     "Zero theorem: if f is continuous on [a, b] and f(a), f(b) differ in sign, there is a root in (a, b) (Section 5.4.3). Bisection takes the midpoint m and keeps the half whose ends still differ in sign; the interval containing a root halves at every step."]
  - 式: "k 步后区间宽度 = (b − a)/2ᵏ；达到容差 tol 所需步数 k = ⌈log₂((b − a)/tol)⌉"
  - ["二分法只要求连续和变号。没有变号（如偶数重根）时无从下手；有间断时，变号不一定意味着有根，二分法可能收敛到间断点（5.5.4 节）。",
     "Bisection needs only continuity and a sign change. Without a sign change (e.g. a double root) it cannot start; across a discontinuity a sign change need not mean a root, and bisection may converge to the discontinuity (Section 5.5.4)."]
步骤:
  - ["在“函数的根”场景中选 x² − 2，容差 10⁻³，连续按“二分一步”，把前 6 步的区间填入表 1；再按“算到容差”，记录总步数。",
     "In 'Roots of functions' choose x² − 2 with tolerance 10⁻³, press 'One step' repeatedly and record the first 6 intervals in Table 1; then press 'Run to tolerance' and record the total number of steps."]
  - ["把容差依次取 10⁻³、10⁻⁶、10⁻⁹、10⁻¹²，按“算到容差”，记录步数，填入表 2，与公式比较（任务 1 用 10⁻⁶）。",
     "Set the tolerance to 10⁻³, 10⁻⁶, 10⁻⁹, 10⁻¹² in turn, run, record the step counts in Table 2 and compare with the formula (task 1 uses 10⁻⁶)."]
  - ["选 (x − 1)²，按“二分一步”（任务 2）；选 x³ − x，算到容差，看找到的是哪一个根；选 tan x，容差 10⁻⁹，算到容差，读出 f(m)（任务 3）。",
     "Choose (x − 1)² and press 'One step' (task 2); choose x³ − x and run: which root is found? Choose tan x with tolerance 10⁻⁹, run and read f(m) (task 3)."]
  - ["在“关节到达 95% 的时间”场景中取 ζ = 0.6、容差 10⁻⁴，求到达 95% 的时刻（任务 4）；再取 ζ = 0.4、0.8，填入表 3。",
     "In 'Joint time to 95%' take ζ = 0.6 and tolerance 10⁻⁴ and find the time to 95% (task 4); repeat for ζ = 0.4 and 0.8 and fill in Table 3."]
