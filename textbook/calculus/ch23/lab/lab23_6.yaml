思考题:
  - ["几何级数的余项可以准确算出，所以弹跳的总时间可以“预先知道”。物理引擎遇到很小的弹跳速度时直接让它停下，为什么？", "A geometric remainder is known exactly, so the total bounce time is known in advance. Why do physics engines simply stop a bounce when the rebound speed is very small?"]
  - ["艾特肯加速对莱布尼茨级数这样有效，对调和级数的部分和也能“加速出”一个有限的和吗？这说明加速方法有什么风险？", "Aitken works wonders on the Leibniz series; could it also 'accelerate' the harmonic partial sums to a finite value? What risk of acceleration does this reveal?"]
