# 实验 23.6 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab23_6.js。
原理:
  - ["级数 Σaₖ 的和是部分和 Sₙ 的极限；余项 Rₙ = S − Sₙ。几何级数 Σrᵏ（|r| < 1）的和为 1/(1 − r)，余项 Rₙ = rⁿ/(1 − r)（Sₙ 为前 n 项之和）可以准确算出（23.1 节）。", "The sum of Σaₖ is the limit of the partial sums Sₙ; the remainder is Rₙ = S − Sₙ. A geometric series Σrᵏ (|r| < 1) sums to 1/(1 − r) and its remainder Rₙ = rⁿ/(1 − r) (Sₙ the sum of the first n terms) is known exactly (Section 23.1)."]
  - 式: "零件弹跳：总时间 T = t₀(1 + e)/(1 − e)，t₀ = √(2h/g)；前 n 次弹跳后余下 2t₀eⁿ⁺¹/(1 − e)"
  - ["交错级数的误差不超过第一个略去的项（23.4 节）；莱布尼茨级数的误差约为 1/n，收敛极慢。艾特肯 Δ² 加速 S − Sₙ₊₂ ≈ −(ΔSₙ₊₁)²/(Δ²Sₙ) 对误差按比例变化的数列特别有效；Σ1/k² 的余项约为 1/n − 1/(2n²) + 1/(6n³)（23.6 节）。", "An alternating series' error is at most the first omitted term (Section 23.4); the Leibniz series' error is about 1/n, painfully slow. Aitken's Δ² works best when errors shrink by a ratio; the remainder of Σ1/k² is about 1/n − 1/(2n²) + 1/(6n³) (Section 23.6)."]
步骤:
