  - ["机器人场景中角度以度计，角速度以 °/s 显示，最后一行换算为 rad/s。", "In the robot scene angles are in degrees and angular velocity in °/s; the last row converts to rad/s."]
思考题:
  - ["浏览器用双精度浮点数计算。若允许 h 取到 10⁻¹²，割线斜率的误差会怎样？用 7.1.4 节的结论解释。", "The browser computes in double precision. If h could go down to 10⁻¹², what would happen to the error? Explain with Section 7.1.4."]
