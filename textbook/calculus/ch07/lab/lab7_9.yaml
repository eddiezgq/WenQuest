# 实验 7.9 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab7_9.js。
原理:
  - ["相机在路线旁距离 d 处，AGV 位置为 x，视线与垂线的夹角 θ = arctan(x/d)。对时间求导，得所需的转动角速度。",
     "With the camera a distance d from the route and the AGV at x, the line of sight makes θ = arctan(x/d) with the perpendicular. Differentiating in time gives the required turning rate."]
  - 式: "dθ/dt = v d / (d² + x²)，最大值 v/d（x = 0）          (7.9.1)"
  - ["路灯高 H，人高 h，人离灯杆 x：由相似三角形，影长 s = hx/(H − h)，影子顶端离灯杆 Hx/(H − h)，顶端的速度为 Hu/(H − h)，u 为步速。",
     "Lamp height H, person height h, distance x: similar triangles give the shadow length s = hx/(H − h); the tip is Hx/(H − h) from the lamp and moves at Hu/(H − h), u the walking speed."]
步骤:
