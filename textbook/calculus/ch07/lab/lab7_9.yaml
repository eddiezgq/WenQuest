     "Run once with the defaults (task 1); record the largest lag and where tracking is lost; compare with Example 7.9.2."]
  - ["保持 v = 1.5 m/s、限速 0.5 rad/s，把 d 依次取 2、2.5、3、3.5 m，各运行一次，记录最大偏差，填入表 1；找出全程跟住的最小距离（任务 2）。",
     "Keep v = 1.5 m/s and 0.5 rad/s; run with d = 2, 2.5, 3, 3.5 m, record the largest lag in Table 1, and find the smallest d that tracks all the way (task 2)."]
  - ["切换到影子场景，取 H = 6 m、h = 1.8 m、u = 1.4 m/s 走一趟（任务 3），记录不同位置的影长和顶端速度，填入表 2。",
     "In the shadow scene take H = 6 m, h = 1.8 m, u = 1.4 m/s and walk once (task 3); record shadow length and tip speed at several places in Table 2."]
