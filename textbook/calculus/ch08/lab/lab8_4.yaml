思考题:
  - ["牛顿法用了 f′，二分法只用了 f 的符号。在什么情况下你宁可用二分法？能不能把两者结合起来？", "Newton uses f′; bisection only uses the sign of f. When would you prefer bisection? Can the two be combined?"]
