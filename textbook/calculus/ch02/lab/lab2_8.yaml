注意:
  - ["数据由书中写明的示意模型加固定种子的随机误差生成，与程序 2.8.1 完全相同，所以实验能给出“真值”。实际标定时真值未知，只能靠残差和独立的检验数据判断。", "The data come from the stated model plus seeded noise, exactly as in program 2.8.1, so the lab can show the 'true' value. In a real calibration the truth is unknown; residuals and independent check data are all you have."]
  - ["多项式模型的自变量先换成标准区间上的 u（舵机 u = (p − 1500)/1000），系数是对 u 而言的。", "Polynomial models use a scaled variable u (servo: u = (p − 1500)/1000); the coefficients refer to u."]
思考题:
  - ["一次模型的均方根还不到 2°，看上去也不坏。为什么还要看残差图？十次多项式的均方根更小，为什么不用它？", "The linear model's RMS is under 2°, which looks fine. Why look at the residual plot at all? A tenth-degree polynomial has an even smaller RMS; why not use it?"]
  - ["二次模型为什么几乎没有改善舵机数据的拟合？（提示：数据的偏差关于中点是对称的还是反对称的？）", "Why does the quadratic barely improve the servo fit? (Hint: is the deviation symmetric or antisymmetric about the midpoint?)"]
