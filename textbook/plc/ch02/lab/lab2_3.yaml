    表头: ["I/O 点", "地址", "接的是什么触点（常开 / 常闭）", "不操作时的值"]
    表头英文: ["Point", "Address", "Contact wired (NO / NC)", "Value at rest"]
    行: [["S1_Fwd", "", "", ""], ["S2_Stop", "", "", ""], ["S3_Rev", "", "", ""], ["F1_OL", "", "", ""], ["KM1_Aux", "", "", ""], ["KM2_Aux", "", "", ""]]
  - 标题: ["表 2  三种互锁做法的测试结果", "Table 2  Test results of three interlock designs"]
    表头: ["做法", "直接换向 10 次中短路的次数", "S1、S3 同时按", "KM1 熔焊后按 S3"]
    表头英文: ["Design", "Shorts in 10 direct reversals", "S1 and S3 together", "S3 with KM1 welded"]
    行: [["不互锁", "", "", ""], ["只有按钮互锁", "", "", ""], ["双重互锁", "", "", ""]]
    行英文: [["No interlock", "", "", ""], ["Button interlock only", "", "", ""], ["Double interlock", "", "", ""]]
注意:
  - ["梯形图编辑：点格子放元件，竖线把两行连成并联；每次改完按“编译并下载”。也可以切到 ST 用逻辑式写（程序 2.3.1）。",
     "Ladder editing: click a cell to place an element; a vertical link makes a parallel branch; compile and download after each change. You may also write it in ST as logic (Program 2.3.1)."]
  - ["Q1 跳闸后电动机不再得电，要按“重新合上断路器 Q1”；热继电器动作后要等它冷却一会儿才能复位。",
     "After Q1 trips the motor gets no power until Q1 is closed again; after F1 trips, wait for it to cool before resetting."]
  - ["这是仿真。真实的电动机上不要做“拆掉互锁”的试验：相间短路会烧坏触点，电弧会伤人。",
     "This is a simulation. Never remove interlocks on a real motor: a phase-to-phase short burns contacts and the arc can injure."]
思考题:
  - ["只有按钮互锁、没有接触器互锁时，正转中直接按 S3 有时短路、有时不短路。为什么？什么情况下一定短路？", "With the button interlock alone, pressing S3 while running forward sometimes shorts and sometimes does not. Why? When does it always short?"]
  - ["电路图里 KM2 的互锁触点是“常闭”的，而实验台的输入 KM2_Aux 来自 KM2 的常开辅助触点。两者在逻辑上为什么等价？在现场为什么最好真用常闭触点？", "In the circuit diagram KM2's interlock contact is NC, while the bench input KM2_Aux comes from an NO contact. Why are they logically equivalent? Why is a real NC contact better in the field?"]
