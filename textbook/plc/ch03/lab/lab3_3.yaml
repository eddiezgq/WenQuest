# 实验 3.3 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、任务取自 lab3_3.js。
原理:
  - ["PLC 的数字量输入是一只电阻加一只发光二极管（光电耦合器），电流只能朝一个方向流。公共端接 M 时电流从输入端子流入，要配 PNP 传感器；公共端接 L+ 时电流从输入端子流出，要配 NPN 传感器。输入电流在 2 mA 以上、端子与公共端之间的电压在 11 V 以上（3 型输入）时读为 1。",
     "A PLC digital input is a resistor and an LED (an optocoupler): current flows one way only. With the common to M, current flows into the terminal: use a PNP sensor; with the common to L+, it flows out: use an NPN sensor. Above 2 mA and 11 V (type 3) the input reads 1."]
  - ["线圈的电流不能突变。触点断开时线圈电流要找一条路，没有吸收电路就在触点之间产生几百伏的电压和电弧。续流二极管让电流在线圈和二极管之间环流，电压只有约 0.7 V，但电流按线圈的时间常数 L/R 慢慢衰减。",
     "A coil's current cannot jump. When the contact opens the current needs a path; without a suppressor, hundreds of volts and an arc appear across the contact. A freewheeling diode lets the current circulate (≈0.7 V) but it decays slowly with the coil's time constant L/R."]
  - 式: "I = 4 + 16·h/2000 (mA)，x = (I − 4)/16 × 27648，h = 2000·x/27648 (mm)"
步骤:
  - ["场景“传感器接数字量输入”：按任务 1 设置 PNP 传感器、公共端接 M，再改成 NPN 传感器、公共端接 L+，有料时读出各点电压和输入电流，填表 1。", "Scene 'sensor to a digital input': for task 1 set a PNP sensor with the common to M, then an NPN sensor with the common to L+; with a part present read the voltages and input current; fill in Table 1."]
  - ["设成 PNP 传感器、公共端接 L+（任务 2）：传感器输出是 24 V，PLC 却读到 0。记下三个电压，解释原因；再试 NPN 传感器、公共端接 M。", "PNP sensor with the common to L+ (task 2): the sensor output is 24 V, yet the PLC reads 0. Record three voltages and explain; then try NPN with the common to M."]
  - ["在电路编辑器里点一下传感器开关（模拟无料、有料），看电流怎样随之变化。", "Click the sensor switch in the circuit editor (no part / part) and watch the current change."]
  - ["场景“输出断开电磁阀线圈”：吸收设为 0，输出设为 0（刚断开），读出最低电压（任务 3）；吸收设为 1 再做一次，读出最低电压和电流降到 30 % 的时间（任务 4），填表 2。", "Scene 'switching off a valve coil': suppressor 0, output 0 (just off): read the lowest voltage (task 3); repeat with suppressor 1: lowest voltage and time to 30 % (task 4); fill in Table 2."]
  - ["场景“4–20 mA 液位计”：液位 0、25、50、75、100 %，读出电流、电压和 PLC 读到的数，填表 3；再把电缆设为断线（任务 6）。", "Scene '4–20 mA level': level 0, 25, 50, 75, 100 %; read the current, voltage and value; fill in Table 3; then cut the cable (task 6)."]
