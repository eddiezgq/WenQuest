注意:
  - ["改参数时电路会按新参数重建；“刚断开”表示线圈里还有 0.2 A 电流、触点已经断开的那一刻。", "Changing a parameter rebuilds the circuit; 'just switched off' is the instant the contact has opened with 0.2 A still in the coil."]
  - ["仿真里把触点断开处的漏电和分布参数简化成一只 2 kΩ 电阻：尖峰约为 0.2 A × 2 kΩ = 400 V，真实的大小与线路有关，但几百伏是常见的量级。这只电阻在触点断开后还让约 11 mA 的电流流过线圈，所以电流不会降到 0。", "The simulation lumps the open contact's leakage and strays into 2 kΩ: the spike is about 0.2 A × 2 kΩ = 400 V; real spikes depend on the wiring, but hundreds of volts are typical. The same resistor keeps about 11 mA in the coil after the contact opens, so the current does not reach 0."]
  - ["真实设备上不要带电改接线；量几百伏的尖峰要用合适的示波器和高压探头。", "Never rewire live equipment; measuring spikes of hundreds of volts needs a suitable oscilloscope and high-voltage probe."]
思考题:
  - ["续流二极管让线圈释放变慢。在只靠按钮互锁、或者靠程序里固定延时换向的正反转电路里（2.3 节），这会带来什么危险？", "A freewheeling diode slows the release. In a reversing circuit relying only on the button interlock, or on a fixed delay in the program (Section 2.3), what danger does that bring?"]
  - ["变送器两端至少要有十几伏才能工作。电源 24 V、输入电阻 250 Ω、电缆电阻 50 Ω 时，20 mA 下变送器两端还剩多少伏？", "A transmitter needs a minimum voltage across it. With 24 V, a 250 Ω input and 50 Ω of cable, how many volts are left across the transmitter at 20 mA?"]
  - ["4–20 mA 回路的 4 mA 是“活零点”。如果采用 0–20 mA，PLC 还能分辨“液位为零”和“电缆断了”吗？", "4 mA is a live zero. With 0–20 mA, could the PLC still tell 'empty' from 'cable cut'?"]
