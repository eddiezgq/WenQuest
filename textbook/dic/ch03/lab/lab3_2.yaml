    表头: ["PWM / kHz", "最大位数", "时钟 / MHz", "余量 / ps"]
    表头英文: ["PWM / kHz", "Largest width", "Clock / MHz", "Slack / ps"]
    行: [["20", "", "", ""], ["30", "", "", ""]]
  - 标题: ["表 3  保持时间检查", "Table 3  Hold check"]
    表头: ["偏斜 δ / ps", "反相器对数", "保持时间余量 / ps", "满足？"]
    表头英文: ["Skew δ / ps", "Inverter pairs", "Hold slack / ps", "Met?"]
