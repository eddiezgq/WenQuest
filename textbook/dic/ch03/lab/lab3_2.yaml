注意:
  - ["触发器参数（tcq、tsu、th）取自 SKY130 仿真，以 FO4 为单位换算到手算模型；加 1 电路按单位尺寸的门估算，没有计入连线。", "The flip-flop parameters (tcq, tsu, th) come from SKY130 simulation, converted through the hand model's FO4; the incrementer is estimated with unit-size gates and no wiring."]
  - ["没有计入时钟抖动和工艺偏差；实际设计要在最慢条件下查建立时间、最快条件下查保持时间（第 8 章）。", "Clock jitter and process variation are not included; real designs check setup at the slow corner and hold at the fast corner (Chapter 8)."]
思考题:
  - ["为什么降低时钟频率能修正建立时间违例，却修正不了保持时间违例？", "Why does slowing the clock fix setup but not hold violations?"]
  - ["插入的反相器对会不会让这一段路径的建立时间违例？在什么情况下会？", "Can the inserted inverter pairs cause a setup violation on this path? When would they?"]
