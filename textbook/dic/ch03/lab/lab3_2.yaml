# 实验 3.2 的指导书与报告模板。目的、场景、参数、任务取自 lab3_2.js（由 labs/micro/textbook/lab3_2.body.js 生成）。
原理:
  - ["发送触发器在一个时钟沿送出数据，经组合逻辑最慢的路径，必须在下一个时钟沿之前 tsu 到达接收触发器；时钟偏斜 δ 为接收端晚到的时间。", "Data launched at one clock edge must cross the slowest logic path and arrive tsu before the next edge; the clock skew δ is how much later the capture clock arrives."]
  - 式: "T + δ ≥ tcq + tlogic,max + tsu        (3.2.2)"
  - ["同一个时钟沿送出的新数据，经最快的路径，不能早于接收端保持窗口结束；这个条件里没有时钟周期。", "New data launched by the same edge must not arrive, along the fastest path, before the capture flip-flop's hold window ends; the clock period does not appear."]
  - 式: "tcq + tlogic,min ≥ th + δ        (3.2.3)"
  - ["行波进位加 1 电路的关键路径与位数成正比（每位约 11τ）；PWM 频率固定时，位数每加 1，时钟频率加倍。", "The ripple-carry incrementer's critical path grows linearly with width (about 11τ per bit); at a fixed PWM frequency each extra bit doubles the clock."]
步骤:
  - ["选“计数器的最高频率”，16 位，从 100 MHz 往上调，找到余量不为负的最高频率（任务 1）；再取 8、12 位重复，填入表 1。", "Choose “Counter maximum frequency”, 16 bits; raise the clock from 100 MHz to the highest frequency with non-negative slack (task 1); repeat for 8 and 12 bits and fill in Table 1."]
  - ["选“20 kHz PWM 的位数”，PWM 20 kHz，从 16 位往下调，找到余量不为负的最大位数（任务 2）；把 PWM 改为 30 kHz 再找一次，填入表 2。", "Choose “Bits at 20 kHz PWM”; from 16 bits downwards find the largest width with non-negative slack (task 2); repeat at 30 kHz and fill in Table 2."]
  - ["选“保持时间”，偏斜依次取 0、140、240 ps，记录余量；在 240 ps 时插入最少的反相器对使余量不为负（任务 3），填入表 3。", "Choose “Hold check”; set the skew to 0, 140 and 240 ps and record the slack; at 240 ps insert the fewest inverter pairs that make it non-negative (task 3); fill in Table 3."]
