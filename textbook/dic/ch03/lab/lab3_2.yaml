  - 标题: ["表 1  计数器的最高时钟频率", "Table 1  Maximum counter clock"]
    表头: ["位数", "加 1 电路延时 / ns", "最短周期 / ns", "最高频率 / MHz"]
    表头英文: ["Bits", "Incrementer delay / ns", "Minimum period / ns", "Maximum frequency / MHz"]
