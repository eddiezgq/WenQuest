    表头: ["负载 / mA", "Wn / μm", "V_OL（实验）/ V", "V_OL / I / Ω", "所需最小 Wn（计算）/ μm"]
    表头英文: ["Load / mA", "Wn / μm", "VOL (lab) / V", "VOL / I / Ω", "Minimum Wn (calc.) / μm"]
