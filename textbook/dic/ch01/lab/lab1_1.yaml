# 实验 1.1 的指导书与报告模板。目的、场景、参数、任务取自 lab1_1.js（由 labs/micro/textbook/lab1_1.body.js 生成）。
原理:
  - ["CMOS 反相器由串在电源和地之间的 PMOS 和 NMOS 组成。输入为 1 时 NMOS 导通、PMOS 截止，负载电容经 NMOS 放电，输出为 0；输入为 0 时反过来。稳态时总有一个管子截止，电源到地没有直流通路。",
     "A CMOS inverter is a PMOS and an NMOS in series between the supply and ground. With input 1 the NMOS conducts and the PMOS is off, the load capacitor discharges through the NMOS and the output is 0; with input 0 it is the other way round. In steady state one transistor is always off, so there is no DC path from supply to ground."]
  - 式: ["线性区 I_D = k′(W/L)[(V_GS − V_T)V_DS − V_DS²/2]        (1.1.1)", "linear region I_D = k′(W/L)[(V_GS − V_T)V_DS − V_DS²/2]        (1.1.1)"]
  - ["输出管脚要吸收直流负载电流 I 时，NMOS 工作在线性区，输出低电平由 I_D(V_DD, V_OL) = I 决定。要求 V_OL 不超过某个值时，管宽至少为 W = I·L / {k′[(V_DD − V_T)V_OL − V_OL²/2]}（式 (1.1.3)）。",
     "When the output pin sinks a DC load current I, the NMOS is in the linear region and VOL follows from I_D(V_DD, V_OL) = I. To keep VOL below a given value the width must be at least W = I·L / {k′[(V_DD − V_T)V_OL − V_OL²/2]} (Eq. (1.1.3))."]
  - 式: "W ≥ I·L / {k′[(V_DD − V_T)V_OL − V_OL²/2]}        (1.1.3)"
步骤:
  - ["选“开关路径”，把输入分别切到 0 和 1，记下每种情况下导通的管子、输出电压和静态电流，填入表 1（任务 1）。", "Choose “Switching path”. Set the input to 0 and to 1 and record the conducting transistor, the output and the static current in Table 1 (task 1)."]
  - ["选“关节驱动板的光耦输入”。先用式 (1.1.3) 算出负载 1 mA、V_OL ≤ 0.2 V 所需的最小 Wn，再在实验中调 Wn，核对 V_OL，填入表 2（任务 2）。", "Choose the optocoupler scene. Compute with Eq. (1.1.3) the minimum Wn for 1 mA and VOL ≤ 0.2 V, then set Wn in the lab and check VOL; fill in Table 2 (task 2)."]
  - ["保持 Wn 不变，把负载加到 1.5 mA 和 2 mA，记下 V_OL，看它是否与电流成正比；再把 Wn 调到 2 mA 时刚好满足要求（任务 3）。", "Keep Wn, raise the load to 1.5 mA and 2 mA and record VOL; is it proportional to the current? Then set Wn just wide enough at 2 mA (task 3)."]
