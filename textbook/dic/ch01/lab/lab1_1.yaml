注意:
  - ["V_OL 由线性区方程决定，不能直接用导通电阻乘电流：V_OL 越大，V_DS²/2 项越不能忽略。", "VOL follows from the linear-region equation, not simply from on-resistance times current: the V_DS²/2 term matters more as VOL grows."]
  - ["负载电流超过饱和电流时，NMOS 已进入饱和区，输出拉不下来，加宽才是办法。", "If the load exceeds the saturation current, the NMOS is saturated and cannot pull the output down; only a wider device helps."]
思考题:
  - ["接了光耦以后，反相器还算“静态功耗为零”吗？静态时电源送出的功率到哪里去了？", "With the optocoupler attached, is the static power still zero? Where does the power from the supply go?"]
  - ["芯片的输出管脚为什么要比内部的门大得多？", "Why are output pins so much larger than internal gates?"]
