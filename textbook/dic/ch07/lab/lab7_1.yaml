# 实验 7.1 的指导书与报告模板。目的、场景、参数、任务取自 lab7_1.js（由 labs/micro/textbook/lab7_1.body.js 生成）。
原理:
  - ["存储阵列每次读一行：行译码器选中一条字线，这一行的单元接到各自的位线上，位线预充到 VDD，存 0 的单元把位线拉下 ΔV，灵敏放大器把它放大成满幅，列选挑出要的字。存取时间是几段之和：", "An array reads one row at a time: the decoder raises one word line, the cells drive their bit lines (precharged to VDD) down by ΔV, the sense amplifiers restore full swing and the column mux picks the word. The access time is a sum:"]
  - 式: "t = t译码 + t字线 + t位线 + t灵敏放大 + t列选与输出，t位线 = C_BL·ΔV / I_read        (7.1.1)"
  - ["行数多，位线长、C_BL 大，位线慢；列数多，字线又长又挂满存取管，字线的 RC 变大，列选的级数也多。读电流、存取管给位线添的电容和灵敏放大器的速度取自 SKY130 仿真，导线电容按第 4 章。", "More rows make the bit lines long and slow; more columns make the word line long and heavily loaded, and the column mux deeper. The read current, the access transistors' bit-line capacitance and the sense-amplifier speed come from SKY130 simulation; wire capacitance from Chapter 4."]
步骤:
  - ["ΔV = 100 mV，行数从 64 调到 1024，把各段延时、存取时间和面积填入表 1，找出最快的划分（任务 1）。", "With ΔV = 100 mV, step the rows from 64 to 1024, fill Table 1 and find the fastest organisation (task 1)."]
  - ["ΔV 加到 200 mV、50 mV，各找出最快的划分，并看 1024 行时位线一段怎样变（任务 2），填入表 2。", "Set ΔV to 200 mV and 50 mV, find the fastest each time and watch the bit-line part at 1024 rows (task 2); fill Table 2."]
  - ["找出面积最小的划分（任务 3），记下它的长和宽。", "Find the smallest organisation (task 3) and record its width and height."]
