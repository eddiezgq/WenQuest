注意:
  - ["列选与输出一段按经验取 FO4 的倍数，译码器按逻辑努力的最优尺寸估算，读电流按常数，这些都是粗估；比较各种划分的趋势比看绝对值更有意义。", "The mux-and-output term is an empirical multiple of FO4, the decoder is sized by logical effort and the read current is taken as constant; compare trends rather than absolute values."]
