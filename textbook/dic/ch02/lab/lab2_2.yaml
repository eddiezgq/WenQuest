思考题:
  - ["为什么 CMOS 设计偏爱与非门？输入数多于四个时应怎样实现？", "Why does CMOS design prefer NAND gates? How should gates with more than four inputs be built?"]
  - ["把最晚到达的信号接到靠近输出的输入上为什么更快？本实验的模型能反映这一点吗？", "Why is it faster to connect the latest signal to the input nearest the output? Does this lab's model show it?"]
