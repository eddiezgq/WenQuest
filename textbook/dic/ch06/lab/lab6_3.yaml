注意:
  - ["硬件里行数是固定的：不管数字是不是 0，5 行的电路都在；“不为 0 的行数”只说明哪些行实际在翻转，与功耗有关。", "In hardware the number of rows is fixed: all five exist whether or not a digit is 0; the non-zero count only tells which rows actually toggle, which matters for power."]
思考题:
  - ["为什么相邻两组要重叠一位？", "Why must adjacent groups overlap by one bit?"]
