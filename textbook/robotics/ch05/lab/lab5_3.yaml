# 实验 5.3 的指导书与报告模板。目的、场景、参数、任务取自 lab5_3.js。
原理:
  - ["物体当前位姿为 T_st。在物体自身坐标系中描述的位移 D 右乘：T_st′ = T_st D；在固定坐标系 {s} 中描述的位移左乘：T_st′ = D T_st（定理 5.3.3）。",
     "Current pose T_st. A displacement D described in the body frame multiplies on the right, T_st′ = T_st D; one described in the fixed frame {s} multiplies on the left, T_st′ = D T_st (Theorem 5.3.3)."]
  - ["左乘的转动绕 {s} 的原点进行，物体会被甩出一段弧；右乘的转动绕物体自身的原点进行，物体原地转身。两者转过的角度相同，所以姿态相同。",
     "A left turn is about the origin of {s} and flings the body along an arc; a right turn is about the body's own origin. The angle is the same, so the orientation is the same."]
  - 式: "T_ts = T_st⁻¹ = [Rᵀ  −Rᵀ p; 0  1]          (5.3.6)"
步骤:
  - ["打开实验 5.3，场景“夹爪进夹具”。按“重置”，记录起点的 T_st 和 T_ts，用式 (5.3.6) 手算 T_ts 的第三列，填入表 1。",
     "Open Lab 5.3, scene “Gripper into the fixture”. Press Reset, record T_st and T_ts at the start, and compute column 3 of T_ts by hand with Eq. (5.3.6)."]
  - ["只用两个“右乘”按钮把夹爪送进夹具（任务 1），记下按键次序，填入表 2。",
     "Using only the two “right” buttons, bring the gripper into the fixture (task 1); write down the sequence in Table 2."]
  - ["按“重置”，再按一次“绕基座原点左转”（任务 2）。记录甩出的距离，与 2 r sin 15° 比较（r 为夹爪到 {s} 原点的距离）。",
     "Reset, then press “turn left about the base origin” once (task 2). Record the distance flung and compare with 2 r sin 15° (r = distance from the gripper to the origin of {s})."]
  - ["切换到“街区里的行人”，只用“前进”和“左转”走到商店（任务 3）。再试着只用两个“左乘”按钮走到商店，比较两种走法的按键次序。",
     "Switch to “A walker in town” and reach the shop with “ahead” and “turn left” only (task 3). Then try with the two “left” buttons only and compare."]
数据表:
  - 标题: ["表 1  起点的位姿与逆", "Table 1  Pose and inverse at the start"]
    表头: ["量", "读数", "手算"]
    表头英文: ["Quantity", "Read", "By hand"]
    行: [["T_st 第三列", "", "(0.6, 0.3, 1)"], ["T_ts 第三列", "", ""], ["|p_ts| 与 |p_st|", "", ""]]
    行英文: [["Column 3 of T_st", "", "(0.6, 0.3, 1)"], ["Column 3 of T_ts", "", ""], ["|p_ts| and |p_st|", "", ""]]
  - 标题: ["表 2  按键次序", "Table 2  Button sequences"]
    表头: ["任务", "按键次序", "终点位姿"]
    表头英文: ["Task", "Sequence", "Final pose"]
    行: [["夹爪进夹具", "", ""], ["绕基座原点左转一次", "", ""], ["行人到商店（右乘）", "", ""], ["行人到商店（左乘）", "", ""]]
    行英文: [["Gripper into fixture", "", ""], ["One left turn about the base", "", ""], ["Walker to the shop (right)", "", ""], ["Walker to the shop (left)", "", ""]]
注意:
  - ["夹爪场景步长 0.1 m、转角 30°；街区场景步长 1 格、转角 90°。", "Gripper scene: 0.1 m and 30° per press; town scene: one block and 90°."]
  - ["用过任何一个“左乘”按钮后，任务 1、3 不再计入，需按“重置”重来。", "After any “left” button, tasks 1 and 3 no longer count; press Reset to start again."]
思考题:
  - ["夹爪恰在 {s} 原点时，左乘和右乘的转动结果一样吗？为什么？", "If the gripper sits at the origin of {s}, do the left and right turns give the same result? Why?"]
