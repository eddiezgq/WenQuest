# 实验 5.5 的指导书与报告模板。目的、场景、参数、任务取自 lab5_5.js。
原理:
  - ["抓取时工具坐标系 {t} 与抓取坐标系 {g} 重合。从工作台出发，经机器人和经相机两条路径到达同一个坐标系，位姿必须相等，即闭合方程。",
     "At the grasp the tool frame {t} coincides with the grasp frame {g}. Two paths from the table, through the robot and through the camera, reach the same frame, so their poses are equal: the closure equation."]
  - 式: "T_ws T_sb(θ) T_bt = T_wc T_co T_og          (5.5.1)"
  - 式: "T_sb* = T_sw T_wc T_co T_og T_tb          (5.5.2)"
  - ["相机实际姿态比标定值多转了小角度 δ 时，抓取点偏差约为 δ 乘以抓取点到误差转轴的距离（式 (5.5.3)）。", "If the camera is turned by a small δ from its calibrated pose, the miss is about δ times the distance from the grasp point to the error axis (Eq. (5.5.3))."]
步骤:
  - ["打开实验 5.5，场景“视觉引导抓取”。δ = 0，按“抓取”（任务 1）。记录相机读数 T_co 的第 4 列、法兰目标 T_sb* 和关节角，与算例 5.5.1 比较；记录偏差。",
     "Open Lab 5.5, scene “Vision-guided pick”. With δ = 0 press Pick (task 1). Record column 4 of T_co, the flange target T_sb* and the joint angles; compare with Example 5.5.1; record the miss."]
  - ["把 δ 依次设为 0.2°、0.5°、1.0°，每次按“重置”后再“抓取”，记录偏差（任务 2 为 0.5°）。画出偏差与 δ 的关系，求斜率，与杠杆长度比较。",
     "Set δ to 0.2°, 0.5°, 1.0°; Reset and Pick each time; record the miss (task 2 is 0.5°). Plot miss against δ, find the slope and compare with the lever arm."]
  - ["δ 回到 0，把齿轮坯挪到料盘的另一处并转一个角度，再抓取（任务 3）。观察第 6 个关节角怎样随工件转角变化。",
     "Set δ back to 0, move the blank elsewhere in the tray and turn it, then pick (task 3). See how joint 6 follows the part's angle."]
  - ["切换到“倒车影像”，把俯仰误差调到 1°（任务 4），记录测距误差；再试 2°、3°。",
     "Switch to “Reversing camera”, set the pitch error to 1° (task 4) and record the distance error; then try 2° and 3°."]
数据表:
  - 标题: ["表 1  相机安装误差与夹爪偏差", "Table 1  Camera mounting error and gripper miss"]
    表头: ["δ / °", "δ / rad", "偏差 / mm", "偏差 ÷ δ / m"]
    表头英文: ["δ / °", "δ / rad", "Miss / mm", "Miss ÷ δ / m"]
    行: [["0", "0", "", "—"], ["0.2", "", "", ""], ["0.5", "", "", ""], ["1.0", "", "", ""]]
  - 标题: ["表 2  倒车影像的测距误差（真实距离 3.0 m）", "Table 2  Distance error of the reversing camera (true distance 3.0 m)"]
    表头: ["俯仰误差 / °", "算出的距离 / m", "误差 / cm"]
    表头英文: ["Pitch error / °", "Computed distance / m", "Error / cm"]
    行: [["1", "", ""], ["2", "", ""], ["3", "", ""]]
注意:
  - ["偏差由三维模型的指尖位置测得，与程序的计算互相独立。", "The miss is measured from the 3D model's fingertip, independently of the program's computation."]
  - ["改变任何滑块后，机械臂回到准备位，需重新按“抓取”。", "After moving any slider the arm returns to its ready pose; press Pick again."]
  - ["齿轮坯转角改变时，同一个抓取位姿可能需要第 6 关节转过很大的角度；实际编程时可利用齿轮坯的对称性选择转角较小的抓法。", "When the blank turns, joint 6 may need a large turn; in practice the blank's symmetry lets you choose a smaller one."]
思考题:
  - ["若直接标定相机相对机器人基座的位姿 T_sc，坐标链中会少掉哪些因子？哪些误差来源随之消失？", "If T_sc is calibrated directly, which factors drop out of the chain, and which error sources go with them?"]
