# 实验 23.1 的指导书与报告模板。目的、场景、参数、任务取自 lab23_1.js。
原理:
  - ["刚体绕定点转动时，角动量 L = Iω，I 是惯量张量。只有当转轴是惯量主轴时 L 才与 ω 同向。", "For a rigid body turning about a fixed point, L = Iω with I the inertia tensor. L is along ω only when the spin axis is a principal axis."]
  - ["毛坯绕 x 轴夹偏 α 后，主轴坐标系中的惯量张量出现非对角元素：", "When the blank is tilted by α about x, the inertia tensor in the spindle frame has an off-diagonal element:"]
  - 式: "I_s = R_x(α) diag(I_t, I_t, I_a) R_x(α)ᵀ,   (I_s)_yz = (I_t − I_a) sin α cos α"
  - ["L 随毛坯一起以 ω 转动，变化率是 ω × L，所以轴承要提供力矩（动不平衡）：", "L turns with the blank at ω, its rate of change is ω × L, so the bearings must supply a moment (dynamic unbalance):"]
  - 式: "|M| = ω² |I_t − I_a| sin α cos α,   I_t = m(3r² + L²)/12,   I_a = m r²/2"
  - ["质心偏离轴线 e 时，轴承还要提供使质心做圆周运动的力（静不平衡）：", "With the centre of mass at e from the axis the bearings must also supply the force for its circular motion (static unbalance):"]
  - 式: "|F| = m e ω²"
步骤:
  - ["场景“车床主轴上的毛坯”：α = 0°、e = 0、n = 1200 r/min，按“开始”，读出力矩和力（任务 1）。", "Scene “Blank on a lathe spindle”: α = 0°, e = 0, n = 1200 r/min; press Start and read the moment and force (task 1)."]
  - ["e = 0，把 α 依次设为 1°、15°、30°、45°、60°、75°、90°，每次按“开始”，把测得的力矩与预测填入表 1（任务 2、3）。", "With e = 0 set α to 1°, 15°, 30°, 45°, 60°, 75° and 90°, press Start each time and fill the measured and predicted moments into Table 1 (tasks 2, 3)."]
  - ["α = 1°，把转速依次设为 600、1200、1800 r/min，验证力矩与转速的平方成正比，填入表 2。", "With α = 1° set the speed to 600, 1200 and 1800 r/min and check that the moment grows with the square of the speed (Table 2)."]
  - ["α = 0°，把 e 设为 0.5、1.0、2.0 mm，读出水平力并与 m e ω² 比较（任务 4），填入表 2。", "With α = 0° set e to 0.5, 1.0 and 2.0 mm, read the horizontal force and compare it with m e ω² (task 4), Table 2."]
  - ["生活场景“洗衣机脱水”：湿衣服 0.5 kg，调转速使离心力在 270～300 N 之间（任务 5），记下转速。", "Everyday scene “Washing machine spin”: with a 0.5 kg lump, set the speed so that the force is between 270 and 300 N (task 5) and note the speed."]
