注意:
  - ["毛坯的尺寸和质量来自数字工厂的物料清单（Ø50 mm、2.8 kg）；车床转速、洗衣机的尺寸是示意值。", "The blank's size and mass come from the digital factory's bill of materials (Ø50 mm, 2.8 kg); the lathe speeds and the washer are illustrative."]
  - ["主轴是无摩擦的铰链，力矩垂直于主轴，所以转速保持不变；力和力矩的读数在随主轴转动的坐标系中不变，在机床上看是旋转的载荷。", "The spindle is a frictionless hinge and the moment is normal to it, so the speed stays constant; the readings are constant in the rotating frame and appear as a rotating load on the machine."]
思考题:
  - ["汽车轮胎做动平衡时，为什么要在轮毂的内外两侧各加配重？只加一侧能消除哪一种不平衡？", "Why does wheel balancing put weights on both the inner and outer rims? Which kind of unbalance can a single weight remove?"]
