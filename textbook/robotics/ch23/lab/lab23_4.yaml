注意:
  - ["工具箱和手机的尺寸、质量都是示意值；看作均匀长方体。", "The sizes and masses of the case and the phone are illustrative; both are treated as uniform boxes."]
  - ["浏览器里的 MuJoCo 与书中程序用同一版本（3.14.0），步长 1 ms、RK4。书中算例 23.4.2 的数字由同一个模型算出：第一次翻转 1.60 s，此后每 2.71 s 一次。", "The MuJoCo in the browser is the same version as the book's programs (3.14.0), RK4 with a 1 ms step; Example 23.4.2 uses the same model: first flip at 1.60 s, then every 2.71 s."]
  - ["手机较慢时，画面里的时间会比真实时间走得慢，结果不变。", "On a slow device simulated time runs slower than real time; the results are the same."]
思考题:
  - ["中间边 b 接近最长边（38 cm）时，翻转来得早还是晚？用 λ 的公式说明。b = 40 cm 时会怎样？", "When b approaches the longest edge (38 cm), does the flip come sooner or later? Explain with λ. What happens at b = 40 cm?"]
  - ["真实的物体有能量耗散（例如装着液体）。由 |L| 守恒、动能减小，说明最后它会绕哪根轴转（“探险者 1 号”）。", "Real bodies dissipate energy (e.g. with liquid inside). With |L| fixed and energy decreasing, about which axis does the body end up spinning (Explorer 1)?"]
