注意:
  - ["电主轴和陀螺仪的尺寸、质量、转速都是示意值。", "The sizes, masses and speeds of the spindle and the gyroscope are illustrative."]
  - ["陀螺仪以恰好的进动角速度开始运动，所以几乎没有章动；用手放开时会有点头的章动，转得越快越小。", "The gyroscope starts with exactly the steady precession rate, so there is almost no nutation; released by hand it nods a little, less the faster it spins."]
思考题:
