    表头: ["转速 / (r/min)", "Ω / (rad/s)", "L = I₃ω / (kg·m²/s)", "测得 |M| / (N·m)", "预测 I₃ωΩ / (N·m)"]
    表头英文: ["Speed / (r/min)", "Ω / (rad/s)", "L = I₃ω / (kg·m²/s)", "Measured |M| / (N·m)", "Predicted I₃ωΩ / (N·m)"]
    行: [["12000", "1", "", "", ""], ["6000", "1", "", "", ""], ["15000", "1", "", "", ""], ["12000", "0.5", "", "", ""], ["12000", "2", "", "", ""]]
  - 标题: ["表 2  陀螺仪的进动", "Table 2  Precession of the gyroscope"]
    表头: ["自转 ω / (rad/s)", "预测 Ω / (rad/s)", "测得 Ω / (rad/s)", "Ω·ω / (rad²/s²)"]
    表头英文: ["Spin ω / (rad/s)", "Predicted Ω / (rad/s)", "Measured Ω / (rad/s)", "Ω·ω / (rad²/s²)"]
