注意:
  - ["目标姿态用 ZYX 欧拉角给出：先绕 z 转偏航 ψ，再绕新的 y 转俯仰 θ，最后绕新的 x 转横滚 φ（4.5 节）。", "The target orientation uses ZYX Euler angles: yaw ψ about z, then pitch θ about the new y, then roll φ about the new x (Section 4.5)."]
  - ["虚线坐标系是目标，实线坐标系是机械臂末端；有解时两者重合。", "The dashed frame is the target, the solid one the tool; they coincide whenever there is a solution."]
  - ["这台机械臂由圆柱和小球搭成，尺寸同表 14.4.1；零件库中没有球形手腕的机械臂模型。", "The arm is built from cylinders and balls with the sizes of Table 14.4.1; the parts library has no spherical-wrist arm."]
思考题:
  - ["θ₅ 接近 0 时，末端姿态的微小变化会让 θ₄、θ₆ 怎样变化？这对沿直线运动的焊枪意味着什么？", "Near θ₅ = 0, how do θ₄ and θ₆ respond to a small change of orientation? What does this mean for a welding torch moving along a line?"]
