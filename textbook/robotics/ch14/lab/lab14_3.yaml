思考题:
  - ["δ 小于多少时肘部场景无解？用 L₁、L₂、W₂ 写出这个下限，并在实验中验证。", "Below what δ does the elbow scene have no solution? Write the bound in L₁, L₂, W₂ and check it in the lab."]
