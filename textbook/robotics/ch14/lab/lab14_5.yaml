  - ["八台 UR5e 只是为了同时观看而排开，每一台的基座坐标系 {s} 相同，红点是各自基座坐标系中的同一个目标。", "The eight UR5e are spread out only for viewing; each has the same base frame {s}, and the red dot is the same target in each."]
  - ["“模型核对”用零件库模型（三维引擎）计算法兰中心，与逆解所用的指数积公式互相独立。", "The model check computes the flange with the library model (the 3D engine), independent of the product of exponentials used by the solver."]
