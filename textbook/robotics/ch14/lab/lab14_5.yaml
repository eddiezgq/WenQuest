# 实验 14.5 的指导书与报告模板。目的、场景、参数、任务取自 lab14_5.js。
原理:
  - ["UR5e 的逆解分三步，每步两个分支：θ₁（肩 A、B），θ₅ 与 θ₆（腕不翻、翻），θ₃ 与 θ₂、θ₄（肘上、下），至多 8 组解（定理 14.5.1）。",
     "The UR5e inverse kinematics has three steps with two branches each: θ₁ (shoulder A, B), θ₅ and θ₆ (wrist no flip, flip), θ₃ with θ₂, θ₄ (elbow up, down): at most eight solutions (Theorem 14.5.1)."]
  - 式: "x sin θ₁ − y cos θ₁ = d₄，(x, y) 为手腕点 p_w = p − W₄ y_b          (14.5.3)"
  - 式: "cos θ₅ = (R₁ ω̂₂)ᵀ (R_d ŷ)          (14.5.7)"
  - 式: "‖e^[S3]θ3 q₄ − q₂‖ = ‖g q₄ − q₂‖          (14.5.9)"
  - ["选解的原则：离当前关节角最近；在连续运动中保持同一支（三个标签不变）；不超限位、不碰撞。两支解只在奇异位形处相遇。",
     "Choosing: nearest to the current joint angles; keep one branch (the same three labels) during a continuous motion; respect limits and avoid collisions. Branches meet only at singular configurations."]
步骤:
  - ["打开实验 14.5，默认目标即算例 14.5.1。把“解的编号”从 1 调到 8，记录每组的标签、六个关节角和模型核对误差，填入表 1，与表 14.5.1 比较（任务 1）。",
     "Open Lab 14.5; the default target is Example 14.5.1. Step “solution” from 1 to 8, recording labels, joint angles and the model-check error in Table 1; compare with Table 14.5.1 (task 1)."]
  - ["选一组肘下的解（任务 2），说明肘点相对肩—腕连线的位置。",
     "Pick an elbow-down solution (task 2) and describe where the elbow lies relative to the shoulder–wrist line."]
  - ["选第 1 组（任务 3），与第 3 组比较 θ₅、θ₆，并说明为什么 θ₂、θ₃、θ₄ 也变了。",
     "Pick solution 1 (task 3), compare θ₅ and θ₆ with solution 3, and explain why θ₂, θ₃, θ₄ changed as well."]
  - ["保持姿态不变，逐步把法兰中心移向基座轴线，记录肩 A、肩 B 的 θ₁ 之差（任务 4），填入表 2。",
     "Keeping the orientation, move the flange toward the base axis step by step, recording the θ₁ difference between shoulders A and B (task 4) in Table 2."]
  - ["切换到“按墙上的开关”，找出碰台面或穿墙的解（标红），再选一组肩 B 的可用解（任务 5）。",
     "Switch to “Pressing a wall switch”, find the solutions that hit the table or wall (red), then pick a usable shoulder-B one (task 5)."]
