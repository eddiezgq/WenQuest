注意:
  - ["零件质量是上限：棒料零件取每件的耗料，锻坯按毛坯尺寸；GR-302 是按齿顶圆、齿宽估算的成品。实际选型要用成品的实测质量。", "Part masses are upper bounds: bar parts use the material per piece, forgings the blank size; GR-302 is an estimate of the finished gear. Real selection uses the measured finished mass."]
  - ["厂商参数取自零件库（各条目注明来源）；价格没有列入，选型时向厂商询价。与人同场的限速 0.25 m/s 是示例，实际按风险评估定。", "Datasheet values come from the parts library (each entry cites its source); prices are not listed and must be quoted by the vendors. The 0.25 m/s speed limit beside people is an example; the real one comes from a risk assessment."]
思考题:
  - ["如果 GR-302 一定要由机器人装，除了换大负载的机器人，还有哪些办法（例如改夹爪、改工艺、加辅助装置）？各有什么代价？", "If GR-302 must be handled by a robot, what options besides a heavier robot are there (gripper, process, assisting devices)? What does each cost?"]
