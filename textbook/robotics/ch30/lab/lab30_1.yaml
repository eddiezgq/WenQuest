  - ["模组和手臂的质量按标准 WQ-CR5 的零件；改长度时铝管的质量跟着变，模组不变。", "Module and arm masses follow the standard WQ-CR5's parts; changing a length changes the tube mass but not the modules."]
思考题:
  - ["如果把工位的料箱从台面下 0.3 m 改放到台面上，需要的臂展会变成多少？用本页的方法估一估。", "If the tote moved from 0.3 m below the bench up onto the bench, what reach would the station need? Estimate it with this page."]
