注意:
  - ["UR5e 的关节力矩只计外力，不计手臂自重；实际可用的余量要小得多。", "The UR5e joint torques count the external force only, not the arm's own weight; the margin left in practice is much smaller."]
  - ["Panda 的噪声是固定种子的随机数，同样的参数总得到同样的读数；噪声标准差是示意值。", "The Panda noise uses a fixed seed, so the same settings always give the same readings; the noise level is only indicative."]
  - ["力的方向：方位角从 x_s 轴量起，逆时针为正；仰角向上为正。", "Direction of the force: azimuth measured from the x_s axis, counter-clockwise positive; elevation positive upwards."]
思考题:
  - ["肘部被推时，按“力在手上”估计出的力看起来也很合理。只看估计值能不能发现问题？残差为什么能？", "When the elbow is pushed, the force estimated as if on the hand also looks plausible. Can the estimate alone reveal the problem? Why can the residual?"]
