注意:
  - ["地图上的颜色只到 0.75；手臂伸直或接近肩部奇异（ρ = d₄）处颜色最暗。", "The colour scale stops at 0.75; it is darkest where the arm is straight or near the shoulder singularity (ρ = d₄)."]
  - ["2R 臂的总长固定为 0.817 m，与 UR5e 的大臂加小臂相同。", "The total length of the 2R arm is fixed at 0.817 m, the same as the UR5e's upper arm and forearm."]
  - ["书桌场景只考虑上臂和前臂在水平面内的转动，不计手腕和身体的移动。", "The desk scene only turns the upper arm and forearm in a horizontal plane, without the wrist or any movement of the body."]
思考题:
  - ["为什么 GCI 最大的长度比恰好也是能做到各向同性的长度比？只是巧合吗？试从 LCI 曲线的形状去解释。", "Why is the length ratio with the largest GCI also the one that can be isotropic? A coincidence? Try to explain it from the shape of the LCI curves."]
