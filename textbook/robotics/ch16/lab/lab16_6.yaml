  - 标题: ["表 1  UR5e 的工位", "Table 1  Working places of the UR5e"]
    表头: ["位置", "ρ / m", "z / m", "1/κ", "可操作度 w / m³"]
    表头英文: ["Place", "ρ / m", "z / m", "1/κ", "Manipulability w / m³"]
    行: [["θ*", "0.665", "0.235", "", ""], ["最灵巧处", "", "", "", ""]]
    行英文: [["θ*", "0.665", "0.235", "", ""], ["most dexterous", "", "", "", ""]]
  - 标题: ["表 2  z = 0.235 m 时 1/κ 随 ρ 的变化", "Table 2  1/κ against ρ at z = 0.235 m"]
    表头: ["ρ / m", "0.3", "0.4", "0.5", "0.6", "0.7", "0.8", "0.9", "0.905"]
    行: [["1/κ", "", "", "", "", "", "", "", ""]]
  - 标题: ["表 3  2R 臂的设计", "Table 3  Design of the 2R arm"]
