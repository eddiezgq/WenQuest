# 实验 16.1 的指导书与报告模板。目的、场景、参数、任务取自 lab16_1.js。
原理:
  - ["末端的空间运动旋量是各关节此刻的旋量轴乘以转速再相加：空间雅可比的第 i 列是关节 i 此刻的旋量轴在 {s} 中的表示，物体雅可比的第 i 列是它在 {b} 中的表示。",
     "The spatial twist of the end-effector is the sum of each joint's present screw axis times its speed: column i of the space Jacobian is joint i's present screw axis expressed in {s}, and column i of the body Jacobian is the same axis expressed in {b}."]
  - 式: "J_s1 = S_1，J_si = [Ad_{e^{[S_1]θ_1}⋯e^{[S_{i−1}]θ_{i−1}}}] S_i          (16.1.3)"
  - 式: "J_s = [Ad_T] J_b          (16.1.6)"
  - 式: ["示教器“基座”坐标系：V_s = (ω_s, ṗ − ω_s × p)          (16.1.7)", "Pendant “base” frame: V_s = (ω_s, ṗ − ω_s × p)          (16.1.7)"]
  - ["点动时控制器每个周期解 J θ̇ = V。线速度部分为零的空间运动旋量 (ω, 0) 表示绕经过 {s} 原点的直线转动，不是绕法兰盘中心转动。",
     "When jogging, the controller solves J θ̇ = V every cycle. A spatial twist (ω, 0) with zero linear part turns about a line through the origin of {s}, not about the flange centre."]
步骤:
  - ["打开实验 16.1，场景“UR5e 点动”。坐标系选 0（示教器基座），方向选 0（x），速度 50 mm/s，按“开始”。点动结束后记录六个关节的转速、法兰盘中心的位移、偏离直线的距离和姿态变化，填入表 1（任务 1）。",
     "Open Lab 16.1, scene “UR5e jogging”. Choose frame 0 (pendant base), direction 0 (x), speed 50 mm/s and press “Start”. When the jog ends, record the six joint speeds, the flange-centre displacement, the distance off the line and the orientation change in Table 1 (task 1)."]
  - ["坐标系选 1（示教器工具），方向选 5（绕 z），重复上一步（任务 2）。", "Choose frame 1 (pendant tool) and direction 5 (about z) and repeat (task 2)."]
  - ["坐标系选 2（直接给 V_s），方向选 5，重复上一步，观察哪个关节在转、法兰盘中心走什么路径（任务 3）。",
     "Choose frame 2 (raw V_s) and direction 5, repeat, and see which joint turns and what path the flange centre follows (task 3)."]
  - ["坐标系选 1，依次试方向 3、4、5，找出只需关节 6 转动的方向，并用物体雅可比的最后一列解释（任务 4）。",
     "Choose frame 1 and try directions 3, 4 and 5; find the one that needs joint 6 only and explain it with the last column of the body Jacobian (task 4)."]
  - ["切换到“挖掘机平整场地”，先用模式 0 运行，再用模式 1 运行，记录斗尖收回的距离和高度的最大偏差，填入表 2（任务 5）。",
     "Switch to “Excavator grading”; run mode 0, then mode 1, and record how far the tip is drawn in and its largest height error in Table 2 (task 5)."]
数据表:
  - 标题: ["表 1  UR5e 三种点动（3 s）", "Table 1  Three UR5e jogs (3 s)"]
    表头: ["坐标系", "方向", "θ̇₁…θ̇₆ / (°/s)", "最大位移 / mm", "偏离直线 / mm", "姿态变化 / (°)"]
    表头英文: ["Frame", "Direction", "θ̇₁…θ̇₆ / (°/s)", "Largest displacement / mm", "Off the line / mm", "Orientation change / (°)"]
    行: [["0 示教器基座", "x", "", "", "", ""], ["1 示教器工具", "绕 z", "", "", "", ""], ["2 直接给 V_s", "绕 z", "", "", "", ""], ["1 示教器工具", "", "", "", "", ""]]
    行英文: [["0 pendant base", "x", "", "", "", ""], ["1 pendant tool", "about z", "", "", "", ""], ["2 raw V_s", "about z", "", "", "", ""], ["1 pendant tool", "", "", "", "", ""]]
  - 标题: ["表 2  挖掘机斗尖的路径", "Table 2  Path of the excavator bucket tip"]
    表头: ["模式", "斗尖收回 / m", "高度最大偏差 / cm"]
    表头英文: ["Mode", "Tip drawn in / m", "Largest height error / cm"]
    行: [["0 只推斗杆", "", ""], ["1 平整模式", "", ""]]
    行英文: [["0 stick lever only", "", ""], ["1 grading mode", "", ""]]
注意:
  - ["每次点动都从 θ* 出发；改变参数后手臂回到起点。", "Every jog starts from θ*; changing a parameter puts the arm back at the start."]
  - ["线速度单位为 mm/s，角速度单位为 °/s；关节转速显示为 °/s。", "Linear speeds are in mm/s and angular speeds in °/s; joint speeds are shown in °/s."]
  - ["挖掘机的尺寸只是示意，平整模式忽略了液压系统的响应延迟。", "The excavator dimensions are only indicative, and the grading mode ignores the delay of the hydraulics."]
思考题:
  - ["在任务 1 中，关节 1 与关节 6 的转速为什么相等？如果起始姿态的 θ₅ 不是 −90°，这个结论还成立吗？", "In task 1, why are the speeds of joints 1 and 6 equal? Does this still hold if θ₅ at the start is not −90°?"]
