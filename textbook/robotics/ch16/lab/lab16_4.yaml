# 实验 16.4 的指导书与报告模板。目的、场景、参数、任务取自 lab16_4.js。
原理:
  - ["单位关节速度球 ‖θ̇‖ ≤ 1 在雅可比矩阵下的像是一个椭球，半轴为 σ_i u_i（σ_i 为奇异值，u_i 为左奇异矢量）。可操作度是各半轴之积，条件数是最长与最短半轴之比。",
     "The unit ball of joint velocities ‖θ̇‖ ≤ 1 is mapped by the Jacobian onto an ellipsoid with semi-axes σ_i u_i (σ_i the singular values, u_i the left singular vectors). The manipulability is the product of the semi-axes, the condition number the ratio of the longest to the shortest."]
  - 式: "E = {ξ : ξᵀ (J Jᵀ)⁻¹ ξ ≤ 1}，w = σ₁σ₂⋯σ_m = √det(J Jᵀ)          (16.4.1)、(16.4.2)"
  - ["线速度与角速度单位不同，要分开求椭球：J_v 是几何雅可比的后三行（法兰盘中心的速度），J_ω 是前三行。",
     "Linear and angular velocities have different units, so their ellipsoids are found separately: J_v is the last three rows of the geometric Jacobian (velocity of the flange centre), J_ω the first three."]
  - 式: ["姿态保持不变：E_h = {ṗ : ‖G ṗ‖ ≤ 1}，G 为 J_g⁻¹ 的后三列          (16.4.6)", "Orientation held: E_h = {ṗ : ‖G ṗ‖ ≤ 1}, G the last three columns of J_g⁻¹          (16.4.6)"]
步骤:
  - ["打开实验 16.4，场景“UR5e 的可操作度椭球”。ρ = 0.665 m、z = 0.235 m（θ*），椭球依次选 0、1、2，把三个半轴、可操作度和条件数填入表 1（任务 1）。",
     "Open Lab 16.4, scene “Manipulability ellipsoids of the UR5e”. With ρ = 0.665 m and z = 0.235 m (θ*), choose ellipsoid 0, 1 and 2 in turn and enter the three semi-axes, the manipulability and the condition number in Table 1 (task 1)."]
  - ["椭球选 0，z = 0.235 m，把 ρ 从 0.20 m 每次增加 0.05 m 到 0.90 m，记录可操作度、最短半轴、条件数和 θ₃，填入表 2；找出可操作度最大和条件数最小的 ρ（任务 2、4）。",
     "Choose ellipsoid 0 and z = 0.235 m; increase ρ from 0.20 m to 0.90 m in steps of 0.05 m and record the manipulability, the shortest semi-axis, the condition number and θ₃ in Table 2; find the ρ of largest manipulability and of smallest condition number (tasks 2 and 4)."]
  - ["把 ρ 调到 0.90 m，比较椭球 0 和椭球 1 的形状（任务 3）。", "Set ρ to 0.90 m and compare the shapes of ellipsoids 0 and 1 (task 3)."]
  - ["切换到“人的手臂在书桌上”，把肘部角度从 30° 每次增加 30° 到 150°，记录椭圆的两个半轴和可操作度，填入表 3；找出可操作度最大的角度（任务 5）。",
     "Switch to “A human arm at a desk”, set the elbow angle from 30° to 150° in steps of 30°, record the two semi-axes and the manipulability in Table 3, and find the angle of largest manipulability (task 5)."]
