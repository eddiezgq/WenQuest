注意:
  - ["线速度椭球的半轴单位是 m（即每 rad/s 关节速度对应的 m/s），角速度椭球的半轴没有单位。", "The semi-axes of a velocity ellipsoid are in m (m/s per rad/s of joint speed); those of the angular-velocity ellipsoid have no unit."]
  - ["逆解从 θ* 出发连续地求出，始终是同一支解；“够不着”表示这个位置在当前姿态下不可达。", "The inverse kinematics is followed continuously from θ*, so it always stays on the same branch; “out of reach” means the position cannot be reached with this orientation."]
  - ["椭球按 ‖θ̇‖ ≤ 1 计算，是保守的估计；关节速度上限的长方体能做到的更多一些。", "The ellipsoid is computed for ‖θ̇‖ ≤ 1 and is a conservative estimate; the box of joint-speed limits allows somewhat more."]
思考题:
  - ["手臂伸到 ρ = 0.9 m 时，J_v 的椭球为什么不退化？抓取任务应该看哪一个椭球？", "Why does the J_v ellipsoid not degenerate at ρ = 0.9 m? Which ellipsoid should a picking task look at?"]
