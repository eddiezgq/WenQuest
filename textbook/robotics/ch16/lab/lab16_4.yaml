    表头: ["ρ / m", "可操作度 w / m³", "最短半轴 / m", "条件数 κ", "θ₃ / (°)"]
    表头英文: ["ρ / m", "Manipulability w / m³", "Shortest semi-axis / m", "Condition number κ", "θ₃ / (°)"]
