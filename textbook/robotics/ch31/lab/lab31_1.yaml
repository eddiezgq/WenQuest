  - ["碳纤维管的数据取一种 0°/90° 铺层的卷制管，剪切模量只有 4.6 GPa，所以扭转的下沉会变大；强度按轴向抗拉强度算。", "The carbon tube is a roll-wrapped 0°/90° tube whose shear modulus is only 4.6 GPa, so the torsional part grows; its strength is the axial tensile strength."]
思考题:
  - ["钢管只要 1 mm 的壁就和铝管一样硬，而且不更重。工厂为什么还是用铝管？至少说出三条。", "A 1 mm steel wall is as stiff as the aluminium tube and no heavier. Why does the factory still use aluminium? Give at least three reasons."]
