注意:
  - ["本页只让 J2、J3 两个关节弹，手腕和铝管都当作刚性，所以第一阶频率比 31.5 节的六关节模型（表 31.5.1）高一点；阻尼比是示例值，实际要靠测试辨识。", "Only J2 and J3 are springs here; the wrist and tubes are rigid, so the first frequency is a little higher than the six-joint model of Table 31.5.1; the damping ratio is an example value that real robots get from tests."]
  - ["跳水板的抗弯刚度 EI 是示例值；真实的跳水板还有一个可以前后移动的支点，用来调节节奏。", "The springboard's bending stiffness EI is an example value; real boards also have a movable fulcrum to tune the rhythm."]
思考题:
  - ["J2 的刚度加倍，第一阶频率为什么只提高约两成？如果 J2、J3 都加倍呢？", "Why does doubling J2's stiffness raise the first frequency by only about a fifth? And doubling both J2 and J3?"]
