注意:
  - ["初值平面上其余四个关节取 θ* 的值，所以 θ* 本身（θ₁ = 30°、θ₃ = 90°）在图中，标为 θ*。网格比图 15.5.2 粗，统计数字会略有不同。", "The other four joints of the starts take the values of θ*, so θ* itself (θ₁ = 30°, θ₃ = 90°) is on the map, marked θ*. The grid is coarser than in Figure 15.5.1, so the statistics differ slightly."]
  - ["牛顿-拉夫森法远离解时对舍入误差极其敏感：不同的计算机、不同的程序，在颜色杂乱的区域可能得到不同的结果。", "Far from the solutions Newton-Raphson is extremely sensitive to rounding: in the mixed-colour regions different computers or programs may give different results."]
  - ["画一张吸引域图要算一千多次逆解，需要几秒钟。", "One basin map needs over a thousand inverse kinematics solutions and takes a few seconds."]
思考题:
  - ["实时控制中用上一个控制周期的关节角作初值，为什么几乎不会遇到本实验中“跳到别的解”的问题？什么时候仍然会？",
     "In real-time control the previous cycle's joint angles are used as the start; why does the “jump to another solution” of this lab hardly ever happen there? When can it still happen?"]
