    行英文: [["Exact inverse", "—", "", ""], ["Damped least squares", "0.01", "", ""], ["Damped least squares", "0.035", "", ""], ["Damped least squares", "0.1", "", ""], ["Jacobian transpose", "200", "", ""]]
