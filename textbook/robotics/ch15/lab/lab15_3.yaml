注意:
  - ["关节速度上限 120°/s 只用来判断，程序没有限幅；精确求逆的关节速度可以远远超过它。", "The 120°/s limit is only used for judging; the program does not clip speeds, and the exact inverse can exceed it by far."]
  - ["目标的最远点略超出臂长之和，此时任何方法都不可能零误差。", "The farthest target point lies just beyond the total reach; no method can have zero error there."]
  - ["望远镜场景按 5 倍速显示，全程 30 s。", "The telescope scene runs at 5× speed; it lasts 30 s."]
思考题:
  - ["望远镜的俯仰角如果允许超过 90°（越过天顶翻到另一侧），卫星从头顶飞过时方位轴还需要快速转动吗？这与 UR5e 穿过手腕奇异时换到“腕翻”构型有什么相似之处？",
     "If the telescope's elevation may exceed 90° (tipping over the zenith), must the azimuth still turn fast when a satellite passes overhead? How is this like the UR5e switching to the flipped wrist as it passes through the wrist singularity?"]
