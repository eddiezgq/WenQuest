注意:
  - ["每改一个参数，手臂回到起始形态 (0°, 57.3°, −28.6°)；迭代中不要拖动滑块。", "Every change of a parameter returns the arm to the start (0°, 57.3°, −28.6°); do not move sliders while it iterates."]
  - ["3R 臂只要求末端位置，有无穷多组解；不同步长可能停在不同的一组。", "The 3R arm is asked only for the tip position, so it has infinitely many solutions; different steps may end at different ones."]
  - ["力矩弧线按 kₛ = 100 N/m 的弹簧画出，长度与力矩成正比。", "The torque arcs are drawn for a spring of kₛ = 100 N/m, their length in proportion to the torque."]
思考题:
  - ["为什么步长超过 2/σ₁² 时，误差在“刚”的方向上越摆越大，而在“软”的方向上仍在减小？", "Above 2/σ₁², why does the error swing ever wider in the stiff direction while it still shrinks in the soft one?"]
