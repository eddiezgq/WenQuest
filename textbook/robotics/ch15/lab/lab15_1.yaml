注意:
  - ["每改一次起始姿态，手臂回到新的起点；迭代过程中不要拖动滑块。", "Each change of the start puts the arm at the new start; do not move sliders during the iteration."]
  - ["关节角显示在 −180° 到 180° 之外时，与加减 360° 后的角度代表同一个形态；判断是哪一组解时已经考虑了这一点。", "Joint angles outside −180° to 180° are the same posture as the angle ±360°; the solution numbering already allows for this."]
  - ["云台场景中三根电机轴交于相机中心；横滚角接近 ±90° 时偏航轴与俯仰轴共线，雅可比矩阵奇异（万向节锁）。", "In the gimbal scene the three motor axes meet at the camera centre; when the roll angle approaches ±90° the yaw and pitch axes line up and the Jacobian becomes singular (gimbal lock)."]
思考题:
  - ["如果误差改用位置差 p_d − p 与姿态误差的指数坐标（都在 {s} 中），迭代还会二次收敛吗？会不会收敛到另一组解？", "If the error is taken as the position difference p_d − p and the exponential coordinates of the orientation error (both in {s}), does the iteration still converge quadratically? Could it find a different solution?"]
