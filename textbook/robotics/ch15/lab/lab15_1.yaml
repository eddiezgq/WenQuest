    表头: ["起始姿态", "迭代次数", "最终关节角 / (°)", "表 14.5.1 中的编号", "肩 · 肘 · 腕"]
    表头英文: ["Start", "Iterations", "Final joint angles / (°)", "Number in Table 14.5.1", "Shoulder · elbow · wrist"]
    行: [["0 当前关节角", "", "", "", ""], ["1 大臂竖直", "", "", "", ""], ["2 习题 14.5.5", "", "", "", ""], ["3 零位", "", "", "", ""]]
    行英文: [["0 current", "", "", "", ""], ["1 upper arm up", "", "", "", ""], ["2 Exercise 14.5.5", "", "", "", ""], ["3 home zero", "", "", "", ""]]
  - 标题: ["表 2  逐步迭代的误差（起始姿态 0）", "Table 2  Error step by step (start 0)"]
    表头: ["k", "‖ω_b‖ / rad", "‖v_b‖ / m", "‖V_b‖ 的指数"]
    表头英文: ["k", "‖ω_b‖ / rad", "‖v_b‖ / m", "Exponent of ‖V_b‖"]
