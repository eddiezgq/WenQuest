# 实验 15.1 的指导书与报告模板。目的、场景、参数、任务取自 lab15_1.js。
原理:
  - ["位姿的误差是一个位移：T_bd = T⁻¹T_d。它的对数给出误差旋量 V_b = (ω_b, v_b)，在当前末端坐标系 {b} 中表示；V_b = 0 当且仅当到达目标，‖ω_b‖ 是姿态误差角。",
     "The pose error is a displacement, T_bd = T⁻¹T_d. Its logarithm gives the error twist V_b = (ω_b, v_b), expressed in the current end-effector frame {b}; V_b = 0 exactly when the target is reached, and ‖ω_b‖ is the orientation error angle."]
  - 式: "[V_b] = log(T(θ)⁻¹ T_d)          (15.1.2)"
  - 式: "J_bi = [Ad_{e^{−[B_n]θ_n}⋯e^{−[B_{i+1}]θ_{i+1}}}] B_i，J_bn = B_n          (15.1.4)"
  - 式: "J_b(θ⁽ᵏ⁾) Δθ = V_b⁽ᵏ⁾，θ⁽ᵏ⁺¹⁾ = θ⁽ᵏ⁾ + Δθ          (15.1.8)"
  - ["在解附近，物体雅可比与误差旋量的真实导数只差一个与误差成正比的量，所以迭代二次收敛：误差的指数每步约翻一番（定理 15.1.2）。迭代给出哪一组解取决于起点；J_b 奇异时迭代无法进行。",
     "Near a solution the body Jacobian differs from the true derivative of the error twist only by a term proportional to the error, so the iteration converges quadratically: the exponent of the error roughly doubles each step (Theorem 15.1.2). Which solution it finds depends on the start; when J_b is singular the step cannot be computed."]
步骤:
  - ["打开实验 15.1，场景“UR5e 位姿逆解”，起始姿态 0（当前关节角）。按“求解”，记录迭代次数、最终关节角和它在表 14.5.1 中的编号，填入表 1（任务 1）。",
     "Open Lab 15.1, scene “UR5e pose IK”, start 0 (current angles). Press “Solve” and record the iterations, the final joint angles and its number in Table 14.5.1 in Table 1 (task 1)."]
  - ["起始姿态依次改为 1、2，重复上一步（任务 2）。比较收敛到的解和所用的迭代次数。",
     "Change the start to 1 and then 2 and repeat (task 2). Compare the solutions found and the iterations needed."]
  - ["起始姿态改为 3（零位），按“迭代一步”，读出 J_b 的最小奇异值，说明为什么无法迭代（任务 3）。",
     "Change the start to 3 (home zero) and press “One step”; read the smallest singular value of J_b and explain why the iteration cannot proceed (task 3)."]
  - ["起始姿态改回 0，按“重置”，再逐次按“迭代一步”，把每一步的 ‖ω_b‖、‖v_b‖ 填入表 2，观察误差指数的变化（任务 4）。",
     "Set the start back to 0, press “Reset”, then press “One step” repeatedly; enter ‖ω_b‖ and ‖v_b‖ of every step in Table 2 and watch how the exponent changes (task 4)."]
  - ["切换到“手持云台”，按“求解”，记录迭代次数和三个电机的角度；再把花移到别处重复（任务 5）。",
     "Switch to “Handheld gimbal”, press “Solve”, record the iterations and the three motor angles; move the flower and repeat (task 5)."]
