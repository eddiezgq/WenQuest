思考题:
  - ["端水杯时，如果以“手到架子”为主任务而架子够不着，主任务本身就做不到。这时迭代的结果有什么特点？实际的控制器应当怎样处理“主任务不可行”的情形？",
     "With “hand on shelf” as the primary task and the shelf out of reach, the primary task itself cannot be met. What does the iteration do then? How should a real controller handle an infeasible primary task?"]
