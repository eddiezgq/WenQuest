  - ["关节角在等高线图上显示为 (−180°, 180°]，路径越过边界时从对边接着画。", "Joint angles are shown in (−180°, 180°]; a path crossing an edge continues from the opposite edge."]
  - ["“与最近的极小点之差”以 rad 为单位；梯度的范数小于 10⁻⁸ 时停止（与算例 8.1.3 相同）。", "“Distance to the nearest minimum” is in rad; the iteration stops when the gradient norm falls below 10⁻⁸ (as in Example 8.1.3)."]
  - ["改变任一滑块都会重新开始；先设好参数再按“迭代”。", "Moving any slider restarts; set the parameters first, then press “Iterate”."]
思考题:
  - ["表 1 中 α = 3 与 α = 1 的步数之比约为多少？用定理 8.1.6 的倍数 max|1 − αλ_i| 解释。", "What is the ratio of steps between α = 3 and α = 1 in Table 1? Explain with the factor max|1 − αλ_i| of Theorem 8.1.6."]
  - ["表 2 中梯度下降的步数大致与 κ 成正比。为什么？（提示：当 κ 很大时，ln((κ − 1)/(κ + 1)) ≈ −2/κ。）", "Why are the gradient-descent steps in Table 2 roughly proportional to κ? (Hint: for large κ, ln((κ − 1)/(κ + 1)) ≈ −2/κ.)"]
