注意:
  - ["货架已按 AGV 的半径膨胀，所以路径可以贴着膨胀后的边界走；真实的 AGV 还要再留安全余量。", "The shelves are already inflated by the AGV radius, so the path may touch the inflated boundary; a real AGV needs an extra safety margin."]
  - ["起点必须在 R₁ 内部、终点必须在 R₂ 内部，障碍函数法才有严格可行的初值。", "The start must lie inside R₁ and the goal inside R₂, so that the barrier method has a strictly feasible starting point."]
