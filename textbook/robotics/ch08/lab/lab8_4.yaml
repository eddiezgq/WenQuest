# 实验 8.4 的指导书与报告模板。目的、场景、参数、任务取自 lab8_4.js。
原理:
  - ["凸集：任意两点之间的线段都在集合内。凸函数：弦总在图像上方（詹森不等式）。凸优化问题的每个局部极小点都是全局极小点（定理 8.4.4）。",
     "A convex set contains the segment between any two of its points; a convex function lies below its chords (Jensen's inequality). Every local minimum of a convex problem is global (Theorem 8.4.4)."]
  - ["L 形的可通行区域不是凸集。拆成两个凸区域 R₁、R₂，规定前一半航点在 R₁、后一半在 R₂、交界航点在两者的交集里，相邻航点间的线段就一定在可通行区域内，路径规划成为一个凸二次规划。",
     "The L-shaped free space is not convex. Split it into convex regions R₁ and R₂, put the first waypoints in R₁, the last in R₂ and the junction waypoint in both: every segment then lies in the free space and path planning becomes a convex QP."]
  - 式: "障碍函数法：min t·f(x) − Σ log(bᵢ − aᵢᵀx)；  f(x*(t)) − p* ≤ m/t          (8.4.8)、(8.4.9)"
  - ["t 从 1 开始，每次乘 10，以上一次的解为初值用牛顿法定心；这些解连成中心路径，随 t 增大逼近最优解。",
     "Start at t = 1 and multiply by 10 each time, re-centring by Newton's method from the previous solution; the centres form the central path, which approaches the optimum as t grows."]
步骤:
  - ["打开实验 8.4，场景“凸走廊中的 AGV”。把 lg t 从 0 逐次加到 5，记录每个 t 下的 m/t、拐角航点 x₅ 和路径长度，填入表 1；使 m/t < 0.01（任务 1）。",
     "Open Lab 8.4, scene “AGV in convex corridors”. Raise lg t from 0 to 5; record m/t, the corner waypoint x₅ and the path length for each t in Table 1; make m/t < 0.01 (task 1)."]
  - ["保持 t = 10⁵，改变起点和终点（终点移到右侧走廊顶部附近，任务 2），观察拐角航点是否改变，并解释原因。",
     "Keep t = 10⁵ and move the start and the goal (goal near the top of the right corridor, task 2); does the corner waypoint move? Explain."]
  - ["切换到“碗与蛋托”，形状选 0（碗），从三个不同位置放球，记录落点，填入表 2（任务 3）。",
     "Switch to “Bowl and egg tray”, shape 0 (bowl); drop the ball from three positions and record where it stops in Table 2 (task 3)."]
  - ["形状选 1（蛋托），重复上一步；找到一个使小球停在不是最低的凹坑里的放球位置（任务 4）。", "Shape 1 (egg tray): repeat; find a drop position where the ball stops in a dimple that is not the lowest (task 4)."]
