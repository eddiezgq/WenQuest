注意:
  - ["改变任一滑块都会让手臂回到自然形态，需要重新按“求解”。", "Moving any slider returns the arm to its natural posture; press “Solve” again."]
  - ["乘子的符号取决于拉格朗日函数的写法；本实验用 L = f + λᵀh，与正文一致。", "The sign of a multiplier depends on how the Lagrangian is written; this lab uses L = f + λᵀh, as in the text."]
  - ["目标点离工作空间边界太近时，牛顿法可能不收敛，界面会显示“未收敛”。", "If the target is too close to the edge of the workspace, Newton's method may fail; the screen then shows “not converged”."]
思考题:
  - ["k₁ 加大后，为什么手的力也变了？用最小势能原理解释。", "Why does the hand force change when k₁ grows? Explain with the principle of minimum potential energy."]
