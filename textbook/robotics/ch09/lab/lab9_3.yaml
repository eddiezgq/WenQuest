    行英文: [["1", "Measure", "", "", "", "", ""], ["2", "Move", "—", "", "", "", ""], ["3", "Measure", "", "", "", "", ""], ["4", "Move", "—", "", "", "", ""], ["5", "Measure", "", "", "", "", ""], ["6", "Move", "—", "", "", "", ""], ["7", "Measure", "", "", "", "", ""]]
