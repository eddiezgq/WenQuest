# 实验 9.3 的指导书与报告模板。目的、场景、参数、任务取自 lab9_3.js。
原理:
  - ["贝叶斯公式：后验正比于似然乘以先验，再归一化使各格概率之和为 1。", "Bayes' rule: the posterior is proportional to likelihood times prior, normalized so the cells sum to 1."]
  - 式: "Pr(B_j | A) = Pr(A | B_j) Pr(B_j) / Σ_i Pr(A | B_i) Pr(B_i)          (9.3.5)"
  - ["全概率公式处理运动：前进以后在第 j 格的概率，是从各格出发走到第 j 格的概率之和。", "The law of total probability handles motion: the chance of being in cell j after a move sums over every cell it could have come from."]
  - 式: "b'_j = slip · b_j + (1 − 2 slip) · b_(j−1) + slip · b_(j−2)          (9.3.6)"
  - ["测量使分布变尖（得到信息），运动使分布变平（损失信息）。", "Measuring sharpens the distribution (information gained); moving flattens it (information lost)."]
步骤:
  - ["场景“走廊里的 AGV”，取默认参数（0.9、0.1、0.1）。按“重置”，再按一次“测量”，记录四个标志格的概率之和和最可能的格（任务 1，表 1 第 1 行）。", "Scene “AGV in an aisle”, default parameters (0.9, 0.1, 0.1). Press Reset, then Measure once; record the total on the four tags and the most likely cell (task 1, Table 1 row 1)."]
  - ["交替按“前进一格”和“测量”，每一步记录读数、最可能的格及其概率、AGV 实际所在格的概率（表 1）。", "Alternate Move and Measure; at each step record the reading, the most likely cell with its probability, and the probability of the true cell (Table 1)."]
  - ["把参数改为 0.95、0.05、0.05，重复第 1、2 步，直到实际所在格的概率超过 0.8（任务 2），比较两组参数所需的步数。", "Set 0.95, 0.05, 0.05 and repeat steps 1–2 until the true cell exceeds 0.8 (task 2); compare the number of steps for the two settings."]
  - ["切换到“质检报警”，按算例 9.3.1 设置缺陷率 1%、检出率 0.95、误报率 0.05，读出后验（任务 3）；再把缺陷率改为 10% 和 0.1%，填表 2。", "Switch to “Inspection alarm”, set 1%, 0.95, 0.05 as in Example 9.3.1 and read the posterior (task 3); then try 10% and 0.1% defects and fill in Table 2."]
