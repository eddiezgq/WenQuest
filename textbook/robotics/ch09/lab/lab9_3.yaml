注意:
  - ["读数和 AGV 的实际走格由固定种子的随机数产生，按“重置”后重复相同的序列；改变参数会自动重置。", "Readings and the true moves come from fixed-seed random numbers, repeated after Reset; changing a parameter resets the lab."]
  - ["走到第 19 格以后 AGV 停在最后一格，此后的概率分布不再有意义。", "Beyond cell 19 the AGV stays in the last cell; the distribution is no longer meaningful there."]
思考题:
  - ["算例 9.3.2 中第 6、7 格的标志紧挨着，这对 AGV 认出自己的位置有什么帮助？如果四个标志等间距排列，会怎样？", "The tags on cells 6 and 7 are adjacent. How does that help? What if the four tags were evenly spaced?"]
  - ["长时间只前进不测量，各格的概率会变成什么样？为什么？", "If the AGV only moves and never measures, what happens to the distribution, and why?"]
