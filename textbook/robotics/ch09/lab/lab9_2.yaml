注意:
  - ["关节角的标准差在公式中要化为弧度；界面已自动换算。", "Joint-angle stds must be in radians in the formula; the lab converts them."]
  - ["椭圆和点云都相对末端放大显示，读数栏中的数值是实际大小。", "The ellipse and cloud are drawn magnified about the tip; the readouts give true sizes."]
  - ["蒙特卡洛用固定种子，最多 3000 次；样本标准差本身约有 ±2% 的随机波动。", "Monte Carlo uses a fixed seed and at most 3000 runs; the sample std itself fluctuates by about ±2%."]
思考题:
  - ["二维的 1 倍椭圆只包含约 39% 的点，为什么比一维 ±σ 的 68% 少？", "Why does the 2-D 1σ ellipse hold only about 39% of the points, fewer than the 68% of ±σ in 1-D?"]
  - ["误差加大以后，蒙特卡洛的均值为什么总是偏向基座？", "With large errors, why does the Monte Carlo mean always move towards the base?"]
