注意:
  - ["每次改变参数后需重新按“开始”；随机数用固定种子，同样的参数得到同样的结果。", "Press Start again after changing a parameter; the fixed seed makes runs repeatable."]
  - ["模拟最多 3000 次，样本标准差本身约有 ±3% 的波动，比较时应留有余量。", "At most 3000 runs: the sample std fluctuates by about ±3%, so allow some margin when comparing."]
思考题:
  - ["没有离谱分数（p = 0）时，三种方法哪个最准？为什么稳健方法要付出这点代价？", "With no wild scores (p = 0), which estimator is best? Why do robust methods pay this small price?"]
  - ["两个传感器精度相同时，最优权重是多少？融合后的标准差是单个的几分之几？", "With two equally precise sensors, what is the best weight, and how much smaller is the fused std?"]
