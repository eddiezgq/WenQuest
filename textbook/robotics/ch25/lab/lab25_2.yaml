# 实验 25.2 的指导书与报告模板。目的、场景、参数、任务取自 lab25_2.js。
原理:
  - ["反向递推（式 (25.2.1)）：从末端出发，每个连杆的牛顿-欧拉方程给出关节 i 传给连杆 i 的力旋量：", "Backward recursion (Eq. 25.2.1): from the tip inward, each link's Newton–Euler equation gives the wrench that joint i passes to link i:"]
  - 式: "ℱ_i = [Ad_{T_{i+1,i}}]ᵀℱ_{i+1} + 𝒢_i𝒱̇_i − [ad_{𝒱_i}]ᵀ𝒢_i𝒱_i"
  - ["关节力矩是 ℱ_i 在关节轴上的分量，加上电机转子的惯性力矩（式 (25.2.2)、(25.2.3)）：", "The joint torque is the component of ℱ_i along the joint axis, plus the rotor's inertial torque (Eqs. 25.2.2 and 25.2.3):"]
  - 式: "τ_i = 𝒜_iᵀℱ_i + k_r²J_m θ̈_i"
  - ["ℱ_i 的其余五个分量由轴承和减速器承受：沿轴的力（轴向力）、垂直于轴的力（径向力）、垂直于轴的力矩（弯曲或倾覆力矩，相对关节坐标系的原点）。", "The other five components of ℱ_i are carried by the bearings and gearbox: the force along the axis (axial), the force across it (radial) and the moment across it (tilting, about the joint frame's origin)."]
步骤:
  - ["场景“静止地拿着”：装 3.8 kg，换一个姿态，比较递推与 MuJoCo 的关节力矩和关节力旋量（任务 1），填入表 1。", "Scene “Holding still”: with 3.8 kg and a new pose, compare the recursion's joint torques and joint wrenches with MuJoCo (task 1), Table 1."]
  - ["看关节 1，改变姿态和负载，读出轴向力，与手臂（16.99 kg）加负载的重力比较（任务 2），填入表 2。", "Inspect joint 1, change the pose and payload, and compare its axial force with the weight of the arm (16.99 kg) plus the payload (task 2), Table 2."]
  - ["θ₂ = θ₃ = 0、θ₄ = −90°，负载依次为 0 和 5 kg，读出关节 2 的力矩（任务 3），填入表 3。", "With θ₂ = θ₃ = 0 and θ₄ = −90°, set the payload to 0 and 5 kg and record joint 2's torque (task 3), Table 3."]
  - ["场景“上下料动作中的关节受力”：装 3.8 kg，看关节 2，按“开始”，读出弯曲力矩与径向力的峰值以及只有重力时的值（任务 4），填入表 4。", "Scene “Joint loads during the loading move”: with 3.8 kg, inspect joint 2, press Start and record the peak tilting moment and radial force and their gravity-only values (task 4), Table 4."]
