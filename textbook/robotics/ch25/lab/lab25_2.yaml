注意:
  - ["手臂的质量、惯量来自书中的模型（MuJoCo Menagerie），不含基座；转子等效惯量是模型中的 armature = 0.1 kg·m²。负载是算例 23.2.2 的夹爪 + 毛坯按质量等比缩放，是示意值。", "The arm's masses and inertias come from the book's model (MuJoCo Menagerie), base excluded; the rotor inertia is the model's armature of 0.1 kg·m². The payload is Example 23.2.2's gripper and blank scaled by mass, an illustrative value."]
  - ["弯曲力矩是相对关节坐标系原点（模型中 body 坐标系的原点）计算的；轴承的实际位置不同，弯曲力矩也不同，但力和绕轴力矩不变。", "The tilting moment is taken about the joint frame's origin (the model's body origin); about the real bearing position it would differ, while the forces and the moment about the axis would not."]
思考题:
  - ["关节 1 的轴向力等于整条手臂的重力，与姿态无关；它的弯曲力矩却随姿态变化很大。选关节 1 的轴承时，哪个量更要紧？", "Joint 1's axial force equals the whole arm's weight whatever the pose, but its tilting moment varies greatly with pose. Which matters more when choosing joint 1's bearing?"]
