# 实验 25.1 的指导书与报告模板。目的、场景、参数、任务取自 lab25_1.js。
原理:
  - ["连杆坐标系 {i} 固定在连杆 i 上，原点在关节 i 的轴上；关节 i 的旋量轴在 {i} 中是常数 𝒜_i = (ω_i, 0)。相邻两个连杆坐标系的位姿为：", "Frame {i} is fixed to link i with its origin on joint i's axis; joint i's screw axis in {i} is the constant 𝒜_i = (ω_i, 0). The pose between neighbouring frames is:"]
  - 式: "T_{i,i−1} = e^{−[𝒜_i]θ_i} M_{i,i−1}"
  - ["前向递推（式 (25.1.3)、(25.1.4)）：从基座出发，每过一个关节，把上一个连杆的运动旋量换到本连杆的坐标系，再加上这个关节自己的转动：", "Forward recursion (Eqs. 25.1.3 and 25.1.4): start at the base, carry the previous link's twist into this link's frame and add this joint's own motion:"]
  - 式: "𝒱_i = [Ad_{T_{i,i−1}}]𝒱_{i−1} + 𝒜_i θ̇_i，𝒱̇_i = [Ad_{T_{i,i−1}}]𝒱̇_{i−1} + [ad_{𝒱_i}]𝒜_i θ̇_i + 𝒜_i θ̈_i"
  - ["𝒱̇_i 是运动旋量分量的导数。连杆原点的加速度还要加上 ω × v（式 (25.1.6)）；关节都匀速转动时它一般也不为零。取 𝒱̇₀ = (0, −𝔤)（基座以 𝔤 向上加速）代替重力，MuJoCo 也是这样做的。", "𝒱̇_i is the derivative of the twist's components. The acceleration of the link origin adds ω × v (Eq. 25.1.6); it is generally non-zero even with every joint at constant speed. Taking 𝒱̇₀ = (0, −g) (the base accelerating upward at g) replaces gravity; MuJoCo does the same."]
步骤:
  - ["场景“关节匀速转动”：只让关节 1 以 1 rad/s 转动，按“开始”，读出六个连杆的角速度（任务 1），填入表 1。", "Scene “Joints at constant speed”: turn joint 1 only at 1 rad/s, press Start and record the six links' angular rates (task 1) in Table 1."]
  - ["只让关节 2、3 各以 1 rad/s 转动，读出各连杆的角速度（任务 2），填入表 1；再试关节 2 为 1 rad/s、关节 3 为 −1 rad/s。", "Turn joints 2 and 3 only at 1 rad/s each and record the angular rates (task 2) in Table 1; then try joint 2 at 1 rad/s and joint 3 at −1 rad/s."]
  - ["按表 2 设置角速度，读出连杆 6 原点（腕 3 中心）的加速度（含与不含“向上 𝔤”），找出使它超过 1 m/s² 的一组（任务 3）。", "Set the rates of Table 2, record the acceleration of link 6's origin (the wrist 3 centre) (with and without the upward g) and find a setting that makes it exceed 1 m/s² (task 3)."]
  - ["场景“上下料动作中的速度”：按“开始”，读出 TCP 速度的最大值和时刻，以及递推与 MuJoCo 的最大差别（任务 4），填入表 3。", "Scene “Speeds during the loading move”: press Start and record the peak TCP speed, its time, and the largest difference between the recursion and MuJoCo (task 4) in Table 3."]
