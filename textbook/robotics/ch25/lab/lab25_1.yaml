注意:
  - ["关节角、角速度由页面直接写进 MuJoCo（运动学回放），MuJoCo 只用来算各连杆的运动作比较；递推用的连杆数据也从同一个模型读出。", "The joint angles and rates are written into MuJoCo directly (kinematic playback); MuJoCo is used only to compute the links' motion for comparison, and the recursion reads its link data from the same model."]
  - ["上下料动作的位姿和时间取自第 22 章（算例 22.1.1），放慢 2 倍播放；速度的数值与播放快慢无关。", "The poses and timing of the loading move come from Chapter 22 (Example 22.1.1) and are played back 2x slower; the speeds do not depend on the playback rate."]
思考题:
  - ["关节都匀速转动时，法兰的加速度是从哪里来的？把式 (25.1.4) 中的 [ad_𝒱]𝒜θ̇ 项和第 10 章的向心加速度、科氏加速度对照一下。", "Where does the flange's acceleration come from when every joint turns steadily? Compare the [ad_𝒱]𝒜θ̇ term of Eq. (25.1.4) with the centripetal and Coriolis accelerations of Chapter 10."]
