# 实验 25.5 的指导书与报告模板。目的、场景、参数、任务取自 lab25_5.js。
原理:
  - ["每一时刻用牛顿-欧拉递推（算法 25.2.1）由 θ、θ̇、θ̈ 算出六个关节的力矩，与关节的力矩上限比较：", "At every instant the recursive Newton–Euler algorithm (Algorithm 25.2.1) gives the six joint torques from θ, θ̇, θ̈; compare them with the joints' torque limits:"]
  - 式: "|τ_j(t)| ≤ τ_max,j，UR5e：关节 1～3 为 150 N·m，关节 4～6 为 28 N·m"
  - ["力矩对负载的质量是线性的（线性参数化，定理 24.3.4）；动作时间缩短为 1/k 时，惯性项和速度项变为 k² 倍，重力项不变。", "The torques are linear in the payload's mass (linear parameterization, Theorem 24.3.4); shortening the move by a factor k multiplies the inertial and velocity terms by k² and leaves gravity unchanged."]
  - ["负载的重心离法兰越远，腕部关节的力臂越长；腕部关节的上限只有肩、肘的五分之一左右，常常最先超限。", "The farther the payload's centre of gravity from the flange, the longer the wrist joints' lever arms; their limits are only about a fifth of the shoulder's and elbow's, so they often hit them first."]
步骤:
  - ["负载 3.8 kg、T = 1.318 s、r = 0，按“开始”，读出六个关节的峰值与上限之比（任务 1），填入表 1。", "With 3.8 kg, T = 1.318 s and r = 0, press Start and record the six peak-to-limit ratios (task 1) in Table 1."]
  - ["T = 1.318 s，逐步加大负载，直到恰有一个关节超限；记下是哪个关节、负载多大（任务 2），填入表 1。", "With T = 1.318 s, raise the payload step by step until exactly one joint is over its limit; record which joint and the payload (task 2) in Table 1."]
  - ["负载 5 kg，逐步缩短 T，找出不超限的最短动作时间，并读出峰值速度（任务 3），填入表 2。", "With 5 kg, shorten T step by step to find the shortest move without exceeding any limit, and record the peak joint speed (task 3) in Table 2."]
  - ["负载 5 kg、T = 1.318 s，逐步增大重心外移 r，找出开始超限的 r 和关节（任务 4），填入表 2。", "With 5 kg and T = 1.318 s, increase the offset r step by step to find where a joint first exceeds its limit and which joint (task 4) in Table 2."]
数据表:
  - 标题: ["表 1  峰值与上限之比（T = 1.318 s，r = 0）", "Table 1  Peak-to-limit ratios (T = 1.318 s, r = 0)"]
    表头: ["负载 / kg", "关节 1", "关节 2", "关节 3", "关节 4", "关节 5", "关节 6", "最先超限的关节"]
    表头英文: ["Payload / kg", "Joint 1", "Joint 2", "Joint 3", "Joint 4", "Joint 5", "Joint 6", "First over its limit"]
    行: [["0", "", "", "", "", "", "", ""], ["3.8", "", "", "", "", "", "", ""], ["8", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", ""]]
  - 标题: ["表 2  加快动作、外移重心（负载 5 kg）", "Table 2  Faster moves and offset centres of gravity (5 kg)"]
    表头: ["T / s", "r / m", "峰值最大的关节与比值", "峰值速度 / (°/s)", "是否超限"]
    表头英文: ["T / s", "r / m", "Joint with the largest ratio, and the ratio", "Peak joint speed / (°/s)", "Over a limit?"]
    行: [["1.318", "0", "", "", ""], ["0.8", "0", "", "", ""], ["", "0", "", "", ""], ["1.318", "0.2", "", "", ""], ["1.318", "", "", "", ""]]
注意:
  - ["力矩上限取 UR 公司资料中各尺寸关节的力矩，是关节硬件的数值；实际应用中还受安全设置的力、功率限制，可用的力矩更小。负载按夹爪 + 毛坯等比缩放，是示意值。", "The limits are the joint-size torques from Universal Robots' documentation, i.e. the hardware values; in an application the safety settings for force and power leave less usable torque. The payload is the gripper and blank scaled by mass, an illustrative value."]
  - ["没有计入关节摩擦（第 26 章）；实际的力矩还要大一些。动作时间短于 1.077 s 时关节 1 的速度超过 180 °/s，那些结果只作“假如”。", "Joint friction (Chapter 26) is not included, so real torques are somewhat larger. With T below 1.077 s joint 1 exceeds 180 °/s; treat those runs as what-ifs."]
思考题:
  - ["关节 4 的力矩并不比关节 2 大，为什么它反而先超限？如果你是 UR 的设计师，会把腕部电机加大吗？代价是什么？", "Joint 4's torque is far smaller than joint 2's, so why does it exceed its limit first? If you were designing the UR5e, would you fit a bigger wrist motor, and what would it cost?"]
