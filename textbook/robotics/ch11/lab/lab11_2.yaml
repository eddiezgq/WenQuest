注意:
  - ["瞬时自由度只反映此刻能不能“动一点”，在奇异位置会比一般位置大。", "The instantaneous mobility tells whether the mechanism can move a little right now; at singular positions it exceeds the generic value."]
  - ["五杆机器人在某些输入下无法装配（两根连杆够不到），界面会给出提示。", "For some inputs the five-bar cannot be assembled (the couplers cannot meet); the screen says so."]
思考题:
  - ["为什么剪叉升降台加多少级，自由度都还是 1？用式 (11.2.4) 解释每加一级增加的关节自由度和回路数。", "Why does a scissor lift keep one degree of freedom however many stages it has? Use Eq. (11.2.4) to count joints and loops per stage."]
