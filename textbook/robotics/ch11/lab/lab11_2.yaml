    行英文: [["Five-bar", "", "", "", ""], ["Parallelogram, θ₁ = 60°", "", "", "", ""], ["Parallelogram + extra crank", "", "", "", ""], ["Parallelogram, θ₁ = 0°", "", "", "", ""], ["Parallelogram, θ₁ = 5°", "", "", "", ""], ["Scissor lift", "", "", "", ""]]
