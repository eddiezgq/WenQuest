# 实验 11.4 的指导书与报告模板。目的、场景、参数、任务取自 lab11_4.js。
原理:
  - ["工作空间是末端能够到达的点的集合。可达工作空间：至少以一种姿态能到达的点；灵巧工作空间：以任意姿态都能到达的点。灵巧工作空间是可达工作空间的一部分。",
     "The workspace is the set of points the end can reach. Reachable workspace: points reached in at least one orientation; dexterous workspace: points reached in every orientation. The dexterous workspace lies inside the reachable one."]
  - ["扫描：在关节限位内随机抽取关节变量，算出末端位置，样本点组成可达工作空间的近似。", "Sampling: draw random joint values within the limits; the end points approximate the reachable workspace."]
  - ["UR5e 的灵巧性检查：法兰绕自身法线的转动由关节 6 完成，所以只需检查 100 个法兰法线方向。对每个方向用解析逆运动学判断有没有解；100 个都有解即在灵巧工作空间内。",
     "Dexterity check on the UR5e: turning about the flange normal is done by joint 6, so 100 normal directions suffice. Each is tested with the analytic inverse kinematics; all 100 solvable means dexterous."]
  - 式: "体积 V = Σ 2πρ Δρ Δz（关节 1 可整周转动，工作空间绕基座轴线对称）"
  - ["SCARA 的水平内径由关节 2 的限位决定：r_min = √(L₁² + L₂² + 2L₁L₂ cos θ₂max)。", "The SCARA's inner radius is set by joint 2's limit: r_min = √(L₁² + L₂² + 2L₁L₂ cos θ₂max)."]
步骤:
  - ["场景“UR5e”：按“扫描工作空间”（任务 1），旋转视角观察点云的形状，注意基座轴线附近和手臂正上方的情况。", "Scene “UR5e”: press “Sample the workspace” (task 1), rotate the view and look at the cloud, especially near the base axis."]
  - ["调关节使“能到达的法兰方向”为 100 / 100（任务 2），记录关节角、法兰位置；再把手臂伸到离轴线 0.9 m 以外（任务 3），记录方向数。填入表 1。", "Make the readout 100 / 100 (task 2) and record the joints and position; then reach beyond 0.9 m (task 3) and record the count. Fill in Table 1."]
  - ["场景“SCARA”：扫描（任务 4），读出样本离轴线的最近和最远距离，与 r_min、L₁ + L₂ 比较，填入表 2。", "Scene “SCARA”: sample (task 4), read the nearest and farthest sample distances and compare with r_min and L₁ + L₂ (Table 2)."]
  - ["生活场景：扫描手腕的可达范围（任务 5），读出离肩部的最大距离，与自己手臂的长度比较。", "Everyday scene: sample the wrist's reach (task 5), read its largest distance from the shoulder and compare with your own arm."]
数据表:
  - 标题: ["表 1  UR5e 法兰中心的灵巧性", "Table 1  Dexterity of the UR5e flange centre"]
    表头: ["关节角 θ₁–θ₆ / °", "法兰 (x, y, z) / m", "离轴线 / m", "可到达方向数"]
    表头英文: ["Joint angles θ₁–θ₆ / °", "Flange (x, y, z) / m", "From the axis / m", "Directions that work"]
    行: [["0, −90, 90, −90, −90, 0", "", "", ""], ["0, 0, 0, −45, 90, 0", "", "", ""], ["", "", "", ""]]
  - 标题: ["表 2  SCARA 的水平范围", "Table 2  The SCARA's horizontal range"]
    表头: ["量", "扫描结果 / m", "公式 / m"]
    表头英文: ["Quantity", "Sampled / m", "Formula / m"]
    行: [["最小半径", "", ""], ["最大半径", "", "0.6"]]
    行英文: [["Smallest radius", "", ""], ["Largest radius", "", "0.6"]]
注意:
  - ["扫描是随机的，点云只是工作空间的近似；样本越多越接近，边界附近的点最稀。", "Sampling is random; the cloud only approximates the workspace and is thinnest near the boundary."]
  - ["这里没有考虑手臂与自身、与地面的碰撞，实际可用的工作空间更小。", "Self-collision and the floor are ignored; the usable workspace is smaller."]
思考题:
  - ["为什么 UR5e 基座轴线附近有一个细圆柱怎么也到不了？它的半径与哪两个尺寸有关？", "Why is there a thin cylinder round the UR5e's base axis that can never be reached? Which two dimensions set its radius?"]
