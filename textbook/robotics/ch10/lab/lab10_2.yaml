# 实验 10.2 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab10_2.js。
原理:
  - ["在固连于参考系的直角坐标系中，坐标轴不动，速度和加速度的分量就是坐标对时间的一阶、二阶导数（定理 10.2.2，式 (10.2.5)、(10.2.7)）。",
     "In a Cartesian frame fixed to the reference frame the axes do not move, so the components of velocity and acceleration are the first and second time derivatives of the coordinates (Theorem 10.2.2, Eqs. (10.2.5), (10.2.7))."]
  - 式: "x = xc + a cos ωt，y = yc + b sin ωt；  v = (−aω sin ωt, bω cos ωt)，  a = −ω² (r − r_c)          (10.2.9)、(10.2.10)"
  - ["速率的变化率等于加速度在速度方向上的投影：dv/dt = v·a / v（式 (10.2.8)）。v 与 a 的夹角小于 90° 时速率增大，大于 90° 时减小。",
     "The rate of change of speed is the projection of the acceleration on the velocity: dv/dt = v·a / v (Eq. (10.2.8)). The speed grows when the angle between v and a is below 90° and falls when it is above."]
  - ["把各时刻的速度矢量平移到同一起点，端点画出的曲线叫速度图；加速度就是速度图上动点的速度，沿速度图的切线。",
     "Moving all velocity vectors to one origin, their tips trace the hodograph; the acceleration is the velocity of that tip, tangent to the hodograph."]
步骤:
  - ["选择场景“SCARA 涂胶椭圆”，设 a = 0.12 m、b = 0.08 m、T = 4 s。先按式 (10.2.10) 手算 t = 0.5 s 时的速度和加速度，填入表 1。",
     "Choose “SCARA glue ellipse” with a = 0.12 m, b = 0.08 m, T = 4 s. Compute the velocity and acceleration at t = 0.5 s with Eq. (10.2.10) and enter them in Table 1."]
  - ["按“开始”运行一整圈，读出速率的最大值和最小值，与 aω、bω 比较（任务 1）。注意速率最大处和最小处分别在椭圆的哪里。",
     "Press Start for one full loop, read the largest and smallest speed and compare with aω, bω (task 1). Note where on the ellipse they occur."]
  - ["观察速度图：它也是一个椭圆，半轴为 aω、bω；加速度箭头始终沿速度图的切线。",
     "Watch the hodograph: it is also an ellipse with semi-axes aω, bω; the acceleration arrow is always tangent to it."]
  - ["把 a、b 都调为 0.10 m，运行，验证速率恒定、加速度指向中心（任务 2）；记入表 2。",
     "Set a and b to 0.10 m, run, and check that the speed is constant and the acceleration points to the centre (task 2); record in Table 2."]
  - ["切换到“投篮”，用默认参数运行，观察速度图是一条竖直线，读出到达最高点的时间，与 v₀ sin α / g 比较（任务 3）。",
     "Switch to “Shooting a basketball”, run with the defaults, see that the hodograph is a vertical line, and compare the time to the top with v₀ sin α / g (task 3)."]
