    行英文: [["Velocity /(m/s)", "", ""], ["Acceleration /(m/s²)", "", ""], ["Angle between v and a /(°)", "", ""], ["Largest speed aω /(m/s)", "", ""], ["Smallest speed bω /(m/s)", "", ""]]
