注意:
  - ["速度图的单位是 m/s，与轨迹图的比例不同，两者的箭头长度不能直接比较。", "The hodograph is in m/s with its own scale; arrow lengths cannot be compared with the path view."]
  - ["速率是速度的大小，没有方向；速率恒定时加速度不一定为零。", "Speed is the size of the velocity; a constant speed does not mean zero acceleration."]
思考题:
  - ["为什么椭圆参数化 (10.2.9) 的加速度总指向中心？若中心不在 SCARA 基座附近，这对机器人意味着什么？", "Why does the acceleration of parametrisation (10.2.9) always point to the centre? What does that mean for the robot?"]
