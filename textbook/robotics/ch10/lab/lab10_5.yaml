# 实验 10.5 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab10_5.js。
原理:
  - ["自然坐标沿轨迹本身的切线 e_t、主法线 e_n 分解运动。速度只有切向分量 v = ṡ e_t；加速度 a = s̈ e_t + κ ṡ² e_n，切向部分改变速率，法向部分改变方向（定理 10.5.1）。",
     "Natural coordinates use the tangent e_t and principal normal e_n of the path. The velocity is v = ṡ e_t; the acceleration is a = s̈ e_t + κ ṡ² e_n: the tangential part changes the speed, the normal part the direction (Theorem 10.5.1)."]
  - 式: "a_t = s̈，  a_n = κ v²，  |a| = √(a_t² + a_n²)；  圆：κ = 1/R          (10.5.6)"
  - ["椭圆 x = a cos u、y = b sin u 的曲率 κ = ab / (a² sin²u + b² cos²u)^{3/2}，在长轴端点最大（a/b²），在短轴端点最小（b/a²）（式 (10.5.10)）。匀速运动时最大加速度出现在曲率最大处。",
     "The ellipse x = a cos u, y = b sin u has curvature κ = ab / (a² sin²u + b² cos²u)^{3/2}, largest at the ends of the major axis (a/b²) and smallest at the ends of the minor axis (b/a²) (Eq. (10.5.10)). At constant speed the largest acceleration is where the curvature is largest."]
步骤:
  - ["选择“UR5e 去毛刺（圆）”，设 R = 0.1 m、a_t = 0.5 m/s²、v_max = 0.25 m/s。先手算加速结束时的 a_n 和 |a|，填入表 1。",
     "Choose “UR5e deburring (circle)” with R = 0.1 m, a_t = 0.5 m/s², v_max = 0.25 m/s. Compute a_n and |a| at the end of the speed-up by hand and enter them in Table 1."]
  - ["按“开始”，观察下方曲线：a_n 随速率平方增长，加速结束时 |a| 突然下降。读出加速结束时的 |a|（任务 1）。",
     "Press Start; in the plot a_n grows with the square of the speed and |a| drops suddenly when the speed-up ends. Read |a| at that moment (task 1)."]
  - ["保持 R = 0.1 m，调节 v_max，找出使匀速段 a_n 不超过 0.5 m/s² 的最高速率（不低于 0.2 m/s），记入表 1（任务 2）。",
     "Keep R = 0.1 m and adjust v_max to find the highest speed (at least 0.2 m/s) whose steady a_n stays within 0.5 m/s²; record in Table 1 (task 2)."]
  - ["切换到“匀速涂胶（椭圆）”，从 0.20 m/s 起逐步提高速率，每次走完一圈读出最大加速度，填入表 2，找出不超过 1.0 m/s² 的最高速率（任务 3）。",
     "Switch to “Constant-speed gluing (ellipse)”; raise the speed from 0.20 m/s, read the largest acceleration after each loop into Table 2, and find the highest speed within 1.0 m/s² (task 3)."]
  - ["切换到“汽车过弯”，设弯道半径 500 m、车速 30 m/s，读出法向加速度（任务 4）；再把半径减半，观察法向加速度的变化。",
     "Switch to “A car on a bend”, set a 500 m bend and 30 m/s and read the normal acceleration (task 4); then halve the radius and compare."]
