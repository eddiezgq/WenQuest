  - ["“本圈最大加速度”由按弧长推进时逐点计算的 κv₀² 取最大得到，与手算值可能有末位差别。", "“Largest acceleration this loop” is the maximum of κv₀² sampled along the loop and may differ from the hand value in the last digit."]
思考题:
  - ["速率提高 20%，法向加速度提高多少？为什么机器人和车辆在急弯处都要减速？", "If the speed rises by 20%, by how much does the normal acceleration rise? Why must robots and vehicles slow down on tight bends?"]
