注意:
  - ["约束矩阵只列标准轮；脚轮和瑞典轮不加约束，不列入。", "Only standard wheels enter the constraint matrix; castors and Swedish wheels add no constraint."]
  - ["实验按纯滚动、不侧滑计算；真实的轮胎有弹性，平行转向的车仍能勉强转弯，代价是轮胎磨损和跑偏。", "The lab assumes pure rolling; real tyres are elastic, so a parallel-steered car still turns, at the cost of tyre wear and drift."]
思考题:
  - ["购物车被横着推时，车为什么绕后轴中点转？如果把车把装在前面（像拉车一样），横向拉会怎样？", "Why does the cart turn about the rear-axle centre when pushed sideways? What if the handle were at the front and you pulled sideways?"]
