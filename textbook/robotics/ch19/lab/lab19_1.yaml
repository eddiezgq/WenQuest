    行英文: [["Differential", "", "", "v = 0.25, ω = ", "", ""], ["Tricycle", "", "", "v = 0.3, ω = 1", "", ""], ["Ackermann δ = 30°", "", "", "", "", ""], ["Parallel δ = 30°", "", "", "", "", ""]]
  - 标题: ["表 2  阿克曼转向的两前轮转角", "Table 2  Front-wheel angles under Ackermann steering"]
    表头: ["δi / °", "δo / °", "R / m", "cot δo − cot δi"]
    表头英文: ["δi / °", "δo / °", "R / m", "cot δo − cot δi"]
