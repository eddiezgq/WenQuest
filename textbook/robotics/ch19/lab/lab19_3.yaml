注意:
  - ["实验按纯滚动计算，没有考虑辊子的打滑和接地点半径的变化；真实的麦克纳姆车侧移和斜行时误差比前进时大。", "The lab assumes pure rolling and ignores roller slip and the changing contact radius; a real mecanum vehicle is less accurate sideways and diagonally than forwards."]
  - ["车体运动在车体坐标系中给出：v_x 沿车头，v_y 向左，ω 逆时针为正。", "The body motion is given in the body frame: v_x along the heading, v_y to the left, ω anticlockwise positive."]
思考题:
  - ["若四个编码器读数不满足相容条件，你会怎样判断是哪一个轮子打滑？只有四个读数够吗？", "If the four encoder readings break the compatibility condition, how would you tell which wheel slipped? Are four readings enough?"]
