# 实验 3.2 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab3_2.js。
原理:
  - ["点积 r·F = |r||F| cos θ 是一个数，等于 r 在 F 方向上的投影长度乘以 |F|；θ 为两者的夹角。两者垂直时点积为零。",
     "The dot product r·F = |r||F| cos θ is a number: the projection of r on the direction of F times |F|; θ is the angle between them. It is zero when they are perpendicular."]
  - ["叉积 r×F 是一个矢量：长度 |r||F| sin θ，等于以 r、F 为邻边的平行四边形的面积；方向垂直于 r 和 F，按右手定则确定。力 F 作用在 r 的终点时，它对 O 的力矩就是 m = r×F。",
     "The cross product r×F is a vector: its length |r||F| sin θ is the area of the parallelogram on r and F; it is perpendicular to both, by the right-hand rule. A force F acting at the tip of r has the moment m = r×F about O."]
  - 式: "r·F = r₁F₁ + r₂F₂ + r₃F₃          (3.2.3)"
  - 式: "r×F = (r₂F₃ − r₃F₂,  r₃F₁ − r₁F₃,  r₁F₂ − r₂F₁)          (3.2.9)"
  - ["本实验中 r 和 F 都在屏幕平面内，所以力矩只有垂直于屏幕的分量 m_z = |r||F| sin(β − α)：正值指向屏幕外（⊙），负值指向屏幕里（⊗）。",
     "Here r and F lie in the screen plane, so the moment has only the component normal to the screen, m_z = |r||F| sin(β − α): positive out of the screen (⊙), negative into it (⊗)."]
步骤:
