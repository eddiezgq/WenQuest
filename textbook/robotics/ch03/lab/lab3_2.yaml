     "Open Lab 3.2, scene “F/T sensor and part”. Keep |r| = 0.3 m, α = 20°, |F| = 40 N; set β to 20°, 50°, 110°, 200°, −10° in turn and record the dot product and m_z in Table 1; compute them by hand first."]
  - ["完成任务 1～3，观察力矩为零、最大、为负的一半时，虚线平行四边形的形状和点积的值。",
     "Do tasks 1–3 and watch the dashed parallelogram and the dot product when the moment is zero, largest, and minus one half."]
  - ["切换到场景“扳手拧螺栓”，只用 50 N 的力拧出至少 20 N·m 的力矩（任务 4）。改变扳手长度和用力方向，找出两种可行的组合，填入表 2。",
     "Switch to “Spanner on a bolt” and produce at least 20 N·m with 50 N (task 4). Vary the handle length and the push direction; find two combinations that work and enter them in Table 2."]
