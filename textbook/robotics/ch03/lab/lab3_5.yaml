# 实验 3.5 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab3_5.js。
原理:
  - ["求和约定：一项中出现两次的指标（哑指标）表示从 1 到 3 求和，求和号省略；只出现一次的指标（自由指标）不求和，代表等式的个数。",
     "Summation convention: an index appearing twice in a term (a dummy index) is summed from 1 to 3 without writing the sum sign; an index appearing once (a free index) is not summed and counts the equations."]
  - 式: "(P_a)_ij = r_ik r_jl (P_b)_kl          (3.5.3)"
  - ["固定 i、j 以后，右边对 k、l 求和，共九项。表面坐标系中 P_b = diag(1, 1, 0)，只有 k = l = 1、2 的项可能不为零。表面绕 x 轴倾斜 θ 时，r_ij 是方向余弦矩阵 Rot(x, θ) 的元素。",
     "With i, j fixed, the right-hand side sums nine terms over k and l. In the surface frame P_b = diag(1, 1, 0), so only the terms k = l = 1, 2 can be non-zero. For a surface tilted by θ about x, r_ij are the entries of Rot(x, θ)."]
  - 式: "总价 = p_i q_i = p₁q₁ + p₂q₂ + p₃q₃"
