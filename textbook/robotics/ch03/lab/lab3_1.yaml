注意:
  - ["转角以逆时针为正（从 z 轴正向往下看）。", "Angles are positive anticlockwise (seen from +z)."]
  - ["箭头本身在转动 {b} 时始终不动；变的只是读数。记录时写清楚是哪一个坐标系中的分量。", "The arrow never moves when {b} turns; only the readings change. Always note which frame a set of components belongs to."]
