# 实验 3.1 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab3_1.js。
原理:
  - ["矢量是一支箭头，有大小和方向，与坐标系无关。取定直角坐标系 {a} 以后，矢量可以唯一地分解为沿三根坐标轴的三段，三段的有向长度就是它在 {a} 中的分量，记作 d_a。",
     "A vector is an arrow with a length and a direction; it does not depend on any frame. Once a Cartesian frame {a} is chosen, the vector splits uniquely into three pieces along the axes; their signed lengths are its components in {a}, written d_a."]
  - 式: "d₁ = |d| cos α₁,   d₂ = |d| cos α₂,   d₃ = |d| cos α₃          (3.1.5)"
  - ["分量是箭头在坐标轴上的投影。坐标系 {b} 相对 {a} 绕 z 轴转过 β 时，箭头与 x_b 轴的夹角是 φ − β（φ 为箭头与 x_a 轴的夹角），所以 d 在 {b} 中的分量为 (|d| cos(φ − β), |d| sin(φ − β))。",
     "Components are projections of the arrow on the axes. If frame {b} is turned by β about z from {a}, the arrow makes the angle φ − β with x_b (φ is its angle to x_a), so its components in {b} are (|d| cos(φ − β), |d| sin(φ − β))."]
  - 式: "|d| = √(d₁² + d₂² + d₃²)，在任何直角坐标系中算出的值都相同          (3.1.4)"
步骤:
  - ["打开实验 3.1，选择场景“相机与机械臂”。保持 |d| = 0.36 m、φ = 34°，把 β 调到 0°，记下两套分量，确认它们相同。",
     "Open Lab 3.1, scene “Camera and arm”. Keep |d| = 0.36 m and φ = 34°, set β = 0°, record both sets of components and confirm they agree."]
  - ["依次把 β 调到 30°、60°、90°、150°、−60°，把 d 在 {b} 中的分量和由它算出的长度填入表 1；先用原理中的公式手算一次，再与读数比较。",
     "Set β to 30°, 60°, 90°, 150°, −60° in turn. Enter the components in {b} and the length computed from them in Table 1; compute them by hand first, then compare."]
  - ["完成任务 1～3：分别找出使 {b} 的 x 轴对准箭头、两个分量相等、y 轴与箭头反向的 β，填入表 2，并写出 β 与 φ 的关系。",
     "Do tasks 1–3: find β for which x_b points along the arrow, the two components are equal, and y_b points against the arrow. Enter them in Table 2 with the relation between β and φ."]
  - ["切换到场景“导航地图”。先在 β = 0° 时读出目的地在 {a}（东、北）中的分量；再设汽车朝正东行驶、地图车头朝上，即 β = −90°（任务 4），读出目的地在 {b} 中的分量，说出它在车的前方和左侧各多远，比较两种读法算出的距离。",
     "Switch to “Navigation map”. At β = 0° read the destination in {a} (east, north). Then let the car head east with a heading-up map, β = −90° (task 4); read the destination in {b}, say how far ahead and how far to the left it is, and compare the distances."]
