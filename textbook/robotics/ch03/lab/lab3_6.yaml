思考题:
  - ["若把参考点取在关节 2 的轴以外（例如机座原点），ω × r 与实际速度相差多少？这个差值与第 6 章运动旋量的线速度部分有什么关系？",
     "If the reference point is taken off the joint-2 axis (say at the base origin), how far is ω × r from the true velocity? How does the difference relate to the linear part of the twist in Chapter 6?"]
