注意:
  - ["读数都在机座坐标系 {s} 中，z 轴竖直向上。图中黑色箭头为 ω，蓝色为 r，红色为法兰盘中心的速度。", "All readings are in the base frame {s}, z up. Black arrow: ω; blue: r; red: the flange velocity."]
