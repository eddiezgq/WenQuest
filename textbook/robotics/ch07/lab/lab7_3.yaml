思考题:
  - ["目标在工作空间边界附近（例如距基座 0.81 m）时，收敛变慢还是变快？与 det J 有什么关系？", "Near the edge of the workspace (e.g. 0.81 m from the base), does convergence get slower or faster? How is that related to det J?"]
