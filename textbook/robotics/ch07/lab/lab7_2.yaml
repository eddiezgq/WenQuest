注意:
  - ["参数一改，程序立即把整段过程算完，“回放”只是把结果按时间顺序画出来；任务在回放结束时检查。", "Changing a parameter recomputes the whole run at once; Play only redraws it in time order. Tasks are checked when the playback ends."]
  - ["比较不同方法时要看计算量：RK4 每步计算 4 次加速度，其余方法 1 次。", "Compare methods at equal cost: RK4 evaluates the acceleration 4 times per step, the others once."]
  - ["电机场景中，发散的曲线超出画面的部分被截掉了，读数“结果”给出是否发散。", "In the motor scene a diverging curve is clipped at the edge of the plot; the reading “result” says whether it diverges."]
思考题:
  - ["辛欧拉法的能量误差比 RK4 大，为什么仍说它更适合长时间仿真？", "Symplectic Euler has a larger energy error than RK4. Why is it still the better choice for long simulations?"]
  - ["陀螺仪场景中，欧拉法的姿态误差角与李-欧拉法相近，但 det R 差别很大。这说明了什么？", "In the gyro scene Euler's attitude error is close to Lie–Euler's, yet det R differs a lot. What does this show?"]
