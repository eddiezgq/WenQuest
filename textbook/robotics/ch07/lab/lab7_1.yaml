注意:
  - ["电机场景的时间放慢了 30 倍显示，读数按真实时间给出。", "The motor scene runs 30 times slower than real time; the readings are in real time."]
  - ["周期按“连续两次到达左端”的时间间隔测量，第一次读数要等连杆摆完一个多周期。", "The period is measured between two successive arrivals at the left end; the first reading appears after a little more than one period."]
  - ["相平面中角度按 (−π, π] 显示，连杆越过顶点时轨线从一边跳到另一边，这不是跳变，而是同一个角度的两种写法。", "Angles are shown in (−π, π]; when the link goes over the top the trajectory jumps from one side to the other. This is not a jump in the motion, only two names for one angle."]
思考题:
  - ["电压加倍，时间常数变不变？转动惯量加倍呢？用式 (7.1.4) 解释。", "Doubling the voltage: does the time constant change? Doubling the inertia? Explain with Eq. (7.1.4)."]
  - ["从 179° 释放，周期大约是多少？摆幅趋于 180° 时周期趋于什么？", "Released from 179°, what is the period roughly? What does it tend to as the amplitude tends to 180°?"]
