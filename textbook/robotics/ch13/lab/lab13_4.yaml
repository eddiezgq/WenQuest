  - ["Panda 的末端取法兰盘中心（Craig 表最后一个坐标系沿 z 再走 0.107 m）；UR5e 的末端取法兰盘中心。", "The Panda tool point is the flange centre (0.107 m along z beyond the last Craig frame); the UR5e tool point is the flange centre."]
  - ["关节 7 只对 Panda 起作用；“DH 表”只对 UR5e 场景起作用。", "Joint 7 acts only on the Panda; the DH-table switch acts only in the UR5e scene."]
