  - ["“指数积与模型之差”只是舍入误差，在 10⁻⁸ m 以下；三维模型的数据以有限位小数存放，所以它可能比“DH 与指数积之差”（10⁻¹⁶ m 量级）大一些。", "“PoE vs model” is rounding only, below 10⁻⁸ m; the model data are stored with finitely many decimals, so it may be larger than “DH vs PoE” (about 10⁻¹⁶ m)."]
思考题:
  - ["表 1 中“DH − 指数积”换用厂商表后变成毫米级，而“指数积 − 模型”不变。这说明误差来自方法还是来自参数？", "In Table 1, DH − PoE becomes millimetres with the maker's table while PoE − model stays tiny. Does the error come from the method or from the parameters?"]
