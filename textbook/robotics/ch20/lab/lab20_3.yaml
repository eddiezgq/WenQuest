注意:
  - ["实验只算运动学：机身高度和姿态不变，腿的质量、地面的力都不考虑；β 很小的步态在真实机器人上还需要动力学控制才能站稳。", "The lab is kinematic only: body height and attitude fixed, no leg mass or ground forces; gaits with small β need dynamic control on a real robot."]
  - ["画面慢放一半；“跑步机”上的地面标记以速度 v 向后移动，支撑脚应当与它们同步。", "The picture plays at half speed; the treadmill marks move back at speed v and the stance feet should move with them."]
思考题:
  - ["实验中“工作空间刚好不够”的速度为什么比式 (20.3.6) 给出的上限略低？（提示：摆动相中的摆腿回收。）", "Why is the speed at which the workspace runs out a little below the bound of Eq. (20.3.6)? (Hint: swing-leg retraction.)"]
