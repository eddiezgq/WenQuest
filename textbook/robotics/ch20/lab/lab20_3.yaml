# 实验 20.3 的指导书与报告模板。目的、场景、参数、任务取自 lab20_3.js。
原理:
  - 式: ["支撑相判据：u_i = (t/t_c − φ_i) mod 1 < β（式 (20.3.1)）；平均着地腿数 = Σβ_i = 4β（定理 20.3.1）", "Stance test: u_i = (t/t_c − φ_i) mod 1 < β (Eq. (20.3.1)); average feet down = Σβ_i = 4β (Theorem 20.3.1)"]
  - 式: ["L_s = v t_c，ℓ = v β t_c，x_td = ℓ/2；摆动脚对地平均速度 v/(1 − β)，最高 2v/(1 − β)（式 (20.3.3)～(20.3.9)）", "L_s = v t_c, ℓ = v β t_c, x_td = ℓ/2; mean swing speed v/(1 − β), peak 2v/(1 − β) (Eqs. (20.3.3)–(20.3.9))"]
  - 式: ["工作空间限制：v ≤ ℓ_max/(β t_c)（式 (20.3.6)）", "Workspace limit: v ≤ ℓ_max/(β t_c) (Eq. (20.3.6))"]
  - ["摆动轨迹取摆线（式 (20.3.8)），起落时对地速度为零；在机身坐标系中看，摆动脚先越过落脚点再收回（摆腿回收）。", "The swing follows a cycloid (Eq. (20.3.8)) with zero ground speed at lift-off and touchdown; seen from the body, the foot overshoots the foothold and is pulled back (swing-leg retraction)."]
步骤:
  - ["场景“Go2 步态”：用默认参数按“开始”（任务 1），观察对角两条腿同时着地；记录步幅、支撑行程和摆动脚的最高速度，与算例 20.3.2 比较。", "Scene “Go2 gaits”: press Start with the defaults (task 1) and watch the diagonal pairs; record stride, stance stroke and peak swing speed and compare with Example 20.3.2."]
  - ["依次选择五种步态（β 取图 20.3.1 中的值），记录一个周期中着地腿数的最少值和腾空时间，填入表 1；把小跑的 β 降到 0.4（任务 2）。", "Select the five gaits in turn (β as in Figure 20.3.1); record the fewest feet down and the flight time in Table 1; lower the trot's β to 0.4 (task 2)."]
  - ["小跑，t_c = 0.5 s、β = 0.5，逐步加大速度，记录工作空间刚好不够时的速度，与算例 20.3.1 的上限比较（任务 3）；再把 t_c 改为 0.35 s 重做，填入表 2。", "Trot with t_c = 0.5 s, β = 0.5, raise the speed and record where the workspace runs out; compare with the bound of Example 20.3.1 (task 3); repeat with t_c = 0.35 s and fill in Table 2."]
  - ["选爬行步态，β = 0.8，按“开始”走一个周期（任务 4）。", "Select the crawl gait with β = 0.8 and press Start for one cycle (task 4)."]
  - ["生活场景“狗的走与跑”：速度从 0.2 m/s 逐步加到 2.2 m/s 以上（任务 5），记录换步态的速度和每种步态的占地系数。", "Everyday scene “A dog walks and runs”: raise the speed from 0.2 m/s to beyond 2.2 m/s (task 5); record where the gait changes and each duty factor."]
数据表:
