    表头: ["步态", "β", "着地腿数最少值", "腾空时间 / s", "平均着地腿数 4β"]
    表头英文: ["gait", "β", "fewest feet down", "flight time / s", "mean feet down 4β"]
    行: [["爬行", "0.75", "", "", ""], ["小跑", "0.5", "", "", ""], ["小跑", "0.4", "", "", ""], ["踱步", "0.5", "", "", ""], ["跳跑", "0.4", "", "", ""], ["奔跑", "0.3", "", "", ""]]
    行英文: [["walk", "0.75", "", "", ""], ["trot", "0.5", "", "", ""], ["trot", "0.4", "", "", ""], ["pace", "0.5", "", "", ""], ["bound", "0.4", "", "", ""], ["gallop", "0.3", "", "", ""]]
  - 标题: ["表 2  工作空间允许的最高速度", "Table 2  Highest speed allowed by the workspace"]
    表头: ["t_c / s", "β", "实测最高速度 / (m/s)", "式 (20.3.6) / (m/s)"]
    表头英文: ["t_c / s", "β", "measured top speed / (m/s)", "Eq. (20.3.6) / (m/s)"]
