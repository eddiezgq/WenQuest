注意:
  - ["落脚点在机身坐标系中给出，机身不动；只移动左前腿，其余三条腿保持站立姿态。脚低于地面时模型会穿过地板，这不影响运动学计算。", "The foothold is given in the body frame and the body stays put; only the front-left leg moves, the other three keep the standing pose. A foot below the floor passes through it; the kinematics is unaffected."]
  - ["站立力矩按四只脚平均分担体重计算（每只脚 m𝔤/4），没有考虑腿自身的重量。", "The standing torques assume the weight is shared equally (m𝔤/4 per foot) and ignore the legs' own weight."]
思考题:
  - ["为什么机身越低，小腿关节的力矩越大，而大腿关节的力矩始终为零？足端偏离大腿关节正下方时又会怎样？", "Why does the calf torque grow as the body lowers while the thigh torque stays zero? What happens when the foot is not straight below the thigh joint?"]
