注意:
  - ["“稳定”时最后 1 s 仍有约 0.002 rad/s 的残余速度：慢模态还在收敛，不是不稳定。", "Even when stable about 0.002 rad/s remains in the last second: the slow mode is still settling, not unstable."]
  - ["场景 2 本页比实时快 5 倍；步长很小时每帧要算很多步，慢的电脑会比实时慢。", "Scene 2 runs five times faster than real time; with very small steps each frame needs many steps and a slow computer falls behind."]
思考题:
  - ["为什么把执行器的 kv 挪到关节的 damping 上，Euler 取 10 ms 也稳定？这样改变了模型的物理意义吗？", "Why does moving the actuator's kv onto the joint's damping make Euler stable even at 10 ms? Does it change the model's physics?"]
