注意:
  - ["UR5e 的质量、惯量来自书中的模型（MuJoCo Menagerie），转子等效惯量是模型中的 armature = 0.1 kg·m²，不是厂家数据；负载是示意值。", "The UR5e's masses and inertias come from the book's model (MuJoCo Menagerie); the rotor inertia is the model's armature of 0.1 kg·m², not manufacturer data; the payload is illustrative."]
  - ["表 1 中的 M 不含转子惯量；“推一下”用的是含转子的 M₁₁，因为电机转子跟着一起转。", "M in Table 1 excludes the rotors; the push uses M₁₁ with the rotor, since the motor rotor turns too."]
  - ["推一下时其他关节由模型自带的位置伺服保持，并非真正焊死。", "During the push the other joints are held by the model's position servos, not truly welded."]
思考题:
  - ["关节 6 推动的连杆惯量只有 10⁻⁴ kg·m² 的量级，而转子等效惯量是 0.1 kg·m²。这对关节 6 的控制意味着什么？", "Joint 6 drives a link inertia of order 10⁻⁴ kg·m² while its rotor inertia is 0.1 kg·m². What does this mean for controlling joint 6?"]
