注意:
  - ["UR5e 的质量、惯量来自书中的模型（MuJoCo Menagerie，连杆质量沿用上一代 UR5 的数值，23.5 节）；夹爪、毛坯和人的手臂是示意值。", "The UR5e's masses and inertias come from the book's model (MuJoCo Menagerie; link masses of the earlier UR5, Section 23.5); the gripper, blank and human arm are illustrative."]
  - ["显示的力矩按书中平面坐标的符号（φ = −θ，τ = −τ_UR，式 (24.2.10)），与图 24.2.2 相同。", "Torques are shown with the sign of the book's planar coordinates (φ = −θ, τ = −τ_UR, Eq. 24.2.10), as in Figure 24.2.2."]
  - ["150 N·m 是模型中关节 2、3 的力矩上限；UR5e 各关节的速度上限是 180 °/s，T 小于 0.94 s 时这个动作已经超速。", "150 N·m is the model's torque limit of joints 2 and 3; the UR5e's joint speed limit is 180 °/s, so below T = 0.94 s this move is already too fast."]
思考题:
  - ["为什么关节 3 的重力项在整个动作中不变？如果终点改为 (−30°, 60°)，还会不变吗？", "Why does joint 3's gravity term stay constant during the move? Would it if the end were (−30°, 60°)?"]
