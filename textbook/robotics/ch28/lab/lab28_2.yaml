注意:
  - ["本实验假定零力矩点可以瞬间移到脚掌内的任何地方，迈步也是瞬间完成的（0.2 s 时新脚落地）；真实的机器人做不到，能承受的推力要小一些。", "This lab assumes the ZMP can jump anywhere in the foot instantly and the step lands at 0.2 s; a real robot cannot, so it survives smaller pushes."]
  - ["迈步距离是从原来的踝关节到新的踝关节；新脚的脚掌在新踝关节前 125 mm、后 55 mm。", "The step length is measured ankle to ankle; the new foot extends 125 mm in front of and 55 mm behind the new ankle."]
思考题:
  - ["走得快时身体晃得少，走得慢时晃得多，这与直觉是否相符？人在冰上走路为什么要小步快走？", "Walking fast makes the body sway less and walking slowly more—does that match your intuition? Why do people take short quick steps on ice?"]
