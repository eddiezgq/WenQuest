注意:
  - ["手动加横滚力矩时，X2 会不停地翻滚，1 s 后自动停止；角加速度只看起始的那一步。", "With a manual roll torque X2 keeps tumbling and the run stops after 1 s; read the angular acceleration from the first step only."]
  - ["MuJoCo 的空气阻力只有机身的压差阻力（与速度平方成正比），没有旋翼阻力，数值只用来说明道理。", "MuJoCo's drag here is only the body's pressure drag (proportional to the square of speed), with no rotor drag; the numbers illustrate the idea only."]
  - ["本页比实时快 3 倍地推进仿真，每次飞 20 s。", "This page runs the simulation three times faster than real time, 20 s per flight."]
思考题:
  - ["真实四旋翼的阻力中有很大一部分来自旋翼，大致与速度成正比。如果阻力与速度成正比，低速时所需的倾角会比本实验的大还是小？", "Much of a real quadrotor's drag comes from the rotors and is roughly proportional to speed. With drag proportional to speed, would the tilt needed at low speed be larger or smaller than here?"]
