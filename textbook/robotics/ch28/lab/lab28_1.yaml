# 实验 28.1 的指导书与报告模板。目的、场景、参数、任务取自 lab28_1.js。
原理:
  - ["车转弯时，质心有指向圆心的加速度 a_y = v²/R，它要由地面对车轮的侧向摩擦力提供；侧向力作用在地面上、比质心低 h，使外侧车轮压得更紧、内侧车轮变轻（式 (28.1.7)）：", "In a turn the centre of mass accelerates towards the centre at a_y = v²/R, and the lateral friction of the ground on the wheels must provide it. That force acts at the ground, h below the centre of mass, so the outer wheels are pressed harder and the inner wheels unloaded (Eq. (28.1.7)):"]
  - 式: "F_z,内 = m𝔤/2 − m a_y h / w"
  - ["内侧车轮的法向力降为零就侧翻；各轮侧向力之和达到 μm𝔤 就侧滑（式 (28.1.6)）。质心高于 w/(2μ) 的车先翻后滑。", "The vehicle rolls over when the inner normal force reaches zero, and skids when the lateral forces reach μm𝔤 (Eq. (28.1.6)). A vehicle whose centre of mass is above w/(2μ) rolls before it skids."]
  - ["轮胎的侧向力要靠侧偏角才能产生（式 (28.1.2)），车速高时所需的转向角比运动学的 L/R 大，这叫不足转向（式 (28.1.10)）。", "A tyre needs a slip angle to produce a lateral force (Eq. (28.1.2)), so at speed the steering angle needed exceeds the kinematic L/R: this is understeer (Eq. (28.1.10))."]
步骤:
  - ["AGV 场景，干地面 μ = 0.7、R = 3 m、质心 0.65 m。车速从 2 m/s 起每次加 0.1 m/s，按“开始”，记下侧向加速度和内侧车轮的法向力，填入表 1；找出不翻车的最高车速（任务 1）。", "AGV scene, dry floor μ = 0.7, R = 3 m, CoM at 0.65 m. Raise the speed from 2 m/s in steps of 0.1 m/s, press Start, and record the lateral acceleration and the inner normal force in Table 1; find the highest speed without rollover (task 1)."]
  - ["把 μ 改为 0.4，重复上一步，看车先滑还是先翻（任务 2），记下侧滑时的车速和侧向加速度，与式 (28.1.6) 的 μ𝔤 比较。", "Set μ to 0.4 and repeat; see whether the AGV skids or rolls first (task 2); record the speed and lateral acceleration at which it slides and compare with μ𝔤 from Eq. (28.1.6)."]
  - ["μ 改回 0.7，质心升到 0.9 m，求新的极限车速（任务 3），与式 (28.1.6) 比较，填入表 2。", "Back to μ = 0.7, raise the CoM to 0.9 m and find the new limiting speed (task 3); compare with Eq. (28.1.6) in Table 2."]
  - ["换到轿车场景，R = 200 m，车速取 60、80、100、120 km/h，记下平均转向角，与运动学值 L/R 比较（任务 4）。", "Switch to the car scene, R = 200 m, and drive at 60, 80, 100 and 120 km/h; record the mean steering angle and compare it with the kinematic L/R (task 4)."]
