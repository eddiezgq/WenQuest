注意:
  - ["车先以较低的速度进弯，再慢慢加速到设定的车速，避免一开始就冲击；读数取最后几秒的值。", "The vehicle enters the bend slowly and then accelerates to the set speed, so there is no initial jolt; read the values from the last few seconds."]
  - ["本实验的轮胎用刷子模型，侧向力接近摩擦上限时不再线性，所以轿车的转向角比线性模型的式 (28.1.10) 稍大。", "The tyres here follow the brush model, which is no longer linear near the friction limit, so the car's steering angle is a little larger than the linear Eq. (28.1.10)."]
  - ["侧翻按刚体的静力条件判断，没有计入悬架的侧倾和货物的晃动；实际车辆的侧翻车速更低。", "Rollover is judged by the rigid-body static condition, without suspension roll or load sway; real vehicles roll over at lower speeds."]
  - ["式 (28.1.6) 把整车当作一个质点，湿地面上给出 a_y ≤ μ𝔤。本实验的自行车模型中前轴只承担 46% 的载荷，转向角又大，前轮的侧向力先达到上限，所以车在 a_y 约 3.3 m/s² 时就向外滑了。", "Eq. (28.1.6) treats the vehicle as one point mass and gives a_y ≤ μ𝔤 on the wet floor. In this lab's bicycle model the front axle carries only 46% of the load and the steering angle is large, so the front tyres reach their limit first and the AGV slides out at about 3.3 m/s²."]
思考题:
  - ["算例 28.1.3 说，AGV 低速过弯时实际的转弯半径与运动学的只差 0.3%，里程计却每过一个 90° 的弯偏十几厘米。把车速调低、侧偏刚度调小，看后轮的侧偏角怎样变化，并说明里程计的误差从哪里来。", "Example 28.1.3 says that at low speed the AGV's turning radius differs from the kinematic one by only 0.3%, yet odometry drifts by over ten centimetres per 90° bend. Lower the speed and the cornering stiffness, watch the rear slip angle, and explain where the odometry error comes from."]
