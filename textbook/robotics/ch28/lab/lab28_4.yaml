注意:
  - ["冲击力按 10 ms 平均：脚刚碰地的一瞬间，小腿和脚的质量突然停下，会有一个很窄的尖峰，它对电机和结构的意义不大。", "The impact is averaged over 10 ms: at the instant of touchdown the calf and foot stop abruptly and give a very narrow spike that matters little to the motors and structure."]
  - ["下沉量从脚刚着地时（机身原点高 0.288 m）算起，包括了站稳以后关节弹性造成的下垂（kp = 60 时约 33 mm）。", "The sink is measured from touchdown (base origin at 0.288 m) and includes the sag of the standing posture from the joint compliance (about 33 mm at kp = 60)."]
思考题:
  - ["真实的四足机器人落地时常常在着地前“预先屈腿”、着地瞬间降低刚度，再慢慢站起来。为什么这样做能同时减小冲击力和电机力矩？", "Real quadrupeds often pre-bend their legs before touchdown and lower the stiffness at impact, then stand up slowly. Why does this reduce both the impact and the motor torque?"]
