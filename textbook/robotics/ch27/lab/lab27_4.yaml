注意:
  - ["接触点恰好在矩形的角上时，法向取它所在那条边的法向；实际夹持时应避开棱角。", "A contact exactly at a corner of the rectangle takes the normal of the edge it belongs to; real grips should avoid corners."]
  - ["抓取质量 ε 中，力矩除以特征长度（矩形取 30 mm，硬币取半径），所以只能在同一个物体的不同摆法之间比较。", "In ε the moment is divided by a characteristic length (30 mm for the rectangle, the radius for the coin), so compare ε only between placements on the same object."]
思考题:
  - ["两指对径的抓取在平面上只要很小的摩擦就能力封闭，为什么实际中仍要较大的夹紧力？力封闭说明了什么，没有说明什么？", "An antipodal two-finger grasp is in force closure with very little friction, so why are large grip forces still used in practice? What does force closure tell you, and what does it not?"]
