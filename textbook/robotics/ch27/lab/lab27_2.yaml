    行英文: [["0.2", "", ""], ["0.4", "", ""]]
注意:
  - ["每次改参数或按“开始”，仿真都从指面刚贴着零件、夹紧力和重力同时加上的状态重新开始。", "Each change of a parameter or press of Start restarts the simulation with the pads just touching the part and the grip force and gravity applied together."]
  - ["零件相对夹爪的位移超过 2 mm 判为滑落；夹住时的位移只有百分之几毫米，是接触的弹性变形。", "A displacement of more than 2 mm counts as slipping; when held, the displacement is a few hundredths of a millimetre, the contact deforming elastically."]
  - ["摩擦系数是示意值。仿真用圆锥摩擦锥、impratio = 10 和 noslip，否则零件会在指间慢慢蠕滑（27.2.3 节）。", "The friction coefficients are illustrative. The simulation uses elliptic friction cones, impratio = 10 and noslip; otherwise the part would creep slowly in the jaws (Section 27.2.3)."]
思考题:
  - ["实际选夹爪时为什么要在公式上再乘安全系数？列出至少三个让实际所需夹紧力变大的因素。", "Why multiply the formula by a safety factor when choosing a gripper? List at least three factors that make the actual force needed larger."]
