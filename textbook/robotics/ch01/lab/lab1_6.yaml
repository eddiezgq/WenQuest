思考题:
  - ["Go2 抬起一条腿时，机身的 6 个自由度由什么来维持？如果四条腿都离地会怎样？", "When Go2 lifts one leg, what holds the body's 6 DOF? What if all four feet leave the ground?"]
  - ["为什么差速小车不能直接横向平移？要把它向左平移 0.5 m，最少需要几段运动？", "Why can't the differential cart move sideways? How many motion segments does a 0.5 m sideways shift need at least?"]
