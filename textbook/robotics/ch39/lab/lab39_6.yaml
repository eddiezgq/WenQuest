注意:
  - ["判异按实时使用的方式：每完成一组，用到此为止的各组计算控制限，从第 4 组开始检查。实际工厂用稳定时期的数据算出控制限后固定下来。", "Signals are judged as in real time: after each subgroup the limits use only the subgroups so far, from subgroup 4 on. A real plant fixes them from a stable period."]
  - ["模型与正文算例 39.6.2 相同，但随机数不同，具体件数会有差别。灌装线把同一过程换算成灌装量，结垢使灌装量逐渐变少。", "Same model as Example 39.6.2 but different random numbers, so counts differ. The filling line maps the same process to fill volume; scale makes the fill shrink."]
思考题:
  - ["控制图报警时，所有零件都还在公差之内。这时该不该停机？如果不停，可能付出什么代价？", "When the chart alarms every part is still in tolerance. Should the line stop? What may it cost not to?"]
