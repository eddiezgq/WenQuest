注意:
  - ["起始形态都在 A 点：手的位姿相同，只是手臂沿自运动闭曲线处在不同的位置。θ₃ 是这条闭曲线的整体参数，滑块的每个值对应唯一的形态。", "Every start is at A: the hand pose is the same, the arm is just at a different place on the self-motion curve. θ₃ is a global parameter of that curve, so each slider value gives one configuration."]
  - ["控制方式 0 的起点固定为 θ₃ = 0 的形态，θ₃ 滑块不起作用。", "Control 0 always starts from the configuration with θ₃ = 0; the θ₃ slider has no effect."]
  - ["距离按 17.2 节的连杆折线计算，是对真实手臂外形的近似；真实的协作应用还要按安全标准做风险评估。", "Distances use the link polyline of Section 17.2, an approximation of the real arm; a real collaborative application also needs a risk assessment to the safety standards."]
思考题:
  - ["控制方式 0 把 Panda 当作六轴臂用。在本例中它与控制方式 1 的结果相近，是巧合吗？在什么样的任务中，锁住一个关节会带来明显的损失？",
     "Control 0 uses the Panda as a six-axis arm. Here its result is close to control 1; is that a coincidence? In what kind of task does locking a joint cost clearly?"]
