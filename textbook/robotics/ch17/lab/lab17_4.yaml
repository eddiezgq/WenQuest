    表头: ["控制方式", "最小距离 / m", "限位余量", "速度比", "最小可操作度", "是否满足全部要求"]
    表头英文: ["Control", "Minimum distance / m", "Limit margin", "Speed ratio", "Minimum manipulability", "All requirements met?"]
    行: [["0 锁住关节 3", "", "", "", "", ""], ["1 最小范数", "", "", "", "", ""], ["2 局部优先级", "", "", "", "", ""]]
    行英文: [["0 joint 3 locked", "", "", "", "", ""], ["1 minimum norm", "", "", "", "", ""], ["2 local priority", "", "", "", "", ""]]
  - 标题: ["表 2  沿自运动闭曲线挑选起始形态（控制方式 1）", "Table 2  Choosing the start on the self-motion curve (control 1)"]
    表头: ["θ₃ / (°)", "最小距离 / m", "最小可操作度", "速度比", "是否满足全部要求"]
    表头英文: ["θ₃ / (°)", "Minimum distance / m", "Minimum manipulability", "Speed ratio", "All requirements met?"]
