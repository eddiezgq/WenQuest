注意:
  - ["末端误差来自欧拉法积分与比例反馈，在 0.1 mm 量级；它与次要任务无关，次要任务的项在零空间中。", "The tip error comes from Euler integration and the proportional feedback, of order 0.1 mm; it has nothing to do with the secondary task, whose term lies in the null space."]
  - ["模式 2、3 中没有障碍物；模式 2 的限位只用来计算 H，并不强制。", "Modes 2 and 3 have no obstacle; in mode 2 the limits only enter H and are not enforced."]
思考题:
  - ["把模式 1 与模式 2 合在一起（先避障，再在剩下的零空间里避限位），平面 3R 臂还剩多少冗余度？会出现什么问题？与 17.4 节的三层优先级比较。",
     "Combine modes 1 and 2 (avoid the obstacle first, then the limits in what remains of the null space). How much redundancy does the planar 3R arm have left, and what goes wrong? Compare with the three priority levels of Section 17.4."]
