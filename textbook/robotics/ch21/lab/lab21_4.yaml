  - 标题: ["表 2  阶数 k 的比较（总时间 20.4 s）", "Table 2  Comparing the order k (20.4 s)"]
    表头: ["k", "最大倾角 / (°)", "最大角速度 / (rad/s)", "航点处角速度跳变 / (rad/s)", "起点角速度 / (rad/s)"]
    表头英文: ["k", "Peak tilt / (°)", "Peak body rate / (rad/s)", "Body-rate jump / (rad/s)", "Body rate at start / (rad/s)"]
