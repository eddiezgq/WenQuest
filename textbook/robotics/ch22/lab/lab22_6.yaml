# 实验 22.6 的指导书与报告模板。目的、场景、参数、任务取自 lab22_6.js。
原理:
  - 式: ["沿路径 θ(σ) 运动：θ̇ = θ′σ̇，θ̈ = θ′σ̈ + θ″σ̇²；令 x = σ̇²、u = σ̈，则 dx/dσ = 2u", "Along a path θ(σ): θ̇ = θ′σ̇, θ̈ = θ′σ̈ + θ″σ̇²; with x = σ̇², u = σ̈ we have dx/dσ = 2u"]
  - 式: ["限值对 (x, u) 是线性的：θᵢ′² x ≤ vᵢ²，−aᵢ ≤ θᵢ′u + θᵢ″x ≤ aᵢ", "The limits are linear in (x, u): θᵢ′² x ≤ vᵢ², −aᵢ ≤ θᵢ′u + θᵢ″x ≤ aᵢ"]
  - 式: ["两遍算法：从终点往回求每点刹得住的最大 x（可控集），再从起点往前每步取最大的 u；每段用时 Δt = 2Δσ/(√x_k + √x_{k+1})", "Two passes: backwards from the end, the largest x that can still stop (controllable set); forwards from the start, the largest u at each step; each step takes Δt = 2Δσ/(√x_k + √x_{k+1})"]
  - 式: ["平稳：σ(t) 用宽 t_j 的盒形窗滑动平均，t_j = 1/f_n 时消除频率 f_n 的残余振动；限值乘 η 留出滤波后的余量", "Smoothness: average σ(t) over a box window of width t_j; t_j = 1/f_n removes residual vibration at f_n; scale the limits by η to leave room after filtering"]
步骤:
  - ["场景“上下料的节拍”：选做法 0，按“开始”运行（任务 1），把读数填入表 1。", "Scene “Loading cycle”: choose method 0 and press Start (task 1); fill in Table 1."]
  - ["选做法 1，再选做法 2（η = 1），各运行一次（任务 2），填入表 1。注意转移时间和等待时间各自的变化。", "Choose method 1, then method 2 (η = 1), and run each once (task 2); fill in Table 1. Note how the transfer time and the waiting time change."]
  - ["选做法 3，先取 t_j = 0.125 s、η = 1，看速度、加速度是否超限；再逐步减小 η，直到不超限，且残余振幅不超过 0.05 mm、半个循环不超过 3.8 s（任务 3）。", "Choose method 3 with t_j = 0.125 s and η = 1 and check whether any limit is exceeded; then lower η step by step until nothing is exceeded, the residual amplitude is at most 0.05 mm and the half cycle at most 3.8 s (task 3)."]
  - ["保持 η 不变，把 t_j 改为 0.0625 s、0.25 s 和 0.1 s，记录残余振幅（表 2）。", "Keep η and change t_j to 0.0625 s, 0.25 s and 0.1 s; record the residual amplitude (Table 2)."]
  - ["生活场景“弯道上开车”：侧向加速度上限取 3 m/s²，先选全程匀速运行，再选时间最优运行（任务 4），比较两者的用时。", "Everyday scene “Driving through bends”: set the lateral limit to 3 m/s², run the constant speed first, then the time-optimal profile (task 4), and compare the times."]
