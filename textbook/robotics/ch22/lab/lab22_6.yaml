注意:
  - ["工位尺寸、关节加速度限值、振动模态（8 Hz、阻尼比 0.02）、夹紧和松开的时间都是示意值。", "The cell dimensions, joint acceleration limits, vibration mode (8 Hz, damping ratio 0.02) and the grip and release times are illustrative."]
  - ["界面用 1000 段的网格求时间最优，约束只在网格点上施加，网格点之间加速度可能略超限值（约 2%）；程序 22.6.1 用 4000 段，数值略有不同。", "The lab solves on a 1000-step grid; the constraints hold at the grid points, and between them the acceleration may slightly exceed its limit (about 2%). Program 22.6.1 uses 4000 steps, so its numbers differ slightly."]
  - ["画面中关节 1 叠加了放大 30 倍的扭转角；播放放慢 2 倍。道路场景加快 4 倍播放，车放大 4 倍画出。", "Joint 1 is drawn with its torsion magnified 30 times; playback is 2× slower. The road scene plays 4× faster and the car is drawn 4 times larger."]
思考题:
  - ["时间最优的转移比每点停下快得多，为什么半个循环只快了一点？滤波让转移变慢了，为什么节拍却最短？", "The time-optimal transfer is much faster than stopping at each point; why is its half cycle only a little shorter? Filtering slows the transfer down; why is its cycle the shortest?"]
  - ["若夹着更重的零件，振动频率降到 6 Hz，t_j 应怎样改？节拍会怎样变化？", "With a heavier part the vibration drops to 6 Hz. How should t_j change, and what happens to the cycle time?"]
