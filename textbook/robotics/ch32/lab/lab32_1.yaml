注意:
  - ["本页只看 J2、J3，手臂伸直；倾斜时的重力矩按水平伸直时的值乘 sin θ 近似。摩擦力矩取机器人厂关节测试台的名义值，伺服噪声 ±0.0025 mm 是示例值。", "Only J2 and J3, arm straight; the tilted gravity torque is the level value times sin θ (approximate). Friction is the robot plant's test-bench nominal; the ±0.0025 mm servo noise is an example value."]
  - ["真实的谐波减速器还有小力矩下的弹性段（空程），本页没有画进去。", "A real strain wave gear also has a soft zone at small torque (lost motion); it is not modelled here."]
思考题:
  - ["J1 的轴是竖直的，重力对它没有力矩。码垛时 J1 来回转，你会怎样安排动作，让它的背隙不影响放料位置？", "J1's axis is vertical, so gravity gives it no torque. When palletising, J1 swings back and forth: how would you plan the motion so its backlash does not affect where parts are placed?"]
