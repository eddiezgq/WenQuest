    表头: ["倾角 / °", "负载 / kg", "接近方式", "J2 重力矩 / (N·m)", "J3 重力矩 / (N·m)", "J2 压住？", "J3 压住？", "散布 / mm"]
    表头英文: ["Tilt / °", "Payload / kg", "Approach", "J2 gravity / (N·m)", "J3 gravity / (N·m)", "J2 held?", "J3 held?", "Spread / mm"]
    行: [["0", "0", "双向", "", "", "", "", ""], ["2", "0", "双向", "", "", "", "", ""], ["2", "", "双向", "", "", "", "", ""], ["90", "0", "双向", "", "", "", "", ""], ["0", "0", "单向", "", "", "", "", ""]]
  - 标题: ["表 2  只靠减小背隙（竖直、空载、双向）", "Table 2  Smaller backlash only (upright, unloaded, both ways)"]
    表头: ["背隙 / ′", "J2 背隙乘力臂 / mm", "J3 背隙乘力臂 / mm", "散布 / mm", "合格？"]
    表头英文: ["Backlash / ′", "J2 × lever / mm", "J3 × lever / mm", "Spread / mm", "Pass?"]
