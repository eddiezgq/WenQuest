# 实验 M2.5 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 labM2_5.js。
原理:
  - ["二次损失上，梯度下降每一步的误差沿黑塞矩阵的第 j 个特征方向乘以 1 − ηλ_j（式 (M2.3.3)）。要全部收敛，必须 η < 2/λ_max（定理 M2.3.1）。", "On a quadratic loss the error along the j-th eigendirection of the Hessian is multiplied by 1 − eta*lambda_j each step (M2.3.3); convergence requires eta < 2/lambda_max (Theorem M2.3.1)."]
  - ["最优学习率是 2/(λ_min + λ_max)，这时收敛因子是 (κ−1)/(κ+1)，误差降到 1/ε 约需 ½κ·ln(1/ε) 步（式 (M2.5.2)、(M2.5.3)）。", "The optimal rate is 2/(lambda_min + lambda_max), giving factor (kappa−1)/(kappa+1) and about ½·kappa·ln(1/eps) steps (M2.5.2, M2.5.3)."]
  - ["带最优动量时收敛因子变成 (√κ−1)/(√κ+1)：步数由 κ 的量级降到 √κ 的量级（式 (M2.5.5)）。", "With optimal momentum the factor becomes (sqrt(kappa)−1)/(sqrt(kappa)+1): the step count drops from order kappa to order sqrt(kappa) (M2.5.5)."]
  - 式: "本实验取 λ_min = 1、λ_max = κ，所以 2/λ_max = 2/κ，最优学习率是 2/(1+κ)"
步骤:
  - ["“碗里的轨迹”场景：条件数取 20，把学习率从 50% 加到 102%，记下轨迹的形状与是否收敛，填表 1（任务 1）。", "Trajectory scene: with kappa = 20, raise the learning rate from 50% to 102%, recording shape and convergence in Table 1 (task 1)."]
  - ["条件数改成 100、学习率取 99%：观察之字出现在哪个方向（任务 2）。", "Set kappa = 100 and eta = 99%: note which direction the zig-zag happens along (task 2)."]
  - ["切到“步数随学习率”场景：条件数依次取 20、200、1000，各记下最快的学习率与所需步数，填表 2（任务 3）。", "Switch to the sweep scene and record the fastest rate and its step count for kappa = 20, 200, 1000 in Table 2 (task 3)."]
  - ["条件数保持 1000，把动量从 0 调到 0.9 以上，再记一次步数，与 √κ 的预测比较（任务 4）。", "Keep kappa = 1000, raise the momentum above 0.9, record the step count again and compare with the sqrt(kappa) prediction (task 4)."]
