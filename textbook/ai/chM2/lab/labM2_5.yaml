注意:
  - ["实验里的损失是二次的、梯度是精确的、每步用全部数据。真实训练三条都不成立（随机梯度、曲率在变、分批），所以这些公式只给量级与趋势（M2.5.4 节）。", "The lab uses an exact quadratic loss and full-batch exact gradients; real training satisfies none of these, so the formulas give trends and orders of magnitude (Section M2.5.4)."]
  - ["把动量调到接近 1 时步数会先降后升：动量太大也会振荡，与学习率太大是同一类问题。", "Pushing the momentum towards 1 first helps and then hurts: too much momentum oscillates, just as too large a learning rate does."]
