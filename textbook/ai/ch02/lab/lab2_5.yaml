  - ["两层网络：h = φ(W⁽¹⁾x + b⁽¹⁾)，z = w⁽²⁾·h + b⁽²⁾，合格（类别 1）的概率 p = σ(z)；隐藏单元数为 0 时退化为逻辑回归，分界线只能是直线（式 (2.4.1)）。",
     "Two-layer network: h = φ(W⁽¹⁾x + b⁽¹⁾), z = w⁽²⁾·h + b⁽²⁾, probability of class 1 p = σ(z); with 0 hidden units it is logistic regression and the boundary is a straight line (Eq. (2.4.1))."]
  - 式: "∂L/∂z = (p − y)/n，  ∂L/∂W⁽¹⁾ = Xᵀ[(∂L/∂z) w⁽²⁾ᵀ ⊙ φ′(Z⁽¹⁾)]          (2.5.6)"
  - ["每一步对全部训练点算一次前向和反向，再按 θ ← θ − η∇L 更新（全批梯度下降）。学习率太大时损失会剧烈振荡甚至变成 NaN（2.1.5 节）。",
     "Each step runs one forward and one backward pass over all points and updates θ ← θ − η∇L (full-batch gradient descent). Too large a learning rate makes the loss oscillate or turn NaN (Section 2.1.5)."]
  - ["ReLU 网络的分界线由若干段直线组成；tanh 网络的分界线是光滑曲线。", "A ReLU network's boundary is made of straight pieces; a tanh network's boundary is smooth."]
步骤:
  - ["“月牙”场景：隐藏单元数取 0，学习率 0.5，训练 1000 步以上，记录训练准确率和损失（任务 1）。", "Moons: 0 hidden units, η = 0.5, train at least 1000 steps; record the accuracy and the loss (task 1)."]
  - ["隐藏单元数依次取 2、4、8、16，各训练到损失不再下降，填入表 1；找到准确率超过 99% 的设置（任务 2）。", "Set 2, 4, 8, 16 hidden units, train until the loss stops falling and fill in Table 1; find a setting above 99% (task 2)."]
  - ["“异或”场景：从 1 个隐藏单元开始逐个增加，找到准确率达到 100% 的最少单元数（任务 3）。与算例 2.4.1 比较。", "XOR: start from 1 hidden unit and add one at a time; find the fewest units reaching 100% (task 3). Compare with Example 2.4.1."]
  - ["回到“月牙”，16 个单元，学习率取 3（任务 4），描述损失曲线，并与学习率 0.5 比较。", "Back to moons, 16 units, η = 3 (task 4); describe the loss curve and compare with η = 0.5."]
