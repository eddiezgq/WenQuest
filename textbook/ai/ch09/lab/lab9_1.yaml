# 实验 9.1 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab9_1.js。
原理:
  - ["训练运算量 ≈ 6ND：前向每个词元约 2N 次运算，反向约 4N 次（9.1 节）。", "Training compute ≈ 6ND: about 2N per token forward and 4N backward (Section 9.1)."]
  - ["混合精度 + AdamW 每个参数 16 字节；ZeRO 依次切分优化器状态、梯度、参数（9.2 节）。", "Mixed precision + AdamW needs 16 bytes per parameter; ZeRO shards optimizer states, then gradients, then parameters (Section 9.2)."]
  - 式: "训练天数 = 6ND ÷（GPU 数 × 峰值 × 利用率 40%）÷ 86 400"
步骤:
  - ["“训练”场景：默认设置下读出训练天数与 GPU 小时，与 Llama 2 报告的数对照（任务 1）。", "Training scene: read the days and GPU hours at the defaults and compare with Llama 2 (task 1)."]
  - ["改 ZeRO 级别与 GPU 数，填表 1（任务 2）。", "Vary the ZeRO stage and GPU count; fill Table 1 (task 2)."]
  - ["“推理”场景：700 亿参数的模型按 16、8、4 位存放（任务 3）；7B 模型 16 条长序列的键值缓存（任务 4）。", "Inference scene: a 70B model at 16, 8, 4 bits (task 3); KV cache of 16 long sequences for 7B (task 4)."]
