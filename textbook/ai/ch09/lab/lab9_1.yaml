    表头: ["ZeRO 级别", "8 块 GPU", "64 块 GPU"]
    表头英文: ["ZeRO stage", "8 GPUs", "64 GPUs"]
    行: [["0", "", ""], ["1", "", ""], ["2", "", ""], ["3", "", ""]]
注意:
  - ["这是估算：没有计入框架的工作区、通信缓冲、显存碎片，也没有计入张量并行、流水线并行对激活值的切分。", "These are estimates: no framework workspace, communication buffers or fragmentation, and no activation sharding by tensor or pipeline parallelism."]
  - ["键值缓存按多头注意力计；分组查询注意力（如 8 个键值头）会小几倍。", "The KV cache assumes multi-head attention; grouped-query attention (e.g. 8 KV heads) is several times smaller."]
