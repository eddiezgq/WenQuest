注意:
  - ["机器按秒计费：做完点“关机”。朴素版较慢，整个程序约需一分钟。", "Billed by the second: press Stop when done. The naive kernels are slow; the whole run takes about a minute."]
  - ["测试数据是 −2 到 2 的整数，各版本的结果都是精确的整数，程序要求它们与 cuBLAS 逐位相同。", "The test data are integers from −2 to 2, so every version's result is exact; the program requires them to match cuBLAS bit for bit."]
  - ["屋顶线上各版本的计算强度按“不计缓存”估计；L2 缓存使实际的显存流量更小，点可能出现在斜坡上方。", "The intensities on the roofline ignore caches; the L2 makes real traffic smaller, so points can sit above the slope."]
思考题:
  - ["哪一步提速最多？用 5.8、5.9 节的分析解释。", "Which step gains most? Explain with Sections 5.8 and 5.9."]
  - ["如果 n = 1024 时双缓冲版明显慢于 n = 4096，用波次量化解释；还有什么别的原因？", "If the double-buffered version is clearly slower at n = 1024 than at 4096, explain with wave quantisation. What else might contribute?"]
