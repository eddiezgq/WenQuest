思考题:
  - ["版本 1 到版本 3 的差距，和版本 3 到版本 4 的差距，哪个大？为什么？", "Which gap is larger, v1 → v3 or v3 → v4? Why?"]
  - ["如果每个 SM 只放 1 个线程块时版本 5 变慢了，原因是什么（3.7 节）？", "If v5 is slower with one block per SM, why (Section 3.7)?"]
