注意:
  - ["这是教学模型：显存读量按“每次装入共享内存都从显存读”计，不计 L1、L2 缓存；真实 GPU 上同时运行的线程块共用 L2，实际流量更小。", "A teaching model: every shared-memory load is counted as a memory read, ignoring L1/L2; on a real GPU concurrent blocks share the L2 and move less."]
