注意:
  - ["小游戏上的结论不能直接搬到 Atari：那里图像观测更大、回报更稀疏，两条技巧的作用也更大。这里看的是方向与量级。", "Conclusions from a small game do not transfer directly to Atari, where observations are images and rewards far sparser; read the direction and the order of magnitude."]
  - ["关掉目标网络之后 Q 值可能飞起来，也可能只是震荡——随机种子不同结果不同，至少跑三个种子再下结论。", "Without a target network the values may blow up or merely oscillate depending on the seed; run at least three seeds before concluding."]
  - ["只用公开的开源环境与权重；本实验不下载任何游戏 ROM。", "Only open environments are used; no game ROMs are downloaded."]
思考题:
  - ["经验回放与目标网络，哪一条更像是在治“相关的数据”，哪一条更像是在治“自己追自己”？用你量到的曲线说明。", "Which trick addresses correlated data and which addresses the target chasing the estimate? Argue from your own curves."]
  - ["如果环境是非平稳的（车间里新加了一条产线），经验回放里的旧样本会不会变成拖累？该怎么处理？", "If the environment is non-stationary — a new line opens in the shop — do old samples in the replay buffer become a liability, and what would you do about it?"]
