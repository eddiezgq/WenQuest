标题: ["GPU 实验 15.7 并行仿真：吞吐与瓶颈", "GPU Lab 15.7 Parallel simulation: throughput and bottlenecks"]
目的: ["把环境数从 1 加到几千，量出每秒多少环境步、瓶颈卡在哪（仿真、网络前向、还是来回搬数据），再把它与论文公布的吞吐放在一起比。做完能自己估一次训练要多久。",
       "Scale the number of parallel environments from one to a few thousand, measure environment steps per second and find the bottleneck — simulation, network forward pass or data movement — then compare with published throughput and estimate how long a training run would take."]
显卡: basic
结果:
  - {名: fps_1, 说明: ["单个环境的吞吐", "throughput with one environment"], 单位: "步/秒"}
  - {名: fps_best, 说明: ["最好那一档的吞吐", "best throughput"], 单位: "步/秒"}
  - {名: envs_best, 说明: ["最好那一档的环境数", "environments at the best point"], 单位: "个"}
  - {名: speedup, 说明: ["最好那一档比单环境快多少", "speedup over one environment"], 单位: "倍"}
  - {名: share_sim, 说明: ["仿真占的时间比例", "share of time in simulation"], 单位: "%"}
  - {名: days_1e9, 说明: ["按最好那一档跑十亿步要多久", "days for a billion steps"], 单位: "天"}
文件: []
实际问题:
  标题: ["训练要跑多少次仿真", "How much simulation a training run needs"]
  内容: ["强化学习的数据是自己跑出来的：一次训练动辄上亿次环境步。同样的步数，仿真跑在哪里、一次并行多少个，决定了训练是几小时还是几星期。",
         "In reinforcement learning the data is generated by running the environment, often hundreds of millions of steps per run. Where the simulation runs and how many copies run at once decide whether training takes hours or weeks."]
原理:
  - ["并行环境把“一个一个走”变成“一批一起走”，网络前向就成了批量矩阵乘法——这正是 1.5 节说的提高计算强度（15.7 节）。", "Running many environments at once turns stepping into a batched matrix multiply, raising the arithmetic intensity discussed in Section 1.5."]
  - ["环境留在 CPU 上时，每一步的观测与动作都要过一次 PCIe；图像观测尤其贵（书里算过：每秒百万帧的 Atari 观测约需 30 GB/s）。", "With environments on the CPU every step crosses PCIe; image observations are especially costly — the chapter computes about 30 GB/s for a million Atari frames per second."]
  - ["公开数字：EnvPool 在 256 核上 Atari 约每秒 107 万帧；Isaac Gym 在一块 A100 上 Ant 约每秒 70 万步（8192 个环境）。", "Published figures: EnvPool reaches about 1.07M Atari FPS on 256 cores; Isaac Gym reaches about 700k steps/s on one A100 with 8192 Ant environments."]
步骤:
  - ["运行第 1 节，装好环境、确认显卡（任务 1）。", "Run section 1 to install and check the GPU (task 1)."]
  - ["运行第 2 节，把环境数从 1 加到 4096，记下每一档的每秒环境步（任务 2，填表 1）。", "Run section 2 scaling the environments from 1 to 4096 and record the throughput at each step (task 2, Table 1)."]
  - ["运行第 3 节，把时间拆成仿真、网络前向、数据搬运三段，记下各占多少（任务 3，填表 2）。", "Run section 3 to split the time into simulation, forward pass and data movement (task 3, Table 2)."]
  - ["运行第 4 节，用自己量到的吞吐估一次训练要多久，与论文数字比（任务 4）。", "Run section 4 to estimate the wall time of a training run from your own throughput and compare with the published numbers (task 4)."]
  - ["运行最后一格，回传结果。", "Run the last cell to send your results."]
