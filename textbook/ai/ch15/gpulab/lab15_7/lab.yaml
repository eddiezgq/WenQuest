注意:
  - ["本实验用的是向量化的简单环境，不是物理仿真器；绝对吞吐比论文低，要看的是“随环境数怎样变”与“瓶颈在哪一段”。", "This lab uses a simple vectorised environment rather than a physics engine, so the absolute numbers are lower than the published ones; read the scaling shape and the bottleneck instead."]
  - ["吞吐不是越高越好：并行太多会让每个环境的数据相关性变高、批次里重复的经验变多，反而要更多步才学会。", "Throughput is not everything: too much parallelism correlates the data and repeats experience, so more steps may be needed to learn."]
思考题:
  - ["如果观测是 84×84×4 的图像而不是几十个数，表 2 的三段比例会怎样变？按每秒的字节数算一笔账。", "If the observation were an 84x84x4 image instead of a few dozen numbers, how would the three shares change? Compute the bytes per second."]
  - ["环境数从 1024 加到 4096，吞吐涨了多少？如果没有翻四倍，差在哪里？", "Going from 1024 to 4096 environments, how much does throughput rise? If it is not fourfold, where does the rest go?"]
