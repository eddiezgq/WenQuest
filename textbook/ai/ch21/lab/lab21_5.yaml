# 实验 21.5 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab21_5.js。
原理:
  - ["**控制限与规格限来源不同、用途不同。** 控制限由过程自己的波动算出来（均值图用 x̄ ± A₂·R̄），回答“过程有没有变”；规格限由图纸给出，回答“做得出合格品吗”。两者的宽窄没有固定关系：能力很差的过程可以完全受控，能力很好的过程也可以天天报警（21.5 节）。", "Control limits come from the process's own variation and answer whether the process changed; specification limits come from the drawing and answer whether the part is acceptable. There is no fixed relationship between their widths: a process with poor capability can be perfectly in control, and a capable one can alarm constantly (Section 21.5)."]
  - ["**均值图对均值漂移灵，对方差变化钝。** 方差变大时子组均值的分布变宽，但中心没动，所以要等到某个均值碰巧出界才报警。**极差图才是看波动的那一张**——两张图必须一起看。", "The mean chart reacts quickly to a shift in the mean and slowly to a change in spread, because a wider distribution still has the same centre. The range chart is what watches the spread; the two must be read together."]
  - ["**三倍标准差控制限下，过程没变时也会报警**：理论上平均每 370 个子组一次。现场往往更频繁，因为控制限是用有限个子组**估**出来的——本实验把“用前多少个子组定控制限”做成可拖的参数，正是让你量这件事。", "Even with a stable process, three-sigma limits produce an alarm about once every 370 subgroups in theory. In practice it is more often, because the limits are estimated from a finite baseline — which is why the baseline length is a slider here."]
  - ["**学习式报警不是控制图的替代，是补充。** 本实验里的报警器只做一件事：用稳定期估出中心与散布，再看新子组离中心多远。它能同时看好几个量，所以“均值没动但别的变了”这类异常也抓得到；代价是它不知道什么叫异常，稳定期挑坏了就天天误报，而且**报警之后不告诉你该查什么**。", "The learned alarm here is a complement, not a replacement: it measures how far each new subgroup sits from a centre estimated during a stable window. It watches several quantities at once, so it reacts to upsets where the mean does not move — but it has no notion of what abnormal means, and it does not tell you what to go and look at."]
  - 式: "均值图控制限 = x̄ ± A₂·R̄；极差图上限 = D₄·R̄；由极差估过程标准差 σ̂ = R̄/d₂；Cp = (USL−LSL)/(6σ̂)"
步骤:
  - ["第一个场景，异常选 0、子组大小 5、基线 50、规格限 ±3：记下控制限、规格限、两者宽度之比与 Cp（任务 1），填表 1 第一行。再把规格限拖到 ±1.5 与 ±6，确认控制限一动不动。", "In the first scene with no upset, subgroup size 5, baseline 50 and ±3 spec limits, record the control limits, spec limits, their width ratio and Cp (task 1). Then move the spec limits to ±1.5 and ±6 and confirm the control limits do not move."]
  - ["注入均值漂移，大小依次 0.5、1.0、1.5、2.0，每档换三个重复编号，记下均值图要多少个子组才报警（任务 2），填表 2 上半。", "Inject mean shifts of 0.5, 1.0, 1.5 and 2.0, repeating each with three different repeat numbers, and record how many subgroups the mean chart needs (task 2)."]
  - ["换成方差变大，大小依次 0.5、1.0、1.5，同样记均值图与极差图各要多久（任务 3），填表 2 下半。", "Switch to a variance increase of 0.5, 1.0 and 1.5, recording both the mean chart and the range chart (task 3)."]
  - ["换成周期波动，大小 1.5：均值图抓得到吗？把基线从 50 拖到 120 再看一遍（任务 4），结论写进报告。", "Switch to the periodic upset at size 1.5: does the mean chart see it? Repeat with the baseline widened to 120 (task 4)."]
  - ["切到第二个场景，三种异常各走一遍，记下学习式报警多久发现、以及稳定期里两种办法各误报几次（任务 5），填表 3。", "In the second scene run all three upsets, recording how quickly the learned alarm reacts and how many false alarms each approach raises during the stable window (task 5)."]
