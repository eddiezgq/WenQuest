注意:
  - ["**“多久才报警”是个随机量。** 同样的设置换个重复编号，结果能差好几倍，所以表 2 要求每档记三次并写出范围。只记一次的数不能用来比较两种办法。", "The time to an alarm is a random variable: the same settings with another repeat number can differ severalfold, which is why each row asks for three repeats and a range."]
  - ["本实验只用了**最基本的一条判据**（均值出界、极差出界）。现场常用的还有连续七点同侧、连续上升等“游程判据”，它们对小漂移更灵，但也会把虚发警报率提高。报告里不要把本实验的结论当成“控制图的全部能力”。", "Only the basic out-of-limit rules are used here. Shop-floor practice adds run rules, which catch small shifts sooner but also raise the false-alarm rate. Do not read these results as the full capability of a control chart."]
  - ["学习式报警的阈值取的是稳定期距离的 99 分位，与三倍标准差是同一个意思。**换个分位数，它的灵敏度与误报率一起变**——这正是机器学习报警最常被忽略的一个旋钮。", "The learned alarm's threshold is the 99th percentile of the stable-window distances, in the same spirit as three sigma. Changing that percentile trades sensitivity against false alarms — the knob most often left undocumented."]
  - ["规格限在本实验里只用来**对照**，不参与任何报警判定。**真实车间里把规格限画在控制图上是常见错误**，本实验刻意把两者用不同颜色分开。", "The specification limits here are shown only for comparison and never drive an alarm. Drawing them on a control chart is a common shop-floor error, so the two are deliberately coloured differently."]
思考题:
  - ["控制图报警之后，你知道该去查什么（均值跑了还是波动大了）。要让学习式报警也具备这条好处，它的报警信息里至少要带上什么？", "A chart tells you what to inspect. What would the learned alarm have to report to be equally actionable?"]
  - ["如果用来定控制限的那 50 个子组里本身就藏着一个没被发现的异常，两种办法各会出什么错？怎么事先防住？", "If the baseline itself contained an undetected upset, how would each approach fail, and how would you guard against it?"]
  - ["把本实验的“多久才发现”与 21.2 节的代价表接起来：**发现晚一个子组，要多做多少件废品**？用你们自己的节拍算一遍。", "Connect the detection delay here with the cost table of Section 21.2: how many scrap parts does each extra subgroup of delay cost at your line's takt time?"]
