注意:
  - ["本实验的分数分布是**造出来的**（好件与坏件各取一个正态分布）。真实检测器的分数分布常常长尾、双峰，甚至随批次漂移。要记的是**结构性的结论**（基率怎样压垮查准率、代价怎样移动阈值），不是这里的具体百分数。", "The score distributions here are synthetic Gaussians. Real detectors have long tails, several modes and batch-to-batch drift. Take away the structural conclusions, not the particular percentages."]
  - ["把“一个零件拍几张图”调大时，本实验假设**坏件的缺陷在其中两张图上可见**。真实情况取决于拍摄方案；方案不同，这一组数就不同。报告里要写明你用的是哪种假设。", "When several images per part are used, this lab assumes the defect is visible in two of them. Real coverage depends on the imaging plan, so state the assumption in your report."]
  - ["**代价要用同一种单位**（比如都折成钱，或都折成工时）。把“漏检代价 = 1000 元”与“误判代价 = 1 件”混在一起算出来的阈值没有意义。", "Both costs must be in the same unit. Mixing money with pieces produces a meaningless optimum."]
  - ["读数里的“全判合格的准确率”是拿来对照的基线，**不是建议**。本实验不鼓励任何放弃检测的做法。", "The accuracy of passing everything is a baseline for comparison, not a recommendation."]
思考题:
  - ["你们厂的漏检代价与误判代价各是多少？把两个数写下来，回到实验里找最优阈值，与现在用的阈值比一比。写不出这两个数，说明第一件该做的事是去把它们问出来。", "What do a miss and a false alarm cost on your line? Find the optimum with those numbers and compare it with the threshold in use today."]
  - ["如果不良率本身会随批次变（换了一批来料就从 0.3% 跳到 3%），固定阈值还合适吗？要怎么改——改阈值、改判定规则，还是改报的指标？", "If the defect rate itself jumps between batches, is a fixed threshold still right? What would you change: the threshold, the decision rule, or the metric you report?"]
  - ["验收一个视觉检测系统，你会在合同里写哪三个数？为什么不是“准确率 ≥ 99%”？", "Which three numbers would you put in an acceptance clause for a vision system, and why is '99% accuracy' not one of them?"]
