注意:
  - ["公开数据里的故障是**人为加工**出来的单点缺陷（电火花加工），与现场轴承的分布式剥落不是一回事。凡引这套数据上的准确率，这一句必须带着（见第 21 章资料卡）。", "The faults in this dataset are single points machined by electro-discharge, not the distributed spalling found in service. Any accuracy quoted from it must carry that sentence."]
  - ["**不要把三个准确率平均。** 它们回答三个不同的问题，平均之后一个问题也答不了。报告里要三行分开写，并在每行后面写清这个数回答什么。", "Do not average the three accuracies: they answer three different questions. Report them as three rows, each with the question it answers."]
  - ["训练用时与显卡型号、批大小有关，**表 3 的三行必须在同一台机器、同一套超参数下测**。", "Wall time depends on the GPU and the batch size, so all three rows must come from one machine with one set of hyper-parameters."]
  - ["窗口长度决定了频率分辨率：窗口越短，包络谱上的峰越宽，**找峰的窗口也要跟着放宽**。表 2 里若两者差得多，先检查窗口长度，再怀疑模型。", "The window length sets the frequency resolution: shorter windows give broader peaks, so the search window must widen with them. If Table 2 shows a large gap, check the window length before blaming anything else."]
思考题:
  - ["你表 3 里“随机”与“按工况”差了多少个百分点？如果供应商只给你第一个数，你会怎么问第二个数？把这句话写成一条验收条款。", "How large is the gap between your random and condition-wise accuracies? If a supplier quotes only the first, how would you ask for the second — as an acceptance clause?"]
  - ["把转速从数据里抹掉（不作为输入），三种划分的准确率各会怎么变？动手试一次，并解释为什么“按工况”掉得最多。", "Remove the shaft speed from the inputs and rerun: how does each of the three numbers change, and why does the condition-wise one suffer most?"]
  - ["本实验的类别是按“哪个零件坏了”分的。车间真正要的往往是“还能用多久”。这两个问题的数据标注有什么不同？第二个问题为什么贵得多？", "This lab classifies which part is damaged, while the shop usually wants to know how long it can still run. How do the labels differ, and why is the second question far more expensive to answer?"]
