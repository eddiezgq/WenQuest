注意:
  - ["**单位是循环，不是小时。** 换算成时间要知道每个循环多长，而这与机队的使用方式有关，本实验不提供换算。", "The unit is cycles, not hours; converting requires knowing how long a cycle is on your fleet."]
  - ["**代价参数要自己填。** 笔记本里的计划停机、意外失效、提前浪费三个代价是示例值；换成你们自己的数，最优阈值会跟着变——这正是本实验要说明的事。", "The three cost parameters in the notebook are examples. Replace them with your own and the optimum moves, which is the point of the lab."]
  - ["**不要只报平均提前期。** 备件到货要三天，那就要保证**每一台**都提前三天，而不是平均三天。表 3 把两列并排放着就是为此。", "Never report only the mean lead time: if a spare takes three days, every unit needs three days, not the average."]
  - ["公开数据是**仿真**产生的，工况与噪声都比真实机队干净。本实验的数只能用来比较不同阈值、不同口径，**不能当成你们设备的预期表现**。", "The data is simulated and cleaner than a real fleet. Use these numbers to compare thresholds and conventions, never as an expectation for your own equipment."]
思考题:
  - ["你的模型偏早还是偏晚？如果偏晚，把代价函数里“漏报”的权重调高，最优阈值往哪边移？动手试一次。", "Does your model read early or late? Raise the weight on misses and see which way the optimum moves."]
  - ["把“每台至少提前 N 个循环”的 N 从 10 调到 30，最省的合规阈值要多花多少？这条曲线就是“备件备多久”的成本曲线。", "Raise the required lead from ten cycles to thirty: how much more does the cheapest compliant threshold cost? That curve prices your spares policy."]
  - ["本实验按“预测剩余寿命 + 阈值”做决策。另一种常见做法是直接训一个“未来 N 个循环内会不会失效”的分类器。两者各有什么长短？哪一种更容易写进验收条款？", "An alternative is to classify whether failure occurs within the next N cycles. What are the trade-offs, and which is easier to put in an acceptance clause?"]
