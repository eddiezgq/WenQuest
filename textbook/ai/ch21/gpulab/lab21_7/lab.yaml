注意:
  - ["**判据要先写、后测。** 先看结果再定判据，这份记录就没有意义。笔记本把判据写在第 2 节、数据在第 3 节，顺序是故意的。", "Write the criteria before measuring. The notebook states them in section 2 and only builds the data in section 3; the order is deliberate."]
  - ["**样本量算的是“缺陷件”的数量**，不是总件数。不良率千分之三的产线上，要凑够 60 个缺陷件得过两万件——这就是为什么验证常常要专门做缺陷样品。", "The sample size is a count of defective parts, not of parts. At three defects per thousand, sixty defective parts means twenty thousand parts — which is why validation usually needs deliberately made defect samples."]
  - ["**留出必须按批次**（或按模具、按班次），不能随机。随机留出会把同一批的图分到两边，验证结果偏乐观——与 21.3 节的划分口径是同一件事。", "The hold-out must be by batch, mould or shift, never random: a random hold-out puts images from the same batch on both sides and biases the result optimistically."]
  - ["本实验的图像是**合成的**（几何图形加噪声与缺陷），目的是让流程跑通且可复现。**换成你们自己的图之前，表 2、表 3 的数一个都不要外引。**", "The images here are synthetic so the workflow runs anywhere and reproducibly. None of the measured numbers should be quoted outside this lab."]
思考题:
  - ["把“查全率 ≥ 95%”改成“查全率的 95% 置信下限 ≥ 95%”，要测的件数变成几倍？如果判据改成 99%，又变成几倍？", "How many more parts does a confidence-bound criterion require than a point estimate, and how does that scale if the target rises from 95% to 99%?"]
  - ["你们厂的来料换一个供应商，按本实验的做法要重新做哪几步？哪几步可以不做，依据是什么？", "If a supplier changes, which steps here must be repeated and which may be skipped, and on what basis?"]
  - ["重训一版、指标更好，但在新批次上掉得更多——该不该换？把你的理由写成两句话，一句给工程师，一句给质量部门。", "A retrained version scores better overall but degrades more on the new batch. Should it ship? Write your reasoning in two sentences, one for the engineer and one for quality."]
