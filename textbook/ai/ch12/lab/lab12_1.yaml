  - ["梅尔刻度 mel(f) = 2595·lg(1 + f/700)：低频分得细、高频分得粗，与人耳一致。", "The mel scale mel(f) = 2595·log10(1 + f/700) is fine at low frequencies and coarse at high ones, like the ear."]
