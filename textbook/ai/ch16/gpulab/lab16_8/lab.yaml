注意:
  - ["生成器只见过那几十张真图，所以它能补的最多是“把这几十张的花样摊开”，补不出没见过的那一类。表 1 的差距上限就是这么来的。", "The generator has only seen those few dozen images, so at best it spreads out the variety already in them; it cannot invent a class it never saw. That is what bounds the gap in Table 1."]
  - ["换一批真图（不同随机种子）成绩会差好几个点。时间允许的话跑三个种子，表里记平均与范围。", "A different draw of real images shifts the result by several points. Run three seeds if time allows and report the mean and range."]
  - ["第二代那一问要跑两次完整训练，耗时翻倍。显卡时间紧的话，可以把扩散模型的训练轮数减半，结论的方向不变。", "The second generation doubles the training time. If GPU time is short, halve the diffusion training epochs; the direction of the result does not change."]
  - ["全部数据由程序现画，不含真实照片，也不下载任何模型权重。", "All data is drawn by the program; no real photographs and no downloaded weights."]
思考题:
  - ["合成图把差距补回了多少？剩下没补上的那一部分，缺的到底是什么——是“张数”还是“花样”？用表 1 与表 2 的数说明。", "What share of the gap did synthetic data close, and what is missing from the rest — quantity or variety? Argue from Tables 1 and 2."]
  - ["如果产线上新出现了一种从没见过的缺陷，这套办法会怎样？该怎样在上线前就发现这件事？", "What happens to this approach when a never-before-seen defect appears on the line, and how would you detect that before deployment?"]
