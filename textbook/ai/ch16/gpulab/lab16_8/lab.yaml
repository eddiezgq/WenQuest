标题: ["GPU 实验 16.8 用生成的图扩充训练集，在真图上评", "GPU Lab 16.8 Train on generated defects, evaluate on real ones"]
目的: ["把 16.8 节的案例搬到真模型上：先训一个条件扩散模型生成缺陷图，再用它给只有几十张真图的训练集补料，在真图上量检出成绩。补对了能补回多少、引导调过头会掉多少、合成图喂给合成图训出来的模型又会怎样——三件事都量出来。",
       "Run the case of Section 16.8 on a real model: train a conditional diffusion model, use it to augment a training set of only a few dozen real images, and evaluate on real images. Measure how much of the gap synthetic data closes, how much over-strong guidance costs, and what happens when a model is trained on its own output."]
显卡: basic
结果:
  - {名: auc_real, 说明: ["只用少量真图的曲线下面积", "AUC with the few real images only"], 单位: "—"}
  - {名: auc_syn, 说明: ["真图 + 合成图（引导合适）", "AUC with real plus well-guided synthetic"], 单位: "—"}
  - {名: auc_syn_hi, 说明: ["真图 + 合成图（引导调到 8）", "AUC with synthetic generated at guidance 8"], 单位: "—"}
  - {名: auc_full, 说明: ["全用真图（参照上限）", "AUC with all real images (reference)"], 单位: "—"}
  - {名: rec_real, 说明: ["只用少量真图：误报 5% 处查出率", "recall at 5% false alarms, real only"], 单位: "%"}
  - {名: rec_syn, 说明: ["真图 + 合成图：误报 5% 处查出率", "recall at 5% false alarms, with synthetic"], 单位: "%"}
  - {名: recovered, 说明: ["把全真参照的差距补回了多少", "share of the gap to the all-real reference recovered"], 单位: "%"}
  - {名: auc_gen2, 说明: ["拿合成图再训一代生成器之后", "AUC after a second generation trained on synthetic data"], 单位: "—"}
  - {名: n_real, 说明: ["少量真图是多少张", "number of real images used"], 单位: "张"}
