文件: []
实际问题:
  标题: ["缺陷样本不够用", "Not enough defective samples"]
  内容: ["第 11 章的检测模型要学会认划痕、压痕、锈斑，可产线上的缺陷件本来就少，罕见缺陷一个月也出不了几件。标注几十张容易，标注一千张不现实。生成模型能不能把这一千张补出来？补出来的到底管不管用，要在真图上评才算数。",
         "The detector of Chapter 11 must recognise scratches, dents and rust, but defective parts are rare and the rarest appear a few times a month. Labelling a few dozen is easy; labelling a thousand is not. Can a generative model supply the rest? The only honest test is on real images."]
原理:
  - ["合成数据补的是“样本量”。只要合成图的分布与真图对得上，多见几眼就有用；分布一偏，检测器就学到用不上的东西，甚至学成“认背景”的捷径（第 11 章、16.8 节）。", "Synthetic data supplies quantity. As long as its distribution matches, more examples help; where it is off, the detector learns something useless or falls back on a background shortcut (Chapter 11 and Section 16.8)."]
  - ["引导强度决定合成图的分布偏多少（16.4 节）：调小了类别不准，调大了每张都是“标准的划痕”。本实验用两档生成两批合成图，看检出成绩差多少。", "Guidance strength controls how far the synthetic distribution is pushed (Section 16.4): too weak and the labels are wrong, too strong and every image is the same textbook scratch. This lab generates two batches and compares."]
  - ["还有一件要紧的事：拿合成图再去训下一代生成器。每一代都只学到上一代的一部分花样，几代下来分布会越收越窄。本实验训两代，把这件事量出来。", "One more thing to check: training the next generator on synthetic data. Each generation learns only part of the previous one's variety, and the distribution narrows. This lab trains two generations and measures it."]
  - ["评价一律在真图上做，而且真图测试集与训练用的那几十张真图严格分开。只在合成图上评出来的成绩没有意义。", "All evaluation is on real images, with the test set strictly separate from the handful used for training. A score measured on synthetic data means nothing."]
步骤:
  - ["运行第 1 节，装好环境、生成真图集，划出“少量真图”与测试集（任务 1）。", "Run section 1 to set up, build the real image sets and split off the few training images and the test set (task 1)."]
  - ["运行第 2 节，用那几十张真图训条件扩散模型，再用两档引导各生成一批合成图（任务 2）。", "Run section 2 to train the conditional diffusion model on those few images and generate two batches at two guidance settings (task 2)."]
  - ["运行第 3 节，四种训练集各训一个检测器，在真图上评，填表 1（任务 3）。", "Run section 3 to train a detector on each of the four training sets and evaluate on real images, filling Table 1 (task 3)."]
  - ["运行第 4 节，拿合成图训第二代生成器，再走一遍同样的评测，填表 2（任务 4）。", "Run section 4 to train a second-generation model on synthetic data and repeat the evaluation, filling Table 2 (task 4)."]
  - ["运行最后一格，回传结果。", "Run the last cell to send your results."]
