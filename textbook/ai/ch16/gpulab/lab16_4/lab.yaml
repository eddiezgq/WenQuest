文件: []
实际问题:
  标题: ["调到多强才合适", "How strong should the guidance be"]
  内容: ["要用生成模型给车间补缺陷样本，第一件要决定的事就是引导调多强。调小了，生成的图不像指定的那一类，标签就是错的；调大了，每张都像“标准的划痕”，几百张长得一个样，补进训练集也没用。这一档到底该怎么定，本实验量给你看。",
         "The first decision when generating defect samples is how strong to make the guidance. Too weak and the images do not match the class they are labelled with; too strong and every image is the same textbook scratch, so hundreds of them add nothing. This lab measures where that setting should sit."]
原理:
  - ["无分类器引导把有条件与无条件两个噪声预测混起来：ε̃ = (1+w)·ε(x,c) − w·ε(x)。w = 0 就是不引导。训练时按一定概率把类别换成“空”，一个网络同时学会两件事（16.4 节）。", "Classifier-free guidance mixes the conditional and unconditional noise predictions as (1+w) eps(x,c) - w eps(x), with w = 0 meaning no guidance. During training the class label is dropped with some probability so that one network learns both (Section 16.4)."]
  - ["引导调强会把概率质量往“这一类最典型的样子”上挤：单张的类别一致率上去，整批的多样性下来。引导论文自己的表上也是这样——FID 变差、IS 变好（见 16.4 节）。", "Stronger guidance concentrates probability mass on the most typical appearance of the class: per-sample class consistency rises while batch diversity falls. The guidance paper's own table shows the same trade-off, with FID worsening as IS improves."]
  - ["这里的“弗雷歇距离”与 FID 是同一个算法（两组样本各拟合一个高斯再比），只是特征取自本实验自己训的小分类器，不是 Inception。所以它的绝对值不能与任何论文里的 FID 相比，只能在本实验内部横向比。", "The Frechet distance here uses the same formula as FID but takes features from this lab's own small classifier rather than Inception, so its absolute value cannot be compared with any published FID — only across the settings in this lab."]
  - ["还要查一件事：引导调得很大时，模型会不会干脆把训练图背出来。量一下生成图与训练集最近邻的距离就知道。", "One more thing to check: whether strong guidance makes the model reproduce training images outright. The distance to the nearest training image answers that."]
步骤:
  - ["运行第 1 节，装好环境、确认显卡，生成训练用的缺陷图（任务 1）。", "Run section 1 to set up the environment, check the GPU and generate the training images (task 1)."]
  - ["运行第 2 节，训条件扩散模型与评价用的分类器，记下训练耗时（任务 2）。", "Run section 2 to train the conditional diffusion model and the evaluation classifier, recording the training time (task 2)."]
  - ["运行第 3 节，把引导强度从 0 扫到 8，每一档记下弗雷歇距离、类别一致率、同类两两平均距离（任务 3），填表 1。", "Run section 3 to sweep the guidance from 0 to 8, recording the Frechet distance, class consistency and within-class pairwise distance at each (task 3) in Table 1."]
  - ["运行第 4 节，看最近邻距离与采样耗时（任务 4），填表 2；把生成的图按引导强度排成一排看一眼。", "Run section 4 for the nearest-neighbour distance and the sampling time (task 4) in Table 2, and look at the images laid out by guidance strength."]
  - ["运行最后一格，回传结果。", "Run the last cell to send your results."]
