标题: ["GPU 实验 16.4 引导强度：把分布推偏到什么程度", "GPU Lab 16.4 Guidance strength: how far it pushes the distribution"]
目的: ["在真的小扩散模型上重做 16.4 节那条曲线：训一个条件扩散模型生成四类缺陷图，再把无分类器引导的强度从 0 扫到 8，量出“单张更像这一类”与“整批更单调”这两件事各走多少。书里的玩具分布算得出解析解，这里看它在真模型上长什么样。",
       "Reproduce the curve of Section 16.4 on a real model: train a small conditional diffusion model on four classes of defect images, then sweep classifier-free guidance from 0 to 8 and measure both effects — each sample looking more like its class, and the whole batch becoming less varied. The chapter's toy has a closed form; here you see the same thing on a trained model."]
显卡: basic
结果:
  - {名: w_best_fid, 说明: ["弗雷歇距离最小的那个引导强度", "guidance strength with the lowest Frechet distance"], 单位: "—"}
  - {名: fid_w0, 说明: ["不引导时的弗雷歇距离", "Frechet distance without guidance"], 单位: "—"}
  - {名: fid_best, 说明: ["最好的那一档的弗雷歇距离", "best Frechet distance"], 单位: "—"}
  - {名: fid_w8, 说明: ["引导强度 8 的弗雷歇距离", "Frechet distance at guidance 8"], 单位: "—"}
  - {名: acc_w0, 说明: ["不引导时的类别一致率", "class consistency without guidance"], 单位: "%"}
  - {名: acc_w8, 说明: ["引导强度 8 的类别一致率", "class consistency at guidance 8"], 单位: "%"}
  - {名: div_w0, 说明: ["不引导时同类样本两两的平均距离", "mean pairwise distance within a class, no guidance"], 单位: "—"}
  - {名: div_w8, 说明: ["引导强度 8 的同类两两平均距离", "mean pairwise distance at guidance 8"], 单位: "—"}
  - {名: nn_w8, 说明: ["引导强度 8 时离训练集最近的距离", "distance to the nearest training image at guidance 8"], 单位: "—"}
