注意:
  - ["弗雷歇距离用的是本实验自己的特征，绝对值不能与论文里的 FID 比，只能在这张表内部比。换一个特征提取器，最好的那一档也可能挪动。", "The Frechet distance uses this lab's own features; its absolute value is not comparable with any published FID, only across the rows of this table. A different feature extractor can move the optimum."]
  - ["类别一致率是用另一个分类器打的分，它本身也会错。一致率很高不等于图像真的对——对着图看一眼再下结论。", "Class consistency is scored by a separate classifier that makes its own mistakes. A high rate does not prove the images are right; look at them."]
  - ["训练集只有几千张程序现画的图，不含任何真实照片，也不下载任何模型权重。", "The training set is a few thousand images drawn by the program; no real photographs and no downloaded model weights are involved."]
思考题:
  - ["弗雷歇距离最小的那一档，与类别一致率最高的那一档是不是同一个 w？如果不是，补训练集该按哪一个选？说出你的理由。", "Is the w with the lowest Frechet distance the same as the one with the highest class consistency? If not, which should be used for augmenting a training set, and why?"]
  - ["把“多样性”换一种量法（比如数一数生成图里缺陷的位置分布），结论还一样吗？为什么一个指标不够用？", "Measure diversity another way — say, by the spread of defect positions — and see whether the conclusion holds. Why is a single metric never enough?"]
