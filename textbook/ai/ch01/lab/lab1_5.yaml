    行英文: [["one CPU core", "1", "", "", "", ""], ["CPU (64 cores)", "1", "", "", "", ""], ["GTX 580", "1", "", "", "", ""], ["H100", "1", "", "", "", ""], ["H100", "128", "", "", "", ""]]
  - 标题: ["表 2  70 亿参数模型逐词生成（H100，B = 1）", "Table 2  Token generation, 7 B parameters (H100, B = 1)"]
    表头: ["权重位数", "Q", "Q/β", "每秒词元数", "转为受算力限制的 B"]
