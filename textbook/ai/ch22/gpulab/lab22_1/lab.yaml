实际问题:
  标题: ["屋顶这片光伏，明天能发多少，敢不敢报上去", "How much will the roof produce tomorrow, and dare you declare it?"]
  内容: ["问渠减速器厂屋顶装了一片光伏，车间里有一组储能。参加需求侧响应要**提前申报**每个时段从电网买多少电，实际与申报不符要按偏差结算。于是“明天能发多少”这个问题有了价钱：报高了，少发的那部分要按高价买回来；报低了，多发的电只能贱卖。本实验在公开气象数据上训一个预测模型，然后回答三个问题：它比最笨的基线强多少？换一种天气型还准不准？把它的误差折成钱是多少？",
         "The workshop has rooftop PV and a battery in the hall. Taking part in demand response means declaring, ahead of time, how much will be drawn from the grid in each interval, with the difference settled afterwards. 'How much will it produce tomorrow' therefore has a price: declare too much and the shortfall is bought back dear; declare too little and the surplus is sold cheap. This lab trains a forecaster on open weather data and answers three questions: is it better than the dumbest baseline, does it hold on a different weather regime, and what is its error worth in money?"]
原理:
  - ["光伏出力 ≈ **晴空出力 × 云的遮挡 × 温度修正**。晴空那一项由太阳几何算出来，是确定的；难的全在云。所以气象预报的误差会**原样传进**功率预报，模型再大也补不上（22.1 节）。", "PV output is roughly clear-sky output times a cloud factor times a temperature correction. The clear-sky term follows from solar geometry and is deterministic; all the difficulty is in the clouds, so the weather forecast's own error passes straight into the power forecast."]
  - ["**先打赢两个笨基线**：持续法（明天和今天一样）与气候法（历史同时刻平均）。打不赢它们的模型不要上线——它们一行特征工程都不需要（算例 22.1）。", "Beat two dumb baselines first: persistence and climatology. A model that cannot beat them should not be deployed; neither needs any feature engineering."]
  - ["**划分口径第五次露面。** 时间序列必须按时间划分，而且要留间隔；此外还要单独报“换一种天气型还准不准”——在晴天上训、到阴天上测，这是现场最常见的失效方式（22.1 节、算例 22.3）。", "Time series must be split in time order, with a gap. Beyond that, report the weather-regime split separately: train on clear days, test on overcast ones, which is the most common way these models fail in service."]
  - ["**调度要的是分位数，不是点预测。** 点预测回答“最可能是多少”，调度问“有多大把握不低于多少”。报区间必须同时报**名义覆盖率与实际覆盖率**（22.1 节）。", "Dispatch needs quantiles, not point forecasts: report both the nominal and the observed coverage of any interval you publish."]
  - 式: "弹球损失 L_q(y, ŷ) = max(q(y−ŷ), (q−1)(y−ŷ))；偏差成本 = Σ[ max(申报−实际,0)×电价×少发倍数 + max(实际−申报,0)×电价×贱卖倍数 ]×Δt"
步骤:
  - ["运行第 1 节：装环境、确认显卡（任务 1）。", "Run section 1 to install the environment and confirm the GPU (task 1)."]
  - ["运行第 2 节：取公开气象数据并折成光伏出力，记下小时数、来源与容量假设（任务 2），填表 1。", "Run section 2 to fetch the open weather data and convert it to PV output, recording the hours, the source and the capacity assumption (task 2) in Table 1."]
  - ["运行第 3 节：算两个笨基线，记下它们的均方根误差（任务 3），填表 2 前两行。", "Run section 3 for the two baselines, recording their RMSE (task 3) in the first rows of Table 2."]
  - ["运行第 4 节：按时间划分训一遍、按天气型划分再训一遍，记下两个均方根误差与训练用时（任务 4），填满表 2。", "Run section 4 to train under both split conventions, recording the two RMSE values and the wall time (task 4)."]
  - ["运行第 5 节：训三个分位数，记下名义覆盖率与实际覆盖率（任务 5），填表 3。", "Run section 5 to fit three quantiles and record the nominal and observed coverage (task 5) in Table 3."]
  - ["运行第 6 节：把误差折成偏差成本，记下两个方向的代价比与成本最低的申报偏置（任务 6），填表 4。", "Run section 6 to convert the error into imbalance cost, recording the direction ratio and the cost-optimal bias (task 6) in Table 4."]
  - ["运行最后一格，回传结果。", "Run the last cell to send your results."]
