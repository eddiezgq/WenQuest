注意:
  - ["**公开气象数据是再分析值，不是预报值。** 用它当输入，相当于假设“气象预报完全准确”，所以本实验的误差是**下界**，真实业务里要更大。引用本实验的数时必须带这句话。", "The open weather data is a reanalysis, not a forecast. Using it as input assumes a perfect weather forecast, so the errors here are a lower bound and will be larger in service. Any number quoted from this lab must carry that sentence."]
  - ["**辐照折成功率的那一步是本书的折算**（容量、温度系数、逆变器效率都是显式假设），不是任何厂家的实测曲线。换一套假设，表 1 以下的数全变。", "Converting irradiance into power uses this book's own assumptions for capacity, temperature coefficient and inverter efficiency, not any manufacturer's measured curve."]
  - ["**不要把两种划分的误差平均。** 它们回答两个不同的问题：按时间划分问“拿过去预测未来准不准”，按天气型划分问“换一种天气还准不准”。报告里要分两行写。", "Do not average the two split results: one asks whether the past predicts the future, the other whether the model transfers to another weather regime."]
  - ["夜里出力恒为零，**把夜间点算进均方根误差会把它压低一大截**。本实验的所有误差都只在白天的点上算，报告里也要写明这一条。", "Output is identically zero at night, and including those points flatters the RMSE. All errors here are computed on daylight hours only, and reports must say so."]
  - ["电价、罚金倍数是**显式假设**，与第 22 章算例同一套，不代表任何地区的真实规则。", "The prices and penalty multipliers are explicit assumptions shared with the chapter's worked examples and represent no real market."]
思考题:
  - ["你的“按天气型划分”比“按时间划分”差几倍？如果供应商只给你第一个数，你会怎么把第二个数写成一条验收条款？", "How much worse is your regime split than your time split? If a supplier quotes only the first, how would you write the second into an acceptance clause?"]
  - ["把气象输入换成带噪声的版本（给辐照加上 10% 的随机误差），四个数各会怎么变？哪一个变得最多？", "Add 10% random error to the irradiance input and rerun: which of the four numbers moves most, and why?"]
  - ["本实验的成本最低偏置是在一套假设的电价规则下算的。把你们自己的结算条款代进去，这个偏置变成多少？预测精度每提高 1 kW，值多少钱？", "The cost-optimal bias here comes from one assumed set of rules. Substitute your own settlement clauses: what is the optimum then, and what is one kW of RMSE worth?"]
