标题: ["GPU 实验 22.1 用公开气象数据训一个光伏功率预测模型，并用两种口径验收它", "GPU Lab 22.1 Train a PV power forecaster on open weather data and score it under two split conventions"]
目的: ["用一段公开的逐小时气象再分析数据（辐照、云量、气温）训一个光伏功率预测模型，然后做比训练更要紧的两件事：**按时间划分**验收（拿过去预测未来），再**按天气型划分**验收（在晴天上训、到阴天上测）。两个数会差很远。最后把误差折成**调度成本**——同样的均方根误差，不同的方向代价差几倍，而这件事只有算成钱才看得见。",
       "Train a PV power forecaster on an open hourly weather reanalysis (irradiance, cloud cover, temperature), then do the two things that matter more than training: score it with a time-ordered split (does the past predict the future) and with a weather-regime split (train on clear days, test on overcast ones). The two numbers differ widely. Finally convert the error into dispatch cost: the same RMSE costs very different amounts depending on its direction."]
显卡: basic
