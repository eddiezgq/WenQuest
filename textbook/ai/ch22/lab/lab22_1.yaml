注意:
  - ["本实验的电价、罚金倍数与光伏曲线都是**显式假设**，不代表任何地区的真实规则。要带走的是**结构性的结论**（罚金不对称时最优申报要偏、最优分位数由价钱比决定），不是这里的具体数字。", "The prices, penalty multipliers and PV curve here are explicit assumptions and represent no real market. Take away the structural conclusions, not the particular numbers."]
  - ["真实的结算规则往往比两个倍数复杂：有免考核带（偏差在百分之几以内不罚）、有按日或按月累计的口径、还可能分时段分档。**先把自己的规则抄下来，再决定怎么申报**。", "Real settlement rules are usually more complicated: dead bands, daily or monthly accumulation, tiered rates. Write your own rules down before deciding how to declare."]
  - ["本实验把预测误差当成**零均值的正态噪声**。真实的光伏预测误差有偏、随天气型变化、而且云来时相邻时刻一起错。分位数在真实数据上要**直接拟合**（弹球损失），不能靠正态假设换算。", "The lab models the forecast error as zero-mean Gaussian noise. Real PV errors are biased, weather-dependent and strongly correlated in time; quantiles should be fitted directly with the pinball loss rather than converted from a normal assumption."]
  - ["往低报不是没有代价的：本实验里它表现为贱卖的电更多。在有容量考核或可再生能源消纳考核的地方，**持续少报还可能另有处罚**——这一层本实验没有建模。", "Under-declaring is not free: here it shows up as more power dumped at the cheap price, and in some markets persistent under-declaration carries penalties of its own, which this lab does not model."]
思考题:
  - ["把你们合同里“少发怎么算、多发怎么算”两条抄下来，换算成本实验的两个倍数，找出最优偏置。它与你们现在的做法差多少？", "Copy your own two settlement clauses, convert them into the two multipliers here, and find the optimum. How far is it from what you do today?"]
  - ["如果申报不是每 15 分钟一次，而是日前一次性申报 96 个点，实验里的结论哪些还成立、哪些要改？", "If the declaration is made once day-ahead for all 96 intervals rather than interval by interval, which conclusions still hold?"]
  - ["预测团队的考核指标现在是均方根误差。按本实验的结果，你会建议改成什么？改了之后，怎么防止他们靠“一律往低报”刷分？", "The forecasting team is assessed on RMSE today. What would you change it to, and how would you stop the team from gaming the new metric by always declaring low?"]
