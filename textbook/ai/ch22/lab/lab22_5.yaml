注意:
  - ["电价、电池容量、效率、光伏与负荷曲线都是**显式假设**，与第 22 章算例同一套，不代表任何真实站点。要带走的是**结构性的结论**，不是这里的具体元数。", "The prices, capacity, efficiency and the PV and load curves are explicit assumptions shared with the chapter's worked examples, and represent no real site. Take away the structure, not the yuan figures."]
  - ["本实验把“越界”定义为**策略要的功率被压回可行范围**。真实站点上，这一步可能表现为报警、降功率运行、甚至保护跳闸，代价各不相同——报告里要写清楚你们那边它意味着什么。", "A violation here means the requested power had to be clipped. On a real site that may appear as an alarm, a derate or a protection trip, with very different costs. State what it means on yours."]
  - ["真电池的效率与可用容量**还会随温度、荷电区间与循环次数变**。本实验只给了两个固定值；现场要做的是定期标定，而不是一次调好。", "A real cell's efficiency and usable capacity also drift with temperature, state-of-charge window and cycle count. The lab fixes two values; a real site recalibrates periodically."]
  - ["安全层余量不是越大越好：表 2 的最后两行就是为了让你看见**多留的余量是实打实的钱**。合适的做法是量出越界刚好归零的那一档，再按标定误差留一点点。", "A bigger margin is not better: the last rows of Table 2 exist to show that extra margin is real money. Measure the smallest margin that reaches zero and add a little for calibration error."]
思考题:
  - ["你们那组储能，荷电状态越一次界，运维上实际发生什么？把它折成钱，用“电费 + 越界次数 × 这个钱”做目标再调一遍，参数差多少？", "What happens on your site when the state of charge hits a limit? Price it, retune with 'bill plus violations times that price', and see how different the parameters are."]
  - ["如果电池的效率与可用容量每季度都要重新标定，安全层的余量该怎么定？固定值、按标定误差算，还是让它自己随运行数据收紧？", "If efficiency and usable capacity are recalibrated every quarter, how should the margin be set: a fixed value, a value derived from the calibration error, or one that tightens itself from operating data?"]
  - ["验收一个储能控制策略，你会在合同里写哪两列数？为什么“比原来省 8%”这一句不够？", "Which two columns would you put in an acceptance clause for a storage controller, and why is 'saves 8%' not enough on its own?"]
