  - 标题: ["表 2  真设备与安全层", "Table 2  The real device and the safety layer"]
    表头: ["安全层余量", "电费（元）", "越界次数", "安全层的价钱"]
    表头英文: ["safety margin", "bill (CNY)", "violations", "what the layer costs"]
