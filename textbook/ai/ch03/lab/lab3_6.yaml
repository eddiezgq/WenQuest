# 实验 3.6 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab3_6.js。
原理:
  - ["一个线程束的 32 个线程执行同一条指令。分支条件在线程束内不一致时，两条路径依次执行，执行一条路径时另一类线程空转；路径结束后汇合（3.6 节）。",
     "The 32 threads of a warp execute one instruction at a time. When a branch condition differs within a warp, the two paths run in turn and the other threads idle; they reconverge afterwards (Section 3.6)."]
  - 式: "SIMT 效率 = 活动线程·指令 ÷ (32 × 发射的指令)          (3.6.1)"
  - ["调度器每个周期从准备好的线程束中挑一个发射一条指令。一个线程束一轮“读一次显存 + k 条算术”发 k + 1 条、用 L + k 个周期，n 个线程束轮流时利用率约为 min(1, n(k+1)/(L+k))（式 (3.7.1)，利特尔定律）。",
     "Each cycle the scheduler issues one instruction from a ready warp. One round of 'one load + k arithmetic' issues k + 1 instructions in L + k cycles, so n warps give about min(1, n(k+1)/(L+k)) (Eq. (3.7.1), Little's law)."]
  - 式: "U ≈ min(1, n(k+1)/(L+k))；带宽限制时 U ≤ (k+1)/g，H100 的 g ≈ 40          (3.7.1)、(3.7.2)"
步骤:
  - ["“分化”场景：条件 0（无分支）和条件 2（奇偶），then、else 各 4 条，记录前 4 个线程束发射的指令和 SIMT 效率，填入表 1（任务 1）。模拟器统计 256 个线程束，图中只画前 4 个。",
     "Divergence: conditions 0 (none) and 2 (odd/even), 4 instructions on each path; record the instructions per warp and the SIMT efficiency in Table 1 (task 1)."]
  - ["改为条件 1（前后半）和条件 3（按线程束），填入表 1，解释条件 3 为什么没有损失（任务 2）。", "Conditions 1 (halves) and 3 (per warp); fill in Table 1 and explain why condition 3 loses nothing (task 2)."]
  - ["条件 4（按数据），概率取 0.5、0.9、0.99，填入表 1（任务 3）。与算例 3.6.2（4096 个线程束）比较，样本数不同，结果略有差别。", "Condition 4 (data) with probability 0.5, 0.9, 0.99; fill in Table 1 (task 3) and compare with Example 3.6.2."]
  - ["“延迟隐藏”场景：L = 700，k = 4，线程束数取 1、4、16，记录模拟的利用率与估计，填入表 2（任务 4）。", "Latency: L = 700, k = 4, warps 1, 4, 16; record the simulated utilization and the estimate in Table 2 (task 4)."]
  - ["保持 16 个线程束，增大 k，找到利用率超过 99% 的最小 k（任务 5），算出这时的计算强度 k/2 FLOP/B。", "Keep 16 warps and raise k until utilization exceeds 99% (task 5); compute the intensity k/2 FLOP/B."]
  - ["打开带宽限制，k = 4，线程束数取 16 和 32（任务 6），说明利用率为什么不再升高。", "Turn on the bandwidth limit with k = 4 and 16 or 32 warps (task 6); explain why utilization stops rising."]
