注意:
  - ["这是教学模型，不是真实 GPU 的仿真：只模拟一个调度器；指令只有“读显存”和“算术”两种，都是示意；读显存的延迟是固定值；算术指令之间没有依赖延迟，可以逐周期连发；分化只统计发射的指令与活动线程；不模拟 L1/L2 缓存、双发射、寄存器存储体、指令缓存。周期数只用来比较不同写法，不代表某块显卡的实际耗时（第 14 轮细则 2.5 节）。",
     "This is a teaching model, not a GPU simulator: one scheduler; only two illustrative instructions (load, arithmetic); a fixed load latency; no L1/L2 caches, dual issue, register banks or instruction cache. Cycle counts compare ways of writing code; they are not real timings of any GPU."]
  - ["调度策略为“贪心后取最老”：上一周期发射的线程束仍准备好就继续发它，否则取编号最小的准备好的线程束。利用率取后一半周期（稳态）。", "The scheduler is greedy-then-oldest; utilization is measured over the second half of the run (steady state)."]
  - ["真实 H100 每个调度器最多 16 个线程束；实验允许到 32，只为看出带宽限制。", "A real H100 allows at most 16 warps per scheduler; the lab allows 32 only to show the bandwidth limit."]
思考题:
  - ["为什么“按线程束编号分支”没有损失？写 CUDA 程序时，怎样安排数据，才能让同一个线程束里的线程尽量走同一条路径？", "Why does branching on the warp number cost nothing? How would you arrange data so that threads of one warp tend to take the same path?"]
