标题: ["GPU 实验 17.1 pass@1 与 pass@10：温度该调多少", "GPU Lab 17.1 pass@1 versus pass@10: where to set the temperature"]
目的: ["在一个公开权重的小代码模型上把 17.1 节那两条曲线真的测出来：自写一组编程题，扫采样温度，算 pass@1 与 pass@10，看两条曲线的最优温度分别落在哪。顺带把“执行模型生成的代码”这件事按 17.6 节的规矩做一遍：子进程、超时、无网络。",
       "Measure the two curves of Section 17.1 on a real open-weights code model: write your own set of programming problems, sweep the sampling temperature, compute pass@1 and pass@10, and find where each one peaks. Along the way, run the generated code the way Section 17.6 says to: a separate process, a timeout, and no network."]
