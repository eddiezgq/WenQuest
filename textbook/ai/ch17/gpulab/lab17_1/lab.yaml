实际问题:
  标题: ["温度该调多少", "Where to set the temperature"]
  内容: ["要把代码模型接进工具链，第一件要定的事就是采样温度。调低了每次都给同一个答案，错了也只能一直错；调高了单次命中率掉下来，可多采几个总有一个对。到底该调多少，取决于你打算采几次——而这件事是能测出来的。",
         "The first setting to fix when wiring a code model into a toolchain is the sampling temperature. Low means the same answer every time, wrong ones included; high means a lower single-shot hit rate but a better chance that one of several samples works. Which is right depends on how many samples you intend to draw, and that can be measured."]
原理:
  - ["pass@k 的无偏估计量：一道题采 n 个样本、c 个通过，这道题的 pass@k 是 1 − C(n−c,k)/C(n,k)。用经验 pass@1 去算 1 − (1−p̂)^k 是有偏的（17.1 节，Chen 等 2021）。", "The unbiased estimator: with c of n samples passing, a problem's pass@k is 1 - C(n-c,k)/C(n,k). Using the empirical pass@1 in 1 - (1-p)^k is biased (Section 17.1, Chen et al. 2021)."]
  - ["温度越高，采样分布越平，单次采对的概率越低，但 k 次里“有一个对”的概率可能更高。所以 pass@1 与 pass@k 的最优温度不是同一个——Codex 论文给的那一组是 pass@1 用 0.2、pass@100 用 0.8。", "A higher temperature flattens the sampling distribution: each sample is less likely to be right, but the chance that one of k is right can go up. So pass@1 and pass@k peak at different temperatures; the Codex paper reports 0.2 and 0.8."]
  - ["题目要自己写。公开基准很可能已经进过训练数据（17.1 节给了重叠率的原始数字），用它测出来的分数会虚高。自写的题目数量少、噪声大，但口径是干净的。", "Write your own problems. Public benchmarks have very likely been seen in training (Section 17.1 gives the measured overlap rates), so scores on them run high. Your own set is small and noisy but has a clean provenance."]
  - ["执行模型生成的代码**本身就是安全风险**（Codex 论文第 2.3 节的原话）。本实验按最小的一套来：单独的子进程、硬超时、不给网络。", "Executing generated code is itself a security risk, as the Codex paper states. This lab uses the minimum: a separate process, a hard timeout and no network."]
步骤:
  - ["运行第 1 节，装环境、确认显卡、下载模型（任务 1）。", "Run section 1 to set up, check the GPU and download the model (task 1)."]
  - ["读第 2 节的题目与执行器：题目是自己写的，执行在子进程里带超时（任务 2）。按自己的方向再加两道题。", "Read the problems and the runner in section 2 — the problems are hand-written and execution is in a subprocess with a timeout (task 2). Add two problems of your own."]
  - ["运行第 3 节，扫温度采样，记下每一档的 pass@1 与 pass@10（任务 3），填表 1。", "Run section 3 to sweep the temperature, recording pass@1 and pass@10 at each setting (task 3) in Table 1."]
  - ["运行第 4 节，看超时与报错的样本数、生成速度，并把“用 1−(1−p̂)^k 算”与无偏估计量对照（任务 4），填表 2。", "Run section 4 for the timeout and crash counts, the generation speed, and the comparison between the biased formula and the unbiased estimator (task 4) in Table 2."]
  - ["运行最后一格，回传结果。", "Run the last cell to send your results."]
