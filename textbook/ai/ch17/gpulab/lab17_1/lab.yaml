注意:
  - ["自写的题目只有十几道，所以每一档的 pass@k 都带着不小的随机误差。把同一档跑两次，看看两次差多少，再决定表里的差值能不能当真。", "With only a dozen hand-written problems the error bars are wide. Run one setting twice and compare before taking any difference in the table seriously."]
  - ["本实验测出来的绝对值不能与任何论文里的 HumanEval 分数比：题目不同、模型不同、提示不同。能比的是**两条曲线的形状**。", "The absolute numbers here cannot be compared with any published HumanEval score: different problems, model and prompt. What transfers is the shape of the two curves."]
  - ["生成的代码一律在子进程里跑、带超时。不要为了省事直接 exec——这一条不是客套话，17.6 节有专门的讨论。", "Always run generated code in a subprocess with a timeout. Do not exec it inline for convenience; Section 17.6 explains why."]
思考题:
  - ["如果你的工具链每道题只采一次，温度该定在哪？如果采十次再挑一个能过测试的，又该定在哪？用表 1 的数回答，并说明“能不能跑测试”为什么会改变这个选择。", "If your toolchain draws one sample per problem, where should the temperature sit? And if it draws ten and keeps one that passes the tests? Answer from Table 1, and explain why being able to run tests changes the choice."]
  - ["把你自己加的两道题拿掉再算一遍 pass@1，变化有多大？由此说明“自写十几道题”这种评测的误差有多大，以及该怎样报这种结果。", "Recompute pass@1 without the two problems you added. How much does it move, and what does that say about reporting results from a dozen hand-written problems?"]
