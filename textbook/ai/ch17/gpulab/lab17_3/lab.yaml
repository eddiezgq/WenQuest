注意:
  - ["本实验测的是**一块卡上的单次推理**，没有批处理、没有并发。线上服务会把多个请求凑成一批，单请求的时延会比这里高，吞吐则高得多（第 9 章）。这里要看的是**随上下文长度怎么长**，不是绝对值。", "This measures a single inference on one GPU with no batching or concurrency. A served system batches requests, so per-request latency is higher and throughput far higher (Chapter 9). What transfers is the shape of the curve, not the absolute numbers."]
  - ["小模型上预填充那一段占比没有大模型高。换一个更大的模型重跑，表 1 的倍数会更陡。", "On a small model prefill is a smaller share than on a large one. Repeating this with a bigger model makes the ratios in Table 1 steeper."]
  - ["这里的“复用前缀”是本地 KV 缓存，与各家 API 的提示缓存不是一回事：后者还涉及写入成本与存活时间（17.3 节给了价格倍数的折算）。", "The prefix reuse here is a local KV cache, which is not the same thing as a vendor's prompt caching: that also involves a write cost and a time-to-live (Section 17.3 gives the price arithmetic)."]
思考题:
  - ["按表 1 的“每词元多少微秒”估一下：如果智能体每一步往上下文里加 800 个词元，走到第几步时单步时延会超过一秒？与表 2 的实测对一对。", "From the microseconds-per-token column, estimate at which step the per-step latency passes one second if each step adds 800 tokens, and compare with Table 2."]
  - ["如果把“工具返回的大段内容”换成“返回一个摘要 + 一个可再查的句柄”，表 2 的两列会怎样变？这个改法的代价是什么？", "What happens to Table 2 if a tool returns a summary plus a handle to fetch more, rather than the full content? What does that design cost you?"]
