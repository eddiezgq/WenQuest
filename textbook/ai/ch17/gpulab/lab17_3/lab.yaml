标题: ["GPU 实验 17.3 多步工具调用的时间都花在哪", "GPU Lab 17.3 Where the time goes in a multi-step tool loop"]
目的: ["在真模型上把 17.3 节那笔账测出来：一个智能体每走一步，都要把前面所有东西重新过一遍，所以每一步都比上一步慢。量出单步时延随上下文长度怎么长、前缀复用（KV 缓存）省了多少，再折算“一个 20 步的任务要多久”。",
       "Measure the accounting of Section 17.3 on a real model: at every step the agent re-reads everything that came before, so each step is slower than the last. Measure how the per-step latency grows with context length, how much reusing the prefix (the KV cache) saves, and work out how long a twenty-step task takes."]
显卡: basic
