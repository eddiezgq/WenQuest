实际问题:
  标题: ["智能体为什么越跑越慢", "Why an agent slows down as it runs"]
  内容: ["把日报智能体挂上线之后，工程师发现一件怪事：前几步很快，越往后越慢，到第二十步时一步要等好几秒。模型没变、工具没变，慢在哪里？答案在上下文上——每走一步，前面所有的提示、工具定义、工具返回的内容都要重新过一遍。",
         "After the daily-report agent goes live the first steps are quick and the later ones crawl, until one step takes several seconds. The model has not changed and neither have the tools, so where does the time go? In the context: at every step the whole prompt, the tool definitions and every tool result so far are processed again."]
原理:
  - ["官方文档的原话：**请求里的一切都计入上下文窗口**——系统提示、每一条消息、工具定义、工具结果、以及生成的响应。所以第 n 步要处理的输入词元大致随 n 线性增长，整个任务的总量随 n² 增长（17.3 节）。", "The official wording is that everything in the request counts towards the context window: the system prompt, every message, the tool definitions, the tool results and the generated response. The input at step n therefore grows roughly linearly with n, and the total over a task grows as n squared (Section 17.3)."]
  - ["一次生成分两段：预填充（把整段上下文过一遍，算力与长度成正比）与逐词元解码（每个新词元一次前向，受显存带宽限制）。上下文一长，预填充那一段就开始主导——这与第 8、13 章是同一笔账。", "A generation has two phases: prefill, which processes the whole context and scales with its length, and token-by-token decoding, which is bandwidth-bound. As the context grows, prefill starts to dominate — the same accounting as in Chapters 8 and 13."]
  - ["前缀复用（KV 缓存）把已经算过的那一段键值留着，下一步只算新增的部分。官方文档给了价格倍数，但**没给任何“省多少”的百分比**，所以时延这一侧只能自己测——这就是本实验要做的事。", "Reusing the prefix keeps the already-computed keys and values so that only the new part is processed. The official documentation gives price multipliers but no percentage for the saving, so the latency side has to be measured — which is what this lab does."]
  - ["工具定义本身也是前缀的一部分。工具一多，这一段就越长，而它每一步都一模一样——所以它是最该被缓存的那一段（17.5 节）。", "The tool definitions are part of that prefix too. The more tools, the longer it is, and it is identical at every step — which makes it the single best thing to cache (Section 17.5)."]
步骤:
  - ["运行第 1 节，装环境、确认显卡、下载模型（任务 1）。", "Run section 1 to set up, check the GPU and download the model (task 1)."]
  - ["运行第 2 节，量预填充时延随上下文长度怎么长，记下几档的数（任务 2），填表 1。", "Run section 2 to measure how prefill latency grows with context length, recording several settings (task 2) in Table 1."]
  - ["运行第 3 节，模拟一个 20 步的智能体循环，分别在“每步重算”与“复用前缀”两种做法下计时（任务 3），填表 2。", "Run section 3 to simulate a twenty-step agent loop, timing it both with and without prefix reuse (task 3) in Table 2."]
  - ["运行第 4 节，把工具定义加长一倍再跑一次，看它对两种做法各有多大影响（任务 4）。", "Run section 4 with the tool definitions doubled in length and see how each approach is affected (task 4)."]
  - ["运行最后一格，回传结果。", "Run the last cell to send your results."]
