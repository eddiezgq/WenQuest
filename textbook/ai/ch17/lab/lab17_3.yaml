    行: [["什么都不做", "—", "", "—"], ["整件事重试", "2 次", "", ""], ["整件事重试", "4 次", "", ""], ["每步自检", "查出率 0.5", "", ""], ["每步自检", "查出率 0.8", "", ""], ["每步自检", "查出率 0.95", "", ""], ["末端校验", "0.95 / 0.05", "", ""], ["末端校验", "0.95 / 0.90", "", ""]]
注意:
  - ["本实验按解析式算，不做采样，所以读数没有随机抖动。真实智能体的每步出错率不是常数（难的步骤更容易错），也不是相互独立的（一步错了后面更容易接着错），所以这里给的是**乐观**的估计。", "This lab evaluates closed-form expressions, so the readouts have no sampling noise. In a real agent the per-step error is neither constant nor independent across steps, so these numbers are the optimistic case."]
  - ["“整件事重试”有两个前提：失败要看得出来，而且重做一遍是可以的。改了数据库、发了邮件这类动作不满足第二条——所以它在真实系统里远不如看上去好用。", "Retrying the whole task assumes two things: failures are visible, and the work can simply be done again. Actions that changed a database or sent an email break the second assumption."]
  - ["没有任何论文给出过“逐步成功率曲线”，所以本书只把 (1−p)ⁿ 当数学恒等式用，不挂任何引文。相近的两个公开量（τ-bench 的 pass^k、METR 的时间视界）口径都不是“步数”，见 17.3、17.6 节。", "No paper gives a per-step success curve, so this book treats (1-p)^n purely as an identity, with no citation attached. The two closest published quantities are measured against repeated trials and task length, not steps."]
思考题:
  - ["把每步出错率从 5% 降到 2.5%（减一半），与“整件事重试两次”相比，哪一个买回来的多？在什么步数上两者打平？这件事对“该把力气花在哪”有什么提示？", "Compare halving the per-step error with retrying the whole task twice. Which buys more, and at what number of steps do they tie? What does that say about where to spend effort?"]
  - ["每步自检本身也要调一次模型。把“调用次数”算进来重做表 2：每步自检的真实代价是多少倍？在什么情况下它仍然划算？", "A per-step check costs an extra model call. Redo Table 2 counting calls: how much more expensive is per-step checking, and when is it still worth it?"]
