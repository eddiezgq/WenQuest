# 实验 23.3 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab23_3.js。
原理:
  - ["代价函数式规划：在若干候选加速度里挑**代价最低**的那一个。代价有三项——跟车距离偏离期望值、车速偏离巡航目标、舒适（加速度平方）。权重决定三者怎么换：往“跟紧”调，通行效率上去；往“跟远”调，车距宽了，可是前车一刹就要大幅修正（23.4 节）。", "The planner picks the cheapest of a set of candidate accelerations under three cost terms: gap error, speed error and comfort. The weights set the exchange rate: tighter following buys traffic flow, looser following buys margin but needs large corrections whenever the lead brakes."]
  - ["**通行效率用交通流的标准口径**：流量 q = 3600·v /（车距 + 车长），单位 辆/小时。它正是“跟得紧就通得多”这件事的量化，也正是跟车距离权重真正在交易的东西。", "Traffic flow uses the standard traffic-engineering definition, q = 3600·v/(gap + vehicle length) in vehicles per hour. It quantifies 'closer following carries more cars', which is exactly what the gap weight trades."]
  - ["**三个指标不可能同时最好，而且三个最优点不在同一处**。所以“调参调到最好”这句话，不说清按哪个指标，就没有意义；只报一个指标的调参结论，一定是错的（算例 23.4）。", "The three metrics cannot be optimal together and their optima sit at different weights. 'Tuned to the best' means nothing until you say on which metric, and a tuning result quoted on one metric alone is wrong."]
  - ["**可用区间两头都是悬崖**：往小调就侵犯最小安全间距，往大调急刹回升。本实验里既不侵犯也不急刹的权重只有 0.20—0.57 这一段，宽度不到三倍——而权重是可以连续调的。这就是“调快一点点就不安全了”的样子。", "The usable band has a cliff at each end: smaller weights violate the minimum safe gap, larger ones bring the hard braking back. Here only 0.20 to 0.57 does neither — under a factor of three, on a knob that turns continuously."]
  - ["**时延把这段区间压窄。** 规划器看到的是若干拍以前的车距与车速，踩下去的却是现在。时延不足一个控制周期也要占一个周期（向上取整），所以 400 ms 在 50 ms 的周期里就是 8 拍（23.7 节）。", "Latency narrows that band: the planner acts on a gap and a speed from several cycles ago. A latency shorter than one cycle still costs a whole cycle, so 400 ms is eight cycles at 20 Hz."]
  - 式: "最小安全间距 = 3.0 m + 0.6 s × 车速；减速度低于 −3.0 m/s² 记一次急刹；流量 q = 3600·v /（车距 + 车长）"
步骤:
  - ["第一个场景，车速权重 1.0、舒适权重 0.6、前车激烈程度 1.0、时延 100 ms：把跟车距离权重依次取 0.02、0.05、0.10、0.20、0.40、0.57、1.13、3.20，每档记下平均车距、通行效率、急刹次数、侵犯次数（任务 1—4），填表 1。", "In the first scene, with the speed weight at 1.0, the comfort weight at 0.6, aggressiveness 1.0 and 100 ms of latency, step the gap weight through 0.02, 0.05, 0.10, 0.20, 0.40, 0.57, 1.13 and 3.20, recording mean gap, flow, hard brakes and violations (tasks 1–4) in Table 1."]
  - ["从表 1 里读出三件事，写进表 2：流量最高的那一档是哪一档、它侵犯几次；安全区间内流量最高的那一档是哪一档；既不侵犯也不急刹的权重区间是哪一段。", "Read three facts out of Table 1 into Table 2: which setting has the highest flow and how many times it violates; which is the highest-flow setting among those that never violate; and which band does neither."]
  - ["把车速权重依次取 0.2、1.0、3.0（跟车距离权重固定 0.20），记下流量与侵犯次数，填表 2 下半部分——看“另一个权重”会不会把结论推翻。", "Step the speed weight through 0.2, 1.0 and 3.0 with the gap weight fixed at 0.20, recording flow and violations, to see whether another weight overturns the conclusion."]
  - ["切到第二个场景，跟车距离权重留在 0.20，把时延依次取 0、100、200、400 ms，每档记下“既不侵犯也不急刹的档数”与区间（任务 5），填表 3。", "In the second scene, with the gap weight at 0.20, step the latency through 0, 100, 200 and 400 ms, recording the count and the span of clean settings (task 5) in Table 3."]
  - ["时延留在 400 ms，把前车激烈程度拖到 1.2，记下还剩几档，写进表 3 最后一行。", "With 400 ms of latency, raise the lead aggressiveness to 1.2 and record how many clean settings survive, in the last row of Table 3."]
