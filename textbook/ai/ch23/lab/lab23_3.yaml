注意:
  - ["本实验的最小安全间距取的是**固定时距公式**（3.0 m + 0.6 s × 车速），这是一条**显式假设，不是物理定律**。真正的安全间距要按路面、能见度、制动能力来定；换一条公式，可用区间的位置和宽度都变。", "The minimum safe gap here is a fixed-headway formula and an explicit assumption, not a law of physics. A real safe gap depends on surface, visibility and braking capability, and another formula moves both the position and the width of the usable band."]
  - ["本实验只有**一辆前车、一条直道、三个权重**。真规划器有十几个权重且互相耦合，调参要在成千条场景上做，而且要分别报“最坏情形”。这里的区间宽度只说明“存在一个窄区间”这件事，不是任何真车的标定值。", "The lab has one lead vehicle, one straight road and three weights. A real planner has a dozen coupled weights, tuned over thousands of scenarios with worst cases reported separately. The width here demonstrates that a narrow band exists; it is not any vehicle's calibration."]
  - ["**侵犯次数不是碰撞次数。** 本实验的任何一档都没有真撞上；“侵犯”指的是车距落到最小安全间距以内的控制周期数。它是一个**提前量被吃掉了**的信号——真车上对应的是接管、报警、乘客抱怨，不是事故。", "A violation is not a crash: no setting here ever collides. It counts the control cycles spent inside the minimum safe gap — a signal that the margin has been eaten, corresponding to interventions, alarms and complaints rather than accidents."]
  - ["前车的五次刹车是**写死的**（时刻、持续、幅度都在代码里），为的是让你能重复同一条工况。真路上的前车行为是分布，不是一条曲线；换一条工况，表 1 的数全变，但两头是悬崖这件事不变。", "The lead vehicle's five braking events are hard-coded so that you can repeat the same run. Real lead behaviour is a distribution, not one curve: another run changes every number in Table 1 but not the cliffs at both ends."]
  - ["时延在本实验里只折成“规划器看到的是几拍以前的数”。真系统的时延还有**抖动**（每一拍都不一样）与**丢帧**，那两件比固定时延更难对付（23.7 节）。", "Latency here is modelled only as a fixed number of stale cycles. Real systems also have jitter and dropped frames, both harder to handle than a constant delay."]
思考题:
  - ["把你们自己的最小安全间距公式代进来，可用区间会变宽还是变窄？你们现在用的权重还在区间里吗？", "Substitute your own minimum-safe-gap formula: does the usable band widen or narrow, and is your current tuning still inside it?"]
  - ["如果验收只报“平均车距”与“通行效率”两列，调参的人会把权重调到哪一档？这组报表会奖励什么样的行为？", "If the acceptance report carries only mean gap and flow, which setting will the tuner choose, and what behaviour does that report reward?"]
  - ["本实验的时延是固定的。如果时延 90% 的时候是 50 ms、10% 的时候是 300 ms，你会按哪个数定权重？为什么不能按平均值定？", "Here the latency is constant. If it were 50 ms nine times out of ten and 300 ms the rest, which figure would you tune against, and why not the mean?"]
