# 实验 23.5 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab23_5.js。
原理:
  - ["数据闭环的真实处境：车队每天跑回来几万段数据，**其中绝大部分是你已经会的那一种**（直道、好天气、车在车道中间）。能标的预算是有限的，所以“标哪一批”这个问题，比“用多大的模型”更决定结果（23.6 节）。", "The real situation of a data loop: a fleet returns tens of thousands of clips a day, and almost all of them are the kind the model already handles. The budget is limited, so which batch to label decides more than how large the model is."]
  - ["**按不确定性挑数据**：每个候选样本的杠杆值 xᵀ(XᵀX+λI)⁻¹x，就是“模型对它有多没把握”。线性模型自己就给得出这个数，不需要集成、不需要贝叶斯；它也不需要有人告诉它“弯道是难例”——杠杆值自己会把那一片挑出来（算例 23.6）。", "Active selection uses each candidate's leverage, xᵀ(XᵀX+λI)⁻¹x, as the model's own measure of how little it knows about that sample. A linear model gives it in closed form, with no ensemble and no Bayesian machinery, and nobody has to tell it that curves are the hard cases."]
  - ["**验收的误差口径要先说死。** 本实验按难例与易例**等权重**算。按回传数据的自然分布算（易例占九成以上），怎么挑都差不多，甚至挑数据反而更差——**口径一换，结论就反**。口径要在开工前定下来，不能等结果出来再挑一个好看的。", "The error convention must be fixed first. This lab weights hard and easy cases equally. Under the natural distribution of returned data, where easy cases are over ninety per cent, the strategies look alike or active looks worse: the convention decides the answer, so it is settled before the work starts, not after the results are in."]
  - ["**挑数据省的是样本，不是误差。** 两条曲线最后会收到差不多的地方；挑数据的价值在于**同一个误差要少标多少条**。所以这类结论一定要按“达到某个误差各要多少样本”来报，不能只报一个预算下的两个误差。", "Active selection saves samples, not error: the two curves end up in similar places. Its value is how many fewer labels reach the same error, so results must be reported as samples-to-a-target rather than as two errors at one budget."]
  - ["**代价要一起报。** 挑数据把难例那一列的误差压下去，代价是易例那一列涨一点。这笔交易划不划算，要看你在哪条路上跑——报表要分两列写，不能只报一个总数（算例 23.6）。", "Report the cost too: active selection lowers the error on hard cases at the price of raising it on easy ones. Whether that trade pays depends on where the vehicle drives, so the report needs both columns, not one total."]
  - 式: "杠杆值 h(x) = xᵀ(XᵀX+λI)⁻¹x；等权重误差 = √(½·易例误差² + ½·难例误差²)；自然分布误差 = √((1−f)·易例误差² + f·难例误差²)，f 为难例在回传数据里的占比"
步骤:
  - ["第一个场景，默认设置（难例占 7%、阈值 95）：把标注预算依次取 60、120、180、300、420、600、900 条，每档记下两种策略的误差与标注集里难例的占比（任务 1），填表 1。", "In the first scene with the defaults (7% hard cases, threshold 95), step the budget through 60, 120, 180, 300, 420, 600 and 900 clips, recording both strategies' errors and the hard share of each labelled set (task 1) in Table 1."]
  - ["预算回到 300 条，把难例占比依次取 2%、7%、30%，每档记下两种策略的误差（任务 2、3），填表 2。", "Back at 300 clips, step the hard-case share through 2%, 7% and 30%, recording both errors (tasks 2 and 3) in Table 2."]
  - ["难例占比回到 7%，把挑数据的阈值依次取 95、50、0，记下挑数据那一列的误差与难例占比（任务 4），填表 2 下半部分——阈值 0 就等于随机。", "Back at 7%, step the selection threshold through 95, 50 and 0, recording the active column's error and hard share (task 4). A threshold of 0 is the same as random."]
  - ["切到第二个场景，阈值 95、难例占比 7%：把误差目标依次取 1.20、1.00、0.90、0.80°，每档记下两种策略各要标多少条（任务 5），填表 3。", "In the second scene with the threshold at 95 and 7% hard cases, step the error target through 1.20, 1.00, 0.90 and 0.80°, recording how many labels each strategy needs (task 5) in Table 3."]
  - ["把读数里“换成自然分布口径”那一行抄下来，写进表 3 最后一行——同一组实验，换一个口径，结论是不是反了。", "Copy the natural-convention line from the readout into the last row of Table 3: same experiment, different convention, opposite conclusion?"]
