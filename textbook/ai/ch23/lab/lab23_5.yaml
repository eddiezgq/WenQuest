注意:
  - ["本实验的“难例”是**人为造出来的**（曲率与横向偏差都放大了），而且它在池子里的比例由你拖。真路上的难例靠什么发现，本身就是一个未解决的问题——这一条是本实验最大的局限。", "The hard cases here are constructed (curvature and lateral error both enlarged) and their share is a slider. How to find the hard cases on a real road is itself an open problem, and this is the lab's biggest limitation."]
  - ["杠杆值只对**线性（或近线性）模型**有现成的闭式解。深度模型要用集成、丢弃法或预测熵来近似，**那几种之间并不等价**，换一种近似可能换一个结论。", "Leverage has a closed form only for linear or near-linear models. Deep models approximate it with ensembles, dropout or predictive entropy, and those are not equivalent to each other: another approximation may give another answer."]
  - ["真数据闭环的瓶颈往往**不在“挑哪一批”**，而在标注质量与一致性、回传带宽、隐私与合规。本实验把这些都当成零成本，所以它只能回答“挑数据能省多少样本”，不能回答“要不要上这套闭环”。", "The bottleneck of a real data loop is usually not which batch to pick but labelling quality and consistency, upload bandwidth, privacy and compliance. The lab treats all of those as free, so it answers how many samples selection saves, not whether to build the loop."]
  - ["**两条曲线都会抖。** 每一轮重新拟合，误差未必单调往下；读数里的“要标多少条”取的是**第一次达到目标**的那一档。报结论时要把这件事写明，不要把一次抖动当成策略的差别。", "Both curves are noisy and neither decreases monotonically. The readout reports the first budget that reaches the target, and any conclusion must say so rather than treating one wobble as a difference between strategies."]
  - ["像素噪声、三个前视距离、特征的形式都是**显式假设**（与算例 23.6 同一套）。换一组假设，表 1 以下的数全变；要带走的是**口径决定结论**这件事，不是这里的具体数字。", "The pixel noise, the three look-ahead distances and the feature form are explicit assumptions shared with the chapter's worked example. Another set changes every number below Table 1; what travels is that the convention decides the conclusion."]
思考题:
  - ["写下你们自己对“难例”的定义，再估一估它在回传数据里占多少。代进本实验，挑数据还省得下来吗？", "Write down your own definition of a hard case and estimate its share of the returned data. Substituted here, does active selection still pay?"]
  - ["如果验收口径按回传数据的自然分布算，供应商会把预算花在哪一批数据上？你会怎么把“难例单列”写进验收条款？", "If acceptance uses the natural distribution, where will a supplier spend the budget? How would you write a separate hard-case column into the acceptance clause?"]
  - ["本实验的标注是**完全准确**的。如果难例的标注错误率比易例高一倍，挑数据这条策略会不会反而更糟？要补哪一项才能回答这个问题？", "Labels here are perfect. If hard cases were labelled twice as badly as easy ones, could active selection become the worse strategy, and what would the lab need to answer that?"]
