注意:
  - ["**三种口径的误差不能平均，也不能只报好看的那一个。** 同分布那一行回答“仿真里训得准不准”，换条件那一行回答“条件变了还准不准”，急弯那一行回答“罕见情形上还准不准”。它们是三个不同的问题，报告里要分三行写，并各自注明口径。", "The three errors may not be averaged, nor may the flattering one be quoted alone. They answer three different questions — fit, transfer and rare cases — and a report must carry three rows, each with its convention stated."]
  - ["**仿真里跑通不等于路上能跑。** 本实验的场景、观测噪声、专家公式全是合成的：没有雨雪、没有磨损的车道线、没有被车挡住的视野、没有坡道与路拱、没有执行机构的时延与死区。本实验的误差是**下界**，真车上一定更大。引用本实验的数时必须带这句话。", "It works in simulation is not it works on the road. The scene, the observation noise and the expert formula are all synthetic: no rain or snow, no worn lane markings, no occlusion by other vehicles, no crown or grade, no actuator latency or dead band. These errors are a lower bound and will be larger on a vehicle."]
  - ["“换光照与路面”在本实验里**只折成两件事**：检测噪声变大、并且系统性偏一侧。真实的变化还包括车道线被阴影切断、逆光时整段检测丢失、湿路反光造成假线——**丢失与假线这两种，本实验完全没有建模**，而它们才是现场最常见的失效方式。", "The lighting and surface change is modelled here only as more noise plus an offset. Real changes also include shadows cutting the markings, whole stretches lost into backlight and false lines from a wet surface. Dropouts and false positives are not modelled at all, and they are the most common field failures."]
  - ["**不要用本实验的数与任何厂家、任何论文的车道保持成绩比较。** 数据集不同、划分口径不同、方向盘角的定义与转向比也不同——这三样任意一样不同，两个数就不可比（本章第 1 条共用口径）。", "Do not compare these numbers with any vendor's or paper's lane-keeping results: different data, different split conventions and a different steering-angle definition each make the numbers incomparable."]
  - ["训练用时取决于显卡型号与网络大小，**只能在同一张卡上比**。本实验的网络很小，用时主要花在一遍遍的小批量上，不代表任何真实训练任务的规模。", "The wall time depends on the GPU and the network size and is comparable only on the same card. The network here is tiny and its time is dominated by loop overhead, representing no real training workload."]
思考题:
  - ["你的“换光照与路面”比“同分布”差几倍？如果供应商只给你第一个数，你会怎么把第二个数写成一条验收条款（写明噪声与偏置各取多少）？", "By what factor is your changed-condition row worse than your in-distribution row? If a supplier quotes only the first, how would you write the second into an acceptance clause, stating the noise and offset to be used?"]
  - ["把系统性偏置从 3 像素改成 0（只放大噪声），误差变成多少？这说明噪声与偏置哪一种更难对付，为什么？", "Set the systematic offset to zero and keep only the extra noise: what happens to the error, and which of the two is harder to handle, and why?"]
  - ["把急弯集的曲率上限从训练时的 3 倍改成 1.5 倍、再改成 5 倍，误差怎么变？按这条曲线，你会怎么定义“本模型的运行设计域”里的最小转弯半径？", "Vary the sharp-curve set's curvature limit between 1.5× and 5× of the training limit: how does the error move, and how would you use that curve to state a minimum radius in this model's operational design domain?"]
  - ["本实验的训练数据与测试数据来自同一套生成程序。如果让另一个人用另一套假设重新生成测试集，你预计哪一行会变得最多？这件事对“仿真验收”意味着什么？", "Training and test data here come from one generator. If someone else regenerated the test sets under their own assumptions, which row would move most, and what does that imply for simulation-based acceptance?"]
