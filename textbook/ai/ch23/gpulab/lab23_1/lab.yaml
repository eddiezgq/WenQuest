标题: ["GPU 实验 23.1 在仿真里训车道保持，再换光照与路面验收它", "GPU Lab 23.1 Train lane keeping in simulation, then accept it under changed lighting and road surface"]
目的: ["在合成的车道场景上训一个小网络做车道保持（三列车道线像素进去，一个方向盘角出来），然后做比训练更要紧的三件事：**打赢两个笨基线**；**按两种口径分两行报**——同分布测试与“光照和路面变了”的测试；再单独报**罕见情形（急弯）**那一行。三个数会差好几倍，而这正是“仿真里跑通不等于路上能跑”这句话的量化。全部数据合成，不联网、不下载。",
      "Train a small network for lane keeping on a synthetic lane scene (three lane-line pixel columns in, one steering angle out), then do the three things that matter more than training: beat two dumb baselines; report two separate rows — an in-distribution test and a test where the lighting and road surface have changed; and report the rare case (a sharp curve) on a row of its own. The three numbers differ severalfold, which is what 'it works in simulation' is actually worth. All data is synthetic: no network, no downloads."]
显卡: basic
结果:
  - {名: n_train, 说明: ["训练样本数", "training samples"], 单位: "条"}
  - {名: rmse_zero, 说明: ["基线一：方向盘不动", "baseline 1: steering held at zero"], 单位: "°"}
  - {名: rmse_base, 说明: ["基线二：线性最小二乘（同分布）", "baseline 2: linear least squares, in-distribution"], 单位: "°"}
  - {名: rmse_id, 说明: ["同分布测试的误差", "error, in-distribution test"], 单位: "°"}
  - {名: rmse_shift, 说明: ["换了光照与路面之后的误差", "error after the lighting and surface change"], 单位: "°"}
  - {名: shift_ratio, 说明: ["换条件后比同分布差几倍", "how much worse the changed condition is"], 单位: "倍"}
  - {名: rmse_curve, 说明: ["罕见情形（急弯）的误差", "error on the rare case (sharp curve)"], 单位: "°"}
  - {名: curve_ratio, 说明: ["急弯比同分布差几倍", "how much worse the sharp curve is"], 单位: "倍"}
  - {名: train_s, 说明: ["训练用时", "training wall time"], 单位: "秒"}
文件: []
实际问题:
  标题: ["仿真里它已经把车开得很稳了，敢不敢让它上路", "It drives smoothly in simulation — would you let it on the road?"]
  内容: ["车道保持是量产车上最常见的一项功能，也是最容易在仿真里“做好了”的一项：场景是自己生成的，车道线永远清楚，光照永远一样。于是模型在仿真里的误差可以压得很低，报告很好看。真正的问题出在三个地方：天黑了、路面刚铺过（车道线检测又抖又偏）、以及**一段急弯**（训练分布里几乎没有）。本实验把这三件事做成三行独立的验收，让你亲手量出它们差几倍，并写清**哪一行不能和别的行平均**。",
         "Lane keeping is the most common production feature and the easiest one to 'finish' in simulation: the scenes are generated, the lane lines are always crisp, the light never changes. The error can be driven very low and the report looks excellent. The trouble arrives in three places: darkness, a freshly surfaced road (lane detection both noisier and biased), and a sharp curve that barely occurs in the training distribution. This lab turns those into three independent acceptance rows, measures how far apart they are, and states which rows may not be averaged."]
原理:
  - ["车道保持可以拆成两步：**从观测里估出车道几何**（横向偏差 e、航向偏差 psi、曲率 kappa），再**按几何算方向盘角**。本实验把两步合成一个小网络，直接从三列车道线像素回归到方向盘角——真值由“专家公式”给出，所以两种做法都能被同一把尺子量（23.5 节）。", "Lane keeping splits into estimating the lane geometry (lateral error, heading error, curvature) from the observation and computing a steering angle from that geometry. Here a small network does both at once, regressing from three pixel columns straight to the steering angle, with an expert formula as the ground truth so that any approach can be measured with the same ruler."]
  - ["**噪声加在像素上，所以远处那一列折回地面时误差被放大**——与算例 23.1 的标定误差是同一回事：图像里一点点，地面上好几米（23.2 节）。", "The noise is added in pixels, so the far column's error is magnified when it is mapped back to the ground — the same effect as the calibration residuals: a little in the image, metres on the road."]
  - ["**“换了条件还准不准”要单独报。** 本实验把光照与路面的变化折成两件事：检测噪声变大、并且系统性偏一侧。系统性偏置是更凶的那一种——它不会被平均掉，模型会把它当成“车真的偏了”。", "Transfer must be reported separately. Here the lighting and surface change is modelled as more detection noise plus a systematic offset. The offset is the nastier of the two: it does not average out, and the model reads it as the vehicle genuinely being off-centre."]
  - ["**罕见情形要单独报。** 急弯在训练分布里几乎不出现，所以同分布那一行好看，并不说明急弯上好看。平均误差最会骗人的地方就在这里（23.3 节“平均误差与最坏情形”）。", "Rare cases need their own row. Sharp curves hardly occur in the training distribution, so a good in-distribution number says nothing about them. This is where an averaged error misleads most."]
  - ["**先打赢两个笨基线**：方向盘不动、以及一个线性最小二乘。打不赢它们的模型不要往下走。本实验的映射接近线性，小网络大体只与线性基线打平——这正是笨基线的用处：它告诉你这一处用不上神经网络。", "Beat two dumb baselines first: steering held at zero, and a linear least-squares fit. This lab's mapping is nearly linear, so the small network only matches the linear baseline — which is exactly what a dumb baseline is for: it tells you a network is not needed here."]
  - 式: "Y(X) = e + psi·X + kappa·X²/2；方向盘角 = [0.16·e + 0.95·psi + atan(12·kappa)] 折成度数 × 转向比 ÷ 10；均方根误差只在各自的测试集上算"
步骤:
  - ["运行第 1 节：装环境、确认显卡（任务 1）。", "Run section 1 to confirm the environment and the GPU (task 1)."]
  - ["运行第 2 节：合成训练集与三个测试集，记下训练样本数与方向盘角的量级（任务 2），填表 1。", "Run section 2 to synthesise the training set and the three test sets, recording the sample count and the scale of the steering angle (task 2) in Table 1."]
  - ["运行第 3 节：算两个笨基线，记下它们的误差（任务 3），填表 2 前两行。", "Run section 3 for the two baselines, recording their errors (task 3) in the first rows of Table 2."]
  - ["运行第 4 节：训一遍，记下同分布误差与训练用时（任务 4），填表 2 第三行。", "Run section 4 to train once, recording the in-distribution error and the wall time (task 4) in the third row of Table 2."]
  - ["运行第 5 节：换光照与路面再验收一遍，记下误差与比值（任务 5），填表 3 第二行——**不要和第一行平均**。", "Run section 5 to accept the same model under the changed lighting and surface, recording the error and the ratio (task 5) in the second row of Table 3, without averaging it with the first."]
  - ["运行第 6 节：在急弯上再验收一遍，记下误差与比值（任务 6），填表 3 第三行。", "Run section 6 to accept it on the sharp-curve set, recording the error and the ratio (task 6) in the third row of Table 3."]
  - ["把表 3 里最差的那一行圈出来，在报告里写一句话：按这一行，这个模型离上车还差什么。", "Circle the worst row of Table 3 and write one sentence: judged by that row, what is still missing before this model goes on a vehicle."]
  - ["运行最后一格，回传结果。", "Run the last cell to send your results."]
