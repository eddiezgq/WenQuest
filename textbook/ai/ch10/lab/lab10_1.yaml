# 实验 10.1 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab10_1.js。
原理:
  - ["SIMT：一个线程算一个输出，线程束（NVIDIA 32 道）或波前（AMD CDNA 64 道）一起执行同一条指令（第 3 章、10.2 节）。", "SIMT: one thread per output; a warp (32 lanes on NVIDIA) or wavefront (64 on AMD CDNA) executes one instruction together (Chapter 3, Section 10.2)."]
  - ["线程束内归约要 log₂(宽度) 层洗牌：32 道 5 层、64 道 6 层；写死 16 的循环在 64 道上只归约一半（10.2.3 节）。", "An in-warp reduction takes log2(width) shuffle steps: 5 for 32 lanes, 6 for 64; a loop hard-coded to 16 reduces only half of a 64-lane wave (Section 10.2.3)."]
  - ["立方单元：一条指令完成一次 16×16×16 的半精度矩阵乘加，单精度累加；片上缓冲由程序显式搬运（10.3 节）。", "Cube unit: one instruction does a 16×16×16 half-precision matrix multiply-accumulate with FP32 accumulation; buffers are moved explicitly (Section 10.3)."]
  - 式: "三段流水：n 块数据要 n + 2 段（各段串行要 3n 段），气泡占 2/(n+2)"
步骤:
  - ["“SIMT”场景：把线程束宽度在 32 与 64 之间切换，记录波前数、归约层数、一次访存请求的字节数（任务 1）。", "SIMT scene: switch the warp width between 32 and 64 and record waves, reduction steps and bytes per request (task 1)."]
  - ["改片上存储容量与分块 T，填表 1（任务 2）。", "Vary the on-chip memory and the tile size T; fill Table 1 (task 2)."]
  - ["“立方单元”场景：读出指令条数与两种搬数据方式的显存读写（任务 3）。", "Cube scene: read the instruction count and the traffic of the two data-movement strategies (task 3)."]
  - ["把数据块数从 1 加到 64，记录三段流水的加速与气泡（任务 4）。", "Raise the tiles from 1 to 64 and record the pipeline speedup and bubble (task 4)."]
