注意:
  - ["这是按公式算的，不是仿真：没有计入访存延迟、存储体冲突、指令开销与调度，也不代表任何一款芯片的实际速度。", "These are formulas, not a simulation: no memory latency, bank conflicts, instruction overhead or scheduling, and they do not predict the speed of any real chip."]
  - ["“片上存储允许驻留几块”只是其中一道限制；占用率还要看线程数与寄存器（算例 5.7.2）。", "Blocks allowed by on-chip memory is only one limit; occupancy also depends on threads and registers (Example 5.7.2)."]
  - ["立方单元的缓冲容量各型号不同，华为没有公开具体数值，本实验只用“一次 16×16×16”这一条公开事实。", "Buffer sizes differ by model and Huawei does not publish them; this lab uses only the public fact that one instruction does 16×16×16."]
思考题:
  - ["线程束宽度从 32 变成 64，哪些写法会出错、哪些只是变慢？", "Which habits become wrong, and which merely become slower, when the warp width goes from 32 to 64?"]
  - ["两种架构算的是同一个矩阵乘法，为什么“把数据留在片上多用几次”在两边都排第一？", "Both compute the same product; why is reusing data on chip the first optimization on both?"]
