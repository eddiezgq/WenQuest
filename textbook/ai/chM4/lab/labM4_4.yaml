注意:
  - ["实验里的“真值”用双精度算出，项数很大时它自己也有误差。真要做基准，得用更高精度（如补偿求和的双精度版）当参照。", "The lab's reference value is computed in double precision, which has its own error at large n; a real benchmark needs a higher-precision reference."]
  - ["半精度在浏览器里是按 IEEE 754 binary16 手工舍入模拟的，与显卡上的 FP16 一致；但显卡的张量核心在乘加时用的是 FP32 累加器，所以实际训练的误差比本实验的“全程 FP16”小得多（第 3、8 章）。", "Half precision is emulated by hand-rounding to IEEE 754 binary16, matching GPU FP16; but tensor cores accumulate in FP32, so real training error is far smaller than an all-FP16 run (Chapters 3 and 8)."]
思考题:
  - ["为什么混合精度训练里，矩阵乘法可以用 FP16，而累加必须用 FP32？用表 2 的数据说明。", "Why can mixed-precision training multiply in FP16 but must accumulate in FP32? Answer with the numbers in Table 2."]
  - ["同一份代码在两块显卡上跑出的损失值差了小数点后第六位，是 bug 吗？从“并行归约的次序”解释，并说明要逐位复现需要固定哪些东西。", "Two GPUs give losses differing in the sixth decimal — is that a bug? Explain via the order of parallel reduction and say what must be fixed to reproduce bit for bit."]
