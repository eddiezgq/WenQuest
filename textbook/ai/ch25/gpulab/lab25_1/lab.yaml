实际问题:
  标题: ["调度室手上那一版排线，到底差多少", "How far off is the routing the dispatch office actually uses?"]
  内容: ["问渠减速器厂每天要从库房往各工位送料：一辆车、固定载重，装满了就回库房再装。调度室手上的排线是最朴素的一版——顺手送最近的那个点，装不下就回去。厂长问：这一版差多少？这个问题听起来要先有“最好的排法”才能回答，而“最好的排法”在大一点的规模上没人算得出来。本实验给出这个问题唯一诚实的答法：小规模上**穷举出已证明最优**，量出真实差距；大规模上只给**可证明的下界**，并且明说由它算出来的那个百分比是**上界说法**。两列分开报，差距随规模的变化画成曲线。",
         "The plant delivers material from the store to the stations with one vehicle of fixed capacity: load up, run a round, come back. The dispatch office's routing is the plainest one there is — serve the nearest point next, go back when full. The manager asks how far off it is. That sounds as if it needs the best possible routing, which at any real size nobody can compute. This lab gives the only honest answer: at small sizes enumerate the proven optimum and measure the real gap; at large sizes give a provable lower bound and say plainly that the percentage derived from it is an upper-bound statement. Two separate columns, and the ratios plotted against size."]
原理:
  - ["**车辆路径问题**：一个库房、若干取送点，每个点有需求，车有载重。要的是总行程最短的一组回路。它是 NP 难的，所以“最优解”在大规模上不是算不准，是**算不出来**（25.2 节）。", "The capacitated vehicle routing problem: one depot, customers with demands, a vehicle with a capacity, and the objective of the shortest set of routes. It is NP-hard, so at scale the optimum is not merely hard to approximate — it cannot be produced at all."]
  - ["**小规模的最优解可以穷举出来，而且是已证明最优。** 任何可行解的若干条回路首尾相接就是一个客户次序；反过来，给定一个次序，按容量做动态规划切分就能找到这个次序下最好的切法。于是“全部次序 × 最优切分”覆盖了全部可行解——穷举出来的那个值是**真值**，不是“最好已知解”。", "At small sizes the optimum can be enumerated and proved: any feasible solution's routes concatenate into one customer order, and for a given order a dynamic program finds the best capacity split, so 'all orders times the best split' covers every feasible solution. The resulting value is ground truth, not a best-known value."]
  - ["**下界与最优解是两件事，不许混为一谈。** 本实验的下界是：每个客户取两条最便宜的邻边，各记一半求和。任何可行解里每个客户恰好连两条边，把边费在两端各记一半不超过全长，再换成最便宜的两条只会更小——所以它**不可能超过最优值**。但它很松：这就是为什么“对下界的比值”总比“对最优的比值”难看（25.2、25.3 节）。", "A lower bound is not an optimum. Here the bound takes each customer's two cheapest incident edges and sums half of each: every customer has exactly two incident edges in any feasible solution, charging half of each edge to each endpoint cannot exceed the total length, and replacing the actual edges with the cheapest two only lowers it. So it can never exceed the optimum — but it is loose, which is why the ratio to it always looks worse."]
  - ["**另一个免费的下界是车数**：总需求除以载重向上取整。它回答“为什么至少要跑这么多趟”，而且与行程下界是两条独立的证据。", "A second free bound is the number of vehicles: total demand over capacity, rounded up. It answers why at least so many rounds are needed, and it is evidence independent of the distance bound."]
  - ["**公开基准库的表头本身就把这两件事分开。** CVRPLIB 的列头是 |C|（客户数）、UB（上界）、Opt（是否已证明最优，取 yes/no）。Uchoa 等 2017 年提出的 X 集一百个实例，当年那篇论文证到最优的是 40 个，今天是 61 个——**“最好已知解”是会被下一篇论文改掉的**，所以引用它必须写明日期（25.3 节）。", "The public benchmark's own table separates them: CVRPLIB lists |C|, UB and an Opt column taking yes or no. Of the hundred X instances of Uchoa et al. (2017), that paper proved 40 optimal; today 61 are proven. A best-known solution is something the next paper changes, so any citation of one must carry its date."]
  - 式: "贪心/最优（真实差距，只在小规模有）；贪心/下界 ≥ 贪心/最优（上界说法）；最优/下界 = 这个下界有多松；车数下界 = ⌈总需求 / 载重⌉"
步骤:
  - ["运行第 1 节：装环境、确认显卡（任务 1）。", "Run section 1 to set up the environment and confirm the GPU (task 1)."]
  - ["运行第 2 节：生成实例（坐标、需求、载重都是合成的显式假设），记下每种规模的实例数与载重（任务 2），填表 1。", "Run section 2 to generate the instances — synthetic coordinates, demands and capacity, all explicit assumptions — recording the instance count and the capacity (task 2) in Table 1."]
  - ["运行第 3 节：在 GPU 上穷举 3—8 个点的**已证明最优解**，记下用时与“贪心/最优”（任务 3），填表 2 的前几行。", "Run section 3 to enumerate the proven optima for 3 to 8 customers on the GPU, recording the wall time and the greedy-over-optimum ratio (task 3) in the first rows of Table 2."]
  - ["运行第 4 节：同一批实例换成跟下界比，把“贪心/下界”与“最优/下界”两列一起记下来（任务 4），填满表 2。两列之差就是“只看下界会夸大多少”。", "Run section 4 to score the same instances against the lower bound, recording both the greedy-over-bound and optimum-over-bound columns (task 4). Their difference is how much the bound overstates."]
  - ["运行第 5 节：把规模一路扫到几百个点（这一段**没有最优解，只有下界**），记下每档的“贪心/下界”与多用的车数（任务 5），填表 3。", "Run section 5 to sweep up to several hundred customers — a range with no optima, only bounds — recording the greedy-over-bound ratio and the extra vehicles at each size (task 5) in Table 3."]
  - ["运行第 6 节：把两条比值曲线画在同一张图上（横轴规模）。把“哪一段是真值、哪一段只是上界说法”在图上标出来（任务 6）。", "Run section 6 to plot both ratio curves against size, marking which stretch is ground truth and which is only an upper-bound statement (task 6)."]
  - ["运行最后一格，回传结果。", "Run the last cell to send your results."]
