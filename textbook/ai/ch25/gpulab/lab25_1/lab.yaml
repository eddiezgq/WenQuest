标题: ["GPU 实验 25.1 大规模车辆路径：启发式对已证明最优，与启发式对下界", "GPU Lab 25.1 Large-scale vehicle routing: a heuristic against proven optima and against a lower bound"]
目的: ["在显卡上成批生成车辆路径实例，一路从 3 个点扫到几百个点，然后做本章最要紧的一件事：**把“对已证明最优的比值”与“对下界的比值”分两列报**。小规模上穷举出真正的最优解（全部客户次序 × 按容量的最优切分，GPU 上并行算），所以第一列是真值；规模一大就穷举不了，手上只剩第二列。两列并排放着，你会看见第二列随规模越来越难看——而其中有一部分并不是启发式变差了，是**下界变松了**。做完要能把这件事说清楚：没有最优解的时候，“最多差多少”是个**上界说法**，不是差距本身。",
       "Generate vehicle-routing instances in batches on the GPU, from three customers up to several hundred, and then do the thing this chapter insists on: report the ratio to the proven optimum and the ratio to a lower bound in two separate columns. At small sizes the optimum is enumerated exactly (every customer order times the best capacity split, computed in parallel on the GPU), so the first column is ground truth; past that size only the second column exists. Side by side, the second column gets worse with size — and part of that is not the heuristic getting worse but the bound getting looser. You should be able to state the consequence: without an optimum, 'at most this far off' is an upper-bound statement, not the gap itself."]
显卡: basic
