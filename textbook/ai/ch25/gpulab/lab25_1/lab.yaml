注意:
  - ["**下界不是最优解。** 用下界算出来的“最多差多少”是一个**上界说法**：真实差距一定不超过它，但不等于它。本实验在小规模上把两者同时量出来，正是为了让你看见这中间差了多少个百分点——到了大规模，这个差额还在，只是你看不见了。所以报告里不许把“贪心/下界”写成“贪心比最优差多少”。", "A lower bound is not an optimum: a gap computed from it is an upper-bound statement — the true gap is no larger, but it is not equal. The lab measures both at small sizes precisely to show how many points lie between them; at large sizes that difference is still there, only invisible. A report must never present greedy-over-bound as the gap to the optimum."]
  - ["**“最好已知解”会随时间变。** 同一个 CVRPLIB X 集，已证明最优的实例数从 2017 年那篇论文的 40/100 变成今天的 61/100，而“最好已知解”本身也在被一篇篇论文改掉。引用任何一个“最好已知解”或“距最好已知解百分之几”，**必须写明日期与出处版本**；拿它当真值用，是本章不收的那种数。", "Best-known solutions move: of the hundred X instances, 40 were proven optimal in the 2017 paper and 61 are today, while the best-known values themselves keep being improved. Any citation of a best-known value, or of a percentage measured against one, must carry its date and source version; treating it as ground truth is exactly the kind of number this chapter rejects."]
  - ["本实验的坐标、需求、载重都是**合成的显式假设**，不取自任何企业数据，也不从网上下载任何基准实例（云笔记本里不联网取数据）。所以这里的比值只能说明**趋势与方法**，不能当成“贪心在真实问题上差多少”。", "The coordinates, demands and capacity are synthetic explicit assumptions; no benchmark instance is downloaded. The ratios here show the trend and the method, not how far off a heuristic is on a real problem."]
  - ["**穷举的规模上限是硬的。** 次数按 n! 增长，到 9 个点就吃不住了；程序顶到上限会直接报错，不会悄悄降格成启发式充当“最优”。看见“最优”两个字，先问是穷举出来的还是别人跑出来的。", "The enumeration limit is hard: the work grows as n!, and past nine customers it is gone. The program raises an error rather than quietly substituting a heuristic for the optimum. Whenever a number is called optimal, ask whether it was enumerated or merely obtained."]
  - ["比值随规模变大，**有三个互相纠缠的原因**：启发式确实变差、下界确实变松、实例的几何随规模变化。小规模上第三列（最优/下界）能把第二个原因量出来，大规模上量不出来——所以大规模的曲线只能用来看趋势，不能用来给启发式定罪。", "Three causes are tangled in a ratio that grows with size: the heuristic really does get worse, the bound really does get looser, and the instance geometry changes with size. The third column measures the second cause at small sizes only, so the large-size curve shows a trend and cannot convict the heuristic on its own."]
思考题:
  - ["你们现在怎么评价自己的排线？是跟上个月比、跟另一套软件比，还是跟最优解或下界比？按本章口径，前两种比法得出的百分比说明什么、不说明什么？", "How is your own routing assessed today: against last month, against another package, or against an optimum or bound? Under this chapter's rules, what do the first two kinds of percentage establish, and what do they not?"]
  - ["把本实验的下界换成更紧的一个（例如把“每个客户两条最便宜邻边之半”换成最小生成树类的下界），表 2 的第三列会怎么变？第二列会怎么变？哪一列的变化说明“启发式变好了”？", "Replace the bound with a tighter one, for instance a spanning-tree-based bound: how do the second and third columns of Table 2 move, and which movement would mean the heuristic itself improved?"]
  - ["厂长要一句话的结论：“我们这版排线最多比最优差百分之几”。按本实验的结果，这句话在什么规模下能说、怎么说才不算夸大？把它写成一段可以进验收文件的话。", "The manager wants one sentence: 'our routing is at most this far from optimal'. At what sizes can that be said, and how should it be worded so as not to overstate? Write the sentence as it would appear in an acceptance document."]
