注意:
  - ["车间布局（通道、货架、窄道的两个口、四个充电位）、满电能走的步数、充电速度、任务时限、死锁的判定与恢复时间，**全部是本书的显式假设**，不取自任何厂家样本或企业数据。要带走的是**结构性的结论**（总吞吐与单车吞吐要分开看、联锁会让曲线先升后降、充电阈值有最优点），不是这里的具体台数与百分比。", "The layout, the battery capacity in steps, the charging rate, the task deadline and the deadlock rule are all this book's explicit assumptions, taken from no vendor sample or plant data. Take away the structure, not the particular numbers."]
  - ["本实验的“死锁”是一个**显式定义**：连续被堵 5 步算一次，之后这台车停 40 步才解开（重规划或等人来解）。真车间里它可能表现为报警、降速、人工介入甚至停线，代价各不相同——报告里要写明在你们那边它意味着什么。", "A deadlock here is defined explicitly: five consecutive blocked steps, then forty steps of standstill. On a real floor it may mean an alarm, a derate, a person walking over or a stoppage, with very different costs. State what it means on yours."]
  - ["**本工况的活本来就干不完**（任务每 2 步来一个，比这些车做得完的多），所以“任务超时数”那一列反映的是积压，不随参数大动。能分好坏的是死锁与半路耗光两列。想看“任务超时”真正起作用，把任务间隔拖到 4 步以上再扫一遍。", "In this setting the work never runs out, so the overdue column mostly reflects backlog and barely moves. The deadlock and stranded columns are the ones that separate good from bad; to make overdue tasks matter, raise the task interval above four steps and sweep again."]
  - ["每一档都是几个随机种子的平均，但仍有噪声：死锁与半路耗光是小整数，换一个种子能差一两次。**不要拿单次结果去比两种设置**；曲线的形状比某一点的高低可信。", "Each point is averaged over several seeds and still carries noise: deadlocks and strandings are small integers. Do not compare two settings on a single run — the shape of the curve is more trustworthy than any one point."]
  - ["本实验的走法是**优先级法**（按“先有活的、再按车号”定先后，一步一格、让不开就等），不是最优的多机规划。所以这里量出来的台数上限是**这种走法下的**上限：换成冲突搜索一类的做法，拐点会往右移，但不会消失（25.2 节）。", "The policy here is a prioritised one, not optimal multi-agent planning, so the fleet limit measured is the limit under this policy. A conflict-based search moves the knee to the right but does not remove it."]
思考题:
  - ["把你们那座车间的通道图画出来，数一数“对向车必须抢”的口子有几个。总吞吐涨不动，是因为口子不够还是车不够？这两件事的对策完全相反：前者要改路线或改成单向环流，后者才是加车。", "Draw your own aisle plan and count the doorways that opposing vehicles must contest. When the total stops rising, is it the doorways or the vehicles? The remedies are opposite: one-way circulation versus a bigger fleet."]
  - ["你们的搬运系统有没有区域联锁？如果有，联锁范围是多大、一次要停多久？按本实验的结果，这两个数直接决定你们的台数上限——厂家推荐值能不能当验收依据？", "Does your system have a zone interlock, and if so how large an area does it stop and for how long? Those two numbers set your fleet limit, so can a vendor's recommended fleet size serve as an acceptance criterion?"]
  - ["把“一次半路耗光”折成钱（找人去拖、通道堵住、可能停线），再回到第二个场景，用“吞吐 − 耗光次数 × 这个钱”做目标重新选一次阈值。选出来的那一档，和只看吞吐选出来的差多少？", "Price a single stranding — the tow, the blocked aisle, perhaps a stoppage — then return to the second scene and choose the threshold on 'throughput minus strandings times that price'. How far is it from the throughput-only choice?"]
