# 实验 25.2 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab25_2.js。
原理:
  - ["车间里对向的车要抢同一个口（本实验这座车间中间一排货架只留两个口）。车少时加一台车就多一份活；车多了以后，口子前面排队、互相堵，堵久了要重规划或等人来解，加车换回来的就只剩零头。**所以“加车还有没有用”是一条有拐点的曲线，不是一条直线**（25.2 节）。", "Opposing vehicles contest the same doorways — here the middle rack leaves only two. With few vehicles each new one brings a full share of work; with many, they queue and block one another, and a jam that lasts needs replanning or a person, so a new vehicle brings almost nothing. 'Is another vehicle worth it' is therefore a curve with a knee, not a straight line."]
  - ["**总吞吐与单车吞吐是两个数，不要只报一个。** 不加区域联锁时，加车到后来总吞吐只是涨不动——它不会塌；塌的是单车吞吐。只报总吞吐，看上去“加车一直有用”；只报单车吞吐，看上去“车早就多了”。两个数一起报，才知道是口子不够还是车不够（25.2 节）。", "Total throughput and throughput per vehicle are two different numbers. Without a zone interlock the total merely flattens as vehicles are added — it does not collapse; what collapses is the per-vehicle figure. Reporting only the total suggests more vehicles always help; reporting only the per-vehicle figure suggests the fleet was oversized long ago."]
  - ["**区域联锁（一处卡住、附近这一片一起停）才让总吞吐真的先升后降。** 这一层是为了兜安全：带区域控制的搬运系统本来就这么做。代价是堵一处停一片，于是车越多、被牵连的车越多，曲线过了最高点就往下走。车间里“车加多了反而更慢”，来源通常就在这一层，不在算法（25.2、25.4 节）。", "A zone interlock — one jam stops a whole area — is what makes the total actually rise and fall. The layer exists for safety, as zone-controlled vehicle systems really work, and its price is that one jam halts the neighbourhood: the more vehicles, the more are caught, so past the peak the curve turns down."]
  - ["**充电阈值有最优点，而吞吐最高的那一档不是最安全的那一档。** 阈值定得低，充电少占时间，可车会在半路把电用光，停在通道里要人去拖；阈值定得高，车一直在充。把阈值提到“一次都不耗光”，吞吐只降几个百分点——这几个百分点就是保险的明码标价（25.4、25.7 节）。", "The charging threshold has an optimum, and the throughput-optimal setting is not the safest one: too low and vehicles run flat in an aisle and must be towed; too high and they spend their time charging. Moving to the setting that never strands costs only a few percent of throughput — the openly stated price of the insurance."]
  - ["**报成绩必须连失败的那几列一起报**：死锁次数、任务超时数、半路耗光车次。本章的口径是“多机调度报成绩必须连冲突与死锁次数一起报”——报表少一列，结论就可能反过来（25.2 节口径 b）。", "Any score must come with its failure columns: deadlocks, overdue tasks and stranded vehicles. Drop a column and the conclusion can reverse."]
  - 式: "总吞吐 = 完成任务数 / 仿真步数 × 100；单车吞吐 = 总吞吐 / 车数；死锁 = 连续被堵 5 步（之后停 40 步才解开）"
步骤:
  - ["第一个场景、区域联锁半径 0（不联锁）、充电阈值 0.30、任务每 2 步来一个：把搬运车数量依次取 2、6、10、14、16 台，每档记下总吞吐、单车吞吐、死锁次数与任务超时数（任务 1），填表 1。", "In the first scene with the interlock off, a 0.30 threshold and a task every 2 steps, step the fleet through 2, 6, 10, 14 and 16, recording total throughput, throughput per vehicle, deadlocks and overdue tasks (task 1) in Table 1."]
  - ["看表 1 的前两列：总吞吐涨到后来是**涨不动**还是**掉下来**？单车吞吐从多少掉到多少？把这两句话写在表 1 下面。", "Read the first two columns of Table 1: does the total flatten or fall? And how far does the per-vehicle figure drop? Write both answers under the table."]
  - ["把区域联锁半径拖到 4，其余不动，再把车数取 6、8、10、12、14、16 台，记下同样四个数（任务 2、3），填表 2；读数里“吞吐最高的车数”是几台，也记下来。", "Raise the interlock radius to 4 and repeat for 6, 8, 10, 12, 14 and 16 vehicles (tasks 2 and 3) in Table 2, noting the best fleet size from the readouts."]
  - ["比一比表 1 与表 2 的最后一行（16 台）：同样十六台车，两种做法的总吞吐差百分之几？这笔差额买到的是什么？", "Compare the last rows of Tables 1 and 2: with the same sixteen vehicles, how far apart are the totals, and what does the difference buy?"]
  - ["切到第二个场景（车数留 10 台、不联锁），把充电阈值依次取 0.05、0.15、0.30、0.40、0.65、0.80，每档记下总吞吐、半路耗光车次与任务超时数（任务 4、5），填表 3。", "In the second scene with ten vehicles and no interlock, step the threshold through 0.05, 0.15, 0.30, 0.40, 0.65 and 0.80, recording the throughput, the stranded count and the overdue tasks (tasks 4 and 5) in Table 3."]
  - ["在表 3 里找出**吞吐最高的那一档**与**一次都不耗光的那一档**，算出后者比前者低百分之几，写进表 3 最后一行——这就是“安全的价钱”。", "Find the throughput-optimal row and the first row that never strands, and work out how far apart they are: that is the price of safety, to be written in the last row of Table 3."]
