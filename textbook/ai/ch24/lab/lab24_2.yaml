注意:
  - ["**本实验里的“真机”也是算出来的。** 它只是换了一套参数的同一个玩具，没有接触、形变、工件滑动、相机标定漂移、线缆拖拽。真设备上这些都在，所以真机那一列**只能靠真的试**，试多少次也必须报。本实验能教的是报表的结构与范围的道理，不是任何具体数字。", "The 'hardware' column here is also computed: the same toy with different parameters, without contact, deflection, slipping parts, calibration drift or cable drag. On a real machine all of those are present, so the hardware column can only come from real trials, whose count must be reported. This lab teaches the shape of the report and the logic of the range, not any particular number."]
  - ["**“范围折成策略”这一步是本实验的显式假设**，不是训练过程：范围越宽，策略越不敢用心算的正运动学（权重按范围的平方上升）、增益越偏小、动作越带抖动。真训练里这三件事是一起涌现出来的，强弱也不是这个比例。换一套假设，曲线的形状还在，具体数字全变。", "Mapping the range onto a policy is an explicit assumption of this lab rather than a training run: a wider range means less reliance on the mental kinematics (weight rising with the square of the range), a lower gain and noisier actions. In real training these emerge together and not in this proportion; change the assumption and the shape survives but the numbers do not."]
  - ["**不要把两列成绩平均，也不要只报其中一列。** 平均出来的数不回答任何问题。本章的报表格式是四列：做法 / 仿真成功率 / 真机成功率 / 真机试了多少次。", "Do not average the two columns and do not report only one of them: the average answers no question. The report format in this chapter has four columns — method, simulation success, hardware success, number of hardware trials."]
  - ["**两列各只试 40 次**，所以一档与一档之间差一两个百分点不说明问题；本实验要你读的是趋势（谷底在哪、峰在哪、两端怎么掉），不是单点。", "Each column here is only 40 trials, so a difference of one or two points between settings means nothing: read the trend — where the trough is, where the peak is, how both ends fall — not single points."]
  - ["域随机化不是唯一的办法，也不总是最好的办法。把真机量准（标定连杆长度、辨识摩擦）往往比把范围开大划算得多——**本实验第二个场景正好说明这一点：差距缩小之后，范围 0 也不差了**。", "Randomisation is not the only remedy and not always the best one: measuring the machine properly — calibrating the links, identifying the friction — is often cheaper than widening the range, which is exactly what the second scene shows."]
思考题:
  - ["把你们自己设备与模型之间的差距列成一张表，标明哪几项量过、哪几项是猜的。按本实验的结论，这张表怎样决定随机化范围？", "List the gap between your own machine and your model, marking which entries are measured and which are guessed. How does that table set your randomisation range?"]
  - ["如果供应商只给你仿真成功率，你会怎么把“真机那一列”写成一条可验收的合同条款？要写明哪几件事（次数、判据、谁试、失败怎么算）？", "If a supplier quotes only a simulation success rate, how would you write the hardware column into an acceptance clause? Which things must the clause fix — trial count, criterion, who runs it, how a failure is counted?"]
  - ["本实验的差距只有四项（连杆、摩擦、噪声、延迟）。你们那台设备上还有哪几项是本实验没建模的？其中哪一项最可能让“范围调对了也没用”？", "The gap here has only four entries. Which further ones exist on your machine, and which is most likely to make even a well-chosen range useless?"]
