# 实验 24.2 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab24_2.js。
原理:
  - ["**仿真成功率不是真机成功率。** 同一条策略，在标称仿真参数上验收一遍、在真机参数上再验收一遍，得到的是**两个数**，回答两个不同的问题。本章的硬口径是：凡报成绩，分“仿真”与“真机”两列，并写清真机试了多少次——几十次试验的成功率，小数点后那一位没有意义（24.5 节）。", "A simulation success rate is not a hardware success rate. The same policy scored on nominal simulator parameters and on hardware parameters gives two numbers answering two different questions. This chapter's rule: always two columns, and always state how many hardware trials were run — with a few dozen trials the first decimal place means nothing."]
  - ["**只在标称参数上训，策略会学会一条偷懒的捷径。** 本实验的观测里有“量出来的夹爪位姿”，也有关节角。标称参数固定不变时，策略按固定的连杆长度心算一套正运动学就够用了——于是连杆一变就错。见过各种连杆长度之后，这条捷径不管用，它只好去用“工件位姿 − 量出来的夹爪位姿”这个误差项，而**这个误差项在真机上照样成立**（算例 24.2）。", "Trained on fixed nominal parameters, the policy learns a shortcut: with the link lengths never changing it can compute the gripper pose in its head from the joint angles alone, and that breaks the moment the links differ. Having seen many link lengths it must instead use the task-space error between the part and the measured gripper pose — and that error term still holds on hardware."]
  - ["**范围有个最佳值，在中间。** 太窄盖不住真机与仿真之间那段差距；太宽则同一个观测对应的专家动作互相矛盾，策略只能学个平均，于是**仿真与真机两列一起掉**。合起来是一条倒 U 形曲线（算例 24.2）。", "The range has an optimum in the middle: too narrow fails to cover the gap, too wide makes the same observation demand contradictory actions, so the policy averages them and both columns fall. Together they form an inverted U."]
  - ["**范围该按差距定，不按手感定。** 第二个场景把差距本身拉大，最好的范围跟着往宽走。所以“随机化范围调多少”这个问题的答案不在训练日志里，而在**你有没有量过自己和真机之间差多少**（24.5 节）。", "The range should follow the gap, not intuition. Widen the gap in the second scene and the best range widens with it, so the answer is not in the training log but in whether you have measured your own sim-to-real gap."]
  - 式: "成功 = （闭合夹爪的那一刻 位置误差 < 2 cm） 且 （姿态误差 < 0.4 rad）；差距大小 = 0.4×连杆项 + 0.4×摩擦项 + 0.1×噪声项 + 0.1×延迟项（出厂差距记作 1.00，本实验的显式假设）"
步骤:
  - ["第一个场景，出厂差距（连杆差 13 mm、摩擦 0.11、噪声 4 mm、延迟 1 拍）：把随机化范围依次取 0、0.05、0.1、0.2、0.3、0.5、0.8、1.0、1.4，每档记下仿真与真机两列成功率（任务 1—3），填表 1。", "In the first scene at the factory gap, step the randomisation range through 0, 0.05, 0.1, 0.2, 0.3, 0.5, 0.8, 1.0 and 1.4, recording both columns at each (tasks 1–3) in Table 1."]
  - ["在表 1 上找出真机那一列最高的那一档，和读数里“真机那一列最高的范围”核对；把同一档的仿真成绩与范围 0 时的仿真成绩比一比，写下差了几个百分点。", "Find the best range for the hardware column in Table 1 and check it against the readout, then compare that row's simulation score with the simulation score at range 0."]
  - ["切到第二个场景，把差距依次取四档（见表 2 的行），每档记下“真机那一列最高的范围”、那一档的两列成绩，以及范围 0 时的真机成绩（任务 4、5），填表 2。", "In the second scene step the gap through the four settings in Table 2, recording the best range, both of its columns and the hardware score at range 0 (tasks 4, 5)."]
  - ["把表 2 的“差距大小”与“最好的范围”画成一张图（横轴差距，纵轴最好的范围），看是不是单调往上。", "Plot the gap size against the best range from Table 2 and check whether it rises monotonically."]
  - ["最后把表 1 里范围 0 那一行单独抄进表 3，连“真机试了多少次”一起写——这一行就是“只有仿真成功率的结果不采信”的证据。", "Finally copy the range-0 row of Table 1 into Table 3 together with the number of hardware trials: that row is the evidence for 'a simulation-only number is not evidence'."]
