注意:
  - ["**本实验的策略族只有两个参数**（触发闭合的半径、打转幅度），所以“刷奖励”的行为一眼就能认出来。真策略有几百万个参数，刷的方式千奇百怪——蹭着判据边缘、利用仿真器的穿模、把物体推到判据容易过的地方——**只能靠真实判据下的验收去发现**（算例 24.4）。", "The policy family here has two parameters, so the farming behaviour is obvious at a glance. A real policy has millions of parameters and can farm in countless ways — scraping the edge of the criterion, exploiting the simulator's penetration, nudging the object somewhere the criterion is easier — and these can only be found by acceptance testing against the real criterion."]
  - ["**任务分、尺度、权重的数值都是本实验的显式假设**，不代表任何真实任务的奖励设计。要带走的是结构性的结论（临界权重跟着“任务分 ÷ 回合步数”走；禁掉刷分动作比调权重管用），不是这里的数字。", "The bonus, the length scale and the weights are explicit assumptions of this lab and represent no real reward design. Take away the structural conclusions, not the numbers."]
  - ["**奖励是在仿真里算的，成绩两列都报。** 训练本来就只能在仿真里做，所以“奖励最高的那一版”是按仿真里的奖励挑出来的；而它好不好，要在仿真与真机两列上分别看——本章凡报成绩都是这个格式，真机那一列还要写明试了多少次。", "The reward is computed in simulation, because that is the only place training happens, so the winning policy is picked by its simulated reward — but how good it is must be read in both columns, with the hardware trial count stated."]
  - ["**两列各只试 20 次**，一档差一两个百分点不说明问题。本实验要看的是那条断崖（成功率从八九成直接到 0），不是单点。", "Each column is only 20 trials, so a point or two means nothing: what matters is the cliff from roughly ninety percent to zero, not single points."]
  - ["把“必须闭合夹爪”写成硬约束，并不等于把问题解决了——它只是把这一种刷法堵住。还有别的刷法（例如闭合在判据边缘上反复试）本实验没有建模；**所以验收永远要回到真实判据，而不是回到“我已经加了约束”**。", "Writing 'must close the gripper' as a hard constraint blocks this one route; others — repeatedly closing at the edge of the criterion, for instance — are not modelled here. Acceptance must always come back to the real criterion rather than to the fact that a constraint was added."]
思考题:
  - ["把你们产线上的“完成”写成一句可验收的话（什么位置、什么姿态、什么力、保持多久），再看你们现在的奖励函数或考核指标里有没有一条不满足这句话也能把分刷高的路。", "Write down what 'finished' means on your line as a sentence you could accept against, then look for a route in your reward function or KPI that scores high without satisfying it."]
  - ["本实验把临界权重与“任务分 ÷ 回合步数”的比值量出来了。如果回合步数不是固定的（任务难的时候允许走更久），这个手估还成立吗？该怎么改？", "This lab measures the ratio between the critical weight and the bonus per step. If the episode length were not fixed — longer episodes allowed for harder tasks — would the estimate still hold, and how would you fix it?"]
  - ["假设你们没法改奖励函数（供应商不开放），只能改验收方式。按本实验的结论，验收报告上至少要有哪几列才能发现刷奖励？", "Suppose you cannot change the reward function because the supplier owns it, and can only change the acceptance procedure. Which columns must the acceptance report carry for reward farming to show up at all?"]
