注意:
  - ["**不要把两列成绩平均。** 标称参数那一列回答“这个策略在我建的模型里行不行”，改掉参数那一列回答“模型错一点它还剩多少”。平均出来的数不回答任何问题，报告里要分两行写，并各自带上验收了多少回合。", "Do not average the two columns: the nominal column asks whether the policy works in the model you built, the changed column asks how much survives when the model is a little wrong. The average answers no question; write two rows, each with its episode count."]
  - ["**本实验的“改了物理参数”不是真机。** 它只是换了连杆长度、摩擦、观测噪声与执行延迟的同一个玩具，没有接触、形变、工件滑动、相机标定漂移。真机那一列只能靠**真的试**，试多少次也必须报（本章口径 b）。", "The changed-physics column is not hardware: it is the same toy with different link lengths, friction, observation noise and actuation delay, without contact, deflection, slipping parts or calibration drift. A hardware column can only come from real trials, whose count must be reported."]
  - ["**不要把这台机器的机时折算成吞吐印出来。** “每秒多少步”是（显卡、环境数、物理步长、任务）四元组的函数，本实验只报**迭代轮数**与**总环境步数**，墙钟时间只作为“这台机器上跑了多久”的记录。要引吞吐，只能引四样齐全的公开值——本章用的是 Isaac Gym 论文正文那组（单块 NVIDIA A100、Ant 任务、4096 个并行环境、物理步长 1/120 s、控制步长 1/60 s，训练过程中平均 540,000 步/秒），**引用时必须连这四样一起写，并注明是引用**。Isaac Lab 官方基准页与 MuJoCo MJX 官方文档的吞吐数缺物理步长，按本章口径不印。", "Do not turn your wall time into a printed throughput. Steps per second is a function of the GPU, the environment count, the physics timestep and the task together; this lab reports iterations and environment steps, with wall time only as a record of how long this machine took. The one throughput this chapter cites is from the Isaac Gym paper (a single NVIDIA A100, the Ant task, 4096 parallel environments, a 1/120 s physics step and a 1/60 s control step, averaging 540,000 steps per second during training) and it must always be quoted with all four parts and marked as a citation."]
  - ["**同一块显卡上不同任务的吞吐能差好几倍**（Isaac Gym 论文正文里 Ant 峰值 700,000 步/秒、Shadow Hand 150,000 步/秒），所以跨任务、跨框架的吞吐比较本章一律不做。", "Throughput on the same GPU differs several-fold between tasks (700,000 steps per second peak for Ant against 150,000 for Shadow Hand in the same paper), so this chapter makes no cross-task or cross-framework throughput comparisons."]
  - ["**达标线、物理步长、每回合步数、两套参数都是本实验的显式假设**；成功判据（位置 2 cm、姿态 0.4 rad）与本章算例同口径。换一套假设，表 2 以下的数全变——所以引用本实验的任何数都要连这几项一起写。", "The target, the timestep, the episode length and both parameter sets are explicit assumptions of this lab; the success criterion (2 cm and 0.4 rad) is the one used in the chapter's worked examples. Change the assumptions and every number below Table 2 changes, so quote none of them without these settings."]
  - ["进化策略每一轮都要重新采样，**随机种子换一个，达标轮数就会变**。本实验每档只跑一个种子，所以表 2 的轮数要当成“这一个种子上的观测”，不要当成定值；要下结论就多跑几个种子报中位数。", "The evolution strategy resamples every iteration, so a different seed changes the iteration count. Each setting here runs one seed, so read Table 2 as one observation rather than a constant; for a conclusion, run several seeds and report the median."]
思考题:
  - ["你的表 2 里，环境数从最少加到最多，轮数少了几倍、步数多了几倍？如果你的显卡再贵十倍、能同时跑十倍的环境，按这张表你会不会买？", "In your Table 2, how many times fewer iterations and how many times more steps did the largest setting take? If a GPU ten times more expensive could run ten times the environments, would this table persuade you to buy it?"]
  - ["把“改了物理参数”那一列的参数再改大一倍（连杆差一倍、摩擦再高一截），两列的比值变成多少？这个比值可以当成一条验收指标吗？要补上哪些口径才能当？", "Double the perturbation in the changed-physics column: what does the ratio become, and could that ratio serve as an acceptance metric? What conventions would have to be fixed first?"]
  - ["本实验只报轮数与步数，不报吞吐。如果供应商报的是“每秒多少万步”，你要向他追问哪四件事才能判断这个数有没有意义？", "This lab reports iterations and steps rather than throughput. If a supplier quotes steps per second, which four things must you ask for before the figure means anything?"]
