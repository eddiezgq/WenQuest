实际问题:
  标题: ["车间那台机械臂要会“伸过去抓住”，先在显卡里把它练出来", "The arm on the line has to learn to reach and grasp; train it on the GPU first"]
  内容: ["问渠减速器厂的装配工位上有一台机械臂，要把来料的工件抓起来放到夹具里。真机上试错太贵——撞一次夹具就是停线，所以策略先在仿真里练。并行物理仿真的卖点是“几千个环境一起跑”，可它到底买来了什么？本实验在显卡上把环境成批跑起来，扫一遍并行环境数，回答三个问题：达到同一成功率要多少轮、要烧多少环境步数、以及**把物理参数改掉之后这个策略还剩多少**。第三个问题最要紧：仿真里练出来的成绩不是真机上的成绩，报表上必须是两列。",
         "On the assembly station of the gearbox plant an arm has to pick incoming parts and place them in a fixture. Trial and error on the machine is expensive — one collision with the fixture stops the line — so the policy is trained in simulation first. Parallel physics simulation is sold on running thousands of environments at once, but what does that actually buy? This lab runs the environment in batch on the GPU, sweeps the environment count and answers three questions: how many iterations to reach a given success rate, how many environment steps that burns, and how much of the policy survives when the physics parameters are changed. The third is the one that matters: a simulated score is not a hardware score, and the report must have two columns."]
原理:
  - ["**并行环境换来的不是“更好的策略”，是“更少的等待轮数”。** 每一轮策略更新都要等所有并行环境跑完；环境数越多，这一轮对“哪个方向更好”的估计越准，走错的弯路越少，于是**迭代轮数下降**。但每一轮要跑的回合数成倍上升，**总环境步数上升**。两个数必须分开报（算例 24.6）。", "Parallel environments do not buy a better policy; they buy fewer iterations of waiting. Each update waits for every environment, and with more of them the estimate of which direction is better is sharper, so fewer iterations are wasted — while the episodes per iteration multiply, so the total environment steps rise. The two numbers must be reported separately."]
  - ["**收益递减是算得出来的**：总步数差不多每翻一倍就翻一倍，而省下的轮数越来越少。本实验还会看到更要紧的一头：**环境数太少的那几档根本达不到达标线**（选精英时混进来的全是运气好的回合）——那几档买到的不是“更快”，而是“能不能收敛”；过了那个门槛之后再加环境，轮数降不了多少，算力的账却照样翻倍。", "The diminishing returns can be computed: the total steps roughly double with every doubling while the iterations saved shrink. This lab also shows the more important end of the curve: the smallest environment counts fail to reach the target at all, because the elite set fills up with lucky episodes. There the environments buy convergence rather than speed; past that threshold, more of them save few iterations while the compute bill keeps doubling."]
  - ["**仿真成功率不是真机成功率**（本章第一号引用警告）。本实验把同一个策略在标称参数与改掉的参数上各验收一遍，两列并排报，并写明每列验收了多少回合——几百个回合的成功率，小数点后那一位没有意义（24.5 节）。", "A simulation success rate is not a hardware success rate. The same policy is scored on nominal and on changed parameters, the two columns are reported side by side, and the number of episodes in each is stated."]
  - ["**“每秒多少步”不是性能指标，而是（显卡、环境数、物理步长、任务）四元组的函数。** 四样不全的吞吐数本章一律不印；本实验也**不把自己的机时折算成吞吐**。要引吞吐，只能引四样齐全的公开值（见本实验第 5 节）。", "Steps per second is not a performance figure but a function of four things together: the GPU, the environment count, the physics timestep and the task. Throughput quoted without all four is not printed in this chapter, and this lab does not convert its own wall time into a throughput either."]
  - 式: "总环境步数 = 并行环境数 × 每回合步数 × 迭代轮数（验收用的回合不算进去）；成功 = （闭合夹爪的那一刻 位置误差 < 2 cm）且（姿态误差 < 0.4 rad）"
步骤:
  - ["运行第 1 节：装环境、确认显卡型号与 PyTorch 版本（任务 1），把显卡型号记进表 1。", "Run section 1 to confirm the GPU model and the PyTorch version (task 1) and record the GPU in Table 1."]
  - ["运行第 2 节：把成批的环境与策略建起来，确认物理步长、每回合步数、留出集回合数与两套物理参数（任务 2），填表 1。", "Run section 2 to build the batched environment and the policy, confirming the timestep, the episode length, the holdout size and the two parameter sets (task 2) in Table 1."]
  - ["运行第 3 节：扫并行环境数，每档记下达标的迭代轮数、总环境步数与训练用时（任务 3），填表 2。", "Run section 3 to sweep the environment count, recording the iterations, the total environment steps and the wall time at each (task 3) in Table 2."]
  - ["运行第 4 节：把最大那一档的策略在两套物理参数上各验收一遍，记下两列成功率、两列各多少回合与比值（任务 4），填表 3。", "Run section 4 to score the largest run's policy under both parameter sets, recording the two columns, the episodes in each and their ratio (task 4) in Table 3."]
  - ["运行第 5 节：读那一段关于吞吐的说明，把引用的公开值与它的四元组抄进表 4——注意**那是引用，不是你这台机器的数**（任务 5）。", "Run section 5, read the note on throughput and copy the cited public figure with its four-part context into Table 4 — it is a citation, not a measurement of your machine (task 5)."]
  - ["运行最后一格，回传结果。", "Run the last cell to send your results."]
