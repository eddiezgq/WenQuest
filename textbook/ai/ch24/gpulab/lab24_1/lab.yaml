标题: ["GPU 实验 24.1 在成千上万个并行环境里训一个到达任务，并用两列成绩验收它", "GPU Lab 24.1 Train a reaching task in thousands of parallel environments and score it in two columns"]
目的: ["在显卡上把一台平面二连杆机械臂的环境**成批地**跑起来（几十到上万个并行环境），用进化策略训一个到达并闭合夹爪的策略，然后做比训练更要紧的两件事：**按标称仿真参数**验收一遍、**把物理参数改掉之后**再验收一遍，两列分开报；并把“达到同一成功率要多少**迭代轮数**”与“要烧多少**总环境步数**”两个数也分开报。你会看到：并行环境买下来的是等待的轮数，付出去的是成倍的环境步数，而且步数涨得比轮数降得多——**收益是递减的**。",
       "Run a planar two-link arm environment in batch on the GPU — from dozens to tens of thousands of parallel environments — train a reach-and-close policy with an evolution strategy, and then do the two things that matter more than training: score it on the nominal simulator parameters, score it again after the physics parameters are changed, and report the two columns separately. Report the iteration count and the total environment steps separately as well. Parallel environments buy down the iterations you wait for and pay for it in environment steps, and the steps rise faster than the iterations fall: the returns diminish."]
显卡: basic
结果:
  - {名: n_envs, 说明: ["报表那一行用的并行环境数", "parallel environments in the headline row"], 单位: "个"}
  - {名: iters, 说明: ["达到留出集目标成功率用的迭代轮数", "iterations to reach the holdout target"], 单位: "轮"}
  - {名: env_steps, 说明: ["训练一共烧掉的环境步数（不含验收）", "total environment steps burned in training (evaluation excluded)"], 单位: "步"}
  - {名: sim_success_pct, 说明: ["仿真成功率（标称参数，留出集）", "success rate in simulation (nominal parameters, holdout)"], 单位: "%"}
  - {名: real_success_pct, 说明: ["改了物理参数之后的成功率（同一留出集）", "success rate after the physics parameters are changed"], 单位: "%"}
  - {名: n_trials, 说明: ["两列各验收了多少回合", "episodes scored in each column"], 单位: "回合"}
  - {名: succ_ratio, 说明: ["改了参数那一列比仿真那一列低多少（后者除以前者）", "ratio of the changed-physics column to the simulation column"], 单位: "倍"}
  - {名: iter_speedup, 说明: ["环境数最少到最多：迭代轮数少几倍", "iterations saved from the smallest to the largest env count"], 单位: "倍"}
  - {名: steps_blowup, 说明: ["环境数最少到最多：总环境步数多几倍", "environment steps multiplied from the smallest to the largest env count"], 单位: "倍"}
  - {名: train_s, 说明: ["报表那一行的训练用时（墙钟）", "wall-clock training time of the headline row"], 单位: "秒"}
