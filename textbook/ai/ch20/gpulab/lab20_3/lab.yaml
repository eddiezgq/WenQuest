标题: ["GPU 实验 20.3 用公开的机器学习势跑一段分子动力学，和经典力场比一比", "GPU Lab 20.3 Run molecular dynamics with an open machine-learning potential and compare it with a classical force field"]
目的: ["用公开权重的通用机器学习势（MACE-MP-0 系列）在一个小的铜超胞上跑一段分子动力学，和同一个体系上的经典力场（ASE 自带的 EMT）逐项比：单步耗时、随原子数怎么涨、能量守不守得住、径向分布函数像不像。再把超胞依次放大，亲手量出代价随体系大小怎么涨。全程守住一条口径：**机器学习势的误差是对第一性原理说的，不是对实验说的**。",
       "Run molecular dynamics on a small copper supercell with an open-weights universal machine-learning potential (the MACE-MP-0 family) and compare it item by item with a classical force field on the same system (ASE's built-in EMT): time per step, how that scales with the number of atoms, how well energy is conserved, and how similar the radial distribution functions are. Then enlarge the supercell step by step to measure how the cost grows with system size. One caliper holds throughout: the error of a machine-learning potential is measured against first-principles calculations, not against experiment."]
显卡: basic
