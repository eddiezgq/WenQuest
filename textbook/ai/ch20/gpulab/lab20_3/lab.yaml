实际问题:
  标题: ["这段模拟，用哪一种势算得起", "Which potential can you afford for this simulation"]
  内容: ["你要判断一个候选材料在 500 K 下结构稳不稳。办法是跑分子动力学：原子动起来，看它散不散架。摆在面前的有三条路——第一性原理（准，但这个体系算一纳秒要几十万核时，算不起）、经典力场（快得多，可它的参数是为别的体系拟的，换个成分就不知道还准不准）、机器学习势（号称两头都占）。这个实验把第三条路真的跑一遍，量出它比经典力场慢几倍、随体系大小怎么涨，以及两者给出的结构到底一样不一样。",
         "You need to know whether a candidate material keeps its structure at 500 K. The way to find out is molecular dynamics: let the atoms move and see whether the structure survives. Three routes are open — first principles (accurate, but a nanosecond of this system would take hundreds of thousands of core-hours), a classical force field (far faster, but its parameters were fitted for other systems and may not transfer), and a machine-learning potential (said to offer both). This lab actually runs the third one, measuring how much slower it is, how that grows with system size, and whether the two give the same structure at all."]
原理:
  - ["机器学习势学的是**势能面**：输入一组原子位置，输出能量，力由能量对位置求导得到。它不直接预测性质——性质是拿这个势跑模拟再算出来的。所以“能量误差小”与“性质算得对”是两件事（20.3 节、算例 20.4）。", "A machine-learning potential learns the potential energy surface: positions in, energy out, with forces as the derivative of the energy. It predicts no property directly — properties come from running simulations with it. A small energy error and a correct property are therefore two different claims (Section 20.3)."]
  - ["**误差的参照系必须写清楚。** 通用机器学习势是在第一性原理计算的数据上训练的，它的 meV/atom 是对那一套计算说的。第一性原理本身有自己的系统误差，换一个泛函，稳定性排序都可能变——所以不能把这个误差当成“离实验有多远”（20.3 节口径 2）。", "The reference frame of the error must be stated. A universal machine-learning potential is trained on first-principles data, and its meV/atom figures are relative to that level of theory. First principles carries its own systematic error, and a different functional can even change the stability ordering, so this error is not a distance from experiment."]
  - ["官方自己写明的局限要照记：MACE-MP-0 的论文明确说这一组模型**不包含磁性或自旋自由度**；CHGNet 把磁矩显式纳入，报告磁矩平均绝对误差 0.032 µB，同时承认对**无磁矩离子**推断电荷不准；两者共用的训练数据 MPtrj **混用 GGA 与 GGA+U**。本书只印这三条，不写“机器学习势对强关联体系不准”这种没核到原话的概括。", "Record the limitations the developers state: the MACE-MP-0 paper says plainly that these models contain no magnetic or spin degrees of freedom; CHGNet includes magnetic moments explicitly and reports a magnetic-moment MAE of 0.032 µB while noting that charge inference is unreliable for ions without a moment; and MPtrj, the training set behind both, mixes GGA and GGA+U. This book prints those three statements and no sweeping claim about strongly correlated systems, for which no source could be verified."]
  - ["经典力场（这里用 ASE 自带的 EMT）快几个数量级，因为它的函数形式是手写的、只有几个参数。它的问题不是慢，是**可迁移性**：参数为哪些元素、哪些环境拟的，离开那个范围就不知道还准不准。这与 20.3 节“外推到没见过的构型会崩”说的是同一件事，只是机器学习势的“见过的范围”是由训练集划定的。", "A classical force field (here ASE's EMT) is orders of magnitude faster because its functional form is handwritten with a handful of parameters. Its weakness is transferability: the parameters were fitted for particular elements and environments, and outside those nothing is guaranteed. The same applies to a machine-learning potential, whose covered range is set by its training set."]
  - ["**能量守恒是一把免费的尺子。** 微正则系综（NVE）里总能量应当守恒；它守不住的程度，就是这个势“不像个势”（力不是能量的梯度，或者步长太大）的程度。这不需要任何参考数据，所以是上手就能做的第一项检查（算例 20.3）。", "Energy conservation is a free diagnostic. In the microcanonical ensemble the total energy should be conserved, and the extent to which it is not measures how far the model departs from being a true potential — forces that are not the gradient of the energy, or too large a timestep. It needs no reference data, so it is the first check to run."]
  - 式: "F = −∂E/∂r；NVE 下 E_tot = E_pot + E_kin 应为常数；漂移按 (E_tot(t) − E_tot(0)) / N 计，单位 meV/atom"
步骤:
  - ["运行第 1 节：装环境、确认显卡型号与显存（任务 1）。", "Run section 1 to install the environment and confirm the GPU model and memory (task 1)."]
  - ["运行第 2 节：下载公开权重并建一个小的铜超胞，记下原子数与晶格常数（任务 2），填表 1 的第一行。", "Run section 2 to download the open weights and build a small copper supercell, recording the atom count and lattice constant (task 2) in the first row of Table 1."]
  - ["运行第 3 节：两种势各跑同样步数的 NVE，记下每步耗时与总能量漂移（任务 3），填表 1。", "Run section 3 to run the same number of NVE steps with each potential, recording the time per step and the energy drift (task 3); fill Table 1."]
  - ["运行第 4 节：把超胞依次放大，记录耗时随原子数怎么涨，拟出幂次（任务 4），填表 2。", "Run section 4 to enlarge the supercell step by step, recording how the time per step grows and fitting the exponent (task 4); fill Table 2."]
  - ["运行第 5 节：在同一批构型上比两者的力，并各自算径向分布函数，记下第一近邻峰位（任务 5），填表 3。", "Run section 5 to compare forces on the same configurations and compute the radial distribution function for each, recording the first-neighbour peak (task 5); fill Table 3."]
  - ["运行最后一格，回传结果。", "Run the last cell to send your results."]
