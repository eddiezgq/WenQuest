注意:
  - ["**这个实验比的不是“谁更准”。** 两种势都没有和第一性原理或实验对照——要那样比，得另外跑第一性原理，而这正是算不起的那一步。能比的是：耗时、随体系大小的增长、能量守恒，以及两者给出的结构差多少。谁更接近真实，本实验回答不了，报告里不要写。", "This lab does not rank the two for accuracy. Neither is compared with first principles or experiment — that would require the very calculation that is too expensive. What is comparable here is cost, scaling, energy conservation and how far the two structures differ. Which is closer to reality cannot be answered here, and should not be claimed in the report."]
  - ["铜是**金属、无磁**，选它正是为了避开官方写明的局限（不含自旋自由度）。换成含磁性元素的体系重做之前，先把那条局限读一遍。", "Copper is a non-magnetic metal, chosen precisely to stay clear of the stated limitation that these models carry no spin degrees of freedom. Read that limitation again before repeating this on a magnetic system."]
  - ["每步耗时与显卡型号、批大小、是否编译都有关。表 1、表 2 的各行必须在**同一块卡、同一套设置**下测，跨机器的数不能互相比。首次运行包含权重下载与编译，**计时要跳过前若干步**（笔记本里已经这么做）。", "Time per step depends on the GPU, the batch size and whether the model was compiled. All rows must be measured on one card with one set of settings; numbers from different machines are not comparable. The first run includes downloading and warm-up, so the timing skips the first steps, as the notebook does."]
  - ["能量漂移与**步长**强相关。两种势必须用同一个步长比较；想单独看步长的影响，就固定势、只改步长，别两样一起改。", "Energy drift depends strongly on the timestep. Compare the two potentials at the same timestep, and if you want to study the timestep itself, hold the potential fixed."]
思考题:
  - ["按你表 2 拟出来的幂次，把体系放大到 10 万个原子，机器学习势跑 1 纳秒要多久？经典力场呢？这个差距会改变你对“用哪条路”的判断吗？", "Using the exponent you fitted in Table 2, how long would a nanosecond of a hundred-thousand-atom system take with each potential, and does that gap change which route you would choose?"]
  - ["你量到的能量漂移是多少？如果把步长加倍，你预期漂移怎么变（提示：速度 Verlet 的局部误差是步长的几次方）？动手验证一次。", "What drift did you measure, and how would you expect it to change if the timestep doubled? (Hint: what is the local error order of velocity Verlet?) Verify it."]
  - ["两种势给出的第一近邻峰位差了多少？这个差落在“同一个结构、热涨落不同”的范围里，还是已经大到说明它们描述的不是同一件事？你用什么判据回答这个问题——本实验里有没有现成的量能当这个判据？", "How far apart are the first-neighbour peaks? Is that within what thermal fluctuation would explain, or large enough to mean the two describe different physics? What criterion settles this, and is any quantity measured here usable as that criterion?"]
