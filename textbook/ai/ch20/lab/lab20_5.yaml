# 实验 20.5 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab20_5.js。
原理:
  - ["自主实验室的闭环是：提议 → 合成 → 表征 → 回填 → 再提议。真实实验一次要几个小时到几天，所以**“要试多少次”就是全部的成本**。三种提议策略：网格挨个试、随机试、用代理模型挑（这里是高斯核岭回归 + 上置信界，即“要么看着好、要么没人去过”）（20.5 节）。", "The loop in an autonomous lab is propose, synthesise, characterise, feed back, propose again. A real experiment takes hours to days, so the number of experiments is the whole cost. Three proposal strategies appear here: a grid, random sampling, and a surrogate model (kernel ridge regression with an upper confidence bound, that is, points that either look good or have never been tried) (Section 20.5)."]
  - ["**成绩必须按真值算。** 闭环只能看见自己测到的数；用测到的数当成绩，等于让它自己给自己打分。本实验把两个数并排放着：闭环自己报的分数，与那一点的真值。", "The score must be computed against the truth. The loop only ever sees its own measurements, and scoring it by those is letting it mark its own work. This lab shows both numbers side by side: what the loop believes it found, and the truth at that point."]
  - ["**随机噪声与系统偏差是两回事。** 噪声多测几次就抹平了，代价是多做几次实验；偏差抹不平——它把整张响应面**拧歪**，于是闭环一路爬到错的地方，而且自报的分数越来越高。", "Random noise and systematic bias are different things. Noise averages out if you measure more, at the cost of extra experiments. A bias does not average out: it tilts the whole response surface, so the loop climbs to the wrong place while its self-reported score keeps rising."]
  - ["偏差的要害是**门槛与方向**，不是“越大越坏”这种线性印象：小偏差几乎不影响结果，过了某个大小整段跑偏；而同样大小、方向相反的偏差，后果可以完全不同——因为它把哪个峰抬起来，取决于那个峰在成分空间的哪一侧。", "What matters about a bias is its threshold and its direction, not a linear sense that bigger is worse: a small bias barely matters, beyond a certain size the run goes badly wrong, and a bias of the same size with the opposite sign can behave quite differently — which peak it lifts depends on where that peak sits in composition space."]
  - ["**提升吞吐 ≠ 提升收益。** 一天做多少个实验（吞吐）与找到好材料要少试几次（收益）是两件事，报成绩时必须分开写，而且都要有基线（20.5 节的口径 5）。", "Throughput is not yield. How many experiments per day and how many fewer experiments are needed to find something good are two different quantities; report them separately, each against a baseline."]
  - 式: "遗憾 = 真正的最优值 − 所选点的真值；测量值 = 真值 + 噪声 × 随机数 + 偏差 × (a − 0.5)"
步骤:
  - ["“闭环跑一遍”场景，噪声与偏差都为 0、预算 24：三种策略各跑一次，记下遗憾（任务 1），填表 1。", "In the first scene with no noise and no bias and a budget of 24, run each of the three strategies once and record the regret (task 1); fill Table 1."]
  - ["保持代理模型与预算 24，把“第几次重复”从 0 拖到 7，记下八次的遗憾最小值、最大值与大致中位数（任务 2），填表 1 最后一行。只跑一次能不能下结论，看这一行。", "Keep the surrogate strategy and the budget of 24, drag the repeat number from 0 to 7 and record the smallest, largest and approximate median regret (task 2) in the last row of Table 1."]
  - ["把随机噪声依次调到 0.05、0.1、0.2（偏差仍为 0），每档记遗憾；再把预算从 24 提到 48 各记一次（任务 3），填表 2。这一步回答：噪声能不能靠多做实验压下去。", "Raise the noise to 0.05, 0.1 and 0.2 with no bias, recording the regret at each, then repeat with the budget raised from 24 to 48 (task 3); fill Table 2."]
  - ["噪声调回 0.02，把系统偏差依次取 −1.0、−0.6、−0.3、0、+0.3、+0.6、+1.0，每档记下闭环挑的点、它自己报的分数与那一点的真值（任务 4），填表 3。", "Set the noise back to 0.02 and step the bias through −1.0, −0.6, −0.3, 0, +0.3, +0.6 and +1.0, recording at each the pick, the self-reported score and the truth there (task 4); fill Table 3."]
  - ["切到“偏差扫一遍”，读出正负两个方向的门槛（任务 5），写进报告，并回答：同样大小、方向相反的偏差，后果为什么不一样。", "Switch to the sweep scene, read off the thresholds in both directions (task 5) and explain why two biases of the same size but opposite sign do not behave alike."]
