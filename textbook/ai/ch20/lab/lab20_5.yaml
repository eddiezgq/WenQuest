注意:
  - ["这张响应面是**造出来的玩具**：两个峰，一个全局一个陪衬。它说明的是机理（探索与利用、噪声与偏差的区别），不要把这里的“做 24 次就够了”搬到真实体系上——真实体系的维数高得多，而且很多成分根本做不出来。", "The response surface here is a toy with two peaks, one global and one decoy. It illustrates the mechanism — exploration versus exploitation, noise versus bias — and the number of experiments needed here does not transfer to real systems, which have far more dimensions and many compositions that cannot be made at all."]
  - ["**一次运行说明不了问题。** 代理模型带随机初始点，同样的设置换个重复编号，遗憾能差好几倍。任务 2 要求跑八次正是为此；报告里凡写遗憾，都要写清是哪一次、或者写范围。", "A single run settles nothing: the surrogate starts from random points, and the same settings with another repeat number can give several times the regret. That is what task 2 is for; whenever the report quotes a regret, say which run it came from or give the range."]
  - ["表 3 里“闭环自己报的分数”随偏差一路升高，而真值一路降低。**这两列必须并排填**，只填一列就看不出本实验最要紧的那件事。", "In Table 3 the self-reported score rises with the bias while the truth falls. Both columns must be filled: either one alone hides the main point of the lab."]
  - ["本实验的偏差写成“越靠右测得越高”。真实的系统偏差未必是这个形状（可能与温度、批次、仪器漂移有关）。要记住的是**它不随重复测量消失**这一条性质。", "The bias here reads high towards one end of the composition range. Real systematic errors need not have this shape — they may follow temperature, batch or instrument drift. What carries over is that they do not vanish with repeated measurement."]
思考题:
  - ["偏差在这里是“越靠右测得越高”。如果你的表征设备有这种毛病，光看闭环自己报的分数，能不能发现？要加一道什么样的检查才发现得了——想一个花得起的办法。", "If your characterisation setup read high towards one end, could you detect it from the loop's own scores? What affordable check would reveal it?"]
  - ["把本实验的“遗憾—预算”曲线与 20.4 节的筛选漏斗放在一起看：如果上游筛选把候选范围缩小了十倍，闭环的预算能省多少？这个省法有没有风险？", "Put the regret-versus-budget curve beside the screening funnel of Section 20.4: if upstream screening narrowed the candidate range tenfold, how much budget would the loop save, and what risk comes with that saving?"]
  - ["吞吐与收益要分开报。设想一台机器把“一天做多少个实验”提高了十倍，而提议策略没变——按本实验的曲线，找到同样好的材料，时间能缩短多少倍？什么情况下它一点也不缩短？", "Throughput and yield must be reported separately. Suppose a machine raises the experiments per day tenfold with the proposal strategy unchanged: by the curves here, how much sooner is an equally good material found, and when would it not help at all?"]
