实际问题:
  标题: ["这个模型到底会不会外推", "Does this model actually extrapolate"]
  内容: ["筛一批新化合物，真正想知道的是：模型能不能对**它没见过的那一类**分子给出靠谱的预测。随机划分回答不了这个问题——测试集里的分子，训练集里几乎总有同骨架的近亲，模型只要会“找类似物”就能考高分。换成按骨架划分，这条路被切断，分数才说明问题。",
         "When screening new compounds, what you actually want to know is whether the model can predict for a class of molecules it has never seen. A random split cannot answer that: for almost every test molecule there is a close analogue of the same scaffold in training, so a model that merely looks up analogues scores well. A scaffold split cuts that path, and only then does the score mean something."]
原理:
  - ["两种划分的原文定义：随机划分把样本随机分进训练／验证／测试；骨架划分按分子的**二维结构骨架**（Murcko 骨架，RDKit 实现）分，**结构不同的分子进不同子集**，所以比随机划分更难（18.5 节）。", "The original definitions: a random split assigns samples at random, while a scaffold split groups molecules by their two-dimensional framework (the Murcko scaffold, via RDKit) and puts structurally different molecules in different subsets, which makes it harder (Section 18.5)."]
  - ["**骨架划分不是唯一确定的划分**：大于目标测试集一半的骨架箱全部进训练集，其余的箱是**随机**分配的。所以同一个数据集可以有多个骨架划分，分数会抖——本实验要换几组看抖多少。", "A scaffold split is not unique: bins larger than half the target test set all go to training, and the rest are assigned at random. The same dataset therefore admits several scaffold splits with different scores, and this lab measures that spread."]
  - ["本书不印“换成骨架划分平均掉多少分”这种数——没有可核到的成对原始数字。能印的是 MoleculeNet 图卷积在骨架划分数据集上的三档落差：BBBP 训练 0.956、验证 0.943、测试只剩 0.690。**验证分几乎没掉而测试分掉了，说明连“用验证集选模型”都挡不住骨架外推的失败。**", "This book prints no average drop for switching to a scaffold split: no paired original numbers could be verified. What can be printed is MoleculeNet's three-way gap on a scaffold-split dataset: BBBP train 0.956, validation 0.943, test 0.690. The validation score barely moves while the test score collapses, which shows that even model selection on a validation set does not catch the failure."]
  - ["最近邻基线是故意放进来的“只会记类似物”的对照。它在随机划分上往往比正经模型还高，在骨架划分上塌得最狠——**两种划分可能把两个模型的名次排反**，这与第 17.1 节“换一套测试排名会翻”是同一件事。", "The nearest-neighbour baseline is deliberately included as a model that can only memorize analogues. It often beats the real model under a random split and collapses hardest under a scaffold split, so the two protocols can rank the two models in opposite orders — the same phenomenon as the ranking flip of Section 17.1."]
步骤:
  - ["运行第 1 节：装环境、确认显卡、取数据集（任务 1）。数据集从公开来源现取，仓库里不放分子数据。", "Run section 1 to set up, check the GPU and fetch the dataset (task 1). Data is fetched from a public source; none is kept in the repository."]
  - ["运行第 2 节：算 Murcko 骨架，看骨架的分布——最大的几个骨架各占多少分子（任务 2），填表 1。", "Run section 2 to compute the Murcko scaffolds and look at their distribution: how many molecules the largest scaffolds hold (task 2), in Table 1."]
  - ["运行第 3 节：在随机划分上训图神经网络与最近邻基线，各记一次 AUC（任务 3）。", "Run section 3 to train the GNN and the nearest-neighbour baseline on a random split, recording the AUC of each (task 3)."]
  - ["运行第 4 节：换成骨架划分再各训一次，填表 2（任务 4）。注意两个模型各掉了几个点。", "Run section 4 to repeat both on a scaffold split and fill Table 2 (task 4). Note how many points each one loses."]
  - ["运行第 5 节：换五组不同的骨架划分，看分数抖多少（任务 5），填表 3。", "Run section 5 across five different scaffold splits to measure the spread (task 5) in Table 3."]
  - ["运行最后一格，回传结果。", "Run the last cell to send your results."]
