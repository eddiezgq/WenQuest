注意:
  - ["本实验测出来的绝对分数不能与任何论文比：数据集版本、特征、模型大小、训练轮数都不一样。能比的是**同一次实验里两种划分之间的差**，以及两个模型的名次。", "The absolute numbers here are not comparable with any paper: different dataset version, features, model size and training schedule. What transfers is the gap between the two splits within one run, and the ranking of the two models."]
  - ["MoleculeNet 论文自身的数据集大小有两套数（Table 1 与正文对不上，例如 BACE 1513 对 1522）。引用时只用 Table 1 的值并注明原文另有一组。", "The MoleculeNet paper gives two sets of dataset sizes (Table 1 disagrees with the text, e.g. BACE 1513 versus 1522). Quote Table 1 and note that the text differs."]
  - ["骨架划分要跑五组才看得出抖多少。只跑一组就下结论，和只跑一个随机种子一样不可靠。", "Run five scaffold splits before concluding: a single split is as unreliable as a single random seed."]
思考题:
  - ["你这一次两个模型的名次有没有被两种划分排反？如果没有，把图神经网络的层数减到 1 层再试一次——模型越弱，越不会“记类似物”，这件事对名次有什么影响？", "Did the two splits rank your two models differently? If not, cut the GNN to a single layer and try again: a weaker model memorizes fewer analogues, and that should move the ranking."]
  - ["给一个真实的筛选项目设计划分方案：你会用随机划分、骨架划分，还是别的（例如按时间、按来源）？写出你的方案，并说明它回答的是哪一个问题、回答不了哪一个。", "Design the split for a real screening project: random, scaffold, or something else such as by time or by source? Write it down and say which question it answers and which it cannot."]
