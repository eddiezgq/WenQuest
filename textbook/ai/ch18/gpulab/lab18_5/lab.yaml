标题: ["GPU 实验 18.5 随机划分与骨架划分：同一个模型，两个成绩", "GPU Lab 18.5 Random versus scaffold split: one model, two scores"]
目的: ["训一个预测分子性质的图神经网络，用**同一批分子、同一个模型**，只把数据划分方式从随机换成骨架，看分数差多少；再和一个只会“找类似物”的最近邻基线比一比，看两种划分把两个模型的名次排成什么样。",
       "Train a graph neural network for molecular property prediction, then change only the data split — random to scaffold — on the same molecules with the same model and see how much the score moves. Compare it with a nearest-neighbour baseline that can only look up analogues, and see how the two splits rank the two models."]
显卡: basic
