注意:
  - ["本实验测出来的绝对值不能与论文里的 CAMEO/CASP 分数比：蛋白不同、数量少得多、叠合与指标的实现也不完全一样。能比的是**三个指标之间的关系**与**自评分数与真实误差的关系**。", "The absolute numbers here are not comparable with the published CAMEO or CASP scores: different proteins, far fewer of them, and a different implementation of the superposition and the metrics. What does transfer is the relationship between the three metrics, and between the self-score and the true error."]
  - ["论文给的时间口径是 384 残基、单张 V100、14.2 秒，比**单个** AlphaFold2 模型快 6 倍；“最高约 60 倍”只在更短的序列上成立，论文没说“短”是多少残基。按这一组估自己的用时。", "The published timing is 14.2 seconds for 384 residues on one V100, six times faster than a single AlphaFold2 model. The headline figure of up to 60× holds only on shorter sequences, and the paper does not say how short. Estimate your own run from the 14.2-second figure."]
  - ["选蛋白时避开太长的（显存）与明显是多聚体的（单链预测对不上实验结构）。挑 80—250 残基的单链球状蛋白最省事。", "Avoid very long chains (memory) and obvious oligomers (a single-chain prediction will not match the experimental structure). Globular single chains of 80 to 250 residues are the easy case."]
思考题:
  - ["你量出来的“自评 90 分以上却错超过 2 Å”的比例是多少？假设你要拿这个结构去判断一个氢键存不存在，这个比例能接受吗？如果不能，你会改做什么？", "What share of residues scoring above 90 is still off by more than 2 Å in your run? If you wanted to use the structure to decide whether a particular hydrogen bond exists, would that share be acceptable? If not, what would you do instead?"]
  - ["把同一条序列的实验结构换成另一个构象态（如果这条蛋白有的话）再比一次。预测结构与两个态各自的分数差多少？这件事对“预测的是哪一个构象”说明了什么？", "If the protein has more than one known conformational state, score the same prediction against each. How different are the two scores, and what does that say about which conformation the model predicted?"]
