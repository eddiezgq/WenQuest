注意:
  - ["本实验里“真实误差”是知道的，现实里不知道——这正是难处所在。能做的是拿一批**有实验结构**的同类蛋白去核对这条相关性，再决定门限定在哪。这件事要花钱，但它是唯一能把门限定得有依据的办法。", "Here the true error is known; in practice it is not, and that is the whole difficulty. What you can do is check the correlation on a set of similar proteins that do have experimental structures, and set the threshold from that. It costs money, and it is the only way to set the threshold on evidence."]
  - ["分数低不等于预测错。官方的说法是：低置信区应当读成“这里大概没有固定结构”。但它**也可能**是真失败，或者那一段只在与别的分子结合时才成形——这三种情况在图上长得一样。", "A low score does not mean the prediction failed. The official reading is that a low-confidence region probably has no fixed structure — but it may also be a genuine failure, or a region that only folds when bound to something else. All three look the same on the plot."]
  - ["“换一条蛋白”换的是随机种子，三段的比例与性质不变。结论要在至少三条蛋白上看一遍再写。", "Changing the protein changes the random seed; the three parts keep their proportions. Look at at least three before writing down a conclusion."]
思考题:
  - ["本实验里“真实误差”是知道的，现实里不知道。如果只有自评分数，你怎样判断这一次的相关性是好是坏？写出一条能在真实项目里执行的检查，并说明它要花什么代价。", "Here the true error is known; in a real project it is not. With only the self-score in hand, how would you tell whether the correlation holds this time? Write down a check you could actually run, and say what it costs."]
  - ["把门限这件事换个问法：不是“收不收下这个残基”，而是“这个结论敢不敢下”。给三个具体结论——“这两个域大致怎么排”“这个口袋在哪”“这个氢键存不存在”——各配一条门限，并说明为什么三条不一样。", "Reframe the threshold: not which residues to keep, but which conclusions you dare draw. Give three specific conclusions — the rough arrangement of two domains, where a pocket sits, whether a particular hydrogen bond exists — and attach a threshold to each, explaining why the three differ."]
