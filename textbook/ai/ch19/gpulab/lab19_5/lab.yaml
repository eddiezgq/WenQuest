注意:
  - ["**两种划分必须用同一个模型、同一套超参数、同一批特征。** 只要有一处不同，差出来的分就说不清是口径造成的还是调参造成的。本实验把这三样写死在一处，改要一起改。", "The two splits must use the same model, the same hyper-parameters and the same features. Change any one of them and the gap no longer isolates the split. This lab fixes all three in one place; change them together or not at all."]
  - ["按区块划分的分数**本来就抖**：换哪几块进测试集，分数就变。所以要跑 5 折看平均与标准差，只跑一折下结论是不作数的。表 2 的抖动那一栏必须填。", "Block-split scores fluctuate by nature: which blocks go into the test set changes the answer. Run five folds and report the mean and the standard deviation; a single fold proves nothing. The spread column of Table 2 is not optional."]
  - ["像素数不要开太大。本实验的瓶颈不是显卡而是**两两距离**——像素数翻倍，自相关那一节的开销翻四倍。先用十万量级跑通，再往上加。", "Do not take too many pixels. The bottleneck is not the GPU but the pairwise distances: doubling the pixel count quadruples the cost of the autocorrelation section. Get it working at a hundred thousand or so before scaling up."]
  - ["这一景影像的结论不能直接外推到别的地物、别的季节、别的传感器。本实验量的是**方法上的差距**（两种划分差多少），不是某个数据集的绝对分数。", "The conclusion from one scene does not transfer to other land covers, seasons or sensors. What this lab measures is the methodological gap between two splits, not an absolute score for any dataset."]
思考题:
  - ["你量到的差距是多少分？把它写成一句验收条款：供应商该用多大的块、跑几折、报哪两个数？写出来，让一个不懂机器学习的人也能照着检查。", "How large is your gap? Turn it into an acceptance clause: what block size must the vendor use, over how many folds, and which two numbers must they report? Write it so that someone with no machine-learning background can check it."]
  - ["假如这个模型要用在**另一个省**，按区块划分量到的分数是不是就够了？还缺哪一种划分？（提示：想一想同一个省内的块与跨省的块有什么不同。）", "If the model is to be used in another province, is the block-split score enough? What further split is missing? Hint: consider how blocks within one province differ from blocks across provinces."]
