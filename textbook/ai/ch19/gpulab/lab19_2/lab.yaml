标题: ["GPU 实验 19.2 跑一次全球预报，亲手量它越推越平", "GPU Lab 19.2 Run a global forecast and measure how it flattens"]
目的: ["用公开权重的 AIFS（欧洲中期天气预报中心的机器学习预报模式，权重 CC BY 4.0）从真实初值起报一次十天全球预报，逐个时效量它的锐度与功率谱，亲眼看“越推越平”不是实现上的毛病而是均方误差最优解本身；再与同一时刻的分析场比 RMSE，看“RMSE 更小”和“场更像真的”能不能兼得。",
       "Run a ten-day global forecast from real initial conditions with the open-weights AIFS model (ECMWF's machine-learning forecast system, weights under CC BY 4.0), measuring sharpness and the power spectrum at every lead time, so you can see that the smoothing is the MSE-optimal answer rather than an implementation flaw. Then score it against the analysis and ask whether lower RMSE and a realistic-looking field can be had at once."]
显卡: basic
结果:
  - {名: lead_days, 说明: ["推了多少天", "lead time reached"], 单位: "天"}
  - {名: sec_per_step, 说明: ["平均每 6 小时步要多久", "seconds per 6-hour step"], 单位: "秒"}
  - {名: sharp_day0, 说明: ["初值场的锐度", "sharpness of the initial field"], 单位: "—"}
  - {名: sharp_day2, 说明: ["第 2 天预报场的锐度", "sharpness at day 2"], 单位: "—"}
  - {名: sharp_day10, 说明: ["第 10 天预报场的锐度", "sharpness at day 10"], 单位: "—"}
  - {名: sharp_ratio, 说明: ["第 10 天锐度只剩初值的几成", "day-10 sharpness as a share of day 0"], 单位: "—"}
  - {名: hi_energy_drop_pct, 说明: ["高波数能量掉了多少", "drop in high-wavenumber energy"], 单位: "%"}
  - {名: rmse_day2, 说明: ["第 2 天对分析场的 RMSE", "RMSE against the analysis at day 2"], 单位: "K"}
  - {名: rmse_day5, 说明: ["第 5 天对分析场的 RMSE", "RMSE against the analysis at day 5"], 单位: "K"}
