注意:
  - ["**本实验不与任何业务模式比分数。** 官方自己说第 1 天对分析场与对探空观测的结论相反，而且没有公开成对的绝对 RMSE 值。能比的是“同一个真值下、不同时效之间”的变化，以及锐度与 RMSE 这两件事的方向。", "This lab scores no comparison against any operational model: the developers themselves report opposite conclusions at day 1 against analyses and against radiosondes, and no paired absolute RMSE values are published. What is comparable here is the change across lead times under one truth, and the direction in which sharpness and RMSE move."]
  - ["官方明说 **GPU 的非确定性使用户无法精确复现官方 AIFS 预报**。你这一次的数与别人的、与官方的都会有末位差别，这是正常的，不要当成装错了。", "The documentation states plainly that GPU non-determinism prevents users from reproducing official AIFS forecasts exactly. Your numbers will differ in the last digits from anyone else's and from the official run; that is expected, not a broken install."]
  - ["锐度（相邻格点差的均方根）随分辨率变。表 1 的各行必须在**同一套格点**上算，换了插值或换了分辨率就不能跨行比。", "Sharpness (the RMS of neighbouring differences) depends on resolution. Every row of Table 1 must be computed on the same grid; regridding or changing resolution breaks the comparison."]
  - ["如果显存不够，把第 2 节的区域裁小（本实验的结论在区域上同样成立），不要降精度跑——降精度会把“场平不平”这件事本身搅乱。", "If memory is short, crop the region in section 2 — the conclusion holds regionally as well — rather than dropping numerical precision, which would itself confound the question of how smooth the field is."]
思考题:
  - ["你量到第 10 天的锐度只剩初值的几成？如果把这个场直接送进风功率曲线（19.6 节那条三次方关系），算出来的发电量会偏高还是偏低？用你表 1 的数说明。", "What share of the day-0 sharpness survives to day 10 in your run? If that field went straight into the cubic power curve of Section 19.6, would the computed generation come out too high or too low? Argue from your Table 1."]
  - ["有人提议：把预报场的功率谱强行拉回真实场的样子（谱订正），这样锐度就对了。按你表 2 的数，这么做之后 RMSE 会怎么变？什么时候这笔交易划算、什么时候不划算？", "Someone proposes forcing the forecast's power spectrum back to the observed one so the sharpness is right. From your Table 2, what would that do to the RMSE? When is that trade worth making, and when is it not?"]
