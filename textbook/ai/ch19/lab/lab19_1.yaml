# 实验 19.1 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab19_1.js。
原理:
  - ["把大气切成格子，一个时间步把信息往前送 uΔt。显式格式算新值时只看自己和左邻居，所以信息一步**不能跨过一个格距**：库朗数 C = uΔt/Δx 超过 1，解就指数放大（19.1 节）。", "Cut the atmosphere into cells: one timestep carries information a distance uΔt. An explicit scheme looks only at a cell and its upstream neighbour, so information may not cross more than one cell per step — once C = uΔt/Δx exceeds 1 the solution amplifies exponentially (Section 19.1)."]
  - ["稳定不等于准。库朗数 0.9 时解不炸，峰值却一路掉下去——迎风格式自带**数值耗散**，把场一步步抹平。这是本章反复出现的那对矛盾的第一次露面。", "Stable is not the same as accurate. At Courant 0.9 nothing blows up, yet the peak keeps falling: the upwind scheme carries numerical dissipation that flattens the field step by step. This is the first appearance of a tension that returns throughout the chapter."]
  - ["半拉格朗日格式沿轨迹回溯到上游点再插值，回溯多远都行，**不受 CFL 约束**。欧洲中期天气预报中心的技术文档正是据此说它“unconditional stability allows long timesteps”，业务运行中库朗数确实大于 1。它的代价同样是插值带来的抹平。", "A semi-Lagrangian scheme traces back along the trajectory and interpolates, however far back that is, so the CFL limit does not apply. ECMWF's own documentation says its unconditional stability allows long timesteps, and operational Courant numbers do exceed 1. Its price is again smoothing, from the interpolation."]
  - ["第二道墙与格式无关：大气是混沌的，两个几乎一样的初值按**指数**分开。于是“还能信多久”只与初值精度的**对数**成正比——精度提高十倍，多买回一个翻倍时间。", "The second wall has nothing to do with the scheme: the atmosphere is chaotic and two nearly identical initial states separate exponentially. Useful lead time therefore grows with the logarithm of initial accuracy: ten times better data buys one more doubling time."]
  - 式: "C = uΔt/Δx ≤ 1（显式格式）；误差 ≈ 初值误差 × 2^(t/翻倍时间)；还能信多久 ≈ 翻倍时间 × log₂(容许误差 / 初值误差)"
步骤:
  - ["“格子跟不跟得上”场景：显式格式、库朗数 0.9，把步数拖到 60，记下峰值与形状（任务 1），填表 1 第一行。", "In the first scene use the explicit scheme at Courant 0.9, drag the steps to 60 and record the peak and the shape (task 1); fill the first row of Table 1."]
  - ["把库朗数依次调到 1.2、1.5、2.0，每一档记下“第几步峰值过 10”与第 40 步的峰值（任务 2），填满表 1 的显式那几行。", "Raise the Courant number to 1.2, 1.5 and 2.0, recording at each the step where the peak passes 10 and the peak at step 40 (task 2)."]
  - ["格式换成半拉格朗日，把同样的几个库朗数再走一遍（任务 3）：它炸不炸？峰值掉到多少？填表 1 的后半。", "Switch to semi-Lagrangian and repeat the same Courant numbers (task 3): does it blow up, and how far does the peak fall? Complete Table 1."]
  - ["切到“初值差一点点”，初值误差取 10⁻²，按“开始”看完整程，记下“12 对的平均”（任务 4），填表 2 第一行。", "Switch to the chaos scene with an initial error of 10⁻², press start, let it run to the end and record the twelve-pair average (task 4); fill the first row of Table 2."]
  - ["把初值误差逐档缩到 10⁻³、10⁻⁴、10⁻⁵，每一档记下平均可信时长与“比上一档多了多少”（任务 5），填满表 2，并算出每缩小一个数量级多买回几个时间单位。", "Shrink the error to 10⁻³, 10⁻⁴ and 10⁻⁵, recording the average lead time and the gain over the previous row (task 5). Complete Table 2 and work out how much one order of magnitude buys."]
数据表:
  - 标题: ["表 1  两种格式在不同库朗数下的表现", "Table 1  The two schemes at different Courant numbers"]
    表头: ["格式", "库朗数", "第几步峰值过 10", "第 40 步的峰值", "炸没炸"]
