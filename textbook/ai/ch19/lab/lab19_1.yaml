  - 标题: ["表 2  初值精度买回多少时间", "Table 2  What initial accuracy buys"]
    表头: ["初值误差", "这一对还能信多久", "12 对的平均", "比上一档多出多少"]
    表头英文: ["initial error", "lead time of this pair", "average over 12 pairs", "gain over the previous row"]
