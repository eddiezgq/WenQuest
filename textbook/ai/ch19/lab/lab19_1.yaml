注意:
  - ["本实验的平流是一维的、风速恒定的玩具，洛伦兹系统也只有三个变量。它们说明的是**机理与数量级**：CFL 是谁的约束、误差怎么长。不要把这里的具体步数、具体时长换算成“真实大气能预报几天”。", "The advection here is one-dimensional with a constant wind, and the Lorenz system has only three variables. They are meant to show the mechanism and the order of magnitude, not to convert into a number of days for the real atmosphere."]
  - ["“还能信多久”取的是**12 对轨迹的平均**。只看一对会抖得很厉害——同样的初值误差，换一个出发点，这个数能差一倍。表 2 要填平均那一栏才看得出规律。", "The lead time is averaged over twelve trajectory pairs. A single pair fluctuates badly: the same initial error from another starting point can give twice the value. Use the averaged column in Table 2."]
  - ["显式格式在库朗数 0.9 时**不炸但也不准**：峰值一路掉。做任务 1 时别只看“炸没炸”这一栏，峰值那一栏同样要记。", "At Courant 0.9 the explicit scheme neither blows up nor stays accurate: the peak keeps falling. In task 1 record the peak, not just whether it blew up."]
思考题:
  - ["把观测加密一倍，初值误差大致能小一半。按本实验量到的增长速度，这能让“还能信多久”多出多少？如果有人说“再加一倍观测就能把预报做到两周”，你用哪个数反驳他？", "Doubling the observing network roughly halves the initial error. Using the growth rate you measured, how much lead time does that add? If someone claims twice the observations would push forecasts to two weeks, which number refutes them?"]
  - ["半拉格朗日格式不受 CFL 约束，可它靠插值。插值会抹平场——这与第 19.2 节“越推越平”是同一件事吗？说出它们的相同点与不同点。", "The semi-Lagrangian scheme escapes CFL by interpolating, and interpolation smooths the field. Is that the same thing as the smoothing in Section 19.2? Give one way they are alike and one way they are not."]
