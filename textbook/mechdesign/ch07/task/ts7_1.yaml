# 工程任务单 TS-7-1（配第 7 章）：用现场数据确定一台 WQR-105 的设计载荷。格式见 textbook/tools/tasksheet.py。
编号: TS-7-1
标题: ["用现场运行数据确定一台 WQR-105 的设计载荷，写载荷说明书", "Determine the design loads of a WQR-105 from field data and write the load specification"]
角色: ["设计部门的载荷工程师", "load engineer, design department"]
背景:
  - "北方矿业 2 号主运皮带上的一台 WQR-105 已经运行了一段时间。客户打算把皮带加长、多运 15% 的矿石，问现在这台减速器还能不能用、还能用多久。设计部门要先回答一个问题：这台减速器实际受的载荷是多少？你作为载荷工程师，从数字工厂的数字孪生里取这台减速器一个月的运行数据和出厂时的跑合试验台记录，做出载荷谱，求名义载荷、最大载荷、起动冲击系数、按轴承（按转数，m = 3）、齿面（按转数，m ≈ 6.6）和按输出轴扭转（按雨流循环，m = 9）的当量载荷，求当量载荷与额定转矩之比，与 ISO 6336-1 的指导值比较，写一份载荷说明书，交给负责强度和寿命的同事（第 11 章、第 29 章、第 34 章会用它）。"
  - "A WQR-105 on the No. 2 main belt of Northern Mining has been running for a while. The customer plans to lengthen the belt and carry 15% more ore, and asks whether the reducer will still do and for how long. Design must first answer: what loads does the reducer actually see? As load engineer, take one month of this unit's operating data from the factory's digital twin plus its run-in bench record, build the load spectrum, find the nominal and maximum loads, the start impact factor, and the equivalent loads for the bearings (per revolution, m = 3), the tooth flanks (per revolution, m ≈ 6.6) and torsion of the output shaft (per rainflow cycle, m = 9), work out their ratio to the rated torque, compare it with the ISO 6336-1 guide values, and write a load specification for the strength and life colleagues (Chapters 11, 29 and 34 will use it)."
输入:
  - {名称: ["这台减速器（老师在班级工厂里指定序列号）最近 30 天的现场运行摘要：运行小时、起动次数、平均与最大转矩、雨流计数、载荷直方图、油温", "The last 30 days of field summaries for this unit (serial number set by the instructor in the class factory): run hours, starts, mean and maximum torque, rainflow counts, load histogram, oil temperature"], 来源: ["老师下发的 30 天运行摘要（JSON，由数字孪生的同一个函数 twin/field.day_summary 按这台的序列号、现场和故障设置生成；数字孪生页还没有导出逐日雨流计数的功能）；数字孪生页看这台的曲线、寿命卡片作对照", "30 days of summaries handed out by the instructor (JSON, generated by the twin's own day_summary with this unit's serial, site and fault settings; the twin page cannot yet export daily rainflow counts); the twin page for curves and life cards as a cross-check"]}
  - {名称: ["同一台减速器出厂时的跑合试验台转矩记录（10 Hz、75 s）", "The run-in bench torque record of the same unit at shipment (10 Hz, 75 s)"], 来源: ["数字工厂“生产”页的试验记录（MES）", "Factory “Production” page test records (MES)"]}
  - {名称: ["程序 7.3.1、7.4.1（雨流计数、当量载荷）；ISO 6336-1 的使用系数指导值（本书数字化表 std/iso6336_ka.yaml，待核对）", "Programs 7.3.1 and 7.4.1 (rainflow, equivalent loads); ISO 6336-1 guide values for the application factor (book table std/iso6336_ka.yaml, to be checked)"], 来源: ["教材第 7 章", "Chapter 7"]}
  - {名称: ["额定输出转矩 350 N·m、设计寿命 20 000 运行小时、输出轴的 S-N 曲线（数字工厂“仿真与分析”的疲劳寿命）", "Rated output torque 350 N·m, design life 20 000 running hours, the output shaft's S-N curve (fatigue life in the factory's “Simulation & analysis”)"], 来源: ["产品规格书；数字工厂", "Product specification; digital factory"]}
交付物:
  - {名称: ["载荷谱计算表：30 天的运行小时、起动次数；按转矩分档的运行小时与转数；雨流循环按幅值分档的次数；外推到 20 000 h 的累积频次", "Load spectrum workbook: run hours and starts over 30 days; hours and revolutions by torque class; rainflow cycles by amplitude class; cumulative frequencies extrapolated to 20 000 h"], 验收: ["数据来源写明（序列号、日期范围）；外推比例和假设写明；雨流结果与跑合试验台记录的计数（自己用程序 7.4.1 算）互相对照", "Data sources stated (serial, date range); extrapolation factor and assumptions stated; rainflow results cross-checked against your own count of the bench record with Program 7.4.1"], 类型: 文件, 格式: [xlsx, pdf]}
  - {名称: ["载荷说明书（2–3 页）：工况描述、名义载荷、最大载荷与起动冲击系数、按轴承和按输出轴的当量载荷、实测使用系数与指导值的比较、皮带加长后的载荷估计、给强度与寿命计算的建议载荷", "Load specification (2–3 pages): duty description, nominal load, maximum load and start impact factor, equivalent loads for bearings and output shaft, measured versus guide application factor, loads after the belt extension, recommended design loads for strength and life calculations"], 验收: ["名义载荷的定义写清；当量载荷的指数 m 与循环的定义（按转数还是按雨流）对应正确；指出哪种失效由哪种载荷决定（静强度看最大值、轴承看 m = 3 当量、轴扭转疲劳看起停循环）；加长后的估计写明假设", "Nominal load defined; exponent m matched to the cycle definition (per revolution or per rainflow cycle); which failure is governed by which load stated (static strength by the maximum, bearings by the m = 3 equivalent, shaft torsional fatigue by the start–stop cycles); assumptions for the extension stated"], 类型: 文件, 格式: [docx, pdf]}
  - {名称: ["计算程序（Python 或计算表公式）", "Calculation program (Python or spreadsheet formulas)"], 验收: ["能复现交付物 1、2 中的数字", "Reproduces the numbers in deliverables 1 and 2"], 类型: 文件, 格式: [zip, txt, xlsx]}
工位: [MES, FAT, PY]
步骤:
  - ["读老师下发的 30 天运行摘要，在数字孪生页找到这台减速器对照；在“生产”页找到它的跑合试验台记录", "Read the 30 days of summaries handed out, and find the unit on the Digital twin page to cross-check; find its run-in bench record on the Production page"]
  - ["用程序 7.4.1 对试验台记录做雨流计数，求起动冲击系数；与现场数据里起停循环的峰值比较", "Rainflow-count the bench record with Program 7.4.1 and find the start impact factor; compare with the start–stop peaks in the field data"]
  - ["按程序 7.3.1 的方法求名义载荷、最大载荷、m = 3 的当量载荷和实测使用系数；把雨流循环外推到 20 000 h，求 m = 9 的当量幅值", "Following Program 7.3.1, find the nominal and maximum loads, the m = 3 equivalent and the measured application factor; extrapolate the rainflow cycles to 20 000 h and find the m = 9 equivalent amplitude"]
  - ["看数字孪生页这台的“输出轴疲劳”和轴承寿命卡片（第 11 章、第 34 章会细讲怎样算，这里只读结果），与你的当量载荷对照", "Read the twin page's “output shaft fatigue” and bearing-life cards for this unit (Chapters 11 and 34 explain the calculation; here just read them) and compare with your equivalent loads"]
  - ["估计皮带加长、载荷增加 15% 后各当量载荷的变化，并用数字孪生页的“假如”分析（负载 115%）看寿命的变化；写载荷说明书，评审后在“我的任务”里提交三份交付物", "Estimate the equivalent loads with 15% more load and use the twin page's what-if analysis (load 115%) for the life; write the specification and submit the three deliverables in My tasks after the review"]
评审要点:
  - ["名义载荷、最大载荷、当量载荷分得清，各自用在哪里说得清", "Nominal, maximum and equivalent loads kept apart, each tied to its use"]
  - ["当量载荷的指数和循环定义对应：轴承按转数 m = 3，轴的扭转按雨流 m = 9；没有把运行时的转数当成扭转循环", "Exponents match cycle definitions: bearings per revolution m = 3, shaft torsion per rainflow m = 9; revolutions not mistaken for torsion cycles"]
  - ["实测使用系数与 ISO 指导值的差别有解释（指导值要覆盖没有测到的过载，实测只代表这段时间）", "Difference between measured and guide application factors explained (guide values cover overloads not measured; measurements cover only this period)"]
  - ["外推与加长后的估计假设写明，结论有余量意识", "Extrapolation and extension assumptions stated, conclusions conscious of margins"]
评分:
  - {项: ["数据与载荷谱", "Data and spectrum"], 分: 30, 标准: ["来源清楚、计数正确、外推合理", "Clear sources, correct counts, sound extrapolation"]}
  - {项: ["载荷量的计算", "Load quantities"], 分: 30, 标准: ["名义、最大、当量载荷与使用系数算对", "Nominal, maximum, equivalent loads and application factor correct"]}
  - {项: ["载荷说明书", "Load specification"], 分: 25, 标准: ["失效与载荷对应清楚，建议可用", "Failures matched to loads, usable recommendations"]}
  - {项: ["程序与答辩", "Program and defense"], 分: 15, 标准: ["能复现、答辩清楚", "Reproducible, clear defense"]}
学时: 4
