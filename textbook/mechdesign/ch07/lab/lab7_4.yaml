# 实验 7.4 的指导书与报告模板。目的、场景、参数、任务取自 lab7_4.js。
原理:
  - ["载荷的“大小”用几个数概括：最大值（管静强度和过载）、平均值（管磨损和发热）、稳定运行的平均值（名义载荷）；轴承寿命要按转数求当量载荷（7.3 节）。起动冲击系数 = 最大值 / 稳定运行的平均值。", "A load's size is summarized by a few numbers: the maximum (static strength and overload), the mean (wear and heat) and the steady-running mean (the nominal load); bearing life needs an equivalent load per revolution (Section 7.3). Start impact factor = maximum / steady-running mean."]
  - ["疲劳看的是循环。雨流计数（ASTM E1049）把不规则的时间历程拆成一个个闭合的循环，每个循环有范围（峰谷差）和平均值；同一段记录里，大循环少、小循环多。", "Fatigue counts cycles. Rainflow counting (ASTM E1049) splits an irregular history into closed cycles, each with a range (peak minus valley) and a mean; a record has few large cycles and many small ones."]
  - 式: ["当量幅值 Sₑ = (Σ nᵢ Sᵢ^m / Σ nᵢ)^(1/m)，Sᵢ = 范围ᵢ / 2", "Equivalent amplitude Sₑ = (Σ nᵢ Sᵢ^m / Σ nᵢ)^(1/m), Sᵢ = rangeᵢ / 2"]
  - ["指数 m 来自 S-N 曲线的斜率：m 越大，大循环的分量越重。轴的扭转疲劳取 m ≈ 9（数字孪生的输出轴），轴承寿命取 3（按转数，不按雨流）。", "m comes from the slope of the S-N curve: the larger m, the more the large cycles weigh. Torsional fatigue of the shaft uses m ≈ 9 (the twin's output shaft); bearing life uses 3 (per revolution, not per rainflow cycle)."]
步骤:
  - ["打开实验 7.4，场景“WQR-105 跑合试验台”，参数取默认（额定 350 N·m、3 次起停、m = 9、记录 1），点“读取记录”（任务 1），把读数填入表 1 第一行。", "Open Lab 7.4, scene “WQR-105 run-in bench”, defaults (350 N·m, 3 start–stops, m = 9, record 1); press Read record (task 1) and fill in the first row of Table 1."]
  - ["把 m 改成 3 再读（任务 2），填表 1 第二行；再把记录编号改成 2、3 各读一次，看起动冲击系数变化多少。", "Change m to 3 and read again (task 2), filling in the second row; then try record numbers 2 and 3 and see how much the start impact factor varies."]
  - ["切换到“码垛机器人的肩关节”，第一个参数是运动时间 × 10（12 即 1.2 s），负载 5 kg、10 kg 各读一次（任务 3），填表 2。", "Switch to “Palletizing robot shoulder”; the first parameter is move time × 10 (12 means 1.2 s); read with 5 kg and 10 kg (task 3) and fill in Table 2."]
  - ["切换到“自行车的曲柄”，第一个参数是踩踏的转矩峰值，取 60 N·m（任务 4），填表 3。", "Switch to “Bicycle crank”; the first parameter is the pedal torque peak; use 60 N·m (task 4) and fill in Table 3."]
  - ["（选做）在自己的电脑上运行程序 7.4.1，换一个序列号读数字工厂的转矩记录，与本实验的结果比较。", "(Optional) Run Program 7.4.1 on your computer with another serial number to read a factory torque record, and compare with this lab."]
