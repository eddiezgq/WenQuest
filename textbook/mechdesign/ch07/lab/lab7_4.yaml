    表头: ["负载 / kg", "最大 / N·m", "静止持重 / N·m", "动载系数", "每个工作循环的大循环数"]
    表头英文: ["Payload / kg", "Max / N·m", "Static holding / N·m", "Dynamic factor", "Large cycles per work cycle"]
    行: [["5", "", "", "", ""], ["10", "", "", "", ""]]
