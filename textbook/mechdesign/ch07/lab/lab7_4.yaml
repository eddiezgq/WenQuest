注意:
  - ["试验台场景与数字工厂的转矩记录同一个模型，但随机数发生器不同，读数与程序 7.2.1、7.4.1 那一条记录不完全一样。", "The bench scene uses the same model as the factory record but a different random generator, so the numbers differ slightly from the record in Programs 7.2.1 and 7.4.1."]
  - ["本实验的当量幅值按全部循环的次数取参考次数，所以比 7.4.3 节（按起停次数取）小；比较时要用同一个参考次数。码垛机器人每个工作循环的“大循环”可能出现半循环（0.5），这是雨流计数在记录两端的规则。", "This lab takes all cycles as the reference number for the equivalent amplitude, so it is smaller than in Section 7.4.3 (which uses the number of start–stops); compare only with the same reference. Large cycles per work cycle of the robot may include halves (0.5), a rule of rainflow counting at the ends of a record."]
  - ["“稳定运行平均”按去掉停机段和起动峰以后的数据算，是本实验的简单约定；工程上要按工况说明书的定义取名义载荷。", "The steady mean excludes the stopped periods and start peaks — a simple convention of this lab; in practice the nominal load follows the definition in the duty specification."]
  - ["机器人场景只算肩关节的重力矩和惯性力矩（集中质量、单关节运动），不计摩擦和其他关节的耦合；自行车场景是示意模型。", "The robot scene includes only gravity and inertia torques at the shoulder (lumped masses, single-joint motion), without friction or coupling; the bicycle scene is a sketch."]
思考题:
  - ["程序 7.4.1 的雨流计数与本实验同一算法。数字孪生的边缘端把每次起停简化成一个 0 → 峰值 → 0 的循环、把运行波动简化成固定幅值的小循环。和本实验逐点计数的结果比，这样简化在什么情况下会出错？", "Program 7.4.1 uses the same rainflow algorithm. The twin's edge device simplifies each start–stop to one 0 → peak → 0 cycle and the running ripple to small cycles of fixed amplitude. Compared with the full count in this lab, when would that simplification go wrong?"]
  - ["负载 10 kg 时，机器人肩关节的力矩最大值和模型的关节力矩限值 150 N·m 比怎样？这说明额定负载是怎样定的？", "With 10 kg, how does the robot's peak shoulder torque compare with the model's joint limit of 150 N·m? What does that say about how the rated payload is set?"]
  - ["码垛机器人的减速器每天要做几万次工作循环，而 WQR-105 每天只起停几次。按表 1、表 2，哪一个更需要按疲劳设计？", "A palletizing robot's reducer does tens of thousands of work cycles a day, a WQR-105 only a few start–stops. From Tables 1 and 2, which needs fatigue design more?"]
