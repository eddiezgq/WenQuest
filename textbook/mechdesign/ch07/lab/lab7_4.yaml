    表头英文: ["m", "Max / N·m", "Mean / N·m", "Steady mean / N·m", "Start impact factor", "Rainflow cycles", "Large cycles", "Equivalent amplitude / N·m"]
    行: [["9", "", "", "", "", "", "", ""], ["3", "", "", "", "", "", "", ""]]
