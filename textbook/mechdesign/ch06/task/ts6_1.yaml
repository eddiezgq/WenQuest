# 工程任务单 TS-6-1（配第 6 章）：按 DFA 重新设计机器人关节后端盖组件。格式见 textbook/tools/tasksheet.py。
编号: TS-6-1
标题: ["按面向装配的设计重新设计机器人关节后端盖组件，减少零件数", "Redesign a robot joint's rear end-cap assembly for assembly and cut its part count"]
角色: ["设计部门的结构工程师", "design engineer, design department"]
背景:
  - "一台小型协作机器人的关节后端盖组件（盖住编码器一端）由 20 个零件组成：铝端盖、O 形圈、6 个 M3 螺钉和 6 个垫圈、2 个定位销、磁铁座和磁铁（给磁编码器用）、电缆密封接头、铭牌。装配线反映这个组件装得慢、螺钉常漏装垫圈；明年产量要从每年 2 000 台关节加到 20 000 台。项目经理要你按布思罗伊德–迪赫斯特方法分析，重新设计，在评审会上说明零件数、装配时间和成本各降了多少，以及代价（模具费、维修是否方便、密封是否可靠）。6.7 节已经给出一种改进方案（5 个零件），你要做出自己的方案，至少在一个方面与它不同，并比较两者。"
  - "The rear end-cap assembly of a small cobot joint (covering the encoder end) has 20 parts: aluminum cap, O-ring, six M3 screws and six washers, two dowel pins, a magnet holder and a magnet (for the magnetic encoder), a cable gland and a label. The line reports it is slow to assemble and washers are often missed; next year's volume rises from 2 000 to 20 000 joints a year. The project manager asks you to analyze it with the Boothroyd–Dewhurst method, redesign it, and show at the review how much part count, assembly time and cost drop — and at what price (tooling, serviceability, sealing). Section 6.7 gives one redesign (5 parts); make your own that differs from it in at least one respect, and compare the two."
输入:
  - {名称: ["原设计（项目任务书附的结构简图，本书设定）：铝端盖外径 Ø90、厚 4 mm，止口 Ø80；6 个 M3 螺钉均布在 Ø84 圆上；O 形圈 Ø76 × 2（装在壳体端面槽里）；2 个 Ø3 定位销；磁铁 Ø6 × 2.5 粘在磁铁座上、磁铁座压在电机轴端；电缆从盖上的 M12 电缆密封接头穿出；铭牌贴在盖外面。装配顺序：磁铁座（已粘磁铁）压到轴端 → O 形圈 → 定位销 → 端盖 → 垫圈与螺钉 → 电缆密封接头 → 铭牌", "Original design (sketch attached to the brief, set by this book): aluminum cap Ø90 × 4 mm with a Ø80 spigot; six M3 screws on a Ø84 circle; O-ring Ø76 × 2 (in a groove in the housing face); two Ø3 dowels; a Ø6 × 2.5 magnet bonded to its holder, pressed onto the motor shaft end; cable out through an M12 gland on the cap; label on the outside. Order: magnet holder → O-ring → dowels → cap → washers and screws → gland → label"], 来源: ["教材 6.7 节（算例 6.7.1）；项目任务书", "Section 6.7 (Example 6.7.1); project brief"]}
  - {名称: ["关节的约束：端盖外径不变；编码器读头到磁铁的间隙 1.0 ± 0.2 mm（读头装在端盖内侧，磁铁到壳体端面的距离由轴系决定，取 3.5 ± 0.1 mm）；防护等级 IP54；编码器要能在维修时拆下检查", "Joint constraints: cap OD unchanged; read-head to magnet gap 1.0 ± 0.2 mm (head mounted inside the cap; magnet to housing face 3.5 ± 0.1 mm, set by the shaft); IP54; the encoder must come out for service"], 来源: ["项目任务书", "Project brief"]}
  - {名称: ["布思罗伊德–迪赫斯特手工装配时间表（拿取、插入时间）；三个问题判定最少零件数；6.7 节程序 6.7.1", "Boothroyd–Dewhurst manual handling and insertion tables; the three questions for the theoretical minimum; Program 6.7.1"], 来源: ["教材 6.7 节；[BDK] 手册", "Section 6.7; [BDK] handbook"]}
  - {名称: ["装配工位费率（数字工厂 ASM-01）；注塑、压铸、数控加工的单件与模具费用按 6.4、6.8 节的模型或老师给的报价（教学示意值，美元）", "Assembly rate (factory ASM-01); molding, die-casting and machining costs from the models of Sections 6.4 and 6.8 or the instructor's quotes (teaching values, USD)"], 来源: ["数字工厂主数据（ERP 工位费率）；教材 6.4、6.8 节", "Factory master data (ERP work-center rates); Sections 6.4 and 6.8"]}
交付物:
  - {名称: ["DFA 分析表（原设计、6.7 节方案、你的方案三列）：每个零件的数量、三个问题的回答、拿取与插入时间、合计时间、理论最少零件数、装配设计效率", "DFA worksheets (original, Section 6.7 redesign, yours): quantity, answers to the three questions, handling and insertion times, total time, theoretical minimum and design efficiency for every part"], 验收: ["三个问题逐个零件回答并写理由；时间取值写明出处与类别（[BDK] 原表，或程序 6.7.1 的 TIMES 类别表）；合计与效率计算正确；原设计的总时间与程序 6.7.1 相差不超过 10%", "Three questions answered with a reason for every part; each time traced to its source and category; totals and efficiency correct; the original within 10% of Program 6.7.1"], 类型: 文件, 格式: [xlsx, pdf]}
  - {名称: ["改进设计的三维模型（或装配草图）：端盖、密封、固定方式、磁铁的装法，关键尺寸标出", "3D model (or an assembly sketch) of the redesign: cap, seal, retention, how the magnet is fitted, key dimensions shown"], 验收: ["零件数不超过原设计的一半；卡扣或其他固定方式标出关键尺寸（悬臂长、厚、卡合量），并按允许应变核一遍；O 形圈槽尺寸写明出处（GB/T 3452.3 或供应商）；磁铁间隙按第 4 章的极值法核一遍", "No more than half the original parts; snap fits or other retention dimensioned (beam length, thickness, undercut) and checked against allowable strain; O-ring groove dimensions cited (ISO 3601-2 or supplier); magnet gap checked by the worst-case method of Chapter 4"], 类型: 文件, 格式: [step, pdf]}
  - {名称: ["评审说明（2 页）：零件数、装配时间、年装配人工费的比较；模具费与回收批量；维修、密封、可靠性的代价；新增或取消的物料（BOM 前后对照表，按 ERP 的 BOM 格式）", "Review note (2 pages): part count, assembly time and annual assembly cost compared; tooling cost and payback volume; costs in service, sealing and reliability; items added or removed (BOM before and after, in the ERP BOM format)"], 验收: ["装配费用按数字工厂装配工位费率和年产量算；模具费的回收批量按 6.8 节方法算并写明假设；至少讨论两个代价；BOM 对照完整", "Labor from the assembly rate and annual volume; tooling payback by the method of Section 6.8 with assumptions stated; at least two costs discussed; BOM comparison complete"], 类型: 文件, 格式: [docx, pdf]}
工位: [CAD, ERP]
步骤:
  - ["按 6.7 节的方法分析原设计：逐个零件回答三个问题，查拿取、插入时间，算总时间和装配设计效率；与程序 6.7.1 的结果核对", "Analyze the original with the Section 6.7 method: answer the three questions for each part, look up handling and insertion times, compute total time and efficiency; check against Program 6.7.1"]
  - ["找出“非必需”零件中耗时最多的（紧固件、定位销、密封接头、铭牌），对每一个想至少一种取消或合并的办法（卡扣、止口、一体成形、激光打标、供应商预装）", "Among non-essential parts, find the most time-consuming (fasteners, dowels, gland, label) and think of at least one way to remove or merge each (snap fit, spigot, integral molding, laser marking, supplier sub-assembly)"]
  - ["定工艺：端盖改用注塑、压铸还是继续机加工？按 6.4、6.8 节估算单件和模具费用，算年产 2 000 和 20 000 时哪种划算；塑料盖失去了铝盖的电磁屏蔽和散热，说明怎样处理", "Choose the process: molded, die-cast or still machined? Estimate part and tooling cost with Sections 6.4 and 6.8 for 2 000 and 20 000 a year; a plastic cap loses the shielding and heat path of the aluminum one — say how you handle it"]
  - ["在 CAD 里建改进设计的模型（或画装配草图）；在 ERP 里查装配工位费率，按 ERP 的 BOM 格式写出前后对照（这个组件不在数字工厂的物料表里，不必在 ERP 里新建）", "Model the redesign in CAD (or sketch the assembly); look up the assembly rate in ERP and write the BOM before and after in the ERP format (this assembly is not in the factory item list; no need to create it in ERP)"]
  - ["对改进设计再做一遍 DFA 分析，写评审说明；评审会答辩；评审后把三份交付物在“我的任务”里提交", "Repeat the DFA analysis on your redesign and write the review note; defend it at the review; submit the three deliverables in My tasks afterwards"]
评审要点:
  - ["三个问题回答有理由，不是凭“看起来能省”就删零件；被删掉的功能（定位、密封、拆卸、标识）有去处", "Three questions answered with reasons, not deleting parts because it looks possible; every function removed (location, sealing, removal, identification) is taken over by something"]
  - ["维修要求满足：编码器能拆下检查，卡扣能拆几次、是否要专用工具写清楚", "Service requirement met: the encoder can come out; how many times the snap fit can be undone and whether a tool is needed is stated"]
  - ["成本比较完整：装配人工费、零件费、模具费都算到，回收批量与年产量对照", "Complete cost comparison: assembly labor, part cost and tooling, payback against annual volume"]
  - ["与 6.7 节方案的比较诚实：自己的方案哪方面更好、哪方面更差", "Honest comparison with the Section 6.7 redesign: where yours is better and where worse"]
评分:
  - {项: ["DFA 分析", "DFA analysis"], 分: 30, 标准: ["三列分析完整、取值有出处、计算正确", "Three complete worksheets, cited values, correct arithmetic"]}
  - {项: ["改进设计", "Redesign"], 分: 30, 标准: ["零件数不超过一半、功能都有去处、关键尺寸核过", "At most half the parts, all functions kept, key dimensions checked"]}
  - {项: ["成本与工艺", "Cost and process"], 分: 20, 标准: ["工艺选择有依据、回收批量算对", "Process choice justified, payback correct"]}
  - {项: ["评审说明与答辩", "Review note and defense"], 分: 20, 标准: ["代价说清、比较诚实、BOM 对照完整", "Costs stated, honest comparison, BOM comparison complete"]}
学时: 4
