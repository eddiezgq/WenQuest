注意:
  - ["铣削费率默认取数字工厂立式加工中心 VMC-01；激光切割、折弯、打印费率，材料单价，切削参数和辅助时间都是本书设定的教学值（美元示意）。实际报价要问加工厂。", "The milling rate defaults to the factory's VMC-01; laser, brake and printer rates, material prices, cutting data and handling times are teaching values (USD). Ask the shop for real quotes."]
  - ["三种做法的零件不完全一样：铣削件壁厚 4 mm，钣金件 2 mm，打印件 3 mm（PA12 刚度低）。它们的刚度、强度要另外核算（第 5 章选材、第 10 章以后的强度计算）。", "The three parts differ: 4 mm walls milled, 2 mm sheet, 3 mm printed (PA12 is less stiff). Their stiffness and strength must be checked separately."]
  - ["置物架场景的钣金按激光切割加折弯算；商店里的托架是冲压的，要先做模具，单价才能降到几美分——这是第四种做法，实验里没有。", "The shelf scene costs sheet metal by laser cutting and bending; shop brackets are stamped with a die, which brings the price down to cents — a fourth process the lab leaves out."]
思考题:
  - ["程序 6.8.1 和这个实验用同一套模型。模型里没有排队、运输、检验和返工的时间，实际交货期会长得多——哪种做法的“不在模型里的时间”最长？", "Program 6.8.1 and this lab share one model. It leaves out queueing, shipping, inspection and rework, so real lead times are much longer — which process has the most time outside the model?"]
  - ["铣削件的材料利用率只有百分之十几（程序 6.8.1）。如果改成从 L 形铝型材上截一段再铣孔，成本模型里哪几项会变？", "The milled bracket uses only about an eighth of its block (Program 6.8.1). If it were cut from an L-section extrusion and only drilled, which terms of the model would change?"]
