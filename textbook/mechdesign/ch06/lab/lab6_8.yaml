# 实验 6.8 的指导书与报告模板。目的、场景、参数、任务取自 lab6_8.js。
原理:
  - ["单件成本 = 材料费 + 单件加工时间 × 费率 + （每批的准备时间 + 一次性的编程时间）× 费率 ÷ 批量。前两项随批量不变，第三项摊到每件上，批量越大越小。", "Cost per part = material + run time × rate + (batch set-up + one-off programming) × rate ÷ batch size. The first two do not change with batch size; the third is shared and shrinks as the batch grows."]
  - 式: "C(q) = C_mat + t_run·R + (t_setup + t_prog)·R / q"
  - ["哪种做法便宜，取决于“固定的一次性费用”和“每件的变动费用”谁大：3D 打印几乎没有准备，单件贵；铣削准备和编程长、材料浪费多；钣金准备不多、每件很快。两条成本线的交点就是盈亏平衡批量。", "Which process wins depends on the fixed one-off cost versus the variable cost per part: printing has almost no set-up but a high cost per part; milling has long set-up and programming and wastes material; sheet metal has little set-up and is fast per part. Where two cost lines cross is the break-even batch."]
步骤:
  - ["打开实验 6.8，场景“XM540 舵机支架”，参数取默认（批量 1、加工中心 62 美元/小时），点“计算”（任务 1），把三种做法的单件成本、一批的工时、零件质量填入表 1 的第一行。", "Open Lab 6.8, scene “XM540 servo bracket”, defaults (batch 1, 62 USD/h); press Compute (task 1) and enter cost per part, batch hours and mass for the three processes in the first row of Table 1."]
  - ["把批量依次改为 5、20、200 再计算（任务 2 是 200），填表 1 的其余各行；记下读数“钣金比打印便宜的最小批量”。", "Set the batch to 5, 20 and 200 and compute each time (task 2 is 200); fill in Table 1 and note the readout “smallest batch where sheet beats print”."]
  - ["把打印机费率改为 10 美元/小时（自己的打印机，只算电费和折旧），批量 1 和 20 各算一次（任务 3），填表 2。", "Set the printer rate to 10 USD/h (your own printer: power and depreciation only), compute for 1 and 20 parts (task 3) and fill in Table 2."]
  - ["切换到“墙上的置物架托架”，批量 2（任务 4），填表 3；再把批量改成 1000，看看钣金的单价。", "Switch to “Wall-shelf bracket”, batch 2 (task 4), fill in Table 3; then try 1000 and look at the sheet-metal price."]
  - ["（选做）在自己的电脑上运行程序 6.8.1，把加工中心费率改成自己学校或附近工厂的费率，看盈亏平衡批量怎样变。", "(Optional) Run Program 6.8.1 on your computer with the machining rate of your school or a local shop and see how the break-even batch moves."]
