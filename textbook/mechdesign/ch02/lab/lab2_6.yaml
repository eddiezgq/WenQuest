# 实验 2.6 的指导书与报告模板。目的、场景、参数、任务取自 lab2_6.js。
原理:
  - ["WQR-105 的两级中心距（96 mm、135 mm）和模数（2、3）不变，第一级齿数和保持 96、第二级保持 90，换不同的齿数组合，就得到 16 种传动比——箱体、轴承、轴都不用改，这就是参数化产品族。",
     "WQR-105 keeps its two centre distances (96 mm, 135 mm) and modules (2, 3); with tooth sums of 96 and 90 held, different tooth counts give 16 ratios — housing, bearings and shafts unchanged. That is a parametric product family."]
  - ["选型时按客户的输入功率 P、转速 n₁ 和工况系数 KA 核对三项：", "Selection checks three things from the customer's input power P, speed n₁ and application factor KA:"]
  - 式: "输出转矩 T₂ = 9550·P/n₂·η·KA ≤ 350 N·m；n₂ = n₁/i；η = 0.97² × 0.99³"
  - 式: "轴承寿命 L10h = (C/F)³·10⁶/(60 n₂) ≥ 要求寿命；C = 25.5 kN（6207），F = 齿轮力的一半"
  - 式: "平键挤压应力 σp = 4T₂/(d·h·(l − b)) ≤ 135 MPa；键 12 × 8 × 45，d = 40 mm"
  - ["转矩和平键的利用率（实际 / 允许）都不大于 1 才可用；轴承寿命不足或输入 2900 r/min 时给出警告。算式和判定规则与数字工厂参数配置器相同。", "A variant is acceptable only if the torque and key utilisations (actual / allowed) are at most 1; short bearing life or a 2900 r/min input gives a warning. Formulas and verdict rule are the digital-factory configurator's."]
步骤:
  - ["打开实验 2.6，场景“码垛工位输送线”。按默认的标准型（序号 13，i = 10.5）、4 kW、1450 r/min、KA = 1.25、10 000 h 核对一次（任务 1），把输出转矩、轴承寿命、键的应力和三项利用率填入表 1。",
     "Open Lab 2.6, scene “Palletising-cell conveyor”. Check the standard variant (number 13, i = 10.5) at 4 kW, 1450 r/min, KA = 1.25, 10 000 h (task 1); enter output torque, bearing life, key stress and the three utilisations in Table 1."]
  - ["把功率改为 3 kW，逐个试传动比，找出输出转速在 90–110 r/min 之间、并且可用的型号（任务 2），填入表 1。", "Set 3 kW and try the ratios to find a variant with an output speed of 90–110 r/min that is acceptable (task 2); enter it in Table 1."]
  - ["保持 3 kW，把输入转速改为 2900 r/min、750 r/min 各一次，观察哪一项利用率变化最大。", "Keep 3 kW and try 2900 r/min and 750 r/min input; see which utilisation changes most."]
  - ["切换到“车库门开门机”，KA = 2.0、最大传动比（序号 16），逐步加大功率，找出能配的最大电机功率（任务 3），填入表 2。", "Switch to “Garage-door opener”, KA = 2.0, largest ratio (number 16); raise the power to find the largest motor it can take (task 3); enter it in Table 2."]
数据表:
  - 标题: ["表 1  码垛工位输送线选型", "Table 1  Palletising-cell conveyor"]
    表头: ["型号（i）", "P / kW", "n₂ / (r/min)", "T₂·KA / N·m", "L10h / h", "σp / MPa", "利用率：转矩 / 键 / 寿命", "可用？"]
    表头英文: ["Variant (i)", "P / kW", "n₂ / (r/min)", "T₂·KA / N·m", "L10h / h", "σp / MPa", "Utilisation: torque / key / life", "OK?"]
    行: [["10.5", "4", "", "", "", "", "", ""], ["", "3", "", "", "", "", "", ""]]
  - 标题: ["表 2  车库门开门机（KA = 2.0）", "Table 2  Garage-door opener (KA = 2.0)"]
    表头: ["i", "最大功率 / kW", "此时 T₂·KA / N·m", "先卡住的约束"]
    表头英文: ["i", "Max power / kW", "T₂·KA there / N·m", "Binding constraint"]
    行: [["14.29", "", "", ""]]
注意:
  - ["工况系数 KA 把冲击“打包”进转矩里，取多大要看工作机，第 29 章给出表格。", "The application factor KA packs shock into the torque; Chapter 29 tabulates its values."]
  - ["这里的轴承寿命只算了输出轴，并假设齿轮在两轴承中间；配置器的完整算法见数字工厂“参数配置器”页。", "Bearing life here is for the output shaft only, with the gear midway between the bearings; the full algorithm is on the factory's configurator page."]
思考题:
  - ["为什么整个产品族都是“额定转矩”先卡住，而轴承寿命在这里几乎不会不够？要让大传动比的型号传更大的功率，该改哪个零件？", "Why does the rated torque always bind first, while bearing life is hardly ever short here? To let the high-ratio variants carry more power, which part would you change?"]
  - ["产品族的好处是箱体、轴承、轴都通用。它的代价是什么？", "A family shares housing, bearings and shafts. What does that cost?"]
