  - 标题: ["表 2  轴承宽度的分散对合格率的影响（公差 × 1，不补偿）", "Table 2  Effect of bearing width scatter (tolerances × 1, no compensation)"]
    表头: ["轴承宽度标准差 / mm", "抽样标准差 / mm", "合格率 / %"]
