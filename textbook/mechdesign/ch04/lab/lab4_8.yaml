注意:
  - ["箱体两端面距离 W = 152 mm、端盖止口长度是本书设定的（数字工厂的箱体还没有这几个尺寸）；其余尺寸取 SH-301 B 版与 6207 的标准公差。", "The housing width W = 152 mm and the cap spigot lengths were set by this book (the factory housing does not define them yet); the rest come from SH-301 rev. B and the 6207 standard tolerances."]
  - ["深沟球轴承本身还有轴向游隙，这里没有计入；轴承内外圈宽度按同一公差处理。", "The internal axial clearance of the ball bearings is ignored here; inner and outer ring widths take the same tolerance."]
  - ["抽样用固定的随机数种子，同样的参数每次结果相同；改种子（程序 4.8.1 里）结果会有零点几个百分点的变化。", "Sampling uses a fixed seed, so the same settings give the same result; another seed (in Program 4.8.1) changes the yield by a few tenths of a percent."]
思考题:
  - ["两个轴承宽度的公差之和（0.24 mm）已经超过要求的游隙范围（0.2 mm）。这时再收紧箱体、套筒的公差还有没有用？除了垫片，还有哪些办法？", "The two bearing-width tolerances (0.24 mm) already exceed the allowed play range (0.2 mm). Does tightening the housing and sleeve still help? Besides shims, what else can be done?"]
  - ["蒙特卡洛的合格率比方和根法算的低，原因在哪里？什么时候方和根法会偏于危险？", "The Monte Carlo yield is lower than RSS predicts. Why? When is RSS on the unsafe side?"]
