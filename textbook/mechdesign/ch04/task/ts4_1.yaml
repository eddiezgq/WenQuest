# 工程任务单 TS-4-1（配第 4 章）：读三坐标数据，判定一批 SH-301 并处置不合格品。格式见 textbook/tools/tasksheet.py。
编号: TS-4-1
标题: ["读三坐标数据，判定一批 SH-301 并处置不合格品", "Read CMM data, judge a batch of SH-301 and disposition the nonconforming parts"]
角色: ["质量部的质量工程师", "quality engineer, quality department"]
背景:
  - "班级工厂的磨床这周磨了一批 WQR-105 输出轴 SH-301，每根都上三坐标测了 6 项（左、右轴承位 Ø35 k6，齿轮位，键槽宽 12 N9，轴承位对 A–B 的径向圆跳动，键槽对称度）。车间主任说最近“有几根轴承位偏大”，装配线要这批轴，问能不能放行。你作为质量工程师，要读数据、算过程能力、按测量不确定度判定每根轴，给每张不合格品单定处置（返修、报废或让步接收）并写理由；再从数据里找出原因，开质量异常单，提出纠正措施并验证。老师事先在班级工厂里注入了一个工艺问题（你不知道是哪一个）。"
  - "This week the class factory's grinder made a batch of WQR-105 output shafts SH-301; each was measured on the CMM for 6 characteristics (left and right bearing seats Ø35 k6, gear seat, keyway width 12 N9, radial run-out of the bearing seats to A–B, keyway symmetry). The shop foreman says “a few bearing seats are on the big side lately”, and assembly wants the batch: can it be released? As quality engineer you read the data, compute capability, judge each shaft allowing for measurement uncertainty, decide each nonconformance report (rework, scrap or use as is) with reasons, then find the cause in the data, open a quality problem report, propose a corrective action and verify it. The instructor has injected one process problem into the class factory beforehand (you are not told which)."
输入:
  - {名称: ["这批 SH-301 的三坐标检验记录与控制图", "CMM records and control charts for the batch"], 来源: ["数字工厂“质量”页（班级工厂）", "Digital factory, Quality page (class factory)"]}
  - {名称: ["判定用的公差（数字工厂检验模板）：轴承位 Ø35 k6（35.002–35.018）、键槽宽 12 N9、两轴承位对 A–B 的径向圆跳动 0.012、键槽对称度 0.020；齿轮位模板仍是 A 版的 Ø40 k6——B 版图纸改为 r6，检验模板要随工程更改修改（TS-33-1），本任务按模板判定，报告里写明这一点。图纸上对 A–B 的 0.015 管的是齿轮位、密封段和外伸段，模板里的 0.012 管的是两个轴承位本身", "Tolerances for the decision (factory inspection template): bearing seats Ø35 k6 (35.002–35.018), keyway 12 N9, run-out of the two bearing seats to A–B 0.012, keyway symmetry 0.020; the gear seat in the template is still rev. A Ø40 k6 — the rev. B drawing has r6 and the template must follow the change order (TS-33-1); judge by the template here and say so in the report. The drawing's 0.015 to A–B applies to the gear seat, seal journal and extension; the template's 0.012 applies to the two bearing seats themselves"], 来源: ["数字工厂检验模板；零件图（第 3、33 章）", "Factory inspection template; part drawing (Chapters 3, 33)"]}
  - {名称: ["三坐标测量机的规格 MPE_E0 = (1.8 + L/300) μm；重复性 0.5 μm（本书设定）", "CMM specification MPE_E0 = (1.8 + L/300) μm; repeatability 0.5 μm (set by this book)"], 来源: ["教材 4.9 节", "Section 4.9"]}
  - {名称: ["教材程序 4.9.1（过程能力与带不确定度的判定）、数字工厂质量模块 hub/spc.py", "Program 4.9.1 (capability and decision with uncertainty), factory quality module hub/spc.py"], 来源: ["教材第 4 章；数字工厂", "Chapter 4; digital factory"]}
交付物:
  - {名称: ["批次检验判定报告（每个特性的均值、标准差、Cp、Cpk / Ppk，控制图判异结果；每根轴的判定：合格、不合格、在不确定区内）", "Batch inspection report (mean, s.d., Cp, Cpk / Ppk and control-chart findings for every characteristic; a verdict for every shaft: conforming, nonconforming, or in the uncertainty zone)"], 验收: ["数据取自班级工厂，件数、特性齐全；过程能力算法写明（组内 σ 怎样估计、单边特性用 Cpu）；测量不确定度有预算表（至少三个分量）并按 ISO 14253-1 判定；结论明确：能否放行、哪些要处置", "Data from the class factory, all parts and characteristics; method stated (how within-group σ is estimated, Cpu for one-sided characteristics); uncertainty budget with at least three components and decisions to ISO 14253-1; a clear conclusion: release or not, which parts need disposition"], 类型: 文件, 格式: [docx, pdf, xlsx]}
  - {名称: ["不合格品处置记录（每张不合格品单的处置与理由，截图或导出）", "Nonconformance dispositions (decision and reason for every report; screenshots or export)"], 验收: ["每张单都有处置；理由能说清：返修能否修好（轴承位偏大可以再磨，偏小不能）、让步接收对装配和寿命的影响、谁批准", "Every report decided; reasons say whether rework can fix it (an oversize seat can be reground, an undersize one cannot), what use-as-is means for assembly and life, and who approves"], 类型: 文件, 格式: [docx, pdf]}
  - {名称: ["质量异常单（8D）：原因分析、纠正措施、验证结果", "Quality problem report (8D): root cause, corrective action, verification"], 验收: ["从数据特征（哪个特性、怎样变化）推出原因，不靠猜；措施对症，经老师批准后车间再做至少 10 件，用“验证”比较措施前后的数据。数字工厂判为有效的（全部合格、Cpk ≥ 1.33，跳动和对称度按单边 Cpu），写明结果并关闭；判为无效的，分析是措施不对症，还是正常工艺本身能力不足（如轴承位每个修整周期末偏大，见 4.9.3 节），写进 D7 并提出改进；D7 写明改了哪些工艺文件、加了什么防错", "Cause inferred from the data pattern (which characteristic, how it changes), not guessed; the action fits the cause; after approval the shop makes at least 10 more parts and Verify compares before and after. If the factory rates it effective (all conforming, Cpk ≥ 1.33, one-sided Cpu for run-out and symmetry), report and close; if not, analyse whether the action missed the cause or the normal process itself lacks capability (e.g. bearing seats oversize at the end of each dressing cycle, Section 4.9.3), and put it in D7 with an improvement; D7 lists the process documents changed and the error-proofing added"], 类型: 文件, 格式: [docx, pdf]}
工位: [QMS, SPC, MES]
步骤:
  - ["在班级工厂“质量”页调出这批 SH-301 的六项检验记录和控制图；页面每个特性显示最近 60 件，批次做完就及时抄录或截图（4.9 节）", "Open the batch's six characteristics and control charts on the class factory's Quality page; it shows the latest 60 parts per characteristic, so copy or screenshot the data as soon as the batch is done (Section 4.9)"]
  - ["算每个特性的过程能力；看控制图的判异结果和数据随序号的变化（逐件上移？突然跳动？分散变大？）", "Compute capability for each characteristic; read the control-chart signals and how the data change with part number (steady rise? sudden jump? wider scatter?)"]
  - ["做测量不确定度预算，按 ISO 14253-1 判定每根轴；在不确定区内的轴写明怎样处理（复测、换更准的量具或与客户约定）", "Build the uncertainty budget and judge each shaft to ISO 14253-1; say what to do with shafts in the uncertainty zone (re-measure, a better gauge, or agree with the customer)"]
  - ["对每张不合格品单选处置并写理由（4.2、4.3 节：偏大的轴承位还能磨，偏小的过盈不够）。一张单只记这根轴第一个超差的特性，处置前先看这根轴的全部特性", "Decide every nonconformance report with a reason (Sections 4.2, 4.3: an oversize seat can be reground, an undersize one lacks interference). A report records only the shaft's first failing characteristic, so check all its characteristics before deciding"]
  - ["开质量异常单，按 8D 填写：从数据推原因，D5 选纠正措施并说明理由，提交老师批准", "Open a quality problem report and fill in the 8D: infer the cause from the data, choose the action in D5 with reasons, submit for approval"]
  - ["措施下发后等车间再做至少 10 件，点“验证”，写 D7、D8；验证有效就关闭异常单，无效就分析原因（见交付物 3 的验收）；把三份交付物在“我的任务”里提交", "After the action is issued, wait for at least 10 more parts, press Verify, write D7 and D8; close the report if effective, otherwise analyse why (see deliverable 3); submit the three deliverables in My tasks"]
评审要点:
  - ["过程能力算对了：区分组内 σ（Cp、Cpk）与总 σ（Pp、Ppk），单边特性没有用双边公式", "Capability is right: within σ (Cp, Cpk) versus overall σ (Pp, Ppk); no two-sided formula on a one-sided characteristic"]
  - ["判定考虑了测量不确定度：接收区、拒收区、不确定区说清楚，结论与之一致", "Decisions account for uncertainty: acceptance, rejection and uncertainty zones are clear and the verdicts match"]
  - ["处置有工程理由，不是一律报废或一律放行", "Dispositions have engineering reasons — not scrap-everything or release-everything"]
  - ["原因由数据推出，措施对症并经数据验证", "The cause comes from the data; the action fits and is verified by data"]
评分:
  - {项: ["数据分析与过程能力", "Data analysis and capability"], 分: 30, 标准: ["计算正确，判异与趋势读得准", "Correct calculations; signals and trends read correctly"]}
  - {项: ["带不确定度的判定", "Decisions with uncertainty"], 分: 20, 标准: ["预算合理，判定规则正确", "Sound budget, correct decision rule"]}
  - {项: ["不合格品处置", "Dispositions"], 分: 20, 标准: ["每张都有处置，理由充分", "Every report decided with good reasons"]}
  - {项: ["8D 与验证", "8D and verification"], 分: 30, 标准: ["原因对、措施对症、验证结果分析到位、D7 完整", "Right cause, fitting action, sound analysis of the verification, complete D7"]}
学时: 4
