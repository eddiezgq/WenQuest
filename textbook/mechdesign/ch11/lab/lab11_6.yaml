注意:
  - ["WQ-CR5 场景的两档取自程序 11.6.1（临界平面上的正应力、最大的两个循环）；WQR-105 场景是名义应力，不计键槽的应力集中（11.7 节按局部应变另算）；回形针钢丝的 σ₋₁ 是示意值。", "The WQ-CR5 levels come from Program 11.6.1 (normal stress on the critical plane, the two largest cycles); the WQR-105 scene uses nominal stress without the keyseat concentration (Section 11.7 treats it by local strain); the wire's σ₋₁ is illustrative."]
  - ["表面系数 β 固定为“精车” 0.85（数字工厂疲劳程序里钢的典型值；网页默认是“磨削” 0.92），尺寸系数固定为 0.85；S–N 曲线在 N_D 以后按海巴赫修正。", "The surface factor is fixed at fine-turned 0.85 (the factory program's typical steel value; the page defaults to ground, 0.92) and the size factor at 0.85; the S–N curve continues past N_D with the Haibach slope."]
  - ["σa,eq ≥ R_m 时 S–N 曲线没有意义，实验直接提示改用应变–寿命法。", "When σa,eq ≥ R_m the S–N curve has no meaning; the lab says to use strain–life instead."]
思考题:
  - ["迈因纳法则把每个循环的损伤简单相加，不管先后顺序；而 S–N 曲线的斜率 k = 8–9，应力幅大 10%，损伤就大一倍多——所以载荷谱的“头”（少数大循环）几乎决定了寿命，测载荷时最要紧的是别漏掉大的。海巴赫修正让低于 S_D 的小循环也有一点损伤；什么时候它要紧，什么时候不要紧？", "Miner's rule just adds the damage of each cycle, ignoring order; with an S–N slope k = 8–9, a 10% larger amplitude more than doubles the damage — so the 'head' of the spectrum (the few big cycles) nearly decides the life, and a load measurement must not miss the big ones. Haibach gives a little damage to cycles below S_D: when does that matter and when not?"]
  - ["数字工厂的疲劳程序用 |σm| 做古德曼修正，受压的平均应力也被当作有害。WQ-CR5 大臂的平均应力是重力造成的，它在哪些点受拉、哪些点受压？这样做偏保守还是偏危险？", "The factory program applies Goodman with |σm|, treating compressive means as harmful too. Where on the WQ-CR5 arm is the gravity-induced mean tensile and where compressive? Is this conservative or not?"]
