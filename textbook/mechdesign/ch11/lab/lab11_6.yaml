# 实验 11.6 的指导书与报告模板。目的、场景、参数、任务取自 lab11_6.js。
原理:
  - ["一个载荷块里的循环按幅值分档（实验里两档）：第 i 档应力幅 σa,i、平均应力 σm,i、每块 n_i 次。先做平均应力修正，换成对称循环的等效应力幅 σa,eq，再查 S–N 曲线得到 N_i，迈因纳法则把损伤相加。", "The cycles in a load block are grouped by amplitude (two levels in the lab): level i has amplitude σa,i, mean σm,i and n_i cycles per block. A mean-stress correction turns each into an equivalent fully reversed amplitude σa,eq; the S–N curve gives N_i, and Miner's rule adds the damage."]
  - 式: ["古德曼 σa,eq = σa/(1 − |σm|/R_m)；格伯 σa/(1 − (σm/R_m)²)；SWT √(σmax·σa)", "Goodman σa,eq = σa/(1 − |σm|/R_m); Gerber σa/(1 − (σm/R_m)²); SWT √(σmax·σa)"]
  - 式: ["S–N：S_D = σ₋₁·β·ε；N = N_D (S_D/σa,eq)^k（σa,eq ≥ S_D），海巴赫 N = N_D (S_D/σa,eq)^(2k−1)（σa,eq < S_D）", "S–N: S_D = σ₋₁·β·ε; N = N_D (S_D/σa,eq)^k (σa,eq ≥ S_D); Haibach N = N_D (S_D/σa,eq)^(2k−1) (σa,eq < S_D)"]
  - 式: ["迈因纳：每块损伤 D = Σ n_i/N_i，寿命 = 1/D 块", "Miner: damage per block D = Σ n_i/N_i, life = 1/D blocks"]
  - ["数字工厂“仿真与分析”的“疲劳寿命”用的是同一组公式（古德曼、海巴赫修正，cae/fatigue.py，程序 11.10.1）。", "The factory's Simulation & analysis fatigue-life page uses the same formulas (Goodman, Haibach; cae/fatigue.py, Program 11.10.1)."]
步骤:
  - ["打开实验 11.6，场景“WQ-CR5 大臂根部内角”，保持初值（与程序 11.6.1 相同），点“计算”（任务 1），把各档的 σa,eq、N、损伤和整块的寿命填入表 1。", "Open Lab 11.6, scene “WQ-CR5 arm root corner”, keep the initial values (as in Program 11.6.1), press Compute (task 1) and fill in Table 1."]
  - ["把载荷系数 λ 逐步加大，找出寿命等于 1.5 × 10⁷ 块（5 年两班）的 λ（任务 2），填表 2。", "Raise the load factor λ until the life is 1.5 × 10⁷ blocks (5 years of two shifts) (task 2) and fill in Table 2."]
  - ["切换到“WQR-105 矿山现场”（任务 3），按古德曼、格伯、SWT 各算一次，填表 3，算卡料日占的损伤比例。", "Switch to “WQR-105 at the mine” (task 3), compute with Goodman, Gerber and SWT, fill in Table 3, and find the share of damage from the jam days."]
  - ["切换到“反复弯折回形针”（任务 4），记下程序给出的结论，与程序 11.7.1 的应变–寿命结果比较。", "Switch to “Bending a paper clip” (task 4), note what the lab says, and compare with the strain–life result of Program 11.7.1."]
