# 实验 10.2 的指导书与报告模板。目的、场景、参数、任务取自 lab10_2.js。
原理:
  - ["平面应力的一点（σ2 = 0）：主应力 σ1,3 = σ/2 ± √(σ²/4 + τ²)。强度理论把这个应力状态和单向拉伸试验比较。", "A point in plane stress (σ2 = 0): principal stresses σ1,3 = σ/2 ± √(σ²/4 + τ²). A strength theory compares this state with the uniaxial tensile test."]
  - 式: ["塑性材料：特雷斯卡 σ1 − σ3 ≤ σs；冯·米塞斯 √(σ² + 3τ²) ≤ σs", "Ductile: Tresca σ1 − σ3 ≤ σs; von Mises √(σ² + 3τ²) ≤ σs"]
  - 式: ["脆性材料：最大正应力 σ1 ≤ σt、−σ3 ≤ σc；库仑–莫尔 σ1/σt − σ3/σc ≤ 1", "Brittle: maximum normal stress σ1 ≤ σt, −σ3 ≤ σc; Coulomb–Mohr σ1/σt − σ3/σc ≤ 1"]
  - ["两种塑性理论最多差 15.5%（纯剪切时，2/√3）；单向拉压时完全一样。脆性材料受压比受拉强得多，冯·米塞斯不分拉压，用在铸铁上会把受压的地方当成危险。", "The two ductile theories differ by at most 15.5% (pure shear, 2/√3) and agree in uniaxial tension or compression. Brittle materials are much stronger in compression; von Mises ignores the sign, so on cast iron it flags compressed regions as dangerous."]
步骤:
  - ["打开实验 10.2，场景“SH-301 齿轮位”，σ = 16.2、τ = 27.9 MPa、材料 0（与程序 10.2.1 相同），点“计算”（任务 1），把四种安全系数填入表 1 第一行。", "Open Lab 10.2, scene “SH-301 gear seat”, σ = 16.2, τ = 27.9 MPa, material 0 (as in Program 10.2.1); press Compute (task 1) and fill in the first row of Table 1."]
  - ["σ 改为 0、τ = 100 MPa（任务 2），填表 1 第二行，算特雷斯卡与冯·米塞斯安全系数之比。", "Set σ = 0, τ = 100 MPa (task 2), fill in the second row and compute the ratio of the Tresca and von Mises factors."]
  - ["切换到“铸铁轴承座”，σ = −3.2、τ = 0.3 MPa、材料 2（任务 3），填表 1 第三行。", "Switch to “Cast-iron bearing seat”: σ = −3.2, τ = 0.3 MPa, material 2 (task 3), and fill in the third row."]
  - ["切换到“粉笔扭断”，σ = 0、τ = 1 MPa、材料 3（任务 4），填表 2。", "Switch to “Twisting chalk”: σ = 0, τ = 1 MPa, material 3 (task 4), and fill in Table 2."]
