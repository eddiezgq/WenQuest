注意:
  - ["这里只处理平面应力（σ2 = 0）。有限元给出的是三维应力，书里的程序从六个应力分量求三个主应力再判断。", "Only plane stress (σ2 = 0) is handled here. FE gives three-dimensional stress; the book's programs find the three principal stresses from the six components."]
  - ["铸铁的抗压强度取抗拉的 3.5 倍（手册典型值，本书取值）；粉笔的强度是示意值。", "Cast-iron compressive strength is taken as 3.5 times the tensile (a handbook typical value); the chalk strengths are illustrative."]
  - ["静载下塑性材料的应力集中可以靠局部屈服重新分布，所以名义应力校核常不乘 Kt；脆性材料不行（10.4 节）。", "Under static load a ductile part redistributes a stress concentration by local yielding, so nominal checks often omit Kt; a brittle part cannot (Section 10.4)."]
思考题:
  - ["塑性材料用特雷斯卡或冯·米塞斯（屈服由切应力决定，与正应力的正负无关）；脆性材料用最大正应力或库仑–莫尔（断裂由拉应力决定，受压强得多）。有限元软件默认给的冯·米塞斯云图，对铸铁件会把受压的地方标成“危险”。数字工厂的“仿真与分析”目前只给冯·米塞斯，你会怎样从它的结果判断铸铁件？", "Ductile materials take Tresca or von Mises (yield is governed by shear, regardless of the sign of the normal stress); brittle materials take maximum normal stress or Coulomb–Mohr (fracture is governed by tension; they are far stronger in compression). The default von Mises plot marks compressed regions of a cast-iron part as 'dangerous'. The factory's Simulation & analysis currently gives only von Mises — how would you judge a cast-iron part from it?"]
  - ["为什么钢轴扭断的断面是横截面，而粉笔、铸铁轴扭断的断面是 45° 螺旋面？", "Why does a twisted steel shaft break across its section while chalk or a cast-iron shaft breaks along a 45° spiral?"]
