注意:
  - ["齿面的接触强度计算还要考虑重合度、载荷沿齿宽的分布、动载等，见第 29 章；这里只算“两个圆柱压在一起”本身。", "Tooth-flank contact strength also involves contact ratio, face load distribution, dynamic load and more (Chapter 29); here only the two-cylinder contact itself."]
  - ["火车轮轨实际是两个曲面交叉的椭圆接触，这里按线接触粗略示意，压力会偏低；AGV 轮和火车轮轨的尺寸、载荷是本书设定的示意值。", "The wheel–rail contact is really elliptical (crossed curved surfaces); the line-contact sketch here underestimates the pressure. AGV and train dimensions and loads are illustrative values."]
  - ["尼龙轮的接触变形较大，赫兹理论只能给出量级；轮缘很薄的轮子（包胶轮）不能用这组公式。", "Nylon wheels deform more and Hertz theory gives only the order of magnitude; thin-tread (rubber-covered) wheels are outside these formulas."]
思考题:
  - ["程序 8.9.1 和本实验用同一组公式。最大切应力在表面以下约 0.78a 处，所以接触疲劳的裂纹常从表面以下开始，长到表面掉下一小块——这就是点蚀和剥落。表面硬化层（第 5 章的渗碳）至少要多深？", "Program 8.9.1 and this lab use the same formulas. The maximum shear lies about 0.78a below the surface, so contact-fatigue cracks often start below and grow up until a flake falls out — pitting and spalling. How deep must a hardened case (carburizing, Chapter 5) be at least?"]
  - ["为什么 AGV 常用聚氨酯或尼龙轮，而不用钢轮？从接触压力、地面、噪声和承载能力几方面比较。", "Why do AGVs usually run on polyurethane or nylon wheels rather than steel? Compare contact pressure, floor, noise and capacity."]
