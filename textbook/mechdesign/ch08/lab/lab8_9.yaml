# 实验 8.9 的指导书与报告模板。目的、场景、参数、任务取自 lab8_9.js。
原理:
  - ["两个弹性体在一条线（或一个点）上接触，受压后接触区变成一条很窄的带（或一个椭圆），压力按半椭圆分布，中间最大。赫兹在 1882 年给出了解。", "Two elastic bodies touching along a line (or at a point) flatten into a narrow strip (or an ellipse) under load; the pressure is semi-elliptical, highest in the middle. Hertz gave the solution in 1882."]
  - 式: ["R = 1/(1/R1 + 1/R2)，1/E* = (1 − ν1²)/E1 + (1 − ν2²)/E2；a = √(4F′R/(πE*))，p0 = 2F′/(πa)，F′ = F/b", "R = 1/(1/R1 + 1/R2), 1/E* = (1 − ν1²)/E1 + (1 − ν2²)/E2; a = √(4F′R/(πE*)), p0 = 2F′/(πa), F′ = F/b"]
  - ["p0 与 √F′ 成正比：载荷加倍，压力只增加约 41%，因为接触宽度也变宽了。最大主切应力约 0.30 p0，在表面以下约 0.78a 处。", "p0 grows as √F′: double the load and the pressure rises only about 41%, because the contact also widens. The maximum principal shear is about 0.30 p0, some 0.78a below the surface."]
步骤:
  - ["打开实验 8.9，场景“WQR-105 第二级齿面”，参数取默认（与程序 8.9.1 相同：F = 3694 N、b = 40 mm、R1 = 10.26 mm、R2 = 35.91 mm、钢对钢），点“计算”（任务 1），把读数填入表 1 第一行。", "Open Lab 8.9, scene “WQR-105 stage-2 tooth flanks”, defaults (as in Program 8.9.1: F = 3694 N, b = 40 mm, R1 = 10.26 mm, R2 = 35.91 mm, steel on steel); press Compute (task 1) and fill in the first row of Table 1."]
  - ["把 F 改为 7388 N（任务 2），填表 1 第二行，算出 p0 之比，与 √2 比较。", "Set F to 7388 N (task 2), fill in the second row, and compare the ratio of p0 with √2."]
  - ["切换到“AGV 驱动轮”，R1 = 75 mm、R2 = 0（平面）、b = 50 mm、F = 1500 N，材料取 1（尼龙）和 0（钢）各算一次（任务 3），填表 2。", "Switch to “AGV drive wheel”: R1 = 75 mm, R2 = 0 (flat), b = 50 mm, F = 1500 N; compute with material 1 (nylon) and 0 (steel) (task 3) and fill in Table 2."]
  - ["切换到“火车车轮与钢轨”，R1 = 460 mm、R2 = 0、b = 12 mm、F = 80 000 N（任务 4），填表 3。", "Switch to “Train wheel on rail”: R1 = 460 mm, R2 = 0, b = 12 mm, F = 80 000 N (task 4), and fill in Table 3."]
