注意:
  - ["外径、允许挠度、最小壁厚是本书设定的，实际设计要按关节结构、精度分配和工艺确定。只算了弯曲刚度，没有算扭转、连接处和局部屈曲。", "OD, allowed deflection and minimum walls were set by this book; a real design takes them from the joint layout, the accuracy budget and the process. Only bending stiffness is checked — not torsion, joints or local buckling."]
  - ["碳纤维层合板按准各向同性铺层算（程序 5.5.1）；按受力方向铺层可以更轻，但要专门设计。", "CFRP is taken as a quasi-isotropic laminate (Program 5.5.1); a tailored lay-up can be lighter but needs its own design."]
  - ["自行车场景按两端支承、中点受力的梁示意，不是车架的真实受力。", "The bicycle scene is a simply supported beam with a midspan load, a sketch rather than the real frame loading."]
思考题:
  - ["“外径固定”模式与程序 5.7.1 相同；“形状固定”模式和自行车场景不计自重，是实验另加的。实际的协作机器人小臂多用铝合金，很少用碳纤维。除了质量，还有哪些因素（连接、成本、导热、碰撞）？", "The fixed-OD mode matches Program 5.7.1; the fixed-shape mode and the bicycle ignore self-weight and are extras of this lab. Real cobot forearms are mostly aluminum, rarely carbon fiber. Besides mass, what else matters (joints, cost, heat, impact)?"]
  - ["为什么钢车架的管子细、铝车架的管子粗？用表 3 和两种性能指数说明（提示：外径 35 mm 时钢和铝差不多重，50 mm 时钢被最小壁厚卡住）。", "Why are steel frame tubes slim and aluminum ones fat? Explain with Table 3 and the two indices."]
