# 工程任务单 TS-5-1（配第 5 章）：为 WQR-105 第二级齿轮选材料和热处理，写选材说明。格式见 textbook/tools/tasksheet.py。
编号: TS-5-1
标题: ["为 WQR-105 第二级齿轮选材料和热处理，写选材说明", "Select material and heat treatment for the WQR-105 second-stage gears and write the selection note"]
角色: ["设计部门的材料工程师", "materials engineer, design department"]
背景:
  - "WQR-105 第二级的一对齿轮——小齿轮 GR-203（m 3、z 20）和大齿轮 GR-302（m 3、z 70）——现行图纸分别是 20CrMnTi 渗碳淬火和 40Cr 调质。生产部提出：厂里只有一台热处理炉 HT-01，渗碳一炉要好几个小时，是瓶颈；能不能两个都用 40Cr 调质，或者小齿轮改成感应淬火（另买一台感应淬火机）？设计组的意见是：替代方案的齿面、齿根强度不能明显低于现行方案（第 29 章会讲怎样算齿轮强度）。你作为材料工程师，比较几种材料和热处理路线，算出材料成本，写一份选材说明给评审会，并写出零件图上的热处理技术要求。"
  - "The second-stage gear pair of the WQR-105 — pinion GR-203 (m 3, z 20) and gear GR-302 (m 3, z 70) — are drawn in 20CrMnTi carburized and 40Cr quenched-and-tempered. Purchasing asks: the plant has one heat-treatment furnace, HT-01, and a carburizing load takes hours — it is the bottleneck; could both be 40Cr Q&T, or the pinion induction hardened (buying an induction machine)? The design team says any alternative must not be clearly weaker than the current one at the flank and the root (Chapter 29 shows how gear strength is computed). As materials engineer, compare several materials and heat-treatment routes, work out material cost, write a selection note for the review, and write the heat-treatment requirements for the drawings."
输入:
  - {名称: ["设计组的要求：现行方案按 ISO 6336-5 / GB/T 3480.5 的 MQ 级材料质量取接触疲劳极限 σHlim、弯曲疲劳极限 σFlim（学生自己查图）；替代方案同样按 MQ 级，σHlim、σFlim 都不得低于现行方案的 90%，否则要同时提出补偿措施（加宽齿宽、改变参数等，第 29 章再核算）。现行小齿轮：齿面 58–62 HRC，有效硬化层 0.45–0.75 mm（0.15m–0.25m，按 GB/T 9450 测定）；大齿轮：241–286 HBW", "Design requirements: take contact limit σHlim and bending limit σFlim for the current design at material quality MQ of ISO 6336-5 / GB/T 3480.5 (look them up); alternatives also at MQ must reach at least 90% of the current σHlim and σFlim, or come with a compensating measure (wider face, other parameters — checked again in Chapter 29). Current pinion: 58–62 HRC, effective case 0.45–0.75 mm (0.15m–0.25m, measured per GB/T 9450); gear: 241–286 HBW"], 来源: ["设计组（第 29 章）", "Design team (Chapter 29)"]}
  - {名称: ["现行物料、BOM 与工艺路线：GR-203 用 20CrMnTi 圆钢 Ø70（每件 1.8 kg），GR-302 用 40Cr 锻坯 Ø225 × 45；物料单价和工位费率（教学用示意值，美元）；热处理炉 HT-01 的工时和费率。物料表里没有的材料（如 40Cr、42CrMo 圆钢）按老师给的单价，或在 ERP 里新建物料。注意：工艺路线里渗碳淬火只记了 15 min（一炉 20 件分摊的教学简化），与程序 5.3.1 算出的炉时比较，写出你的判断", "Current items, BOM and routing: GR-203 from 20CrMnTi bar Ø70 (1.8 kg each), GR-302 from a 40Cr forging Ø225 × 45; unit prices and work-center rates (teaching values, USD); hours and rate of furnace HT-01. Materials not in the item list (e.g. 40Cr or 42CrMo bar) use the instructor's price or a new item in ERP. Note: the routing books only 15 min for carburizing (a teaching simplification, one load of 20 shared); compare it with the furnace time from Program 5.3.1 and give your view"], 来源: ["数字工厂主数据（ERP 物料、BOM、工艺路线）", "Factory master data (ERP items, BOM, routings)"]}
  - {名称: ["材料性能：数字工厂材料库；国标试样性能（GB/T 3077）；齿轮材料的接触、弯曲疲劳极限（ISO 6336-5 / GB/T 3480.5 的材料质量等级图，或手册）", "Material data: factory material library; GB/T 3077 test-piece values; gear-material contact and bending limits (ISO 6336-5 / GB/T 3480.5 quality-grade charts, or a handbook)"], 来源: ["数字工厂；教材第 5 章；标准与手册", "Digital factory; Chapter 5; standards and handbooks"]}
  - {名称: ["程序 5.3.1（渗碳层深度）、程序 5.2.1（试样值与设计用值）", "Programs 5.3.1 (case depth) and 5.2.1 (test-piece versus design values)"], 来源: ["教材第 5 章", "Chapter 5"]}
交付物:
  - {名称: ["选材说明（2–3 页）：要求、候选方案（至少四种：现行方案、两个都 40Cr 调质、小齿轮 40Cr 或 42CrMo 感应淬火、自选一种）、比较表、推荐与理由", "Selection note (2–3 pages): requirements, candidates (at least four: current, both 40Cr Q&T, pinion 40Cr or 42CrMo induction hardened, one of your own), comparison table, recommendation and reasons"], 验收: ["每个方案的 σHlim、σFlim 有出处（标准的图或手册的表，写明质量等级）；说明截面尺寸对调质性能的影响（5.2 节）；渗碳方案算出渗碳时间（程序 5.3.1）；比较表含强度、硬化层、变形与后续加工（是否要磨齿）、炉时与产能、材料与热处理成本；推荐有说服力并说明风险", "σHlim and σFlim of every option cited (standard chart or handbook table, with quality grade); effect of section size on Q&T properties discussed (Section 5.2); carburizing time computed (Program 5.3.1); table covers strength, case, distortion and finishing (grinding needed?), furnace time and capacity, material and heat-treatment cost; a convincing recommendation with its risks"], 类型: 文件, 格式: [docx, pdf]}
  - {名称: ["材料成本对比表（按数字工厂物料单价和 BOM 用量；热处理费用自查或按老师给的单价）", "Material cost table (factory unit prices and BOM quantities; heat-treatment cost looked up or as given by the instructor)"], 验收: ["每个方案每件的材料和热处理费用；数据来源写明", "Material and heat-treatment cost per part for each option; sources stated"], 类型: 文件, 格式: [xlsx, pdf]}
  - {名称: ["零件图上的热处理技术要求（GR-203、GR-302 各一段）", "Heat-treatment notes for the drawings (one for GR-203, one for GR-302)"], 验收: ["写明工艺、表面与心部硬度（含范围）、有效硬化层深度（含测量方法：渗碳按 GB/T 9450，感应淬火按 GB/T 5617）、检验部位；用词与标准一致", "Process, surface and core hardness (ranges), effective case depth (with its method: GB/T 9450 for carburizing, GB/T 5617 for induction), where to check; wording as in the standards"], 类型: 文件, 格式: [docx, pdf]}
工位: [PLM, ERP, PY]
步骤:
  - ["读要求：把设计组给的 σHlim、σFlim 换算成需要的齿面硬度、心部硬度（查标准的图或手册）", "Read the requirements: turn σHlim and σFlim into surface and core hardness (standard charts or handbooks)"]
  - ["列候选方案，查每种材料和热处理能达到的强度；注意调质性能随截面尺寸下降（5.2 节）", "List candidates and look up what each material and treatment achieves; mind the drop of Q&T properties with section size (Section 5.2)"]
  - ["渗碳方案：用程序 5.3.1 算出 0.6 mm 有效硬化层在 930 °C 要多久；感应淬火方案：写出硬化层的形状要求（沿齿廓还是全齿淬透）", "Carburizing: compute with Program 5.3.1 the time for a 0.6 mm case at 930 °C; induction: state the case shape required (contour or through-tooth)"]
  - ["在数字工厂查物料单价、BOM 用量和工艺路线，算材料成本；热处理费用按工时 × 工位费率算（感应淬火按老师给的单价）", "Look up unit prices, BOM quantities and routings in the factory and compute material cost; heat-treatment cost = hours × work-center rate (induction at the instructor's price)"]
  - ["写选材说明和热处理技术要求；评审会上答辩；评审后把三份交付物在“我的任务”里提交", "Write the note and the heat-treatment requirements; defend at the review; submit the three deliverables in My tasks afterwards"]
评审要点:
  - ["强度数据有出处、等级说清，不是凭印象", "Strength data cited with grade, not from memory"]
  - ["考虑了截面尺寸、热处理变形和后续加工，不只看材料牌号；感应淬火方案说清 m 3 的小齿轮能否沿齿廓淬硬（容易整齿淬透、齿根变脆）", "Section size, distortion and finishing considered, not just the grade; for induction, whether an m 3 pinion can be contour-hardened (through-hardened teeth have brittle roots)"]
  - ["成本与周期的比较完整，推荐与理由一致", "Cost and lead-time comparison complete; recommendation consistent with the reasons"]
  - ["热处理技术要求写得能检验：硬度范围、硬化层深度及测法、检验部位", "Heat-treatment notes are checkable: hardness ranges, case depth and its method, check locations"]
评分:
  - {项: ["要求换算与数据", "Requirements and data"], 分: 25, 标准: ["换算正确、数据有出处", "Correct conversion, cited data"]}
  - {项: ["方案比较", "Comparison"], 分: 30, 标准: ["方案全、因素全、计算对", "Complete options, factors and calculations"]}
  - {项: ["成本表", "Cost table"], 分: 15, 标准: ["数据来源清楚、结果正确", "Clear sources, correct results"]}
  - {项: ["热处理技术要求", "Heat-treatment notes"], 分: 15, 标准: ["完整、可检验", "Complete, checkable"]}
  - {项: ["推荐与答辩", "Recommendation and defense"], 分: 15, 标准: ["理由充分、风险说清", "Good reasons, risks stated"]}
学时: 4
