注意:
  - ["实验中的 ατ = 3.0 是 [SHI] 的“首轮估计”，适用于设计初期；定稿时应按键槽实际的底部圆角查图或用有限元计算。", "ατ = 3.0 is the [SHI] first-iteration estimate for early design; a final design uses the real keyseat fillet from charts or finite elements."]
  - ["这里只算“无限寿命”的安全系数。转矩的大循环次数不多时（起停不频繁），可以按有限寿命设计，见 33.8 节。", "Only the infinite-life safety factor is computed here. When large torque cycles are few (few starts), a finite-life design applies — Section 33.8."]
  - ["电钻主轴的数值是示意：真实主轴的端部常带螺纹或六角，结构和应力集中不同。", "The drill numbers are illustrative: real spindles often end in a thread or hex, with different stress raisers."]
思考题:
  - ["为什么换成 40Cr 以后，强度提高了约 29%，安全系数却没有提高这么多？（提示：看 q 和 β）", "Why does 40Cr raise the strength by about 29% but the safety factor by less? (Hint: look at q and β.)"]
