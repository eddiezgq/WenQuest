# 书的基本信息（第 11 轮）：outline.py 从这里找提纲和书名。
outline: docs/教材/机械设计/00_提纲.md
title: 机械设计
title_en: Mechanical Design
# 程序读到的书外文件（以及别章的共用模块）（缓存键要包含它们，改了就重算）：第 1 章读数字工厂的主数据、参数配置器、跑合试验台转矩记录和零件库
program_deps:
  - factory/factory/data.py
  - factory/digital/hub/configurator.py
  - factory/digital/sim/engine.py
  - library/catalog/A/A-CPL-JAW/specs.csv
  - library/catalog/B/B-LEG-GO2/vendor.yaml
  # 第 3 章：SH-301 B 版的尺寸（第 33 章）、案例件 RJ-201 的结构
  - textbook/mechdesign/ch33/code/_shaft.py
  - factory/digital/hub/case_parts.py
  # 第 4 章：磨床的加工误差模型、质量模块、RJ-201 的轴承（零件库）、轴承座的设计规则（第 3 章）
  - factory/digital/sim/errors.py
  - factory/digital/hub/spc.py
  - textbook/mechdesign/ch33/code/_rj.py
  - textbook/mechdesign/ch03/code/_ch3.py
  - library/catalog/A/A-BRG-DG/specs.csv
  # 第 5 章：材料库（经 mdstd 读取）、UR5e 模型（小臂长度与腕部质量）
  - factory/digital/cae/materials.py
  - library/catalog/B/B-ARM-UR5E/entry.yaml
  # 第 6 章：标准成本与工位费率、经济精度表、舵机外形（零件库）、SH-301 A 版的台阶
  - factory/digital/hub/mrp.py
  - factory/digital/hub/kpi.py
  - factory/digital/std/econ_accuracy.yaml
  - library/catalog/D/D-ACT-ROBOTIS-X/specs.csv
  - factory/digital/freecad/wq_shaft.py
  # 第 60 轮 D-1：构建时记录到的其余书外文件（各章程序经 sys.path 导入数字工厂的包、读零件库的规格表）
  - docs/教材/机械设计/00_提纲.md
  - factory/factory/*.py
  - factory/digital/cae/*.py
  - factory/digital/sim/*.py
  - factory/digital/wqbus/*.py
  - factory/digital/hub/__init__.py
  - library/catalog/A/A-BLT-HEX/specs.csv
  - library/catalog/A/A-SPR-CMP/specs.csv
