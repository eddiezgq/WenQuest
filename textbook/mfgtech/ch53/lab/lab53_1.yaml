# 实验 53.1 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab53_1.js。
原理:
  - ["SH-301 先铣键槽、后磨齿轮位。铣键槽时直接控制的是槽底到精车外圆下母线的 H；磨削使下母线向轴心移动，槽底不动，图纸要求的 d − t₁ 是磨完以后才形成的封闭环。", "SH-301 is keyway-milled before the gear seat is ground. Milling controls H, from the slot bottom to the turned bottom line; grinding moves the bottom line toward the axis while the slot bottom stays, so the drawing's d − t₁ is a closing link formed after grinding."]
  - 式: "A0 = H − r1 + r2"
