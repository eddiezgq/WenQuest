  - ["切到“磨削前”（任务 4），说明此时能量哪个尺寸、用什么量具（工序 50 用专用量规 G07 测 H）。", "Switch to “before grinding” (task 4); which size can be measured and with what (op 50 uses special gauge G07 for H)?"]
