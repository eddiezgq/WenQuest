    行英文: [["Keyway", "", "normal", "", "", "", ""], ["Gear seat 60", "", "normal", "", "", "", ""], ["Gear seat 60", "", "uniform", "", "", "", ""], ["Case depth", "", "normal", "", "", "", ""]]
注意:
  - ["组成环的中间偏差固定，取自数字工厂的工艺规程和尺寸链数据；只改公差。偏态分布取偏向公差带上限的 beta(3.23, 1.90)，它的 k ≈ 1.17、e ≈ +0.26，与表 53.3.1 一致。", "Link mid-deviations are fixed from the factory's data; only the tolerances change. The skewed distribution is beta(3.23, 1.90), leaning to the upper limit, with k ≈ 1.17 and e ≈ +0.26 as in Table 53.3.1."]
思考题:
  - ["蒙特卡罗的超差率很小时，是否就可以放心用概率法定公差？还要满足哪些条件？", "If the Monte Carlo reject rate is tiny, can the statistical tolerance be trusted? What else must be true?"]
