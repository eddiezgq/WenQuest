    表头: ["场景", "组成环公差", "分布", "极值法", "概率法", "蒙特卡罗超差率 / %", "结论"]
    表头英文: ["Scene", "Link tolerances", "Distribution", "Worst case", "Statistical", "MC reject rate / %", "Result"]
