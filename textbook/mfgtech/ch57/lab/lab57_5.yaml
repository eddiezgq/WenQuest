# 实验 57.5 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab57_5.js。
原理:
  - ["切削用量按 ap → f → vc 的次序确定：ap 按余量，f 粗加工受力与功率限制、精加工受粗糙度限制，vc 按刀具寿命；再校核功率、让刀、粗糙度和寿命。几个条件在 f–vc 平面上围出可行域，在里面选机动时间短的点。", "Choose ap, then f (force/power or Ra), then vc (tool life); check power, deflection, Ra and life. The constraints bound a feasible region in the f–vc plane."]
