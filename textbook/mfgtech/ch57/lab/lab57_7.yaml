# 实验 57.7 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab57_7.js。
原理:
  - ["工艺成本分可变费用 V（与产量成正比）和不变费用 S（每年固定）。单件成本 C = V + S/N，年成本 E = VN + S；两方案年成本相等的产量是临界年产量；多投资的方案每年省下的成本收回多出的投资所需的年数是投资回收期。比较时还要看瓶颈的负荷和技术风险。", "Variable cost V and fixed cost S; C = V + S/N, E = VN + S; break-even volume and payback; also bottleneck load and risk."]
  - 式: "N_c = (S_A − S_B)/(V_B − V_A)        (57.7.2)"
  - 式: "τ = (K_A − K_B)/(E_B − E_A)        (57.7.3)"
