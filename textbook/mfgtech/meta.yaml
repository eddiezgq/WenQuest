# 书的基本信息（第 13 轮）：outline.py 从这里找提纲和书名。
outline: docs/教材/机械制造技术/00_提纲.md
title: 机械制造技术
title_en: Mechanical Manufacturing Technology
unicode_minus: true        # 程序给出的负数排成“−”
# 程序读到的书外文件（数字工厂的工艺规程、卡片生成器、尺寸链库、误差模型、工厂数据）：改了它们，程序要重算
program_deps:
  - factory/digital/std/*.yaml
  - factory/digital/hub/cards.py
  - factory/digital/hub/sketch.py
  - factory/digital/hub/tolerance.py
  - factory/digital/hub/fixture.py
  - factory/digital/hub/fe2d.py
  - factory/digital/std/WQR-105_chains.yaml
  - factory/digital/cae/cam_power.py
  - factory/digital/hub/process.py
  - factory/digital/sim/errors.py
  - factory/factory/data.py
  - factory/digital/models3d/*.py      # 三维模型（第 13 轮 8.3 R1）
  - factory/digital/drawings/*.py      # 工程图（R3）
  - factory/digital/hub/accuracy.py
  - textbook/tools/render3d.py         # 三维渲染（R2）
  - textbook/tools/render3d.js
  # 第 60 轮 D-1：构建时记录到的其余书外文件（经 sys.path 导入数字工厂的包）
  - factory/factory/*.py
  - factory/digital/cae/__init__.py
  - factory/digital/sim/*.py
  - factory/digital/wqbus/*.py
  - factory/digital/hub/__init__.py
  - factory/digital/std/stdtab.py
