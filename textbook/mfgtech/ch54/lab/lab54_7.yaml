    行英文: [["Shift 1.5σ", "", "", "", ""], ["Spread × 2", "", "", "", ""], ["Drift 0.3σ per subgroup", "", "", "", ""]]
  - 标题: ["表 2  子组容量与报警快慢（均值偏移 1σ）", "Table 2  Subgroup size and detection speed (1σ shift)"]
    表头: ["n", "种子 1", "种子 2", "种子 3", "平均"]
    表头英文: ["n", "Seed 1", "Seed 2", "Seed 3", "Mean"]
    行: [["2", "", "", "", ""], ["5", "", "", "", ""], ["8", "", "", "", ""]]
    行英文: [["2", "", "", "", ""], ["5", "", "", "", ""], ["8", "", "", "", ""]]
注意:
  - ["数据是按 SH-301 正常过程（均值 35.009、σ = 1.2 µm）随机生成的，换种子就是换一批零件；报警的组号会随批次变化，要多换几个种子再下结论。", "Data are generated from SH-301's normal process (mean 35.009, σ = 1.2 µm); a new seed is a new batch. Alarm positions vary from batch to batch — try several seeds before concluding."]
思考题:
  - ["控制限和公差有什么区别？点都在控制限内，零件就一定合格吗？反过来呢？", "How do control limits differ from tolerances? If all points are within the limits, are all parts good? And conversely?"]
  - ["为什么 SH-301 的子组按一个修整周期取？", "Why are SH-301's subgroups one dressing cycle?"]
