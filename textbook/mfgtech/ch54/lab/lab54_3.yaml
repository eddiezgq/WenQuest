注意:
  - ["画面上的误差放大了几百倍（“显示放大倍数”），读数是真实值。模型是零件库的两顶尖 E-ACC-CENTERS，工件按误差模型实时生成。", "Errors are drawn hundreds of times larger (display magnification); the readings are true values. The centres are library model E-ACC-CENTERS; the work is generated from the error model."]
  - ["两个轴承位若分别调整（数控磨床每个轴承位有自己的横进给目标值），常值的尾座偏移在首件调整时会被补偿掉，留下的只是每个轴承位长度内的锥度；问题在调整以后才出现时，左右轴承位就会差开（本章提要、54.8 节）。", "If each seat has its own infeed target, a constant tailstock offset is absorbed at the first-part setting and only the taper within each seat remains; when the problem appears after setting, the two seats drift apart (54.0, 54.8)."]
思考题:
  - ["为什么磨床、车床的导轨在水平面内的直线度要求比垂直面内高得多？平面磨床呢？", "Why do lathe and grinder guideways need much better straightness in the horizontal plane than in the vertical? What about a surface grinder?"]
  - ["尾座偏移和“头架、尾座刚度不同”都会产生锥度。怎样用试验把两者区分开？", "Both a tailstock offset and unequal head/tail stiffness give a taper. How would you tell them apart by experiment?"]
