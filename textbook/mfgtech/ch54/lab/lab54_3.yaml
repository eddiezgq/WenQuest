# 实验 54.3 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab54_3.js。
原理:
  - ["原始误差对工件的影响取决于它在误差敏感方向（加工表面的法向）上的分量。两顶尖装夹磨（车）外圆时，砂轮（刀具）在水平面内，水平方向的误差 1:1 地改变半径、2:1 地改变直径；垂直方向的误差只使直径变化约 δ²/R。", "An error matters by its component along the error-sensitive direction, the normal to the machined surface. Grinding (turning) between centres with the wheel (tool) in the horizontal plane, a horizontal error changes the radius one-for-one and the diameter two-for-one; a vertical error changes the diameter only by about δ²/R."]
  - 式: "尾座偏移：Δd(z₂) − Δd(z₁) = 2e(z₂ − z₁)/L        (54.3.2)"
  - 式: "导轨水平面直线度 Δy：Δd = 2Δy；垂直面 Δz：Δd ≈ Δz²/R        (54.3.1)"
  - ["车削时切削力方向不变，工件的圆度误差反映主轴颈的形状；镗削时反映轴承孔的形状。", "In turning the force direction is fixed and the work's roundness reflects the journal; in boring it reflects the bearing bore."]
步骤:
  - ["每次只加一项误差（任务 1–4），记下工件形状、左右轴承位的直径误差、右减左和圆度，填表 1。", "Add one error at a time (tasks 1–4); record the shape, both seats' diameter errors, right − left and roundness in Table 1."]
  - ["把任务 1 的“右减左”与式 (54.3.2) 的计算值、仿真车间的实测值（图 54.3.6）比较。", "Compare task 1's right − left with Eq. (54.3.2) and with the shop data (Fig. 54.3.6)."]
  - ["做任务 5（两项误差同时存在），说明合成后的形状，判断两个轴承位能否用同一次调整都磨合格。", "Do task 5 (two errors at once); describe the combined shape and judge whether one setting can hold both seats."]
