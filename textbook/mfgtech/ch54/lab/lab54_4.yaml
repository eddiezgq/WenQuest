# 实验 54.4 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab54_4.js。
原理:
  - ["两顶尖车外圆时，背向力 Fp 使刀具与工件在误差敏感方向上相对让开 y。y 由头架、尾座、刀架的变形和工件的弯曲四部分组成，随刀具位置 x 变化；车出的直径误差为 2y，沿轴向的变化就是形状误差。", "Turning between centres, the radial force Fp pushes tool and work apart by y along the sensitive direction. y is the sum of the headstock, tailstock and tool-post deflections and the bending of the work, and varies with the tool position x; the diameter error is 2y, and its variation along the axis is the form error."]
  - 式: "y(x) = Fp[((L − x)/L)²/k头 + (x/L)²/k尾 + 1/k刀 + x²(L − x)²/(3EIL)]        (54.4.2)"
  - 式: "误差复映系数 ε = Δ工件/Δ毛坯 = C/k；n 次走刀 ε总 = ε₁ε₂…εₙ        (54.4.4)"
步骤:
  - ["场景“SH-301 精车”，默认参数，读出两端和中间的直径误差，记入表 1（任务 1）。", "Scene SH-301, defaults: read the diameter errors at both ends and the middle into Table 1 (task 1)."]
  - ["把尾座刚度降到 5 kN/mm（任务 2），记下形状和锥度。", "Drop the tailstock stiffness to 5 kN/mm (task 2); record the shape and taper."]
  - ["场景“细长轴”，先不用、再用跟刀架（任务 3、4），比较直径误差。", "Scene slender shaft, without and with a follow rest (tasks 3, 4); compare."]
  - ["回到 SH-301，毛坯跳动 1 mm，改走刀次数，找出降到 0.01 mm 以下的最少次数（任务 5），记入表 2。", "Back to SH-301 with 1 mm of blank runout, change the number of passes and find the fewest that get below 0.01 mm (task 5); Table 2."]
