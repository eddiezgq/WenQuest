思考题:
  - ["切削速度从 120 提到 180 m/min，单件时间只省了百分之几。要把粗车的单件时间降一半，应该从哪里下手？", "Raising the cutting speed from 120 to 180 m/min saves only a few per cent per piece. To halve the rough-turning time, where would you start?"]
  - ["为什么工序卡要同时写切削速度和主轴转速？操作工在机床上设的是哪一个？数控程序里又写的是哪一个（第 47 章的 G96 与 G97）？", "Why does an operation sheet give both cutting speed and spindle speed? Which does the operator set, and which does an NC program use (G96 and G97, Chapter 47)?"]
