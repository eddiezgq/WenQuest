注意:
  - ["余量都按直径计（双边）。工艺卡上常写单边余量，换算时除以 2。", "All stock is on the diameter (both sides). Route sheets often give it per side; divide by 2."]
  - ["Rz、H_a、ρ 的数值是数字工厂企业工艺标准的教学示意值，实际取值查工艺手册的余量表。", "The Rz, H_a and ρ values are the digital factory's teaching values; real values come from the allowance tables of a process handbook."]
  - ["工序尺寸往大取整到 0.1 mm，是为了车间好测量；取整多出来的部分就是额外的余量。", "Rounding a size up to 0.1 mm makes it easy to measure on the shop floor; what rounding adds is extra stock."]
