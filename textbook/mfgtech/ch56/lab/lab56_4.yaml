# 实验 56.4 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab56_4.js。
原理:
  - ["精基准选择的五条原则：基准重合、基准统一、互为基准、自为基准、便于装夹。定位基准与设计基准不重合时，产生基准不重合误差，等于联系两个基准的尺寸的公差；换一次基准，就加进一项基准转换的误差。", "Five principles: datum coincidence, unity, mutual datums, self-datum, easy holding. When the locating datum is not the design datum there is a datum-mismatch error equal to the tolerance of the dimension linking them; every change of datum adds another error."]
  - 式: "V 形块（夹角 α）定位外圆（公差 Td）：工序基准在下母线 Δ = Td/2·(1/sin(α/2) − 1)，在轴线 Δ = Td/(2 sin(α/2))，在上母线 Δ = Td/2·(1/sin(α/2) + 1)"
  - ["一夹一顶时，卡盘的定心误差按到尾顶尖的距离折算到被加工表面处：e = TIR·(x_尾 − x)/(x_尾 − x_夹)。", "Chuck plus tail centre: the chuck error scales to the machined surface by its distance to the tail centre."]
步骤:
  - ["场景 SH-101 精车与滚齿：轴向编程原点分别取左端面和轴肩，读出 8 ± 0.1 的实际公差和基准不重合误差（任务 1），记入表 1。", "Scene SH-101 turning: origin at the left end and at the shoulder; read the tolerance on 8 ± 0.1 and the mismatch (task 1); Table 1."]
  - ["依次选基准方案 A、B、C，读出齿顶圆跳动中由基准引起的部分；改卡盘跳动，看 B、C 怎样变化（任务 2），记入表 2。", "Choose schemes A, B, C; read the datum part of the tip runout; vary the chuck runout (task 2); Table 2."]
  - ["场景铣键槽：α = 90°、Td = 0.05，槽深分别从下母线、轴线、上母线量，比较定位误差；再改 α（任务 3）。", "Keyway scene: α = 90°, Td = 0.05; compare the three depth references; then vary α (task 3)."]
  - ["场景输出法兰：比较一次装夹和分两次装夹的同轴度（任务 4）。", "Flange scene: compare one and two set-ups (task 4)."]
