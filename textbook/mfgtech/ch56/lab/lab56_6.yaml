  - ["改为 IT8、Ra 0.8（密封轴颈），找最短的可行方案链；试一试把热处理放在最后，看意见（任务 2）。", "Change to IT8, Ra 0.8 (seal journal); find the shortest valid chain; try the heat treatment last and read the comments (task 2)."]
  - ["场景齿面：先做 8 级，再做 6 级（任务 3）。", "Gear scene: grade 8, then grade 6 (task 3)."]
  - ["场景孔：IT7、Ra 1.6（任务 4）。", "Bore scene: IT7, Ra 1.6 (task 4)."]
  - ["回到外圆，拼一条跳级的方案链，记下系统的意见（任务 5）。", "Back to OD: build a chain that skips a stage and note the comments (task 5)."]
