# 实验 56.6 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab56_6.js。
原理:
  - ["每种加工方法在正常生产条件下有一个经济精度和可达的粗糙度。拟定方案链从最后一道往前推：最后一道的经济精度要满足图纸，每一道要求上一道达到一定的精度（余量小而均匀，上道的误差才切得掉）；热处理以后只能用能加工淬硬钢的方法；热处理后不再加工的表面，热处理变形使精度降低约一级。", "Each method has an economic accuracy and Ra. Work the chain back from the last step: the last step must meet the drawing; each step needs the previous one to reach a given grade; after hardening only methods for hard steel; a surface not finished after heat treatment loses about one grade."]
  - ["数据与数字工厂工艺标准 std/route_methods.yaml 相同，检查规则与 hub/route.py 的 check_chain 相同（AI 工艺评审员也用它）。", "The data are those of std/route_methods.yaml and the checks those of hub/route.py's check_chain (used by the AI reviewer too)."]
步骤:
