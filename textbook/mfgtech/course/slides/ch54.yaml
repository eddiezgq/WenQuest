      - "先看仿真车间一个班次的记录。工序 60 外圆磨削 SH-301 的两个轴承位，Ø35 k6，公差只有 16 微米。前 30 件左右两处一起起伏，都在公差中间偏下；从第 {{fig54_0.start}} 件起两处都变大了，可右边大了 {{fig54_0.dr_um:.1f}} 微米，左边只大了 {{fig54_0.dl_um:.1f}} 微米，后 30 件里右轴承位超差 {{fig54_0.n_fail}} 件。质检员说：砂轮磨钝了，修一修。对吗？这一章学完，我们回来回答。"
      - "Here is one shift's record from the simulated shop. Operation 60 grinds SH-301's two bearing seats, Ø35 k6, a tolerance of only 16 microns. For the first 30 parts the two seats rise and fall together, below the middle of the tolerance. From part {{fig54_0.start}} both grow, but the right one by {{fig54_0.dr_um:.1f}} microns and the left one by only {{fig54_0.dl_um:.1f}}; {{fig54_0.n_fail}} of the last 30 right seats are out. The inspector says the wheel is dull, dress it. Is that right? We'll come back to this at the end."

  - layout: figure
    title: ["一个班次 60 件的测量值", "Sixty parts from one shift"]
    visual: {fig: fig54_0_1}
    caption: ["点线是修整砂轮；第 {{fig54_0.start}} 件起两处都变大，右边变得多（方框为超差）", "Dotted lines: wheel dressing. From part {{fig54_0.start}} both seats grow, the right one more (squares: out of tolerance)"]
    notes:
      - "这是那 60 件的测量值。蓝线是左轴承位，橙线是右轴承位，点线是每 10 件修整一次砂轮。注意两件事：前面两条线一起起伏，说明有些误差两处一样；第 {{fig54_0.start}} 件起两处一起跳上去，但跳的高度不一样。如果是砂轮磨损，两处应该一样地变。两处变得不一样，离头架越远变得越多——这就是线索。"
      - "These are the sixty measurements. Blue is the left bearing seat, orange the right one, and the dotted lines mark the wheel being dressed every ten parts. Notice two things: at first the two lines rise and fall together, so some errors act on both seats alike; from part {{fig54_0.start}} both jump up, but by different amounts. Wheel wear would change both seats alike. A change that grows with the distance from the headstock is our clue."

