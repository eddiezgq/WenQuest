      - ["工序 60 磨 SH-301，Ø35 k6，公差只有 16 µm", "Op 60 grinds SH-301: Ø35 k6, a tolerance of just 16 µm"]
      - ["第 {{fig54_0.start}} 件起两处都变大：右 +{{fig54_0.dr_um:.1f}} µm，左 +{{fig54_0.dl_um:.1f}} µm", "From part {{fig54_0.start}} both grow: right +{{fig54_0.dr_um:.1f}} µm, left +{{fig54_0.dl_um:.1f}} µm"]
      - ["后 30 件里右轴承位超差 {{fig54_0.n_fail}} 件", "{{fig54_0.n_fail}} of the last 30 right seats are out"]
