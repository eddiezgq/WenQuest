    notes:
      - "这一章讲机械加工精度。同一台磨床、同一个操作工、同一份工艺规程，磨出来的轴还是一根一根不一样，有时还会突然出问题。背景上是一台外圆磨床：尾座偏了一点，工件就被磨成锥形，误差放大了五百倍才看得见。这一章要学会的，就是从数据里认出这种“指纹”，找到它的来源，再把它减小。"
      - "This chapter is about machining accuracy. The same grinder, the same operator and the same process plan still turn out shafts that differ one from the next, and sometimes something suddenly goes wrong. In the background is a cylindrical grinder: the tailstock is slightly off, and the work comes out tapered, magnified five hundred times so we can see it. What we learn here is to recognise such fingerprints in the data, trace them to their source, and reduce them."

