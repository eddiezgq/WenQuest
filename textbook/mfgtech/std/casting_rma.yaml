excluded:
  - "RMAG A、B、C、D 四级：只在 renrendoc 的 ISO 8062-3 中文译本里见到，OCR 错乱（如 ≤40 行“0.1, 0.1, 0.2, 0.3 …”后续列错位），没有第二个可读出处，不收。灰铸铁砂型铸造用不到这四级。"
  - "J、K 两级只有 r1（读两次一致），r2 不含；r1 依据的是 ISO 8062:1994。E–H 四级 1994 版（r1）与 ISO 8062-3（r2）13 行全同，说明该表在 2007 版未变，但 J、K 未能用 2007 版出处直接核对。"
  - "bessercast.com 的 RMA 表（250–400 mm E 级写作 2.2）与 r1、r2 都不符，未采用。"
  - "kikakurui.com 的 JIS B 0403 页面数值表是图片，网页工具返回的“数值”与原文无关（疑为臆造），已弃用。"
  - "毛坯尺寸计算公式（如 R = F + 2·RMA + DCT/2）：所读 ISO 8062-3:2007 样本中没有该条文原文，本表不收；教材如要写，需用 GB/T 6414-2017 原文核对。"
notes:
  - "RMA 是单侧余量：同一铸件所有加工面按铸件（加工后）最大尺寸选同一个 RMA 值（JIS B 0403:1995 第 11.1 条原文，kikakurui.com/b0/B0403-1995-01.html 文字部分；该页表格为图片，数值未取；ISO 8062-3:2007 第 8 章为 RMA）。"
  - "查表规则：按铸件最大尺寸取段，“大于 size_over_mm，至 size_to_mm（含）”，段内不插值。"
  - "r1 表下注：钢铸件上型（cope）表面最少 6 mm RMA——这是 SFSA 对钢铸件的要求，不属于 ISO 表值，灰铸铁不套用。"
  - "本书用例（HT200 箱体，最大尺寸约 350 mm）：250–400 mm 段；机器造型灰铸铁 RMAG E–G → 1.8 / 2.5 / 3.5 mm；手工造型 F–H → 2.5 / 3.5 / 5 mm（等级见 casting_typical.yaml）。"
