standard: {code: "ISO 8062-3:2007 / ISO 8062:1994 要求的机械加工余量表（GB/T 6414-2017 修改采用 ISO 8062-3:2007）", title: "铸件 要求的机械加工余量 RMA（RMAG E–K，按铸件最大尺寸）"}
sources:
  - {key: "r1", title: "SFSA Steel Founders' Society of America, Steel Castings Handbook Supplement 3 “Dimensional Capabilities of Steel Castings”, Table 2.2 Required machining allowances (RMA) in millimeters for steel castings based on ISO 8062", url: "https://www.stainlessfoundry.com/uploads/files/SFSA_Handbook_Supplement_3_Dimensional_Tolerances.pdf", note: "p.5；E–K 六级、13 个尺寸段的主出处，读两次（整理式一次、原始文本一次）逐格一致；依据 ISO 8062:1994"}
  - {key: "r2", title: "SizeMarker《Casting Tolerance Grades: The ISO 8062-3 Chart Explained》RMA Machining Allowance 表（标注 DIN EN ISO 8062-3）", url: "https://www.sizemarker.com/blog/casting-tolerance-grades-iso-8062", note: "E、F、G、H 四级 13 个尺寸段逐格互核，与 r1 全部一致"}
columns:
