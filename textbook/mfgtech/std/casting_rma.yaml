  - [size_to_mm, 铸件最大尺寸 至, largest dimension up to and including, mm]
  - [RMA_E_mm, 要求的机械加工余量 RMAG E（单侧）, "required machining allowance, grade E", mm]
  - [RMA_F_mm, 要求的机械加工余量 RMAG F（单侧）, "required machining allowance, grade F", mm]
  - [RMA_G_mm, 要求的机械加工余量 RMAG G（单侧）, "required machining allowance, grade G", mm]
  - [RMA_H_mm, 要求的机械加工余量 RMAG H（单侧）, "required machining allowance, grade H", mm]
  - [RMA_J_mm, 要求的机械加工余量 RMAG J（单侧）, "required machining allowance, grade J", mm]
  - [RMA_K_mm, 要求的机械加工余量 RMAG K（单侧）, "required machining allowance, grade K", mm]
