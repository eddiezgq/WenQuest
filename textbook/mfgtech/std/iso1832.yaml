notes:
  - "读法示例 CNMG 120408：C 菱形 80°；N 法后角 0°（负型，可双面用）；M 公差等级；G 有孔、双面断屑槽；12 刃长 12（内切圆 12.7 mm）；04 厚 4.76 mm；08 刀尖圆角 0.8 mm。"
  - "公差等级的 d、m 范围（J、K、L、M、N、U）：允许偏差随内切圆大小变，表中存的是该等级的最小～最大值；M 级的具体分档见 position = 3-M 的 9 行（md 补充表，D 形、V 形单列，其余形状一组；s 恒为 ±0.13）。Walter 表中这些范围的末位带脚注上标（如“0.152”= 0.15 加脚注 2，“0.382”= 0.38 加脚注 2），已按脚注理解去掉。"
  - "md 主表中 J、K、L 的 d 列、N 与 U 的 d 和 m 列为空（写“见补充表”），这些数只来自 w；s 列两处一致。"
  - "第 4 位：md 与 kn 两处给出同一套 15 个字母（A/M/G 有孔，N/R/F 无孔，W/T/Q/U 带 40°–60° 沉孔，B/H/C/J 带 70°–90° 沉孔，X 特殊）。"
  - "第 8、9 位为可选项；第 10 位起由刀具厂自定（断屑槽型、牌号），不同厂家不通用。"
  - "第 2 位 X（其他后角）只在 md 出现；第 1 位 P（108°）只在 md 出现，kn、w 抽取中未见该角度。"
