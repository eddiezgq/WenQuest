# 可转位刀片型号表示规则（ISO 1832；国内对应 GB/T 2076）
standard: {code: "ISO 1832（国内对应 GB/T 2076；本表未读到 GB/T 2076 原文）", title: "切削刀具用可转位刀片 型号表示规则 —— 各位代号含义（第 1–3、6、7 位给出代号值）"}
sources:
  - {key: md, title: "Machining Doctor《ISO Inserts - Nomenclature, Dimensions & Tolerances》", url: "https://www.machiningdoctor.com/isoturn/", note: "第 1、2、4、6、7 位全表，第 3 位主表与 M 级补充表（按形状和内切圆分档）；主出处"}
  - {key: w, title: "Walter《Turning designation key for Walter Turn cutting inserts》(en-GB) PDF；同一内容见 Walter 2016 总样本（rubix 托管 general_catalogue_2016_en_50.pdf）", url: "https://cdn.walter-tools.com/files/sitecollectiondocuments/technicalinformation/en-gb/turning-designation-key-walter-turn-cutting-inserts-en-gb.pdf", note: "第 1、2 位互核；第 3 位全部 12 个等级的 d、m、s 允许偏差（J、K、L、N、U 的 d/m 范围只有这里有）；第 6、7 位；第 8、9 位字母；第 10 位起 F/M/R/H 为 Walter 自定断屑槽"}
  - {key: kn, title: "Kennametal《Milling Insert Identification System》（MSC Direct 托管 PDF）", url: "https://www1.mscdirect.com/images/solutions/kennametal/millingInsertIdSystem.pdf", note: "第 1、2 位互核；第 4 位 15 个字母（网页抽取时列有错位，按字母顺序与 md 对照后一致）；第 3 位为英制（inch）表，用来核对 A/C/E/F/G/H 的数值；第 7 位 01–32 与 M0"}
  - {key: pt, title: "Protool《ISO Turning Insert Nomenclature Explained》", url: "https://www.protool-ltd.co.uk/blogs/blog/iso-turning-insert-nomenclature", note: "只用 CNMG 120408 示例：12 = 内切圆 12.7 mm、04 = 厚 4.76 mm、08 = rε 0.8 mm"}
  - {key: dn, title: "Denitool《Insert Designation》", url: "https://www.denitool.com/en/insert-designation.html", note: "只用第 8 位（F 锋利、E 倒圆、T 倒棱、S 倒棱+倒圆）与第 9 位（R/N/L）含义；该页第 1 位 G=45° 不是 ISO 代号，未采用"}
columns:
  - [position, 代号位置（1–10+；3-M 为 M 级补充表）, designation position, "-"]
  - [code, 代号, symbol, "-"]
  - [meaning_cn, 含义, meaning (Chinese), "-"]
  - [meaning_en, 含义（英文）, meaning (English), "-"]
  - [angle_deg, 刀尖角（第 1 位）或法后角（第 2 位）, nose angle / normal clearance angle, °]
  - [d_tol_min_mm, 内切圆 d 允许偏差 ±（下限；定值时与上限相同）, IC tolerance ± (low end), mm]
  - [d_tol_max_mm, 内切圆 d 允许偏差 ±（上限）, IC tolerance ± (high end), mm]
  - [m_tol_min_mm, 刀尖位置尺寸 m 允许偏差 ±（下限）, corner height m tolerance ± (low end), mm]
  - [m_tol_max_mm, 刀尖位置尺寸 m 允许偏差 ±（上限）, corner height m tolerance ± (high end), mm]
  - [s_tol_mm, 厚度 s 允许偏差 ±, thickness tolerance ±, mm]
  - [value_mm, 代号对应尺寸（第 6 位厚度 s、第 7 位刀尖圆角 rε）, thickness / corner radius, mm]
