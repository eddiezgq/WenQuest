excluded:
  - "CBN（立方氮化硼）：没找到可读出处给出 CBN 的 n 或 C，不收。"
  - "涂层硬质合金的 C 值、陶瓷加工铸铁、任何刀具加工铝合金的单独 C 值：t1–t3 只分“钢 / 非钢”，没有更细的工况，不收。"
  - "ResearchGate 同帖中 D. Martinez Krahmer 给的单值（HSS 0.16，无涂层硬质合金 0.30，涂层 0.35，陶瓷 0.40）：个人回答、未注明出处和工件材料，不收。"
  - "Groover 原书（《Fundamentals of Modern Manufacturing》）原文未能读到；t1–t3 三份讲义的表与该书 Taylor 参数表同一版式，但讲义本身都没印出处，所以 source 标题不写成“Groover 原书”。"
notes:
  - "符号：本表把指数记作 m（v·T^m = C），英文教材（Groover、Kalpakjian）写作 n（v·T^n = C）；C 的单位与 v 相同，即 T = 1 min 时的切削速度。"
  - "英制列与公制列不是精确换算：70 m/min ≈ 230 ft/min（表给 200），500 m/min ≈ 1640 ft/min（表给 1500），3000 m/min ≈ 9840 ft/min（表给 10000），是原表各自取整的“典型值”。计算时只用 C_m_per_min。"
  - "这些是教学用的典型值（Groover 式表只分“钢 / 非钢”），没有进给、切深、磨钝标准（VB）等条件，只能用于例题和量级估算，不能代替刀具厂的寿命数据或 ISO 3685 试验。"
  - "Kalpakjian 的范围行只有指数、没有 C；需要 C 时用 Groover 式行，或自己由两组 (v, T) 试验数据求：m = ln(v1/v2)/ln(T2/T1)，C = v1·T1^m。"
  - "规律：指数 m 越大，寿命对速度越不敏感——高速钢 0.08–0.2、硬质合金 0.2–0.5、涂层硬质合金 0.4–0.6、陶瓷 0.5–0.7。"
