  - {key: range_cast_alloys, src: k1+k2, tool: "Cast alloys", tool_cn: "铸造钴基合金（司太立类）", work: "（未分）", work_cn: "不分工件材料", m_min: 0.1, m_max: 0.15}
  - {key: range_carbides, src: k1+k2, tool: "Carbides", tool_cn: "硬质合金（无涂层）", work: "（未分）", work_cn: "不分工件材料", m_min: 0.2, m_max: 0.5}
  - {key: range_coated_carbides, src: k2, tool: "Coated carbides", tool_cn: 涂层硬质合金, work: "（未分）", work_cn: "不分工件材料", m_min: 0.4, m_max: 0.6}
  - {key: range_ceramics, src: k1+k2, tool: "Ceramics", tool_cn: 陶瓷, work: "（未分）", work_cn: "不分工件材料", m_min: 0.5, m_max: 0.7}
