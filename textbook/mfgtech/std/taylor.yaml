  - {key: hss_nonsteel, src: t1+t2+t3, tool: "High speed steel", tool_cn: 高速钢, work: "Non-steel work", work_cn: "非钢材料（铸铁、有色金属等）", m: 0.125, C_m_per_min: 120, C_ft_per_min: 350}
  - {key: hss_steel, src: t1+t2+t3, tool: "High speed steel", tool_cn: 高速钢, work: "Steel work", work_cn: 钢, m: 0.125, C_m_per_min: 70, C_ft_per_min: 200}
  - {key: carbide_nonsteel, src: t1+t2+t3, tool: "Cemented carbide", tool_cn: "硬质合金（表中未分涂层/无涂层）", work: "Non-steel work", work_cn: "非钢材料", m: 0.25, C_m_per_min: 900, C_ft_per_min: 2700}
  - {key: carbide_steel, src: t1+t2+t3, tool: "Cemented carbide", tool_cn: "硬质合金（表中未分涂层/无涂层）", work: "Steel work", work_cn: 钢, m: 0.25, C_m_per_min: 500, C_ft_per_min: 1500}
  - {key: ceramic_steel, src: t1+t2+t3, tool: "Ceramic", tool_cn: 陶瓷, work: "Steel work", work_cn: 钢, m: 0.6, C_m_per_min: 3000, C_ft_per_min: 10000}
