# Taylor 刀具寿命公式常数：v · T^m = C（v 切削速度 m/min，T 刀具寿命 min，C = T=1 min 时的切削速度）
standard: {code: "无正式标准；试验方法见 ISO 3685（本表未引用其数值）", title: "Taylor 刀具寿命公式 v·T^m = C 的典型常数（英文教材写作 v·T^n = C，本表指数统一记作 m）"}
sources:
  - {key: t1, title: "Michigan State University ME 478《Cutting Tool Technology: 1. Tool life 2. Tool Materials 3. Tool Geometry》讲义 PDF（Groover《Fundamentals of Modern Manufacturing》配套讲义的版式）", url: "https://www.egr.msu.edu/~pkwon/me478/cuttingtool.pdf", note: "p.7 Taylor 参数表（Tool material / Work material / n / C m/min / C ft/min）5 行；讲义本身未印出处"}
  - {key: t2, title: "IIT Kanpur（N. Sinha）《Machining II》讲义 PDF", url: "https://home.iitk.ac.in/~nsinha/Machining%20II.pdf", note: "同一张表“Typical values of n and C”，5 行逐格与 t1 一致"}
  - {key: t3, title: "NC State University MSE 440/540（Yuntian Zhu）讲义幻灯片，slideserve 转载", url: "https://www.slideserve.com/leopoldom/mse-440-540-processing-of-metallic-materials-powerpoint-ppt-presentation", note: "第 9 页同一张表，5 行逐格与 t1 一致"}
  - {key: k1, title: "Kalpakjian–Schmid《Manufacturing Engineering and Technology》(Prentice-Hall 2001) 第 20 章 Fundamentals of Cutting 讲义，pdfcoffee 转载", url: "https://pdfcoffee.com/fundamentals-of-cutting-kalpakjian-schmid-manufacturing-engineering-and-technology-2001-prentice-hall-page-20-1-pdf-free.html", note: "Table 20.3“Range of n Values for Eq. (20.20) for Various Tool Materials”，p.20-17，4 行；读两遍一致，表中没有 coated carbides 行"}
  - {key: k2, title: "ResearchGate 问答《Is anyone familiar with the cutting tool life equation?》中 Eric Dimla 的回答（引 Kalpakjian 一书）", url: "https://www.researchgate.net/post/Is_anyone_familiar_with_the_cutting_tool_life_equation", note: "“HSS 0.08-0.2; Cast alloys 0.1-0.15; Carbides 0.2-0.5; Coated carbides 0.4-0.6; Ceramics 0.5-0.7”——用于互核 k1 四行，coated carbides 一行只有这一个出处（可能是 Kalpakjian 较新版本的表）"}
columns:
  - [tool, 刀具材料（出处原文）, tool material, "-"]
  - [tool_cn, 刀具材料, tool material (Chinese), "-"]
  - [work, 工件材料（出处原文）, work material, "-"]
  - [work_cn, 工件材料, work material (Chinese), "-"]
  - [m, Taylor 指数（英文教材记作 n），单值, Taylor exponent n (single value), "-"]
  - [m_min, Taylor 指数范围下限, Taylor exponent n, lower bound, "-"]
  - [m_max, Taylor 指数范围上限, Taylor exponent n, upper bound, "-"]
  - [C_m_per_min, Taylor 常数 C（T=1 min 时的切削速度）, Taylor constant C, m/min]
  - [C_ft_per_min, Taylor 常数 C（出处同列给出的英制值）, Taylor constant C, ft/min]
rows:
