  - {row: "grey_iron_sand_hand", col: "RMAG_max", value: "H", against: "t3", where: "同上", ok: True}
  - {row: "grey_iron_sand_machine", col: "RMAG_min", value: "E", against: "t3", where: "2-26 节 机器造型和壳型 铸铁", ok: True}
  - {row: "grey_iron_sand_machine", col: "RMAG_max", value: "G", against: "t3", where: "同上", ok: True}
