  - {key: "grey_iron_sand_machine", src: "t1+t2+t3", src_detail: "DCTG 出自 t1+t2；RMAG 出自 t1+t3", process: "砂型铸造 机器造型和壳型（大批量/长期生产）", alloy: "灰铸铁", DCTG_min: 8, DCTG_max: 12, RMAG_min: "E", RMAG_max: "G"}
