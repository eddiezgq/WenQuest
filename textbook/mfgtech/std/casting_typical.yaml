  - {row: "grey_iron_sand_machine", col: "RMAG_max", value: "G", against: "t1", where: "表 B.1 第二次读取", ok: True}
excluded:
  - "小批量/单件生产（短期间）灰铸铁砂型的公差等级（t2：生型 CT13-15、自硬砂 CT11-13）：只有 t2 一个出处，不收。"
  - "其他合金（钢、球铁、铜合金、轻合金等）的典型等级：本书用例只需灰铸铁，未逐格互核，不收（t1 与 t2 在铜合金、手工造型一格就不一致：11至13 对 10-13）。"
  - "SFSA 手册给出的“砂型手工 G–K、机器 F–H”是钢铸件的推荐，不适用于灰铸铁，未收。"
  - "nbk1560 网页的概括文字（“手工造型 CT11–CT14，机器造型 CT8–CT12”）与表格一致，但 kikakurui.com 返回的同类表是臆造内容，已弃用。"
notes:
  - "这些是“典型/推荐”等级，不是强制值：选用时由供需双方按批量、工艺能力商定，在图样或技术要求中写明，例如“GB/T 6414-2017 DCTG10 RMAG F（RMA 2.5）”。"
  - "t1 是 ISO 8062-3:2007 的中文本，t2 是 JIS B 0403:1995（= ISO 8062:1994），两版灰铸铁这两格相同；t4 说 GB/T 6414-2017 修改了表 A.1、A.3，所以国标 2017 版的数可能不同，进教材前应以 GB/T 6414-2017 原文为准再核。"
  - "本书用例（HT200 变速箱箱体，砂型，最大约 350 mm）：机器造型可取 DCTG10、RMAG F → 250–400 mm 段 DCT 4.4 mm（±2.2），RMA 2.5 mm；手工造型可取 DCTG12、RMAG G → DCT 9 mm（±4.5），RMA 3.5 mm。数值见 casting_dctg.yaml、casting_rma.yaml。等级的具体取法是本工作的示例选择，不是标准规定。"
