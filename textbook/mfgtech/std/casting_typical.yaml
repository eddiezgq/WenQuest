  - {row: "grey_iron_sand_hand", col: "DCTG_max", value: 14, against: "t2", where: "同上", ok: True}
  - {row: "grey_iron_sand_machine", col: "DCTG_min", value: 8, against: "t2", where: "砂型鋳造機械込め及びシェルモールド × ねずみ鋳鉄", ok: True}
  - {row: "grey_iron_sand_machine", col: "DCTG_max", value: 12, against: "t2", where: "同上", ok: True}
