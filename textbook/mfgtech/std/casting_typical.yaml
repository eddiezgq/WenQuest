standard: {code: "ISO 8062-3:2007 附录 A 表 A.1、附录 B 表 B.1（GB/T 6414-2017 对应附录）", title: "铸件 典型尺寸公差等级 DCTG 与机械加工余量等级 RMAG —— 灰铸铁砂型铸造"}
sources:
  - {key: "t1", title: "人人文档《铸件尺寸公差-ISO-8062-3(2007)-中文》，表 A.1（大批量生产铸件的 DCTG）与表 B.1（RMAG）", url: "https://www.renrendoc.com/paper/211435739.html", note: "灰铁一列：手工造型 DCTG 11至14、RMAG F至H；机器造型与壳型 DCTG 8至12、RMAG E至G。该文档的尺寸公差主表 OCR 错乱，只用这两张附录表（读两次：整理式一次、原始文本一次，一致）"}
  - {key: "t2", title: "NBK 鍋屋バイテック《鋳造品の寸法公差 JIS B 0403:1995より抜粋》“長期間製造する鋳放し鋳造品に対する公差等級”表", url: "https://www.nbk1560.com/resources/other/article/technical-dimensional-tolerances-of-castings/", note: "ねずみ鋳鉄：砂型鋳造手込め CT 11-14；砂型鋳造機械込め及びシェルモールド CT 8-12（JIS B 0403:1995 对应 ISO 8062:1994）"}
  - {key: "t3", title: "《铸造实用技术问答（第2版）》2-26 节（QQ 阅读）", url: "https://m.on.qq.com/read/1031251747/88", note: "按 GB/T 6414—1999：砂型手工造型铸铁 F–H 级；机器造型/壳型铸铁 E–G 级（只用于 RMAG 互核）"}
  - {key: "t4", title: "Code of China《GB/T 6414-2017》英文版简介", url: "https://www.codeofchina.com/standard/GBT6414-2017.html", note: "指出 2017 版修改了附录 A 表 A.1、A.3 的公差等级；本表未能与 2017 版原文核对"}
