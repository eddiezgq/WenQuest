excluded:
  - "GB/T 6414-2017 标准原文：openstd 只提供在线阅读（图像），各转载站（renrendoc 的 ISO 8062-3 中文译本、casting-china.org、iron-foundry.com）表格错位或数值有误（如 casting-china.org 把 ≤10 行 DCTG8 写成 1.1），未用作数值出处。表值按 ISO 8062-3:2007 原文收录。"
  - "ISO/DIS 8062-3:2019 样本的表格文本按列混排，无法对行，未用。"
  - "壁厚公差：表注 a 规定 DCTG1–15 的壁厚取大一级，表中不单列；DCTG16 只用于一般按 DCTG15 规定的铸件的壁厚（表注 b）。"
  - "错型（SMI）、几何公差（GCTG）表：本轮未读，未收。"
notes:
  - "表值是总公差（全值），默认对称分布：上、下偏差各为一半（ISO 8062-3:2007 第 5.2 条）。例：公称尺寸 350 mm、DCTG10 → 4.4 mm，即 ±2.2 mm。"
  - "null 表示该等级在此尺寸段标准未规定数值（表中为“—”）。"
  - "查表规则：公称尺寸指与铸型有关的铸件尺寸（含加工余量的毛坯尺寸），按“大于 size_over_mm，至 size_to_mm（含）”取段，段内不插值；第一段为 ≤10 mm。"
  - "src=c1+c2+c3：标准原文与两处转载互核一致（c3 只覆盖 DCTG8–16）；630 mm 以上行为 c1+c2；6300–10000 mm 行只有 c1（两次读取一致）。"
  - "与 GB/T 6414-2017 的关系：GB/T 6414-2017 重新起草、修改采用 ISO 8062-3:2007，代替 GB/T 6414-1999（c6）。c6 列出的技术变化包括“修改了铸件尺寸公差”“修改了大批量生产合金铸件的公差等级”（附录 A 表 A.1、A.3），但没有说明表 2 数值与 ISO 是否有差异；本轮没拿到 GB/T 原文核对。教材引用时写“GB/T 6414-2017（数值同 ISO 8062-3:2007 表 2）”之前，建议用标准原文再核一次。"
  - "ISO 8062-3:2023 把 DCTG16 改称 DCTG15wt（c7），c3 网页的“DCT15wtb”列即此列。"
  - "本书用例（HT200 灰铸铁变速箱箱体，砂型，最大尺寸约 350 mm）：落在 250–400 mm 段；按 casting_typical.yaml，机器造型灰铸铁 DCTG 8–12 → 2.2 / 3.2 / 4.4 / 6.2 / 9 mm，手工造型 DCTG 11–14 → 6.2 / 9 / 12 / 16 mm。箱体上较小的尺寸（如 120 mm 轴承座孔距）要按各自的尺寸段另查。"
