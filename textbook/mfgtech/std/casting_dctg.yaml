standard: {code: "ISO 8062-3:2007 Table 2（GB/T 6414-2017 修改采用）", title: "铸件 尺寸公差、几何公差与机械加工余量 —— 线性尺寸铸件公差 DCT（DCTG 1–16，公称尺寸至 10000 mm）"}
sources:
  - {key: "c1", title: "ISO 8062-3:2007 iTeh 公开样本 PDF，Table 2 — Linear dimensional casting tolerances (DCT)", url: "https://cdn.standards.iteh.ai/samples/40495/29fba0fd844d421d80b957ce1a1a5899/ISO-8062-3-2007.pdf", note: "主出处、标准原文。PDF 文本按“三行一组、逐列”排列；整表原始记号读取一次，100–1600 mm 两组再读一次，逐格一致；另有一次整理式读取（有 3 处与原始文本不符，以原始文本为准，见 check）。表注 a、b 与 5.2 条（公差对称分布）也取自此"}
  - {key: "c2", title: "Studocu《ISO 8062-3 2007 (E) - Dimensional Tolerances for Casting DCTG》文本", url: "https://www.studocu.com/in/document/srm-university/formal-language-aand-automata/iso-8062-3-2007-e-dimensional-tolerances-for-casting-dctg/149695667", note: "≤10 至 4000–6300 mm 各行的数值序列（读两次；第二次行标签错位一行，按序列内容对位），用于互核；没有 6300–10000 行"}
  - {key: "c3", title: "Modulus Metal《ISO 8062-3 Sand Casting Linear Dimensional Tolerances》", url: "https://www.modulusmetal.com/iso-8062-3-sand-casting-linear-dimensional-tolerances/", note: "DCT8–DCT15 及 DCT15wtb（=原 DCTG16）的 ± 半值；≤630 mm 各行 ×2 后与 c1 全部一致，用于互核；630 mm 以上该页把半值取整（如 ±6、±13），不作核对依据"}
  - {key: "c4", title: "SizeMarker《Casting Tolerance Grades: The ISO 8062-3 Chart Explained》", url: "https://www.sizemarker.com/blog/casting-tolerance-grades-iso-8062", note: "DCTG6、8、10、12、14 五列（至 4000 mm）抽查"}
  - {key: "c5", title: "Castings PLC《Casting Tolerances》（ISO 8062 CT8、CT9 表）", url: "https://castings.plc.uk/company/technical-assistance/casting-tolerances/", note: "CT8、CT9 至 630 mm 抽查（与 DCTG8、DCTG9 相同）"}
  - {key: "c6", title: "Code of China《GB/T 6414-2017 Castings — Dimensional tolerances and geometrical tolerances and machining allowances》英文版简介", url: "https://www.codeofchina.com/standard/GBT6414-2017.html", note: "GB/T 6414-2017 与 ISO 8062-3:2007 的关系（重新起草、修改采用；代替 GB/T 6414-1999）及主要技术变化，不取数"}
  - {key: "c7", title: "ISO 8062-3:2023 iTeh 公开样本（前言）", url: "https://cdn.standards.iteh.ai/samples/77952/dfc94491c8324e58b3a7890f41a5fab3/ISO-8062-3-2023.pdf", note: "前言：2023 版 Table 7 把 DCTG 16 改称 DCTG 15wt；不取数"}
