# 实验 51.3 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab51_3.js。
原理:
  - ["刚体在空间有六个自由度：沿 x、y、z 的移动和绕 x、y、z 的转动。用合理分布的六个支承点限制六个自由度，工件的位置完全确定（六点定位原理，定理 51.3.1）。", "A rigid body has six degrees of freedom: translations along and rotations about x, y, z. Six well-placed support points restrict all six and fix the work completely (six-point principle, Theorem 51.3.1)."]
  - ["3–2–1 定位：底面三点限制沿 z 移动、绕 x 和绕 y 转动；侧面两点限制沿 y 移动、绕 z 转动；端面一点限制沿 x 移动。轴在两段 V 形块（4 点）和挡板（1 点）上只限制 5 个，绕轴线的转动不限制（不完全定位）。", "3–2–1 location: three base points take z translation and rotations about x and y; two side points take y translation and rotation about z; one end point takes x translation. A shaft on two V lands (4 points) and a stop (1) has 5 restricted; rotation about its axis stays free (partial location)."]
步骤:
  - ["长方体：支承点从 0 加到 6，每加一个点记下它新限制的自由度，填表 1（任务 1、2）。", "Block: add points from 0 to 6 and record which freedom each new point takes (Table 1, tasks 1–2)."]
  - ["换到“轴”：从 0 加到 5，填表 2，找出仍然自由的那个（任务 3）。", "Switch to the shaft: add 0 to 5 (Table 2) and find the one still free (task 3)."]
  - ["把结果与表 51.3.1 对照：短 V 形块、两段 V 形块、端面挡板各相当于几个点。", "Compare with Table 51.3.1: how many points a short V-block, two V lands and an end stop each equal."]
