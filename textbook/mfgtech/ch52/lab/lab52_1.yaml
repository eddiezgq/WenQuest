注意:
  - ["模型来自零件库 E-ASM-JJ30150，与书中插图、总图和数字工厂是同一份；零件的“作用”按零件名自动归类，定位键归入夹具体（连接元件），压板后端的可调支承归入夹紧装置（它是压板的支点，不起定位作用）。", "The model is library entry E-ASM-JJ30150, the same as the book figures, the drawing and the digital factory. Functions are assigned from part names; the keys count as body (connecting elements) and the heel supports under the straps as clamping (they are the strap fulcrums, not locators)."]
  - ["剖开只切过工件轴线的竖直平面，剖面不画剖面线，看到的是零件的内表面。", "The section is the vertical plane through the work axis; cut faces are not hatched, you see the inner surfaces."]
