思考题:
  - ["为什么工序卡上要规定拧紧扭矩、并用定扭矩扳手，而不是写“压紧”两个字？（提示：夹紧力的分散、压板强度、工件变形，52.5 节。）", "Why should the operation sheet specify a torque and a torque wrench rather than just “clamp tight”? (Hint: scatter of clamping force, strap strength, work deformation; Section 52.5.)"]
