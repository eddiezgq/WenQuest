  - ["间隙引起的转角误差是可能的最大值（销偏向孔的一边），实际在 ±Δθ/2 之间变化，取决于转动时靠向哪一边。", "The clearance gives the largest possible angle error (pin against one side); in practice it varies within ±Δθ/2 depending on which side the plate rests on."]
