    行英文: [["Steel", "210", "1800", "18", "20", "90", ""], ["Steel", "210", "1800", "18", "5", "90", ""], ["Steel", "210", "1800", "18", "20", "120", ""], ["Aluminium", "69", "1800", "18", "20", "90", ""], ["Nylon PA12", "1.7", "", "", "20", "90", ""]]
注意:
  - ["网格边长固定为 2 mm，比书中程序（1 mm）粗，下沉略小；两者用同一种单元和加载方式，书中程序也按 2 mm 算了一遍核对。", "The mesh is fixed at 2 mm, coarser than the book's 1 mm, so the sink is a little smaller; the book's program also runs the 2 mm mesh as a check."]
  - ["3D 打印尼龙的弹性模量随打印方向、填充率、温度和吸湿变化很大，1.7 GPa 是教学取值；尼龙还会蠕变。", "Printed nylon's modulus varies a lot with build direction, infill, temperature and moisture; 1.7 GPa is a teaching value, and nylon also creeps."]
