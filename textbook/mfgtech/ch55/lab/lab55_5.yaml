注意:
  - ["比磨削能、热量分配比 ε、回火软化温度都是示意的经验值（量级与 Malkin《Grinding Technology》相符），实际的烧伤边界要用试磨和酸洗、巴克豪森检查确定。", "Specific energy, the heat partition ε and the softening onset are illustrative values (of the order given by Malkin); real burn limits are set by trial grinding with etching or Barkhausen checks."]
  - ["本实验的冷却只改变温度超过 Ac1 后的烧伤种类；实际上干磨的热量分配比更大，温度更高。", "Here the coolant only changes the kind of burn above Ac1; in reality dry grinding also sends more heat into the work."]
