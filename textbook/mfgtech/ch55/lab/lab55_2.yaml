# 实验 55.2 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab55_2.js。
原理:
  - ["车削时刀尖圆弧每转沿进给方向前进 f，相邻两转之间留下残留面积。残留高度只由 f 和刀尖圆弧半径 r 决定；把它当作轮廓算出的 Ra 叫理论 Ra。实际表面还有刃口的微观不平、积屑瘤和鳞刺、振动留下的振纹，所以实际 Ra 总比理论值大。", "Each revolution the nose advances f and leaves a scallop between passes. Its height depends only on f and the nose radius r; the Ra of the scallops alone is the theoretical Ra. Real surfaces add edge roughness, built-up edge and chatter, so the real Ra is always larger."]
  - 式: "h = r − √(r² − f²/4) ≈ f²/(8r)        (55.2.1)"
  - 式: "Ra ≈ 0.0321 f²/r        (55.2.3)"
步骤:
  - ["场景“SH-301 工序 40 精车”，默认参数，读出残留高度、理论 Ra、合成轮廓的 Ra 和 Rz，记入表 1（任务 1）。", "Scene operation 40, defaults: read h, the theoretical Ra and the profile's Ra and Rz into Table 1 (task 1)."]
  - ["保持 r = 0.4，逐步减小进给量，找出理论 Ra 不超过 0.8 µm 的最大进给量（任务 2），与式 (55.2.3) 反求的结果比较。", "Keep r = 0.4 and reduce the feed until the theoretical Ra is within 0.8 µm (task 2); compare with Eq. (55.2.3) solved for f."]
  - ["回到默认参数，把切削速度降到 25 m/min（任务 3），再恢复到 150 m/min、加 3 µm 振纹（任务 4），记入表 1。", "Back to the defaults, drop the speed to 25 m/min (task 3), then restore 150 m/min and add 3 µm of chatter (task 4); Table 1."]
  - ["f = 0.15 不变，换刀尖圆弧，使理论 Ra 低于 1.6 µm（任务 5），记入表 2。", "Keep f = 0.15 and change the nose radius until the theoretical Ra is below 1.6 µm (task 5); Table 2."]
