注意:
  - ["合成轮廓是按 hub/surface.py 的模型算出的示意轮廓（微观不平、积屑瘤的幅值是经验值），随机数不同，Ra、Rz 与教材算例相差百分之几。实际粗糙度要用粗糙度仪测量。", "The synthetic profile follows the model in hub/surface.py (edge roughness and built-up edge are empirical); with different random numbers Ra and Rz differ from the book's example by a few percent. Measure real surfaces with a profilometer."]
  - ["三维表面的高度放大了很多倍；刀尖圆弧越大，背向力越大，细长件、薄壁件容易振动，选刀片时要一并考虑。", "Heights in the 3D view are greatly exaggerated. A larger nose radius raises the radial force, so slender and thin-walled parts chatter more easily."]
思考题:
  - ["为什么加大刀尖圆弧比减小进给量更有利于效率？它的代价是什么？", "Why is a larger nose radius better for productivity than a smaller feed? What does it cost?"]
  - ["积屑瘤区的速度对刀具寿命和表面质量都不利，那为什么有的工厂在低速车削时还会遇到它？怎样避开？", "Built-up-edge speeds hurt both tool life and surface; why do some shops still meet it at low speed, and how can it be avoided?"]
