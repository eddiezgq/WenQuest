注意:
  - ["摩擦力矩的大小不显示，要靠两次以上的测量求出。电机力矩小于摩擦力矩时小臂不转。", "The friction torque is not shown; find it from two or more runs. Below the friction torque the forearm does not turn."]
  - ["读数带有 ±0.3%（角速度）和 ±0.01 s（时间）以内的误差，同一设置重复做读数相同；要减小误差，取差别大的两个力矩。", "Readings carry errors up to ±0.3% (angular velocity) and ±0.01 s (time); repeating a setting gives the same reading. To reduce the error, use two torques far apart."]
思考题:
  - ["表 1 最后一列“不扣摩擦”的 J 随 M 怎样变化？为什么 M 越大越接近真值？", "How does the “friction ignored” J in Table 1 change with M? Why does it approach the true value as M grows?"]
  - ["平行轴定理的预测与测量值差多少？负载在转动惯量中占多大比例？", "How far is the parallel-axis prediction from the measurement? What fraction of the moment of inertia comes from the load?"]
  - ["落体法中，如果轴承有不变的摩擦力矩，测得的 J 偏大还是偏小？怎样用两个不同的砝码消去它？", "In the falling-mass method, would a constant bearing friction make J too big or too small? How could two different masses eliminate it?"]
