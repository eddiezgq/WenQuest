     "Switch to method 0 (Euler), step 5 (50 ms), fit again and submit that C_d (task 2). Then reduce the step to 1 ms, refitting each time, for Table 2."]
  - ["选“相平面上的振子”，三种方法各取 ωh = 0.1、0.5、1.0，点“开始”，观察 20 个周期后离原点的距离，填入表 3。",
     "Choose the oscillator; for each method try ωh = 0.1, 0.5 and 1.0, press “Start” and record the distance from the origin after 20 periods in Table 3."]
