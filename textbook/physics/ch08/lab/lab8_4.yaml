# 实验 8.4 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab8_4.js。
原理:
  - ["网球受重力和二次方空气阻力，状态矢量为 (x, y, v_x, v_y)，运动方程为 dv/dt = −g ŷ − k v v，k = ρC_dA/(2m)（8.1 节）。这个方程没有解析解，要数值求解。",
     "The ball feels gravity and quadratic drag; the state is (x, y, v_x, v_y) and dv/dt = −g ŷ − k v v with k = ρC_dA/(2m) (Section 8.1). There is no closed-form solution, so it is solved numerically."]
  - 式: "dv/dt = −g ŷ − k v v，k = ρC_dA/(2m)        (8.1.4)"
  - ["参数辨识：调 C_d，使仿真轨迹与实测点的均方根偏差最小。前提是数值误差远小于测量误差；否则积分方法的误差会被“吸收”进 C_d，得到有偏的结果。",
     "Parameter identification: tune C_d to minimise the RMS deviation between simulated path and data. This assumes the numerical error is far below the measurement error; otherwise the integrator's error is absorbed into C_d and biases it."]
  - ["弹簧振子在相平面 (x, v/ω) 上的精确轨迹是圆。欧拉法每步使半径乘以 √(1 + (ωh)²)，向外盘旋；半隐式欧拉法在 ωh < 2 时沿闭合的斜椭圆运动，ωh 越接近 2，椭圆越扁，等于 2 时振幅线性增长；RK4 在 ωh ≤ 2√2 时不发散（8.5 节）。",
     "In the (x, v/ω) phase plane the exact path is a circle. Euler multiplies the radius by √(1 + (ωh)²) per step and spirals out; semi-implicit Euler follows a closed tilted ellipse for ωh < 2, flatter as ωh approaches 2; RK4 stays bounded for ωh ≤ 2√2 (Section 8.5)."]
  - 式: "半隐式欧拉法稳定：ωh < 2；RK4 稳定：ωh ≤ 2√2        (8.5.1)"
