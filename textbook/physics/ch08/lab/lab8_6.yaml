注意:
  - ["参考值用罚函数、0.1 ms 步长算出，与恢复系数 0.75 给出的 0.56 m 略有差别，这是罚函数模型本身的特点。", "The reference uses penalty contact at 0.1 ms; it differs slightly from the 0.56 m implied by e = 0.75, which is a property of the penalty model itself."]
  - ["反弹高度与步长的关系不是单调的：接触落在哪几步上，与步长的细节有关。步长接近稳定界限时，后面几次反弹甚至可能比前一次还高：接触力一会儿有、一会儿没有，8.3 节“能量不漂移”的性质不再严格成立。", "The bounce does not change monotonically with the step: which steps fall inside the contact depends on the details. Near the stability limit a later bounce can even be higher than the one before: the contact force switches on and off, so the no-drift property of Section 8.3 no longer holds exactly."]
