思考题:
  - ["MuJoCo 的默认步长是 2 ms。按“每次接触约 10 步”，接触持续的时间至少要多长？MuJoCo 为什么给接触设一个时间常数（默认 0.02 s），并且默认不让它小于步长的两倍？", "MuJoCo's default step is 2 ms. With about 10 steps per contact, how long must a contact last at least? Why does MuJoCo give contacts a time constant (0.02 s by default) and by default keep it at least twice the step?"]
  - ["表 2 中，步长超过安全值时为什么有时仍能挡住小球？在游戏里依赖这种“运气”会有什么后果？", "In Table 2, why is the ball sometimes stopped even above the safe step? What happens in a game that relies on that luck?"]
