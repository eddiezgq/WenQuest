注意:
  - ["光点读数带有 ±0.05 mm 以内的误差。摆动有阻尼，要用相邻的几个极值求平衡位置，不能只看一个。", "Spot readings carry errors up to ±0.05 mm. The swing is damped: use several neighbouring extremes for the rest position, not just one."]
  - ["只计每个小球与靠近它的大球之间的引力。", "Only the pull between each small ball and its nearby large ball is counted."]
思考题:
  - ["引力只相当于小球重量的约一亿分之二，扭秤靠什么测出来？", "The pull is only about 2 × 10⁻⁸ of the small ball's weight: what lets the balance detect it?"]
  - ["悬丝越细越好吗？实际测量中最难控制的干扰是什么？", "Is a thinner fibre always better? What disturbance is hardest to control in practice?"]
