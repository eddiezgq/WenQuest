    表头: ["v₀ / (km/s)", "近地点高度 / km", "远地点高度 / km", "周期 / min"]
    表头英文: ["v₀ / (km/s)", "Perigee / km", "Apogee / km", "Period / min"]
    行: [["7.00", "", "", ""], ["7.20", "", "", ""], ["7.40", "", "", ""], ["7.60", "", "", ""], ["7.80", "", "", ""], ["8.00", "", "", ""], ["9.00", "", "", ""], ["10.00", "", "", ""]]
注意:
  - ["不计空气阻力和地球自转；实际发射时向东发射可借助地球自转的速度。", "Air drag and the Earth's rotation are ignored; real launches go east to borrow the Earth's spin."]
  - ["近地点低于地面时，卫星会落回地面。", "If the perigee is below the surface, the satellite falls back."]
