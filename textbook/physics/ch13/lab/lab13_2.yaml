思考题:
  - ["反扭矩是谁施加给谁的？如果机身装在完全没有摩擦的轴上，螺旋桨从静止加速到悬停转速的过程中，机身会怎样？", "Who exerts the reaction torque on whom? If the frame were on a frictionless pivot, what would it do while the propellers spin up from rest?"]
  - ["转椅场景中，β = 90° 时转椅的角速度是 β = 180° 时的几分之几？为什么？", "In the chair scene, what fraction of the β = 180° chair speed do you get with β = 90°, and why?"]
