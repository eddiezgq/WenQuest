# 实验 17.5 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab17_5.js。
原理:
  - ["关节不出力时，两连杆机械臂的方程 M(q)q̈ + C(q, q̇)q̇ + g(q) = 0（式 (17.5.3)）就是一个双摆。它是确定的，却对初始状态极其敏感：两次运动的微小差别随时间大致按指数增长，这就是混沌。", "With no joint torque, the two-link arm's equation M(q)q̈ + C(q, q̇)q̇ + g(q) = 0 (Eq. (17.5.3)) is a double pendulum. It is deterministic yet extremely sensitive to its starting state: a tiny difference between two runs grows roughly exponentially. This is chaos."]
  - ["若差别按 δ(t) ≈ δ₀e^{λt} 增长，差别达到 Δ 所需的时间为 t ≈ (1/λ) ln(Δ/δ₀)。初始误差每缩小 10 倍，可预测的时间只增加 (ln 10)/λ。", "If the difference grows like δ(t) ≈ δ₀e^{λt}, it reaches Δ after t ≈ (1/λ) ln(Δ/δ₀). Each tenfold cut in the starting error adds only (ln 10)/λ to the time you can predict."]
  - ["摆角很小时，双摆的方程可以线性化，有两个简正模式：两根杆以同一频率振动、形状保持不变。同相模式中两根杆同方向摆，θ₂/θ₁ 是一个确定的正数。", "For small swings the double pendulum's equations can be linearised and have two normal modes, in which both rods oscillate at one frequency and keep their shape. In the in-phase mode both rods swing the same way and θ₂/θ₁ is a fixed positive number."]
步骤:
  - ["选“断电的机械臂”，k 依次取 −1、−2、…、−9，各运行一次，记下“末端相差超过 10 cm 的时刻”，填入表 1。", "Choose “Unpowered robot arm”; run with k = −1, −2, …, −9 in turn and record the time the ends are 10 cm apart in Table 1."]
  - ["找出能在 5 s 内预测末端位置的最大误差，设定后运行，提交（任务 1）。以 k 为横坐标、分开的时刻为纵坐标作图，估计 (ln 10)/λ。", "Find the largest error that still lets you predict the end for 5 s, run with it and submit (task 1). Plot the parting time against k and estimate (ln 10)/λ."]
  - ["选“双摆”，θ₁ 取 5°，θ₂ 从 5° 起逐步增大，每次运行观察两根杆是否始终同方向摆、形状不变。定量的判断办法：上杆每次过竖直（θ₁ = 0）时读 θ₂，简正模式下 θ₂ 也应同时接近 0；θ₂ 偏离越大，说明混进了另一个模式。找到后提交（任务 2），把 θ₂/θ₁ 填入表 2。", "Choose “Double pendulum”, set θ₁ = 5° and raise θ₂ from 5° in steps; after each run, watch whether the rods always swing together without changing shape. To judge it quantitatively, read θ₂ each time the upper rod passes vertical (θ₁ = 0): in a normal mode θ₂ should be close to 0 at the same moment; the further it is off, the more of the other mode is mixed in. Once found, submit (task 2) and enter θ₂/θ₁ in Table 2."]
  - ["保持简正模式的设定，记下上杆第 1 次和第 11 次由左向右越过竖直的时刻，求周期，提交（任务 3）。", "Keeping the normal-mode setting, record the 1st and 11th times the upper rod crosses vertical moving right, find the period and submit (task 3)."]
  - ["再试 θ₁ = θ₂ = 90°，观察下摆球的轨迹，与小角度时比较。", "Then try θ₁ = θ₂ = 90° and compare the lower bob's path with the small-angle case."]
