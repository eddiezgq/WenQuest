注意:
  - ["两个场景都不计摩擦。机械臂的仿真只算 10 s，10 s 内没有分开的，记为“> 10 s”。", "Neither scene has friction. The arm is simulated for 10 s only; if the ends never part, record “> 10 s”."]
  - ["双摆的角度从竖直向下量起，是两根杆各自的角（不是相对角），与机械臂的关节角不同。", "The double pendulum's angles are measured from straight down for each rod (not relative angles), unlike the arm's joint angles."]
思考题:
  - ["初始误差每缩小 10 倍，可预测的时间大约增加多少？要多预测 10 s，编码器要精确多少倍？", "Each tenfold cut in the starting error buys roughly how much more predictable time? To predict 10 s longer, how much more precise must the encoder be?"]
  - ["把同相模式的 θ₂ 改成相反的符号（θ₂/θ₁ 大小不变、取负值），双摆怎样运动？这是另一个简正模式吗？", "Flip the sign of θ₂ from the in-phase mode (same size of θ₂/θ₁, but negative). How does the double pendulum move? Is that the other normal mode?"]
  - ["真实的机械臂关节有摩擦，断电下落还是混沌的吗？既然无法预测，为什么还能用仿真来设计机械臂？", "Real arm joints have friction; is the unpowered fall still chaotic? If it cannot be predicted, why can we still design arms by simulation?"]
