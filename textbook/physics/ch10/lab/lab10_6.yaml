思考题:
  - ["回收比例为什么约等于 η²，而与货物质量、速度几乎无关？如果 η 提高到 0.95，回收比例是多少？", "Why is the recovered fraction about η², nearly independent of mass and speed? What would it be with η = 0.95?"]
  - ["对重为什么取轿厢加额定载重的 45% 左右？如果取加 100%，空轿厢运行时会怎样？", "Why is the counterweight the car plus about 45% of the rated load? With 100%, what happens when the car runs empty?"]
