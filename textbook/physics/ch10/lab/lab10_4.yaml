注意:
  - ["滚动阻力系数不显示，要靠测量求出；到达取货位的速度在提交后才显示。", "The rolling-resistance coefficient is not shown; you measure it. The arrival speed is shown only after you submit."]
  - ["画面竖直方向放大了 3 倍，斜段看起来比实际陡。", "The picture's vertical scale is ×3, so the incline looks steeper than it is."]
  - ["每个任务都要在当前参数下运行一次，再点“提交”。", "For each task, run once with the current settings before pressing “Submit”."]
思考题:
  - ["用两个光电门求 μ_r 时，挡光时间的读数误差对 μ_r 的影响有多大？两个光电门离得近一些好，还是远一些好？", "How much do errors in the blocking times affect μ_r? Should the two gates be closer together or further apart?"]
  - ["刚好通过圆环时，环底的支持力是重力的几倍？乘客受得了吗？真实的过山车为什么把圆环做成上小下大的“水滴形”？", "When the car just makes it round, how many times its weight is the push at the bottom? Could riders stand that? Why are real loops teardrop-shaped, tight at the top and wide at the bottom?"]
