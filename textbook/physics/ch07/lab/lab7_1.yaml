思考题:
  - ["由表 1，哪种材料的摩擦角测得最准（相对不确定度最小）？为什么摩擦角很大时，同样的角度读数误差带来的 μ_s 误差更大？", "From Table 1, which material's angle of friction gives the most precise μ_s (smallest relative uncertainty)? Why does the same angle error matter more at large angles?"]
  - ["本实验中秒表的误差是随机的，有时偏大、有时偏小。实际操作中，如果人按秒表总是开始按得晚、停止也按得晚，会产生什么样的误差？多次平均能消除它吗？怎样发现它？", "Here the stopwatch error is random, sometimes long and sometimes short. If in practice a person always starts late and stops late, what kind of error results? Does averaging remove it? How could you detect it?"]
