注意:
  - ["转台在加速，零件还需要切向的摩擦力 m r α。α = 1.0 rad/s² 时它比向心力小得多，用 μ_s = ω²r/g 计算的误差只有千分之几。", "The table is speeding up, so the part also needs a tangential friction m r α; at α = 1.0 rad/s² it is far smaller than the centripetal part, and μ_s = ω²r/g is off by only a few parts in a thousand."]
  - ["AGV 画面里各力按同一比例画，惯性力（橙）与拉力的水平分量大小相等。", "In the AGV view all forces are drawn to the same scale; the inertial force (orange) equals the horizontal part of the tension."]
  - ["杯中水面在本实验中按“刚好不过冲”处理，判定按稳定时的倾角。真实的水起步时会来回晃，最高处会超过稳定值，所以实际要比算出的时间留些余量。", "The water surface here is modelled without overshoot and the task uses the steady tilt. Real water sloshes and briefly rises above the steady value, so leave some margin over the computed time."]
  - ["每个任务都要点“提交”才判定。", "Each task is judged only when you press “Submit”."]
思考题:
  - ["在车厢里看，惯性力和拉力的水平分量平衡；在地面上看，拉力的水平分量使吊牌加速。这两种说法哪一种“对”？为什么两者算出的偏角相同？", "Inside, the inertial force balances the horizontal part of the tension; from the ground, that horizontal part accelerates the tag. Which is “right”? Why do both give the same angle?"]
  - ["转台上看，零件刚开始滑动时速度为零，为什么科里奥利力起初为零？之后它沿什么方向？", "On the table the part starts from rest relative to it, so why is the Coriolis force zero at first? Which way does it point afterwards?"]
