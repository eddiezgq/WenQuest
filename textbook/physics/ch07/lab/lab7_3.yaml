注意:
  - ["提起与平移场景中，机械臂加速 0.6 s、匀速 0.6 s、再减速 0.6 s 停下，三段都要夹住。向下运动时，所需摩擦力最大的是末尾的减速段（加速度向上）。", "In “Lift and move” the arm accelerates for 0.6 s, cruises for 0.6 s and decelerates for 0.6 s; the part must hold in all three. For a downward move the critical stage is the final deceleration (acceleration upward)."]
  - ["本实验不计安全系数，求的是理论上的最小值。实际设计时要乘以安全系数（7.1 节取 2）。", "No safety factor is used here; the values are theoretical minima. Real designs multiply by a safety factor (Section 7.1 uses 2)."]
