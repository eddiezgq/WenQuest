思考题:
  - ["如果夹爪改为沿手臂方向（径向）夹紧，转动时向心力由什么提供？所需的夹紧力会怎样变化？", "If the fingers clamped along the arm (radially), what would provide the centripetal force in the swing? How would the grip needed change?"]
  - ["双手夹书时，书越多，为什么越容易从中间掉下来？怎样用 μ_h 和 μ_b 判断从哪本书数起会先出问题？", "Why do longer rows of books tend to drop out in the middle? How do μ_h and μ_b tell you which condition fails first?"]
