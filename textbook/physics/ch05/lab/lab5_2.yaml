注意:
  - ["料盒场景中，10 次抛掷的出手误差按序号确定，对所有设置都相同，前四次正是误差范围的四个角（速度 ±2%、角度 ±3°）。", "In the tote scene the ten release errors depend only on the throw number and are the same for every setting; the first four are the corners of the error range (±2% speed, ±3° angle)."]
  - ["测速场景的判定按你自己的记录计算，不要求等于某个“标准答案”；记录在重置后保留，“清空记录”才会删除。", "The speed task is judged on your own records, not a fixed answer; the records survive a reset and are deleted only by “Clear records”."]
思考题:
  - ["表 1 中哪个出手角的落点范围最小？与所需速度最小的出手角比较。", "Which angle in Table 1 gives the smallest spread? Compare it with the angle needing the least speed."]
  - ["测速时抛的次数加倍，U 大约变为原来的多少？落点的分散主要来自什么？", "If you double the number of throws, what happens to U roughly? What mainly causes the scatter?"]
