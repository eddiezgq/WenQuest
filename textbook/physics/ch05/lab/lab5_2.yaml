    表头英文: ["Angle / (°)", "Speed needed (calc.) / (m/s)", "In the bin (of 10)", "Spread / m"]
    行: [["20", "", "", ""], ["30", "", "", ""], ["35", "", "", ""], ["45", "", "", ""], ["60", "", "", ""]]
