# 实验 34.7 的指导书与报告模板。目的、场景、参数、任务取自 lab34_7.js。
原理:
  - ["两个线圈靠互感 M = k√(L1 L2) 耦合（第 35 章）。一次侧通交流电，二次侧感应出电动势 jωM I1，向负载供电。按相量（第 36 章）写出两个回路的电压方程，就能求出两边的电流。",
     "Two coils are coupled by the mutual inductance M = k√(L1 L2) (Chapter 35). An AC current in the primary induces jωM I1 in the secondary, which feeds the load. Writing both loop equations with phasors (Chapter 36) gives both currents."]
  - 式: "Z1 I1 − jωM I2 = U1，−jωM I1 + Z2 I2 = 0（相量方程，第 36 章；M = k√(L1 L2)，式 (34.7.1)）"
  - ["耦合较弱时，线圈的感抗远大于互感的感抗，大部分电压降在漏感上。串联电容 C = 1/(ω0² L) 在谐振频率 ω0 抵消感抗（式 (34.7.2)），于是谐振时的效率为 η = ω²M²R_L/[(R2 + R_L)(R1(R2 + R_L) + ω²M²)]（式 (34.7.3)）。",
     "With weak coupling the coils' reactance far exceeds ωM and most voltage drops across leakage. A series capacitor C = 1/(ω0² L) cancels the reactance at ω0 (Eq. (34.7.2)), and at resonance η = ω²M²R_L/[(R2 + R_L)(R1(R2 + R_L) + ω²M²)] (Eq. (34.7.3))."]
步骤:
  - ["选“AGV 充电桩”，k = 0.30、85 kHz、有补偿，读出效率、负载功率和输出电压（任务 1），与式 (34.7.3) 手算比较。", "Choose “AGV charging pad”, k = 0.30, 85 kHz, compensated; read efficiency, load power and output voltage (task 1); compare with Eq. (34.7.3)."]
  - ["k 依次取 0.05、0.1、0.2、0.4、0.6，记录效率和负载功率（表 1），说明功率为什么在 k 较小时出现最大值。", "Set k to 0.05, 0.1, 0.2, 0.4, 0.6; record efficiency and load power (Table 1) and explain why the power peaks at small k."]
  - ["k = 0.30，去掉补偿，记录负载功率（任务 2）。", "With k = 0.30, remove the compensation and record the load power (task 2)."]
  - ["恢复补偿，把频率从 85 kHz 调到 80、75、70 kHz，记录负载功率（任务 3）。", "Restore the compensation and tune to 80, 75, 70 kHz; record the load power (task 3)."]
  - ["切换到“手机无线充电”，减小 k，观察效率、负载功率和一次侧电流的变化（任务 4）。这个场景模拟 Qi 一类充电板：发射端调节电压，负载功率最多 5 W，一次侧电流幅值最多 3 A。", "Switch to “Phone charging”, reduce k and watch the efficiency, load power and primary current (task 4). This scene models a Qi-type pad: the transmitter regulates its voltage so that the load gets at most 5 W and the primary current stays below 3 A peak."]
