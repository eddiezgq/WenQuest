    表头: ["k", "η 读数 / %", "η 手算 / %", "负载功率 / W"]
    表头英文: ["k", "η read / %", "η computed / %", "Load power / W"]
    行: [["0.05", "", "", ""], ["0.1", "", "", ""], ["0.2", "", "", ""], ["0.3", "", "", ""], ["0.4", "", "", ""], ["0.6", "", "", ""]]
  - 标题: ["表 2  补偿与频率（k = 0.30）", "Table 2  Compensation and frequency (k = 0.30)"]
    表头: ["补偿", "f / kHz", "η / %", "负载功率 / W"]
    表头英文: ["Compensation", "f / kHz", "η / %", "Load power / W"]
    行: [["有", "85", "", ""], ["无", "85", "", ""], ["有", "80", "", ""], ["有", "75", "", ""], ["有", "70", "", ""]]
    行英文: [["on", "85", "", ""], ["off", "85", "", ""], ["on", "80", "", ""], ["on", "75", "", ""], ["on", "70", "", ""]]
注意:
  - ["“AGV 充电桩”场景与算例 34.7.1 相同，一次侧电压只取 10 V，是按比例缩小的示例：实际 AGV 充电功率为千瓦级。功率与电压的平方成正比，效率与电压无关。", "The “AGV charging pad” scene matches Example 34.7.1 with only 10 V on the primary, a scaled-down example: real AGV chargers deliver kilowatts. Power scales with the square of the voltage; efficiency does not depend on it."]
  - ["电压、电流都是幅值；功率按 P = |I|² R/2 计算。", "Voltages and currents are amplitudes; power is P = |I|² R/2."]
  - ["一次侧电压固定为 10 V，实际充电器会按负载调节电压和频率。", "The primary voltage is fixed at 10 V; real chargers regulate voltage and frequency."]
思考题:
  - ["为什么 SAE J2954 等标准把电动汽车无线充电的频率规定在 79–90 kHz 附近，而不是用 50 Hz？", "Why do standards such as SAE J2954 put EV wireless charging near 79–90 kHz rather than at 50 Hz?"]
