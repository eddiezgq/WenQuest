  - ["画面慢放 4 倍。", "The picture runs four times slower."]
  - ["“测电机参数”场景的读数有随机误差：转速约 ±0.3%，电流约 ±0.03 A。拟合时用全部点，不要只取两个点相除。", "Readings in “Measure a motor” carry random errors of about ±0.3% in speed and ±0.03 A in current. Fit all points instead of dividing two."]
思考题:
  - ["协作机器人的“拖动示教”通常不是把端子短路，而是让驱动器主动补偿摩擦和重力。为什么？", "Cobots usually do not short the terminals for hand guiding; the drive actively compensates friction and gravity instead. Why?"]
