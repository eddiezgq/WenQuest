  - 式: "σ = Eε，E = F L₀/(A ΔL)        （式 (14.4.3)）"
  - ["引伸计直接测标距 L₀ = 50.00 mm 内的伸长量，不受夹头打滑和试样两端变形的影响。试样直径 10.00 mm。", "The extensometer measures the extension over the 50.00 mm gauge length directly, unaffected by grip slip or the specimen ends. Specimen diameter 10.00 mm."]
  - ["没有明显屈服平台的材料用 0.2% 偏移法定屈服强度：从 ε = 0.2% 处作一条斜率为 E 的直线，它与曲线的交点的应力就是 R_p0.2。", "For a material without a clear yield plateau, use the 0.2% offset: draw a line of slope E starting at ε = 0.2%; the stress where it meets the curve is R_p0.2."]
步骤:
