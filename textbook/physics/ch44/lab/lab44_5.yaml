注意:
  - ["计算区间为 0–200 nm，格点间距 0.05 nm，两端 ψ = 0；运行在波包被分开后自动停止，再久一点反射波会碰到左端。", "The domain is 0–200 nm with ψ = 0 at both ends; the run stops once the packet has split, before the reflected part reaches the left end."]
  - ["透射概率很小时（10⁻³ 以下），数值误差的影响变大，读数只看数量级。", "When the transmission is very small (below 10⁻³) numerical error matters more; read only its order of magnitude."]
思考题:
  - ["碰到势垒时，势垒左边为什么出现密集的条纹？条纹的间距与波长有什么关系？", "Why do dense fringes appear to the left of the barrier on impact? How is their spacing related to the wavelength?"]
