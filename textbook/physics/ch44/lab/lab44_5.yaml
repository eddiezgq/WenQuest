    表头: ["E / eV", "V₀ / eV", "a / nm", "透射概率", "反射概率", "平面波 T", "按波包平均的 T"]
    表头英文: ["E / eV", "V₀ / eV", "a / nm", "Transmitted", "Reflected", "Plane-wave T", "Packet-averaged T"]
    行: [["0.20", "0.30", "1.0", "", "", "", ""], ["0.15", "0.30", "1.0", "", "", "", ""], ["0.15", "0.30", "1.5", "", "", "", ""], ["0.15", "0.30", "2.0", "", "", "", ""], ["0.15", "0.30", "2.5", "", "", "", ""], ["0.35", "0.30", "1.0", "", "", "", ""], ["0.45", "0.30", "1.0", "", "", "", ""]]
  - 标题: ["表 2  栅氧化层（SiO₂，3.1 eV，0.5mₑ，电子 0.1 eV）", "Table 2  Gate oxide (SiO₂, 3.1 eV, 0.5 mₑ, electron at 0.1 eV)"]
    表头: ["厚度 / nm", "透射系数 T", "与 2 nm 之比"]
