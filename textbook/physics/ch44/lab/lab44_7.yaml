注意:
  - ["逼近曲线的样品是未知的，它的逸出功与正文算例不同。电流读数有约 3% 的随机误差，保留三位有效数字；拟合时用全部点。", "The approach-curve sample is unknown and differs from the worked example. Current readings carry about 3% random error and are given to three significant figures; fit all the points."]
  - ["恒流扫描中的电流读数有 1% 的噪声。针尖高度被限制在样品表面以上 0.05～1.5 nm（压电陶瓷的行程有限，针尖不能撞进样品）。", "The scan's current readings carry 1% noise. The tip height is kept 0.05–1.5 nm above the surface (the piezo has limited travel and the tip must not crash)."]
思考题:
  - ["实际的 STM 中，表面上不同的原子逸出功不同。恒流模式下测到的高度变化，是否一定等于表面真实的起伏？", "On a real surface different atoms have different work functions. Does the height measured in constant-current mode always equal the true topography?"]
