    表头: ["d / nm", "I / nA", "ln(I / nA)", "拟合值", "残差"]
    表头英文: ["d / nm", "I / nA", "ln(I / nA)", "Fitted", "Residual"]
    行: [["0.40", "", "", "", ""], ["0.43", "", "", "", ""], ["0.46", "", "", "", ""], ["0.49", "", "", "", ""], ["0.52", "", "", "", ""], ["0.55", "", "", "", ""], ["0.58", "", "", "", ""], ["0.61", "", "", "", ""], ["0.64", "", "", "", ""], ["0.67", "", "", "", ""], ["0.70", "", "", "", ""]]
  - 标题: ["表 2  反馈增益与跟踪误差", "Table 2  Feedback gain and tracking error"]
    表头: ["增益", "跟踪误差均方根 / pm", "针尖轨迹的样子"]
    表头英文: ["Gain", "RMS tracking error / pm", "What the trace looks like"]
