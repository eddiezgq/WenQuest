注意:
  - ["有限深势阱和双势阱在两侧各留了 20～30 nm 的阱外区域，区间两端取 ψ = 0。能量高于阱口的“态”实际上属于连续谱，读数中不计入束缚态个数。", "The finite and double wells keep 20–30 nm of barrier on each side and set ψ = 0 at the ends. ‘States’ above the well top belong to the continuum and are not counted as bound states."]
  - ["阱外区间有限，刚出现的束缚态（能级紧贴阱口、波函数伸得很远）会被区间两端“挤”高一点：第三个束缚态按解析式在 9.61 nm 出现，实验中要稍宽一点才出现。", "The domain outside the well is finite, so a state that has just become bound (close to the top, reaching far out) is pushed up a little by the ends: the third state appears at 9.61 nm analytically but at a slightly larger width here."]
  - ["有效质量在阱内外取相同值，这是简化（见 44.4 节工程师笔记）。", "The effective mass is taken equal inside and outside the well, a simplification (Section 44.4, engineer's notes)."]
思考题:
  - ["双势阱中，最低两个态一个是偶函数、一个是奇函数。若电子开始时只在左边的阱里，它会怎样运动？来回一次要多长时间（用 E₂ − E₁ 估算）？", "In the double well the two lowest states are even and odd. An electron starting in the left well only — how does it move, and how long does a round trip take (estimate from E₂ − E₁)?"]
