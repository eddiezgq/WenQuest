注意:
  - ["弹簧的劲度系数和导轨的摩擦因数都不显示，要靠测量求出。", "Neither the spring constant nor the rail's friction coefficient is shown; you measure them."]
  - ["测力计读数的误差由压缩量确定，同一个压缩量重复读数不变；换一个压缩量，误差就不同。", "The gauge error is fixed by the compression: the same compression always reads the same; another compression has another error."]
