思考题:
  - ["拟合直线的截距为什么不是零？如果强行用过原点的直线拟合，k 会偏大还是偏小？", "Why is the fitted intercept not zero? Forcing the line through the origin, would k come out larger or smaller?"]
  - ["压缩量加倍，弹簧的功变成几倍？摩擦消耗的能量变成几倍？压缩量越大，到达光电门的动能所占的比例越大还是越小？为什么？", "Doubling the compression multiplies the spring's work by what? And the friction loss? Does the fraction reaching the gate grow or shrink with the compression, and why?"]
