注意:
  - ["光电门的计时误差约 ±2 ms，同一条件下跑两次，读数会略有不同，这是测量的随机误差。", "The gates time to about ±2 ms, so two runs under the same conditions differ slightly: random measurement error."]
  - ["只有在“AGV 测试道”场景记录的数据才会画在该场景的 a–F 图上；“清空记录”只清除记录，不改变参数。", "Only runs in a scene are plotted in that scene's a–F graph; “Clear records” clears data, not settings."]
思考题:
  - ["如果测试道上有滚动阻力（第 7 章），a–F 图还是过原点的直线吗？截距表示什么？", "With rolling resistance (Chapter 7), is the a–F graph still a line through the origin? What does the intercept mean?"]
