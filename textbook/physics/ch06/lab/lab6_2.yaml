注意:
  - ["本实验取静摩擦因数与动摩擦因数相等（μ_s = μ_k = μ），第 7 章再区分两者。", "This lab takes the static and kinetic coefficients equal (μ_s = μ_k = μ); Chapter 7 separates them."]
  - ["实验左侧画面的镜头跟随 AGV，地面的纹路向后移动表示车在前进。", "The camera on the left follows the AGV; the floor pattern moving back shows the AGV moving forward."]
  - ["吊环的摆动有阻尼，读最大前倾角时要等它稳定后再读一次稳定角，二者都记下。", "The strap swing is damped; note both the largest angle and the steady angle."]
思考题:
  - ["实际的 AGV 会把正常刹车的减速度设得远小于 μg，只在急停时才用大减速度。为什么还要给货箱加挡板或绑带？", "Real AGVs brake far below μg except in an emergency stop. Why are crates still fenced or strapped?"]
