# 实验 6.2 的指导书与报告模板（构建时生成 Word 文件）。目的、场景、参数、任务取自 lab6_2.js。
原理:
  - ["牛顿第一定律：物体不受外力（或合力为零）时，保持静止或匀速直线运动。AGV 刹车时，货箱如果不受向后的力，就会以原来的速度继续前进；在地面参考系里，货箱并没有“被推向前”，而是车板从它下面减速了。",
     "Newton's first law: with no net force, a body stays at rest or keeps moving uniformly in a straight line. When the AGV brakes, the crate keeps its speed unless something pushes it backwards; in the ground frame it is not pushed forward — the deck slows down underneath it."]
  - ["能让货箱随车一起减速的，只有车板对它的静摩擦力，其最大值为 μ_s m g（第 7 章）。所以货箱不滑的条件是刹车减速度不超过 μ_s g。",
     "Only static friction from the deck can slow the crate with the AGV; its largest value is μ_s m g (Chapter 7). So the crate does not slide as long as the deceleration does not exceed μ_s g."]
  - 式: "a ≤ μ_s g ⇒ 不滑；a > μ_s g ⇒ 滑动，相对车板滑过 Δx = v₀²/(2μg) − v₀²/(2a)        (6.2.2)"
  - ["公交车里的吊环：刹车时在车厢里看，吊环稳定在 tan θ = a/g 的倾角上。这一倾角在地面参考系里同样能由牛顿第二定律求出（第 7 章非惯性系一节再讨论车厢里的看法）。",
     "The bus hand strap: seen in the bus while braking, it settles at tan θ = a/g. The same angle follows from Newton's second law in the ground frame (Chapter 7 discusses the view from inside the bus)."]
步骤:
  - ["打开实验 6.2，选“AGV 急停”。保持 v₀ = 1.5 m/s、μ = 0.30，先把刹车减速度设为 1.0 m/s²，点“开始刹车”，观察货箱是否滑动，记入表 1。",
     "Open Lab 6.2, choose “AGV emergency stop”. With v₀ = 1.5 m/s and μ = 0.30, set the deceleration to 1.0 m/s², press “Brake now”, see whether the crate slides and enter it in Table 1."]
  - ["依次把减速度设为 2.0、2.8、2.9、3.0、4.0、5.0 m/s²，每次记录是否滑动和滑过的距离。找出刚开始滑动的减速度，与 μg 比较（任务 2）。",
     "Repeat with 2.0, 2.8, 2.9, 3.0, 4.0, 5.0 m/s²; record each time whether it slides and how far. Find the deceleration where sliding begins and compare it with μg (task 2)."]
  - ["对 a = 5.0 m/s² 一次，用式 (6.2.2) 手算滑过的距离，与读数比较；对照右侧两条速度—时间曲线，说明两条曲线之间的面积表示什么（参看正文图 6.2.2）。",
     "For a = 5.0 m/s², compute the slide with Eq. (6.2.2) and compare with the reading; using the two velocity–time curves, explain what the area between them represents (see Figure 6.2.2 in the text)."]
  - ["改 μ = 0.50，重复第 2 步的几个关键值，验证临界减速度随 μ 成正比。",
     "Set μ = 0.50 and repeat the key values of step 2 to confirm that the critical deceleration is proportional to μ."]
  - ["切换到“公交车急刹”，把减速度从 1 m/s² 逐步加大，记录吊环的最大前倾角，与 arctan(a/g) 比较（任务 3）。",
     "Switch to “A bus brakes”, increase the deceleration from 1 m/s² step by step, record the largest strap angle and compare it with arctan(a/g) (task 3)."]
