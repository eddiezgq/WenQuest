# 实验 6.6 的指导书与报告模板。目的、场景、参数、任务取自 lab6_6.js。
原理:
  - ["整体法：把 AGV 和料车看成一个系统，挂钩的拉力是内力，两两抵消，所以 a = F/(m₀ + m₁ + m₂ + …)。",
     "Whole system: treat the AGV and carts as one system; coupler forces are internal and cancel in pairs, so a = F/(m₀ + m₁ + m₂ + …)."]
  - ["隔离法：把挂钩后面的所有车隔离出来，水平方向只受这个挂钩的拉力，所以第 k 个挂钩的拉力等于它后面所有车的质量之和乘以 a。最靠近 AGV 的挂钩拉的车最多，拉力最大。",
     "Isolation: cut the train at a coupler; everything behind it is pulled only by that coupler, so the k-th coupler carries the total mass behind it times a. The coupler next to the AGV pulls the most and carries the most."]
  - 式: "F_T1 = (m₁ + m₂ + …) a,   F_T2 = (m₂ + …) a        (6.6.2)"
  - ["阿特伍德机（阿特伍德 1784 年用来演示匀加速运动，这里用来测 g）：绳和滑轮都是理想的（无质量、无摩擦），计时误差约 ±0.01 s。对 m₁、m₂ 分别列牛顿第二定律，得 a = (m₂ − m₁) g/(m₁ + m₂)。由下落高度 h 和时间 t，a = 2h/t²，从而 g = a (m₁ + m₂)/(m₂ − m₁)。",
     "Atwood machine (used by Atwood in 1784 to demonstrate uniform acceleration; here to measure g): ideal string and pulley (massless, frictionless), timing error about ±0.01 s. Newton's second law for m₁ and m₂ gives a = (m₂ − m₁) g/(m₁ + m₂). From the fall h and time t, a = 2h/t², hence g = a (m₁ + m₂)/(m₂ − m₁)."]
  - 式: "a = (m₂ − m₁) g/(m₁ + m₂),   F_T = 2 m₁ m₂ g/(m₁ + m₂)        (6.6.4)"
步骤:
  - ["选“AGV 牵引料车”，料车数 2，驱动力 200 N，点“开始”。读出加速度和两个挂钩的拉力，与式 (6.6.2) 的手算比较，记入表 1（任务 1）。",
     "Choose “AGV tows carts”, 2 carts, 200 N, press “Start”. Read the acceleration and both tensions, compare with Eq. (6.6.2) and record in Table 1 (task 1)."]
  - ["逐步加大驱动力，找出不脱钩的最大驱动力，并与 F_max = 150 N × (总质量)/(m₁ + m₂) 的手算比较（任务 2）。",
     "Increase the force step by step, find the largest one that does not break a coupler, and compare with F_max = 150 N × (total mass)/(m₁ + m₂) (task 2)."]
  - ["料车数改为 3，求不脱钩的最大驱动力；再故意超过它，看哪一个挂钩先脱开，解释原因（任务 3）。",
     "With 3 carts, find the largest safe force; then exceed it on purpose, see which coupler breaks first, and explain (task 3)."]
  - ["切换到“阿特伍德机”，取 m₁ = 1.00 kg，m₂ 依次为 1.05、1.10、1.20 kg，读出下落 1 m 的时间 t，算出 a 和 g，记入表 2（任务 4）。",
     "Switch to “Atwood machine”; with m₁ = 1.00 kg and m₂ = 1.05, 1.10, 1.20 kg, read the time to fall 1 m, compute a and g, and record in Table 2 (task 4)."]
