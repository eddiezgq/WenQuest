注意:
  - ["本实验不计滚动阻力和滑轮的质量与摩擦，第 7 章和第 12 章再计入。", "Rolling resistance and the pulley's mass and friction are neglected; Chapters 7 and 12 include them."]
  - ["脱开的料车在本实验中靠惯性匀速滑行；实际中它会在滚动阻力作用下慢慢停下。", "A broken-off cart coasts at constant speed here; in reality rolling resistance slowly stops it."]
思考题:
  - ["阿特伍德机里两边质量越接近，下落越慢、计时越准，但 m₂ − m₁ 的相对误差会变大。怎样选两边的质量最合适？", "In the Atwood machine nearly equal masses make the fall slow and easy to time, but make the relative error of m₂ − m₁ larger. How would you choose the masses?"]
