注意:
  - ["每个任务都要点“提交”才判定。“开始”只用来观看运动。", "Each task is judged only when you press “Submit”; “Start” just shows the motion."]
  - ["防摆场景按单摆方程计算，没有作小角近似，也不计空气阻力，停车后货物会一直摆下去。", "The anti-sway scene solves the full pendulum equation without the small-angle approximation and without air drag, so the load keeps swinging after the stop."]
思考题:
  - ["AGV 场景中，若要求 5 s 内到站，在两个限制之内能做到吗？要放宽哪一个限制？", "Can the AGV reach the station within 5 s inside both limits? Which limit would have to be relaxed?"]
  - ["由表 2 画出残余摆幅与名义上升时间的关系。上升时间与摆动周期 2π√(L/g) 相当时，摆幅降到了梯形曲线的百分之几？为什么上升时间较长时实际峰值加速度达不到 0.50 m/s²？", "Plot the residual swing against the rise time from Table 2. How small is the swing when the rise time is comparable with the period 2π√(L/g)?"]
