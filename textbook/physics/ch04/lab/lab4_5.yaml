注意:
  - ["读数的误差按频率和序号确定，同一个频率的读数不变。当地的 g 和拟合结果都不显示；任务 1、2 只看你提交的 g 和 U 是否与这组读数的拟合一致。", "The reading errors are fixed by the frequency and the image number. Neither the local g nor the fit is shown; tasks 1 and 2 only check that your g and U agree with the fit to the readings."]
  - ["不同频率的拟合结果会有差别，这正是不确定度的含义：它们应在各自的不确定度范围内一致。", "Fits at different frequencies differ; that is what uncertainty means. They should agree within their uncertainties."]
  - ["每个任务都要点“提交”才判定。", "Each task is judged only when you press “Submit”."]
思考题:
  - ["如果把 v₀ 当作零，只拟合 y = ½gt²，结果会怎样？用表 1 的数据试一试。", "What happens if you take v₀ = 0 and fit y = ½gt² only? Try it with Table 1."]
  - ["读数个数加倍，u(g) 大约减小到原来的多少？为什么不能靠无限提高频率把不确定度降到零？", "Doubling the number of readings shrinks u(g) by roughly what factor? Why can't a higher and higher frequency drive the uncertainty to zero?"]
