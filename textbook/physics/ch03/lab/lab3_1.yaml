# 实验 3.1 的指导书与报告模板。目的、场景、参数、任务取自 lab3_1.js。
原理:
  - ["速度是位置对时间的导数。只有一串采样读数时，用差商近似导数：前向差分 [x(t + h) − x(t)]/h 的截断误差与 h 成正比，中心差分 [x(t + h) − x(t − h)]/(2h) 的截断误差与 h² 成正比。读数有分辨率或随机误差 δ 时，这部分误差被除以 h 放大，约为 δ/h。两者相加，存在一个最佳步长（3.1.4 节）。",
     "Speed is the time derivative of position. From sampled readings use difference quotients: the truncation error of the forward difference grows like h, that of the central difference like h². A reading error δ (resolution or noise) is amplified to about δ/h. The sum has a best step (Section 3.1.4)."]
  - 式: "v ≈ [x(t + h) − x(t − h)]/(2h)        (3.1.3)"
  - ["电荷量是电流对时间的积分（安时积分）。左矩形和把每段内的电流当作段起点的值；梯形法把相邻两点连成直线，误差与 Δt² 成正比。电流上升时，左矩形和总是偏小。采样间隔要比电流变化的时间尺度短得多，否则会漏掉变化，误差忽大忽小，碰巧准确也不可信（3.3、3.4 节）。",
     "Charge is the time integral of current (coulomb counting). Left rectangles take each interval's starting value; the trapezoid rule joins neighbouring samples with straight lines, and its error grows like Δt². While the current rises, left rectangles always come out low. The interval must be much shorter than the time scale of the current's changes, or the changes are missed and the error jumps about; a lucky small error cannot be trusted (Sections 3.3 and 3.4)."]
  - 式: "Q = ∫I dt ≈ Δt [I₀/2 + I₁ + … + I_{n−1} + I_n/2]        (3.3.1)、(3.4.4)"
步骤:
  - ["选“编码器求速度”，方法取 0（前向差分）。n 从 1 起逐步加大，把速度的方均根误差填入表 1，找出误差最小的 n（任务 1）。", "Choose the encoder, method 0 (forward). Increase n from 1, enter the RMS error in Table 1 and find the n with the smallest error (task 1)."]
  - ["方法改为 1（中心差分），重复上一步（任务 2）。在双对数坐标纸上画出两种方法的误差与 h 的关系，标出两条直线段的斜率。", "Switch to method 1 (central) and repeat (task 2). Plot both errors against h on log–log paper and mark the slopes of the straight parts."]
  - ["选“安时积分”，方法取 1（梯形法）。从 Δt = 0.5 s 起逐步加大，记录相对误差，找出误差不超过 0.1% 的最大采样间隔（任务 3）；再改用左矩形和，比较（任务 4）。", "Choose coulomb counting, rule 1 (trapezoid). Increase Δt from 0.5 s, record the relative error and find the largest interval within 0.1% (task 3); then compare with left rectangles (task 4)."]
  - ["选“手机测步行速度”，改变半窗口 w，记录方均根误差，找出误差最小的 w（任务 5）；观察窗口大时停下、起步的过程变成什么样子。", "Choose the phone. Vary the half-window w, record the RMS error and find the best w (task 5); see what a large window does to the stop and the restart."]
数据表:
  - 标题: ["表 1  编码器：速度的方均根误差与步长", "Table 1  Encoder: RMS speed error against step"]
    表头: ["n", "h / ms", "前向差分 / (m/s)", "中心差分 / (m/s)"]
    表头英文: ["n", "h / ms", "Forward / (m/s)", "Central / (m/s)"]
    行: [["1", "10", "", ""], ["2", "20", "", ""], ["5", "50", "", ""], ["10", "100", "", ""], ["20", "200", "", ""], ["40", "400", "", ""], ["最佳 n", "", "", ""]]
  - 标题: ["表 2  安时积分：相对误差与采样间隔", "Table 2  Coulomb counting: relative error against interval"]
    表头: ["Δt / s", "梯形法 / %", "左矩形和 / %", "左矩形和误差 / 梯形法误差"]
    表头英文: ["Δt / s", "Trapezoid / %", "Left rectangles / %", "Ratio"]
    行: [["0.5", "", "", ""], ["1", "", "", ""], ["2", "", "", ""], ["3", "", "", ""], ["5", "", "", ""], ["10", "", "", ""]]
  - 标题: ["表 3  手机：速度的方均根误差与半窗口", "Table 3  Phone: RMS speed error against half-window"]
    表头: ["w / s", "1", "2", "4", "8", "12", "20"]
    表头英文: ["w / s", "1", "2", "4", "8", "12", "20"]
    行: [["误差 / (m/s)", "", "", "", "", "", ""]]
注意:
  - ["灰线（实际速度）和电荷量的参考值只有在仿真里才知道。真实的测量中没有“标准答案”，要靠对误差来源的分析来选步长。", "The grey true speed and the reference charge are known only in the simulation. Real measurements have no answer key; the step is chosen by analysing the sources of error."]
  - ["GPS 的随机误差按序号确定，重新打开页面读数不变。", "The GPS errors are fixed by the sample number, so the readings repeat when the page is reopened."]
思考题:
  - ["由表 1 估计：前向差分的最佳 h 与分辨率 δ、加速度大小 a 之间大约是什么关系？（提示：令 δ/h ≈ ah/2。）", "From Table 1, how does the best forward-difference h depend on the resolution δ and the acceleration a? (Hint: set δ/h ≈ ah/2.)"]
  - ["电量场景中，Δt = 5 s 和 10 s 时梯形法的误差比 4 s 时还大，而 8 s 时又变小了。为什么不能因为某个 Δt 碰巧很准就选它？", "In the battery scene the trapezoid error at Δt = 5 s and 10 s exceeds that at 4 s, yet shrinks again at 8 s. Why must you not choose an interval just because it happens to be accurate?"]
