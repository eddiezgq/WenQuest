  - ["行驶方向 φ 从 x 轴逆时针量起；坡度为负表示下坡。", "φ is measured anticlockwise from the x axis; a negative slope is downhill."]
  - ["势场导航中 AGV 每步走 5 cm，最多算 1200 步；超过还没到就判为卡住。", "The AGV moves 5 cm per step for at most 1200 steps; if it has not arrived by then it counts as stuck."]
思考题:
  - ["表 1 中坡度为零的两个方向相差多少度？它们与梯度的方向有什么关系？", "How far apart are the two level headings in Table 1, and how are they related to the gradient?"]
  - ["势场法计算量小，但会卡住。实际的 AGV 为什么要先做全局路径规划，再用局部方法避障（《机器人学》第 47 章）？", "The potential field is cheap but can get stuck. Why do real AGVs plan a global path first and use local methods only for avoidance (Robotics, Chapter 47)?"]
