# 实验 3.7 的指导书与报告模板。目的、场景、参数、任务取自 lab3_7.js。
原理:
  - ["梯度 ∇H = (∂H/∂x, ∂H/∂y) 指向 H 增加最快的方向，大小是最大的变化率，垂直于等高线。沿单位矢量 û 的变化率是方向导数 ∇H·û = |∇H| cos α，α 是 û 与梯度的夹角。地面的坡度角为 arctan(∇H·û)（3.7.3 节）。",
     "The gradient ∇H = (∂H/∂x, ∂H/∂y) points the way H increases fastest, its size is that greatest rate, and it is perpendicular to the contours. The rate along a unit vector û is the directional derivative ∇H·û = |∇H| cos α. The slope angle is arctan(∇H·û) (Section 3.7.3)."]
  - 式: "∇H·û = |∇H| cos α        (3.7.2)、(3.7.3)"
  - ["人工势场：U = ½k_a|r − g|² + 斥力项，AGV 每步沿 −∇U 走一小段（梯度下降）。∇U = 0 而又不是目标的点就是局部极小，AGV 会停在那里。给斥力加一个切向分量，使 AGV 沿障碍物绕行，是常见的改进之一（3.7.5 节）。",
     "Artificial potential field: U = ½k_a|r − g|² plus a repulsive term; each step the AGV moves a little down −∇U (gradient descent). A point other than the goal where ∇U = 0 is a local minimum, and the AGV stops there. A tangential part added to the repulsion, making the AGV circle the obstacle, is one common fix (Section 3.7.5)."]
步骤:
  - ["选“土丘上的坡度”，机器人在 (5, 3)。记下梯度的两个分量，计算 |∇H| 和最陡的坡度角，与读数比较。", "Choose the hill with the robot at (5, 3). Note the gradient components, compute |∇H| and the steepest slope angle, and compare with the readout."]
  - ["φ 每隔 30° 记一次坡度，填入表 1，在同一张图上画出坡度的正切与 |∇H| cos α 的关系。找出坡度在 5°～15° 之间的上坡方向（任务 1）和坡度几乎为零的方向（任务 2）。", "Record the slope every 30° of φ in Table 1 and plot its tangent against |∇H| cos α. Find an uphill heading with slope 5°–15° (task 1) and a level heading (task 2)."]
  - ["选“势场导航”。先用默认值让 AGV 到达目标（任务 3）。再把目标的 y_g 从 0.3 m 逐步调到 4.6 m，记下哪些位置 AGV 会卡住（任务 4），填入表 2。", "Choose potential-field navigation. Reach the goal with the defaults (task 3). Then move y_g from 0.3 m to 4.6 m and note where the AGV gets stuck (task 4) in Table 2."]
  - ["目标在墙后时加绕行分量，看能否绕出来（任务 5）；改变斥力强度 k_r，看离立柱最近的距离怎样变化。", "With the goal behind the wall add swirl and see whether the AGV escapes (task 5); vary k_r and watch the closest distance to a pillar."]
  - ["选“雨水往哪里流”，移动落点，找出流进东边小水塘的区域（任务 6），在草图上大致画出分水岭。", "Choose the rain scene, move the landing point, find the region that drains into the small east pond (task 6) and sketch the watershed."]
