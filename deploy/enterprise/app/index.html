<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WenQuest Industrial Software</title>
<style>
  :root { color-scheme: light dark; --bg:#f7f8fa; --fg:#14202a; --muted:#5c6b75; --card:#fff; --line:#d6dbe1; --accent:#0f766e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b141a; --fg:#e6edf1; --muted:#9aa8b1; --card:#122029; --line:#23343f; --accent:#2dd4bf; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, sans-serif; }
  main { max-width:880px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:28px; margin:0 0 6px; } p { color:var(--muted); margin:0 0 24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:12px; }
  a.card { display:block; padding:16px; background:var(--card); border:1px solid var(--line); border-radius:12px; color:inherit; text-decoration:none; }
  a.card:hover { border-color:var(--accent); } a.card b { display:block; color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>WenQuest Industrial Software</h1>
  <p>Design and engineering tools for companies. Sign in with your WenQuest account.</p>
  <div class="grid">
    <a class="card" href="/cam/"><b>WenQuest Cam</b>Cam design and analysis</a>
    <a class="card" href="/bearing/"><b>WenQuest Bearing</b>Bearing selection and calculation</a>
    <a class="card" href="/eda/"><b>WenQuest Electronics</b>Circuit board and chip design</a>
    <a class="card" href="https://qms.wenquestrobotics.com/"><b>WenQuest Ops</b>Quality-centered AI ERP</a>
  </div>
</main>
</body>
</html>
