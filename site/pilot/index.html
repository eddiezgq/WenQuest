<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>WenQuest Ops pilot</title>
<!-- 第 97 轮：问渠质量 ERP 试点企业凭邀请链接注册（脚本 /pilot.js，国内版官网同一份） -->
<style>
  :root { --paper:#f4f2ec; --surface:#fcfbf8; --ink:#121c21; --muted:#56656b; --line:#d6d2c6; --accent:#0e6c63; --red:#c2412d; }
  @media (prefers-color-scheme: dark) { :root { --paper:#0f181c; --surface:#132229; --ink:#e6ecee; --muted:#93a3a9; --line:#2a3a41; --accent:#4fd1c1; --red:#f07a66; } }
  body { margin:0; background:var(--paper); color:var(--ink); font:400 16px/1.7 "IBM Plex Sans","Noto Sans SC","PingFang SC",system-ui,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:32px 16px 64px; }
  .top a { color:var(--muted); text-decoration:none; font-size:14px; }
  h1 { font-size:28px; line-height:1.3; margin:24px 0 10px; }
  .lead { color:var(--muted); }
  .pl-form { display:grid; gap:14px; margin-top:20px; }
  .pl-form label { display:grid; gap:6px; font-weight:600; font-size:15px; }
  .pl-form input { font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink); }
  .pl-code { display:flex; gap:10px; align-items:end; flex-wrap:wrap; }
  .pl-code label { flex:1 1 160px; }
  .btn { font:600 15px/1 inherit; padding:12px 16px; border-radius:6px; border:1px solid var(--accent); background:none; color:var(--accent); cursor:pointer; }
  .btn.solid { background:var(--accent); color:var(--surface); }
  .btn:disabled { opacity:.5; cursor:default; }
  .pl-hint { margin:-6px 0 0; color:var(--muted); font-size:14px; word-break:break-all; }
  .pl-err { color:var(--red); min-height:1.4em; }
  .pl-ok { color:var(--accent); min-height:1.4em; }
  .pl-status { font-size:18px; }
  a { color:var(--accent); word-break:break-all; }
</style>
</head>
<body>
<main>
<div class="top"><a href="/">← WenQuest</a></div>
<div id="pilot"><p>Opening the invitation…</p></div>
</main>
<script src="/pilot.js" defer></script>
</body>
</html>
