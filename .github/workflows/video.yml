# 公开课视频（第 22 轮）：手动触发。讲稿在 docs/课程视频/<课>/<节>/讲稿.yaml，工具在 tools/video/。
#   task = audition：用 Eddie 的样音在租用的 GPU 上试合成同一段中英文（Fun-CosyVoice3 与 CosyVoice2 各一份），供试听选定
#   task = render  ：做成片（中英两版，字幕、封面、上传资料）。voice = kokoro（开源占位声音）或 clone（Eddie 本人声音，先在 GPU 上合成）
# 结果在本次运行页面的 Artifacts 里下载（保留 14 天）。upload = youtube 时英文版私密上传到 YouTube（要 YT_* 三个密钥）；
# B 站开放平台批下来之前，中文版由 Eddie 从 Artifacts 下载后自己上传。
# 需要的仓库密钥：VOICE_KEY（样音密码）；clone 和 audition 还要 LAMBDA_KEY、LAMBDA_SSH_KEY_NAME、LAMBDA_SSH_PRIVATE_KEY（与 GPU 实测相同）。
name: Lecture videos 公开课视频
on:
  workflow_dispatch:
    inputs:
      task:
        description: "audition（试听）或 render（成片）"
        type: choice
        options: [render, audition, ytcheck]
        default: render
      lectures:
        description: "讲稿目录，空格分隔（如 docs/课程视频/线性代数/14-2）"
        required: false
        default: "docs/课程视频/线性代数/14-2"
      voice:
        description: "配音：kokoro（占位）或 clone（本人声音）"
        type: choice
        options: [kokoro, clone]
        default: kokoro
      engine:
        description: "克隆模型：cv3（Fun-CosyVoice3）或 cv2（CosyVoice2）"
        type: choice
        options: [cv2, cv3]
        default: cv2
      upload:
        description: "做完后上传：none（只出文件）或 youtube（英文版私密上传到 YouTube）"
        type: choice
        options: [none, youtube]
        default: none
      lang:
        description: "语言"
        type: choice
        options: [both, zh, en]
        default: both
permissions:
  contents: write          # 预览图与上传资料（文字）提交回仓库
# 不同讲、不同任务各排各的队（同一组里新排队的会把旧的排队挤掉，所以按讲稿目录和任务分组）
concurrency:
  group: lecture-video-${{ inputs.task }}-${{ inputs.lectures }}
  cancel-in-progress: false

jobs:
  voice:
    if: inputs.task == 'audition' || inputs.voice == 'clone'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Speak with Eddie's voice on a rented GPU（合成完即关机）
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
          LAMBDA_KEY: ${{ secrets.LAMBDA_KEY || secrets.WQ_GPU_LAMBDA_KEY }}     # 学生 GPU 实验的 Lambda 账号也可以
          LAMBDA_SSH_KEY_NAME: ${{ secrets.LAMBDA_SSH_KEY_NAME }}
          SSH_PRIVATE: ${{ secrets.LAMBDA_SSH_PRIVATE_KEY }}                   # 没有时临时生成一对密钥，用完从 Lambda 删掉
        run: |
          test -n "$VOICE_KEY" || { echo "::error::没有设置 VOICE_KEY"; exit 1; }
          test -n "$LAMBDA_KEY" || { echo "::error::没有设置 LAMBDA_KEY 或 WQ_GPU_LAMBDA_KEY"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q pyyaml numpy scipy matplotlib sympy
          if [ -n "$SSH_PRIVATE" ] && [ -n "$LAMBDA_SSH_KEY_NAME" ]; then
            install -m 600 /dev/null "$RUNNER_TEMP/gpu_key" && printf '%s\n' "$SSH_PRIVATE" > "$RUNNER_TEMP/gpu_key"
            export LAMBDA_SSH_KEY_FILE="$RUNNER_TEMP/gpu_key"
          fi
          log="$RUNNER_TEMP/voice.log"
          set +e
          if [ "${{ inputs.task }}" = audition ]; then
            python -u tools/video/clone.py audition --out "$RUNNER_TEMP/clone" > "$log" 2>&1
          else
            python -u tools/video/clone.py lectures ${{ inputs.lectures }} --engine ${{ inputs.engine }} --out "$RUNNER_TEMP/clone" > "$log" 2>&1
          fi
          code=$?
          set -e
          cat "$log"
          # 运行日志（去掉 IP）放回仓库，便于在会话里查原因；试听结果加密后也放回，Claude 解密后发给 Eddie
          mkdir -p docs/课程视频/运行日志
          sed -E 's/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/x.x.x.x/g' "$log" | tail -n 400 > "docs/课程视频/运行日志/voice-${{ github.run_id }}.txt"
          if [ "${{ inputs.task }}" = audition ] && [ "$code" = 0 ]; then
            mkdir -p docs/课程视频/声音样本/试听
            for f in $(find "$RUNNER_TEMP/clone" -name '*.wav'); do
              rel=$(echo "${f#$RUNNER_TEMP/clone/}" | tr '/' '_')
              ffmpeg -y -loglevel error -i "$f" -b:a 96k "$RUNNER_TEMP/${rel%.wav}.mp3"
              openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/${rel%.wav}.mp3" -out "docs/课程视频/声音样本/试听/${rel%.wav}.mp3.enc" -pass env:VOICE_KEY
            done
            cp "$RUNNER_TEMP/clone/prompts.json" docs/课程视频/声音样本/试听/提示音文字.json 2>/dev/null || true
          fi
          git config user.name "WenQuest video"; git config user.email "noreply@wenquestrobotics.com"
          git add docs/课程视频 && git commit -q -m "公开课视频：声音合成运行记录 ${{ github.run_id }}" && { git pull -q --rebase origin main && git push -q origin HEAD:main; } || true
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.task == 'audition' && 'audition' || 'voice-clone' }}
          path: ${{ runner.temp }}/clone
          retention-days: 14

  ytcheck:
    if: inputs.task == 'ytcheck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the YouTube authorisation（只查频道，不上传）
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          pip install -q google-api-python-client google-auth
          sh tools/video/logged.sh python tools/video/upload_youtube.py check

  render:
    needs: voice
    if: always() && inputs.task == 'render' && (needs.voice.result == 'success' || needs.voice.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tools (Manim, LaTeX, fonts, ffmpeg, Chromium, Kokoro)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk fonts-dejavu ffmpeg libpango1.0-dev libcairo2-dev pkg-config \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm cm-super > /dev/null
          pip install -q manim==0.21.0 sherpa-onnx pyyaml numpy scipy matplotlib sympy schemdraw==0.23 python-docx==1.2.0 markdown-it-py jsonschema Pillow httpx fastapi pydantic
          pip install -q -r services/labcheck/requirements.txt
          python -m playwright install --with-deps --only-shell chromium > /dev/null
          (cd textbook/tools && npm ci --no-audit --no-fund > /dev/null)
          sh services/voice/fetch_models.sh "$RUNNER_TEMP/models" > /dev/null
      - name: Build the book's figures and lab pages（视频里用到的节）
        run: |
          for d in ${{ inputs.lectures }}; do python -c "import yaml,sys; y=yaml.safe_load(open(sys.argv[1]+'/讲稿.yaml')); print(y['book'], y['section'])" "$d"; done > "$RUNNER_TEMP/sections"
          cd textbook
          for b in $(cut -d' ' -f1 "$RUNNER_TEMP/sections" | sort -u); do
            [ -d "web-editions/$b" ] && continue   # 网页版教材（第 23 轮，如 sewing）：视频工具直接用源文件，不用构建
            secs=$(awk -v b="$b" '$1==b{print $2}' "$RUNNER_TEMP/sections" | paste -sd, -)
            sh ../tools/video/logged.sh python tools/build.py "$b" --only "$secs"
          done
      - uses: actions/download-artifact@v4
        if: inputs.voice == 'clone'
        with:
          name: voice-clone
          path: ${{ runner.temp }}/clone
      - name: Make the videos
        env:
          WQ_MANIM: manim
          WQ_TTS_MODELS: ${{ runner.temp }}/models
          WQ_CLONE_DIR: ${{ runner.temp }}/clone/${{ inputs.engine }}
          WQ_FOOTAGE: ${{ github.workspace }}/docs/课程视频/素材
        run: |
          for d in ${{ inputs.lectures }}; do
            name=$(basename "$d")
            sh tools/video/logged.sh python tools/video/make.py "$d" --lang ${{ inputs.lang }} --voice ${{ inputs.voice }} --out "$RUNNER_TEMP/videos/$name"
            cp "$RUNNER_TEMP/videos/$name"/work/layout_*.log "$RUNNER_TEMP/videos/$name/" 2>/dev/null || true
            rm -rf "$RUNNER_TEMP/videos/$name/work"
            # 预览（关键画面拼图）和上传资料（文字）放回讲稿目录，便于不下载视频也能检查
            mkdir -p "$d/预览"
            for lang in zh en; do
              v="$RUNNER_TEMP/videos/$name/$lang"
              [ -f "$v/lecture.mp4" ] || continue
              len=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$v/lecture.mp4")
              step=$(python -c "print(max(5, float('$len') / 24))")
              ffmpeg -y -loglevel error -i "$v/lecture.mp4" -vf "fps=1/$step,scale=640:-1,tile=4x6:padding=4" -frames:v 1 -q:v 4 "$d/预览/$lang.jpg"
              cp "$v/upload.md" "$d/预览/上传资料.$lang.md"
              cp "$v/lecture.srt" "$d/预览/字幕.$lang.srt"
              cp "$RUNNER_TEMP/videos/$name/layout_$lang.log" "$d/预览/版面.$lang.log" 2>/dev/null || true
              echo "$lang: $(python -c "t=float('$len'); print(f'{int(t//60)}:{int(t%60):02d}')")（${{ inputs.voice }}，run ${{ github.run_id }}）" >> "$d/预览/说明.txt"
            done
          done
      - name: Commit the previews
        run: |
          git config user.name "WenQuest video"
          git config user.email "noreply@wenquestrobotics.com"
          git add docs/课程视频
          git diff --cached --quiet && exit 0
          git commit -q -m "公开课视频预览：${{ inputs.lectures }}（${{ inputs.voice }}）"
          git pull -q --rebase origin main && git push -q origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: videos
          path: ${{ runner.temp }}/videos
          retention-days: 14

  upload:
    needs: render
    if: inputs.task == 'render' && inputs.upload == 'youtube' && needs.render.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: videos
          path: ${{ runner.temp }}/videos
      - name: Upload the English versions to YouTube (private until Eddie publishes)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          pip install -q google-api-python-client google-auth
          for d in "$RUNNER_TEMP"/videos/*/en; do python tools/video/upload_youtube.py "$d" --privacy private; done
