name: Build and deploy

on:
  push:
    branches: [main]
    # 数字工厂（factory/）单独运行，只改它时不重新部署学习平台
    paths-ignore:
      - "factory/**"
      - ".github/workflows/factory.yml"
      - "library/**"
      - ".github/workflows/library.yml"
      # 公开课视频（第 22 轮）单独由 video.yml 手动运行
      - "tools/video/**"
      - "docs/课程视频/**"
      - ".github/workflows/video.yml"
      # 线上诊断（只读日志）
      - ".github/workflows/diagnose.yml"
  workflow_dispatch:
  # Weekly fresh build picks up Moodle security fixes from the stable branch.
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # A stuck runner should fail, not hold the deploy queue for hours.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gateway tests
        working-directory: services/gateway
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-sim graphviz librsvg2-bin fonts-noto-cjk ffmpeg yosys > /dev/null
          pip install -q -r requirements-dev.txt && python -m pytest -q
      - name: Web server settings (Caddyfile) are valid
        run: |
          docker run --rm -v "$PWD/deploy:/d:ro" -e SITE_DOMAIN=example.com -e ACME_EMAIL=ci@example.com caddy:2 caddy validate --config /d/Caddyfile --adapter caddyfile
          # 第 34 轮：国内服务器（WQ_REGION=cn）的设置也要有效
          docker run --rm -v "$PWD/deploy:/d:ro" -e SITE_DOMAIN=example.cn -e ACME_EMAIL=ci@example.cn -e WQ_REGION=cn caddy:2 caddy validate --config /d/Caddyfile --adapter caddyfile
      - name: Pages that go live load no Google Fonts or public CDN (第 34 轮：国内访问不了)
        run: python3 tools/vendor/check_external.py
      - name: China website 问渠科技 is up to date and compliant (第 48 轮)
        run: |
          python3 tools/site_cn/build.py
          git diff --exit-code --stat -- site/cn || { echo "::error::site/cn 与 tools/site_cn 不一致：本地运行 python3 tools/site_cn/build.py 后提交"; exit 1; }
          test -z "$(git status --porcelain -- site/cn)" || { echo "::error::site/cn 有未提交的生成文件"; git status --porcelain -- site/cn; exit 1; }
          python3 tools/site_cn/check_cn.py
      - name: Cam design kernel and API tests (问渠凸轮, 第 39 轮)
        working-directory: services/cam
        run: |
          pip install -q -r requirements-dev.txt
          python -m pytest -q -rf 2>&1 | tee "$RUNNER_TEMP/cam.txt" || { grep -E "^(FAILED|ERROR)" "$RUNNER_TEMP/cam.txt" | sed 's/^/::error::/'; exit 1; }
      - name: Animator code check tests
        working-directory: services/animator
        run: pip install -q fastapi==0.141.1 pydantic==2.13.3 pytest && python -m pytest -q
      - name: Lab checker tests (headless browser runs the example lab and broken ones)
        working-directory: services/labcheck
        run: |
          pip install -q -r requirements.txt pytest httpx numpy trimesh
          python -m playwright install --with-deps --only-shell chromium
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk > /dev/null
          # 失败的测试写成注释（annotation），不下载日志也能看到是哪一条
          set -o pipefail
          python -m pytest -q -rf 2>&1 | tee "$RUNNER_TEMP/labcheck.txt" || { grep -E "^FAILED" "$RUNNER_TEMP/labcheck.txt" | sed 's/^/::error::/'; exit 1; }
      - name: Verilog synthesis service tests (inside its own image, with the Yosys that goes live)
        working-directory: services/micro-synth
        run: |
          docker build -q -t wq-micro-synth:test .
          docker run --rm -u root -v "$PWD:/t" -w /t wq-micro-synth:test sh -c "pip3 install -q pytest httpx && python3 -m pytest -q -p no:cacheprovider"
      - name: Voice service tests (speech synthesis and recognition with the real models)
        working-directory: services/voice
        run: |
          ./fetch_models.sh "$RUNNER_TEMP/voice-models"
          pip install -q -r requirements.txt pytest httpx
          VOICE_MODELS="$RUNNER_TEMP/voice-models" python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web app tests and builds (web + WeChat mini program)
        working-directory: apps/web
        run: npm ci --no-audit --no-fund && npm test && npm run build:h5 && npm run build:mp-weixin

  # 教材：每本书一个并行任务（第 10 轮）。书越来越多，串行构建超过 40 分钟的限制，所以按书拆开。
  books:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        name: The books to check — only those changed since the last successful deploy (第 32 轮附：省时间、省用量)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          all=$(ls textbook/*/book.yaml | xargs -n1 dirname | xargs -n1 basename | tr "\n" " ")
          base=""
          if [ "$EVENT" = "push" ]; then
            base=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null || true)
            git cat-file -e "$base^{commit}" 2>/dev/null || base=""
          fi
          if [ -z "$base" ]; then
            echo "Checking every book ($EVENT run, or no earlier successful deploy found)."
            changed="ALL"
          else
            changed=$(git diff --name-only "$base" HEAD)
            echo "Changed since $base:"; echo "$changed" | head -n 40
          fi
          CHANGED="$changed" python3 -c '
          import json, os, sys
          books = sys.argv[1].split()
          changed = os.environ["CHANGED"]
          shared = ("textbook/tools/", "services/labcheck/", "services/gateway/app/production/labkit/", "factory/")
          if changed == "ALL":
              pick = books
          else:
              files = [f for f in changed.splitlines() if f.strip()]
              if any(f.startswith(shared) for f in files):
                  pick = books
              else:
                  pick = [b for b in books if any(f.startswith(f"textbook/{b}/") for f in files)]
          print("Books to check:", pick or "none", file=sys.stderr)
          print("list=" + json.dumps(pick))
          ' "$all" >> "$GITHUB_OUTPUT"

  textbook:
    needs: books
    if: needs.books.outputs.list != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 150      # 《机器人学》全书检查已超过 60 分钟（10-07 起每次部署都卡在这里超时，什么都没上线）
    strategy:
      fail-fast: false
      matrix:
        book: ${{ fromJson(needs.books.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: CUDA library headers for the compile check (《人工智能》; cached, the wheels are large)
        if: matrix.book == 'ai'
        uses: actions/cache@v4
        with:
          path: ~/.cache/wq-cuda-headers
          key: wq-cuda-headers-v1
      - name: Textbook build and checks (programs, numbers, formulas, references, terms) — ${{ matrix.book }}
        working-directory: textbook/tools
        run: |
          set -o pipefail
          sudo apt-get update -qq
          # 《机械设计》的有限元与疲劳程序调用数字工厂的 cae、sim（第 11 轮）：CalculiX、gmsh（要 libGLU 等）、pyLife
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk ffmpeg calculix-ccx libglu1-mesa libxcursor1 libxft2 libxinerama1 > /dev/null
          npm ci --no-audit --no-fund
          pip install -q -r ../../services/labcheck/requirements.txt trimesh
          python -m playwright install --with-deps --only-shell chromium > /dev/null
          pip install -q python-docx==1.2.0 markdown-it-py pyyaml numpy scipy matplotlib schemdraw==0.23 jsonschema pytest httpx fastapi pydantic gmsh==4.15.2 pylife==2.3.1 paho-mqtt==2.1.0 trimesh==5.1.0 sympy mujoco==3.14.0
          if [ "${{ matrix.book }}" = mfgtech ]; then   # 三维图、三维动画、工程图：数字工厂的三维模型（build123d，第 13 轮 8.3）
            pip install -q build123d==0.13.0 Pillow
          fi
          if [ "${{ matrix.book }}" = mechdesign ]; then   # 第 33 章案例：build123d 建模、MuJoCo 机械臂动力学（数字工厂同一模型）
            pip install -q build123d==0.13.0 mujoco==3.14.0
            sh ../../factory/deploy/fetch_menagerie.sh "$RUNNER_TEMP/menagerie" > /dev/null
            export WQ_MENAGERIE="$RUNNER_TEMP/menagerie"
          fi
          if [ "${{ matrix.book }}" = ai ]; then   # 《人工智能》：CUDA 程序的编译检查（clang + NVIDIA 的头文件包）与 Numba 的 CUDA 模拟器
            pip install -q nvidia-cuda-runtime-cu12 nvidia-cuda-nvcc-cu12 nvidia-cuda-cccl-cu12 nvidia-curand-cu12 numba
            # cuBLAS（第 5 章）、NCCL（第 6 章）、cuDNN（第 7 章）：软件包很大（合计约 1.7 GB），只解出头文件，并缓存起来
            hdr=~/.cache/wq-cuda-headers
            if [ ! -f "$hdr/nvidia/cudnn/include/cudnn.h" ]; then
              pip download -q --no-deps -d "$RUNNER_TEMP/blas" nvidia-cublas-cu12 nvidia-nccl-cu12 nvidia-cudnn-cu12
              for lib in cublas nccl cudnn; do unzip -q -o "$RUNNER_TEMP"/blas/nvidia_${lib}*.whl "nvidia/$lib/include/*" -d "$hdr"; done
              rm -rf "$RUNNER_TEMP/blas"
            fi
            site="$(python -c 'import nvidia, os; print(os.path.dirname(list(nvidia.__path__)[0]))')"
            cp -r "$hdr/nvidia/." "$site/nvidia/"
            which clang++ > /dev/null || sudo apt-get install -y -qq clang > /dev/null
            # 第 10 章的 HIP 程序：用 AMD 开源的 HIP-CPU 头文件在 CPU 上编译运行、核对正确性（textbook/tools/hipcheck.py）
            pip install -q tbb-devel
            hip=~/.cache/wq/HIP-CPU
            if [ ! -f "$hip/include/hip/hip_runtime.h" ]; then   # 固定提交：这些头文件会被编进构建机上真正运行的程序
              rm -rf "$hip" && git clone -q https://github.com/ROCm/HIP-CPU.git "$hip"
              git -C "$hip" checkout -q e112c935057434897bb12d9ab3910380a8bd5f58
            fi
          fi
          if [ "${{ matrix.book }}" = robotics ]; then   # the tools' own tests run once, with the book they use
            python -m pytest -q tests 2>&1 | tee /tmp/pytest.log || { grep -E "^(FAILED|E  )" /tmp/pytest.log | head -20 | sed 's/^/::error::/'; exit 1; }
          fi
          if [ "${{ matrix.book }}" = dic ]; then   # 《数字集成电路设计》第 1 章实验由生成器嵌入微电子实验的同一模型（第 17 轮附三 6b）
            node ../../labs/micro/tools/textbook_labs.js --check
          fi
          b="${{ matrix.book }}"
          python build.py "$b" --pdf --labs 2>&1 | tee /tmp/build.log || { grep "✗" /tmp/build.log | head -20 | sed "s/^/::error::$b /"; exit 1; }
      - name: Keep the built textbook for the deploy
        uses: actions/upload-artifact@v4
        with:
          name: textbook-${{ matrix.book }}
          path: |
            textbook/build/
            !textbook/build/*/values/
            !textbook/build/*/values-en/
            !textbook/build/*/figs/
            !textbook/build/*/ch*.html

  # 网页版教材（第 15 轮）：整本网页书（textbook/web-editions/<书>/），构建成 <书>/webed/，随教材一起部署
  webeditions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools for the course packs (slides, Word files, formulas with Chinese)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          pip install -q python-pptx==1.0.2 python-docx==1.2.0 Pillow matplotlib pyyaml numpy scipy
      - name: Build the web-edition books and their course packs
        run: |
          set -e
          for d in textbook/web-editions/*/; do
            b=$(basename "$d")
            python "$d/build.py" "textbook/build/$b/webed"
            test -f "textbook/build/$b/webed/book.json"
            # 课程包（第 16 轮）：先检查每讲文件，再生成讲义、课件、实验、测验与发布清单
            if [ -f "$d/course/tools/build_course.py" ]; then
              python "$d/course/tools/check.py" all
              python "$d/course/tools/build_course.py" "textbook/build/$b/course"
              test -f "textbook/build/$b/course/manifest.json"
            fi
          done
      - name: Keep the web editions for the deploy
        uses: actions/upload-artifact@v4
        with:
          name: textbook-web-editions
          path: textbook/build/

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Image name
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${repo}/engine:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${repo}/engine:latest" >> "$GITHUB_OUTPUT"
          echo "gateway=ghcr.io/${repo}/gateway:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${repo}/web:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "animator=ghcr.io/${repo}/animator:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "labcheck=ghcr.io/${repo}/labcheck:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "voice=ghcr.io/${repo}/voice:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "microsynth=ghcr.io/${repo}/micro-synth:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "blender=ghcr.io/${repo}/blender:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "cam=ghcr.io/${repo}/cam:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push engine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: moodle/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ github.event_name == 'schedule' }}

      - name: Build and push gateway image
        uses: docker/build-push-action@v6
        with:
          context: services/gateway
          push: true
          tags: ${{ steps.meta.outputs.gateway }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: ${{ steps.meta.outputs.web }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push animator image
        uses: docker/build-push-action@v6
        with:
          context: services/animator
          push: true
          tags: ${{ steps.meta.outputs.animator }}
          cache-from: type=gha,scope=animator
          cache-to: type=gha,mode=max,scope=animator

      - name: Build and push lab checker image
        uses: docker/build-push-action@v6
        with:
          context: services/labcheck
          push: true
          tags: ${{ steps.meta.outputs.labcheck }}
          cache-from: type=gha,scope=labcheck
          cache-to: type=gha,mode=max,scope=labcheck

      - name: Build and push voice image
        uses: docker/build-push-action@v6
        with:
          context: services/voice
          push: true
          tags: ${{ steps.meta.outputs.voice }}
          cache-from: type=gha,scope=voice
          cache-to: type=gha,mode=max,scope=voice

      - name: Build and push 3D video stills image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/blender/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.blender }}
          cache-from: type=gha,scope=blender
          cache-to: type=gha,mode=max,scope=blender

      - name: Build and push cam design image (问渠凸轮, 第 39 轮)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/cam/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.cam }}
          cache-from: type=gha,scope=cam
          cache-to: type=gha,mode=max,scope=cam

      - name: Build and push Verilog synthesis image
        uses: docker/build-push-action@v6
        with:
          context: services/micro-synth
          push: true
          tags: ${{ steps.meta.outputs.microsynth }}
          cache-from: type=gha,scope=microsynth
          cache-to: type=gha,mode=max,scope=microsynth

      - name: Package the Claude plugin for manual installs
        run: cd plugins && zip -qr ../aiprovider_claude.zip aiprovider_claude -x '*/tests/*'

      - uses: actions/upload-artifact@v4
        with:
          name: aiprovider_claude
          path: aiprovider_claude.zip

  deploy:
    needs: [build, textbook, webeditions]
    # the textbook checks are skipped when no book changed: deploy anyway (the books on the server stay as they are)
    if: always() && !cancelled() && needs.build.result == 'success' && needs.webeditions.result == 'success' && (needs.textbook.result == 'success' || needs.textbook.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy settings
        run: |
          if [ -z "$HOST" ]; then
            echo "::warning::DEPLOY_HOST secret is not set; skipping deployment (image was still built)."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Set up SSH
        if: env.SKIP != '1'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -t ed25519 "$HOST" > ~/.ssh/known_hosts
          fi

      # 2026-10-25：服务器磁盘满到 99%，从 10-24 05:17 起每次部署都在“Copy deployment files”解包时失败。
      # 磁盘用到 85% 以上时先清掉能重新取回的东西：构建缓存、停用的容器、不在用且 3 天以上的镜像（回滚要用时会从 ghcr.io 重新拉）、
      # deploy 用户 /tmp 里 2 天前的文件。清理前后的用量和占地最多的地方作为注释发出来（会话里看不到任务日志）。
      - name: Free disk space when the server is nearly full
        if: env.SKIP != '1'
        continue-on-error: true
        run: |
          used=$(ssh "deploy@$HOST" "df -P / | awk 'NR==2 {sub(\"%\", \"\", \$5); print \$5}'")
          echo "Server disk used before: ${used}%"
          if [ "${used:-0}" -ge 85 ]; then
            ssh "deploy@$HOST" 'set +e
              docker builder prune -af >/dev/null 2>&1
              docker container prune -f >/dev/null 2>&1
              docker image prune -af --filter "until=72h" >/dev/null 2>&1
              find /tmp -maxdepth 1 -user "$(id -un)" -mtime +2 -exec rm -rf {} + 2>/dev/null
              echo "--- docker"; docker system df 2>/dev/null
              echo "--- /opt/wenquest"; du -xsh /opt/wenquest/* 2>/dev/null | sort -h | tail -n 8
              echo "--- largest under /var/lib/docker/volumes"; du -xsh /var/lib/docker/volumes/* 2>/dev/null | sort -h | tail -n 5' > /tmp/disk.txt 2>&1 || true
            after=$(ssh "deploy@$HOST" "df -P / | awk 'NR==2 {sub(\"%\", \"\", \$5); print \$5}'")
            echo "Server disk used after: ${after}%"
            body=$(tr '\n' ' ' < /tmp/disk.txt | cut -c1-3500)
            echo "::warning title=Server disk ${used}% → ${after}% after cleanup::${body}"
          fi

      - name: Copy deployment files
        if: env.SKIP != '1'
        run: |
          set -o pipefail
          if ! tar czf - --exclude=site/vendor docker-compose.yml docker-compose.prod.yml .env.example deploy site \
            | ssh "deploy@$HOST" 'tar xzf - -C /opt/wenquest 2>/tmp/deploy-copy.log && chmod +x /opt/wenquest/deploy/*.sh'; then
            ssh "deploy@$HOST" 'tail -n 5 /tmp/deploy-copy.log; df -h / | tail -n 1' | sed 's/^/::error title=Copy deployment files::/' || true
            exit 1
          fi

      - name: Fonts and libraries for the pages (第 34 轮：site/vendor，版本没变就不复制)
        if: env.SKIP != '1'
        run: bash tools/vendor/deploy.sh "deploy@$HOST"

      - name: Get the built textbooks
        if: env.SKIP != '1'  # 网页版教材每次都有；教材没改时只有网页版（第 34 轮修正）
        uses: actions/download-artifact@v4
        with:
          pattern: textbook-*
          merge-multiple: true
          path: textbook-build

      - name: Copy the textbooks (read by the gateway from /opt/wenquest/textbook)
        if: env.SKIP != '1'  # 网页版教材每次都有；教材没改时只有网页版（第 34 轮修正）
        run: |
          books=$(ls textbook-build | tr "\n" " ")   # one line: the list goes into the remote command (several books since 第 10 轮)
          du -sh textbook-build/* || true
          if ! tar czf - -C textbook-build . | ssh "deploy@$HOST" "set -e; mkdir -p /opt/wenquest/textbook; cd /opt/wenquest/textbook; for b in $books; do rm -rf \"\$b\" 2>>/tmp/textbook-copy.log; done; tar xzf - 2>>/tmp/textbook-copy.log"; then
            ssh "deploy@$HOST" 'tail -n 15 /tmp/textbook-copy.log; find /opt/wenquest/textbook ! -user deploy 2>&1 | head -n 5; ls -la /opt/wenquest/textbook/robotics 2>&1 | head -n 8' | sed 's/^/::error::/' || true
            exit 1
          fi

      - name: GPU lab settings (《人工智能》第 14 轮附：仓库加密变量 → 服务器 .env)
        if: env.SKIP != '1'
        env:
          G_PROVIDER: ${{ secrets.WQ_GPU_PROVIDER }}
          G_AUTODL_TOKEN: ${{ secrets.WQ_GPU_AUTODL_TOKEN }}
          G_AUTODL_SPECS: ${{ secrets.WQ_GPU_AUTODL_SPECS }}
          G_LAMBDA_KEY: ${{ secrets.WQ_GPU_LAMBDA_KEY }}
          G_LAMBDA_SSH_KEY: ${{ secrets.WQ_GPU_LAMBDA_SSH_KEY }}
          V3_LAMBDA_KEY: ${{ secrets.LAMBDA_KEY }}     # 三维仿真视频出片（第 38 轮）：用配音合成、GPU 实测那把 Lambda 密钥
        run: |
          # only plain tokens are passed on (letters, digits and - _ . : = , /); nothing is printed
          cmd=""
          for pair in "WQ_GPU_PROVIDER=$G_PROVIDER" "WQ_GPU_AUTODL_TOKEN=$G_AUTODL_TOKEN" "WQ_GPU_AUTODL_SPECS=$G_AUTODL_SPECS" \
                      "WQ_GPU_LAMBDA_KEY=$G_LAMBDA_KEY" "WQ_GPU_LAMBDA_SSH_KEY=$G_LAMBDA_SSH_KEY" "VIDEO3D_LAMBDA_KEY=$V3_LAMBDA_KEY"; do
            k="${pair%%=*}"; v="${pair#*=}"
            [ -n "$v" ] || continue
            if ! printf '%s' "$v" | grep -Eq '^[A-Za-z0-9._:=,/-]+$'; then echo "::error::$k 含有不允许的字符"; exit 1; fi
            cmd="$cmd"$'\n'"envset $k '$v'"
          done
          [ -n "$cmd" ] || { echo "GPU 实验未设置"; exit 0; }
          printf 'cd /opt/wenquest\n. deploy/lib.sh%s\n' "$cmd" | ssh "deploy@$HOST" bash -s > /dev/null
          echo "GPU 实验设置已写入服务器"
      - name: Update the server
        if: env.SKIP != '1'
        run: |
          if ! ssh "deploy@$HOST" 'test -f /opt/wenquest/.env'; then
            echo "::error::/opt/wenquest/.env is missing. On the server run: cd /opt/wenquest && deploy/init-env.sh  - then re-run this workflow."
            exit 1
          fi
          # The digital factory deploys to the same server: login, pulls and image pruning take turns under one lock,
          # so pushes that trigger both deploys do not break each other. The update log is kept for annotations.
          set +e
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh "deploy@$HOST" "flock -w 1500 /tmp/wenquest-deploy.lock sh -c 'docker login ghcr.io -u ${{ github.actor }} --password-stdin && /opt/wenquest/deploy/update.sh ${{ needs.build.outputs.image }}'" 2>&1 | tee /tmp/update.log
          st=${PIPESTATUS[0]}
          if [ "$st" != 0 ]; then
            python3 factory/deploy/ci_annotate.py "Server update" /tmp/update.log 180
            exit "$st"
          fi

      - name: Pages get their fonts and libraries from this server (第 34 轮)
        if: env.SKIP != '1'
        continue-on-error: true
        run: |
          ssh "deploy@$HOST" 'cd /opt/wenquest; D=$(grep -E "^SITE_DOMAIN=" .env | tail -n1 | cut -d= -f2-); for u in "$D/vendor/VERSION" "$D/vendor/fonts/noto-sans-sc.css" "learn.$D/vendor/three/r128/three.min.js" "learn.$D/vendor/katex/0.16.9/katex.min.js" "$D/"; do h=${u%%/*}; c=$(curl -s -o /dev/null -w "%{http_code}" --resolve "$h:443:127.0.0.1" "https://$u"); echo "$c https://$u"; done' | tee /tmp/vendor.log
          if grep -qv '^200 ' /tmp/vendor.log; then echo "::warning title=Fonts and libraries::$(grep -v '^200 ' /tmp/vendor.log | tr '\n' ' ')"; fi

      - name: Cam design site answers (问渠凸轮 /cam/；不通时把容器状态和日志作为注释发出来)
        if: env.SKIP != '1'
        continue-on-error: true
        run: |
          ssh "deploy@$HOST" 'cd /opt/wenquest; D=$(grep -E "^SITE_DOMAIN=" .env | tail -n1 | cut -d= -f2-); for i in $(seq 1 12); do c=$(curl -s -o /dev/null -w "%{http_code}" --resolve "$D:443:127.0.0.1" "https://$D/cam/api/health"); [ "$c" = 200 ] && break; sleep 5; done; echo "cam $c"; if [ "$c" != 200 ]; then . deploy/lib.sh; dc ps -a cam; dc logs --tail 80 cam; fi' > /tmp/cam.log 2>&1 || true
          cat /tmp/cam.log
          if ! grep -q '^cam 200$' /tmp/cam.log; then python3 factory/deploy/ci_annotate.py "Cam site /cam/" /tmp/cam.log 120; exit 1; fi

      - name: Disk space on the server (round 19)
        if: env.SKIP != '1'
        continue-on-error: true
        run: |
          used=$(ssh "deploy@$HOST" "df -P / | awk 'NR==2 {sub(\"%\", \"\", \$5); print \$5}'")
          echo "Server disk used: ${used}%"
          if [ "${used:-0}" -gt 90 ]; then
            echo "::warning title=Server disk ${used}% full::Free space on the server (run deploy/status.sh there to see backups and images). Backups are skipped below 15% free."
          fi

      - name: Textbook animations (wait for the server to render them; report failures)
        if: env.SKIP != '1'
        continue-on-error: true
        # 2026-10-04 this step hung for two hours and held up every later deploy (round 19)
        timeout-minutes: 15
        run: |
          ssh "deploy@$HOST" '/opt/wenquest/deploy/textbook-media.sh 600' 2>&1 | tee /tmp/media.log
          grep '^FAILED' /tmp/media.log | head -n 9 | while read -r l; do echo "::warning title=Textbook animation::${l:0:1500}"; done || true

  # ===== 国内部署（第 34 轮；第 53 轮加“自带仓库”）：没有设置 CN_REGISTRY 时两个任务都跳过；美国的 build、deploy 不受影响 =====
  # 仓库变量（Settings → Secrets and variables → Actions → Variables）CN_REGISTRY：
  #   local = 国内服务器自带的镜像仓库（第 53 轮，推荐）：只监听服务器的 127.0.0.1:5000，GitHub 经 SSH 通道把镜像复制进去；
  #           要 Secrets CN_DEPLOY_HOST、CN_DEPLOY_SSH_KEY（可选 CN_DEPLOY_KNOWN_HOSTS），不要仓库账号
  #   registry.cn-xxx.aliyuncs.com/命名空间 = 阿里云 ACR（第 34 轮）：另要 Secrets CN_REGISTRY_USER、CN_REGISTRY_PASSWORD
  mirror-cn:
    needs: build
    if: vars.CN_REGISTRY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 240   # 自带仓库第一次要跨境传十几 GB；以后只传变化的层
    outputs:
      image: ${{ steps.copy.outputs.image }}
    env:
      CN: ${{ vars.CN_REGISTRY }}
      HOST: ${{ secrets.CN_DEPLOY_HOST }}
      IMAGE: ${{ needs.build.outputs.image }}
      PLATFORM: engine gateway web animator labcheck micro-synth voice blender cam
      BASE: postgres:16-alpine redis:7-alpine caddy:2 rclone/rclone:1
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy the images to the China registry (ACR)
        if: vars.CN_REGISTRY != 'local'
        id: acr
        env:
          CN_USER: ${{ secrets.CN_REGISTRY_USER }}
          CN_PASS: ${{ secrets.CN_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$CN_USER" ] && [ -n "$CN_PASS" ] || { echo "::error::CN_REGISTRY is set but CN_REGISTRY_USER / CN_REGISTRY_PASSWORD are not (or set CN_REGISTRY=local for the server's own registry)"; exit 1; }
          CN="${CN%/}"
          printf '%s' "$CN_PASS" | docker login "${CN%%/*}" -u "$CN_USER" --password-stdin
          TAG="${IMAGE##*:}"; SRC="${IMAGE%/engine:*}"
          copy() { for i in 1 2 3; do docker buildx imagetools create --tag "$2" "$1" && return 0; echo "retry $i: $1"; sleep 20; done; return 1; }
          for n in $PLATFORM; do copy "$SRC/$n:$TAG" "$CN/$n:$TAG"; done
          # 基础镜像：国内拉不动 Docker Hub；.env 的 DB_IMAGE、REDIS_IMAGE、CADDY_IMAGE、RCLONE_IMAGE 指向这里
          for b in $BASE; do copy "docker.io/library/$b" "$CN/${b##*/}" 2>/dev/null || copy "docker.io/$b" "$CN/${b##*/}"; done
          echo "image=$CN/engine:$TAG" >> "$GITHUB_OUTPUT"
          echo "Copied to $CN (tag $TAG)"
      - name: SSH to the China server (own registry)
        if: vars.CN_REGISTRY == 'local'
        run: |
          set -euo pipefail
          [ -n "$HOST" ] || { echo "::error::CN_REGISTRY=local needs the secrets CN_DEPLOY_HOST and CN_DEPLOY_SSH_KEY"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.CN_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "${{ secrets.CN_DEPLOY_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.CN_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -t ed25519 "$HOST" > ~/.ssh/known_hosts
          fi
          printf 'Host cn\n  HostName %s\n  User deploy\n  ServerAliveInterval 30\n  ServerAliveCountMax 6\n' "$HOST" > ~/.ssh/config
          ssh cn 'echo connected; df -h / | tail -1'
      - name: Start the server's own registry (127.0.0.1:5000, first time only)
        if: vars.CN_REGISTRY == 'local'
        run: |
          set -euo pipefail
          if ssh cn 'docker inspect wq-registry >/dev/null 2>&1'; then
            ssh cn 'docker start wq-registry >/dev/null; echo "registry already there"'
          else
            # 国内服务器拉不到 Docker Hub：在这里拉 registry:2，打包传过去
            docker pull registry:2
            docker save registry:2 | gzip | ssh cn 'gunzip | docker load'
            ssh cn 'mkdir -p /opt/wenquest/registry && docker run -d --name wq-registry --restart always -p 127.0.0.1:5000:5000 \
              -v /opt/wenquest/registry:/var/lib/registry -e REGISTRY_STORAGE_DELETE_ENABLED=true registry:2'
          fi
          ssh cn 'for i in $(seq 1 30); do curl -sf http://127.0.0.1:5000/v2/ >/dev/null && { echo "registry up"; exit 0; }; sleep 2; done; docker logs --tail 30 wq-registry; exit 1'
      - name: Copy the images into the server's own registry (through an SSH tunnel; only missing layers travel)
        if: vars.CN_REGISTRY == 'local'
        id: local
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq skopeo; }
          ssh -fN -o ExitOnForwardFailure=yes -L 5000:127.0.0.1:5000 cn
          for i in $(seq 1 15); do curl -sf http://localhost:5000/v2/ >/dev/null && break; sleep 2; done
          TAG="${IMAGE##*:}"; SRC="${IMAGE%/engine:*}"
          creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          copy() {   # $1 source, $2 destination path in the registry
            for i in 1 2 3 4; do
              # 隧道断了就重建
              curl -sf http://localhost:5000/v2/ >/dev/null || ssh -fN -o ExitOnForwardFailure=yes -L 5000:127.0.0.1:5000 cn || true
              start=$(date +%s)
              if skopeo copy --retry-times 3 --dest-tls-verify=false ${3:+--src-creds "$3"} "docker://$1" "docker://localhost:5000/$2"; then
                echo "  $2  $(( $(date +%s) - start )) s"; return 0
              fi
              echo "retry $i: $1"; sleep 20
            done
            return 1
          }
          for n in $PLATFORM; do copy "$SRC/$n:$TAG" "$n:$TAG" "$creds"; done
          for b in $BASE; do
            case "$b" in */*) src="docker.io/$b" ;; *) src="docker.io/library/$b" ;; esac
            copy "$src" "${b##*/}"
          done
          echo "image=127.0.0.1:5000/engine:$TAG" >> "$GITHUB_OUTPUT"
          echo "Copied into the server's registry (tag $TAG)"
      - name: Keep the last 3 versions in the server's registry
        if: vars.CN_REGISTRY == 'local'
        continue-on-error: true
        run: |
          TAG="${IMAGE##*:}"
          ssh cn "PLATFORM='$PLATFORM' TAG='$TAG' bash -s" <<'EOF'
          set -u
          R=http://127.0.0.1:5000
          H='Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json'
          L=/opt/wenquest/registry/.tags
          { grep -vx "$TAG" "$L" 2>/dev/null; echo "$TAG"; } > "$L.new" && mv "$L.new" "$L"
          keep=$(tail -n 3 "$L")
          old=$(head -n -3 "$L")
          digest() { curl -sfI -H "$H" "$R/v2/$1/manifests/$2" | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}'; }
          n_del=0
          for n in $PLATFORM; do
            kept=$(for t in $keep; do digest "$n" "$t"; done)
            for t in $old; do
              d=$(digest "$n" "$t") || continue
              [ -n "$d" ] || continue
              echo "$kept" | grep -qx "$d" && continue   # 同一个镜像还被保留的版本用着
              curl -sf -X DELETE "$R/v2/$n/manifests/$d" >/dev/null && n_del=$((n_del+1))
            done
          done
          printf '%s\n' $keep > "$L"
          docker exec wq-registry registry garbage-collect --delete-untagged /etc/docker/registry/config.yml >/dev/null 2>&1 || true
          echo "removed $n_del old manifests; registry size: $(du -sh /opt/wenquest/registry | cut -f1); disk: $(df -h / | tail -1 | awk '{print $5}') used"
          EOF
      - name: Image address for the China server
        id: copy
        run: echo "image=${{ steps.local.outputs.image || steps.acr.outputs.image }}" >> "$GITHUB_OUTPUT"

  deploy-cn:
    needs: [mirror-cn, textbook, webeditions]
    if: always() && !cancelled() && needs.mirror-cn.result == 'success' && needs.webeditions.result == 'success' && (needs.textbook.result == 'success' || needs.textbook.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HOST: ${{ secrets.CN_DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Check China deploy settings
        run: |
          if [ -z "$HOST" ]; then
            echo "CN_DEPLOY_HOST is not set: images are in the China registry; no China server to update."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Set up SSH
        if: env.SKIP != '1'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.CN_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "${{ secrets.CN_DEPLOY_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.CN_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -t ed25519 "$HOST" > ~/.ssh/known_hosts
          fi
      - name: Copy deployment files
        if: env.SKIP != '1'
        run: |
          tar czf - --exclude=site/vendor docker-compose.yml docker-compose.prod.yml .env.example deploy site \
            | ssh "deploy@$HOST" 'tar xzf - -C /opt/wenquest && chmod +x /opt/wenquest/deploy/*.sh'
      - name: Fonts and libraries for the pages
        if: env.SKIP != '1'
        run: bash tools/vendor/deploy.sh "deploy@$HOST"
      - name: Get the built textbooks
        if: env.SKIP != '1'  # 网页版教材每次都有；教材没改时只有网页版（第 34 轮修正）
        uses: actions/download-artifact@v4
        with:
          pattern: textbook-*
          merge-multiple: true
          path: textbook-build
      - name: Copy the textbooks
        if: env.SKIP != '1'  # 网页版教材每次都有；教材没改时只有网页版（第 34 轮修正）
        run: |
          books=$(ls textbook-build | tr "\n" " ")
          tar czf - -C textbook-build . | ssh "deploy@$HOST" "set -e; mkdir -p /opt/wenquest/textbook; cd /opt/wenquest/textbook; for b in $books; do rm -rf \"\$b\"; done; tar xzf -"
      - name: Update the China server
        if: env.SKIP != '1'
        env:
          CN: ${{ vars.CN_REGISTRY }}
          CN_USER: ${{ secrets.CN_REGISTRY_USER }}
          CN_PASS: ${{ secrets.CN_REGISTRY_PASSWORD }}
        run: |
          if ! ssh "deploy@$HOST" 'test -f /opt/wenquest/.env'; then
            echo "::error::/opt/wenquest/.env is missing on the China server. Run there: cd /opt/wenquest && deploy/init-env.sh (answer cn)"
            exit 1
          fi
          CN="${CN%/}"
          set +e
          if [ "$CN" = local ]; then   # 第 53 轮：服务器自带仓库，不用登录
            ssh "deploy@$HOST" "flock -w 1500 /tmp/wenquest-deploy.lock /opt/wenquest/deploy/update.sh ${{ needs.mirror-cn.outputs.image }}" 2>&1 | tee /tmp/update.log
            st=${PIPESTATUS[0]}
          else
            printf '%s' "$CN_PASS" | ssh "deploy@$HOST" "flock -w 1500 /tmp/wenquest-deploy.lock sh -c 'docker login ${CN%%/*} -u $CN_USER --password-stdin && /opt/wenquest/deploy/update.sh ${{ needs.mirror-cn.outputs.image }}'" 2>&1 | tee /tmp/update.log
            st=${PIPESTATUS[1]}
          fi
          if [ "$st" != 0 ]; then
            python3 factory/deploy/ci_annotate.py "China server update" /tmp/update.log 180
            exit "$st"
          fi
      - name: Pages get their fonts and libraries from this server (第 34 轮)
        if: env.SKIP != '1'
        continue-on-error: true
        run: |
          ssh "deploy@$HOST" 'cd /opt/wenquest; D=$(grep -E "^SITE_DOMAIN=" .env | tail -n1 | cut -d= -f2-); for u in "$D/vendor/VERSION" "$D/vendor/fonts/noto-sans-sc.css" "learn.$D/vendor/three/r128/three.min.js" "learn.$D/vendor/katex/0.16.9/katex.min.js" "$D/"; do h=${u%%/*}; c=$(curl -s -o /dev/null -w "%{http_code}" --resolve "$h:443:127.0.0.1" "https://$u"); echo "$c https://$u"; done' | tee /tmp/vendor.log
          if grep -qv '^200 ' /tmp/vendor.log; then echo "::warning title=Fonts and libraries::$(grep -v '^200 ' /tmp/vendor.log | tr '\n' ' ')"; fi

      - name: Textbook animations
        if: env.SKIP != '1'
        continue-on-error: true
        timeout-minutes: 15
        run: ssh "deploy@$HOST" '/opt/wenquest/deploy/textbook-media.sh 600' 2>&1 | tail -n 20
