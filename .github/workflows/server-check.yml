# 服务器体检（第 44 轮，2026-10-25）：部署从 10-24 起卡在“往服务器传文件”一步，会话里拿不到作业日志，
# 这里把检查结果写成注解（annotation），不下载日志也能看到。只读；clean=yes 时才清理不用的 Docker 镜像和构建缓存。
name: Server check 服务器体检
on:
  workflow_dispatch:
    inputs:
      server:
        description: "哪台服务器（11-08 加 cn：国内磁盘满，Moodle 起不来）"
        type: choice
        options: ["us", "cn"]
        default: "us"
      clean:
        description: "yes：清理不用的 Docker 镜像和构建缓存（只在磁盘满时用）"
        type: choice
        options: ["no", "yes"]
        default: "no"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      HOST: ${{ inputs.server == 'cn' && secrets.CN_DEPLOY_HOST || secrets.DEPLOY_HOST }}
    steps:
      - name: Set up SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ inputs.server == 'cn' && secrets.CN_DEPLOY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # 不能写成 a && b || c：国内没设 known_hosts 时会落到美国那一份（11-08 踩过）
          if [ "${{ inputs.server }}" = cn ]; then kh="${{ secrets.CN_DEPLOY_KNOWN_HOSTS }}"; else kh="${{ secrets.DEPLOY_KNOWN_HOSTS }}"; fi
          if [ -n "$kh" ]; then
            printf '%s\n' "$kh" > ~/.ssh/known_hosts
          else
            ssh-keyscan -t ed25519 "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
      - name: Check
        run: |
          note() { while IFS= read -r l; do echo "::notice::$l"; done; }
          if ! ssh -o ConnectTimeout=20 -o BatchMode=yes "deploy@$HOST" true 2>ssh.err; then
            echo "::error::SSH 连不上：$(tr '\n' ' ' < ssh.err | sed -E 's/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/x.x.x.x/g')"
            exit 1
          fi
          echo "SSH OK" | note
          ssh "deploy@$HOST" 'df -h / /opt 2>/dev/null; df -i / | tail -1' | sed 's/^/disk: /' | note
          ssh "deploy@$HOST" 'docker system df 2>&1 | head -6' | sed 's/^/docker: /' | note
          # 哪里占得多：/opt/wenquest 下各目录、Docker 卷、日志
          ssh "deploy@$HOST" 'du -xsh /opt/wenquest/* /opt/wenquest/.[!.]* 2>/dev/null | sort -rh | head -12' | sed 's/^/du: /' | note
          ssh "deploy@$HOST" 'docker system df -v 2>/dev/null | awk "/VOLUME NAME/{f=1;next} /^$/{f=0} f" | sort -k3 -rh | head -8' | sed 's/^/vol: /' | note
          ssh "deploy@$HOST" 'sudo -n du -xsh /var/lib/docker/containers /var/log 2>/dev/null; journalctl --disk-usage 2>/dev/null' | sed 's/^/sys: /' | note
          ssh "deploy@$HOST" 'ls -ld /opt/wenquest /opt/wenquest/site /opt/wenquest/deploy 2>&1; find /opt/wenquest/site /opt/wenquest/deploy -maxdepth 2 ! -user deploy 2>/dev/null | head -5' | sed 's/^/perm: /' | note
          ssh "deploy@$HOST" 'p=/opt/wenquest/site/.probe; (echo x > $p && rm -f $p && echo write OK) 2>&1' | sed 's/^/write: /' | note
      - uses: actions/checkout@v4
      - name: Try the real copy (dry) — 和部署同样的打包，解到临时目录
        run: |
          set -o pipefail
          tar czf - --exclude=site/vendor docker-compose.yml docker-compose.prod.yml .env.example deploy site \
            | ssh "deploy@$HOST" 'd=$(mktemp -d /opt/wenquest/.probe.XXXX 2>/dev/null || mktemp -d) && tar xzf - -C "$d" 2>&1 | tail -5; echo "exit=${PIPESTATUS[0]} dir=$d"; du -sh "$d"; rm -rf "$d"' 2>&1 \
            | sed 's/^/copy: /' | while IFS= read -r l; do echo "::notice::$l"; done
          ssh "deploy@$HOST" 'tar xzf /dev/null -C /opt/wenquest 2>&1; touch /opt/wenquest/site/index.html 2>&1 && echo touch-site OK; touch /opt/wenquest/docker-compose.yml 2>&1 && echo touch-compose OK' \
            | sed 's/^/real: /' | while IFS= read -r l; do echo "::notice::$l"; done
      - name: 工业园各厂网址（第 125 轮：新厂打不开时查证书与转发）
        if: always() && inputs.server == 'us'
        run: |
          ssh "deploy@$HOST" 'for h in chip sensor; do
              d=$h.factory.wenquestrobotics.com
              echo "$d local=$(curl -sk -o /dev/null -m 20 -w "%{http_code}" --resolve $d:443:127.0.0.1 https://$d/api/health 2>&1)"
              curl -sv -o /dev/null -m 20 --resolve $d:443:127.0.0.1 https://$d/api/health 2>&1 | grep -iE "subject:|issuer:|expire|SSL|alert|HTTP/" | head -6
            done
            c=$(docker ps --format "{{.Names}}" | grep -i caddy | head -1); echo "caddy=$c"
            docker logs "$c" 2>&1 | grep -i "sensor" | tail -15 | cut -c1-400
            g=$(docker ps --format "{{.Names}}" | grep -i gateway | head -1); echo "gateway=$g"
            docker exec "$g" python3 -c "import urllib.request as u;print(u.urlopen(\"http://localhost:8000/api/v1/caddy/ask?domain=sensor.factory.wenquestrobotics.com\",timeout=5).read()[:200])" 2>&1 | tail -2
            docker exec "$g" python3 -c "import urllib.request as u;print(u.urlopen(\"http://wqf-hub:8100/api/caddy/ask?domain=sensor.factory.wenquestrobotics.com\",timeout=5).read()[:200])" 2>&1 | tail -2
            docker exec "$g" python3 -c "import urllib.request as u;print(u.urlopen(\"http://wqf-hub-c-sensor:8100/api/health\",timeout=5).read()[:200])" 2>&1 | tail -2' 2>&1 \
            | sed 's/^/site: /' | while IFS= read -r l; do echo "::notice::$l"; done
      - name: Clean (only when asked) — 先于试传文件执行
        if: always() && inputs.clean == 'yes'
        run: |
          ssh "deploy@$HOST" 'docker image prune -af 2>&1 | tail -1; docker builder prune -af 2>&1 | tail -1; df -h / | tail -1' \
            | sed 's/^/clean: /' | while IFS= read -r l; do echo "::notice::$l"; done
