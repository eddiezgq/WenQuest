# 服务器体检（第 44 轮，2026-10-25）：部署从 10-24 起卡在“往服务器传文件”一步，会话里拿不到作业日志，
# 这里把检查结果写成注解（annotation），不下载日志也能看到。只读；clean=yes 时才清理不用的 Docker 镜像和构建缓存。
name: Server check 服务器体检
on:
  workflow_dispatch:
    inputs:
      server:
        description: "哪台服务器（11-08 加 cn：国内磁盘满，Moodle 起不来）"
        type: choice
        options: ["us", "cn"]
        default: "us"
      clean:
        description: "yes：清理不用的 Docker 镜像和构建缓存（只在磁盘满时用）"
        type: choice
        options: ["no", "yes"]
        default: "no"
      connect_edge:
        description: "yes：把网关接上 factory-edge 网络（第 125 轮：下次部署前先救急，部署后本来就会接上）"
        type: choice
        options: ["no", "yes"]
        default: "no"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      HOST: ${{ inputs.server == 'cn' && secrets.CN_DEPLOY_HOST || secrets.DEPLOY_HOST }}
    steps:
      - name: Set up SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ inputs.server == 'cn' && secrets.CN_DEPLOY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # 不能写成 a && b || c：国内没设 known_hosts 时会落到美国那一份（11-08 踩过）
          if [ "${{ inputs.server }}" = cn ]; then kh="${{ secrets.CN_DEPLOY_KNOWN_HOSTS }}"; else kh="${{ secrets.DEPLOY_KNOWN_HOSTS }}"; fi
          if [ -n "$kh" ]; then
            printf '%s\n' "$kh" > ~/.ssh/known_hosts
          else
            ssh-keyscan -t ed25519 "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
      - name: Check
        run: |
          note() { while IFS= read -r l; do echo "::notice::$l"; done; }
          if ! ssh -o ConnectTimeout=20 -o BatchMode=yes "deploy@$HOST" true 2>ssh.err; then
            echo "::error::SSH 连不上：$(tr '\n' ' ' < ssh.err | sed -E 's/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/x.x.x.x/g')"
            exit 1
          fi
          echo "SSH OK" | note
          ssh "deploy@$HOST" 'df -h / /opt 2>/dev/null; df -i / | tail -1' | sed 's/^/disk: /' | note
          ssh "deploy@$HOST" 'docker system df 2>&1 | head -6' | sed 's/^/docker: /' | note
          # 哪里占得多：/opt/wenquest 下各目录、Docker 卷、日志
          ssh "deploy@$HOST" 'du -xsh /opt/wenquest/* /opt/wenquest/.[!.]* 2>/dev/null | sort -rh | head -12' | sed 's/^/du: /' | note
          ssh "deploy@$HOST" 'docker system df -v 2>/dev/null | awk "/VOLUME NAME/{f=1;next} /^$/{f=0} f" | sort -k3 -rh | head -8' | sed 's/^/vol: /' | note
          ssh "deploy@$HOST" 'sudo -n du -xsh /var/lib/docker/containers /var/log 2>/dev/null; journalctl --disk-usage 2>/dev/null' | sed 's/^/sys: /' | note
          ssh "deploy@$HOST" 'ls -ld /opt/wenquest /opt/wenquest/site /opt/wenquest/deploy 2>&1; find /opt/wenquest/site /opt/wenquest/deploy -maxdepth 2 ! -user deploy 2>/dev/null | head -5' | sed 's/^/perm: /' | note
          ssh "deploy@$HOST" 'p=/opt/wenquest/site/.probe; (echo x > $p && rm -f $p && echo write OK) 2>&1' | sed 's/^/write: /' | note
      - uses: actions/checkout@v4
      - name: Try the real copy (dry) — 和部署同样的打包，解到临时目录
        run: |
          set -o pipefail
          tar czf - --exclude=site/vendor docker-compose.yml docker-compose.prod.yml .env.example deploy site \
            | ssh "deploy@$HOST" 'd=$(mktemp -d /opt/wenquest/.probe.XXXX 2>/dev/null || mktemp -d) && tar xzf - -C "$d" 2>&1 | tail -5; echo "exit=${PIPESTATUS[0]} dir=$d"; du -sh "$d"; rm -rf "$d"' 2>&1 \
            | sed 's/^/copy: /' | while IFS= read -r l; do echo "::notice::$l"; done
          ssh "deploy@$HOST" 'tar xzf /dev/null -C /opt/wenquest 2>&1; touch /opt/wenquest/site/index.html 2>&1 && echo touch-site OK; touch /opt/wenquest/docker-compose.yml 2>&1 && echo touch-compose OK' \
            | sed 's/^/real: /' | while IFS= read -r l; do echo "::notice::$l"; done
      - name: 网关接上 factory-edge（只在要求时）
        if: always() && inputs.connect_edge == 'yes' && inputs.server == 'us'
        run: |
          ssh "deploy@$HOST" 'g=$(docker ps --format "{{.Names}}" | grep -i "^wenquest-gateway" | head -1); docker network connect factory-edge "$g" 2>&1; echo "connected $g"; sleep 3' \
            | sed 's/^/edge: /' | while IFS= read -r l; do echo "::notice::$l"; done
      - name: 工业园各厂网址（第 125 轮：新厂打不开时查证书与转发）
        if: always() && inputs.server == 'us'
        run: |
          ssh "deploy@$HOST" 'for h in chip sensor motor sewing; do
              d=$h.factory.wenquestrobotics.com
              echo "$d local=$(curl -sk -o /dev/null -m 20 -w "%{http_code}" --resolve $d:443:127.0.0.1 https://$d/api/health 2>&1)"
              curl -sv -o /dev/null -m 20 --resolve $d:443:127.0.0.1 https://$d/api/health 2>&1 | grep -iE "subject:|issuer:|expire|SSL|alert|HTTP/" | head -6
            done
            c=$(docker ps --format "{{.Names}}" | grep -i caddy | head -1); echo "caddy=$c"
            docker logs "$c" 2>&1 | grep -i "sewing" | tail -15 | cut -c1-400
            g=$(docker ps --format "{{.Names}}" | grep -i gateway | head -1); echo "gateway=$g"
            docker exec "$g" python3 -c "import urllib.request as u;print(u.urlopen(\"http://localhost:8000/api/v1/caddy/ask?domain=sewing.factory.wenquestrobotics.com\",timeout=5).read()[:200])" 2>&1 | tail -2
            docker exec "$g" python3 -c "import urllib.request as u;print(u.urlopen(\"http://wqf-hub:8100/api/caddy/ask?domain=sewing.factory.wenquestrobotics.com\",timeout=5).read()[:200])" 2>&1 | tail -2
            docker exec "$g" python3 -c "import urllib.request as u;print(u.urlopen(\"http://wqf-hub-c-sewing:8100/api/health\",timeout=5).read()[:200])" 2>&1 | tail -2' 2>&1 \
            | sed 's/^/site: /' | while IFS= read -r l; do echo "::notice::$l"; done
      - name: AI 助手每页都有（第 154 轮验收：从外面看页面带按钮、/assist.js 与问答接口能通）
        if: always()
        run: |
          if [ "${{ inputs.server }}" = cn ]; then
            pages="https://wenquestech.online/ https://factory.wenquestech.online/"
            hosts="https://factory.wenquestech.online"
            ask='{"q":"怎么生成数控G代码？","page":"/","lang":"zh"}'
          else
            pages="https://wenquestrobotics.com/ https://wenquestrobotics.com/cases/cam.html https://wenquestrobotics.com/pilot/ https://wenquestrobotics.com/kits.html https://wenquestrobotics.com/terms.html https://wenquestrobotics.com/factory/ https://factory.wenquestrobotics.com/ https://demo.wenquestrobotics.com/ https://sewing.factory.wenquestrobotics.com/"
            hosts="https://factory.wenquestrobotics.com https://demo.wenquestrobotics.com https://sewing.factory.wenquestrobotics.com"
            ask='{"q":"How do I generate G-code?","page":"/","lang":"en"}'
          fi
          for p in $pages; do
            body=$(curl -sL -m 25 "$p"); n=$(printf '%s' "$body" | grep -c 'assist.js' || true); h=$(printf '%s' "$body" | grep -o 'index-[A-Za-z0-9_-]*\.js' | head -1)
            echo "::notice::assist page $p tag=$n len=${#body} $h"
          done
          for h in $hosts; do
            js=$(curl -s -o /dev/null -m 25 -w "%{http_code} %{content_type}" "$h/assist.js")
            ans=$(curl -s -m 90 -H 'Content-Type: application/json' -d "$ask" "$h/api/v1/public/assist" -w ' HTTP=%{http_code}' | tr '\n' ' ' | cut -c1-260)
            echo "::notice::assist host $h js=$js ask=$ans"
          done
      - name: 网关发信（11-11：试点邀请的验证码没收到，Brevo 日志里没有记录）
        if: always()
        run: |
          ssh "deploy@$HOST" 'g=$(docker ps --format "{{.Names}}" | grep -i gateway | head -1); echo "gateway=$g"
            docker exec "$g" python3 -c "import os;print({k:(\"set\" if os.environ.get(k) else \"EMPTY\") for k in (\"WQ_SMTP_HOST\",\"WQ_SMTP_PORT\",\"WQ_SMTP_SECURE\",\"WQ_SMTP_USER\",\"WQ_SMTP_PASSWORD\",\"WQ_MAIL_FROM\")}, os.environ.get(\"WQ_SMTP_HOST\",\"\"), os.environ.get(\"WQ_SMTP_PORT\",\"\"), os.environ.get(\"WQ_MAIL_FROM\",\"\"))" 2>&1 | tail -2
            docker exec "$g" python3 -c "import os,smtplib,ssl;e=os.environ;s=smtplib.SMTP(e[\"WQ_SMTP_HOST\"],int(e.get(\"WQ_SMTP_PORT\") or 2525),timeout=20);s.starttls(context=ssl.create_default_context());print(\"smtp-login\",s.login(e[\"WQ_SMTP_USER\"],e[\"WQ_SMTP_PASSWORD\"])[0])" 2>&1 | tail -2
            docker logs --since 72h "$g" 2>&1 | grep -iE "wenquest.mail|mail to|mail not configured|pilot" | tail -30 | cut -c1-300
            docker exec "$g" python3 -c "import sqlite3,glob,time,os
          for p in glob.glob(os.environ.get(\"DATA_DIR\",\"/tmp/wq-data\")+\"/pilots.db\")+glob.glob(\"/data/**/pilots.db\",recursive=True):
              c=sqlite3.connect(p)
              for r in c.execute(\"select substr(email,1,3),substr(email,instr(email,\x27@\x27)),created,expires,used,code_sent,tries from invite order by created desc limit 8\"): print(p,r,int(time.time()))
              print(\"tenants\",c.execute(\"select id,status from tenant\").fetchall())" 2>&1 | tail -12' 2>&1 \
            | sed 's/^/mail: /' | while IFS= read -r l; do echo "::notice::$l"; done
      - name: ERPNext 登录报 500 的原因（第 134 轮：11-10 部署时各厂单点登录都“登录失败（500）”）
        if: always() && inputs.server == 'us'
        run: |
          ssh "deploy@$HOST" 'for c in $(docker ps --format "{{.Names}}" | grep -E "wq-factory-erp-backend" | head -10); do
              echo "== $c"
              docker logs --since 4h "$c" 2>&1 | grep -B2 -A12 -E "Traceback|Error|login" | grep -v "^--$" | tail -25 | cut -c1-300
              docker exec "$c" sh -c "tail -n 40 /home/frappe/frappe-bench/logs/frappe.log 2>/dev/null | grep -A10 -E \"Traceback|Error\" | tail -20" 2>&1 | cut -c1-300
            done
            b=$(docker ps --format "{{.Names}}" | grep -E "wq-factory-erp-backend" | head -1)
            for s in erp.localhost c-sewing c-motor; do
              echo "login-probe $s: $(docker exec "$b" curl -s -m 30 -o /tmp/lp.txt -w "%{http_code}" -H "Host: $s" -X POST -d usr=probe -d pwd=wrong http://localhost:8000/api/method/login 2>&1) $(docker exec "$b" sh -c "head -c 300 /tmp/lp.txt" 2>&1 | tr "\n" " ")"
            done
            for s in c-sensor c-sewing; do
              echo "errorlog $s:"
              docker exec "$b" bench --site $s execute frappe.get_all --kwargs "{\"doctype\": \"Error Log\", \"fields\": [\"creation\", \"method\", \"error\"], \"limit\": 1, \"order_by\": \"creation desc\"}" 2>&1 | tr "\\\\" "\n" | grep -E "^n  File|line [0-9]+, in|creation|method" | head -40 | cut -c1-200
            done
            for c in $(docker ps --format "{{.Names}}" | grep -E "wq-factory-(redis|erp-redis)" | head -6); do echo "$c $(docker inspect -f "{{.State.Status}} restarts={{.RestartCount}}" $c)"; done
            free -m | head -2; uptime' 2>&1 \
            | sed 's/^/erp: /' | while IFS= read -r l; do echo "::notice::$l"; done
      - name: Clean (only when asked) — 先于试传文件执行
        if: always() && inputs.clean == 'yes'
        run: |
          ssh "deploy@$HOST" 'docker image prune -af 2>&1 | tail -1; docker builder prune -af 2>&1 | tail -1; df -h / | tail -1' \
            | sed 's/^/clean: /' | while IFS= read -r l; do echo "::notice::$l"; done
