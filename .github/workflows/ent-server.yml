# 第 146 轮：企业服务器（美国第二台）的准备。手动运行。
#   pubkey：打印部署钥匙（DEPLOY_SSH_KEY）的公钥一半，开新服务器时填进“初始化脚本”，让部署能登录（公钥可以公开，私钥不出 GitHub）
#   bootstrap：用 root 登录跑 deploy/bootstrap.sh（装 Docker、建 deploy 用户、防火墙、交换空间、每日备份定时）；开机时的初始化脚本没跑时用
#   check：用部署钥匙登录企业服务器（deploy 用户），看初始化有没有做完、内存、磁盘、Docker
#   deploy：装企业服务器的前门（deploy/enterprise：Caddy、app. 入口页、交接桥脚本），把教育服务器上 deploy 用户认的公钥
#           （含质量 ERP 部署用的那把）也加到企业服务器，写好 /opt/wenquest/.env 的 SITE_DOMAIN（质量 ERP 的部署读它）。
#           不碰交接桥钥匙：开桥是晚上切换时的事（第 146 轮 7.4）
#   bridge-on：晚上切换用。试点开通改由企业服务器做：生成交接桥钥匙写进两台的 .env（不进日志），教育服务器上停掉
#              质量 ERP 的开通程序（crontab 的 pilot-runner），重启网关；试点名额改成 5 家（企业服务器 8 GB）
#   bridge-off：回退。去掉教育服务器上的钥匙、恢复它的开通程序、重启网关
name: Enterprise server 企业服务器

on:
  workflow_dispatch:
    inputs:
      task:
        description: "pubkey（打印部署公钥）/ check（检查企业服务器）/ bootstrap（初始化企业服务器）/ deploy（装前门 Caddy 与交接桥）"
        type: choice
        options: [pubkey, check, bootstrap, deploy, bridge-on, bridge-off]
        default: check
      host:
        description: "企业服务器 IP（11-10 开的：161.35.185.35）"
        required: false
        default: "161.35.185.35"

permissions:
  contents: read
  packages: read      # deploy：企业服务器从 ghcr.io 拉工业软件镜像

jobs:
  pubkey:
    if: inputs.task == 'pubkey'
    runs-on: ubuntu-24.04
    steps:
      - name: 部署公钥
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/k && chmod 600 ~/.ssh/k
          pub=$(ssh-keygen -y -f ~/.ssh/k)
          rm -f ~/.ssh/k
          echo "$pub"
          echo "::notice title=部署公钥::$pub"

  check:
    if: inputs.task == 'check'
    runs-on: ubuntu-24.04
    steps:
      - name: 登录并检查
        env:
          HOST: ${{ inputs.host }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          for u in deploy root; do
            echo "== $u@$HOST"
            ssh -o BatchMode=yes -o ConnectTimeout=20 "$u@$HOST" 'id; uptime; free -m | head -2; df -h / | tail -1; docker --version 2>&1; ls -ld /opt/wenquest 2>&1; sudo -n true 2>/dev/null && echo sudo-ok; tail -n 5 /root/bootstrap.log 2>/dev/null' || echo "($u 登不上)"
          done

  bootstrap:
    if: inputs.task == 'bootstrap'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 初始化
        env:
          HOST: ${{ inputs.host }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          pub=$(ssh-keygen -y -f ~/.ssh/id_ed25519)
          scp deploy/bootstrap.sh "root@$HOST:/root/bootstrap.sh"
          ssh "root@$HOST" "bash /root/bootstrap.sh '$pub'" 2>&1 | tail -n 40
          ssh "deploy@$HOST" 'id; docker --version; free -m | head -2'

  deploy:
    if: inputs.task == 'deploy'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: 装前门
        env:
          HOST: ${{ inputs.host }}
          EDU: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$HOST" "$EDU" > ~/.ssh/known_hosts 2>/dev/null
          # 教育服务器上 deploy 用户认的公钥（公钥可以公开），和它的 SITE_DOMAIN、ACME_EMAIL
          ssh "deploy@$EDU" 'cat ~/.ssh/authorized_keys' > "$RUNNER_TEMP/keys"
          site=$(ssh "deploy@$EDU" "grep -E '^SITE_DOMAIN=' /opt/wenquest/.env | tail -n1 | cut -d= -f2-")
          acme=$(ssh "deploy@$EDU" "grep -E '^ACME_EMAIL=' /opt/wenquest/.env | tail -n1 | cut -d= -f2-")
          [ -n "$site" ] && [ -n "$acme" ] || { echo "::error::教育服务器 .env 里没有 SITE_DOMAIN 或 ACME_EMAIL"; exit 1; }
          echo "SITE_DOMAIN=$site  keys=$(grep -c . "$RUNNER_TEMP/keys")"
          # 工业软件：照教育服务器正在跑的镜像（同一份程序两处部署，第 146 轮二.2）
          imgs=$(ssh "deploy@$EDU" "docker ps --format '{{.Names}} {{.Image}}'")
          img() { printf '%s\n' "$imgs" | awk -v n="-$1-1" 'index($1, n) == length($1) - length(n) + 1 {print $2; exit}'; }
          CAM=$(img cam); BEARING=$(img bearing); EDA=$(img eda)
          echo "cam=$CAM bearing=$BEARING eda=$EDA"
          [ -n "$CAM" ] && [ -n "$BEARING" ] && [ -n "$EDA" ] || { echo "::error::教育服务器上没找到凸轮、轴承或问渠电子的容器"; exit 1; }
          # 凸轮的 CAE 走数字工厂：网址和钥匙照教育服务器 .env（钥匙经标准输入传，不上命令行、不进日志）
          ssh "deploy@$EDU" "grep -E '^(WQ_FACTORY_URL|WQ_FACTORY_CAE_KEY)=' /opt/wenquest/.env" > "$RUNNER_TEMP/fx" || true
          ssh "deploy@$HOST" 'mkdir -p ~/.ssh && touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys'
          ssh "deploy@$HOST" 'k=~/.ssh/authorized_keys; while IFS= read -r l; do [ -n "$l" ] && ! grep -qxF "$l" "$k" && echo "$l" >> "$k" && echo "added a key"; done; true' < "$RUNNER_TEMP/keys"
          tar czf - -C deploy/enterprise . | ssh "deploy@$HOST" 'mkdir -p /opt/wenquest/edge /opt/wenquest/pilot-queue && tar xzf - -C /opt/wenquest/edge && chmod +x /opt/wenquest/edge/*.py && mkdir -p /opt/wenquest/edge/allow'
          ssh "deploy@$HOST" 'f=/opt/wenquest/edge/.env; touch $f; chmod 600 $f; while IFS= read -r l; do k=${l%%=*}; grep -v "^$k=" $f > $f.n || true; echo "$l" >> $f.n; mv $f.n $f; chmod 600 $f; done' < "$RUNNER_TEMP/fx"
          rm -f "$RUNNER_TEMP/fx"
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh "deploy@$HOST" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin" >/dev/null
          # .env：有这一行就改，没有才加（不重复写）
          ssh "deploy@$HOST" "SITE='$site' ACME='$acme' CAM='$CAM' BEARING='$BEARING' EDA='$EDA' bash -s" <<'EOF'
          set -euo pipefail
          envset() { f=$1; k=$2; v=$3; touch "$f"; chmod 600 "$f"; if grep -q "^$k=" "$f"; then sed -i "s|^$k=.*|$k=$v|" "$f"; else echo "$k=$v" >> "$f"; fi; }
          envset /opt/wenquest/.env SITE_DOMAIN "$SITE"
          envset /opt/wenquest/edge/.env SITE_DOMAIN "$SITE"
          envset /opt/wenquest/edge/.env ACME_EMAIL "$ACME"
          envset /opt/wenquest/edge/.env CAM_IMAGE "$CAM"
          envset /opt/wenquest/edge/.env BEARING_IMAGE "$BEARING"
          envset /opt/wenquest/edge/.env EDA_IMAGE "$EDA"
          cd /opt/wenquest/edge
          docker network inspect qms-edge >/dev/null 2>&1 || docker network create qms-edge
          docker compose --env-file .env pull -q </dev/null    # docker 读标准输入会吃掉这段脚本后面的行
          docker compose --env-file .env run --rm --no-deps -T caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile </dev/null 2>&1 | tail -n 3
          docker compose --env-file .env up -d --remove-orphans </dev/null
          docker compose --env-file .env exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile </dev/null 2>&1 | tail -n 2 || true
          line='* * * * * python3 /opt/wenquest/edge/bridge-sync.py >> /opt/wenquest/edge/bridge.log 2>&1'
          { crontab -l 2>/dev/null | grep -v 'bridge-sync.py' || true; echo "$line"; } | crontab -
          crontab -l
          docker compose ps </dev/null
          free -m | head -2
          EOF
          ssh "deploy@$HOST" 'docker logout ghcr.io >/dev/null 2>&1 || true'
      - name: 从外面看（还没切 DNS，用 --resolve 指到企业服务器）
        env:
          HOST: ${{ inputs.host }}
        run: |
          site=$(ssh "deploy@$HOST" "grep -E '^SITE_DOMAIN=' /opt/wenquest/edge/.env | cut -d= -f2-")
          sleep 20
          for p in cam/ bearing/ eda/; do echo "app.$site/$p -> $(curl -s -o /dev/null -m 60 -w '%{http_code}' "https://app.$site/$p" || true)"; done
          for h in app qms; do
            echo "$h.$site -> $(curl -s -o /dev/null -m 30 -w '%{http_code}' --resolve "$h.$site:80:$HOST" "http://$h.$site/" || true) (http)"
          done
          echo "app.$site https -> $(curl -s -o /dev/null -m 60 -w '%{http_code}' "https://app.$site/" || true)"

  bridge:
    if: inputs.task == 'bridge-on' || inputs.task == 'bridge-off'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: ${{ inputs.task }}
        env:
          HOST: ${{ inputs.host }}
          EDU: ${{ secrets.DEPLOY_HOST }}
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$HOST" "$EDU" > ~/.ssh/known_hosts 2>/dev/null
          if [ "$TASK" = bridge-on ]; then
            # 钥匙：企业服务器上已有就沿用，没有才生成；经标准输入写，不上命令行、不进日志
            key=$(ssh "deploy@$HOST" "grep -E '^WQ_PILOT_BRIDGE_KEY=' /opt/wenquest/edge/.env | tail -n1 | cut -d= -f2-" || true)
            [ -n "$key" ] || key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            put='f=$1; k=$2; IFS= read -r v; touch "$f"; if grep -q "^$k=" "$f"; then sed -i "s|^$k=.*|$k=$v|" "$f"; else echo "$k=$v" >> "$f"; fi'
            printf '%s\n' "$key" | ssh "deploy@$HOST" "bash -c '$put' _ /opt/wenquest/edge/.env WQ_PILOT_BRIDGE_KEY"
            printf '%s\n' "$key" | ssh "deploy@$EDU" "bash -c '$put' _ /opt/wenquest/.env WQ_PILOT_BRIDGE_KEY"
            printf '%s\n' 5 | ssh "deploy@$EDU" "bash -c '$put' _ /opt/wenquest/.env WQ_PILOT_MAX"
            ssh "deploy@$EDU" '{ crontab -l 2>/dev/null | grep -v pilot-runner.sh || true; } | crontab -; echo "教育服务器 crontab:"; crontab -l | sed "s/^/  /"'
          else
            ssh "deploy@$EDU" 'sed -i "/^WQ_PILOT_BRIDGE_KEY=/d; /^WQ_PILOT_MAX=/d" /opt/wenquest/.env
              d=$(docker inspect qms-demo-edge --format "{{ index .Config.Labels \"com.docker.compose.project.working_dir\" }}" 2>/dev/null || echo /opt/wenquest/qms)
              line="* * * * * $d/pilot-runner.sh >> $d/pilot-runner.log 2>&1"
              { crontab -l 2>/dev/null | grep -v pilot-runner.sh || true; echo "$line"; } | crontab -; crontab -l | grep pilot-runner'
          fi
          # 网关重新读 .env（只重建网关一个容器）
          ssh "deploy@$EDU" 'cd /opt/wenquest && exec 9>/tmp/wenquest-deploy.lock && flock -w 1500 9 && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps --no-build gateway </dev/null 2>&1 | tail -n 3'
          sleep 30
          echo "企业服务器交接桥日志："; ssh "deploy@$HOST" 'tail -n 5 /opt/wenquest/edge/bridge.log 2>/dev/null; ls /opt/wenquest/edge/allow /opt/wenquest/pilot-queue'
