# 数字工厂部署（第 3 轮 D10）：只在推送改动 factory/ 时运行，与学习平台的“Build and deploy”互不影响。
#   测试 → 服务器演练（在 GitHub 的机器上按服务器配置装一套真 ERPNext，走完整闭环）→ 构建镜像 → 部署到服务器
name: Digital factory 数字工厂部署

on:
  push:
    branches: [main]
    paths:
      - "factory/**"
      - ".github/workflows/factory.yml"
      - "services/gateway/app/production/labkit/plc.js"       # 虚拟 PLC 用的是这几份的副本（tests/test_vplc.py 核对一致）
      - "services/gateway/app/production/labkit/plants.js"
      - "services/gateway/app/production/labkit/shift.js"
      # 帮助在网页里读（第 19 轮）：工厂镜像里是这些原件的副本（factory/digital/help/sync.py 同步，tests/test_help.py 核对一致）
      - "docs/演示/**"
      - "docs/帮助/两周情景.md"
      - "docs/帮助/数字工厂术语表.md"
      - "docs/帮助/厂情中枢.md"
      - "docs/帮助/客户与服务.md"
      - "docs/帮助/安全环保.md"
      - "docs/帮助/设备维护.md"
      - "docs/帮助/人员与排班.md"
      - "docs/帮助/采购与来料.md"
      - "docs/帮助/能源与环境.md"
      - "docs/帮助/经营与财务.md"
      - "docs/帮助/仿真与分析.md"
      - "docs/帮助/流体分析.md"
      - "docs/帮助/数控编程.md"
      - "docs/帮助/数字孪生.md"
      - "docs/帮助/设计优化.md"
      - "docs/帮助/虚拟PLC.md"
      - "docs/帮助/零件与机器人库.md"
      - "docs/帮助/数字工厂企业版使用说明.md"
      - "docs/帮助/数字工厂课程接口.md"
      # 帮助里嵌的虚拟实验（第 30 轮 §八）：工作台 web/public/labs/ 是这些原件的副本（tools/sync_help_labs.py 同步，tests/test_help.py 核对一致）
      - "textbook/web-editions/dfactory/src/zh/labs/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: factory-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash          # 带 pipefail：用 tee 记日志时不会吞掉出错

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5433:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 有限元、流体求解器（第 11 轮 CalculiX、gmsh 用到的系统库；第 16 轮 OpenFOAM）
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends calculix-ccx libglu1-mesa libxcursor1 libxft2 libxinerama1 openfoam openmpi-bin
          (ccx -v || true) | grep -q Version          # ccx -v 的退出码不是 0
          which simpleFoam snappyHexMesh mpirun        # 流体分析（第 16 轮）：OpenFOAM
      - name: 动力学用的机器人模型（第 12 轮：Menagerie 固定提交）
        run: sh factory/deploy/fetch_menagerie.sh "$RUNNER_TEMP/menagerie" && echo "WQ_MENAGERIE=$RUNNER_TEMP/menagerie" >> "$GITHUB_ENV"
      - name: 工厂数据与导入脚本
        working-directory: factory
        # matplotlib 只在测试里用：test_drawing_gb_rules 用它生成样例零件图 PDF（第 11 轮《机械设计》第 3 章）
        run: |
          pip install -q -r digital/requirements.txt pytest "requests>=2.31" matplotlib && python -m pytest -q tests
          for f in plants/*.yaml; do python -m factory.plant check "$f"; done      # 第 30 轮：工厂清单都要校验通过
      - name: 独立的 G 代码解析器（第 13 轮验收用，只装在测试环境；euclid3 的 setup.py 在新版 setuptools 下装不上，直接放模块文件）
        run: |
          pip install -q --no-deps pygcode==0.2.1 six
          pip download -q --no-deps --no-binary :all: euclid3==0.01 -d "$RUNNER_TEMP/eu"
          tar -xzf "$RUNNER_TEMP/eu/euclid3-0.01.tar.gz" -C "$RUNNER_TEMP/eu"
          cp "$RUNNER_TEMP/eu/euclid3-0.01/euclid3.py" "$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')/"
          python -c "import pygcode"
      - name: 总线、仿真、枢纽、登录与权限
        working-directory: factory/digital
        run: |
          set +e
          python -m pytest -q tests 2>&1 | tee /tmp/pytest.log
          st=${PIPESTATUS[0]}
          if [ "$st" != 0 ]; then python3 ../deploy/ci_annotate.py 单元测试 /tmp/pytest.log 120; fi
          exit "$st"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 工作台网页能打包
        working-directory: factory/digital/web
        run: npm ci --no-audit --no-fund && npm run build

  rehearsal:
    name: 服务器演练（真 ERPNext）
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      FACTORY_DIR: /tmp/fac
      LEARN_DIR: /tmp/nolearn
      FACTORY_COMPOSE: docker-compose.yml ci.yml
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: |
          docker build -q -t wqf-app:ci -f factory/digital/Dockerfile factory
          docker build -q -t wqf-bridge:ci factory/digital/bridge
          docker build -q -t wqf-openplc:ci -f factory/digital/openplc/Dockerfile factory/digital
      - name: 按服务器目录布置
        run: |
          mkdir -p "$FACTORY_DIR/mosquitto" "$LEARN_DIR"
          cp factory/deploy/docker-compose.server.yml "$FACTORY_DIR/docker-compose.yml"
          cp -r factory/deploy "$FACTORY_DIR/deploy"
          cp factory/digital/mosquitto/server/* "$FACTORY_DIR/mosquitto/"
          # 演练时把端口开到本机，登录用本地方式（CI 没有学习平台）
          printf 'services:\n  hub: {ports: ["8100:8100"]}\n  erp-frontend: {ports: ["8090:8080"]}\n  bus: {ports: ["1883:1883", "9001:9001"]}\n  hub-demo: {ports: ["8101:8100"]}\n  erp-frontend-demo: {ports: ["8092:8080"]}\n' > "$FACTORY_DIR/ci.yml"
          printf 'FACTORY_APP_IMAGE=wqf-app:ci\nFACTORY_BRIDGE_IMAGE=wqf-bridge:ci\nFACTORY_OPENPLC_IMAGE=wqf-openplc:ci\nSITE_DOMAIN=example.test\nWQ_AUTH=local\nWQ_AI_PER_HOUR=0\nWQ_ERP_OAUTH_SECRET=ci-sso-secret\nWQ_SUPPLY_AUTO_S=20\nWQ_PARK_AUTO_S=20\n' > "$FACTORY_DIR/.env"
      - name: 首次安装（建站、设置向导、API 钥匙、导入数据）
        run: mkdir -p /tmp/logs && bash "$FACTORY_DIR/deploy/install.sh" 2>&1 | tee /tmp/logs/install.log
      - name: 启动全部服务
        working-directory: /tmp/fac
        run: |
          docker compose -p wq-factory -f docker-compose.yml -f ci.yml up -d
          for i in $(seq 1 40); do curl -fsS localhost:8100/api/health && break; sleep 5; done
          echo; docker compose -p wq-factory -f docker-compose.yml -f ci.yml ps
      - name: 总线加锁检查
        working-directory: factory/digital
        run: |
          pip install -q -r requirements.txt
          val() { grep "^$1=" /tmp/fac/.env | cut -d= -f2; }
          python tests/check_bus_lock.py --hub-password "$(val WQ_MQTT_HUB_PASSWORD)" \
            --sim-password "$(val WQ_MQTT_SIM_PASSWORD)" --bridge-password "$(val WQ_MQTT_BRIDGE_PASSWORD)"
      - name: 完整闭环（真 ERPNext）
        working-directory: factory/digital
        run: |
          val() { grep "^$1=" /tmp/fac/.env | cut -d= -f2; }
          python tests/closed_loop.py --hub http://localhost:8100 --erp http://localhost:8090 --erp-kind real \
            --erp-key "$(val WQ_ERP_API_KEY)" --erp-secret "$(val WQ_ERP_API_SECRET)" --speed 300 --timeout 900 \
            --diag /tmp/logs/erp_errors.log \
            2>&1 | tee /tmp/logs/closed_loop.log
      - name: 有限元、动力学、数控编程（第 11–13 轮）
        working-directory: factory/digital
        run: |
          val() { grep "^$1=" /tmp/fac/.env | cut -d= -f2; }
          python tests/check_cae.py --hub http://localhost:8100 --erp http://localhost:8090 \
            --erp-key "$(val WQ_ERP_API_KEY)" --erp-secret "$(val WQ_ERP_API_SECRET)"
      - name: 虚拟 PLC（第 18 轮第 8 步）
        working-directory: factory/digital
        run: |
          set +e
          python tests/check_vplc.py --hub http://localhost:8100 2>&1 | tee /tmp/logs/vplc.log
          st=${PIPESTATUS[0]}
          if [ "$st" != 0 ]; then
            { cat /tmp/logs/vplc.log; echo "---- 仿真车间 ----"; docker compose -p wq-factory -f /tmp/fac/docker-compose.yml -f /tmp/fac/ci.yml logs --no-color --tail 60 sim; } > /tmp/logs/vplc_diag.log 2>&1
            python3 ../deploy/ci_annotate.py 虚拟PLC诊断 /tmp/logs/vplc_diag.log 120
          fi
          exit "$st"
      - name: ERPNext 单点登录（第 7 轮）
        working-directory: /tmp/fac
        run: |
          val() { grep "^$1=" /tmp/fac/.env | cut -d= -f2; }
          pip install -q "requests>=2.31"
          docker compose -p wq-factory -f docker-compose.yml -f ci.yml run --rm seed python seed.py --url http://erp-frontend:8080 \
            --user Administrator --password "$(val ERP_ADMIN_PASSWORD)" --erp-sso-only --sso-secret "$(val WQ_ERP_OAUTH_SECRET)" \
            --factory-url https://factory.example.test 2>&1 | tee /tmp/logs/erp_sso_seed.log
          python "$GITHUB_WORKSPACE/factory/digital/tests/check_erp_sso.py" --hub http://localhost:8100 --erp http://localhost:8090 \
            --secret "$(val WQ_SECRET)" 2>&1 | tee /tmp/logs/erp_sso.log
          st=${PIPESTATUS[0]}
          if [ "$st" != 0 ]; then
            dc() { docker compose -p wq-factory -f docker-compose.yml -f ci.yml "$@"; }
            { cat /tmp/logs/erp_sso_seed.log; echo "---- 演练 ----"; cat /tmp/logs/erp_sso.log; echo "---- 枢纽 ----"; dc logs --no-color --tail 40 hub;
              echo "---- ERPNext ----"; dc exec -T erp-backend bash -c 'tail -n 60 logs/frappe.log logs/web.error.log 2>/dev/null'; } > /tmp/logs/sso_diag.log 2>&1 || true
            python3 "$GITHUB_WORKSPACE/factory/deploy/ci_annotate.py" 单点登录诊断 /tmp/logs/sso_diag.log 200
          fi
          exit "$st"
      - name: 企业版演示工厂（第 9 轮）
        run: |
          set +e
          val() { grep "^$1=" /tmp/fac/.env | cut -d= -f2; }
          bash -c ". '$FACTORY_DIR/deploy/lib.sh'; demo_setup" 2>&1 | tee /tmp/logs/demo_setup.log
          st=${PIPESTATUS[0]}
          if [ "$st" = 0 ]; then
            sleep 20
            python factory/digital/tests/check_demo.py --hub http://localhost:8101 --erp http://localhost:8092 \
              --key "$(val WQ_DEMO_ERP_API_KEY)" --secret "$(val WQ_DEMO_ERP_API_SECRET)" \
              --teach-erp http://localhost:8090 --teach-key "$(val WQ_ERP_API_KEY)" --teach-secret "$(val WQ_ERP_API_SECRET)" \
              2>&1 | tee /tmp/logs/demo.log
            st=${PIPESTATUS[0]}
          fi
          if [ "$st" != 0 ]; then
            dc() { docker compose -p wq-factory -f /tmp/fac/docker-compose.yml -f /tmp/fac/ci.yml "$@"; }
            { tail -n 60 /tmp/logs/demo_setup.log; echo "---- 演练 ----"; cat /tmp/logs/demo.log 2>/dev/null;
              echo "---- 枢纽 ----"; dc logs --no-color --tail 40 hub-demo; echo "---- 桥接 ----"; dc logs --no-color --tail 40 bridge-demo | grep -v "^$"; } > /tmp/logs/demo_diag.log 2>&1
            python3 factory/deploy/ci_annotate.py 演示工厂诊断 /tmp/logs/demo_diag.log 200
          fi
          exit "$st"
      - name: 班级工厂（第 10 轮）· 机器人厂起得来、闭环走通（第 45 轮）
        run: |
          set +e
          val() { grep "^$1=" /tmp/fac/.env | cut -d= -f2; }
          pip install -q pyyaml
          python3 factory/deploy/classes.py factory/deploy/classes.yaml "$FACTORY_DIR/docker-compose.classes.yml" --ci-ports
          python3 factory/deploy/classes.py factory/deploy/classes.yaml --ids > "$FACTORY_DIR/classes.ids"
          python3 factory/deploy/classes.py factory/deploy/classes.yaml --plants > "$FACTORY_DIR/classes.plants"
          # 演练按清单起的那座（机器人厂）：减速器厂的闭环已由教学工厂、演示工厂两步覆盖；没有按清单的班级时演练第一个
          id=$(cut -f1 "$FACTORY_DIR/classes.plants" | head -n 1)
          [ -n "$id" ] || id=$(cut -d' ' -f1 "$FACTORY_DIR/classes.ids")
          n=0; for c in $(cat "$FACTORY_DIR/classes.ids"); do [ "$c" = "$id" ] && break; n=$((n + 1)); done
          hubp=$((8102 + n)); erpp=$((8093 + n))
          up=$(echo "$id" | tr '[:lower:]' '[:upper:]')
          export FACTORY_COMPOSE="docker-compose.yml ci.yml docker-compose.classes.yml"
          # 和 deploy/update.sh 一样先给每个班级工厂生成工作台密钥：服务配置里所有班的密钥都是必填（只演练一座也要）
          for c in $(cat "$FACTORY_DIR/classes.ids"); do
            k="WQ_C_$(echo "$c" | tr '[:lower:]' '[:upper:]')_SECRET"
            grep -q "^$k=." /tmp/fac/.env || echo "$k=$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32 || true)" >> /tmp/fac/.env
          done
          bash -c ". '$FACTORY_DIR/deploy/lib.sh'; class_setup '$id'" 2>&1 | tee /tmp/logs/class_setup.log
          st=${PIPESTATUS[0]}
          if [ "$st" = 0 ]; then
            # 第 51 轮：公共工厂的枢纽带上班级工厂的配置重启（工业园：接入的班级工厂来下单、收发货回传）
            (cd "$FACTORY_DIR" && docker compose -p wq-factory -f docker-compose.yml -f ci.yml -f docker-compose.classes.yml up -d hub)
            for i in $(seq 1 40); do curl -fsS localhost:8100/api/health && break; sleep 5; done
            # 第 55 轮 K-7（效率）：两厂互发订单、整机标定这两段只在相关文件改动时演练；取不到改动清单（手动运行等）就都跑
            before="${{ github.event.before }}"; changed=""
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              git fetch -q --depth=1 origin "$before" 2>/dev/null && changed=$(git diff --name-only "$before" HEAD)
            fi
            park=""; extra=""
            if grep -q "park: true" factory/deploy/classes.yaml && { [ -z "$changed" ] || echo "$changed" | grep -qE \
                "hub/(park|supply|supply_api|finance|mrp|lab27)\.py|bridge/|plants/wenquest-|deploy/classes|tests/plant_loop\.py|workflows/factory\.yml"; }; then
              park="--park-hub http://localhost:8100 --lab27"
            fi
            if [ -z "$changed" ] || echo "$changed" | grep -qE \
                "sim/(calib|errors|engine)\.py|hub/lab26\.py|plants/wenquest-robot|tests/plant_loop\.py|workflows/factory\.yml"; then
              extra="--lab26"
            fi
            echo "本次演练：两厂互发订单 $([ -n "$park" ] && echo 跑 || echo 不跑)；整机标定 $([ -n "$extra" ] && echo 跑 || echo 不跑)"
            for i in $(seq 1 40); do curl -fsS localhost:$hubp/api/health && break; sleep 5; done
            cd factory/digital
            if grep -q "^$id	" "$FACTORY_DIR/classes.plants"; then
              python tests/plant_loop.py --hub http://localhost:$hubp --erp http://localhost:$erpp --erp-kind real \
                --erp-key "$(val WQ_C_${up}_ERP_API_KEY)" --erp-secret "$(val WQ_C_${up}_ERP_API_SECRET)" --speed 300 --timeout 900 \
                --item WQ-AGV300:2 --item WQ-CR5 --lab24 --expect-buy WQR-105 --expect-products WQ-CR5,WQ-AGV300,WQJ-L,WQJ-M,WQJ-S $extra $park \
                2>&1 | tee /tmp/logs/class_loop.log
            else
              python tests/closed_loop.py --hub http://localhost:$hubp --erp http://localhost:$erpp --erp-kind real \
                --erp-key "$(val WQ_C_${up}_ERP_API_KEY)" --erp-secret "$(val WQ_C_${up}_ERP_API_SECRET)" --speed 300 --timeout 900 \
                2>&1 | tee /tmp/logs/class_loop.log
            fi
            st=${PIPESTATUS[0]}
            cd -
          fi
          if [ "$st" != 0 ]; then
            dc() { docker compose -p wq-factory -f /tmp/fac/docker-compose.yml -f /tmp/fac/ci.yml -f /tmp/fac/docker-compose.classes.yml "$@"; }
            { tail -n 60 /tmp/logs/class_setup.log; echo "---- 闭环 ----"; grep -v "ERPNext 进度" /tmp/logs/class_loop.log 2>/dev/null | tail -n 60;
              echo "---- 枢纽 ----"; dc logs --no-color --tail 40 hub-c-$id; echo "---- 桥接（出错的行）----"; dc logs --no-color bridge-c-$id | grep -E "\[error\]" | tail -n 30;
              echo "---- 枢纽报错（供应链、工业园）----"; dc logs --no-color hub-c-$id | grep -A14 -E "供应链出错|工业园出错|开票出错|AI 巡检出错" | tail -n 60;
              echo "---- 公共工厂枢纽（工业园）----"; dc logs --no-color hub | grep -A10 -iE "park|工业园" | tail -n 30;
              echo "---- 公共工厂桥接（出错的行）----"; dc logs --no-color bridge | grep -E "\[error\]" | tail -n 20;
              echo "---- 车间仿真 ----"; dc logs --no-color --tail 60 sim-c-$id; } > /tmp/logs/class_diag.log 2>&1
            # 闭环测试的失败项单独发一条注释（混在长日志里会被截掉）
            grep -v "ERPNext 进度" /tmp/logs/class_loop.log 2>/dev/null | grep -E "✗|失败|超时|Traceback|Error|错误" | tail -n 40 > /tmp/logs/class_fail.log
            python3 factory/deploy/ci_annotate.py 班级工厂闭环失败项 /tmp/logs/class_fail.log 40
            python3 factory/deploy/ci_annotate.py 班级工厂诊断 /tmp/logs/class_diag.log 200
          fi
          exit "$st"
      - name: 出错时的日志
        if: failure()
        working-directory: /tmp/fac
        run: |
          dc() { docker compose -p wq-factory -f docker-compose.yml -f ci.yml "$@"; }
          mkdir -p /tmp/logs
          dc ps -a > /tmp/logs/ps.log 2>&1 || true
          for s in hub bridge sim erp-backend erp-queue-short; do dc logs --no-color --tail 200 "$s" > "/tmp/logs/$s.log" 2>&1 || true; done
          dc exec -T erp-backend bash -c 'tail -n 80 logs/frappe.log logs/web.error.log 2>/dev/null' > /tmp/logs/erp-files.log 2>&1 || true
          a() { python3 "$GITHUB_WORKSPACE/factory/deploy/ci_annotate.py" "$@"; }
          # GitHub 每步最多显示约 10 条注释：闭环测试失败时只发与它相关的
          if [ -s /tmp/logs/closed_loop.log ]; then
            # 闭环测试的输出后面接上桥接日志，作为同一组注释发出
            # 最要紧的放最前面：ERPNext 错误日志、桥接报的错（去重、去 HTML），然后是测试输出
            {
              cat /tmp/logs/erp_errors.log 2>/dev/null || true
              echo "---------- 桥接报错 ----------"
              grep "\[error\]" /tmp/logs/bridge.log | sed -e 's/<[^>]*>//g' -e 's/^.*\[error\] //' | cut -c1-260 | sort | uniq -c | sort -rn | head -15 || true
              echo "---------- 闭环测试 ----------"
              grep -v "ERPNext 进度" /tmp/logs/closed_loop.log | tail -n 60
            } > /tmp/logs/combined.log
            grep -E "✗|^失败|^  - " /tmp/logs/closed_loop.log | head -30 > /tmp/logs/fail.log || true
            [ -s /tmp/logs/fail.log ] && a 闭环失败项 /tmp/logs/fail.log 30
            grep -iE "error|traceback|exception" /tmp/logs/hub.log | tail -n 20 > /tmp/logs/hub_err.log || true
            [ -s /tmp/logs/hub_err.log ] && a 枢纽报错 /tmp/logs/hub_err.log 20
            a 诊断 /tmp/logs/combined.log 150
            # 车间仿真的日志也发出来（日志文件在本环境下不了，只能看注释）
            grep -v "^\s*$" /tmp/logs/sim.log | tail -n 80 > /tmp/logs/sim_tail.log || true
            [ -s /tmp/logs/sim_tail.log ] && a 车间仿真 /tmp/logs/sim_tail.log 80
            a ERPNext日志 /tmp/logs/erp-files.log 60
            ls -la /tmp/logs > /tmp/logs/ls.txt; a 日志文件 /tmp/logs/ls.txt 30
          else
            [ -s /tmp/logs/install.log ] && a 安装 /tmp/logs/install.log 120
            a 容器 /tmp/logs/ps.log 40
            a 枢纽 /tmp/logs/hub.log 60
            a ERPNext /tmp/logs/erp-backend.log 60
          fi
          true

  local:
    # 第 30 轮 H-5：学校机房的本地版（factory/local/start.sh）能一条命令起整座工厂；学生、老师的登录分开；闭环演练 1–3 段通过。
    # 不挡部署（deploy 只等 build、rehearsal）
    name: 本地版能起来
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: 启动本地版（教学模式、演示工厂、模拟 ERPNext）
        run: factory/local/start.sh 2>&1 | tee "$RUNNER_TEMP/start.log"
      - name: 枢纽健康、总线已连、仿真车间在发数据
        run: |
          for i in $(seq 1 60); do
            h=$(curl -fsS http://localhost:8100/api/health || true)
            echo "$h"
            python3 -c 'import json, sys; h = json.loads(sys.argv[1] or "{}"); sys.exit(0 if h.get("ok") and h.get("bus") and h.get("messages", 0) > 0 else 1)' "$h" && exit 0
            sleep 5
          done
          exit 1
      - name: 网页、“本地版”标识、学生与老师分开登录
        run: |
          curl -fsS http://localhost:8100/ | grep -q '<div id="app"'
          pw=$(sed -n 's/^WQ_TEACHER_PASSWORD=//p' factory/digital/.env)
          test -n "$pw"
          grep -q "老师密码：$pw" "$RUNNER_TEMP/start.log"          # 第一次启动把老师密码显示出来
          python3 - "$pw" <<'PY'
          import json, sys, urllib.error, urllib.request
          H = "http://localhost:8100/api"
          def post(path, body):
              req = urllib.request.Request(H + path, data=json.dumps(body).encode(), headers={"content-type": "application/json"})
              try:
                  return 200, json.loads(urllib.request.urlopen(req, timeout=30).read())
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()
          cfg = json.load(urllib.request.urlopen(H + "/config", timeout=30))
          assert cfg["edition"] == "local" and cfg["plant"]["demo"], cfg.get("edition")
          info = json.load(urllib.request.urlopen(H + "/login/info", timeout=30))
          assert info["teacher_password"] is True, info
          code, r = post("/login", {"name": "CI 学生", "role": "planner", "mode": "prod"})
          assert code == 200 and r["user"]["teacher"] is False and r["user"]["mode"] == "teach", (code, r)
          code, r = post("/login", {"name": "CI 学生", "role": "manager", "mode": "teach"})
          assert code == 403, (code, r)
          code, r = post("/login", {"name": "CI 老师", "role": "manager", "mode": "prod", "teacher_password": "wrong"})
          assert code == 403, (code, r)
          code, r = post("/login", {"name": "CI 老师", "role": "manager", "mode": "prod", "teacher_password": sys.argv[1]})
          assert code == 200 and r["user"]["teacher"] is True and r["user"]["mode"] == "prod", (code, r)
          print("登录：学生只有学生岗位、教学模式；老师要密码")
          PY
      - name: 闭环演练 1–3 段（重置情景 → 读看板 → 接单算料写进模拟 ERPNext）
        working-directory: factory/digital
        run: |
          python3 tests/closed_loop.py --hub http://localhost:8100 --erp http://localhost:8091 --upto 3 --timeout 300 \
            --teacher-password "$(sed -n 's/^WQ_TEACHER_PASSWORD=//p' .env)" 2>&1 | tee "$RUNNER_TEMP/closed_loop.log"
      - name: 失败时的日志
        if: failure()
        run: |
          cd factory/digital
          { docker compose --profile mock ps -a; docker compose --profile mock logs --no-color --tail 80 hub sim bridge mock-erpnext; } > "$RUNNER_TEMP/local_diag.log" 2>&1 || true
          [ ! -s "$RUNNER_TEMP/closed_loop.log" ] || { grep -E "✗|失败|Traceback|Error" "$RUNNER_TEMP/closed_loop.log" | tail -n 30 > "$RUNNER_TEMP/local_fail.log"; python3 ../deploy/ci_annotate.py 本地版闭环失败项 "$RUNNER_TEMP/local_fail.log" 30; }
          python3 ../deploy/ci_annotate.py 本地版诊断 "$RUNNER_TEMP/local_diag.log" 150
      - name: 停止
        if: always()
        run: factory/local/stop.sh --reset

  help-videos:
    # 第 30 轮 H-4：在本地版（教学模式、演示工厂）里按剧本操作、录下帮助视频（tools/help_videos.py，字幕叠画面、不配音）；
    # 推送到 main 时发布到 Release help-videos，镜像构建时取最新的一份（factory/digital/Dockerfile）。不挡部署
    name: 录帮助视频
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write          # 发布到 Release
    steps:
      - uses: actions/checkout@v4
      - name: 启动本地版
        run: factory/local/start.sh
      - name: 等仿真车间有数据
        run: |
          for i in $(seq 1 60); do
            h=$(curl -fsS http://localhost:8100/api/health || true)
            python3 -c 'import json, sys; h = json.loads(sys.argv[1] or "{}"); sys.exit(0 if h.get("bus") and h.get("messages", 0) > 0 else 1)' "$h" && exit 0
            sleep 5
          done
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 录教学版帮助视频
        run: |
          pip install -q playwright==1.55.0 && python -m playwright install --with-deps chromium >/dev/null
          python factory/digital/tools/help_videos.py --hub http://localhost:8100 --edition teach --out help-media \
            --teacher-password "$(sed -n 's/^WQ_TEACHER_PASSWORD=//p' factory/digital/.env)" 2>&1 | tee "$RUNNER_TEMP/videos.log"
          tar czf help-videos-teach.tar.gz -C help-media . && ls -la help-media
      - name: 录机器人厂帮助视频（第 45 轮：本地版换成机器人厂清单，先做一台关节出测量数据）
        run: |
          factory/local/stop.sh --reset
          factory/local/start.sh --plant factory/plants/wenquest-robot.yaml
          for i in $(seq 1 60); do curl -fsS http://localhost:8100/api/health >/dev/null && break; sleep 5; done
          pw="$(sed -n 's/^WQ_TEACHER_PASSWORD=//p' factory/digital/.env)"
          (cd factory/digital && python tests/plant_loop.py --hub http://localhost:8100 --erp http://localhost:8091 --item WQJ-S \
            --qty 3 --timeout 600 --teacher-password "$pw" 2>&1 | tail -n 15) || true
          python factory/digital/tools/help_videos.py --hub http://localhost:8100 --edition robot --out help-media-robot \
            --teacher-password "$pw" 2>&1 | tee -a "$RUNNER_TEMP/videos.log"
          tar czf help-videos-robot.tar.gz -C help-media-robot . && ls -la help-media-robot
      - uses: actions/upload-artifact@v4
        with:
          name: help-videos-teach
          path: help-videos-*.tar.gz
      - name: 推送到 main 时发布帮助视频
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view help-videos >/dev/null 2>&1 || gh release create help-videos --title "帮助的操作视频" \
            --notes "CI 在本地版上自动录制（第 30 轮 H-4），数字工厂镜像构建时取用。" --prerelease
          gh release upload help-videos help-videos-teach.tar.gz help-videos-robot.tar.gz --clobber
      - name: 视频没录成时的输出（写成注释）
        if: failure()
        run: '[ ! -f "$RUNNER_TEMP/videos.log" ] || python3 factory/deploy/ci_annotate.py 录视频 "$RUNNER_TEMP/videos.log" 60'
      - name: 停止
        if: always()
        run: factory/local/stop.sh --reset

  build:
    name: 构建镜像
    needs: test
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.meta.outputs.app }}
      bridge: ${{ steps.meta.outputs.bridge }}
      openplc: ${{ steps.meta.outputs.openplc }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "app=ghcr.io/${repo}/factory-app:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "bridge=ghcr.io/${repo}/factory-bridge:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "openplc=ghcr.io/${repo}/factory-openplc:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: factory
          file: factory/digital/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.app }}
          build-args: HELP_VIDEOS_STAMP=${{ github.sha }}      # 帮助视频那一步不走缓存，取 Release 里最新的一份（第 30 轮 H-4）
          cache-from: type=gha,scope=factory-app
          cache-to: type=gha,mode=max,scope=factory-app
      - uses: docker/build-push-action@v6
        with:
          context: factory/digital/bridge
          push: true
          tags: ${{ steps.meta.outputs.bridge }}
          cache-from: type=gha,scope=factory-bridge
          cache-to: type=gha,mode=max,scope=factory-bridge
      - uses: docker/build-push-action@v6          # OpenPLC 运行时（第 18 轮第 8 步）
        with:
          context: factory/digital
          file: factory/digital/openplc/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.openplc }}
          cache-from: type=gha,scope=factory-openplc
          cache-to: type=gha,mode=max,scope=factory-openplc

  deploy:
    name: 部署到服务器
    needs: [build, rehearsal]
    runs-on: ubuntu-latest
    environment: production
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: 检查部署设置
        run: |
          if [ -z "$HOST" ]; then
            echo "::warning::DEPLOY_HOST 没有设置，跳过部署（镜像已构建）。"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: SSH
        if: env.SKIP != '1'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -t ed25519 "$HOST" > ~/.ssh/known_hosts
          fi
      - name: 复制部署文件到 /opt/wenquest/factory
        if: env.SKIP != '1'
        run: |
          mkdir -p stage/deploy stage/mosquitto
          cp factory/deploy/docker-compose.server.yml stage/docker-compose.yml
          cp factory/deploy/*.sh stage/deploy/
          cp factory/digital/mosquitto/server/* stage/mosquitto/
          # 班级工厂（第 10 轮）：按 classes.yaml 生成服务配置和编号表
          python3 -c "import yaml" 2>/dev/null || pip install -q pyyaml || pip install -q --break-system-packages pyyaml \
            || { echo "::error::装不上 pyyaml"; exit 1; }
          for a in "stage/docker-compose.classes.yml" "--ids" "--names" "--plants"; do
            case "$a" in --*) out="stage/classes.${a#--}";; *) out=/dev/null;; esac
            python3 factory/deploy/classes.py factory/deploy/classes.yaml $a > "$out" 2> /tmp/classes.err \
              || { echo "::error::classes.py $a 出错：$(tail -c 400 /tmp/classes.err | tr '\n' ' ')"; exit 1; }
          done
          tar czf - -C stage . | ssh "deploy@$HOST" \
            'mkdir -p /opt/wenquest/factory && tar xzf - -C /opt/wenquest/factory && chmod +x /opt/wenquest/factory/deploy/*.sh' 2> /tmp/copy.err \
            || { echo "::error::复制到服务器出错：$(tail -c 600 /tmp/copy.err | tr '\n' ' ')"; exit 1; }
      - name: 更新数字工厂
        if: env.SKIP != '1'
        run: |
          # 学习平台与数字工厂部署在同一台服务器：登录、拉镜像、清理镜像排队做（同一把锁），避免同时推送时互相打断
          set +e
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh "deploy@$HOST" "flock -w 1500 /tmp/wenquest-deploy.lock sh -c 'docker login ghcr.io -u ${{ github.actor }} --password-stdin && /opt/wenquest/factory/deploy/update.sh ${{ needs.build.outputs.app }} ${{ needs.build.outputs.bridge }} ${{ needs.build.outputs.openplc }}'" 2>&1 | tee /tmp/update.log
          st=${PIPESTATUS[0]}
          if [ "$st" != 0 ]; then
            python3 factory/deploy/ci_annotate.py 服务器更新 /tmp/update.log 180
            ssh "deploy@$HOST" "cd /opt/wenquest/factory && docker compose -p wq-factory ps -a && docker compose -p wq-factory logs --no-color --tail 60 hub bridge erp-backend" > /tmp/server.log 2>&1
            python3 factory/deploy/ci_annotate.py 服务器容器 /tmp/server.log 180
          fi
          exit "$st"
      - name: 检查两个网址
        if: env.SKIP != '1'
        run: |
          domain=$(ssh "deploy@$HOST" "grep '^SITE_DOMAIN=' /opt/wenquest/factory/.env | cut -d= -f2")
          for u in "https://factory.$domain/api/health" "https://erp.$domain/api/method/ping"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u" || true)
            echo "$u → $code"
            if [ "$code" != 200 ]; then
              echo "::warning::$u 还打不开（$code）。如果刚加了域名解析，等几分钟后再试；学习平台的部署完成后网址才会接通。"
            fi
          done
      - name: 线上车间检查
        if: env.SKIP != '1'
        continue-on-error: true
        run: |
          # 第 6 轮 W7①：像浏览器一样连总线，看设备有没有在发数据；再读服务器上的容器状态和仿真日志。结果写成注释
          domain=$(ssh "deploy@$HOST" "grep '^SITE_DOMAIN=' /opt/wenquest/factory/.env | cut -d= -f2")
          pip install -q "paho-mqtt==2.1.0"
          sleep 20
          python3 factory/deploy/online_check.py "$domain" 30 || true
          python3 factory/deploy/online_check.py "$domain" 30 demo demo-erp prod || true      # 第 9 轮：演示工厂
          pip install -q pyyaml
          for id in $(python3 factory/deploy/classes.py factory/deploy/classes.yaml --ids); do     # 第 10 轮：班级工厂
            python3 factory/deploy/online_check.py "$domain" 30 "$id.factory" "$id.erp" teach || true
          done
          ssh "deploy@$HOST" "cd /opt/wenquest/factory && docker compose -p wq-factory ps --format 'table {{.Service}}\t{{.State}}\t{{.Status}}' && echo && docker compose -p wq-factory logs --no-color --tail 25 sim bus && echo '---- 单点登录（枢纽）----' && docker compose -p wq-factory logs --no-color --since 6h hub 2>&1 | grep -iE 'oauth|ERPNext|Traceback|Error' | tail -n 30 && echo '---- 单点登录（ERPNext）----' && docker compose -p wq-factory exec -T erp-backend bash -c 'grep -ihE \"oauth|social|login\" logs/*.log | tail -n 30'; cat /tmp/wq-sso.log 2>/dev/null | tail -5" > /tmp/workshop.log 2>&1 || true
          python3 factory/deploy/ci_annotate.py 服务器车间状态 /tmp/workshop.log 150 | sed 's/^::error /::notice /'
