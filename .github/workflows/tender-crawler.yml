# 招标抓取（第 119 轮）：装到国内服务器、立即运行、查看状态、取回结果。
# 程序在 ops/tender-crawler/，服务器上以 deploy 用户运行在 ~/tender-crawler（不用 sudo）。
name: tender-crawler

on:
  workflow_dispatch:
    inputs:
      action:
        description: "install=安装/升级并试跑；run=立即抓一次；status=看状态；fetch=取回最新结果；probe=只读诊断来源；cleanup=服务器磁盘清理（deploy/free-disk.sh）"
        type: choice
        options: [fetch, status, run, install, probe, cleanup]
        default: fetch
      urls:
        description: "probe 时要看的网址（空格分隔，可留空）"
        required: false
        default: ""
  schedule:
    - cron: "10 23 * * *"   # 北京时间 07:10：06 点抓完后取回结果

concurrency:
  group: tender-crawler
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HOST: ${{ secrets.CN_DEPLOY_HOST }}
      ACTION: ${{ github.event.inputs.action || 'fetch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          [ -n "$HOST" ] || { echo "CN_DEPLOY_HOST 未设置"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.CN_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "${{ secrets.CN_DEPLOY_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.CN_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -t ed25519 "$HOST" > ~/.ssh/known_hosts
          fi

      - name: Install / upgrade
        if: env.ACTION == 'install'
        run: |
          python -m pip install -q pytest pyyaml requests beautifulsoup4 lxml
          (cd ops/tender-crawler && python -m pytest -q tests)
          tar czf - -C ops/tender-crawler --exclude=tests --exclude=__pycache__ . \
            | ssh "deploy@$HOST" 'mkdir -p ~/tender-crawler && tar xzf - -C ~/tender-crawler && bash ~/tender-crawler/server-install.sh'

      - name: Run now
        if: env.ACTION == 'install' || env.ACTION == 'run'
        run: ssh "deploy@$HOST" 'bash ~/tender-crawler/cron.sh --force 2>&1 | tail -40'

      - name: Status
        if: env.ACTION == 'status'
        run: |
          ssh "deploy@$HOST" 'df -h / /opt 2>/dev/null; docker system df 2>/dev/null; du -sh ~/tender-crawler ~/tender-crawler/* /opt/wenquest/* 2>/dev/null | sort -h | tail -15; cd ~/tender-crawler && echo "镜像: $(cat image.txt)"; crontab -l | grep tender-crawler; echo "最后运行: $(cat data/.last_run 2>/dev/null)"; ls -la data | tail -15; tail -40 data/cron.log 2>/dev/null'

      - name: Free disk space
        if: env.ACTION == 'cleanup'   # 只在手动选 cleanup 时运行
        run: ssh "deploy@$HOST" 'bash -s' < deploy/free-disk.sh

      - name: Probe sources
        if: env.ACTION == 'probe'
        run: |
          tar czf - -C ops/tender-crawler probe.sh | ssh "deploy@$HOST" 'tar xzf - -C ~/tender-crawler && bash ~/tender-crawler/probe.sh ${{ github.event.inputs.urls }}'

      - name: Fetch results
        if: always() && (env.ACTION == 'fetch' || env.ACTION == 'run' || env.ACTION == 'install')
        run: |
          mkdir -p feed
          scp "deploy@$HOST:tender-crawler/data/latest.json" "deploy@$HOST:tender-crawler/data/latest.md" feed/
          cat feed/latest.md >> "$GITHUB_STEP_SUMMARY"
          # 附件下载地址（blob.core.windows.net）在一些环境里不能访问，结果同时写进日志，用 gh run view --log 读取
          echo "=====TENDER-FEED-JSON-BEGIN====="; python3 -c "import json;print(json.dumps(json.load(open('feed/latest.json')),ensure_ascii=False))"; echo "=====TENDER-FEED-JSON-END====="

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('feed/latest.json') != ''
        with:
          name: tender-feed
          path: feed/
          retention-days: 7
