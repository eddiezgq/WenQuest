vendor: {id: FANUC, name: {zh: 发那科, en: FANUC}, site: https://www.fanucamerica.com/products/robot}
retrieved: "2026-09-30"
# 说明：
# - 所有数字取自 FANUC 官方站点产品页的规格表（HTML），每个型号同一页面独立取两次、两种问法逐字比对，全部一致（例外见各型号 note）。
# - FANUC 官方规格表只给每轴“运动范围总角度”（如 J1 340°），不给上下限，故不收 joint_range_deg；总角度写在 note 里，按轴 1～6。
# - 工作半径口径：FANUC 样本的工作空间图标注为 “Operating space of the J5-axis rotation center”（见 src fanuc_reach_def），即到手腕中心（J5 轴回转中心）。
# - power_typical_w 对应官网 “Average Power Consumption”（平均耗电）。
# - FANUC 官方 PDF 样本（fanuc.co.jp / fanuc.com 的 LR Mate、M-20iB 样本）文本抽取后表格列错位，数字无法可靠对应型号，未用作数据出处。
sources:
