robots:
  - model: KR 3 R540
    key: kr3r540
    src: kr3_press
    datasheet: {payload_kg: 3}
    note: "KR 3 AGILUS 已不在 kuka.com KR AGILUS 产品页上，只有 2016 年官方新闻稿可用：原文 \"With a payload capacity of 3 kg and a reach of 540 mm\"（两次读取一致）。新闻稿的 540 mm 是概数、未写明到哪个点，与型号规格书常见的 541 mm 可能不一致（后者只在第三方网站见到，不采用），故 reach 留空。新闻稿另写可在 600 x 600 mm 的工作单元内使用，这是单元尺寸不是底座尺寸，未收 footprint。轴数、重复精度、重量、IP 均无官方可读来源，未收。"
  - model: KR 6 R900-2
    key: kr6r900sixx
    src: agilus_web
    datasheet: {payload_kg: 6, reach_mm: 901, dof: 6, ip: "IP65/IP67"}
    note: "官网已不列 KR 6 R900 sixx，只剩新一代 KR 6 R900-2，此条取 KR 6 R900-2 的参数（sixx 老型号数据未取）。Total load 6 kg、Maximum reach 901 mm 三个地区页读取一致；页面未写明工作半径参考点。轴数：表内无此字段，取页面正文 \"The KR AGILUS is our compact six-axis robot\"（系列通用）。Protection class 原文 \"IP 65, IP 67\"，未分部位（不确定是本体与手腕分别对应，还是可选两档）。控制柜 KR C5 micro / KR C5 micro-2。重复精度、重量、底座、轴范围与速度官网页无，未收。"
  - model: KR 10 R1100-2
    key: kr10r1100sixx
    src: agilus_web
    datasheet: {payload_kg: 11, reach_mm: 1101, dof: 6, ip: "IP65/IP67"}
    note: "官网已不列 KR 10 R1100 sixx，只剩新一代 KR 10 R1100-2，此条取 KR 10 R1100-2 的参数（sixx 老型号数据未取）。注意型号名带 10，但官网 Total load 写 11 kg（三个地区页读取一致），按原文收 11。Maximum reach 1101 mm，未写明参考点。轴数取页面正文 six-axis（系列通用）。Protection class 原文 \"IP 65, IP 67\"，未分部位。重复精度、重量、底座、轴范围与速度官网页无，未收。"
  - model: LBR iiwa 14 R820
    key: lbr_iiwa_14_r820
    src: iiwa_web
    datasheet: {payload_kg: 14, reach_mm: 820, dof: 7, ip: IP54}
    note: "Total load 14 kg、Maximum reach 820 mm、Protection class IP 54，四个地区页读取一致；页面未写明工作半径参考点，IP 未分部位。轴数 7 取页面正文 \"joint torque sensors in all seven axes\"。页面另写 axis-specific torque accuracy ±2% of the maximum torque（未收）。控制柜 KUKA Sunrise Cabinet。重复精度、重量、底座、轴范围与速度、TCP 速度官网页无（官方宣传册 PDF 链接未能取到），未收。"
