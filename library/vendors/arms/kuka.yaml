# KUKA 工业机械臂（第 5 轮第 3 步第 3 批）。
# 出处：只用 kuka.com 官方产品页与官方新闻稿。
#   kuka.com / my.kuka.com / xpert.kuka.com 对命令行一律 403，只能经网页抓取工具读取；
#   my.kuka.com 型号页（Salesforce 前端）抓回来只有加载页、没有数据；官方数据表 PDF 在下载中心/xpert 需登录，
#   搜索引擎找不到 kuka.com 域下的数据表 PDF；网上能找到的规格书 PDF 都挂在经销商/第三方网站（robots.com、digikey、scribd 等），按规矩不用。
#   kuka.com 产品页的技术数据表只有：Total load、Maximum reach、Construction type、Version environment、Mounting positions、Protection class、Controller，
#   没有重复精度、重量、底座尺寸、轴范围与轴速度，所以这些键一律未收。
# 不收：KR 16-2（已停产，kuka.com 产品页与可抓取的官方资料都查不到）；
#   KR 120 R2500 pro、KR 210 L150（kuka.com KR QUANTEC 页现列型号均为 -2 新一代，无这两个型号；my.kuka.com 页抓不到数据）。
