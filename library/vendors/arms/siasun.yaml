# 新松 Siasun 工业机械臂与 GCR 协作机器人（第 5 轮第 3 步第 3 批）。
# 出处：en.siasun.com 官方产品页（工业机器人、协作机器人）；GCR 协作机器人另用 DUCO 多可官网 ducorobots.cn 产品页补关节范围/速度/功耗。
#   GCR 系列在新松英文官网仍列在 Collaborative Robot 下；DUCO 多可官网页标题写“中科新松工业机器人品牌-DUCO多可机器人”，
#   DUCO 文档中心页脚为“版权所有©中科新松有限公司”。两站都算厂商官方。
# 读不到的：www.siasun.com 中文产品页（PROVENANCE 拦截/404）；ducorobots.com 英文站 403；
#   DUCO 硬件手册 PDF（docs.ducorobots.cn/download/manual/en/duco-hardware-v4.2-en.pdf，2025-04-15）抓取只返回目录，
#   docs.ducorobots.cn 网页版 GCR5-910 页参数表（基本参数、工作空间、DH）全是图片，读不到数字。
#   因此本体重量、底座尺寸、IP 分部位、DH 都没收。
# key 规则：型号小写，“-”“/”换成下划线，小数点去掉（SR12A-12/1.46 -> sr12a_12_146）。
# 两次读取：每个型号都重新抓取原页、第二次要求逐字照抄；数字全部一致（见各条 note）。
# 未收：SR210A-210/2.65（只读了一遍，凑够 5 个型号即停）；新松 SCARA、并联、码垛型号不在本次范围。
