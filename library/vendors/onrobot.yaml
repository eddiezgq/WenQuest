# OnRobot 电动夹爪（第 5 轮第 3 步第 2 批）。全部取官网产品页链接的现行数据表 PDF（onrobot.com/storage/datasheets/…）；
# page 写的是 PDF 第几页（1 起算），规格表在第 1～2 页（供电电压等“工作条件”有的在第 2 页）。每张表两次独立读取，数字一致。
# 不收：RG6 的行程——数据表 v2.0 写 160 mm，官网产品页写 150 mm，原文矛盾，留空；RG2-FT、2FGP20、软夹爪、磁吸等非主力系列不收。
# 外形：2FG7/2FG14 表头标明 [L x W x D]；RG2/RG6 的“213 x 149 x 36”“262 x 212 x 42”表头未标轴向，按 OnRobot 同一写法顺序录为 长 x 宽 x 厚；
# 3FG15/3FG25 表头为 [L, W, Ø]，Ø 是三指张开的外包络直径，厚度列留空。数据表里的外形图是图片，读不到图上标注，未能用图核对轴向。
# VG 真空吸盘：VGC10、VG10 外形齐全，另收一项；VG10 用收拢状态外形，展开 105 x 390 x 390 mm 写在 notes。
