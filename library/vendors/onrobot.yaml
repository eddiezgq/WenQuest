  - id: D-GRP-ONROBOT-VG
    name: {zh: OnRobot 电动真空吸盘夹爪, en: OnRobot electric vacuum gripper}
    category: GRP
    series: VGC10 / VG10
    tags: [夹爪, 真空吸盘, 真空夹爪, 末端执行器, vacuum gripper, end effector]
    default: VGC10
    proxy: box
    dims: {w: width_mm, d: depth_mm, h: height_mm}
    proxy_note: "外形按数据表 Dimensions 三个数字顺序录为 高 x 宽 x 深（VG10 105 x 146 x 146 可确认第一个是高）；VG10 取收拢状态"
    principle: 内置电动真空泵抽走吸盘与工件之间的空气，大气压把工件压在吸盘上；软件可调真空度，多个吸盘可分路控制，不用外接气源。
    uses: [纸箱和板材搬运, 码垛, 平面工件上下料]
    chapter: 末端执行器
    notes: "真空度上限 80 %（-0.810 bar，即 -81 kPa）；VGC10 用默认附件最大 6 kg，定制附件典型 10 kg、最大 15 kg（表中未单列“额定”，额定负载列留空，最大负载取 15 kg）；VG10 额定 10 kg、最大 15 kg。VG10 两臂可展开，展开外形 105 x 390 x 390 mm。供电 20.4～28.8 V，额定 24 V。官方提示：真空夹爪不要用于潮湿或有切削液的环境。"
