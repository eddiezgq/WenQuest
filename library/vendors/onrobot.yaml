    principle: 内置无刷电机经丝杠或连杆带动手指开合，软件可设定夹持力、速度和开口宽度；RG 系列是连杆式长行程夹爪，2FG 是平行夹爪，3FG 三指同步向心收拢，能自动对中夹住圆柱件。
