  default: 20-100
  principle: 波发生器（椭圆凸轮 + 柔性轴承）把柔轮撑成椭圆，柔轮外齿与刚轮内齿在长轴两处啮合；刚轮比柔轮多 2 个齿，波发生器转一圈，柔轮反向转过 2 个齿，单级就能得到 30～160 的大减速比，而且零背隙、体积小。
