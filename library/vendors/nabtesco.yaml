    proxy_note: "RV 减速器画成圆柱示意；直径取外径，高度取官网数据表的轴向长 A"
    principle: RV 减速器分两级：第一级是渐开线行星齿轮——输入轴上的太阳轮带动几个行星轮，先减一次速；行星轮装在曲柄轴上，第二级是摆线针轮——曲柄轴带两片摆线轮做偏心摆动，摆线轮与壳体内一圈针齿啮合，摆动一周只转过一个齿，再大幅减速后由曲柄轴把转动传到输出盘。两级合起来减速比大、刚性高、抗冲击，同时啮合的齿多，背隙小于 1 弧分。
    uses: [工业机器人腰、肩、肘等重载关节, 变位机与精密转台, 机床刀库与分度盘, 自动化搬运设备]
    chapter: 关节驱动与减速器
    checked_note: 样本额定表两次独立读取一致；外径、轴向长两次读取官网数据表一致，外径另与各型号页核对一致；RV-160N 的 NS1 原文矛盾，留空
    notes: "减速比列出的是样本额定表中的标准减速比（以文本存），其他减速比需向厂商询问。背隙、空程为样本所列上限 1.0 arc min（空程在 ±3% 额定转矩下测量）。NS0、NS1 分别是占空比 100% 和 40% 时的允许输出转速，实际随占空比、负载和环境温度变化。RV-160N 的 NS1：样本读到 48 rpm、型号页写 73 rpm，互相矛盾，留空。轴向长 A 取自 nabtesco.de 系列页技术数据表的 A 列，未在样本外形图中复核是否含输出轴伸出部分。"
