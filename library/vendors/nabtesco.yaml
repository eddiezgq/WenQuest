# 纳博特斯克 Nabtesco RV-N 精密减速器（第 5 轮第 3 步第 2 批）。
# 出处：Nabtesco Precision Europe GmbH（纳博特斯克欧洲官方子公司，nabtesco.de）的 RV-N 英文样本 PDF 与官网产品页。
#   nabtesco.com / precision.nabtesco.com 的样本 PDF 要会员登录，取不到；precision.nabtesco.com 产品页的大表抽取时列错位，不采用。
# 额定/启停/瞬时转矩、允许输出转速 NS0/NS1、额定寿命、背隙/空程、质量、减速比：取样本额定表（rating table），
#   page 填 9，是抓取工具报告的额定表所在页码，未能核对是印刷页码还是 PDF 页序，抽查时请两种都看。两次独立读取一致。
# 外径、轴向长 A：取 nabtesco.de RV-N 系列页的技术数据表（外径 B、A 列），两次独立读取一致；外径另与每个型号的产品页逐个核对一致。
#   样本 PDF 的外形图是图形，抽不出尺寸文字，所以外形改用官网数据表。
# 不收：RV-160N 的 NS1（40% 占空比允许输出转速）——样本两次读到 48 rpm，型号页“Maximum Speed”写 73 rpm，原文互相矛盾，留空。
#   扭转刚性、力矩刚性、允许力矩只有官网型号页一处来源、未在样本中复核，不收。
#   RV-900N / RV-2800N / RV-1500E 不在 RV-N 样本额定表里，不收；RV-E 系列未取到可两次核对的样本，不另收。
