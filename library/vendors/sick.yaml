  - id: D-LDR-SICK-TIM
    name: {zh: SICK TiM 小型二维激光扫描仪, en: SICK TiM compact 2D LiDAR sensor}
    category: LDR
    series: TiM5xx / TiM7xx / TiM7xxS
    tags: [激光雷达, 二维激光雷达, 激光扫描仪, 2D LiDAR, 移动机器人, AGV, SLAM]
    default: TiM571-2050101
    proxy: box
    dims: {w: width_mm, d: depth_mm, h: height_mm}
    principle: 激光器发出红外脉冲，内部转镜让光束在一个平面内扫过 270°，测出每个方向上光从发出到反射回来的时间（飞行时间）就得到距离，一圈下来就是一条二维轮廓线。
    uses: [移动机器人与 AGV 的避障和定位建图（SLAM）, 区域监控与物体检测, 机器人教学实验]
    chapter: 激光雷达与环境感知
    notes: "工作范围是最大量程（TiM781S 注明为反射率 >90%）；“10% 反射率扫描距离”是暗目标上的典型距离，均为 8 m。TiM781S 是安全型（PL b、Cat. B，EN ISO 13849-1），安全相关工作范围 0.05～5 m（5% 反射率），数据表未给 SIL/PFHd；TiM781S 只用于室内。质量不含连接电缆。TiM561 与 TiM571 区别在量程（10 m / 25 m），TiM781 在 TiM571 基础上增加数字输出等功能。"
    checked_note: "两次独立读取 4 份官方数据表，所有数字一致；另核对外形行在第 2 页、标注为 L x W x H"
