  - id: D-LDR-SICK-SAFETY
    name: {zh: SICK 安全激光扫描仪, en: SICK safety laser scanner}
    category: LDR
    series: nanoScan3 / microScan3
    tags: [激光雷达, 安全激光扫描仪, 安全传感器, safety laser scanner, AGV, 移动机器人, 功能安全]
    default: NANS3-AAAZ30AN1
    proxy: box
    dims: {w: width_mm, d: depth_mm, h: height_mm}
    proxy_note: "microScan3 Pro 的高度不含装在底面的系统插头，实物更高"
    principle: 与普通激光扫描仪一样靠激光飞行时间在一个平面内测距，但内部电路按功能安全标准做了冗余和自检；人或物体闯入事先设定的保护区时，安全输出在规定的响应时间内断开，让 AGV 或机器停下。
    uses: [AGV 与移动机器人的人员防护和避障减速, 危险区域与机器人工作站的安全防护, 功能安全（PL/SIL）教学]
    chapter: 激光雷达与环境感知
    notes: "保护区范围是可设定的安全停机区域的最大半径；警告区范围是非安全的预警区。nanoScan3 的“测距范围 40 m”是数据输出的测距范围；microScan3 数据表没有这一项，留空。功耗为典型值，不含输出负载（microScan3 Pro 写 typical 7.2 W）。nanoScan3 外形含系统插头；microScan3 Core（1075842 = 传感器 1067360 + 系统插头 2073156）外形 112×135.1×111.1 mm；microScan3 Pro（1091037）数据表外形注明“不含系统插头”，质量 1.45 kg 未注明是否含插头。"
    checked_note: "两次独立读取 4 份官方数据表，所有数字一致；microScan3 两型的外形行第三次逐字核对（Core 含插头、Pro 不含插头）"
