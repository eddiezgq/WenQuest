products:
- id: D-LDR-OUSTER
  name:
    zh: Ouster / Velodyne 旋转式激光雷达
    en: Ouster / Velodyne spinning lidar
  category: LDR
  series: OS / VLP
  tags:
  - 激光雷达
  - 三维激光雷达
  - lidar
  - 建图
  - 自动驾驶
  default: OS1-64
  proxy: cylinder
  dims:
    d: diameter_mm
    h: height_mm
  principle: 多路激光束随头部旋转扫描，测量每个脉冲从发出到返回的时间（飞行时间）算出距离，配合角度得到周围环境的三维点云。
  uses:
  - 移动机器人定位与建图（SLAM）
  - 自动驾驶感知
  - 测绘
  chapter: 激光雷达与环境感知
  notes: 测程按 80% 漫反射目标（另列 10% 目标）；最小测程 0.5 m 为默认，OS0/OS1/OSDome 可设 0；OS2 样本没有单一的额定功耗（正常 18～24 W）；重量、高度不含散热帽。
  checked_note: 两次独立读取官方数据手册，VLP-32C 高度两次不一致，第三次按尺寸图读为 86.9 mm；另抽查 OS1
