- id: D-RDC-NEUGART-PLE
  name:
    zh: 纽卡特 PLE 行星减速机（经济型，一级）
    en: Neugart PLE planetary gearbox (economy line, one stage)
  category: RDC
  series: PLE
  tags:
  - 行星减速器
  - 行星齿轮
  - 精密减速器
  - planetary gearbox
  - AGV 驱动
  default: PLE080-5
  proxy: cylinder
  dims:
    d: D_mm
    h: L_mm
  proxy_note: 行星减速机画成圆柱示意：直径取壳体外径 D6，高度取最小总长 L1（随电机法兰变化）
  origin: 输出端面中心，轴线沿 Z
  principle: 太阳轮在中间，几个行星轮绕着它转，同时与外面固定的内齿圈啮合，行星轮的轴装在行星架上输出。内齿圈固定时传动比 i = 1 + z_圈/z_太阳；功率由几个行星轮分担，所以体积小、能传大力矩，效率高（一级约
    98%）。背隙比谐波、RV 大（几个角分），多用在 AGV 车轮、直线模组、SCARA 和机床进给。
  uses:
  - AGV 车轮驱动
  - 伺服电机减速
  - SCARA 与直线模组
  - 输送与包装机械
  chapter: 关节驱动与减速器
  checked_note: 样本的转矩表（连续、最大、急停）与一般数据两次独立读取一致；外形尺寸读取一次，只用于外形示意
  notes: 只收一级、减速比 3–10 的 060、080、120 三种。T2D 是样本的“连续扭矩”，T2max 是“最大扭矩”，T2stop 是“急停扭矩”（允许
    1000 次）。回程间隙是标准型的上限；抗扭刚度、重量随减速比变化，样本只给范围，按范围收（具体值见厂商的 Tec Data Finder）。效率 98%
    是一级的标称值，寿命 20000 h 是样本的使用寿命。
