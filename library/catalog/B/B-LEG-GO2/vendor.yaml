    3000 W；供电 28V~33.6V。电池：EDU 列为 "long endurance (15000mAh)"、续航 "About 2-4h"、快充 33.6V
    9A。不一致与处理：英文页第一次读取把 EDU 电池读成 standard 8000mAh / 1-2h，专门按列重读英文页与中文页均为 15000mAh
