teaching:
  principle: 六根可伸缩的腿把动平台连到基座，改变六根腿的长度就能让平台在空间里平移和转动（六个自由度）。由平台位姿求腿长（逆解）只要算两点距离，由腿长求位姿（正解）要解非线性方程组——和串联机械臂正好相反。
