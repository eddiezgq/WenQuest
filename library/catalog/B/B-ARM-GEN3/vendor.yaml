    continuous) 4.0 kg"，脚注 *without gripper、**in motion；payload_kg 取全行程连续 2.0 kg（保守口径），中程连续
    4.0 kg 写在此处。Maximum reach 902 mm（未写参考点）。Total weight 8.2 kg（规格书写 total weight，未说明是否含底座接口/线缆）。Maximum
    Cartesian translation speed 50 cm/s → 0.5 m/s。Average power 36 W（平均功率，收作 power_typical_w；无最大功率）。Ingress
    protection IP33（未分部位）。Actuator position range 原文 "Infinite"（执行器本身可无限转，实际关节限位由软件/结构决定），故
    joint_range_deg 不收。供电 18–30 VDC（24 VDC 标称）。6 DoF 版对应值：7.2 kg、891 mm，其余同。重复精度、关节速度、底座尺寸规格书无，未收。
