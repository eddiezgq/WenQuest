  note: '已停产；用官方下载站 download.franka.de 的 2020-04 版数据表。该文档未出现 "Panda" 字样，抬头为 "ROBOT
    ARM & CONTROL"、© 2020 Franka Emika，按发布时间与参数判定为 Panda 一代（FR3 之前的唯一机型），如需确证请抽查。Payload
    3 kg、Maximum reach 855 mm（未写参考点）、Pose repeatability "<+/- 0.1 mm (ISO 9283)"、Cartesian
    "up to 2 m/s end effector speed"，多次读取一致。关节范围原文 "A1, A3, A5, A7: -166°/166° | A2:
    -101°/101° | A4: -176°/-4° | A6: -1°/215°"；关节速度 "A1, A2, A3, A4: 150°/s | A5,
    A6, A7: 180°/s"。重量与 IP 留空：三次读取结果不一致——一次读成 Weight ~12.8 kg、IP30；逐行照抄时 12.8 kg 的行名是
    "Moving mass"（运动质量，不是本体重量）；按词逐项列出时另有 "Weight ~ 17.8 kg" 与 "Protection rating IP30"，但所属栏目被读成
    "ARM & CONTROL"，CONTROL 栏另有 Weight ~7 kg、IP20。PDF 为双栏排版，无法确定 17.8 kg / IP30 是本体还是含控制柜，故不收。Path
    deviation <+/- 1.25 mm（未收）。控制柜 Power consumption ~80 W（非本体，未收）。'
