  note: '三次读取一致。Rated payload 3 kg；Maximum reach 855 mm（数据表未写明参考点）；Position repeatability
    原文 "<+/- 0.1 mm (ISO 9283)"，按规则写 0.1（原文为“小于”）。Weight 原文 "~ 18.3 kg"（ARM 段，近似值）。Ingress
    protection IP40 为 ARM 段（本体）。Cartesian velocity 原文 "up to 2 m/s at TCP"。关节速度原文
    "A1-A4: 150 deg/s / A5-A7: 301 deg/s (FCI use, A6: 239 deg/s)"：A6 在 FCI（研究接口）下限
    239 deg/s，表中按 301 收，用 FCI 时以 239 为准。法兰 DIN ISO 9409-1-A50。功率：数据表只有控制柜 "Power consumption
    ~ 80 W"（CONTROL 段，非本体功率），未收进 power 键；控制柜 19 寸机架 355 x 483 x 89 mm、约 7 kg、IP20。底座安装尺寸表中无，footprint
    未收。另有 Joint torque limits A1–A4 ±87 Nm、A5–A7 ±12 Nm（未收）。'
