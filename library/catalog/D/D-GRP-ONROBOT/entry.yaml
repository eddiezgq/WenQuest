    1～39/35～73 mm，2FG14 5～55/55～105 mm。3FG 夹持速度只给上限（直径变化速度）。RG6 行程：数据表 160 mm、产品页
    150 mm，不一致，留空。供电 20～25 V，额定 24 V。
