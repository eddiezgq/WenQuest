teaching:
  principle: RV 减速器分两级：第一级是渐开线行星齿轮——输入轴上的太阳轮带动几个行星轮，先减一次速；行星轮装在曲柄轴上，第二级是摆线针轮——曲柄轴带两片摆线轮做偏心摆动，摆线轮与壳体内一圈针齿啮合，摆动一周只转过一个齿，再大幅减速后由曲柄轴把转动传到输出盘。两级合起来减速比大、刚性高、抗冲击，同时啮合的齿多，背隙小于
    1 弧分。
  uses:
  - 工业机器人腰、肩、肘等重载关节
  - 变位机与精密转台
  - 机床刀库与分度盘
  - 自动化搬运设备
