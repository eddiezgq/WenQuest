teaching:
  principle: 太阳轮在中间，几个行星轮绕着它转，同时与外面固定的内齿圈啮合，行星轮的轴装在行星架上输出。内齿圈固定时传动比 i = 1 + z_圈/z_太阳；功率由几个行星轮分担，所以体积小、能传大力矩，效率高（一级约
    98%）。背隙比谐波、RV 大（几个角分），多用在 AGV 车轮、直线模组、SCARA 和机床进给。
  uses:
  - AGV 车轮驱动
  - 伺服电机减速
  - SCARA 与直线模组
  - 输送与包装机械
