teaching:
  principle: 与普通激光扫描仪一样靠激光飞行时间在一个平面内测距，但内部电路按功能安全标准做了冗余和自检；人或物体闯入事先设定的保护区时，安全输出在规定的响应时间内断开，让
    AGV 或机器停下。
  uses:
  - AGV 与移动机器人的人员防护和避障减速
  - 危险区域与机器人工作站的安全防护
  - 功能安全（PL/SIL）教学
