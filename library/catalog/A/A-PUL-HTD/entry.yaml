teaching:
  principle: 带内侧的齿与带轮轮槽啮合传动，不打滑、传动比准确；节圆直径 = 齿数 × 节距 ÷ π，齿顶圆比节圆小两个节线差。GT2、HTD 的圆弧齿比梯形齿应力集中小、回差小。
  uses:
  - 3D 打印机与小型直角坐标机构（GT2）
  - 机器人关节与伺服减速传动（HTD 3M、5M）
  - 输送线
