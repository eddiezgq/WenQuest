teaching:
  principle: 两个带凸爪的半联轴器之间夹一个梅花形弹性件，转矩经凸爪挤压弹性件传递；弹性件能补偿两轴少量的径向、角向偏差，并缓冲振动，不用润滑。
  uses:
  - 电机与减速器、泵的联接
  - 伺服电机与丝杠的联接
  - 减速器输入轴
