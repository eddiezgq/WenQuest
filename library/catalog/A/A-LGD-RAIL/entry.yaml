teaching:
  principle: 滑块里的四列钢球在导轨的四条滚道上滚动并循环，滑块沿导轨直线移动，摩擦小、刚度高，能承受上下左右各方向的载荷和力矩。
  uses:
  - 直角坐标机器人的各轴
  - 数控机床工作台
  - 自动化设备的直线模组
