    FSI 互核一致（25×10 法兰厚 TBI 12、HIWIN 10，按 TBI）；12×4 属 ISO 3408-2 表 2（非优选组合），DIN 69051-5
    从 d0=16 起，12×4 外形按 TBI；20×10 两份 HIWIN 资料长度不一、TBI 无载荷，未收。不同厂家的螺母长度与载荷不同，选型以所购厂家样本为准。
teaching:
  principle: 丝杠与螺母的螺旋滚道之间装满钢球，转动丝杠时钢球滚动并经螺母内的循环通道返回，把旋转变成直线移动；滚动摩擦使效率达 90% 以上，可加预紧消除间隙，定位精度高。
  uses:
  - 数控机床进给轴
  - 直角坐标机器人与模组
  - 精密升降台
