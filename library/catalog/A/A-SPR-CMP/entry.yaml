teaching:
  principle: 压缩时簧丝主要受扭转，刚度 k = G·d⁴ /(8·D³·n)：线径越粗刚度越大，中径越大、有效圈数越多刚度越小；YA 型两端圈并紧磨平，端面平整，受力均匀。
  uses:
  - 安全阀、离合器的压紧
  - 机构复位与缓冲
  - 机器人夹爪的回位
