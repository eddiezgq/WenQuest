    正文后补进规格表。
teaching:
  principle: SM 螺纹牙型与公制、统一螺纹同为 60°，但直径按英寸分数、牙更细，小直径下牙数多、自锁好，适合缝纫机这类高速振动、零件小的机构。
  uses:
  - WQ-LS 平缝机：紧针螺钉、针杆连接块、针杆导轨、线钩、曲柄销
