  principle: 把圆柱销沿两孔连线方向削去两边，只在垂直于两孔连线的方向留一段窄的圆柱面：两孔中心距的误差由削去的方向让开，避免一面两销过定位，只限制工件绕圆柱销的转动。模型的两孔连线沿 y（削去 ±y 两边）。
