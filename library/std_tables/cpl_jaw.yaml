excluded: ['LM13：两处原表“公称转矩 b”格都读作 2000（小于 a 型 11200，显然漏位，原值可能为 20000 或 22400，无法确认），按规则整行不收。该行其余数字两处一致：Tn_a 11200 N·m，LM 许用转速 2100 r/min，轴孔 90*~150（90*,95*:Y172/J132; 100*,110*,120*,125*:Y212/J167; 130,140,150:Y252/J202），L推荐
    125，L0 323，D 360，D1 460，质量 103.86 kg，J 1.6718 kg·m²——如能从标准原文确认 Tn_b 可补回。', LMD（单法兰）、LMS（双法兰）、LMZ/LML（带制动轮）型不在本族范围，未收（同表 LMD/LMS 的 L0、质量、转动惯量、许用转速未录）。]
notes: 口径：采用 GB/T 5272-2002 的 LM 型表（两处手册网站转载的是 2002 版）。现行版 GB/T 5272-2017 的尺寸表在可访问的网站上只有图片或付费全文（forrun.cn 为图片，gb-gbt/人人文库仅预览前言），读不到可核对的文本，故未采用；从 2017 版制动轮型标题 'LML105-160～LML145-200' 看，2017 版疑改为按外径 D 命名（如
  LM105≈本表 LM5，D=105），未核实，不作对照。Tn：2002 版表按弹性件材质/硬度 a、b 给两档公称转矩，无单一 Tn，故分列 Tn_a_Nm、Tn_b_Nm。Tmax：2002 版表无最大转矩列，全部为 null，未自行推算。element：表头有“弹性件型号”列，但两处页面该列文字均读不到（页面全文检索无 'MT'），全部为 null，不按记忆补写。L0/L：表中 L0 只有一个值，是按
  L推荐 算的总长，标准表不分 Y/J 型给 L0；Y 型、J1/Z 型各档轴孔长度放在 d_series 文本里。若按某档轴孔长度造型，总长需另行推算（L0−2·L推荐 即中间弹性件段长，见下）。自洽检查：Tn_a、Tn_b、d_min、d_max、L、L0、D、D1、质量、J 均随型号严格递增，许用转速严格递减，每行 Tn_b>Tn_a。L0−2·L推荐 依次为 16,19,23,24,27,33,39,41,48,50,60,67,(LM13
  73),63——LM14 比 LM13 小，与总体趋势不符，但两处原表一致，照录并标出，未能推断原因。两次读取：第一遍按模板分型号抽取，第二遍要求逐格原样照抄行文本（含续行）。不一致与处理：①LM1 许用转速有一次模板读取给出 12000/12300，两处原样照抄均为 15300，取 15300；②LM13 许用转速模板读取 2000，原样照抄两处均为 2100（2000 实为错位的 Tn_b 格），该行已不收；③LM7
  最大轴孔：mechtool 一次模板读取含 56，两处原样照抄均到 55 为止，取 55；④LM8 第一档（45*~56）轴孔长度：s1 一次读成 70/54（实为 L推荐 70 错位），s2 模板读取给 112/84，原样照抄两处该格都缺，d_series 中标“原表长度格缺”（按 GB/T 3852 惯例应为 Y112/J84，未采用推断值）；⑤若干次模板读取把 L推荐/L0/D/D1 错列，均以原样照抄行为准。表注（s1
  原文）：1. 质量、转动惯量按 L推荐 最小轴孔计算的近似值。2. 带*号轴孔直径可用于 Z 型轴孔。3. a、b 为弹性件两种不同材质、硬度的代号。
