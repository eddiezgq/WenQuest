standard: {code: GB/T 5272-2002, title: 梅花形弹性联轴器（LM型—基本型）；现行版 GB/T 5272-2017 的尺寸表未取得可读文本，见 notes}
sources:
- {key: s1, title: 嘉立创FA机械设计手册 · 梅花形弹性联轴器(GB/T 5272-2002) · LM型-基本型、LMD型-单法兰型、LMS型-双法兰型联轴器「基本参数和主要尺寸」表, url: 'https://www.jlc-jdgf.com/mcbook/06133-2.htm', note: 全部列的主出处；表注 1~5；页面无页码，按型号行定位}
- {key: s2, title: 机械工具网 mechtool.cn · 梅花形弹性联轴器(GB/T 5272-2002) · LM型—基本型、LMD型—单法兰型、LMS型—双法兰型联轴器表, url: 'https://www.mechtool.cn/shaftsandcouplings/shaftsandcouplings_plumblossomelasticcoupling.html', note: 全表逐格互核；LM8
    第一档轴孔长度两处都缺}
columns:
- [size, 型号, designation, '-']
- [Tn_a_Nm, 公称转矩（a 型弹性件，a/HA）, 'nominal torque, element a', N·m]
- [Tn_b_Nm, 公称转矩（b 型弹性件，b/HD）, 'nominal torque, element b', N·m]
- [Tmax_Nm, 最大转矩, maximum torque, N·m]
- [n_max_rpm, 许用转速（LM 基本型）, 'allowable speed, type LM', r/min]
- [d_min_mm, 轴孔直径最小（d1、d2、dz）, min bore diameter, mm]
- [d_max_mm, 轴孔直径最大, max bore diameter, mm]
- [d_series, 轴孔直径分档及对应轴孔长度（Y=Y型长圆柱孔长，J=J1/Z型短孔长；带*的直径可用于Z型锥孔）, bore series with bore lengths per group, mm（文本）]
- [L_mm, 半联轴器轴孔长度推荐值 L推荐, recommended hub bore length, mm]
- [L0_mm, 联轴器总长（按 L推荐，LM 基本型）, overall length with recommended hub length, mm]
- [D_mm, 外径 D（梅花爪体外径）, outer diameter, mm]
- [D1_mm, 原表 D1 列（数值大于 D，应为 LMD/LMS 法兰外径，基本型造型不用；页面图注未读到文字定义）, table column D1 (flange OD of LMD/LMS), mm]
- [element, 梅花弹性件型号, spider (elastic element) designation, '-']
- [mass_kg, 质量（LM 基本型，按 L推荐、最小轴孔计算的近似值）, 'mass, type LM (approx.)', kg]
- [J_kgm2, 转动惯量（LM 基本型，同上近似值）, 'moment of inertia, type LM (approx.)', kg·m²]
