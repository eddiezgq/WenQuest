excluded:
  - "GT2 的 groove_depth_mm / groove_r_mm / groove_w_mm 留空：GT2 轮槽齿形是 Gates 专有，Gates 与 SDP/SI 公开资料都不给轮槽尺寸（SDP/SI 原文：'Pulleys for these belt profiles are usually available from manufacturers licensed by Gates'）。造型时 GT2 轮槽需另定近似画法，不能按标准生成。"
  - "SDP/SI Table 8（Minimum Pulley Diameters）的 HTD 3 mm / 5 mm 行未采用：三次读取不一致（第一次 3 mm 20/18/17、5 mm 30/26/22 齿；第三次 3 mm 20/18/16、5 mm 20/18/17 齿），无法确认原文。GT 2 mm 行三次一致（3500/1750/1160 rpm → 16/14/12 齿），已用作 GT2 的 z_min=12。"
  - "Gates 第 68 页 Table 9 是惰轮最小尺寸（2MGT/3MGT 12 齿、5MGT 14 齿，Minimum Inside Idler Sprocket），不是主动/从动轮最少齿数，未用作 z_min。"
  - "5M 带宽未收 JB/T 7512.1 的 20、30、40 mm：只取 Gates 库存宽度 9、15、25 mm，与 3M/GT2 口径一致。"

notes: >-
  口径：δ 是带节线（抗拉层中心）到带轮齿顶圆的径向距离，OD = PD − 2δ；三种齿形 δ 分别为 .010 in（0.254）、.015 in（0.381）、.0225 in（0.5715）mm，
  出自 SDP/SI Table 4 的 U 值（两次读取一致），并与 JB/T 7512.2 的 2δ = 0.762 / 1.144 mm 吻合，又与 Gates 直径表 PD−OD 的英寸差（.020/.030/.045 in）吻合。
  按公式核对 9 个 check_rows：PD = z·p/π、OD = PD − 2δ 四舍五入到 0.01 mm 后，9 行里有 8 行与 Gates 表列值完全一致（例：5M z=40 → 63.662/62.519 → 63.66/62.52）；
  3M z=60 公式得 OD 56.534 → 56.53，Gates 表列 56.54，差 0.01 mm。原因是 Gates 先在英寸里圆整（2.256 − .030 = 2.226 in × 25.4 = 56.54），不是常数错误；核对时容差取 ±0.01 mm。
  另有独立旁证：3M 160 齿 Gates 表 OD 152.03 = SDP/SI 产品页 152.03；5M 20 齿 SDP/SI 产品页 O.D. 30.7。
  两次读取的不一致：(1) Gates 第 74 页 3M z=40 的 OD，一次读得 37.44、一次 37.06，第四次只取 38–42 齿原文行，得 '40 38.20 37.44 / 1.504 1.474'，与第一次一致，采用 37.44；
  (2) 有一次读取把 5 mm 表的数字挂到 '3mm' 标题下，第三次按 PD 数值定位表格后确认第 74 页=3 mm、第 75 页=5 mm；
  (3) Gates 带 ID 图第一次读取把 A/B/C 的含义标反，第二次连表头一起逐字读出：A=节距，B=带总厚，C=齿高（B>C，与物理一致）。
  带齿高/带厚：Gates（s2）与 SDP/SI（s3）完全一致——3M 1.22/2.41，5M 2.08/3.81，GT2 0.76/1.52；JB/T 7512.1 为 3M 1.22/2.4、5M 2.06/3.8（齿高差 0.02 mm、带厚差 0.01 mm，属换算/圆整差异），按用户指定出处取 Gates 值。
  z_min 口径不统一（标准中最少齿数随转速变）：3M=10、5M=14 取 JB/T 7512.2 '≤900 r/min' 档（两次读取一致；更高转速：3M 14/16/20/22，5M 20/24/28/30）；
  GT2=12 取 SDP/SI Table 8 的 1160 rpm 档（3500 rpm 时 16）。建议造型程序低于 z_min 时只提示、不禁止。
  z_range 是 Gates 直径表首末行（单次读取；GT2 末行 101 齿只读到一次，偏少，可能是表在 101 齿处分页，可抽查）。
  单调性：p、δ、tooth_h、belt_t 均随 GT2→3M→5M 单调增；z_min 不单调（GT2 是另一齿形、口径不同），已说明。
  ISO 13050 的 H 齿型数值表不在 iTeh 公开样本中，3M/5M 的轮槽尺寸实际出自与 HTD 对应的 JB/T 7512.2-1994（经 mechtool.cn 转载），未能与 ISO 原文逐格核对。
