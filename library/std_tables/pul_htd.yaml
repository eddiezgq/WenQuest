# A-PUL-HTD 同步带轮 —— 齿形标准常数（供公式 PD = z·p/π，OD = PD − 2·δ 生成规格表）
standard:
  code: "ISO 13050:2022（H 齿型 3M、5M）；GT2 = Gates PowerGrip GT2 专有齿形"
  title: "Synchronous belt drives — Metric pitch, curvilinear profile systems G, H, R and S, belts and pulleys；GT2 齿形出处为 Gates 官方资料（非 ISO 标准）"

