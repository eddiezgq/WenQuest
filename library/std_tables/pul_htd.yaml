    note: "只作 check_rows 的旁证（与 s1 的 3 mm 160 齿 OD 152.03、5 mm 20 齿 OD 30.69 一致），不单独入表。另一页：https://shop.sdp-si.com/a-6a25m020df0908.html"

columns:
  - [size, 齿形, Profile, "-"]
  - [p_mm, 节距, Pitch, mm]
  - [delta_mm, 节线差δ（带节线到带轮齿顶的径向距离；OD = PD − 2δ）, Pitch line differential (PLD/U), mm]
  - [tooth_h_mm, 带齿高, Belt tooth height, mm]
  - [belt_t_mm, 带总厚（含齿）, Overall belt thickness, mm]
  - [groove_depth_mm, 轮槽深 hg, Pulley groove depth, mm]
  - [groove_r_mm, 轮槽主圆弧半径 R, Pulley groove main arc radius, mm]
  - [groove_w_mm, 轮槽宽 s（节线处）, Pulley groove width, mm]
  - [widths_mm, 标准带宽系列（文本）, Standard belt widths, mm]
  - [z_min, 推荐最少齿数（口径见 notes）, Min. recommended grooves, "-"]
  - [z_range, 常用齿数范围（文本，注明出处）, Common groove range, "-"]

