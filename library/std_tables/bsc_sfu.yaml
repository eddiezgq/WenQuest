notes: |
  1. 型号口径：TBI 现行样本（2018、2019、25.02 版）把 DIN 69051 B 型单螺母合为一张“SFNU/SFU”表：1605、1610、2005、2505、2510、3205、3210、4005、4010、5010 只以 SFNU（强防尘型）出现，1204 仍为 SFU。所以除 12x4 外，各行实际是 TBI SFNU 的数据，法兰外形与 SFU 相同（DIN 69051-5 B 型）；螺母长 L 是 SFNU 的值，可能和老 SFU 及市售国产“SFU”螺母不同（如 SFU1605 常见长度有别），造型时 L 只能当 TBI 的参考值用。
  2. 两次读取：s1 读了两遍（第一遍整表照抄，第二遍逐型号逐键要求按字符串原样输出），11 行全部列逐格一致。s2（Anaheim 托管的 TBI 2019 版）独立读到 SFNU01605-4、SFNU01610-3 整行和 SFNU02005-4 前 11 个数，与 s1 一致；TBI 官网 25.02 版太长，工具只取到 C48 之前的部分，没取到这张表的数据。
  3. 符号对照：TBI 原表 D=螺母外径、A=法兰外径、B=法兰厚、L=螺母长、W=孔分布圆、H=两平面间距、X=孔径。本表列键按任务约定（D/D1/D5/X/W/L1），注意和 ISO 3408-2:2021 的符号不同（该标准 D1=螺母外径、D4=分布圆、D5=螺栓孔径、D6=法兰外径）。ISO 3408-2:2021 把 B 型定义为“两平面”法兰，s1 图上 H 也是两平行平面之间的距离，所以 W_mm 是两平面间距。孔数：s1/s2 图上 d≤32 标“6-X”，d≥40 标“8-X”；孔的角度在图上为 22.5°/30°/45° 等，具体分度需对照原图。
  4. 载荷：原表单位 kgf，按 1 kgf = 9.80665 N 换算后取整。原值（Ca/C0a，kgf）：1204 902/1884；1605 1380/3052；1610 1103/2401；2005 1551/3875；2505 1724/4904；2510 2954/7295；3205 1922/6343；3210 4805/12208；4005 2110/7988；4010 5399/15500；5010 6004/19614。只代表 TBI；HIWIN 同规格的载荷不同（圈数、钢球不同），不能混用。
  5. 与 HIWIN 核对外形：s3（HIWIN 意大利，FSC/FSI DIN 69051）中 20x5、20x10、25x5、25x10、32x5、32x10、40x5、50x5、50x10 的螺母外径、法兰外径、分布圆、孔径、两平面间距、法兰厚与 TBI 完全一致，只有一处不同：TBI 25x10 法兰厚 12，HIWIN 25 系列都是 10（TBI 两遍读都是 12，保留 TBI 值并标注）。16x5 只核对到法兰外径 48、分布圆 38、孔 5.5、法兰厚 10、两平面 40，一致；HIWIN 该行的螺母外径一格网页抽取错位，没能核对。螺母长度两家不同（如 20x5：TBI 51，HIWIN 40），属各家设计差异。s4（HIWIN UK 磨制 FSC）中 32x5 为 48/70/59/6.6/平面 54，钢球较大的规格螺母外径加大并带脚注（非 DIN 尺寸），说明 HIWIN 磨制系列个别规格与 DIN 基本外形不同；s4 网页抽取列有错位，只作参考。
  6. 自洽检查：随 d0 增大，D、D1、D5、W、X、L1 都单调不减；同一 d0 下导程变大螺母变长（1605 45<1610 57，2505 51<2510 85，3205 52<3210 85，4005 55<4010 88）；每行都满足 D+X < D5 且 D5+X < D1（孔不破螺母体、不破法兰边）、W > D（平面不切到螺母体）、Dw < Ph。推不出的：Ca、C0a 无法由外形推算。
  7. 标准组合：按 s5（IS 14872-2 = ISO 3408-2:1991）Table 1，16x5、16x10、20x5、25x5、25x10、32x5、32x10、40x5、40x10、50x10 是优选组合（d0=12 的优选导程为 2.5、5、10）；12x4 只在 Table 2（其他组合）里，所以 is_preferred=false。s6（2021 版）的组合表网页抽取时优选标记（灰底粗体）读不准，未采用。DIN 69051-5 外形表从 d0=16 起，12x4 的外形只是 TBI 自定，不属 DIN 尺寸。
  8. GB/T 17587.2-2025 已改名为《公称直径、公称导程、螺母尺寸和安装螺栓 公制系列》（对应 ISO 3408-2:2021，含螺母安装尺寸），但没找到公开原文，以后拿到标准原文可用来复核法兰尺寸。
  9. 本次 curl 下载 TBI、HIWIN 官方 PDF 被代理拒绝（403），只能用网页抓取工具读，长 PDF 会被截断，所以主出处用了 TBI 原版单页 PDF。
