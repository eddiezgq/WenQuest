standard:
  code: 行业通用尺寸：HIWIN HG 系列（四列钢球、方形导轨，15/20/25/30/35/45）
  title: 滚动直线导轨副（A-LGD-RAIL）——HGH…CA 标准型无法兰滑块、HGW…CC 法兰型滑块、HGR 导轨
sources:
- key: s1
  title: HIWIN GmbH 官方产品页（hiwin.de）HGH15/20/25/30/35/45CAZAC、HGW15/20/25/30/35/45CCZAC 技术数据，2026-10 读取（示例页；各型号见 b_ 开头的出处）
  url: https://www.hiwin.de/en/Products/Linear-guideways/Blocks/Ball-guides/Series-HG-QH/HGH-QHH/HGH20CAZAC/p/5-001633
  note: 第一遍：滑块全部外形尺寸、C_N、C0_N、block_mass_kg（现行版额定载荷以此为准）。其余型号页同路径：HGH15 p/5-001623，HGH25 p/5-001652，HGH30 p/5-003157，HGH35 p/5-003129，HGH45 p/5-003130；HGW-QHW/ 下 HGW15CCZAC p/5-003167，HGW20 p/5-001118，HGW25
    p/5-001153，HGW30 p/5-003168，HGW35 p/5-001224，HGW45 p/5-001259
- key: s2
  title: HIWIN GmbH 官方产品页（hiwin.de）HGR15/20/25/30/35/45R4000H 导轨技术数据（示例页；各规格见 r_ 开头的出处）
  url: https://www.hiwin.de/en/Products/Linear-guideways/Profile-rails/Ball-guides/Series-HGR/HGR-R/HGR20R4000H/p/5-001922
  note: 第一遍：rail_W/H/pitch/d/D/h、rail_mass_kg_per_m、标准端距 E1=20（45 为 22.5）。其余：HGR15 p/5-001920，HGR25 p/5-001924，HGR30 p/5-001926，HGR35 p/5-001927，HGR45 p/5-001929
- key: s3
  title: HIWIN Linear Guideway Technical Information 样本 G99TE17-1306（HG Series 章节，经销商 lm76 转存的官方样本 PDF）
  url: https://www.lm76.com/HG-Series-Catalog_opt.pdf
  note: 第二遍：2-1-13(1) HGH-CA/HGH-HA 表与 2-1-13(5) HGW-CC/HGW-HC 表，逐字逐格重读全部外形尺寸、导轨尺寸、导轨螺栓 rail_bolt、E、质量；额定载荷为旧版数值（见 notes）
- key: s4
  title: HIWIN Linear Guideway Technical Information 样本 G99TE14-1006（motionusa 转存）
  url: https://s3.amazonaws.com/www.motionusa.com/hiwin/Hiwin_GuidewayCatalog.pdf
