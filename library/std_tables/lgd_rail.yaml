columns:
- - size
  - 规格型号
  - Model
  - '-'
- - block_type
  - 滑块型式
  - Block type
  - '-'
- - rail_W_mm
  - 导轨宽 WR
  - Rail width WR
  - mm
- - rail_H_mm
  - 导轨高 HR
  - Rail height HR
  - mm
- - rail_pitch_mm
  - 导轨安装孔距 P
  - Rail mounting hole pitch P
  - mm
- - rail_E_mm
  - 导轨端孔到端面距离 E（标准值）
  - Standard end distance E
  - mm
- - rail_bolt
  - 导轨安装螺栓（规格x长度）
  - Rail mounting bolt
  - '-'
- - rail_d_mm
  - 导轨通孔直径 d
  - Rail through-hole dia. d
  - mm
- - rail_D_mm
  - 导轨沉头孔直径 D
  - Rail counterbore dia. D
  - mm
- - rail_h_mm
  - 导轨沉头孔深 h
  - Rail counterbore depth h
  - mm
- - H_mm
  - 组件总高（导轨底面到滑块顶面）H
  - Assembly height H
  - mm
- - H1_mm
  - 导轨底面到滑块底面间隙 H1
  - Clearance rail bottom to block bottom H1
  - mm
- - N_mm
  - 导轨侧面到滑块基准侧面距离 N
  - Rail side to block side N
  - mm
- - W_mm
  - 滑块宽 W
  - Block width W
  - mm
- - B_mm
  - 滑块安装孔横向距 B
  - Block mounting hole spacing (transverse) B
  - mm
- - B1_mm
  - 滑块侧面到安装孔中心 B1
  - Block side to hole center B1
  - mm
- - C_mm
  - 滑块安装孔纵向距 C
  - Block mounting hole spacing (longitudinal) C
  - mm
- - L1_mm
  - 滑块本体长 L1
  - Block body length L1
  - mm
- - L_mm
  - 滑块总长（含端盖）L
  - Block overall length L
  - mm
- - K1_mm
  - 样本尺寸 K1（滑块安装孔到本体端部）
  - Catalog dim. K1
  - mm
- - K2_mm
  - 样本尺寸 K2（端盖油嘴位置）
  - Catalog dim. K2
  - mm
- - G_mm
  - 油嘴伸出长度 G
  - Grease nipple length G
  - mm
- - T_mm
  - 滑块安装面厚度 T
  - Block flange/top thickness T
  - mm
- - T1_mm
  - 法兰型螺纹有效厚度 T1（仅 HGW）
  - Flange thread thickness T1
  - mm
- - H2_mm
  - 滑块顶面到端盖顶面高差 H2
  - Dim. H2
  - mm
- - H3_mm
  - 滑块顶面到导轨顶面距离 H3
  - Dim. H3
  - mm
- - block_bolt
  - 滑块安装螺纹（HGH 为螺纹x深度；HGW-CC 为贯通螺纹，可上下安装）
  - Block mounting thread
  - '-'
- - C_N
  - 额定动载荷（现行版）
  - Basic dynamic load rating C
  - N
- - C0_N
  - 额定静载荷（现行版）
  - Basic static load rating C0
  - N
- - block_mass_kg
  - 滑块质量
  - Block mass
  - kg
- - rail_mass_kg_per_m
  - 导轨每米质量
  - Rail mass per metre
  - kg
