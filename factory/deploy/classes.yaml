# 班级（小组）工厂（数字工厂第 10 轮）。加一行、推送，自动部署时建好一座独立的教学工厂。
#   id：网址里的编号（小写字母开头，只用小写字母和数字，2～20 位）→ https://<id>.factory.wenquestrobotics.com
#   name：显示名；course：对应的问渠课程（备注）；teachers：任课老师的问渠账号编号（能建课的老师账号本来就是厂长，可不填）
#   plant：用哪座厂的清单（factory/plants 里的文件名，不带 .yaml；第 45 轮）。不写 = 问渠减速器厂。
#          只在第一次建好这座厂时生效（ERPNext 的公司名、缩写按清单建），建好以后不要再改。
# 删掉一行不会删数据（防误删）；要清理请运行 deploy/class_remove.sh <id>。
classes:
  - id: pilot
    name: 试点班
    course: ""
    teachers: []
  # 问渠数字工业园第二座厂（第 45 轮）：机器人厂，按清单起 → https://robot.factory.wenquestrobotics.com
  - id: robot
    name: 问渠数字工业园 · 机器人厂
    course: ""
    teachers: []
    plant: wenquest-robot
