domain: core
order: 99
label: 厂情中枢
label_en: Ops center
row: core
types:
  Anomaly:
    label: 异常
    label_en: Anomaly
    maturity: have
    key: 异常编号，如 A-00042
    title: "{key} {title}"
    sources: [厂情中枢规则库（anomaly 表，第 17 轮 B 期）]
    props:
      title: {t: str, l: 标题}
      rule: {t: str, l: 规则}
      domain: {t: str, l: 领域}
      severity: {t: str, l: 严重度}
      status: {t: str, l: 状态}
      role: {t: str, l: 负责角色}
      first_seen: {t: time, l: 首次发现}
      last_seen: {t: time, l: 最近一次}
      hits: {t: int, l: 次数}
    links:
      about: {to: "*", l: 涉及, inv: 异常}
  Scenario:
    label: 场景
    label_en: Scenario
    maturity: have
    key: 场景编号，如 SC-00012
    title: "{key} {title}"
    sources: [厂情中枢推演（scenario 表，第 17 轮 C 期）]
    props:
      title: {t: str, l: 名称}
      changes: {t: json, l: 改动}
      cost_total: {t: num, l: 多花的钱, u: "$"}
      created_by: {t: str, l: 创建人}
      created: {t: time, l: 创建时间}
    links:
      anomaly: {to: Anomaly, l: 针对, inv: 场景}
  ActionRun:
    label: 动作记录
    label_en: Action run
    maturity: have
    key: 动作编号，如 ACT-00007
    title: "{key} {title}"
    sources: [厂情中枢动作（action 表，第 17 轮 C 期）]
    props:
      title: {t: str, l: 名称}
      type: {t: str, l: 种类}
      status: {t: str, l: 状态}
      initiator: {t: str, l: 发起人}
      approver: {t: str, l: 批准人}
      result: {t: str, l: 执行结果}
      created: {t: time, l: 发起时间}
      executed: {t: time, l: 执行时间}
    links:
      anomaly: {to: Anomaly, l: 处理, inv: 动作}
      scenario: {to: Scenario, l: 来自, inv: 动作}
      about: {to: "*", l: 作用于, inv: 动作}
  AiRun:
    label: AI 运行
    label_en: AI run
    maturity: next
    key: 运行编号
    title: "{key}"
    sources: [厂情中枢（17D 起）]
    props:
      question: {t: str, l: 问题}
  TaskSheet:
    label: 工程任务单
    label_en: Engineering task sheet
    maturity: have
    key: 任务单编号（内部 id）
    title: "{code} {title}"
    sources: [task_sheet 表]
    props:
      code: {t: str, l: 编号}
      title: {t: str, l: 标题}
      course: {t: str, l: 课程}
      due: {t: date, l: 截止}
      status: {t: str, l: 状态}
  Proposal:
    label: 提议
    label_en: Proposal
    maturity: have
    key: 提议编号
    title: "{key} {title}"
    sources: [ai_proposal 表, ai.proposal]
    props:
      title: {t: str, l: 标题}
      action: {t: str, l: 动作}
      status: {t: str, l: 状态}
      requested_by: {t: str, l: 发起}
      confirmed_by: {t: str, l: 确认}
      created: {t: time, l: 时间}
