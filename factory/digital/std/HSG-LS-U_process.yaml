  minutes: 7.5
- seq: 20
  operation: 镗轴承孔 Bearing-bore boring
  workstation: 卧式加工中心 HMC-01
  shop: 机加
  content: 一面两销定位（接合面 C ＋ 两工艺孔），夹具抬高 160 让出机头下方空间。B 180° 钻轴过孔、粗铣电机座端面和止口外圆；B 0° 粗铣面板口端面，同轴镗杆（带导向套）粗镗两轴承孔；直角铣头从下方钻针杆孔 Ø11.5。各面单边留 0.5，合箱后在合件工序 70 精加工。装夹顺序：一面两销定位 → 4 个拉缸拉紧 → 4 个辅助支承伸出（弹簧推力 ≤ 10 N）、液压锁紧，顶面支承的回转臂转到工作位、插定位销；卸件反过来
  datum: 接合面 C、两工艺孔（一面两销）
  clamping: 4 个液压拉缸，拉杆拧进立柱脚 4 个 M10 螺孔，把工件拉紧在正下方的 4 个支承钉上；机头 4 个液压浮动辅助支承（底面 2、后侧 1、顶面 1）在拉紧后伸出、锁紧，只撑不定位
  fixture: 专用夹具 FX-HSG-U-20（一面两销，带辅助支承）
  coolant: 干切（铸铁）
  setup_min: 45
  fixture_id: FX-HSG-U-20
  locate:
  - surface: 接合面 C
    symbol: plane
    dof: 3
  - surface: 工艺孔 1（圆柱销）
    symbol: pin
    dof: 2
  - surface: 工艺孔 2（削边销）
    symbol: pin_diamond
    dof: 1
  clamp:
  - surface: 立柱脚 4 个 M10 螺孔（液压拉杆）
    kind: hydraulic
  support:
  - surface: 机头底面 2 点、后侧面 1 点、顶面 1 点
    kind: hydraulic_work_support
    note: 拉紧后伸出锁紧，只撑不定位
  steps:
  - step: 1
    content: B 180°（电机端）：粗镗轴过孔 Ø16（铸出）→ Ø18，深 40
    tool: T14
    gauge: G08
    vc: 110
    f: 0.2
    ap: 1.0
    passes: 1
    tb_min: 0.11
    ta_min: 0.3
  - step: 2
    content: B 180°：粗铣电机座端面（余量 3 → 0.5）
    tool: T02
    gauge: G08
    vc: 160
    f: 0.75
    ap: 2.5
    passes: 1
    tb_min: 0.41
    ta_min: 0.3
  - step: 3
    content: B 180°：圆弧插补粗铣电机止口外圆 Ø57 → Ø53.0（0/−0.1），两圈
    tool: T05
    gauge: G05
    vc: 150
    f: 0.4
    ap: 2.0
    passes: 1
    tb_min: 0.7
    ta_min: 0.3
  - step: 4
    content: B 0°（机头端）：粗铣面板口端面（余量 3 → 0.5）。走刀方向选得使切削合力把机头压向底面和后侧的支承
    tool: T02
    gauge: G08
    vc: 160
    f: 0.75
    ap: 2.5
    passes: 1
    tb_min: 0.93
    ta_min: 0.3
  - step: 5
    content: B 0°：翻上导向套支架；同轴粗镗杆从机头端伸入，两孔一刀粗镗到 Ø34.0、Ø31.0（+0.1/0）；镗完支架翻下
    tool: T03
    gauge: G03
    vc: 110
    f: 0.25
    ap: 2.0
    passes: 1
    tb_min: 0.09
    ta_min: 1.0
  - step: 6
    content: 装直角铣头，从机头下方钻针杆孔 Ø11.5，一次钻通上、下两个导套座（往上的轴向力约 0.9 kN 由顶面支承承受）
    tool: T06
    gauge: G08
    vc: 60
    f: 0.15
    ap: null
    passes: 1
    tb_min: 0.62
    ta_min: 0.3
  - step: 7
    content: 直角铣头：锪针杆孔下端沉孔 Ø14 深 4（上止点时针夹进去 0.5）
    tool: T06
    gauge: G08
    vc: 60
    f: 0.08
    ap: null
    passes: 1
    tb_min: 0.06
    ta_min: 0.3
  - step: 8
    content: 直角铣头：钻压脚杆孔 Ø11.5（x −16、y 6），一次钻通上、下两个导套座（G4.7）
    tool: T06
    gauge: G08
    vc: 60
    f: 0.15
    ap: null
    passes: 1
    tb_min: 0.62
    ta_min: 0.3
  inspect:
  - char: 两轴承孔 Ø34.0、Ø31.0（+0.1/0）（C5）
