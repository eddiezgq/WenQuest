- seq: 40
  operation: 时效 Stress relieving
  workstation: 热处理炉 HT-01
  shop: 热处理
  content: 第二次去应力退火（与下件同炉）：≤ 200 ℃ 装炉，≤ 80 ℃/h 升到 550 ± 10 ℃，保温 2 h，≤ 40 ℃/h 随炉冷到 200 ℃ 以下出炉。粗加工后的残余应力在这里释放，变形在精铣接合面、精铰针杆孔和合件精加工时切掉
  datum: —
