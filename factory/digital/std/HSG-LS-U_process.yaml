  workstation: 立式加工中心 VMC-01
  shop: 机加
  content: 工件倒放（接合面 C 朝上；机头底面也朝上，比 C 低 46）。以粗镗后的两个轴承孔定位（两端涨芯轴）＋机臂顶面限转：精铣接合面 C，C 到上轴两孔（粗镗）中心 200 ± 0.1、平面度 0.02；同一次装夹，立式主轴从上面扩、铰针杆两孔 Ø12 H7（一次铰通），针杆孔对 C 的垂直度 0.02/100 由机床保证。合箱后进不去刀，所以针杆孔在这里精加工（见细则 G5.2 偏差
