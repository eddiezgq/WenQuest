operations:
- seq: 10
  operation: 铣结合面 Face milling
  workstation: 立式加工中心 VMC-01
  shop: 机加
  content: 工件倒放（接合面朝上）。粗基准：前后两个轴承孔的铸孔（两端锥面涨套，保证轴承孔余量均匀）＋机臂顶面一个可调支承限转。粗铣、半精铣接合面 C，留精铣余量 0.5；钻、扩、铰两个工艺孔 Ø9 H7，作为工序 20 粗加工“一面两销”的定位基准（合箱后它们配铰成锥销孔）；钻攻 4 × M10（装配用，也是卧加夹具拉紧工件用的螺孔：立柱脚的凸台在立柱里面，外面压不到）
  datum: 前后轴承孔铸孔（粗基准）、机臂顶面
  clamping: 两端锥面涨套（液压），机臂顶面辅助支承
  fixture: 专用夹具 FX-HSG-U-10（涨套式）
  coolant: 干切（铸铁）
  setup_min: 40
  locate:
  - surface: 前后轴承孔铸孔
    symbol: mandrel
    dof: 4
  - surface: 机臂顶面
    symbol: support
    dof: 1
  clamp:
  - surface: 轴承孔铸孔（涨套）
    kind: hydraulic
  steps:
  - step: 1
    content: 粗铣接合面 C（余量 3 → 1.0），三行
    tool: T01
    gauge: G08
    vc: 160
    f: 1.44
    ap: 2.0
    passes: 1
    tb_min: 0.59
    ta_min: 0.3
  - step: 2
    content: 半精铣接合面 C（留精铣余量 0.5，平面度 0.05）
    tool: T01
    gauge: G09
    vc: 200
    f: 0.8
    ap: 0.5
    passes: 1
    tb_min: 0.85
    ta_min: 0.3
  - step: 3
    content: 定心两个工艺孔、4 个 M10 孔
    tool: T12
    vc: 60
    f: 0.08
    ap: null
    passes: 1
    tb_min: 0.14
    ta_min: 0.3
  - step: 4
    content: 钻两个工艺孔 Ø8.5 深 12（x 315.8 / y 7.0 与 x 380.2 / y 66.0）
    tool: T08
    gauge: G08
    vc: 70
    f: 0.2
    ap: null
    passes: 1
    tb_min: 0.06
    ta_min: 0.3
  - step: 5
    content: 扩工艺孔 Ø8.5 → Ø8.85、铰 Ø9 H7
    tool: T08
    gauge: G04
    vc: 12
    f: 0.3
    ap: null
    passes: 1
    tb_min: 0.33
    ta_min: 0.3
  - step: 6
    content: 钻 4 × Ø8.5 深 22
    tool: T09
    gauge: G08
    vc: 70
    f: 0.18
    ap: null
    passes: 1
    tb_min: 0.23
    ta_min: 0.3
  - step: 7
    content: 攻 4 × M10-6H 深 18（刚性攻丝）：工序 20 卧加夹具的液压拉杆拧进这 4 个孔，合箱时也用它们
    tool: T09
    gauge: G06
    vc: 10
    f: 1.5
    ap: null
    passes: 1
    tb_min: 0.35
    ta_min: 0.3
  inspect:
  - char: 接合面 C 平面度 0.05（半精铣后）
    gauge: G09
    freq: 首件、每 10 件
  - char: 工艺孔 Ø9 H7（C6）
