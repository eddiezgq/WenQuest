- seq: 20
  operation: 合箱钻铰销孔 Pin-hole reaming
  workstation: 卧式加工中心 HMC-01
  shop: 机加
  content: 合好的部件立在夹具 FX-HSG-P-20 上（底面 A、两个工艺孔；夹具中间开窗）。直角铣头从机座里面向上：钻 Ø8.5 穿过下件顶板，扩通到上件工艺孔；锥度铰刀粗铰、精铰两个锥销孔；打入锥销；在立柱脚打配对编号
  datum: 下件底面 A、两工艺孔
  clamping: 液压 4 点压底边法兰
  fixture: 专用夹具 FX-HSG-P-20（中间开窗，放直角铣头）
  coolant: 干切
  setup_min: 30
  steps:
  - step: 1
    content: 直角铣头：钻 2 × Ø8.5 穿过下件顶板（约 9.6 mm），与上件工艺孔对通
    tool: T02
    vc: 60
    f: 0.15
    ap: null
    passes: 1
    tb_min: 0.16
    ta_min: 0.3
  - step: 2
    content: 粗铰、精铰 1:50 锥销孔（两孔）
    tool: T03
    gauge: G05
    vc: 8
    f: 0.15
    ap: null
    passes: 1
    tb_min: 3.87
    ta_min: 0.3
  - step: 3
    content: 打入锥销 10 × 40，检查露出 3–4 mm；打配对编号
    tool: ''
    gauge: G05
    vc: null
    f: null
    ap: null
    passes: 1
    tb_min: 0.0
    ta_min: 1.5
  inspect:
  - char: 锥销孔接触 ≥ 75%（红丹）
    gauge: G05
    freq: 首件、每 10 件
  minutes: 9.0
