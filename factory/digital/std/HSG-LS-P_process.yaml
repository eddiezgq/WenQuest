operations:
- seq: 60
  operation: 部件装配 Sub-assembly
  workstation: 装配工位 ASM-01
  shop: 装配
  content: 下件以底面 A 和两个工艺孔装在合箱台上，针板座里装针板孔基准检具；两接合面清洁后放上上件，套上 4 个 M10 螺钉（不拧紧）。找正检棒从机头上面的针杆孔插入，用立柱脚两侧的顶丝微调上件，直到检棒下端顺利插进检具的 Ø12 H6 衬套；对角分两次拧紧 4 个 M10 到 45 N·m，再插一次检棒复查。锥销孔在工序 70 钻铰（只能从机座底下往上钻，见细则 G5.2 偏差 2）
  datum: 下件底面 A、两工艺孔；上件针杆孔（找正）
  clamping: 合箱台 3 点压板压下件底边法兰
  fixture: 合箱台 FX-HSG-P-60 ＋ 针板孔基准检具
  minutes: 14.0
  setup_min: 5
  steps:
  - step: 1
    content: 清洁接合面，下件装上合箱台，装针板孔基准检具
    tool: ''
    gauge: G14
    tb_min: 0
    ta_min: 3.0
  - step: 2
    content: 放上上件，插找正检棒，微调到检棒插进衬套
    tool: ''
    gauge: G14
    tb_min: 0
    ta_min: 5.0
  - step: 3
    content: 4 × M10 对角分两次拧到 45 N·m，复查检棒；0.02 塞尺查接合面
    tool: ''
    gauge: G15
    tb_min: 0
    ta_min: 2.5
  inspect:
  - char: 找正检棒插进衬套（P17）
    gauge: G14
    freq: 每件
  - char: M10 拧紧力矩、接合面贴合（P18）
    gauge: G15
    freq: 每件
- seq: 70
  operation: 镗轴承孔 Bearing-bore boring
  workstation: 卧式加工中心 HMC-01
  shop: 机加
  content: 合件以下件底面 A ＋ 两个工艺孔 Ø10 H7 定位（液压圆柱涨销 ＋ 削边涨销，零间隙），4 个液压回转压板压在机座顶面四角，正对支承钉。① 直角铣头在夹具框里、机座底下，向上钻、铰两个锥销孔，打锥销，打配对编号；② 针杆上、下孔各插一个液压涨紧测量塞规，测头在 B 0° 测两个塞规（下塞规在机座和机头之间的空当里，上塞规经面板口），算出针杆轴线，写进工件坐标系（旋梭轴孔、上轴两孔的
    y 坐标取这条轴线外推到 z −21.5、z 200 处的值），取下塞规；③ B 0°：精铣面板口端面，阶梯镗杆半精镗、精镗旋梭轴孔 Ø14 H7，同轴镗杆（右支架导向套）半精镗、精镗上轴两孔；④ B 180°：镗轴过孔 Ø20、精铣电机法兰端面、圆弧插补精铣止口 Ø52 h7，同轴镗杆（左支架导向套）半精镗、精镗下轴两孔；⑤ 送布组的孔（G4.6）：B 180° 送布摆轴后孔、调节器孔，B
    0° 送布摆轴前孔、抬牙摆轴两孔，镗杆都从端壁的工艺孔伸进去。精镗前夹紧力降到 40%
  datum: 下件底面 A、两工艺孔（一面两销）
  clamping: 4 个液压回转压板压在机座顶面四角，正对 4 个支承钉；精镗时油压降到 40%
  fixture: 专用夹具 FX-HSG-P-70（框架式，带左、右两个可翻导向套支架）
  coolant: 干切；精镗用油雾；铰锥销孔用切削油
  setup_min: 50
  fixture_id: FX-HSG-P-70
  locate:
  - surface: 下件底面 A
    symbol: plane
    dof: 3
  - surface: 工艺孔 1（圆柱涨销）
    symbol: pin
    dof: 2
  - surface: 工艺孔 2（削边涨销）
    symbol: pin_diamond
    dof: 1
  clamp:
  - surface: 机座顶面四角（液压回转压板）
    kind: hydraulic
  steps:
  - step: 1
    content: 直角铣头（机座底下，向上）：钻 2 × Ø8.5 穿过下件销孔凸台（16），与上件工艺孔 Ø9 对通
    tool: T02
    vc: 60
    f: 0.15
    ap: null
    passes: 1
    tb_min: 0.19
    ta_min: 0.3
  - step: 2
    content: 粗铰、精铰 1:50 锥销孔（两孔）
    tool: T03
    gauge: G16
    vc: 8
    f: 0.15
    ap: null
    passes: 1
    tb_min: 3.87
    ta_min: 0.3
  - step: 3
    content: 打入锥销 10 × 40，检查露出 3–4 mm；打配对编号
    tool: ''
    gauge: G16
    vc: null
    f: null
    ap: null
    passes: 1
    tb_min: 0.0
    ta_min: 1.5
  - step: 4
    content: 插两个测量塞规（上塞规经面板口放进上导套孔）；测头 B 0° 测下塞规（z 30）、上塞规（z 190）各 3 点，算针杆轴线，写入工件坐标系；取下塞规
    tool: T04
    gauge: G13
    vc: null
    f: null
    ap: null
    passes: 1
    tb_min: 0.6
    ta_min: 3.0
  - step: 5
    content: B 0°（机头端）：精铣面板口端面（0.5），平面度 0.1
    tool: T05
    gauge: G09
    vc: 200
    f: 0.4
    ap: 0.5
    passes: 1
    tb_min: 1.39
    ta_min: 0.3
  - step: 6
    content: B 0°：阶梯镗杆从左端壁 Ø20 孔伸进去，半精镗旋梭轴孔 Ø13.0 → Ø13.7（+0.027/0）
    tool: T06
    gauge: G03
    vc: 120
    f: 0.1
    ap: 0.35
    passes: 1
    tb_min: 0.16
    ta_min: 0.3
  - step: 7
    content: B 0°：精镗旋梭轴孔 Ø14 H7，Ra 1.6（测孔径后微调到中差）
    tool: T06
    gauge: G02
    vc: 140
    f: 0.05
    ap: 0.15
