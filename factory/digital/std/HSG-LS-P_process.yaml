operations:
- seq: 10
  operation: 部件装配 Sub-assembly
  workstation: 装配工位 ASM-01
  shop: 装配
  content: 下件以底面 A 和两个工艺孔装在找正台上；针板座里装针板孔基准检具。接合面清洁后放上上件，套上 4 个 M10 螺钉（不拧紧）。找正检棒从机头上面的针杆孔插入，用立柱脚两侧的顶丝微调上件，直到检棒下端顺利插进检具的 Ø12 H6 衬套；对角分两次拧紧 4 个 M10 到 45 N·m，再插一次检棒复查
  datum: 下件底面 A、两工艺孔；上件针杆孔（找正）
  clamping: 找正台 3 点压板压下件底边法兰
  fixture: 找正台 FX-HSG-P-10 ＋ 针板孔基准检具
  minutes: 14.0
  setup_min: 5
  steps:
  - step: 1
    content: 清洁接合面，下件装上找正台，装针板孔基准检具
    tool: ''
    gauge: G03
    tb_min: 0
    ta_min: 3.0
  - step: 2
    content: 放上上件，插找正检棒，微调到检棒插进衬套
    tool: ''
    gauge: G02
    tb_min: 0
    ta_min: 5.0
  - step: 3
    content: 4 × M10 对角分两次拧到 45 N·m，复查检棒
    tool: ''
    gauge: G04
    tb_min: 0
    ta_min: 2.5
  inspect:
  - char: 找正检棒插进衬套（P1）
