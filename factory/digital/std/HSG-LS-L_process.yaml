operations:
- seq: 10
  operation: 铣结合面 Face milling
  workstation: 立式加工中心 VMC-01
  shop: 机加
  content: 工件倒放（顶面朝下）。粗基准：机座顶面铸面三点＋前侧面两点＋左端面一点。粗、半精铣底面 A（余量 3 → 0.3）；在底边法兰上钻、扩、铰两个工艺孔 Ø10 H7（对角）——它们和 A 面是以后各道（直到合件精加工）的统一基准
  datum: 机座顶面铸面、前侧面、左端面（粗基准）
  clamping: 手动压板 4 点压在底边法兰上
  fixture: 专用夹具 FX-HSG-L-10
  coolant: 干切
  setup_min: 30
  locate:
  - surface: 机座顶面铸面
    symbol: support
    dof: 3
  - surface: 前侧面
    symbol: support
    dof: 2
  - surface: 左端面
    symbol: support
    dof: 1
  clamp:
  - surface: 底边法兰
    kind: manual
  steps:
  - step: 1
    content: 粗铣底面 A（3 → 0.8）
    tool: T01
    gauge: G08
    vc: 160
    f: 1.8
    ap: 2.2
    passes: 1
    tb_min: 2.05
    ta_min: 0.3
  - step: 2
    content: 半精铣底面 A（留 0.3），平面度 0.05
    tool: T01
    gauge: G09
    vc: 200
    f: 1.0
    ap: 0.5
    passes: 1
    tb_min: 2.95
    ta_min: 0.3
  - step: 3
    content: 定心、钻、扩、铰两个工艺孔 Ø10 H7（底边法兰对角，中心距 507.9 ± 0.02）
    tool: T03
    gauge: G04
    vc: 70
    f: 0.2
    ap: null
    passes: 1
    tb_min: 0.32
    ta_min: 0.3
  inspect:
  - char: 底面 A 平面度 0.05
    gauge: G09
    freq: 首件、每 10 件
  - char: 工艺孔 Ø10 H7（C6）
    gauge: G04
    freq: 每件
  minutes: 9.0
- seq: 20
  operation: 铣结合面 Face milling
  workstation: 立式加工中心 VMC-01
  shop: 机加
  content: 一面两销（底面 A ＋ 两工艺孔）。粗铣机座顶面（余量 4 → 0.5）；钻 4 × Ø11 螺钉过孔，反锪 Ø18
  datum: 底面 A、两工艺孔（精基准）
  clamping: 液压 4 点
  fixture: 专用夹具 FX-HSG-L-20（一面两销，与工序 50 共用）
  coolant: 干切
  setup_min: 30
  fixture_id: FX-HSG-L-20
  steps:
  - step: 1
    content: 粗铣机座顶面（4 → 0.5），两刀
    tool: T01
    gauge: G08
    vc: 160
    f: 1.8
    ap: 1.75
    passes: 1
    tb_min: 4.1
    ta_min: 0.3
  - step: 2
    content: 定心、钻 4 × Ø11 通孔，反锪 Ø18 深 1.5
    tool: T04
    gauge: G08
    vc: 70
    f: 0.2
    ap: null
    passes: 1
    tb_min: 1.55
    ta_min: 0.3
  inspect:
  - char: 顶面到 A 62.5 ± 0.1
    gauge: G08
    freq: 首件、每 10 件
  minutes: 9.0
- seq: 30
  operation: 镗轴承孔 Bearing-bore boring
  workstation: 卧式加工中心 HMC-01
  shop: 机加
  content: 下件单独装在合件夹具 FX-HSG-P-70 上（底面 A ＋ 两工艺孔，与合件精加工同一基准）。B 0°：螺旋插补铣出左端壁两个 Ø20 过孔（旋梭轴孔、下轴的镗杆导向柱从这里过；铸件上是实心的）；阶梯镗杆粗镗旋梭轴孔 Ø9（铸出）→ Ø13.0。B 180°：下轴粗镗杆从右端壁 Ø34 孔伸进去，经两道横筋的 Ø34 孔，尾部导向柱穿过左端壁 Ø20 孔进左支架的导向套，两孔一刀粗镗
    Ø27 → Ø31.0。单边留 0.5
  datum: 底面 A、两工艺孔（一面两销）
  clamping: 4 个液压回转压板压在机座顶面四角（正对支承钉）
  fixture: 专用夹具 FX-HSG-P-70（合件精加工夹具，这里只装下件）
  coolant: 干切
  setup_min: 30
  fixture_id: FX-HSG-P-70
  locate:
  - surface: 底面 A
    symbol: plane
    dof: 3
  - surface: 工艺孔 1（圆柱涨销）
    symbol: pin
    dof: 2
  - surface: 工艺孔 2（削边涨销）
    symbol: pin_diamond
    dof: 1
  clamp:
  - surface: 机座顶面四角（液压回转压板）
    kind: hydraulic
  steps:
  - step: 1
    content: B 0°：螺旋插补铣左端壁 2 × Ø20 过孔（壁厚约 6）
    tool: T02
    gauge: G08
    vc: 150
    f: 0.2
    ap: null
    passes: 1
    tb_min: 1.2
    ta_min: 0.3
  - step: 2
    content: B 0°：阶梯粗镗杆粗镗旋梭轴孔 Ø9 → Ø13.0（+0.1/0），长 42
    tool: T10
    gauge: G03
    vc: 100
    f: 0.12
    ap: 2.0
    passes: 1
    tb_min: 0.15
    ta_min: 0.3
  - step: 3
    content: B 180°：翻上左支架；下轴粗镗杆两孔一刀粗镗 Ø27 → Ø31.0（+0.1/0）（进刀时主轴定向、刀尖朝上，抬高 1 mm 穿过右端壁和横筋孔）
    tool: T09
    gauge: G03
    vc: 110
    f: 0.25
    ap: 2.0
    passes: 1
    tb_min: 0.07
    ta_min: 1.0
  inspect:
  - char: 下轴两孔 Ø31.0、旋梭轴孔 Ø13.0（C9）
    gauge: G03
    freq: 首件、每 5 件
  minutes: 5.5
- seq: 40
  operation: 时效 Stress relieving
  workstation: 热处理炉 HT-01
  shop: 热处理
  content: 第二次去应力退火（与上件同炉，规范同上件工序 40）
  datum: —
  clamping: 料架平放，底面朝下
  minutes: 6
  setup_min: 10
  steps: []
  inspect:
