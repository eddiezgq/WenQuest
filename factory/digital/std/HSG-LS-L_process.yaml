    freq: 每炉
- seq: 50
  operation: 铣结合面 Face milling
  workstation: 立式加工中心 VMC-01
  shop: 机加
  content: 先翻面：以顶面粗铣面定位精铣底面 A（0.3），平面度 0.05；再回到一面两销（A ＋ 两工艺孔）：精铣机座顶面保证高度 62 ± 0.05、平面度 0.02、对 A 平行度 0.03；精铣针板座、滑板座；钻攻针板 4 × M3；夹具侧转 90°（附加角度板）钻铰两个铰链销孔 Ø8.2 H11
  datum: 底面 A、两工艺孔
  clamping: 液压 4 点
  fixture: 专用夹具 FX-HSG-L-20
  coolant: 干切；攻丝用切削油
  setup_min: 40
  fixture_id: FX-HSG-L-20
  steps:
