<!doctype html>
<!-- 第 138 轮 G6.1：网页三维整机“WQ-LS 整机”。
     数据由 tools/wqls/g6_web.py 生成（machine.json、mesh.bin、frames.bin、doc/、dwg/），都在本目录。
     挂两处：数字工厂（/wqls/index.html，公开）和《缝纫机设计与制造》第 27 章（构建时复制到 labs/wqls/）。
     参数：?lang=en|zh（不给就按网站：国内站中文，其余英文；点过切换的记住）  ?part=<零件名或物料号>  ?opt=TED  ?view=iso|face|front|hook|feed|press|trim|whole  ?fps=1（显示帧率）
     three.js r128 用本目录的 three.min.js（数字工厂没有 /vendor/，教材复制时一起带上；不连外部网站）。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WQ-LS 整机</title>
<style>
:root{--bg:#dfe3e7;--bg2:#f3f5f7;--ink:#1d2329;--mut:#5b6670;--card:rgba(255,255,255,.9);--line:#cfd5db;--acc:#0b4fae;--acc-ink:#fff;--warn:#a15c00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15181b;--bg2:#22272c;--ink:#e6e9ec;--mut:#9aa5ae;--card:rgba(28,32,36,.92);--line:#39414a;--acc:#6aa7ff;--acc-ink:#0d1117;--warn:#e0a24a}}
:root[data-theme="dark"]{--bg:#15181b;--bg2:#22272c;--ink:#e6e9ec;--mut:#9aa5ae;--card:rgba(28,32,36,.92);--line:#39414a;--acc:#6aa7ff;--acc-ink:#0d1117;--warn:#e0a24a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;touch-action:none;outline:none}
.panel{position:fixed;left:12px;top:12px;width:min(330px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.panel h1{font-size:16px;margin:0}.sub{color:var(--mut);font-size:12px;margin:2px 0 6px}
.model{font:600 13px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--acc)}
.sec{border-top:1px solid var(--line);margin-top:8px;padding-top:6px}
.sec>b{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:2px}
.row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:4px 0}
.row>span.l{font-size:12.5px;color:var(--mut);min-width:3.4em}
button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:7px;padding:4px 9px;cursor:pointer;min-height:28px}
button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input[type=range]{width:100%;accent-color:var(--acc)}
.read{display:flex;justify-content:space-between;font-size:12.5px;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--mut);margin:4px 0 0}
.top{position:fixed;right:12px;top:12px;display:flex;gap:6px}
.toggle{display:none}
.card{position:fixed;right:12px;bottom:12px;width:min(340px,calc(100vw - 24px));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card h2{font-size:15px;margin:0 0 2px;padding-right:28px}.card .code{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--acc)}
.card table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}.card td{padding:2px 0;vertical-align:top}.card td:first-child{color:var(--mut);width:5.2em}
.card a{color:var(--acc);display:inline-block;margin:2px 10px 0 0}
.card .x{position:absolute;right:8px;top:8px;min-height:0;padding:2px 8px}
.load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);flex-direction:column;gap:10px}
.bar{width:min(320px,70vw);height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc)}
.fps{position:fixed;left:50%;top:8px;transform:translateX(-50%);font:12px ui-monospace,monospace;background:var(--card);padding:2px 8px;border-radius:6px;border:1px solid var(--line)}
.warn{color:var(--warn)}
body.shot .panel,body.shot .top,body.shot .card{display:none!important}
@media (max-width:640px){
  .panel{top:auto;bottom:0;left:0;width:100vw;max-height:52vh;border-radius:12px 12px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .panel.closed .body{display:none}
  .toggle{display:inline-block}
  .card{bottom:auto;top:52px;right:8px;width:calc(100vw - 16px)}
}
</style></head>
<body>
<canvas id="c" tabindex="0" aria-label="WQ-LS 3D"></canvas>
<div class="load" id="load"><div id="loadT">正在载入三维模型…</div><div class="bar"><i id="loadB"></i></div><div class="hint" id="loadN"></div></div>
<div class="top"><button id="lang">English</button></div>
<div class="panel" id="panel">
  <div class="row" style="justify-content:space-between;margin:0"><div><h1 data-t="title">WQ-LS 整机</h1><div class="model" id="model">WQ-LS</div></div>
    <button class="toggle" id="fold" data-t="controls">控制</button></div>
  <div class="body">

  <div class="sec"><b data-t="s_turn">转动</b>
    <div class="row"><button id="play" class="on" data-t="pause">暂停</button><button data-sp="0.25" data-t="slow">慢</button><button data-sp="1" class="on" data-t="mid">中</button><button data-sp="3" data-t="fast">快</button></div>

    <div class="row"><span class="l" data-t="stitch">针距</span><button data-feed="s3" class="on">3 mm</button><button data-feed="s5">5 mm</button><button data-feed="r5" data-t="rev5">倒缝 5</button></div>
    <div class="row"><span class="l" data-t="options">选项</span><button data-opt="T" data-t="optT">T 自动剪线</button><button data-opt="E" data-t="optE">E 电子针距</button><button data-opt="D" data-t="optD">D 少油旋梭</button></div>
    <div class="row"><span class="l" data-t="action">动作</span><button data-trim="sew" class="on" data-t="sew">缝纫</button><button data-trim="trim" data-t="trim">剪线那一转</button><button data-trim="wipe" data-t="wipe">拨线</button></div>
    <p class="hint" id="stateHint"></p>

  <div class="sec"><b data-t="s_view">看</b>
    <div class="row"><button data-v="whole" class="on" data-t="v_whole">整机</button><button data-v="iso" data-t="v_iso">机头</button><button data-v="face" data-t="v_face">端面</button><button data-v="front" data-t="v_front">正面</button><button data-v="hook" data-t="v_hook">旋梭</button><button data-v="feed" data-t="v_feed">送布</button><button data-v="press" data-t="v_press">压脚</button><button data-v="trim" data-t="v_trim">剪线</button><button data-v="wheel" data-t="v_wheel">手轮</button></div>
    <div class="row"><span class="l" data-t="housing">机壳</span><button data-shell="solid" class="on" data-t="solid">实体</button><button data-shell="glass" data-t="glass">半透明</button><button data-shell="off" data-t="off">隐藏</button></div>
    <div class="row"><button id="thr" class="on" data-t="thread">面线</button><button id="grp" data-t="bygroup">按部件着色</button></div>
    <div class="read"><span data-t="explode">爆炸（按部件推开）</span><span id="exV">0</span></div>
    <input id="ex" type="range" min="0" max="1" step="0.01" value="0" aria-label="explode">
    <div class="row"><span class="l" data-t="section">剖开</span><button data-cut="" class="on" data-t="none">不剖</button><button data-cut="x" data-t="cx">左右</button><button data-cut="y" data-t="cy">前后</button><button data-cut="z" data-t="cz">上下</button></div>
    <input id="cutp" type="range" min="0" max="1" step="0.002" value="0.5" aria-label="section" disabled>
  </div>
  </div>
</div>
<div class="card" id="card" hidden></div>
<div class="fps" id="fps" hidden></div>
<script src="three.min.js"></script>
<script>
(async function () {
'use strict';
const q = new URLSearchParams(location.search);
const BASE = q.get('d') || '.';
// ---------------------------------------------------------------- 文字
const TXT = {
  zh: { title: 'WQ-LS 整机', controls: '控制', lead: '工业直驱平缝机的真设计：每个零件是 FreeCAD 实体，每 2° 的运动来自设计计算。拖动手轮转主轴，点零件看物料号。',
    s_turn: '转动', pause: '暂停', play: '播放', slow: '慢', mid: '中', fast: '快', phi: '上轴转角 φ', wipeProg: '拨线进度', tip: '针尖高出针板',
    wheelHint: '也可以按住手轮拖着转（点“手轮”视角，右端的轮子）。', s_state: '状态与选项', presser: '压脚', down: '放下', hand: '手抬', knee: '膝抬',
    stitch: '针距', rev5: '倒缝 5', options: '选项', optT: 'T 自动剪线', optE: 'E 电子针距', optD: 'D 少油旋梭', action: '动作', sew: '缝纫',
    trim: '剪线那一转', wipe: '拨线', s_view: '看', v_whole: '整机', v_iso: '机头', v_face: '端面', v_front: '正面', v_hook: '旋梭', v_feed: '送布',
    v_press: '压脚', v_trim: '剪线', v_wheel: '手轮', housing: '机壳', solid: '实体', glass: '半透明', off: '隐藏', thread: '面线', bygroup: '按部件着色',
    explode: '爆炸（按部件推开）', section: '剖开', none: '不剖', cx: '左右', cy: '前后', cz: '上下',
    loading: '正在载入三维模型…', building: '正在生成零件…', failed: '载入失败：',
    hintT: '“剪线那一转”“拨线”要先打开选项 T。', hintTrim: '剪线那一转：电磁铁把摆杆推进凸轮槽，动刀在 φ 280°–75° 往前转、挑住面线和底线，再退回剪断。',
    hintWipe: '拨线：针停在 80°，拨线钩从压脚外侧扫过针下，把剪断的线头拨到压脚上面。', hintE: '选项 E：针距由步进电机经同步带转调节器，去掉了针距旋钮、拉杆、倒缝扳手和拉簧，倒缝改成按钮。',
    hintD: '选项 D：只多一道工序——旋梭的梭床和梭尖镀 DLC 膜（2–3 µm），零件形状不变。',
    code: '物料号', kind: '来源', make: '自制', buy: '外购', buyDwg: '按我们的图外购', grp: '部件', mat: '材料', matNone: '未定（质量按钢 7.85 g/cm³ 算）',
    mass: '质量', qty: '件数', of: '属于', dwg: '图纸', calc: '计算书', inAsm: '外购部件里的一件', dlc: '选 D 时梭床、梭尖镀 DLC 膜',
    noDwg: '图纸：这一件还没有出零件图（G5 只出了机壳的图）。', g: 'g', kg: 'kg', hsgNote: '机壳上下件合箱后一起精加工，合件物料号 HSG-LS-P。', fps: '帧/秒' },
  en: { title: 'WQ-LS complete machine', controls: 'Controls', lead: 'The real design of an industrial direct-drive lockstitch machine: every part is a FreeCAD solid and every 2° of motion comes from the design calculations. Drag the handwheel to turn the main shaft; click a part for its item number.',
    s_turn: 'Turn', pause: 'Pause', play: 'Play', slow: 'Slow', mid: 'Medium', fast: 'Fast', phi: 'Main-shaft angle φ', wipeProg: 'Wiper sweep', tip: 'Needle tip above plate',
    wheelHint: 'You can also grab the handwheel and drag it round (Handwheel view: the wheel at the right end).', s_state: 'States and options', presser: 'Presser', down: 'Down', hand: 'Hand lift', knee: 'Knee lift',
    stitch: 'Stitch', rev5: 'Reverse 5', options: 'Options', optT: 'T thread trimmer', optE: 'E electronic stitch', optD: 'D low-oil hook', action: 'Action', sew: 'Sewing',
    trim: 'Trimming turn', wipe: 'Wipe', s_view: 'View', v_whole: 'Whole', v_iso: 'Head', v_face: 'End', v_front: 'Front', v_hook: 'Hook', v_feed: 'Feed',
    v_press: 'Presser', v_trim: 'Trimmer', v_wheel: 'Handwheel', housing: 'Housing', solid: 'Solid', glass: 'See-through', off: 'Hidden', thread: 'Needle thread', bygroup: 'Colour by group',
    explode: 'Explode (by assembly)', section: 'Section', none: 'None', cx: 'Left–right', cy: 'Front–back', cz: 'Top–bottom',
    loading: 'Loading the 3D model…', building: 'Building parts…', failed: 'Could not load: ',
    hintT: 'Turn on option T for the trimming turn and the wipe.', hintTrim: 'Trimming turn: the solenoid pushes the lever into the cam groove; between φ 280° and 75° the moving knife swings forward, picks up the needle and bobbin threads, then returns and cuts them.',
    hintWipe: 'Wipe: the needle stops at 80° and the wiper sweeps under it from outside the presser foot, flicking the cut thread end up onto the foot.', hintE: 'Option E: a stepper motor turns the feed regulator through a timing belt; the stitch dial, pull rod, reverse lever and spring are gone and reverse becomes a push-button.',
    hintD: 'Option D adds one process step only — a DLC coating (2–3 µm) on the hook race and point; no part changes shape.',
    code: 'Item no.', kind: 'Source', make: 'Made in-house', buy: 'Bought', buyDwg: 'Bought to our drawing', grp: 'Assembly', mat: 'Material', matNone: 'Not yet specified (mass taken at steel 7.85 g/cm³)',
    mass: 'Mass', qty: 'Quantity', of: 'Part of', dwg: 'Drawing', calc: 'Calculations', inAsm: 'Inside a bought assembly', dlc: 'With D: race and point DLC-coated',
    noDwg: 'Drawing: no detail drawing yet (G5 drew the housing only).', g: 'g', kg: 'kg', hsgNote: 'Upper and lower housing are finish-machined together as item HSG-LS-P.', fps: 'fps' },
};
function ls(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
// 语言：?lang= → 点过的“中文/EN”（和数字工厂同一个设置 wq-factory-lang）→ 按网站：国内站 wenquestech.online 中文，其余英文（同数字工厂）
const siteLang = /(^|\.)wenquestech\.online$/i.test(location.hostname) ? 'zh' : 'en';
let LANG = (q.get('lang') || ls('wq-factory-lang') || siteLang).startsWith('en') ? 'en' : 'zh';
const t = k => TXT[LANG][k] ?? TXT.zh[k] ?? k;
const $ = id => document.getElementById(id);
function applyLang() {
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.title = t('title');
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t(e.dataset.t); });
  $('lang').textContent = LANG === 'en' ? '中文' : 'English';
  $('play').textContent = play ? t('pause') : t('play');
  if (READY) { refreshState(); if (sel) showCard(sel); }
}
let play = !q.has('shot'), sel = null, READY = false;
applyLang();
$('lang').onclick = () => { LANG = LANG === 'en' ? 'zh' : 'en'; try { localStorage.setItem('wq-factory-lang', LANG); } catch (e) { /* 无痕窗口 */ } applyLang(); };
$('fold').onclick = () => $('panel').classList.toggle('closed');
if (matchMedia('(max-width:640px)').matches) $('panel').classList.add('closed');

// ---------------------------------------------------------------- 数据
$('loadT').textContent = t('loading');
async function fetchBin(url, onp) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ' ' + r.status);
  const n = +r.headers.get('content-length') || 0;
  if (!r.body || !n) return new Uint8Array(await r.arrayBuffer()).buffer;
  const rd = r.body.getReader(), out = new Uint8Array(n);
  let got = 0;
  for (;;) { const { done, value } = await rd.read(); if (done) break; out.set(value, got); got += value.length; onp(got / n); }
  return out.buffer;
}
let D, MB, FB;
try {
  const prog = [0, 0];
  const show = () => { const p = 0.8 * prog[0] + 0.2 * prog[1]; $('loadB').style.width = (100 * p).toFixed(0) + '%'; };
  [D, MB, FB] = await Promise.all([fetch(`${BASE}/machine.json`).then(r => r.json()),
    fetchBin(`${BASE}/mesh.bin`, p => { prog[0] = p; show(); }), fetchBin(`${BASE}/frames.bin`, p => { prog[1] = p; show(); })]);
} catch (e) { $('loadT').textContent = t('failed') + e.message; return; }
$('loadT').textContent = t('building');
await new Promise(r => setTimeout(r, 0));
const NF = D.frames, STEP = D.step_deg;
const FR = new Float32Array(FB);

// ---------------------------------------------------------------- 场景
const canvas = $('c');
const mobile = matchMedia('(pointer:coarse)').matches || Math.min(innerWidth, innerHeight) < 640;
const r = new THREE.WebGLRenderer({ canvas, antialias: !mobile || devicePixelRatio < 2, preserveDrawingBuffer: q.has('shot') });
r.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1.5 : 2));
r.setSize(innerWidth, innerHeight);
r.outputEncoding = THREE.sRGBEncoding; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.82;
const scene = new THREE.Scene();
const darkUI = () => getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() === '#15181b';
scene.background = new THREE.Color(darkUI() ? 0x15181b : 0xdfe3e7);
// 环境光照：一个简单的“房间”（灯板 + 墙）做反射，金属件才有光泽
(function env() {
  const s = new THREE.Scene();
  const room = new THREE.Mesh(new THREE.BoxGeometry(10, 6, 10), new THREE.MeshBasicMaterial({ color: 0x5d6268, side: THREE.BackSide }));
  room.position.y = 2; s.add(room);
  const panel = (w, h, x, y, z, ry, rx, k) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ side: THREE.DoubleSide })); m.material.color.setRGB(k, k, k); m.position.set(x, y, z); m.rotation.set(rx, ry, 0); s.add(m); };
  panel(4, 2, 0, 4.9, 0, 0, Math.PI / 2, 4.5); panel(2, 3, -4.9, 2, 1, Math.PI / 2, 0, 2.5); panel(3, 2, 4.9, 2.5, -1, -Math.PI / 2, 0, 1.6); panel(4, 1.5, 0, 2, -4.9, 0, 0, 1.3);
  scene.environment = new THREE.PMREMGenerator(r).fromScene(s, 0.04).texture;
})();
const key = new THREE.DirectionalLight(0xffffff, 1.3); key.position.set(-0.6, 1.4, 1.0); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.6); rim.position.set(0.8, 0.6, -1.2); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f96, 0.35));
// 机器坐标 mm、z 向上 → three：m、y 向上
const root = new THREE.Group(); root.rotation.x = -Math.PI / 2; root.scale.setScalar(0.001); scene.add(root);

// 材料：剖开时背面画成橙色（看起来像剖面）
const CUT = { value: 0 };
function mk(o) {
  const m = new THREE.MeshStandardMaterial(o);
  m.onBeforeCompile = sh => {
    sh.uniforms.uCut = CUT;
    sh.fragmentShader = 'uniform float uCut;\n' + sh.fragmentShader.replace('#include <dithering_fragment>',
      '#include <dithering_fragment>\n if (uCut > 0.5 && !gl_FrontFacing) gl_FragColor = vec4(0.93, 0.46, 0.16, 1.0);');
  };
  return m;
}
const SHOW = {
  metal: mk({ color: 0xc3c7cc, metalness: 0.85, roughness: 0.32 }), chrome: mk({ color: 0xeef0f2, metalness: 1, roughness: 0.12 }),
  black: mk({ color: 0x2a2d31, metalness: 0.3, roughness: 0.55 }), brass: mk({ color: 0xc9a25a, metalness: 0.9, roughness: 0.3 }),
  steelDark: mk({ color: 0x6d7278, metalness: 0.8, roughness: 0.4 }), copper: mk({ color: 0xc46e3c, metalness: 0.9, roughness: 0.35 }),
  magnet: mk({ color: 0x8f969e, metalness: 0.7, roughness: 0.3 }), glassDisc: mk({ color: 0x9fc4d9, metalness: 0.2, roughness: 0.1 }),
  graphite: mk({ color: 0x3a3f45, metalness: 0.2, roughness: 0.5, envMapIntensity: 0.5 }), blue: mk({ color: 0x2f6fd6, metalness: 0.2, roughness: 0.4 }),

if (q.has('shot')) {                                  // 出图：?shot=<φ> 只渲染一帧
  S.phi = +q.get('shot') || 0; pose(); camApply(); r.render(scene, cam); document.body.classList.add('shot'); document.title = 'done'; return;
}
const fpsEl = $('fps'); if (q.has('fps')) fpsEl.hidden = false;
let tl = performance.now(), acc = 0, nfps = 0, tf = tl;
window.__wq = { S, P, pose, refreshState, view, select, cut, setPhi: v => { S.phi = v; pose(); } }; window.__cam = cam; window.__hit = (x, y) => { const h = hit(x, y); return h && h.object.userData.k; };   // 截图、录屏脚本用
r.setAnimationLoop(now => {
  const dt = Math.max(0, Math.min(0.1, (now - tl) / 1000)); tl = now;
  if (play && mode !== 'wheel') {
    if (S.trim === 'wipe') { S.wipe += dt * speed * 30; if (S.wipe > NF - 1) S.wipe = 0; }
    else S.phi = (S.phi + dt * speed * 120) % 360;
    pose();
  }
  r.render(scene, cam);
  nfps++; if (now - tf > 1000) { fpsEl.textContent = `${Math.round(nfps * 1000 / (now - tf))} ${t('fps')}`; nfps = 0; tf = now; }
});
})();
