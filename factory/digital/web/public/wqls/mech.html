<!doctype html>
<!-- 第 172b 轮第二批 · 互动块 3：机构运动简图动起来（端视，从机头左端看）。
     刺布曲柄滑块（曲柄半径 r、连杆 l：G2 dyn.py）、挑线四连杆（G8.1 新机构，proto.json takeup.new，公式同 takeup-calc.js）、
     梭尖（整机三维每 1° 量出的 hook_y、hook_z）、送布牙齿顶（3 mm 正缝的 dog.s3）；左边三维整机同步转。数据 labs.json mech + proto.json。?lang=en -->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WQ-LS 机构运动简图</title><link rel="stylesheet" href="lab.css"></head>
<body>
<div class="wrap">
 <div class="card"><h1 id="ttl"></h1><p class="sub" id="lead"></p><iframe class="m3d" id="m3d" title="WQ-LS 3D" loading="lazy"></iframe>
  <div class="row"><span class="big" id="phiV">0°</span><button id="play"></button><button id="slow"></button></div>
  <input type="range" id="phi" min="0" max="359" value="0" aria-label="φ"><div class="rd" id="rd"></div></div>
 <div class="card"><div style="display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:8px">
  <svg id="full" viewBox="-45 -45 145 290" aria-label="end view"></svg>
  <div><p class="sub" id="zt" style="margin:0"></p><svg id="zoom" viewBox="-30 170 60 68" aria-label="stitch zone"></svg><div class="lg" id="lg"></div><p class="note" id="note"></p></div></div></div>
</div>
<script src="lab.js"></script><script src="takeup-calc.js"></script>
<script>
(async function () {
'use strict';
const { LANG, S, $, m3d } = WQL;
const TX = {
  zh: { ttl: '机构运动简图', sm: 'Mechanism diagram', lead: '端视（从机头左端看）。上轴一转：曲柄带连杆推针杆上下（曲柄滑块），挑线杆挂在同一个曲柄销上摆（四连杆），旋梭转两圈，送布牙走一个椭圆。右下是针板附近放大 4 倍。',
    play: '转起来', pause: '暂停', slow: '慢放', fast: '常速', full: '整个端视', zoom: '针板附近（× 4）',
    rd: ['针尖高出针板', '挑线杆线眼 E', '梭尖离针（前后）', '送布牙齿顶', '传动角 μ'],
    lg: [['#7d8590', '曲柄、连杆'], ['var(--needle)', '针杆、挑线杆'], ['var(--bobbin)', '摇杆'], ['#2a9d8f', '旋梭、梭尖'], ['#e0a33b', '送布牙'], ['#d2283a', '面线']],
    note: '数据：曲柄 r、连杆 l 取自 G2 dyn.py；挑线四连杆是 G8.1 第三步定的新机构；梭尖、送布牙是整机三维每 1° 量出来的（g81_kin.py）。针杆连接销到针尖 142.5 mm，一转里不变（误差 < 0.001 mm），说明三种数据对得上。' },
  en: { ttl: 'Mechanism diagram', sm: '机构运动简图', lead: 'End view, from the left end of the head. In one turn of the upper shaft the crank and link drive the needle bar (slider-crank), the take-up lever swings on the same crank pin (four-bar), the hook turns twice and the feed dog traces an ellipse. Bottom right: the needle-plate zone, × 4.',
    play: 'Run', pause: 'Pause', slow: 'Slow', fast: 'Normal', full: 'Whole end view', zoom: 'Needle-plate zone (× 4)',
    rd: ['Needle tip above plate', 'Take-up eye E', 'Hook point to needle (fore–aft)', 'Feed-dog tooth top', 'Transmission angle μ'],
    lg: [['#7d8590', 'Crank, link'], ['var(--needle)', 'Needle bar, take-up lever'], ['var(--bobbin)', 'Rocker'], ['#2a9d8f', 'Hook, point'], ['#e0a33b', 'Feed dog'], ['#d2283a', 'Needle thread']],
    note: 'Data: crank r and link l from G2 dyn.py; the take-up four-bar is the new one from G8.1 step 3; hook point and feed dog are measured every 1° on the full 3-D machine (g81_kin.py). The link pin to needle tip stays 142.5 mm over the turn (within 0.001 mm), so the three sources agree.' },
};
const t = k => TX[LANG][k];
const [L, PD] = await Promise.all([WQL.labs(), WQL.proto()]);
const M = L.mech, C = PD.curves, DG = PD.dog.s3, lk = Object.assign({}, PD.takeup.new);
const ZU = 200;                                         // 上轴中心高出针板（tools/wqls/spec.py ZU）
$('zt').textContent = t('zoom'); $('ttl').innerHTML = `${t('ttl')}<small>${t('sm')}</small>`; $('lead').textContent = t('lead'); $('note').textContent = t('note');
$('lg').innerHTML = t('lg').map(([c, n]) => `<span><i style="background:${c}"></i>${n}</span>`).join('');
let phi = 0, play = true, slow = false, w3 = null;
m3d($('m3d'), 'view=face', w => { w3 = w; w3.setPhi(phi); });
const deg = Math.PI / 180;
function geo(f) {
  const q = (f + lk.d) * deg, P = [-M.r * Math.sin(q), -M.r * Math.cos(q)];
  const Bv = P[1] - Math.sqrt(M.l * M.l - P[0] * P[0]);
  const tk = WQTakeup.linkPose(f, lk);
  return { P, B: [0, Bv], tipV: C.tip[f] - ZU, tk, hook: [-C.hook_y[f], C.hook_z[f] + PD_ZH - ZU], dog: [-DG.y[f], DG.z[f] - ZU] };
}
const PD_ZH = -21.5;                                    // 旋梭轴中心高出针板（spec.py ZH）
function draw(svg, f, zoom) {
  const ink = WQL.ink(), g = geo(f), Y = v => -v, sw = zoom ? 0.25 : 1;
  const ln = (a, b, w, c, d) => S('line', { x1: a[0], y1: Y(a[1]), x2: b[0], y2: Y(b[1]), stroke: c || ink, 'stroke-width': w * sw, 'stroke-linecap': 'round', ...(d ? { 'stroke-dasharray': d } : {}) });
  const pt = (q, r, c) => S('circle', { cx: q[0], cy: Y(q[1]), r: r * sw, fill: c || '#fff', stroke: ink, 'stroke-width': 0.5 * sw });
  const tx = (q, s, dx, dy) => S('text', { x: q[0] + (dx || 2) * sw, y: Y(q[1]) + (dy || -2) * sw, 'font-size': 6 * sw, fill: ink }, s);
  let h = '';
  // 针板、布
  h += S('rect', { x: -70, y: Y(-ZU), width: 160, height: 1.6, fill: ink, opacity: 0.35 });
  h += S('rect', { x: -70, y: Y(-ZU + PD.fabric_t.cotton), width: 160, height: PD.fabric_t.cotton, fill: '#e0a33b', opacity: 0.25 });
  // 曲柄滑块
  const tip = [0, g.tipV];
  h += ln([0, g.B[1] + 22], tip, 3.2, 'var(--needle)');                               // 针杆（示意到针尖）
  h += ln([0, g.tipV + 12], tip, 0.9, ink);                                           // 机针
  h += S('circle', { cx: 0, cy: 0, r: M.r * (zoom ? 1 : 1), fill: 'none', stroke: ink, 'stroke-width': 0.4 * sw, 'stroke-dasharray': '1.5 1.5' });
  h += ln([0, 0], g.P, 2.4, '#7d8590') + ln(g.P, g.B, 2, '#7d8590');
  // 挑线
  if (g.tk) {
    const p = g.tk;
    h += S('polygon', { points: [p.P, p.M, p.E].map(q => `${q[0]},${Y(q[1])}`).join(' '), fill: 'rgba(42,95,184,.18)', stroke: 'var(--needle)', 'stroke-width': 1.1 * sw });
    h += ln(p.Q, p.M, 1.8, 'var(--bobbin)');
    h += ln(lk.A, p.E, 0.6, '#d2283a') + ln(p.E, lk.B, 0.6, '#d2283a') + ln(lk.B, [0, g.tipV + 3], 0.5, '#d2283a', '2 1.5');
    h += pt(p.M, 1.3) + pt(p.Q, 1.6, ink) + pt(p.E, 1.3, '#d2283a');
    if (!zoom) h += tx(p.E, 'E') + tx(p.Q, 'Q') + tx(p.M, 'M');
  }
  // 旋梭、梭尖
  const hc = [0, PD_ZH - ZU];
  h += S('circle', { cx: hc[0], cy: Y(hc[1]), r: M.hook_r, fill: 'rgba(42,157,143,.12)', stroke: '#2a9d8f', 'stroke-width': 0.9 * sw });
  h += ln(hc, g.hook, 0.9, '#2a9d8f') + pt(g.hook, 1.6, '#2a9d8f');
  // 送布牙（齿顶轨迹 + 当前位置）
  const tr = DG.y.map((y, i) => `${(-y).toFixed(2)},${Y(DG.z[i] - ZU).toFixed(2)}`).join(' ');
  h += S('polyline', { points: tr, fill: 'none', stroke: '#e0a33b', 'stroke-width': 0.5 * sw, 'stroke-dasharray': `${sw} ${sw}` });
  h += S('path', { d: `M${g.dog[0] - 3},${Y(g.dog[1]) + 3}l1,-3l1,3l1,-3l1,3l1,-3l1,3z`, fill: '#e0a33b', opacity: 0.95 });
  h += pt([0, 0], 1.6, ink) + pt(g.P, 1.4) + pt(g.B, 1.4) + pt(tip, 0.9, 'var(--needle)');
  if (!zoom) h += tx([0, 0], 'O') + tx(g.P, 'P') + tx(g.B, 'B');
  svg.innerHTML = h;
  return g;
}
function setPhi(v) {
  phi = ((Math.round(v) % 360) + 360) % 360;
  const g = draw($('full'), phi, false);
  draw($('zoom'), phi, true);
  $('phiV').textContent = phi + '°'; $('phi').value = phi;
  const r = t('rd');
  $('rd').innerHTML = `<span>${r[0]}</span><b>${C.tip[phi].toFixed(1)} mm</b><span>${r[1]}</span><b>${g.tk ? g.tk.E.map(x => x.toFixed(1)).join(', ') : '—'} mm</b>` +
    `<span>${r[2]}</span><b>${C.hook_y[phi].toFixed(1)} mm</b><span>${r[3]}</span><b>${DG.z[phi].toFixed(2)} mm</b><span>${r[4]}</span><b>${g.tk ? g.tk.mu.toFixed(1) + '°' : '—'}</b>`;
  if (w3) w3.setPhi(phi);
}
// 放大图：同一个 draw，视口只取针板附近（v −170…−238）
setPhi(0);
$('phi').oninput = e => { play = false; $('play').textContent = t('play'); setPhi(+e.target.value); };
$('play').textContent = t('pause'); $('slow').textContent = t('slow');
$('play').onclick = () => { play = !play; $('play').textContent = play ? t('pause') : t('play'); };
$('slow').onclick = () => { slow = !slow; $('slow').textContent = slow ? t('fast') : t('slow'); };
let last = performance.now(), acc = 0;
(function loop(now) { if (play) { acc += (now - last) / 1000 * (slow ? 12 : 60); if (acc >= 1) { setPhi(phi + Math.floor(acc)); acc -= Math.floor(acc); } } last = now; requestAnimationFrame(loop); })(last);
window.__mech = { setPhi };
})();
</script>
</body></html>
