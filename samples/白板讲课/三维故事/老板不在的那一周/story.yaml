shots:
  - id: title
    title: true
    dur: 3.4

  # ① 会议室：老板宣布离开
  - id: s1
    scene: meeting
    chars:
      林总: {pos: [0, -1.85], face: 0, pose: stand, expr: serious}
      周敏: {pos: [-2.0, -0.6], face: '@林总', lookAt: 林总}
      老马: {pos: [2.0, -0.4], face: '@林总', lookAt: 林总, expr: smile}
      小陈: {pos: [1.0, 0.45], face: '@林总', lookAt: 林总}
    cam:
      - {at: 0, pos: [3.2, 2.5, 5.6], look: [0.1, 1.05, -0.9], fov: 44}
      - {at: 0.3, pos: [2.0, 2.0, 3.8], look: [0, 1.2, -1.2], fov: 42}
    beats:
      - {say: 旁白, text: 周一早上九点，一家做机器人芯片的公司，全体开会。,
         cams: [{at: 0.55, insert: true, pos: [-2.0, 1.95, -1.9], pos2: [-2.1, 2.0, -2.15], look: [-2.6, 2.2, -3.47], fov: 34}]}
      - {say: 林总, text: 有件事要跟大家说：我要离开公司一段时间。, do: [{who: 林总, pose: talk}],
         cams: [{at: 0, medium: 林总, ang: 12}, {at: 0.45, close: 林总, ang: 14, dist: 0.85}]}
      - {say: 旁白, text: 会议室一下子安静了。下周，新一代芯片就要发布。,
         do: [{who: 林总, pose: stand, expr: sad}, {who: 周敏, expr: surprised, pose: surprised}, {who: 小陈, expr: shocked}, {who: 老马, expr: worried, pose: cross}],
         cams: [{at: 0, close: 周敏, ang: 22}, {at: 0.24, close: 小陈, ang: -15}, {at: 0.48, close: 老马, ang: -25}, {at: 0.72, insert: true, pos: [-3.1, 1.35, -2.25], pos2: [-3.2, 1.33, -2.45], look: [-3.49, 1.31, -3.47], fov: 34}]}

  # ② 办公室：老马接客户电话
  - id: s2
    scene: office
    chars:
      老马: {pos: [-2.2, -1.6], face: 60, pose: phone, expr: smile}
    cam:
      - {at: 0, pos: [1.8, 1.8, 3.8], look: [-1.0, 1.25, -1.2], fov: 42}
      - {at: 1, pos: [1.2, 1.7, 3.0], look: [-0.5, 1.3, -1.2], fov: 40}
    beats:
      - {say: 客户, style: phone, at: 老马, label: 客户（电话里）, text: 马总，你们老板不在，下周的芯片还能按时交吗？, do: [{who: 老马, walk: {to: [-0.4, -1.2], face: 20}}, {who: 老马, expr: surprised, delay: 1.0}],
         cams: [{at: 0.45, medium: 老马, ang: 35, dist: 1.6}]}
      - {say: 老马, text: 能，一定能！, do: [{who: 老马, expr: nervous}], cam: {close: 老马, ang: 22, dist: 0.8}}
      - {say: 旁白, text: 话说出去了，可他心里一点底也没有。, do: [{who: 老马, pose: stand, expr: worried, delay: 0.2}, {who: 老马, pose: think, delay: 1.2}],
         cams: [{at: 0, close: 老马, ang: 45, dist: 0.8}, {at: 0.55, wide: true}]}

  # ③ 测试室（白天）：机械臂抖动
  - id: s3
    scene: lab
    chars:
      小陈: {pos: [-1.25, -0.9], face: -90, pose: sit_type, expr: neutral, lookAt: [-2.15, -0.9]}
    props:
      arm: {mode: smooth}
      mon: {mode: code}
    cam:
      - {at: 0, pos: [3.4, 2.1, 3.8], look: [0, 1.0, -1.2], fov: 44}
      - {at: 1, pos: [2.0, 1.8, 2.8], look: [-0.3, 1.05, -1.2], fov: 42}
    beats:
      - {say: 旁白, text: 测试室里，新芯片装在机械臂上，正跑最后一轮测试。,
         cams: [{at: 0.32, insert: true, pos: [-1.2, 1.2, -0.45], pos2: [-1.3, 1.12, -0.55], look: [-1.8, 0.76, -0.9], fov: 34}, {at: 0.64, insert: true, pos: [-1.35, 1.2, -0.7], pos2: [-1.5, 1.16, -0.78], look: [-2.11, 1.06, -0.9], fov: 34}]}
      - {say: 小陈, text: 糟了！第三个关节在抖。, do: [{prop: arm, set: {mode: jitter}}, {prop: mon, set: {mode: bad}}, {who: 小陈, pose: stand, expr: shocked, face: 105, lookAt: [1.1, -1.6], pos: [-1.05, -0.85], delay: 0.2}],
         cams: [{at: 0, insert: true, pos: [-0.5, 1.75, 0.4], pos2: [-0.3, 1.7, 0.1], look: [1.1, 1.3, -1.6], fov: 38}, {at: 0.5, close: 小陈, ang: 22}]}

  # ④ 会议室：大家自己拍板
  - id: s4
    scene: meeting
    chars:
      周敏: {pos: [2.7, -2.75], face: 180, pose: write}
      小陈: {pos: [0.4, -0.2], face: '@周敏', lookAt: 周敏, expr: worried}
      老马: {pos: [-1.0, 0.3], face: '@周敏', lookAt: 周敏, expr: worried, pose: cross}
    props:
      wb: {lines: ['谁来定？', '① 查数据：小陈', '② 说实话：老马'], k: 0}
      clock: {time: '10:15'}
    cam:
      - {at: 0, pos: [-1.8, 1.9, 4.2], look: [1.4, 1.3, -2.0], fov: 42}
      - {at: 1, pos: [0.2, 1.8, 3.3], look: [1.6, 1.4, -2.0], fov: 40}
    beats:
      - {say: 小陈, text: 以前这种事，都等林总拍板。, do: [{prop: wb, set: {k: 0.34}}], cams: [{at: 0.3, close: 小陈, ang: 25}]}
      - {say: 周敏, text: 他不在，我们自己定。小陈查数据，老马先跟客户说实话。,
         do: [{who: 周敏, face: '@小陈', pose: talk, lookAt: 小陈, expr: determined}, {prop: wb, set: {k: 1}, delay: 2.0}, {who: 周敏, pose: point, lookAt: 老马, face: '@老马', delay: 2.6}],
         cams: [{at: 0, close: 周敏, ang: 15}, {at: 0.42, insert: true, pos: [1.9, 1.7, -1.6], pos2: [1.95, 1.7, -1.85], look: [2.3, 1.75, -3.48], fov: 38}, {at: 0.72, ots: [老马, 周敏]}]}
      - {say: 老马, text: 说实话？万一客户跑了呢？, do: [{who: 老马, pose: shrug, expr: worried}], cam: {ots: [周敏, 老马]}}
      - {say: 周敏, text: 瞒着，客户才会跑。, do: [{who: 周敏, pose: stand, expr: serious, face: '@老马'}, {who: 老马, pose: stand, expr: thinking, delay: 1.0}],
         cams: [{at: 0, close: 周敏, ang: -15, dist: 0.8}, {at: 0.62, close: 老马, ang: 20}]}

  # ⑤ 测试室（深夜）：找到原因
  - id: s5
    scene: lab
    mood: {night: true, light: [-2.0, 1.0, -1.4]}
    chars:
      小陈: {pos: [-1.25, -0.9], face: -90, pose: sit_type, expr: thinking, lookAt: [-2.15, -0.9]}
      周敏: {pos: [-0.55, -1.5], face: -72, pose: look_screen, expr: thinking, lookAt: [-2.15, -0.9]}
    props:
      arm: {mode: still}
      mon: {mode: bad}
      lamp: {on: true}
      labwin: {night: true}
      lclock: {time: '23:40'}
    cam:
      - {at: 0, pos: [1.6, 1.7, 2.6], look: [-1.3, 1.05, -0.9], fov: 42}
      - {at: 1, pos: [0.6, 1.7, 1.9], look: [-1.4, 1.1, -0.9], fov: 40}
    beats:
      - {say: 旁白, text: 那天深夜，两个人把测试数据一段一段地对。,
         cams: [{at: 0.4, insert: true, pos: [0.0, 2.1, -2.3], pos2: [0.05, 2.15, -2.5], look: [0.2, 2.25, -3.47], fov: 30}, {at: 0.7, two: [小陈, 周敏], dist: 1.8}]}
      - {say: 小陈, text: 找到了！电机的控制参数，还是旧芯片的。, do: [{prop: mon, set: {mode: find}}, {who: 小陈, expr: idea, pose: sit, delay: 0.3}, {who: 周敏, expr: surprised, pose: stand, delay: 0.6}],
         cams: [{at: 0, insert: true, pos: [-1.4, 1.18, -0.78], pos2: [-1.55, 1.14, -0.84], look: [-2.11, 1.06, -0.9], fov: 32}, {at: 0.45, close: 小陈, ang: 60}]}
      - {say: 周敏, text: 换成新参数，再跑一遍。, do: [{who: 周敏, pose: point, lookAt: [1.1, -1.6], face: 85, expr: determined}, {who: 小陈, pose: sit_type, expr: determined, delay: 0.8}, {prop: mon, set: {mode: code}, delay: 0.9}],
         cams: [{at: 0, close: 周敏, ang: -40}, {at: 0.55, insert: true, pos: [-1.2, 1.2, -0.45], pos2: [-1.3, 1.12, -0.55], look: [-1.8, 0.76, -0.9], fov: 34}]}
      - {say: 旁白, text: 这一次，机械臂稳稳地走完了全程。, do: [{prop: arm, set: {mode: smooth, trace: true}}, {prop: mon, set: {mode: ok}}, {who: 小陈, pose: stand, pos: [-1.05, -0.85], face: 60, expr: laugh, delay: 1.2}, {who: 小陈, pose: clap, delay: 1.8}, {who: 周敏, pose: thumbs, expr: proud, face: -60, delay: 1.4}],
         cams: [{at: 0, insert: true, pos: [0.0, 1.7, -0.2], pos2: [0.2, 1.65, -0.4], look: [1.1, 1.3, -1.6], fov: 38}, {at: 0.45, two: [小陈, 周敏], dist: 2.0}]}

  # ⑥ 办公室：见客户
  - id: s6
    scene: office
    chars:
      老马: {pos: [-0.85, -0.2], face: 90, pose: stand, expr: neutral, lookAt: 客户}
      客户: {pos: [0.45, -0.2], face: -90, pose: stand, expr: serious, lookAt: 老马}
    props: {}
    cam:
      - {at: 0, pos: [0.3, 1.6, 3.4], look: [0, 1.3, -0.3], fov: 40}
      - {at: 1, pos: [-0.3, 1.55, 2.8], look: [0.1, 1.35, -0.3], fov: 38}
    beats:
      - {say: 旁白, text: 老马去见了客户，把问题和解决办法，原原本本讲了一遍。, do: [{who: 老马, pose: talk, expr: serious}], cams: [{at: 0.5, ots: [客户, 老马]}]}
      - {say: 客户, text: 你们主动把问题讲清楚，我们反而更放心。, do: [{who: 老马, pose: stand}, {who: 客户, pose: talk, expr: smile}, {who: 老马, expr: surprised, delay: 1.5}], cam: {ots: [老马, 客户], side: -1}}
      - {say: 老马, text: 下周，准时交货！, do: [{who: 老马, walk: {to: [-0.43, -0.2], face: 90}}, {who: 客户, pose: shake, expr: happy}, {who: 老马, pose: shake, expr: laugh, delay: 0.45}],
         cams: [{at: 0, close: 老马, ang: 25}, {at: 0.5, two: [老马, 客户], dist: 1.7}]}

  # ⑦ 厨房：生活例子
  - id: s7
    scene: kitchen
    chars:
      爸爸: {pos: [-1.2, -2.35], face: 180, pose: stir, expr: thinking}
      女儿: {pos: [-2.6, -2.2], face: 180, pose: stand, lookAt: [-3.1, -2.8]}
    cam:
      - {at: 0, pos: [1.6, 1.7, 3.4], look: [-1.2, 1.1, -1.8], fov: 44}
      - {at: 1, pos: [3.8, 1.9, 3.8], look: [0.3, 1.0, -1.0], fov: 44}
    beats:
      - {say: 旁白, text: 其实家里也一样。妈妈出差了，爸爸和女儿照着她写下的菜谱，做了一桌饭。,
         do: [{who: 女儿, walk: {to: [0.4, -0.4], face: 60}, delay: 3.2}, {who: 爸爸, pose: stand, delay: 3.4}, {who: 爸爸, walk: {to: [2.1, -0.3], face: -110}, delay: 3.6}],
