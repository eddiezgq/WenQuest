  爸爸: {voice: 49, look: {fringe: 0.55, height: 1.78, hair: short, hairColor: '#24201c', top: shirt, topColor: '#e3b45c', pants: '#5a6b7c', shoes: '#ffffff', beard: true, skin: '#edc6a2'}}
  女儿: {voice: 45, look: {fringe: 0.5, sex: f, height: 1.22, build: 0.9, hair: pony, hairColor: '#2a221e', top: shirt, topColor: '#f08fa4', short: true, skirt: '#6c8fd1', shoes: '#d64a4a', skin: '#f5d6bb'}}

