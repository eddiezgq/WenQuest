    - {type: chair, x: -1.25, z: -0.9, face: -90}
    - {type: sign, x: -1.0, y: 2.35, z: -3.47, text: 测试室, size: 0.26}
  kitchen:
    - {type: room, w: 8, d: 7, h: 2.8, wall: '#f6ecd9', floor: '#d8b98f', tile: 0.8}
