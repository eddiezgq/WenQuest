  meeting:
    - {type: room, w: 9, d: 7, h: 3, wall: '#f3eee4', floor: '#d9cdb8'}
    - {type: screen, x: -1.1, y: 1.0, z: -3.48, w: 2.2, h: 1.25, chip: true}
    - {type: whiteboard, id: wb, x: 1.6, y: 0.9, z: -3.48, w: 2.2, h: 1.3}
    - {type: window, x: -4.5, y: 0.9, z: -2.8, w: 2.0, h: 1.4, side: true, city: true}
    - {type: table, x: 0, z: -0.9, w: 2.8, d: 1.1, c: '#c9a27a'}
    - {type: chair, x: -0.8, z: -1.75, face: 0}
    - {type: chair, x: 0.8, z: -1.75, face: 0}
    - {type: plant, x: 3.9, z: -3.0}
    - {type: sign, x: -3.6, y: 2.55, z: -3.47, text: '新一代芯片 · 下周发布', size: 0.2, c: '#c2410c'}
  office:
    - {type: room, w: 9, d: 7, h: 3, wall: '#eef2f3', floor: '#c9d3d9'}
    - {type: window, x: -2.6, y: 0.9, z: -3.48, w: 2.4, h: 1.5, city: true}
    - {type: window, x: 0.6, y: 0.9, z: -3.48, w: 2.4, h: 1.5, city: true}
    - {type: table, x: 2.9, z: -2.7, w: 1.6, d: 0.7, c: '#e2e2e2'}
    - {type: monitor, x: 2.9, y: 0.75, z: -2.75, face: 0}
    - {type: chair, x: 2.9, z: -2.0, face: 180}
    - {type: sofa, x: -4.3, z: -1.2, w: 1.0}
    - {type: plant, x: -0.2, z: -3.0}
    - {type: rug, x: -1.5, z: -1.2, w: 3.4, d: 2.6, c: '#d8cfc0'}
    - {type: table, x: -2.6, z: -0.2, w: 0.9, d: 0.9, h: 0.72, c: '#b88a5e'}
  lab:
    - {type: room, w: 9, d: 7, h: 3, wall: '#e9edf0', floor: '#d5d9dc'}
    - {type: shelf, x: -4.0, z: -3.45, w: 1.8, h: 1.9, d: 0.45}
    - {type: cabinet, x: 3.0, y: 0, z: -3.45, w: 1.2, h: 1.1, d: 0.55, drawers: 4}
    - {type: stripe, x: -0.2, z: -2.6, w: 2.6, d: 2.0}
