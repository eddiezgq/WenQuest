# 第 162 轮第 1 步样片：白板三维简画讲故事。原创人物、原创情节；AI 配音（kokoro）。
title: 老板不在的那一周
sub: 一个原创小故事
note: 本片人物、公司、情节均为虚构 · AI 配音
size: [1280, 720]
narrator: 52            # 云扬（旁白）
cast:
  林总: {voice: 49, look: {height: 1.76, build: 1.06, hair: short, hairColor: '#3a3632', fringe: 0.55, top: suit, topColor: '#2f3e55', shirt: '#ffffff', tie: '#a8343a', pants: '#2f3e55', shoes: '#22252a', glasses: true, wrinkles: true}}
  周敏: {voice: 48, look: {sex: f, height: 1.64, hair: bob, hairColor: '#2b2420', top: suit, topColor: '#6b4f7a', shirt: '#f4efe6', pants: '#3b3346', shoes: '#3a2f2f', glasses: true, skin: '#f3d3b6'}}
  小陈: {voice: 50, look: {height: 1.75, build: 0.95, hair: short, hairColor: '#1f1d1b', top: hoodie, topColor: '#3f7d6e', logo: '#f0b14a', pants: '#4a5466', shoes: '#e9e9e9', skin: '#efc9a6'}}
  老马: {voice: 51, look: {height: 1.72, build: 1.15, hair: short, hairColor: '#8b8b8b', fringe: 0.7, top: shirt, topColor: '#9cc0e0', badge: '#ffffff', pants: '#4b4237', belt: true, shoes: '#4a3424', wrinkles: true, skin: '#eac3a0'}}
  客户: {voice: 46, look: {sex: f, height: 1.66, hair: bun, hairColor: '#4a3428', top: suit, topColor: '#b9543f', shirt: '#ffffff', skirt: '#3b3b46', shoes: '#2b2b2b', skin: '#f2d0b2'}}
  爸爸: {voice: 49, look: {height: 1.78, hair: short, hairColor: '#24201c', top: shirt, topColor: '#e3b45c', pants: '#5a6b7c', shoes: '#ffffff', beard: true, skin: '#edc6a2'}}
  女儿: {voice: 45, look: {sex: f, height: 1.22, build: 0.9, hair: pony, hairColor: '#2a221e', top: shirt, topColor: '#f08fa4', short: true, skirt: '#6c8fd1', shoes: '#d64a4a', skin: '#f5d6bb'}}

